name: Verify T5 mixed typed optimizer pass oracle

# Manual/single-workflow-change gate. Never runs heavy Rust builds on a
# schedule or compiler-main polling; this is a focused PR/milestone check.
on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Compiler source branch or SHA
        required: false
        type: string
        default: main
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-t5-typed-pass-interactions.yml'

permissions:
  contents: read

jobs:
  typed-oracle:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout compiler source (exact branch under test)
        uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: ${{ inputs.source_ref || 'b04dea2662417831a3d157da7f99470b7f5a9365' }}
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Limit workspace to public-independent compiler core
        shell: bash
        working-directory: compiler
        run: |
          set -euo pipefail
          git rev-parse HEAD | tee "$RUNNER_TEMP/t5-source-sha"
          test -s crates/opt/tests/typed_native_parity.rs
          python3 - <<'PY'
          from pathlib import Path
          Path("Cargo.toml").write_text("""[workspace]
          resolver = "2"
          members = ["crates/ir", "crates/opt", "crates/backend", "crates/backend-x86"]
          """)
          PY
      - name: Reuse compiler core Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: t5-typed-oracle
      - name: Check typed mixed pass correctness and coverage
        shell: bash
        working-directory: compiler
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=10s 10m \
            cargo test -p compiler-opt --test typed_native_parity -- --nocapture \
            2>&1 | tee "$RUNNER_TEMP/t5-typed-oracle.log"
          grep -F 'test typed_pipeline_semantics_match_independent_reference_across_pass_orders ... ok' \
            "$RUNNER_TEMP/t5-typed-oracle.log"
          grep -E 'T5_TYPED_PIPELINE .*dse=[1-9][0-9]* .*mem2reg=[1-9][0-9]*' \
            "$RUNNER_TEMP/t5-typed-oracle.log"
          grep -F 'test typed_loop_pipeline_preserves_memory_and_backedge_phi_semantics ... ok' \
            "$RUNNER_TEMP/t5-typed-oracle.log"
          grep -F 'test typed_loop_oracle_detects_dropped_backedge_store_and_trap ... ok' \
            "$RUNNER_TEMP/t5-typed-oracle.log"
          grep -E 'T5_TYPED_LOOP .*dse=[1-9][0-9]* .*mem2reg=[1-9][0-9]*' \
            "$RUNNER_TEMP/t5-typed-oracle.log"
          grep -F 'test typed_loop_pass_orders_match_independent_c_in_gas_and_elf ... ok' \
            "$RUNNER_TEMP/t5-typed-oracle.log"
          grep -E 'T5_TYPED_NATIVE functions=24 formats=2 cases_per_function=128 checks=6144 dse=[1-9][0-9]* mem2reg=[1-9][0-9]*' \
            "$RUNNER_TEMP/t5-typed-oracle.log"
          grep -F 'test typed_parallel_pointer_oracle_rejects_swapped_edge_and_lost_store ... ok' \
            "$RUNNER_TEMP/t5-typed-oracle.log"
          grep -F 'test typed_pointer_phi_pressure_matches_independent_c_in_gas_and_elf ... ok' \
            "$RUNNER_TEMP/t5-typed-oracle.log"
          grep -E 'T5_TYPED_ALIAS_NATIVE functions=8 formats=2 cases_per_function=128 checks=2048 dse=[1-9][0-9]* changed_operations=[1-9][0-9]* raw_stack_values=[1-9][0-9]* optimized_stack_values=[1-9][0-9]* preserved_registers=[1-9][0-9]* verdict=GAS_ELF_C_REFERENCE_AND_CALLEE_SAVED' \
            "$RUNNER_TEMP/t5-typed-oracle.log"
          grep -F 'test typed_external_calls_preserve_spills_phi_edges_and_clobbered_volatile_registers ... ok' \
            "$RUNNER_TEMP/t5-typed-oracle.log"
          grep -E 'T5_TYPED_CALL_NATIVE functions=8 formats=2 checks=2048 call_per_function=2 raw_stack_values=[1-9][0-9]* optimized_stack_values=[1-9][0-9]* saved_regs=[1-9][0-9]* dse=[1-9][0-9]* changed_operations=[1-9][0-9]* verdict=GAS_ELF_EXTERNAL_C_CALLS' \
            "$RUNNER_TEMP/t5-typed-oracle.log"
          grep -F 'test typed_mixed_sixteen_call_preserves_pointer_phi_and_full_stack_arguments ... ok' \
            "$RUNNER_TEMP/t5-typed-oracle.log"
          grep -E 'T5_TYPED_MIXED16 functions=8 formats=2 checks=2048 arguments=16 i64_stack=YES ptr_stack_16=YES raw_stack_values=[1-9][0-9]* optimized_stack_values=[1-9][0-9]* dse=[1-9][0-9]* changed_operations=[1-9][0-9]* verdict=GAS_ELF_MIXED_ABI' \
            "$RUNNER_TEMP/t5-typed-oracle.log"
          grep -F 'test typed_indirect_phi_verifier_rejects_invalid_callee_and_signature ... ok' \
            "$RUNNER_TEMP/t5-typed-oracle.log"
          grep -F 'test typed_indirect_callback_phi_mixed_stack_abi_matches_c_in_gas_and_elf ... ok' \
            "$RUNNER_TEMP/t5-typed-oracle.log"
          grep -E 'T5_TYPED_INDIRECT_NATIVE functions=8 formats=2 checks=2048 call_args=10 i64_stack=YES ptr_stack=YES raw_stack_values=[1-9][0-9]* optimized_stack_values=[1-9][0-9]* saved_regs=[1-9][0-9]* dse=[1-9][0-9]* changes=[1-9][0-9]* verdict=GAS_ELF_INDIRECT_C_ABI' \
            "$RUNNER_TEMP/t5-typed-oracle.log"
          grep -F 'test typed_indirect_chain_verifier_rejects_wrong_void_and_wide_signatures ... ok' \
            "$RUNNER_TEMP/t5-typed-oracle.log"
          grep -F 'test typed_indirect_i64_chain_and_void_side_effects_match_independent_native_c ... ok' \
            "$RUNNER_TEMP/t5-typed-oracle.log"
          grep -E 'T5_TYPED_CHAIN_NATIVE functions=8 formats=2 checks=2048 calls_per_function=3 wide_results=2 void_effects=1 raw_stack_values=[1-9][0-9]* optimized_stack_values=[1-9][0-9]* saved_regs=[1-9][0-9]* dse=[1-9][0-9]* changes=[1-9][0-9]* verdict=GAS_ELF_CHAIN_I64_VOID_ABI' \
            "$RUNNER_TEMP/t5-typed-oracle.log"
          grep -F 'test typed_indirect_loop_verifier_rejects_wrong_backedge_and_callee ... ok' \
            "$RUNNER_TEMP/t5-typed-oracle.log"
          grep -F 'test typed_indirect_loop_backedges_calls_and_spills_match_independent_c_native ... ok' \
            "$RUNNER_TEMP/t5-typed-oracle.log"
          grep -E 'T5_TYPED_INDIRECT_LOOP_NATIVE functions=8 formats=2 checks=2048 loop_bounds=0..4 backedge_phis=2 indirect_calls=3 raw_stack_values=[1-9][0-9]* optimized_stack_values=[1-9][0-9]* saved_regs=[1-9][0-9]* dse=[1-9][0-9]* changes=[1-9][0-9]* verdict=GAS_ELF_CYCLIC_INDIRECT_ABI' \
            "$RUNNER_TEMP/t5-typed-oracle.log"
          cargo clippy -p compiler-opt --test typed_native_parity -- -D warnings \
            2>&1 | tee "$RUNNER_TEMP/t5-typed-clippy.log"
          echo "T5 bounded TypeId oracle passed on $(cat "$RUNNER_TEMP/t5-source-sha")" >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve source and relevant test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: t5-typed-oracle-evidence
          path: |
            ${{ runner.temp }}/t5-source-sha
            ${{ runner.temp }}/t5-typed-oracle.log
            ${{ runner.temp }}/t5-typed-clippy.log
          if-no-files-found: ignore
          retention-days: 7
