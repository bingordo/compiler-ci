name: TEMP Alive-lite source Clippy exact-sha acceptance
on:
  push:
    paths:
      - '.github/workflows/alive-clippy-acceptance-20261121.yml'
permissions:
  contents: read
jobs:
  strict:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.CI_KEY }}
      - run: ssh-keyscan github.com >> ~/.ssh/known_hosts
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: f7db5faa41cbb30dd33be8c5539ee04ba3320a7c
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Build Alive-lite test binary and verify strict downstream Clippy
        working-directory: compiler
        run: |
          set -euo pipefail
          cargo test -p compiler-opt --test alive_lite --no-run
          cargo clippy -p compiler-opt --test alive_lite -- -D warnings
          cargo clippy -p compiler-backend-x86 --all-targets --features historical-function-oracle -- -D warnings
          cargo test -p compiler-backend-x86 --lib asm_memory::tests -- --nocapture
