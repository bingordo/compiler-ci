name: Verify PR433 TypeId counted induction
on:
  push:
    branches: [ci/pr433-typeid-induction]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 976c3f2a46acdb9820576bec5a20d67f7b37c952
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Check exact compiler source SHA
        run: test "$(git -C compiler rev-parse HEAD)" = "976c3f2a46acdb9820576bec5a20d67f7b37c952"
      - name: Restrict self-contained compiler core/native workspace
        run: |
          cat > compiler/Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir", "crates/opt", "crates/backend", "crates/backend-x86"]
          EOF
          rm -f compiler/Cargo.lock
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: typeid-induction-pr433
          cache-workspace-crates: 'true'
      - name: Focused TypeId induction and existing loop native tests
        working-directory: compiler
        run: cargo test -p compiler-opt --test typed_induction_native --test induction_native --test typed_licm_native --test typed_core_pipeline --test ir_replay_cli -- --nocapture
      - name: Full isolated IR optimizer backend and x86 regressions
        working-directory: compiler
        run: cargo test -p compiler-ir -p compiler-opt -p compiler-backend -p compiler-backend-x86
      - name: Strict optimizer Clippy all targets
        working-directory: compiler
        run: cargo clippy -p compiler-opt --all-targets -- -D warnings
