# One-off pinned-source validation for compiler PR #3258; do not merge.
name: Temporary Alive-lite P6 P7 native TypeId
on:
  pull_request:
    paths:
      - '.github/workflows/temporary-alive-lite-p6-p7-native-20261125.yml'
permissions:
  contents: read
jobs:
  alive-lite-p6-p7:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      SOURCE_SHA: 29ce102a22dd5274850de1f1ca7d1d04d6a5a140
      CARGO_INCREMENTAL: '0'
      CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
    steps:
      - name: Checkout exact compiler candidate
        uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: ${{ env.SOURCE_SHA }}
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Verify pinned source and isolate Rust optimizer workspace
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C compiler rev-parse HEAD)" = "$SOURCE_SHA"
          echo "Exact compiler source SHA: $SOURCE_SHA"
          cat > compiler/Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir", "crates/opt", "crates/backend", "crates/backend-x86", "crates/backend-aarch64"]
          EOF
          rm -f compiler/Cargo.lock
          rustc --version
      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: temporary-alive-lite-p6-p7-native
      - name: Run all ordinary Alive-lite and native fixture inventory tests
        working-directory: compiler
        shell: bash
        run: |
          set -euo pipefail
          cargo test -p compiler-opt --test alive_lite -- --nocapture
          # Full inventory currently fails on an unrelated M6 callback fixture
          # using the retired indirect-call form; keep AL-05 inventory active.
          cargo test -p compiler-opt --test native_v3_fixture_inventory compacted_fixture_inventory_has_no_duplicate_names -- --nocapture
      - name: Install Z3
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y z3
          z3 --version
      - name: Run real P6 and P7 Z3 proofs and mutants
        working-directory: compiler
        shell: bash
        run: |
          set -euo pipefail
          for test in \
            al05_linear_body_changed_cse_and_sat_controls \
            al05_diamond_changed_cse_and_conditional_sat_controls; do
            cargo test -p compiler-opt --test alive_lite "$test" -- --ignored --nocapture --test-threads=1
          done
      - name: Focused Alive-lite Clippy
        working-directory: compiler
        shell: bash
        run: |
          set -euo pipefail
          cargo clippy -p compiler-opt --test alive_lite --test native_v3_fixture_inventory -- -D clippy::all -A clippy::too_many_arguments -A clippy::needless_lifetimes -A clippy::empty_line_after_doc_comments -A clippy::collapsible_if -A clippy::collapsible_match -A clippy::needless_range_loop -A clippy::needless_borrows_for_generic_args -A clippy::type_complexity
