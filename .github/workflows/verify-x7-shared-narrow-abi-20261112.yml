name: X7 shared-machine narrow GP ABI C11 parity
on:
  pull_request:
    branches: [main]
    paths: [.github/workflows/verify-x7-shared-narrow-abi-20261112.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  narrow-abi-oracle:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout pinned compiler narrow ABI candidate
        uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: d2786a04158063c7d1cda4010627999fb4d8a78c
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Prepare x86 only workspace and assert exact commit
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = d2786a04158063c7d1cda4010627999fb4d8a78c
          python3 - <<'PY'
          from pathlib import Path
          Path("Cargo.toml").write_text("""[workspace]
          resolver = "2"
          members = ["crates/ir", "crates/opt", "crates/backend", "crates/backend-x86"]
          """)
          PY
      - name: Run GCC narrow register, seventh-stack and constant ELF/GAS executable parity
        run: |
          set -euo pipefail
          cargo test -p compiler-backend-x86 --test x7_shared_machine_native_parity --offline -- --nocapture
          cargo test -p compiler-backend-x86 --features x7-shared-machine-cutover --test x7_shared_machine_native_parity --offline -- --nocapture
          cargo test -p compiler-backend-x86 --no-default-features --features x7-shared-machine-cutover --test x7_shared_machine_native_parity --offline -- --nocapture
          cargo test -p compiler-backend-x86 --all-features --lib --offline
          echo X7_SHARED_NARROW_GP_ABI_C11_GREEN
