name: Direct EDG to compiler SSA native ELF (pilot)

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/edg-direct-ssa-pilot.yml
  pull_request:
    paths:
      - .github/workflows/edg-direct-ssa-pilot.yml
  schedule:
    - cron: '37 7 * * *'
  workflow_dispatch:
    inputs:
      source_ref:
        type: string
        description: Exact compiler commit or branch
        default: main
        required: false

permissions:
  contents: read

concurrency:
  group: edg-native-ssa-${{ github.event.pull_request.number || inputs.source_ref || github.ref }}
  cancel-in-progress: true

jobs:
  direct-edg:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: ghcr.io/edgcpp/ci-runner@sha256:14b3948c2ce12cfa5472e5a6c468393d15426f3a67685cc35d830ea5db2acdf8
    defaults:
      run:
        shell: edg-container-exec "bash -eo pipefail {0}"
    env:
      EDG_SOURCE_SHA: 799603e0b5ab272d9418e2d44a53a95bc73dfdc4
      EDG_RELEASE_TAG: edgcpfe-ci-799603e0b5ab
      EDG_RELEASE_SHA256: fa769825e70766fbefe017806816b2338acd03daa93bb5562369c293972ce64c
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      RUST_TOOLCHAIN_VERSION: 1.99.1
    steps:
      - name: Checkout private compiler pilot with scoped CI key
        uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: ${{ inputs.source_ref || 'cf8829e4d38039ea0a1c816410742cd8deb50775' }}
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false

      - name: Check out exact EDG headers and configuration
        uses: actions/checkout@v7
        with:
          repository: bingundu/edgcpp
          ref: 799603e0b5ab272d9418e2d44a53a95bc73dfdc4
          path: edgcpp
          persist-credentials: false

      - name: Record compiler and EDG source revision
        run: |
          test "$(git -C edgcpp rev-parse HEAD)" = "$EDG_SOURCE_SHA"
          git -C compiler rev-parse HEAD | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Configure matching EDG native metadata only
        env:
          EDG_BASE: ${{ github.workspace }}/edgcpp/bases/docker/dev-env/gcc
        working-directory: edgcpp
        run: |
          cmake --preset linux-gcc-release \
            -DEDG_BUILD_LIB=OFF \
            -DEDG_BUILD_CALLABLE_LIBRARY=ON \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
          cmake --build build/gcc-release --target error-info --parallel 2

      - name: Restore exact EDG prebuilt native archive
        working-directory: edgcpp
        run: |
          set -euo pipefail
          url="https://github.com/bingundu/edgcpp/releases/download/$EDG_RELEASE_TAG/edgcpfe-ci-x86_64-callable-release-linux-x86_64.tar.gz"
          mkdir -p build/gcc-release/lib build/prebuilt-edg
          curl --fail --location --silent --show-error --retry 4 --retry-delay 2 \
            "$url" --output build/prebuilt-edg/archive.tar.gz
          printf '%s  %s\n' "$EDG_RELEASE_SHA256" build/prebuilt-edg/archive.tar.gz | sha256sum --check --status
          tar -xzf build/prebuilt-edg/archive.tar.gz -C build/prebuilt-edg
          grep -Fx "commit=$EDG_SOURCE_SHA" build/prebuilt-edg/BUILD-INFO.txt
          grep -Fx 'platform=linux-x86_64' build/prebuilt-edg/BUILD-INFO.txt
          test -s build/prebuilt-edg/lib/libedgcpfe.a
          cp build/prebuilt-edg/lib/libedgcpfe.a build/gcc-release/lib/libedgcpfe.a

      - name: Check out C++0 EDG linker-symbol export candidate
        uses: actions/checkout@v4
        with:
          repository: bingordo/edgcpp-rust
          ref: cranelift-codegen
          path: edg-rust
          persist-credentials: false

      - name: Install pinned Rust toolchain
        run: |
          if ! command -v cargo >/dev/null; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | \
              sh -s -- -y --profile minimal --default-toolchain "$RUST_TOOLCHAIN_VERSION"
          fi
          export PATH="$HOME/.cargo/bin:$PATH"
          rustup toolchain install "$RUST_TOOLCHAIN_VERSION" --profile minimal
          rustup default "$RUST_TOOLCHAIN_VERSION"

      - name: Build direct EDG to compiler-ir and x86 backend adapter
        working-directory: compiler
        env:
          EDGCPP_SOURCE_DIR: ${{ github.workspace }}/edgcpp
          EDGCPP_COMPILE_COMMANDS: ${{ github.workspace }}/edgcpp/build/gcc-release/compile_commands.json
          EDGCPP_LIB_DIR: ${{ github.workspace }}/edgcpp/build/gcc-release/lib
          EDGCPP_EDG_REVISION: ${{ env.EDG_SOURCE_SHA }}
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          cargo test --manifest-path tools/edg-driver/Cargo.toml
          cargo build --manifest-path tools/edg-driver/Cargo.toml

      - name: Native direct compiler IR x86 ELF versus GCC differential
        working-directory: compiler
        run: |
          set -euo pipefail
          cp tools/edg-driver/tests/fixtures/edg_native_ir*.c ../edgcpp/build/gcc-release/
          (
            cd ../edgcpp/build/gcc-release
            source environment.sh
            binary="../../../compiler/tools/edg-driver/target/debug/compiler-edg-driver"
            if ! "$binary" native_edg.o --c11 edg_native_ir_pilot.c >native_edg.log 2>&1; then
              cat native_edg.log
              exit 1
            fi
            test "$(od -An -tx1 -N4 native_edg.o | tr -d ' \n')" = 7f454c46
            nm -g --defined-only native_edg.o | grep -q edg_native_sum
            nm -g --defined-only native_edg.o | grep -q edg_native_u64
            gcc -std=c11 -O2 -Wall -Wextra -Werror edg_native_ir_pilot.c edg_native_ir_pilot_driver.c -o gcc_edg_native_ir
            gcc -std=c11 -O2 -Wall -Wextra -Werror native_edg.o edg_native_ir_pilot_driver.c -o compiler_edg_native_ir
            ./gcc_edg_native_ir
            ./compiler_edg_native_ir
            # Source-checked C integer automatic locals are supported by D1.
            for source in edg_native_ir_bad_global.c edg_native_ir_bad_fp.c; do
              rm -f bad_native_edg.o bad_native_edg.log
              if "$binary" bad_native_edg.o --c11 "$source" >bad_native_edg.log 2>&1; then
                echo "Unsupported EDG/compiler-ir source unexpectedly compiled: $source"
                exit 1
              fi
              grep -E 'compiler-ir|native pilot|unsupported|EDG|C operation|C expression|C return|source' bad_native_edg.log
              test ! -e bad_native_edg.o
            done
          )

      - name: Native EDG automatic INTEGER SSA local GCC differential
        working-directory: compiler
        run: |
          set -euo pipefail
          cp tools/edg-driver/tests/fixtures/edg_native_locals*.c ../edgcpp/build/gcc-release/
          (
            cd ../edgcpp/build/gcc-release
            source environment.sh
            binary="../../../compiler/tools/edg-driver/target/debug/compiler-edg-driver"
            if ! "$binary" native_integer_locals.o --c11 edg_native_locals.c >native_locals.log 2>&1; then
              cat native_locals.log
              exit 1
            fi
            nm -g --defined-only native_integer_locals.o | grep -q edg_locals_reassign
            nm -g --defined-only native_integer_locals.o | grep -q edg_locals_u64
            gcc -std=c11 -O2 -Wall -Wextra -Werror edg_native_locals.c edg_native_locals_driver.c -o gcc_edg_locals
            gcc -std=c11 -O2 -Wall -Wextra -Werror native_integer_locals.o edg_native_locals_driver.c -o compiler_edg_locals
            ./gcc_edg_locals
            ./compiler_edg_locals
            for source in edg_native_locals_bad_uninit.c edg_native_locals_bad_self_init.c edg_native_locals_bad_volatile.c edg_native_locals_bad_pointer.c; do
              rm -f bad_native_locals.o bad_native_locals.log
              if "$binary" bad_native_locals.o --c11 "$source" >bad_native_locals.log 2>&1; then
                echo "Unsupported native EDG INTEGER automatic unexpectedly compiled: $source"
                exit 1
              fi
              grep -E 'compiler-ir|INTEGER|automatic|unsupported|EDG|source|local|initializ|type|statement|declaration|C operation' bad_native_locals.log
              test ! -e bad_native_locals.o
            done
          )

      - name: EDG native if/while CFG SSA join and loop phi GCC differential
        working-directory: compiler
        run: |
          set -euo pipefail
          cp tools/edg-driver/tests/fixtures/edg_native_cfg*.c ../edgcpp/build/gcc-release/
          (
            cd ../edgcpp/build/gcc-release
            source environment.sh
            binary="../../../compiler/tools/edg-driver/target/debug/compiler-edg-driver"
            if ! "$binary" edg_cfg_native.o --c11 edg_native_cfg.c >edg_cfg_native.log 2>&1; then
              cat edg_cfg_native.log
              exit 1
            fi
            test "$(od -An -tx1 -N4 edg_cfg_native.o | tr -d ' \n')" = 7f454c46
            nm -g --defined-only edg_cfg_native.o | grep -q edg_cfg_while
            nm -g --defined-only edg_cfg_native.o | grep -q edg_cfg_formal_phi
            gcc -std=c11 -O2 -Wall -Wextra -Werror edg_native_cfg.c edg_native_cfg_driver.c -o gcc_edg_cfg
            gcc -std=c11 -O2 -Wall -Wextra -Werror edg_cfg_native.o edg_native_cfg_driver.c -o compiler_edg_cfg
            ./gcc_edg_cfg
            ./compiler_edg_cfg
            for source in edg_native_cfg_bad_uninit_if.c edg_native_cfg_bad_uninit_loop.c edg_native_cfg_bad_shadow_uninit.c edg_native_cfg_bad_condition_effect.c edg_native_cfg_bad_do.c edg_native_cfg_bad_goto.c edg_native_cfg_bad_volatile.c; do
              rm -f bad_edg_cfg.o bad_edg_cfg.log
              if "$binary" bad_edg_cfg.o --c11 "$source" >bad_edg_cfg.log 2>&1; then
                echo "Unsupported source unexpectedly compiled: $source"
                exit 1
              fi
              cat bad_edg_cfg.log
              test ! -e bad_edg_cfg.o
            done
          )

      - name: EDG D3 checked C integer promotions casts and scalar operations versus GCC
        working-directory: compiler
        run: |
          set -euo pipefail
          cp tools/edg-driver/tests/fixtures/edg_native_d3*.c ../edgcpp/build/gcc-release/
          (
            cd ../edgcpp/build/gcc-release
            source environment.sh
            binary="../../../compiler/tools/edg-driver/target/debug/compiler-edg-driver"
            if ! "$binary" edg_d3_native.o --c11 edg_native_d3.c >edg_d3.log 2>&1; then
              cat edg_d3.log
              exit 1
            fi
            test "$(od -An -tx1 -N4 edg_d3_native.o | tr -d ' \n')" = 7f454c46
            nm -g --defined-only edg_d3_native.o | grep -q edg_d3_sext
            nm -g --defined-only edg_d3_native.o | grep -q edg_d3_mixed_add
            nm -g --defined-only edg_d3_native.o | grep -q edg_d3_divu
            gcc -std=c11 -O2 -Wall -Wextra -Werror edg_native_d3.c edg_native_d3_driver.c -o gcc_edg_d3
            gcc -std=c11 -O2 -Wall -Wextra -Werror edg_d3_native.o edg_native_d3_driver.c -o compiler_edg_d3
            ./gcc_edg_d3
            ./compiler_edg_d3
            for source in edg_native_d3_bad_bool.c edg_native_d3_bad_short.c edg_native_d3_bad_float.c edg_native_d3_bad_pointer.c edg_native_d3_bad_effect.c; do
              rm -f bad_edg_d3.o bad_edg_d3.log
              if "$binary" bad_edg_d3.o --c11 "$source" >bad_edg_d3.log 2>&1; then
                echo "Unsupported EDG D3 C semantics unexpectedly compiled: $source"
                exit 1
              fi
              test ! -e bad_edg_d3.o
              cat bad_edg_d3.log
            done
          )

      - name: EDG D3 checked direct integer SysV calls versus GCC
        working-directory: compiler
        run: |
          set -euo pipefail
          cp tools/edg-driver/tests/fixtures/edg_native_d3_calls*.c ../edgcpp/build/gcc-release/
          (
            cd ../edgcpp/build/gcc-release
            source environment.sh
            binary="../../../compiler/tools/edg-driver/target/debug/compiler-edg-driver"
            if ! "$binary" edg_d3_calls_native.o --c11 edg_native_d3_calls.c >edg_d3_calls.log 2>&1; then
              cat edg_d3_calls.log
              exit 1
            fi
            test "$(od -An -tx1 -N4 edg_d3_calls_native.o | tr -d ' \n')" = 7f454c46
            nm -g --defined-only edg_d3_calls_native.o | grep -q edg_d3_call_i32
            nm -g --defined-only edg_d3_calls_native.o | grep -q edg_d3_call_external
            gcc -std=c11 -O2 -Wall -Wextra -Werror edg_native_d3_calls.c edg_native_d3_calls_driver.c -o gcc_edg_d3_calls
            gcc -std=c11 -O2 -Wall -Wextra -Werror edg_d3_calls_native.o edg_native_d3_calls_driver.c -o compiler_edg_d3_calls
            ./gcc_edg_d3_calls
            ./compiler_edg_d3_calls
            for source in edg_native_d3_calls_bad_indirect.c edg_native_d3_calls_bad_void.c edg_native_d3_calls_bad_variadic.c; do
              rm -f bad_edg_d3_calls.o bad_edg_d3_calls.log
              if "$binary" bad_edg_d3_calls.o --c11 "$source" >bad_edg_d3_calls.log 2>&1; then
                echo "Unsupported direct C call unexpectedly compiled: $source"
                exit 1
              fi
              test ! -e bad_edg_d3_calls.o
              cat bad_edg_d3_calls.log
            done
          )

      - name: EDG D3c C ternary and logical expressions as real SSA values
        working-directory: compiler
        run: |
          set -euo pipefail
          cp tools/edg-driver/tests/fixtures/edg_native_d3c*.c ../edgcpp/build/gcc-release/
          (
            cd ../edgcpp/build/gcc-release
            source environment.sh
            binary="../../../compiler/tools/edg-driver/target/debug/compiler-edg-driver"
            if ! "$binary" edg_d3c_values.o --c11 edg_native_d3c_values.c >edg_d3c.log 2>&1; then
              cat edg_d3c.log
              exit 1
            fi
            test "$(od -An -tx1 -N4 edg_d3c_values.o | tr -d ' \n')" = 7f454c46
            nm -g --defined-only edg_d3c_values.o | grep -q edg_d3c_ternary_external
            nm -g --defined-only edg_d3c_values.o | grep -q edg_d3c_ternary_while
            gcc -std=c11 -O2 -Wall -Wextra -Werror edg_native_d3c_values.c edg_native_d3c_values_driver.c -o gcc_d3c
            gcc -std=c11 -O2 -Wall -Wextra -Werror edg_d3c_values.o edg_native_d3c_values_driver.c -o compiler_d3c
            ./gcc_d3c
            ./compiler_d3c
            for source in edg_native_d3c_bad_ternary_assign.c edg_native_d3c_bad_effectful_logical.c edg_native_d3c_bad_pointer.c; do
              rm -f bad_d3c.o bad_d3c.log
              if "$binary" bad_d3c.o --c11 "$source" >bad_d3c.log 2>&1; then
                echo "Source with unmodeled C expression effects unexpectedly compiled: $source"
                exit 1
              fi
              test ! -e bad_d3c.o
              cat bad_d3c.log
            done
          )

      - name: EDG C99 for loops and scalar compound SSA updates vs GCC
        working-directory: compiler
        run: |
          set -euo pipefail
          cp tools/edg-driver/tests/fixtures/edg_native_c99*.c ../edgcpp/build/gcc-release/
          (
            cd ../edgcpp/build/gcc-release
            source environment.sh
            binary="../../../compiler/tools/edg-driver/target/debug/compiler-edg-driver"
            if ! "$binary" edg_c99_loops.o --c11 edg_native_c99_loops.c >edg_c99.log 2>&1; then
              cat edg_c99.log
              exit 1
            fi
            test "$(od -An -tx1 -N4 edg_c99_loops.o | tr -d ' \n')" = 7f454c46
            nm -g --defined-only edg_c99_loops.o | grep -q edg_c99_for_nested
            nm -g --defined-only edg_c99_loops.o | grep -q edg_c99_compound_i64
            gcc -std=c11 -O2 -Wall -Wextra -Werror edg_native_c99_loops.c edg_native_c99_loops_driver.c -o gcc_edg_c99
            gcc -std=c11 -O2 -Wall -Wextra -Werror edg_c99_loops.o edg_native_c99_loops_driver.c -o compiler_edg_c99
            ./gcc_edg_c99
            ./compiler_edg_c99
            for source in edg_native_c99_bad_break.c edg_native_c99_bad_continue.c edg_native_c99_bad_pointer_update.c edg_native_c99_bad_value_update.c edg_native_c99_bad_unbounded_for.c; do
              rm -f bad_edg_c99.o bad_edg_c99.log
              if "$binary" bad_edg_c99.o --c11 "$source" >bad_edg_c99.log 2>&1; then
                echo "Unsupported native C99 control/effect semantics unexpectedly compiled: $source"
                exit 1
              fi
              cat bad_edg_c99.log
              test ! -e bad_edg_c99.o
            done
          )

      - name: EDG C-fast P0 checked integer-pointer native memory GCC differential
        working-directory: compiler
        run: |
          set -euo pipefail
          cp tools/edg-driver/tests/fixtures/edg_native_pointer_memory*.c ../edgcpp/build/gcc-release/
          cp tools/edg-driver/tests/fixtures/edg_native_byte_strings*.c ../edgcpp/build/gcc-release/
          (
            cd ../edgcpp/build/gcc-release
            source environment.sh
            binary="../../../compiler/tools/edg-driver/target/debug/compiler-edg-driver"
            if ! "$binary" edg_ptr_native.o --c11 edg_native_pointer_memory.c >edg_ptr.log 2>&1; then
              cat edg_ptr.log
              exit 1
            fi
            test "$(od -An -tx1 -N4 edg_ptr_native.o | tr -d '[:space:]')" = 7f454c46
            nm -g --defined-only edg_ptr_native.o | grep -q edg_ptr_sum
            nm -g --defined-only edg_ptr_native.o | grep -q edg_ptr_store_index
            gcc -std=c11 -O2 -Wall -Wextra -Werror edg_native_pointer_memory.c edg_native_pointer_memory_driver.c -o gcc_edg_ptr
            gcc -std=c11 -O2 -Wall -Wextra -Werror edg_ptr_native.o edg_native_pointer_memory_driver.c -o compiler_edg_ptr
            ./gcc_edg_ptr
            ./compiler_edg_ptr
            for source in edg_native_pointer_memory_bad_volatile.c edg_native_pointer_memory_bad_local.c edg_native_byte_strings_bad_short.c edg_native_pointer_memory_bad_unsigned_index.c; do
              rm -f bad_edg_ptr.o bad_edg_ptr.log
              if "$binary" bad_edg_ptr.o --c11 "$source" >bad_edg_ptr.log 2>&1; then
                echo "Unsupported native C pointer source unexpectedly compiled: $source"
                exit 1
              fi
              cat bad_edg_ptr.log
              test ! -e bad_edg_ptr.o
            done
          )

      - name: EDG C-fast P0b source byte memory and string kernels vs GCC
        working-directory: compiler
        run: |
          set -euo pipefail
          cp tools/edg-driver/tests/fixtures/edg_native_byte_strings*.c ../edgcpp/build/gcc-release/
          (
            cd ../edgcpp/build/gcc-release
            source environment.sh
            binary="../../../compiler/tools/edg-driver/target/debug/compiler-edg-driver"
            if ! "$binary" edg_byte_native.o --c11 edg_native_byte_strings.c >edg_byte.log 2>&1; then
              cat edg_byte.log
              exit 1
            fi
            test "$(od -An -tx1 -N4 edg_byte_native.o | tr -d '[:space:]')" = 7f454c46
            nm -g --defined-only edg_byte_native.o | grep -q edg_byte_length
            nm -g --defined-only edg_byte_native.o | grep -q edg_byte_copy
            gcc -std=c11 -O2 -Wall -Wextra -Werror edg_native_byte_strings.c edg_native_byte_strings_driver.c -o gcc_edg_byte
            gcc -std=c11 -O2 -Wall -Wextra -Werror edg_byte_native.o edg_native_byte_strings_driver.c -o compiler_edg_byte
            ./gcc_edg_byte
            ./compiler_edg_byte
            for source in edg_native_byte_strings_bad_volatile.c edg_native_byte_strings_bad_const_store.c edg_native_byte_strings_bad_short.c edg_native_byte_strings_bad_unsigned_index.c; do
              rm -f bad_byte_native.o bad_byte.log
              if "$binary" bad_byte_native.o --c11 "$source" >bad_byte.log 2>&1; then
                echo "EDG byte source unexpectedly accepted unsupported code: $source"
                exit 1
              fi
              cat bad_byte.log
              test ! -e bad_byte_native.o
            done
          )
      - name: EDG C-fast P1 source-typed pointer calls and libc puts vs GCC
        working-directory: compiler
        run: |
          set -euo pipefail
          cp tools/edg-driver/tests/fixtures/edg_native_pointer_calls*.c ../edgcpp/build/gcc-release/
          (
            cd ../edgcpp/build/gcc-release
            source environment.sh
            binary="../../../compiler/tools/edg-driver/target/debug/compiler-edg-driver"
            if ! "$binary" edg_ptr_call_native.o --c11 edg_native_pointer_calls.c >edg_ptr_call.log 2>&1; then
              cat edg_ptr_call.log
              exit 1
            fi
            test "$(od -An -tx1 -N4 edg_ptr_call_native.o | tr -d '[:space:]')" = 7f454c46
            nm -g --defined-only edg_ptr_call_native.o | grep -q edg_call_puts
            nm -g --defined-only edg_ptr_call_native.o | grep -q edg_call_checksum
            gcc -std=c11 -O2 -Wall -Wextra -Werror edg_native_pointer_calls.c edg_native_pointer_calls_driver.c -o gcc_edg_ptr_calls
            gcc -std=c11 -O2 -Wall -Wextra -Werror edg_ptr_call_native.o edg_native_pointer_calls_driver.c -o compiler_edg_ptr_calls
            ./gcc_edg_ptr_calls >gcc_pointer_call.out
            ./compiler_edg_ptr_calls >native_pointer_call.out
            test "$(cat gcc_pointer_call.out)" = "$(cat native_pointer_call.out)"
            test "$(cat native_pointer_call.out)" = 'EDG native pointer direct call to libc puts'
            for source in edg_native_pointer_calls_bad_void.c edg_native_pointer_calls_bad_nested.c edg_native_pointer_calls_bad_qualifier.c; do
              rm -f bad_ptr_call_native.o bad_ptr_call.log
              if "$binary" bad_ptr_call_native.o --c11 "$source" >bad_ptr_call.log 2>&1; then
                echo "Unsupported pointer call source unexpectedly compiled: $source"
                exit 1
              fi
              cat bad_ptr_call.log
              test ! -e bad_ptr_call_native.o
            done
          )
      - name: EDG C-fast P2 native local arrays and decay vs original GCC
        working-directory: compiler
        run: |
          set -euo pipefail
          cp tools/edg-driver/tests/fixtures/edg_native_local_arrays*.c ../edgcpp/build/gcc-release/
          (
            cd ../edgcpp/build/gcc-release
            source environment.sh
            binary="../../../compiler/tools/edg-driver/target/debug/compiler-edg-driver"
            if ! "$binary" edg_arrays_native.o --c11 edg_native_local_arrays.c >edg_arrays.log 2>&1; then
              cat edg_arrays.log
              exit 1
            fi
            test "$(od -An -tx1 -N4 edg_arrays_native.o | tr -d '[:space:]')" = 7f454c46
            nm -g --defined-only edg_arrays_native.o | grep -q edg_local_array_external
            nm -g --defined-only edg_arrays_native.o | grep -q edg_local_scope_array
            gcc -std=c11 -O2 -Wall -Wextra -Werror edg_native_local_arrays.c edg_native_local_arrays_driver.c -o gcc_edg_arrays
            gcc -std=c11 -O2 -Wall -Wextra -Werror edg_arrays_native.o edg_native_local_arrays_driver.c -o compiler_edg_arrays
            ./gcc_edg_arrays
            ./compiler_edg_arrays
            for source in edg_native_local_arrays_bad_vla.c edg_native_local_arrays_bad_init.c edg_native_local_arrays_bad_short.c edg_native_local_arrays_bad_ptrlocal.c; do
              rm -f bad_edg_arrays.o bad_edg_arrays.log
              if "$binary" bad_edg_arrays.o --c11 "$source" >bad_edg_arrays.log 2>&1; then
                echo "Unsupported EDG native automatic array source unexpectedly compiled: $source"
                exit 1
              fi
              cat bad_edg_arrays.log
              test ! -e bad_edg_arrays.o
            done
          )
      - name: EDG G7 self-contained native C main, crt link and exact exits
        working-directory: compiler
        run: |
          set -euo pipefail
          cp tools/edg-driver/tests/fixtures/edg_native_c_main*.c ../edgcpp/build/gcc-release/
          (
            cd ../edgcpp/build/gcc-release
            source environment.sh
            binary="../../../compiler/tools/edg-driver/target/debug/compiler-edg-driver"
            for source in edg_native_c_main.c edg_native_c_main_exit.c; do
              object="${source%.c}.o"
              if ! "$binary" "$object" --c11 "$source" >native_main.log 2>&1; then
                cat native_main.log
                exit 1
              fi
              test "$(od -An -tx1 -N4 "$object" | tr -d '[:space:]')" = 7f454c46
              nm -g --defined-only "$object" | grep -q ' main$'
              gcc -std=c11 -O2 -Wall -Wextra -Werror "$source" -o gcc_standalone_main
              gcc -std=c11 -O2 -Wall -Wextra -Werror "$object" -o native_standalone_main
              set +e
              ./gcc_standalone_main
              reference_status="$?"
              ./native_standalone_main
              native_status="$?"
              set -e
              test "$reference_status" = "$native_status"
              if test "$source" = edg_native_c_main.c; then
                test "$native_status" -eq 0
              else
                test "$native_status" -eq 7
              fi
            done
          )
