name: TypeId CLI default integration (compiler PR 736)
on:
  pull_request:
    paths:
      - '.github/workflows/ir-default-cli-736.yml'
permissions:
  contents: read
jobs:
  cli-default:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.CI_KEY }}
      - run: ssh-keyscan github.com >> ~/.ssh/known_hosts
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: e14cb8b85c52ece47d4802c7305e1263eb4c3d2d
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler
          key: ir-default-cli-736
      - name: Verify pinned compiler source
        run: test "$(git -C compiler rev-parse HEAD)" = "e14cb8b85c52ece47d4802c7305e1263eb4c3d2d"
      - name: Warnings-denied compilation
        working-directory: compiler
        run: RUSTFLAGS="-D warnings" cargo check -p compiler --all-targets
      - name: Native TypeId CLI routing integration
        working-directory: compiler
        run: cargo test -p compiler --test ir_default_cli -- --nocapture
      - name: Full driver regression
        working-directory: compiler
        run: cargo test -p compiler -- --test-threads=2
      - name: Strict Clippy
        working-directory: compiler
        run: cargo clippy -p compiler --all-targets -- -D warnings
