# Temporary candidate validation for #545, in compiler-ci rather than compiler.
name: AArch64 required physical tail branch acceptance (#545)
on:
  pull_request:
    paths:
      - '.github/workflows/issue545-a64-musttail-acceptance.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  a64-musttail:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 6add824712daabc31f1dfb2459fa63038f6fdb8a
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Verify exact tested compiler
        run: |
          test "$(git -C compiler rev-parse HEAD)" = '6add824712daabc31f1dfb2459fa63038f6fdb8a'
          echo "Compiler: 6add824712daabc31f1dfb2459fa63038f6fdb8a" >> "$GITHUB_STEP_SUMMARY"
      - uses: dtolnay/rust-toolchain@stable
      - name: Use isolated backend workspace
        run: |
          mkdir -p work/crates
          cp -a compiler/crates/ir compiler/crates/opt compiler/crates/backend \
            compiler/crates/backend-x86 compiler/crates/backend-aarch64 work/crates/
          cp -a compiler/tools compiler/examples compiler/tests work/
          cat > work/Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir", "crates/opt", "crates/backend",
                     "crates/backend-x86", "crates/backend-aarch64"]
          EOF
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: work
          key: issue545-a64-musttail
      - name: Strict new AArch64 target typecheck
        working-directory: work
        run: RUSTFLAGS="-D warnings" cargo check -p compiler-backend-aarch64 --lib --test musttail_native
      - name: Required JUMP26 ELF/GAS native C11 acceptance
        working-directory: work
        run: cargo test -p compiler-backend-aarch64 --test musttail_native -- --nocapture
      - name: Existing optional TCO native runtime
        working-directory: work
        run: cargo test -p compiler-backend-aarch64 --test tail_call_native -- --nocapture
      - name: AArch64 ABI and unwind regressions
        working-directory: work
        run: |
          cargo test -p compiler-backend-aarch64 --test direct_calls -- --nocapture
          cargo test -p compiler-backend-aarch64 --test typeid_abi_calls_native -- --nocapture
          cargo test -p compiler-backend-aarch64 --test unwind_cfi -- --nocapture
      - name: Required target ABI proof
        working-directory: work
        run: cargo test -p compiler-ir --test musttail_verifier -- --nocapture
      - name: Focused AArch64 Clippy correctness
        working-directory: work
        run: |
          cargo clippy -p compiler-backend-aarch64 --lib -- -D clippy::correctness
          cargo clippy -p compiler-backend-aarch64 --test musttail_native -- -D clippy::correctness
