# Temporary exact-source candidate validation; do not merge.
name: Native textual IR DSL candidate
on:
  pull_request:
    paths: ['.github/workflows/temporary-ir-dsl-3474.yml']
permissions:
  contents: read
jobs:
  ir-dsl:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      SOURCE_SHA: 3a55ad5f9f31750706f038774e89ca6a084eb9f8
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: ${{ env.SOURCE_SHA }}
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Verify exact source and isolate native workspace
        run: |
          set -euo pipefail
          test "$(git -C compiler rev-parse HEAD)" = "$SOURCE_SHA"
          echo "Compiler source: $SOURCE_SHA" >> "$GITHUB_STEP_SUMMARY"
          cat > compiler/Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir", "crates/ir-macros", "crates/opt", "crates/backend", "crates/backend-x86", "crates/backend-aarch64"]
          EOF
          rm -f compiler/Cargo.lock
          rustc --version
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: native-ir-dsl
          cache-on-failure: true
      - name: Focused DSL tests
        working-directory: compiler
        run: cargo test -p compiler-ir --test ir_dsl
      - name: Native IR tests
        working-directory: compiler
        run: cargo test -p compiler-ir
      - name: Check affected consumers
        working-directory: compiler
        run: cargo check -p compiler-opt -p compiler-backend -p compiler-backend-x86 -p compiler-backend-aarch64 --all-targets
