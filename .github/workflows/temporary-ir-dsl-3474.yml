# Temporary exact-source DSL candidate validation, reusing the established EDG pilot setup. Do not merge.
name: Native textual IR DSL candidate
on:
  pull_request:
    paths: ['.github/workflows/temporary-ir-dsl-3474.yml']
permissions:
  contents: read
jobs:
  direct-edg:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: ghcr.io/edgcpp/ci-runner@sha256:14b3948c2ce12cfa5472e5a6c468393d15426f3a67685cc35d830ea5db2acdf8
    defaults:
      run:
        shell: edg-container-exec "bash -eo pipefail {0}"
    env:
      EDG_SOURCE_SHA: 799603e0b5ab272d9418e2d44a53a95bc73dfdc4
      EDG_RELEASE_TAG: edgcpfe-ci-799603e0b5ab
      EDG_RELEASE_SHA256: fa769825e70766fbefe017806816b2338acd03daa93bb5562369c293972ce64c
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      RUST_TOOLCHAIN_VERSION: 1.99.1
    steps:
      - name: Checkout exact compiler candidate
        uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 86fce31168d100ad77c61cc4786fc589c479e58a
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false

      - name: Check out exact EDG headers and configuration
        uses: actions/checkout@v7
        with:
          repository: bingundu/edgcpp
          ref: 799603e0b5ab272d9418e2d44a53a95bc73dfdc4
          path: edgcpp
          persist-credentials: false

      - name: Verify exact compiler and EDG revisions
        run: |
          test "$(git -C compiler rev-parse HEAD)" = '86fce31168d100ad77c61cc4786fc589c479e58a'
          test "$(git -C edgcpp rev-parse HEAD)" = "$EDG_SOURCE_SHA"
          echo "Compiler source: $(git -C compiler rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"

      - name: Configure matching EDG native metadata only
        env:
          EDG_BASE: ${{ github.workspace }}/edgcpp/bases/docker/dev-env/gcc
        working-directory: edgcpp
        run: |
          cmake --preset linux-gcc-release \
            -DEDG_BUILD_LIB=OFF \
            -DEDG_BUILD_CALLABLE_LIBRARY=ON \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
          cmake --build build/gcc-release --target error-info --parallel 2

      - name: Restore exact EDG prebuilt native archive
        working-directory: edgcpp
        run: |
          set -euo pipefail
          url="https://github.com/bingundu/edgcpp/releases/download/$EDG_RELEASE_TAG/edgcpfe-ci-x86_64-callable-release-linux-x86_64.tar.gz"
          mkdir -p build/gcc-release/lib build/prebuilt-edg
          curl --fail --location --silent --show-error --retry 4 --retry-delay 2 \
            "$url" --output build/prebuilt-edg/archive.tar.gz
          printf '%s  %s\n' "$EDG_RELEASE_SHA256" build/prebuilt-edg/archive.tar.gz | sha256sum --check --status
          tar -xzf build/prebuilt-edg/archive.tar.gz -C build/prebuilt-edg
          grep -Fx "commit=$EDG_SOURCE_SHA" build/prebuilt-edg/BUILD-INFO.txt
          grep -Fx 'platform=linux-x86_64' build/prebuilt-edg/BUILD-INFO.txt
          test -s build/prebuilt-edg/lib/libedgcpfe.a
          cp build/prebuilt-edg/lib/libedgcpfe.a build/gcc-release/lib/libedgcpfe.a

      - name: Install pinned Rust toolchain
        run: |
          if ! command -v cargo >/dev/null; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | \
              sh -s -- -y --profile minimal --default-toolchain "$RUST_TOOLCHAIN_VERSION"
          fi
          export PATH="$HOME/.cargo/bin:$PATH"
          rustup toolchain install "$RUST_TOOLCHAIN_VERSION" --profile minimal
          rustup default "$RUST_TOOLCHAIN_VERSION"

      - name: Build and test EDG driver
        working-directory: compiler
        env:
          EDGCPP_SOURCE_DIR: ${{ github.workspace }}/edgcpp
          EDGCPP_COMPILE_COMMANDS: ${{ github.workspace }}/edgcpp/build/gcc-release/compile_commands.json
          EDGCPP_LIB_DIR: ${{ github.workspace }}/edgcpp/build/gcc-release/lib
          EDGCPP_EDG_REVISION: ${{ env.EDG_SOURCE_SHA }}
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          cargo test --manifest-path tools/edg-driver/Cargo.toml
          cargo build --manifest-path tools/edg-driver/Cargo.toml

      - name: EDG mixed FP source native GCC parity
        working-directory: compiler
        run: |
          set -euo pipefail
          cp tools/edg-driver/tests/fixtures/*.c ../edgcpp/build/gcc-release/
          (
            cd ../edgcpp/build/gcc-release
            source environment.sh
            binary="../../../compiler/tools/edg-driver/target/debug/compiler-edg-driver"
            gcc_include="$(gcc -print-file-name=include)"
            probe() {
              local source="$1" driver="$2" tag="$3"
              echo "=== TypeId direct native ELF: $tag ==="
              rm -f typeid_matrix.o typeid_matrix_native typeid_matrix_ref
              if ! "$binary" typeid_matrix.o --c11 "-I$gcc_include" -I/usr/include/x86_64-linux-gnu "$source" >typeid_matrix.log 2>&1; then
                cat typeid_matrix.log
                return 1
              fi
              test "$(od -An -tx1 -N4 typeid_matrix.o | tr -d '[:space:]')" = 7f454c46
              if test -n "$driver"; then
                gcc -std=c11 -O2 "$source" "$driver" -o typeid_matrix_ref
                gcc -std=c11 -O2 typeid_matrix.o "$driver" -o typeid_matrix_native
              else
                gcc -std=c11 -O2 "$source" -o typeid_matrix_ref
                gcc -std=c11 -O2 typeid_matrix.o -o typeid_matrix_native
              fi
              set +e
              ./typeid_matrix_ref >typeid_matrix_ref.out 2>typeid_matrix_ref.err
              local refstatus=$?
              ./typeid_matrix_native >typeid_matrix_native.out 2>typeid_matrix_native.err
              local nativestatus=$?
              set -e
              # Minimal pinned EDG runner image lacks diff(1); compare
              # exact output bytes via the already available sha256sum.
              local refout nativeout referr nativeerr
              refout="$(sha256sum typeid_matrix_ref.out)"
              nativeout="$(sha256sum typeid_matrix_native.out)"
              referr="$(sha256sum typeid_matrix_ref.err)"
              nativeerr="$(sha256sum typeid_matrix_native.err)"
              test "${refout%% *}" = "${nativeout%% *}"
              test "${referr%% *}" = "${nativeerr%% *}"
              test "$refstatus" = "$nativestatus"
              echo "PASS $tag (exit=$refstatus)"
            }
            probe edg_native_fp_mixed_scalar.c edg_native_fp_mixed_scalar_driver.c mixed-scalar
            probe edg_native_fp_mixed.c edg_native_fp_mixed_driver.c mixed-fp
            probe edg_native_fp_leaf.c edg_native_fp_leaf_driver.c fp-leaf
            probe edg_native_fp_to_i32.c edg_native_fp_to_i32_driver.c fp-to-int
          )
