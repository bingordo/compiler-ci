# Temporary exact-source candidate validation; do not merge.
name: Native textual IR DSL candidate
on:
  pull_request:
    paths: ['.github/workflows/temporary-ir-dsl-3474.yml']
permissions:
  contents: read
jobs:
  ir-dsl:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      SOURCE_SHA: f61fa99f14c2c0d51ed79e579de86df2fe134599
      BASELINE_SHA: 0c9828f9d685fe72d05f46dc0cb71d4e92a12267
      CARGO_INCREMENTAL: '0'
      CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: ${{ env.SOURCE_SHA }}
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
          fetch-depth: 3
      - name: Verify exact source and isolate native workspace
        run: |
          set -euo pipefail
          test "$(git -C compiler rev-parse HEAD)" = "$SOURCE_SHA"
          echo "Compiler source: $SOURCE_SHA" >> "$GITHUB_STEP_SUMMARY"
          cat > compiler/Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir", "crates/ir-macros", "crates/opt", "crates/backend", "crates/backend-x86", "crates/backend-aarch64"]
          EOF
          rm -f compiler/Cargo.lock
          rustc --version
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            compiler -> target
            compiler/tools/mini-c-driver -> target
          key: native-ir-dsl
          cache-on-failure: true
      - name: Focused DSL tests
        working-directory: compiler
        run: cargo test -p compiler-ir --test ir_dsl
      - name: Native IR tests
        working-directory: compiler
        run: cargo test -p compiler-ir
      - name: Check affected production libraries
        working-directory: compiler
        run: cargo check -p compiler-opt -p compiler-backend -p compiler-backend-x86 -p compiler-backend-aarch64 --lib --keep-going
      - name: Mini-C mixed FP predicate regressions
        run: |
          set -euo pipefail
          git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
          cargo test --manifest-path compiler/tools/mini-c-driver/Cargo.toml --lib fp
          cargo test --manifest-path compiler/tools/mini-c-driver/Cargo.toml --test fp_scalar --test fp_mixed_ssa --test fp_mixed_module --test fp_optimizer_admission --test fp_scalar_globals --test native_float_literals
      - name: Compare broad consumer compilation with exact main baseline
        working-directory: compiler
        run: |
          set -euo pipefail
          # Compare machine-readable compiler diagnostics, not a blanket waiver
          # for a failing candidate. Production libraries and IR tests above
          # must succeed independently.
          args=(-p compiler-opt -p compiler-backend -p compiler-backend-x86 -p compiler-backend-aarch64 --all-targets --keep-going --message-format=json)
          set +e
          cargo check "${args[@]}" > "$RUNNER_TEMP/dsl-candidate.jsonl"
          candidate_status=$?
          set -e
          if [ "$candidate_status" -eq 0 ]; then
            echo "All affected targets compile on the candidate." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          cp Cargo.toml "$RUNNER_TEMP/dsl-workspace.toml"
          git checkout --force --detach "$BASELINE_SHA"
          test "$(git rev-parse HEAD)" = "$BASELINE_SHA"
          # This baseline already contains the merged macro crate.
          cp "$RUNNER_TEMP/dsl-workspace.toml" Cargo.toml
          set +e
          cargo check "${args[@]}" > "$RUNNER_TEMP/dsl-baseline.jsonl"
          baseline_status=$?
          set -e
          python3 - "$candidate_status" "$baseline_status" <<'PY'
          import collections, json, os, pathlib, sys
          root = pathlib.Path(os.environ["RUNNER_TEMP"])
          def diagnostics(name):
              errors = collections.Counter()
              finished = []
              for line in (root / ("dsl-" + name + ".jsonl")).read_text().splitlines():
                  item = json.loads(line)
                  if item.get("reason") == "build-finished":
                      finished.append(item["success"])
                  if item.get("reason") != "compiler-message":
                      continue
                  msg = item["message"]
                  if msg["level"] != "error":
                      continue
                  code = (msg.get("code") or {}).get("code")
                  spans = tuple(sorted({s["file_name"] for s in msg["spans"] if s["is_primary"]}))
                  errors[(item["target"]["name"], code, msg["message"], spans)] += 1
              if finished != [False] or not errors:
                  raise SystemExit(f"{name}: incomplete failed-check evidence")
              return errors
          if int(sys.argv[1]) == 0 or int(sys.argv[2]) == 0:
              raise SystemExit("Candidate failed but baseline did not")
          candidate, baseline = diagnostics("candidate"), diagnostics("baseline")
          new = candidate - baseline
          for label, errors in (("candidate", candidate), ("baseline", baseline), ("new", new)):
              print(label, errors)
          if new:
              raise SystemExit("New candidate consumer errors")
          # Permit only the previously reproduced stale X7 matcher test
          # compilation failures; never waive new candidate diagnostics.
          allowed = {
              ("crates/backend-x86/src/dag_match_tests.rs", "E0277"),
              ("crates/backend-x86/src/dag_match_tests.rs", "E0061"),
              ("crates/backend-x86/src/../tests/unit/x7_ip10_decision_receipts.rs", "E0277"),
              ("crates/backend-x86/src/../tests/unit/x7_ip10_decision_receipts.rs", "E0061"),
              ("crates/backend-x86/src/../tests/unit/x7_production_ctz_address.rs", "E0425"),
              ("crates/backend-x86/src/../tests/unit/x7_production_ctz_address.rs", "E0614"),
          }
          for target, code, message, spans in candidate:
              if target != "compiler_backend_x86" or not spans or not all((span, code) in allowed for span in spans):
                  raise SystemExit(f"Unapproved baseline failure: {target}: {message}")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
              summary.write("Broad consumer check: pre-existing main errors reproduced; no new candidate errors.\n")
              for target, code, message, spans in sorted(candidate):
                  summary.write(f"- {target}: {code} {message}\n")
          PY
