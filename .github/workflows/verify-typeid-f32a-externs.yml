name: F3.2a checked TypeId source external prototype acceptance
on:
  pull_request:
    paths:
      - '.github/workflows/verify-typeid-f32a-externs.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-externals:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
      CARGO_INCREMENTAL: '0'
    steps:
      - name: Checkout immutable compiler candidate
        uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 8582a47bbe2f168b091f30c1f3a2e21c4240d3a3
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Verify exact compiler source
        working-directory: compiler
        run: test "$(git rev-parse HEAD)" = "8582a47bbe2f168b091f30c1f3a2e21c4240d3a3"
      - name: Resolve pinned public frontend dependencies
        run: git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: f32a-source-typeid
      - name: F3.2a checked external prototypes and negative ABI tests
        working-directory: compiler
        run: cargo test -p compiler-ir --test native_source_bridge -- --nocapture
      - name: Existing real Mini-C and Oberon TypeId path
        working-directory: compiler
        run: cargo test -p compiler --bin compiler typeid_native_source -- --nocapture
      - name: AArch64 shared TypeId API compatibility
        working-directory: compiler
        run: cargo check -p compiler-backend-aarch64 --all-targets
      - name: Strict core, x86 and driver Clippy
        working-directory: compiler
        run: cargo clippy -p compiler -p compiler-ir -p compiler-backend-x86 --all-targets -- -D warnings
      - name: Strict AArch64 production Clippy
        working-directory: compiler
        run: cargo clippy -p compiler-backend-aarch64 --lib -- -D warnings
      - name: Full IR, optimizer and backend regressions
        working-directory: compiler
        run: cargo test -p compiler-ir -p compiler-opt -p compiler-backend -p compiler-backend-x86
