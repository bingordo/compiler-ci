name: Validate declarative native-int Boolean-factor PR2683
on:
  pull_request:
    paths:
      - '.github/workflows/native-int-boolean-factor-pr2683.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  boolean-factor:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      CARGO_INCREMENTAL: '0'
      SOURCE_SHA: 28085f467f294b1310d2f1f37791243f8802b1fe
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 28085f467f294b1310d2f1f37791243f8802b1fe
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Verify pinned source and isolate optimizer
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C compiler rev-parse HEAD)" = "$SOURCE_SHA"
          cat > compiler/Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir", "crates/opt", "crates/backend", "crates/backend-x86"]
          EOF
          rm -f compiler/Cargo.lock
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: native-int-seeded-generator
      - name: Run all S23.14 generated cases and graph golden assertions
        working-directory: compiler
        shell: bash
        run: |
          set -euo pipefail
          cargo test -p compiler-opt --test generated_native_matchpd_boolean_factor_s2314 -- --nocapture
      - name: Focused strict Clippy with existing unrelated production lint exemptions
        working-directory: compiler
        run: cargo clippy -p compiler-opt --test generated_native_matchpd_boolean_factor_s2314 -- -D warnings -A dead-code -A clippy::empty-line-after-doc-comments -A unused-imports -A clippy::too-many-arguments
