name: FZ-3 persistent fingerprint triage verification
on:
  push:
    branches: [ci/fz3-native-pass-trends-20261114]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  triage:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          path: ci
      - name: Checkout initialized durable history
        uses: actions/checkout@v4
        with:
          repository: bingordo/compiler-ci
          ref: fz3-native-fingerprint-history
          path: persistent-history
          persist-credentials: false
      - name: Validate history schema and pure Python triage regression
        shell: bash
        run: |
          set -euo pipefail
          test -s persistent-history/state/fz3/fingerprints.tsv
          test -s persistent-history/state/fz3/processed_runs.tsv
          test -s persistent-history/state/fz3/rechecks.tsv
          test -s persistent-history/state/fz3/pass_runs.tsv
          test -s persistent-history/state/fz3/pass_totals.tsv
          grep -q '^id' persistent-history/state/fz3/fingerprints.tsv
          grep -q '^run_token' persistent-history/state/fz3/processed_runs.tsv
          python3 -m py_compile ci/tools/fz3_triage.py ci/tools/fz3_recheck.py ci/tools/fz3_pass_trends.py ci/tests/test_fz3_triage.py ci/tests/test_fz3_recheck.py ci/tests/test_fz3_pass_trends.py
          python3 -m unittest discover -s ci/tests -p 'test_fz3_*.py' -v
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: main
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Isolate dependency-free compiler core
        run: |
          cat > compiler/Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir", "crates/opt", "crates/backend", "crates/backend-x86"]
          EOF
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: fz3-triage-live-input
      - name: Reconcile actual native report with the durable ledger twice
        working-directory: compiler
        shell: bash
        run: |
          set -euo pipefail
          source_sha="$(git rev-parse HEAD)"
          report="$RUNNER_TEMP/fz3-history-real-report"
          cp -R ../persistent-history/state/fz3 "$RUNNER_TEMP/history"
          cargo run -p compiler-opt --example typeid_native_campaign -- \
            --out "$report" --source-sha "$source_sha" \
            --first-seed 0 --seeds 1 --max-evaluations 8 \
            --max-unique 2 --max-probes 12
          python3 ../ci/tools/fz3_triage.py \
            --campaign "$report" --history-dir "$RUNNER_TEMP/history" \
            --out "$RUNNER_TEMP/triage" --source-sha "$source_sha" \
            --run-token 123456.1 \
            --run-url https://github.com/bingordo/compiler-ci/actions/runs/123456
          grep -q '^new=0$' "$RUNNER_TEMP/triage/status.txt"
          grep -q '^processed=1$' "$RUNNER_TEMP/triage/status.txt"
          python3 ../ci/tools/fz3_triage.py \
            --campaign "$report" --history-dir "$RUNNER_TEMP/history" \
            --out "$RUNNER_TEMP/triage" --source-sha "$source_sha" \
            --run-token 123456.1 \
            --run-url https://github.com/bingordo/compiler-ci/actions/runs/123456
          grep -q '^replayed=1$' "$RUNNER_TEMP/triage/status.txt"
          cargo build -p compiler-opt --example typeid_native_diff_repro
          python3 ../ci/tools/fz3_recheck.py \
            --campaign "$report" --triage-dir "$RUNNER_TEMP/triage" \
            --history-dir "$RUNNER_TEMP/history" \
            --out "$RUNNER_TEMP/recheck" \
            --oracle ./target/debug/examples/typeid_native_diff_repro \
            --source-sha "$source_sha" --run-token 123456.1 \
            --run-url https://github.com/bingordo/compiler-ci/actions/runs/123456 \
            --limit 16 --timeout 20
          test -s "$RUNNER_TEMP/history/rechecks.tsv"
          test -s "$RUNNER_TEMP/recheck/lifecycle.md"
          python3 ../ci/tools/fz3_pass_trends.py \
            --campaign "$report" --history-dir "$RUNNER_TEMP/history" \
            --out "$RUNNER_TEMP/pass-trend" \
            --source-sha "$source_sha" --run-token 123456.1 \
            --run-url https://github.com/bingordo/compiler-ci/actions/runs/123456
          test "$(wc -l < "$RUNNER_TEMP/history/pass_runs.tsv")" -eq 133
          python3 ../ci/tools/fz3_pass_trends.py \
            --campaign "$report" --history-dir "$RUNNER_TEMP/history" \
            --out "$RUNNER_TEMP/pass-trend" \
            --source-sha "$source_sha" --run-token 123456.1 \
            --run-url https://github.com/bingordo/compiler-ci/actions/runs/123456
          test "$(wc -l < "$RUNNER_TEMP/history/pass_runs.tsv")" -eq 133
          test -s "$RUNNER_TEMP/pass-trend/pass_trend.md"
      - name: Upload validated history evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fz3-cross-run-triage-validation
          path: |
            ${{ runner.temp }}/history/
            ${{ runner.temp }}/triage/
            ${{ runner.temp }}/recheck/
            ${{ runner.temp }}/pass-trend/
          if-no-files-found: warn
          retention-days: 7
