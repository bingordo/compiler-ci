name: LTO TypeId remap verification
on:
  push:
    branches: [verify/lto-type-remap-20261114]
    paths: ['.github/workflows/lto-type-remap-20261114.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ir-remap:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 4fd189ee682757cfe4ca3a85d299c765b62f1b6f
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Verify exact compiler source
        run: test "$(git -C compiler rev-parse HEAD)" = "4fd189ee682757cfe4ca3a85d299c765b62f1b6f"
      - name: Focus IR workspace
        run: |
          cat > compiler/Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir"]
          EOF
          rm -f compiler/Cargo.lock
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: lto-type-remap
      - name: Test remapping, IR suite and strict lint
        working-directory: compiler
        run: |
          cargo test -p compiler-ir --test lto_type_remap
          cargo test -p compiler-ir
          cargo clippy -p compiler-ir --tests -- -D warnings
