name: Source-pinned nested same-target pointer/scalar TypeId PHI review 689
on:
  push:
    branches: [review/nested-same-successor-689]
    paths: ['.github/workflows/review-nested-same-successor-689.yml']
  pull_request:
    paths: ['.github/workflows/review-nested-same-successor-689.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 36
    steps:
      - name: Checkout temporary CI
        uses: actions/checkout@v4
      - name: Checkout exact reviewed compiler source
        uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 7e23dc36b518b119af9639d6fc51976cdb7f3f6a
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Verify exact source pin
        working-directory: compiler
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "7e23dc36b518b119af9639d6fc51976cdb7f3f6a"
      - name: Use core workspace on CI runner only
        working-directory: compiler
        run: |
          python3 - <<'PY'
          from pathlib import Path
          Path('Cargo.toml').write_text("""[workspace]
          resolver = "2"
          members = ["crates/ir", "crates/opt", "crates/backend", "crates/backend-x86", "crates/backend-aarch64"]
          """)
          PY
      - name: Cache core compiler Rust crates
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: review-nested-same-successor-689
      - name: New nested same-successor mixed PHI and returning callback native C11 oracle
        working-directory: compiler
        run: cargo test -p compiler-opt --test review_nested_same_successor_phi -- --nocapture
      - name: Existing critical-edge PHI and register pressure checks
        working-directory: compiler
        run: |
          set -euo pipefail
          cargo test -p compiler-opt --test review_mixed_phi_critical_call -- --nocapture
          cargo test -p compiler-opt --test review_phi_call_pressure -- --nocapture
          cargo test -p compiler-opt --test review_loop_byte_phi_callback -- --nocapture
      - name: Existing TypeId memory loop, phi and source optimizer regression
        working-directory: compiler
        run: |
          set -euo pipefail
          cargo test -p compiler-opt --test memory_execution_oracle -- --nocapture
          cargo test -p compiler-opt --test phi_native -- --nocapture
          cargo test -p compiler-backend-x86 --test bt4_x86_historical_arity_phi_native -- --nocapture
      - name: Strict affected libraries and new TypeId test Clippy
        working-directory: compiler
        run: |
          set -euo pipefail
          cargo clippy -p compiler-ir -p compiler-opt -p compiler-backend -p compiler-backend-x86 --lib -- -D warnings
          cargo clippy -p compiler-opt --test review_nested_same_successor_phi -- -D warnings
