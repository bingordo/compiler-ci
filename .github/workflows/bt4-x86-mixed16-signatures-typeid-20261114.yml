name: BT4 x86 native TypeId original 16 GP call and strict module signatures
on:
  push:
    branches: [ci/bt4-x86-mixed16-signatures-typeid-20261114]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-sysv-and-module-abi:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 9c5435ecccda08d9dacdda5799aeea800c7268fa
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Pin source and isolate backend workspace from private frontends
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 9c5435ecccda08d9dacdda5799aeea800c7268fa
          python3 - <<'PY'
          from pathlib import Path
          Path("Cargo.toml").write_text("""[workspace]
          resolver = "2"
          members = ["crates/ir","crates/backend","crates/opt","crates/backend-x86"]
          """)
          PY
      - name: Prohibit historical x86 Backend(Function) calls in migrated originals
        run: |
          set -euo pipefail
          if grep -nE '(compiler_backend::Backend|machine::select\(|compiler_ir::Function|\bFunction \{)' crates/backend-x86/tests/mixed_sixteen_call_native.rs crates/backend-x86/tests/module_signatures.rs; then
            echo "BT4 x86 mixed ABI still depends on old Function backend"; exit 1
          fi
      - name: Execute original 16 GP mixed-width high-bit pointer C11 and strict ABI source checks
        run: |
          set -euo pipefail
          cargo check -p compiler-backend-x86 --all-targets
          cargo test -p compiler-backend-x86 --test mixed_sixteen_call_native -- --nocapture
          cargo test -p compiler-backend-x86 --test module_signatures -- --nocapture
          cargo clippy -p compiler-backend-x86 --all-targets -- -D warnings
          echo BT4_X86_MIXED16_TYPEID_ORIGINAL_C11_AND_ABI_STRICT_CLIPPY_PASS
      - name: Check original ABI unchanged without X7 optional memory matcher
        run: |
          set -euo pipefail
          cargo test -p compiler-backend-x86 --no-default-features --test mixed_sixteen_call_native -- --nocapture
          cargo test -p compiler-backend-x86 --no-default-features --test module_signatures -- --nocapture
          echo BT4_X86_MIXED16_TYPEID_NO_DEFAULT_FEATURES_PASS
