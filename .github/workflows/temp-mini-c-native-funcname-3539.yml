name: Temporary native Mini-C function names 3539
on:
  pull_request:
    paths: ['.github/workflows/temp-mini-c-native-funcname-3539.yml']
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: d92a9d9b61bfb24d68e77c29be41b39ecfe6e28a
          fetch-depth: 0
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.CI_KEY }}
      - name: Validate exact candidate integrated with current main
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = d92a9d9b61bfb24d68e77c29be41b39ecfe6e28a
          git fetch --no-tags origin b1acbe317dd104c1b099350e1c2af4d3e3c29364
          git -c user.name=CI -c user.email=ci@example.invalid merge --no-commit --no-ff FETCH_HEAD
          git write-tree
          git status --short
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            tools/mini-c-driver/target/debug
          key: mini-c-typeid-funcname-3539
          restore-keys: |
            mini-c-typeid-static-literals-3524
            mini-c-typeid-static-storage-3522
            mini-c-typeid-
      - run: cargo test --manifest-path tools/mini-c-driver/Cargo.toml --lib global_data
      - run: cargo test --manifest-path tools/mini-c-driver/Cargo.toml --test c99_block_static --test c99_static_literal_roots --test c99_funcname
      - run: cargo build --manifest-path tools/mini-c-driver/Cargo.toml
      - name: GCC differential runtime for ELF and GAS
        shell: bash
        run: |
          set -euo pipefail
          src=tools/mini-c-driver/tests/fixtures/c99_funcname.c
          driver=tools/mini-c-driver/target/debug/compiler-mini-c
          gcc -std=c99 -pedantic-errors "$src" -o "$RUNNER_TEMP/oracle"
          "$RUNNER_TEMP/oracle"
          "$driver" "$src" -o "$RUNNER_TEMP/native.o"
          gcc "$RUNNER_TEMP/native.o" -o "$RUNNER_TEMP/native"
          "$RUNNER_TEMP/native"
          "$driver" "$src" --emit asm -o "$RUNNER_TEMP/native.s"
          gcc "$RUNNER_TEMP/native.s" -o "$RUNNER_TEMP/native-gas"
          "$RUNNER_TEMP/native-gas"
          readelf -r "$RUNNER_TEMP/native.o"
