name: Validate native global-memory IR migration PR2670
on:
  pull_request:
    paths:
      - '.github/workflows/validate-global-memory-native-2670.yml'
permissions:
  contents: read
jobs:
  native-global-memory:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      SOURCE_SHA: 1439d22116c358619d56579c727d41c8a27cc56e
      CARGO_INCREMENTAL: '0'
      CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
    steps:
      - name: Checkout exact compiler candidate
        uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: ${{ env.SOURCE_SHA }}
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Verify source and isolate native crates
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C compiler rev-parse HEAD)" = "$SOURCE_SHA"
          cat > compiler/Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir", "crates/opt", "crates/backend", "crates/backend-x86"]
          EOF
          rm -f compiler/Cargo.lock
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: native-global-memory-2670
      - name: Check IR production boundaries and native fixture admission
        working-directory: compiler
        run: |
          set -euo pipefail
          ! grep -q 'typeid_executable_fixture\|typed_fixture\|from_legacy' crates/opt/tests/global_memory.rs
          python3 tools/ir_consumer_inventory.py --check-production
      - name: Compile optimizer and x86 backend
        working-directory: compiler
        run: |
          cargo check -p compiler-opt --lib --test global_memory
          cargo check -p compiler-backend-x86 --lib
      - name: Exercise historical oracle and native GAS and ELF C11 differential
        working-directory: compiler
        run: cargo test -p compiler-opt --test global_memory -- --nocapture
