name: Reviewed x86 GP single catalog source index
on:
  pull_request:
    paths: ['.github/workflows/verify-x86-gp-single-catalog-index.yml']
permissions:
  contents: read
jobs:
  gp-index:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout immutable compiler source
        uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 0f3ed30fa80aff3904d6b09822b2c1e4ab61b378
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Assert exact compiler source SHA
        run: test "$(git -C compiler rev-parse HEAD)" = "0f3ed30fa80aff3904d6b09822b2c1e4ab61b378"
      - name: Verify byte-exact generated x86 GP and selector Rust
        working-directory: compiler
        run: |
          set -euo pipefail
          export PYTHONPATH="$PWD/tools"
          python3 -m py_compile tools/regen_x86_gp_recipes.py tools/regen_x86_scalar_bin_forms.py tools/regen_x86_scalar_misc_forms.py tools/test_x86_gp_recipes.py
          python3 tools/regen_x86_gp_recipes.py --check
          python3 tools/regen_x86_selector_rules.py --check
      - name: Run GP source indexing, ALU, misc and native effect mutation suites
        working-directory: compiler
        run: |
          set -euo pipefail
          export PYTHONPATH="$PWD/tools"
          python3 -m unittest discover -s tools -p test_x86_gp_recipes.py -v
          python3 -m unittest discover -s tools -p test_x86_scalar_bin_forms.py -v
          python3 -m unittest discover -s tools -p test_x86_scalar_misc_forms.py -v
          python3 -m unittest discover -s tools -p test_x86_encoding_catalog_index.py -v
