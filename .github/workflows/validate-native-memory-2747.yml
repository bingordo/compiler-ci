name: Validate full native memory oracle migration PR2747
on:
  pull_request:
    paths:
      - '.github/workflows/validate-native-memory-2747.yml'
permissions:
  contents: read
jobs:
  memory-oracle:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      SOURCE_SHA: f9cc412e1461418de05035373cc8780b6c8280cc
      CARGO_INCREMENTAL: '0'
      CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
    steps:
      - name: Checkout exact compiler candidate
        uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: ${{ env.SOURCE_SHA }}
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Pin exact SHA and isolate native workspace
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C compiler rev-parse HEAD)" = "$SOURCE_SHA"
          cat > compiler/Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir", "crates/opt", "crates/backend", "crates/backend-x86"]
          EOF
          rm -f compiler/Cargo.lock
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: memory-matrix-2747
      - name: Assert no legacy conversion and production IR boundary
        working-directory: compiler
        run: |
          set -euo pipefail
          ! grep -qE 'typeid_executable_fixture|typed_fixture|from_legacy|memory_fixture' crates/opt/tests/memory_execution_oracle.rs crates/opt/tests/support/native_memory_matrix.rs
          python3 tools/ir_consumer_inventory.py --check-production
      - name: Compile optimizer and native x86 backend
        working-directory: compiler
        run: |
          cargo check -p compiler-opt --lib --test memory_execution_oracle
          cargo check -p compiler-backend-x86 --lib
      - name: Run entire local CFG array memory alias external call and T5 oracle suite
        working-directory: compiler
        run: |
          cargo test -p compiler-opt --test memory_execution_oracle -- --nocapture
          cargo test -p compiler-opt --test typed_global_memory -- --nocapture
          cargo test -p compiler-opt --test typed_dse -- --nocapture
