name: Compiler docs PR 1522 validation
on:
  push:
    branches: [main]
    paths: ['.github/workflows/docs-pr1522-validation.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  docs:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 0b421698e217b2c06a08b0127fc2ba276a6c9bf3
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Confirm exact revision
        run: test "$(git -C compiler rev-parse HEAD)" = "0b421698e217b2c06a08b0127fc2ba276a6c9bf3"
      - name: Validate all documentation links
        working-directory: compiler
        run: python3 tools/check_doc_links.py
      - name: Test documentation checker
        working-directory: compiler
        run: python3 -m unittest discover -s tools -p 'test_check_doc_links.py' -v
