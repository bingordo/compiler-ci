name: TypeId PHI CFG native fixture migration
on:
  push:
    branches: [verify/ir-phi-cfg-fixture-20261114]
    paths: ['.github/workflows/ir-phi-cfg-fixture-20261114.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 0adc3c446ca1aa3f322a0a5f62717a71eed4e363
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Require exact compiler commit
        run: test "$(git -C compiler rev-parse HEAD)" = "0adc3c446ca1aa3f322a0a5f62717a71eed4e363"
      - name: Restrict workspace to core
        run: |
          cat > compiler/Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir", "crates/opt", "crates/backend", "crates/backend-x86"]
          EOF
          rm -f compiler/Cargo.lock
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: ir-phi-cfg-fixture
      - name: Native PHI CFG parity and executable backend oracle
        working-directory: compiler
        run: |
          cargo test -p compiler-opt --test typed_phi_cfg
          cargo test -p compiler-opt --test ir_fixture_directives --test native_ir_pass_replay
          cargo test -p compiler-ir --test native_module_text_v3
          cargo clippy -p compiler-opt --test typed_phi_cfg --test ir_fixture_directives -- -D warnings
