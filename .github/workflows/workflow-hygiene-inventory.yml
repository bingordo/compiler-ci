name: Workflow hygiene inventory
on:
  push:
    branches: [main, ci/workflow-hygiene-20261122]
    paths: ['.github/workflows/**', 'ci/archive/workflows/**']
  pull_request:
    paths: ['.github/workflows/**', 'ci/archive/workflows/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Classify workflows without compiling sources
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json,re,collections,hashlib
          root=Path(".github/workflows")
          workflows=sorted([*root.glob("*.yml"),*root.glob("*.yaml")])
          stats=collections.Counter(); rows=[]
          for p in workflows:
              text=p.read_text(encoding="utf-8",errors="replace")
              lines=text.splitlines()
              sections={}
              on_line=next((i for i,x in enumerate(lines) if re.match(r"^on:\s*(?:#.*)?$",x)),None)
              if on_line is not None:
                  section=None
                  for line in lines[on_line+1:]:
                      if line and not line[0].isspace() and not line.lstrip().startswith("#"):break
                      m=re.match(r"^  ([\w-]+):",line)
                      if m: section=m[1]; sections[section]=[]
                      elif section:sections[section].append(line)
              if on_line is None:
                  m=re.search(r"^on:\s*\[([^\]]*)\]",text,re.M)
                  if m:
                      for v in m[1].split(","):sections[v.strip()]=[]
              source_pins=re.findall(r"(?m)^\s*ref:\s*([0-9a-f]{40})\s*$",text)
              has_compiler="repository: bingordo/compiler" in text
              has_dynamic=bool(re.search(r"(?m)^\s*ref:\s*.*\$\{\{",text))
              events=set(sections)
              scheduled="schedule" in events
              explicit_self=True
              for section in ("push","pull_request"):
                  if section not in events:continue
                  block="\n".join(sections[section])
                  path_matches=re.findall(r"\.github/workflows/[\w.\/-]+\.ya?ml",block)
                  explicit_self &= len(path_matches)==1 and path_matches[0]==str(p)
                  explicit_self &= bool(re.search(r"\bpaths:\s*",block))
              only_manual_or_self=(events <= {"push","pull_request","workflow_dispatch"} and
                                   (("push" in events or "pull_request" in events) and explicit_self or events=={"workflow_dispatch"}))
              source_pinned=has_compiler and len(source_pins)>=1 and not has_dynamic
              yaml_errors=[]
              # Reject two suspicious patterns: illegal escaped newline strings and duplicate keys are lint concerns.
              if "\\n" in text and re.search(r"(?m)^\s*#.*\\n",text):yaml_errors.append("escaped_comment_newlines")
              row={"path":str(p),"bytes":p.stat().st_size,"events":sorted(events),
                   "source_pinned":source_pinned,"pin_count":len(source_pins),
                   "sha":source_pins[0][:12] if source_pins else None,
                   "has_compiler":has_compiler,"dynamic_ref":has_dynamic,"self_triggers":explicit_self,
                   "only_manual_or_self":only_manual_or_self,
                   "schedule":scheduled, "schedules":len(re.findall(r"^\s+- cron:",text,re.M)),
                   "yaml_errors":yaml_errors}
              rows.append(row)
              stats["total"]+=1
              for event in events:stats["event_"+event]+=1
              if source_pinned:stats["pinned_compiler"]+=1
              if scheduled:stats["scheduled"]+=1
              if scheduled and source_pinned:stats["scheduled_pinned_compiler"]+=1
              if only_manual_or_self:stats["manual_or_self_trigger"]+=1
              if only_manual_or_self and source_pinned:stats["historical_source_pinned_candidates"]+=1
              if not events:stats["no_events_detected"]+=1
              if yaml_errors:stats["lint_suspicious"]+=1
          historical=[x for x in rows if x["only_manual_or_self"] and x["source_pinned"] and not x["schedule"]]
          scheduled=[x for x in rows if x["schedule"]]
          def dump(name,data):
              print(name+" "+json.dumps(data,separators=(",",":"),sort_keys=True))
          dump("SUMMARY",stats)
          dump("SCHEDULED",scheduled)
          dump("SCHEDULED_PINNED",[x for x in scheduled if x["source_pinned"]])
          dump("HISTORICAL_PINNED_SAMPLE",historical[:90])
                    dump("ANOMALIES",[x for x in rows if x["yaml_errors"] or not x["events"]][:60])
          Path("audit").mkdir(exist_ok=True)
          Path("audit/workflow-inventory.json").write_text(json.dumps({"summary":stats,"workflows":rows},indent=2)+"\n")
          
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: workflow-hygiene-inventory
          path: audit/workflow-inventory.json
          retention-days: 7
