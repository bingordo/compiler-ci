name: Atomic shared physical XCHG smoke
on:
  pull_request:
    paths:
      - .github/workflows/atomic-shared-physical-xchg-20261119.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  atomic-physical-xchg:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 70424dd818374588b4d81e0c8dec2aec13a38f3b
          ssh-key: ${{ secrets.CI_KEY }}
          path: compiler
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Verify pinned compiler head
        run: test "$(git -C compiler rev-parse HEAD)" = 70424dd818374588b4d81e0c8dec2aec13a38f3b
      - name: Use isolated backend workspace
        run: |
          printf '[workspace]\nresolver = "2"\nmembers = ["crates/ir", "crates/opt", "crates/backend", "crates/backend-x86"]\n' > compiler/Cargo.toml
          rm -f compiler/Cargo.lock
      - name: Build shared physical x86 backend
        working-directory: compiler
        run: cargo check --workspace
      - name: Check atomic XCHG ELF and GAS parity
        working-directory: compiler
        run: cargo test -p compiler-backend-x86 --lib shared_physical_atomic_exchange_has_implicit_lock_and_matching_elf_gas
