name: IR fixture directives pilot
on:
  push:
    branches: [verify/ir-directive-fixtures-20261114]
    paths:
      - '.github/workflows/ir-directive-fixtures-20261114.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 512d2c13cf2a1b439f70965a3432bf875d1c5b0a
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Pin exact source revision
        run: test "$(git -C compiler rev-parse HEAD)" = "512d2c13cf2a1b439f70965a3432bf875d1c5b0a"
      - name: Restrict workspace to core crates
        run: |
          cat > compiler/Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir", "crates/opt", "crates/backend", "crates/backend-x86"]
          EOF
          rm -f compiler/Cargo.lock
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: ir-directive-fixture-pilot
      - name: New fixture tests, regression suites, strict Clippy
        working-directory: compiler
        run: |
          cargo test -p compiler-ir --test native_module_comment_fixtures
          cargo test -p compiler-opt --test ir_fixture_directives
          cargo test -p compiler-ir
          cargo test -p compiler-opt --test ir_replay_cli --test native_ir_pass_replay
          cargo clippy -p compiler-ir -p compiler-opt --tests -- -D warnings
