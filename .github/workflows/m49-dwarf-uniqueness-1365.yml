name: CI M4.9 DWARF section uniqueness
on:
  pull_request:
    paths: ['.github/workflows/m49-dwarf-uniqueness-1365.yml']
permissions:
  contents: read
jobs:
  dwarf:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 617603bd93f0a7e9b776dfddffbba6fd566e4cc2
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Resolve compiler Git dependencies using existing HTTPS rule
        run: git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
      - name: Verify pinned compiler and backend DWARF regressions
        working-directory: compiler
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "617603bd93f0a7e9b776dfddffbba6fd566e4cc2"
          cargo test -p compiler-backend --lib
          cargo test -p compiler-backend --tests
          cargo clippy -p compiler-backend --all-targets -- -D warnings
