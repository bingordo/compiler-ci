name: Verify x86 cost profile fixture repair on compiler PR
on:
  pull_request:
    paths:
      - '.github/workflows/verify-x86-cost-fixture-temp.yml'
permissions:
  contents: read
jobs:
  test-x86-cost-profile:
    runs-on: ubuntu-24.04
    steps:
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.CI_KEY }}
      - name: Trust GitHub SSH host
        run: ssh-keyscan github.com >> ~/.ssh/known_hosts
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 53dee99c1d7c7186b27c64ad26f7a411ef8f0172
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Verify compiler source and x86 cost tests
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "53dee99c1d7c7186b27c64ad26f7a411ef8f0172"
          export PYTHONPATH="$PWD/tools"
          python3 -m unittest discover -s tests -p 'test_x86_*.py' -v
          python3 tools/validate_x86_costs.py data/x86_costs_generic.json
          python3 -m unittest discover -s tools -p 'test_x86_generic_form_matcher.py' -v
      - uses: dtolnay/rust-toolchain@stable
      - name: Verify strict compiler driver production build
        run: |
          set -euo pipefail
          RUSTFLAGS="-D warnings" cargo build -p compiler --bin compiler
