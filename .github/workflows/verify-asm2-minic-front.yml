name: ASM2 Mini-C basic asm statement frontend
on:
  push:
    branches: [main]
    paths: ['.github/workflows/verify-asm2-minic-front.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  basic-asm:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/mini-c
          ref: 675c1e3d8d3cf3c42375add6c967ae39805aa1dc
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Check exact pinned Mini-C source
        run: test "$(git rev-parse HEAD)" = '675c1e3d8d3cf3c42375add6c967ae39805aa1dc'
      - uses: Swatinem/rust-cache@v2
        with:
          key: asm2-minic-basic-frontend
      - name: Compile and test basic asm syntax and semantic AST
        run: |
          set -euo pipefail
          cargo test -p mini-c-syntax -p mini-c-sema
          cargo clippy -p mini-c-syntax -p mini-c-sema --all-targets -- -D warnings
          echo "ASM2_MINIC_FRONT status=PASS source=675c1e3d8d3cf3c42375add6c967ae39805aa1dc" | tee -a "$GITHUB_STEP_SUMMARY"
