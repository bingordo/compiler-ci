name: ASM2 Mini-C basic asm statement frontend
on:
  push:
    branches: [main]
    paths: ['.github/workflows/verify-asm2-minic-front.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  basic-asm:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/mini-c
          ref: 2a00c77bccab01e38d5ebd8237adc02a419a178e
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Check exact pinned Mini-C source
        run: test "$(git rev-parse HEAD)" = '2a00c77bccab01e38d5ebd8237adc02a419a178e'
      - uses: Swatinem/rust-cache@v2
        with:
          key: asm2-minic-basic-frontend
      - name: Compile and test basic asm syntax and semantic AST
        run: |
          set -euo pipefail
          cargo test --workspace
          cargo clippy --workspace --all-targets -- -D warnings
          echo "ASM2_MINIC_FRONT status=PASS source=2a00c77bccab01e38d5ebd8237adc02a419a178e" | tee -a "$GITHUB_STEP_SUMMARY"
