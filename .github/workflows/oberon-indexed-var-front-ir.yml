name: Oberon indexed VAR address frontend projection
on:
  push:
    paths:
      - '.github/workflows/oberon-indexed-var-front-ir.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  front-ir:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out exact Oberon frontend candidate
        uses: actions/checkout@v4
        with:
          repository: bingordo/oberon
          ref: 8e687074ad97e65a722a2bc816eed885d1ac6e19
          path: oberon
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Verify candidate SHA
        run: test "$(git -C oberon rev-parse HEAD)" = "8e687074ad97e65a722a2bc816eed885d1ac6e19"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: oberon/oberon -> target
          key: oberon-indexed-var-front-ir-v1
      - name: Checked VAR indexed-address admission and rejection
        run: cargo test --manifest-path oberon/oberon/Cargo.toml -p oberon-front-ir --test var_indexed_integer_params -- --nocapture
      - name: Complete frontend regression suite
        run: cargo test --manifest-path oberon/oberon/Cargo.toml -p oberon-front-ir
      - name: Strict frontend Clippy
        run: cargo clippy --manifest-path oberon/oberon/Cargo.toml -p oberon-front-ir --all-targets -- -D warnings
