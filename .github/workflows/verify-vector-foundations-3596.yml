name: Vector foundations PR 3596 validation
on:
  pull_request:
    paths:
      - '.github/workflows/verify-vector-foundations-3596.yml'
permissions:
  contents: read
jobs:
  foundations:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: a322c5c4c42c2e18af3ee125582890eb4ceda0af
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Verify source and restrict workspace
        working-directory: compiler
        run: |
          test "$(git rev-parse HEAD)" = a322c5c4c42c2e18af3ee125582890eb4ceda0af
          printf '[workspace]\nresolver = "2"\nmembers = ["crates/ir", "crates/opt", "crates/backend", "crates/backend-x86", "crates/backend-aarch64", "crates/backend-riscv64", "crates/backend-wasm"]\n' > Cargo.toml
          rm -f Cargo.lock
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: vector-foundations
      - name: IR regression and new geometry tests
        working-directory: compiler
        run: cargo test -p compiler-ir
      - name: Shared register and spill geometry
        if: always()
        working-directory: compiler
        run: cargo test -p compiler-backend --test native_vector
      - name: Target register pressure
        if: always()
        working-directory: compiler
        run: cargo test -p compiler-backend-x86 -p compiler-backend-aarch64 --test vector_forms
      - name: All native backend library consumers
        if: always()
        working-directory: compiler
        run: cargo check -p compiler-opt -p compiler-backend -p compiler-backend-x86 -p compiler-backend-aarch64 -p compiler-backend-riscv64 -p compiler-backend-wasm --lib
