name: Mini-C P2 checked source spans for TypeId declarations
on:
  pull_request:
    paths:
      - '.github/workflows/verify-minic-p2-origins-20261115.yml'
permissions:
  contents: read
jobs:
  checked-minic-source-origins:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Load compiler-ci deploy key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.CI_KEY }}
      - name: Trust frontend GitHub SSH host
        run: ssh-keyscan github.com >> ~/.ssh/known_hosts
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: c4522b507f57a20560078b83af723de6465d77fa
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Pin exact source in compiler-ci only
        run: test "$(git -C compiler rev-parse HEAD)" = "c4522b507f57a20560078b83af723de6465d77fa"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler/tools/mini-c-driver -> target
          key: minic-source-decl-p2
      - name: Verified checker spans and post-CFG TypeId origin records
        shell: bash
        working-directory: compiler/tools/mini-c-driver
        run: |
          set -euo pipefail
          cargo test --test source_declaration_origins -- --nocapture
          cargo test --lib
          cargo check
          echo MINIC_P2_SOURCE_OWNED_DECL_SPANS_PASS
      - name: No source origin data changes TypeId / backend defaults
        shell: bash
        working-directory: compiler
        run: |
          set -euo pipefail
          cargo test -p compiler-ir --test source_provenance
          echo MINIC_P2_SOURCE_ORIGIN_SIDECAR_DEFAULT_PARITY_PASS
