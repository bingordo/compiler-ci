name: Validate x86 bulk fill PR 2943
on:
  push:
    branches: [ci-x86-bulk-fill-stosb-pr2943]
    paths: ['.github/workflows/ci-x86-bulk-fill-stosb-pr2943.yml']
  pull_request:
    paths: ['.github/workflows/ci-x86-bulk-fill-stosb-pr2943.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  physical-fill:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 11a1f87306483f7e8e0359d2cb76473292ceebdd
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Check immutable source SHA
        run: test "$(git -C compiler rev-parse HEAD)" = 11a1f87306483f7e8e0359d2cb76473292ceebdd
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.CI_KEY }}
      - run: ssh-keyscan github.com >> ~/.ssh/known_hosts
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: native-bulk-fill-pr2943
      - name: Check generated source-backed x86 forms
        working-directory: compiler
        run: python3 tools/regen_x86_forms.py --check
      - name: Check new fill code and tests Rust formatting
        working-directory: compiler
        run: rustfmt --check --edition 2021 crates/backend-x86/src/bulk_fill.rs crates/backend-x86/tests/unit/bulk_fill.rs
      - name: Selected-machine and physical GAS/ELF C11 oracle
        working-directory: compiler
        run: cargo test -p compiler-backend-x86 --lib bulk_fill_tests -- --nocapture
      - name: Existing x86 bulk copy regression
        working-directory: compiler
        run: cargo test -p compiler-backend-x86 --lib bulk_copy -- --nocapture
      - name: Shared bulk memory regression
        working-directory: compiler
        run: cargo test -p compiler-backend --lib bulk_memory -- --nocapture
      - name: x86 library regression
        working-directory: compiler
        run: cargo test -p compiler-backend-x86 --lib -- --skip x4_generated_rules_preserve_cfg_phi_edges_and_pressure_in_both_native_sinks --skip native_s2314_matchpd_factor_gas_elf_per_family
