name: Existing x86 TypeId CMOV fixed SSA migration
on:
  push:
    branches: [verify/ir-x86-typeid-cmov-20261115]
    paths: ['.github/workflows/ir-x86-typeid-cmov-20261115.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: d3f63e9d95b3a0e083a9c92a6458e24cdc0bbfa4
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Verify exact compiler source
        run: test "$(git -C compiler rev-parse HEAD)" = "d3f63e9d95b3a0e083a9c92a6458e24cdc0bbfa4"
      - name: Restrict core workspace
        run: |
          cat > compiler/Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir", "crates/backend", "crates/backend-x86"]
          EOF
          rm -f compiler/Cargo.lock
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: x86-typeid-cmov-fixed-fixtures
      - name: Export existing fixed TypeId CMOV source graphs
        working-directory: compiler
        run: |
          cargo test -p compiler-backend-x86 --test native_typeid_fused_cmp_select temporary_export_original_fixed_x86_typeid_ir -- --nocapture
          cargo test -p compiler-backend-x86 --test native_typeid_select_cmov temporary_export_original_fixed_x86_typeid_ir -- --nocapture
