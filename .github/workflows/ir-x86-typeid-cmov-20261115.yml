name: Existing x86 TypeId CMOV fixed SSA migration
on:
  push:
    branches: [verify/ir-x86-typeid-cmov-20261115]
    paths: ['.github/workflows/ir-x86-typeid-cmov-20261115.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 43202c359e998478355e1851eecb1796dd1a87a8
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Verify exact compiler source
        run: test "$(git -C compiler rev-parse HEAD)" = "43202c359e998478355e1851eecb1796dd1a87a8"
      - name: Restrict core workspace
        run: |
          cat > compiler/Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir", "crates/backend", "crates/backend-x86"]
          EOF
          rm -f compiler/Cargo.lock
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: x86-typeid-cmov-fixed-fixtures
      - name: Verify migrated TypeId CMP/CMOV and Select native oracles
        working-directory: compiler
        run: |
          cargo test -p compiler-backend-x86 --test native_typeid_fused_cmp_select --test native_typeid_select_cmov
          cargo test -p compiler-backend-x86 --test native_typeid_direct --test native_typeid_function_signatures
          cargo test -p compiler-ir --test native_module_text_v3 --test native_fixture_text
          cargo clippy -p compiler-backend-x86 --no-deps --test native_typeid_fused_cmp_select --test native_typeid_select_cmov -- -D warnings
