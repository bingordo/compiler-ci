# Validate BT4 original RBP/callee-save native test conversions via compiler-ci.
name: BT4 x86 original preserved-register C oracles
on:
  pull_request:
    paths:
      - '.github/workflows/ir-bt4-preserved-oracles-pr1640.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-preserved-oracles:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      CARGO_INCREMENTAL: '0'
      SOURCE_SHA: d8ef6b1ba0a5a5b912d7e695d9079e21796175c0
    steps:
      - name: Checkout exact compiler PR candidate
        uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: d8ef6b1ba0a5a5b912d7e695d9079e21796175c0
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Verify SHA and isolate core crates
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C compiler rev-parse HEAD)" = "$SOURCE_SHA"
          cat > compiler/Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir", "crates/opt", "crates/backend", "crates/backend-x86"]
          EOF
          rm -f compiler/Cargo.lock
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: ir-bt4-original-callee-oracles
      - name: Original C sentinel and native ELF/GAS in both frame modes
        working-directory: compiler
        run: cargo test -p compiler-backend-x86 --test rbp_alloc_native --test callee_saved_native -- --nocapture
      - name: Adjacent spill, unwind, ABI and call regressions
        working-directory: compiler
        run: |
          set -euo pipefail
          cargo test -p compiler-backend-x86 --test native_typeid_call_liveness --test native_typeid_direct --test call_clobber_pressure_native --test mixed_frame_native --test m4_6_unwind_native --test m4_6_source_unwind_native
          cargo check -p compiler-ir -p compiler-backend -p compiler-backend-x86 --all-targets
      - name: Strict Clippy for migrated original tests
        working-directory: compiler
        run: cargo clippy -p compiler-backend-x86 --test rbp_alloc_native --test callee_saved_native -- -D warnings
