name: M10 opt-in omitted static bodies, 32 original Csmith seed differential
on:
  push:
    branches: [test/m10-static-omit-thirtytwo-20261107]
    paths: ['.github/workflows/test-m10-static-omit-thirtytwo.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-pinned-eight-seeds:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
      CARGO_INCREMENTAL: '0'
      COMPILER_SHA: 024b09eb7940b6076c97aa613b6e9da3716108dc
      FRONTEND_SHA: 16e47b226535e6c97269d309e7e444c345ed4f78
    steps:
      - name: Checkout exact compiler and checked Mini-C integration
        uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 024b09eb7940b6076c97aa613b6e9da3716108dc
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Confirm exact compiler and Mini-C revisions
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C compiler rev-parse HEAD)" = "$COMPILER_SHA"
          python3 - <<'PY'
          from pathlib import Path
          import os,re
          s=Path("compiler/tools/mini-c-driver/Cargo.toml").read_text()
          versions=re.findall(r'mini-c-(?:syntax|sema)\s*=\s*\{[^\n]*rev\s*=\s*"([0-9a-f]{40})"',s)
          assert versions == [os.environ["FRONTEND_SHA"]]*2,versions
          PY
          git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
          python3 -m unittest discover -s compiler/tools -p test_csmith_probe.py
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler/tools/mini-c-driver -> target
          key: m10-static-omission-nov7
      - name: Test native FP failure boundary and strict Clippy
        shell: bash
        run: |
          set -euo pipefail
          cargo test --manifest-path compiler/tools/mini-c-driver/Cargo.toml -p compiler-mini-c --lib m10_ -- --nocapture
          cargo clippy --manifest-path compiler/tools/mini-c-driver/Cargo.toml -p compiler-mini-c --all-targets -- -D warnings
      - name: Build exact native Mini-C driver, not stale prebuilt
        run: cargo build --release --manifest-path compiler/tools/mini-c-driver/Cargo.toml --bin compiler-mini-c
      - name: Execute real block declaration list object and GCC reference
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p results
          cat > "$RUNNER_TEMP/local-decls.c" <<'C'
          int main(void) {
              int i=19, j=i+23;
              int *p=&j, extra=0;
              return *p + extra - 42;
          }
          C
          "$PWD/compiler/tools/mini-c-driver/target/release/compiler-mini-c" \
            "$RUNNER_TEMP/local-decls.c" -o "$RUNNER_TEMP/native-local.o" --emit obj
          cc "$RUNNER_TEMP/native-local.o" -o "$RUNNER_TEMP/native-local"
          cc "$RUNNER_TEMP/local-decls.c" -o "$RUNNER_TEMP/gcc-local"
          "$RUNNER_TEMP/native-local"
          "$RUNNER_TEMP/gcc-local"
          sha256sum "$RUNNER_TEMP/native-local.o" >> results/native-object-sha256.txt
      - name: Install original Csmith 2.3, GCC and Clang
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -qq -y --no-install-recommends csmith libcsmith-dev gcc clang
          version="$(dpkg-query -W csmith | awk '{print $2}')"
          [[ "$version" == 2.3.0-* ]]
          header="$(dpkg -L libcsmith-dev | grep '/csmith.h$' | head -n1)"
          test -s "$header"
          echo "CSMITH_INCLUDE=$(dirname "$header")" >> "$GITHUB_ENV"
      - name: Generate eight original restricted-observable Csmith sources
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p results
          python3 compiler/tools/csmith_probe.py --generate \
            --cases-dir "$RUNNER_TEMP/csmith-cases" \
            --csmith csmith --seed-base 1 --seed-count 32 \
            --profile restricted-observable | tee results/generate.log
      - name: Compare exact original corpus with strict default and opt-in static omission
        shell: bash
        run: |
          set -euo pipefail
          driver="$PWD/compiler/tools/mini-c-driver/target/release/compiler-mini-c"
          for mode in strict omit; do
            extra=()
            minimum=0
            if [ "$mode" = omit ]; then
              extra+=(--omit-unreferenced-static-bodies)
              minimum=31
            fi
            python3 compiler/tools/csmith_probe.py --probe \
              --cases-dir "$RUNNER_TEMP/csmith-cases" \
              --artifacts-dir "$RUNNER_TEMP/csmith-results-$mode" \
              --include-dir "$CSMITH_INCLUDE" --preprocess-c \
              --max-wall-seconds 360 --run-timeout 10 \
              --driver "$driver" \
              --compiler-sha "$COMPILER_SHA" --frontend-sha "$FRONTEND_SHA" \
              --minimum-native "$minimum" "${extra[@]}" | tee "results/$mode.log"
            cp "$RUNNER_TEMP/csmith-results-$mode/summary.json" "results/$mode.json"
          done
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json,os
          root=Path(os.environ["RUNNER_TEMP"])
          strict=json.loads(Path("results/strict.json").read_text())
          omit=json.loads(Path("results/omit.json").read_text())
          assert strict["total_seeds"] == omit["total_seeds"] == 32
          assert strict["reference_agreed"] == omit["reference_agreed"] == 31
          assert strict["counts"]["reference-timeout"] == omit["counts"]["reference-timeout"] == 1
          assert strict["counts"]["unsupported-front-end"] == 31
          assert omit["native_accepted"] == omit["passed"] == 31
          assert omit["counts"]["unsupported-front-end"] == 0
          assert strict["minimum_native"] == 0 and omit["minimum_native"] == 31
          for d in (strict,omit):
              assert all(d["counts"][error] == 0 for error in [
                  "wrong-code","compiler-crash","compiler-timeout","compiler-link-error",
                  "native-crash","native-timeout","harness-error","budget-exhausted"
              ])
          assert strict["distinct_reference_output_hashes"] == omit["distinct_reference_output_hashes"]
          assert 30 <= strict["distinct_reference_output_hashes"] <= 32
          assert not strict["omit_unreferenced_static_bodies"]
          assert omit["omit_unreferenced_static_bodies"]
          for seed in range(1,33):
              if seed == 30:  # Unresolved GCC/Clang reference timeout; retained in the denominator.
                  continue
              p=f"case-{seed}/candidate.i"
              a=(root/"csmith-results-strict"/p).read_bytes()
              b=(root/"csmith-results-omit"/p).read_bytes()
              assert hashlib.sha256(a).digest()==hashlib.sha256(b).digest(),p
          print("M10_STRICT_SUMMARY",json.dumps(strict,sort_keys=True))
          print("M10_STATIC_OMIT_CSMITH_SUMMARY",json.dumps(omit,sort_keys=True))
          PY
      - name: Save complete original and hashed preprocessed sources and failure evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m10-static-omit-thirtytwo-original-seeds
          path: |
            results/
            ${{ runner.temp }}/csmith-cases/
            ${{ runner.temp }}/csmith-results-strict/
            ${{ runner.temp }}/csmith-results-omit/
          if-no-files-found: ignore
          retention-days: 14
