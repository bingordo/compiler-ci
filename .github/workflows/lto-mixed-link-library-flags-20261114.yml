name: LTO mixed-link libraries and runtime search
on:
  push:
    branches: [verify/lto-mixed-link-library-flags-20261114]
    paths: ['.github/workflows/lto-mixed-link-library-flags-20261114.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mixed-link-libraries:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 161747a27d27a5e71b249e8c646b9966c68e85e1
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Verify source and public frontend dependencies
        run: |
          test "$(git -C compiler rev-parse HEAD)" = "161747a27d27a5e71b249e8c646b9966c68e85e1"
          git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
      - name: Focus driver workspace
        run: |
          cat > compiler/Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir", "crates/opt", "crates/backend", "crates/backend-x86", "crates/backend-aarch64", "crates/driver"]
          EOF
          rm -f compiler/Cargo.lock
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: lto-mixed-link-libraries
      - name: Test static archive, shared rpath and mixed-link regressions
        working-directory: compiler
        run: |
          cargo test -p compiler --test lto_mixed_link -- --nocapture
          cargo test -p compiler --test lto_coemit
          cargo test -p compiler --test lto_source_sidecar
      - name: Strict mixed-link lint
        working-directory: compiler
        run: cargo clippy -p compiler --test lto_mixed_link -- -D warnings
