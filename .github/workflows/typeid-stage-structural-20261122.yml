# Source-pinned TypeId structural/semantic pass-boundary regression gate.
name: TypeId stage structural validation 20261122
on:
  push:
    branches:
      - validation/typeid-stage-structural-20261122
    paths:
      - '.github/workflows/typeid-stage-structural-20261122.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  optimizer:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      SOURCE_SHA: 29d4bc76a861066eddc07e18af13a6fb4ebce654
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: ${{ env.SOURCE_SHA }}
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Confirm source and isolate optimizer workspace
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C compiler rev-parse HEAD)" = "$SOURCE_SHA"
          cat > compiler/Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir", "crates/opt", "crates/backend", "crates/backend-x86", "crates/backend-aarch64"]
          EOF
          rm -f compiler/Cargo.lock
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: typeid-stage-structural-opt-20261122
      - name: Semantic, structural and pass manager regression
        working-directory: compiler
        run: |
          set -euo pipefail
          cargo test -p compiler-opt --test semantic_debug -- --nocapture
          COMPILER_TEST_VALIDATION=full cargo test -p compiler-opt --test typeid_core_pass_manager -- --nocapture 2>&1 | tee "$RUNNER_TEMP/typeid-test-validation.log"
          grep -Eq 'TYPEID_STRUCTURAL_SUMMARY checked_stages=[1-9][0-9]*' "$RUNNER_TEMP/typeid-test-validation.log"
          grep -Fq 'TYPEID_SEMANTIC_SUMMARY' "$RUNNER_TEMP/typeid-test-validation.log"
          cargo clippy -p compiler-opt --lib -- --no-deps -D clippy::all
  native-driver:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      SOURCE_SHA: 29d4bc76a861066eddc07e18af13a6fb4ebce654
      CARGO_INCREMENTAL: '0'
      CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
    steps:
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.CI_KEY }}
      - name: Trust GitHub for frontend dependencies
        run: ssh-keyscan github.com >> ~/.ssh/known_hosts
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: ${{ env.SOURCE_SHA }}
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Confirm source
        run: test "$(git -C compiler rev-parse HEAD)" = "$SOURCE_SHA"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: typeid-stage-structural-driver-20261122
      - name: Real native driver semantic and structural checks
        working-directory: compiler
        run: |
          set -euo pipefail
          cargo test -p compiler --test typeid_opt_level_cli -- --nocapture
          cargo test -p compiler --test f6_source_runtime_parity f6_x86_test_validation_preserves_native_runtime_and_output -- --exact --nocapture
          cargo test -p compiler --test typeid_ir_dump_replay replay_test_validation_keeps_native_objects_identical -- --exact --nocapture
          cargo test -p compiler --test ir_default_cli -- --nocapture
