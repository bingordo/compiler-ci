# Temporary exact-source validation, do not merge to compiler-ci main.
name: IR PR3363 retire historical induction
on:
  push:
    branches: [verify-ir-induction-3363-20261126]
    paths: ['.github/workflows/ir-pr3363-induction.yml']
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      SOURCE_SHA: 6390a8c168f46ca26694b09d27405c1d723f011f
      CARGO_INCREMENTAL: '0'
      CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: ${{ env.SOURCE_SHA }}
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Verify source and isolate core workspace
        run: |
          set -euo pipefail
          test "$(git -C compiler rev-parse HEAD)" = "$SOURCE_SHA"
          cat > compiler/Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir", "crates/opt", "crates/backend", "crates/backend-x86", "crates/backend-aarch64"]
          EOF
          rm -f compiler/Cargo.lock
          echo 'Remaining obsolete induction references (audit):'
          git -C compiler grep -n -E 'legacy-function-induction-oracle|compiler_opt::induction::|induction::reduce_multiplications' -- crates/opt || :
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: ir-pr3363-induction
      - name: Compile optimizer targets and native induction loop semantic suites
        working-directory: compiler
        run: |
          set -euo pipefail
          cargo check -p compiler-opt --all-targets
          cargo test -p compiler-opt --lib
          cargo test -p compiler-opt --test induction_native
          cargo test -p compiler-opt --test induction_analysis
          cargo test -p compiler-opt --test licm_native
          cargo test -p compiler-opt --test loop_trap_semantics
          cargo test -p compiler-opt --test pre_licm_semantic_matrix
      - name: Lint native optimizer (baseline generated dead code excluded)
        working-directory: compiler
        run: |
          set -euo pipefail
          cargo clippy -p compiler-opt --lib -- -D warnings -A dead_code
