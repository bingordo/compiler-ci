name: Candidate IR memory stream 3221
on:
  pull_request:
    paths:
      - '.github/workflows/verify-ir-memory-stream-3221.yml'
permissions:
  contents: read
jobs:
  candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 835630bf4f94689f96028170face98f7f57078f3
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Check candidate SHA
        run: |
          test "$(git -C compiler rev-parse HEAD)" = "835630bf4f94689f96028170face98f7f57078f3"
          git -C compiler rev-parse HEAD | tee -a "$GITHUB_STEP_SUMMARY"
          rustc --version
      - name: Restrict workspace to independent backend crates
        run: |
          cat > compiler/Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir", "crates/opt", "crates/backend", "crates/backend-x86", "crates/backend-aarch64", "crates/backend-riscv64", "crates/backend-wasm"]
          EOF
          rm -f compiler/Cargo.lock
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: ir-memory-stream
      - name: Shared streaming and backend tests
        working-directory: compiler
        run: |
          cargo test -p compiler-backend --test stream_scalar_legalization
          cargo test -p compiler-backend -p compiler-backend-x86 -p compiler-backend-aarch64 -p compiler-backend-riscv64 -p compiler-backend-wasm
      - name: Alternate x86 selection feature builds
        working-directory: compiler
        run: |
          cargo check -p compiler-backend-x86 --no-default-features
          cargo check -p compiler-backend-x86 --no-default-features --features x7-production-generated-add
          cargo check -p compiler-backend-x86 --features x7-typeid-source-dag-optin
