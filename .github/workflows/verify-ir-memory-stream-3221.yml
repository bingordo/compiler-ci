name: Candidate IR memory stream 3221
on:
  pull_request:
    paths:
      - '.github/workflows/verify-ir-memory-stream-3221.yml'
permissions:
  contents: read
jobs:
  candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: e8b0b74317d36f96ec0917c9dd36086bc5357e44
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Check candidate SHA
        run: |
          test "$(git -C compiler rev-parse HEAD)" = "e8b0b74317d36f96ec0917c9dd36086bc5357e44"
          git -C compiler rev-parse HEAD | tee -a "$GITHUB_STEP_SUMMARY"
          rustc --version
      - name: Restrict workspace to independent backend crates
        run: |
          cat > compiler/Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir", "crates/opt", "crates/backend", "crates/backend-x86", "crates/backend-aarch64", "crates/backend-riscv64", "crates/backend-wasm"]
          EOF
          rm -f compiler/Cargo.lock
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: ir-memory-stream
      - name: Shared streaming tests
        working-directory: compiler
        run: cargo test -p compiler-backend --test stream_scalar_legalization
      - name: backend regression tests
        if: ${{ !cancelled() }}
        working-directory: compiler
        run: cargo test -p compiler-backend --no-fail-fast
      - name: backend-x86 regression tests
        if: ${{ !cancelled() }}
        working-directory: compiler
        run: cargo test -p compiler-backend-x86 --no-fail-fast
      - name: backend-aarch64 regression tests
        if: ${{ !cancelled() }}
        working-directory: compiler
        run: cargo test -p compiler-backend-aarch64 --no-fail-fast
      - name: backend-riscv64 regression tests
        if: ${{ !cancelled() }}
        working-directory: compiler
        run: cargo test -p compiler-backend-riscv64 --no-fail-fast
      - name: backend-wasm regression tests
        if: ${{ !cancelled() }}
        working-directory: compiler
        run: cargo test -p compiler-backend-wasm --no-fail-fast
      - name: Alternate x86 selection feature builds
        if: ${{ !cancelled() }}
        working-directory: compiler
        run: |
          cargo check -p compiler-backend-x86 --no-default-features
          cargo check -p compiler-backend-x86 --no-default-features --features x7-production-generated-add
          cargo check -p compiler-backend-x86 --features x7-typeid-source-dag-optin
