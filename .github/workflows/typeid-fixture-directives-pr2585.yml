# Temporary, source-pinned validation for compiler PR #2585.
name: Validate TypeId fixture directives PR2585
on:
  pull_request:
    paths:
      - '.github/workflows/typeid-fixture-directives-pr2585.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  typeid-fixture-directives:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CARGO_INCREMENTAL: '0'
      SOURCE_SHA: 34ce61b0b26544f7f133adfeb174049764bbd419
    steps:
      - name: Checkout exact compiler source
        uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 34ce61b0b26544f7f133adfeb174049764bbd419
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Verify source pin and isolate optimizer workspace
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C compiler rev-parse HEAD)" = "$SOURCE_SHA"
          cat > compiler/Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir", "crates/opt", "crates/backend", "crates/backend-x86"]
          EOF
          rm -f compiler/Cargo.lock
          rustc --version
          cargo --version
      - name: Cache optimizer dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: typeid-fixture-directives
      - name: Run fixture runner and native verifier/parity checks
        working-directory: compiler
        shell: bash
        run: |
          set -euo pipefail
          cargo test -p compiler-opt --test ir_fixture_directives -- --nocapture
          cargo test -p compiler-opt --test native_v3_fixture_inventory -- --nocapture
          cargo test -p compiler-opt --test native_verifier_fixture_matrix -- --nocapture
      - name: Strict fixture runner lint
        working-directory: compiler
        run: cargo clippy -p compiler-opt --test ir_fixture_directives -- -D warnings
