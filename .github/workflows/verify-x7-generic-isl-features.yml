name: Survey X7 generic Intel ISL semantic blockers
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/verify-x7-generic-isl-features.yml']
permissions:
  contents: read
jobs:
  census:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 06069e143aebb63db29a2e3c3697ccb86b00d85f
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Record exact source revision and run generic tests
        run: |
          set -euo pipefail
          git rev-parse HEAD
          python3 -m unittest discover -s tools -p 'test_x86_isl_semantic_core.py' -v
          python3 -m unittest discover -s tools -p 'test_x86_isl_generic_expr.py' -v
          python3 -m unittest discover -s tools -p 'test_x86_isl_semantic_features.py' -v
          python3 -m unittest discover -s tools -p 'test_x86_isl_semantic_corpus_report.py' -v
      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: 5.4.1
      - name: Build pinned Intel AST exporter
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq libgmp-dev pkg-config cmake libz3-dev
          git clone --filter=blob:none https://github.com/IntelLabs/isa-tools.git /tmp/isa-tools
          git -C /tmp/isa-tools checkout 16260979137c38339743a04b7fd5d9f0fa8a6ee5
          git -C /tmp/isa-tools submodule update --init --recursive
          cp tools/x86_isl_ast_export.ml tools/x86_isl_ast_json.ml /tmp/isa-tools/bin/
          cat >> /tmp/isa-tools/bin/dune <<'EOF'
          (executable
           (name x86_isl_ast_export)
           (modules x86_isl_ast_export x86_isl_ast_json)
           (libraries libISA yojson))
          EOF
          cd /tmp/isa-tools
          opam install --switch="$GITHUB_WORKSPACE" . --deps-only --yes
          opam exec --switch="$GITHUB_WORKSPACE" -- dune build bin/x86_isl_ast_export.exe
      - name: Fetch pinned Intel instruction corpus
        run: |
          set -euo pipefail
          git clone --filter=blob:none --sparse https://github.com/intel/SDM.git /tmp/intel-sdm
          git -C /tmp/intel-sdm fetch --depth 1 origin 35eface1b7ee003a1cda95005ec5fd83de658a64
          git -C /tmp/intel-sdm checkout 35eface1b7ee003a1cda95005ec5fd83de658a64
          git -C /tmp/intel-sdm sparse-checkout set data/instruction
      - name: Parse pinned full corpus and export semantic feature census
        run: |
          set -euo pipefail
          python3 tools/x86_isl_corpus.py --xml-dir /tmp/intel-sdm/data/instruction \
            --parser /tmp/isa-tools/_build/default/bin/x86_isl_ast_export.exe \
            --out /tmp/x7-isl-coverage.json \
            --semantic-features-report /tmp/x7-isl-features.json \
            --require-parsed 1641 \
            --parser-revision 16260979137c38339743a04b7fd5d9f0fa8a6ee5 \
            --corpus-revision 35eface1b7ee003a1cda95005ec5fd83de658a64
          python3 - <<'PY'
          import json
          coverage=json.load(open('/tmp/x7-isl-coverage.json'))
          feats=json.load(open('/tmp/x7-isl-features.json'))
          assert coverage['summary']['syntax_accepted']==1641
          assert feats['operations_scanned']==1641
          assert feats['ast_nodes_scanned'] > feats['operations_scanned']
          assert feats['basis'].find('NOT executable semantic coverage')>=0
          print('X7_GENERIC_FEATURE_TOP_HELPERS',sorted(
              feats['operations_with_helper'].items(),key=lambda kv:(-kv[1],kv[0]))[:35])
          print('X7_GENERIC_FEATURE_TOP_BLOCKERS',sorted(
              feats['operations_with_potential_blocker'].items(),
              key=lambda kv:(-kv[1],kv[0]))[:35])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: x7-generic-isl-semantic-feature-report
          path: |
            /tmp/x7-isl-coverage.json
            /tmp/x7-isl-features.json
          if-no-files-found: ignore
