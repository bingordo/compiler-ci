name: Temporary source legacy grep audit
on:
  pull_request:
    paths: ['.github/workflows/temp-source-legacy-grep.yml']
permissions:
  contents: read
jobs:
  grep:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      SOURCE_SHA: 2240786c735ab40f8512f87c549aa9fe51b5f4b9
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: ${{ env.SOURCE_SHA }}
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Exact SHA and full non-doc source legacy inventory
        working-directory: compiler
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          python3 - <<'PY'
          import collections, subprocess
          paths = ["*.rs", "*.py", "*.toml", "*.c", "*.h", "*.cc", "*.cpp", "*.hpp", "*.sh", "*.yml", "*.yaml", "*.json", ":(exclude)docs/**", ":(exclude)**/docs/**"]
          proc = subprocess.run(["git","grep","-in","-i","legacy","--",*paths],capture_output=True,text=True)
          if proc.returncode not in (0,1):
              raise RuntimeError(proc.stderr)
          rows = proc.stdout.splitlines()
          counts = collections.Counter(row.split(":",1)[0] for row in rows)
          print(f"TOTAL_MATCHES={len(rows)} FILES={len(counts)}")
          print("FILES_WITH_MATCHES (count path):")
          for name,n in counts.most_common():
              print(n,name)
          print("MATCHING_LINES (first 700, source only, no docs):")
          for row in rows[:700]:
              print(row[:500])
          print(f"TRUNCATED={max(0,len(rows)-700)}")
          production = [row for row in rows if (row.startswith("crates/") or row.startswith("tools/")) and "/src/" in row.split(":",1)[0] and "/tests/" not in row.split(":",1)[0]]
          comment_hits = [row for row in production if row.split(":",2)[2].lstrip().startswith(("//","/*","*","#"))]
          print(f"PRODUCTION_SOURCE_MATCHES={len(production)} COMMENT_MATCHES={len(comment_hits)}")
          print("PRODUCTION_SOURCE_COMMENTS (all non-doc, src tree):")
          for row in comment_hits:
              print(row[:500])
          print("PRODUCTION_OPT_AND_DRIVER_NONCOMMENT (all):")
          for row in production:
              path, n, source = row.split(":",2)
              if (path.startswith("crates/opt/src/") or path.startswith("crates/driver/src/") or "/mini-c-driver/src/" in path or "/edg-driver/src/" in path) and not source.lstrip().startswith(("//","/*","*","#")):
                  print(row[:500])
          PY
