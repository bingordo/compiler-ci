name: Temporary source legacy grep audit
on:
  pull_request:
    paths: ['.github/workflows/temp-source-legacy-grep.yml']
permissions:
  contents: read
jobs:
  grep:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      SOURCE_SHA: 2240786c735ab40f8512f87c549aa9fe51b5f4b9
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: ${{ env.SOURCE_SHA }}
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Exact SHA and full non-doc source legacy inventory
        working-directory: compiler
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          python3 - <<'PY'
          import collections, subprocess
          paths = ["*.rs", "*.py", "*.toml", "*.c", "*.h", "*.cc", "*.cpp", "*.hpp", "*.sh", "*.yml", "*.yaml", "*.json", ":(exclude)docs/**", ":(exclude)**/docs/**"]
          proc = subprocess.run(["git","grep","-in","-i","legacy","--",*paths],capture_output=True,text=True)
          if proc.returncode not in (0,1):
              raise RuntimeError(proc.stderr)
          rows = proc.stdout.splitlines()
          counts = collections.Counter(row.split(":",1)[0] for row in rows)
          print(f"TOTAL_MATCHES={len(rows)} FILES={len(counts)}")
          print("FILES_WITH_MATCHES (count path):")
          for name,n in counts.most_common():
              print(n,name)
          print("MATCHING_LINES (first 700, source only, no docs):")
          for row in rows[:700]:
              print(row[:500])
          print(f"TRUNCATED={max(0,len(rows)-700)}")
          PY
