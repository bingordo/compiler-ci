name: Compiler docs PR 1568 validation
on:
  push:
    branches: [main]
    paths: ['.github/workflows/docs-pr1568-validation.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  docs:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: eb22c3b43c72724c344bf225a12987f9fe0b07fd
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Confirm exact revision
        run: test "$(git -C compiler rev-parse HEAD)" = "eb22c3b43c72724c344bf225a12987f9fe0b07fd"
      - name: Validate Markdown links
        working-directory: compiler
        run: python3 tools/check_doc_links.py
      - name: Test link checker
        working-directory: compiler
        run: python3 -m unittest discover -s tools -p 'test_check_doc_links.py' -v
