name: CI M4.10 exact-source history validation
on:
  pull_request:
    paths: ['.github/workflows/m410-history-validation-1204.yml']
permissions:
  contents: read
jobs:
  corpus-history:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact compiler candidate (never run compiler Actions)
        uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: a6c57f9c0f795570aa7ccd1d2709e4fd0583a1e1
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Verify pinned source and run entire M4.10 corpus suite
        working-directory: compiler
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "a6c57f9c0f795570aa7ccd1d2709e4fd0583a1e1"
          cd tools
          python3 -m unittest -v test_m410_elf_fuzz_corpus
      - name: Check standalone tool compiles
        working-directory: compiler
        run: python3 -m py_compile tools/m410_elf_fuzz_corpus.py tools/test_m410_elf_fuzz_corpus.py
