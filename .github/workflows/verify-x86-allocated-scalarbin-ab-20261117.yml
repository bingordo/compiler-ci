name: pinned x86 allocated scalar ALU runtime A/B
on:
  push:
    branches: [main]
    paths: [.github/workflows/verify-x86-allocated-scalarbin-ab-20261117.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  scalar-alu:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: c0787bdd6a31e50f92b3d8bb35c1f14d6174021b
          path: old
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 9a3e8c7627377085898c43b6b9381df3e2412ed6
          path: new
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Verify exact repository SHA
        run: |
          set -euo pipefail
          test "$(git -C old rev-parse HEAD)" = "c0787bdd6a31e50f92b3d8bb35c1f14d6174021b"
          test "$(git -C new rev-parse HEAD)" = "9a3e8c7627377085898c43b6b9381df3e2412ed6"
          git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            old -> target
            new -> target
          key: x86-allocated-scalar-alu-20261117
      - name: Verify codegen and GCC C11 linked reference
        working-directory: new
        run: |
          set -euo pipefail
          cargo test -p compiler-backend-x86 --lib scalar_alu_ -- --nocapture
          cargo test -p compiler-backend-x86 --lib
          cargo clippy -p compiler-backend-x86 --lib -- -D warnings
          cargo test -p compiler --test x7_s4_rolling_checksum_source -- --nocapture
          cargo test -p compiler --test x86_inline_source_ablation -- --nocapture
      - name: Same-runner ABBA release runtime, GCC checksum and machine mix
        run: |
          set -euo pipefail
          for case in old new new old; do
            index=1
            test -f "$RUNNER_TEMP/$case-1.log" && index=2
            (cd "$case" && cargo test --release -p compiler --test x86_source_runtime_performance -- --ignored --nocapture) 2>&1 | tee "$RUNNER_TEMP/$case-$index.log"
          done
          for case in old new; do
            for index in 1 2; do
              file="$RUNNER_TEMP/$case-$index.log"
              grep -q 'X86_RUNTIME_FUNCTION mode=mini_default symbol=scan>' "$file"
              grep -q 'X86_SOURCE_RUNTIME mode=mini_default workload=combined ' "$file"
              grep -q 'X86_SOURCE_RUNTIME mode=gcc_O2 workload=combined ' "$file"
            done
          done
          {
            echo "### Pinned x86 allocated scalar ALU A/B"
            echo "Baseline SHA: c0787bdd6a31e50f92b3d8bb35c1f14d6174021b"
            echo "Optimized SHA: 9a3e8c7627377085898c43b6b9381df3e2412ed6"
            for case in old new; do
              for index in 1 2; do
                echo "#### $case repetition $index"
                grep -E 'X86_RUNTIME_FUNCTION mode=mini_default symbol=scan>|X86_SOURCE_RUNTIME mode=(mini_default|gcc_O2) workload=(combined|batch|delta) ' "$RUNNER_TEMP/$case-$index.log" || true
              done
            done
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: x86-allocated-scalar-alu-ab
          path: ${{ runner.temp }}/*-?.log
          if-no-files-found: ignore
