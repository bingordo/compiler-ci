name: Validate native loop-trap variants PR2724
on:
  pull_request:
    paths:
      - '.github/workflows/validate-native-loop-trap-2724.yml'
permissions:
  contents: read
jobs:
  loop-trap:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      SOURCE_SHA: 6eb4f460b9f3103f9235c4205fc49bdf7bd57dca
      CARGO_INCREMENTAL: '0'
      CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
    steps:
      - name: Checkout exact compiler candidate
        uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: ${{ env.SOURCE_SHA }}
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Verify source and isolate native workspace
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C compiler rev-parse HEAD)" = "$SOURCE_SHA"
          cat > compiler/Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir", "crates/opt", "crates/backend", "crates/backend-x86"]
          EOF
          rm -f compiler/Cargo.lock
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: native-loop-trap-2724
      - name: Assert native-only input and IR boundary
        working-directory: compiler
        run: |
          set -euo pipefail
          ! grep -qE 'typeid_executable_fixture|typed_fixture|from_legacy' crates/opt/tests/loop_trap_semantics.rs
          python3 tools/ir_consumer_inventory.py --check-production
      - name: Compile tests and optimizer
        working-directory: compiler
        run: cargo check -p compiler-opt --lib --test loop_trap_semantics
      - name: Check all 5 trap variants and independent oracles
        working-directory: compiler
        run: cargo test -p compiler-opt --test loop_trap_semantics -- --nocapture
