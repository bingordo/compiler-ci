name: Verify PR421 TypeId dead phi and linear CFG
on:
  push:
    branches: [ci/pr421-typeid-dead-phi-linear]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 56c1101ec1c5e1887061af6a0821883832961499
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Verify exact compiler source revision
        run: test "$(git -C compiler rev-parse HEAD)" = "56c1101ec1c5e1887061af6a0821883832961499"
      - name: Restrict to self-contained compiler core/native crates
        run: |
          cat > compiler/Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir", "crates/opt", "crates/backend", "crates/backend-x86"]
          EOF
          rm -f compiler/Cargo.lock
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: typeid-dead-phi-linear-pr421
          cache-workspace-crates: 'true'
      - name: Focused TypeId dead phi linear and core replay native
        working-directory: compiler
        run: cargo test -p compiler-opt --test typed_phi_dead_linear --test typed_phi_cfg --test typed_core_pipeline --test ir_replay_cli -- --nocapture
      - name: Full self-contained compiler four crate native regression
        working-directory: compiler
        run: cargo test -p compiler-ir -p compiler-opt -p compiler-backend -p compiler-backend-x86
      - name: Strict all-target optimizer Clippy
        working-directory: compiler
        run: cargo clippy -p compiler-opt --all-targets -- -D warnings
