name: IR LTO multi-unit serialization preflight
on:
  push:
    branches: [verify/ir-lto-multiunit-20261114]
    paths:
      - '.github/workflows/ir-lto-multiunit-20261114.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: c969a5f2e92f43a900d427316ee3a12f1131bc33
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Verify exact compiler source
        run: test "$(git -C compiler rev-parse HEAD)" = "c969a5f2e92f43a900d427316ee3a12f1131bc33"
      - name: Limit workspace to compiler IR
        run: |
          cat > compiler/Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir"]
          EOF
          rm -f compiler/Cargo.lock
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: ir-lto-multiunit
      - name: Serialization regression and existing codec tests
        working-directory: compiler
        run: |
          cargo test -p compiler-ir --test native_binary_multiunit_preflight
          cargo test -p compiler-ir --test native_binary_v1
          cargo test -p compiler-ir --test native_binary_corruption_matrix
          cargo test -p compiler-ir --test native_module_text_v3
          cargo clippy -p compiler-ir --tests -- -D warnings
