name: X7 prepared proof plan regression
on:
  pull_request:
    paths: ['.github/workflows/verify-x7-prepared-proof-plan.yml']
permissions:
  contents: read
jobs:
  proof-plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: f03e30eac22b740e12036257c5c8db7cafe5dce3
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Verify exact source and run worker regressions
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = f03e30eac22b740e12036257c5c8db7cafe5dce3
          python3 -m venv /tmp/x7-z3
          /tmp/x7-z3/bin/python -m pip install --disable-pip-version-check 'z3-solver==4.13.4.0'
          export PATH=/tmp/x7-z3/bin:$PATH
          for suite in test_x86_isl_operation_proof_worker.py test_x7_vex_scalar_proof_batch.py test_x86_isl_operation_model_census.py test_x86_isl_b3_record_worker.py test_x86_isl_packed_batch.py; do
            python -m unittest discover -s tools -p "$suite" -v
          done
