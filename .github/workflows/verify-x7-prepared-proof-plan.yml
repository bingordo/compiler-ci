name: X7 prepared proof plan regression
on:
  pull_request:
    paths: ['.github/workflows/verify-x7-prepared-proof-plan.yml']
permissions:
  contents: read
jobs:
  proof-plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 394f8d5e394f9a5479315c79cef0f951ecd3b20f
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Verify exact source
        run: test "$(git rev-parse HEAD)" = 394f8d5e394f9a5479315c79cef0f951ecd3b20f
      - name: Validate generic selected machine recipe through allocation and emission
        run: |
          set -euo pipefail
          cat > Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir", "crates/ir-macros", "crates/opt", "crates/backend", "crates/backend-x86"]
          EOF
          rm -f Cargo.lock
          cargo test -p compiler-backend-x86 --lib root_index_tests -- --nocapture
          cargo test -p compiler-backend-x86 --lib -- --nocapture
          cargo check -p compiler-backend-x86 --no-default-features
