name: X7 prepared proof plan regression
on:
  pull_request:
    paths: ['.github/workflows/verify-x7-prepared-proof-plan.yml']
permissions:
  contents: read
jobs:
  proof-plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 6c3a9fe949ca2b0ad4e9478c83d92f995e04aaea
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Verify exact source and run worker regressions
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 6c3a9fe949ca2b0ad4e9478c83d92f995e04aaea
          python3 -m venv /tmp/x7-z3
          /tmp/x7-z3/bin/python -m pip install --disable-pip-version-check 'z3-solver==4.13.4.0'
          export PATH=/tmp/x7-z3/bin:$PATH
          for suite in test_x7_generic_shift_semantics.py test_x7_ip2_pure_dag_candidates.py test_x7_ip2_ir_equivalence.py test_x86_isl_smt_verify.py test_x86_isl_operation_proof_worker.py test_x7_vex_scalar_proof_batch.py test_x86_isl_operation_model_census.py test_x86_isl_b3_record_worker.py test_x86_isl_packed_batch.py; do
            python -m unittest discover -s tools -p "$suite" -v
          done
