name: Temporary Mini-C C99 static addresses 292
on:
  pull_request:
    paths: ['.github/workflows/temp-mini-c-c99-static-292.yml']
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/mini-c
          ref: d01074fb4f28d96d3c8bad4f751270c7558ae512
          persist-credentials: false
      - run: git rev-parse HEAD
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/debug
          key: mini-c-native-ubuntu-static-292
          restore-keys: |
            mini-c-native-
      - run: cargo test -p mini-c-syntax -p mini-c-sema -p mini-c-cranelift
      - run: cargo clippy -p mini-c-sema --all-targets -- -D warnings
      - name: GCC differential runtime
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/static.c" <<'EOF'
          struct N { int x; };
          struct S { int pad; struct N n; int a[3]; };
          struct S s={1,{7},{2,3,4}};
          int *p=&s.n.x;
          int *q=s.a;
          int *r[2]={&s.pad,&s.n.x};
          int *t=&*(&s.pad);
          int main(void) {
              if (*p!=7 || q[2]!=4 || *r[0]!=1 || *r[1]!=7 || t!=r[0]) return 1;
              *p=13;
              return s.n.x!=13 || *r[1]!=13;
          }
          EOF
          gcc -std=c99 -pedantic-errors "$RUNNER_TEMP/static.c" -o "$RUNNER_TEMP/gcc-static"
          "$RUNNER_TEMP/gcc-static"
          cargo run -q -p mini-c-cranelift -- --cpp=none --emit-obj "$RUNNER_TEMP/static.o" "$RUNNER_TEMP/static.c"
          gcc "$RUNNER_TEMP/static.o" -o "$RUNNER_TEMP/mini-static"
          "$RUNNER_TEMP/mini-static"
          readelf -r "$RUNNER_TEMP/static.o"
