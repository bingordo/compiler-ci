# Diagnose unexpectedly long integrated x86 AL05 suite for PR #2763.
# Each stage is independent, source-pinned and hard bounded.
name: IR PR2763 AL05 x86 isolated regression
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ir-pr2763-al05-x86-isolate-20261122.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  al05-x86-isolated:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    env:
      SOURCE_SHA: bf9dbdb6e80c86473438672a3a782ca7bbe3e0cb
      CARGO_INCREMENTAL: '0'
      CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
    steps:
      - name: Check out exact compiler integration candidate
        uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: ${{ env.SOURCE_SHA }}
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Isolate source revision
        run: |
          set -euo pipefail
          test "$(git -C compiler rev-parse HEAD)" = "$SOURCE_SHA"
          cat > compiler/Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir", "crates/opt", "crates/backend", "crates/backend-x86", "crates/backend-aarch64"]
          EOF
          rm -f compiler/Cargo.lock
      - name: Cache compiler IR build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: ir-pr2763-al05-x86-isolate
      - name: P9 native x86 differential
        working-directory: compiler
        shell: bash
        run: |
          set -euo pipefail
          echo "AL05_ISOLATE START al05_p9_mixed_native_x86_elf_and_gas_match_c11_reference"
          timeout --signal=TERM --kill-after=10s 180s cargo test -p compiler-opt --test al05_p9_mixed_native_bridge al05_p9_mixed_native_x86_elf_and_gas_match_c11_reference -- --exact --nocapture
          echo "AL05_ISOLATE PASS al05_p9_mixed_native_x86_elf_and_gas_match_c11_reference"
      - name: P14 generated native x86 differential
        working-directory: compiler
        shell: bash
        run: |
          set -euo pipefail
          echo "AL05_ISOLATE START al05_p14_generated_dag_native_x86_elf_and_gas_match_c11"
          timeout --signal=TERM --kill-after=10s 180s cargo test -p compiler-opt --test al05_p9_mixed_native_bridge al05_p14_generated_dag_native_x86_elf_and_gas_match_c11 -- --exact --nocapture
          echo "AL05_ISOLATE PASS al05_p14_generated_dag_native_x86_elf_and_gas_match_c11"
      - name: P15 generated native x86 differential
        working-directory: compiler
        shell: bash
        run: |
          set -euo pipefail
          echo "AL05_ISOLATE START al05_p15_generated_phi_extremes_native_x86_elf_and_gas_match_c11"
          timeout --signal=TERM --kill-after=10s 180s cargo test -p compiler-opt --test al05_p9_mixed_native_bridge al05_p15_generated_phi_extremes_native_x86_elf_and_gas_match_c11 -- --exact --nocapture
          echo "AL05_ISOLATE PASS al05_p15_generated_phi_extremes_native_x86_elf_and_gas_match_c11"
      - name: P16 coverage native x86 differential
        working-directory: compiler
        shell: bash
        run: |
          set -euo pipefail
          echo "AL05_ISOLATE START al05_p16_coverage_guided_native_x86_elf_gas_c11"
          timeout --signal=TERM --kill-after=10s 180s cargo test -p compiler-opt --test al05_p9_mixed_native_bridge al05_p16_coverage_guided_native_x86_elf_gas_c11 -- --exact --nocapture
          echo "AL05_ISOLATE PASS al05_p16_coverage_guided_native_x86_elf_gas_c11"
