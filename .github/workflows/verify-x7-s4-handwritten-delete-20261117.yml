# Temporary source-pinned verification of the X7 S4 final mixed LTO default.
name: X7 S4 delete handwritten x86 TypeId physical emitter
on:
  pull_request:
    paths:
      - '.github/workflows/verify-x7-s4-handwritten-delete-20261117.yml'
permissions:
  contents: read
jobs:
  shared-only-source-abi-elf-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    steps:
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.CI_KEY }}
      - name: Trust GitHub SSH
        run: ssh-keyscan github.com >> ~/.ssh/known_hosts
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 7c4f6f20547845a14ea9a15915832b686d4f1026
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Verify exact candidate source revision
        run: test "$(git -C compiler rev-parse HEAD)" = "7c4f6f20547845a14ea9a15915832b686d4f1026"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: x7-s4-mixed-lto-default
      - name: Focused real C GCC executable oracles, archives, ordered LTO, malformed sidecars
        working-directory: compiler
        shell: bash
        run: |
          set -euo pipefail
          echo X7_S4_REMAINING_LEGACY_RUST_IMPORT_FILES_BEGIN
          git grep -l 'native_typeid' -- crates/backend-x86/tests crates/backend-x86/src crates/driver/src tools/edg-driver/src || true
          echo X7_S4_REMAINING_LEGACY_RUST_IMPORT_FILES_END
          cargo test -p compiler-backend-x86 --tests --no-run
          cargo test -p compiler --tests --no-run
          cargo test -p compiler --test x7_s4_mixed_lto_shared_default -- --nocapture
          for suite in lto_mixed_link lto_generated_multitu lto_coemit lto_cli \
            lto_elf_visibility x7_s4_selected_lto x7_s4_pragmatic_driver_cutover \
            x7_s4_shared_default x7_s4_selected_ir_replay; do
            cargo test -p compiler --test "$suite"
          done
          cargo test -p compiler-backend-x86 --test x7_s4_generic_trait_shared_default
          cargo test -p compiler-backend-x86 --lib
          cargo test -p compiler-backend-x86 --no-default-features --lib
          echo X7_S4_HANDWRITTEN_REMOVAL_FOCUSED_GREEN
      - name: All driver integration except 4 independently proven baseline failures
        working-directory: compiler
        shell: bash
        run: |
          set -euo pipefail
          # The four excluded native-only failures predate this default cutover,
          # independently verified on old main in compiler-ci #44195215513
          # and retained unchanged under compiler issue #2091.
          cargo test --no-fail-fast -p compiler --tests -- --test-threads=4 \
            --skip checked_globals_reject_unsupported_shapes \
            --skip oberon_begin_constructor_survives_v3_v5_machine_reload_and_link \
            --skip x86_loaded_typeid_physical_dump_matches_normal_elf_and_rejects_modes \
            --skip mini_c_source_machine_module_v5_and_v3_exact_elf_replay \
            --skip m10_checked_decimal_float_literals_never_get_integer_native_codegen \
            --skip unsupported_explicit_inline_policy_does_not_fall_back_to_legacy \
            --skip cli_rejects_not_yet_lowered_checked_operators_without_partial_objects
          echo X7_S4_HANDWRITTEN_REMOVAL_DRIVER_REMAINING_GREEN
      - name: 48 source modes and 17424 independent GCC C11 comparisons
        working-directory: compiler
        shell: bash
        run: |
          set -euo pipefail
          cargo build -p compiler
          python3 tools/x7_s4_executable_source_gate.py \
            --compiler target/debug/compiler \
            --source-sha 7c4f6f20547845a14ea9a15915832b686d4f1026 \
            --out ../x7-s4-deletion-source-regression \
            --scales 8 24 48 \
            --languages mini_c oberon \
            --modes plain framed pic pic_framed \
            --groups 3
          echo X7_S4_HANDWRITTEN_REMOVAL_SOURCE_GCC_GREEN
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: x7-s4-deletion-source-regression
          path: x7-s4-deletion-source-regression
          if-no-files-found: warn
