# Temporary exact-source T5 generated CFG native input identity proof gate.
name: Temporary Alive historical replay and native reference
on:
  pull_request:
    paths:
      - '.github/workflows/temporary-alive-historical-replay-20261128.yml'
permissions:
  contents: read
jobs:
  historical-replay-native:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      SOURCE_SHA: b58285e675278e9940c118220afc60056c51ad1a
      CARGO_INCREMENTAL: '0'
      CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
    steps:
      - name: Checkout exact compiler source
        uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: ${{ env.SOURCE_SHA }}
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Verify exact source and isolate optimizer
        run: |
          set -euo pipefail
          test "$(git -C compiler rev-parse HEAD)" = "$SOURCE_SHA"
          echo "Exact compiler source SHA: $SOURCE_SHA"
          cat > compiler/Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir", "crates/opt", "crates/backend", "crates/backend-x86", "crates/backend-aarch64"]
          EOF
          rm -f compiler/Cargo.lock
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: temporary-alive-historical-replay
      - name: Focused Clippy
        working-directory: compiler
        run: cargo clippy -p compiler-opt --test alive_lite -- -D clippy::all -A clippy::too_many_arguments -A clippy::needless_lifetimes -A clippy::empty_line_after_doc_comments -A clippy::collapsible_if -A clippy::collapsible_match -A clippy::needless_range_loop -A clippy::needless_borrows_for_generic_args -A clippy::type_complexity -A clippy::unnecessary_lazy_evaluations -A clippy::duplicate_mod -A clippy::needless_borrow
      - name: Ordinary Alive-lite including saved v1 and native v3 replay
        working-directory: compiler
        run: cargo test -p compiler-opt --test alive_lite -- --nocapture
      - name: Install Z3
        run: sudo apt-get update -qq && sudo apt-get install -y z3
      - name: Saved replay and affected TypeId real Z3 proofs
        working-directory: compiler
        run: |
          set -euo pipefail
          for test in \
            prove_saved_replay_fixtures_against_real_passes \
            prove_seeded_cfg_mutations_against_actual_passes \
            al01_direct_typeid_proves_changed_cse_and_finds_phi_trap_mutants \
            al02_typeid_stage_proof_ledger \
            al02_source_pipeline_composed_z3_proofs \
            prove_select_phi_pre_sccp_real_transformations \
            prove_sccp_branch_directions_and_reject_wrong_arm \
            prove_cfg_phi_and_real_pre_transforms; do
            cargo test -p compiler-opt --test alive_lite "$test" -- --ignored --nocapture --test-threads=1
          done
