# Source-pinned validation of explicit checked Mini-C ELF COMDAT groups.
name: Mini-C PR3050 source owned COMDAT
on:
  push:
    branches: [validate/minic-pr3050-source-comdat-20261124]
    paths:
      - '.github/workflows/minic-pr3050-source-comdat-20261124.yml'
  workflow_dispatch:
permissions:
  contents: read
  statuses: write
jobs:
  source-comdat:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      SOURCE_SHA: b8c0e4e44e29bb6777b5a6b87a6ceba305df283d
      CARGO_INCREMENTAL: '0'
      CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
    steps:
      - name: Checkout exact compiler PR head
        uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: ${{ env.SOURCE_SHA }}
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Verify checkout revision and native tools
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C compiler rev-parse HEAD)" = "$SOURCE_SHA"
          git -C compiler log -1 --oneline
          readelf --version | head -n 1
          gcc --version | head -n 1
      - name: Authenticate private Mini-C and Oberon dependencies
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.CI_KEY }}
      - name: Reuse compiler Cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: minic-pr3050-source-comdat
      - name: Native source COMDAT and v9/v13 group-aware ELF/GCC oracles
        working-directory: compiler
        shell: bash
        run: |
          set -euo pipefail
          cargo test -p compiler --test lto_source_comdat -- --nocapture
      - name: Existing native LTO source, ELF and canonical metadata regressions
        working-directory: compiler
        shell: bash
        run: |
          set -euo pipefail
          cargo test -p compiler --test lto_binary_v2_source -- --nocapture
          cargo test -p compiler --test lto_binary_v2_metadata_source -- --nocapture
          cargo test -p compiler --test lto_source_sidecar -- --nocapture
          cargo test -p compiler --test lto_coemit -- --nocapture
          cargo test -p compiler --test lto_common_elf -- --nocapture
          cargo test -p compiler --test lto_elf_visibility -- --nocapture
          cargo test -p compiler-ir --test lto_binary_v2_metadata -- --nocapture
          cargo test -p compiler-ir --test lto_target_envelope -- --nocapture
      - name: Driver and Mini-C build plus targeted strict Clippy
        working-directory: compiler
        shell: bash
        run: |
          set -euo pipefail
          cargo check -p compiler --bin compiler
          cargo check -p compiler-mini-c
          cargo clippy -p compiler --test lto_source_comdat -- -D clippy::all -A clippy::empty_line_after_doc_comments -A clippy::collapsible_if -A clippy::needless_borrows_for_generic_args
      - name: Report exact-source CI result on workflow commit
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_OUTCOME: ${{ job.status }}
        run: |
          case "$JOB_OUTCOME" in
            success) state=success ;;
            cancelled) state=error ;;
            *) state=failure ;;
          esac
          gh api -X POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state="$state" \
            -f context="candidate/minic-pr3050-source-comdat" \
            -f description="PR3050 exact compiler SHA $SOURCE_SHA" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
