name: Verify T5 SMT selected LEA compatibility fix
on:
  push:
    branches: [main]
    paths: ['.github/workflows/verify-t5-lea-symbolic-compat.yml']
permissions:
  contents: read
jobs:
  t5-smt:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: fix/t5-symbolic-lea-indexed-20261102
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Install independent SMT solver
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq z3
          z3 --version
      - name: Isolate core compiler
        run: |
          cat > Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir","crates/opt","crates/backend","crates/backend-x86"]
          EOF
          rm -f Cargo.lock
      - uses: Swatinem/rust-cache@v2
        with:
          key: t5-symbolic-lea-proof
      - name: Prove selected signed scaled offsets with Z3 and run native T5
        run: |
          set -euo pipefail
          git rev-parse HEAD
          cargo test -p compiler-backend-x86 --test t5_x86_semantics t5_selected_x86_symbolic_flags_widths_and_addresses -- --ignored --nocapture
          cargo test -p compiler-backend-x86 --test t5_x86_semantics t5_selected_cmp_flags_and_register_widths -- --nocapture
          cargo test -p compiler-backend-x86 --test t5_x86_semantics t5_selected_native_elf_and_assembly_match_independent_c -- --nocapture
          echo T5_LEA_SMT status=PASS
