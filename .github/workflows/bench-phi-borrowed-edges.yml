name: One-off borrowed phi column validation
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/bench-phi-borrowed-edges.yml'
permissions:
  contents: read
jobs:
  validate:
    if: github.head_ref == 'bench/phi-borrowed-edges' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 139ef0a2ff00d7024e81e07a6f340203dedcd5f9
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: borrowed-phi-columns
      - name: Exact head optimizer validation
        working-directory: compiler
        run: |
          set -euo pipefail
          git rev-parse HEAD
          git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
          cargo test --release -p compiler-opt --lib
          cargo clippy -p compiler-opt --lib -- -D warnings
