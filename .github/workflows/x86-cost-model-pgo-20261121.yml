name: x86 executable CPU cost model and PGO schema
on:
  pull_request:
    paths:
      - '.github/workflows/x86-cost-model-pgo-20261121.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  shared-and-x86-unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: d77ef6fcc93ac134014e6b28f33b19c070927ded
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - run: |
          set -euo pipefail
          test "$(git -C compiler rev-parse HEAD)" = "d77ef6fcc93ac134014e6b28f33b19c070927ded"
          git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: x86-real-cost-backend-20261121
      - name: Shared cost/PGO counter and full x86 backend tests
        working-directory: compiler
        run: |
          set -euo pipefail
          cargo test -p compiler-backend --lib
          cargo test -p compiler-backend-x86 --lib
      - name: Disable x86 optional forms and scoped Clippy
        working-directory: compiler
        run: |
          set -euo pipefail
          cargo check -p compiler-backend-x86 --no-default-features
          # Existing unrelated compiler-opt unused-imports,
          # ASM3 helper dead code, and two previous exceptions.
          cargo clippy -p compiler-backend -p compiler-backend-x86 --lib -- -D warnings -A unused-imports -A dead-code -A unused-variables -A clippy::empty_line_after_doc_comments
  native-source-and-policy:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: d77ef6fcc93ac134014e6b28f33b19c070927ded
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - run: |
          set -euo pipefail
          test "$(git -C compiler rev-parse HEAD)" = "d77ef6fcc93ac134014e6b28f33b19c070927ded"
          git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: x86-real-cost-native-20261121
      - name: CPU-cost native selected TypeId ELF/GAS/GCC oracle
        working-directory: compiler
        run: cargo test -p compiler --test x86_cost_selection_source -- --nocapture
      - name: Preserve read-only source telemetry and source A/B
        working-directory: compiler
        run: cargo test -p compiler --test x86_late_cost_source -- --nocapture
      - name: Native long rolling-checksum shared machine oracle
        working-directory: compiler
        run: cargo test -p compiler --test x7_s4_rolling_checksum_source -- --nocapture
