          grep -qE '^[[:space:]]+addi x[0-9]+, x[0-9]+, 100$' /tmp/rv64_memo_over.s
          grep -qE '^[[:space:]]+addi x[0-9]+, x[0-9]+, 18$' /tmp/rv64_memo_shared.s
          grep -qE '^[[:space:]]+addi x[0-9]+, x[0-9]+, 18$' /tmp/rv64_memo_phi.s
      - name: Execute recursive depth, live sharing, overflow and both PHI arms on QEMU
        run: |
