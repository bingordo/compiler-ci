            li t0, 50
            bne a0, t0, fail4
            li a0, 7
            li a1, 18
            call rv64_memo_over
            li t0, 2185
            bne a0, t0, fail5
            li a0, 7
            li a1, 18
            call rv64_memo_shared
            li t0, 141
            bne a0, t0, fail6
            li a0, 7
            li a1, 18
            call rv64_memo_phi
            li t0, 55
            bne a0, t0, fail7
            li a0, 20
            li a1, 6
            call rv64_memo_phi
            li t0, -56
            bne a0, t0, fail8
