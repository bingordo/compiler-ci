name: verify exact x86 ALU and ABI measured source variants
on:
  push:
    branches: [ci/x86-alu-abi-audit-20261107]
permissions:
  contents: read
jobs:
  profiles:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: f6b457c69b536b78a4bde689c9c909020f80515f
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Review regenerated exact x86 form catalog
        working-directory: compiler
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "f6b457c69b536b78a4bde689c9c909020f80515f"
          python3 tools/regen_x86_forms.py --check
      - name: Import CPU-specific 127 distinct full-XED identities from source checksum
        working-directory: compiler
        run: |
          set -euo pipefail
          curl -fsSL --retry 2 --connect-timeout 15 --max-time 180 https://uops.info/instructions.xml -o /tmp/instructions.xml
          echo 'e5e702caaf04c4fc1f75192a9bbe4d8554b3e174f7933a14d124cc33ca677ab3  /tmp/instructions.xml' | sha256sum -c -
          for arch in SKL ZEN4; do
            python3 tools/import_uops_info.py /tmp/instructions.xml --architecture "$arch" \
              --mapping data/x86_uops_variant_mapping.json --output "/tmp/${arch}.json"
            python3 tools/validate_x86_costs.py "/tmp/${arch}.json"
            python3 - "$arch" <<'PY'
          import json,sys
          from pathlib import Path
          arch=sys.argv[1]
          p=json.loads(Path('/tmp',arch+'.json').read_text())
          print('ALU_PROFILE_COVERAGE',arch,len(p['forms']))
          print('ALU_BEGIN_PROFILE',arch)
          print(json.dumps(p,sort_keys=True,indent=2))
          print('ALU_END_PROFILE',arch)
          assert len(p['forms'])==127, (arch,len(p['forms']))
          PY
          done
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: x86-alu-abi-skl-zen4-profiles
          path: /tmp/{SKL,ZEN4}.json
          retention-days: 30
