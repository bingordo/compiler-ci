name: X7 S3.J inspect pinned Intel Subtract helper
on:
  pull_request:
    paths:
      - '.github/workflows/x86-s3j-sub-helper-inspect.yml'
permissions:
  contents: read
jobs:
  inspect-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Download exact Intel definitions and inspect Subtract source
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --retry 2 --max-time 50 \
            'https://raw.githubusercontent.com/intel/SDM/35eface1b7ee003a1cda95005ec5fd83de658a64/data/definitions.xml.gz' \
            -o /tmp/s3j-pinned-definitions.xml.gz
          python3 - <<'PY'
          import gzip,xml.etree.ElementTree as ET,hashlib
          v=open('/tmp/s3j-pinned-definitions.xml.gz','rb').read()
          root=ET.fromstring(gzip.decompress(v))
          print('S3J_DEFINITIONS_SHA256',hashlib.sha256(v).hexdigest())
          for name in ('Subtract','Add'):
              d=[e for e in root.findall('definition') if e.get('name')==name]
              assert len(d)==1, (name,len(d))
              el=d[0]
              print('S3J_SOURCE_HELPER',name,'sha256',hashlib.sha256(ET.tostring(el,encoding='utf-8')).hexdigest())
              print('ATTRS',el.attrib)
              print('CODES_START',name)
              for node in el.find('operation'):
                  if node.tag in ('code','callee','caller'):
                      print(node.tag,repr((node.text or '').strip()))
              print('CODES_END',name)
          PY
