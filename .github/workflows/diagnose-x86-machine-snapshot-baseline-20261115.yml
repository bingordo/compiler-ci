name: Diagnostic baseline for x86 machine snapshot parity
on:
  pull_request:
    paths:
      - '.github/workflows/diagnose-x86-machine-snapshot-baseline-20261115.yml'
permissions:
  contents: read
jobs:
  baseline-snapshot-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Configure SSH for pinned frontends
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.CI_KEY }}
      - name: Trust GitHub SSH
        run: ssh-keyscan github.com >> ~/.ssh/known_hosts
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: de10620427f0a2fdff9b461d905a54d5cba80093
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Verify pristine pre-annotation source
        run: test "$(git -C compiler rev-parse HEAD)" = de10620427f0a2fdff9b461d905a54d5cba80093
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: x86-annotated-baseline-snapshot
      - name: Check whether old snapshot object mismatch predates annotation
        working-directory: compiler
        shell: bash
        run: |
          set -euo pipefail
          if cargo test -p compiler --test typeid_x86_source_machine_dump -- --nocapture > /tmp/snapshot-baseline.log 2>&1; then
            echo "Pristine baseline passes. Do not waive candidate snapshot failure."
            exit 1
          fi
          if ! grep -Fq 'left == right' /tmp/snapshot-baseline.log; then
            cat /tmp/snapshot-baseline.log
            echo "Pristine baseline failure differs from candidate."
            exit 1
          fi
          echo "X86_ANNOTATED_ASM_PREEXISTING_SNAPSHOT_FAILURE_CONFIRMED"
