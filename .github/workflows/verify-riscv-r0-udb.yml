name: Verify RV64 UDB encoding importer and GNU assembler parity
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/verify-riscv-r0-udb.yml']
permissions:
  contents: read
jobs:
  imported-encodings:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 6f31b4d475b03b5fb5aaff03f7273575e7f4787e
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: riscv/riscv-unified-db
          ref: d583fecd3d95841b9d6751f800337d1e2999c3fd
          path: udb
          sparse-checkout: |
            spec/std/isa/inst/I
            spec/std/isa/inst/M
          sparse-checkout-cone-mode: true
      - name: Verify pinned source revisions
        run: |
          test "$(git -C compiler rev-parse HEAD)" = "6f31b4d475b03b5fb5aaff03f7273575e7f4787e"
          test "$(git -C udb rev-parse HEAD)" = "d583fecd3d95841b9d6751f800337d1e2999c3fd"
      - name: Install independent RV64 GNU toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y python3-yaml binutils-riscv64-linux-gnu
      - name: Unit tests and pinned RV64I/M catalog generation
        working-directory: compiler
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tools/tests -p test_riscv_udb_import.py -v
          python3 tools/riscv_udb_import.py \
            --udb-root ../udb \
            --udb-sha d583fecd3d95841b9d6751f800337d1e2999c3fd \
            --manifest data/riscv_udb_rv64_manifest.txt \
            --output data/riscv_udb_r0_catalog.json --check
          python3 - <<'PY'
          import json
          from pathlib import Path
          obj=json.loads(Path('data/riscv_udb_r0_catalog.json').read_text())
          assert obj['coverage']['described'] == 66, obj['coverage']
          assert obj['coverage']['semantic_proven'] == 0
          assert obj['coverage']['selected'] == 0
          print('Pinned RV64I/M catalog descriptors:', obj['coverage']['described'])
          PY
      - name: Compare source-generated encoding bytes against GNU assembler
        working-directory: compiler
        run: |
          set -euo pipefail
          python3 tools/riscv_udb_gas_oracle.py data/riscv_udb_r0_catalog.json
