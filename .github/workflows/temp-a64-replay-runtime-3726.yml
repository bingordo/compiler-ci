name: Temporary AArch64 TypeId replay runtime #3726
on:
  pull_request:
    paths: ['.github/workflows/temp-a64-replay-runtime-3726.yml']
permissions:
  contents: read
jobs:
  a64-replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 24
    env:
      SOURCE_SHA: 1540da2f79486b1daa289773a7b76c2d4537bf17
      COMPILER_TYPEID_REPLAY_AARCH64_QEMU: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: ${{ env.SOURCE_SHA }}
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.CI_KEY }}
      - name: Install cross compiler and user-mode emulator
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc-aarch64-linux-gnu qemu-user
          ssh-keyscan github.com >> ~/.ssh/known_hosts
      - name: Exact-SHA AArch64 source and binary/text replay runtime oracle
        working-directory: compiler
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          cargo test -p compiler --test typeid_ir_dump_replay -- --nocapture
