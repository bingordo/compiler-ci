name: Compiler docs PR 1609 validation
on:
  push:
    branches: [main]
    paths: ['.github/workflows/docs-pr1609-validation.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  docs:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 010e805b673ab754c1b701122323d166e201e1cf
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Confirm exact revision
        run: test "$(git -C compiler rev-parse HEAD)" = "010e805b673ab754c1b701122323d166e201e1cf"
      - name: Validate Markdown links
        working-directory: compiler
        run: python3 tools/check_doc_links.py
      - name: Test link checker
        working-directory: compiler
        run: python3 -m unittest discover -s tools -p 'test_check_doc_links.py' -v
