name: One-off TypeId CSE PR406 validation
on:
  pull_request:
    paths:
      - '.github/workflows/review-typed-cse-pr406.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 69d56faa7bb33d24f1c5743a9a5ca271f73ec08c
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Pin exact source SHA
        run: test "$(git -C compiler rev-parse HEAD)" = "69d56faa7bb33d24f1c5743a9a5ca271f73ec08c"
      - name: Self-contained core workspace
        shell: bash
        run: |
          cat > compiler/Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir", "crates/opt", "crates/backend", "crates/backend-x86"]
          EOF
          rm -f compiler/Cargo.lock
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: review-typed-cse-pr406
      - name: Check typed CSE differential regression
        working-directory: compiler
        run: cargo test -p compiler-opt --test typed_cse -- --nocapture
      - name: Run complete IR and optimizer tests
        working-directory: compiler
        run: cargo test -p compiler-ir -p compiler-opt
      - name: Strict Clippy
        working-directory: compiler
        run: cargo clippy -p compiler-ir -p compiler-opt --all-targets -- -D warnings
