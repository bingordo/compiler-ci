name: S22.3 generated integer mask algebra gates
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/s22-native-integer-generated.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-integer:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out exact compiler PR revision
        uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 0bd3b955df01ef63e9a4d77c141cc2a05fcb0b52
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Pin source and isolate self-contained crates
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C compiler rev-parse HEAD)" = 0bd3b955df01ef63e9a4d77c141cc2a05fcb0b52
          cat > compiler/Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir", "crates/opt"]
          EOF
          rm -f compiler/Cargo.lock
          rustc --version
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: s22-native-integer-generated
      - name: Generate and verify all five native integer widths
        working-directory: compiler
        run: cargo test -p compiler-opt --test generated_native_integer_algebra -- --nocapture
      - name: Generate and verify signed-unsigned comparisons and cast chains
        working-directory: compiler
        run: cargo test -p compiler-opt --test generated_native_cmp_cast -- --nocapture
      - name: Verify generated nested bit masks and SSA-use controls
        working-directory: compiler
        run: cargo test -p compiler-opt --test generated_native_masks -- --nocapture
      - name: Verify preexisting i32 and i64 typed algebra
        working-directory: compiler
        run: cargo test -p compiler-opt --test typed_algebra
      - name: Verify neighboring algebra and native integer semantics
        working-directory: compiler
        run: |
          cargo test -p compiler-opt --lib algebra::tests
          cargo test -p compiler-ir --lib native_int_semantics::tests
      - name: Exhaustive i8 comparison range guards
        working-directory: compiler
        run: cargo test -p compiler-opt --lib native_integer_algebra::tests -- --nocapture
      - name: Strict optimizer Clippy
        working-directory: compiler
        run: cargo clippy -p compiler-opt --all-targets -- -D warnings
