name: TypeId provenance loop and FS1 native fixture acceptance
on:
  push:
    branches: [verify/typeid-provenance-loop-fs1-20261117]
    paths: ['.github/workflows/typeid-provenance-loop-fs1-20261117.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 1a65b79e0ae61bdec914f61d641f3d031c04c04e
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Verify source SHA
        run: test "$(git -C compiler rev-parse HEAD)" = "1a65b79e0ae61bdec914f61d641f3d031c04c04e"
      - name: Isolate IR workspace
        run: |
          cat > compiler/Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir"]
          EOF
          rm -f compiler/Cargo.lock
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: typed-provenance-loop-fs1-20261117
      - name: Verify loop and FS1 independent legacy/native equality and 7 provenance cases
        working-directory: compiler
        run: cargo test -p compiler-ir --test typed_memory_provenance -- --nocapture
      - name: Verify 12 fixed graph canonical/ABI/binary roundtrips and native grammar
        working-directory: compiler
        run: |
          cargo test -p compiler-ir --test native_fixed_verifier_fixtures -- --nocapture
          cargo test -p compiler-ir --test native_fixture_text --test native_module_text_v3 --test native_binary_v1
      - name: Preserve old-format and differential verifier tests
        working-directory: compiler
        run: cargo test -p compiler-ir --test typed_module --test typed_ssa_body --test ssa_typeids --test typed_verifier_generated --test typed_verifier_parity
      - name: Strict scoped Clippy
        working-directory: compiler
        run: cargo clippy -p compiler-ir --no-deps --test typed_memory_provenance --test native_fixed_verifier_fixtures -- -D warnings
