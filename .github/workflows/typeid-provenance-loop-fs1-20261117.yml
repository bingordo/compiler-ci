name: TypeId provenance loop and FS1 legacy baseline export
on:
  push:
    branches: [verify/typeid-provenance-loop-fs1-20261117]
    paths: ['.github/workflows/typeid-provenance-loop-fs1-20261117.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 9832b561d64317cc86faec57a50b0dd1c8d764c6
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Check exact source
        run: test "$(git -C compiler rev-parse HEAD)" = "9832b561d64317cc86faec57a50b0dd1c8d764c6"
      - name: Isolate native IR workspace
        run: |
          cat > compiler/Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir"]
          EOF
          rm -f compiler/Cargo.lock
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: typed-provenance-loop-fs1-20261117
      - name: Export original loop and FS1 native TypeId module canonical bytes
        working-directory: compiler
        run: cargo test -p compiler-ir --test typed_memory_provenance export_original_loop_and_fs1_typeid_modules -- --nocapture
      - name: Preserve full original 7 memory provenance and FS1 negative suites
        working-directory: compiler
        run: cargo test -p compiler-ir --test typed_memory_provenance -- --nocapture
