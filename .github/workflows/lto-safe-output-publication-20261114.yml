name: LTO safe executable publication
on:
  push:
    branches: [verify/lto-safe-output-publication-20261114]
    paths: ['.github/workflows/lto-safe-output-publication-20261114.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  safe-publication:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 5f280ff3827c78b25c983a15f2c6c128b21da958
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Verify source and public frontend dependencies
        run: |
          test "$(git -C compiler rev-parse HEAD)" = "5f280ff3827c78b25c983a15f2c6c128b21da958"
          git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
      - name: Focus driver workspace
        run: |
          cat > compiler/Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir", "crates/opt", "crates/backend", "crates/backend-x86", "crates/backend-aarch64", "crates/driver"]
          EOF
          rm -f compiler/Cargo.lock
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: lto-safe-publication
      - name: Mixed link race and regression tests
        working-directory: compiler
        run: |
          cargo test -p compiler --test lto_mixed_link -- --nocapture
          cargo test -p compiler --test lto_coemit
          cargo test -p compiler --test lto_source_sidecar
      - name: Strict targeted lint
        working-directory: compiler
        run: cargo clippy -p compiler --test lto_mixed_link -- -D warnings
