name: P5d3 checked TypeId callback-only SysV GP varargs
on:
  push:
    branches: [test/p5d3-callback-only-typeid-20261111]
  pull_request:
    paths: ['.github/workflows/verify-p5d3-callback-only.yml']
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 23
    env:
      CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: da96f83df14ca66d907916fd9fd0e558b32cd217
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Check source SHA and Mini-C upstream URL
        run: |
          set -euo pipefail
          test "$(git -C compiler rev-parse HEAD)" = "da96f83df14ca66d907916fd9fd0e558b32cd217"
          git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: p5d3-callback-typeid
      - name: Execute exact GCC va_arg callback-only source and complete compiler binary tests
        working-directory: compiler
        run: |
          set -euo pipefail
          cargo test -p compiler --bin compiler m47_p5d3_callback_only -- --nocapture 2>&1 | tee "$RUNNER_TEMP/p5d3.log"
          grep -F 'm47_p5d3_callback_only_source_without_externals_executes_gcc_va_arg ... ok' "$RUNNER_TEMP/p5d3.log"
          cargo test -p compiler --bin compiler
          cargo clippy -p compiler --bin compiler -- -D warnings
      - name: Retain logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: p5d3-failure
          path: ${{ runner.temp }}/p5d3.log
          if-no-files-found: ignore
