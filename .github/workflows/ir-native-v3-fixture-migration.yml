# Validate fixed-graph TypeId v3 migrations in compiler-ci only.
# The candidate SHA is intentionally immutable for reproducible acceptance.
name: IR native v3 fixture migration validation
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ir-native-v3-fixture-migration.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-v3-optimizer:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
      SOURCE_SHA: c5419fc85f310c6e6a92566a51c35efdf334de06
    steps:
      - name: Check out exact compiler migration candidate
        uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: c5419fc85f310c6e6a92566a51c35efdf334de06
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Verify source and isolate core workspace
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C compiler rev-parse HEAD)" = "$SOURCE_SHA"
          cat > compiler/Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir", "crates/opt", "crates/backend", "crates/backend-x86"]
          EOF
          rm -f compiler/Cargo.lock
          rustc --version
          cargo --version
      - name: Cache core build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: ir-v3-fixtures
      - name: Run native fixture and optimizer regression tests
        working-directory: compiler
        run: |
          set -euo pipefail
          cargo test -p compiler-opt --test typed_array_fold -- --nocapture
          cargo test -p compiler-opt --test typed_phi_cfg -- --nocapture
          cargo test -p compiler-opt --test typed_phi_dead_linear -- --nocapture
          cargo test -p compiler-opt --test typed_algebra -- --nocapture
          cargo test -p compiler-ir --test native_module_text_v3 -- --nocapture
      - name: Check strict lint on migrated test suites
        working-directory: compiler
        run: |
          cargo clippy -p compiler-opt --test typed_array_fold --test typed_phi_cfg --test typed_algebra -- -D warnings
