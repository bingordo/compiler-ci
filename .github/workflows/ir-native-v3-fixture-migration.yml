# Validate fixed-graph TypeId v3 migrations in compiler-ci only.
# The candidate SHA is intentionally immutable for reproducible acceptance.
name: IR native v3 fixture migration validation
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ir-native-v3-fixture-migration.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-v3-optimizer:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
      SOURCE_SHA: 637c6d47ffdce503c113325e4a6a972e056d1921
    steps:
      - name: Check out exact compiler migration candidate
        uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 637c6d47ffdce503c113325e4a6a972e056d1921
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Verify source and isolate core workspace
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C compiler rev-parse HEAD)" = "$SOURCE_SHA"
          cat > compiler/Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir", "crates/opt", "crates/backend", "crates/backend-x86"]
          EOF
          rm -f compiler/Cargo.lock
          rustc --version
          cargo --version
      - name: Cache core build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: ir-v3-fixtures
      - name: Run native fixture and optimizer regression tests
        working-directory: compiler
        run: |
          set -euo pipefail
          cargo test -p compiler-opt --test typed_array_fold -- --nocapture
          cargo test -p compiler-opt --test typed_phi_cfg -- --nocapture
          cargo test -p compiler-opt --test typed_phi_dead_linear -- --nocapture
          cargo test -p compiler-opt --test typed_algebra -- --nocapture
          cargo test -p compiler-opt --test typed_if_conversion_native -- --nocapture
          cargo test -p compiler-opt --lib typed_sccp -- --nocapture
          cargo test -p compiler-opt --test typed_sccp -- --nocapture
          cargo test -p compiler-opt --test ir_opt_native_v3_only -- --nocapture
          cargo test -p compiler-opt --test native_ir_pass_replay -- --nocapture
          cargo test -p compiler-ir --test native_module_text_v3 -- --nocapture
          cargo test -p compiler-ir --test native_module_cli -- --nocapture
          cargo test -p compiler-backend-x86 --test m4_not_native -- --nocapture
          cargo test -p compiler-backend-x86 --test m4_global_data_only_native -- --nocapture
          cargo test -p compiler-backend-x86 --test m4_global_external_native -- --nocapture
          cargo test -p compiler-backend-x86 --test m4_global_definitions_native -- --nocapture
          cargo test -p compiler-backend-x86 --test native_typeid_memory_calls -- --nocapture
          cargo check -p compiler-backend-x86 --all-targets
          cargo check -p compiler-opt --all-targets
      - name: Check strict lint on migrated test suites
        working-directory: compiler
        run: |
          cargo clippy -p compiler-opt --lib -- -D warnings
          cargo clippy -p compiler-opt --test typed_sccp --test ir_opt_native_v3_only -- -D warnings
          cargo clippy -p compiler-backend-x86 --test m4_not_native --test m4_global_data_only_native --test m4_global_external_native --test m4_global_definitions_native -- -D warnings
