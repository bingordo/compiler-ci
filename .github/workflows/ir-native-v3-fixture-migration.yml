# One-shot PR validation; do not merge this candidate pin.
name: IR native v3 fixture migration validation
on:
  pull_request:
    paths:
      - '.github/workflows/ir-native-v3-fixture-migration.yml'
  workflow_dispatch:
permissions:
  contents: read
  statuses: write
jobs:
  native-v3-optimizer:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CARGO_INCREMENTAL: '0'
      SOURCE_SHA: 247dd4ce15fcb887dfd32466d9c606c18aac3ee7
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 247dd4ce15fcb887dfd32466d9c606c18aac3ee7
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Verify exact source and isolate workspace
        run: |
          set -euo pipefail
          git -C compiler rev-parse HEAD | tee -a "$GITHUB_STEP_SUMMARY"
          test "$(git -C compiler rev-parse HEAD)" = "$SOURCE_SHA"
          cat > compiler/Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir", "crates/opt", "crates/backend", "crates/backend-x86", "crates/backend-aarch64"]
          EOF
          rm -f compiler/Cargo.lock
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: ir-v3-fixtures
      - name: Validate fixed native verifier fixtures and CLI
        working-directory: compiler
        run: |
          cargo test --no-fail-fast -p compiler-ir --test native_module_cli --test native_fixed_verifier_fixtures --test native_fixture_text --test typed_module_abi --test typed_opcode_types
      # Scope this temporary candidate lane to changed tests. Independent
      # top-level inventory remains failing on #3260 (46112438943); no
      # repository regression gate is changed or treated as green.
      - name: Publish candidate result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ job.status }}
        run: |
          state=failure
          if [ "$RESULT" = success ]; then state=success; fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state="$state" -f context=ir/direct-fixture-migration \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            -f description="Compiler fixture validation: $RESULT"
