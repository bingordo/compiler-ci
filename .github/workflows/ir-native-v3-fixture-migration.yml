# One-shot PR validation; do not merge this candidate pin.
name: IR native v3 fixture migration validation
on:
  pull_request:
    paths:
      - '.github/workflows/ir-native-v3-fixture-migration.yml'
  workflow_dispatch:
permissions:
  contents: read
  statuses: write
jobs:
  native-v3-optimizer:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CARGO_INCREMENTAL: '0'
      SOURCE_SHA: 32511c1aa920189d954af839ce4a694b857b0d39
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 32511c1aa920189d954af839ce4a694b857b0d39
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Verify exact source and isolate workspace
        run: |
          set -euo pipefail
          git -C compiler rev-parse HEAD | tee -a "$GITHUB_STEP_SUMMARY"
          test "$(git -C compiler rev-parse HEAD)" = "$SOURCE_SHA"
          cat > compiler/Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir", "crates/opt", "crates/backend", "crates/backend-x86", "crates/backend-aarch64"]
          EOF
          rm -f compiler/Cargo.lock
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: ir-v3-fixtures
      - name: Validate direct cases and inventory
        working-directory: compiler
        run: |
          cargo test -p compiler-opt --test ir_fixture_directives --test native_v3_fixture_inventory --test typed_local --test typed_cse --test typed_phi_cfg --test typed_transitive_phi --test typed_phi_dead_linear --test typed_sccp
      - name: Publish candidate result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ job.status }}
        run: |
          state=failure
          if [ "$RESULT" = success ]; then state=success; fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state="$state" -f context=ir/direct-fixture-migration \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            -f description="Compiler fixture validation: $RESULT"
