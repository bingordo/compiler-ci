name: FZ-2.5 PR1031 folding algebra DCE CFG native oracles
on:
  push:
    branches: [fuzz/fz25-local-cfg-pr1031-20261111]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  targeted:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: cf5c3219c12164eb415837452963fade3603ea90
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Check exact source and the targeted suite
        run: |
          test "$(git -C compiler rev-parse HEAD)" = "cf5c3219c12164eb415837452963fade3603ea90"
          test -s compiler/crates/opt/tests/typeid_fuzz_local_cfg_targeted.rs
      - name: Isolate standalone compiler core workspace
        run: |
          cat > compiler/Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir", "crates/opt", "crates/backend", "crates/backend-x86"]
          EOF
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: fz25-local-cfg-oracle
          cache-workspace-crates: 'true'
      - name: Run targeted pass edits noops native C11 and SIGFPE
        working-directory: compiler
        run: cargo test -p compiler-opt --test typeid_fuzz_local_cfg_targeted -- --nocapture
      - name: Guard existing FZ-2.5 and registry plus TypeId verifier
        working-directory: compiler
        run: |
          cargo test -p compiler-opt --test typeid_fuzz_targeted
          cargo test -p compiler-opt --test typeid_fuzz_bias
          cargo test -p compiler-opt --test typeid_fuzz_pass_registry
          cargo test -p compiler-opt --test typed_core_native_verifier
      - name: Strict targeted Clippy
        working-directory: compiler
        run: cargo clippy -p compiler-opt --test typeid_fuzz_local_cfg_targeted --test typeid_fuzz_targeted --test typeid_fuzz_bias --test typeid_fuzz_pass_registry -- -D warnings
