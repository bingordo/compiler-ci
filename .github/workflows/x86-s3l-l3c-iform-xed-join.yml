name: X7 S3.L L3c generic source iform XED semantic proof worklist
on:
  pull_request:
    paths:
      - '.github/workflows/x86-s3l-l3c-iform-xed-join.yml'
permissions:
  contents: read
  actions: read
jobs:
  original-intel-full-iform-join:
    runs-on: ubuntu-24.04
    timeout-minutes: 32
    env:
      SOURCE_SHA: 'be132da622a4d03648b3d74fc41b2527e422eead'
      PYTHONPATH: compiler/tools
      INTEL_DIRECTORY: /tmp/x7-s3l-l3c/intel
      S2_WORKLIST: /tmp/x7-s3l-l3c/s2/join-1.json
      OPERATION_AST: /tmp/x7-s3l-l3c/proven/operations.json
      GENERIC_SMT: /tmp/x7-s3l-l3c/proven/semantics-z3.json
      X7_S3L_L3C_INTEL: /tmp/x7-s3l-l3c/intel
      X7_S3L_L3C_OPERATION_AST: /tmp/x7-s3l-l3c/proven/operations.json
      X7_S3L_L3C_SMT: /tmp/x7-s3l-l3c/proven/semantics-z3.json
      X7_S3L_L3C_S2: /tmp/x7-s3l-l3c/s2/join-1.json
      X7_S3L_L3C_REPORT: /tmp/x7-s3l-l3c/out/original-source-xed-iforms.json
      X7_S3L_S3F: /tmp/x7-s3l-l3c/s3f/source-xed-effects.json
      X7_S3L_S3G: /tmp/x7-s3l-l3c/s3g/real-selector-decisions.json
      X7_S3L_S3H: /tmp/x7-s3l-l3c/s3h/native-i64-source-decisions.json
      X7_S3L_S3J: /tmp/x7-s3l-l3c/s3j/add-sub-source-proof.json
      X7_S3L_S3K: /tmp/x7-s3l-l3c/s3k/source-cmp-flags-admission.json
      X7_S3L_L3B_OP: /tmp/x7-s3l-l3c/proven/operations.json
      X7_S3L_L3B_HELPERS: /tmp/x7-s3l-l3c/proven/helpers.json
      X7_S3L_L3B_SMT: /tmp/x7-s3l-l3c/proven/semantics-z3.json
      X7_S3L_L3B_S3F: /tmp/x7-s3l-l3c/s3f/source-xed-effects.json
      X7_S3L_L3B_S3G: /tmp/x7-s3l-l3c/s3g/real-selector-decisions.json
      X7_S3L_L3B_S3H: /tmp/x7-s3l-l3c/s3h/native-i64-source-decisions.json
      X7_S3L_L3B_S3J: /tmp/x7-s3l-l3c/s3j/add-sub-source-proof.json
      X7_S3L_L3B_S3K: /tmp/x7-s3l-l3c/s3k/source-cmp-flags-admission.json
    steps:
      - name: Checkout exact compiler commit without compiler Actions
        uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: be132da622a4d03648b3d74fc41b2527e422eead
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Reuse full pinned Intel/XED S2 exact-variant evidence
        uses: actions/download-artifact@v4
        with:
          name: x7-s2-pinned-intel-xed-variant-join
          run-id: 43635408689
          repository: bingordo/compiler-ci
          github-token: ${{ github.token }}
          path: /tmp/x7-s3l-l3c/s2
      - name: Reuse independently parsed/proven Intel nine-operation Z3 source semantics
        uses: actions/download-artifact@v4
        with:
          name: x7-s3l-l2b-l3a-9-ops-generic-helper-smt-source-evidence
          run-id: 43687620382
          repository: bingordo/compiler-ci
          github-token: ${{ github.token }}
          path: /tmp/x7-s3l-l3c/proven
      - name: Obtain original exact-revision Intel XML operations
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C compiler rev-parse HEAD)" = "$SOURCE_SHA"
          mkdir -p "$INTEL_DIRECTORY" /tmp/x7-s3l-l3c/out
          for op in ADD SUB CMP AND OR XOR TEST ADC SBB; do
            curl --fail --silent --show-error --location --retry 2 --max-time 50 \
              "https://raw.githubusercontent.com/intel/SDM/35eface1b7ee003a1cda95005ec5fd83de658a64/data/instruction/${op}.xml" \
              -o "$INTEL_DIRECTORY/${op}.xml"
          done
          test -s "$S2_WORKLIST"
          test -s "$OPERATION_AST"
          test -s "$GENERIC_SMT"
      - name: Generic Intel source iform/XED operand flag prefix and encoding join
        shell: bash
        run: |
          set -euo pipefail
          python3 compiler/tools/x86_s3l_generic_iform_xed_join.py \
            --intel-dir "$INTEL_DIRECTORY" \
            --operation-ast "$OPERATION_AST" \
            --generic-smt "$GENERIC_SMT" \
            --s2 "$S2_WORKLIST" \
            --out "$X7_S3L_L3C_REPORT"
          python3 compiler/tools/x86_s3l_generic_iform_xed_join.py \
            --intel-dir "$INTEL_DIRECTORY" \
            --operation-ast "$OPERATION_AST" \
            --generic-smt "$GENERIC_SMT" \
            --s2 "$S2_WORKLIST" \
            --out "$X7_S3L_L3C_REPORT" --check
          echo X7_S3L_L3C_GENERIC_IFORM_XED_SOURCE_JOIN_PASS
      - name: Validate whole form inventory and malformed opcode memory flags CPUID rejection
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest -v test_x86_s3l_generic_iform_xed_join
          echo X7_S3L_L3C_WHOLE_CORPUS_AND_MUTATIONS_PASS
      - name: Import historical pinned source-iform and actual selector evidence
        uses: actions/download-artifact@v4
        with:
          name: x7-s3f-source-xed-flag-effect-no-admission
          run-id: 43667287999
          repository: bingordo/compiler-ci
          github-token: ${{ github.token }}
          path: /tmp/x7-s3l-l3c/s3f
      - uses: actions/download-artifact@v4
        with:
          name: x7-s3g-actual-selector-decision-evidence
          run-id: 43670305205
          repository: bingordo/compiler-ci
          github-token: ${{ github.token }}
          path: /tmp/x7-s3l-l3c/s3g
      - uses: actions/download-artifact@v4
        with:
          name: x7-s3h-native-typeid-i64-fusion-source-decisions
          run-id: 43675286039
          repository: bingordo/compiler-ci
          github-token: ${{ github.token }}
          path: /tmp/x7-s3l-l3c/s3h
      - uses: actions/download-artifact@v4
        with:
          name: x7-s3j-add-sub-source-ir-proof
          run-id: 43682964277
          repository: bingordo/compiler-ci
          github-token: ${{ github.token }}
          path: /tmp/x7-s3l-l3c/s3j
      - uses: actions/download-artifact@v4
        with:
          name: x7-s3k-flags-only-cmp-source-native-evidence
          run-id: 43684448812
          repository: bingordo/compiler-ci
          github-token: ${{ github.token }}
          path: /tmp/x7-s3l-l3c/s3k
      - name: Production batch generator now requires the generic source/XED worklist
        shell: bash
        run: |
          set -euo pipefail
          python3 compiler/tools/x86_s3l_batch_admission.py \
            --s3f "$X7_S3L_S3F" --s3g "$X7_S3L_S3G" \
            --s3h "$X7_S3L_S3H" --s3j "$X7_S3L_S3J" \
            --s3k "$X7_S3L_S3K" \
            --operation-ast "$OPERATION_AST" \
            --helper-ast /tmp/x7-s3l-l3c/proven/helpers.json \
            --generic-smt "$GENERIC_SMT" \
            --generic-iform-xed "$X7_S3L_L3C_REPORT" \
            --out /tmp/x7-s3l-l3c/out/production-source-admission.json
          git -C compiler diff --exit-code -- \
            crates/backend-x86/src/generated_x7_s3l_batch_admissions.rs
          python3 compiler/tools/x86_s3l_batch_admission.py \
            --s3f "$X7_S3L_S3F" --s3g "$X7_S3L_S3G" \
            --s3h "$X7_S3L_S3H" --s3j "$X7_S3L_S3J" \
            --s3k "$X7_S3L_S3K" \
            --operation-ast "$OPERATION_AST" \
            --helper-ast /tmp/x7-s3l-l3c/proven/helpers.json \
            --generic-smt "$GENERIC_SMT" \
            --generic-iform-xed "$X7_S3L_L3C_REPORT" \
            --out /tmp/x7-s3l-l3c/out/production-source-admission.json --check
          echo X7_S3L_L3C_PRODUCTION_GENERIC_XED_GATE_PASS
      - name: Real production source/XED proof gates reject mutations
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest -v \
            test_x86_s3l_batch_admission \
            test_x86_s3l_l3b_generic_proof_gate \
            test_x86_s3l_l3c_production_iform_gate
          python3 - <<'PY'
          import json,os
          r=json.load(open(os.environ["X7_S3L_L3C_REPORT"]))
          for x in r["form_records"]:
              if x["status"].startswith("source_XED_memory_read_candidate"):
                  print("X7_S3L_L3C_CANDIDATE",x["intel_iform"],x["encoding_opcode"])
              elif x["intel_iform"].startswith("TEST_MEMv"):
                  print("X7_S3L_L3C_TEST_BLOCKER",x["intel_iform"],x["reason"])
          PY
          echo X7_S3L_L3C_PRODUCTION_MALFORMED_SOURCE_XED_FAIL_CLOSED_PASS
      - name: Isolate backend-only offline Rust workspace
        shell: bash
        run: |
          cd compiler
          python3 - <<'PY'
          from pathlib import Path
          Path("Cargo.toml").write_text("""[workspace]
          resolver = "2"
          members = ["crates/ir", "crates/opt", "crates/backend", "crates/backend-x86"]
          """)
          PY
      - name: Confirm native selector and direct GAS/ELF behavior unchanged
        shell: bash
        run: |
          set -euo pipefail
          cd compiler
          cargo test -p compiler-backend-x86 \
            --features 'x7-native-form-validation x7-c-defined-64 x7-c-defined-bitwise' \
            --lib x7_native_form_bridge --offline
          cargo test -p compiler-backend-x86 \
            --features 'x7-native-form-validation x7-c-defined-64 x7-c-defined-bitwise' \
            --lib x7_late_selector --offline
          cargo test -p compiler-backend-x86 \
            --features 'x7-native-form-validation x7-c-defined-64 x7-c-defined-bitwise' \
            --test x7_s3k_cmp_native --offline
          cargo test -p compiler-backend-x86 \
            --features 'x7-native-form-validation x7-c-defined-64 x7-c-defined-bitwise' \
            --test x7_s3j_arithmetic_ir_admission --offline
          cargo test -p compiler-backend-x86 --no-default-features \
            --features x7-native-form-validation \
            --test x7_s3k_cmp_native --offline
          echo X7_S3L_L3C_NO_RUNTIME_SELECTOR_REGRESSION_PASS
      - name: Archive full source iform-XED proof candidate diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: x7-s3l-l3c-source-XED-gated-production-admission
          path: /tmp/x7-s3l-l3c/out/
          if-no-files-found: error
