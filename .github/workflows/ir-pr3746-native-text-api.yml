# One-off exact source validation; close PR unmerged after verification.
name: IR PR3746 native text API retirement
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/ir-pr3746-native-text-api.yml']
permissions:
  contents: read
jobs:
  native-text:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      COMPILER_SHA: d3bc14e94786fd6e735e1d268719253f8352404d
      MAIN_SHA: 292e7e3ee38c149813cf944cfd797c256c39e163
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: ${{ env.MAIN_SHA }}
          fetch-depth: 0
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: true
      - name: Verify source and absence of old API
        working-directory: compiler
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$MAIN_SHA"
          git fetch origin "$COMPILER_SHA"
          test "$(git rev-parse FETCH_HEAD)" = "$COMPILER_SHA"
          git -c user.name=ci -c user.email=ci@example.invalid merge --no-commit --no-ff "$COMPILER_SHA"
          git diff --cached --stat
          echo "Verified integration: $MAIN_SHA + $COMPILER_SHA tree $(git write-tree)" >> "$GITHUB_STEP_SUMMARY"
          if git grep -nE 'typed_ssa_text|read_typed_ssa|write_typed_ssa' -- '*.rs' '*.toml' '*.py'; then exit 1; else test "$?" -eq 1; fi
          cat > Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir", "crates/ir-macros", "crates/opt"]
          EOF
          rm -f Cargo.lock
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: ir-pr3746-native-text
      - name: Build all affected targets
        working-directory: compiler
        run: cargo check -p compiler-ir -p compiler-opt --all-targets
      - name: Native serialization and reducer replay
        working-directory: compiler
        run: |
          set -euo pipefail
          cargo test -p compiler-ir --test typed_ssa_body --test native_module_text_v3
          cargo test -p compiler-opt --test typeid_delta_canonical_replay --test delta_reduce_ir --test typeid_delta_dominance --test typed_core_pipeline --test typed_core_inline_integration --test typed_algebra
      - name: Alive-lite replay test discovery and optimizer unit suite
        working-directory: compiler
        run: |
          set -euo pipefail
          cargo test -p compiler-opt --test alive_lite -- --list
          cargo test -p compiler-opt --lib
