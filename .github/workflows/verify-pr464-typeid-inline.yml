name: Verify PR464 TypeId scalar leaf module inlining
on:
  push:
    branches: [ci/pr464-typeid-scalar-inline]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 876d7a6869af343cc83f78ecf5402f58d36b3b40
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Verify exact immutable compiler source
        run: test "$(git -C compiler rev-parse HEAD)" = "876d7a6869af343cc83f78ecf5402f58d36b3b40"
      - name: Isolate self-contained IR optimizer backend and native workspace
        run: |
          cat > compiler/Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir", "crates/opt", "crates/backend", "crates/backend-x86"]
          EOF
          rm -f compiler/Cargo.lock
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: typeid-scalar-inline-pr464
          cache-workspace-crates: 'true'
      - name: Focused TypeId and legacy scalar inline native replay
        working-directory: compiler
        run: cargo test -p compiler-opt --test typed_inline_leaf_native --test inline_native --test inline_practical_native --test typed_core_pipeline --test ir_replay_cli -- --nocapture
      - name: Full isolated compiler IR optimizer backend and x86 regressions
        working-directory: compiler
        run: cargo test -p compiler-ir -p compiler-opt -p compiler-backend -p compiler-backend-x86
      - name: Strict optimizer Clippy all targets
        working-directory: compiler
        run: cargo clippy -p compiler-opt --all-targets -- -D warnings
