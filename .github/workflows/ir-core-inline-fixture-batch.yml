# Temporary source-pinned fixture export. Never merge.
name: IR fixed core and inline fixture export
on:
  pull_request:
    paths: ['.github/workflows/ir-core-inline-fixture-batch.yml']
  push:
    branches: [ci/ir-core-inline-fixture-export-20261114]
    paths: ['.github/workflows/ir-core-inline-fixture-batch.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fixtures:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: a7ad928e00c0fec69cd9d1f1e305c1bca45dfc00
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Exact SHA and reduced compiler workspace
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C compiler rev-parse HEAD)" = "a7ad928e00c0fec69cd9d1f1e305c1bca45dfc00"
          echo "Compiler SHA: a7ad928e00c0fec69cd9d1f1e305c1bca45dfc00" >> "$GITHUB_STEP_SUMMARY"
          cat > compiler/Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir", "crates/opt", "crates/backend", "crates/backend-x86"]
          EOF
          rm -f compiler/Cargo.lock
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: ir-fixed-core-inline-batch
      - name: Export checked core-pipeline fixed graph
        working-directory: compiler
        run: cargo test -p compiler-opt --test typed_core_pipeline export_original_core_pipeline_fixed_graphs -- --nocapture
      - name: Export checked inline-leaf six function corpus
        working-directory: compiler
        run: cargo test -p compiler-opt --test typed_inline_leaf_native export_original_inline_leaf_fixed_graphs -- --nocapture
