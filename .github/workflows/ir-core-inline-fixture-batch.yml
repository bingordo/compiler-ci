# Temporary source-pinned fixture export for existing core and inline tests. Never merge.
name: IR fixed core and inline TypeId migration validation
on:
  pull_request:
    paths: ['.github/workflows/ir-core-inline-fixture-batch.yml']
  push:
    branches: [ci/ir-core-inline-fixture-export-20261114]
    paths: ['.github/workflows/ir-core-inline-fixture-batch.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fixtures:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 722a0c2d476ba28843d98c6cc4b5a229f8935690
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Exact SHA and reduced compiler workspace
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C compiler rev-parse HEAD)" = "722a0c2d476ba28843d98c6cc4b5a229f8935690"
          echo "Compiler SHA: 722a0c2d476ba28843d98c6cc4b5a229f8935690" >> "$GITHUB_STEP_SUMMARY"
          cat > compiler/Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir", "crates/opt", "crates/backend", "crates/backend-x86"]
          EOF
          rm -f compiler/Cargo.lock
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: ir-fixed-core-inline-batch
      - name: Execute original TypeId core-pipeline and scalar-leaf C11 oracles
        working-directory: compiler
        run: |
          set -euo pipefail
          cargo test -p compiler-opt --test typed_core_pipeline --test typed_inline_leaf_native -- --nocapture
      - name: Adjacent migrated IR fixture and optimizer oracles
        working-directory: compiler
        run: |
          set -euo pipefail
          cargo test -p compiler-opt --test typed_mem2reg --test typed_pre_native --test typed_dse --test typed_cse --test typed_sccp --test typed_phi_cfg
      - name: Verify compiler core all-targets
        working-directory: compiler
        run: cargo check --workspace --all-targets
      - name: Strict relevant Clippy without unrelated optional helper warnings
        working-directory: compiler
        run: |
          set -euo pipefail
          cargo clippy -p compiler-ir -p compiler-opt -p compiler-backend -p compiler-backend-x86 --lib -- -D warnings
          cargo clippy -p compiler-opt --test typed_core_pipeline --test typed_inline_leaf_native -- -D warnings
      - name: Record successful source-pinned validation
        run: |
          echo 'All original tests, C11 ELF/GAS framed/frameless, adjacent fixtures, all-target typecheck, scoped strict Clippy PASS' >> "$GITHUB_STEP_SUMMARY"
