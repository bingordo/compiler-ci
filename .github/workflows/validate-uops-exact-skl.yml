name: Reproducible x86 uops.info exact form cost import
on:
  push:
    branches: [ci/x86-uops-skl-exact-profiles-20261106]
permissions:
  contents: read
jobs:
  verify-mappings:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: a9af17ee5174bdc773509525a94cfd572546d503
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Verify exact compiler revision, Rust forms and importer negative tests
        working-directory: compiler
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "a9af17ee5174bdc773509525a94cfd572546d503"
          python3 tools/regen_x86_forms.py --check
          PYTHONPATH=tools python3 -m unittest discover -s tools -p test_import_uops_info.py -v
          python3 tools/validate_x86_costs.py data/x86_costs_generic.json
      - name: Fetch March 2026 uops.info upstream XML at verified checksum
        working-directory: compiler
        run: |
          set -euo pipefail
          curl -fsSL --retry 2 --connect-timeout 15 --max-time 180 \
            https://uops.info/instructions.xml -o /tmp/instructions.xml
          echo "e5e702caaf04c4fc1f75192a9bbe4d8554b3e174f7933a14d124cc33ca677ab3  /tmp/instructions.xml" | sha256sum --check -
      - name: Regenerate exact Skylake cost profile without CPU substitution
        working-directory: compiler
        run: |
          set -euo pipefail
          python3 tools/import_uops_info.py /tmp/instructions.xml \
            --architecture SKL \
            --mapping data/x86_uops_variant_mapping.json \
            --output /tmp/x86_costs_skl.json
          python3 tools/validate_x86_costs.py /tmp/x86_costs_skl.json data/x86_costs_skl.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          generated=json.loads(Path('/tmp/x86_costs_skl.json').read_text())
          committed=json.loads(Path('data/x86_costs_skl.json').read_text())
          assert generated==committed, 'pinned measured SKL profile is stale or changed'
          assert len(committed['forms'])==9
          print('PASS pinned 9-form SKL measured profile reproduces exact upstream variants')
          PY
          echo 'BEGIN SKL_PROFILE'
          cat /tmp/x86_costs_skl.json
          echo 'END SKL_PROFILE'
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: exact-uops-info-skl-verified
          path: /tmp/x86_costs_skl.json
          retention-days: 30
  rust-core:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: a9af17ee5174bdc773509525a94cfd572546d503
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Isolate compiler IR/backend workspace
        run: |
          cat > compiler/Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir", "crates/opt", "crates/backend", "crates/backend-x86"]
          EOF
          rm -f compiler/Cargo.lock
      - name: Test generated form descriptors and backend
        working-directory: compiler
        run: |
          set -euo pipefail
          cargo test -p compiler-backend-x86
          cargo clippy -p compiler-backend-x86 --all-targets -- -D warnings

  allocation-spill-profile:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: a9af17ee5174bdc773509525a94cfd572546d503
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Verify pinned compiler and configure Mini-C dependencies
        run: |
          set -euo pipefail
          test "$(git -C compiler rev-parse HEAD)" = "a9af17ee5174bdc773509525a94cfd572546d503"
          git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
      - name: Build and run checked-source actual regalloc profile
        run: |
          set -euo pipefail
          mkdir -p results
          cargo run --release --manifest-path compiler/tools/mini-c-driver/Cargo.toml \
            -p compiler-mini-c --example shared_select_allocation_metrics \
            | tee results/shared_select_allocated_homes.csv
          python3 - <<'PY'
          import csv
          from pathlib import Path
          rows=list(csv.DictReader(Path('results/shared_select_allocated_homes.csv').open()))
          assert len(rows)==32, len(rows)
          assert {int(row['budget']) for row in rows}=={2,8,14,15}
          assert len({row['case'] for row in rows})==8
          for row in rows:
              assert int(row['spill_frame_words'])>=int(row['stack_homed_values'])
          assert any(int(row['stack_homed_values'])>0 for row in rows if int(row['budget'])==2)
          print('PASS: 8 checked-source cases, 4 actual regalloc budgets, nonzero constrained spills')
          PY
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: native-x86-allocator-spill-homes
          path: results/shared_select_allocated_homes.csv
          retention-days: 30
