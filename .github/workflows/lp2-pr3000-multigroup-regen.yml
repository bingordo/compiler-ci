name: LP2 PR3000 multigroup regen CLI
on:
  push:
    branches: [main]
    paths: ['.github/workflows/lp2-pr3000-multigroup-regen.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regen:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      SOURCE_SHA: df139a475a6704c31384e5b92c29625f7ac9517c
      CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
      CARGO_INCREMENTAL: '0'
    steps:
      - name: Checkout source-pinned compiler
        uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: ${{ env.SOURCE_SHA }}
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Check pinned SHA
        run: test "$(git -C compiler rev-parse HEAD)" = "$SOURCE_SHA"
      - name: Load private dependency git key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.CI_KEY }}
      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: lp2-pr3000-multigroup
      - name: Real driver CLI multi-group code data and C oracle
        working-directory: compiler
        shell: bash
        run: |
          set -euo pipefail
          cargo build -p compiler --bin compiler
          LP2_COMPILER_BIN="$(pwd)/target/debug/compiler" cargo test -p compiler-lto-plugin-core --test comdat_single_function_gnu direct_multi_group_native_elf_preserves_grouped_data_and_linker_selection -- --nocapture
          cargo check -p compiler --bin compiler
          cargo test -p compiler-ir --test lto_target_envelope -- --nocapture
