name: pinned x86 TypeId hot-only clone budget A/B
on:
  push:
    branches: [main]
    paths: [.github/workflows/verify-typeid-hot-budget-ab-20261117.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ab:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: efd0d5f7271a5f300ed50a576e8a5654e20812ff
          path: old
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 6a5c2761b490370ff674118a29f4d7b1675bf9df
          path: new
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Verify exact pinned sources
        run: |
          set -euo pipefail
          test "$(git -C old rev-parse HEAD)" = "efd0d5f7271a5f300ed50a576e8a5654e20812ff"
          test "$(git -C new rev-parse HEAD)" = "6a5c2761b490370ff674118a29f4d7b1675bf9df"
          git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            old -> target
            new -> target
          key: typeid-hot-budget-ab-20261117
      - name: Verify draft optimizer regression and checked source behavior
        working-directory: new
        run: |
          set -euo pipefail
          cargo test -p compiler-opt --lib
          cargo clippy -p compiler-opt --lib -- -D warnings
          cargo test -p compiler --test x86_inline_source_ablation -- --nocapture
          cargo test -p compiler --test x7_s4_rolling_checksum_source -- --nocapture
      - name: Interleaved release native and independent GCC runtime
        run: |
          set -euo pipefail
          for case in old new new old; do
            index=1
            test -f "$RUNNER_TEMP/$case-1.log" && index=2
            (cd "$case" && cargo test --release -p compiler --test x86_source_runtime_performance -- --ignored --nocapture) 2>&1 | tee "$RUNNER_TEMP/$case-$index.log"
          done
          for case in old new; do
            for index in 1 2; do
              file="$RUNNER_TEMP/$case-$index.log"
              grep -q 'X86_RUNTIME_FUNCTION mode=mini_default symbol=scan>' "$file"
              grep -q 'X86_SOURCE_RUNTIME mode=mini_default workload=combined ' "$file"
              grep -q 'X86_SOURCE_RUNTIME mode=gcc_O2 workload=combined ' "$file"
            done
          done
          {
            echo "### Exact-source TypeId hot budget A/B"
            echo "Baseline merged #2117: `efd0d5f7271a5f300ed50a576e8a5654e20812ff`"
            echo "Draft #2121: `6a5c2761b490370ff674118a29f4d7b1675bf9df`"
            for case in old new; do
              for index in 1 2; do
                echo ""
                echo "#### $case repetition $index"
                grep -E 'X86_RUNTIME_FUNCTION mode=mini_default symbol=scan>|X86_SOURCE_RUNTIME mode=(mini_default|gcc_O2) workload=(combined|batch|delta) ' "$RUNNER_TEMP/$case-$index.log" || true
              done
            done
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pinned-x86-hot-budget-ab
          path: ${{ runner.temp }}/*-?.log
          if-no-files-found: ignore
