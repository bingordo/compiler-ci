# W7: actual checked Mini-C source -> TypeId wasm32, independent GCC/native oracle.
name: Wasm W7 checked Mini-C source

on:
  pull_request:
    paths:
      - '.github/workflows/wasm-w7-minic-source.yml'
  workflow_dispatch:
    inputs:
      compiler_sha:
        description: 'Exact compiler source commit'
        required: true
        type: string

permissions:
  contents: read

jobs:
  wasm-w7:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
      CARGO_INCREMENTAL: '0'
    steps:
      - name: Checkout exact compiler with pinned frontends
        uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: ${{ inputs.compiler_sha || 'c6ff020005b91ba88114fda9f623afd95fb22918' }}
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Verify compiler identity and allow public pinned frontend dependencies
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C compiler rev-parse HEAD)" = "${{ inputs.compiler_sha || 'c6ff020005b91ba88114fda9f623afd95fb22918' }}"
          git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
          echo "Compiler SHA: $(git -C compiler rev-parse HEAD)"
          cat > compiler/Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir", "crates/opt", "crates/backend", "crates/backend-x86", "crates/backend-aarch64", "crates/backend-riscv64", "crates/backend-wasm", "crates/driver"]
          EOF
          rm -f compiler/Cargo.lock
          rustc --version
          cc --version | head -1
      - name: Independent WebAssembly execution engine
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Cache compiler with Mini-C and Oberon frontends
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: wasm-w7-real-minic-source
      - name: Compile and execute checked Mini-C source to wasm32, native TypeId and GCC
        working-directory: compiler
        run: cargo test -p compiler --test wasm32_minic_source -- --nocapture
      - name: Regress W0-W6d standalone WebAssembly backend
        working-directory: compiler
        run: cargo test -p compiler-backend-wasm --tests -- --nocapture
      - name: Regress compiler CLI and shared native TypeId backend
        working-directory: compiler
        run: |
          cargo test -p compiler --bin compiler -- --nocapture
          cargo test -p compiler-backend --lib
      - name: Strict driver and WebAssembly backend Clippy
        working-directory: compiler
        run: cargo clippy -p compiler --bin compiler --test wasm32_minic_source -p compiler-backend-wasm --all-targets -- -D warnings
