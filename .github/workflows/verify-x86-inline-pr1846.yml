name: x86 TypeId inline PR1846 postopt budget rejection
on:
  push:
    branches: [main]
    paths: [.github/workflows/verify-x86-inline-pr1846.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-inline:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 1108c3de0328eadbf3e1c3c8640b2208c0cf6570
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Require exact compiler PR source
        run: test "$(git -C compiler rev-parse HEAD)" = "1108c3de0328eadbf3e1c3c8640b2208c0cf6570"
      - name: Restrict workspace to core optimizer and native x86
        run: |
          cat > compiler/Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir", "crates/opt", "crates/backend", "crates/backend-x86"]
          EOF
          rm -f compiler/Cargo.lock
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: x86-inline-postopt-pr1846
      - name: Verify postopt ELF machine-byte profitability and rejection
        working-directory: compiler
        run: |
          set -euo pipefail
          cargo test -p compiler-opt --test typed_inline_postopt_native_trial -- --nocapture
          cargo test -p compiler-opt --test typed_inline_cfg_native
          cargo test -p compiler-opt --test typed_core_inline_integration
          cargo clippy -p compiler-opt --lib -- -D warnings
