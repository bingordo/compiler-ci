name: TypeId P3.3 existing local-array fold migration
on:
  pull_request:
    paths:
      - '.github/workflows/verify-typeid-p33-local-array-fold.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  p33:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
      CARGO_INCREMENTAL: '0'
    steps:
      - name: Checkout pinned compiler candidate
        uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: b7e47756f103e03764ec94798ac8e021df344971
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Check exact source
        working-directory: compiler
        run: test "$(git rev-parse HEAD)" = "b7e47756f103e03764ec94798ac8e021df344971"
      - name: Resolve frontend git pins via public HTTPS
        run: git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: p33-existing-array-proof
      - name: TypeId direct owned-array proof and independent legacy differential
        working-directory: compiler
        run: cargo test -p compiler-opt --test typed_array_fold -- --nocapture
      - name: Zero legacy verifier count in TypeId array proof
        working-directory: compiler
        run: cargo test -p compiler-opt --features verify-counts --test typed_array_fold -- --nocapture
      - name: Prior local-array fold proof and whole existing typed-core suite
        working-directory: compiler
        run: |
          cargo test -p compiler-opt --lib array_fold -- --nocapture
          cargo test -p compiler-opt --test typed_core_pipeline
          cargo test -p compiler-opt --test typed_core_inline_integration
          cargo test -p compiler-opt --test typed_core_native_verifier
      - name: Actual checked Mini-C and Oberon native C11 GAS/direct ELF
        working-directory: compiler
        run: cargo test -p compiler --bin compiler typeid_native_source -- --nocapture
      - name: Complete checked frontend legacy/native suite
        working-directory: compiler
        run: cargo test -p compiler --bin compiler
      - name: AArch64 common TypeId compatibility
        working-directory: compiler
        run: cargo check -p compiler-backend-aarch64 --all-targets
      - name: Strict IR optimizer driver and backend Clippy
        working-directory: compiler
        run: |
          cargo clippy -p compiler-ir -p compiler-opt -p compiler -p compiler-backend-x86 --all-targets -- -D warnings
          cargo clippy -p compiler-backend-aarch64 --lib -- -D warnings
      - name: Install GDB needed for existing DWARF oracle
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y gdb
      - name: Full IR optimizer and backend regressions
        working-directory: compiler
        run: cargo test -p compiler-ir -p compiler-opt -p compiler-backend -p compiler-backend-x86
