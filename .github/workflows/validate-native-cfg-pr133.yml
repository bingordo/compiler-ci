name: Targeted native CFG correctness validation (PR 133)
on:
  push:
    branches: [test/native-cfg-pr133-validation]
permissions:
  contents: read
jobs:
  native-cfg:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out exact compiler PR revision
        uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: c57f19d11e118ce34da934446351854ad0b87ca8
          path: compiler
          persist-credentials: false
      - name: Restrict to public dependency-free core crates
        working-directory: compiler
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          Path('Cargo.toml').write_text('''[workspace]
          resolver = "2"
          members = ["crates/ir", "crates/opt", "crates/backend", "crates/backend-x86"]
          ''')
          PY
      - name: Run native trap and pointer-PHI differential check
        working-directory: compiler
        run: cargo test -p compiler-opt --test native_cfg_differential --offline -- --nocapture
      - name: Check target code under Clippy
        working-directory: compiler
        run: cargo clippy -p compiler-opt --test native_cfg_differential --offline -- -D warnings
