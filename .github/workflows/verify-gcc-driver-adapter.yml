name: Verify GCC driver adapter (source-only)

# Python parser tests and independent host C preprocessing/dependency smoke.
# CMake uses a GCC stand-in, not the private compiler.
on:
  pull_request:
    paths:
      - '.github/workflows/verify-gcc-driver-adapter.yml'
  workflow_dispatch:
    inputs:
      source_ref:
        description: Exact compiler commit or review branch to validate
        required: false
        type: string
        default: feature/gcc-driver-compile-adapter-20261121

permissions:
  contents: read

jobs:
  gcc-adapter:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout reviewed private compiler driver source
        uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: ${{ inputs.source_ref || 'b472d15136e6c7ba4bc8faa5602f35b7f91d83f9' }}
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
          path: compiler
          sparse-checkout: |
            tools/compiler-gcc.py
            tests/test_compiler_gcc.py
      - name: Run source-only adapter tests
        shell: bash
        run: |
          set -euo pipefail
          git -C compiler rev-parse HEAD | tee "$RUNNER_TEMP/gcc-driver-source-sha"
          python3 -m py_compile compiler/tools/compiler-gcc.py compiler/tests/test_compiler_gcc.py
          python3 -m unittest discover -s compiler/tests -p 'test_compiler_gcc.py' -v \
            2>&1 | tee "$RUNNER_TEMP/gcc-driver-tests.log"
      - name: Verify GCC -MD/-MT/-MF host preprocessing independently
        shell: bash
        run: |
          set -euo pipefail
          d="$(mktemp -d)"
          trap 'rm -rf "$d"' EXIT
          printf '#include "demo.h"\nint demo(void) { return ANSWER; }\n' > "$d/demo.c"
          printf '#define ANSWER 42\n' > "$d/demo.h"
          gcc -std=gnu11 -E -P -x c -MD -MT demo.o -MF "$d/demo.d" \
            "$d/demo.c" > "$d/demo.i"
          grep -F 'demo.o:' "$d/demo.d"
          grep -F 'demo.h' "$d/demo.d"
          grep -F 'return 42;' "$d/demo.i"
          echo "Host GCC CPP/dependency contract verified; native frontend and linking untested" \
            >> "$GITHUB_STEP_SUMMARY"
      - name: CMake Makefiles header rebuild smoke with reference codegen
        shell: bash
        run: |
          set -euo pipefail
          d="$(mktemp -d)"
          trap 'rm -rf "$d"' EXIT
          mkdir -p "$d/project"
          cp compiler/tools/compiler-gcc.py "$d/cc-adapter"
          chmod +x "$d/cc-adapter"
          cat > "$d/reference-native" <<'PY'
          #!/usr/bin/env python3
          """GCC codegen stand-in; not native TypeId correctness evidence."""
          import os
          import subprocess
          import sys
          argv = sys.argv[1:]
          assert argv[1:3] == ["--language", "mini-c"]
          assert argv[3:5] == ["--target", "x86_64"]
          assert argv[5:7] == ["--emit", "obj"]
          assert argv[7] == "-o"
          with open(os.environ["DRIVER_SMOKE_LOG"], "a", encoding="utf-8") as log:
              log.write("compile\n")
          raise SystemExit(subprocess.call(["gcc", "-c", argv[0], "-o", argv[8]]))
          PY
          chmod +x "$d/reference-native"
          cat > "$d/project/CMakeLists.txt" <<'EOF'
          cmake_minimum_required(VERSION 3.20)
          project(driver_probe C)
          add_library(check_object OBJECT demo.c)
          target_compile_definitions(check_object PRIVATE VALUE=42)
          EOF
          printf '#include "demo.h"\nint demo(void) { return VALUE + EXTRA; }\n' > "$d/project/demo.c"
          printf '#define EXTRA 7\n' > "$d/project/demo.h"
          export DRIVER_SMOKE_LOG="$d/native-invocations.log"
          export COMPILER_NATIVE_DRIVER="$d/reference-native"
          export COMPILER_HOST_CC=gcc
          cmake -S "$d/project" -B "$d/build" -G "Unix Makefiles" \
            -DCMAKE_C_COMPILER="$d/cc-adapter" \
            -DCMAKE_C_COMPILER_ID=GNU -DCMAKE_C_COMPILER_FORCED=TRUE \
            -DCMAKE_C_COMPILER_WORKS=TRUE
          : > "$DRIVER_SMOKE_LOG"
          cmake --build "$d/build" --verbose
          test "$(wc -l < "$DRIVER_SMOKE_LOG")" -eq 1
          cmake --build "$d/build" --verbose
          test "$(wc -l < "$DRIVER_SMOKE_LOG")" -eq 1
          sleep 1
          printf '#define EXTRA 8\n' > "$d/project/demo.h"
          cmake --build "$d/build" --verbose
          test "$(wc -l < "$DRIVER_SMOKE_LOG")" -eq 2
          echo "CMake Makefiles rebuild passed with reference codegen only" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload exact source revision and test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gcc-driver-adapter-source-log
          path: |
            ${{ runner.temp }}/gcc-driver-source-sha
            ${{ runner.temp }}/gcc-driver-tests.log
          if-no-files-found: ignore
          retention-days: 7
