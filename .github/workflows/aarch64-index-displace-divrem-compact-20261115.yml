name: AArch64 indexed displaced and I64 div/rem native TypeId migration
on:
  push:
    branches: [verify/aarch64-index-displace-divrem-compact-20261115]
    paths: ['.github/workflows/aarch64-index-displace-divrem-compact-20261115.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 1b1a98caea764fa9381a89a14410cf1cc227d715
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Verify exact compiler source
        run: test "$(git -C compiler rev-parse HEAD)" = "1b1a98caea764fa9381a89a14410cf1cc227d715"
      - name: Isolate native workspace
        run: |
          cat > compiler/Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir", "crates/backend", "crates/backend-aarch64"]
          EOF
          rm -f compiler/Cargo.lock
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: aarch64-index-displace-divrem-compact
      - name: Check compact fixtures canonical expansion and parser
        working-directory: compiler
        run: |
          cargo test -p compiler-backend-aarch64 --test native_fixed_v3_canonical -- --nocapture
          cargo test -p compiler-ir --test native_fixture_text --test native_module_text_v3
      - name: Install AArch64 cross compiler and QEMU
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends gcc-aarch64-linux-gnu libc6-dev-arm64-cross binutils-aarch64-linux-gnu qemu-user
      - name: Original machine quality ABI signed traps and C11 QEMU
        working-directory: compiler
        env:
          COMPILER_REQUIRE_AARCH64_QEMU: "1"
        run: |
          cargo test -p compiler-backend-aarch64 --test indexed_memory --test displaced_memory --test i64_div_rem -- --nocapture
      - name: Strict scoped Clippy
        working-directory: compiler
        run: cargo clippy -p compiler-backend-aarch64 --no-deps --test indexed_memory --test displaced_memory --test i64_div_rem --test native_fixed_v3_canonical -- -D warnings
