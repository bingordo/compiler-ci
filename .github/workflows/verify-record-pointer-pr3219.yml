name: Candidate native record pointer ABI PR 3219
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/verify-record-pointer-pr3219.yml']
permissions:
  contents: read
jobs:
  candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 26e7f0003c216a35771ab4358866fc61a5d1d208
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Verify exact candidate
        run: |
          test "$(git -C compiler rev-parse HEAD)" = 26e7f0003c216a35771ab4358866fc61a5d1d208
          echo "Compiler SHA: $(git -C compiler rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
          git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler/tools/mini-c-driver -> target
          key: mini-c-source-differential-v1
          cache-workspace-crates: 'true'
      - name: Run focused independent GCC oracle and affected tests
        run: |
          cargo test --manifest-path compiler/tools/mini-c-driver/Cargo.toml --test record_pointer_abi -- --nocapture
          cargo test --manifest-path compiler/tools/mini-c-driver/Cargo.toml --lib > "$RUNNER_TEMP/candidate-lib.log" 2>&1 || true
          cat "$RUNNER_TEMP/candidate-lib.log"
      - name: Existing mixed ABI regressions
        run: |
          cargo build --manifest-path compiler/tools/mini-c-driver/Cargo.toml --bin compiler-mini-c
          python3 compiler/tools/mini-c-driver/tests/differential.py --compiler "$PWD/compiler/tools/mini-c-driver/target/debug/compiler-mini-c" --mixed-only --timeout 15 --artifacts "$RUNNER_TEMP/record-pointer-failures"
      - name: Checkout unchanged base for regression comparison
        if: always()
        uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 538b310ddc40428abb3e07c61c52b81a34063fb4
          path: compiler-base
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Compare full library regression set with unchanged base
        if: always()
        run: |
          test "$(git -C compiler-base rev-parse HEAD)" = 538b310ddc40428abb3e07c61c52b81a34063fb4
          CARGO_TARGET_DIR="$PWD/compiler/tools/mini-c-driver/target" cargo test --manifest-path compiler-base/tools/mini-c-driver/Cargo.toml --lib > "$RUNNER_TEMP/base-lib.log" 2>&1 || true
          cat "$RUNNER_TEMP/base-lib.log"
          python3 - <<'PY'
          import os,re
          from pathlib import Path
          def outcomes(name):
              content=Path(os.environ["RUNNER_TEMP"], name+"-lib.log").read_text()
              assert re.search(r"test result: (?:ok|FAILED)\.",content), name+" did not complete"
              return set(re.findall(r"^test (.+) \.\.\. FAILED$",content,re.M))
          base,candidate=outcomes("base"),outcomes("candidate")
          print("BASE FAILURES",sorted(base))
          print("CANDIDATE FAILURES",sorted(candidate))
          assert not candidate-base, sorted(candidate-base)
          PY
