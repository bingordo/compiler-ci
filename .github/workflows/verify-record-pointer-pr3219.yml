name: Candidate native record pointer ABI PR 3219
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/verify-record-pointer-pr3219.yml']
permissions:
  contents: read
jobs:
  candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: e3d4e13846c57cd6033f90f70b379006dd5df32e
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Verify exact candidate
        run: |
          test "$(git -C compiler rev-parse HEAD)" = e3d4e13846c57cd6033f90f70b379006dd5df32e
          echo "Compiler SHA: $(git -C compiler rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
          git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler/tools/mini-c-driver -> target
          key: mini-c-source-differential-v1
          cache-workspace-crates: 'true'
      - name: Run focused independent GCC oracle and affected tests
        run: |
          cargo test --manifest-path compiler/tools/mini-c-driver/Cargo.toml --test record_pointer_abi -- --nocapture
          cargo test --manifest-path compiler/tools/mini-c-driver/Cargo.toml --lib
      - name: Existing mixed ABI regressions
        run: |
          cargo build --manifest-path compiler/tools/mini-c-driver/Cargo.toml --bin compiler-mini-c
          python3 compiler/tools/mini-c-driver/tests/differential.py --compiler "$PWD/compiler/tools/mini-c-driver/target/debug/compiler-mini-c" --mixed-only --timeout 15 --artifacts "$RUNNER_TEMP/record-pointer-failures"
