name: cJSON preprocessed GNU attribute context issue 3368
on:
  pull_request:
    paths: ['.github/workflows/verify-cjson-attribute-context-3368.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  context:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - name: Fetch exact unchanged cJSON source and reproduce host preprocessing
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch v1.7.19 https://github.com/DaveGamble/cJSON.git cjson
          test "$(git -C cjson rev-parse HEAD)" = c859b25da02955fef659d658b8f324b5cde87be3
          cc --version | head -n 1
          cc -std=gnu11 -E -P -x c cjson/cJSON.c -o cjson-preprocessed.c
          python3 - <<'PY'
          from pathlib import Path
          p=Path("cjson-preprocessed.c")
          data=p.read_bytes()
          pos=89838
          print(f"PREPROCESSED_CJSON_BYTES={len(data)}")
          print(f"ATTRIBUTE_ERROR_OFFSET={pos}")
          print("CONTEXT_BEGIN")
          print(data[max(0,pos-1200):pos+800].decode("utf-8","replace"))
          print("CONTEXT_END")
          print("PRECEDING_ATTRIBUTE_CONTEXTS_BEGIN")
          start=max(0,pos-2000)
          for match in range(start,min(len(data),pos+800)):
              if data.startswith(b"__attribute__",match):
                  print(f"attribute_at={match} snippet={data[max(0,match-90):match+180].decode('utf-8','replace')!r}")
          print("PRECEDING_ATTRIBUTE_CONTEXTS_END")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: cjson-preprocessed-attribute-context
          path: cjson-preprocessed.c
