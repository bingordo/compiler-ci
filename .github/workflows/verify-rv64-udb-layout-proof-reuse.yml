name: RV64 UDB reviewed layout proof reuse
on:
  pull_request:
    paths: ['.github/workflows/verify-rv64-udb-layout-proof-reuse.yml']
permissions:
  contents: read
jobs:
  rv64-verified-layout:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact compiler source candidate
        uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: a719b430a21306256feca8a221348ee33c7d8e1e
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Assert immutable compiler SHA
        run: test "$(git -C compiler rev-parse HEAD)" = "a719b430a21306256feca8a221348ee33c7d8e1e"
      - name: Verify exact generated native selector Rust and RISC-V leaf bytes
        working-directory: compiler
        run: |
          set -euo pipefail
          export PYTHONPATH="$PWD/tools"
          python3 -m py_compile tools/regen_riscv_native_selector_rules.py tools/test_riscv_native_selector_rules.py
          python3 tools/regen_riscv_native_selector_rules.py --check
          python3 tools/riscv_udb_rust_leaf_forms.py --catalog data/riscv_udb_r0_catalog.json --output crates/backend-riscv64/src/generated_encoding.rs --check
          python3 tools/regen_aarch64_native_selector_rules.py --check
          python3 tools/regen_x86_selector_rules.py --check
      - name: Run source-pinned RV64 semantic selector, UDB and ranked-index adversarial tests
        working-directory: compiler
        run: |
          set -euo pipefail
          export PYTHONPATH="$PWD/tools"
          python3 -m unittest discover -s tools -p test_riscv_native_selector_rules.py -v
          python3 -m unittest discover -s tools -p test_riscv_udb_rust_leaf_forms.py -v
          python3 -m unittest discover -s tools -p test_ranked_generator_index.py -v
