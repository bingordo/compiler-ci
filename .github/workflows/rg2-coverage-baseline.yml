# Compiler-owned regression validation and optional coverage; no new recurring schedule.
name: RG1 regression runner validation and optional coverage
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    paths:
      - '.github/workflows/rg2-coverage-baseline.yml'
  workflow_dispatch:
    inputs:
      source_ref:
        description: Compiler source ref (defaults to current main)
        default: main
        type: string
      lane:
        description: Targeted campaign (PRs run core smoke only)
        default: smoke
        type: choice
        options:
          - smoke
          - core-full
          - infrastructure
          - core-build
          - core-tests
          - doctest
          - gcc
          - minic
          - native-smoke
          - oberon
          - edg
          - all
      isolate_build_failures:
        description: Retry individual crates after aggregate compilation failure (expensive)
        default: false
        type: boolean
      coverage:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout exact compiler candidate
        uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 1b4ce299a03775cc21fd9c4589402e9f1c7900be
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Run selected full-tier offline tooling and orchestration
        working-directory: compiler
        run: |
          test "$(git rev-parse HEAD)" = 1b4ce299a03775cc21fd9c4589402e9f1c7900be
          git config user.name 'CI temporary tests'
          git config user.email 'ci@example.invalid'
          status=0
          python3 tools/regression.py --profile core --tier full --suite runner-selftest --suite python-tools-test_ct11_pass_accounting.py --suite python-tools-test_review_coverage.py --suite python-tools-test_ir_consumer_inventory.py --suite python-tools-test_vector_lane_semantics.py --suite python-tools-test_vector_patterns.py --suite python-tools-tests-test_m6_compile_summary.py --suite python-tools-tests-test_m6_runtime_summary.py --suite python-tools-tests-test_m6_source_corpus_summary.py --suite python-tools-test_check_mixed_function_export_boundary.py --output target/regression-offline-tooling > "$RUNNER_TEMP/rg-offline-tooling.log" 2>&1 || status=$?
          python3 - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('target/regression-offline-tooling/summary.json').read_text())
          names = ["runner-selftest","python-tools-test_ct11_pass_accounting.py","python-tools-test_review_coverage.py","python-tools-test_ir_consumer_inventory.py","python-tools-test_vector_lane_semantics.py","python-tools-test_vector_patterns.py","python-tools-tests-test_m6_compile_summary.py","python-tools-tests-test_m6_runtime_summary.py","python-tools-tests-test_m6_source_corpus_summary.py","python-tools-test_check_mixed_function_export_boundary.py"]
          rows = [row for row in report['suites'] if row['suite'] in names]
          print("Offline tooling suite outcomes:", [(r['suite'], r['status'], r.get('test_counts'), r.get('elapsed_seconds')) for r in rows])
          assert len(rows) == len(names) and {r['suite'] for r in rows} == set(names)
          assert all(r['status'] == 'passed' for r in rows)
          PY
          exit "$status"

  gcc-smoke:
    if: inputs.lane == 'gcc' || inputs.lane == 'minic' || inputs.lane == 'all' || github.event.label.name == 'rg-gcc' || github.event.label.name == 'rg-minic' || github.event.label.name == 'rg-all' || (inputs.lane == 'native-smoke' || github.event.label.name == 'rg-native-smoke')
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: ${{ inputs.source_ref || 'main' }}
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.CI_KEY }}
      - uses: actions/cache@v4
        if: inputs.lane != 'minic' && github.event.label.name != 'rg-minic' && !(inputs.lane == 'native-smoke' || github.event.label.name == 'rg-native-smoke')
        with:
          path: compiler/target/gcc-source
          key: gcc-corpus-1330eed38849ad186518f609c52bd5651c2bfdc1
      - name: Restore public Cargo registry archives
        id: public-registry
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry/index/index.crates.io-*
            ~/.cargo/registry/cache/index.crates.io-*
          key: rg-public-registry-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('compiler/**/Cargo.toml', 'compiler/**/Cargo.lock') }}
          restore-keys: |
            rg-public-registry-v2-${{ runner.os }}-${{ runner.arch }}-
      - name: Run one original upstream ABI case with automatic adapter
        if: inputs.lane != 'minic' && github.event.label.name != 'rg-minic' && !(inputs.lane == 'native-smoke' || github.event.label.name == 'rg-native-smoke')
        working-directory: compiler
        run: |
          python3 tools/regression.py --gcc-abi quick --gcc-prefix scalar-by-value-2 --output target/regression-gcc-smoke
          python3 - <<'PY'
          import json
          from pathlib import Path
          summary = json.loads(Path('target/regression-gcc-smoke/summary.json').read_text())
          report = json.loads((Path(summary['gcc_abi_work']) / 'report.json').read_text())
          for opt in ('-O0', '-O2'):
              assert any(r['case'] == 'scalar-by-value-2' and opt in r['gcc_flags']
                         and r['frontends']['minic']['directions'].get('main', {}).get('status') == 'PASS'
                         for r in report['records']), 'required known native direction did not pass'
          print('GCC smoke: previously admitted mixed main directions passed at O0/O2')
          PY

      - name: Resolve canonical Mini-C corpus revision
        id: minic-corpus
        if: always() && ((inputs.lane == 'minic' || inputs.lane == 'all' || github.event.label.name == 'rg-minic' || github.event.label.name == 'rg-all') || (inputs.lane == 'native-smoke' || github.event.label.name == 'rg-native-smoke'))
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import tomllib
          from pathlib import Path
          print("sha=" + tomllib.loads(Path("compiler/tools/mini-c-driver/Cargo.toml").read_text())["dependencies"]["mini-c-syntax"]["rev"])
          PY
      - name: Checkout exact Mini-C libc corpus and validator
        if: always() && ((inputs.lane == 'minic' || inputs.lane == 'all' || github.event.label.name == 'rg-minic' || github.event.label.name == 'rg-all') || (inputs.lane == 'native-smoke' || github.event.label.name == 'rg-native-smoke'))
        uses: actions/checkout@v4
        with:
          repository: bingordo/mini-c
          ref: ${{ steps.minic-corpus.outputs.sha }}
          path: mini-c
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Build standalone source generator once for explicit Mini-C lane
        if: always() && (inputs.lane == 'minic' || inputs.lane == 'all' || github.event.label.name == 'rg-minic' || github.event.label.name == 'rg-all')
        run: |
          cargo build --manifest-path mini-c/Cargo.toml -p mini-c-fuzz --bin mini-c-fuzz --target-dir "$RUNNER_TEMP/minic-generator" >"$RUNNER_TEMP/minic-generator-build.log" 2>&1
      - name: Focused native Mini-C acceptance (one build)
        if: (inputs.lane == 'native-smoke' || github.event.label.name == 'rg-native-smoke')
        working-directory: compiler
        run: |
          python3 tools/regression.py --frontend-suite c --frontend-suite upstream-c --frontend-suite specialized-c --c-case aggregate_places --c-case fp_pointer_memory --c-case record_pointer_abi --upstream-case gcc_calls_mini_f64 --upstream-case mini_calls_gcc_variadic_fixed_sse_and_ellipsis --specialized-case compound:scalar_lvalue_address --specialized-case ptrdiff:positive_negative_int_elements --seed-count 1 --c-frontend minic --output target/regression-minic-native-smoke
      - name: Provision Csmith for the explicit Mini-C campaign
        if: always() && (inputs.lane == 'minic' || inputs.lane == 'all' || github.event.label.name == 'rg-minic' || github.event.label.name == 'rg-all')
        id: minic-csmith
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y csmith libcsmith-dev
          header="$(find /usr/include /usr/local/include -name csmith.h -print -quit)"
          test -s "$header"
          echo "include=$(dirname "$header")" >> "$GITHUB_OUTPUT"
      - name: Run shared C and libc through the standalone Mini-C driver
        if: always() && steps.minic-csmith.outcome == 'success' && (inputs.lane == 'minic' || inputs.lane == 'all' || github.event.label.name == 'rg-minic' || github.event.label.name == 'rg-all')
        working-directory: compiler
        run: |
          python3 tools/regression.py --frontend-suite c --frontend-suite libc --frontend-suite upstream-c --frontend-suite specialized-c --frontend-suite upstream-fuzz --minic-fuzzer "$RUNNER_TEMP/minic-generator/debug/mini-c-fuzz" --frontend-suite csmith --csmith-include "${{ steps.minic-csmith.outputs.include }}" --c-frontend minic --seed-count 1 --output target/regression-minic-c
      - name: Run standalone Mini-C Rust regression workspace
        if: always() && (inputs.lane == 'minic' || inputs.lane == 'all' || github.event.label.name == 'rg-minic' || github.event.label.name == 'rg-all')
        working-directory: compiler
        run: python3 tools/regression.py --frontend-suite minic-tests --output target/regression-minic-rust
      - name: Save public Cargo registry archives
        if: always() && steps.public-registry.outcome == 'success' && steps.public-registry.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cargo/registry/index/index.crates.io-*
            ~/.cargo/registry/cache/index.crates.io-*
          key: ${{ steps.public-registry.outputs.cache-primary-key }}

  oberon-regression:
    if: inputs.lane == 'oberon' || inputs.lane == 'all' || github.event.label.name == 'rg-oberon' || github.event.label.name == 'rg-all'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: ${{ inputs.source_ref || 'main' }}
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.CI_KEY }}
      - name: Resolve pinned Oberon frontend
        id: oberon
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import tomllib
          from pathlib import Path
          print("sha=" + tomllib.loads(Path("compiler/crates/driver/Cargo.toml").read_text())["dependencies"]["oberon-front-ir"]["rev"])
          PY
      - uses: actions/checkout@v4
        with:
          repository: bingordo/oberon
          ref: ${{ steps.oberon.outputs.sha }}
          path: oberon
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Restore public Cargo registry archives
        id: public-registry
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry/index/index.crates.io-*
            ~/.cargo/registry/cache/index.crates.io-*
          key: rg-public-registry-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('compiler/**/Cargo.toml', 'compiler/**/Cargo.lock') }}
          restore-keys: |
            rg-public-registry-v2-${{ runner.os }}-${{ runner.arch }}-
      - name: Build exact reference generators
        run: |
          cargo build --manifest-path oberon/oberon/Cargo.toml --bin obgen --bin obc
      - name: Execute native and generated Oberon tests
        working-directory: compiler
        run: |
          python3 tools/regression.py --frontend-suite oberon \
            --obgen "$GITHUB_WORKSPACE/oberon/oberon/target/debug/obgen" \
            --obc "$GITHUB_WORKSPACE/oberon/oberon/target/debug/obc" \
            --seed-count 1 --output target/regression-oberon
      - name: Save public Cargo registry archives
        if: always() && steps.public-registry.outcome == 'success' && steps.public-registry.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cargo/registry/index/index.crates.io-*
            ~/.cargo/registry/cache/index.crates.io-*
          key: ${{ steps.public-registry.outputs.cache-primary-key }}

  edg-regression:
    if: inputs.lane == 'edg' || inputs.lane == 'all' || github.event.label.name == 'rg-edg' || github.event.label.name == 'rg-all' || (inputs.lane == 'native-smoke' || github.event.label.name == 'rg-native-smoke')
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    container:
      image: ghcr.io/edgcpp/ci-runner@sha256:14b3948c2ce12cfa5472e5a6c468393d15426f3a67685cc35d830ea5db2acdf8
    defaults:
      run:
        shell: edg-container-exec "bash -eo pipefail {0}"
    env:
      EDG_SOURCE_SHA: b195677be8b9b56c8337afad6be8064d21a54082
      EDG_RELEASE_TAG: edgcpfe-v2026.11.14-upstream-177765bb7731
      EDG_RELEASE_SHA256: 1ce495b629924f31382ecccc891a7a72caae1014ddfa2ba7dd39b44d8b0a9526
      EDGCPP_SOURCE_DIR: ${{ github.workspace }}/edgcpp
      EDGCPP_COMPILE_COMMANDS: ${{ github.workspace }}/edgcpp/build/gcc-release/compile_commands.json
      EDGCPP_LIB_DIR: ${{ github.workspace }}/edgcpp/build/gcc-release/lib
      EDGCPP_EDG_REVISION: b195677be8b9b56c8337afad6be8064d21a54082
      CARGO_PROFILE_DEV_DEBUG: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: ${{ inputs.source_ref || 'main' }}
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: bingundu/edgcpp
          ref: b195677be8b9b56c8337afad6be8064d21a54082
          path: edgcpp
          persist-credentials: false
      - name: Read compiler-pinned EDG bridge SHA
        id: bridge
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import tomllib
          from pathlib import Path
          print("sha=" + tomllib.loads(Path("compiler/tools/edg-driver/Cargo.toml").read_text())["dependencies"]["edgcpp"]["rev"])
          PY
      - uses: actions/checkout@v4
        with:
          repository: bingordo/edgcpp-rust
          ref: ${{ steps.bridge.outputs.sha }}
          path: edgcpp-rust
          persist-credentials: false
      - name: Restore verified public EDG archive download
        id: edg-archive-cache
        uses: actions/cache/restore@v4
        with:
          path: edgcpp/build/prebuilt-edg/archive.tar.gz
          key: rg-edg-public-archive-${{ env.EDG_RELEASE_SHA256 }}
      - name: Restore verified public YARPGen archive download
        if: ${{ !(inputs.lane == 'native-smoke' || github.event.label.name == 'rg-native-smoke') }}
        id: yarpgen-archive-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/yarpgen/archive.tar.gz
          key: rg-yarpgen-public-archive-fc3c7c80c10c67782c03f9d8b70c426f942332e78701397a14a5edff81cbc2e8
      - name: Configure matching EDG headers and checked prebuilt callable archive
        id: edg-archive-verified
        working-directory: edgcpp
        env:
          EDG_BASE: ${{ github.workspace }}/edgcpp/bases/docker/dev-env/gcc
        run: |
          test "$(git rev-parse HEAD)" = "$EDG_SOURCE_SHA"
          cmake --preset linux-gcc-release -DEDG_BUILD_LIB=OFF -DEDG_BUILD_CALLABLE_LIBRARY=ON -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
          cmake --build build/gcc-release --target error-info --parallel 2
          mkdir -p build/gcc-release/lib build/prebuilt-edg
          if ! printf '%s  %s\n' "$EDG_RELEASE_SHA256" build/prebuilt-edg/archive.tar.gz | sha256sum -c --status; then
            curl --fail --location --silent --show-error --retry 4 \
              "https://github.com/bingundu/edgcpp/releases/download/$EDG_RELEASE_TAG/edgcpfe-ci-upstream-callable-edg-release-20261114-linux-x86_64.tar.gz" \
              -o build/prebuilt-edg/archive.tar.gz
          fi
          printf '%s  %s\n' "$EDG_RELEASE_SHA256" build/prebuilt-edg/archive.tar.gz | sha256sum -c -
          tar -xzf build/prebuilt-edg/archive.tar.gz -C build/prebuilt-edg
          grep -Fx "commit=$EDG_SOURCE_SHA" build/prebuilt-edg/BUILD-INFO.txt
          cp build/prebuilt-edg/lib/libedgcpfe.a build/gcc-release/lib/libedgcpfe.a
      - name: Save checksum-verified public EDG archive before native tests
        if: steps.edg-archive-verified.outcome == 'success' && steps.edg-archive-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: edgcpp/build/prebuilt-edg/archive.tar.gz
          key: ${{ steps.edg-archive-cache.outputs.cache-primary-key }}
      - name: Build source-pinned native EDG driver and configure launcher
        id: edg-build
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          if ! command -v cargo >/dev/null; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain 1.99.1
          fi
          rustup toolchain install 1.99.1 --profile minimal
          rustup default 1.99.1
          cargo build --manifest-path compiler/tools/edg-driver/Cargo.toml
          test -x compiler/tools/edg-driver/target/debug/compiler-edg-driver
          cat > "$RUNNER_TEMP/edg-launcher" <<'SH'
          #!/usr/bin/env bash
          set -e
          cd "$GITHUB_WORKSPACE/edgcpp/build/gcc-release"
          source environment.sh
          exec "$GITHUB_WORKSPACE/compiler/tools/edg-driver/target/debug/compiler-edg-driver" "$@"
          SH
          chmod +x "$RUNNER_TEMP/edg-launcher"
      - name: Resolve canonical Mini-C corpus revision
        id: minic-corpus
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import tomllib
          from pathlib import Path
          print("sha=" + tomllib.loads(Path("compiler/tools/mini-c-driver/Cargo.toml").read_text())["dependencies"]["mini-c-syntax"]["rev"])
          PY
      - name: Checkout exact Mini-C libc corpus and validator
        uses: actions/checkout@v4
        with:
          repository: bingordo/mini-c
          ref: ${{ steps.minic-corpus.outputs.sha }}
          path: mini-c
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Build standalone source generator once for explicit EDG lane
        if: ${{ !(inputs.lane == 'native-smoke' || github.event.label.name == 'rg-native-smoke') }}
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          cargo build --manifest-path mini-c/Cargo.toml -p mini-c-fuzz --bin mini-c-fuzz --target-dir "$RUNNER_TEMP/minic-generator" >"$RUNNER_TEMP/minic-generator-build.log" 2>&1
      - name: Focused native EDG acceptance (one build)
        if: (inputs.lane == 'native-smoke' || github.event.label.name == 'rg-native-smoke')
        working-directory: compiler
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          python3 tools/regression.py --frontend-suite c --frontend-suite upstream-c --frontend-suite specialized-c --c-case aggregate_places --c-case fp_pointer_memory --c-case record_pointer_abi --upstream-case gcc_calls_mini_f64 --upstream-case mini_calls_gcc_variadic_fixed_sse_and_ellipsis --specialized-case compound:scalar_lvalue_address --specialized-case ptrdiff:positive_negative_int_elements --seed-count 1 --c-frontend edg --edg-driver "$RUNNER_TEMP/edg-launcher" --output target/regression-edg-native-smoke
      - name: Run common portable C corpus using native EDG
        if: ${{ !(inputs.lane == 'native-smoke' || github.event.label.name == 'rg-native-smoke') }}
        working-directory: compiler
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          python3 tools/regression.py --frontend-suite c --frontend-suite libc --frontend-suite upstream-c --frontend-suite specialized-c --frontend-suite upstream-fuzz --minic-fuzzer "$RUNNER_TEMP/minic-generator/debug/mini-c-fuzz" --c-frontend edg --edg-driver "$RUNNER_TEMP/edg-launcher" --seed-count 1 --output target/regression-edg-c
      - name: Run standalone EDG Rust regression workspace
        if: always() && steps.edg-build.outcome == 'success' && !(inputs.lane == 'native-smoke' || github.event.label.name == 'rg-native-smoke')
        working-directory: compiler
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          python3 tools/regression.py --frontend-suite edg-tests --output target/regression-edg-rust
      - name: Provision existing Csmith and verified YARPGen
        id: generators
        if: always() && steps.edg-build.outcome == 'success' && !(inputs.lane == 'native-smoke' || github.event.label.name == 'rg-native-smoke')
        run: |
          if command -v apt-get >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y csmith libcsmith-dev gcc clang
          elif command -v dnf >/dev/null; then
            sudo dnf install -y csmith csmith-devel clang gcc
          elif command -v zypper >/dev/null; then
            sudo zypper --non-interactive install csmith clang gcc
          else
            echo 'Unsupported EDG container package manager'; cat /etc/os-release; exit 2
          fi
          header="$(find /usr/include /usr/local/include -name csmith.h -print -quit)"
          test -s "$header"
          echo "CSMITH_INCLUDE=$(dirname "$header")" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/yarpgen"
          if ! printf '%s  %s\n' fc3c7c80c10c67782c03f9d8b70c426f942332e78701397a14a5edff81cbc2e8 "$RUNNER_TEMP/yarpgen/archive.tar.gz" | sha256sum -c --status; then
            curl --fail --location --silent --show-error --retry 3 \
              "https://github.com/bingundu/yarpgen/releases/download/yarpgen-binary-20261028-1/yarpgen-linux-x86_64.tar.gz" \
              -o "$RUNNER_TEMP/yarpgen/archive.tar.gz"
          fi
          printf '%s  %s\n' fc3c7c80c10c67782c03f9d8b70c426f942332e78701397a14a5edff81cbc2e8 "$RUNNER_TEMP/yarpgen/archive.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/yarpgen/archive.tar.gz" -C "$RUNNER_TEMP/yarpgen"
      - name: Save checksum-verified public YARPGen archive before native tests
        if: always() && steps.generators.outcome == 'success' && steps.yarpgen-archive-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/yarpgen/archive.tar.gz
          key: ${{ steps.yarpgen-archive-cache.outputs.cache-primary-key }}
      - name: Run original Csmith and YARPGen against native EDG
        if: always() && steps.generators.outcome == 'success'
        working-directory: compiler
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          python3 tools/regression.py --frontend-suite csmith --frontend-suite yarpgen \
            --c-frontend edg --edg-driver "$RUNNER_TEMP/edg-launcher" \
            --edg-sha "${{ steps.bridge.outputs.sha }}" --edg-compiler-sha "$(git rev-parse HEAD)" \
            --csmith-include "$CSMITH_INCLUDE" --seed-count 1 \
            --yarpgen-harness "$GITHUB_WORKSPACE/edgcpp-rust/tools/yarpgen_smoke.py" \
            --yarpgen-binary "$RUNNER_TEMP/yarpgen/yarpgen-linux-x86_64/yarpgen" \
            --output target/regression-edg-generators
