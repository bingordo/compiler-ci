name: LTO cross-unit function resolution
on:
  push:
    branches: [verify/lto-function-resolution-20261114]
    paths:
      - '.github/workflows/lto-function-resolution-20261114.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  resolve:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: c9bb2f5595640018bcedcef56c4b850093d59bc9
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Pin source revision
        run: test "$(git -C compiler rev-parse HEAD)" = "c9bb2f5595640018bcedcef56c4b850093d59bc9"
      - name: Restrict workspace to IR crate
        run: |
          cat > compiler/Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir"]
          EOF
          rm -f compiler/Cargo.lock
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: lto-function-resolution
      - name: Verify cross-unit ABI resolution, IR regressions, lint
        working-directory: compiler
        run: |
          cargo test -p compiler-ir --test lto_function_resolution
          cargo test -p compiler-ir
          cargo clippy -p compiler-ir --tests -- -D warnings
