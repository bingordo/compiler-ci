# Diagnose M5 measurement plumbing. Shared runners never certify speedups.
name: Optimization quality M5 diagnostic measurements
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/opt-quality-m5-diagnostic.yml']
permissions:
  contents: read
concurrency:
  group: opt-quality-m5-${{ github.ref }}
  cancel-in-progress: true
jobs:
  diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      COMPILER_SHA: 5eaae7e2f1c37d44db4fc904228bc8ccc9df4ff7
      CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: ${{ env.COMPILER_SHA }}
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Verify source pin and offline measurement invariants
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p results
          test "$(git -C compiler rev-parse HEAD)" = "$COMPILER_SHA"
          git -C compiler rev-parse HEAD > results/compiler-sha.txt
          python3 -m py_compile compiler/tools/opt_quality_public_m5_measure.py compiler/tools/test_opt_quality_public_m5_measure.py
          python3 -m unittest discover -s compiler/tools -p 'test_opt_quality_public_m5_measure.py' -v |& tee results/contract-tests.log
      - name: Configure public Mini-C dependencies
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path("compiler/tools/mini-c-driver/Cargo.toml")
          s=p.read_text()
          old="ssh://git@github.com/bingordo/mini-c.git"
          assert s.count(old)==2
          p.write_text(s.replace(old,"https://github.com/bingordo/mini-c.git"))
          PY
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler/tools/mini-c-driver -> target
          key: opt-quality-m5
      - name: Build native TypeId Mini-C compiler
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=10s 12m cargo build \
            --manifest-path compiler/tools/mini-c-driver/Cargo.toml \
            -p compiler-mini-c --bin compiler-mini-c
      - name: Correctness-gated diagnostic sampling, no speedups
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=10s 6m python3 \
            compiler/tools/opt_quality_public_m5_measure.py \
            --compiler "$PWD/compiler/tools/mini-c-driver/target/debug/compiler-mini-c" \
            --rounds 3 --output results/m5-diagnostic.json |& tee results/m5-diagnostic.log
          python3 - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('results/m5-diagnostic.json').read_text())
          assert r['correctness']=='PASS'
          assert r['input_count']==3
          assert r['rounds']==3
          assert not r['dedicated_host_attested']
          assert r['eligible_input_count']==0
          assert len(r['measurements'])==3
          for x in r['measurements'].values():
              assert x['classification']=='DIAGNOSTIC_SHARED_OR_UNATTESTED_HOST'
              assert not any('ratio' in k for k in x)
              assert all(len(v)==3 for v in x['samples_ns'].values())
          assert set(r['text_section_bytes'])=={'gcc','clang','native'}
          print('M5_RAW_COMPLETE correctness=PASS no_speedup_claims=true')
          PY
          echo 'Diagnostic M5 sampling passed; shared-runner timing not scoreable' >> "$GITHUB_STEP_SUMMARY"
      - name: Upload raw diagnostics and provenance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: opt-quality-m5-${{ env.COMPILER_SHA }}
          path: results/
          retention-days: 30
