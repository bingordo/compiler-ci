name: AArch64 GP structural validator reuse and source parity
on:
  pull_request:
    paths: ['.github/workflows/verify-a64-gp-structural-dedup.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  a64-gp-generator-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout immutable compiler candidate
        uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: b94543ad2bfe3a86442466e91503e2627f5e3a59
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Assert exact compiler commit
        run: test "$(git -C compiler rev-parse HEAD)" = "b94543ad2bfe3a86442466e91503e2627f5e3a59"
      - name: Verify exact generated AArch64 GP and FP output
        working-directory: compiler
        run: |
          set -euo pipefail
          export PYTHONPATH="$PWD/tools"
          python3 tools/regen_aarch64_scalar_gp_forms.py --check
          python3 tools/regen_aarch64_scalar_fp_forms.py --check
          python3 tools/regen_aarch64_native_selector_rules.py --check
      - name: Full independently reviewed GP/FP and native-selector mutation suites
        working-directory: compiler
        run: |
          set -euo pipefail
          export PYTHONPATH="$PWD/tools"
          python3 -m unittest discover -s tools -p test_regen_aarch64_scalar_gp_forms.py -v
          python3 -m unittest discover -s tools -p test_regen_aarch64_scalar_fp_forms.py -v
          python3 -m unittest discover -s tools -p test_regen_aarch64_native_selector_rules.py -v
