name: M49 Mini-C checked expression spans
on:
  pull_request:
    paths: ['.github/workflows/m49-mini-c-checked-expr-spans-289.yml']
permissions:
  contents: read
jobs:
  checker-spans:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/mini-c
          ref: 754e6bf8b14c82b414dcc3bbdc0119384988476b
          path: mini-c
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Resolve checked frontend dependencies
        run: git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
      - name: Source-pinned checked expression origins and full checker tests
        working-directory: mini-c
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "754e6bf8b14c82b414dcc3bbdc0119384988476b"
          cargo test -p mini-c-sema --test checked_expression_spans -- --nocapture
          cargo test -p mini-c-sema
          cargo check --workspace
