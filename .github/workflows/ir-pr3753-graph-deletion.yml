# Temporary deletion-first compile inventory, never merge.
name: IR PR3753 legacy graph deletion
on:
  pull_request:
    paths: ['.github/workflows/ir-pr3753-graph-deletion.yml']
permissions:
  contents: read
jobs:
  fallout:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      SOURCE_SHA: 554ee5ebdd23635ab2c5712ea0817f0c082484c9
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: ${{ env.SOURCE_SHA }}
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
          path: compiler
      - name: Verify graph deletion and inventory direct dependents
        working-directory: compiler
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          if git grep -nE '^pub struct (Function|Block|Instruction|Parameter|ModuleSnapshot|TypedModule|TypeAnnotatedModule)\b' -- crates/ir/src; then exit 1; else test "$?" -eq 1; fi
          echo 'Remaining historical graph dependencies grouped by file:'
          git grep -l -E 'legacy-ssa-oracle|historical-function-oracle|ModuleSnapshot|TypeAnnotatedModule|FunctionValueTypes|from_annotated|project_legacy_compat_function|\.to_legacy\(|TypedSsaModule::from_legacy|compiler_ir::\{[^}]*\b(Function|Block|Instruction|Parameter)\b|compiler_ir::(Function|Block|Instruction|Parameter)\b' -- '*.rs' '*.toml' | sort || test "$?" -eq 1
          cat > Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir", "crates/ir-macros", "crates/opt", "crates/backend", "crates/backend-x86", "crates/backend-aarch64", "crates/backend-riscv64", "crates/backend-wasm", "crates/lto-plugin-core"]
          EOF
          rm -f Cargo.lock
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: ir-graph-deletion
      - name: Default production library compilation
        working-directory: compiler
        run: cargo check --workspace --lib --keep-going
      - name: All target compilation fallout
        if: ${{ !cancelled() }}
        working-directory: compiler
        run: cargo check --workspace --all-targets --keep-going
      - name: IR unit and integration compilation fallout
        if: ${{ !cancelled() }}
        working-directory: compiler
        run: cargo check -p compiler-ir --all-targets --keep-going
      - name: Frozen independent verifier verdicts
        if: ${{ !cancelled() }}
        working-directory: compiler
        run: cargo test -p compiler-ir --test typed_verifier_parity
      - name: Run native IR regression tests
        if: ${{ !cancelled() }}
        working-directory: compiler
        run: cargo test -p compiler-ir --no-fail-fast
      - name: Run x86 native allocation and compare identity
        if: ${{ !cancelled() }}
        working-directory: compiler
        run: cargo test -p compiler-backend-x86 --test callee_saved_native --test t5_x86_ssa_compare_provenance --test m4_7_indirect_ssa_native --test m4_7_gp_variadic_native --no-fail-fast
      - name: Run migrated native optimizer oracle suites
        if: ${{ !cancelled() }}
        working-directory: compiler
        run: cargo test -p compiler-opt --test generated_native_oracle --test al05_affine_native_bridge --test al05_parameterized_native_bridge --test al05_linear_native_bridge --test al05_diamond_native_bridge --test al05_dag_native_bridge --test typed_licm_native --test typed_induction_native --test typed_algebra --test lto_crossunit_optimization --test module_signatures --test loop_trap_semantics --test pre_licm_semantic_matrix --test memory_execution_oracle --no-fail-fast
      - name: Run native x86 unit and T5 selection tests
        if: ${{ !cancelled() }}
        working-directory: compiler
        run: |
          if ! command -v z3; then sudo apt-get update -qq && sudo apt-get install -y z3; fi
          cargo test -p compiler-backend-x86 --lib --test t5_x86_semantics --no-fail-fast
      - name: Compile and run Alive-lite non-SMT regressions
        if: ${{ !cancelled() }}
        working-directory: compiler
        run: cargo test -p compiler-opt --test alive_lite --no-fail-fast
