      - name: Build optimizer test executables
        working-directory: compiler
        run: cargo test -p compiler-opt --no-run --test generated_native_oracle --test al05_affine_native_bridge --test al05_parameterized_native_bridge --test al05_linear_native_bridge --test al05_diamond_native_bridge --test al05_dag_native_bridge
      - name: generated_native_oracle
