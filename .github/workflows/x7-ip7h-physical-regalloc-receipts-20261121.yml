name: X7 IP7h post-coloring LEA32 physical allocation receipts
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/x7-ip7h-physical-regalloc-receipts-20261121.yml'
permissions:
  contents: read
jobs:
  exact-source-physical-regalloc:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 78ef3d699da0f3a36e52d3be1bbf6104ed117d10
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Verify exact candidate SHA and native dependencies
        run: |
          set -euo pipefail
          test "$(git -C compiler rev-parse HEAD)" = "78ef3d699da0f3a36e52d3be1bbf6104ed117d10"
          git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
          git config --global --add url."https://github.com/".insteadOf "git@github.com:"
          rustc --version
          gcc --version | head -1
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: x7-ip7h-lea32-regalloc-20261121
      - name: Validate real x86 native SSA allocation and LEA32 nonadmission
        working-directory: compiler
        run: |
          set -euo pipefail
          cargo test -p compiler-backend-x86 --lib \
            --features x7-ip7-workload-profile \
            x7_ip7h_allocated_lea -- --nocapture
          cargo test -p compiler-backend-x86 --lib \
            --features x7-ip7-workload-profile \
            x7_ip7_lea_census -- --nocapture
          cargo test -p compiler-backend-x86 --test x7_ip7g_lea32_sib_crosscheck \
            --features x7-ip7-workload-profile -- --nocapture
          cargo test -p compiler-backend-x86 --test x7_ip7d_lea32_physical \
            --features x7-ip7-workload-profile -- --nocapture
          cargo test -p compiler-backend-x86 --lib \
            --features x7-ip7-workload-profile --quiet
          cargo clippy -p compiler-backend-x86 --lib \
            --features x7-ip7-workload-profile -- \
            -D clippy::correctness -D clippy::suspicious -A clippy::empty_line_after_doc_comments
          cargo clippy -p compiler-backend-x86 --test x7_ip7g_lea32_sib_crosscheck \
            --features x7-ip7-workload-profile -- \
            -D clippy::correctness -D clippy::suspicious -A clippy::empty_line_after_doc_comments
