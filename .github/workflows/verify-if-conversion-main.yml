name: Validate merged if-conversion main revision
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-if-conversion-main.yml'
permissions:
  contents: read
concurrency:
  group: verify-if-conversion-main-once
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 8e1e5d6929383dd2fd38fff244dcb89582606ee9
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Report merged revision
        run: git -C compiler rev-parse HEAD | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Restrict workspace to compiler core
        shell: bash
        run: |
          cat > compiler/Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir", "crates/opt", "crates/backend", "crates/backend-x86"]
          EOF
          rm -f compiler/Cargo.lock
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: if-conversion-single-scan
      - name: Test merged compiler core and x86 backend
        working-directory: compiler
        run: cargo test -p compiler-ir -p compiler-opt -p compiler-backend -p compiler-backend-x86
