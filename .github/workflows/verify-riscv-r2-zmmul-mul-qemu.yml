            li a0, -2147483648
            li a1, -1
            call rv64_mul32_leaf
            li t0, -2147483648
            bne a0, t0, fail25
            bne sp, s0, fail_sp
            li a0, -2147483648
            li a1, 2
            call rv64_mul32_leaf
            li t0, 0
            bne a0, t0, fail26
            bne sp, s0, fail_sp
            li a0, 2147483647
            li a1, 2
            call rv64_mul32_leaf
            li t0, -2
            bne a0, t0, fail27
            bne sp, s0, fail_sp
            li a0, 65536
            li a1, 65536
            call rv64_mul32_leaf
            li t0, 0
            bne a0, t0, fail28
            bne sp, s0, fail_sp
            li a0, 32768
            li a1, 32768
            call rv64_mul32_leaf
            li t0, 1073741824
            bne a0, t0, fail29
            bne sp, s0, fail_sp
            li a0, -32768
            li a1, -32768
            call rv64_mul32_leaf
            li t0, 1073741824
            bne a0, t0, fail30
            bne sp, s0, fail_sp
            li a0, 46341
            li a1, 46341
            call rv64_mul32_leaf
            li t0, -2147479015
            bne a0, t0, fail31
            bne sp, s0, fail_sp
            li a0, -46341
            li a1, 46341
            call rv64_mul32_leaf
            li t0, 2147479015
            bne a0, t0, fail32
            bne sp, s0, fail_sp
            li a0, -2147483648
            li a1, -2147483648
            call rv64_mul32_leaf
            li t0, 0
            bne a0, t0, fail33
            bne sp, s0, fail_sp
            li a0, -2147483648
            li a1, 2147483647
            call rv64_mul32_leaf
            li t0, -2147483648
            bne a0, t0, fail34
            bne sp, s0, fail_sp
            li a0, 0x7fffffff
            li a1, 0x7fffffff
            call rv64_mul32_leaf
            li t0, 1
            bne a0, t0, fail35
            bne sp, s0, fail_sp
            li a0, -123456789
            li a1, 987654321
            call rv64_mul32_leaf
            li t0, 67153019
            bne a0, t0, fail36
            bne sp, s0, fail_sp
            li a0, 1431655765
            li a1, -1431655766
            call rv64_mul32_leaf
            li t0, 1908874354
            bne a0, t0, fail37
            bne sp, s0, fail_sp
            li a0, -987654321
            li a1, -123456789
            call rv64_mul32_leaf
            li t0, -67153019
            bne a0, t0, fail38
            bne sp, s0, fail_sp
            li a0, 0x80000001
            li a1, 0x80000001
            call rv64_mul32_leaf
            li t0, 1
            bne a0, t0, fail39
            bne sp, s0, fail_sp
            li a0, 0xffffffff
            li a1, 0xffffffff
            call rv64_mul32_leaf
            li t0, 1
            bne a0, t0, fail40
            bne sp, s0, fail_sp
            li a0, 0
            j exit
          fail1: li a0, 1
            j exit
          fail2: li a0, 2
            j exit
          fail3: li a0, 3
            j exit
          fail4: li a0, 4
            j exit
          fail5: li a0, 5
            j exit
          fail6: li a0, 6
            j exit
          fail7: li a0, 7
            j exit
          fail8: li a0, 8
