name: RV64 R2 Zmmul MUL MULW GNU GAS QEMU
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/verify-riscv-r2-zmmul-mul-qemu.yml']
permissions:
  contents: read
jobs:
  logic:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: b905a20dcef3f110bc6ae5c6d3f2d69f921fdf99
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Require exact compiler source revision
        run: test "$(git -C compiler rev-parse HEAD)" = "b905a20dcef3f110bc6ae5c6d3f2d69f921fdf99"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Restrict workspace to the native TypeId backend
        working-directory: compiler
        run: |
          cat > Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir", "crates/backend", "crates/backend-riscv64"]
          EOF
          rm -f Cargo.lock
      - name: Rust, Clippy, exact UDB and source-admission gates
        working-directory: compiler
        run: |
          set -euo pipefail
          cargo test -p compiler-backend --lib
          cargo test -p compiler-backend-riscv64 --all-targets
          cargo clippy -p compiler-backend-riscv64 --all-targets -- -D warnings
          python3 tools/regen_riscv_native_selector_rules.py --check
          python3 -m unittest discover -s tools -p test_riscv_native_selector_rules.py -v
          python3 tools/riscv_udb_rust_leaf_forms.py \
            --catalog data/riscv_udb_r0_catalog.json \
            --output crates/backend-riscv64/src/generated_encoding.rs --check
      - name: Install independent RISC-V GAS, objdump, linker and QEMU
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y gcc-riscv64-linux-gnu binutils-riscv64-linux-gnu qemu-user
      - name: Direct ELF vs independent GNU GAS bytes and opcode disassembly
        working-directory: compiler
        run: |
          set -euo pipefail
          for kind in mul64 mul32; do
            case "$kind" in mul64) op=mul ;; mul32) op=mulw ;; esac
            cargo run -p compiler-backend-riscv64 --example rv64_leaf -- \
              "/tmp/rv64_${kind}.o" "/tmp/rv64_${kind}.s" "${kind}"
            grep -qE "^[[:space:]]+${op} x[0-9]+, x[0-9]+, x[0-9]+$" "/tmp/rv64_${kind}.s"
            riscv64-linux-gnu-as -march=rv64im -mabi=lp64 \
              "/tmp/rv64_${kind}.s" -o "/tmp/rv64_${kind}_gas.o"
            riscv64-linux-gnu-objcopy -O binary -j .text \
              "/tmp/rv64_${kind}.o" "/tmp/rv64_${kind}_direct.bin"
            riscv64-linux-gnu-objcopy -O binary -j .text \
              "/tmp/rv64_${kind}_gas.o" "/tmp/rv64_${kind}_gas.bin"
            cmp "/tmp/rv64_${kind}_direct.bin" "/tmp/rv64_${kind}_gas.bin"
            riscv64-linux-gnu-objdump -dr "/tmp/rv64_${kind}.o" | grep -w "${op}"
          done
      - name: Execute 40 RV64IM multiplication boundary cases under QEMU
        run: |
          set -euo pipefail
          cat > /tmp/rv64_zmmul_start.s <<'EOF'
          .option norvc
          .option norelax
          .text
          .globl _start
          _start:
            mv s0, sp
            li a0, 0
            li a1, 0
            call rv64_mul64_leaf
            li t0, 0
            bne a0, t0, fail1
            bne sp, s0, fail_sp
            li a0, 1
            li a1, 1
            call rv64_mul64_leaf
            li t0, 1
            bne a0, t0, fail2
            bne sp, s0, fail_sp
            li a0, -1
            li a1, -1
            call rv64_mul64_leaf
            li t0, 1
            bne a0, t0, fail3
            bne sp, s0, fail_sp
            li a0, -1
            li a1, 2
            call rv64_mul64_leaf
            li t0, -2
            bne a0, t0, fail4
            bne sp, s0, fail_sp
            li a0, 0
            li a1, 9223372036854775807
            call rv64_mul64_leaf
            li t0, 0
            bne a0, t0, fail5
            bne sp, s0, fail_sp
            li a0, -9223372036854775808
            li a1, -1
            call rv64_mul64_leaf
            li t0, -9223372036854775808
            bne a0, t0, fail6
            bne sp, s0, fail_sp
            li a0, -9223372036854775808
            li a1, 2
            call rv64_mul64_leaf
            li t0, 0
            bne a0, t0, fail7
            bne sp, s0, fail_sp
            li a0, 9223372036854775807
            li a1, 2
            call rv64_mul64_leaf
            li t0, -2
            bne a0, t0, fail8
            bne sp, s0, fail_sp
            li a0, 4294967296
            li a1, 4294967296
            call rv64_mul64_leaf
            li t0, 0
            bne a0, t0, fail9
            bne sp, s0, fail_sp
            li a0, -4294967296
            li a1, -4294967296
            call rv64_mul64_leaf
            li t0, 0
            bne a0, t0, fail10
            bne sp, s0, fail_sp
            li a0, 2147483647
            li a1, 2147483647
            call rv64_mul64_leaf
            li t0, 4611686014132420609
            bne a0, t0, fail11
            bne sp, s0, fail_sp
            li a0, 0x123456789abcdef0
            li a1, 0x0f0f0f0f0f0f0f0f
            call rv64_mul64_leaf
            li t0, -8757983591596482544
            bne a0, t0, fail12
            bne sp, s0, fail_sp
            li a0, -1234567890123456
            li a1, 987654321
            call rv64_mul64_leaf
            li t0, 3472023916819964224
            bne a0, t0, fail13
            bne sp, s0, fail_sp
            li a0, 0x8000000000000000
            li a1, 3
            call rv64_mul64_leaf
            li t0, -9223372036854775808
            bne a0, t0, fail14
            bne sp, s0, fail_sp
            li a0, 0x7fffffffffffffff
            li a1, 0x7fffffffffffffff
            call rv64_mul64_leaf
            li t0, 1
            bne a0, t0, fail15
            bne sp, s0, fail_sp
            li a0, 0x5555555555555555
            li a1, 0xaaaaaaaaaaaaaaaa
            call rv64_mul64_leaf
            li t0, 2049638230412172402
            bne a0, t0, fail16
            bne sp, s0, fail_sp
            li a0, 65536
            li a1, 65536
            call rv64_mul64_leaf
            li t0, 4294967296
            bne a0, t0, fail17
            bne sp, s0, fail_sp
            li a0, -1
            li a1, 9223372036854775807
            call rv64_mul64_leaf
            li t0, -9223372036854775807
            bne a0, t0, fail18
            bne sp, s0, fail_sp
            li a0, 0x0000000100000001
            li a1, 0x0000000100000001
            call rv64_mul64_leaf
            li t0, 8589934593
            bne a0, t0, fail19
            bne sp, s0, fail_sp
            li a0, -987654321
            li a1, -123456789
            call rv64_mul64_leaf
            li t0, 121932631112635269
            bne a0, t0, fail20
            bne sp, s0, fail_sp
            li a0, 0
            li a1, 0
            call rv64_mul32_leaf
            li t0, 0
            bne a0, t0, fail21
            bne sp, s0, fail_sp
            li a0, 1
            li a1, 1
            call rv64_mul32_leaf
            li t0, 1
            bne a0, t0, fail22
            bne sp, s0, fail_sp
            li a0, -1
            li a1, -1
            call rv64_mul32_leaf
            li t0, 1
            bne a0, t0, fail23
            bne sp, s0, fail_sp
            li a0, -1
            li a1, 2
            call rv64_mul32_leaf
            li t0, -2
            bne a0, t0, fail24
