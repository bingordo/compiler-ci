          fail13: li a0, 13
            j exit
          fail14: li a0, 14
            j exit
          fail15: li a0, 15
            j exit
          fail16: li a0, 16
            j exit
          fail17: li a0, 17
            j exit
          fail18: li a0, 18
            j exit
          fail19: li a0, 19
            j exit
          fail20: li a0, 20
            j exit
          fail21: li a0, 21
