          EOF
          riscv64-linux-gnu-as -march=rv64im -mabi=lp64 \
            /tmp/rv64_zmmul_start.s -o /tmp/rv64_zmmul_start.o
          riscv64-linux-gnu-ld -m elf64lriscv -static --no-relax \
            -e _start /tmp/rv64_zmmul_start.o \
            /tmp/rv64_mul64.o /tmp/rv64_mul32.o -o /tmp/rv64_zmmul.elf
          timeout 15s qemu-riscv64 /tmp/rv64_zmmul.elf
          echo "40 RV64 Zmmul TypeId multiplication wraparound and sign-extension QEMU cases passed"
