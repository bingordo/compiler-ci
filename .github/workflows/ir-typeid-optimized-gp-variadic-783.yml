name: TypeId optimized GP variadics all-source acceptance #783
on:
  pull_request:
    paths:
      - .github/workflows/ir-typeid-optimized-gp-variadic-783.yml
permissions:
  contents: read
jobs:
  native-checked-varargs:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.CI_KEY }}
      - run: ssh-keyscan github.com >> ~/.ssh/known_hosts
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: b0e993ea3adb307e28d1d828e1595c0cc4ccdf9c
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler
          key: ir-gp-varargs-783
      - name: Verify exact source and all-target warnings-denied compiler check
        working-directory: compiler
        run: |
          test "$(git rev-parse HEAD)" = "b0e993ea3adb307e28d1d828e1595c0cc4ccdf9c"
          RUSTFLAGS="-D warnings" cargo check -p compiler -p compiler-ir -p compiler-opt --all-targets
      - name: Execute TypeId GP varargs profile and ordinary driver runtime
        working-directory: compiler
        run: cargo test -p compiler --test ir_default_cli -- --nocapture
      - name: Full main compiler-driver regressions
        working-directory: compiler
        run: cargo test -p compiler --bin compiler -- --test-threads=2
      - name: Full shared TypeId optimizer and IR unit suites
        working-directory: compiler
        run: |
          cargo test -p compiler-opt --lib -- --test-threads=2
          cargo test -p compiler-ir --lib -- --test-threads=2
      - name: Strict compiler and optimizer Clippy
        working-directory: compiler
        run: cargo clippy -p compiler -p compiler-ir -p compiler-opt --all-targets -- -D warnings
      - name: Standalone Mini-C TypeId GP varargs ELF and GAS runtime
        working-directory: compiler
        run: cargo test --manifest-path tools/mini-c-driver/Cargo.toml --test typeid_cli -- --nocapture
      - name: Full standalone Mini-C regression
        working-directory: compiler
        run: cargo test --manifest-path tools/mini-c-driver/Cargo.toml -- --test-threads=2
      - name: Strict standalone Mini-C Clippy
        working-directory: compiler
        run: cargo clippy --manifest-path tools/mini-c-driver/Cargo.toml --all-targets -- -D warnings
