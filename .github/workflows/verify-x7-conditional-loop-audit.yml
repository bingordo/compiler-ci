name: Verify X7.3 conditional Intel loop audit
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/verify-x7-conditional-loop-audit.yml']
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: feature/x7-3-conditional-loop-audit
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Record exact compiler source
        run: git rev-parse HEAD
      - name: Run structural unit tests
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tools -p 'test_x86_isl_loop_inventory.py' -v
          python3 -m unittest discover -s tools -p 'test_x86_isl_conditional_loop_audit.py' -v
          python3 -m unittest discover -s tools -p 'test_x86_isl_corpus.py' -v
      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: 5.4.1
      - name: Build pinned Intel AST exporter
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq libgmp-dev pkg-config cmake libz3-dev
          git clone --filter=blob:none https://github.com/IntelLabs/isa-tools.git /tmp/isa-tools
          git -C /tmp/isa-tools checkout 16260979137c38339743a04b7fd5d9f0fa8a6ee5
          git -C /tmp/isa-tools submodule update --init --recursive
          cp tools/x86_isl_ast_export.ml tools/x86_isl_ast_json.ml /tmp/isa-tools/bin/
          cat >> /tmp/isa-tools/bin/dune <<'EOF'
          (executable
           (name x86_isl_ast_export)
           (modules x86_isl_ast_export x86_isl_ast_json)
           (libraries libISA yojson))
          EOF
          cd /tmp/isa-tools
          opam install --switch="$GITHUB_WORKSPACE" . --deps-only --yes
          opam exec --switch="$GITHUB_WORKSPACE" -- dune build bin/x86_isl_ast_export.exe
      - name: Fetch pinned Intel instruction corpus
        run: |
          set -euo pipefail
          git clone --filter=blob:none --sparse https://github.com/intel/SDM.git /tmp/intel-sdm
          git -C /tmp/intel-sdm fetch --depth 1 origin 35eface1b7ee003a1cda95005ec5fd83de658a64
          git -C /tmp/intel-sdm checkout 35eface1b7ee003a1cda95005ec5fd83de658a64
          git -C /tmp/intel-sdm sparse-checkout set data/instruction
      - name: Survey full corpus and assert stable structural baseline
        run: |
          set -euo pipefail
          python3 tools/x86_isl_corpus.py --xml-dir /tmp/intel-sdm/data/instruction \
            --parser /tmp/isa-tools/_build/default/bin/x86_isl_ast_export.exe \
            --out /tmp/x7-coverage.json --loop-report /tmp/x7-loops.json \
            --conditional-loop-report /tmp/x7-conditional-arms.json \
            --require-parsed 1641 \
            --parser-revision 16260979137c38339743a04b7fd5d9f0fa8a6ee5 \
            --corpus-revision 35eface1b7ee003a1cda95005ec5fd83de658a64
          python3 - <<'PY'
          import json
          corpus=json.load(open('/tmp/x7-coverage.json'))
          loops=json.load(open('/tmp/x7-loops.json'))
          audit=json.load(open('/tmp/x7-conditional-arms.json'))
          assert corpus['summary']['syntax_accepted']==1641
          assert loops['total_loops']==1077
          assert audit['operations_scanned']==1641
          assert 0<audit['conditional_for_bodies']<=1075
          print('X7_3_CONDITIONAL_AUDIT', json.dumps({
            k:audit[k] for k in ('conditional_for_bodies',
              'arm_assignment_vectors','branch_counts','local_declarations',
              'else_present','with_else','with_nested_control')}, sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: x7-3-conditional-intel-loop-report
          path: |
            /tmp/x7-coverage.json
            /tmp/x7-loops.json
            /tmp/x7-conditional-arms.json
          if-no-files-found: ignore
