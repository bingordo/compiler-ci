name: X7 shared TypeId narrow ALU and casts GCC parity
on:
  pull_request:
    branches: [main]
    paths: [.github/workflows/verify-x7-shared-narrow-alu-casts-20261112.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  narrow-alu-casts-c11:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact compiler narrow ALU/casts candidate
        uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: af8ab8be7a0b3efb380c00d4111dba1fd8a3a6d7
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Build isolated x86 workspace
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = af8ab8be7a0b3efb380c00d4111dba1fd8a3a6d7
          python3 - <<'PY'
          from pathlib import Path
          Path("Cargo.toml").write_text("""[workspace]
          resolver = "2"
          members = ["crates/ir", "crates/opt", "crates/backend", "crates/backend-x86"]
          """)
          PY
      - name: Run 8/16-bit GCC executable ELF/GAS oracles, default ABI
        run: |
          set -euo pipefail
          cargo test -p compiler-backend-x86 --test x7_shared_narrow_alu_casts --offline -- --nocapture
          cargo test -p compiler-backend-x86 --test x7_shared_machine_native_parity --offline
      - name: Verify explicit machine cutover with all features
        run: |
          set -euo pipefail
          cargo test -p compiler-backend-x86 --all-features --test x7_shared_narrow_alu_casts --offline
          cargo test -p compiler-backend-x86 --all-features --test x7_shared_machine_native_parity --offline
          cargo test -p compiler-backend-x86 --all-features --lib --offline
          echo X7_SHARED_NARROW_ALU_CASTS_C11_GREEN
