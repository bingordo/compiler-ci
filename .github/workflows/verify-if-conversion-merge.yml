name: Validate if-conversion integration with compiler main
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-if-conversion-merge.yml'
permissions:
  contents: read
concurrency:
  group: if-conversion-merge-validation
  cancel-in-progress: true
jobs:
  integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Fetch if-conversion branch and full compiler history
        uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: research/if-conversion-cost-model
          path: compiler
          fetch-depth: 0
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Merge current compiler main in temporary CI worktree
        shell: bash
        run: |
          set -euo pipefail
          git -C compiler -c user.name='Compiler CI' -c user.email='ci@example.invalid' merge --no-edit origin/main
          git -C compiler log -1 --format='%H %s' >> "$GITHUB_STEP_SUMMARY"
      - name: Restrict workspace to core crates
        shell: bash
        run: |
          cat > compiler/Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir", "crates/opt", "crates/backend", "crates/backend-x86"]
          EOF
          rm -f compiler/Cargo.lock
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: if-conversion-main-integration
      - name: Test merged core and x86 backend
        working-directory: compiler
        run: cargo test -p compiler-ir -p compiler-opt -p compiler-backend -p compiler-backend-x86
      - name: Test experimental generated rules against merged code
        working-directory: compiler
        run: cargo test -p compiler-opt --features experimental-generated-rules
