name: BT2 direct TypeId signed constant offsets and LEA boundaries
on:
  push:
    branches:
      - ci/bt2-typeid-constant-offset-parity-20261113
  workflow_dispatch:
permissions:
  contents: read
jobs:
  x86-constant-index-parity:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      CARGO_INCREMENTAL: '0'
    steps:
      - name: Checkout exact compiler branch source
        uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 55b6326d92cf9969a59e415afdc641369a6cf022
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Check source pin and core-only workspace
        run: |
          set -euo pipefail
          test "$(git -C compiler rev-parse HEAD)" = "55b6326d92cf9969a59e415afdc641369a6cf022"
          cat > compiler/Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir", "crates/opt", "crates/backend", "crates/backend-x86", "crates/backend-aarch64"]
          EOF
          rm -f compiler/Cargo.lock
          echo "BT2 pinned source: 55b6326d92cf9969a59e415afdc641369a6cf022" >> "$GITHUB_STEP_SUMMARY"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: bt2-signed-constant-lea-typeid-v1
      - name: TypeId signed variable and constant index - all 8 native sinks and C11
        working-directory: compiler
        run: cargo test -p compiler-backend-x86 --test x7_shared_signed_index_native -- --nocapture
      - name: Preserve historical LEA shape and overflow reference tests
        working-directory: compiler
        run: |
          set -euo pipefail
          cargo test -p compiler-backend-x86 --test lea_patterns_native -- --nocapture
          cargo test -p compiler-backend-x86 --test lea_indexed_native -- --nocapture
          cargo test -p compiler-backend-x86 --test lea_memory_native -- --nocapture
      - name: Adjacent direct TypeId and optimizer regressions
        working-directory: compiler
        run: |
          set -euo pipefail
          cargo test -p compiler-opt --test typed_if_conversion_pure -- --nocapture
          cargo test -p compiler-backend-x86 --test native_typeid_direct
          cargo test -p compiler-backend-x86 --test native_typeid_memory_calls
          cargo test -p compiler-ir --lib
      - name: All-target compile and strict Clippy
        working-directory: compiler
        run: |
          set -euo pipefail
          cargo check --workspace --all-targets
          cargo clippy --workspace --all-targets -- -D warnings
