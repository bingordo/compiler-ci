# Temporary, source-pinned acceptance gate for compiler PR #1635.
# Do not merge this workflow into compiler-ci main.
name: FP vector TypeId semantic foundation (compiler PR 1635)
on:
  push:
    branches:
      - ci/fp-vector-typeid-pr1635-20261114
    paths:
      - .github/workflows/fp-vector-typeid-pr1635.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fp-vector-typeid:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      SOURCE_SHA: 4978cc178b7deb3846d181e8ebd310edbf221385
      CARGO_INCREMENTAL: '0'
    steps:
      - name: Check out exact compiler PR 1635 source
        uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 4978cc178b7deb3846d181e8ebd310edbf221385
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Verify source and restrict to TypeId IR crate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C compiler rev-parse HEAD)" = "$SOURCE_SHA"
          cat > compiler/Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir"]
          EOF
          rm -f compiler/Cargo.lock
          rustc --version
          cargo --version
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: fp-vector-typeid-pr1635
      - name: FP and fixed-vector semantic tests
        working-directory: compiler
        run: cargo test -p compiler-ir --test native_fp_vector_semantics -- --nocapture
      - name: Full TypeId IR regression suite
        working-directory: compiler
        run: cargo test -p compiler-ir
      - name: Strict IR Clippy
        working-directory: compiler
        run: cargo clippy -p compiler-ir --all-targets -- -D warnings
