name: AArch64 arithmetic fixed TypeId compact fixture migration
on:
  push:
    branches: [verify/aarch64-arithmetic-compact-20261115]
    paths: ['.github/workflows/aarch64-arithmetic-compact-20261115.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: e3e3fb5c0d830cacd85f25e6624d4dcf6094d10f
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Verify exact compiler source
        run: test "$(git -C compiler rev-parse HEAD)" = "e3e3fb5c0d830cacd85f25e6624d4dcf6094d10f"
      - name: Restrict native workspace
        run: |
          cat > compiler/Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir", "crates/backend", "crates/backend-aarch64"]
          EOF
          rm -f compiler/Cargo.lock
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: aarch64-i32-arithmetic-compact
      - name: Export original fixed TypeId module through canonical production writer
        working-directory: compiler
        run: |
          cargo test -p compiler-backend-aarch64 --test arithmetic export_original_native_v3_for_migration -- --nocapture
      - name: Install real AArch64 cross tools and QEMU
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends gcc-aarch64-linux-gnu libc6-dev-arm64-cross binutils-aarch64-linux-gnu qemu-user
      - name: Run original machine spill signed traps and C11 QEMU
        working-directory: compiler
        env:
          COMPILER_REQUIRE_AARCH64_QEMU: "1"
        run: |
          cargo test -p compiler-backend-aarch64 --test arithmetic -- --nocapture
      - name: Strict arithmetic scoped Clippy
        working-directory: compiler
        run: cargo clippy -p compiler-backend-aarch64 --no-deps --test arithmetic -- -D warnings
