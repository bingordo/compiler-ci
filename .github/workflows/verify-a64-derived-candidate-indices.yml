name: AArch64 derived native candidate dispatch audit
on:
  pull_request:
    paths: ['.github/workflows/verify-a64-derived-candidate-indices.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  a64-source-index-parity:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout immutable compiler source
        uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: a3e38d24302f1b8b542baf3e9e0d46362a177818
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Assert exact source commit
        run: test "$(git -C compiler rev-parse HEAD)" = "a3e38d24302f1b8b542baf3e9e0d46362a177818"
      - name: Require generated AArch64 and other architecture source parity
        working-directory: compiler
        run: |
          set -euo pipefail
          export PYTHONPATH="$PWD/tools"
          python3 tools/regen_aarch64_native_selector_rules.py --check
          python3 tools/regen_riscv_native_selector_rules.py --check
          python3 tools/regen_x86_selector_rules.py --check
      - name: Test every reviewed AArch64 family, mutation gates and shared index
        working-directory: compiler
        run: |
          set -euo pipefail
          export PYTHONPATH="$PWD/tools"
          python3 -m unittest discover -s tools -p test_regen_aarch64_native_selector_rules.py -v
          python3 -m unittest discover -s tools -p test_native_selector_codegen.py -v
          python3 -m unittest discover -s tools -p test_ranked_generator_index.py -v
