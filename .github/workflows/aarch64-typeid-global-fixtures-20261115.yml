name: AArch64 fixed TypeId global and constructor fixture migration
on:
  push:
    branches: [verify/aarch64-typeid-global-fixtures-20261115]
    paths: ['.github/workflows/aarch64-typeid-global-fixtures-20261115.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 8750776959788b46c5c58fb629aa490285162d33
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Verify exact source SHA
        run: test "$(git -C compiler rev-parse HEAD)" = "8750776959788b46c5c58fb629aa490285162d33"
      - name: Restrict workspace
        run: |
          cat > compiler/Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir", "crates/backend", "crates/backend-aarch64"]
          EOF
          rm -f compiler/Cargo.lock
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: typeid-aarch64-globals-fixed
      - name: Export exact original TypeId SSA and global initializer fixtures
        working-directory: compiler
        run: |
          cargo test -p compiler-backend-aarch64 --test typeid_globals_native temporary_export_original_aarch64_typeid_global_corpus -- --nocapture
          cargo test -p compiler-backend-aarch64 --test module_globals temporary_export_original_aarch64_typeid_global_corpus -- --nocapture
