name: AArch64 fixed TypeId global and constructor fixture migration
on:
  push:
    branches: [verify/aarch64-typeid-global-fixtures-20261115]
    paths: ['.github/workflows/aarch64-typeid-global-fixtures-20261115.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 8b3e4898bffcc6c7ed4de552ade9e086a124e077
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Verify exact source SHA
        run: test "$(git -C compiler rev-parse HEAD)" = "8b3e4898bffcc6c7ed4de552ade9e086a124e077"
      - name: Restrict workspace
        run: |
          cat > compiler/Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir", "crates/backend", "crates/backend-aarch64"]
          EOF
          rm -f compiler/Cargo.lock
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: typeid-aarch64-globals-fixed
      - name: Install real AArch64 C11 cross compiler and QEMU
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu qemu-user
      - name: Verify native AArch64 global initializer GAS/ELF C11 execution and negative tests
        working-directory: compiler
        env:
          COMPILER_REQUIRE_AARCH64_QEMU: "1"
        run: |
          cargo test -p compiler-backend-aarch64 --test typeid_globals_native --test module_globals
      - name: Verify neighboring native AArch64 ABI and native IR parsing
        working-directory: compiler
        run: |
          cargo test -p compiler-backend-aarch64 --test typeid_abi_calls_native
          cargo test -p compiler-ir --test native_fixture_text --test native_module_text_v3
          cargo clippy -p compiler-backend-aarch64 --no-deps --test typeid_globals_native --test module_globals -- -D warnings
