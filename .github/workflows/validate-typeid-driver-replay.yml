name: Validate TypeId production driver dump and replay
on:
  pull_request:
    paths:
      - '.github/workflows/validate-typeid-driver-replay.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  driver-replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
    steps:
      - name: Configure read-only SSH for private source and pinned frontends
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.CI_KEY }}
      - name: Trust GitHub SSH host
        run: ssh-keyscan github.com >> ~/.ssh/known_hosts
      - name: Checkout exact compiler source
        uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: b8e7f637e2f3da8fa1731e249e56361e00435d8b
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Check source SHA and toolchain
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C compiler rev-parse HEAD)" = b8e7f637e2f3da8fa1731e249e56361e00435d8b
          echo 'Compiler source: b8e7f637e2f3da8fa1731e249e56361e00435d8b' >> "$GITHUB_STEP_SUMMARY"
          rustc --version
          cargo --version
          cc --version | head -n1
      - name: Reuse compiler build objects
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: typeid-driver-ir-replay
      - name: Production CLI TypeId text/binary dump and reloaded backend tests
        working-directory: compiler
        run: cargo test -p compiler --test typeid_ir_dump_replay -- --nocapture
      - name: Existing TypeId CLI and optimizer pass replay regression suites
        working-directory: compiler
        run: |
          cargo test -p compiler --test ir_default_cli -- --nocapture
          cargo test -p compiler-opt --test native_ir_pass_replay -- --nocapture
      - name: Strict driver Clippy
        working-directory: compiler
        run: cargo clippy -p compiler --all-targets -- -D warnings
