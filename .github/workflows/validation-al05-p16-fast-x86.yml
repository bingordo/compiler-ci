name: VALIDATION ONLY P16 coverage-guided x86 ELF/GAS

on:
  pull_request:
    paths:
      - '.github/workflows/validation-al05-p16-fast-x86.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  p16-x86:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout validation workflow
        uses: actions/checkout@v4
      - name: Checkout pinned compiler candidate
        uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 0c575b96ca3dc29ed942cb5bffb26fd0cd5808fc
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Isolate Rust core workspace
        shell: bash
        working-directory: compiler
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = '0c575b96ca3dc29ed942cb5bffb26fd0cd5808fc'
          python3 - <<'PY'
          from pathlib import Path
          Path('Cargo.toml').write_text("""[workspace]
          resolver = "2"
          members = ["crates/ir", "crates/opt", "crates/backend", "crates/backend-x86", "crates/backend-aarch64"]
          """)
          PY
      - name: Reuse core Rust objects
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: al05-p16-native-x86
      - name: Clippy and selector order/budget coverage regression
        working-directory: compiler
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=10s 6m cargo clippy -p compiler-opt --test al05_p9_mixed_native_bridge -- -D warnings
          timeout --signal=TERM --kill-after=10s 6m cargo test -p compiler-opt --test al05_p9_mixed_native_bridge al05_p16_selector_is_order_independent_bounded_and_nontrivial -- --nocapture 2>&1 | tee "$RUNNER_TEMP/al05-p16-selector.log"
          grep -E 'AL05_P16_SELECTOR candidates=320 selected=24 modes=8 seeds=8 coefficient_families=5 covered_features=[0-9]+ total_features=[0-9]+ deterministic=YES verdict=PASS' "$RUNNER_TEMP/al05-p16-selector.log"
      - name: Independent coverage-selected native x86 direct ELF and GAS
        working-directory: compiler
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=10s 8m cargo test -p compiler-opt --test al05_p9_mixed_native_bridge al05_p16_coverage_guided_native_x86_elf_gas_c11 -- --exact --nocapture 2>&1 | tee "$RUNNER_TEMP/al05-p16-x86.log"
          grep -F 'AL05_P16_COVERAGE_NATIVE_TARGET arch=x86_64 format=elf functions=48 changed_cse=24 selected=24 modes=8 seeds=8 coefficients=5 comparisons=22416 traps=96 verdict=PASS' "$RUNNER_TEMP/al05-p16-x86.log"
          grep -F 'AL05_P16_COVERAGE_NATIVE_TARGET arch=x86_64 format=gas functions=48 changed_cse=24 selected=24 modes=8 seeds=8 coefficients=5 comparisons=22416 traps=96 verdict=PASS' "$RUNNER_TEMP/al05-p16-x86.log"
