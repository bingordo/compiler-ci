name: M49 real checked Mini-C arithmetic expression GDB
on:
  pull_request:
    paths: ['.github/workflows/m49-arithmetic-gdb-3450.yml']
permissions:
  contents: read
jobs:
  expression-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 0194a35309572480288c3a9e6bd59ded80fa969f
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Resolve dependencies and prepare GDB
        run: |
          git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
          sudo apt-get update -qq
          sudo apt-get install -y gdb
      - name: Exact source expression origin to DWARF GDB acceptance
        working-directory: compiler
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "0194a35309572480288c3a9e6bd59ded80fa969f"
          cd tools/mini-c-driver
          cargo test --test checked_arithmetic_source_dwarf -- --nocapture
          cargo test --test source_declaration_origins -- --nocapture
          cargo test --test source_declaration_dwarf -- --nocapture
          cargo test --test checked_real_file_gdb -- --nocapture
          cargo test --lib source_debug::tests -- --nocapture
          cargo check --bin compiler-mini-c
          cd ../..
          cargo test -p compiler-backend-x86 --lib typeid_dwarf::tests
