# Source-pinned native TypeId crossunit LTO migration acceptance.
name: IR PR2999 native LTO crossunit TypeId
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ir-pr2999-lto-native-20261123.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lto-native:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      SOURCE_SHA: 3871a7c0cacb63bf135403a6b59ee6054f81ab49
      CARGO_INCREMENTAL: '0'
      CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
    steps:
      - name: Checkout exact compiler PR source
        uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: ${{ env.SOURCE_SHA }}
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Verify source SHA and isolate core Rust workspace
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C compiler rev-parse HEAD)" = "$SOURCE_SHA"
          cat > compiler/Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir", "crates/opt", "crates/backend", "crates/backend-x86", "crates/backend-aarch64"]
          EOF
          rm -f compiler/Cargo.lock
          rustc --version
          cc --version | head -n 1
      - name: Cache isolated Rust compilation
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: ir-pr2999-native-lto
      - name: Test LTO native split and merged ELF execution and M4
        working-directory: compiler
        shell: bash
        run: |
          set -euo pipefail
          cargo test -p compiler-opt --test lto_crossunit_optimization -- --nocapture
          cargo test -p compiler-opt --test m4_integer_effects -- --nocapture
      # Existing compiler-backend/src/elf/comdat_compose.rs triggers
      # suspicious_assignment_formatting, needless_lifetimes and chunks_exact_to_as_chunks.
      # These exceptions are unrelated to the TypeId LTO test-only diff.
      - name: Targeted Clippy with documented unrelated baseline exceptions
        working-directory: compiler
        run: |
          cargo clippy -p compiler-opt --test lto_crossunit_optimization -- -D clippy::all -A clippy::empty_line_after_doc_comments -A clippy::collapsible_match -A clippy::collapsible_if -A clippy::suspicious_assignment_formatting -A clippy::needless_lifetimes -A clippy::chunks_exact_to_as_chunks
