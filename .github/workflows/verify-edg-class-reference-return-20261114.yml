name: EDG C++ checked borrowed reference and scalar lvalue-adjust ABI

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/verify-edg-class-reference-return-20261114.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: edg-reference-return-${{ github.ref }}
  cancel-in-progress: true

jobs:
  original-iostream:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    container:
      image: ghcr.io/edgcpp/ci-runner@sha256:14b3948c2ce12cfa5472e5a6c468393d15426f3a67685cc35d830ea5db2acdf8
    defaults:
      run:
        shell: edg-container-exec "bash -eo pipefail {0}"
    env:
      COMPILER_SHA: cb4111c1480b78b5554340d844a8a582e6ba6c94
      EDG_SOURCE_SHA: b195677be8b9b56c8337afad6be8064d21a54082
      EDG_BRIDGE_SHA: fc5adba5dc9061cc24517544c23ee92ab0151b5e
      EDG_RELEASE_TAG: edgcpfe-v2026.11.14-upstream-177765bb7731
      EDG_RELEASE_SHA256: 1ce495b629924f31382ecccc891a7a72caae1014ddfa2ba7dd39b44d8b0a9526
      RUST_TOOLCHAIN_VERSION: 1.99.1
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      EDGCPP_SOURCE_DIR: ${{ github.workspace }}/edgcpp
      EDGCPP_COMPILE_COMMANDS: ${{ github.workspace }}/edgcpp/build/gcc-release/compile_commands.json
      EDGCPP_LIB_DIR: ${{ github.workspace }}/edgcpp/build/gcc-release/lib
      EDGCPP_EDG_REVISION: b195677be8b9b56c8337afad6be8064d21a54082
    steps:
      - name: Check out exactly pinned compiler integration candidate
        uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: cb4111c1480b78b5554340d844a8a582e6ba6c94
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false

      - name: Check out source headers matching upstream EDG release
        uses: actions/checkout@v4
        with:
          repository: bingundu/edgcpp
          ref: b195677be8b9b56c8337afad6be8064d21a54082
          path: edgcpp
          persist-credentials: false

      - name: Assert source revisions and unmodified Hello World
        run: |
          set -euo pipefail
          test "$(git -C compiler rev-parse HEAD)" = "$COMPILER_SHA"
          test "$(git -C edgcpp rev-parse HEAD)" = "$EDG_SOURCE_SHA"
          grep -Fq 'rev = "fc5adba5dc9061cc24517544c23ee92ab0151b5e"' compiler/tools/edg-driver/Cargo.toml
          ! grep -q 'edgcpp_capture_' edgcpp/src/lower_il.c
          fixture=compiler/tools/edg-driver/tests/fixtures/edg_native_cxx5_iostream.cpp
          test -f "$fixture"
          grep -Fq '#include <iostream>' "$fixture"
          grep -Fq 'std::cout << "Hello, world!" << std::endl;' "$fixture"
          printf 'Compiler SHA: %s\nEDG package SHA: %s\nBridge SHA: %s\n' "$COMPILER_SHA" "$EDG_SOURCE_SHA" "$EDG_BRIDGE_SHA" >>"$GITHUB_STEP_SUMMARY"

      - name: Configure EDG header tooling without rebuilding full frontend
        working-directory: edgcpp
        env:
          EDG_BASE: ${{ github.workspace }}/edgcpp/bases/docker/dev-env/gcc
        run: |
          set -euo pipefail
          cmake --preset linux-gcc-release -DEDG_BUILD_LIB=OFF -DEDG_BUILD_CALLABLE_LIBRARY=ON -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
          cmake --build build/gcc-release --target error-info --parallel 2
          test -s build/gcc-release/src/includes/err_codes.h
          test -s build/gcc-release/src/includes/err_data.h

      - name: Restore checksummed upstream EDG callable release
        working-directory: edgcpp
        run: |
          set -euo pipefail
          mkdir -p build/gcc-release/lib build/prebuilt-edg
          curl --proto '=https' --tlsv1.2 --fail --location --silent --show-error --retry 4 --retry-delay 2 \
            "https://github.com/bingundu/edgcpp/releases/download/$EDG_RELEASE_TAG/edgcpfe-ci-upstream-callable-edg-release-20261114-linux-x86_64.tar.gz" \
            -o build/prebuilt-edg/archive.tar.gz
          printf '%s  %s\n' "$EDG_RELEASE_SHA256" build/prebuilt-edg/archive.tar.gz | sha256sum -c -
          tar -xzf build/prebuilt-edg/archive.tar.gz -C build/prebuilt-edg
          grep -Fx "commit=$EDG_SOURCE_SHA" build/prebuilt-edg/BUILD-INFO.txt
          grep -Fx 'platform=linux-x86_64' build/prebuilt-edg/BUILD-INFO.txt
          test -s build/prebuilt-edg/lib/libedgcpfe.a
          cp build/prebuilt-edg/lib/libedgcpfe.a build/gcc-release/lib/libedgcpfe.a

      - name: Install pinned Rust toolchain
        run: |
          set -euo pipefail
          if ! command -v cargo >/dev/null; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | \
              sh -s -- -y --profile minimal --default-toolchain "$RUST_TOOLCHAIN_VERSION"
          fi
          export PATH="$HOME/.cargo/bin:$PATH"
          rustup toolchain install "$RUST_TOOLCHAIN_VERSION" --profile minimal
          rustup default "$RUST_TOOLCHAIN_VERSION"

      - name: Compile production TypeId EDG driver with hook-free bridge
        working-directory: compiler
        run: |
          set -euo pipefail
          export PATH="$HOME/.cargo/bin:$PATH"
          cargo test --manifest-path tools/edg-driver/Cargo.toml
          cargo test --manifest-path tools/edg-driver/Cargo.toml \
            lvalue_adjust_ -- --nocapture \
            2>&1 | tee "$RUNNER_TEMP/checked-scalar-lvalue-adjust.log"
          grep -Eq 'test result: ok[.] [1-9][0-9]* passed; 0 failed' \
            "$RUNNER_TEMP/checked-scalar-lvalue-adjust.log"
          cargo build --manifest-path tools/edg-driver/Cargo.toml
          test -x tools/edg-driver/target/debug/compiler-edg-driver

      - name: Prove native external data ELF relocation against independent G++ owner
        working-directory: edgcpp/build/gcc-release
        run: |
          set -euo pipefail
          source ./environment.sh
          driver="$GITHUB_WORKSPACE/compiler/tools/edg-driver/target/debug/compiler-edg-driver"
          fixtures="$GITHUB_WORKSPACE/compiler/tools/edg-driver/tests/fixtures"
          out="$RUNNER_TEMP/cxx5-imported-external"
          mkdir -p "$out"
          cd "$out"
          cp "$fixtures/edg_native_cxx5_external_scalar.cpp" source.cpp
          cp "$fixtures/edg_native_cxx5_external_scalar_owner.cpp" owner.cpp
          g++ -std=c++17 -Wall -Wextra -Werror -c owner.cpp -o owner.o
          g++ -std=c++17 -Wall -Wextra -Werror source.cpp owner.o -o reference
          timeout 15s ./reference >reference.out 2>reference.err
          version="$(g++ -dumpfullversion -dumpversion)"
          IFS=. read -r major minor patch <<<"$version"
          gnu_number=$((10#$major*10000+10#${minor:-0}*100+10#${patch:-0}))
          "$driver" native.o --g++ --c++17 --no_strict_gnu \
            --gnu_version "$gnu_number" source.cpp >native.compile.log 2>&1 || {
              tail -n 100 native.compile.log >&2
              test ! -e native.o
              exit 1
            }
          test "$(od -An -tx1 -N4 native.o | tr -d '[:space:]')" = 7f454c46
          nm -u native.o | grep -Eq ' U imported_scalar$'
          readelf -r native.o | grep -F 'imported_scalar'
          g++ native.o owner.o -o native
          timeout 15s ./native >native.out 2>native.err
          test "$(sha256sum reference.out | cut -d' ' -f1)" = "$(sha256sum native.out | cut -d' ' -f1)"
          test "$(sha256sum reference.err | cut -d' ' -f1)" = "$(sha256sum native.err | cut -d' ' -f1)"
          echo "EDG_EXTERNAL_NATIVE fixture=imported_scalar result=executable_parity_pass" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Check class-reference source ABI tests without object permission
        working-directory: compiler
        run: |
          set -euo pipefail
          export PATH="$HOME/.cargo/bin:$PATH"
          cargo test --manifest-path tools/edg-driver/Cargo.toml class_reference_result_tests -- --nocapture
          echo "EDG_REFERENCE_RETURN gate=source_verified_ptr64_no_class_materialization result=pass" >>"$GITHUB_STEP_SUMMARY"

      - name: Compare unchanged GCC15 iostream and original intermediates
        working-directory: edgcpp/build/gcc-release
        run: |
          set -euo pipefail
          source ./environment.sh
          driver="$GITHUB_WORKSPACE/compiler/tools/edg-driver/target/debug/compiler-edg-driver"
          fixtures="$GITHUB_WORKSPACE/compiler/tools/edg-driver/tests/fixtures"
          out="$RUNNER_TEMP/cxx5-original-iostream"
          mkdir -p "$out"
          cd "$out"
          g++ -std=c++17 -v -E -x c++ /dev/null >include-search.log 2>&1
          mapfile -t include_dirs < <(awk '
            /#include <\.\.\.> search starts here:/{active=1;next}
            /^End of search list/{active=0}
            active && /^ /{sub(/^[[:space:]]+/,"");print}
          ' include-search.log)
          test "${#include_dirs[@]}" -ge 3
          include_flags=()
          for directory in "${include_dirs[@]}"; do
            test -d "$directory"
            include_flags+=("-I$directory")
          done
          version="$(g++ -dumpfullversion -dumpversion)"
          IFS=. read -r major minor patch <<<"$version"
          gnu_number=$((10#$major*10000 + 10#${minor:-0}*100 + 10#${patch:-0}))
          for case in unused no_endl endl; do
            case "$case" in
              unused) original=edg_native_cxx5_iostream_unused.cpp ;;
              no_endl) original=edg_native_cxx5_iostream_no_endl.cpp ;;
              endl) original=edg_native_cxx5_iostream.cpp ;;
            esac
            cp "$fixtures/$original" source.cpp
            g++ -std=c++17 -fno-exceptions -O0 -Wall -Wextra -Werror \
              source.cpp -o oracle
            set +e
            timeout 15s ./oracle >oracle.out 2>oracle.err
            oracle_status=$?
            set -e
            test "$oracle_status" -lt 124
            rm -f native.o native native.out native.err
            set +e
            timeout 180s "$driver" native.o --g++ --c++17 --no_strict_gnu \
              --no_exceptions --gnu_version "$gnu_number" "${include_flags[@]}" \
              source.cpp >native.compile.log 2>&1
            status=$?
            set -e
            if test "$status" -eq 0; then
              test "$(od -An -tx1 -N4 native.o | tr -d '[:space:]')" = 7f454c46
              if g++ -std=c++17 -fno-exceptions native.o -o native >link.log 2>&1; then
                set +e
                timeout 15s ./native >native.out 2>native.err
                native_status=$?
                set -e
                test "$native_status" = "$oracle_status"
                test "$(sha256sum oracle.out | cut -d' ' -f1)" = \
                     "$(sha256sum native.out | cut -d' ' -f1)"
                test "$(sha256sum oracle.err | cut -d' ' -f1)" = \
                     "$(sha256sum native.err | cut -d' ' -f1)"
                echo "EDG_IOS_ORIGINAL case=$case result=runtime_parity" >>"$GITHUB_STEP_SUMMARY"
              else
                echo "EDG_IOS_ORIGINAL case=$case result=link_blocker" >>"$GITHUB_STEP_SUMMARY"
                tail -n 15 link.log
              fi
            elif test "$status" -eq 124 || test "$status" -eq 137; then
              echo "EDG_IOS_ORIGINAL case=$case compiler timeout or killed" >&2
              exit 1
            else
              test ! -e native.o
              grep -E 'EDG -> compiler-ir rejected|native TypeId x86 backend|Error:|error:' \
                native.compile.log | tail -n 8 || {
                cat native.compile.log
                exit 1
              }
              echo "EDG_IOS_ORIGINAL case=$case result=source_rejection_no_object" >>"$GITHUB_STEP_SUMMARY"
            fi
          done

      - name: Keep original-source diagnostics and native ELF evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: edg-reference-return-native-probe
          path: |
            ${{ runner.temp }}/cxx5-imported-external/
            ${{ runner.temp }}/cxx5-original-iostream/
          if-no-files-found: warn
          retention-days: 7
