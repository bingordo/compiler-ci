name: EDG C++ checked bool AL and scalar lvalue ABI

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/verify-edg-class-reference-return-20261114.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: edg-reference-return-${{ github.ref }}
  cancel-in-progress: true

jobs:
  original-iostream:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    container:
      image: ghcr.io/edgcpp/ci-runner@sha256:14b3948c2ce12cfa5472e5a6c468393d15426f3a67685cc35d830ea5db2acdf8
    defaults:
      run:
        shell: edg-container-exec "bash -eo pipefail {0}"
    env:
      COMPILER_SHA: 1dff1fb1d35535124706e632bf5a488550790fe6
      EDG_SOURCE_SHA: b195677be8b9b56c8337afad6be8064d21a54082
      EDG_BRIDGE_SHA: fc5adba5dc9061cc24517544c23ee92ab0151b5e
      EDG_RELEASE_TAG: edgcpfe-v2026.11.14-upstream-177765bb7731
      EDG_RELEASE_SHA256: 1ce495b629924f31382ecccc891a7a72caae1014ddfa2ba7dd39b44d8b0a9526
      RUST_TOOLCHAIN_VERSION: 1.99.1
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      EDGCPP_SOURCE_DIR: ${{ github.workspace }}/edgcpp
      EDGCPP_COMPILE_COMMANDS: ${{ github.workspace }}/edgcpp/build/gcc-release/compile_commands.json
      EDGCPP_LIB_DIR: ${{ github.workspace }}/edgcpp/build/gcc-release/lib
      EDGCPP_EDG_REVISION: b195677be8b9b56c8337afad6be8064d21a54082
    steps:
      - name: Check out exactly pinned compiler integration candidate
        uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 1dff1fb1d35535124706e632bf5a488550790fe6
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false

      - name: Check out source headers matching upstream EDG release
        uses: actions/checkout@v4
        with:
          repository: bingundu/edgcpp
          ref: b195677be8b9b56c8337afad6be8064d21a54082
          path: edgcpp
          persist-credentials: false

      - name: Assert source revisions and unmodified Hello World
        run: |
          set -euo pipefail
          test "$(git -C compiler rev-parse HEAD)" = "$COMPILER_SHA"
          test "$(git -C edgcpp rev-parse HEAD)" = "$EDG_SOURCE_SHA"
          grep -Fq 'rev = "fc5adba5dc9061cc24517544c23ee92ab0151b5e"' compiler/tools/edg-driver/Cargo.toml
          ! grep -q 'edgcpp_capture_' edgcpp/src/lower_il.c
          fixture=compiler/tools/edg-driver/tests/fixtures/edg_native_cxx5_iostream.cpp
          test -f "$fixture"
          grep -Fq '#include <iostream>' "$fixture"
          grep -Fq 'std::cout << "Hello, world!" << std::endl;' "$fixture"
          printf 'Compiler SHA: %s\nEDG package SHA: %s\nBridge SHA: %s\n' "$COMPILER_SHA" "$EDG_SOURCE_SHA" "$EDG_BRIDGE_SHA" >>"$GITHUB_STEP_SUMMARY"

      - name: Configure EDG header tooling without rebuilding full frontend
        working-directory: edgcpp
        env:
          EDG_BASE: ${{ github.workspace }}/edgcpp/bases/docker/dev-env/gcc
        run: |
          set -euo pipefail
          cmake --preset linux-gcc-release -DEDG_BUILD_LIB=OFF -DEDG_BUILD_CALLABLE_LIBRARY=ON -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
          cmake --build build/gcc-release --target error-info --parallel 2
          test -s build/gcc-release/src/includes/err_codes.h
          test -s build/gcc-release/src/includes/err_data.h

      - name: Restore checksummed upstream EDG callable release
        working-directory: edgcpp
        run: |
          set -euo pipefail
          mkdir -p build/gcc-release/lib build/prebuilt-edg
          curl --proto '=https' --tlsv1.2 --fail --location --silent --show-error --retry 4 --retry-delay 2 \
            "https://github.com/bingundu/edgcpp/releases/download/$EDG_RELEASE_TAG/edgcpfe-ci-upstream-callable-edg-release-20261114-linux-x86_64.tar.gz" \
            -o build/prebuilt-edg/archive.tar.gz
          printf '%s  %s\n' "$EDG_RELEASE_SHA256" build/prebuilt-edg/archive.tar.gz | sha256sum -c -
          tar -xzf build/prebuilt-edg/archive.tar.gz -C build/prebuilt-edg
          grep -Fx "commit=$EDG_SOURCE_SHA" build/prebuilt-edg/BUILD-INFO.txt
          grep -Fx 'platform=linux-x86_64' build/prebuilt-edg/BUILD-INFO.txt
          test -s build/prebuilt-edg/lib/libedgcpfe.a
          cp build/prebuilt-edg/lib/libedgcpfe.a build/gcc-release/lib/libedgcpfe.a

      - name: Install pinned Rust toolchain
        run: |
          set -euo pipefail
          if ! command -v cargo >/dev/null; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | \
              sh -s -- -y --profile minimal --default-toolchain "$RUST_TOOLCHAIN_VERSION"
          fi
          export PATH="$HOME/.cargo/bin:$PATH"
          rustup toolchain install "$RUST_TOOLCHAIN_VERSION" --profile minimal
          rustup default "$RUST_TOOLCHAIN_VERSION"

      - name: Compile production TypeId EDG driver with hook-free bridge
        working-directory: compiler
        run: |
          set -euo pipefail
          export PATH="$HOME/.cargo/bin:$PATH"
          cargo test --manifest-path tools/edg-driver/Cargo.toml
          for filter in cxx_source_boolean_tests cxx5_exact_pointer_call_identity_tests; do
            cargo test --manifest-path tools/edg-driver/Cargo.toml "$filter" -- --nocapture \
              2>&1 | tee "$RUNNER_TEMP/${filter}.log"
            grep -Eq 'test result: ok[.] [1-9][0-9]* passed; 0 failed' \
              "$RUNNER_TEMP/${filter}.log"
          done
          cargo test --manifest-path tools/edg-driver/Cargo.toml \
            lvalue_adjust_ -- --nocapture \
            2>&1 | tee "$RUNNER_TEMP/checked-scalar-lvalue-adjust.log"
          grep -Eq 'test result: ok[.] [1-9][0-9]* passed; 0 failed' \
            "$RUNNER_TEMP/checked-scalar-lvalue-adjust.log"
          cargo build --manifest-path tools/edg-driver/Cargo.toml
          test -x tools/edg-driver/target/debug/compiler-edg-driver

      - name: Prove native external data ELF relocation against independent G++ owner
        working-directory: edgcpp/build/gcc-release
        run: |
          set -euo pipefail
          source ./environment.sh
          driver="$GITHUB_WORKSPACE/compiler/tools/edg-driver/target/debug/compiler-edg-driver"
          fixtures="$GITHUB_WORKSPACE/compiler/tools/edg-driver/tests/fixtures"
          out="$RUNNER_TEMP/cxx5-imported-external"
          mkdir -p "$out"
          cd "$out"
          cp "$fixtures/edg_native_cxx5_external_scalar.cpp" source.cpp
          cp "$fixtures/edg_native_cxx5_external_scalar_owner.cpp" owner.cpp
          g++ -std=c++17 -Wall -Wextra -Werror -c owner.cpp -o owner.o
          g++ -std=c++17 -Wall -Wextra -Werror source.cpp owner.o -o reference
          timeout 15s ./reference >reference.out 2>reference.err
          version="$(g++ -dumpfullversion -dumpversion)"
          IFS=. read -r major minor patch <<<"$version"
          gnu_number=$((10#$major*10000+10#${minor:-0}*100+10#${patch:-0}))
          "$driver" native.o --g++ --c++17 --no_strict_gnu \
            --gnu_version "$gnu_number" source.cpp >native.compile.log 2>&1 || {
              tail -n 100 native.compile.log >&2
              test ! -e native.o
              exit 1
            }
          test "$(od -An -tx1 -N4 native.o | tr -d '[:space:]')" = 7f454c46
          nm -u native.o | grep -Eq ' U imported_scalar$'
          readelf -r native.o | grep -F 'imported_scalar'
          g++ native.o owner.o -o native
          timeout 15s ./native >native.out 2>native.err
          test "$(sha256sum reference.out | cut -d' ' -f1)" = "$(sha256sum native.out | cut -d' ' -f1)"
          test "$(sha256sum reference.err | cut -d' ' -f1)" = "$(sha256sum native.err | cut -d' ' -f1)"
          echo "EDG_EXTERNAL_NATIVE fixture=imported_scalar result=executable_parity_pass" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Check class-reference source ABI tests without object permission
        working-directory: compiler
        run: |
          set -euo pipefail
          export PATH="$HOME/.cargo/bin:$PATH"
          cargo test --manifest-path tools/edg-driver/Cargo.toml class_reference_result_tests -- --nocapture
          echo "EDG_REFERENCE_RETURN gate=source_verified_ptr64_no_class_materialization result=pass" >>"$GITHUB_STEP_SUMMARY"

      - name: Native source-defined bool AL versus independent G++
        working-directory: edgcpp/build/gcc-release
        run: |
          set -euo pipefail
          source ./environment.sh
          driver="$GITHUB_WORKSPACE/compiler/tools/edg-driver/target/debug/compiler-edg-driver"
          fixture="$GITHUB_WORKSPACE/compiler/tools/edg-driver/tests/fixtures/edg_native_cxx5_defined_bool.cpp"
          work="$RUNNER_TEMP/cxx5-defined-bool"
          mkdir -p "$work"
          cd "$work"
          cp "$fixture" source.cpp
          g++ -std=c++17 -fno-exceptions -Wall -Wextra -Werror source.cpp -o reference
          timeout 15s ./reference >ref.out 2>ref.err
          version="$(g++ -dumpfullversion -dumpversion)"
          IFS=. read -r major minor patch <<<"$version"
          gnu_number=$((10#$major*10000+10#${minor:-0}*100+10#${patch:-0}))
          "$driver" native.o --g++ --c++17 --no_strict_gnu \
            --no_exceptions --gnu_version "$gnu_number" source.cpp >native.compile.log 2>&1 || {
              tail -n 80 native.compile.log
              test ! -e native.o
              exit 1
            }
          test "$(od -An -tx1 -N4 native.o | tr -d '[:space:]')" = 7f454c46
          nm native.o | grep -F ' edg_cxx_bool_defined'
          g++ -std=c++17 -fno-exceptions native.o -o native
          timeout 15s ./native >native.out 2>native.err
          test "$(sha256sum ref.out | cut -d' ' -f1)" = "$(sha256sum native.out | cut -d' ' -f1)"
          test "$(sha256sum ref.err | cut -d' ' -f1)" = "$(sha256sum native.err | cut -d' ' -f1)"
          echo 'EDG_CXX5_DEFINED_BOOL native_elf=yes gxx_runtime_parity=yes' >>"$GITHUB_STEP_SUMMARY"

      - name: Verify const char-reference formal against independent G++ caller
        working-directory: edgcpp/build/gcc-release
        run: |
          set -euo pipefail
          source ./environment.sh
          driver="$GITHUB_WORKSPACE/compiler/tools/edg-driver/target/debug/compiler-edg-driver"
          work="$RUNNER_TEMP/cxx5-scalar-ref"
          mkdir -p "$work"
          cd "$work"
          cat >native_source.cpp <<'CPP'
          bool equal_char(const char& a, const char& b) { return a==b; }
          CPP
          cat >caller.cpp <<'CPP'
          #include <cstdio>
          extern bool equal_char(const char&, const char&);
          int main() {
            const char values[]={0,1,7,42,127,-1,-8};
            int sum=0;
            for (char a:values) for (char b:values) {
              bool expected=(a==b);
              if (equal_char(a,b)!=expected) return 3;
              sum+=equal_char(a,b);
            }
            char same=13;
            if (!equal_char(same,same)) return 4;
            std::printf("%d\n",sum);
            return sum==7 ? 0 : 5;
          }
          CPP
          g++ -std=c++17 -fno-exceptions -Wall -Wextra -Werror \
            native_source.cpp caller.cpp -o oracle
          timeout 15s ./oracle >oracle.out 2>oracle.err
          version="$(g++ -dumpfullversion -dumpversion)"
          IFS=. read -r major minor patch <<<"$version"
          gnu_number=$((10#$major*10000+10#${minor:-0}*100+10#${patch:-0}))
          "$driver" native.o --g++ --c++17 --no_strict_gnu \
            --no_exceptions --gnu_version "$gnu_number" native_source.cpp >native.log 2>&1 || {
              tail -n 80 native.log >&2
              test ! -e native.o
              exit 1
            }
          test "$(od -An -tx1 -N4 native.o | tr -d '[:space:]')" = 7f454c46
          g++ -std=c++17 -fno-exceptions native.o caller.cpp -o native
          timeout 15s ./native >native.out 2>native.err
          test "$(sha256sum oracle.out | cut -d' ' -f1)" = \
               "$(sha256sum native.out | cut -d' ' -f1)"
          test "$(sha256sum oracle.err | cut -d' ' -f1)" = \
               "$(sha256sum native.err | cut -d' ' -f1)"
          cat >volatile_ref.cpp <<'CPP'
          bool read_volatile(volatile char& x) { return x != 0; }
          CPP
          rm -f forbidden.o
          if "$driver" forbidden.o --g++ --c++17 --no_strict_gnu \
            --no_exceptions --gnu_version "$gnu_number" volatile_ref.cpp >forbidden.log 2>&1; then
            echo "::error::Unsupported volatile scalar reference compiled"
            exit 1
          fi
          test ! -e forbidden.o
          echo 'EDG_CXX5_SCALAR_REFERENCE const_char_ref=GXX_parity volatile_ref=rejected_no_object' >>"$GITHUB_STEP_SUMMARY"

      - name: Prove signed-byte AL return definition and poisoned direct-call ABI against G++
        working-directory: edgcpp/build/gcc-release
        run: |
          set -euo pipefail
          source ./environment.sh
          driver="$GITHUB_WORKSPACE/compiler/tools/edg-driver/target/debug/compiler-edg-driver"
          fixtures="$GITHUB_WORKSPACE/compiler/tools/edg-driver/tests/fixtures"
          work="$RUNNER_TEMP/cxx5-signed-byte"
          mkdir -p "$work"
          cd "$work"
          cp "$fixtures/edg_native_cxx5_signed_char_returns.cpp" definitions.cpp
          cp "$fixtures/edg_native_cxx5_signed_byte_poisoned_call.cpp" poisoned_call.cpp
          cat >caller.cpp <<'CPP'
          #include <cstdio>
          extern "C" signed char ret_min(void);
          extern "C" signed char ret_neg(void);
          extern "C" signed char ret_zero(void);
          extern "C" signed char ret_one(void);
          extern "C" signed char ret_max(void);
          extern "C" int consume_poisoned_byte(void);
          int main() {
            const int values[] = {ret_min(),ret_neg(),ret_zero(),ret_one(),ret_max()};
            const int expected[] = {-128,-1,0,1,127};
            for (unsigned i=0;i<5;++i) if (values[i]!=expected[i]) return 10+i;
            if (consume_poisoned_byte()!=-128) return 20;
            std::printf("%d %d %d %d %d %d\n",values[0],values[1],values[2],
              values[3],values[4],consume_poisoned_byte());
            return 0;
          }
          CPP
          cat >poisoned.s <<'ASM'
          .text
          .globl poisoned_byte
          .type poisoned_byte,@function
          poisoned_byte:
              movl $0x7f7f7f80,%eax
              ret
          .section .note.GNU-stack,"",@progbits
          ASM
          g++ -c poisoned.s -o poisoned.o
          g++ -std=c++17 -fno-exceptions -O0 -Wall -Wextra -Werror \
            definitions.cpp poisoned_call.cpp caller.cpp poisoned.o -o oracle
          timeout 15s ./oracle >oracle.out 2>oracle.err
          version="$(g++ -dumpfullversion -dumpversion)"
          IFS=. read -r major minor patch <<<"$version"
          gnu_number=$((10#$major*10000+10#${minor:-0}*100+10#${patch:-0}))
          for name in definitions poisoned_call; do
            "$driver" "$name.o" --g++ --c++17 --no_strict_gnu \
              --no_exceptions --gnu_version "$gnu_number" "$name.cpp" \
              >"$name.log" 2>&1 || {
                tail -n 80 "$name.log" >&2
                test ! -e "$name.o"
                exit 1
              }
            test "$(od -An -tx1 -N4 "$name.o" | tr -d '[:space:]')" = 7f454c46
          done
          g++ -std=c++17 -fno-exceptions definitions.o poisoned_call.o \
            caller.cpp poisoned.o -o native
          timeout 15s ./native >native.out 2>native.err
          test "$(sha256sum oracle.out | cut -d' ' -f1)" = \
               "$(sha256sum native.out | cut -d' ' -f1)"
          test "$(sha256sum oracle.err | cut -d' ' -f1)" = \
               "$(sha256sum native.err | cut -d' ' -f1)"
          echo 'EDG_CXX5_SIGNED_BYTE signed_AL_gxx_parity=yes poisoned_upper_EAX=yes' \
            >>"$GITHUB_STEP_SUMMARY"

      - name: Prove signed-char GP formal against independent G++ and poisoned EDI caller
        working-directory: edgcpp/build/gcc-release
        run: |
          set -euo pipefail
          source ./environment.sh
          driver="$GITHUB_WORKSPACE/compiler/tools/edg-driver/target/debug/compiler-edg-driver"
          fixture="$GITHUB_WORKSPACE/compiler/tools/edg-driver/tests/fixtures/edg_native_cxx5_signed_byte_formal.cpp"
          work="$RUNNER_TEMP/cxx5-signed-byte-formal"
          mkdir -p "$work"
          cd "$work"
          cp "$fixture" definition.cpp
          cat >caller.cpp <<'CPP'
          #include <cstdio>
          extern "C" signed char echo_signed_byte(signed char);
          extern "C" signed char call_poisoned_formal(void);
          int main() {
            const signed char values[]={-128,-1,0,1,127};
            for (signed char v:values) if (echo_signed_byte(v)!=v) return 11;
            if (call_poisoned_formal()!=-128) return 12;
            std::printf("%d\n", static_cast<int>(call_poisoned_formal()));
            return 0;
          }
          CPP
          cat >caller_poisoned.s <<'ASM'
          .text
          .globl call_poisoned_formal
          .type call_poisoned_formal,@function
          call_poisoned_formal:
              movl $0x7f7f7f80,%edi
              jmp echo_signed_byte@PLT
          .section .note.GNU-stack,"",@progbits
          ASM
          g++ -c caller_poisoned.s -o caller_poisoned.o
          g++ -std=c++17 -fno-exceptions -O0 -Wall -Wextra -Werror \
            definition.cpp caller.cpp caller_poisoned.o -o oracle
          timeout 15s ./oracle >oracle.out 2>oracle.err
          version="$(g++ -dumpfullversion -dumpversion)"
          IFS=. read -r major minor patch <<<"$version"
          gnu_number=$((10#$major*10000+10#${minor:-0}*100+10#${patch:-0}))
          "$driver" native.o --g++ --c++17 --no_strict_gnu \
            --no_exceptions --gnu_version "$gnu_number" definition.cpp >native.log 2>&1 || {
              tail -n 80 native.log >&2
              test ! -e native.o
              exit 1
            }
          test "$(od -An -tx1 -N4 native.o | tr -d '[:space:]')" = 7f454c46
          g++ -std=c++17 -fno-exceptions native.o caller.cpp caller_poisoned.o -o native
          timeout 15s ./native >native.out 2>native.err
          test "$(sha256sum oracle.out | cut -d' ' -f1)" = \
               "$(sha256sum native.out | cut -d' ' -f1)"
          test "$(sha256sum oracle.err | cut -d' ' -f1)" = \
               "$(sha256sum native.err | cut -d' ' -f1)"
          cat >invalid.cpp <<'CPP'
          extern "C" signed char reject_volatile(volatile signed char v) { return v; }
          CPP
          if "$driver" invalid.o --g++ --c++17 --no_strict_gnu \
            --no_exceptions --gnu_version "$gnu_number" invalid.cpp >invalid.log 2>&1; then
            echo "::error::volatile signed-byte formal unexpectedly compiled" >&2
            exit 1
          fi
          test ! -e invalid.o
          echo 'EDG_CXX5_SIGNED_BYTE_FORMAL GXX_parity=yes poisoned_upper_EDI=yes volatile_rejected=yes' \
            >>"$GITHUB_STEP_SUMMARY"

      - name: Prove source pointer automatic Ptr64 SSA against G++ and reject uninitialized pointer
        working-directory: edgcpp/build/gcc-release
        run: |
          set -euo pipefail
          source ./environment.sh
          driver="$GITHUB_WORKSPACE/compiler/tools/edg-driver/target/debug/compiler-edg-driver"
          work="$RUNNER_TEMP/cxx5-pointer-ssa"
          mkdir -p "$work"
          cd "$work"
          cat >defs.cpp <<'CPP'
          int first(const int* p) {
            const int* q=p;
            return *q;
          }
          int second(const int* p) {
            const int* q=p;
            ++q;
            return *q;
          }
          CPP
          cat >caller.cpp <<'CPP'
          #include <cstdio>
          extern int first(const int*);
          extern int second(const int*);
          int main() {
            const int data[][3]={{13,29,51},{-5,0,122},{0,-79,1},{2147483647,-2147483647,0}};
            long sum=0;
            for (const auto& row:data) {
              if (first(row)!=row[0] || second(row)!=row[1]) return 5;
              sum+=first(row)+second(row);
            }
            std::printf("%ld\n",sum);
            return 0;
          }
          CPP
          g++ -std=c++17 -fno-exceptions -Wall -Wextra -Werror defs.cpp caller.cpp -o oracle
          timeout 15s ./oracle >oracle.out 2>oracle.err
          version="$(g++ -dumpfullversion -dumpversion)"
          IFS=. read -r major minor patch <<<"$version"
          gnu_number=$((10#$major*10000+10#${minor:-0}*100+10#${patch:-0}))
          "$driver" native.o --g++ --c++17 --no_strict_gnu \
            --no_exceptions --gnu_version "$gnu_number" defs.cpp >native.log 2>&1 || {
              tail -n 80 native.log >&2
              test ! -e native.o
              exit 1
            }
          test "$(od -An -tx1 -N4 native.o | tr -d '[:space:]')" = 7f454c46
          g++ -std=c++17 -fno-exceptions native.o caller.cpp -o native
          timeout 15s ./native >native.out 2>native.err
          test "$(sha256sum oracle.out | cut -d' ' -f1)" = \
               "$(sha256sum native.out | cut -d' ' -f1)"
          test "$(sha256sum oracle.err | cut -d' ' -f1)" = \
               "$(sha256sum native.err | cut -d' ' -f1)"
          cat >invalid.cpp <<'CPP'
          int read_bad(const int* p) { const int* q; (void)p; return *q; }
          CPP
          rm -f invalid.o
          if "$driver" invalid.o --g++ --c++17 --no_strict_gnu \
            --no_exceptions --gnu_version "$gnu_number" invalid.cpp >invalid.log 2>&1; then
            echo "::error::uninitialized pointer automatic incorrectly accepted" >&2
            exit 1
          fi
          test ! -e invalid.o
          echo 'EDG_CXX5_POINTER_SSA native_ELF_GXX_parity=yes uninitialized_rejected=yes' \
            >>"$GITHUB_STEP_SUMMARY"

      - name: Compare unchanged GCC15 iostream and original intermediates
        working-directory: edgcpp/build/gcc-release
        run: |
          set -euo pipefail
          source ./environment.sh
          driver="$GITHUB_WORKSPACE/compiler/tools/edg-driver/target/debug/compiler-edg-driver"
          fixtures="$GITHUB_WORKSPACE/compiler/tools/edg-driver/tests/fixtures"
          out="$RUNNER_TEMP/cxx5-original-iostream"
          mkdir -p "$out"
          cd "$out"
          g++ -std=c++17 -v -E -x c++ /dev/null >include-search.log 2>&1
          mapfile -t include_dirs < <(awk '
            /#include <\.\.\.> search starts here:/{active=1;next}
            /^End of search list/{active=0}
            active && /^ /{sub(/^[[:space:]]+/,"");print}
          ' include-search.log)
          test "${#include_dirs[@]}" -ge 3
          include_flags=()
          for directory in "${include_dirs[@]}"; do
            test -d "$directory"
            include_flags+=("-I$directory")
          done
          version="$(g++ -dumpfullversion -dumpversion)"
          IFS=. read -r major minor patch <<<"$version"
          gnu_number=$((10#$major*10000 + 10#${minor:-0}*100 + 10#${patch:-0}))
          for case in unused no_endl endl; do
            case "$case" in
              unused) original=edg_native_cxx5_iostream_unused.cpp ;;
              no_endl) original=edg_native_cxx5_iostream_no_endl.cpp ;;
              endl) original=edg_native_cxx5_iostream.cpp ;;
            esac
            cp "$fixtures/$original" source.cpp
            g++ -std=c++17 -fno-exceptions -O0 -Wall -Wextra -Werror \
              source.cpp -o oracle
            set +e
            timeout 15s ./oracle >oracle.out 2>oracle.err
            oracle_status=$?
            set -e
            test "$oracle_status" -lt 124
            rm -f native.o native native.out native.err
            set +e
            timeout 180s "$driver" native.o --g++ --c++17 --no_strict_gnu \
              --no_exceptions --gnu_version "$gnu_number" "${include_flags[@]}" \
              source.cpp >native.compile.log 2>&1
            status=$?
            set -e
            if test "$status" -eq 0; then
              test "$(od -An -tx1 -N4 native.o | tr -d '[:space:]')" = 7f454c46
              if g++ -std=c++17 -fno-exceptions native.o -o native >link.log 2>&1; then
                set +e
                timeout 15s ./native >native.out 2>native.err
                native_status=$?
                set -e
                test "$native_status" = "$oracle_status"
                test "$(sha256sum oracle.out | cut -d' ' -f1)" = \
                     "$(sha256sum native.out | cut -d' ' -f1)"
                test "$(sha256sum oracle.err | cut -d' ' -f1)" = \
                     "$(sha256sum native.err | cut -d' ' -f1)"
                echo "EDG_IOS_ORIGINAL case=$case result=runtime_parity" >>"$GITHUB_STEP_SUMMARY"
              else
                echo "EDG_IOS_ORIGINAL case=$case result=link_blocker" >>"$GITHUB_STEP_SUMMARY"
                tail -n 15 link.log
              fi
            elif test "$status" -eq 124 || test "$status" -eq 137; then
              echo "EDG_IOS_ORIGINAL case=$case compiler timeout or killed" >&2
              exit 1
            else
              test ! -e native.o
              grep -E 'EDG -> compiler-ir rejected|native TypeId x86 backend|Error:|error:' \
                native.compile.log | tail -n 8 || {
                cat native.compile.log
                exit 1
              }
              echo "EDG_IOS_ORIGINAL case=$case result=source_rejection_no_object" >>"$GITHUB_STEP_SUMMARY"
            fi
          done

      - name: Verify exact AL bool-return ABI against independent G++ definition
        working-directory: edgcpp/build/gcc-release
        run: |
          set -euo pipefail
          source ./environment.sh
          driver="$GITHUB_WORKSPACE/compiler/tools/edg-driver/target/debug/compiler-edg-driver"
          work="$RUNNER_TEMP/cxx5-bool-al"
          mkdir -p "$work"
          cd "$work"
          cat >main.cpp <<'CPP'
          extern bool test_bool(int);
          int main() {
            if (test_bool(0)) return 7;
            if (!test_bool(1)) return 9;
            return 0;
          }
          CPP
          cat >owner.cpp <<'CPP'
          bool test_bool(int x) { return x!=0; }
          CPP
          g++ -std=c++17 -Wall -Wextra -Werror -fno-exceptions -c owner.cpp -o owner.o
          g++ -std=c++17 -Wall -Wextra -Werror -fno-exceptions main.cpp owner.o -o gxx_reference
          timeout 15s ./gxx_reference
          version="$(g++ -dumpfullversion -dumpversion)"
          IFS=. read -r major minor patch <<<"$version"
          gnu_number=$((10#$major*10000+10#${minor:-0}*100+10#${patch:-0}))
          "$driver" native.o --g++ --c++17 --no_strict_gnu \
            --no_exceptions --gnu_version "$gnu_number" main.cpp >native.log 2>&1 || {
              tail -n 60 native.log >&2
              test ! -e native.o
              exit 1
            }
          test "$(od -An -tx1 -N4 native.o | tr -d '[:space:]')" = 7f454c46
          readelf -rW native.o | grep -F '_Z9test_booli'
          g++ native.o owner.o -o native
          timeout 15s ./native
          echo 'EDG_CXX5_BOOL_AL independent_gxx_owner=yes native_elf=yes executable_parity=yes' >>"$GITHUB_STEP_SUMMARY"

          # SysV _Bool guarantees AL; EAX[31:8] is intentionally poisoned.
          # The native compiler must ignore the poisoned high bits, as G++ does.
          cat >noisy.S <<'ASM'
          .text
          .globl _Z9test_booli
          .type _Z9test_booli, @function
          _Z9test_booli:
              movl $0x7eadbe00, %eax
              testl %edi, %edi
              setne %al
              ret
          .section .note.GNU-stack,"",@progbits
          ASM
          gcc -c noisy.S -o noisy.o
          g++ main.cpp noisy.o -o gxx_noisy
          timeout 15s ./gxx_noisy
          g++ native.o noisy.o -o native_noisy
          timeout 15s ./native_noisy
          echo 'EDG_CXX5_BOOL_AL high_EAX_bits_poisoned=yes gcc_native_parity=yes' >>"$GITHUB_STEP_SUMMARY"

      - name: Keep original-source diagnostics and native ELF evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: edg-reference-return-native-probe
          path: |
            ${{ runner.temp }}/cxx5-imported-external/
            ${{ runner.temp }}/cxx5-original-iostream/
            ${{ runner.temp }}/cxx5-bool-al/
            ${{ runner.temp }}/cxx5-defined-bool/
            ${{ runner.temp }}/cxx5-scalar-ref/
            ${{ runner.temp }}/cxx5-signed-byte/
            ${{ runner.temp }}/cxx5-signed-byte-formal/
            ${{ runner.temp }}/cxx5-pointer-ssa/
          if-no-files-found: warn
          retention-days: 7
