name: Verify x86 i64 branch lowering
on:
  push:
    branches: [ci/typed-i64-direct-jcc-pr407-20261106]
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: fe9c7c6f0042bed87455aba51160d9500db51bf4
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Verify source
        run: test "$(git -C compiler rev-parse HEAD)" = "fe9c7c6f0042bed87455aba51160d9500db51bf4"
      - name: Restrict workspace to core
        shell: bash
        run: |
          cat > compiler/Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir", "crates/opt", "crates/backend", "crates/backend-x86"]
          EOF
          rm -f compiler/Cargo.lock
      - name: Native i64 oracle
        working-directory: compiler
        run: cargo test -p compiler-backend-x86 --test typed_i64_compare_branch_native
      - name: Core tests
        working-directory: compiler
        run: cargo test -p compiler-ir -p compiler-opt -p compiler-backend -p compiler-backend-x86
      - name: Strict Clippy
        working-directory: compiler
        run: cargo clippy -p compiler-backend-x86 --all-targets -- -D warnings
