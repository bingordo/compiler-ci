name: EDG C++2 lifetime and GNU C++17 header executable differential

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/verify-edg-cxx2-native-20261110.yml
  workflow_dispatch:
  schedule:
    - cron: '19 11 * * 1-5'
  pull_request:
    paths:
      - .github/workflows/verify-edg-cxx2-native-20261110.yml

permissions:
  contents: read

concurrency:
  group: edg-cxx2-native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  direct-edg:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    container:
      image: ghcr.io/edgcpp/ci-runner@sha256:14b3948c2ce12cfa5472e5a6c468393d15426f3a67685cc35d830ea5db2acdf8
    defaults:
      run:
        shell: edg-container-exec "bash -eo pipefail {0}"
    env:
      EDG_SOURCE_SHA: 4fa9e45eb8b986b910304204caf231ea2dc5b968
      EDG_RELEASE_TAG: edgcpfe-ci-799603e0b5ab
      EDG_RELEASE_SHA256: fa769825e70766fbefe017806816b2338acd03daa93bb5562369c293972ce64c
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      RUST_TOOLCHAIN_VERSION: 1.99.1
    steps:
      - name: Checkout private compiler pilot with scoped CI key
        uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 2e3db5319f020cbb217f40c12fb68991568b09c5
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false

      - name: Check out exact EDG headers and configuration
        uses: actions/checkout@v7
        with:
          repository: bingundu/edgcpp
          ref: 4fa9e45eb8b986b910304204caf231ea2dc5b968
          path: edgcpp
          persist-credentials: false

      - name: Record compiler and EDG source revision
        run: |
          test "$(git -C edgcpp rev-parse HEAD)" = "$EDG_SOURCE_SHA"
          git -C compiler rev-parse HEAD | tee -a "$GITHUB_STEP_SUMMARY"

      # A prebuilt archive predating the source hook cannot validate its
      # semantics. Compile a genuinely matched native EDG callable library.
      # Keep Actions in compiler-ci; no compiler-repo CI is initiated.
      - name: Build exact source-owned EDG callable native library
        env:
          EDG_BASE: ${{ github.workspace }}/edgcpp/bases/docker/dev-env/gcc
        working-directory: edgcpp
        run: |
          set -euo pipefail
          cmake --preset linux-gcc-release \
            -DEDG_BUILD_LIB=OFF \
            -DEDG_BUILD_CALLABLE_LIBRARY=ON \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
          cmake --build build/gcc-release --target edgcpfe --parallel 2
          test -s build/gcc-release/lib/libedgcpfe.a
          # Distinguish the source-hook archive from the previously restored
          # release archive. No mixed-source native objects are permitted.
          ar t build/gcc-release/lib/libedgcpfe.a | grep -Fxq 'lower_il.c.o'
          echo "EDG callable archive built wholly from source revision $EDG_SOURCE_SHA" >>"$GITHUB_STEP_SUMMARY"

      - name: Check out C++0 EDG linker-symbol export candidate
        uses: actions/checkout@v4
        with:
          repository: bingordo/edgcpp-rust
          ref: 2bd6d1f6c38304d200231089f06cf6c42f6366a2
          path: edg-rust
          persist-credentials: false

      # The historical C++2 trace parser consumes the pinned older example
      # format above. Exercise the new bridge directly in its own checkout
      # without conflating that diagnostic format with the compiler ABI.
      - name: Check out source-owned native callee bridge
        uses: actions/checkout@v4
        with:
          repository: bingordo/edgcpp-rust
          ref: cbfddcd51add519f95f07d513c60c14d07f7967a
          path: edg-rust-call-target
          persist-credentials: false

      - name: Check out independent GCC Itanium vtable ABI oracle
        uses: actions/checkout@v4
        with:
          path: gcc-itanium-oracle
          persist-credentials: false

      - name: Install pinned Rust toolchain
        run: |
          if ! command -v cargo >/dev/null; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | \
              sh -s -- -y --profile minimal --default-toolchain "$RUST_TOOLCHAIN_VERSION"
          fi
          export PATH="$HOME/.cargo/bin:$PATH"
          rustup toolchain install "$RUST_TOOLCHAIN_VERSION" --profile minimal
          rustup default "$RUST_TOOLCHAIN_VERSION"

      - name: Test source-authoritative EDG C++ dialect and class admission wire events
        env:
          EDGCPP_SOURCE_DIR: ${{ github.workspace }}/edgcpp
          EDGCPP_COMPILE_COMMANDS: ${{ github.workspace }}/edgcpp/build/gcc-release/compile_commands.json
          EDGCPP_LIB_DIR: ${{ github.workspace }}/edgcpp/build/gcc-release/lib
          EDGCPP_EDG_REVISION: ${{ env.EDG_SOURCE_SHA }}
        run: |
          set -euo pipefail
          export PATH="$HOME/.cargo/bin:$PATH"
          python3 edg-rust-call-target/tools/gen_wire_schema.py --check
          cargo test --manifest-path edg-rust/Cargo.toml --lib decodes_cpp_dialect_and_immutable_record_triviality_proofs
          cargo test --manifest-path edg-rust-call-target/Cargo.toml --lib cxx5_call_target_wire_tests -- --nocapture
          cargo test --manifest-path edg-rust-call-target/Cargo.toml --lib cxx5_native_call_dispatch_wire_tests -- --nocapture
          cargo test --manifest-path edg-rust-call-target/Cargo.toml --lib cxx5_virtual_member_info_wire_tests -- --nocapture
          cargo test --manifest-path edg-rust-call-target/Cargo.toml --lib callee_vptr_field_tests -- --nocapture
          cargo test --manifest-path edg-rust-call-target/Cargo.toml --lib cxx5_prelower_virtual_call_origin_tests -- --nocapture
          cargo test --manifest-path edg-rust-call-target/Cargo.toml --lib cxx5_virtual_receiver_reuse_tests -- --nocapture
          cargo test --manifest-path edg-rust-call-target/Cargo.toml --lib cxx5_virtual_entry_index_selection_tests -- --nocapture
          cargo test --manifest-path edg-rust-call-target/Cargo.toml --lib cxx5_virtual_vptr_receiver_pair_tests -- --nocapture
          cargo test --manifest-path edg-rust-call-target/Cargo.toml --lib audit_complete_wire_field_tags_tests -- --nocapture

      # A fully independent GCC x86-64 Itanium ABI oracle: verify physical
      # primary/secondary vptr address points and two negative this-adjustment
      # thunks before comparing to EDG's diagnostic source index. Crucially
      # this does not authorize a runtime dereference by the compiler backend.
      - name: Compare G++ Itanium vtable address points and secondary thunks
        run: |
          set -euo pipefail
          fixture="$GITHUB_WORKSPACE/gcc-itanium-oracle/.github/tests/edg-cxx5-itanium-oracle.cpp"
          checker="$GITHUB_WORKSPACE/gcc-itanium-oracle/.github/tests/check-edg-cxx5-itanium-oracle.py"
          test -s "$fixture" && test -s "$checker"
          outdir="$RUNNER_TEMP/edg-cxx5-gcc-itanium"
          mkdir -p "$outdir"
          g++ -std=c++17 -O0 -fdump-lang-class -c "$fixture" -o "$outdir/oracle.o"
          mapfile -t dumps < <(find "$outdir" -maxdepth 1 -type f -name '*.class')
          test "${#dumps[@]}" -eq 1
          python3 "$checker" "${dumps[0]}" "$outdir/oracle.o"
          g++ -std=c++17 -O0 "$fixture" -o "$outdir/oracle"
          "$outdir/oracle"
          echo "Independent GCC Itanium primary/secondary address point, -16/-32 adjustment thunk, and native virtual-runtime oracle passed; never substitute its indices for EDG proof" >> "$GITHUB_STEP_SUMMARY"

      - name: Probe native EDG logical virtual member and vptr metadata
        working-directory: edgcpp
        env:
          EDGCPP_SOURCE_DIR: ${{ github.workspace }}/edgcpp
          EDGCPP_COMPILE_COMMANDS: ${{ github.workspace }}/edgcpp/build/gcc-release/compile_commands.json
          EDGCPP_LIB_DIR: ${{ github.workspace }}/edgcpp/build/gcc-release/lib
          EDGCPP_EDG_REVISION: ${{ env.EDG_SOURCE_SHA }}
        run: |
          set -euo pipefail
          export PATH="$HOME/.cargo/bin:$PATH"
          source build/gcc-release/environment.sh
          cat >build/gcc-release/virtual-member-source.cpp <<'CPP'
          struct Base { virtual int f(); int direct(); };
          int Base::f() { return 3; }
          int Base::direct() { return 11; }
          struct Derived : Base { int f() override; };
          int Derived::f() { return 5; }
          int main() {
            Derived d; Base *b = &d;
            // Explicit virtual dispatch, qualified nonvirtual call of a
            // virtual member, and ordinary nonvirtual member call.
            return b->f() != 5 || b->Base::f() != 3 || b->direct() != 11;
          }
          CPP
          cd build/gcc-release
          version="$(g++ -dumpfullversion -dumpversion)"
          IFS=. read -r major minor patch <<<"$version"
          gnu_number=$((10#${major}*10000+10#${minor:-0}*100+10#${patch:-0}))
          cargo run --quiet --manifest-path "$GITHUB_WORKSPACE/edg-rust-call-target/Cargo.toml" \
            --example parse -- --g++ --c++17 --no_strict_gnu --gnu_version "$gnu_number" \
            virtual-member-source.cpp >"$RUNNER_TEMP/edg-virtual-member.log" 2>&1
          grep -F 'EDG_VIRTUAL_MEMBER ' "$RUNNER_TEMP/edg-virtual-member.log" | head -n 20
          grep -F 'EDG_VIRTUAL_MEMBER ' "$RUNNER_TEMP/edg-virtual-member.log" | grep -F 'Base::f'
          grep -F 'EDG_VIRTUAL_MEMBER ' "$RUNNER_TEMP/edg-virtual-member.log" | grep -F 'Derived::f'
          # The exact EDG method display name may include '()' after
          # full native compilation. Identity is the source routine ID;
          # text spelling is diagnostic, not a source admission test.
          grep -F 'EDG_PRELOWER_VIRTUAL_ORIGIN ' "$RUNNER_TEMP/edg-virtual-member.log" | sed -n '1,12p' || true
          awk '/EDG_PRELOWER_VIRTUAL_ORIGIN / &&
               /function=main/ &&
               /original_name=Some\("Base::f/ &&
               /postlower_rewrite_proven=true/ &&
               /callee_pointer_stable=true/ &&
               /machine_slot_proven=false/ &&
               /executable_abi_proven=false/ {found=1}
               END {exit !found}' "$RUNNER_TEMP/edg-virtual-member.log"
          # Qualified Base::f and nonvirtual Base::direct MUST NOT
          # manufacture source-virtual origin events.
          awk '/EDG_PRELOWER_VIRTUAL_ORIGIN / && /function=main/ {n++}
               END {exit n != 1}' "$RUNNER_TEMP/edg-virtual-member.log"
          # EDG get_virtual_function_address returned a copy/reusable
          # receiver that remains the *direct* first call argument.
          # A qualified Base::f and nonvirtual Base::direct never get it.
          awk '/EDG_VIRTUAL_RECEIVER_REUSE / &&
               /function=main / &&
               /arg_index=0/ &&
               /edg_reuse_proven=true/ &&
               /subobject_abi_proven=false/ &&
               /executable_abi_proven=false/ {found=1; n++}
               END {exit (!found || n != 1)}' "$RUNNER_TEMP/edg-virtual-member.log"
          grep -F 'EDG_VIRTUAL_RECEIVER_REUSE ' "$RUNNER_TEMP/edg-virtual-member.log" | sed -n '1,12p'
          # This is EDG's exact source-generated eok_padd index; the
          # independent GCC oracle above proves its own physical primary
          # vptr and secondary thunks, NOT a mapping for arbitrary objects.
          awk '/EDG_NATIVE_VIRTUAL_INDEX / &&
               /function=main / &&
               /source_index=0 / &&
               /native_entry_bytes=8 / &&
               /source_byte_displacement=0 / &&
               /exact_index_node_proven=true/ &&
               /exact_source_padd_proven=true/ &&
               /machine_slot_proven=false/ &&
               /executable_abi_proven=false/ {n++}
               END {exit n != 1}' "$RUNNER_TEMP/edg-virtual-member.log"
          grep -F 'EDG_NATIVE_VIRTUAL_INDEX ' "$RUNNER_TEMP/edg-virtual-member.log" | sed -n '1,12p'
          awk '/EDG_VIRTUAL_VPTR_RECEIVER / &&
               /function=main / &&
               /arg_index=0 / &&
               /source_lookup_object_proven=true/ &&
               /reused_call_argument_proven=true/ &&
               /machine_this_adjustment_proven=false/ &&
               /executable_abi_proven=false/ {n++}
               END {exit n != 1}' "$RUNNER_TEMP/edg-virtual-member.log"
          grep -F 'EDG_VIRTUAL_VPTR_RECEIVER ' "$RUNNER_TEMP/edg-virtual-member.log" | sed -n '1,12p'
          grep -F 'EDG_VIRTUAL_MEMBER ' "$RUNNER_TEMP/edg-virtual-member.log" | grep -Fq 'executable_abi_proven=false'
          g++ -std=c++17 -O0 -o "$RUNNER_TEMP/virtual-member-gcc" virtual-member-source.cpp
          "$RUNNER_TEMP/virtual-member-gcc"
          # Also exercise the original system libstdc++ header chain with the
          # *new* bridge; the older TypeId negative matrix uses its own pin.
          cat >virtual-iostream-source.cpp <<'CPP'
          #include <iostream>
          int main() { std::cout << "Hello, world!" << std::endl; }
          CPP
          g++ -std=c++17 -v -E -x c++ /dev/null >"$RUNNER_TEMP/edg-virtual-includes.log" 2>&1
          mapfile -t include_dirs < <(awk '/#include <\.\.\.> search starts here:/{active=1;next} /^End of search list/{active=0} active && /^ /{sub(/^[[:space:]]+/,"");print}' "$RUNNER_TEMP/edg-virtual-includes.log")
          test "${#include_dirs[@]}" -ge 3
          include_flags=()
          for dir in "${include_dirs[@]}"; do
            test -d "$dir" && include_flags+=("-I$dir")
          done
          timeout --signal=TERM --kill-after=10s 10m \
            cargo run --quiet --manifest-path "$GITHUB_WORKSPACE/edg-rust-call-target/Cargo.toml" \
              --example parse -- --g++ --c++17 --no_strict_gnu --gnu_version "$gnu_number" \
              "${include_flags[@]}" virtual-iostream-source.cpp \
              >"$RUNNER_TEMP/edg-virtual-iostream.log" 2>&1
          grep -F 'EDG_VIRTUAL_MEMBER ' "$RUNNER_TEMP/edg-virtual-iostream.log" | sed -n '1,12p'
          awk '/EDG_VIRTUAL_MEMBER / && /executable_abi_proven=false/ {found=1} END {exit !found}' "$RUNNER_TEMP/edg-virtual-iostream.log"
          # The original std::ctype<char>::widen fallback contains a
          # lowered ordinary call whose *callee* references the EDG-owned
          # __vptr record field. Its raw integer constant is NOT a slot.
          awk '/EDG_INDIRECT_CALLEE_VPTR / &&
               /function=std::ctype<char>::widen/ &&
               /field_name=__vptr/ &&
               /source_virtual_proven=false/ &&
               /machine_slot_proven=false/ &&
               /executable_abi_proven=false/ {found=1}
               END {exit !found}' "$RUNNER_TEMP/edg-virtual-iostream.log"
          # Both halves of the EDG-owned rewrite must survive at the
          # same original std::ctype<char>::widen call site.
          awk '/EDG_PRELOWER_VIRTUAL_ORIGIN / &&
               /function=std::ctype<char>::widen/ &&
               /statement=0.block.2 path=0 / &&
               /original_name=Some\("std::ctype<char>::do_widen/ &&
               /postlower_rewrite_proven=true/ &&
               /callee_pointer_stable=true/ &&
               /machine_slot_proven=false/ &&
               /executable_abi_proven=false/ {found=1}
               END {exit !found}' "$RUNNER_TEMP/edg-virtual-iostream.log"
          awk '/EDG_VIRTUAL_RECEIVER_REUSE / &&
               /function=std::ctype<char>::widen/ &&
               /statement=0.block.2 path=0 / &&
               /arg_index=0/ &&
               /edg_reuse_proven=true/ &&
               /subobject_abi_proven=false/ &&
               /executable_abi_proven=false/ {found=1}
               END {exit !found}' "$RUNNER_TEMP/edg-virtual-iostream.log"
          grep -F 'EDG_VIRTUAL_RECEIVER_REUSE ' "$RUNNER_TEMP/edg-virtual-iostream.log" | sed -n '1,12p'
          awk '/EDG_NATIVE_VIRTUAL_INDEX / &&
               /function=std::ctype<char>::widen/ &&
               /statement=0.block.2 path=0 / &&
               /native_entry_bytes=8 / &&
               /exact_index_node_proven=true/ &&
               /exact_source_padd_proven=true/ &&
               /machine_address_point_proven=false/ &&
               /machine_slot_proven=false/ &&
               /executable_abi_proven=false/ {found=1}
               END {exit !found}' "$RUNNER_TEMP/edg-virtual-iostream.log"
          grep -F 'EDG_NATIVE_VIRTUAL_INDEX ' "$RUNNER_TEMP/edg-virtual-iostream.log" | sed -n '1,12p'
          awk '/EDG_VIRTUAL_VPTR_RECEIVER / &&
               /function=std::ctype<char>::widen/ &&
               /statement=0.block.2 path=0 / &&
               /source_lookup_object_proven=true/ &&
               /reused_call_argument_proven=true/ &&
               /subobject_offset_proven=false/ &&
               /machine_this_adjustment_proven=false/ &&
               /executable_abi_proven=false/ {n++}
               END {exit n != 1}' "$RUNNER_TEMP/edg-virtual-iostream.log"
          grep -F 'EDG_VIRTUAL_VPTR_RECEIVER ' "$RUNNER_TEMP/edg-virtual-iostream.log" | sed -n '1,12p'
          grep -F 'EDG_PRELOWER_VIRTUAL_ORIGIN ' "$RUNNER_TEMP/edg-virtual-iostream.log" | sed -n '1,12p'
          grep -F 'EDG_INDIRECT_CALLEE_VPTR ' "$RUNNER_TEMP/edg-virtual-iostream.log" | sed -n '1,12p'
          # Ordinary C++ function pointers have no EDG vptr field witness.
          cat >ordinary-function-pointer.cpp <<'CPP'
          int seven() { return 7; }
          int main() { int (*fn)() = seven; return fn() != 7; }
          CPP
          cargo run --quiet --manifest-path "$GITHUB_WORKSPACE/edg-rust-call-target/Cargo.toml" \
            --example parse -- --g++ --c++17 --no_strict_gnu --gnu_version "$gnu_number" \
            ordinary-function-pointer.cpp >"$RUNNER_TEMP/edg-ordinary-pointer.log" 2>&1
          if grep -Fq 'EDG_VIRTUAL_VPTR_RECEIVER ' "$RUNNER_TEMP/edg-ordinary-pointer.log"; then
            echo "ordinary function pointer incorrectly claimed a source-paired virtual receiver" >&2
            exit 1
          fi
          if grep -Fq 'EDG_NATIVE_VIRTUAL_INDEX ' "$RUNNER_TEMP/edg-ordinary-pointer.log"; then
            echo "ordinary function pointer incorrectly claimed EDG Itanium entry index" >&2
            exit 1
          fi
          if grep -Fq 'EDG_VIRTUAL_RECEIVER_REUSE ' "$RUNNER_TEMP/edg-ordinary-pointer.log"; then
            echo "ordinary function pointer incorrectly claimed virtual receiver reuse" >&2
            exit 1
          fi
          if grep -Fq 'EDG_PRELOWER_VIRTUAL_ORIGIN ' "$RUNNER_TEMP/edg-ordinary-pointer.log"; then
            echo "ordinary function pointer incorrectly claimed prelower virtual call origin" >&2
            exit 1
          fi
          if grep -Fq 'EDG_INDIRECT_CALLEE_VPTR ' "$RUNNER_TEMP/edg-ordinary-pointer.log"; then
            echo "ordinary function pointer was incorrectly classified as vptr-derived" >&2
            exit 1
          fi
          g++ -std=c++17 -O0 -o "$RUNNER_TEMP/ordinary-pointer-gcc" ordinary-function-pointer.cpp
          "$RUNNER_TEMP/ordinary-pointer-gcc"
          echo "Source-rebuilt EDG exact virtual table index subtree witnessed for Base::f and original libstdc++ do_widen; independent GCC primary/secondary address point and thunk oracle passed; no executable machine slot/this adjustment or virtual codegen admitted" >>"$GITHUB_STEP_SUMMARY"

      - name: Verify TypeId-native SysV GP variadic ABI acceptance and rejection
        working-directory: compiler
        run: |
          set -euo pipefail
          export PATH="$HOME/.cargo/bin:$PATH"
          # Isolate the dependency-free IR crate from the compiler workspace:
          # Cargo otherwise resolves the private Mini-C Git dependency of
          # the unrelated driver even when testing compiler-ir alone.
          temp="$(mktemp -d)"
          cp -a crates/ir "$temp/ir"
          cargo test --manifest-path "$temp/ir/Cargo.toml" sysv_gp_variadic_tests --lib


      - name: Run shared TypeId optimizer and inliner unit tests (isolated crates)
        working-directory: compiler
        run: |
          set -euo pipefail
          export PATH="$HOME/.cargo/bin:$PATH"
          # Cargo otherwise resolves unrelated private frontend Git dependencies.
          # Preserve all local path/dev dependencies in a standalone crate tree.
          temp="$(mktemp -d)"
          mkdir -p "$temp/crates"
          cp -a crates/ir crates/opt crates/backend crates/backend-x86 "$temp/crates/"
          cargo test --manifest-path "$temp/crates/opt/Cargo.toml" --lib

      - name: Build direct EDG to compiler-ir and x86 backend adapter
        working-directory: compiler
        env:
          EDGCPP_SOURCE_DIR: ${{ github.workspace }}/edgcpp
          EDGCPP_COMPILE_COMMANDS: ${{ github.workspace }}/edgcpp/build/gcc-release/compile_commands.json
          EDGCPP_LIB_DIR: ${{ github.workspace }}/edgcpp/build/gcc-release/lib
          EDGCPP_EDG_REVISION: ${{ env.EDG_SOURCE_SHA }}
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          cargo test --manifest-path tools/edg-driver/Cargo.toml
          cargo test --manifest-path tools/edg-driver/Cargo.toml cxx5_external_member_pointer_abi_tests -- --nocapture
          cargo test --manifest-path tools/edg-driver/Cargo.toml cxx5_borrowed_record_storage_tests -- --nocapture
          cargo test --manifest-path tools/edg-driver/Cargo.toml aggregate_storage_reference_tests -- --nocapture
          cargo test --manifest-path tools/edg-driver/Cargo.toml nested_halfword_is_layout_only -- --nocapture
          cargo test --manifest-path tools/edg-driver/Cargo.toml tagless_storage_never_admits_unknown_class_effects_or_value_use -- --nocapture
          cargo test --manifest-path tools/edg-driver/Cargo.toml nontrivial_record_rejection_has_exact_source_root_evidence -- --nocapture
          cargo test --manifest-path tools/edg-driver/Cargo.toml rejected_class_native_field_and_local_source_provenance_is_reported -- --nocapture
          cargo test --manifest-path tools/edg-driver/Cargo.toml widen_abi_diagnostics_report_source_owned_method_metadata_only -- --nocapture
          cargo test --manifest-path tools/edg-driver/Cargo.toml cxx5_checked_base_adjustment_tests -- --nocapture
          cargo test --manifest-path tools/edg-driver/Cargo.toml cxx5_checked_base_adjustment_tests -- --nocapture
          cargo build --manifest-path tools/edg-driver/Cargo.toml


      - name: Execute real EDG 240-byte eight-aligned aggregate against GCC C oracle
        working-directory: edgcpp/build/gcc-release
        env:
          EDGCPP_SOURCE_DIR: ${{ github.workspace }}/edgcpp
          EDGCPP_COMPILE_COMMANDS: ${{ github.workspace }}/edgcpp/build/gcc-release/compile_commands.json
          EDGCPP_LIB_DIR: ${{ github.workspace }}/edgcpp/build/gcc-release/lib
          EDGCPP_EDG_REVISION: ${{ env.EDG_SOURCE_SHA }}
        run: |
          set -euo pipefail
          export PATH="$HOME/.cargo/bin:$PATH"
          source ./environment.sh
          work="${RUNNER_TEMP}/edg-aggregate-240-align8"
          mkdir -p "$work"
          cp "${GITHUB_WORKSPACE}/compiler/tools/edg-driver/tests/fixtures/edg_native_c_aggregate_240_align8.c" "$work/fixture.c"
          cd "$work"
          # The independent compiler is also the source-layout oracle.
          gcc -std=c11 -O0 -Wall -Wextra -Werror fixture.c -o reference
          ./reference >reference.out 2>reference.err
          rm -f native.o
          "${GITHUB_WORKSPACE}/compiler/tools/edg-driver/target/debug/compiler-edg-driver" \
            native.o --typeid-native fixture.c >compile.log 2>&1 || {
              cat compile.log >&2
              exit 1
            }
          test "$(od -An -tx1 -N4 native.o | tr -d '[:space:]')" = 7f454c46
          gcc native.o -o native
          timeout 15s ./native >native.out 2>native.err
          test "$(sha256sum reference.out | cut -d' ' -f1)" = "$(sha256sum native.out | cut -d' ' -f1)"
          test "$(sha256sum reference.err | cut -d' ' -f1)" = "$(sha256sum native.err | cut -d' ' -f1)"
          # Program success requires native field write/read to preserve 131.
          echo 'EDG_NATIVE_AGGREGATE gate=240_bytes_align8_nested_union_execution result=pass'

      - name: Execute source C++17 240 and 224 byte nested POD aggregate with G++ oracle
        working-directory: edgcpp/build/gcc-release
        env:
          EDGCPP_SOURCE_DIR: ${{ github.workspace }}/edgcpp
          EDGCPP_COMPILE_COMMANDS: ${{ github.workspace }}/edgcpp/build/gcc-release/compile_commands.json
          EDGCPP_LIB_DIR: ${{ github.workspace }}/edgcpp/build/gcc-release/lib
          EDGCPP_EDG_REVISION: ${{ env.EDG_SOURCE_SHA }}
        run: |
          set -euo pipefail
          export PATH="$HOME/.cargo/bin:$PATH"
          source ./environment.sh
          work="${RUNNER_TEMP}/edg-cxx5-nested-aggregate"
          mkdir -p "$work"
          cp "${GITHUB_WORKSPACE}/compiler/tools/edg-driver/tests/fixtures/edg_native_cxx5_nested_aggregate_240.cpp" "$work/fixture.cpp"
          cd "$work"
          g++ -std=c++17 -O0 -Wall -Wextra -Werror fixture.cpp -o reference
          timeout 15s ./reference >reference.out 2>reference.err
          rm -f native.o
          version="$(g++ -dumpfullversion -dumpversion)"
          IFS=. read -r major minor patch <<<"$version"
          gnu_number=$((10#${major}*10000+10#${minor:-0}*100+10#${patch:-0}))
          edg_flags=(--g++ --c++17 --no_strict_gnu --gnu_version "$gnu_number")
          "${GITHUB_WORKSPACE}/compiler/tools/edg-driver/target/debug/compiler-edg-driver" \
            native.o --typeid-native "${edg_flags[@]}" fixture.cpp >compile.log 2>&1 || {
              tail -n 35 compile.log >&2
              test ! -e native.o
              exit 1
            }
          test "$(od -An -tx1 -N4 native.o | tr -d '[:space:]')" = 7f454c46
          g++ native.o -o native
          timeout 15s ./native >native.out 2>native.err
          test "$(sha256sum reference.out | cut -d' ' -f1)" = "$(sha256sum native.out | cut -d' ' -f1)"
          test "$(sha256sum reference.err | cut -d' ' -f1)" = "$(sha256sum native.err | cut -d' ' -f1)"
          echo 'EDG_CXX5_NATIVE gate=nested_240_224_POD_execution result=pass'

      - name: Execute real native EDG C++2 lifetime and compare independent G++ trace
        working-directory: edgcpp/build/gcc-release
        env:
          CXX2_ARTIFACTS: ${{ runner.temp }}/edg-cxx2-lifetime-probe
          EDGCPP_SOURCE_DIR: ${{ github.workspace }}/edgcpp
          EDGCPP_COMPILE_COMMANDS: ${{ github.workspace }}/edgcpp/build/gcc-release/compile_commands.json
          EDGCPP_LIB_DIR: ${{ github.workspace }}/edgcpp/build/gcc-release/lib
          EDGCPP_EDG_REVISION: ${{ env.EDG_SOURCE_SHA }}
        run: |
          set -euo pipefail
          export PATH="$HOME/.cargo/bin:$PATH"
          source ./environment.sh
          fixtures="${GITHUB_WORKSPACE}/compiler/tools/edg-driver/tests/fixtures"
          compiler="${GITHUB_WORKSPACE}/compiler/tools/edg-driver/target/debug/compiler-edg-driver"
          mkdir -p "$CXX2_ARTIFACTS"
          cp "$fixtures"/edg_native_cxx2_lifetime_*.cpp "$CXX2_ARTIFACTS/"
          cd "$CXX2_ARTIFACTS"
          git -C "$GITHUB_WORKSPACE/compiler" rev-parse HEAD | tee -a "$GITHUB_STEP_SUMMARY"
          g++ -std=c++17 -O2 -Wall -Wextra -Werror -c edg_native_cxx2_lifetime_caller.cpp -o caller-gxx.o
          g++ -std=c++17 -O2 -Wall -Wextra -Werror -c edg_native_cxx2_lifetime_gxx.cpp -o methods-gxx.o
          g++ -std=c++17 -O2 -Wall -Wextra -Werror -c edg_native_cxx2_lifetime_driver.cpp -o driver-gxx.o
          g++ caller-gxx.o methods-gxx.o driver-gxx.o -o reference
          timeout 15s ./reference | tee reference.out
          cargo run --quiet --manifest-path "${GITHUB_WORKSPACE}/edg-rust/Cargo.toml" --example parse -- edg_native_cxx2_lifetime_caller.cpp >probe.log 2>&1 || { cat probe.log; exit 1; }
          python3 "${GITHUB_WORKSPACE}/compiler/tools/edg-driver/tests/cxx2_lifetime_audit.py" probe.log | tee audit.log
          # Some EDG lowering configurations consume the lifetime lists and
          # expose cleanup solely as generated executable statement calls.
          # Capture empty region lists explicitly; never infer destruction
          # ordering from an absent region or from source spelling.
          grep -E '^(object lifetime|scope lifetime|init lifetime|lifetime destruction)' probe.log >lifetime-regions.log || true
          grep -F 'routine attributes' probe.log >routine-notes.log
          rm -f native-caller.o
          "$compiler" native-caller.o --typeid-native edg_native_cxx2_lifetime_caller.cpp >native-compile.log 2>&1 || {
            echo "EDG_CXX2_NATIVE native compile failed; diagnostics:" >&2
            cat native-compile.log >&2
            exit 1
          }
          test "$(od -An -tx1 -N4 native-caller.o | tr -d '[:space:]')" = 7f454c46
          nm -u native-caller.o | c++filt | grep -Fq 'Marker::Marker(int)'
          nm -u native-caller.o | c++filt | grep -Fq 'Marker::~Marker()'
          g++ native-caller.o methods-gxx.o driver-gxx.o -o native
          timeout 15s ./native | tee native.out
          test "$(sha256sum reference.out | cut -d' ' -f1)" = "$(sha256sum native.out | cut -d' ' -f1)"
          echo "EDG_CXX2_NATIVE gate=unmodified_source_gxx_cross_object_runtime result=pass"
          echo "EDG_CXX2_NATIVE gate=all_five_inputs_and_dtor_order result=pass"
          checked_negatives=0
          for file in "$fixtures"/edg_native_cxx2_bad_*.cpp; do
            cp "$file" .
            name="$(basename "$file")"
            g++ -std=c++17 -Wall -Wextra -Werror -fsyntax-only "$name"
            rm -f negative.o
            if "$compiler" negative.o --typeid-native "$name" >negative.log 2>&1; then
              echo "unsafe C++2 source was incorrectly accepted: $name" >&2
              cat negative.log >&2
              exit 1
            fi
            if test -e negative.o; then
              echo "unsafe C++2 source emitted a partial object: $name" >&2
              exit 1
            fi
            checked_negatives=$((checked_negatives+1))
            echo "EDG_CXX2_NATIVE gate=fail_closed fixture=$name result=pass"
          done
          test "$checked_negatives" = 6
          echo "EDG_CXX2_NATIVE gate=all_six_unsupported_shapes_rejected result=pass"

      - name: Execute native C++17 bare and iosfwd control programs against G++
        working-directory: edgcpp/build/gcc-release
        env:
          # Diagnostic-only C++ source ownership evidence from the matched
          # EDG bridge. This does not authorize a local or emit any ELF.
          EDGCPP_DIAG_SOURCE_LOCALS: "1"
          CXX5_ARTIFACTS: ${{ runner.temp }}/edg-cxx5-basic-controls
          EDGCPP_SOURCE_DIR: ${{ github.workspace }}/edgcpp
          EDGCPP_COMPILE_COMMANDS: ${{ github.workspace }}/edgcpp/build/gcc-release/compile_commands.json
          EDGCPP_LIB_DIR: ${{ github.workspace }}/edgcpp/build/gcc-release/lib
          EDGCPP_EDG_REVISION: ${{ env.EDG_SOURCE_SHA }}
        run: |
          set -euo pipefail
          export PATH="$HOME/.cargo/bin:$PATH"
          source ./environment.sh
          compiler="${GITHUB_WORKSPACE}/compiler/tools/edg-driver/target/debug/compiler-edg-driver"
          fixtures="${GITHUB_WORKSPACE}/compiler/tools/edg-driver/tests/fixtures"
          mkdir -p "$CXX5_ARTIFACTS"
          cd "$CXX5_ARTIFACTS"
          g++ -std=c++17 -v -E -x c++ /dev/null >include-search.log 2>&1
          mapfile -t include_dirs < <(awk '
            /#include <\.\.\.> search starts here:/{active=1;next}
            /^End of search list/{active=0}
            active && /^ /{sub(/^[[:space:]]+/,"");print}
          ' include-search.log)
          test "${#include_dirs[@]}" -ge 3
          include_flags=()
          for dir in "${include_dirs[@]}"; do
            test -d "$dir"
            include_flags+=("-I$dir")
          done
          version="$(g++ -dumpfullversion -dumpversion)"
          IFS=. read -r major minor patch <<<"$version"
          gnu_number=$((10#${major}*10000+10#${minor:-0}*100+10#${patch:-0}))
          edg_flags=(--g++ --c++17 --no_strict_gnu --gnu_version "$gnu_number")
          cp "$fixtures/edg_native_cxx5_header_roots.h" .
          for unit in edg_native_cxx5_bare_main edg_native_cxx5_iosfwd_unused edg_native_cxx5_header_roots edg_native_cxx5_header_unused edg_native_cxx5_static_member; do
            cp "$fixtures/$unit.cpp" "$unit.cpp"
            g++ -std=c++17 -Wall -Wextra -Werror "$unit.cpp" -o "$unit-reference"
            timeout 15s "./$unit-reference" >"$unit-reference.out" 2>"$unit-reference.err"
            rm -f "$unit.o"
            "$compiler" "$unit.o" --typeid-native "${edg_flags[@]}" "${include_flags[@]}" "$unit.cpp" >"$unit-native-compile.log" 2>&1 || {
              tail -n 25 "$unit-native-compile.log" >&2
              test ! -e "$unit.o"
              exit 1
            }
            test "$(od -An -tx1 -N4 "$unit.o" | tr -d '[:space:]')" = 7f454c46
            g++ "$unit.o" -o "$unit-native"
            timeout 15s "./$unit-native" >"$unit-native.out" 2>"$unit-native.err"
            test "$(sha256sum "$unit-reference.out" | cut -d' ' -f1)" = "$(sha256sum "$unit-native.out" | cut -d' ' -f1)"
            test "$(sha256sum "$unit-reference.err" | cut -d' ' -f1)" = "$(sha256sum "$unit-native.err" | cut -d' ' -f1)"
            echo "EDG_CXX5_NATIVE gate=gxx_executable_parity fixture=$unit result=pass"
          done
          cp "$fixtures/edg_native_cxx5_header_effectful.cpp" global-effect.cpp
          g++ -std=c++17 -Wall -Wextra -Werror -fsyntax-only global-effect.cpp
          rm -f global-effect.o
          if "$compiler" global-effect.o --typeid-native --dump-edg-global-provenance "${edg_flags[@]}" "${include_flags[@]}" global-effect.cpp >global-effect.log 2>&1; then
            echo "EDG_CXX5_NATIVE unsafe acceptance of file-scope C++ constructor" >&2
            exit 1
          fi
          test ! -e global-effect.o
          if ! grep -Fq 'EDG C++2 scalar candidate lacks one source-proven constructor and destructor' global-effect.log &&
             ! grep -Fq 'native adapter has no checked global memory semantics yet' global-effect.log; then
            tail -n 20 global-effect.log >&2
            exit 1
          fi
          grep -Fq 'EDG_FILE_SCOPE_SCHEDULER available=false' global-effect.log
          grep -Fq 'EDG_SCOPE_DYNAMIC_INITS entries=1' global-effect.log
          grep -Fq 'variable=Some("global_effect") destructor=Some("Effectful::~Effectful()") kind=0' global-effect.log
          # Flag is owned by EDG; generated __sti__ spelling is diagnostic only.
          grep -F 'EDG_GENERATED_ROUTINE' global-effect.log | head -n 25
          grep -Eq 'EDG_GENERATED_ROUTINE id=[0-9]+ name=Some\("__sti__[^"]+"\)' global-effect.log
          grep -F 'EDG_STARTUP_BODY' global-effect.log | head -n 15
          grep -E 'EDG_CXX5_SOURCE_CLOSURE startup_id=[0-9]+ retained=true' global-effect.log
          grep -E 'STARTUP_CALLSITE|STARTUP_REF' global-effect.log | head -n 60 || true
          echo "EDG_CXX5_NATIVE gate=generated_startup_provenance result=pass"
          echo "EDG_CXX5_NATIVE gate=global_scope_destructor_provenance result=pass"
          echo "EDG_CXX5_NATIVE gate=global_constructor_fail_closed result=pass"
          # #837 original GNU libstdc++ Hello World oracle and no-endl control.
          cp "$fixtures/edg_native_cxx5_iostream.cpp" hello-world.cpp
          cat >hello-no-endl.cpp <<'CPP'
          #include <iostream>
          int main() { std::cout << "Hello, world!"; }
          CPP
          for variant in hello-world hello-no-endl; do
            # Source-only nested record diagnostic remains bounded and does
            # not authorize class ABI or weaken the expected fail-closed gate.
            g++ -std=c++17 -Wall -Wextra -Werror "$variant.cpp" -o "$variant-reference"
            timeout 15s "./$variant-reference" >"$variant-reference.out" 2>"$variant-reference.err"
            test ! -s "$variant-reference.err"
            if test "$variant" = hello-world; then
              test "$(printf 'Hello, world!\n' | sha256sum | cut -d' ' -f1)" = "$(sha256sum "$variant-reference.out" | cut -d' ' -f1)"
            else
              test "$(printf 'Hello, world!' | sha256sum | cut -d' ' -f1)" = "$(sha256sum "$variant-reference.out" | cut -d' ' -f1)"
            fi
            rm -f "$variant.o"
            if timeout 90s "$compiler" "$variant.o" --typeid-native --dump-edg-global-provenance "${edg_flags[@]}" "${include_flags[@]}" "$variant.cpp" >"$variant-native-compile.log" 2>&1; then
              test -s "$variant.o"
              test "$(od -An -tx1 -N4 "$variant.o" | tr -d '[:space:]')" = 7f454c46
              g++ "$variant.o" -o "$variant-native"
              timeout 15s "./$variant-native" >"$variant-native.out" 2>"$variant-native.err"
              test "$(sha256sum "$variant-reference.out" | cut -d' ' -f1)" = "$(sha256sum "$variant-native.out" | cut -d' ' -f1)"
              test "$(sha256sum "$variant-reference.err" | cut -d' ' -f1)" = "$(sha256sum "$variant-native.err" | cut -d' ' -f1)"
              echo "EDG_CXX5_NATIVE gate=iostream_executable fixture=$variant result=pass"
            else
              status=$?
              test ! -e "$variant.o"
              test "$status" -ne 124
              tail -n 8 "$variant-native-compile.log"
              grep -F 'EDG_CXX5_SOURCE_CLOSURE startup_id=' "$variant-native-compile.log" | head -n 20 || true
              if test "$variant" = hello-world; then
                grep -Fq 'EDG_CXX5_WIDEN_ABI routine=' "$variant-native-compile.log"
                grep -Fq 'EDG_CXX5_WIDEN_ATTR defined=true' "$variant-native-compile.log"
                grep -Fq 'EDG_CXX5_WIDEN_LINK name="_ZNKSt5ctypeIcE5widenEc" mangled=true' "$variant-native-compile.log"
                grep -Eq 'EDG_CXX5_WIDEN_BODY statements=[1-9][0-9]* expressions=[1-9][0-9]* calls=[0-9]+' "$variant-native-compile.log"
                grep -Fq 'EDG_CXX5_WIDEN_TARGET statement=0.block.1 path=0 form=DirectRoutine' "$variant-native-compile.log"
                grep -Fq 'EDG_CXX5_WIDEN_TARGET statement=0.block.2 path=0 form=IndirectUnresolved' "$variant-native-compile.log"
                grep -Fq 'EDG_CXX5_WIDEN_DISPATCH statement=0.block.2 path=0 class=OrdinaryOrLowered' "$variant-native-compile.log"
                grep -F 'EDG_CXX5_WIDEN_DISPATCH statement=0.block.2' "$variant-native-compile.log" | grep -Fq 'source_virtual=false virtual_abi_proven=false'
                grep -F 'EDG_CXX5_WIDEN_DISPATCH ' "$variant-native-compile.log" | head -n 8
                grep -F 'EDG_CXX5_WIDEN_TARGET ' "$variant-native-compile.log" | head -n 8
                grep -Fq 'EDG_CXX5_WIDEN_EXPR statement=' "$variant-native-compile.log"
                grep -Fq 'field_proof=' "$variant-native-compile.log"
                grep -F 'reference=Some("_M_widen_ok")' "$variant-native-compile.log" | grep -Fq 'byte_offset: 56, bytes: 1'
                grep -F 'reference=Some("_M_widen")' "$variant-native-compile.log" | grep -Fq 'byte_offset: 57, bytes: 256'
                grep -F 'reference=Some("__vptr")' "$variant-native-compile.log" | grep -Fq 'field_proof=Some(Ok('
                grep -F 'EDG_CXX5_WIDEN_CALL ' "$variant-native-compile.log" | grep -Fq 'callee_id=None callee=None'
                grep -F 'EDG_CXX5_WIDEN_BODY ' "$variant-native-compile.log"
                grep -Fq 'position=0 virtual=false offsets=[Some(0)]' "$variant-native-compile.log"
                grep -F 'EDG_CXX5_WIDEN_' "$variant-native-compile.log" | head -n 72
                # Source-owned class-valued field descriptor inside the
                # original ctype<char>::widen virtual callee. This is
                # not a new class allocation and still grants no virtual
                # address point, receiver adjustment or executable ABI.
                grep -F 'EDG_CXX5_RECORD_EXPR function=std::ctype<char>::widen' "$variant-native-compile.log" |
                  grep -Fq 'ty=145 kind=4 operator=None symbol=Some("__b_NSt6locale5facetE") source_imported_lvalue=false source_field_descriptor=true abi_executable_proven=false'
              fi
              if test "$variant" = hello-no-endl; then
                grep -Fq 'EDG_CXX5_MAIN_CALL stmt=' "$variant-native-compile.log"
                grep -F 'EDG_CXX5_MAIN_CALL stmt=' "$variant-native-compile.log" | sed -n '1,20p'
                grep -F 'EDG_CXX5_CALL_EXPR path=' "$variant-native-compile.log" | sed -n '1,45p'
              fi
              echo "EDG_CXX5_NATIVE fixture=$variant status=$status" | tee -a "$GITHUB_STEP_SUMMARY"
              # Report the exact source-owned first rejected member without
              # relying on changing per-TU SymbolId allocation numbers.
              rejected_member="$(sed -nE 's/.*C\+\+ member SymbolId\(([0-9]+)\) source admission:.*/\1/p' "$variant-native-compile.log" | head -n 1)"
              if test -n "$rejected_member"; then
                grep -F "ROUTINE_ID RoutineIdentity { routine: SymbolId($rejected_member)," "$variant-native-compile.log" | head -n 1 | tee -a "$GITHUB_STEP_SUMMARY" || true
              fi
              grep -E "^Error:|EDG -> compiler-ir rejected" "$variant-native-compile.log" | tail -n 1 | tee -a "$GITHUB_STEP_SUMMARY" || true
              # This candidate correctly advances past the previous
              # inherited-class witness and now reaches a genuinely
              # materialized nontrivial record. Require this exact next
              # fail-closed boundary, not an arbitrary compiler error.
              grep -Fq 'EDG -> compiler-ir rejected source: C++ local record has user/nontrivial member or lifetime semantics' "$variant-native-compile.log"
              # A source-specific conservative class-storage witness is
              # mandatory, not merely an anonymous nontrivial record error.
              grep -F 'C++ local record has user/nontrivial member or lifetime semantics' "$variant-native-compile.log" |
                grep -Eq 'record=TypeId\([0-9]+\) conservative_roots=[1-9][0-9]* origins=\['
              # The 240-byte three-field class is *still* unadmitted,
              # but every source-owned field and scope/local origin must
              # be present for the next bounded implementation step.
              grep -F 'C++ local record has user/nontrivial member or lifetime semantics' "$variant-native-compile.log" |
                grep -Fq 'native_layout=Some((240, 8)) record_shape=Some((3, 0))'
              grep -F 'C++ local record has user/nontrivial member or lifetime semantics' "$variant-native-compile.log" |
                grep -Fq 'native_field_evidence=[position=0'
              grep -F 'C++ local record has user/nontrivial member or lifetime semantics' "$variant-native-compile.log" |
                grep -Fq 'statement_decls='
              if test "$variant" = hello-no-endl; then
                grep -F 'EDG_CXX5_CALL_GLOBAL path=' "$variant-native-compile.log" | grep -Fq 'name=Some("std::cout") source_link_proof=Ok("_ZSt4cout")'
              fi
              grep -F 'EDG_CXX5_RECORD_EXPR function=' "$variant-native-compile.log" | head -n 65 || true
              grep -Fq 'EDG_NATIVE_SCOPE_OWNER function=std::char_traits<char>::length ' "$variant-native-compile.log"
              grep -Fq 'EDG_NATIVE_SCOPE_OWNER function=std::operator' "$variant-native-compile.log"
              grep -F 'EDG_NATIVE_SCOPE_OWNER ' "$variant-native-compile.log" |
                grep -Fq 'class_bytes=240'
              # The exact native owner remains local, but native list membership,
              # initializer kind, and type declaration origin are only diagnostics.
              # Do not let this evidence authorize class storage or a partial ELF.
              for origin in 'std::char_traits<char>::length ' 'std::operator'; do
                grep -F "EDG_NATIVE_SCOPE_OWNER function=$origin" "$variant-native-compile.log" |
                  grep -Eq 'type_position_present=[01] source_list=[01] init_kind=[0-9]+ explicit_init=[01] type_name=__C8 '
                grep -F "EDG_NATIVE_SCOPE_OWNER function=$origin" "$variant-native-compile.log" |
                  grep -Eq 'class_tag_present=[01] class_tag_kind=[0-9]+ class_supplement=[01] class_template=[01] class_incomplete=[01] extra_info_present=[01] supp_scope=[01] supp_routines=[01] supp_variables=[01] supp_bases=[01] supp_field_init=[01] supp_assoc_template=[01] supp_generated=[01] tagless_storage_only=[01] local_used=[01] address_taken=[01] variable_nonreal=[01] prototype_instance=[01] diagnostic_only=true'
              done
              # Preserve the exact native class-supplement provenance
              # independently of whether the next source admission passes.
              grep -F 'EDG_NATIVE_SCOPE_OWNER ' "$variant-native-compile.log" |
                grep -F 'class_bytes=240' | head -n 4 | tee -a "$GITHUB_STEP_SUMMARY"
              grep -F 'EDG_NATIVE_SCOPE_OWNER ' "$variant-native-compile.log" | head -n 20 | tee -a "$GITHUB_STEP_SUMMARY"
              grep -F 'C++ local record has user/nontrivial member or lifetime semantics' "$variant-native-compile.log" | tail -n 1 | tee -a "$GITHUB_STEP_SUMMARY"
              echo "EDG_CXX5_NATIVE gate=iostream_fail_closed fixture=$variant result=pass"
            fi
          done

      - name: Preserve native C++17 minimal-header reference/ELF evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: edg-cxx5-basic-executables
          path: ${{ runner.temp }}/edg-cxx5-basic-controls/
          if-no-files-found: ignore

      - name: Preserve EDG lifetime graph and independent G++ execution evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: edg-cxx2-native-executable
          path: ${{ runner.temp }}/edg-cxx2-lifetime-probe/
          if-no-files-found: ignore
