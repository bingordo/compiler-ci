name: CI M49 scalar origin legalization
on:
  pull_request:
    paths: ['.github/workflows/m49-scalar-origin-2543.yml']
permissions:
  contents: read
jobs:
  provenance:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: b24113c5a7afbb74f83077151257fce8a3783cec
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Resolve compiler Git dependencies
        run: git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
      - name: Verify pinned scalar provenance, backend library and strict Clippy
        working-directory: compiler
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "b24113c5a7afbb74f83077151257fce8a3783cec"
          cargo test -p compiler-backend --lib checked_scalar_origin_tests
          cargo test -p compiler-backend --lib
          cargo clippy -p compiler-backend --all-targets -- -D warnings
