name: X7 IP17 measured CPU physical DAG candidate costs (no timing)
on:
  pull_request:
    paths:
      - '.github/workflows/x7-ip17-measured-cpu-20261125.yml'
permissions:
  contents: read
jobs:
  exact-cpu-source-physical:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 6da92f977693531618040f6da5c3659d079eeed9
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Confirm exact compiler and toolchain
        run: |
          set -euo pipefail
          test "$(git -C compiler rev-parse HEAD)" = 6da92f977693531618040f6da5c3659d079eeed9
          rustc --version
          git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
          git config --global --add url."https://github.com/".insteadOf "git@github.com:"
      - name: Validate existing SKL and ZEN4 reviewed exact form measurements
        working-directory: compiler
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tools -p 'test_x7_cost_sequence_evidence.py' -v
          python3 -m unittest discover -s tools -p 'test_x86_cost_source_gate.py' -v
      - name: All IP14 proven rules physical SKL and Zen4 measured-cost receipt and negative tests
        working-directory: compiler
        run: |
          set -euo pipefail
          cargo test -p compiler-backend-x86 --lib --features x7-ip14-auto-dag-probe ip17_exact_cpu_measured_costs_report_full_physical_rule_and_unknowns -- --nocapture 2>&1 | tee /tmp/x7-ip17-rules.log
          grep 'X7_IP17_CPU_SUMMARY' /tmp/x7-ip17-rules.log | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Actual checked Mini-C high-pressure CPU cost and unknown census
        working-directory: compiler
        run: |
          set -euo pipefail
          cargo test -p compiler --bin compiler --features 'x7-ip7-workload-profile x7-ip16-pressure-cfg' ip16_auto_source_pressure_sweep_measures_real_spills_and_winners -- --nocapture 2>&1 | tee /tmp/x7-ip17-source.log
          grep 'X7_IP16_SUMMARY tag=pressure' /tmp/x7-ip17-source.log | tee -a "$GITHUB_STEP_SUMMARY"
          grep 'X7_IP17_SOURCE_CPU_SUMMARY tag=pressure' /tmp/x7-ip17-source.log | tee -a "$GITHUB_STEP_SUMMARY"
      - name: CFG call loop and shared-use measured CPU cost safeguards
        working-directory: compiler
        run: |
          set -euo pipefail
          cargo test -p compiler --bin compiler --features 'x7-ip7-workload-profile x7-ip16-pressure-cfg' ip16_branches_loops_calls_and_shared_uses_fail_closed_if_unmeasured -- --nocapture 2>&1 | tee /tmp/x7-ip17-cfg.log
          grep 'X7_IP16_CONTROL_SUMMARY' /tmp/x7-ip17-cfg.log | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Compile default, production-logic and driver with no CPU profiling
        working-directory: compiler
        run: |
          set -euo pipefail
          cargo check -p compiler-backend-x86
          cargo check -p compiler-backend-x86 --features x7-production-generated-logic
          cargo check -p compiler --bin compiler
