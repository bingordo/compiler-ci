name: ASM1-D2 interior data labels acceptance
on:
  push:
    branches: [ci/asm1-d2-mid-labels]
    paths: ['.github/workflows/asm1-d2-mid-labels.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  x86-mid-labels:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: f82c280b0316603f9521da40a50dd4b980d64587
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Check compiler source SHA
        run: test "$(git rev-parse HEAD)" = "f82c280b0316603f9521da40a50dd4b980d64587"
      - name: Core workspace
        run: |
          cat > Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir", "crates/opt", "crates/backend", "crates/backend-x86"]
          EOF
          rm -f Cargo.lock
      - uses: Swatinem/rust-cache@v2
        with:
          key: asm1-d2-mid-labels
      - name: Verify interior aliases and original assembler regression
        run: |
          set -euo pipefail
          python3 tools/regen_x86_att_forms.py --check
          python3 -m unittest discover -s tools -p test_regen_x86_att_forms.py -v
          cargo check -p compiler-backend-x86 --all-targets
          cargo test -p compiler-backend-x86 --test att_mid_labels -- --nocapture
          cargo test -p compiler-backend-x86 --test att_aliases
          cargo test -p compiler-backend-x86 --test att_module
          cargo test -p compiler-backend-x86 --test att_module_strings
          cargo test -p compiler-backend-x86 --test att_asm
          cargo test -p compiler-backend-x86 --lib
          cargo test -p compiler-backend --lib
          cargo clippy -p compiler-backend-x86 --lib --test att_mid_labels --test att_aliases --test att_module -- -D warnings -A unused_variables -A clippy::suspicious_assignment_formatting
          echo 'ASM1_D2_INTERIOR_LABELS status=PASS' >> "$GITHUB_STEP_SUMMARY"
