# One-off exact compiler source gate. Close PR unmerged after validation.
name: IR PR3701 historical optimizer profiler retirement
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/ir-pr3701-retired-optimizer-profile.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ir-pr3701-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native-profiler:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      COMPILER_SHA: 0b6793696906ca213da88a683d5a9a96d3055043
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: ${{ env.COMPILER_SHA }}
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Check exact source and isolate optimizer workspace
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C compiler rev-parse HEAD)" = "$COMPILER_SHA"
          echo "Verified compiler candidate: $COMPILER_SHA" >> "$GITHUB_STEP_SUMMARY"
          cat > compiler/Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir", "crates/opt"]
          EOF
          rm -f compiler/Cargo.lock
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: ir-pr3701-opt-profile
      - name: Full optimizer library, native profile and target compile
        working-directory: compiler
        shell: bash
        run: |
          set -euo pipefail
          cargo test -p compiler-opt --lib
          cargo test -p compiler-opt --test typed_pass_manager
          cargo test -p compiler-opt --test typed_core_pipeline
          cargo test -p compiler-opt --test global_memory_profile --no-run
          cargo test -p compiler-opt --test mem2reg_profile --no-run
          cargo check -p compiler-opt --all-targets
      - name: Strict IR and optimizer lib Clippy
        working-directory: compiler
        shell: bash
        run: |
          set -euo pipefail
          cargo clippy -p compiler-ir --lib -- -D warnings
          cargo clippy -p compiler-opt --lib -- -D warnings -A dead_code -A clippy::too_many_arguments
