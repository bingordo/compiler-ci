name: Verify x86 semantics prototype

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/verify-x86-semantics.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Checkout compiler feature branch
        uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: feature/x86-cost-inventory
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
          sparse-checkout: |
            tools/x86_semantics.py
            tools/test_x86_semantics.py
      - name: Install Z3
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends z3
      - name: Run concrete and SMT tests
        run: |
          set -euo pipefail
          z3 --version
          python3 -m unittest discover -s compiler/tools -p 'test_x86_semantics.py' -v
