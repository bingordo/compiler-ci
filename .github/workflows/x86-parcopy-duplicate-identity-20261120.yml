name: x86 PHI copy identity-duplicate admission source-pinned
on:
  pull_request:
    paths:
      - '.github/workflows/x86-parcopy-duplicate-identity-20261120.yml'
  workflow_dispatch:
permissions:
  contents: read
# Temporary external acceptance; this workflow must run on pull_request.
jobs:
  x86-scheduler-and-clippy:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: e983977af07b28d63a9e15794650a51aabc4912a
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Pin and configure source
        run: |
          set -euo pipefail
          test "$(git -C compiler rev-parse HEAD)" = "e983977af07b28d63a9e15794650a51aabc4912a"
          git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: x86-parcopy-20261120
      - name: New matrix and all physical x86 backend tests
        working-directory: compiler
        run: |
          set -euo pipefail
          cargo test -p compiler-backend-x86 --lib parallel_copy::tests -- --nocapture
          cargo test -p compiler-backend-x86 --lib
      - name: Scoped Clippy (only known unrelated generated warnings exempted)
        working-directory: compiler
        run: |
          set -euo pipefail
          cargo clippy -p compiler-backend-x86 --lib -- -D warnings -A unused-variables -A clippy::empty_line_after_doc_comments
  native-gas-elf-gcc:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: e983977af07b28d63a9e15794650a51aabc4912a
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Exact source pin and public dependency transport
        run: |
          set -euo pipefail
          test "$(git -C compiler rev-parse HEAD)" = "e983977af07b28d63a9e15794650a51aabc4912a"
          git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: x86-parcopy-native-20261120
      - name: Native TypeId x86 differential production integrations
        working-directory: compiler
        run: |
          set -euo pipefail
          cargo test -p compiler --test x86_inline_source_ablation -- --nocapture
          cargo test -p compiler --test x7_s4_rolling_checksum_source -- --nocapture
