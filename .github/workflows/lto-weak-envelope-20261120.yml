name: LTO weak v5-v6 metadata source pinned
on:
  push:
    branches: [ci/lto-weak-envelope-20261120]
    paths: ['.github/workflows/lto-weak-envelope-20261120.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  weak-lto:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      SOURCE_SHA: 07321a44ba066966e1a1fff66db1fab6361cc9c0
      CARGO_INCREMENTAL: '0'
      CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 07321a44ba066966e1a1fff66db1fab6361cc9c0
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Confirm exact compiler source and public frontend fetch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C compiler rev-parse HEAD)" = "$SOURCE_SHA"
          git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: lto-weak-v5-v6
      - name: Validate IR LTO versions and negative metadata
        working-directory: compiler
        run: |
          cargo test -p compiler-ir --test lto_target_envelope -- --nocapture
          cargo test -p compiler-ir --test lto_envelope_merge
          cargo test -p compiler-ir --test native_binary_v1
      - name: Strict affected IR library and tests Clippy
        working-directory: compiler
        run: cargo clippy -p compiler-ir --lib --test lto_target_envelope -- -D warnings
      - name: Compile optimizer and driver tests with explicit CTFE policy
        working-directory: compiler
        run: |
          cargo check -p compiler-opt --tests
          cargo check -p compiler --tests
      - name: Production Mini-C source LTO and ELF weak native override
        working-directory: compiler
        run: |
          cargo test -p compiler --test lto_elf_visibility -- --nocapture
          cargo test -p compiler --test lto_source_sidecar -- --nocapture
          cargo test -p compiler --test lto_coemit -- --nocapture
      - name: Mixed linker regression with bound weak metadata
        working-directory: compiler
        run: cargo test -p compiler --test lto_mixed_link -- --nocapture
