name: Temporary Mini-C C99 unary 291
on:
  pull_request:
    paths: ['.github/workflows/temp-mini-c-c99-unary-291.yml']
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/mini-c
          ref: 4a2de0bdcb877b388e75592b68c70ef9211f0e1d
          persist-credentials: false
      - run: git rev-parse HEAD
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/debug
          key: mini-c-native-ubuntu-unary-291
          restore-keys: |
            mini-c-native-
      - run: cargo test -p mini-c-sema c99_
      - run: cargo test -p mini-c-syntax -p mini-c-sema -p mini-c-cranelift
      - run: cargo clippy -p mini-c-sema --all-targets -- -D warnings
      - name: GCC differential runtime
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/unary.c" <<'EOF'
          int a[3];
          int count;
          int g(void) { return 7; }
          void *next(void) { ++count; return a; }
          int main(void) {
              int *p=0;
              if (!a || !g || !(!p)) return 1;
              if (&*(void*)0 != (void*)0) return 2;
              if (&*next() != (void*)a || count != 1) return 3;
              if (&*g != g) return 4;
              if (!0.0 != 1 || !(-0.0) != 1 || !2.0 != 0) return 5;
              return 0;
          }
          EOF
          gcc -std=c99 -pedantic-errors "$RUNNER_TEMP/unary.c" -o "$RUNNER_TEMP/gcc-unary"
          "$RUNNER_TEMP/gcc-unary"
          cargo run -q -p mini-c-cranelift -- --cpp=none --emit-obj "$RUNNER_TEMP/unary.o" "$RUNNER_TEMP/unary.c"
          gcc "$RUNNER_TEMP/unary.o" -o "$RUNNER_TEMP/mini-unary"
          "$RUNNER_TEMP/mini-unary"
