name: Shared generated TypeId verifier on all optimizer compact fixtures
on:
  push:
    branches: [verify/opt-shared-verifier-matrix-20261118]
    paths: ['.github/workflows/opt-shared-verifier-matrix-20261118.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: db71caac0b56ba6b738c2e2479c99a0eba41848f
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Verify exact source SHA
        run: test "$(git -C compiler rev-parse HEAD)" = "db71caac0b56ba6b738c2e2479c99a0eba41848f"
      - name: Isolate native optimizer workspace
        run: |
          cat > compiler/Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir", "crates/backend", "crates/backend-aarch64", "crates/backend-x86", "crates/opt"]
          EOF
          rm -f compiler/Cargo.lock
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: shared-opt-fixture-verifier-20261118
      - name: Generated native/legacy verifier acceptance on optimizer fixtures
        working-directory: compiler
        run: cargo test -p compiler-opt --test native_verifier_fixture_matrix -- --nocapture
      - name: Original optimizer fixture ABI/canonical and binary codec inventory
        working-directory: compiler
        run: cargo test -p compiler-opt --test native_v3_fixture_inventory
      - name: Original IR shared test remains green
        working-directory: compiler
        run: cargo test -p compiler-ir --test native_verifier_fixture_matrix
      - name: Strict Clippy
        working-directory: compiler
        run: cargo clippy -p compiler-opt --no-deps --test native_verifier_fixture_matrix --test native_v3_fixture_inventory -- -D warnings
