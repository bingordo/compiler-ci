name: BT3b AArch64 TypeId recursive and alias ABI parity
on:
  push:
    branches:
      - ci/bt3b-aarch64-recursive-20261114
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-aarch64-abi:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      CARGO_INCREMENTAL: '0'
    steps:
      - name: Checkout exact compiler source
        uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: d2157aa94cf53f969339ecf62e633829e331f6cd
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Verify pin and limit workspace to core crates
        run: |
          set -euo pipefail
          test "$(git -C compiler rev-parse HEAD)" = "d2157aa94cf53f969339ecf62e633829e331f6cd"
          cat > compiler/Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir", "crates/opt", "crates/backend", "crates/backend-x86", "crates/backend-aarch64"]
          EOF
          rm -f compiler/Cargo.lock
          echo "BT3 AArch64 exact source: d2157aa94cf53f969339ecf62e633829e331f6cd" >> "$GITHUB_STEP_SUMMARY"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: bt3b-recursive-aarch64-v1
      - name: Direct TypeId AArch64 object/GAS emission on host (no QEMU dependencies)
        working-directory: compiler
        run: cargo test -p compiler-backend-aarch64 --test typeid_abi_calls_native -- --nocapture
      - name: Install AArch64 cross C toolchain and user-mode emulator
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends gcc-aarch64-linux-gnu libc6-dev-arm64-cross qemu-user binutils-aarch64-linux-gnu
          command -v aarch64-linux-gnu-gcc
          command -v qemu-aarch64
      - name: Execute AArch64 object and GAS against 16-arg, mixed alias and recursive C11 oracles
        working-directory: compiler
        env:
          COMPILER_REQUIRE_AARCH64_QEMU: '1'
        run: cargo test -p compiler-backend-aarch64 --test typeid_abi_calls_native -- --nocapture
      - name: Preserve existing native target and old ABI test compilation
        working-directory: compiler
        run: |
          set -euo pipefail
          cargo test -p compiler-backend-aarch64 --lib
          cargo check --workspace --all-targets
          cargo clippy --workspace --all-targets -- -D warnings
