name: AArch64 M7 global data init native gate
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-aarch64-globals-init.yml'
permissions:
  contents: read
concurrency:
  group: aarch64-m7-globals-init
  cancel-in-progress: true
jobs:
  native:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - name: Checkout exact compiler candidate
        uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: fac0e6a6f802edd40cf554caafb2cc9a1e0d5515
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Pin and isolate self-contained backend workspace
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C compiler rev-parse HEAD)" = fac0e6a6f802edd40cf554caafb2cc9a1e0d5515
          cat > compiler/Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir", "crates/backend", "crates/backend-aarch64"]
          EOF
          rm -f compiler/Cargo.lock
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: m7-global-init-v1
      - name: Check AArch64 crate with warnings denied
        working-directory: compiler
        run: |
          RUSTFLAGS="-D warnings" cargo check -p compiler-backend-aarch64 --all-targets
          cargo clippy -p compiler-backend-aarch64 --lib -- -D warnings
      - name: Verify native backend tests and independent C oracle
        working-directory: compiler
        run: |
          cargo test -p compiler-backend -- --test-threads=1
          cargo test -p compiler-backend-aarch64 -- --test-threads=1
          echo 'PASS native AArch64 global objects, ADRP/ADD and ABS64 data relocs and init_array constructor; shared backend ELF regression' >> "$GITHUB_STEP_SUMMARY"
