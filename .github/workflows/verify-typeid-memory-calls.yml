name: Direct TypeId native memory/global/call GAS and ELF oracle
on:
  pull_request:
    paths:
      - '.github/workflows/verify-typeid-memory-calls.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  typeid-memory:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout exact compiler candidate
        uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: c5e4230722b0bea293a0b2ec9f9f3bb8d27ad71b
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Verify immutable compiler source
        working-directory: compiler
        run: test "$(git rev-parse HEAD)" = "c5e4230722b0bea293a0b2ec9f9f3bb8d27ad71b"
      - name: Isolate compiler core workspace
        working-directory: compiler
        run: |
          cat > Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir", "crates/opt", "crates/backend", "crates/backend-x86", "crates/backend-aarch64"]
          EOF
          rm -f Cargo.lock
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: typeid-memcall
      - name: Execute native TypeId C11 memory/global/call GAS and ELF oracle
        working-directory: compiler
        run: cargo test -p compiler-backend-x86 --test native_typeid_memory_calls -- --nocapture
      - name: Ensure original direct TypeId scalar C11 oracle parity
        working-directory: compiler
        run: cargo test -p compiler-backend-x86 --test native_typeid_direct -- --nocapture
      - name: Verify generic allocator and memory effects
        working-directory: compiler
        run: cargo test -p compiler-backend-x86 native_regalloc -- --nocapture
      - name: Full compiler IR optimizer backend and x86 regressions
        working-directory: compiler
        run: cargo test -p compiler-ir -p compiler-opt -p compiler-backend -p compiler-backend-x86
      - name: AArch64 shared backend compatibility
        working-directory: compiler
        run: cargo check -p compiler-backend-aarch64 --all-targets
      - name: Strict all-target compiler core Clippy
        working-directory: compiler
        run: cargo clippy -p compiler-ir -p compiler-opt -p compiler-backend -p compiler-backend-x86 --all-targets -- -D warnings
      - name: Strict AArch64 library Clippy
        working-directory: compiler
        run: cargo clippy -p compiler-backend-aarch64 --lib -- -D warnings
