name: X7 horizontal packed semantic expansion
on:
  pull_request:
    paths: ['.github/workflows/verify-x7-generic-isl-parser-bridge.yml']
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/verify-x7-generic-isl-parser-bridge.yml']
permissions:
  contents: read
jobs:
  parser-bridge:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 2a8bbfd87cf99a78d49923b80ac3885e35392c81
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Record exact source and standalone unit tests
        run: |
          set -euo pipefail
          git rev-parse HEAD
          python3 -m unittest discover -s tools -p 'test_x86_isl_bit_primitives.py' -v
      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: 5.4.1
      - name: Build pinned upstream Intel AST exporter
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq libgmp-dev pkg-config cmake libz3-dev
          git clone --filter=blob:none https://github.com/IntelLabs/isa-tools.git /tmp/isa-tools
          git -C /tmp/isa-tools checkout 16260979137c38339743a04b7fd5d9f0fa8a6ee5
          git -C /tmp/isa-tools submodule update --init --recursive
          cp tools/x86_isl_ast_export.ml tools/x86_isl_ast_json.ml /tmp/isa-tools/bin/
          cat >> /tmp/isa-tools/bin/dune <<'EOF'
          (executable
           (name x86_isl_ast_export)
           (modules x86_isl_ast_export x86_isl_ast_json)
           (libraries libISA yojson))
          EOF
          cd /tmp/isa-tools
          opam install --switch="$GITHUB_WORKSPACE" . --deps-only --yes
          opam exec --switch="$GITHUB_WORKSPACE" -- dune build bin/x86_isl_ast_export.exe

      - name: Original corpus scalar and packed scope census
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 2a8bbfd87cf99a78d49923b80ac3885e35392c81
          git clone --filter=blob:none --sparse https://github.com/intel/SDM.git /tmp/intel-sdm
          git -C /tmp/intel-sdm fetch --depth 1 origin 35eface1b7ee003a1cda95005ec5fd83de658a64
          git -C /tmp/intel-sdm checkout 35eface1b7ee003a1cda95005ec5fd83de658a64
          git -C /tmp/intel-sdm sparse-checkout set data/instruction
          python3 -m venv /tmp/x7-z3
          /tmp/x7-z3/bin/python -m pip install --disable-pip-version-check 'z3-solver==4.13.4.0'
          mkdir -p /tmp/x7-packed
          python3 tools/x86_iform_helper_dependencies.py --xml-dir /tmp/intel-sdm/data/instruction --out /tmp/x7-packed/index.json --shards 8
          python3 tools/x86_iform_proof_work_dag.py --dependency-index /tmp/x7-packed/index.json --out /tmp/x7-packed/queue.json --shards 8
          /tmp/x7-z3/bin/python -m unittest discover -s tools -p 'test_x86_isl_packed_batch.py' -v
          /tmp/x7-z3/bin/python -m unittest discover -s tools -p 'test_x86_isl_operation_model_census.py' -v
          /tmp/x7-z3/bin/python -m unittest discover -s tools -p 'test_x86_isl_b3_record_worker.py' -v
          failed=0
          for scope in 64-scalar 128-8 256-32 512-64; do
            width="${scope%-*}"
            lane="${scope#*-}"
            args=()
            if test "$lane" != scalar; then args+=(--element-width "$lane"); fi
            mkdir -p "/tmp/x7-packed/$scope/shards"
            for shard in $(seq 0 7); do
              /tmp/x7-z3/bin/python tools/x86_isl_operation_proof_worker.py \
                --dependency-index /tmp/x7-packed/index.json --proof-work-queue /tmp/x7-packed/queue.json \
                --xml-dir /tmp/intel-sdm/data/instruction --parser /tmp/isa-tools/_build/default/bin/x86_isl_ast_export.exe \
                --width "$width" "${args[@]}" --shard-index "$shard" --jobs 4 --model-jobs 2 \
                --cache-dir /tmp/x7-b3-parser-cache --max-checks 256 --timeout-ms 2000 \
                --out "/tmp/x7-packed/$scope/shards/op-shard-$(printf '%02d' "$shard").json" || failed=1
            done
            python3 tools/x86_isl_operation_model_census.py --dependency-index /tmp/x7-packed/index.json \
              --proof-work-queue /tmp/x7-packed/queue.json --reports-dir "/tmp/x7-packed/$scope/shards" \
              --out "/tmp/x7-packed/$scope/census.json"
          done
          python3 - <<'PY'
          import json
          from pathlib import Path
          for p in sorted(Path('/tmp/x7-packed').glob('*/census.json')):
              c=json.loads(p.read_text())
              s=c['summary']
              assert s['operations_accounted_for']==s['operations_indexed']==1641,s
              assert s['production_selection_eligible_forms']==s['fully_verified_x86_instruction_forms']==0
              assert s['source_models_reported_by_status'].get('deferred_by_model_check_budget',0)==0,s
              assert c['source_form_impact']['summary']['original_source_iforms']==10859
              print('X7_HORIZONTAL_CENSUS',p.parent.name,json.dumps(s,sort_keys=True))
              for row in c['operations']:
                  if row['status']=='supported_model_equivalent':
                      print('X7_HORIZONTAL_MODEL',p.parent.name,row['source_file'],row['operation'])
              for row in c['source_form_impact']['ranked_source_blockers'][:20]:
                  print('X7_HORIZONTAL_BLOCKER',p.parent.name,json.dumps(row,sort_keys=True))
          PY
          test "$failed" = 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: x7-horizontal-packed-census
          path: /tmp/x7-packed
