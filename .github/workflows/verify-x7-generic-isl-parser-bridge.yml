name: Verify X7 generic Intel parser-semantic bridge
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/verify-x7-generic-isl-parser-bridge.yml']
permissions:
  contents: read
jobs:
  parser-bridge:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 378c0caf7d85bdb5c3858d551729276d4e9bd623
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Record exact source and standalone unit tests
        run: |
          set -euo pipefail
          git rev-parse HEAD
          python3 -m unittest discover -s tools -p 'test_x86_isl_bit_primitives.py' -v
      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: 5.4.1
      - name: Build pinned upstream Intel AST exporter
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq libgmp-dev pkg-config cmake libz3-dev
          git clone --filter=blob:none https://github.com/IntelLabs/isa-tools.git /tmp/isa-tools
          git -C /tmp/isa-tools checkout 16260979137c38339743a04b7fd5d9f0fa8a6ee5
          git -C /tmp/isa-tools submodule update --init --recursive
          cp tools/x86_isl_ast_export.ml tools/x86_isl_ast_json.ml /tmp/isa-tools/bin/
          cat >> /tmp/isa-tools/bin/dune <<'EOF'
          (executable
           (name x86_isl_ast_export)
           (modules x86_isl_ast_export x86_isl_ast_json)
           (libraries libISA yojson))
          EOF
          cd /tmp/isa-tools
          opam install --switch="$GITHUB_WORKSPACE" . --deps-only --yes
          opam exec --switch="$GITHUB_WORKSPACE" -- dune build bin/x86_isl_ast_export.exe
      - name: Execute actual parsed Intel ISL examples
        run: |
          set -euo pipefail
          python3 tools/verify_x86_isl_generic_examples.py \
            --parser /tmp/isa-tools/_build/default/bin/x86_isl_ast_export.exe

      - name: Verify actual Intel per-form stage ASTs at pinned Intel SDM revision
        run: |
          set -euo pipefail
          mkdir -p /tmp/x7-iform-source
          rev=35eface1b7ee003a1cda95005ec5fd83de658a64
          for instruction in MOV ADD XOR; do
            curl --fail --silent --show-error --location --retry 2 --max-time 45 \
              "https://raw.githubusercontent.com/intel/SDM/${rev}/data/instruction/${instruction}.xml" \
              --output "/tmp/x7-iform-source/${instruction}.xml"
          done
          python3 tools/verify_x86_isl_real_iform_ast.py \
            --xml-dir /tmp/x7-iform-source \
            --parser /tmp/isa-tools/_build/default/bin/x86_isl_ast_export.exe
