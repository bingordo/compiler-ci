name: Verify X7 generic Intel parser-semantic bridge
on:
  pull_request:
    paths: ['.github/workflows/verify-x7-generic-isl-parser-bridge.yml']
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/verify-x7-generic-isl-parser-bridge.yml']
permissions:
  contents: read
jobs:
  parser-bridge:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 23443bda1d1bf20a8845c024042b2644c1a129ec
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Record exact source and standalone unit tests
        run: |
          set -euo pipefail
          git rev-parse HEAD
          python3 -m unittest discover -s tools -p 'test_x86_isl_bit_primitives.py' -v
      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: 5.4.1
      - name: Build pinned upstream Intel AST exporter
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq libgmp-dev pkg-config cmake libz3-dev
          git clone --filter=blob:none https://github.com/IntelLabs/isa-tools.git /tmp/isa-tools
          git -C /tmp/isa-tools checkout 16260979137c38339743a04b7fd5d9f0fa8a6ee5
          git -C /tmp/isa-tools submodule update --init --recursive
          cp tools/x86_isl_ast_export.ml tools/x86_isl_ast_json.ml /tmp/isa-tools/bin/
          cat >> /tmp/isa-tools/bin/dune <<'EOF'
          (executable
           (name x86_isl_ast_export)
           (modules x86_isl_ast_export x86_isl_ast_json)
           (libraries libISA yojson))
          EOF
          cd /tmp/isa-tools
          opam install --switch="$GITHUB_WORKSPACE" . --deps-only --yes
          opam exec --switch="$GITHUB_WORKSPACE" -- dune build bin/x86_isl_ast_export.exe
      - name: Execute actual parsed Intel ISL examples
        run: |
          set -euo pipefail
          python3 tools/verify_x86_isl_generic_examples.py \
            --parser /tmp/isa-tools/_build/default/bin/x86_isl_ast_export.exe

      - name: Verify actual Intel per-form stage ASTs at pinned Intel SDM revision
        run: |
          set -euo pipefail
          mkdir -p /tmp/x7-iform-source
          rev=35eface1b7ee003a1cda95005ec5fd83de658a64
          for instruction in MOV ADD XOR; do
            curl --fail --silent --show-error --location --retry 2 --max-time 45 \
              "https://raw.githubusercontent.com/intel/SDM/${rev}/data/instruction/${instruction}.xml" \
              --output "/tmp/x7-iform-source/${instruction}.xml"
          done
          python3 tools/verify_x86_isl_real_iform_ast.py \
            --xml-dir /tmp/x7-iform-source \
            --parser /tmp/isa-tools/_build/default/bin/x86_isl_ast_export.exe

      - name: Original Intel B3 RFLAGS record model proof and negative Z3 tests
        run: |
          set -euo pipefail
          python3 -m venv /tmp/x7-z3
          /tmp/x7-z3/bin/python -m pip install --disable-pip-version-check 'z3-solver==4.13.4.0'
          /tmp/x7-z3/bin/python -m unittest discover -s tools -p 'test_x86_isl_b3_record_worker.py' -v
          /tmp/x7-z3/bin/python -m unittest discover -s tools -p 'test_x86_isl_operation_proof_worker.py' -v
          /tmp/x7-z3/bin/python -m unittest discover -s tools -p 'test_x86_isl_generic_bit_flags_smt.py' -v
          mkdir -p /tmp/x7-b3-original-intel
          intel_rev=35eface1b7ee003a1cda95005ec5fd83de658a64
          for instruction in POPCNT LZCNT TZCNT; do
            curl --fail --silent --show-error --location --retry 3 --max-time 45               "https://raw.githubusercontent.com/intel/SDM/${intel_rev}/data/instruction/${instruction}.xml"               --output "/tmp/x7-b3-original-intel/${instruction}.xml"
          done
          python3 tools/x86_iform_helper_dependencies.py             --xml-dir /tmp/x7-b3-original-intel             --out /tmp/x7-b3-intel-source-index.json --shards 4
          python3 tools/x86_iform_proof_work_dag.py             --dependency-index /tmp/x7-b3-intel-source-index.json             --out /tmp/x7-b3-source-proof-tasks.json --shards 4
          for width in 32 64; do
            for model_jobs in 1 2; do
              /tmp/x7-z3/bin/python tools/x86_isl_operation_proof_worker.py                 --dependency-index /tmp/x7-b3-intel-source-index.json                 --proof-work-queue /tmp/x7-b3-source-proof-tasks.json                 --xml-dir /tmp/x7-b3-original-intel                 --parser /tmp/isa-tools/_build/default/bin/x86_isl_ast_export.exe                 --width "${width}" --jobs 3 --model-jobs "${model_jobs}"                 --max-checks 3 --timeout-ms 10000                 --out "/tmp/x7-b3-real-ops-${width}-${model_jobs}.json"
            done
          done
          /tmp/x7-z3/bin/python - <<'PY'
          import json
          for width in (32,64):
              a=json.load(open(f"/tmp/x7-b3-real-ops-{width}-1.json"))
              b=json.load(open(f"/tmp/x7-b3-real-ops-{width}-2.json"))
              assert a==b, "source/record receipts differ by Z3 worker count"
              rows={x["operation"]:x for x in a["operations"]}
              assert set(rows)=={"POPCNT","LZCNT","TZCNT"},rows
              assert a["summary"]["supported_source_model_equivalences"]==3,a["summary"]
              assert a["summary"]["full_architectural_semantic_proofs"]==0
              assert a["summary"]["selection_eligible_forms"]==0
              for name,row in rows.items():
                  assert row["status"]=="supported_model_equivalent",row
                  assert row["source_record_schema"]["RFLAGS"]=={
                      x:{"sort":"Bits","width":1}
                      for x in ("OF","SF","ZF","AF","PF","CF")}
                  writes=[e["field"] for e in row["source_record_effect_trace"]["events"]
                          if e["kind"]=="write"]
                  assert writes==[f"RFLAGS.{x}" for x in ("OF","SF","ZF","AF","PF","CF")],writes
                  assert row["source_record_definedness"]==(
                      "rejected" if name=="POPCNT" else "tracked")
                  assert sorted(row["checked_outputs"])==sorted(["src","result"]+
                      [f"RFLAGS.{x}" for x in ("OF","SF","ZF","AF","PF","CF")])
                  assert row["production_selection_eligible"] is False
              print("X7_ORIGINAL_INTEL_COUNT_RECORD_MODEL_PASS",width,a["summary"])
          PY
