name: x86 physical typed replay subset compiler PR 1141
on:
  pull_request:
    paths:
      - '.github/workflows/verify-x86-physical-typed-replay-pr1141.yml'
permissions:
  contents: read
jobs:
  x86-physical-replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 4cc56cb2861d570cfa7ea33983f3bfc4a8ab633b
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Verify source pin
        run: test "$(git -C compiler rev-parse HEAD)" = "4cc56cb2861d570cfa7ea33983f3bfc4a8ab633b"
      - name: Restrict independent core workspace
        run: |
          cat > compiler/Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir", "crates/opt", "crates/backend", "crates/backend-x86"]
          EOF
          rm -f compiler/Cargo.lock
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: x86-physical-typed-replay
          cache-workspace-crates: 'true'
      - name: Focused ELF replay tests and physical document regressions
        working-directory: compiler
        run: |
          cargo test -p compiler-backend-x86 --test typeid_physical_subset_replay -- --nocapture
          cargo test -p compiler-backend-x86 --test typeid_physical_document_v1 -- --nocapture
          cargo test -p compiler-backend-x86 --test typeid_physical_text_v1 -- --nocapture
      - name: Full x86 backend tests and strict Clippy
        working-directory: compiler
        run: |
          cargo test -p compiler-backend-x86
          cargo clippy -p compiler-backend-x86 --all-targets -- -D warnings
