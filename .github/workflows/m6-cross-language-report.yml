# Manual M6 checked-source/code-quality and optional timing reporting. No speed gate.
name: M6 cross-language checked-source report
on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Exact compiler SHA or branch to validate
        required: true
        type: string
        default: main
      runtime_profile:
        description: Run opt-in paired native timing diagnostics (extra CI work)
        required: false
        type: boolean
        default: false

permissions:
  contents: read
concurrency:
  group: m6-cross-language-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pin:
    runs-on: ubuntu-24.04
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: ${{ inputs.source_ref }}
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Pin the exact compiler revision for both languages
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          sha="$(git -C compiler rev-parse HEAD)"
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]]
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

  mini-c:
    needs: pin
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
      CARGO_INCREMENTAL: '0'
      M6_RUNTIME_PROFILE: ${{ inputs.runtime_profile && '1' || '0' }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: ${{ needs.pin.outputs.sha }}
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Fetch pinned Mini-C frontend over HTTPS
        run: git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler/tools/mini-c-driver -> target
          key: m6-cross-mini-c-v1
      - name: Record Mini-C runner and toolchain
        if: ${{ inputs.runtime_profile }}
        shell: bash
        run: |
          mkdir -p results
          {
            echo "runner_os=$RUNNER_OS"
            echo "runner_arch=$RUNNER_ARCH"
            uname -a
            lscpu | grep -E '^(Model name|CPU\(s\)|Hypervisor vendor):' || true
            rustc --version
            cargo --version
            cc --version | sed -n '1p'
            objdump --version | sed -n '1p'
          } > results/m6-mini-c-host.txt
      - name: Run real Mini-C source/native GCC differential tests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p results
          # A stable CPU affinity reduces migration noise, but
          # shared-runner interference and frequency changes still remain.
          affinity=()
          if [[ "$M6_RUNTIME_PROFILE" == "1" ]]; then
            cpu="$(python3 -c 'import os; print(min(os.sched_getaffinity(0)))')"
            printf 'pinned_logical_cpu=%s\n' "$cpu" >> results/m6-mini-c-host.txt
            affinity=(taskset -c "$cpu")
          fi
          "${affinity[@]}" cargo test --manifest-path compiler/tools/mini-c-driver/Cargo.toml -p compiler-mini-c --lib \
            m6_source::m6_real_checked_mini_c_source_vs_gcc -- --nocapture \
            2>&1 | tee results/m6-mini-c-source.log
          test "$(grep -c '^M6_MINIC,' results/m6-mini-c-source.log)" -eq 20
      - name: Strict Mini-C Clippy
        run: cargo clippy --manifest-path compiler/tools/mini-c-driver/Cargo.toml -p compiler-mini-c --all-targets -- -D warnings
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m6-cross-mini-c
          path: |
            results/m6-mini-c-source.log
            results/m6-mini-c-host.txt
          if-no-files-found: ignore
          retention-days: 30

  oberon:
    needs: pin
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
      CARGO_INCREMENTAL: '0'
      M6_RUNTIME_PROFILE: ${{ inputs.runtime_profile && '1' || '0' }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: ${{ needs.pin.outputs.sha }}
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Fetch pinned Oberon frontend over HTTPS
        run: git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: m6-cross-oberon-v1
      - name: Record Oberon runner and toolchain
        if: ${{ inputs.runtime_profile }}
        shell: bash
        run: |
          mkdir -p results
          {
            echo "runner_os=$RUNNER_OS"
            echo "runner_arch=$RUNNER_ARCH"
            uname -a
            lscpu | grep -E '^(Model name|CPU\(s\)|Hypervisor vendor):' || true
            rustc --version
            cargo --version
            cc --version | sed -n '1p'
            objdump --version | sed -n '1p'
          } > results/m6-oberon-host.txt
      - name: M6.4 e-graph SSA extraction unit tests
        run: cargo test --manifest-path compiler/Cargo.toml -p compiler-opt --lib egraph_ssa::tests -- --nocapture
      - name: Run real Oberon source/native C differential tests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p results
          # A stable CPU affinity reduces migration noise, but
          # shared-runner interference and frequency changes still remain.
          affinity=()
          if [[ "$M6_RUNTIME_PROFILE" == "1" ]]; then
            cpu="$(python3 -c 'import os; print(min(os.sched_getaffinity(0)))')"
            printf 'pinned_logical_cpu=%s\n' "$cpu" >> results/m6-oberon-host.txt
            affinity=(taskset -c "$cpu")
          fi
          "${affinity[@]}" cargo test --manifest-path compiler/Cargo.toml -p compiler --bin compiler \
            m6_checked_oberon_source_vs_c_oracle -- --nocapture \
            2>&1 | tee results/m6-oberon-source.log
          test "$(grep -c '^M6_OBERON,' results/m6-oberon-source.log)" -eq 12
      - name: Strict Oberon driver Clippy
        run: cargo clippy --manifest-path compiler/Cargo.toml -p compiler --all-targets -- -D warnings
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m6-cross-oberon
          path: |
            results/m6-oberon-source.log
            results/m6-oberon-host.txt
          if-no-files-found: ignore
          retention-days: 30

  summarize:
    needs: [pin, mini-c, oberon]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: ${{ needs.pin.outputs.sha }}
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: m6-cross-*
          path: logs
      - name: Validate report parser
        run: python3 -m unittest discover -s compiler/tools/tests -p test_m6_source_corpus_summary.py -v
      - name: Validate paired runtime report parser
        if: ${{ inputs.runtime_profile }}
        run: python3 -m unittest discover -s compiler/tools/tests -p test_m6_runtime_summary.py -v
      - name: Produce paired runtime CSV JSON and Markdown
        if: ${{ inputs.runtime_profile }}
        shell: bash
        env:
          SOURCE_SHA: ${{ needs.pin.outputs.sha }}
        run: |
          set -euo pipefail
          python3 compiler/tools/m6_runtime_summary.py \
            --source-sha "$SOURCE_SHA" \
            --mini-c logs/m6-cross-mini-c/m6-mini-c-source.log \
            --oberon logs/m6-cross-oberon/m6-oberon-source.log \
            --mini-c-host logs/m6-cross-mini-c/m6-mini-c-host.txt \
            --oberon-host logs/m6-cross-oberon/m6-oberon-host.txt \
            --csv results/m6-runtime-report.csv \
            --json results/m6-runtime-report.json \
            --markdown results/m6-runtime-report.md
          cat results/m6-runtime-report.md >> "$GITHUB_STEP_SUMMARY"
      - name: Produce pinned cross-language CSV JSON and Markdown
        shell: bash
        env:
          SOURCE_SHA: ${{ needs.pin.outputs.sha }}
        run: |
          set -euo pipefail
          python3 compiler/tools/m6_source_corpus_summary.py \
            --source-sha "$SOURCE_SHA" \
            --mini-c logs/m6-cross-mini-c/m6-mini-c-source.log \
            --oberon logs/m6-cross-oberon/m6-oberon-source.log \
            --expect-mini-c 20 --expect-oberon 12 \
            --csv results/m6-source-report.csv \
            --json results/m6-source-report.json \
            --markdown results/m6-source-report.md
          cat results/m6-source-report.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: m6-cross-language-report
          path: |
            results/m6-source-report.*
            results/m6-runtime-report.*
          retention-days: 30
