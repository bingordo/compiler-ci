name: x86 M1.16a physical module v3 PR 1217
on:
  pull_request:
    paths:
      - '.github/workflows/verify-x86-m16-physical-module-v3.yml'
permissions:
  contents: read
jobs:
  x86-physical-module:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 9c8476d500b412cc4a9a3e4bb6f943c5559a661b
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Verify pinned source
        run: test "$(git -C compiler rev-parse HEAD)" = "9c8476d500b412cc4a9a3e4bb6f943c5559a661b"
      - name: Restrict to core workspace
        run: |
          cat > compiler/Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir", "crates/opt", "crates/backend", "crates/backend-x86"]
          EOF
          rm -f compiler/Cargo.lock
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: x86-m16-module-v3
          cache-workspace-crates: 'true'
      - name: Validate physical module metadata and byte-identical ELF
        working-directory: compiler
        run: |
          cargo test -p compiler-backend-x86 --test typeid_physical_module_v3 -- --nocapture
          cargo test -p compiler-backend-x86 --test typeid_physical_tagged_v2 -- --nocapture
      - name: Full x86 backend and strict Clippy
        working-directory: compiler
        run: |
          cargo test -p compiler-backend-x86
          cargo clippy -p compiler-backend-x86 --all-targets -- -D warnings
