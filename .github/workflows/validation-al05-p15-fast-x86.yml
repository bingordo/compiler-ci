name: VALIDATION ONLY P15 x86 PHI-extreme native smoke

on:
  pull_request:
    paths:
      - '.github/workflows/validation-al05-p15-fast-x86.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  p15-x86:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout validation workflow
        uses: actions/checkout@v4
      - name: Checkout exact compiler source
        uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 884030c8bc9435b21b5c4c90750b49807dbaf7b7
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Isolate core workspace
        working-directory: compiler
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = '884030c8bc9435b21b5c4c90750b49807dbaf7b7'
          python3 - <<'PY'
          from pathlib import Path
          Path('Cargo.toml').write_text("""[workspace]
          resolver = "2"
          members = ["crates/ir", "crates/opt", "crates/backend", "crates/backend-x86", "crates/backend-aarch64"]
          """)
          PY
      - name: Cache Rust core
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: p15-native-x86
      - name: Strict Clippy plus independent P15 C11 raw/optimized ELF and GAS
        working-directory: compiler
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=10s 6m cargo clippy -p compiler-opt --test al05_p9_mixed_native_bridge -- -D warnings
          timeout --signal=TERM --kill-after=10s 6m cargo test -p compiler-opt --test al05_p9_mixed_native_bridge al05_p15_generated_phi_extremes_native_x86_elf_and_gas_match_c11 -- --exact --nocapture 2>&1 | tee "$RUNNER_TEMP/al05-p15-fast-x86.log"
          for format in elf gas; do
            grep -Fx "AL05_P15_GENERATED_NATIVE_TARGET arch=x86_64 format=$format functions=32 changed_cse=16 modes=8 seeds=2,6 coefficients=2 comparisons=14944 traps=64 verdict=PASS" "$RUNNER_TEMP/al05-p15-fast-x86.log"
          done
