name: TypeId-first Oberon frontend owned SSA migration
on:
  pull_request:
    paths:
      - '.github/workflows/verify-typeid-first-oberon-direct.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-producer:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
      CARGO_INCREMENTAL: '0'
    steps:
      - name: Checkout immutable compiler producer candidate
        uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: b6d7979812bbbe105f0988e8ac099800c634c033
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Verify exact compiler source SHA
        working-directory: compiler
        run: test "$(git rev-parse HEAD)" = "b6d7979812bbbe105f0988e8ac099800c634c033"
      - name: Resolve pinned public frontend dependencies
        run: git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: typeid-first-oberon-direct
      - name: Existing Oberon and Mini-C native TypeId GAS ELF C11 source oracles
        working-directory: compiler
        run: cargo test -p compiler --bin compiler typeid_native_source -- --nocapture
      - name: Full checked Oberon and Mini-C frontend driver suite
        working-directory: compiler
        run: cargo test -p compiler --bin compiler
      - name: Focused native TypeId semantics and source importer tests
        working-directory: compiler
        run: cargo test -p compiler-ir --test native_source_bridge -- --nocapture
      - name: AArch64 TypeId shared API compatibility
        working-directory: compiler
        run: cargo check -p compiler-backend-aarch64 --all-targets
      - name: Strict compiler IR x86 optimizer and AArch64 lint
        working-directory: compiler
        run: cargo clippy -p compiler -p compiler-ir -p compiler-opt -p compiler-backend-x86 --all-targets -- -D warnings
      - name: Strict AArch64 production Clippy
        working-directory: compiler
        run: cargo clippy -p compiler-backend-aarch64 --lib -- -D warnings
      - name: Install GDB for existing DWARF native debugger oracle
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y gdb
      - name: Full IR optimizer and backend regression
        working-directory: compiler
        run: cargo test -p compiler-ir -p compiler-opt -p compiler-backend -p compiler-backend-x86
