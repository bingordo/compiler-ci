name: ASM1 generated AT&T GP catalog and GAS parity
on:
  pull_request:
    paths: ['.github/workflows/asm1-form-catalog-20261124.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  catalog:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: a7d64f3cbbb066d06bbed8223d790069807a2673
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
          path: compiler
      - name: Require exact reviewed source
        working-directory: compiler
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = a7d64f3cbbb066d06bbed8223d790069807a2673
      - name: Test generated catalog and deterministic check
        working-directory: compiler
        run: |
          set -euo pipefail
          python3 tools/test_regen_x86_att_forms.py
          python3 tools/regen_x86_att_forms.py --check
      - name: Isolate backend crates
        working-directory: compiler
        run: |
          cat > Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir", "crates/opt", "crates/backend", "crates/backend-x86", "crates/backend-aarch64", "crates/backend-riscv64", "crates/backend-wasm"]
          EOF
          rm -f Cargo.lock
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler
          key: asm1-reviewed-att-form-catalog
      - name: Run real AT&T parser, encoder and GNU assembler regression
        working-directory: compiler
        run: |
          set -euo pipefail
          cargo test -p compiler-backend-x86 --test att_asm -- --nocapture
