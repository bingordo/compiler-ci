# Temporary exact-source BT4 AArch64 native B+4 direct ELF and SSA oracle cutover.
name: BT4 x86 original scalar Function source to native TypeId parity
on:
  pull_request:
    paths: ['.github/workflows/bt4-x86-scalar-typeid-parity-20261115.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  aarch64-native:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 35
    env:
      CARGO_INCREMENTAL: '0'
      SOURCE_SHA: 62d455062db2f912508e6af35286be69643819b4
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 62d455062db2f912508e6af35286be69643819b4
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Verify exact compiler and persistent source boundary
        run: |
          set -euo pipefail
          test "$(git -C compiler rev-parse HEAD)" = "$SOURCE_SHA"
          python3 compiler/tools/check_bt4_backend_boundary.py
      - name: Isolate native ARM core Rust workspace
        run: |
          cat > compiler/Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir", "crates/opt", "crates/backend", "crates/backend-x86", "crates/backend-aarch64"]
          EOF
          rm -f compiler/Cargo.lock
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: bt4-x86-scalars-parity-20261115
      - name: Strict native ARM full AArch64 all-target compile
        working-directory: compiler
        run: RUSTFLAGS='-D warnings' cargo check -p compiler-backend-aarch64 --all-targets
      - name: Native historical machine quality four exact byte tests and five C oracles
        working-directory: compiler
        run: cargo test -p compiler-backend-aarch64 --test typeid_historical_pressure -- --nocapture
      - name: AArch64 all-native TypeId after complete Function historical source deletion
        working-directory: compiler
        run: cargo test -p compiler-backend-aarch64 --all-targets -- --test-threads=1
      - name: Strict AArch64 native test Clippy
        working-directory: compiler
        run: cargo clippy -p compiler-backend-aarch64 --lib --test typeid_historical_pressure -- -D warnings
  full-workspace:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      CARGO_INCREMENTAL: '0'
      SOURCE_SHA: 62d455062db2f912508e6af35286be69643819b4
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 62d455062db2f912508e6af35286be69643819b4
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.CI_KEY }}
      - name: Pin exact compiler and source-boundary test
        run: |
          set -euo pipefail
          test "$(git -C compiler rev-parse HEAD)" = "$SOURCE_SHA"
          ssh-keyscan github.com >> "$HOME/.ssh/known_hosts"
          python3 compiler/tools/check_bt4_backend_boundary.py
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler
          key: bt4-x86-scalars-full-20261115
      - name: Entire compiler workspace all-targets with frontend and driver
        working-directory: compiler
        run: cargo check --workspace --all-targets
      - name: Both production TypeId backends optimized without historical feature
        working-directory: compiler
        run: cargo check -p compiler-backend-x86 -p compiler-backend-aarch64 --release --lib
      - name: Strict changed x86 backend and new native scalar tests Clippy
        working-directory: compiler
        run: cargo clippy -p compiler-backend-x86 --lib --test bt4_x86_historical_scalar_native -- -D warnings
      - name: Original x86 legacy Function scalar reference unit oracles
        working-directory: compiler
        run: |
          cargo test -p compiler-backend-x86 --lib production_backends_select_zero_idiom_from_typed_ssa
          cargo test -p compiler-backend-x86 --lib emits_abi_args_without_rust_runtime_dependency
          cargo test -p compiler-backend-x86 --lib links_and_executes_real_object
      - name: Native TypeId replacement zero ABI direct ELF and GNU GAS C tests
        working-directory: compiler
        run: cargo test -p compiler-backend-x86 --test bt4_x86_historical_scalar_native -- --nocapture
      - name: x86 native CMOV ABI and compiler optimizer original C references
        working-directory: compiler
        run: |
          cargo test -p compiler-opt --test if_conversion_typeid_remaining
          cargo test -p compiler-backend-x86 --test native_typeid_select_cmov --test typed_alias_calls_native
