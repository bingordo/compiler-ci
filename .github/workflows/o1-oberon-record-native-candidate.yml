name: O1 Oberon scalar-record TypeId candidate (source-pinned)
on:
  pull_request:
    paths:
      - '.github/workflows/o1-oberon-record-native-candidate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checked-record-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
      CARGO_INCREMENTAL: '0'
    steps:
      - name: Checkout exact compiler candidate
        uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 6e11c8edd739748d0634d0e76ee7a4b11036fb60
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Verify source and pinned frontend
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C compiler rev-parse HEAD)" = 6e11c8edd739748d0634d0e76ee7a4b11036fb60
          grep -Fq 'rev = "c6a4ba81c92e584c2380c4bb150377e3e1f442be"' compiler/crates/driver/Cargo.toml
          git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: oberon-o1-typeid-record-candidate
      - name: Native x86 GAS and ELF linked C oracle for Oberon private INTEGER records
        run: |
          cargo test --manifest-path compiler/Cargo.toml -p compiler --bin compiler \
            checked_oberon_private_integer_record_fields_link_and_execute_typeid -- --nocapture
      - name: Native source smoke and validator gate
        run: |
          cargo test --manifest-path compiler/Cargo.toml -p compiler --bin compiler \
            checked_oberon_source_uses_native_typeid_gas_and_elf -- --nocapture
          cargo clippy --manifest-path compiler/Cargo.toml -p compiler --all-targets -- -D warnings
