name: Temporary AArch64 mixed FP order #3716
on:
  pull_request:
    paths: ['.github/workflows/temp-a64-mixed-order-3716.yml']
permissions:
  contents: read
jobs:
  mixed:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      SOURCE_SHA: e1ce31ee503ef91f92dbbdd105bb62bad42c20f0
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: ${{ env.SOURCE_SHA }}
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.CI_KEY }}
      - name: Trust GitHub for dependencies
        run: ssh-keyscan github.com >> ~/.ssh/known_hosts
      - name: Run AArch64 mixed FP order test
        working-directory: compiler
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          cargo test -p compiler-backend-aarch64 --test typeid_fp_mixed_entry_native -- --nocapture
