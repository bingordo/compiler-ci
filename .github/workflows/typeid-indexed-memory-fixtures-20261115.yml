name: Existing TypeId indexed indirect and memory-call fixtures
on:
  push:
    branches: [verify/typeid-indexed-memory-fixtures-20261115]
    paths: ['.github/workflows/typeid-indexed-memory-fixtures-20261115.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 703a3a1fab73a7ffdea79a3e257c0db0a8cacfde
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Verify exact compiler source
        run: test "$(git -C compiler rev-parse HEAD)" = "703a3a1fab73a7ffdea79a3e257c0db0a8cacfde"
      - name: Restrict core workspace
        run: |
          cat > compiler/Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir", "crates/backend", "crates/backend-x86"]
          EOF
          rm -f compiler/Cargo.lock
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: typeid-indexed-memory-fixed-fixtures
      - name: Export original checked TypeId graph corpora
        working-directory: compiler
        run: |
          cargo test -p compiler-backend-x86 --test native_typeid_indexed_indirect temporary_export_exact_native_typeid_corpus -- --nocapture
          cargo test -p compiler-backend-x86 --test native_typeid_memory_calls temporary_export_exact_native_typeid_corpus -- --nocapture
