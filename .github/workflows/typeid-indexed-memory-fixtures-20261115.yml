name: Existing TypeId indexed indirect and memory-call fixtures
on:
  push:
    branches: [verify/typeid-indexed-memory-fixtures-20261115]
    paths: ['.github/workflows/typeid-indexed-memory-fixtures-20261115.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 661049038cfa71c0ebd516a742691a551b5fd1bf
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Verify exact compiler source
        run: test "$(git -C compiler rev-parse HEAD)" = "661049038cfa71c0ebd516a742691a551b5fd1bf"
      - name: Restrict core workspace
        run: |
          cat > compiler/Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir", "crates/backend", "crates/backend-x86"]
          EOF
          rm -f compiler/Cargo.lock
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: typeid-indexed-memory-fixed-fixtures
      - name: Validate existing native indexed and memory-call semantics
        working-directory: compiler
        run: |
          cargo test -p compiler-backend-x86 --test native_typeid_indexed_indirect --test native_typeid_memory_calls
          cargo test -p compiler-backend-x86 --test native_typeid_direct --test native_typeid_select_cmov
          cargo test -p compiler-ir --test native_module_text_v3 --test native_fixture_text
          cargo clippy -p compiler-backend-x86 --no-deps --test native_typeid_indexed_indirect --test native_typeid_memory_calls -- -D warnings
