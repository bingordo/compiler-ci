name: M10 original Csmith pointer/array/struct differential coverage
on:
  push:
    branches: [test/m10-csmith-structural-corpus-20261107]
    paths: ['.github/workflows/test-m10-structural-profiles.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-pinned-structural-seeds:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
      CARGO_INCREMENTAL: '0'
      COMPILER_SHA: da7b51e159bf12c7ebfed9ddccacf26ee94cbf03
      FRONTEND_SHA: 16e47b226535e6c97269d309e7e444c345ed4f78
    steps:
      - name: Checkout exact compiler and checked Mini-C integration
        uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: da7b51e159bf12c7ebfed9ddccacf26ee94cbf03
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Confirm exact compiler and Mini-C revisions
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C compiler rev-parse HEAD)" = "$COMPILER_SHA"
          python3 - <<'PY'
          from pathlib import Path
          import os,re
          s=Path("compiler/tools/mini-c-driver/Cargo.toml").read_text()
          versions=re.findall(r'mini-c-(?:syntax|sema)\s*=\s*\{[^\n]*rev\s*=\s*"([0-9a-f]{40})"',s)
          assert versions == [os.environ["FRONTEND_SHA"]]*2,versions
          PY
          git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
          python3 -m unittest discover -s compiler/tools -p test_csmith_probe.py
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler/tools/mini-c-driver -> target
          key: m10-structural-corpus-nov7
      - name: Test native FP failure boundary and strict Clippy
        shell: bash
        run: |
          set -euo pipefail
          cargo test --manifest-path compiler/tools/mini-c-driver/Cargo.toml -p compiler-mini-c --lib m10_ -- --nocapture
          cargo clippy --manifest-path compiler/tools/mini-c-driver/Cargo.toml -p compiler-mini-c --all-targets -- -D warnings
      - name: Build exact native Mini-C driver, not stale prebuilt
        run: cargo build --release --manifest-path compiler/tools/mini-c-driver/Cargo.toml --bin compiler-mini-c
      - name: Execute real block declaration list object and GCC reference
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p results
          cat > "$RUNNER_TEMP/local-decls.c" <<'C'
          int main(void) {
              int i=19, j=i+23;
              int *p=&j, extra=0;
              return *p + extra - 42;
          }
          C
          "$PWD/compiler/tools/mini-c-driver/target/release/compiler-mini-c" \
            "$RUNNER_TEMP/local-decls.c" -o "$RUNNER_TEMP/native-local.o" --emit obj
          cc "$RUNNER_TEMP/native-local.o" -o "$RUNNER_TEMP/native-local"
          cc "$RUNNER_TEMP/local-decls.c" -o "$RUNNER_TEMP/gcc-local"
          "$RUNNER_TEMP/native-local"
          "$RUNNER_TEMP/gcc-local"
          sha256sum "$RUNNER_TEMP/native-local.o" >> results/native-object-sha256.txt
      - name: Install original Csmith 2.3, GCC and Clang
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -qq -y --no-install-recommends csmith libcsmith-dev gcc clang
          version="$(dpkg-query -W csmith | awk '{print $2}')"
          [[ "$version" == 2.3.0-* ]]
          header="$(dpkg -L libcsmith-dev | grep '/csmith.h$' | head -n1)"
          test -s "$header"
          echo "CSMITH_INCLUDE=$(dirname "$header")" >> "$GITHUB_ENV"
      - name: Generate and execute three orthogonal original Csmith 2.3 corpora
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p results
          driver="$PWD/compiler/tools/mini-c-driver/target/release/compiler-mini-c"
          for profile in restricted-pointers restricted-arrays restricted-structs; do
            echo "Starting exact-original Csmith profile $profile"
            python3 compiler/tools/csmith_probe.py --generate \
              --cases-dir "$RUNNER_TEMP/csmith-$profile" \
              --csmith csmith --seed-base 1 --seed-count 8 \
              --profile "$profile" | tee "results/$profile-generate.log"
            python3 compiler/tools/csmith_probe.py --probe \
              --cases-dir "$RUNNER_TEMP/csmith-$profile" \
              --artifacts-dir "$RUNNER_TEMP/csmith-results-$profile" \
              --include-dir "$CSMITH_INCLUDE" --preprocess-c \
              --max-wall-seconds 300 --run-timeout 10 \
              --driver "$driver" \
              --compiler-sha "$COMPILER_SHA" --frontend-sha "$FRONTEND_SHA" \
              --minimum-native 0 --omit-unreferenced-static-bodies \
              | tee "results/$profile-probe.log"
            cp "$RUNNER_TEMP/csmith-results-$profile/summary.json" "results/$profile-summary.json"
          done
          python3 - <<'PY'
          import json
          from pathlib import Path
          for feature in ("pointers","arrays","structs"):
              name="restricted-"+feature
              d=json.loads(Path("results/"+name+"-summary.json").read_text())
              assert d["total_seeds"] == d["manifest_total_seeds"] == 8, d
              assert d["generator_profile"] == name, d
              assert d["omit_unreferenced_static_bodies"] is True, d
              assert d["reference_agreed"] >= d["passed"], d
              assert d["counts"]["budget-exhausted"] == 0, d
              print("M10_STRUCTURAL_PROFILE",name,json.dumps(d,sort_keys=True),flush=True)
          PY
      - name: Save complete original and hashed preprocessed sources and failure evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m10-structural-profiles-original-seeds
          path: |
            results/
            ${{ runner.temp }}/csmith-restricted-pointers/
            ${{ runner.temp }}/csmith-restricted-arrays/
            ${{ runner.temp }}/csmith-restricted-structs/
            ${{ runner.temp }}/csmith-results-restricted-pointers/
            ${{ runner.temp }}/csmith-results-restricted-arrays/
            ${{ runner.temp }}/csmith-results-restricted-structs/
          if-no-files-found: ignore
          retention-days: 14
