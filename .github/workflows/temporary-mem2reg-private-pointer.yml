name: Temporary mem2reg private local parity regression
on:
  pull_request:
    paths:
      - '.github/workflows/temporary-mem2reg-private-pointer.yml'
permissions:
  contents: read
jobs:
  mem2reg:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    env:
      SOURCE_SHA: 574e845f806f8b454a1f0d0539625694d1c4acc6
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: ${{ env.SOURCE_SHA }}
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Verify pinned source and isolate native core
        run: |
          set -euo pipefail
          test "$(git -C compiler rev-parse HEAD)" = "$SOURCE_SHA"
          cat > compiler/Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir", "crates/opt", "crates/backend", "crates/backend-x86", "crates/backend-aarch64"]
          EOF
          rm -f compiler/Cargo.lock
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: mem2reg-private-local-parity
      - name: Run all typed and legacy mem2reg oracle tests
        working-directory: compiler
        run: cargo test -p compiler-opt --test typed_mem2reg -- --test-threads=4 --nocapture
      - name: Check optimizer library strict Clippy
        working-directory: compiler
        run: cargo clippy -p compiler-opt --lib -- -D warnings
