name: X7 shared machine verified SysV GP-only variadic ELF/GAS cutover
on:
  pull_request:
    branches: [main]
    paths: [.github/workflows/verify-x7-shared-machine-gp-varargs-20261112.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  gp-variadic-c11-oracle:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact compiler candidate
        uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: e3291147c053bb7ec15fd47052592c4c89389d6f
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Build isolated x86 workspace
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = e3291147c053bb7ec15fd47052592c4c89389d6f
          python3 - <<'PY'
          from pathlib import Path
          Path("Cargo.toml").write_text("""[workspace]
          resolver = "2"
          members = ["crates/ir", "crates/opt", "crates/backend", "crates/backend-x86"]
          """)
          PY
      - name: Run direct and indirect GP-only variadic ABI C11 parity, default and explicit opt-in
        run: |
          set -euo pipefail
          cargo test -p compiler-backend-x86 --test native_typeid_indirect_gp_varargs --offline -- --nocapture
          cargo test -p compiler-backend-x86 --features x7-shared-machine-cutover --test native_typeid_indirect_gp_varargs --offline -- --nocapture
          cargo test -p compiler-backend-x86 --no-default-features --features x7-shared-machine-cutover --test native_typeid_indirect_gp_varargs --offline -- --nocapture
          cargo test -p compiler-backend-x86 --features x7-shared-machine-cutover --test x7_shared_machine_native_parity --offline
          cargo test -p compiler-backend-x86 --all-features --lib --offline
          echo X7_SHARED_GP_VARIADIC_C11_GAS_ELF_GREEN
