name: CI M4.9 verified TypeId selected origins
on:
  pull_request:
    paths: ['.github/workflows/m49-selected-origin-2298.yml']
permissions:
  contents: read
jobs:
  selected-origins:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 938634b8adee8563771e09c51a4dc082cbef8eb4
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Resolve compiler Git dependencies
        run: git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
      - name: Exact-source checked TypeId selection, x86 backend regression, strict Clippy
        working-directory: compiler
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "938634b8adee8563771e09c51a4dc082cbef8eb4"
          cargo test -p compiler-backend-x86 --lib selected_origin_proof_tests
          cargo test -p compiler-backend-x86 --lib
          cargo clippy -p compiler-backend-x86 --lib -- -D warnings
