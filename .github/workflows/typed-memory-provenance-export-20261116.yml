name: Memory provenance fixed TypeId fixture migration
on:
  push:
    branches: [verify/typed-memory-provenance-export-20261116]
    paths: ['.github/workflows/typed-memory-provenance-export-20261116.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: e4b10c2d96bbb659420701ca1287e61c9b6507ce
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Verify exact compiler SHA
        run: test "$(git -C compiler rev-parse HEAD)" = "e4b10c2d96bbb659420701ca1287e61c9b6507ce"
      - name: Isolate native IR workspace
        run: |
          cat > compiler/Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir"]
          EOF
          rm -f compiler/Cargo.lock
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: provenance-fixed-typeid-20261116
      - name: Verify independent memory-provenance baseline and full 7 negative/matrix suites
        working-directory: compiler
        run: cargo test -p compiler-ir --test typed_memory_provenance -- --nocapture
      - name: Verify 10 fixed verifier graphs, canonical v3 and native binary codec
        working-directory: compiler
        run: |
          cargo test -p compiler-ir --test native_fixed_verifier_fixtures -- --nocapture
          cargo test -p compiler-ir --test native_fixture_text --test native_module_text_v3 --test native_binary_v1
      - name: Keep independent ABI and verifier mutation tests green
        working-directory: compiler
        run: |
          cargo test -p compiler-ir --test typed_module_abi --test typed_opcode_types --test typed_value_flow
          cargo test -p compiler-ir --test typed_verifier_generated --test typed_verifier_parity
      - name: Strict scoped Clippy
        working-directory: compiler
        run: |
          cargo clippy -p compiler-ir --no-deps --test typed_memory_provenance --test native_fixed_verifier_fixtures -- -D warnings
