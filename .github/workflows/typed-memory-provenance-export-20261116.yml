name: Capture original memory provenance TypeId graphs
on:
  push:
    branches: [verify/typed-memory-provenance-export-20261116]
    paths: ['.github/workflows/typed-memory-provenance-export-20261116.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 9e62178bdfb18f02e5f3fa81878e96b832a592b4
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Verify pinned source SHA
        run: test "$(git -C compiler rev-parse HEAD)" = "9e62178bdfb18f02e5f3fa81878e96b832a592b4"
      - name: Isolate native IR workspace
        run: |
          cat > compiler/Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir"]
          EOF
          rm -f compiler/Cargo.lock
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: provenance-native-20261116
      - name: Capture original fixed local and joined modules
        working-directory: compiler
        run: cargo test -p compiler-ir --test typed_memory_provenance export_original_fixed_provenance_graphs -- --nocapture
      - name: Verify all original pointer-provenance matrices
        working-directory: compiler
        run: cargo test -p compiler-ir --test typed_memory_provenance -- --nocapture
