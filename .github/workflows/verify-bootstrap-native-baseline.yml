name: Bootstrap native baseline comparison
on:
  pull_request:
    paths: ['.github/workflows/verify-bootstrap-native-baseline.yml']
permissions:
  contents: read
jobs:
  baseline:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: unchanged-base
            sha: 891472a323ff66b3ba47bd979efcc7f6f52dc04d
          - label: current-main
            sha: 38defab5edf9ef53e667a938b69d4b6dc3c87c6a
    env:
      CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: ${{ matrix.sha }}
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
          path: compiler
      - name: Verify checkout and permit public dependency fetch
        run: |
          set -euo pipefail
          test "$(git -C compiler rev-parse HEAD)" = "${{ matrix.sha }}"
          git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
          echo "BASELINE_SHA=${{ matrix.sha }}"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler/tools/mini-c-driver -> target
          key: bootstrap-native-baseline
      - name: Unmodified native Mini-C unit tests
        run: cargo test --release --manifest-path compiler/tools/mini-c-driver/Cargo.toml --lib
