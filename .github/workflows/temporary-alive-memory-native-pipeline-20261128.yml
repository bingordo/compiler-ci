# Temporary exact-source T5 generated CFG native input identity proof gate.
name: Temporary Alive AL04 native memory pipeline
on:
  pull_request:
    paths:
      - '.github/workflows/temporary-alive-memory-native-pipeline-20261128.yml'
permissions:
  contents: read
jobs:
  al04-native-memory:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      SOURCE_SHA: 1b93fefea5e30494d6677138ff00d264038e4543
      CARGO_INCREMENTAL: '0'
      CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
    steps:
      - name: Checkout exact compiler source
        uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: ${{ env.SOURCE_SHA }}
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Verify exact source and isolate optimizer
        run: |
          set -euo pipefail
          test "$(git -C compiler rev-parse HEAD)" = "$SOURCE_SHA"
          echo "Exact compiler source SHA: $SOURCE_SHA"
          cat > compiler/Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir", "crates/opt", "crates/backend", "crates/backend-x86", "crates/backend-aarch64"]
          EOF
          rm -f compiler/Cargo.lock
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: temporary-alive-memory-native-pipeline
      - name: Focused Clippy
        working-directory: compiler
        run: cargo clippy -p compiler-opt --test alive_lite -- -D clippy::all -A clippy::too_many_arguments -A clippy::needless_lifetimes -A clippy::empty_line_after_doc_comments -A clippy::collapsible_if -A clippy::collapsible_match -A clippy::needless_range_loop -A clippy::needless_borrows_for_generic_args -A clippy::type_complexity -A clippy::unnecessary_lazy_evaluations
      - name: Ordinary Alive-lite including six AL04 direct native source parity
        working-directory: compiler
        run: cargo test -p compiler-opt --test alive_lite -- --nocapture
      - name: Install Z3
        run: sudo apt-get update -qq && sudo apt-get install -y z3
      - name: Affected T5 and AL04 native pipeline external Z3 proofs
        working-directory: compiler
        run: |
          set -euo pipefail
          for test in \
            t5_exact_local_memory_actual_pass_proofs \
            al04_static_checked_local_word_real_passes_and_alias_negatives \
            al04_symbolic_checked_index_actual_passes_and_sat_controls \
            al04_parameterized_checked_word_matrix_real_passes_and_sat_controls \
            al04_byte_lanes_mixed_width_real_passes_and_sat_mutants \
            al04_wide_memory_overlapping_widths_smt_and_independent_expectations \
            al04_p3b_real_changed_mixed_width_passes_and_alias_mutants \
            al04_p3c_narrow_read_changed_pass_proofs_and_sat_controls \
            al04_p3c2_store_to_load_changed_proofs_and_smt_mutants \
            al04_p3c3_two_origin_phi_changed_proofs_sat_and_independent_values \
            al04_p3c3b_actual_optimizer_byte_composition_proofs; do
            cargo test -p compiler-opt --test alive_lite "$test" -- --ignored --nocapture --test-threads=1
          done
