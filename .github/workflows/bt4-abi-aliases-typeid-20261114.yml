name: BT4 AArch64 TypeId original mixed ABI alias C11 and machine parity
on:
  push:
    branches: [ci/bt4-abi-aliases-typeid-20261114]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  old-call-retirement:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 1a4800cd31cd9ab11e5e02f89efdc4bb06da3a01
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Isolate exact-source backend workspace
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 1a4800cd31cd9ab11e5e02f89efdc4bb06da3a01
          python3 - <<'PY'
          from pathlib import Path
          Path("Cargo.toml").write_text("""[workspace]
          resolver = "2"
          members = ["crates/ir", "crates/backend", "crates/backend-aarch64"]
          """)
          PY
      - name: Check native AArch64 backend test quality and old caller absence
        run: |
          set -euo pipefail
          if grep -nE '(compiler_backend::Backend|machine::select\(|compiler_ir::Function)' crates/backend-aarch64/tests/abi_aliases.rs; then
            echo "BT4 original ABI test still depends on old Function backend"; exit 1
          fi
          cargo check -p compiler-backend-aarch64 --all-targets
          cargo test -p compiler-backend-aarch64 --test abi_aliases -- --nocapture
          cargo test -p compiler-backend-aarch64 --tests
          cargo clippy -p compiler-backend-aarch64 --all-targets -- -D warnings
      - name: Install native AArch64 C oracle tools
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu qemu-user
      - name: Execute original aliased arguments C11 ELF GAS and PIC modes under QEMU
        env:
          COMPILER_REQUIRE_AARCH64_QEMU: "1"
        run: |
          set -euo pipefail
          cargo test -p compiler-backend-aarch64 --test abi_aliases -- --nocapture
          cargo test -p compiler-backend-aarch64 --test typeid_abi_calls_native direct_typeid_mixed_width_alias_and_repeated_stack_arguments -- --nocapture
          echo BT4_ORIGINAL_ALIASED_ABI_TYPEID_QEMU_PASS
