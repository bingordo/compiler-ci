name: Candidate x86 physical streaming 3284
on:
  pull_request:
    paths: ['.github/workflows/verify-x86-stream-physical-3284.yml']
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: ce56f330c1c1e5636f998638f8230b3caf4412d8
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Verify exact revision and isolate workspace
        run: |
          test "$(git -C compiler rev-parse HEAD)" = "ce56f330c1c1e5636f998638f8230b3caf4412d8"
          git -C compiler rev-parse HEAD | tee -a "$GITHUB_STEP_SUMMARY"
          cat > compiler/Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir", "crates/opt", "crates/backend", "crates/backend-x86", "crates/backend-aarch64", "crates/backend-riscv64", "crates/backend-wasm"]
          exclude = ["tools/mini-c-driver"]
          EOF
          rm -f compiler/Cargo.lock
      - name: Workspace compilation and streaming regression
        working-directory: compiler
        run: |
          cargo check --workspace
          cargo test -p compiler-backend-x86 --test stream_physical_emission
      - name: Alternate selector configurations
        if: ${{ !cancelled() }}
        working-directory: compiler
        run: |
          cargo check -p compiler-backend-x86 --no-default-features
          cargo check -p compiler-backend-x86 --no-default-features --features x7-production-generated-add
          cargo check -p compiler-backend-x86 --features x7-typeid-source-dag-optin
      - name: All x86 tests including native ELF and GAS oracles
        if: ${{ !cancelled() }}
        working-directory: compiler
        run: cargo test -p compiler-backend-x86 --no-fail-fast
