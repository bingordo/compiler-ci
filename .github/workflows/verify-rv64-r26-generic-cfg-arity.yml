name: RV64 R26 generic CFG candidate
on:
  workflow_dispatch:
  push:
    branches: ['ci/rv64-r26-generic-cfg-arity']
    paths: ['.github/workflows/verify-rv64-r26-generic-cfg-arity.yml']
permissions:
  contents: read
  statuses: write
jobs:
  rv64-cfg:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.CI_KEY }}
      - run: ssh-keyscan github.com >> ~/.ssh/known_hosts
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: e08c8abda16987dc32249e428a293f7053341140
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - run: test "$(git -C compiler rev-parse HEAD)" = e08c8abda16987dc32249e428a293f7053341140
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Install RV64 toolchain
        run: sudo apt-get install -y --no-install-recommends gcc-riscv64-linux-gnu binutils-riscv64-linux-gnu qemu-user
      - name: Check backend and source regressions
        working-directory: compiler
        run: |
          cargo test -p compiler --test riscv64_generic_cfg
          cargo test -p compiler-backend-riscv64 --lib --tests
          cargo test -p compiler --test riscv64_load_ir --test riscv64_source_preview
          cargo clippy -p compiler-backend-riscv64 --tests -- -D warnings
      - name: Publish candidate status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          state=failure
          if [ "$JOB_STATUS" = success ]; then state=success; fi
          gh api "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state="$state" -f context=rv64-r26-generic-cfg \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            -f description="Compiler e08c8abda16987dc32249e428a293f7053341140"
