# Temporary source-pinned acceptance for staged FP TypeId Op support.
# No compiler-repository Actions. Do not merge this CI workflow.
name: FP TypeId opcode v1 acceptance
on:
  push:
    branches: [ci/fp-typeid-op-pr1635-20261115]
    paths: [.github/workflows/fp-typeid-op-pr1635.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fp-typeid-op:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      SOURCE_SHA: c271140e6873bfa4ca86997e23b946b725bd7fe2
      CARGO_INCREMENTAL: '0'
    steps:
      - name: Checkout exact compiler source
        uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: c271140e6873bfa4ca86997e23b946b725bd7fe2
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Verify candidate SHA and limit workspace
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C compiler rev-parse HEAD)" = "$SOURCE_SHA"
          cat > compiler/Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir", "crates/opt", "crates/backend", "crates/backend-x86", "crates/backend-aarch64"]
          EOF
          rm -f compiler/Cargo.lock
          rustc --version
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: fp-typeid-op-pr1635
      - name: Focused FP type and codec tests
        working-directory: compiler
        run: |
          set -euo pipefail
          cargo test -p compiler-ir --test native_fp_vector_semantics
          cargo test -p compiler-ir --test native_fp_opcode_roundtrip
      - name: Full compiler IR regression tests
        working-directory: compiler
        run: cargo test -p compiler-ir
      - name: Compile optimizer and native backends against new shared Op
        working-directory: compiler
        run: |
          set -euo pipefail
          cargo check -p compiler-opt --lib
          cargo check -p compiler-backend-x86 -p compiler-backend-aarch64 --all-targets
      - name: Strict Clippy on IR and optimizer
        working-directory: compiler
        run: |
          set -euo pipefail
          cargo clippy -p compiler-ir --all-targets -- -D warnings
          cargo clippy -p compiler-opt --lib -- -D warnings
