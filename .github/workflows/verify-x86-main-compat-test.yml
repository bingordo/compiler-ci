name: Verify X5 post-merge T5 compatibility fix
on:
  push:
    branches: [main]
    paths: ['.github/workflows/verify-x86-main-compat-test.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: integration/x86-x5-test-compat-20261102
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - run: git rev-parse HEAD
      - name: Trim optional frontend workspaces
        run: |
          cat > Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir","crates/opt","crates/backend","crates/backend-x86"]
          EOF
          rm -f Cargo.lock
      - uses: Swatinem/rust-cache@v2
        with:
          key: x86-main-compat-postmerge
      - name: Recheck T5 structural assertion and complete core
        run: |
          set -euo pipefail
          cargo test -p compiler-backend-x86 --test t5_x86_semantics t5_selected_cmp_flags_and_register_widths -- --nocapture
          cargo test -p compiler-ir -p compiler-opt -p compiler-backend -p compiler-backend-x86
          echo 'X86_MAIN_COMPAT status=PASS'
