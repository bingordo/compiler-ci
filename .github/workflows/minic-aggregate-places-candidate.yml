name: Mini-C discarded aggregate result candidate
on:
  pull_request:
    paths:
      - '.github/workflows/minic-aggregate-places-candidate.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-24.04
    outputs:
      sha: ${{ steps.source.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: main
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Resolve main
        id: source
        run: echo "sha=$(git -C compiler rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  candidate:
    needs: snapshot
    strategy:
      fail-fast: false
      matrix:
        variant: [baseline, integrated, combined]
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: ${{ needs.snapshot.outputs.sha }}
          fetch-depth: 0
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Integrate exact candidate with current main
        if: matrix.variant != 'baseline'
        run: |
          set -euo pipefail
          git -C compiler rev-parse HEAD | tee -a "$GITHUB_STEP_SUMMARY"
          git -C compiler -c user.name=compiler-ci -c user.email=compiler-ci@users.noreply.github.com merge --no-ff --no-edit 424c1ab05ad6dc1c9e0ab7b157c755cebc8566eb
          git -C compiler log -1 --format='%H parents=%P' | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Integrate shared native literal candidate
        if: matrix.variant == 'combined'
        run: |
          set -euo pipefail
          git -C compiler -c user.name=compiler-ci -c user.email=compiler-ci@users.noreply.github.com merge --no-ff --no-edit 56e19801dd41011039d38b7ec8ddf3fe951c3c17
          git -C compiler log -1 --format='%H parents=%P' | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Record source and frontend pin
        run: |
          set -euo pipefail
          git -C compiler rev-parse HEAD | tee -a "$GITHUB_STEP_SUMMARY"
          grep 'rev =' compiler/tools/mini-c-driver/Cargo.toml | tee -a "$GITHUB_STEP_SUMMARY"
          python3 - <<'PY'
          from pathlib import Path
          p=Path("compiler/tools/mini-c-driver/Cargo.toml")
          s=p.read_text()
          assert s.count("ssh://git@github.com/bingordo/mini-c.git")==2
          p.write_text(s.replace("ssh://git@github.com/bingordo/mini-c.git","https://github.com/bingordo/mini-c.git"))
          PY
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler/tools/mini-c-driver -> target
          key: minic-aggregate-places-candidate
      - name: GCC aggregate place and discarded call regression
        if: matrix.variant != 'baseline'
        run: cargo test --manifest-path compiler/tools/mini-c-driver/Cargo.toml --test aggregate_places -- --nocapture
      - name: Native literal GCC ELF and GAS regression
        if: matrix.variant == 'combined'
        run: cargo test --manifest-path compiler/tools/mini-c-driver/Cargo.toml --test native_float_literals -- --nocapture
      - name: Adapter unit tests on all variants
        if: success() || failure()
        run: cargo test --manifest-path compiler/tools/mini-c-driver/Cargo.toml --lib
      - name: Replay 32 structure seeds
        if: success() || failure()
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -qq -y --no-install-recommends csmith libcsmith-dev gcc clang
          [[ $(dpkg-query -W -f='${Version}' csmith) == 2.3.0-* ]]
          header=$(dpkg -L libcsmith-dev | grep '/csmith.h$' | head -n1)
          test -s "$header"
          compiler_sha=$(git -C compiler rev-parse HEAD)
          manifest=compiler/tools/mini-c-driver/Cargo.toml
          frontend=$(PYTHONPATH=compiler/tools python3 -c 'from csmith_probe import pinned_frontend_revision; import sys; print(pinned_frontend_revision(open(sys.argv[1]).read()))' "$manifest")
          cargo build --manifest-path "$manifest" --bin compiler-mini-c
          mkdir -p "$RUNNER_TEMP/struct-evidence"
          evidence="$RUNNER_TEMP/struct-evidence"
          failure=0
          for profile in restricted-structs; do
            cases="$evidence/$profile/cases"
            results="$evidence/$profile/results"
            python3 compiler/tools/csmith_probe.py --generate --cases-dir "$cases" --csmith csmith --seed-base 1 --seed-count 32 --profile "$profile"
            python3 compiler/tools/csmith_probe.py --probe --cases-dir "$cases" --artifacts-dir "$results" --include-dir "$(dirname "$header")" --preprocess-c --driver "$PWD/compiler/tools/mini-c-driver/target/debug/compiler-mini-c" --compiler-sha "$compiler_sha" --frontend-sha "$frontend" --minimum-native 32 --run-timeout 5 --max-wall-seconds 300 --omit-unreferenced-static-bodies || failure=1
            if [[ -s "$results/results.jsonl" ]]; then
              python3 - "$results/results.jsonl" "$profile" <<'PY'
          import json,sys
          for line in open(sys.argv[1]):
              r=json.loads(line)
              print("STRUCTURAL_RESULT", sys.argv[2], json.dumps({k:r.get(k) for k in ("seed","classification","compiler","frontend_diagnostic")}))
          PY
            else
              failure=1
            fi
          done
          exit "$failure"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: discarded-aggregate-csmith-evidence-${{ matrix.variant }}
          path: ${{ runner.temp }}/struct-evidence
          retention-days: 14
