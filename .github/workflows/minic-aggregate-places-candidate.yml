name: Mini-C merged storage and bitfield ABI batch
on:
  pull_request:
    paths:
      - '.github/workflows/minic-aggregate-places-candidate.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  storage-triage:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 97456af759ebe1e77d1a168cdae7e5f309667035
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Probe unit tests
        run: |
          git -C compiler rev-parse HEAD
          cd compiler/tools
          python3 -m unittest test_csmith_probe
      - uses: actions/download-artifact@v4
        with:
          name: minic-bitfield-abi-evidence-bitfield-abi
          run-id: '46045840708'
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/storage-replay
      - name: Exact failure and source inventory
        env:
          INPUTS: ${{ runner.temp }}/storage-replay
        run: |
          set -euo pipefail
          PYTHONPATH=compiler/tools python3 - <<'PY'
          import hashlib,json,os,pathlib,re
          from csmith_probe import is_explicit_frontend_rejection
          root=pathlib.Path(os.environ["INPUTS"])
          for profile in ("restricted-bitfields","restricted-unions","restricted-storage"):
              results=root/profile/"results"
              for line in (results/"results.jsonl").read_text().splitlines():
                  row=json.loads(line)
                  if row["classification"] not in ("compiler-crash","unsupported-front-end"):
                      continue
                  seed=row["seed"]
                  diagnostic=row["compiler"]["stderr_preview"].splitlines()[0]
                  classified=row["compiler"]["exit_code"]==1 and is_explicit_frontend_rejection(diagnostic.encode())
                  print("STORAGE_GAP",profile,seed,classified,diagnostic,flush=True)
                  if profile!="restricted-bitfields":
                      continue
                  pre=results/f"case-{seed}"/"candidate.i"
                  assert hashlib.sha256(pre.read_bytes()).hexdigest()==row["preprocessed_sha256"]
                  text=pre.read_text()
                  for match in re.finditer(r"(?m)^\s*(?:struct|union)\s+\w+\s*\{[^{}]*\}\s*;",text):
                      if ":" in match.group():
                          print("BITFIELD_LAYOUT",seed,match.group()[:2000],flush=True)
          PY
