      - name: Validate eight full-M checked division operations against GAS
        working-directory: compiler
        run: |
          set -euo pipefail
          for kind in divs32 divs64 divu32 divu64 rems32 rems64 remu32 remu64; do
            case "$kind" in
              divs32) op=divw ;;
              divs64) op=div ;;
              divu32) op=divuw ;;
              divu64) op=divu ;;
              rems32) op=remw ;;
              rems64) op=rem ;;
              remu32) op=remuw ;;
              remu64) op=remu ;;
            esac
            cargo run -p compiler-backend-riscv64 --example rv64_leaf -- \
              "/tmp/rv64_${kind}.o" "/tmp/rv64_${kind}.s" "$kind" --isa=rv64im
            grep -Eq "^[[:space:]]+${op} x[0-9]+, x[0-9]+, x[0-9]+$" "/tmp/rv64_${kind}.s"
            grep -q "    ebreak" "/tmp/rv64_${kind}.s"
            grep -q "    bne x" "/tmp/rv64_${kind}.s"
            riscv64-linux-gnu-as -march=rv64im -mabi=lp64 \
              "/tmp/rv64_${kind}.s" -o "/tmp/rv64_${kind}_gas.o"
            riscv64-linux-gnu-objcopy -O binary -j .text \
              "/tmp/rv64_${kind}.o" "/tmp/rv64_${kind}_direct.bin"
            riscv64-linux-gnu-objcopy -O binary -j .text \
              "/tmp/rv64_${kind}_gas.o" "/tmp/rv64_${kind}_gas.bin"
            cmp "/tmp/rv64_${kind}_direct.bin" "/tmp/rv64_${kind}_gas.bin"
            riscv64-linux-gnu-objdump -dr "/tmp/rv64_${kind}.o" | grep -w "$op"
            rm -f "/tmp/forbidden_${kind}.o" "/tmp/forbidden_${kind}.s"
            if cargo run -p compiler-backend-riscv64 --example rv64_leaf -- \
              "/tmp/forbidden_${kind}.o" "/tmp/forbidden_${kind}.s" "$kind" --isa=rv64izmmul \
              > "/tmp/reject_${kind}.log" 2>&1; then
              echo "ERROR: Zmmul-only mode accepted full M $kind" >&2
              exit 1
            fi
            grep -q "unsupported scalar instruction" "/tmp/reject_${kind}.log"
            test ! -e "/tmp/forbidden_${kind}.o"
            test ! -e "/tmp/forbidden_${kind}.s"
          done
