# Exact-source BT4 GT-1 canonical 6/8/16 outgoing-ABI acceptance.
name: BT4 GT1 native outgoing SysV 6 8 16 differential
on:
  pull_request:
    paths: ['.github/workflows/bt4-gt1-outgoing-sysv-20261115.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  aarch64-native:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 35
    env:
      CARGO_INCREMENTAL: '0'
      SOURCE_SHA: cc2d7415210e5cf1640cd33790418788f9243ab4
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: cc2d7415210e5cf1640cd33790418788f9243ab4
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Verify exact compiler and persistent source boundary
        run: |
          set -euo pipefail
          test "$(git -C compiler rev-parse HEAD)" = "$SOURCE_SHA"
          python3 compiler/tools/check_bt4_backend_boundary.py
      - name: Isolate native ARM core Rust workspace
        run: |
          cat > compiler/Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir", "crates/opt", "crates/backend", "crates/backend-x86", "crates/backend-aarch64"]
          EOF
          rm -f compiler/Cargo.lock
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: bt4-gt1-outgoing-sysv-20261115
      - name: Strict native ARM full AArch64 all-target compile
        working-directory: compiler
        run: RUSTFLAGS='-D warnings' cargo check -p compiler-backend-aarch64 --all-targets
      - name: Native historical machine quality four exact byte tests and five C oracles
        working-directory: compiler
        run: cargo test -p compiler-backend-aarch64 --test typeid_historical_pressure -- --nocapture
      - name: AArch64 all-native TypeId after complete Function historical source deletion
        working-directory: compiler
        run: cargo test -p compiler-backend-aarch64 --all-targets -- --test-threads=1
      - name: Strict AArch64 native test Clippy
        working-directory: compiler
        run: cargo clippy -p compiler-backend-aarch64 --lib --test typeid_historical_pressure -- -D warnings
  full-workspace:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      CARGO_INCREMENTAL: '0'
      SOURCE_SHA: cc2d7415210e5cf1640cd33790418788f9243ab4
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: cc2d7415210e5cf1640cd33790418788f9243ab4
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.CI_KEY }}
      - name: Pin exact compiler and source-boundary test
        run: |
          set -euo pipefail
          test "$(git -C compiler rev-parse HEAD)" = "$SOURCE_SHA"
          ssh-keyscan github.com >> "$HOME/.ssh/known_hosts"
          python3 compiler/tools/check_bt4_backend_boundary.py
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler
          key: bt4-x86-final-budget-full-1874
      - name: GT-1 physical witness coverage and deliberate deleted Jcc/64bit spill mutants
        working-directory: compiler
        run: cargo test -p compiler-backend-x86 --test bt4_gt1_coverage_manifest -- --nocapture
      - name: GT-1 canonical twelve families including outgoing 6 8 16 SysV C GAS ELF and argument permutation mutants
        working-directory: compiler
        run: cargo test -p compiler-backend-x86 --test bt4_gt1_generated_native_differential -- --nocapture
      - name: Existing GT-2 Alive-lite proof bridge shares canonical 12-family source
        working-directory: compiler
        run: cargo test -p compiler-opt --test alive_lite gt2_generated_typeid -- --nocapture
      - name: Original six signed i32 compare-branches direct CMP Jcc native 2/0 C ELF/GAS
        working-directory: compiler
        run: cargo test -p compiler-backend-x86 --test bt4_x86_historical_signed_cmp_branches_native -- --nocapture
      - name: Original 7/13 64-bit pointer parallel swap native TypeId physical C GAS/ELF
        working-directory: compiler
        run: cargo test -p compiler-backend-x86 --test bt4_x86_historical_wide_copy_cycle_native -- --nocapture
      - name: Original 4-value pointer PHI two-local source 64-bit spill C ELF/GAS
        working-directory: compiler
        run: cargo test -p compiler-backend-x86 --test bt4_x86_historical_pointer_phi_native -- --nocapture
      - name: Original indexed local memory store-load native LEA, 64-bit spill, R11D and C ELF/GAS
        working-directory: compiler
        run: cargo test -p compiler-backend-x86 --test bt4_x86_historical_memory_roundtrip_native -- --nocapture
      - name: Original six-argument SingleLive fifth-only-live native ABI ingress ELF/GAS C
        working-directory: compiler
        run: cargo test -p compiler-backend-x86 --test bt4_x86_single_live_ingress_native -- --nocapture
      - name: Original LiveThrough two-block dead PHI C11 combined ELF/GAS physical oracle
        working-directory: compiler
        run: cargo test -p compiler-backend-x86 --test bt4_x86_historical_dead_phi_native -- --nocapture
      - name: BT4 original native 0/2/4 real GP homes and 9/15 emitted bytes C/ELF/GAS acceptance
        working-directory: compiler
        run: cargo test -p compiler-backend-x86 --test bt4_x86_physical_budget_native -- --nocapture
      - name: Native TypeId physical bank 0/2/8/9/14/15-budget + C/ELF/GAS references
        working-directory: compiler
        run: cargo test -p compiler-backend-x86 --test bt4_x86_profile_wide_native -- --nocapture
      - name: Native BT4 cyclic PHI and 17-argument rejection source regression
        working-directory: compiler
        run: cargo test -p compiler-backend-x86 --test bt4_x86_historical_arity_phi_native
      - name: Entire compiler workspace all-targets with frontend and driver
        working-directory: compiler
        run: cargo check --workspace --all-targets
      - name: Both production TypeId backends optimized without historical feature
        working-directory: compiler
        run: cargo check -p compiler-backend-x86 -p compiler-backend-aarch64 --release --lib
      - name: Strict original native x86 ProfileWide pressure/ABI Clippy
        working-directory: compiler
        run: cargo clippy -p compiler-backend-x86 --lib --test bt4_x86_profile_wide_native --test bt4_x86_physical_budget_native --test bt4_x86_historical_dead_phi_native --test bt4_x86_single_live_ingress_native --test bt4_x86_historical_memory_roundtrip_native --test bt4_x86_historical_pointer_phi_native --test bt4_x86_historical_wide_copy_cycle_native --test bt4_x86_historical_signed_cmp_branches_native --test bt4_gt1_generated_native_differential --test bt4_gt1_coverage_manifest -- -D warnings
      - name: Full retained x86 backend library historical machine and ABI oracles
        working-directory: compiler
        run: cargo test -p compiler-backend-x86 --lib -- --test-threads=1
      - name: Native x86 narrow SSA CFG and flags/call regressions
        working-directory: compiler
        run: |
          cargo test -p compiler-backend-x86 --test m4_scalar_native --test native_typeid_call_liveness
          cargo test -p compiler-backend-x86 --test native_typeid_fused_cmp_select --test review_narrow_shift_oracle
          cargo test -p compiler-backend-x86 --test t5_x86_flag_provenance --test typed_i64_compare_branch_native
      - name: Positive boundary 16 mixed SysV arguments executable C11 ELF and GAS
        working-directory: compiler
        run: cargo test -p compiler-backend-x86 --test mixed_sixteen_call_native -- --nocapture
      - name: x86 native CMOV ABI and compiler optimizer original C references
        working-directory: compiler
        run: |
          cargo test -p compiler-opt --test if_conversion_typeid_remaining
          cargo test -p compiler-backend-x86 --test native_typeid_select_cmov --test typed_alias_calls_native
      - name: Check parsed JSON coverage counts, source pin and real physical witnesses
        working-directory: compiler
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path("target/bt4-gt1-coverage/physical-manifest.json").read_text())
          assert data["schema_version"] == 1
          assert data["compiler_sha"] == "cc2d7415210e5cf1640cd33790418788f9243ab4"
          assert data["ir_format"] == "native-v3"
          assert data["machine_proof"] == "NOT_ADMITTED"
          assert data["execution_status"] == "SEPARATE_GT1_C_GAS_ELF_TEST_REQUIRED"
          records=data["records"]
          assert data["families"] == 12 and data["seeds_per_family"] == 4
          assert len(records) == 576
          assert len(records) == data["families"]*data["seeds_per_family"]*12
          calls=[r for r in records if r["family"] in (9,10,11)]
          assert len(calls) == 144
          assert all(r["calls"] == 1 for r in calls)
          assert all(r["store32"] > 0 for r in calls if r["family"] in (10,11))
          assert sum(r["calls"] for r in records) == 144
          keys={(r["family"],r["seed"],r["gp_budget"],r["pic"],r["framed"]) for r in records}
          assert len(keys) == len(records)
          assert all(r["physical_ops"] > 0 and r["illegal_mem_to_mem"] == 0 for r in records)
          for r in records:
              if r["family"] == 7 and r["gp_budget"] == 0:
                  assert r["stack_load64"] > 0 and r["stack_store64"] > 0
              if r["family"] == 6:
                  assert r["lea64"] > 0 and r["load32"] > 0 and r["store32"] > 0
          print("BT4_GT1_JSON_VALIDATED",len(records), "rows; proof NOT_ADMITTED")
          PY
      - name: Upload deterministic TypeId physical coverage JSON
        uses: actions/upload-artifact@v4
        with:
          name: bt4-gt1-physical-coverage
          path: compiler/target/bt4-gt1-coverage/physical-manifest.json
          if-no-files-found: error
      - name: Preserve reproducible generated TypeId failures
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: bt4-gt1-repro-${{ github.run_id }}
          path: compiler/target/bt4-gt1-repros/**
          if-no-files-found: ignore
