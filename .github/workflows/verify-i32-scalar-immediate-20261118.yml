name: pinned 32-bit scalar ADD SUB immediate forms and C11 oracle
on:
  push:
    branches: [main]
    paths: [.github/workflows/verify-i32-scalar-immediate-20261118.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  generated-i32-forms:
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 78278c4c66803245ca87e7567b113001ebed9bfb
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Verify exact source pin and form catalog
        run: |
          set -euo pipefail
          test "$(git -C compiler rev-parse HEAD)" = "78278c4c66803245ca87e7567b113001ebed9bfb"
          (cd compiler && python3 tools/regen_x86_forms.py --check)
          git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: x86-i32-generated-alu-immediate-20261118
      - name: Source-generated form and executed C11 native witnesses
        working-directory: compiler
        run: |
          set -euo pipefail
          cargo test -p compiler-backend-x86 --lib scalar_immediate::tests -- --nocapture
          cargo test -p compiler-backend-x86 --lib reviewed_scalar_immediate32_native_tests -- --nocapture
          cargo test -p compiler-backend-x86 --lib reviewed_scalar_alu_immediate -- --nocapture
          cargo test -p compiler-backend-x86 --lib
          cargo test -p compiler-backend --lib
          cargo test -p compiler-backend-aarch64 --lib
          cargo clippy -p compiler-backend --lib -- --no-deps -D warnings
          cargo clippy -p compiler-backend-x86 --lib -- --no-deps -D warnings -A dead_code
