name: Regenerate verified memory-source operand path data
on:
  pull_request:
    paths:
      - '.github/workflows/x7-memory-latency-generate-20261121.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regenerate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: e6edaa80246caab922cf88dfdc6218355e4283bf
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Verify exact compiler source revision
        run: test "$(git -C compiler rev-parse HEAD)" = "e6edaa80246caab922cf88dfdc6218355e4283bf"
      - name: Download the exact previously source-reviewed uops.info XML
        run: |
          set -euo pipefail
          curl -fL --retry 2 --max-time 600 https://uops.info/instructions.xml -o instructions.xml
          test "$(sha256sum instructions.xml | cut -d' ' -f1)" = "e5e702caaf04c4fc1f75192a9bbe4d8554b3e174f7933a14d124cc33ca677ab3"
      - name: Generate checked source-provenance and memory latency Rust data
        working-directory: compiler
        run: |
          set -euo pipefail
          python3 tools/regen_x86_memory_operand_latencies.py --xml ../instructions.xml --write
          python3 - <<'PY'
          from pathlib import Path
          for tag,path in [
            ("GENJSON","data/x86_memory_operand_latencies.json"),
            ("GENRUST","crates/backend-x86/src/generated_memory_operand_latencies.rs"),
          ]:
              for line in Path(path).read_text().splitlines():
                  print(tag+":"+line,flush=True)
          PY
