name: M6 Oberon source corpus diagnostic
on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: "Compiler branch, tag, or exact SHA"
        required: true
        type: string
        default: main

permissions:
  contents: read

jobs:
  oberon-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
      CARGO_INCREMENTAL: '0'
    steps:
      - name: Checkout exact compiler candidate
        uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: ${{ inputs.source_ref }}
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Record source revision
        run: git -C compiler rev-parse HEAD
      - name: Resolve pinned public frontend dependencies
        run: git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: m6-oberon-source-v1
      - name: Execute checked Oberon source corpus and native C oracle
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p results
          cargo test --manifest-path compiler/Cargo.toml -p compiler --bin compiler \
            m6_checked_oberon_source_vs_c_oracle -- --nocapture \
            2>&1 | tee results/m6-oberon-source.log
          grep '^M6_OBERON,' results/m6-oberon-source.log | tee -a "$GITHUB_STEP_SUMMARY"
          grep '^M6_OBERON_SUMMARY,' results/m6-oberon-source.log | tee -a "$GITHUB_STEP_SUMMARY"
          test "$(grep -c '^M6_OBERON,' results/m6-oberon-source.log)" -eq 5
      - name: Strict Rust driver Clippy
        run: cargo clippy --manifest-path compiler/Cargo.toml -p compiler --all-targets -- -D warnings
      - name: Preserve M6 source report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m6-oberon-source-corpus
          path: results/m6-oberon-source.log
          if-no-files-found: ignore
          retention-days: 14
