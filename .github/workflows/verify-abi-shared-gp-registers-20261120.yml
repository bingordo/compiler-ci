name: ABI shared GP target register lookup (#2433)
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-abi-shared-gp-registers-20261120.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  x86-native-abi:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 4fb827fa6f697b284fe9e2864a74841f94ec9840
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Pin source to exact candidate and isolate source ABI crates
        run: |
          set -euo pipefail
          test "$(git -C compiler rev-parse HEAD)" = 4fb827fa6f697b284fe9e2864a74841f94ec9840
          test "$(uname -m)" = x86_64
          cat > compiler/Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir","crates/opt","crates/backend","crates/backend-x86"]
          EOF
          rm -f compiler/Cargo.lock
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: abi-gp-registers-x86-20261120
      - name: Run shared physical GP tests and x86 scalar independent call oracle
        working-directory: compiler
        run: |
          set -euo pipefail
          cargo test -p compiler-backend --lib abi_gp
          cargo test -p compiler-backend --lib abi_plan
          cargo test -p compiler-backend-x86 --lib scalar_abi
          cargo test -p compiler-backend-x86 --lib shared_fixed_scalar_parity
          cargo test -p compiler-backend-x86 --test m4_7_scalar_sse_stream_native
          cargo test -p compiler-backend-x86 --test module_signatures
          cargo test -p compiler-backend-x86 --test m4_7_gp_variadic_native
      - name: Strict shared backend Clippy and source-targeted formatting
        working-directory: compiler
        run: |
          set -euo pipefail
          cargo clippy -p compiler-backend --lib -- -D warnings
          rustfmt --edition 2021 --check crates/backend/src/abi_gp.rs
      - name: x86 backend library integration Clippy
        # The merge commit has an unrelated compiler-opt unused import
        # at opt/src/cse.rs:13 introduced concurrently on main; do not
        # modify another workstream's optimizer code for this ABI gate.
        working-directory: compiler
        run: |
          set -euo pipefail
          cargo clippy -p compiler-backend-x86 --lib -- \
            -D warnings -A private_interfaces \
            -A clippy::suspicious_assignment_formatting \
            -A unused_variables -A clippy::too_many_arguments \
            -A clippy::empty_line_after_doc_comments \
            -A unused_imports

  rv64-gp-admission:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 4fb827fa6f697b284fe9e2864a74841f94ec9840
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Pin source, isolate RISC-V backend and source ABI
        run: |
          set -euo pipefail
          test "$(git -C compiler rev-parse HEAD)" = 4fb827fa6f697b284fe9e2864a74841f94ec9840
          cat > compiler/Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir","crates/backend","crates/backend-riscv64"]
          EOF
          rm -f compiler/Cargo.lock
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: abi-gp-registers-rv64-20261120
      - name: Test RISC-V GP admission, native TypeId calls and leaf ELF
        working-directory: compiler
        run: |
          set -euo pipefail
          cargo test -p compiler-backend-riscv64 --lib abi_integer_argument_tests
          cargo test -p compiler-backend-riscv64 --lib
          cargo test -p compiler-backend-riscv64 --test calls
          cargo test -p compiler-backend-riscv64 --test leaf
          cargo clippy -p compiler-backend-riscv64 --lib -- -D warnings
          # Keep existing RISC-V target formatting unchanged; only the new
          # shared ABI module is subject to this PR's rustfmt gate.

  aarch64-checked-shared:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 4fb827fa6f697b284fe9e2864a74841f94ec9840
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Pin source and native ARM host
        run: |
          set -euo pipefail
          test "$(git -C compiler rev-parse HEAD)" = 4fb827fa6f697b284fe9e2864a74841f94ec9840
          test "$(uname -m)" = aarch64
          cat > compiler/Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir","crates/backend","crates/backend-aarch64"]
          EOF
          rm -f compiler/Cargo.lock
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: abi-gp-registers-arm64-20261120
      - name: Check shared GP projector and existing native AAPCS64 call emitter
        working-directory: compiler
        run: |
          set -euo pipefail
          cargo test -p compiler-backend --lib abi_gp
          cargo test -p compiler-backend-aarch64 --lib gp_abi
          cargo test -p compiler-backend-aarch64 --test typeid_abi_calls_native
          cargo test -p compiler-backend-aarch64 --test gp_varargs
          cargo clippy -p compiler-backend -p compiler-backend-aarch64 --lib -- -D warnings
