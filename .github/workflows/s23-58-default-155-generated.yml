name: S23.58 production generated simplification default admission
on:
  pull_request:
    paths:
      - '.github/workflows/s23-58-default-155-generated.yml'
permissions:
  contents: read
jobs:
  verify-default-155:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 573b0c550aed7140a33d43f167e1c88151b3c444
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Check compiler source pin
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C compiler rev-parse HEAD)" = 573b0c550aed7140a33d43f167e1c88151b3c444
          echo "S2358_COMPILER_SHA=$(git -C compiler rev-parse HEAD)"
      - name: Isolate core workspace, keep full opt code unchanged
        shell: bash
        run: |
          set -euo pipefail
          cat > compiler/Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir","crates/opt","crates/backend","crates/backend-x86","crates/backend-aarch64"]
          EOF
          rm -f compiler/Cargo.lock
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler
          key: s2358-default-generated
      - name: Verify 155-rule default and source constants on all integer widths
        working-directory: compiler
        shell: bash
        run: |
          set -euo pipefail
          cargo test -p compiler-opt --lib generated_guarded_admission -- --nocapture
      - name: Check full native optimizer unit tests
        working-directory: compiler
        shell: bash
        run: |
          set -euo pipefail
          cargo test -p compiler-opt --lib
      - name: Verify unchanged earlier 88 rules, opt-out and independent reference
        working-directory: compiler
        shell: bash
        run: |
          set -euo pipefail
          cargo test -p compiler-opt --test native_default_generated_flags
          cargo test -p compiler-opt --test native_s2350_shadow_parity
          cargo check -p compiler-opt --no-default-features
      - name: Check the exact same source/proof-pinned generator and no runtime SMT
        shell: bash
        run: |
          set -euo pipefail
          cd compiler/tools/typeid-rule-gen
          python3 -m unittest -v test_guarded_ssa_codegen test_guarded_batch_proofs test_rules test_ssa_codegen
          python3 guarded_ssa_codegen.py --emit-reviewed-fragment \
            --source pinned/expr_rules.json --source pinned/expr_fusion.json \
            > /tmp/s2358-audited-fragment.rs
          test "$(grep -Fc 'return Some((' /tmp/s2358-audited-fragment.rs)" = 67
      - name: Strict default optimizer Clippy
        working-directory: compiler
        shell: bash
        run: |
          set -euo pipefail
          cargo clippy -p compiler-opt --lib -- -D warnings -A dead_code
