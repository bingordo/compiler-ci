# Temporary exact-source acceptance on compiler-ci only; never run compiler Actions.
# Replay cutover acceptance: exact compiler source pin, triggered from compiler-ci PR.
name: X7 S4 selected canonical TypeId replay source parity
on:
  pull_request:
    paths:
      - '.github/workflows/verify-x7-s4-selected-ir-replay-20261116.yml'
permissions:
  contents: read
jobs:
  canonical-replay-and-source-parity:
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    steps:
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.CI_KEY }}
      - name: Trust GitHub SSH
        run: ssh-keyscan github.com >> ~/.ssh/known_hosts
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 77a0f7f16c2ad941cd0bcd7cf2ed63b6d9c27137
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Assert exact compiler source pin
        run: test "$(git -C compiler rev-parse HEAD)" = "77a0f7f16c2ad941cd0bcd7cf2ed63b6d9c27137"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: x7-s4-selected-native-ir-replay
      - name: Test checked Mini-C and Oberon canonical text/binary selected replay
        shell: bash
        working-directory: compiler
        run: |
          set -euo pipefail
          cargo test -p compiler --test x7_s4_selected_ir_replay -- --nocapture
          cargo test -p compiler --test x7_selected_machine_source -- --nocapture
          cargo test -p compiler --bin compiler x7_s4_source_ir_dump -- --nocapture
          cargo test -p compiler-backend-x86 --lib
          cargo test -p compiler-backend-x86 --no-default-features --lib
          python3 tools/test_x7_s4_executable_source_gate.py -v
          echo X7_S4_SELECTED_IR_REPLAY_INTEGRATION_GREEN
      - name: Full 48 real source/mode GCC differential and size/cost evidence
        shell: bash
        working-directory: compiler
        run: |
          set -euo pipefail
          cargo build -p compiler
          python3 tools/x7_s4_executable_source_gate.py \
            --compiler target/debug/compiler \
            --source-sha 77a0f7f16c2ad941cd0bcd7cf2ed63b6d9c27137 \
            --out ../x7-s4-replay-source-regression \
            --scales 8 24 48 \
            --languages mini_c oberon \
            --modes plain framed pic pic_framed \
            --groups 3
          echo X7_S4_SELECTED_IR_REPLAY_SOURCE_GREEN
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: x7-s4-replay-source-regression
          path: x7-s4-replay-source-regression
          if-no-files-found: warn
