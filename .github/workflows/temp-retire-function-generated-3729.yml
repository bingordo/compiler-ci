name: Temporary TypeId-only optimizer retirement #3729
on:
  pull_request:
    paths: ['.github/workflows/temp-retire-function-generated-3729.yml']
permissions:
  contents: read
jobs:
  retire:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      SOURCE_SHA: ea87825b0f8fdf35080a795f733bc57887dcea56
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: ${{ env.SOURCE_SHA }}
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.CI_KEY }}
      - name: Trust GitHub for private dependency fetches
        run: ssh-keyscan github.com >> ~/.ssh/known_hosts
      - name: Check all-feature optimizer compilation and native TypeId oracles
        working-directory: compiler
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          cargo test -p compiler-opt --lib
          cargo test -p compiler-opt --test typed_core_pipeline --test generated_native_oracle
          cargo check -p compiler
