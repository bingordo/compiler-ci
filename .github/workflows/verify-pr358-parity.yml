# Pin to a specific compiler private commit and compare both verifiers.
name: Verify PR358 TypeId parity corpus
on:
  push:
    branches: [ci/pr358-verifier-parity]
permissions:
  contents: read
jobs:
  parity:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 95a58cb12d4faf24d140d6b654bbc041b72923db
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Confirm pinned revision
        run: test "$(git -C compiler rev-parse HEAD)" = "95a58cb12d4faf24d140d6b654bbc041b72923db"
      - name: Independent core workspace
        run: |
          cat > compiler/Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir", "crates/opt", "crates/backend", "crates/backend-x86"]
          EOF
          rm -f compiler/Cargo.lock
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: verifier-parity-pr358
          cache-workspace-crates: 'true'
      - name: Deterministic TypeId versus legacy acceptance differential corpus
        working-directory: compiler
        run: cargo test -p compiler-ir --test typed_verifier_parity -- --nocapture
      - name: Complete compiler core and native regression suites
        working-directory: compiler
        run: cargo test -p compiler-ir -p compiler-opt -p compiler-backend -p compiler-backend-x86
      - name: Strict compiler-ir Clippy
        working-directory: compiler
        run: cargo clippy -p compiler-ir --all-targets -- -D warnings
