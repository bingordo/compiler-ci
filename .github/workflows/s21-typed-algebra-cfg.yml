name: S21 typed algebra semantic differential
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/s21-typed-algebra-cfg.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  typed-algebra:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out exact compiler PR revision
        uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 24306d3336e8d4a56330bd5d5adcc8fabe1e653c
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Pin source and isolate self-contained crates
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C compiler rev-parse HEAD)" = 24306d3336e8d4a56330bd5d5adcc8fabe1e653c
          cat > compiler/Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir", "crates/opt"]
          EOF
          rm -f compiler/Cargo.lock
          rustc --version
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: s21-typed-algebra-cfg
      - name: Verify legacy and TypeId CFG algebra regressions
        working-directory: compiler
        run: cargo test -p compiler-opt --test typed_algebra -- --nocapture
      - name: Verify neighboring production algebra rules
        working-directory: compiler
        run: cargo test -p compiler-opt --lib algebra::tests
      - name: Strict optimizer Clippy
        working-directory: compiler
        run: cargo clippy -p compiler-opt --all-targets -- -D warnings
