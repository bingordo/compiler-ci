name: Validate S23.11 shared native-int corpus CFG PR2684
on:
  pull_request:
    paths:
      - '.github/workflows/native-int-s2311-pr2684.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  shared-matrix:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      CARGO_INCREMENTAL: '0'
      SOURCE_SHA: d35ce30cc63fff76a2391a2f099929a27e16e829
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: d35ce30cc63fff76a2391a2f099929a27e16e829
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Verify exact source and isolate optimizer workspace
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C compiler rev-parse HEAD)" = "$SOURCE_SHA"
          cat > compiler/Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir", "crates/opt", "crates/backend", "crates/backend-x86"]
          EOF
          rm -f compiler/Cargo.lock
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: native-int-seeded-generator
      - name: Validate full S23.11 generated matrix, independent oracle, golden CFG
        working-directory: compiler
        shell: bash
        run: |
          set -euo pipefail
          cargo test -p compiler-opt --test generated_native_matchpd_boolean_s2311 -- --nocapture
      - name: Strict focused Clippy with existing unrelated warnings exempt
        working-directory: compiler
        run: cargo clippy -p compiler-opt --test generated_native_matchpd_boolean_s2311 -- -D warnings -A dead-code -A clippy::empty-line-after-doc-comments -A unused-imports -A clippy::too-many-arguments
