name: X7 mixed 7-9 SysV call sequence GCC differential
on:
  pull_request:
    paths:
      - '.github/workflows/verify-x7-mixed-call-7-9-20261118.yml'
permissions:
  contents: read
jobs:
  s4-executable-differential:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.CI_KEY }}
      - name: Trust GitHub SSH host for private compiler checkout
        run: ssh-keyscan github.com >> ~/.ssh/known_hosts
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 5de1278298110029edf18e79781e14a6de789dc4
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Assert exact candidate source revision
        run: test "$(git -C compiler rev-parse HEAD)" = "5de1278298110029edf18e79781e14a6de789dc4"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: x7-s4-executable-source-gate
      - name: Build production compiler and validate executable-gate unit tests
        shell: bash
        working-directory: compiler
        run: |
          set -euo pipefail
          python3 -m py_compile tools/x7_s4_executable_source_gate.py tools/test_x7_s4_executable_source_gate.py
          cargo build -p compiler
          python3 tools/test_x7_s4_executable_source_gate.py -v
      - name: Real source C/Oberon linked native/shared ELF/GAS GCC differential
        shell: bash
        working-directory: compiler
        run: |
          set -euo pipefail
          python3 tools/x7_s4_executable_source_gate.py \
            --compiler target/debug/compiler \
            --source-sha 5de1278298110029edf18e79781e14a6de789dc4 \
            --out ../x7-s4-gate \
            --scales 8 \
            --languages mini_c oberon \
            --modes plain framed \
            --groups 1 \
            --generated-inputs 8
          echo X7_S4_LINKED_EXECUTABLE_ORACLE_GREEN
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: x7-s4-executable-source-gate
          path: x7-s4-gate
          if-no-files-found: ignore
