name: Validate mrustc generated-C audit

on:
  push:
    branches:
      - main
      - ci/refresh-mrustc-minic-stream-audit
      - ci/fix-mrustc-edg-audit-safe-directory
      - ci/sample-atomic-free-mrustc-c
    paths:
      - 'bootstrap/probe-mrustc-c-dialect.py'
      - 'bootstrap/run-mrustc-edg-gap.sh'
      - 'bootstrap/test_probe_mrustc_c_dialect.py'
      - '.github/workflows/validate-mrustc-c-dialect.yml'
      - '.github/workflows/probe-mrustc-bootstrap.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Run atomic-aware generated-C inventory regressions
        run: |
          set -euo pipefail
          python3 -m unittest discover -s bootstrap -p 'test_probe_mrustc_c_dialect.py' -v
          python3 -m py_compile bootstrap/probe-mrustc-c-dialect.py bootstrap/test_probe_mrustc_c_dialect.py
          bash -n bootstrap/run-mrustc-edg-gap.sh
          python3 - <<'PY'
          from pathlib import Path
          script = Path("bootstrap/run-mrustc-edg-gap.sh").read_text()
          assert "git config --global --add safe.directory \"$checkout\"" in script
          assert "for checkout in /workspace/edgcpp /workspace/edgcpp-rust /workspace/compiler" in script
          assert "safe.directory '*'" not in script and "safe.directory '*'" not in script
          assert script.index("git config --global --add safe.directory") < script.index('git -C edgcpp rev-parse HEAD')
          PY
