name: One-off source-pinned TypeId provenance PR1704
on:
  pull_request:
    paths:
      - '.github/workflows/review-provenance-pr1704.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: b4b6c7cead7eae9efa2d302ad856852168256a8c
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Verify immutable compiler revision
        run: test "$(git -C compiler rev-parse HEAD)" = "b4b6c7cead7eae9efa2d302ad856852168256a8c"
      - name: Verify no reviewed file has gone stale
        working-directory: compiler
        run: |
          python3 tools/review_coverage.py --check
          python3 tools/review_coverage.py --json > /tmp/provenance_review.json
          python3 - <<'PY'
          import json
          r=json.load(open('/tmp/provenance_review.json'))
          assert r['summary']['reviewed'] >= 9, r['summary']
          print('REVIEW_COUNTS',r['summary'])
          PY
      - name: Core IR-only Cargo workspace
        shell: bash
        run: |
          cat > compiler/Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir", "crates/opt", "crates/backend", "crates/backend-x86", "crates/backend-aarch64"]
          EOF
          rm -f compiler/Cargo.lock
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: review-provenance-pr1704
      - name: Independent provenance matrix, native and retained legacy
        working-directory: compiler
        run: cargo test -p compiler-ir --test typed_memory_provenance -- --nocapture
      - name: Shared pointer-extent randomized fixed-point oracle
        working-directory: compiler
        run: cargo test -p compiler-ir --lib ct04_ -- --nocapture
      - name: Native ABI and type-provenance gates
        working-directory: compiler
        run: |
          cargo test -p compiler-ir --test typed_opcode_types
          cargo test -p compiler-ir --test typed_module_abi
          cargo test -p compiler-ir --test typed_verifier_parity
      - name: Complete IR unit and integration tests
        working-directory: compiler
        run: cargo test -p compiler-ir
      - name: Strict all-target IR Clippy
        working-directory: compiler
        run: cargo clippy -p compiler-ir --all-targets -- -D warnings
