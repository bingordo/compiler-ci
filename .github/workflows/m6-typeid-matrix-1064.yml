name: M6 native TypeId 32-case egraph operand matrix
on:
  push:
    branches: [ci/m6-typeid-matrix-1064-20261111]
    paths: ['.github/workflows/m6-typeid-matrix-1064.yml']
permissions:
  contents: read
jobs:
  native-egraph-matrix:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 17cfcc3d3a78c9c273c34ad25d94eb07e8d4566f
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Attest source pin and no legacy Function matrix adapter
        run: |
          set -euo pipefail
          test "$(git -C compiler rev-parse HEAD)" = 17cfcc3d3a78c9c273c34ad25d94eb07e8d4566f
          python3 - <<'PY'
          from pathlib import Path
          m=Path("compiler/crates/opt/tests/m6_typeid_matrix.rs").read_text()
          for token in ("native_typeid_m6_generated_operand_order_matrix",
                        "native_m6_keeps_trapping_division_and_unknown_result_opaque",
                        "native_m6_respects_128_instruction_egraph_block_limit",
                        "optimize_m6_typeid(", "TypedSsaModule"):
              assert token in m,token
          assert "project_legacy_compat_function" not in m
          assert "TypedModule::from_legacy" not in m
          assert "Function { " not in m
          assert "for flags in 0..16" in m
          assert "assert_eq!(improved,24)" in m
          PY
          git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: m6-native-typeid-matrix-1064
      - name: Native M6 matrix and baseline TypeId regressions
        working-directory: compiler
        run: |
          set -euo pipefail
          cargo test -p compiler-opt --features typeid-egraph --test m6_typeid_matrix -- --nocapture --test-threads=1
          cargo test -p compiler-opt --features typeid-egraph --test m6_typeid_egraph -- --test-threads=1
          cargo test -p compiler-opt --features typeid-egraph --lib -- --test-threads=2
          cargo clippy -p compiler-opt --features typeid-egraph --all-targets -- -D warnings
          cargo test -p compiler-opt --lib -- --test-threads=2
