name: Validate native-int generated reference large batch PR2637
on:
  pull_request:
    paths:
      - '.github/workflows/native-int-reference-large-pr2637.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  generated-reference:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      CARGO_INCREMENTAL: '0'
      SOURCE_SHA: 2d64f39af082d2df560c0fd5220fffecf4eda039
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 2d64f39af082d2df560c0fd5220fffecf4eda039
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Verify exact source SHA and isolate optimizer workspace
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C compiler rev-parse HEAD)" = "$SOURCE_SHA"
          cat > compiler/Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir", "crates/opt", "crates/backend", "crates/backend-x86"]
          EOF
          rm -f compiler/Cargo.lock
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: native-int-seeded-generator
      - name: Run all 12 original seeded SSA and CFG oracle suites
        working-directory: compiler
        shell: bash
        run: |
          set -euo pipefail
          cargo test -p compiler-opt --test generated_native_add_partition_comparison_s2328 -- --nocapture
          cargo test -p compiler-opt --test generated_native_boolean_dag -- --nocapture
          cargo test -p compiler-opt --test generated_native_matchpd_arithmetic_s2320 -- --nocapture
          cargo test -p compiler-opt --test generated_native_matchpd_boolean_factor_s2314 -- --nocapture
          cargo test -p compiler-opt --test generated_native_matchpd_boolean_s2311 -- --nocapture
          cargo test -p compiler-opt --test generated_native_matchpd_complement_s2312 -- --nocapture
          cargo test -p compiler-opt --test generated_native_matchpd_complement_s2317 -- --nocapture
          cargo test -p compiler-opt --test generated_native_matchpd_pairwise_s2319 -- --nocapture
          cargo test -p compiler-opt --test generated_native_matchpd_partition -- --nocapture
          cargo test -p compiler-opt --test generated_native_matchpd_subset_s2318 -- --nocapture
          cargo test -p compiler-opt --test generated_native_paired_not_s2336 -- --nocapture
          cargo test -p compiler-opt --test generated_native_reverse_difference_s2335 -- --nocapture
      - name: Strict focused lint, exempt unrelated upstream warning categories
        working-directory: compiler
        shell: bash
        run: |
          cargo clippy -p compiler-opt --test generated_native_add_partition_comparison_s2328 --test generated_native_boolean_dag --test generated_native_matchpd_arithmetic_s2320 --test generated_native_matchpd_boolean_factor_s2314 --test generated_native_matchpd_boolean_s2311 --test generated_native_matchpd_complement_s2312 --test generated_native_matchpd_complement_s2317 --test generated_native_matchpd_pairwise_s2319 --test generated_native_matchpd_partition --test generated_native_matchpd_subset_s2318 --test generated_native_paired_not_s2336 --test generated_native_reverse_difference_s2335 -- -D warnings -A dead-code -A clippy::empty-line-after-doc-comments -A unused-imports -A clippy::too-many-arguments
