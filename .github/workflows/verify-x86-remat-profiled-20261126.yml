name: X86 opt-in exact pre-fold remat profile tests
on:
  push:
    branches: [verify/x86-remat-profiled-20261126]
    paths: ['.github/workflows/verify-x86-remat-profiled-20261126.yml']
  workflow_dispatch:
permissions:
  contents: read
  statuses: write
jobs:
  verify-x86-remat:
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
      COMPILER_SHA: 4dc65bc5d7d47fd79842500e684976afb3b7dbbd
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: ${{ env.COMPILER_SHA }}
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Confirm exact compiler commit
        run: |
          set -euo pipefail
          test "$(git -C compiler rev-parse HEAD)" = "$COMPILER_SHA"
          echo "Compiler source: $COMPILER_SHA" >> "$GITHUB_STEP_SUMMARY"
          git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: x86-profiled-remat-20261126
      - name: Exact hot-loop x86 rematerialization and existing chain tests
        working-directory: compiler
        run: |
          set -euo pipefail
          cargo test -p compiler-backend-x86 --lib machine::profiled_remat_tests -- --nocapture
          cargo test -p compiler-backend-x86 --lib machine::pure_immediate_chain_tests -- --nocapture
      - name: Shared planner and cross-target regression
        working-directory: compiler
        run: |
          set -euo pipefail
          cargo test -p compiler-backend --lib remat::
          cargo test -p compiler-backend-aarch64 --lib
          cargo test -p compiler-backend-riscv64 --lib
      - name: Strict x86 Clippy and independent source check
        working-directory: compiler
        run: |
          set -euo pipefail
          cargo clippy -p compiler-backend-x86 --lib -- --no-deps -D warnings -A dead_code
          cargo test -p compiler --test x7_s4_rolling_checksum_source -- --nocapture
      - name: Publish exact-run status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          case "$JOB_STATUS" in
            success) state=success ;;
            cancelled) state=error ;;
            *) state=failure ;;
          esac
          gh api -X POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state="$state" \
            -f context="compiler/x86-profiled-remat-20261126" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            -f description="Exact compiler $COMPILER_SHA, x86 profile and native source checks"
