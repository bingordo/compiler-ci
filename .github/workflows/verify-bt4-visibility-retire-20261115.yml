name: BT4 retire unused historical visibility writer
on:
  pull_request:
    paths:
      - '.github/workflows/verify-bt4-visibility-retire-20261115.yml'
permissions:
  contents: read
jobs:
  x86-native-visibility-and-original-tls-gp-oracles:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 20453117b9436d407e42080f7e6c8494526a6137
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: bt4-unused-function-visibility-source-retire
      - name: Exact commit and full repo dead visibility symbols/source guard
        working-directory: compiler
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "20453117b9436d407e42080f7e6c8494526a6137"
          python3 tools/check_bt4_backend_boundary.py
          if git grep -nE '(emit_object_with_checked_visibility|emit_assembly_with_checked_visibility|decorate_m48_gas_symbols|emit_object_with_checked_symbol_attributes|emit_assembly_with_checked_symbol_attributes)' -- '*.rs'; then
            echo 'BT4_FAIL: uncalled legacy Function-only symbol writer has Rust references'
            exit 1
          fi
          echo BT4_HISTORICAL_SYMBOL_WRITER_ABSENT
      - name: Use dependency-clean core native TypeId backend workspace
        shell: bash
        run: |
          set -euo pipefail
          cat > compiler/Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir", "crates/opt", "crates/backend", "crates/backend-x86"]
          EOF
          rm -f compiler/Cargo.lock
      - name: x86 all-targets and two-feature matrix, native M48 ELF GAS C DSO and historical independent TLS GP X7
        working-directory: compiler
        shell: bash
        run: |
          set -euo pipefail
          cargo check -p compiler-backend-x86 --all-targets
          cargo check -p compiler-backend-x86 --lib --no-default-features
          cargo test -p compiler-backend-x86 --lib
          cargo test -p compiler-backend-x86 --lib --no-default-features
          cargo test -p compiler-backend-x86 --test m4_8_checked_symbol_attributes_native -- --nocapture
          cargo test -p compiler-backend-x86 --test m4_8_ssa_tls_native -- --nocapture
          cargo test -p compiler-backend-x86 --test m4_7_gp_variadic_native -- --nocapture
          cargo test -p compiler-backend-x86 --test native_typeid_indirect_gp_varargs -- --nocapture
          cargo test -p compiler-backend-x86 --test m4_global_definitions_native -- --nocapture
          cargo test -p compiler-backend-x86 --test m4_relro_linkage_native -- --nocapture
          cargo test -p compiler-backend-x86 --test typeid_real_physical_observer -- --nocapture
          cargo test -p compiler-backend-x86 --features x7-native-form-validation --test x7_g10_n11_cfg_spill_probe -- --nocapture
          cargo test -p compiler-backend-x86 --features x7-native-form-validation --test x7_g10_n16_bitwise_native -- --nocapture
          cargo test -p compiler-backend-x86 --test bt4_x86_physical_budget_native -- --nocapture
          echo BT4_SYMBOL_WRITER_RETIREMENT_NATIVE_M48_TLS_GP_X7_ELF_GAS_C_PASS
