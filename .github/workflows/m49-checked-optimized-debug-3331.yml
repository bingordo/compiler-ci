name: CI M49 checked optimized source debug
on:
  pull_request:
    paths: ['.github/workflows/m49-checked-optimized-debug-3331.yml']
permissions:
  contents: read
jobs:
  optimized-source-debug:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 624bf874f61f12a2ffe6c0b60a85b8d43f48e2db
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Resolve compiler Git dependencies
        run: git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
      - name: Exact source checked debug with optimizer and x86 baseline
        working-directory: compiler
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "624bf874f61f12a2ffe6c0b60a85b8d43f48e2db"
          cd tools/mini-c-driver
          cargo test --lib source_debug::tests -- --nocapture
          # Full Mini-C library baseline currently has unrelated aggregate/ASM failures; tracked separately.
          cargo test --test checked_optimized_debug_lines -- --nocapture
          cargo test --test source_declaration_dwarf -- --nocapture
          cargo check --bin compiler-mini-c
          cd ../..
          cargo test -p compiler-backend-x86 --lib typeid_dwarf::tests
          cargo clippy -p compiler-backend-x86 --lib -- -D clippy::all -A clippy::empty_line_after_doc_comments -A clippy::collapsible_match
