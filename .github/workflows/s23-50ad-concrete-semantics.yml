name: S23.50ad generated TypeId semantic differential
on:
  pull_request:
    paths:
      - '.github/workflows/s23-50ad-concrete-semantics.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  generated-concrete-semantics:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
    steps:
      - name: Checkout exact compiler source (no compiler Actions)
        uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 4309d5ac952cf604265205c41f4ce9200110b838
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Check source pin and configure Cargo Git
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C compiler rev-parse HEAD)" = 4309d5ac952cf604265205c41f4ce9200110b838
          git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
          rustc --version
          python3 --version
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: s23-50ad-concrete-typeid
      - name: Check original generated fixture source and parser contracts
        working-directory: compiler
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tools/typeid-rule-gen -p 'test_native_casegen.py' -v
          python3 -m unittest discover -s tools/typeid-rule-gen -p 'test_native_nearmiss_codegen.py' -v
      - name: Independently execute TypeId SSA before and after real generated rewrite
        working-directory: compiler
        shell: bash
        run: |
          set -euo pipefail
          cargo test -p compiler-opt --test native_s2350ad_generated_semantics -- --nocapture
      - name: Preserve existing generated SSA structural positive and negative gates
        working-directory: compiler
        shell: bash
        run: |
          set -euo pipefail
          cargo test -p compiler-opt --test native_s2350z_generated_matrix -- --nocapture
          cargo test -p compiler-opt --test native_s2350aa_generated_nearmisses -- --nocapture
      - name: Strict scoped Clippy and handwritten-only compilation
        working-directory: compiler
        shell: bash
        run: |
          set -euo pipefail
          cargo clippy -p compiler-opt --test native_s2350ad_generated_semantics -- -D warnings -A unused-variables
          cargo check -p compiler-opt --no-default-features
