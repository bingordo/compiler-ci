name: One-off TypeId verifier independent parity PR1690
on:
  pull_request:
    paths:
      - '.github/workflows/review-verifier-pr1690.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: cb7ed37306708713042400b5caab2175d8761f4d
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Verify exact candidate source
        run: test "$(git -C compiler rev-parse HEAD)" = "cb7ed37306708713042400b5caab2175d8761f4d"
      - name: Minimal compiler IR workspace
        shell: bash
        run: |
          cat > compiler/Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir", "crates/opt", "crates/backend", "crates/backend-x86", "crates/backend-aarch64"]
          EOF
          rm -f compiler/Cargo.lock
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: review-native-legacy-parity-pr1690
      - name: Native vs independent legacy v1 mutation parity
        working-directory: compiler
        run: cargo test -p compiler-ir --test typed_verifier_parity -- --nocapture
      - name: Generated CFG and ABI independent acceptance parity
        working-directory: compiler
        run: cargo test -p compiler-ir --test typed_verifier_generated -- --nocapture
      - name: Value-flow and opcode typing regressions
        working-directory: compiler
        run: |
          cargo test -p compiler-ir --test typed_value_flow
          cargo test -p compiler-ir --test typed_opcode_types
      - name: Native provenance and ABI regressions
        working-directory: compiler
        run: |
          cargo test -p compiler-ir --test typed_memory_provenance
          cargo test -p compiler-ir --test typed_module_abi
      - name: All compiler-ir unit and integration tests
        working-directory: compiler
        run: cargo test -p compiler-ir
      - name: Strict compiler-ir Clippy all targets
        working-directory: compiler
        run: cargo clippy -p compiler-ir --all-targets -- -D warnings
