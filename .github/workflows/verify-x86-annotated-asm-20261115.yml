name: Verify x86 annotated GAS source and physical MachineIR
on:
  pull_request:
    paths:
      - '.github/workflows/verify-x86-annotated-asm-20261115.yml'
permissions:
  contents: read
jobs:
  annotated-x86-gas:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Configure SSH for pinned Oberon and Mini-C frontends
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.CI_KEY }}
      - name: Trust GitHub SSH
        run: ssh-keyscan github.com >> ~/.ssh/known_hosts
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 7d237efc088b764cafe07d7098e9594216088299
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Verify exact compiler source
        run: test "$(git -C compiler rev-parse HEAD)" = "7d237efc088b764cafe07d7098e9594216088299"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: x86-source-physical-machine-asm
      - name: Source context / physical MachineIR comments preserve physical GAS
        working-directory: compiler
        shell: bash
        run: |
          set -euo pipefail
          cargo test -p compiler-backend-x86 --test annotated_machine_asm -- --nocapture
          cargo test -p compiler --test x86_annotated_asm -- --nocapture
          cargo test -p compiler --test typeid_x86_source_machine_dump -- --nocapture
      - name: Compile driver and backend after opt-in change
        working-directory: compiler
        run: |
          cargo check -p compiler
          cargo check -p compiler-backend-x86
