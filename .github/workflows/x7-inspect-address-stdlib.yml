name: X7 pinned Intel original address helper source inspection
on:
  pull_request:
    paths: ['.github/workflows/x7-inspect-address-stdlib.yml']
permissions:
  contents: read
jobs:
  inspect-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 4ab9e9acf1e69ce225cb921fc7f496afc7f92747
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Inspect pinned Intel effective-address and RIP helper source bodies
        run: |
          set -euo pipefail
          curl -fsSL --retry 2 --max-time 60 "https://raw.githubusercontent.com/intel/SDM/35eface1b7ee003a1cda95005ec5fd83de658a64/data/definitions.xml.gz" -o /tmp/definitions.xml.gz
          python3 - <<'PY'
          import gzip, hashlib, xml.etree.ElementTree as ET
          raw=open('/tmp/definitions.xml.gz','rb').read()
          print('compressed SHA',hashlib.sha256(raw).hexdigest(),'size',len(raw))
          root=ET.fromstring(gzip.decompress(raw))
          print('definition count',len(root.findall('definition')))
          for name in ['Effective_Address','Handle_RIP_Relative_Address','Read_GPR']:
              rows=[r for r in root.findall('definition') if r.get('name')==name]
              print('SOURCE_HELPER',name,'variants',len(rows))
              for d in rows:
                  print('KIND',d.get('kind'),'SHA',hashlib.sha256(ET.tostring(d,encoding='utf-8')).hexdigest())
                  for op in d.findall('operation'):
                      print('OP',op.attrib)
                      for child in op:
                          if child.tag in ('code','input','output','callee','var-used'):
                              print(' ',child.tag,child.attrib,(child.text or '').strip()[:350])
          PY
