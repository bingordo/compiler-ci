name: Temporary TypeId projection guard PR3586
on:
  push:
    branches: [ci/temp-ir-projection-3586]
  pull_request:
    paths: ['.github/workflows/temp-ir-projection-3586.yml']
permissions:
  contents: read
jobs:
  guard:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      SOURCE_SHA: a1172ac306f2a66094d01f0eb65917dce7a3e731
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: ${{ env.SOURCE_SHA }}
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Exact SHA and Python TypeId guard
        working-directory: compiler
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          PYTHONPATH=tools python3 -m unittest tools/test_ir_consumer_inventory.py
          python3 tools/ir_consumer_inventory.py --check-production
