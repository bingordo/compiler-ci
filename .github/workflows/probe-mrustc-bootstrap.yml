name: Prototype mrustc-to-C compiler bootstrap

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/probe-mrustc-bootstrap.yml'
  workflow_dispatch:
    inputs:
      source_ref:
        description: 'Compiler source branch, tag, or SHA'
        required: false
        default: main
        type: string

permissions:
  contents: read

concurrency:
  group: mrustc-bootstrap-${{ inputs.source_ref || 'main' }}
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    steps:
      - name: Checkout compiler-ci smoke fixtures
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Checkout compiler using existing read-only deploy key
        uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: ${{ inputs.source_ref || 'main' }}
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false

      - name: Resolve exact frontend source pins from checked-out compiler
        id: frontend-pins
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          from pathlib import Path
          import re
          import tomllib

          with Path("compiler/crates/driver/Cargo.toml").open("rb") as f:
              deps = tomllib.load(f)["dependencies"]
          names = {
              "oberon-front-ir": "oberon",
              "mini-c-syntax": "mini-c",
              "mini-c-sema": "mini-c",
              "mini-c-preprocess": "mini-c",
          }
          by_repo = {}
          for crate, repo in names.items():
              dep = deps[crate]
              assert dep["git"] == f"ssh://git@github.com/bingordo/{repo}.git"
              sha = dep["rev"]
              assert re.fullmatch(r"[0-9a-f]{40}", sha), (crate, sha)
              if repo in by_repo:
                  assert by_repo[repo] == sha, f"conflicting {repo} frontend pins"
              by_repo[repo] = sha
          assert deps["mini-c-preprocess"]["features"] == ["internal-rcc"]
          print(f"oberon_sha={by_repo['oberon']}")
          print(f"mini_c_sha={by_repo['mini-c']}")
          PY

      - name: Checkout pinned Oberon frontend source
        uses: actions/checkout@v4
        with:
          repository: bingordo/oberon
          ref: ${{ steps.frontend-pins.outputs.oberon_sha }}
          path: oberon
          persist-credentials: false

      - name: Checkout pinned Mini-C frontend source
        uses: actions/checkout@v4
        with:
          repository: bingordo/mini-c
          ref: ${{ steps.frontend-pins.outputs.mini_c_sha }}
          path: mini-c
          persist-credentials: false
      - name: Checkout compiler-pinned Mini-C for generated-C compatibility audit
        uses: actions/checkout@v4
        with:
          repository: bingordo/mini-c
          # Use precisely the grammar and checker revision required by the
          # bootstrapped driver rather than a historical parser snapshot.
          ref: ${{ steps.frontend-pins.outputs.mini_c_sha }}
          path: mini-c-compat
          persist-credentials: false
      - name: Checkout pinned mrustc
        uses: actions/checkout@v4
        with:
          repository: thepowersgang/mrustc
          ref: master
          path: mrustc
          persist-credentials: false

      - name: Identify mrustc cache revision
        id: mrustc-revision
        shell: bash
        run: echo "sha=$(git -C mrustc rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Restore prebuilt mrustc and Rust 1.90 libraries
        id: mrustc-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            mrustc/bin
            mrustc/output-1.90.0
          key: mrustc-bootstrap-v1-${{ runner.os }}-ubuntu2404-rust190-${{ steps.mrustc-revision.outputs.sha }}

      - name: Install mrustc build dependencies when the toolchain needs building
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ steps.mrustc-cache.outputs.cache-hit }}" == "true" ]] &&
             [[ -x mrustc/bin/mrustc ]] &&
             [[ -x mrustc/bin/minicargo ]] &&
             [[ -f mrustc/output-1.90.0/libcore.rlib ]]; then
            echo "Cached mrustc is complete; skipping apt install." >> "$GITHUB_STEP_SUMMARY"
          else
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends build-essential zlib1g-dev pkg-config cmake curl python3 libssl-dev
          fi
          # GCC and Cargo are required even when mrustc itself came from cache.
          command -v gcc
          command -v cargo
          command -v python3

      - name: Record reproducibility inputs and target crates
        shell: bash
        run: |
          set -euo pipefail
          echo "Compiler SHA: $(git -C compiler rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
          echo "mrustc SHA: $(git -C mrustc rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
          echo "Host: $(uname -m) / $(lsb_release -rs)" >> "$GITHUB_STEP_SUMMARY"
          echo "Rust crate editions:" >> "$GITHUB_STEP_SUMMARY"
          grep -Rh '^edition[[:space:]]*=' compiler/crates/*/Cargo.toml | sort | uniq -c >> "$GITHUB_STEP_SUMMARY"
          echo "First target: compiler-ir (no frontend dependency); then compiler-opt, backend, driver." >> "$GITHUB_STEP_SUMMARY"

      - name: Build mrustc and matching Rust 1.90 libraries
        id: toolchain
        shell: bash
        working-directory: mrustc
        env:
          RUSTC_VERSION: '1.90.0'
          MRUSTC_TARGET_VER: '1.90'
          OUTDIR_SUF: '-1.90.0'
          PARLEVEL: '2'
        run: |
          set -euo pipefail
          if [[ "${{ steps.mrustc-cache.outputs.cache-hit }}" == "true" ]] && \
             [[ -x bin/mrustc ]] && [[ -x bin/minicargo ]] && \
             [[ -f output-1.90.0/libcore.rlib ]]; then
            echo "Using cached mrustc toolchain and Rust libraries" >> "$GITHUB_STEP_SUMMARY"
          else
            # Missing/incomplete caches rebuild in this runner.
            timeout --signal=TERM --kill-after=10s 20m make -j2
            timeout --signal=TERM --kill-after=10s 10m make RUSTCSRC
            timeout --signal=TERM --kill-after=10s 55m make -f minicargo.mk LIBS
          fi
          test -x bin/mrustc
          test -x bin/minicargo
          test -f output-1.90.0/libcore.rlib

      - name: Cache validated mrustc toolchain
        if: success() && steps.mrustc-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            mrustc/bin
            mrustc/output-1.90.0
          key: mrustc-bootstrap-v1-${{ runner.os }}-ubuntu2404-rust190-${{ steps.mrustc-revision.outputs.sha }}

      - name: Snapshot C files before translation
        shell: bash
        run: |
          find mrustc -type f -name '*.c' -printf '%P\n' | LC_ALL=C sort > "$RUNNER_TEMP/mrustc-c-before.txt"

      - name: Attempt compiler-ir Rust-to-C emission
        id: translate
        shell: bash
        working-directory: mrustc
        env:
          RUSTC_VERSION: '1.90.0'
          MRUSTC_TARGET_VER: '1.90'
          OUTDIR_SUF: '-1.90.0'
          PARLEVEL: '2'
          CC: gcc
        run: |
          set -euo pipefail
          # This is deliberately a bounded first-crate feasibility probe, not
          # an assertion that the full Cargo workspace is supported.
          set +e
          # minicargo's positional argument is the crate DIRECTORY, not Cargo.toml.
          # Share one fresh per-run directory across all compiler crate probes.
          # minicargo can now reuse compiler-ir and other completed dependencies.
          # Do not persist private generated C/rlibs in public Actions caches.
          timeout --signal=TERM --kill-after=10s 20m bin/minicargo \
            -L output-1.90.0 -o output-compiler-bootstrap \
            ../compiler/crates/ir > "$RUNNER_TEMP/mrustc-probe.log" 2>&1
          rc=$?
          set -e
          echo "mrustc/minicargo exit code: $rc" >> "$GITHUB_STEP_SUMMARY"
          find . -type f -name '*.c' -printf '%P\n' | LC_ALL=C sort > "$RUNNER_TEMP/mrustc-c-after.txt"
          # Before-snapshot is relative to mrustc/; after-snapshot is also
          # relative to mrustc/, avoiding false differences from prefix changes.
          comm -13 "$RUNNER_TEMP/mrustc-c-before.txt" "$RUNNER_TEMP/mrustc-c-after.txt" > "$RUNNER_TEMP/mrustc-c-new.txt"
          echo "New C files from attempted translation: $(wc -l < "$RUNNER_TEMP/mrustc-c-new.txt")" >> "$GITHUB_STEP_SUMMARY"
          echo "All C files (includes prebuilt Rust stdlib): $(wc -l < "$RUNNER_TEMP/mrustc-c-after.txt")" >> "$GITHUB_STEP_SUMMARY"
          # Do not print private compiler source or raw diagnostics into public CI.
          python3 - "$RUNNER_TEMP/mrustc-probe.log" "$GITHUB_STEP_SUMMARY" <<'PY'
          import pathlib, re, sys
          log = pathlib.Path(sys.argv[1]).read_text(errors="replace")
          categories = {
              "manifest or dependency resolution": r"failed to (load|parse|select|resolve)|dependency|manifest",
              "missing files or paths": r"No such file|not found|cannot open",
              "unsupported Rust feature": r"unsupported|not implemented|unimplemented|TODO",
              "type or parsing error": r"parse error|type error|error:|ERROR:",
              "compiler crash": r"SIGSEGV|segmentation fault|panic|assertion failed",
              "GCC diagnostic": r"gcc: error|fatal error:|compilation terminated",
          }
          print("Diagnostic categories (counts; non-exclusive):", file=open(sys.argv[2], "a"))
          with open(sys.argv[2], "a") as out:
              for name, pattern in categories.items():
                  print(f"- {name}: {len(re.findall(pattern, log, re.I))}", file=out)
          PY
          echo "Target translation must succeed before GCC syntax and object tests run." >> "$GITHUB_STEP_SUMMARY"
          if (( rc != 0 )); then
            # Only show a bounded, non-source-bearing summary here. Private
            # diagnostics remain in the runner temp log.
            echo "minicargo failed; inspect diagnostic categories above." >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "probe_exit=$rc" >> "$GITHUB_OUTPUT"
          # A nonzero exit is a real failed acceptance gate, not a green probe.
          exit "$rc"

      - name: Compile newly generated C with GCC
        if: steps.translate.outputs.probe_exit == '0'
        shell: bash
        working-directory: mrustc
        run: |
          set -euo pipefail
          mapfile -t generated < "$RUNNER_TEMP/mrustc-c-new.txt"
          if (( ${#generated[@]} == 0 )); then
            echo "No newly generated C files to compile; cannot verify C output." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/mrustc-gcc-objects"
          count=0
          for relative in "${generated[@]}"; do
            [[ -f "$relative" ]] || exit 1
            # Each emitted C unit is compiled, not merely syntax-checked.
            # This direct probe can reveal missing generator-specific GCC
            # flags/includes even if minicargo's own compile succeeded.
            gcc -std=gnu11 -O0 -c "$relative" -o "$RUNNER_TEMP/mrustc-gcc-objects/$count.o"
            count=$((count + 1))
          done
          test "$count" -gt 0
          ar rcs "$RUNNER_TEMP/mrustc-gcc-objects/libgenerated-probe.a" "$RUNNER_TEMP"/mrustc-gcc-objects/*.o
          nm -g "$RUNNER_TEMP/mrustc-gcc-objects/libgenerated-probe.a" > "$RUNNER_TEMP/mrustc-gcc-symbols.txt"
          echo "GCC successfully compiled $count newly generated C units into object files." >> "$GITHUB_STEP_SUMMARY"
          echo "Compiler-ir is a library: this checks native object production, not runtime correctness." >> "$GITHUB_STEP_SUMMARY"

      - name: Translate compiler-opt and compile generated C with GCC
        id: optimizer
        shell: bash
        working-directory: mrustc
        env:
          RUSTC_VERSION: '1.90.0'
          MRUSTC_TARGET_VER: '1.90'
          OUTDIR_SUF: '-1.90.0'
          PARLEVEL: '2'
          CC: gcc
        run: |
          set -euo pipefail
          # compiler-opt depends on compiler-ir. minicargo must resolve and
          # compile the real local path dependency, not a synthetic stub.
          # The shared output directory reuses compiler-ir from the prior step.
          find . -type f -name '*.c' -printf '%P\n' | LC_ALL=C sort > "$RUNNER_TEMP/mrustc-opt-c-before.txt"
          set +e
          timeout --signal=TERM --kill-after=10s 30m bin/minicargo \
            -L output-1.90.0 -o output-compiler-bootstrap \
            ../compiler/crates/opt > "$RUNNER_TEMP/mrustc-opt-probe.log" 2>&1
          rc=$?
          set -e
          if (( rc != 0 )); then
            # The maintainer explicitly approved publishing full diagnostics
            # in this public compiler-ci run, including Rust source excerpts.
            echo "::group::Full compiler-opt minicargo failure output"
            cat "$RUNNER_TEMP/mrustc-opt-probe.log"
            echo "::endgroup::"
            python3 - "$RUNNER_TEMP/mrustc-opt-probe.log" "$GITHUB_STEP_SUMMARY" <<'PY'
          import pathlib, re, sys
          log = pathlib.Path(sys.argv[1]).read_text(errors="replace")
          classes = {
              "manifest/dependency resolution": r"failed to (load|parse|select|resolve)|dependency|manifest|no lockfile",
              "missing paths/files": r"No such file|not found|cannot open",
              "unsupported Rust": r"unsupported|not implemented|unimplemented|unknown feature",
              "Rust parse/type error": r"parse error|type error|error:|ERROR:",
              "compiler crash": r"SIGSEGV|segmentation fault|panic|assertion failed",
              "C toolchain error": r"gcc: error|fatal error:|compilation terminated",
          }
          # Fixed labels only: this is a PUBLIC CI repository, so never print
          # raw mrustc diagnostics, source names, source lines or file paths.
          specific = [
              ("dependency cycle", r"circular dependency|cyclic dependency|dependency cycle|cycle detected"),
              ("lockfile/dependency resolution", r"no lockfile entry|failed to resolve|unable to resolve|could not resolve"),
              ("missing package", r"failed to find package|unknown package|package .* not found"),
              ("unsupported Rust language feature", r"unimplemented|unsupported|not yet implemented|unknown feature"),
              ("source parse/type error", r"parse error|type error|unexpected token|syntax error"),
              ("missing path/file", r"no such file|could not open|cannot open|not found"),
              ("mrustc crash", r"segmentation fault|sigsegv|assertion failed|panic"),
              ("GCC error", r"gcc: error|fatal error:|compilation terminated"),
          ]
          findings = [name for name, rx in specific if re.search(rx, log, re.I)]
          lines = ["compiler-opt minicargo diagnostic (sanitized):",
                   "error category: " + (", ".join(findings) if findings else "unclassified"),
                   "diagnostic bytes: {}; lines: {}".format(len(log), log.count("\n"))]
          lines += ["{} matches: {}".format(label, len(re.findall(rx, log, re.I))) for label, rx in classes.items()]
          print("\n".join(lines))
          with open(sys.argv[2], "a") as out:
              out.write("\n".join(lines) + "\n")
          PY
            exit "$rc"
          fi
          find . -type f -name '*.c' -printf '%P\n' | LC_ALL=C sort > "$RUNNER_TEMP/mrustc-opt-c-after.txt"
          comm -13 "$RUNNER_TEMP/mrustc-opt-c-before.txt" "$RUNNER_TEMP/mrustc-opt-c-after.txt" > "$RUNNER_TEMP/mrustc-opt-c-new.txt"
          mapfile -t generated < "$RUNNER_TEMP/mrustc-opt-c-new.txt"
          if (( ${#generated[@]} == 0 )); then
            echo "compiler-opt: no new generated C files" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/mrustc-opt-gcc-objects"
          count=0
          for relative in "${generated[@]}"; do
            [[ -f "$relative" ]] || exit 1
            gcc -std=gnu11 -O0 -c "$relative" -o "$RUNNER_TEMP/mrustc-opt-gcc-objects/$count.o"
            count=$((count + 1))
          done
          ar rcs "$RUNNER_TEMP/mrustc-opt-gcc-objects/libcompiler-opt-probe.a" "$RUNNER_TEMP"/mrustc-opt-gcc-objects/*.o
          test -s "$RUNNER_TEMP/mrustc-opt-gcc-objects/libcompiler-opt-probe.a"
          if grep -q 'BUILDING compiler-ir v' "$RUNNER_TEMP/mrustc-opt-probe.log"; then
            echo "compiler-opt: compiler-ir dependency rebuilt in shared directory." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "compiler-opt: compiler-ir dependency reused from shared build." >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "compiler-opt: minicargo succeeded and GCC compiled $count new C units." >> "$GITHUB_STEP_SUMMARY"
          echo "This verifies native object compilation, not semantic correctness or a runnable compiler." >> "$GITHUB_STEP_SUMMARY"

      - name: Compare native and GCC-linked compiler-opt executable behavior
        if: always() && steps.optimizer.outcome == 'success'
        shell: bash
        env:
          RUSTC_VERSION: '1.90.0'
          MRUSTC_TARGET_VER: '1.90'
          OUTDIR_SUF: '-1.90.0'
          PARLEVEL: '2'
          CC: gcc
        run: |
          set -euo pipefail
          fixture="$PWD/bootstrap/mrustc-opt-smoke"
          timeout --signal=TERM --kill-after=10s 15m cargo run --quiet \
            --manifest-path "$fixture/Cargo.toml" \
            --target-dir "$RUNNER_TEMP/bootstrap-opt-host-target" \
            > "$RUNNER_TEMP/bootstrap-opt-host.out"
          echo "Host rustc optimizer oracle completed:"
          cat "$RUNNER_TEMP/bootstrap-opt-host.out"
          (
            cd mrustc
            # Reuse the already compiled compiler-ir and compiler-opt crates.
            timeout --signal=TERM --kill-after=10s 20m bin/minicargo \
              -L output-1.90.0 -o output-compiler-bootstrap \
              "$fixture" > "$RUNNER_TEMP/bootstrap-opt-mrustc.log" 2>&1 || {
                echo "::group::Full compiler-opt executable translation log"
                cat "$RUNNER_TEMP/bootstrap-opt-mrustc.log"
                echo "::endgroup::"
                exit 1
              }
          )
          echo "mrustc/minicargo optimizer oracle build completed:"
          tail -n 20 "$RUNNER_TEMP/bootstrap-opt-mrustc.log"
          echo "Executable candidates in the shared output directory:"
          find mrustc/output-compiler-bootstrap -maxdepth 2 -type f -executable -printf '%p\n' | LC_ALL=C sort
          # minicargo normalizes package/bin hyphens to underscores. Use the
          # exact executable, not a glob over the shared build directory.
          executable="mrustc/output-compiler-bootstrap/mrustc_opt_smoke"
          if [[ ! -x "$executable" ]]; then
            echo "::error::Expected executable not found: $executable"
            find mrustc/output-compiler-bootstrap -maxdepth 2 -type f -executable -printf '%p\n' | LC_ALL=C sort
            exit 1
          fi
          if ! timeout 30s "$executable" > "$RUNNER_TEMP/bootstrap-opt-mrustc.out"; then
            echo "::error::mrustc/GCC optimizer executable terminated unsuccessfully"
            exit 1
          fi
          echo "mrustc/GCC optimizer oracle output:"
          cat "$RUNNER_TEMP/bootstrap-opt-mrustc.out"
          if ! diff -u "$RUNNER_TEMP/bootstrap-opt-host.out" "$RUNNER_TEMP/bootstrap-opt-mrustc.out"; then
            echo "::error::Native rustc and mrustc/GCC optimizer results differ"
            exit 1
          fi
          if ! grep -q '^compiler-opt-smoke:' "$RUNNER_TEMP/bootstrap-opt-mrustc.out"; then
            echo "::error::Optimizer executable printed no expected checksum line"
            exit 1
          fi
          echo "Executable compiler-opt oracle passed: GCC-linked mrustc output equals host rustc on wrapping arithmetic constant folding." >> "$GITHUB_STEP_SUMMARY"
      - name: Translate compiler-backend and compile generated C with GCC
        if: always() && steps.translate.outcome == 'success'
        id: backend
        shell: bash
        working-directory: mrustc
        env:
          RUSTC_VERSION: '1.90.0'
          MRUSTC_TARGET_VER: '1.90'
          OUTDIR_SUF: '-1.90.0'
          PARLEVEL: '2'
          CC: gcc
        run: |
          set -euo pipefail
          # The target-neutral backend depends on compiler-ir, not compiler-opt.
          # Run it independently to map bootstrap coverage despite opt failure.
          find . -type f -name '*.c' -printf '%P\n' | LC_ALL=C sort > "$RUNNER_TEMP/mrustc-backend-before.txt"
          set +e
          timeout --signal=TERM --kill-after=10s 30m bin/minicargo \
            -L output-1.90.0 -o output-compiler-bootstrap \
            ../compiler/crates/backend > "$RUNNER_TEMP/mrustc-backend-probe.log" 2>&1
          rc=$?
          set -e
          find . -type f -name '*.c' -printf '%P\n' | LC_ALL=C sort > "$RUNNER_TEMP/mrustc-backend-after.txt"
          comm -13 "$RUNNER_TEMP/mrustc-backend-before.txt" "$RUNNER_TEMP/mrustc-backend-after.txt" > "$RUNNER_TEMP/mrustc-backend-new.txt"
          echo "compiler-backend: minicargo exit=$rc, newly generated C files=$(wc -l < "$RUNNER_TEMP/mrustc-backend-new.txt")" >> "$GITHUB_STEP_SUMMARY"
          if (( rc != 0 )); then
            # Public repo: publish only categorical diagnostics, never private
            # source excerpts, generated C, or paths from the error log.
            python3 - "$RUNNER_TEMP/mrustc-backend-probe.log" "$GITHUB_STEP_SUMMARY" <<'PY'
          import pathlib, re, sys
          log = pathlib.Path(sys.argv[1]).read_text(errors="replace")
          classes = {
              "dependency resolution": r"dependency|manifest|lockfile|couldn't find|not found",
              "Rust source parsing or type error": r"parse error|type error|error:|ERROR:",
              "unsupported language/compiler feature": r"unsupported|not implemented|unimplemented",
              "mrustc crash": r"SIGSEGV|segmentation fault|panic|assertion failed",
              "host C compiler error": r"gcc: error|fatal error:|compilation terminated",
          }
          with open(sys.argv[2], "a") as out:
              print("compiler-backend diagnostic categories:", file=out)
              for name, pattern in classes.items():
                  print("- {}: {}".format(name, len(re.findall(pattern, log, re.I))), file=out)
          PY
            exit "$rc"
          fi
          mapfile -t generated < "$RUNNER_TEMP/mrustc-backend-new.txt"
          test "${#generated[@]}" -gt 0
          mkdir -p "$RUNNER_TEMP/mrustc-backend-gcc-objects"
          count=0
          for relative in "${generated[@]}"; do
            test -f "$relative"
            gcc -std=gnu11 -O0 -c "$relative" -o "$RUNNER_TEMP/mrustc-backend-gcc-objects/$count.o"
            count=$((count + 1))
          done
          ar rcs "$RUNNER_TEMP/mrustc-backend-gcc-objects/libcompiler-backend-probe.a" "$RUNNER_TEMP"/mrustc-backend-gcc-objects/*.o
          test -s "$RUNNER_TEMP/mrustc-backend-gcc-objects/libcompiler-backend-probe.a"
          if grep -q 'BUILDING compiler-ir v' "$RUNNER_TEMP/mrustc-backend-probe.log"; then
            echo "compiler-backend: compiler-ir dependency rebuilt." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "compiler-backend: compiler-ir dependency reused." >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "compiler-backend: GCC compiled $count generated C units into a static archive." >> "$GITHUB_STEP_SUMMARY"

      - name: Translate x86 backend and compile generated C with GCC
        if: always() && steps.optimizer.outcome == 'success'
        id: backend-x86
        shell: bash
        working-directory: mrustc
        env:
          RUSTC_VERSION: '1.90.0'
          MRUSTC_TARGET_VER: '1.90'
          OUTDIR_SUF: '-1.90.0'
          PARLEVEL: '2'
          CC: gcc
        run: |
          set -euo pipefail
          # The x86 backend requires compiler-opt, so this runs only when
          # the optimizer successfully translates and its C compiles with GCC.
          find . -type f -name '*.c' -printf '%P\n' | LC_ALL=C sort > "$RUNNER_TEMP/mrustc-x86-before.txt"
          set +e
          timeout --signal=TERM --kill-after=10s 30m bin/minicargo \
            -L output-1.90.0 -o output-compiler-bootstrap \
            ../compiler/crates/backend-x86 > "$RUNNER_TEMP/mrustc-x86-probe.log" 2>&1
          rc=$?
          set -e
          if (( rc != 0 )); then
            echo "::group::Full compiler-backend-x86 minicargo failure output"
            cat "$RUNNER_TEMP/mrustc-x86-probe.log"
            echo "::endgroup::"
            echo "compiler-backend-x86: minicargo exit=$rc" >> "$GITHUB_STEP_SUMMARY"
            exit "$rc"
          fi
          find . -type f -name '*.c' -printf '%P\n' | LC_ALL=C sort > "$RUNNER_TEMP/mrustc-x86-after.txt"
          comm -13 "$RUNNER_TEMP/mrustc-x86-before.txt" "$RUNNER_TEMP/mrustc-x86-after.txt" > "$RUNNER_TEMP/mrustc-x86-new.txt"
          mapfile -t generated < "$RUNNER_TEMP/mrustc-x86-new.txt"
          if (( ${#generated[@]} == 0 )); then
            echo "compiler-backend-x86: no newly emitted C files" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/mrustc-x86-objects"
          count=0
          for relative in "${generated[@]}"; do
            test -f "$relative"
            gcc -std=gnu11 -O0 -c "$relative" -o "$RUNNER_TEMP/mrustc-x86-objects/$count.o"
            count=$((count + 1))
          done
          ar rcs "$RUNNER_TEMP/mrustc-x86-objects/libcompiler-backend-x86-probe.a" "$RUNNER_TEMP"/mrustc-x86-objects/*.o
          test -s "$RUNNER_TEMP/mrustc-x86-objects/libcompiler-backend-x86-probe.a"
          echo "compiler-backend-x86: mrustc and GCC compiled $count new C units into an archive." >> "$GITHUB_STEP_SUMMARY"
      - name: Run compiler-ir executable through host rustc and mrustc/GCC
        if: always() && steps.translate.outcome == 'success'
        shell: bash
        env:
          RUSTC_VERSION: '1.90.0'
          MRUSTC_TARGET_VER: '1.90'
          OUTDIR_SUF: '-1.90.0'
          PARLEVEL: '2'
          CC: gcc
        run: |
          set -euo pipefail
          fixture="$PWD/bootstrap/mrustc-gcc-smoke"
          timeout --signal=TERM --kill-after=10s 10m cargo run --quiet \
            --manifest-path "$fixture/Cargo.toml" \
            --target-dir "$RUNNER_TEMP/bootstrap-host-target" \
            > "$RUNNER_TEMP/bootstrap-host.out"
          (
            cd mrustc
            timeout --signal=TERM --kill-after=10s 25m bin/minicargo \
              -L output-1.90.0 -o output-compiler-bootstrap \
              "$fixture" > "$RUNNER_TEMP/bootstrap-mrustc.log" 2>&1
          )
          # minicargo normalizes package/bin hyphens to underscores. Use the
          # exact executable, not a glob over the shared build directory.
          executable="mrustc/output-compiler-bootstrap/mrustc_gcc_smoke"
          if [[ ! -x "$executable" ]]; then
            echo "::error::Expected executable not found: $executable"
            find mrustc/output-compiler-bootstrap -maxdepth 2 -type f -executable -printf '%p\n' | LC_ALL=C sort
            exit 1
          fi
          timeout 30s "$executable" > "$RUNNER_TEMP/bootstrap-mrustc.out"
          diff -u "$RUNNER_TEMP/bootstrap-host.out" "$RUNNER_TEMP/bootstrap-mrustc.out"
          grep -q '^compiler-ir-smoke:' "$RUNNER_TEMP/bootstrap-mrustc.out"
          echo "Executable GCC oracle passed: mrustc output equals rustc output on compiler-ir integer semantics." >> "$GITHUB_STEP_SUMMARY"

      - name: Compare x86 objects from rustc and mrustc GCC then execute native code
        if: always() && steps.backend-x86.outcome == 'success'
        shell: bash
        env:
          RUSTC_VERSION: '1.90.0'
          MRUSTC_TARGET_VER: '1.90'
          OUTDIR_SUF: '-1.90.0'
          PARLEVEL: '2'
          CC: gcc
        run: |
          set -euo pipefail
          fixture="$PWD/bootstrap/mrustc-x86-object-smoke"
          timeout --signal=TERM --kill-after=10s 15m cargo run --quiet \
            --manifest-path "$fixture/Cargo.toml" \
            --target-dir "$RUNNER_TEMP/bootstrap-x86-host-target" \
            -- "$RUNNER_TEMP/host-emitted-x86.o" \
            > "$RUNNER_TEMP/bootstrap-x86-host.out"
          (
            cd mrustc
            timeout --signal=TERM --kill-after=10s 25m bin/minicargo \
              -L output-1.90.0 -o output-compiler-bootstrap \
              "$fixture" > "$RUNNER_TEMP/bootstrap-x86-mrustc.log" 2>&1 || {
                echo "::group::Full mrustc x86-object executable translation error"
                cat "$RUNNER_TEMP/bootstrap-x86-mrustc.log"
                echo "::endgroup::"
                exit 1
              }
          )
          # minicargo normalizes package/bin hyphens to underscores. Use the
          # exact executable, not a glob over the shared build directory.
          executable="mrustc/output-compiler-bootstrap/mrustc_x86_object_smoke"
          if [[ ! -x "$executable" ]]; then
            echo "::error::Expected executable not found: $executable"
            find mrustc/output-compiler-bootstrap -maxdepth 2 -type f -executable -printf '%p\n' | LC_ALL=C sort
            exit 1
          fi
          timeout 45s "$executable" "$RUNNER_TEMP/mrustc-emitted-x86.o" \
            > "$RUNNER_TEMP/bootstrap-x86-mrustc.out"
          diff -u "$RUNNER_TEMP/bootstrap-x86-host.out" "$RUNNER_TEMP/bootstrap-x86-mrustc.out"
          cmp "$RUNNER_TEMP/host-emitted-x86.o" "$RUNNER_TEMP/mrustc-emitted-x86.o"
          file "$RUNNER_TEMP/mrustc-emitted-x86.o"
          cat > "$RUNNER_TEMP/bootstrap-x86-harness.c" <<'C'
          extern int bootstrap_x86_value(void);
          int main(void) { return bootstrap_x86_value() == 42 ? 0 : 1; }
          C
          gcc -no-pie "$RUNNER_TEMP/bootstrap-x86-harness.c" \
            "$RUNNER_TEMP/mrustc-emitted-x86.o" -o "$RUNNER_TEMP/bootstrap-x86-harness"
          timeout 30s "$RUNNER_TEMP/bootstrap-x86-harness"
          echo "Native x86 proof passed: rustc/mrustc emit byte-identical ELF objects and a GCC-linked harness executes return 42." >> "$GITHUB_STEP_SUMMARY"
      - name: Translate AArch64 backend and compile generated C with host GCC
        if: always() && steps.translate.outcome == 'success'
        shell: bash
        working-directory: mrustc
        env:
          RUSTC_VERSION: '1.90.0'
          MRUSTC_TARGET_VER: '1.90'
          OUTDIR_SUF: '-1.90.0'
          PARLEVEL: '2'
          CC: gcc
        run: |
          set -euo pipefail
          # Build the AArch64 backend implementation as a host x86-64 Rust
          # library translated to C; this does not execute AArch64 code.
          find . -type f -name '*.c' -printf '%P\n' | LC_ALL=C sort > "$RUNNER_TEMP/mrustc-aarch64-before.txt"
          timeout --signal=TERM --kill-after=10s 30m bin/minicargo \
            -L output-1.90.0 -o output-compiler-bootstrap \
            ../compiler/crates/backend-aarch64 > "$RUNNER_TEMP/mrustc-aarch64-probe.log" 2>&1
          find . -type f -name '*.c' -printf '%P\n' | LC_ALL=C sort > "$RUNNER_TEMP/mrustc-aarch64-after.txt"
          comm -13 "$RUNNER_TEMP/mrustc-aarch64-before.txt" "$RUNNER_TEMP/mrustc-aarch64-after.txt" > "$RUNNER_TEMP/mrustc-aarch64-new.txt"
          mapfile -t generated < "$RUNNER_TEMP/mrustc-aarch64-new.txt"
          test "${#generated[@]}" -gt 0
          mkdir -p "$RUNNER_TEMP/mrustc-aarch64-objects"
          n=0
          for relative in "${generated[@]}"; do
            gcc -std=gnu11 -O0 -c "$relative" -o "$RUNNER_TEMP/mrustc-aarch64-objects/$n.o"
            n=$((n + 1))
          done
          ar rcs "$RUNNER_TEMP/mrustc-aarch64-objects/libbackend-aarch64-probe.a" "$RUNNER_TEMP"/mrustc-aarch64-objects/*.o
          test -s "$RUNNER_TEMP/mrustc-aarch64-objects/libbackend-aarch64-probe.a"
          echo "compiler-backend-aarch64: mrustc→C and host GCC compiled $n units." >> "$GITHUB_STEP_SUMMARY"
      - name: Prepare temporary pinned frontend paths and vendor LALRPOP runtime
        if: always() && steps.backend-x86.outcome == 'success'
        id: driver-deps
        shell: bash
        run: |
          set -euo pipefail
          # Only checkout manifests are changed; original repositories stay intact.
          python3 bootstrap/prepare-mrustc-driver.py "$PWD"
          seed="$RUNNER_TEMP/mrustc-vendor-seed"
          mkdir -p "$seed/src"
          cat > "$seed/Cargo.toml" <<'TOML'
          [package]
          name = "mrustc-vendor-seed"
          version = "0.1.0"
          edition = "2021"
          [dependencies]
          lalrpop-util = { version = "=0.23.1", default-features = false }
          TOML
          printf 'fn main() {}\n' > "$seed/src/main.rs"
          timeout --signal=TERM --kill-after=10s 10m cargo vendor --manifest-path "$seed/Cargo.toml" \
            --versioned-dirs "$RUNNER_TEMP/mrustc-driver-vendor" \
            > "$RUNNER_TEMP/mrustc-driver-vendor-config.txt"
          test -f "$RUNNER_TEMP/mrustc-driver-vendor/lalrpop-util-0.23.1/Cargo.toml"
          echo "Driver inputs: pinned Oberon and Mini-C local checkouts, lalrpop-util 0.23.1 vendored on runner." >> "$GITHUB_STEP_SUMMARY"

      - name: Bootstrap real compiler driver via mrustc and GCC
        if: always() && steps.driver-deps.outcome == 'success'
        id: driver-bootstrap
        shell: bash
        working-directory: mrustc
        env:
          RUSTC_VERSION: '1.90.0'
          MRUSTC_TARGET_VER: '1.90'
          OUTDIR_SUF: '-1.90.0'
          PARLEVEL: '2'
          CC: gcc
        run: |
          set -euo pipefail
          # Full logs on failure are intentional and authorized for compiler-ci.
          set +e
          timeout --signal=TERM --kill-after=10s 40m bin/minicargo \
            --vendor-dir "$RUNNER_TEMP/mrustc-driver-vendor" \
            -L output-1.90.0 -o output-compiler-bootstrap \
            ../compiler/crates/driver > "$RUNNER_TEMP/mrustc-driver.log" 2>&1
          rc=$?
          set -e
          if (( rc != 0 )); then
            echo "::group::Full real compiler driver minicargo/mrustc/GCC errors"
            cat "$RUNNER_TEMP/mrustc-driver.log"
            echo "::endgroup::"
            echo "Real driver bootstrap failed: minicargo exit $rc" >> "$GITHUB_STEP_SUMMARY"
            exit "$rc"
          fi
          executable="output-compiler-bootstrap/compiler"
          if [[ ! -x "$executable" ]]; then
            echo "::error::Driver translation succeeded but expected GCC-linked executable not found: $executable"
            find output-compiler-bootstrap -maxdepth 2 -type f -executable -printf '%p\n' | sort
            exit 1
          fi
          timeout 30s "$executable" --help > "$RUNNER_TEMP/mrustc-driver-help.txt"
          grep -q 'Usage: compiler' "$RUNNER_TEMP/mrustc-driver-help.txt"
          echo "Real compiler driver built by mrustc→C→GCC and --help succeeded." >> "$GITHUB_STEP_SUMMARY"
      - name: Compile real Oberon and Mini-C sources with GCC-built compiler
        if: always() && steps.driver-bootstrap.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          driver="$PWD/mrustc/output-compiler-bootstrap/compiler"
          test -x "$driver"
          out="$RUNNER_TEMP/bootstrap-driver-source"
          mkdir -p "$out"
          # First exercise the real Oberon frontend and x86 direct ELF backend.
          timeout 60s "$driver" compiler/examples/Math.mod --language oberon \
            --target x86_64 --emit obj -o "$out/Math.o"
          test -s "$out/Math.o"
          readelf -h "$out/Math.o" | grep -q 'ELF64'
          readelf -h "$out/Math.o" | grep -q 'Advanced Micro Devices X86-64'
          nm -g "$out/Math.o"
          # Then compile a checked Mini-C function and execute the emitted
          # x86-64 ELF object linked into a separate C harness using GCC.
          cat > "$out/bootstrap_answer.c" <<'C'
          int bootstrap_answer(void) { return 6 * 7; }
          C
          timeout 60s "$driver" "$out/bootstrap_answer.c" --language mini-c \
            --target x86_64 --emit obj -o "$out/bootstrap_answer.o"
          test -s "$out/bootstrap_answer.o"
          readelf -h "$out/bootstrap_answer.o" | grep -q 'ELF64'
          nm -g "$out/bootstrap_answer.o" | grep -q bootstrap_answer
          cat > "$out/harness.c" <<'C'
          extern int bootstrap_answer(void);
          int main(void) { return bootstrap_answer() == 42 ? 0 : 1; }
          C
          gcc -no-pie "$out/harness.c" "$out/bootstrap_answer.o" -o "$out/harness"
          timeout 30s "$out/harness"
          echo "GCC-built compiler successfully compiled real Oberon and Mini-C source into ELF64; GCC-linked Mini-C program returned 42." >> "$GITHUB_STEP_SUMMARY"
      - name: Inventory mrustc C dialect and probe Mini-C checker
        if: always() && steps.driver-bootstrap.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          echo "Mini-C compatibility source: $(git -C mini-c-compat rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
          selection="$RUNNER_TEMP/mrustc-c-selections.txt"
          python3 bootstrap/probe-mrustc-c-dialect.py \
            "$PWD/mrustc/output-compiler-bootstrap" "$selection" \
            | tee "$RUNNER_TEMP/mrustc-c-features.log"
          {
            echo '### Actual mrustc-generated C feature inventory'
            echo '```text'
            cat "$RUNNER_TEMP/mrustc-c-features.log"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          timeout --signal=TERM --kill-after=10s 12m cargo build -q \
            --manifest-path mini-c-compat/Cargo.toml -p mini-c --features internal-cpp \
            --target-dir "$RUNNER_TEMP/mrustc-minic-target"
          checker="$RUNNER_TEMP/mrustc-minic-target/debug/mini-c"
          test -x "$checker"
          checked=0
          passed=0
          while IFS= read -r file; do
            ((checked+=1))
            echo "Probing Mini-C check --cpp=cc on $file"
            set +e
            timeout --signal=TERM --kill-after=10s 90s "$checker" \
              check --cpp=cc --max-errors=4 "$file" \
              > "$RUNNER_TEMP/mrustc-minic-$checked.log" 2>&1
            rc=$?
            set -e
            if (( rc == 0 )); then
              ((passed+=1))
              echo "Mini-C: $file PASSED syntax/semantics (no backend yet)"
            else
              echo "Mini-C: $file rejected (exit $rc); initial diagnostics:"
              sed -n '1,8p' "$RUNNER_TEMP/mrustc-minic-$checked.log"
            fi
            echo "Mini-C checker: $file exit=$rc" >> "$GITHUB_STEP_SUMMARY"
            sed -n '1,4p' "$RUNNER_TEMP/mrustc-minic-$checked.log" >> "$GITHUB_STEP_SUMMARY"
          done < "$selection"
          echo "Mini-C generated-C checks: $passed/$checked pass (diagnostic, non-gating; not native code generation)" >> "$GITHUB_STEP_SUMMARY"
          test "$checked" -gt 0

          # Probe the CURRENT opt-in streaming checker (128 MiB guarded
          # source/output budgets), including real 53–70 MiB C units.
          # GCC still compiles every generated C file into object code;
          # syntax-only Mini-C results are non-gating and NOT native builds.
          # In particular, C11 atomics are not yet supported in Mini-C
          # despite their use in mrustc-generated C. Never silently drop
          # qualifiers or treat a parser-only success as object acceptance.
          stream_checked=0
          stream_passed=0
          stream_skipped=0
          stream_failed=0
          while IFS= read -r file; do
            bytes=$(stat -c %s "$file")
            if (( bytes > 128 * 1024 * 1024 )); then
              ((stream_skipped+=1))
              echo "Mini-C streaming CPP: SKIP source exceeds 128 MiB byte ceiling"
              echo "Mini-C stream: skipped source >128 MiB" >> "$GITHUB_STEP_SUMMARY"
              continue
            fi
            ((stream_checked+=1))
            echo "Probing Mini-C check --cpp=internal-stream source_bytes=$bytes"
            set +e
            timeout --signal=TERM --kill-after=10s 90s \
              /usr/bin/time -f 'Stream checker elapsed=%e s; peak RSS=%M KiB' \
              -o "$RUNNER_TEMP/mrustc-minic-stream-$stream_checked.time" \
              "$checker" check --cpp=internal-stream --max-errors=4 "$file" \
              > "$RUNNER_TEMP/mrustc-minic-stream-$stream_checked.out" 2>&1
            rc=$?
            set -e
            if (( rc == 0 )); then
              ((stream_passed+=1))
              echo "Mini-C stream: syntax/sema accepted; no native object emitted"
            else
              ((stream_failed+=1))
              echo "Mini-C stream: rejected/failed rc=$rc, first diagnostic follows:"
              # Extract only parser diagnostic codes and short messages;
              # never copy private generated source text or paths into logs.
              python3 - "$RUNNER_TEMP/mrustc-minic-stream-$stream_checked.out" <<'PY'
          import pathlib, re, sys
          output = pathlib.Path(sys.argv[1]).read_text(errors="replace")
          codes = re.findall(r"error\[([A-Z][0-9]{4})\]:\s*([^\n]*)", output)
          if codes:
              for code, msg in codes[:4]:
                  print(f"{code}: {msg[:160]}")
          else:
              print(f"No structured Mini-C error, diagnostic bytes={len(output)}")
          PY
            fi
            {
              echo "Mini-C streaming CPP checker: input_bytes=$bytes exit=$rc (non-gating)"
              cat "$RUNNER_TEMP/mrustc-minic-stream-$stream_checked.time" 2>/dev/null || :
            } >> "$GITHUB_STEP_SUMMARY"
          done < "$selection"
          echo "Mini-C streamed C units: passed=$stream_passed rejected=$stream_failed skipped=$stream_skipped of $((stream_checked + stream_skipped)) (diagnostic only)" >> "$GITHUB_STEP_SUMMARY"
          echo "GCC remains the authoritative compiler for all generated C units, including those requiring C11 atomics." >> "$GITHUB_STEP_SUMMARY"
          echo "No object-code or atomic backend coverage is inferred from this source-language probe." >> "$GITHUB_STEP_SUMMARY"
      - name: Checkout pinned EDG callable frontend source for C compatibility audit
        if: always() && steps.translate.outcome == 'success'
        uses: actions/checkout@v4
        with:
          repository: bingundu/edgcpp
          ref: b195677be8b9b56c8337afad6be8064d21a54082
          path: edgcpp
          persist-credentials: false

      - name: Checkout pinned EDG Rust bridge for C compatibility audit
        if: always() && steps.translate.outcome == 'success'
        uses: actions/checkout@v4
        with:
          repository: bingordo/edgcpp-rust
          ref: 6bcf1508555fcc0c892c1e8e00929dda26154931
          path: edgcpp-rust
          persist-credentials: false

      - name: Probe real mrustc C through EDG parse and native TypeId gates
        if: always() && steps.translate.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          # Audit the real C already generated from compiler-ir and other
          # crates even when the optional full driver GCC bootstrap fails.
          # The original source C is not uploaded or published.
          selection="$RUNNER_TEMP/mrustc-c-selections.txt"
          if [[ ! -s "$selection" ]]; then
            python3 bootstrap/probe-mrustc-c-dialect.py \
              "$PWD/mrustc/output-compiler-bootstrap" "$selection"
          fi
          # Parse a small real mrustc TU first, not the 53+ MiB
          # compiler-ir library that previously segfaulted in EDG.
          # Keep the original large representative as a separate scale gate.
          source=$(python3 - "$PWD/mrustc/output-compiler-bootstrap" <<'PY'
          from pathlib import Path
          import sys
          files = [p for p in Path(sys.argv[1]).rglob("*.c") if p.is_file() and p.stat().st_size > 0]
          if not files:
              raise SystemExit("no real generated C files")
          print(min(files, key=lambda p: (p.stat().st_size, str(p))))
          PY
          )
          large_source=$(sed -n '1p' "$selection")
          test -f "$source" && test -f "$large_source"
          case "$source" in "$PWD"/*) ;; *) echo "invalid small C sample path"; exit 1;; esac
          case "$large_source" in "$PWD"/*) ;; *) echo "invalid large C sample path"; exit 1;; esac
          relative="${source#"$PWD"/}"
          large_relative="${large_source#"$PWD"/}"
          echo "EDG generated-C audit small bytes=$(stat -c %s "$source") large bytes=$(stat -c %s "$large_source")" >> "$GITHUB_STEP_SUMMARY"
          set +e
          timeout --signal=TERM --kill-after=20s 30m docker run --rm \
            --entrypoint /bin/bash \
            -v "$PWD:/workspace" \
            -v "$RUNNER_TEMP:/audit-tmp" \
            -e "AUDIT_SOURCE=/workspace/$relative" \
            -e "AUDIT_LARGE_SOURCE=/workspace/$large_relative" \
            ghcr.io/edgcpp/ci-runner@sha256:14b3948c2ce12cfa5472e5a6c468393d15426f3a67685cc35d830ea5db2acdf8 \
            -euo pipefail /workspace/bootstrap/run-mrustc-edg-gap.sh \
            > "$RUNNER_TEMP/mrustc-edg-audit.log" 2>&1
          rc=$?
          set -e
          echo "EDG audit runner exit=$rc (diagnostic only)" | tee -a "$GITHUB_STEP_SUMMARY"
          grep -E '^(EDG_GNU_ATTR_PARSE_[A-Z_]+_EXIT|EDG_C_(PARSE|TYPEID|LARGE_PARSE)_EXIT|EDG_C_(PARSE|LARGE_PARSE|LARGE_STACK64M_PARSE)_(CLASS|WALL_SECONDS|PEAK_RSS_KB)|EDG_C_LARGE_STACK64M_PARSE_EXIT|EDG_C_LARGE_STACK64M_RETRY|EDG_C_SAMPLE_BYTES|EDG_C_LARGE_BYTES)=' "$RUNNER_TEMP/mrustc-edg-audit.log" | tee -a "$GITHUB_STEP_SUMMARY" || true
          if ! grep -q '^EDG_C_PARSE_EXIT=' "$RUNNER_TEMP/mrustc-edg-audit.log"; then
            echo 'EDG generated-C audit did not reach the parser (preflight/toolchain failure); no attribute/ABI compatibility result.' | tee -a "$GITHUB_STEP_SUMMARY"
          fi
          echo 'EDG audit diagnostic tail:'
          tail -n 55 "$RUNNER_TEMP/mrustc-edg-audit.log"
          # A missing toolchain or a tested unsupported C feature does not
          # invalidate the established independent GCC bootstrap.
      - name: Mark experiment outcome
        if: always()
        shell: bash
        env:
          TOOLCHAIN_OUTCOME: ${{ steps.toolchain.outcome }}
          TRANSLATE_OUTCOME: ${{ steps.translate.outcome }}
          PROBE_EXIT: ${{ steps.translate.outputs.probe_exit }}
        run: |
          echo "Compiler crate outputs share a single per-run minicargo directory; no private compiler objects are uploaded to the public cache." >> "$GITHUB_STEP_SUMMARY"
          echo "mrustc build: $TOOLCHAIN_OUTCOME" >> "$GITHUB_STEP_SUMMARY"
          echo "Translation step: $TRANSLATE_OUTCOME; minicargo exit: ${PROBE_EXIT:-not reached}" >> "$GITHUB_STEP_SUMMARY"
          echo "Full driver GCC bootstrap and source-level checks are covered above; alternate C-compiler gap analysis is diagnostic-only." >> "$GITHUB_STEP_SUMMARY"
