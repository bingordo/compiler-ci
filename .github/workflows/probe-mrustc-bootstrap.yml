name: Prototype mrustc-to-C compiler bootstrap

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/probe-mrustc-bootstrap.yml'
  workflow_dispatch:
    inputs:
      source_ref:
        description: 'Compiler source branch, tag, or SHA'
        required: false
        default: main
        type: string

permissions:
  contents: read

concurrency:
  group: mrustc-bootstrap-${{ inputs.source_ref || 'main' }}
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    steps:
      - name: Checkout compiler-ci smoke fixtures
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Checkout compiler using existing read-only deploy key
        uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: ${{ inputs.source_ref || 'main' }}
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false

      - name: Checkout pinned mrustc
        uses: actions/checkout@v4
        with:
          repository: thepowersgang/mrustc
          ref: master
          path: mrustc
          persist-credentials: false

      - name: Identify mrustc cache revision
        id: mrustc-revision
        shell: bash
        run: echo "sha=$(git -C mrustc rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Restore prebuilt mrustc and Rust 1.90 libraries
        id: mrustc-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            mrustc/bin
            mrustc/output-1.90.0
          key: mrustc-bootstrap-v1-${{ runner.os }}-ubuntu2404-rust190-${{ steps.mrustc-revision.outputs.sha }}

      - name: Install mrustc build dependencies when the toolchain needs building
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ steps.mrustc-cache.outputs.cache-hit }}" == "true" ]] &&
             [[ -x mrustc/bin/mrustc ]] &&
             [[ -x mrustc/bin/minicargo ]] &&
             [[ -f mrustc/output-1.90.0/libcore.rlib ]]; then
            echo "Cached mrustc is complete; skipping apt install." >> "$GITHUB_STEP_SUMMARY"
          else
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends build-essential zlib1g-dev pkg-config cmake curl python3 libssl-dev
          fi
          # GCC and Cargo are required even when mrustc itself came from cache.
          command -v gcc
          command -v cargo
          command -v python3

      - name: Record reproducibility inputs and target crates
        shell: bash
        run: |
          set -euo pipefail
          echo "Compiler SHA: $(git -C compiler rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
          echo "mrustc SHA: $(git -C mrustc rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
          echo "Host: $(uname -m) / $(lsb_release -rs)" >> "$GITHUB_STEP_SUMMARY"
          echo "Rust crate editions:" >> "$GITHUB_STEP_SUMMARY"
          grep -Rh '^edition[[:space:]]*=' compiler/crates/*/Cargo.toml | sort | uniq -c >> "$GITHUB_STEP_SUMMARY"
          echo "First target: compiler-ir (no frontend dependency); then compiler-opt, backend, driver." >> "$GITHUB_STEP_SUMMARY"

      - name: Build mrustc and matching Rust 1.90 libraries
        id: toolchain
        shell: bash
        working-directory: mrustc
        env:
          RUSTC_VERSION: '1.90.0'
          MRUSTC_TARGET_VER: '1.90'
          OUTDIR_SUF: '-1.90.0'
          PARLEVEL: '2'
        run: |
          set -euo pipefail
          if [[ "${{ steps.mrustc-cache.outputs.cache-hit }}" == "true" ]] && \
             [[ -x bin/mrustc ]] && [[ -x bin/minicargo ]] && \
             [[ -f output-1.90.0/libcore.rlib ]]; then
            echo "Using cached mrustc toolchain and Rust libraries" >> "$GITHUB_STEP_SUMMARY"
          else
            # Missing/incomplete caches rebuild in this runner.
            timeout --signal=TERM --kill-after=10s 20m make -j2
            timeout --signal=TERM --kill-after=10s 10m make RUSTCSRC
            timeout --signal=TERM --kill-after=10s 55m make -f minicargo.mk LIBS
          fi
          test -x bin/mrustc
          test -x bin/minicargo
          test -f output-1.90.0/libcore.rlib

      - name: Cache validated mrustc toolchain
        if: success() && steps.mrustc-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            mrustc/bin
            mrustc/output-1.90.0
          key: mrustc-bootstrap-v1-${{ runner.os }}-ubuntu2404-rust190-${{ steps.mrustc-revision.outputs.sha }}

      - name: Snapshot C files before translation
        shell: bash
        run: |
          find mrustc -type f -name '*.c' -printf '%P\n' | LC_ALL=C sort > "$RUNNER_TEMP/mrustc-c-before.txt"

      - name: Attempt compiler-ir Rust-to-C emission
        id: translate
        shell: bash
        working-directory: mrustc
        env:
          RUSTC_VERSION: '1.90.0'
          MRUSTC_TARGET_VER: '1.90'
          OUTDIR_SUF: '-1.90.0'
          PARLEVEL: '2'
          CC: gcc
        run: |
          set -euo pipefail
          # This is deliberately a bounded first-crate feasibility probe, not
          # an assertion that the full Cargo workspace is supported.
          set +e
          # minicargo's positional argument is the crate DIRECTORY, not Cargo.toml.
          # Share one fresh per-run directory across all compiler crate probes.
          # minicargo can now reuse compiler-ir and other completed dependencies.
          # Do not persist private generated C/rlibs in public Actions caches.
          timeout --signal=TERM --kill-after=10s 20m bin/minicargo \
            -L output-1.90.0 -o output-compiler-bootstrap \
            ../compiler/crates/ir > "$RUNNER_TEMP/mrustc-probe.log" 2>&1
          rc=$?
          set -e
          echo "mrustc/minicargo exit code: $rc" >> "$GITHUB_STEP_SUMMARY"
          find . -type f -name '*.c' -printf '%P\n' | LC_ALL=C sort > "$RUNNER_TEMP/mrustc-c-after.txt"
          # Before-snapshot is relative to mrustc/; after-snapshot is also
          # relative to mrustc/, avoiding false differences from prefix changes.
          comm -13 "$RUNNER_TEMP/mrustc-c-before.txt" "$RUNNER_TEMP/mrustc-c-after.txt" > "$RUNNER_TEMP/mrustc-c-new.txt"
          echo "New C files from attempted translation: $(wc -l < "$RUNNER_TEMP/mrustc-c-new.txt")" >> "$GITHUB_STEP_SUMMARY"
          echo "All C files (includes prebuilt Rust stdlib): $(wc -l < "$RUNNER_TEMP/mrustc-c-after.txt")" >> "$GITHUB_STEP_SUMMARY"
          # Do not print private compiler source or raw diagnostics into public CI.
          python3 - "$RUNNER_TEMP/mrustc-probe.log" "$GITHUB_STEP_SUMMARY" <<'PY'
          import pathlib, re, sys
          log = pathlib.Path(sys.argv[1]).read_text(errors="replace")
          categories = {
              "manifest or dependency resolution": r"failed to (load|parse|select|resolve)|dependency|manifest",
              "missing files or paths": r"No such file|not found|cannot open",
              "unsupported Rust feature": r"unsupported|not implemented|unimplemented|TODO",
              "type or parsing error": r"parse error|type error|error:|ERROR:",
              "compiler crash": r"SIGSEGV|segmentation fault|panic|assertion failed",
              "GCC diagnostic": r"gcc: error|fatal error:|compilation terminated",
          }
          print("Diagnostic categories (counts; non-exclusive):", file=open(sys.argv[2], "a"))
          with open(sys.argv[2], "a") as out:
              for name, pattern in categories.items():
                  print(f"- {name}: {len(re.findall(pattern, log, re.I))}", file=out)
          PY
          echo "Target translation must succeed before GCC syntax and object tests run." >> "$GITHUB_STEP_SUMMARY"
          if (( rc != 0 )); then
            # Only show a bounded, non-source-bearing summary here. Private
            # diagnostics remain in the runner temp log.
            echo "minicargo failed; inspect diagnostic categories above." >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "probe_exit=$rc" >> "$GITHUB_OUTPUT"
          # A nonzero exit is a real failed acceptance gate, not a green probe.
          exit "$rc"

      - name: Compile newly generated C with GCC
        if: steps.translate.outputs.probe_exit == '0'
        shell: bash
        working-directory: mrustc
        run: |
          set -euo pipefail
          mapfile -t generated < "$RUNNER_TEMP/mrustc-c-new.txt"
          if (( ${#generated[@]} == 0 )); then
            echo "No newly generated C files to compile; cannot verify C output." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/mrustc-gcc-objects"
          count=0
          for relative in "${generated[@]}"; do
            [[ -f "$relative" ]] || exit 1
            # Each emitted C unit is compiled, not merely syntax-checked.
            # This direct probe can reveal missing generator-specific GCC
            # flags/includes even if minicargo's own compile succeeded.
            gcc -std=gnu11 -O0 -c "$relative" -o "$RUNNER_TEMP/mrustc-gcc-objects/$count.o"
            count=$((count + 1))
          done
          test "$count" -gt 0
          ar rcs "$RUNNER_TEMP/mrustc-gcc-objects/libgenerated-probe.a" "$RUNNER_TEMP"/mrustc-gcc-objects/*.o
          nm -g "$RUNNER_TEMP/mrustc-gcc-objects/libgenerated-probe.a" > "$RUNNER_TEMP/mrustc-gcc-symbols.txt"
          echo "GCC successfully compiled $count newly generated C units into object files." >> "$GITHUB_STEP_SUMMARY"
          echo "Compiler-ir is a library: this checks native object production, not runtime correctness." >> "$GITHUB_STEP_SUMMARY"

      - name: Translate compiler-opt and compile generated C with GCC
        id: optimizer
        shell: bash
        working-directory: mrustc
        env:
          RUSTC_VERSION: '1.90.0'
          MRUSTC_TARGET_VER: '1.90'
          OUTDIR_SUF: '-1.90.0'
          PARLEVEL: '2'
          CC: gcc
        run: |
          set -euo pipefail
          # compiler-opt depends on compiler-ir. minicargo must resolve and
          # compile the real local path dependency, not a synthetic stub.
          # The shared output directory reuses compiler-ir from the prior step.
          find . -type f -name '*.c' -printf '%P\n' | LC_ALL=C sort > "$RUNNER_TEMP/mrustc-opt-c-before.txt"
          set +e
          timeout --signal=TERM --kill-after=10s 30m bin/minicargo \
            -L output-1.90.0 -o output-compiler-bootstrap \
            ../compiler/crates/opt > "$RUNNER_TEMP/mrustc-opt-probe.log" 2>&1
          rc=$?
          set -e
          if (( rc != 0 )); then
            # The maintainer explicitly approved publishing full diagnostics
            # in this public compiler-ci run, including Rust source excerpts.
            echo "::group::Full compiler-opt minicargo failure output"
            cat "$RUNNER_TEMP/mrustc-opt-probe.log"
            echo "::endgroup::"
            python3 - "$RUNNER_TEMP/mrustc-opt-probe.log" "$GITHUB_STEP_SUMMARY" <<'PY'
          import pathlib, re, sys
          log = pathlib.Path(sys.argv[1]).read_text(errors="replace")
          classes = {
              "manifest/dependency resolution": r"failed to (load|parse|select|resolve)|dependency|manifest|no lockfile",
              "missing paths/files": r"No such file|not found|cannot open",
              "unsupported Rust": r"unsupported|not implemented|unimplemented|unknown feature",
              "Rust parse/type error": r"parse error|type error|error:|ERROR:",
              "compiler crash": r"SIGSEGV|segmentation fault|panic|assertion failed",
              "C toolchain error": r"gcc: error|fatal error:|compilation terminated",
          }
          # Fixed labels only: this is a PUBLIC CI repository, so never print
          # raw mrustc diagnostics, source names, source lines or file paths.
          specific = [
              ("dependency cycle", r"circular dependency|cyclic dependency|dependency cycle|cycle detected"),
              ("lockfile/dependency resolution", r"no lockfile entry|failed to resolve|unable to resolve|could not resolve"),
              ("missing package", r"failed to find package|unknown package|package .* not found"),
              ("unsupported Rust language feature", r"unimplemented|unsupported|not yet implemented|unknown feature"),
              ("source parse/type error", r"parse error|type error|unexpected token|syntax error"),
              ("missing path/file", r"no such file|could not open|cannot open|not found"),
              ("mrustc crash", r"segmentation fault|sigsegv|assertion failed|panic"),
              ("GCC error", r"gcc: error|fatal error:|compilation terminated"),
          ]
          findings = [name for name, rx in specific if re.search(rx, log, re.I)]
          lines = ["compiler-opt minicargo diagnostic (sanitized):",
                   "error category: " + (", ".join(findings) if findings else "unclassified"),
                   "diagnostic bytes: {}; lines: {}".format(len(log), log.count("\n"))]
          lines += ["{} matches: {}".format(label, len(re.findall(rx, log, re.I))) for label, rx in classes.items()]
          print("\n".join(lines))
          with open(sys.argv[2], "a") as out:
              out.write("\n".join(lines) + "\n")
          PY
            exit "$rc"
          fi
          find . -type f -name '*.c' -printf '%P\n' | LC_ALL=C sort > "$RUNNER_TEMP/mrustc-opt-c-after.txt"
          comm -13 "$RUNNER_TEMP/mrustc-opt-c-before.txt" "$RUNNER_TEMP/mrustc-opt-c-after.txt" > "$RUNNER_TEMP/mrustc-opt-c-new.txt"
          mapfile -t generated < "$RUNNER_TEMP/mrustc-opt-c-new.txt"
          if (( ${#generated[@]} == 0 )); then
            echo "compiler-opt: no new generated C files" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/mrustc-opt-gcc-objects"
          count=0
          for relative in "${generated[@]}"; do
            [[ -f "$relative" ]] || exit 1
            gcc -std=gnu11 -O0 -c "$relative" -o "$RUNNER_TEMP/mrustc-opt-gcc-objects/$count.o"
            count=$((count + 1))
          done
          ar rcs "$RUNNER_TEMP/mrustc-opt-gcc-objects/libcompiler-opt-probe.a" "$RUNNER_TEMP"/mrustc-opt-gcc-objects/*.o
          test -s "$RUNNER_TEMP/mrustc-opt-gcc-objects/libcompiler-opt-probe.a"
          if grep -q 'BUILDING compiler-ir v' "$RUNNER_TEMP/mrustc-opt-probe.log"; then
            echo "compiler-opt: compiler-ir dependency rebuilt in shared directory." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "compiler-opt: compiler-ir dependency reused from shared build." >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "compiler-opt: minicargo succeeded and GCC compiled $count new C units." >> "$GITHUB_STEP_SUMMARY"
          echo "This verifies native object compilation, not semantic correctness or a runnable compiler." >> "$GITHUB_STEP_SUMMARY"

      - name: Diagnose optimizer dev-dependency handling
        if: always() && steps.optimizer.outcome == 'failure'
        shell: bash
        working-directory: mrustc
        env:
          RUSTC_VERSION: '1.90.0'
          MRUSTC_TARGET_VER: '1.90'
          OUTDIR_SUF: '-1.90.0'
          PARLEVEL: '2'
          CC: gcc
        run: |
          set -euo pipefail
          manifest=../compiler/crates/opt/Cargo.toml
          cp "$manifest" "$RUNNER_TEMP/compiler-opt-original.toml"
          trap 'cp "$RUNNER_TEMP/compiler-opt-original.toml" "$manifest"' EXIT
          # Diagnostic only: remove the dev-dependencies section in the CI
          # checkout to test whether minicargo handles the x86/opt cycle.
          python3 - "$manifest" <<'PY'
          from pathlib import Path
          import re, sys
          path = Path(sys.argv[1])
          original = path.read_text()
          altered, count = re.subn(r'(?ms)^\[dev-dependencies\]\s*\n.*?(?=^\[|\Z)', '', original)
          assert count == 1, 'Expected one dev-dependencies section'
          path.write_text(altered)
          PY
          set +e
          timeout --signal=TERM --kill-after=10s 12m bin/minicargo \
            -L output-1.90.0 -o output-compiler-opt-no-dev \
            ../compiler/crates/opt > "$RUNNER_TEMP/mrustc-opt-no-dev.log" 2>&1
          rc=$?
          set -e
          echo "compiler-opt without dev-dependencies: minicargo exit $rc (diagnostic only)" >> "$GITHUB_STEP_SUMMARY"
          echo "compiler-opt without dev-dependencies: minicargo exit $rc (diagnostic only)"
          if (( rc != 0 )); then
            echo "::group::Full compiler-opt diagnostic retry output (without dev-dependencies)"
            cat "$RUNNER_TEMP/mrustc-opt-no-dev.log"
            echo "::endgroup::"
          fi
          if (( rc == 0 )); then
            echo "Likely blocker: minicargo handles the real dev-dependency graph differently from Cargo." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Optimizer still fails without dev-dependencies; preserve original failure status." >> "$GITHUB_STEP_SUMMARY"
          fi
          # Restore the exact original manifest before any other tests.
      - name: Translate compiler-backend and compile generated C with GCC
        if: always() && steps.translate.outcome == 'success'
        id: backend
        shell: bash
        working-directory: mrustc
        env:
          RUSTC_VERSION: '1.90.0'
          MRUSTC_TARGET_VER: '1.90'
          OUTDIR_SUF: '-1.90.0'
          PARLEVEL: '2'
          CC: gcc
        run: |
          set -euo pipefail
          # The target-neutral backend depends on compiler-ir, not compiler-opt.
          # Run it independently to map bootstrap coverage despite opt failure.
          find . -type f -name '*.c' -printf '%P\n' | LC_ALL=C sort > "$RUNNER_TEMP/mrustc-backend-before.txt"
          set +e
          timeout --signal=TERM --kill-after=10s 30m bin/minicargo \
            -L output-1.90.0 -o output-compiler-bootstrap \
            ../compiler/crates/backend > "$RUNNER_TEMP/mrustc-backend-probe.log" 2>&1
          rc=$?
          set -e
          find . -type f -name '*.c' -printf '%P\n' | LC_ALL=C sort > "$RUNNER_TEMP/mrustc-backend-after.txt"
          comm -13 "$RUNNER_TEMP/mrustc-backend-before.txt" "$RUNNER_TEMP/mrustc-backend-after.txt" > "$RUNNER_TEMP/mrustc-backend-new.txt"
          echo "compiler-backend: minicargo exit=$rc, newly generated C files=$(wc -l < "$RUNNER_TEMP/mrustc-backend-new.txt")" >> "$GITHUB_STEP_SUMMARY"
          if (( rc != 0 )); then
            # Public repo: publish only categorical diagnostics, never private
            # source excerpts, generated C, or paths from the error log.
            python3 - "$RUNNER_TEMP/mrustc-backend-probe.log" "$GITHUB_STEP_SUMMARY" <<'PY'
          import pathlib, re, sys
          log = pathlib.Path(sys.argv[1]).read_text(errors="replace")
          classes = {
              "dependency resolution": r"dependency|manifest|lockfile|couldn't find|not found",
              "Rust source parsing or type error": r"parse error|type error|error:|ERROR:",
              "unsupported language/compiler feature": r"unsupported|not implemented|unimplemented",
              "mrustc crash": r"SIGSEGV|segmentation fault|panic|assertion failed",
              "host C compiler error": r"gcc: error|fatal error:|compilation terminated",
          }
          with open(sys.argv[2], "a") as out:
              print("compiler-backend diagnostic categories:", file=out)
              for name, pattern in classes.items():
                  print("- {}: {}".format(name, len(re.findall(pattern, log, re.I))), file=out)
          PY
            exit "$rc"
          fi
          mapfile -t generated < "$RUNNER_TEMP/mrustc-backend-new.txt"
          test "${#generated[@]}" -gt 0
          mkdir -p "$RUNNER_TEMP/mrustc-backend-gcc-objects"
          count=0
          for relative in "${generated[@]}"; do
            test -f "$relative"
            gcc -std=gnu11 -O0 -c "$relative" -o "$RUNNER_TEMP/mrustc-backend-gcc-objects/$count.o"
            count=$((count + 1))
          done
          ar rcs "$RUNNER_TEMP/mrustc-backend-gcc-objects/libcompiler-backend-probe.a" "$RUNNER_TEMP"/mrustc-backend-gcc-objects/*.o
          test -s "$RUNNER_TEMP/mrustc-backend-gcc-objects/libcompiler-backend-probe.a"
          if grep -q 'BUILDING compiler-ir v' "$RUNNER_TEMP/mrustc-backend-probe.log"; then
            echo "compiler-backend: compiler-ir dependency rebuilt." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "compiler-backend: compiler-ir dependency reused." >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "compiler-backend: GCC compiled $count generated C units into a static archive." >> "$GITHUB_STEP_SUMMARY"

      - name: Translate AArch64 backend and compile generated C with host GCC
        if: always() && steps.translate.outcome == 'success'
        shell: bash
        working-directory: mrustc
        env:
          RUSTC_VERSION: '1.90.0'
          MRUSTC_TARGET_VER: '1.90'
          OUTDIR_SUF: '-1.90.0'
          PARLEVEL: '2'
          CC: gcc
        run: |
          set -euo pipefail
          # Build the AArch64 backend implementation as a host x86-64 Rust
          # library translated to C; this does not execute AArch64 code.
          find . -type f -name '*.c' -printf '%P\n' | LC_ALL=C sort > "$RUNNER_TEMP/mrustc-aarch64-before.txt"
          timeout --signal=TERM --kill-after=10s 30m bin/minicargo \
            -L output-1.90.0 -o output-compiler-bootstrap \
            ../compiler/crates/backend-aarch64 > "$RUNNER_TEMP/mrustc-aarch64-probe.log" 2>&1
          find . -type f -name '*.c' -printf '%P\n' | LC_ALL=C sort > "$RUNNER_TEMP/mrustc-aarch64-after.txt"
          comm -13 "$RUNNER_TEMP/mrustc-aarch64-before.txt" "$RUNNER_TEMP/mrustc-aarch64-after.txt" > "$RUNNER_TEMP/mrustc-aarch64-new.txt"
          mapfile -t generated < "$RUNNER_TEMP/mrustc-aarch64-new.txt"
          test "${#generated[@]}" -gt 0
          mkdir -p "$RUNNER_TEMP/mrustc-aarch64-objects"
          n=0
          for relative in "${generated[@]}"; do
            gcc -std=gnu11 -O0 -c "$relative" -o "$RUNNER_TEMP/mrustc-aarch64-objects/$n.o"
            n=$((n + 1))
          done
          ar rcs "$RUNNER_TEMP/mrustc-aarch64-objects/libbackend-aarch64-probe.a" "$RUNNER_TEMP"/mrustc-aarch64-objects/*.o
          test -s "$RUNNER_TEMP/mrustc-aarch64-objects/libbackend-aarch64-probe.a"
          echo "compiler-backend-aarch64: mrustc→C and host GCC compiled $n units." >> "$GITHUB_STEP_SUMMARY"
      - name: Run compiler-ir executable through host rustc and mrustc/GCC
        if: always() && steps.translate.outcome == 'success'
        shell: bash
        env:
          RUSTC_VERSION: '1.90.0'
          MRUSTC_TARGET_VER: '1.90'
          OUTDIR_SUF: '-1.90.0'
          PARLEVEL: '2'
          CC: gcc
        run: |
          set -euo pipefail
          fixture="$PWD/bootstrap/mrustc-gcc-smoke"
          timeout --signal=TERM --kill-after=10s 10m cargo run --quiet \
            --manifest-path "$fixture/Cargo.toml" \
            --target-dir "$RUNNER_TEMP/bootstrap-host-target" \
            > "$RUNNER_TEMP/bootstrap-host.out"
          (
            cd mrustc
            timeout --signal=TERM --kill-after=10s 25m bin/minicargo \
              -L output-1.90.0 -o output-compiler-bootstrap \
              "$fixture" > "$RUNNER_TEMP/bootstrap-mrustc.log" 2>&1
          )
          mapfile -t executables < <(find mrustc/output-compiler-bootstrap \
            -maxdepth 2 -type f -executable -name '*smoke*' | LC_ALL=C sort)
          if (( ${#executables[@]} != 1 )); then
            echo "Expected one mrustc/GCC-linked smoke executable, got ${#executables[@]}" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          timeout 30s "${executables[0]}" > "$RUNNER_TEMP/bootstrap-mrustc.out"
          diff -u "$RUNNER_TEMP/bootstrap-host.out" "$RUNNER_TEMP/bootstrap-mrustc.out"
          grep -q '^compiler-ir-smoke:' "$RUNNER_TEMP/bootstrap-mrustc.out"
          echo "Executable GCC oracle passed: mrustc output equals rustc output on compiler-ir integer semantics." >> "$GITHUB_STEP_SUMMARY"

      - name: Mark experiment outcome
        if: always()
        shell: bash
        env:
          TOOLCHAIN_OUTCOME: ${{ steps.toolchain.outcome }}
          TRANSLATE_OUTCOME: ${{ steps.translate.outcome }}
          PROBE_EXIT: ${{ steps.translate.outputs.probe_exit }}
        run: |
          echo "mrustc build: $TOOLCHAIN_OUTCOME" >> "$GITHUB_STEP_SUMMARY"
          echo "Translation step: $TRANSLATE_OUTCOME; minicargo exit: ${PROBE_EXIT:-not reached}" >> "$GITHUB_STEP_SUMMARY"
          echo "No Mini-C compilation or full bootstrap is claimed by this prototype." >> "$GITHUB_STEP_SUMMARY"
