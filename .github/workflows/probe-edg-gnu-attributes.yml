name: EDG GNU attributes - isolated parser and TypeId diagnostic
on:
  push:
    branches: [ci/standalone-edg-gnu-attribute-probe, ci/edg-gnu-attribute-control-slices, ci/edg-bootstrap-scalar-global-provenance]
    paths:
      - '.github/workflows/probe-edg-gnu-attributes.yml'
      - 'bootstrap/run-mrustc-edg-gap.sh'
      - 'bootstrap/edg_parse_probe.rs'
      - 'bootstrap/fixtures/edg-gnu-attributes/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  attributes:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout public compiler-ci attribute fixtures and probe
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Checkout pinned compiler native TypeId driver
        uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 76e8012abd846a3db9d1749a48b7407bbfdb3f2f
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Checkout pinned EDG frontend
        uses: actions/checkout@v4
        with:
          repository: bingundu/edgcpp
          ref: b195677be8b9b56c8337afad6be8064d21a54082
          path: edgcpp
          persist-credentials: false
      - name: Checkout pinned Rust EDG bridge
        uses: actions/checkout@v4
        with:
          repository: bingordo/edgcpp-rust
          ref: 6bcf1508555fcc0c892c1e8e00929dda26154931
          path: edgcpp-rust
          persist-credentials: false
      - name: Audit real GNU attribute syntax and native TypeId separately
        shell: bash
        run: |
          set -euo pipefail
          # This independent job does NOT need mrustc or the private
          # 405 MiB generated C corpus. All fixtures live in compiler-ci.
          for file in bootstrap/fixtures/edg-gnu-attributes/*.c; do
            gcc -std=gnu11 -Wall -Wextra -Werror -fsyntax-only "$file"
          done
          set +e
          timeout --signal=TERM --kill-after=20s 30m docker run --rm \
            --entrypoint /bin/bash \
            -v "$PWD:/workspace" \
            -v "$RUNNER_TEMP:/audit-tmp" \
            -e AUDIT_SOURCE=/workspace/bootstrap/fixtures/edg-gnu-attributes/alignment.c \
            ghcr.io/edgcpp/ci-runner@sha256:14b3948c2ce12cfa5472e5a6c468393d15426f3a67685cc35d830ea5db2acdf8 \
            -euo pipefail /workspace/bootstrap/run-mrustc-edg-gap.sh \
            > "$RUNNER_TEMP/edg-attributes-audit.log" 2>&1
          rc=$?
          set -e
          {
            echo "### Public GNU attribute oracles (EDG vs GCC; native TypeId separately)"
            echo "EDG probe infrastructure exit: $rc"
            grep -E '^(EDG_GNU_ATTR_(PARSE|NATIVE)_[A-Z_]+_(EXIT|OBJECT|REJECTION)|EDG_C_(PARSE|TYPEID)_EXIT|EDG_C_PARSE_CLASS|EDG_C_SAMPLE_BYTES|EDG_PROBE_RESULT)' "$RUNNER_TEMP/edg-attributes-audit.log" || true
            echo "GCC syntax-only accepted all four fixture groups; EDG parser/native return statuses above are separate evidence."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "EDG diagnostic result markers:"
          grep -E '^(EDG_GNU_ATTR_(PARSE|NATIVE)_[A-Z_]+_(EXIT|OBJECT|REJECTION)|EDG_C_(PARSE|TYPEID)_EXIT|EDG_C_PARSE_CLASS|EDG_PROBE_RESULT)' "$RUNNER_TEMP/edg-attributes-audit.log" || true
          if (( rc != 0 )); then
            echo "::error::EDG fixture preflight or toolchain failed before completing probe"
            tail -n 20 "$RUNNER_TEMP/edg-attributes-audit.log"
            exit "$rc"
          fi
          for kind in ALIGNMENT LINKAGE ABI NAKED CONTROL_GLOBALS WEAK_FUNCTION SECTION_FUNCTION CONTROL_ASM ALIGNED_GLOBAL SCALAR_GLOBAL WEAK_SCALAR_GLOBAL; do
            grep -q "^EDG_GNU_ATTR_PARSE_${kind}_EXIT=" "$RUNNER_TEMP/edg-attributes-audit.log" || {
              echo "::error::Missing EDG GNU attribute result for $kind"
              exit 1
            }
          done
          grep -q '^EDG_C_PARSE_EXIT=' "$RUNNER_TEMP/edg-attributes-audit.log"
          echo "Native ELF validation (diagnostic; parser acceptance is not native support):"
          if [[ -s "$RUNNER_TEMP/edg-gnu-linkage.o" ]]; then
            weak=0
            section=0
            readelf -W -s "$RUNNER_TEMP/edg-gnu-linkage.o" | grep -Eq 'WEAK.*attribute_weak' && weak=1 || :
            readelf -W -S "$RUNNER_TEMP/edg-gnu-linkage.o" | grep -qF '.data.edg_attr_probe' && section=1 || :
            echo "EDG_GNU_ATTR_LINKAGE_ELF weak=$weak section=$section"
          else
            echo "EDG_GNU_ATTR_LINKAGE_ELF object_not_emitted"
          fi
          if [[ -s "$RUNNER_TEMP/edg-gnu-weak_function.o" ]]; then
            if readelf -W -s "$RUNNER_TEMP/edg-gnu-weak_function.o" |
               grep -Eq 'WEAK.*attribute_weak_function'; then
              echo "EDG_GNU_ATTR_WEAK_FUNCTION_ELF=weak"
            else
              echo "EDG_GNU_ATTR_WEAK_FUNCTION_ELF=not_weak"
            fi
          else
            echo "EDG_GNU_ATTR_WEAK_FUNCTION_ELF=object_not_emitted"
          fi
          if [[ -s "$RUNNER_TEMP/edg-gnu-section_function.o" ]]; then
            if readelf -W -S "$RUNNER_TEMP/edg-gnu-section_function.o" |
               grep -qF '.text.edg_attr_probe'; then
              echo "EDG_GNU_ATTR_SECTION_FUNCTION_ELF=custom_section"
            else
              echo "EDG_GNU_ATTR_SECTION_FUNCTION_ELF=no_custom_section"
            fi
          else
            echo "EDG_GNU_ATTR_SECTION_FUNCTION_ELF=object_not_emitted"
          fi
          cat > "$RUNNER_TEMP/attribute-harness.c" <<'C'
          extern int attribute_layout(void);
          extern int attribute_abi(void);
          #if defined(TEST_LAYOUT)
          int main(void) { return attribute_layout() == 5 ? 0 : 1; }
          #else
          int main(void) { return attribute_abi() == 7 ? 0 : 1; }
          #endif
          C
          for kind in alignment abi; do
            if [[ -s "$RUNNER_TEMP/edg-gnu-$kind.o" ]]; then
              args=()
              if [[ "$kind" == alignment ]]; then args=(-DTEST_LAYOUT); fi
              if gcc -no-pie "${args[@]}" "$RUNNER_TEMP/attribute-harness.c" \
                   "$RUNNER_TEMP/edg-gnu-$kind.o" -o "$RUNNER_TEMP/edg-$kind-exe" &&
                 timeout 10s "$RUNNER_TEMP/edg-$kind-exe"; then
                echo "EDG_GNU_ATTR_NATIVE_RUNTIME_${kind^^}=pass"
              else
                echo "EDG_GNU_ATTR_NATIVE_RUNTIME_${kind^^}=fail"
              fi
            else
              echo "EDG_GNU_ATTR_NATIVE_RUNTIME_${kind^^}=object_not_emitted"
            fi
          done
