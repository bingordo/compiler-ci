name: Verify X4 total CTZ port on current compiler
on:
  push:
    branches: [main]
    paths: ['.github/workflows/verify-x86-x4-ctz-main.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  x4-ctz:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: integration/x86-x4-ctz-main-20261102
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Record exact source revision
        run: git rev-parse HEAD
      - name: Check x86 ISA form freshness
        run: python3 tools/regen_x86_forms.py --check
      - name: Restrict to core workspace
        run: |
          cat > Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir","crates/opt","crates/backend","crates/backend-x86"]
          EOF
          rm -f Cargo.lock
      - uses: Swatinem/rust-cache@v2
        with:
          key: x86-x4-ctz-main
      - name: Validate core and all native x86 tests
        run: |
          set -euo pipefail
          cargo test -p compiler-ir -p compiler-opt -p compiler-backend -p compiler-backend-x86
          echo X4_CTZ_MAIN status=PASS
