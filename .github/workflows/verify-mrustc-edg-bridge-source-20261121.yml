name: Verify compiler-pinned EDG parser bridge for real generated C

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/verify-mrustc-edg-bridge-source-20261121.yml'
      - 'bootstrap/run-mrustc-edg-gap.sh'
      - 'bootstrap/edg_parse_probe.rs'
      - '.github/workflows/probe-mrustc-bootstrap.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  edg-source-bridge:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    container:
      image: ghcr.io/edgcpp/ci-runner@sha256:14b3948c2ce12cfa5472e5a6c468393d15426f3a67685cc35d830ea5db2acdf8
    defaults:
      run:
        shell: edg-container-exec "bash -eo pipefail {0}"
    env:
      COMPILER_SHA: 84a0ac3d8dcf680c58218e7c392232225b7df0d5
      EDG_SOURCE_SHA: b195677be8b9b56c8337afad6be8064d21a54082
      EDG_RELEASE_TAG: edgcpfe-v2026.11.14-upstream-177765bb7731
      EDG_RELEASE_SHA256: 1ce495b629924f31382ecccc891a7a72caae1014ddfa2ba7dd39b44d8b0a9526
      EDGCPP_SOURCE_DIR: ${{ github.workspace }}/edgcpp
      EDGCPP_COMPILE_COMMANDS: ${{ github.workspace }}/edgcpp/build/gcc-release/compile_commands.json
      EDGCPP_LIB_DIR: ${{ github.workspace }}/edgcpp/build/gcc-release/lib
      EDGCPP_EDG_REVISION: b195677be8b9b56c8337afad6be8064d21a54082
      CARGO_PROFILE_DEV_DEBUG: '0'
    steps:
      - name: Check out original bootstrap probe
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Check out exact compiler source
        uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 84a0ac3d8dcf680c58218e7c392232225b7df0d5
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false

      - name: Check out upstream EDG callable source
        uses: actions/checkout@v4
        with:
          repository: bingundu/edgcpp
          ref: b195677be8b9b56c8337afad6be8064d21a54082
          path: edgcpp
          persist-credentials: false

      - name: Derive native EDG bridge pin from compiler
        id: bridge
        run: |
          set -euo pipefail
          test "$(git -C compiler rev-parse HEAD)" = "$COMPILER_SHA"
          test "$(git -C edgcpp rev-parse HEAD)" = "$EDG_SOURCE_SHA"
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import re, tomllib
          with open('compiler/tools/edg-driver/Cargo.toml','rb') as file:
              dep=tomllib.load(file)['dependencies']['edgcpp']
          assert dep['git'] == 'https://github.com/bingordo/edgcpp-rust.git'
          assert re.fullmatch(r'[0-9a-f]{40}', dep['rev'])
          print('sha='+dep['rev'])
          PY

      - name: Check out exact EDG Rust source bridge
        uses: actions/checkout@v4
        with:
          repository: bingordo/edgcpp-rust
          ref: ${{ steps.bridge.outputs.sha }}
          path: edgcpp-rust
          persist-credentials: false

      - name: Configure pinned upstream EDG headers
        working-directory: edgcpp
        env:
          EDG_BASE: ${{ github.workspace }}/edgcpp/bases/docker/dev-env/gcc
        run: |
          set -euo pipefail
          cmake --preset linux-gcc-release -DEDG_BUILD_LIB=OFF -DEDG_BUILD_CALLABLE_LIBRARY=ON -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
          cmake --build build/gcc-release --target error-info --parallel 2
          test -s build/gcc-release/src/includes/err_codes.h

      - name: Restore checksummed EDG callable library
        working-directory: edgcpp
        run: |
          set -euo pipefail
          mkdir -p build/gcc-release/lib build/prebuilt-edg
          curl --proto '=https' --tlsv1.2 --fail --location --silent --show-error --retry 4 --retry-delay 2 \
            "https://github.com/bingundu/edgcpp/releases/download/$EDG_RELEASE_TAG/edgcpfe-ci-upstream-callable-edg-release-20261114-linux-x86_64.tar.gz" \
            -o build/prebuilt-edg/archive.tar.gz
          printf '%s  %s\n' "$EDG_RELEASE_SHA256" build/prebuilt-edg/archive.tar.gz | sha256sum -c -
          tar -xzf build/prebuilt-edg/archive.tar.gz -C build/prebuilt-edg
          grep -Fx "commit=$EDG_SOURCE_SHA" build/prebuilt-edg/BUILD-INFO.txt
          cp build/prebuilt-edg/lib/libedgcpfe.a build/gcc-release/lib/libedgcpfe.a

      - name: Build and execute bounded mrustc C parser probe against native bridge
        run: |
          set -euo pipefail
          export PATH="$HOME/.cargo/bin:$PATH"
          if ! command -v cargo >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | \
              sh -s -- -y --profile minimal --default-toolchain 1.99.1
          fi
          rustup toolchain install 1.99.1 --profile minimal
          rustup default 1.99.1
          test "$(git -C edgcpp-rust rev-parse HEAD)" = "${{ steps.bridge.outputs.sha }}"
          test ! -e edgcpp-rust/examples/ci_edg_parse_probe.rs
          cp bootstrap/edg_parse_probe.rs edgcpp-rust/examples/ci_edg_parse_probe.rs
          cargo build --manifest-path edgcpp-rust/Cargo.toml --example ci_edg_parse_probe
          parser="$GITHUB_WORKSPACE/edgcpp-rust/target/debug/examples/ci_edg_parse_probe"
          test -x "$parser"
          source edgcpp/build/gcc-release/environment.sh
          version="$(gcc -dumpfullversion -dumpversion)"
          IFS=. read -r major minor patch <<< "$version"
          gnu_number=$((10#$major*10000+10#${minor:-0}*100+10#${patch:-0}))
          (cd edgcpp/build/gcc-release && timeout 90s "$parser" \
            --gcc --c11 --no_strict_gnu --gnu_version "$gnu_number" \
            "$GITHUB_WORKSPACE/bootstrap/fixtures/edg-gnu-attributes/scalar_global.c") \
            | tee "$RUNNER_TEMP/edg-parser-bridge-proof.log"
          grep -Eq '^EDG_PROBE_RESULT status=0 types=[0-9]+ symbols=[0-9]+' \
            "$RUNNER_TEMP/edg-parser-bridge-proof.log"
          echo "Source-pinned EDG C parser bridge=${{ steps.bridge.outputs.sha }}; public C11 source accepted" >> "$GITHUB_STEP_SUMMARY"
