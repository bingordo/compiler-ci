name: One-off scoped global root verification
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/bench-scoped-global-proof.yml'
permissions:
  contents: read
jobs:
  validate:
    if: github.head_ref == 'bench/scoped-global-proof' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 3ec66d321601969f2f3cb188e1950c5875d25e1c
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: scoped-global-proof
      - name: Verify native global extent and scoped proofs
        working-directory: compiler
        run: |
          set -euo pipefail
          git rev-parse HEAD
          git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
          cargo test --release -p compiler-ir --lib
          cargo test --release -p compiler-ir --test typed_memory_provenance --test typed_verifier_parity --test typed_module_abi
          cargo test --release -p compiler-opt --lib
          cargo clippy -p compiler-ir -p compiler-opt --lib -- -D warnings
