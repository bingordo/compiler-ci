name: Validate x86 machine bulk copy PR2816

on:
  push:
    branches: [main]
    paths: ['.github/workflows/validate-x86-machine-bulkcopy-pr2816.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  x86-machine:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: ca5be17dd9c60bccc985b42312d2fc746283dce5
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Verify source SHA and isolate backend workspace
        run: |
          test "$(git -C compiler rev-parse HEAD)" = ca5be17dd9c60bccc985b42312d2fc746283dce5
          cat > compiler/Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir","crates/opt","crates/backend","crates/backend-x86"]
          EOF
          rm -f compiler/Cargo.lock
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: x86-machine-bulkcopy-2816
      - name: Selected x86 machine bulk copy C11, GAS and direct ELF tests
        working-directory: compiler
        run: cargo test -p compiler-backend-x86 --lib bulk_copy -- --nocapture
      - name: All native x86 library tests
        working-directory: compiler
        run: cargo test -p compiler-backend-x86 --lib
      - name: Format added shared machine test
        working-directory: compiler
        run: rustfmt --edition 2021 --check crates/backend-x86/src/bulk_copy.rs
      - name: X86 backend clippy
        working-directory: compiler
        run: cargo clippy -p compiler-backend-x86 --lib -- -D clippy::all -A clippy::empty_line_after_doc_comments
