name: IR BT4 six AArch64 integer TypeId C11 suites - exact source pin
on:
  pull_request:
    paths:
      - '.github/workflows/verify-ir-bt4-a64-integer-cutover-20261114.yml'
permissions:
  contents: read
jobs:
  native-arm:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.CI_KEY }}
      - run: ssh-keyscan github.com >> ~/.ssh/known_hosts
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: acdbeed33bb8cad735f4e9c3457c970d0adc8865
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - run: |
          test "$(git -C compiler rev-parse HEAD)" = acdbeed33bb8cad735f4e9c3457c970d0adc8865
          test "$(uname -m)" = aarch64
          command -v cc
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler
          key: ir-bt4-a64-integer-cutover-arm
      - name: Whole-workspace all-target typecheck (existing unrelated lint warnings permitted)
        working-directory: compiler
        run: cargo check --workspace --all-targets
      - name: Warnings-denied IR/shared-backend/AArch64 all-target typecheck
        working-directory: compiler
        run: RUSTFLAGS="-D warnings" cargo check -p compiler-ir -p compiler-backend -p compiler-backend-aarch64 --all-targets
      - name: Six native TypeId signed/unsigned integer, compare, spill, ABI C11 oracles on ARM
        working-directory: compiler
        run: |
          cargo test -p compiler-backend-aarch64 --test arithmetic -- --nocapture
          cargo test -p compiler-backend-aarch64 --test modern_i32 -- --nocapture
          cargo test -p compiler-backend-aarch64 --test i64_arithmetic -- --nocapture
          cargo test -p compiler-backend-aarch64 --test i64_div_rem -- --nocapture
          cargo test -p compiler-backend-aarch64 --test i64_unsigned_div_rem -- --nocapture
          cargo test -p compiler-backend-aarch64 --test i64_transport -- --nocapture
      - name: Full backend all-target suite
        working-directory: compiler
        run: cargo test -p compiler-backend-aarch64 --all-targets -- --test-threads=2
      - name: Strict all-target Clippy
        working-directory: compiler
        run: cargo clippy -p compiler-backend-aarch64 --all-targets -- -D warnings
  qemu:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc-aarch64-linux-gnu libc6-dev-arm64-cross linux-libc-dev-arm64-cross binutils-aarch64-linux-gnu qemu-user
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.CI_KEY }}
      - run: ssh-keyscan github.com >> ~/.ssh/known_hosts
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: acdbeed33bb8cad735f4e9c3457c970d0adc8865
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - run: test "$(git -C compiler rev-parse HEAD)" = acdbeed33bb8cad735f4e9c3457c970d0adc8865
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler
          key: ir-bt4-a64-integer-cutover-qemu
      - name: Six original integer I32/I64 C11, trap, stress and machine-shape oracles in QEMU
        working-directory: compiler
        env:
          COMPILER_REQUIRE_AARCH64_QEMU: "1"
        run: |
          cargo test -p compiler-backend-aarch64 --test arithmetic -- --nocapture
          cargo test -p compiler-backend-aarch64 --test modern_i32 -- --nocapture
          cargo test -p compiler-backend-aarch64 --test i64_arithmetic -- --nocapture
          cargo test -p compiler-backend-aarch64 --test i64_div_rem -- --nocapture
          cargo test -p compiler-backend-aarch64 --test i64_unsigned_div_rem -- --nocapture
          cargo test -p compiler-backend-aarch64 --test i64_transport -- --nocapture
