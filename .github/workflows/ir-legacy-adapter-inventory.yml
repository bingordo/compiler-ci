name: IR legacy module bridge feature gate
on:
  pull_request:
    paths:
      - '.github/workflows/ir-legacy-adapter-inventory.yml'
permissions:
  contents: read
jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      SOURCE_SHA: 1106e951f686ac9f53ac90447fdceff1feca2c5c
      CARGO_INCREMENTAL: '0'
    steps:
      - name: Checkout exact compiler commit
        uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: ${{ env.SOURCE_SHA }}
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Verify source and isolate core workspace
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C compiler rev-parse HEAD)" = "$SOURCE_SHA"
          cat > compiler/Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir", "crates/opt", "crates/backend", "crates/backend-x86"]
          EOF
          rm -f compiler/Cargo.lock
      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: ir-legacy-module-feature-gate
      - name: Production crate defaults strict Clippy
        working-directory: compiler
        run: |
          set -euo pipefail
          cargo clippy -p compiler-ir --lib --no-default-features -- -D warnings
          cargo clippy -p compiler-opt --lib --no-default-features -- -D warnings
      - name: Explicit historical module adapter strict Clippy
        working-directory: compiler
        run: |
          set -euo pipefail
          cargo clippy -p compiler-ir --lib --no-default-features --features legacy-ssa-oracle -- -D warnings
      - name: Reject legacy module adapters to default external consumers
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/typeid-module-boundary/src
          cat > /tmp/typeid-module-boundary/Cargo.toml <<EOF
          [package]
          name = "typeid-module-boundary"
          version = "0.1.0"
          edition = "2021"
          [dependencies]
          compiler-ir = { path = "$GITHUB_WORKSPACE/compiler/crates/ir", default-features = false }
          EOF
          cat > /tmp/typeid-module-boundary/src/lib.rs <<'EOF'
          use compiler_ir::typed_ssa::TypedSsaModule;
          use compiler_ir::typed_module::TypedModule;
          pub fn forbidden(m: &TypedSsaModule, old: TypedModule) {
              let _ = m.to_legacy();
              let _ = TypedSsaModule::from_legacy(old);
          }
          EOF
          if cargo check --manifest-path /tmp/typeid-module-boundary/Cargo.toml \
              > /tmp/typeid-module-boundary/result.out 2>&1; then
            echo "default compiler-ir unexpectedly exposed historical module conversion"
            exit 1
          fi
          cat /tmp/typeid-module-boundary/result.out
          grep -q 'no method named.*to_legacy' /tmp/typeid-module-boundary/result.out
          grep -Eq 'no (associated )?function or (constant|associated item) named.*from_legacy' /tmp/typeid-module-boundary/result.out
      - name: IR, optimizer and x86 native plus oracle regression tests
        working-directory: compiler
        run: |
          set -euo pipefail
          cargo test -p compiler-ir --lib
          cargo test -p compiler-ir --test typed_ssa_body
          cargo test -p compiler-opt --lib
          cargo test -p compiler-opt --test ct03_typed_alias_epoch_native
          cargo test -p compiler-backend-x86 --lib
      - name: Compile all IR, optimizer and x86 test targets
        working-directory: compiler
        run: |
          set -euo pipefail
          cargo test -p compiler-ir -p compiler-opt -p compiler-backend-x86 --no-run
