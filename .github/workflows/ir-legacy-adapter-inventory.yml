name: IR legacy adapter caller inventory
on:
  pull_request:
    paths:
      - '.github/workflows/ir-legacy-adapter-inventory.yml'
permissions:
  contents: read
jobs:
  inventory:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Checkout exact current compiler source
        uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 797d7a68bc50a37f0a84154624dea16d21114232
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Inventory conversion callsites outside tests
        shell: bash
        run: |
          set -euo pipefail
          cd compiler
          echo '=== conversion callsites ==='
          rg -n '(^|[^[:alnum:]_])(to_legacy|from_legacy|project_legacy_compat_function|optimize_module)\s*\(' crates --glob '*.rs' | head -250 || true
          echo '=== production only src callsites ==='
          rg -n '(^|[^[:alnum:]_])(to_legacy|from_legacy|project_legacy_compat_function|optimize_module)\s*\(' crates/*/src --glob '*.rs' | head -250 || true
