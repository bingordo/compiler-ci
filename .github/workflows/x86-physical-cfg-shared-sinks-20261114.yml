name: x86 production physical CFG validation shared by generated and native selectors
on:
  push:
    branches: [ci/x86-physical-cfg-shared-sinks-20261114]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-and-shared-cfg-validation:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: f5a7d6b4c91dd12866cd3cb13a329a87dc9bbd57
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Pin compiler source and isolate backend workspace from private frontend dependencies
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = f5a7d6b4c91dd12866cd3cb13a329a87dc9bbd57
          python3 - <<'PY'
          from pathlib import Path
          Path("Cargo.toml").write_text("""[workspace]
          resolver = "2"
          members = ["crates/ir", "crates/backend", "crates/opt", "crates/backend-x86"]
          """)
          PY
      - name: Check exact physical validity, all x86 backend tests, and strict Clippy
        run: |
          set -euo pipefail
          cargo check -p compiler-backend-x86 --all-targets
          cargo test -p compiler-backend-x86 --lib physical_cfg_contract_tests -- --nocapture
          cargo test -p compiler-backend-x86 --test native_typeid_direct -- --nocapture
          cargo test -p compiler-backend-x86 --test native_typeid_call_liveness -- --nocapture
          cargo test -p compiler-backend-x86 --test x7_shared_machine_native_parity -- --nocapture
          cargo test -p compiler-backend-x86 --tests
          cargo clippy -p compiler-backend-x86 --all-targets -- -D warnings
          echo X86_SHARED_PHYSICAL_CFG_NATIVE_FULL_BACKEND_PASS
      - name: Check no-default and explicit gated shared machine path
        run: |
          set -euo pipefail
          cargo test -p compiler-backend-x86 --no-default-features --lib physical_cfg_contract_tests -- --nocapture
          cargo test -p compiler-backend-x86 --features x7-shared-machine-cutover --test x7_shared_machine_native_parity -- --nocapture
          cargo test -p compiler-backend-x86 --no-default-features --test native_typeid_direct -- --nocapture
          echo X86_SHARED_PHYSICAL_CFG_NO_DEFAULT_AND_OPT_IN_PASS
