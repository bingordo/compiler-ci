name: M4.10 Oberon TypeId PIC RBP DSO SysV ABI acceptance
on:
  pull_request:
    paths:
      - '.github/workflows/verify-m410-oberon-pic-rbp-dso.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
      CARGO_INCREMENTAL: '0'
      COMPILER_ELF_REQUIRE_LLVM: '1'
    steps:
      - name: Checkout immutable Oberon DSO compiler source
        uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: eb0842cb215644a7f12fe8a980bc2ddbe2fa9790
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Verify immutable source
        working-directory: compiler
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "eb0842cb215644a7f12fe8a980bc2ddbe2fa9790"
          test -s crates/driver/tests/typeid_oberon_pic_frame_dso.rs
          echo 'Pinned M4.10 candidate: eb0842cb215644a7f12fe8a980bc2ddbe2fa9790' >> "$GITHUB_STEP_SUMMARY"
      - name: Resolve public repository frontend dependencies
        run: git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
      - name: Require GNU and LLVM tools, use bundled rust-lld if needed
        run: |
          set -euo pipefail
          if ! command -v ld.lld >/dev/null; then
            host="$(rustc -vV | sed -n 's/^host: //p')"
            lld="$(rustc --print sysroot)/lib/rustlib/$host/bin/rust-lld"
            test -x "$lld"
            ln -s "$lld" "$RUNNER_TEMP/ld.lld"
            echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
            export PATH="$RUNNER_TEMP:$PATH"
          fi
          command -v clang
          command -v gcc
          command -v readelf
          command -v nm
          ld.lld --version
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: m410-oberon-pic-rbp-v1
      - name: New Oberon shared-library SysV eight GP argument and RBP ABI matrix
        working-directory: compiler
        run: cargo test -p compiler --test typeid_oberon_pic_frame_dso -- --nocapture
      - name: Existing native TypeId Oberon and PIC ELF/GAS interoperability
        working-directory: compiler
        run: |
          cargo test -p compiler --test typeid_elf_linker_matrix
          cargo test -p compiler --test typeid_frame_pointer
          cargo test -p compiler --test typeid_pic_frame_shared
          cargo test -p compiler --test m4_oberon_globals_native
          cargo test -p compiler --test typeid_tls_linker_matrix
      - name: Native backend ELF/ABI and unstructured corruption suite
        working-directory: compiler
        run: |
          if command -v gdb >/dev/null; then
            cargo test -p compiler-backend --all-targets --no-fail-fast
          else
            echo 'One existing interactive GDB test excluded because gdb unavailable' >> "$GITHUB_STEP_SUMMARY"
            cargo test -p compiler-backend --all-targets --no-fail-fast -- --skip gdb_resolves_real_line_breakpoints_and_backtraces_generated_pie
          fi
      - name: Full TypeId IR optimizer x86 and AArch64 regressions
        working-directory: compiler
        run: cargo test -p compiler-ir -p compiler-opt -p compiler-backend-x86 -p compiler-backend-aarch64 --features compiler-backend-x86/x7-native-form-validation
      - name: Strict Clippy across all targets
        working-directory: compiler
        run: |
          cargo clippy -p compiler -p compiler-ir -p compiler-opt -p compiler-backend -p compiler-backend-x86 --features compiler-backend-x86/x7-native-form-validation --all-targets -- -D warnings
          cargo clippy -p compiler-backend-aarch64 --lib -- -D warnings
