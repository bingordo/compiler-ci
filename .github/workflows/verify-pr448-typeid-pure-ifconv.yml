name: Verify PR448 TypeId pure scalar arm if-conversion
on:
  push:
    branches: [ci/pr448-typeid-pure-ifconv]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: b9cc1e4d2e19e5bd9ad15f154cd7cba5f2a69f2d
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Verify exact compiler source SHA
        run: test "$(git -C compiler rev-parse HEAD)" = "b9cc1e4d2e19e5bd9ad15f154cd7cba5f2a69f2d"
      - name: Restrict to self-contained IR opt backend and native workspace
        run: |
          cat > compiler/Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir", "crates/opt", "crates/backend", "crates/backend-x86"]
          EOF
          rm -f compiler/Cargo.lock
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: typeid-pure-ifconv-pr448
          cache-workspace-crates: 'true'
      - name: Focused TypeId pure-arm and legacy ifconversion runtime
        working-directory: compiler
        run: cargo test -p compiler-opt --test typed_if_conversion_pure --test typed_if_conversion_native --test if_conversion_native --test typed_core_pipeline --test ir_replay_cli -- --nocapture
      - name: Full isolated compiler IR optimizer backend and x86 regressions
        working-directory: compiler
        run: cargo test -p compiler-ir -p compiler-opt -p compiler-backend -p compiler-backend-x86
      - name: Strict optimizer Clippy all targets
        working-directory: compiler
        run: cargo clippy -p compiler-opt --all-targets -- -D warnings
