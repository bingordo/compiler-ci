name: Verify PR400 TypeId core pipeline migration
on:
  push:
    branches: [ci/pr400-typeid-core-default]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: def74415fbdb19f8eb7b779bb6b8fe182a6660dd
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Verify exact compiler source revision
        run: test "$(git -C compiler rev-parse HEAD)" = "def74415fbdb19f8eb7b779bb6b8fe182a6660dd"
      - name: Use self-contained compiler core/native workspace
        run: |
          cat > compiler/Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir", "crates/opt", "crates/backend", "crates/backend-x86"]
          EOF
          rm -f compiler/Cargo.lock
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: typeid-core-pr400
          cache-workspace-crates: 'true'
      - name: Focused TypeId core pipeline and CLI replay validation
        working-directory: compiler
        run: cargo test -p compiler-opt --test typed_core_pipeline --test typed_sccp --test ir_replay_cli -- --nocapture
      - name: Full self-contained compiler core and native regression suites
        working-directory: compiler
        run: cargo test -p compiler-ir -p compiler-opt -p compiler-backend -p compiler-backend-x86
      - name: Strict optimizer Clippy for all targets
        working-directory: compiler
        run: cargo clippy -p compiler-opt --all-targets -- -D warnings
