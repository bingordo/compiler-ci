name: CT-11 exact-source TypeId PRE transaction and trial profile
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/ct11-pre-transaction-phase-profile.yml']
permissions:
  contents: read
concurrency:
  group: ct11-pre-phase-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checked-native:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 4a0b50c47cca470bae39f6e7639900126574ef27
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Pinned source and toolchain
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p results
          test "$(git -C compiler rev-parse HEAD)" = 4a0b50c47cca470bae39f6e7639900126574ef27
          git -C compiler rev-parse HEAD | tee results/sha.txt
          rustc --version | tee results/toolchain.txt
          git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
          python3 -m py_compile compiler/tools/s23_native_profile_source.py
          python3 -m py_compile compiler/tools/ct11_loop_source_profile.py
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: ct11-pre-transaction-phase-profile
      - name: Opt-in PRE parity and error rollback
        shell: bash
        working-directory: compiler
        run: |
          cargo test --release -p compiler-opt --test typed_pre_native -- --nocapture
      - name: Opt-in CLI phase records and exact ELF and GAS parity
        shell: bash
        working-directory: compiler
        run: |
          set -euo pipefail
          cargo test --release -p compiler --test typeid_native_s2316_profile -- --nocapture
          cargo test --release -p compiler-opt --test native_s2316_profile -- --nocapture
          cargo clippy -p compiler-opt --lib -- -D warnings
          cargo clippy -p compiler --bin compiler --test typeid_native_s2316_profile -- -D warnings
          cargo build --release -p compiler --bin compiler
      - name: Current eight checked C source PRE census, independent oracle and ELF/GAS parity
        shell: bash
        run: |
          set -euo pipefail
          python3 compiler/tools/ct11_loop_source_profile.py \
            --compiler compiler/target/release/compiler \
            --output results/ct11-pre-source.json --rounds 3 \
            2>&1 | tee results/corpus.log
          test "$(grep -c '^CT11_CHECKED_LOOP ' results/corpus.log)" -eq 8
          python3 - <<'PY' | tee results/pre-summary.log
          import json
          p=json.load(open('results/ct11-pre-source.json'))
          assert p['case_count']==8, p['case_count']
          assert p['cases_with_loops_at_licm']
          for name,case in p['cases'].items():
              profile=case['phase_profile_median']
              assert profile['pre_core_functions']>=1, name
              assert 0<=profile['pre_core_no_edit_functions']<=profile['pre_core_functions'],name
              assert profile['pre_core_edits']<=profile['pre_core_trials'],name
              assert profile['pre_retry_functions']==0,name
              assert case['gcc_typeid_oracle_input_pairs']==36,name
              assert case['object_sha256'] and case['gcc_typeid_oracle_digest'],name
              print('CT11_PRE_SOURCE name='+name,
                    'functions='+str(profile['pre_core_functions']),
                    'edits='+str(profile['pre_core_edits']),
                    'trials='+str(profile['pre_core_trials']),
                    'no_edits='+str(profile['pre_core_no_edit_functions']),
                    'clone_ns='+str(profile['pre_core_module_clone_ns']+
                                    profile['pre_core_function_clone_ns']),
                    'analysis_ns='+str(profile['pre_core_analysis_ns']),
                    'validation_ns='+str(profile['pre_core_input_validation_ns']+
                                         profile['pre_core_final_validation_ns']+
                                         profile['pre_core_trial_validation_ns']),
                    'core_PRE_ns='+str(profile['core_pre_ns']),
                    flush=True)
          PY
          grep '^CT11_PRE_SOURCE ' results/pre-summary.log | tee -a "$GITHUB_STEP_SUMMARY"
          grep '^CT11_LOOP_CENSUS ' results/corpus.log | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ct11-pre-transaction-phase-profile
          path: results/
          retention-days: 30
