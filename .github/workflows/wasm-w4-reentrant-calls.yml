# W4 TypeId direct-call, recursion, local-frame and native x86 differential.
name: Wasm W4 reentrant calls

on:
  pull_request:
    paths:
      - '.github/workflows/wasm-w4-reentrant-calls.yml'
  workflow_dispatch:
    inputs:
      compiler_sha:
        description: 'Exact compiler commit SHA'
        required: true
        type: string

permissions:
  contents: read

jobs:
  wasm-w4:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact compiler source
        uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: ${{ inputs.compiler_sha || 'ba375e95a4ceb3d53b25faa692ba5ca3eb1ae0a0' }}
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Record SHA and isolate standalone credential-free Rust crates
        shell: bash
        run: |
          set -euo pipefail
          echo "Compiler source: $(git -C compiler rev-parse HEAD)"
          cat > compiler/Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir", "crates/opt", "crates/backend", "crates/backend-x86", "crates/backend-wasm"]
          EOF
          rm -f compiler/Cargo.lock
          rustc --version
          cc --version | head -1
      - name: Setup independent Node WebAssembly engine
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Cache standalone Rust crates
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: wasm-w4-reentrant-calls
      - name: Execute all W0-W4 tests including real native x86/Node differential
        working-directory: compiler
        run: cargo test -p compiler-backend-wasm --tests -- --nocapture
      - name: Strict all-target backend Clippy
        working-directory: compiler
        run: cargo clippy -p compiler-backend-wasm --all-targets -- -D warnings
