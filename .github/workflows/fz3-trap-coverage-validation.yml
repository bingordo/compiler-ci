name: FZ-3 signed trap coverage source-pinned acceptance
on:
  push:
    branches: [ci/fz3-trap-coverage-20261114]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  coverage-acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          path: ci
      - name: Run all existing FZ-3 and new trap-coverage Python unit tests
        run: |
          set -euo pipefail
          python3 -m unittest discover -s ci/tests -p 'test_fz3_*.py' -v
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: d07232259bd66a44a127cdcb0e644ccd3b8567e9
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Exact-source TypeId native DivS/RemS campaign and coverage gate
        shell: bash
        run: |
          set -euo pipefail
          ulimit -c 0
          sha="$(git -C compiler rev-parse HEAD)"
          test "$sha" = "d07232259bd66a44a127cdcb0e644ccd3b8567e9"
          cat > compiler/Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir", "crates/opt", "crates/backend", "crates/backend-x86"]
          EOF
          cd compiler
          cargo test -p compiler-opt --example typeid_native_campaign -- --nocapture
          cargo test -p compiler-opt --test typeid_native_trap_differential -- --nocapture
          cargo run -p compiler-opt --example typeid_native_campaign -- \
            --out "$RUNNER_TEMP/fz3-trap-coverage" \
            --source-sha "$sha" --first-seed 0 --seeds 2 \
            --max-evaluations 240 --max-unique 4 --max-probes 12
          cd ..
          python3 ci/tools/fz3_trap_coverage.py \
            --campaign "$RUNNER_TEMP/fz3-trap-coverage" \
            --source-sha "$sha"
          grep -qx 'outcome_unique_failures=0' "$RUNNER_TEMP/fz3-trap-coverage/summary.txt"
          grep -qx 'stopped_at_budget=false' "$RUNNER_TEMP/fz3-trap-coverage/summary.txt"
          cat "$RUNNER_TEMP/fz3-trap-coverage/trap_coverage.tsv"
      - name: Retain real reference-observed trap coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fz3-trap-coverage-acceptance
          path: |
            ${{ runner.temp }}/fz3-trap-coverage/summary.txt
            ${{ runner.temp }}/fz3-trap-coverage/trap_coverage.tsv
          if-no-files-found: warn
          retention-days: 7
