name: M10 scalar SSE SysV ABI planner exact-source regression
on:
  push:
    branches: [ci/m10-scalar-sse-abi-pr469-20261106]
    paths: ['.github/workflows/m10-scalar-sse-abi-pr469.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  abi:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact compiler PR head
        uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: cddaf1a6e34ba530e0a8efae2c80223dc724a8dd
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Validate immutable source and dependency boundary
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C compiler rev-parse HEAD)" = 'cddaf1a6e34ba530e0a8efae2c80223dc724a8dd'
          test -s compiler/crates/backend-x86/src/scalar_abi.rs
          # No frontend access is necessary to test this backend-only layout.
          cat > compiler/Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir","crates/opt","crates/backend","crates/backend-x86"]
          EOF
          rm -f compiler/Cargo.lock
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: m10-scalar-sse-layout
      - name: Unit tests for independent INTEGER and SSE ABI classes
        run: cargo test --manifest-path compiler/Cargo.toml -p compiler-backend-x86 scalar_abi::tests -- --nocapture
      - name: Strict Clippy on x86 backend
        run: cargo clippy --manifest-path compiler/Cargo.toml -p compiler-backend-x86 --all-targets -- -D warnings
      - name: Full x86 backend regression
        run: cargo test --manifest-path compiler/Cargo.toml -p compiler-backend-x86
