name: CI M4.9 real ELF section mutation oracle
on:
  pull_request:
    paths: ['.github/workflows/m49-real-elf-sections-1369.yml']
permissions:
  contents: read
jobs:
  dwarf:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 232a3fbcb708209d83652ea86f1757380e20fa57
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Resolve Git dependencies using established HTTPS rule
        run: git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
      - name: Install GDB for native DWARF oracle
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y gdb
      - name: Source-pinned backend DWARF and regressions
        working-directory: compiler
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "232a3fbcb708209d83652ea86f1757380e20fa57"
          cargo test -p compiler-backend --lib
          cargo test -p compiler-backend --tests
          cargo clippy -p compiler-backend --all-targets -- -D warnings
