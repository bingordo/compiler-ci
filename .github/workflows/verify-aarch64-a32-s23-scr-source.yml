name: AArch64 A3.2 diagnose SCR source XML ownership
on:
  push:
    branches: [ci/aarch64-a32-s23-scr-source-probe-20261111]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Pin 2026-09 System Registers source archive and list SCR candidates
        run: |
          set -euo pipefail
          curl -fLsS --retry 2 --connect-timeout 15 --max-time 200 --max-filesize 175000000 \
            -o /tmp/arm-sysreg-2026-09.tar.gz \
            https://developer.arm.com/-/cdn-downloads/permalink/Exploration-Tools-Arm-Architecture-System-Registers/SysReg/SysReg_xml_A_profile_FAT-2026-09.tar.gz
          echo "8a2b57cf02f83e4a98fa68bf3e3d6f536f31d137e21ff2becbb967945e7b8920  /tmp/arm-sysreg-2026-09.tar.gz" | sha256sum -c -
          python3 - <<'PY'
          import tarfile, re, hashlib
          from collections import Counter
          root="SysReg_xml_A_profile_FAT-2026-09/"
          with tarfile.open("/tmp/arm-sysreg-2026-09.tar.gz",mode="r:") as f:
              names=sorted(m.name for m in f if m.isfile()
                           and m.name.startswith(root) and m.name.lower().endswith(".xml"))
              print("EXACT_SOURCE_XML_COUNT",len(names))
              categories=Counter(s[len(root):].split("-")[0] for s in names)
              print("PREFIX_COUNTS",dict(categories))
              scr=[p for p in names if re.search(r"(?i)(?:^|[-_/])scr(?:_el[123])?\.xml$",p)]
              for name in scr:
                  item=f.getmember(name)
                  raw=f.extractfile(item).read()
                  print("SCR_REGISTER_SOURCE",name,"bytes",item.size,
                        "SHA256",hashlib.sha256(raw).hexdigest())
              print("EXACT_A32_SCR",root+"AArch32-scr.xml" in names)
              print("EXACT_A64_SCR_EL3",root+"AArch64-scr_el3.xml" in names)
              print("EXACT_A64_SCR",root+"AArch64-scr.xml" in names)
          PY
