name: Validate native-int shared CFG tail PR2647
on:
  pull_request:
    paths:
      - '.github/workflows/native-int-cfg-tail-pr2647.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  shared-cfg-tail:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      CARGO_INCREMENTAL: '0'
      SOURCE_SHA: 77664ba2e96c418cdf7dcf14b605473eaf265ff2
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 77664ba2e96c418cdf7dcf14b605473eaf265ff2
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Verify source and isolate optimizer
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C compiler rev-parse HEAD)" = "$SOURCE_SHA"
          cat > compiler/Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir", "crates/opt", "crates/backend", "crates/backend-x86"]
          EOF
          rm -f compiler/Cargo.lock
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: native-int-seeded-generator
      - name: Run all eight generated CFG suites including golden tail assertions
        working-directory: compiler
        shell: bash
        run: |
          set -euo pipefail
          cargo test -p compiler-opt --test generated_native_carry_reconstruction_s2327 -- --nocapture
          cargo test -p compiler-opt --test generated_native_complement_mask_s2326 -- --nocapture
          cargo test -p compiler-opt --test generated_native_complement_pair_s2325 -- --nocapture
          cargo test -p compiler-opt --test generated_native_disjoint_arithmetic_s2323 -- --nocapture
          cargo test -p compiler-opt --test generated_native_matchpd_arithmetic_s2320 -- --nocapture
          cargo test -p compiler-opt --test generated_native_reverse_subtractive_s2329 -- --nocapture
          cargo test -p compiler-opt --test generated_native_subtractive_partition_s2322 -- --nocapture
          cargo test -p compiler-opt --test generated_native_xor_partition_s2324 -- --nocapture
      - name: Focused Clippy with unrelated upstream lint exemptions
        working-directory: compiler
        run: cargo clippy -p compiler-opt --test generated_native_carry_reconstruction_s2327 --test generated_native_complement_mask_s2326 --test generated_native_complement_pair_s2325 --test generated_native_disjoint_arithmetic_s2323 --test generated_native_matchpd_arithmetic_s2320 --test generated_native_reverse_subtractive_s2329 --test generated_native_subtractive_partition_s2322 --test generated_native_xor_partition_s2324 -- -D warnings -A dead-code -A clippy::empty-line-after-doc-comments -A unused-imports -A clippy::too-many-arguments
