name: F2 native TypeId v3 signature-type metadata and hostile replay
on:
  pull_request:
    paths:
      - '.github/workflows/verify-f2-native-type-records-v3.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  f2-v3-types:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout immutable compiler source
        uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 3d1137cd3f7279db7c33cc46501bc09369424699
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Verify exact compiler source
        working-directory: compiler
        run: test "$(git rev-parse HEAD)" = "3d1137cd3f7279db7c33cc46501bc09369424699"
      - name: Use bounded core compiler workspace
        working-directory: compiler
        run: |
          cat > Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir", "crates/opt", "crates/backend", "crates/backend-x86", "crates/backend-aarch64"]
          EOF
          rm -f Cargo.lock
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: typeid-f2-v3-metadata
      - name: Canonical type and function signature v3 roundtrip and hostile inputs
        working-directory: compiler
        run: cargo test -p compiler-ir --test native_type_records_v3 -- --nocapture
      - name: Full IR and native-int legacy-compatibility regressions
        working-directory: compiler
        run: cargo test -p compiler-ir
      - name: F1 ABI typed callbacks executable C11 GAS and direct ELF compatibility
        working-directory: compiler
        run: cargo test -p compiler-backend-x86 --test native_typeid_function_signatures -- --nocapture
      - name: AArch64 shared API compilation
        working-directory: compiler
        run: cargo check -p compiler-backend-aarch64 --all-targets
      - name: Strict compiler IR all-target Clippy
        working-directory: compiler
        run: cargo clippy -p compiler-ir --all-targets -- -D warnings
      - name: Strict AArch64 library Clippy
        working-directory: compiler
        run: cargo clippy -p compiler-backend-aarch64 --lib -- -D warnings
      - name: Optimizer and backend integration smoke suites
        working-directory: compiler
        run: cargo test -p compiler-opt -p compiler-backend
