name: Atomic TypeId and generic builtin contracts
on:
  pull_request:
    paths:
      - .github/workflows/atomic-stage1-20261116.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  atomic-stage1:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout compiler-ci contract fixture
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Checkout exact private compiler PR head
        uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 6076425199e4957964283ce40c52c69528306403
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Checkout exact Mini-C PR head
        uses: actions/checkout@v4
        with:
          repository: bingordo/mini-c
          ref: 8160888c6da15d1dc723607ce9d17c8cc72e696f
          path: mini-c
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Report pinned source revisions
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C compiler rev-parse HEAD)" = 6076425199e4957964283ce40c52c69528306403
          test "$(git -C mini-c rev-parse HEAD)" = 8160888c6da15d1dc723607ce9d17c8cc72e696f
          printf 'compiler: %s\nmini-c: %s\n' \
            "$(git -C compiler rev-parse HEAD)" \
            "$(git -C mini-c rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
      - name: Restrict compiler workspace to the IR crate
        shell: bash
        run: |
          set -euo pipefail
          cat > compiler/Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir", "crates/opt", "crates/backend", "crates/backend-x86", "crates/backend-aarch64", "crates/backend-riscv64", "crates/backend-wasm"]
          EOF
          rm -f compiler/Cargo.lock
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: atomic-ir-stage1
      - name: Generate and validate atomic TypeId order-width-opcode matrix
        working-directory: compiler
        run: cargo test -p compiler-ir
      - name: Check production optimizer and all target backend crates
        working-directory: compiler
        run: |
          cargo check --workspace
          cargo test -p compiler-backend --test native_atomic_fence_rejection
          cargo test -p compiler-opt --features typeid-memory-ssa --test native_atomic_fence_barriers
          cargo test -p compiler-opt --features typeid-memory-ssa --test native_atomic_access_barriers
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: mini-c -> target
          key: atomic-mini-c-stage1
      - name: Test Mini-C syntax, checked semantics and CLI diagnostics
        working-directory: mini-c
        run: |
          cargo test -p mini-c-syntax -p mini-c-sema
          cargo test -p mini-c --features internal-cpp
          cargo check -p mini-c-cranelift
      - name: Generate checked Mini-C GNU builtin to TypeId contract cases
        run: cargo test --manifest-path atomic-builtin-contract/Cargo.toml
      - name: Strict Clippy for stage 1 crates
        shell: bash
        run: |
          set -euo pipefail
          (cd compiler && cargo clippy -p compiler-ir --lib -- -D warnings)
          (cd mini-c && cargo clippy -p mini-c-syntax -p mini-c-sema --all-targets -- -D warnings)
      - name: Check new IR builtin module formatting
        run: rustfmt --edition 2021 --check compiler/crates/ir/src/atomic_builtins.rs
