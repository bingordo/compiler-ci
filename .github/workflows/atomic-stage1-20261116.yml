name: Atomic stage 1 (Mini-C source + TypeId IR)
on:
  pull_request:
    paths:
      - .github/workflows/atomic-stage1-20261116.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  atomic-stage1:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact private compiler PR head
        uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 7008d915a339b828b2fc95d0b52d1c99b616e731
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Checkout exact Mini-C PR head
        uses: actions/checkout@v4
        with:
          repository: bingordo/mini-c
          ref: b6419b3092fe738dd86a5524aca487b9ebc86bd5
          path: mini-c
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Report pinned source revisions
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C compiler rev-parse HEAD)" = 7008d915a339b828b2fc95d0b52d1c99b616e731
          test "$(git -C mini-c rev-parse HEAD)" = b6419b3092fe738dd86a5524aca487b9ebc86bd5
          printf 'compiler: %s\nmini-c: %s\n' \
            "$(git -C compiler rev-parse HEAD)" \
            "$(git -C mini-c rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: atomic-ir-stage1
      - name: Test compiler-ir source contract and verifier regressions
        working-directory: compiler
        run: cargo test -p compiler-ir
      - name: Check new IR builtin module formatting
        run: rustfmt --edition 2021 --check compiler/crates/ir/src/atomic_builtins.rs
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: mini-c -> target
          key: atomic-mini-c-stage1
      - name: Test Mini-C syntax and checked semantics
        working-directory: mini-c
        run: cargo test -p mini-c-syntax -p mini-c-sema
      - name: Strict Clippy for stage 1 crates
        shell: bash
        run: |
          set -euo pipefail
          (cd compiler && cargo clippy -p compiler-ir --all-targets -- -D warnings)
          (cd mini-c && cargo clippy -p mini-c-syntax -p mini-c-sema --all-targets -- -D warnings)
