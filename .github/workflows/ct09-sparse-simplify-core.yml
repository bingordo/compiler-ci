name: CT-09 sparse simplify parity core tests
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/ct09-sparse-simplify-core.yml'
permissions:
  contents: read
concurrency:
  group: ct09-sparse-simplify-core-${{ github.ref }}
  cancel-in-progress: true
jobs:
  core:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 'a5219edbe1e68eabb60b22e00ee2180065e85139'
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Record pinned source and toolchain
        shell: bash
        run: |
          set -euo pipefail
          git -C compiler rev-parse HEAD | tee -a "$GITHUB_STEP_SUMMARY"
          rustc --version | tee -a "$GITHUB_STEP_SUMMARY"
          cat > compiler/Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir", "crates/opt", "crates/backend", "crates/backend-x86"]
          EOF
          rm -f compiler/Cargo.lock
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: ct09-sparse-simplify-core-core
      - name: IR, optimizer, generic backend and x86 tests
        working-directory: compiler
        run: |
          # The optimizer CLI has a separate end-to-end gate; this small
          # workspace checks optimizer library contracts and the complete
          # IR/backend/x86 integration suites.
          cargo test -p compiler-ir -p compiler-backend -p compiler-backend-x86 --lib --features compiler-backend-x86/x7-native-form-validation
          cargo test -p compiler-opt --lib
      - name: Strict Clippy including generic and x86 backend
        working-directory: compiler
        run: cargo clippy -p compiler-ir -p compiler-opt -p compiler-backend -p compiler-backend-x86 --lib -- -D warnings
