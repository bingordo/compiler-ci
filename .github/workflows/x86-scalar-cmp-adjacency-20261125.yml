name: x86 TypeId ScalarCmp local Jcc placement candidate
on:
  pull_request:
    paths:
      - '.github/workflows/x86-scalar-cmp-adjacency-20261125.yml'
permissions:
  contents: read
jobs:
  scalar-cmp-adjacency:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 953f5182ea76f22e2554920e50a787e9e9c1516e
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Check tested compiler head
        run: |
          set -euo pipefail
          test "$(git -C compiler rev-parse HEAD)" = 953f5182ea76f22e2554920e50a787e9e9c1516e
          git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
          git config --global --add url."https://github.com/".insteadOf "git@github.com:"
          rustc --version
          cc --version | head -1
      - name: Build compiler and x86 backend
        working-directory: compiler
        run: |
          set -euo pipefail
          cargo check -p compiler-backend-x86
          cargo check -p compiler --bin compiler
      - name: Focused ScalarCmp and scheduling tests
        working-directory: compiler
        run: |
          set -euo pipefail
          cargo test -p compiler-backend-x86 --lib code::compare_placement_tests -- --nocapture
          cargo test -p compiler-backend-x86 --lib code::schedule_tests -- --nocapture
      - name: Backend Clippy strict
        working-directory: compiler
        run: |
          set -euo pipefail
          cargo clippy -p compiler-backend-x86 --lib -- -D warnings
