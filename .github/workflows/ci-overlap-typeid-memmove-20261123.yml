name: Validate overlap-safe source TypeId memmove
on:
  push:
    branches: [ci-overlap-typeid-memmove-20261123]
    paths: ['.github/workflows/ci-overlap-typeid-memmove-20261123.yml']
  pull_request:
    paths: ['.github/workflows/ci-overlap-typeid-memmove-20261123.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-move:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 2c4cbcc2f7e405273d45868d5020386c1059bb84
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - run: test "$(git -C compiler rev-parse HEAD)" = 2c4cbcc2f7e405273d45868d5020386c1059bb84
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.CI_KEY }}
      - run: ssh-keyscan github.com >> ~/.ssh/known_hosts
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: typeid-overlap-memmove
      - name: Native TypeId compile check
        working-directory: compiler
        run: cargo check -p compiler
      - name: GCC differential forward and overlapping x86 memmove GAS ELF
        working-directory: compiler
        run: cargo test -p compiler --test native_lp64_disjoint_memmove -- --nocapture
      - name: Existing memcpy end-to-end GCC oracle
        working-directory: compiler
        run: cargo test -p compiler --test native_lp64_bounded_dynamic_memcpy -- --nocapture
      - name: TypeId proven memcopy/memmove tests
        working-directory: compiler
        run: cargo test -p compiler-ir --lib typed_memcopy_provenance -- --nocapture
      - name: Mini-C checked local memory regressions
        working-directory: compiler
        run: cargo test -p compiler-mini-c --lib checked_local_memcpy -- --nocapture
