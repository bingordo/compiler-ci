name: M4.10 stable host budget evaluator tests
on:
  pull_request:
    paths: ['.github/workflows/verify-m410-stable-host-budget.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
      CARGO_INCREMENTAL: '0'
    steps:
      - name: Checkout exact candidate for M4.10 stable-host release evaluator
        uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 01067c418bc0e4837ee9e5fd83f7f90374bbe29e
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Check source hash and scope
        working-directory: compiler
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = '01067c418bc0e4837ee9e5fd83f7f90374bbe29e'
          test -s tools/m410_elf_perf_gate.py
          test -s tools/test_m410_elf_perf_gate.py
          test -s docs/M410_Stable_Host_Perf_Gate.md
          echo 'M4.10 gate source SHA 01067c418bc0e4837ee9e5fd83f7f90374bbe29e' >> "$GITHUB_STEP_SUMMARY"
          python3 --version
      - name: Python syntax, built-in dependency-only benchmark tooling
        working-directory: compiler
        run: |
          python3 -m py_compile tools/m410_elf_perf_gate.py tools/test_m410_elf_perf_gate.py tools/m410_elf_perf_abba.py tools/m410_elf_perf_baseline.py
          python3 tools/m410_elf_perf_gate.py --help
      - name: Stable-host full-matrix wall, RSS, noise and host-pin acceptance tests
        working-directory: compiler
        run: python3 -m unittest discover -s tools -p 'test_m410_elf_perf_*.py' -v
      - name: Prior robust TypeId ELF input-model backend regression
        working-directory: compiler
        run: |
          git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
          cargo test -p compiler-backend --lib m410_replayable_writer_input_property_fuzz
      - name: No numerical release approval on hosted CI
        run: echo 'Evaluator logic accepted, but numeric release budgets still require a calibrated stable host and reviewed profile.' >> "$GITHUB_STEP_SUMMARY"
