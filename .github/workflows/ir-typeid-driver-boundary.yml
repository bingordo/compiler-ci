# Temporary source-pinned validation for compiler TypeId driver boundary.
name: IR TypeId driver production boundary
on:
  pull_request:
    paths:
      - '.github/workflows/ir-typeid-driver-boundary.yml'
permissions:
  contents: read
jobs:
  boundary:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      SOURCE_SHA: a208c635d7210363c8799ae76ef16bfc60a39a2c
    steps:
      - name: Check out exact compiler source
        uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: ${{ env.SOURCE_SHA }}
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Verify source revision
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C compiler rev-parse HEAD)" = "$SOURCE_SHA"
      - name: Reject legacy SSA production driver paths
        shell: bash
        run: |
          set -euo pipefail
          python3 compiler/tools/check_typeid_driver_boundary.py --root compiler
          python3 compiler/tools/test_check_typeid_driver_boundary.py -v
