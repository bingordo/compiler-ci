name: Temporary complete optimizer retirement guard acceptance
on:
  pull_request:
    paths: ['.github/workflows/temp-ir-retired-inventory-3663.yml']
permissions:
  contents: read
jobs:
  retirement-guard:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      SOURCE_SHA: ba66e8360ca193d34f84585533705c4926191f15
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: ${{ env.SOURCE_SHA }}
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Confirm source and run mutation tests
        working-directory: compiler
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          python3 tools/test_check_mixed_function_export_boundary.py -v
      - name: Run existing permanent boundary guard
        working-directory: compiler
        run: python3 tools/check_mixed_function_export_boundary.py
