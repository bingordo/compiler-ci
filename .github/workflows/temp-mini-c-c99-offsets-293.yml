name: Temporary Mini-C C99 offsets 293
on:
  pull_request:
    paths: ['.github/workflows/temp-mini-c-c99-offsets-293.yml']
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/mini-c
          ref: 3f49d3301f9cfae22bcaaa1eafee31e777a0cd03
          persist-credentials: false
      - run: git rev-parse HEAD
      - run: cargo test -p mini-c-syntax -p mini-c-sema -p mini-c-cranelift
      - run: cargo clippy -p mini-c-sema -p mini-c-cranelift --all-targets -- -D warnings
      - name: GCC differential runtime
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/offsets.c" <<'EOF'
          int a[5]={1,2,3,4,5};
          int *p=a+2;
          int *q=&a[3];
          int *end=a+5;
          int *back=(a+4)-3;
          char *s="abc"+1;
          struct N { int x; }; struct N n[3]={{5},{6},{7}};
          int *member=&n[2].x;
          int *table[2]={a+1,&a[4]};
          char *strings[1]={"xyz"+2};
          int main(void) {
              return *p!=3 || *q!=4 || end-a!=5 || *back!=2 || *s!='b'
                  || *member!=7 || *table[0]!=2 || *table[1]!=5 || *strings[0]!='z';
          }
          EOF
          gcc -std=c99 -pedantic-errors "$RUNNER_TEMP/offsets.c" -o "$RUNNER_TEMP/gcc-offsets"
          "$RUNNER_TEMP/gcc-offsets"
          cargo run -q -p mini-c-cranelift -- --cpp=none --emit-obj "$RUNNER_TEMP/offsets.o" "$RUNNER_TEMP/offsets.c"
          gcc "$RUNNER_TEMP/offsets.o" -o "$RUNNER_TEMP/mini-offsets"
          "$RUNNER_TEMP/mini-offsets"
          readelf -r "$RUNNER_TEMP/offsets.o"
