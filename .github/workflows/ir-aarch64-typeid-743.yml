name: AArch64 native TypeId machine handoff (compiler PR 743)
on:
  pull_request:
    paths:
      - '.github/workflows/ir-aarch64-typeid-743.yml'
permissions:
  contents: read
jobs:
  typeid-aarch64:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.CI_KEY }}
      - run: ssh-keyscan github.com >> ~/.ssh/known_hosts
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: b50d769b9fb493d6d09e7b063fac40385d91f53f
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler
          key: ir-aarch64-typeid-743
      - name: Verify pinned source
        run: test "$(git -C compiler rev-parse HEAD)" = "b50d769b9fb493d6d09e7b063fac40385d91f53f"
      - name: Warnings-denied all-target build
        working-directory: compiler
        run: RUSTFLAGS="-D warnings" cargo check -p compiler -p compiler-backend-aarch64 --all-targets
      - name: Opt-in AArch64 TypeId CLI acceptance
        working-directory: compiler
        run: cargo test -p compiler --test ir_default_cli -- --nocapture
      - name: AArch64 machine backend regressions
        working-directory: compiler
        run: cargo test -p compiler-backend-aarch64
      - name: Full compiler-driver regression
        working-directory: compiler
        run: cargo test -p compiler -- --test-threads=2
      - name: Strict Clippy
        working-directory: compiler
        run: cargo clippy -p compiler -p compiler-backend-aarch64 --all-targets -- -D warnings
