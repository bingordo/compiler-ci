name: Temporary annotation wire retirement acceptance
on:
  pull_request:
    paths: ['.github/workflows/temp-ir-annotation-wire-3671.yml']
permissions:
  contents: read
jobs:
  annotation-retirement:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      SOURCE_SHA: cdb803fe551e6dd6d6ee5d40fe2c5ae661dc5407
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: ${{ env.SOURCE_SHA }}
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Confirm source and audit retired codec callers
        working-directory: compiler
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          if git grep -nE 'read_type_annotated_module|write_type_annotated_module|value_text::|mod value_text;' -- '*.rs' '*.toml'; then exit 1; fi
          cat > Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir", "crates/ir-macros"]
          EOF
          rm -f Cargo.lock
      - name: Native TypeId replay and old wire rejection
        working-directory: compiler
        run: cargo test -p compiler-ir --test ssa_typeids --test typed_ssa_body --test native_module_cli --test native_module_text_v3
      - name: IR unit regression
        if: ${{ !cancelled() }}
        working-directory: compiler
        run: cargo test -p compiler-ir --lib
      - name: Permanent graph boundary
        if: ${{ !cancelled() }}
        working-directory: compiler
        run: python3 tools/check_mixed_function_export_boundary.py
