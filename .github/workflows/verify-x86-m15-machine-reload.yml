name: x86 M1.15 machine reload compiler PR 1212
on:
  pull_request:
    paths:
      - '.github/workflows/verify-x86-m15-machine-reload.yml'
permissions:
  contents: read
jobs:
  x86-machine-reload:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.CI_KEY }}
      - name: Trust GitHub for pinned frontends
        run: ssh-keyscan github.com >> ~/.ssh/known_hosts
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 297e48292332589d6586dc5217f65a47a155dcde
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Check source SHA
        run: test "$(git -C compiler rev-parse HEAD)" = "297e48292332589d6586dc5217f65a47a155dcde"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: x86-m15-machine-reload
          cache-workspace-crates: 'true'
      - name: Test tagged x86 physical dump and reload with real ELF parity
        working-directory: compiler
        run: |
          cargo test -p compiler --test typeid_x86_physical_dump -- --nocapture
          cargo test -p compiler --test typeid_ir_dump_replay -- --nocapture
          cargo test -p compiler-backend-x86 --test typeid_physical_tagged_v2 -- --nocapture
      - name: Full x86 backend tests and strict driver lint
        working-directory: compiler
        run: |
          cargo test -p compiler-backend-x86
          cargo clippy -p compiler -p compiler-backend-x86 --all-targets -- -D warnings
