name: AArch64 shifted branch SUBS TypeId v3 fixture acceptance
on:
  push:
    branches: [verify/aarch64-shift-branch-subs-native-v3-20261115]
    paths: ['.github/workflows/aarch64-shift-branch-subs-native-v3-20261115.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 83dc26bd97e832f69147c2382c8b0586e2ae5787
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Check exact compiler source
        run: test "$(git -C compiler rev-parse HEAD)" = "83dc26bd97e832f69147c2382c8b0586e2ae5787"
      - name: Restrict workspace
        run: |
          cat > compiler/Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir", "crates/backend", "crates/backend-aarch64"]
          EOF
          rm -f compiler/Cargo.lock
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: aarch64-shift-branch-subs-fixed-typeid
      - name: Install AArch64 cross toolchain and QEMU
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends gcc-aarch64-linux-gnu libc6-dev-arm64-cross binutils-aarch64-linux-gnu qemu-user
      - name: Preserve machine quality and C11 QEMU oracle
        working-directory: compiler
        env:
          COMPILER_REQUIRE_AARCH64_QEMU: "1"
        run: |
          cargo test -p compiler-backend-aarch64 --test shifted_original_parity_temp -- --nocapture
          cargo test -p compiler-backend-aarch64 --test shifted_bit_branch_native --test lsl_asr_bit_branch_native --test subs_immediate_native -- --nocapture
      - name: Canonical v3 text and strict scoped Clippy
        working-directory: compiler
        run: |
          cargo test -p compiler-backend-aarch64 --test native_fixed_v3_canonical
          cargo test -p compiler-backend-aarch64 --test bit_branch_native --test zero_branch_native
          cargo test -p compiler-ir --test native_module_text_v3 --test native_fixture_text
          cargo clippy -p compiler-backend-aarch64 --no-deps --test shifted_bit_branch_native --test lsl_asr_bit_branch_native --test subs_immediate_native --test native_fixed_v3_canonical -- -D warnings
