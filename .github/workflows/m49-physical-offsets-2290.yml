name: CI M4.9 exact physical ELF offsets
on:
  pull_request:
    paths: ['.github/workflows/m49-physical-offsets-2290.yml']
permissions:
  contents: read
jobs:
  physical-offsets:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 52264e73e8a9cf9fe2bc1b4fda6360f7e4f7910c
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Resolve compiler Git dependencies
        run: git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
      - name: Exact-source x86 encoder regression and Clippy
        working-directory: compiler
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "52264e73e8a9cf9fe2bc1b4fda6360f7e4f7910c"
          cargo test -p compiler-backend-x86 --lib exact_encoded_physical_offsets_survive_branch_relaxation
          cargo test -p compiler-backend-x86 --lib exact_physical_offsets_reset_per_function_and_include_multiple_ops
          cargo test -p compiler-backend-x86 --lib
          cargo clippy -p compiler-backend-x86 --lib -- -D warnings
