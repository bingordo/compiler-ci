name: X7 B6 exact source-model blocker census
on:
  push:
    branches: [ci/x7-b6-source-blocker-breakdown-20261111]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pinned-census:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 606b8360490a8d68b3cc7fd8f7cd5d6adf2f8f37
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Verify exact compiler and compile audit
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 606b8360490a8d68b3cc7fd8f7cd5d6adf2f8f37
          python3 -m py_compile tools/x86_isl_operation_model_census.py tools/test_x86_isl_operation_model_census.py
      - name: Test complete source operation accounting, blocker reasons and fail-closed gates
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tools -p 'test_x86_isl_operation_model_census.py' -v
          python3 -m unittest discover -s tools -p 'test_x86_iform_proof_work_dag.py' -v
          python3 -m unittest discover -s tools -p 'test_x86_iform_helper_dependencies.py' -v
          echo X7_B6_SOURCE_BLOCKER_RANKING_PASS
