name: x86 M1.11 typed physical memory replay PR 1162
on:
  pull_request:
    paths:
      - '.github/workflows/verify-x86-m11-memory-replay.yml'
permissions:
  contents: read
jobs:
  x86-memory-replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 1f05c65df7656301f9b6898a8b27560b54d8c93b
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Confirm exact compiler source
        run: test "$(git -C compiler rev-parse HEAD)" = "1f05c65df7656301f9b6898a8b27560b54d8c93b"
      - name: Restrict workspace to independent core
        run: |
          cat > compiler/Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir", "crates/opt", "crates/backend", "crates/backend-x86"]
          EOF
          rm -f compiler/Cargo.lock
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: x86-m11-memory-replay
          cache-workspace-crates: 'true'
      - name: Focused typed physical memory, scalar and document tests
        working-directory: compiler
        run: |
          cargo test -p compiler-backend-x86 --test typeid_physical_memory_replay -- --nocapture
          cargo test -p compiler-backend-x86 --test typeid_physical_subset_replay -- --nocapture
          cargo test -p compiler-backend-x86 --test typeid_physical_document_v1 -- --nocapture
      - name: Full x86 backend tests and strict Clippy
        working-directory: compiler
        run: |
          cargo test -p compiler-backend-x86
          cargo clippy -p compiler-backend-x86 --all-targets -- -D warnings
