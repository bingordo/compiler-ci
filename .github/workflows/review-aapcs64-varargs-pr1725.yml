name: One-off AAPCS64 GP varargs admission PR1725
on:
  pull_request:
    paths:
      - '.github/workflows/review-aapcs64-varargs-pr1725.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 4a9c4344820e6c8cf1fe60e379faab8e7865c9fb
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Pin exact compiler source revision
        run: test "$(git -C compiler rev-parse HEAD)" = "4a9c4344820e6c8cf1fe60e379faab8e7865c9fb"
      - name: Core IR and AArch64 workspace
        run: |
          cat > compiler/Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir", "crates/backend", "crates/backend-aarch64"]
          EOF
          rm -f compiler/Cargo.lock
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: review-aapcs64-varargs-pr1725
      - name: Target-specific indirect-vararg and direct-vararg ABI negative/positive cases
        working-directory: compiler
        run: |
          cargo test -p compiler-ir --lib typed_module_abi::sysv_gp_variadic_tests:: -- --nocapture
      - name: Complete compiler-ir tests
        working-directory: compiler
        run: cargo test -p compiler-ir
      - name: AArch64 native codegen tests
        working-directory: compiler
        run: cargo test -p compiler-backend-aarch64
      - name: Shared native scalar backend tests
        working-directory: compiler
        run: cargo test -p compiler-backend --lib
      - name: Strict all-target IR and AArch64 Clippy
        working-directory: compiler
        run: cargo clippy -p compiler-ir -p compiler-backend-aarch64 --all-targets -- -D warnings
