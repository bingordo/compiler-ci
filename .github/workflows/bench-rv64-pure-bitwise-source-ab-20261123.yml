name: RV64 pure bitwise immediate expression exact-source static A/B
on:
  push:
    branches: [main]
    paths: ['.github/workflows/bench-rv64-pure-bitwise-source-ab-20261123.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-pinned-static-ab:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler-ci
          path: harness
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: b31636635e2e54958f64fe8d983f052375cc5d2d
          path: before
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 7e1314f0e18ff387dcf01507de52212a8196404d
          path: after
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Verify exact source revisions and unchanged machine emitter
        run: |
          set -euo pipefail
          test "$(git -C before rev-parse HEAD)" = 'b31636635e2e54958f64fe8d983f052375cc5d2d'
          test "$(git -C after rev-parse HEAD)" = '7e1314f0e18ff387dcf01507de52212a8196404d'
          for file in \
            crates/backend-riscv64/src/leaf.rs \
            crates/backend-riscv64/src/machine.rs \
            crates/backend-riscv64/src/generated_native_selector_rules.rs \
            crates/backend-riscv64/src/encoding.rs; do
            cmp "before/$file" "after/$file"
          done
          echo "Before: b31636635e2e54958f64fe8d983f052375cc5d2d" >> "$GITHUB_STEP_SUMMARY"
          echo "After: 7e1314f0e18ff387dcf01507de52212a8196404d" >> "$GITHUB_STEP_SUMMARY"
      - name: Overlay source-owned TypeId fixture without modifying either compiler implementation
        run: |
          set -euo pipefail
          python3 -m py_compile harness/tools/overlay_rv64_pure_bitwise_fixture.py
          python3 harness/tools/overlay_rv64_pure_bitwise_fixture.py before after
      - uses: dtolnay/rust-toolchain@stable
      - name: Build both release source compilers
        run: |
          set -euo pipefail
          for mode in before after; do
            cat > "$mode/Cargo.toml" <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir", "crates/backend", "crates/backend-riscv64"]
          EOF
            rm -f "$mode/Cargo.lock"
            (cd "$mode" && cargo build --release -p compiler-backend-riscv64 --example rv64_leaf)
          done
      - name: Install GNU binutils for deterministic code metrics
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y binutils-riscv64-linux-gnu
      - name: Compare exact static ELF output and independently assembled GAS bytes
        run: |
          set -euo pipefail
          mkdir -p outputs
          for mode in before after; do
            for kind in pure_andi_shared pure_ori_shared pure_xori_shared; do
              "$mode/target/release/examples/rv64_leaf" \
                "outputs/$mode.$kind.o" "outputs/$mode.$kind.s" "$kind" --isa=rv64i
              riscv64-linux-gnu-as -march=rv64i -mabi=lp64 \
                "outputs/$mode.$kind.s" -o "outputs/$mode.$kind.gas.o"
              riscv64-linux-gnu-objcopy -O binary -j .text \
                "outputs/$mode.$kind.o" "outputs/$mode.$kind.bin"
              riscv64-linux-gnu-objcopy -O binary -j .text \
                "outputs/$mode.$kind.gas.o" "outputs/$mode.$kind.gas.bin"
              cmp "outputs/$mode.$kind.bin" "outputs/$mode.$kind.gas.bin"
              riscv64-linux-gnu-objdump -d "outputs/$mode.$kind.o" > "outputs/$mode.$kind.disasm"
            done
          done
          python3 - <<'PY' | tee outputs/summary.txt
          import json
          import re
          from pathlib import Path
          def inspect(mode, kind):
              binary = Path(f"outputs/{mode}.{kind}.bin")
              text = Path(f"outputs/{mode}.{kind}.disasm").read_text()
              instructions = [
                  line for line in text.splitlines()
                  if re.match(r"^\s*[0-9a-f]+:\s+[0-9a-f]{4,8}\s+[a-z]", line)
              ]
              return {"text_bytes": binary.stat().st_size,
                      "instructions": len(instructions)}
          rows = {}
          for kind in ("pure_andi_shared", "pure_ori_shared", "pure_xori_shared"):
              before, after = inspect("before", kind), inspect("after", kind)
              delta = after["text_bytes"] - before["text_bytes"]
              rows[kind] = {"before": before, "after": after, "delta_bytes": delta}
              print(f"{kind}: baseline={before}; candidate={after}; delta={delta} bytes")
          Path("outputs/comparison.json").write_text(
              json.dumps(rows, indent=2, sort_keys=True) + "\n")
          assert all(v["delta_bytes"] <= 0 for v in rows.values()), (
              "A pure-bitwise recipe increased emitted code", rows)
          assert any(v["delta_bytes"] < 0 for v in rows.values()), (
              "No pure-bitwise source fixture improved emitted code", rows)
          PY
          cat outputs/summary.txt >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rv64-pure-bitwise-source-static-ab
          path: outputs/
          if-no-files-found: warn
