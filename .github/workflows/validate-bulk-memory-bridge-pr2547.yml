name: Validate shared bulk-memory bridge PR 2547

on:
  push:
    branches: [main]
    paths: ['.github/workflows/validate-bulk-memory-bridge-pr2547.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 4c938d1e27f2dc12d2946328bbe7f9a4ed86dd73
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Verify exact source SHA
        run: |
          test "$(git -C compiler rev-parse HEAD)" = 4c938d1e27f2dc12d2946328bbe7f9a4ed86dd73
          git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
          cat > compiler/Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir","crates/opt","crates/backend","crates/backend-x86","crates/backend-aarch64","crates/backend-riscv64","crates/backend-wasm","crates/driver"]
          EOF
          rm -f compiler/Cargo.lock
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: bulk-memory-bridge-pr2547
      - name: Shared scalar bulk-memory bridge tests
        working-directory: compiler
        run: cargo test -p compiler-backend --lib scalar_copy_and_zero_share_the_pre_ra_bulk_memory_contract -- --nocapture
      - name: Full backend core library tests
        working-directory: compiler
        run: cargo test -p compiler-backend --lib
      - name: Wasm backend tests
        working-directory: compiler
        run: cargo test -p compiler-backend-wasm --tests
      - name: Existing Mini-C executable wasm32 memcpy source tests
        working-directory: compiler
        run: cargo test -p compiler --test wasm32_minic_source -- --nocapture
      - name: Scoped shared backend Clippy
        working-directory: compiler
        run: cargo clippy -p compiler-backend -p compiler-backend-wasm --lib -- -D clippy::all -A clippy::empty_line_after_doc_comments
