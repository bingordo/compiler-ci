name: M4.2 RELRO and linkage validation
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/m42-relro-validation.yml
permissions:
  contents: read
concurrency:
  group: m42-relro-once
  cancel-in-progress: true
jobs:
  validation:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: feature/m4-2-linkage-relro
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Identify exact revision
        run: git -C compiler rev-parse HEAD
      - name: Test IR and x86 backend including native PIE/RELRO linkage
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/m42/crates"
          for crate in ir opt backend backend-x86; do
            cp -a "compiler/crates/$crate" "$RUNNER_TEMP/m42/crates/$crate"
          done
          cat > "$RUNNER_TEMP/m42/Cargo.toml" <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir", "crates/opt", "crates/backend", "crates/backend-x86"]
          EOF
          cargo test --manifest-path "$RUNNER_TEMP/m42/Cargo.toml" -p compiler-ir
          cargo test --manifest-path "$RUNNER_TEMP/m42/Cargo.toml" -p compiler-opt --lib
          cargo test --manifest-path "$RUNNER_TEMP/m42/Cargo.toml" -p compiler-backend-x86
