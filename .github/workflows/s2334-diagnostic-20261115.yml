name: S23.34 targeted diagnostic source pin
on:
  push:
    branches: [ci/s2334-diagnostic-20261115]
    paths: [.github/workflows/s2334-diagnostic-20261115.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      SOURCE_SHA: d9248eaade024f65d9efda008630b03ccd65ee94
      CARGO_INCREMENTAL: '0'
    steps:
      - name: Checkout pinned compiler
        uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: d9248eaade024f65d9efda008630b03ccd65ee94
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Verify and isolate workspace
        run: |
          set -euo pipefail
          test "$(git -C compiler rev-parse HEAD)" = "$SOURCE_SHA"
          cat > compiler/Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir", "crates/opt"]
          EOF
          rm -f compiler/Cargo.lock
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: s2334-corpus-diagnostic
      - name: Diagnose generated S23.34 corpus
        working-directory: compiler
        run: cargo test -p compiler-opt --test generated_native_additive_pair_cancellation_s2334 s2334_generated_fivewidths_with_cfg_rollback -- --nocapture
