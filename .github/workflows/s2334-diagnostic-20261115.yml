name: TypeId S23.42 generated plus handwritten acceptance
on:
  push:
    branches: [ci/s2334-diagnostic-20261115]
    paths: [.github/workflows/s2334-diagnostic-20261115.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      SOURCE_SHA: d1f173d21813552d2c850b34a1985f422d87b4bf
      CARGO_INCREMENTAL: '0'
    steps:
      - name: Checkout pinned compiler
        uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: d1f173d21813552d2c850b34a1985f422d87b4bf
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Verify and isolate workspace
        run: |
          set -euo pipefail
          test "$(git -C compiler rev-parse HEAD)" = "$SOURCE_SHA"
          cat > compiler/Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir", "crates/opt"]
          EOF
          rm -f compiler/Cargo.lock
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: s2334-corpus-diagnostic
      - name: Verify exact S23.42 phase and oracle tests
        working-directory: compiler
        run: |
          set -euo pipefail
          cargo test -p compiler-opt --test generated_native_complement_xor_pair_s2342 s2342_exact_widths_shared_cfg_near_misses_and_transactional_rollback -- --nocapture
          cargo test -p compiler-opt --no-default-features --test generated_native_complement_xor_pair_s2342 -- --nocapture
