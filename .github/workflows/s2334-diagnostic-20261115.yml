name: S23.14 and S23.19 generated phase diagnostics
on:
  push:
    branches: [ci/s2334-diagnostic-20261115]
    paths: [.github/workflows/s2334-diagnostic-20261115.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      SOURCE_SHA: cb73d1036fe2094f5c96892328295643856a273a
      CARGO_INCREMENTAL: '0'
    steps:
      - name: Checkout pinned compiler
        uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: cb73d1036fe2094f5c96892328295643856a273a
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Verify and isolate workspace
        run: |
          set -euo pipefail
          test "$(git -C compiler rev-parse HEAD)" = "$SOURCE_SHA"
          cat > compiler/Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir", "crates/opt"]
          EOF
          rm -f compiler/Cargo.lock
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: s2334-corpus-diagnostic
      - name: Examine 2314 and 2319 phase mismatches
        working-directory: compiler
        run: |
          set -euo pipefail
          cargo test -p compiler-opt --test generated_native_matchpd_boolean_factor_s2314 s2314_generated_complement_and_subset_five_widths -- --nocapture || echo 'S2314 diagnostic failure recorded'
          cargo test -p compiler-opt --test generated_native_matchpd_pairwise_s2319 s2319_generated_fivewidths_with_cfg_rollback -- --nocapture
