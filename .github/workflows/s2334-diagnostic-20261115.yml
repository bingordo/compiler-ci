name: TypeId complement fixpoint diagnostic source pin
on:
  push:
    branches: [ci/s2334-diagnostic-20261115]
    paths: [.github/workflows/s2334-diagnostic-20261115.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      SOURCE_SHA: 404fb5581db607a4dd0ca61b6a16ad3c05500a0c
      CARGO_INCREMENTAL: '0'
    steps:
      - name: Checkout pinned compiler
        uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 404fb5581db607a4dd0ca61b6a16ad3c05500a0c
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Verify and isolate workspace
        run: |
          set -euo pipefail
          test "$(git -C compiler rev-parse HEAD)" = "$SOURCE_SHA"
          cat > compiler/Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir", "crates/opt"]
          EOF
          rm -f compiler/Cargo.lock
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: s2334-corpus-diagnostic
      - name: Diagnose complement-DAG second-round rewrites
        working-directory: compiler
        run: cargo test -p compiler-opt --test generated_native_complement_dag generated_complement_dag_exercises_all_widths_and_dominance -- --nocapture
