name: Verify merged batched if-conversion main
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-batched-ifconv-main.yml'
permissions:
  contents: read
concurrency:
  group: merged-batched-ifconv
  cancel-in-progress: true
jobs:
  core:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 690e075105ace47664d2947a4e1cbeefb690813e
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Record merged revision
        run: git -C compiler rev-parse HEAD | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Restrict workspace to compiler core
        shell: bash
        run: |
          cat > compiler/Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir", "crates/opt", "crates/backend", "crates/backend-x86"]
          EOF
          rm -f compiler/Cargo.lock
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: if-conversion-batch
      - name: Core and native backend tests
        working-directory: compiler
        run: cargo test -p compiler-ir -p compiler-opt -p compiler-backend -p compiler-backend-x86
      - name: Generated-rule compatibility
        working-directory: compiler
        run: cargo test -p compiler-opt --features experimental-generated-rules
