# One-off exact-source acceptance; do not merge this workflow into main.
name: IR PR3637 native alias and local-memory retirement
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/ir-pr3637-alias-memory-retirement.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ir-pr3637-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native-alias-memory:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      COMPILER_SHA: a28152ef4d3beab187f1b0dd1e173b9110566356
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: ${{ env.COMPILER_SHA }}
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Verify exact compiler SHA and isolate native IR/optimizer
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C compiler rev-parse HEAD)" = "$COMPILER_SHA"
          echo "Compiler candidate: $COMPILER_SHA" >> "$GITHUB_STEP_SUMMARY"
          cat > compiler/Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir", "crates/opt"]
          EOF
          rm -f compiler/Cargo.lock
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: ir-pr3637-native-alias
      - name: Full optimizer unit and local-memory regressions
        working-directory: compiler
        shell: bash
        run: |
          set -euo pipefail
          cargo test -p compiler-opt --lib
          cargo test -p compiler-opt --test typed_local_memory
          cargo test -p compiler-opt --test local_memory_native --no-run
          cargo test -p compiler-opt --test mem2reg_native --no-run
          cargo test -p compiler-opt --test typed_core_pipeline --no-run
      - name: Native IR and optimizer library Clippy
        working-directory: compiler
        shell: bash
        run: |
          set -euo pipefail
          cargo clippy -p compiler-ir --lib -- -D warnings
          # The unrelated x86 dev-dependency still has dead_code and
          # too_many_arguments warnings. All other optimizer lints are errors.
          cargo clippy -p compiler-opt --lib -- -D warnings -A dead_code -A clippy::too_many_arguments
