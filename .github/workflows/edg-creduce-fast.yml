              print(group)
          pointer_prefix="EDG_C_REAL_MIXED_STORAGE_KIND "
          pointer_keys=("raw","kind","aliases","bytes","alignment")
          pointer_groups=[s for s in lines if s.startswith(pointer_prefix)]
