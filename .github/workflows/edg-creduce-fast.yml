          PY
          grep -Fqx 'EDG_C_MIXED_REASON_UNIT_EXIT=0' "$log"
          python3 - "$log" <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          from pathlib import Path
          import re,sys
          lines=Path(sys.argv[1]).read_text(errors="replace").splitlines()
          prefix="EDG_C_REAL_MIXED_PROOF "
          fields=("reason","string_literals","literal_objects","literal_relocs",
                  "routine_relocs","data_relocs","dynamic","initializer_exprs",
                  "scope_dynamic","init_routines","runtime_links",
                  "lowered_startups","lifetimes","local_static","fp_images")
          selected=[s for s in lines if s.startswith(prefix)]
          complete_prefix="EDG_C_REAL_MIXED_COMPLETE "
          complete=[s for s in lines if s.startswith(complete_prefix)]
          accepted=lines.count("EDG_C_TYPEID_EXIT=0")==1
          if len(complete)>1 or len(selected)>1 or (complete and selected):
              raise SystemExit("contradictory source ownership proof")
          if complete:
              names=("integer","aggregate","owners","literal_objects",
                     "routine_relocs","data_relocs")
              parts=complete[0][len(complete_prefix):].split()
              if len(parts)!=len(names) or any(
                  re.fullmatch(re.escape(k)+r"=[0-9]{1,10}",v) is None
                  for k,v in zip(names,parts)):
                  raise SystemExit("unsafe completed C static source proof")
              print(complete[0])
          if not selected and (accepted or complete):
              print("EDG_C_REAL_MIXED_PROOF_STATUS="+(
                  "adapter_accepted" if accepted else "static_source_owned_body_pending"))
          else:
              if len(selected)!=1:raise SystemExit("missing source-safe proof")
              parts=selected[0][len(prefix):].split()
              if len(parts)!=len(fields):raise SystemExit("unexpected proof schema")
              for key,value in zip(fields,parts):
                  if not re.fullmatch(re.escape(key)+r"=[0-9]{1,10}",value):
                      raise SystemExit("unsafe mixed C proof field")
              print(selected[0])
          # Source global proof success is not function-body success. The
          # original mrustc source/diagnostic stays private; publish only
          # bounded numeric EDG categories from the first rejected body.
          body_schemas=(
              ("EDG_C_REAL_ADDRESS_SHAPE",
                  ("base","object","target","storage","displaced","past","subobject","reflection"),1),
              ("EDG_C_REAL_BODY_FAILURE",
                  ("class","prior","locals","statements","expressions","controls"),1),
              ("EDG_C_REAL_BODY_STAGE",("stage","step"),1),
              ("EDG_C_REAL_BODY_SCALAR_SITE",
                  ("site","root","kind","expr","op"),1),
              ("EDG_C_REAL_BODY_CALL_ARG",
                  ("index","root","kind","bytes","align","vararg","class"),1),
              ("EDG_C_REAL_BODY_SNAPSHOT_SITE",
                  ("expr","op","expected_bytes","expected_align"),1),
              ("EDG_C_REAL_BODY_STMT_SITE",
                  ("kind","expr","op","children","depth"),1),
              ("EDG_C_REAL_BODY_ASSIGN_SITE",
                  ("step","lhs","lhsop","lhstype","lhscan",
                   "base","baseop","basetype","basescan",
                   "rhs","rhsop","rhstype","rhscan"),1),
              ("EDG_C_REAL_BODY_RESULT_CANON",
                  ("root","kind","bytes","align"),1),
              ("EDG_C_REAL_BODY_STMT_KIND",("kind","count"),24),
              ("EDG_C_REAL_BODY_EXPR_KIND",("kind","op","count"),32),
              ("EDG_C_REAL_BODY_LOCAL_KIND",("kind","static","count"),24),
              ("EDG_C_REAL_BODY_LOCAL_CANON",
                  ("root","kind","aliases","qualifiers","refs","bytes",
                   "align","admit","count"),24),
              ("EDG_C_REAL_BODY_PARAM_KIND",("kind","role","count"),24),
              ("EDG_C_REAL_BODY_PARAM_CANON",
                  ("root","kind","role","aliases","qualifiers","refs",
                   "bits","signed","boolean","bytes","align","pointee","count"),24),
              ("EDG_C_REAL_BODY_PARAM_FIELD",
                  ("bytes","align","members","position","offset","kind",
                   "bits","width","field_align","bit_offset","bit_width","count"),32),
          )
          for key,fields,limit in body_schemas:
              marker=key+" "
              found=[s for s in lines if s.startswith(marker)]
              if len(found)>limit:raise SystemExit("excess body shape records")
              for record in found:
                  values=record[len(marker):].split()
                  if len(values)!=len(fields) or any(
                      re.fullmatch(re.escape(k)+r"=[0-9]{1,10}",v) is None
                      for k,v in zip(fields,values)):
                      raise SystemExit("unsafe body shape record")
                  print(record)
          aux="EDG_C_REAL_MIXED_PARTITION "
          extra=[s for s in lines if s.startswith(aux)]
