name: Fast EDG generated-C GDB/C-Reduce reproducer

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/edg-creduce-fast.yml'
      - 'bootstrap/reduce-mrustc-edg-host.sh'
      - 'bootstrap/run-mrustc-edg-gap.sh'
  workflow_dispatch:
    inputs:
      source_ref:
        description: 'Compiler source branch, tag, or SHA'
        required: false
        default: main
        type: string
      edg_creduce:
        description: 'Enable C-Reduce on exact generated C'
        required: false
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: edg-creduce-fast-${{ github.head_ref || inputs.source_ref || 'main' }}
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    steps:
      - name: Checkout compiler-ci smoke fixtures
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Checkout compiler using existing read-only deploy key
        uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          # Test the merged source-verified TypeId adapter (not the old mixed-global
          # branch) without changing compiler production history.
          # Manual dispatch can still select any explicit source_ref.
          ref: ${{ inputs.source_ref || 'fbeb86a0fe3bd57884e676cae25af7e2098ca698' }}
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false

      - name: Resolve exact frontend source pins from checked-out compiler
        id: frontend-pins
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          from pathlib import Path
          import re
          import tomllib

          with Path("compiler/crates/driver/Cargo.toml").open("rb") as f:
              driver = tomllib.load(f)["dependencies"]
          with Path("compiler/tools/mini-c-driver/Cargo.toml").open("rb") as f:
              mini = tomllib.load(f)["dependencies"]
          # The Mini-C syntax/sema crates moved into a separate workspace.
          # The main driver preprocessor may use a DIFFERENT pinned revision.
          def pin(deps, crate, repo):
              dep = deps[crate]
              assert dep["git"] == f"ssh://git@github.com/bingordo/{repo}.git"
              sha = dep["rev"]
              assert re.fullmatch(r"[0-9a-f]{40}", sha), (crate, sha)
              return sha
          oberon = pin(driver, "oberon-front-ir", "oberon")
          preprocessor = pin(driver, "mini-c-preprocess", "mini-c")
          syntax = pin(mini, "mini-c-syntax", "mini-c")
          sema = pin(mini, "mini-c-sema", "mini-c")
          assert syntax == sema, "Mini-C syntax/sema must use one source revision"
          assert driver["mini-c-preprocess"]["features"] == ["internal-rcc"]
          print(f"oberon_sha={oberon}")
          print(f"mini_c_frontend_sha={syntax}")
          print(f"mini_c_preprocess_sha={preprocessor}")
          PY

      - name: Checkout pinned Oberon frontend source
        uses: actions/checkout@v4
        with:
          repository: bingordo/oberon
          ref: ${{ steps.frontend-pins.outputs.oberon_sha }}
          path: oberon
          persist-credentials: false

      - name: Checkout pinned Mini-C frontend source
        uses: actions/checkout@v4
        with:
          repository: bingordo/mini-c
          ref: ${{ steps.frontend-pins.outputs.mini_c_preprocess_sha }}
          path: mini-c
          persist-credentials: false
      - name: Checkout compiler-pinned Mini-C for generated-C compatibility audit
        uses: actions/checkout@v4
        with:
          repository: bingordo/mini-c
          # Use precisely the grammar and checker revision required by the
          # bootstrapped driver rather than a historical parser snapshot.
          ref: ${{ steps.frontend-pins.outputs.mini_c_frontend_sha }}
          path: mini-c-compat
          persist-credentials: false
      - name: Checkout pinned mrustc
        uses: actions/checkout@v4
        with:
          repository: thepowersgang/mrustc
          ref: master
          path: mrustc
          persist-credentials: false

      - name: Identify mrustc cache revision
        id: mrustc-revision
        shell: bash
        run: echo "sha=$(git -C mrustc rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Restore prebuilt mrustc and Rust 1.90 libraries
        id: mrustc-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            mrustc/bin
            mrustc/output-1.90.0
          key: mrustc-bootstrap-v1-${{ runner.os }}-ubuntu2404-rust190-${{ steps.mrustc-revision.outputs.sha }}

      - name: Install mrustc build dependencies when the toolchain needs building
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ steps.mrustc-cache.outputs.cache-hit }}" == "true" ]] &&
             [[ -x mrustc/bin/mrustc ]] &&
             [[ -x mrustc/bin/minicargo ]] &&
             [[ -f mrustc/output-1.90.0/libcore.rlib ]]; then
            echo "Cached mrustc is complete; skipping apt install." >> "$GITHUB_STEP_SUMMARY"
          else
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends build-essential zlib1g-dev pkg-config cmake curl python3 libssl-dev
          fi
          # GCC and Cargo are required even when mrustc itself came from cache.
          command -v gcc
          command -v cargo
          command -v python3

      - name: Record reproducibility inputs and target crates
        shell: bash
        run: |
          set -euo pipefail
          echo "Compiler SHA: $(git -C compiler rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
          echo "mrustc SHA: $(git -C mrustc rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
          echo "Host: $(uname -m) / $(lsb_release -rs)" >> "$GITHUB_STEP_SUMMARY"
          echo "Rust crate editions:" >> "$GITHUB_STEP_SUMMARY"
          grep -Rh '^edition[[:space:]]*=' compiler/crates/*/Cargo.toml | sort | uniq -c >> "$GITHUB_STEP_SUMMARY"
          echo "First target: compiler-ir (no frontend dependency); then compiler-opt, backend, driver." >> "$GITHUB_STEP_SUMMARY"

      - name: Build mrustc and matching Rust 1.90 libraries
        id: toolchain
        shell: bash
        working-directory: mrustc
        env:
          RUSTC_VERSION: '1.90.0'
          MRUSTC_TARGET_VER: '1.90'
          OUTDIR_SUF: '-1.90.0'
          PARLEVEL: '2'
        run: |
          set -euo pipefail
          if [[ "${{ steps.mrustc-cache.outputs.cache-hit }}" == "true" ]] && \
             [[ -x bin/mrustc ]] && [[ -x bin/minicargo ]] && \
             [[ -f output-1.90.0/libcore.rlib ]]; then
            echo "Using cached mrustc toolchain and Rust libraries" >> "$GITHUB_STEP_SUMMARY"
          else
            # Missing/incomplete caches rebuild in this runner.
            timeout --signal=TERM --kill-after=10s 20m make -j2
            timeout --signal=TERM --kill-after=10s 10m make RUSTCSRC
            timeout --signal=TERM --kill-after=10s 55m make -f minicargo.mk LIBS
          fi
          test -x bin/mrustc
          test -x bin/minicargo
          test -f output-1.90.0/libcore.rlib

      - name: Cache validated mrustc toolchain
        if: success() && steps.mrustc-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            mrustc/bin
            mrustc/output-1.90.0
          key: mrustc-bootstrap-v1-${{ runner.os }}-ubuntu2404-rust190-${{ steps.mrustc-revision.outputs.sha }}

      - name: Snapshot C files before translation
        shell: bash
        run: |
          find mrustc -type f -name '*.c' -printf '%P\n' | LC_ALL=C sort > "$RUNNER_TEMP/mrustc-c-before.txt"

      - name: Attempt compiler-ir Rust-to-C emission
        id: translate
        shell: bash
        working-directory: mrustc
        env:
          RUSTC_VERSION: '1.90.0'
          MRUSTC_TARGET_VER: '1.90'
          OUTDIR_SUF: '-1.90.0'
          PARLEVEL: '2'
          CC: gcc
        run: |
          set -euo pipefail
          # This is deliberately a bounded first-crate feasibility probe, not
          # an assertion that the full Cargo workspace is supported.
          set +e
          # minicargo's positional argument is the crate DIRECTORY, not Cargo.toml.
          # Share one fresh per-run directory across all compiler crate probes.
          # minicargo can now reuse compiler-ir and other completed dependencies.
          # Do not persist private generated C/rlibs in public Actions caches.
          timeout --signal=TERM --kill-after=10s 20m bin/minicargo \
            -L output-1.90.0 -o output-compiler-bootstrap \
            ../compiler/crates/ir > "$RUNNER_TEMP/mrustc-probe.log" 2>&1
          rc=$?
          set -e
          echo "mrustc/minicargo exit code: $rc" >> "$GITHUB_STEP_SUMMARY"
          find . -type f -name '*.c' -printf '%P\n' | LC_ALL=C sort > "$RUNNER_TEMP/mrustc-c-after.txt"
          # Before-snapshot is relative to mrustc/; after-snapshot is also
          # relative to mrustc/, avoiding false differences from prefix changes.
          comm -13 "$RUNNER_TEMP/mrustc-c-before.txt" "$RUNNER_TEMP/mrustc-c-after.txt" > "$RUNNER_TEMP/mrustc-c-new.txt"
          echo "New C files from attempted translation: $(wc -l < "$RUNNER_TEMP/mrustc-c-new.txt")" >> "$GITHUB_STEP_SUMMARY"
          echo "All C files (includes prebuilt Rust stdlib): $(wc -l < "$RUNNER_TEMP/mrustc-c-after.txt")" >> "$GITHUB_STEP_SUMMARY"
          # Do not print private compiler source or raw diagnostics into public CI.
          python3 - "$RUNNER_TEMP/mrustc-probe.log" "$GITHUB_STEP_SUMMARY" <<'PY'
          import pathlib, re, sys
          log = pathlib.Path(sys.argv[1]).read_text(errors="replace")
          categories = {
              "manifest or dependency resolution": r"failed to (load|parse|select|resolve)|dependency|manifest",
              "missing files or paths": r"No such file|not found|cannot open",
              "unsupported Rust feature": r"unsupported|not implemented|unimplemented|TODO",
              "type or parsing error": r"parse error|type error|error:|ERROR:",
              "compiler crash": r"SIGSEGV|segmentation fault|panic|assertion failed",
              "GCC diagnostic": r"gcc: error|fatal error:|compilation terminated",
          }
          print("Diagnostic categories (counts; non-exclusive):", file=open(sys.argv[2], "a"))
          with open(sys.argv[2], "a") as out:
              for name, pattern in categories.items():
                  print(f"- {name}: {len(re.findall(pattern, log, re.I))}", file=out)
          PY
          echo "Target translation must succeed before GCC syntax and object tests run." >> "$GITHUB_STEP_SUMMARY"
          if (( rc != 0 )); then
            # Only show a bounded, non-source-bearing summary here. Private
            # diagnostics remain in the runner temp log.
            echo "minicargo failed; inspect diagnostic categories above." >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "probe_exit=$rc" >> "$GITHUB_OUTPUT"
          # A nonzero exit is a real failed acceptance gate, not a green probe.
          exit "$rc"

      - name: Generate small real mrustc compiler-ir executable C as reduction seed
        if: always() && steps.translate.outcome == 'success'
        shell: bash
        working-directory: mrustc
        env:
          RUSTC_VERSION: '1.90.0'
          MRUSTC_TARGET_VER: '1.90'
          OUTDIR_SUF: '-1.90.0'
          PARLEVEL: '2'
          CC: gcc
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=10s 15m bin/minicargo \
            -L output-1.90.0 -o output-compiler-bootstrap \
            ../bootstrap/mrustc-gcc-smoke > "$RUNNER_TEMP/mrustc-small-smoke.log" 2>&1
          # The compiler-ir library alone emits a 65+ MB file. This
          # source-owned public executable smoke emits a much smaller C unit
          # without compiling the unrelated optimizer, backends, or driver.
          python3 - <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          from pathlib import Path
          units=[p.stat().st_size for p in Path("output-compiler-bootstrap").rglob("*.c") if p.is_file() and p.stat().st_size]
          assert len(units) >= 2, "expected library C plus executable C"
          print("Generated-C unit count:", len(units))
          print("Smallest generated-C bytes:", min(units))
          assert min(units) < 1024*1024, "missing <1MiB executable seed"
          PY

      - name: Checkout pinned EDG callable frontend source for C compatibility audit
        if: always() && steps.translate.outcome == 'success'
        uses: actions/checkout@v4
        with:
          repository: bingundu/edgcpp
          ref: b195677be8b9b56c8337afad6be8064d21a54082
          path: edgcpp
          persist-credentials: false

      - name: Resolve native EDG Rust bridge revision from checked-out compiler
        id: native-edg-pin
        if: always() && steps.translate.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import re
          import tomllib
          with open("compiler/tools/edg-driver/Cargo.toml", "rb") as f:
              dependencies = tomllib.load(f)["dependencies"]
          dep = dependencies["edgcpp"]
          assert dep["git"] == "https://github.com/bingordo/edgcpp-rust.git"
          rev = dep["rev"]
          assert re.fullmatch(r"[0-9a-f]{40}", rev), "invalid source-pinned EDG bridge"
          print("sha=" + rev)
          PY

      - name: Checkout compiler-pinned production EDG bridge for TypeId audit
        if: always() && steps.native-edg-pin.outcome == 'success'
        uses: actions/checkout@v4
        with:
          repository: bingordo/edgcpp-rust
          ref: 867b95e571fc4b462b28e0d3f156e7009a4a6326
          path: edgcpp-rust
          persist-credentials: false

      - name: Checkout source-pinned TypeId static literal consumer for acceptance
        if: always() && steps.translate.outcome == 'success'
        uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: fbeb86a0fe3bd57884e676cae25af7e2098ca698
          path: compiler-literal-source
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false

      - name: Require candidate Cargo EDG pin matches experimental producer checkout
        if: always() && steps.translate.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          test -f compiler-literal-source/tools/edg-driver/Cargo.toml
          test -d edgcpp-rust/.git
          candidate_rev=$(python3 - <<'PY'
          import re,tomllib
          with open("compiler-literal-source/tools/edg-driver/Cargo.toml","rb") as f:
              dep=tomllib.load(f)["dependencies"]["edgcpp"]
          assert dep["git"] == "https://github.com/bingordo/edgcpp-rust.git"
          rev=dep["rev"]
          assert re.fullmatch(r"[0-9a-f]{40}",rev)
          print(rev)
          PY
          )
          producer_sha=$(git -C edgcpp-rust rev-parse HEAD)
          test "$candidate_rev" = "$producer_sha"
          test "$candidate_rev" = 867b95e571fc4b462b28e0d3f156e7009a4a6326
          echo "EDG_CANDIDATE_MANIFEST_PIN=$candidate_rev" >> "$GITHUB_STEP_SUMMARY"

      - name: Require exact strong byte and BSS TypeId candidate source
        if: always() && steps.translate.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          actual=$(git -C compiler-literal-source rev-parse HEAD)
          expected=fbeb86a0fe3bd57884e676cae25af7e2098ca698
          test "$actual" = "$expected"
          # Public and private probes must compile the SAME candidate.
          # A stale root checkout otherwise makes the private failure
          # appear unchanged while public acceptance is ahead.
          real=$(git -C compiler rev-parse HEAD)
          test "$real" = "$actual"
          echo "EDG_RECORD_BSS_CANDIDATE_SHA=$expected" >> "$GITHUB_STEP_SUMMARY"
          echo "EDG_REAL_AND_PUBLIC_COMPILER_MATCH=1" >> "$GITHUB_STEP_SUMMARY"

      - name: Probe real mrustc C through EDG parse and native TypeId gates
        if: always() && steps.translate.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          # Audit the real C already generated from compiler-ir and other
          # crates even when the optional full driver GCC bootstrap fails.
          # The original source C is not uploaded or published.
          selection="$RUNNER_TEMP/mrustc-c-selections.txt"
          if [[ ! -s "$selection" ]]; then
            python3 bootstrap/probe-mrustc-c-dialect.py \
              "$PWD/mrustc/output-compiler-bootstrap" "$selection"
          fi
          # Parse a small real mrustc TU first, not the 53+ MiB
          # compiler-ir library that previously segfaulted in EDG.
          # Keep the original large representative as a separate scale gate.
          source=$(python3 - "$PWD/mrustc/output-compiler-bootstrap" <<'PY'
          from pathlib import Path
          import sys
          files = [p for p in Path(sys.argv[1]).rglob("*.c") if p.is_file() and p.stat().st_size > 0]
          if not files:
              raise SystemExit("no real generated C files")
          print(min(files, key=lambda p: (p.stat().st_size, str(p))))
          PY
          )
          large_source=$(sed -n '1p' "$selection")
          test -f "$source" && test -f "$large_source"
          case "$source" in "$PWD"/*) ;; *) echo "invalid small C sample path"; exit 1;; esac
          case "$large_source" in "$PWD"/*) ;; *) echo "invalid large C sample path"; exit 1;; esac
          relative="${source#"$PWD"/}"
          large_relative="${large_source#"$PWD"/}"
          echo "EDG generated-C audit small bytes=$(stat -c %s "$source") large bytes=$(stat -c %s "$large_source")" >> "$GITHUB_STEP_SUMMARY"
          # C-Reduce is diagnostic-only, active for this draft PR or manual
          # workflow_dispatch opt-in. Main bootstrap skips the reduction.
          set +e
          timeout --signal=TERM --kill-after=20s 30m docker run --rm \
            --cap-add=SYS_PTRACE --security-opt seccomp=unconfined \
            --entrypoint /bin/bash \
            -v "$PWD:/workspace" \
            -v "$PWD/compiler-literal-source:/workspace/compiler-literal-source:ro" \
            -v "$RUNNER_TEMP:/audit-tmp" \
            -e "AUDIT_SOURCE=/workspace/$relative" \
            -e "EDG_BRIDGE_OVERRIDE_SHA=867b95e571fc4b462b28e0d3f156e7009a4a6326" \
            -e "EDGCPP_DIAG_C_AGGREGATE_FAILURE=1" \
            -e "EDGCPP_DIAG_C_AGGREGATE_FAILURE_FILE=/audit-tmp/edg-union-image-failures.txt" \
            -e "EDG_C_RECORD_REGRESSION=1" \
            -e "EDG_LITERAL_REGRESSION=1" \
            -e "EDGCPP_STATIC_LITERAL_NUMERIC_DIAG=1" \
            -e "EDGCPP_BOOTSTRAP_WEAK_IMAGE_DIAG=1" \
            -e "EDG_WEAK_DATA_WORD_ORACLE=1" \
            -e "EDG_TYPEID_UNIT_REGRESSION=1" \
            -e "EDG_WEAK_TYPEID_ORACLE=1" \
            -e "EDG_WEAK_AGGREGATE_CYCLE_ORACLE=1" \
            -e "EDG_STATIC_RECORD_ORACLE=1" \
            -e "EDG_C_CONST_STATIC_ORACLE=1" \
            -e "EDG_C_BYTE_STATIC_ORACLE=1" \
            -e "EDG_C_RECORD_INIT_ORACLE=1" \
            -e "EDG_TYPEID_SAFE_GLOBAL_DIAG=1" \
            -e "EDG_C_MIXED_GLOBAL_DIAG=1" \
            -e "EDG_C_MIXED_GLOBAL_PROBE=1" \
            -e "EDG_RUN_CREDUCE=0" \
            -e "EDG_UPSTREAM_CHECK=0" \
            ghcr.io/edgcpp/ci-runner@sha256:14b3948c2ce12cfa5472e5a6c468393d15426f3a67685cc35d830ea5db2acdf8 \
            -euo pipefail /workspace/bootstrap/run-mrustc-edg-gap.sh \
            > "$RUNNER_TEMP/mrustc-edg-audit.log" 2>&1
          rc=$?
          set -e
          echo "EDG audit runner exit=$rc (diagnostic only)" | tee -a "$GITHUB_STEP_SUMMARY"
          grep -E '^(EDG_C_UNION_IMAGE_DIAG |EDG_TYPEID_SAFE_FAIL_GLOBAL |EDG_PROBE_GLOBALS |EDG_PROBE_STATIC_LITERALS |EDG_C_LITERAL_[A-Z0-9_]+|EDG_C_MEMORY_ARG_[A-Z0-9_]+|EDG_GNU_ATTR_PARSE_[A-Z_]+_EXIT|EDG_C_(PARSE|TYPEID|LARGE_PARSE)_EXIT|EDG_C_(PARSE|LARGE_PARSE|LARGE_STACK64M_PARSE)_(CLASS|WALL_SECONDS|PEAK_RSS_KB)|EDG_C_LARGE_STACK64M_PARSE_EXIT|EDG_C_LARGE_STACK64M_RETRY|EDG_C_GDB_[A-Z0-9_]+|EDG_CREDUCE_[A-Z0-9_]+|EDG_TYPEID_MIXED_GLOBAL_UNIT_EXIT|EDG_C_TYPEID_FAILURE_STAGE|EDG_C_TYPEID_REJECTION_CLASS|EDG_C_TYPEID_REASON_[A-Z_]+|EDG_C_SAMPLE_BYTES|EDG_C_LARGE_BYTES|EDG_UPSTREAM_[A-Z0-9_]+|EDG_BRIDGE_[A-Z0-9_]+|EDG_C_SOURCE_BRIDGE_[A-Z0-9_]+)=' "$RUNNER_TEMP/mrustc-edg-audit.log" | tee -a "$GITHUB_STEP_SUMMARY" || true
          # The real mrustc-generated C never leaves the private runner.
          # Re-export only source-independent, strictly recognized numeric
          # evidence; zero literal objects remain an unsatisfied acceptance
          # condition rather than being silently treated as success.
          python3 - "$RUNNER_TEMP/mrustc-edg-audit.log" "$RUNNER_TEMP/edg-generated-c-parse.log" <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          from pathlib import Path
          import re,sys
          lines=Path(sys.argv[1]).read_text(errors="replace").splitlines()
          static=re.compile(r"^EDG_PROBE_STATIC_LITERALS objects=([0-9]{1,7}) relocations=([0-9]{1,7}) valid=([01])$")
          expected=("total","externs","internal","file_scope","explicit","tls",
                    "local_static","materializations","weak","sections","initializers",
                    "integer_images","fp_images","aggregate_images","relocations",
                    "dynamic","initializer_exprs","lifetime_inits","defined_routines")
          found=False
          for line in lines:
              m=static.fullmatch(line)
              if m:
                  print(line)
                  found=True
                  break
          print("EDG_C_LITERAL_REAL_CENSUS_PRESENT="+str(int(found)))
          for line in lines:
              if not line.startswith("EDG_PROBE_GLOBALS "):
                  continue
              entries=line[len("EDG_PROBE_GLOBALS "):].split()
              if len(entries)!=len(expected):
                  continue
              values=[]
              for key,entry in zip(expected,entries):
                  m=re.fullmatch(re.escape(key)+r"=([0-9]{1,10})",entry)
                  if m is None:break
                  values.append(m.group(1))
              else:
                  print("EDG_PROBE_GLOBALS "+" ".join(
                      f"{key}={value}" for key,value in zip(expected,values)))
                  break
          # Provenance/image census is aggregate numeric data, never names,
          # symbols or bytes. Re-serialize only the exact supported schema.
          owner_fields=("definitions","explicit","weak","explicit_weak",
                        "explicit_strong","missing_image","missing_weak",
                        "missing_strong","aggregate_weak","aggregate_strong",
                        "orphan_image_owners","literal_reloc_owners",
                        "routine_reloc_owners")
          seen_owner=False
          for line in lines:
              if not line.startswith("EDG_PROBE_STATIC_OWNERS "):
                  continue
              entries=line[len("EDG_PROBE_STATIC_OWNERS "):].split()
              if len(entries)!=len(owner_fields):
                  continue
              values=[]
              for key,entry in zip(owner_fields,entries):
                  m=re.fullmatch(re.escape(key)+r"=([0-9]{1,10})",entry)
                  if m is None: break
                  values.append(m.group(1))
              else:
                  print("EDG_C_REAL_STATIC_OWNERS "+" ".join(
                      f"{key}={value}" for key,value in zip(owner_fields,values)))
                  seen_owner=True
                  break
          print("EDG_C_REAL_STATIC_OWNERS_PRESENT="+str(int(seen_owner)))
          # Additional source-free type/layout buckets for *unproven*
          # weak images. Emit numeric groups only; no source text, original
          # symbol IDs, pointer bits or private initializer contents.
          weak_type_fields=("root_kind","native_kind","bytes","align","count")
          reported=0
          for line in lines:
              if not line.startswith("EDG_PROBE_MISSING_WEAK_TYPE "):
                  continue
              entries=line[len("EDG_PROBE_MISSING_WEAK_TYPE "):].split()
