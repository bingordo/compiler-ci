          for group in pointer_groups:
              words=group[len(pointer_prefix):].split()
              if len(words)!=len(pointer_keys) or any(
                  re.fullmatch(re.escape(k)+r"=[0-9]{1,10}",v) is None
                  for k,v in zip(pointer_keys,words)):
                  raise SystemExit("unsafe source-kind report")
              print(group)
          scalar="EDG_C_REAL_STATIC_SCALAR_REJECT "
          rejects=[s for s in lines if s.startswith(scalar)]
          if len(rejects)>1:raise SystemExit("duplicate numeric scalar rejection")
          if rejects:
              keys=("bits","readonly","c","explicit")
              parts=rejects[0][len(scalar):].split()
              if len(parts)!=len(keys) or any(
                  re.fullmatch(re.escape(k)+r"=[0-9]{1,3}",v) is None
                  for k,v in zip(keys,parts)):
