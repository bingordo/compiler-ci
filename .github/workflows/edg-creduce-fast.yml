          test -s "$log"
          # Report the candidate's public mixed-global test result *before*
          # enforcing it, so a failed regression isn't mistaken for a
          # failure of the already complete private C storage proof.
          python3 - "$log" <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          from pathlib import Path
          import re,sys
          lines=Path(sys.argv[1]).read_text(errors="replace").splitlines()
          marker="EDG_C_MIXED_REASON_UNIT_EXIT="
          records=[s for s in lines if s.startswith(marker)]
          if len(records)==1 and re.fullmatch(
              re.escape(marker)+r"[0-9]{1,3}",records[0]):
              print(records[0])
          else:
              print("EDG_C_MIXED_REASON_UNIT_PRESENT=0")
          for line in lines:
              if re.fullmatch(
                  r"EDG_C_MIXED_REASON_DIAG_[1-8]=[A-Za-z0-9 _.,=:/()><-]{1,180}",line):
