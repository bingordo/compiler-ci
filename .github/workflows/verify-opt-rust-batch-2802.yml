name: Exact-source Rust generated optimizer test batch PR 2802
on:
  push:
    branches: [ci/verify-opt-rust-batch-pr2802-20261122]
    paths: [.github/workflows/verify-opt-rust-batch-2802.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  all-generated-suites:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
      SOURCE_SHA: c3b24203dee34c3d4bbad7cac3fd42ef2909b751
    steps:
      - name: Check out pinned compiler source
        uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: c3b24203dee34c3d4bbad7cac3fd42ef2909b751
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Check exact source and use self-contained core workspace
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C compiler rev-parse HEAD)" = "$SOURCE_SHA"
          cat > compiler/Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir", "crates/opt", "crates/backend", "crates/backend-x86"]
          EOF
          rm -f compiler/Cargo.lock
          rustc --version
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: rust-test-batch-2802
      - name: Validate all 15 original generated optimizer suites
        working-directory: compiler
        shell: bash
        run: |
          set -euo pipefail
          for suite in \
            generated_native_matchpd_subset_s2318 \
            generated_native_matchpd_pairwise_s2319 \
            generated_native_matchpd_complement_s2317 \
            generated_native_reverse_difference_s2335 \
            generated_native_paired_not_s2336 \
            generated_native_complement_xor_pair_s2342 \
            generated_native_complement_pair_s2325 \
            generated_native_complement_mask_s2326 \
            generated_native_carry_reconstruction_s2327 \
            generated_native_matchpd_arithmetic_s2320 \
            generated_native_subtractive_partition_s2322 \
            generated_native_xor_partition_s2324 \
            generated_native_add_partition_comparison_s2328 \
            generated_native_reverse_subtractive_s2329 \
            generated_native_matchpd_partition
          do
            echo "=== $suite ==="
            cargo test -p compiler-opt --test "$suite" -- --nocapture
          done
      - name: Clippy all 15 migrated tests with known baseline-only exceptions
        working-directory: compiler
        shell: bash
        run: |
          set -euo pipefail
          cargo clippy -p compiler-opt \
            --test generated_native_matchpd_subset_s2318 \
            --test generated_native_matchpd_pairwise_s2319 \
            --test generated_native_matchpd_complement_s2317 \
            --test generated_native_reverse_difference_s2335 \
            --test generated_native_paired_not_s2336 \
            --test generated_native_complement_xor_pair_s2342 \
            --test generated_native_complement_pair_s2325 \
            --test generated_native_complement_mask_s2326 \
            --test generated_native_carry_reconstruction_s2327 \
            --test generated_native_matchpd_arithmetic_s2320 \
            --test generated_native_subtractive_partition_s2322 \
            --test generated_native_xor_partition_s2324 \
            --test generated_native_add_partition_comparison_s2328 \
            --test generated_native_reverse_subtractive_s2329 \
            --test generated_native_matchpd_partition \
            -- -D warnings -A unused-imports -A dead-code -A clippy::empty-line-after-doc-comments
