name: LTO generated three-unit differential corpus
on:
  push:
    branches: [verify/lto-generated-multitu-20261114]
    paths: ['.github/workflows/lto-generated-multitu-20261114.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  differential:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 1270f72c4be7414d5117e23cdbc6d711ed182ec8
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Verify source and redirect public frontend Git deps
        run: |
          test "$(git -C compiler rev-parse HEAD)" = "1270f72c4be7414d5117e23cdbc6d711ed182ec8"
          git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
      - name: Focus driver workspace
        run: |
          cat > compiler/Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir", "crates/opt", "crates/backend", "crates/backend-x86", "crates/backend-aarch64", "crates/driver"]
          EOF
          rm -f compiler/Cargo.lock
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: lto-generated-multitu
      - name: Generated 3-TU native, optimized, disabled-inline, fallback differential
        working-directory: compiler
        run: cargo test -p compiler --test lto_generated_multitu -- --nocapture
      - name: Existing mixed-link regression
        working-directory: compiler
        run: cargo test -p compiler --test lto_mixed_link
      - name: Strict generated differential lint
        working-directory: compiler
        run: cargo clippy -p compiler --test lto_generated_multitu -- -D warnings
