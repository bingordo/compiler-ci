name: Review AArch64 generated PHI copy oracle PR 2207
on:
  push:
    branches: [review/aarch64-phi-oracle-2207]
    paths:
      - .github/workflows/review-aarch64-phi-oracle-2207.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  aarch64-liveness:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 25
    steps:
      - name: Checkout pinned compiler change
        uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 708dd7f8047117b5d1b1c309b2941d79cfb54ce4
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Verify compiler SHA
        run: test "$(git -C compiler rev-parse HEAD)" = "708dd7f8047117b5d1b1c309b2941d79cfb54ce4"
      - uses: dtolnay/rust-toolchain@stable
      - name: Isolated backend workspace
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work/crates
          cp -a compiler/crates/{ir,backend,backend-aarch64} work/crates/
          cat > work/Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir", "crates/backend", "crates/backend-aarch64"]
          EOF
      - name: AArch64 all-targets compile
        working-directory: work
        run: RUSTFLAGS="-D warnings" cargo check -p compiler-backend-aarch64 --all-targets
      - name: Native AArch64 tests
        working-directory: work
        run: cargo test -p compiler-backend-aarch64 --all-targets -- --test-threads=1
      - name: Generated mixed-width PHI copy oracle
        working-directory: work
        run: cargo test -p compiler-backend-aarch64 generated_parallel_copies_match_independent_machine_word_oracle -- --nocapture
