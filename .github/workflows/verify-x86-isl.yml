name: Verify X1-X4 Intel ISL and generated DAG matching
on:
  push:
    branches: [main]
    paths: ['.github/workflows/verify-x86-isl.yml']
  workflow_dispatch:
  schedule:
    - cron: '7,22,37,52 * * * *'
permissions:
  contents: read
concurrency:
  group: verify-x86-isl
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: feature/x86-cost-inventory
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Record tested compiler revision
        id: source
        run: |
          sha="$(git rev-parse HEAD)"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "Compiler revision: $sha" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Skip already verified source and workflow on scheduled runs
        id: verified
        uses: actions/cache/restore@v4
        with:
          path: .x86-isl-verified
          key: x86-isl-v1-${{ github.workflow_sha }}-${{ steps.source.outputs.sha }}
          lookup-only: true
      - name: Report cached validation
        if: steps.verified.outputs.cache-hit == 'true' && github.event_name != 'workflow_dispatch'
        run: echo "Already verified the exact source/workflow pair; skipped expensive steps." >> "$GITHUB_STEP_SUMMARY"
      - name: Restrict Rust workspace to compiler core (no frontend credentials)
        if: steps.verified.outputs.cache-hit != 'true' || github.event_name == 'workflow_dispatch'
        run: |
          python3 - <<'PY'
          from pathlib import Path
          Path("Cargo.toml").write_text(
              '[workspace]\nresolver = "2"\nmembers = '
              '["crates/ir", "crates/opt", "crates/backend", "crates/backend-x86"]\n'
          )
          PY
      - name: Reuse core Rust build cache
        if: steps.verified.outputs.cache-hit != 'true' || github.event_name == 'workflow_dispatch'
        uses: Swatinem/rust-cache@v2
        with:
          key: x86-x3-ir-and
          cache-workspace-crates: 'true'
      - name: Test generic AND and total CTZ across SSA, optimization and both x86 sinks
        if: steps.verified.outputs.cache-hit != 'true' || github.event_name == 'workflow_dispatch'
        run: |
          set -euo pipefail
          python3 tools/regen_x86_forms.py --check
          python3 tools/regen_x86_selector_patterns.py --check
          cargo test -p compiler-ir --test semantic_export
          cargo test -p compiler-opt --test bitwise_and
          cargo test -p compiler-opt --test ctz
          cargo test -p compiler-backend-x86 --test and_native
          cargo test -p compiler-backend-x86 --test ctz_native -- --nocapture
          cargo test -p compiler-backend-x86 --test dag_native -- --nocapture
          cargo test -p compiler-backend-x86 --lib dag_match::tests -- --nocapture
          cargo test --lib -p compiler-ir -p compiler-opt -p compiler-backend-x86
      - name: Check proof and discovery module syntax
        if: steps.verified.outputs.cache-hit != 'true' || github.event_name == 'workflow_dispatch'
        run: |
          python3 -m compileall -q tools/x86_effect_proofs.py tools/x86_effect_reference.py
          python3 -m compileall -q tools/x86_isl_symbolic.py tools/test_x86_effect_proofs.py
          python3 -m compileall -q tools/x86_pattern_discovery.py tools/test_x86_pattern_discovery.py
          python3 -m compileall -q tools/x86_bit_scan_discovery.py tools/test_x86_bit_scan_discovery.py
          python3 -m compileall -q tools/x86_ctz_discovery.py tools/test_x86_ctz_discovery.py
          python3 -m compileall -q tools/regen_x86_dag_patterns.py tools/test_x86_dag_rules.py
      - name: Install Z3 for symbolic smoke proofs
        if: steps.verified.outputs.cache-hit != 'true' || github.event_name == 'workflow_dispatch'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq z3
          z3 --version
      - name: Fetch Intel XML
        if: steps.verified.outputs.cache-hit != 'true' || github.event_name == 'workflow_dispatch'
        run: python3 tools/fetch_x86_isl_subset.py /tmp/intel-isl
      - name: Verify reviewed Intel source metadata
        if: steps.verified.outputs.cache-hit != 'true' || github.event_name == 'workflow_dispatch'
        run: python3 tools/import_intel_isl_subset.py /tmp/intel-isl
      - name: Verify generated X4 executable DAG rules against Intel BSF and X3 discovery
        if: steps.verified.outputs.cache-hit != 'true' || github.event_name == 'workflow_dispatch'
        env:
          INTEL_ISL_DIR: /tmp/intel-isl
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tools -p 'test_x86_dag_rules.py' -v
          python3 tools/regen_x86_dag_patterns.py --check --intel-dir /tmp/intel-isl
      - name: Test X1 semantics and X2 proofs
        if: steps.verified.outputs.cache-hit != 'true' || github.event_name == 'workflow_dispatch'
        env:
          INTEL_ISL_DIR: /tmp/intel-isl
        run: |
          python3 -m unittest discover -s tools -p 'test_import_intel_isl_subset.py' -v
          python3 -m unittest discover -s tools -p 'test_x86_instruction_effects.py' -v
          python3 -m unittest discover -s tools -p 'test_x86_semantics.py' -v
          python3 -m unittest discover -s tools -p 'test_x86_ssa_adapter.py' -v
          python3 -m unittest discover -s tools -p 'test_x86_isl_*.py' -v
          python3 -m unittest discover -s tools -p 'test_x86_effect_proofs.py' -v
      - name: Verify bounded X3 ADD discovery
        if: steps.verified.outputs.cache-hit != 'true' || github.event_name == 'workflow_dispatch'
        env:
          INTEL_ISL_DIR: /tmp/intel-isl
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tools -p 'test_x86_pattern_discovery.py' -v
          python3 tools/x86_pattern_discovery.py --intel-dir /tmp/intel-isl --max-nodes 2 --max-terms 20000 --max-proofs 100 --recheck --output /tmp/x86-x3-add.json
          python3 - <<'PY'
          import json
          with open("/tmp/x86-x3-add.json") as file:
              report = json.load(file)
          stats = report["stats"]
          assert stats["proven"] > 1 and stats["unknown"] == 0
          assert report["selection_code_emitted"] is False
          assert report["scope"] == "compiler-ir single-block i32 Add/Sub/Mul/And/Ctz"
          assert len(report["semantic_git_blob_sha1"]) == 40
          assert stats["proven"] == len(report["patterns"])
          assert all(p["proof"]["status"] == "proven" and p["lowering"] == "not_generated"
                     and p["requires"]["unobserved_flags"] for p in report["patterns"])
          print("X3 proved candidates:", stats["proven"])
          import os
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
              summary.write(f"X3 ADD: {stats['enumerated']} expressions, "
                            f"{stats['proven']} verified patterns, "
                            f"{stats['unknown']} unknown proofs.\\n")
          PY
      - name: Verify total CTZ idiom discovery over production SSA
        if: steps.verified.outputs.cache-hit != 'true' || github.event_name == 'workflow_dispatch'
        env:
          INTEL_ISL_DIR: /tmp/intel-isl
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tools -p 'test_x86_ctz_discovery.py' -v
          python3 tools/x86_ctz_discovery.py --intel-dir /tmp/intel-isl --max-nodes 3 --max-terms 20000 --max-proofs 100 --recheck --output /tmp/x86-x3-ctz.json
          python3 - <<'PY'
          import json
          with open("/tmp/x86-x3-ctz.json") as file:
              report = json.load(file)
          assert report["hardware_source_correction"]["status"] == "proven"
          assert report["stats"]["proved"] > 1 and report["stats"]["unknown"] == 0
          assert all(p["compiler_ir_supported"] is True and
                     p["proof"]["status"] == "proven" and
                     p["lowering"] == "not_generated" and p["zero_result"] == 32
                     for p in report["patterns"])
          assert report["selection_code_emitted"] is False
          print("Production SSA CTZ proof patterns:", report["stats"]["proved"])
          PY
      - name: Archive production SSA CTZ proof report
        if: success() && (steps.verified.outputs.cache-hit != 'true' || github.event_name == 'workflow_dispatch')
        uses: actions/upload-artifact@v4
        with:
          name: x86-x3-ctz-production
          path: /tmp/x86-x3-ctz.json
          retention-days: 14
      - name: Verify research-only BSF identity discovery
        if: steps.verified.outputs.cache-hit != 'true' || github.event_name == 'workflow_dispatch'
        env:
          INTEL_ISL_DIR: /tmp/intel-isl
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tools -p 'test_x86_bit_scan_discovery.py' -v
          python3 tools/x86_bit_scan_discovery.py --intel-dir /tmp/intel-isl --max-nodes 3 --max-terms 20000 --max-proofs 100 --output /tmp/x86-x3-bsf.json
          python3 - <<'PY'
          import json
          with open("/tmp/x86-x3-bsf.json") as file:
              report = json.load(file)
          assert report["stats"]["proved_all_widths"] > 1
          assert report["stats"]["unknown"] == 0
          assert all(p["compiler_ir_supported"] is False for p in report["patterns"])
          assert all(len(p["value_and_definedness_proofs"]) == 3
                     and all(q["status"] == "proven"
                             for q in p["value_and_definedness_proofs"])
                     for p in report["patterns"])
          assert len(report["source_git_blob_sha1"]) == 40
          assert report["selection_code_emitted"] is False
          print("X3 research-only BSF identities:", report["stats"]["proved_all_widths"])
          import os
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
              stats = report["stats"]
              summary.write(f"X3 BSF research: {stats['enumerated']} expressions, "
                            f"{stats['proved_all_widths']} identities verified at "
                            f"16/32/64 bits, {stats['unknown']} unknown proofs.\\n")
          PY
      - name: Archive X3 BSF research proof report
        if: success() && (steps.verified.outputs.cache-hit != 'true' || github.event_name == 'workflow_dispatch')
        uses: actions/upload-artifact@v4
        with:
          name: x86-x3-bsf-research
          path: /tmp/x86-x3-bsf.json
          retention-days: 14
      - name: Archive X3 proof report
        if: success() && (steps.verified.outputs.cache-hit != 'true' || github.event_name == 'workflow_dispatch')
        uses: actions/upload-artifact@v4
        with:
          name: x86-x3-add-discovery
          path: /tmp/x86-x3-add.json
          retention-days: 14
      - name: Mark passing compiler source
        if: success() && (steps.verified.outputs.cache-hit != 'true' || github.event_name == 'workflow_dispatch')
        run: |
          printf '%s\n' "${{ steps.source.outputs.sha }}" > .x86-isl-verified
      - name: Cache successful exact source/workflow pair
        if: success() && steps.verified.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .x86-isl-verified
          key: x86-isl-v1-${{ github.workflow_sha }}-${{ steps.source.outputs.sha }}
