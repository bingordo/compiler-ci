name: Verify X1 Intel ISL
on:
  push:
    branches: [main]
    paths: ['.github/workflows/verify-x86-isl.yml']
  workflow_dispatch:
  schedule:
    - cron: '7,22,37,52 * * * *'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: feature/x86-cost-inventory
      - name: Fetch Intel XML
        run: python3 tools/fetch_x86_isl_subset.py /tmp/intel-isl
      - name: Test
        env:
          INTEL_ISL_DIR: /tmp/intel-isl
        run: python3 -m unittest discover -s tools -p 'test_x86_isl_*.py' -v
