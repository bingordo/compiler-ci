name: AArch64 A3.2.S2.4 fast offline diagnostic tests
on:
  push:
    branches: [ci/aarch64-a32-s24-fast-tests-20261111]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Checkout exact source under test
        uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 56e917b787fcd9cf7a9ec097e10535c04da245e9
          path: compiler
          ssh-key: \${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Verify exact compiler source pin and ASL diagnostics
        run: |
          set -euo pipefail
          test "$(git -C compiler rev-parse HEAD)" = 56e917b787fcd9cf7a9ec097e10535c04da245e9
          python3 -m py_compile \
            compiler/tools/aarch64_a32_asl_diagnostics.py \
            compiler/tools/aarch64_a32_asl_typeenv.py \
            compiler/tools/aarch64_a32_sysreg_source.py
          python3 -m unittest discover -s compiler/tools -p 'test_aarch64*.py' -v
          python3 - <<'PY'
          from pathlib import Path
          body=Path("compiler/tools/aarch64_a32_asl_typeenv.py").read_text()
          assert '"semantic_equivalence_proven": False' in body
          assert '"selection_eligible": False' in body
          print("SOURCE_PINNED_A32_S24_FAST_GATE_OK")
          PY
