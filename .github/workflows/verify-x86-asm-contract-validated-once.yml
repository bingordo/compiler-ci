name: x86 GP ASM cross-repo contract generator single-validation
on:
  pull_request:
    paths: ['.github/workflows/verify-x86-asm-contract-validated-once.yml']
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact compiler candidate
        uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 261379c8d4707f12d90e558b2bb9e5cd4b02295f
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Checkout pinned standalone Mini-C consumer
        uses: actions/checkout@v4
        with:
          repository: bingordo/mini-c
          ref: 1e05474aab47db77f4884e39f84c767742bc204c
          path: mini-c
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Assert immutable source and consumer SHA
        run: |
          set -euo pipefail
          test "$(git -C compiler rev-parse HEAD)" = "261379c8d4707f12d90e558b2bb9e5cd4b02295f"
          test "$(git -C mini-c rev-parse HEAD)" = "1e05474aab47db77f4884e39f84c767742bc204c"
      - name: Require byte-for-byte parity of all four Rust outputs
        working-directory: compiler
        run: |
          set -euo pipefail
          export PYTHONPATH="$PWD/tools"
          python3 tools/regen_x86_gp_memory_rmw_contract.py --check --mini-c-root ../mini-c
      - name: Exercise both public and once-validated rendering pathways
        working-directory: compiler
        run: |
          set -euo pipefail
          export PYTHONPATH="$PWD/tools"
          python3 -m py_compile tools/regen_x86_gp_memory_rmw_contract.py tools/test_x86_gp_memory_rmw_contract.py
          python3 -m unittest discover -s tools -p test_x86_gp_memory_rmw_contract.py -v
          python3 -m unittest discover -s tools -p test_x86_scalar_bin_forms.py -v
          python3 -m unittest discover -s tools -p test_x86_gp_recipes.py -v
