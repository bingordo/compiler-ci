name: TypeId automatic fixture discovery
on:
  push:
    branches: [verify/ir-fixture-autodiscovery-20261114]
    paths: ['.github/workflows/ir-fixture-autodiscovery-20261114.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: a377bb3d453cf79d7226706d51ba0eb851da347d
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Verify exact source SHA
        run: test "$(git -C compiler rev-parse HEAD)" = "a377bb3d453cf79d7226706d51ba0eb851da347d"
      - name: Restrict workspace to compiler core
        run: |
          cat > compiler/Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir", "crates/opt", "crates/backend", "crates/backend-x86"]
          EOF
          rm -f compiler/Cargo.lock
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: ir-fixture-discovery
      - name: Discover and run IR directive cases plus existing regression suites
        working-directory: compiler
        run: |
          cargo test -p compiler-opt --test ir_fixture_directives -- --nocapture
          cargo test -p compiler-opt --test typed_cse --test typed_array_fold --test typed_local
          cargo test -p compiler-opt --test typed_phi_cfg --test typed_phi_dead_linear --test typed_identical_merges
          cargo test -p compiler-ir --test native_fixture_text --test native_module_text_v3
          cargo clippy -p compiler-opt --test ir_fixture_directives -- -D warnings
