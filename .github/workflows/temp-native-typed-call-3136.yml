name: TEMP canonical indirect FP calls x86 and AArch64
on:
  pull_request:
    paths:
      - '.github/workflows/temp-native-typed-call-3136.yml'
permissions:
  contents: read
jobs:
  fp-conservative-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
      CARGO_INCREMENTAL: '0'
    steps:
      - name: Authorize pinned Mini-C frontend
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.CI_KEY }}
      - name: Trust GitHub
        run: ssh-keyscan github.com >> ~/.ssh/known_hosts
      - name: Checkout exact FP optimizer candidate
        uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 6a0d3d37b80f72a4e69a0859a20aeb8ff1c8c49b
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Assert exact compiler source
        working-directory: compiler
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = '6a0d3d37b80f72a4e69a0859a20aeb8ff1c8c49b'
          echo "FP optimizer compiler source $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler/tools/mini-c-driver -> target
          key: temp-fp-conservative-optimizer-20261123
      - name: New source FP optimizer transactional SSA and independent GCC fenv oracle
        working-directory: compiler
        run: cargo test --manifest-path tools/mini-c-driver/Cargo.toml -p compiler-mini-c --test fp_optimizer_admission -- --nocapture
      - name: Original numeric FP source, mixed ABI, pointer memory, globals and CFG oracle
        working-directory: compiler
        run: |
          set -euo pipefail
          status=0
          for target in fp_scalar fp_mixed_abi fp_mixed_module fp_mixed_ssa fp_pointer_memory fp_scalar_globals native_float_literals; do
            cargo test --manifest-path tools/mini-c-driver/Cargo.toml -p compiler-mini-c --test "$target" || status=1
          done
          exit "$status"
      - name: Strict production Mini-C code and targeted FP lint
        working-directory: compiler
        run: |
          set -euo pipefail
          RUSTFLAGS='-Dwarnings' cargo check --manifest-path tools/mini-c-driver/Cargo.toml -p compiler-mini-c --lib
          # These two longstanding style warnings are unrelated to FP and
          # the existing ASM2/ASM3 test regressions are separately tracked.
          cargo clippy --manifest-path tools/mini-c-driver/Cargo.toml -p compiler-mini-c --lib --test fp_optimizer_admission -- -D warnings -A clippy::match_like_matches_macro -A clippy::too_many_arguments
      - name: Existing compiler-opt library regressions in isolated core workspace
        working-directory: compiler
        shell: bash
        run: |
          set -euo pipefail
          # The stand-alone Mini-C workspace owns only compiler-mini-c;
          # compiler-opt's dev tests require the native core workspace.
          # Isolate it without changing the pinned compiler sources.
          cat > Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir","crates/ir-macros", "crates/opt", "crates/backend", "crates/backend-x86", "crates/backend-aarch64"]
          EOF
          rm -f Cargo.lock
          cargo test -p compiler-backend-x86 --lib mixed_body_canonical_fp_indirect_value_and_void_calls -- --nocapture
          cargo test -p compiler-opt -p compiler-ir -p compiler-backend-x86 --lib -- --test-threads=2
          cargo check -p compiler-backend-x86 --features historical-function-oracle
          cargo check -p compiler-backend-x86 --features x7-typeid-source-dag-optin
      - name: Summary
        run: echo "PASS FP optimizer transaction, strict IEEE C11 fenv 4-mode x86 ELF/GAS PIC, previous source FP tests and warnings-denied build" >> "$GITHUB_STEP_SUMMARY"
  a64-fp-call:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 6a0d3d37b80f72a4e69a0859a20aeb8ff1c8c49b
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Verify exact source SHA
        working-directory: compiler
        run: test "$(git rev-parse HEAD)" = "6a0d3d37b80f72a4e69a0859a20aeb8ff1c8c49b"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Isolate AArch64 backend workspace
        run: |
          set -euo pipefail
          mkdir -p a64/crates
          cp -a compiler/crates/ir compiler/crates/ir-macros compiler/crates/backend compiler/crates/backend-aarch64 a64/crates/
          cat > a64/Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir","crates/ir-macros","crates/backend","crates/backend-aarch64"]
          EOF
      - name: All target warnings denied check
        working-directory: a64
        run: RUSTFLAGS="-D warnings" cargo check -p compiler-backend-aarch64 --all-targets
      - name: Mixed GP and FP numeric conversion GCC comparisons
        working-directory: a64
        run: cargo test -p compiler-backend-aarch64 --test typeid_fp_numeric_native -- --nocapture
      - name: 49152 F32 F64 global data ELF GAS PIC native GCC comparisons
        working-directory: a64
        run: cargo test -p compiler-backend-aarch64 --test typeid_fp_globals_native -- --nocapture
      - name: 61440 bit exact F32 F64 memory, indexed addressing and scalar return GCC comparisons
        working-directory: a64
        run: cargo test -p compiler-backend-aarch64 --test typeid_fp_memory_native -- --nocapture
      - name: 28672 native C11/GCC mixed scalar indirect callbacks
        working-directory: a64
        run: cargo test -p compiler-backend-aarch64 --test typeid_fp_indirect_call_native -- --nocapture
      - name: 90112 native C11/GCC including 45056 module-local FP calls
        working-directory: a64
        run: cargo test -p compiler-backend-aarch64 --test typeid_fp_direct_call_native -- --nocapture
      - name: Prior 57344 mixed GP FP entry ABI differential
        working-directory: a64
        run: cargo test -p compiler-backend-aarch64 --test typeid_fp_mixed_entry_native -- --nocapture
      - name: Prior 24576 native FP CFG PHI differential
        working-directory: a64
        run: cargo test -p compiler-backend-aarch64 --test typeid_fp_cfg_native -- --nocapture
      - name: Prior 114688 NaN predicate C11 differential
        working-directory: a64
        run: cargo test -p compiler-backend-aarch64 --test typeid_fp_compare_native -- --nocapture
      - name: Prior 53248 FP arithmetic and exact constants oracle
        working-directory: a64
        run: cargo test -p compiler-backend-aarch64 --test typeid_fp_native -- --nocapture
      - name: Full native AArch64 backend all-target regression suite
        working-directory: a64
        run: cargo test -p compiler-backend-aarch64 --all-targets --no-fail-fast -- --test-threads=1
      - name: Strict Clippy library and FP oracles
        if: always()
        working-directory: a64
        run: |
          cargo clippy -p compiler-backend-aarch64 --lib -- -D warnings
          cargo clippy -p compiler-backend-aarch64 --test typeid_fp_direct_call_native -- -D warnings
          cargo clippy -p compiler-backend-aarch64 --test typeid_fp_indirect_call_native -- -D warnings
          cargo clippy -p compiler-backend-aarch64 --test typeid_fp_memory_native -- -D warnings
          cargo clippy -p compiler-backend-aarch64 --test typeid_fp_globals_native -- -D warnings
          cargo clippy -p compiler-backend-aarch64 --test typeid_fp_numeric_native -- -D warnings
          cargo clippy -p compiler-backend-aarch64 --test typeid_fp_mixed_entry_native -- -D warnings
          cargo clippy -p compiler-backend-aarch64 --test typeid_fp_cfg_native -- -D warnings
          cargo clippy -p compiler-backend-aarch64 --test typeid_fp_compare_native -- -D warnings
          cargo clippy -p compiler-backend-aarch64 --test typeid_fp_native -- -D warnings
