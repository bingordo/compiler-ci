name: RV64 R1 TypeId i64 leaf ELF and QEMU oracle
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/verify-riscv-r1-leaf-qemu.yml']
permissions:
  contents: read
jobs:
  leaf:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 6081a560f9e1a1fd5f7562fbfe72f025c5b80ddb
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Verify exact compiler SHA
        run: test "$(git -C compiler rev-parse HEAD)" = "6081a560f9e1a1fd5f7562fbfe72f025c5b80ddb"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Install independent GNU RISC-V tools and QEMU
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y binutils-riscv64-linux-gnu qemu-user python3-yaml
      - name: Restrict workspace to frontend-independent crates
        working-directory: compiler
        run: |
          cat > Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir", "crates/backend", "crates/backend-riscv64"]
          EOF
          rm -f Cargo.lock
      - name: Run Rust tests and generated source contract checks
        working-directory: compiler
        run: |
          set -euo pipefail
          cargo test -p compiler-backend-riscv64 --all-targets
          cargo clippy -p compiler-backend-riscv64 --all-targets -- -D warnings
          python3 tools/riscv_udb_rust_leaf_forms.py \
            --catalog data/riscv_udb_r0_catalog.json \
            --output crates/backend-riscv64/src/generated_encoding.rs --check
      - name: Emit three TypeId RV64 leaves and compare direct ELF with GAS bytes
        working-directory: compiler
        run: |
          set -euo pipefail
          for kind in add sub const; do
            cargo run -p compiler-backend-riscv64 --example rv64_leaf -- \
              "/tmp/rv64_${kind}.o" "/tmp/rv64_${kind}.s" "$kind"
            riscv64-linux-gnu-readelf -h "/tmp/rv64_${kind}.o"
            riscv64-linux-gnu-as -march=rv64i -mabi=lp64 \
              "/tmp/rv64_${kind}.s" -o "/tmp/rv64_${kind}_gas.o"
            riscv64-linux-gnu-objcopy -O binary -j .text \
              "/tmp/rv64_${kind}.o" "/tmp/rv64_${kind}_direct.bin"
            riscv64-linux-gnu-objcopy -O binary -j .text \
              "/tmp/rv64_${kind}_gas.o" "/tmp/rv64_${kind}_gas.bin"
            cmp "/tmp/rv64_${kind}_direct.bin" "/tmp/rv64_${kind}_gas.bin"
            riscv64-linux-gnu-objdump -dr "/tmp/rv64_${kind}.o"
          done
      - name: Execute full-width add, subtraction and negative constant under QEMU
        run: |
          set -euo pipefail
          cat > /tmp/rv64_start.s <<'EOF'
          .option norvc
          .option norelax
          .text
          .globl _start
          _start:
            li a0, 0x100000000
            li a1, 123
            call rv64_add_leaf
            li t0, 0x10000007b
            bne a0, t0, bad_add
            li a0, 3
            li a1, 17
            call rv64_sub_leaf
            li t0, -14
            bne a0, t0, bad_sub
            call rv64_const_leaf
            li t0, -7
            bne a0, t0, bad_const
            li a0, 0
            j done
          bad_add:
            li a0, 1
            j done
          bad_sub:
            li a0, 2
            j done
          bad_const:
            li a0, 3
          done:
            li a7, 93
            ecall
          EOF
          riscv64-linux-gnu-as -march=rv64i -mabi=lp64 \
            /tmp/rv64_start.s -o /tmp/rv64_start.o
          riscv64-linux-gnu-ld -m elf64lriscv -static --no-relax \
            -e _start /tmp/rv64_start.o \
            /tmp/rv64_add.o /tmp/rv64_sub.o /tmp/rv64_const.o \
            -o /tmp/rv64_leaf.elf
          qemu-riscv64 /tmp/rv64_leaf.elf
          echo "RV64 TypeId ELF/QEMU: add64, sub64 and signed constant all passed"
