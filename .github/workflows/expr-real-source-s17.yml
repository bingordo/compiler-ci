name: S17 pinned musl real-source simplification audit
on:
  push:
    branches: [main]
    paths: ['.github/workflows/expr-real-source-s17.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pinned-musl-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out exact S17 audit source
        uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 5e58ed6d23da3809903aff638e00fd3da6fab961
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Verify parser rejects incomplete or altered corpus reports
        run: |
          python3 -m unittest discover -s compiler/tools/expr-rule-gen/harness -p 'test_audit_real_musl.py' -v
      - name: Make public Mini-C frontend dependency available over HTTPS
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("compiler/tools/mini-c-driver/Cargo.toml")
          contents = path.read_text()
          old = "ssh://git@github.com/bingordo/mini-c.git"
          assert contents.count(old) == 2
          path.write_text(contents.replace(old, "https://github.com/bingordo/mini-c.git"))
          PY
      - name: Cache independent Mini-C driver objects
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler/tools/mini-c-driver -> target
          key: s17-real-source-benchmark
      - name: Build actual frontend to SSA and native benchmark
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=10s 12m cargo build --release \
            --manifest-path compiler/tools/mini-c-driver/Cargo.toml \
            --features experimental-fusion-benchmark \
            --example benchmark_generated_fusion
          test -x compiler/tools/mini-c-driver/target/release/examples/benchmark_generated_fusion
      - name: Execute unchanged musl S9 source and GCC native oracle
        run: |
          set -euo pipefail
          RULE_S9_REPEATS=3 timeout --signal=TERM --kill-after=10s 9m \
            compiler/tools/mini-c-driver/target/release/examples/benchmark_generated_fusion --real-world \
            | tee /tmp/s17-raw-musl.log
          grep -q '^S9_SUMMARY ' /tmp/s17-raw-musl.log
      - name: Validate coverage and produce machine-readable result
        run: |
          set -euo pipefail
          python3 compiler/tools/expr-rule-gen/harness/audit_real_musl.py \
            --log /tmp/s17-raw-musl.log \
            --corpus compiler/tools/mini-c-driver/examples/benchmark_generated_fusion/musl \
            --manifest compiler/tools/mini-c-driver/tests/s9_pinned_manifest.json \
            --output /tmp/s17-musl-report.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          report=json.loads(Path('/tmp/s17-musl-report.json').read_text())
          assert report['attempted']==12
          assert report['frontend_accepted']+report['frontend_rejected']==12
          assert report['native_checks']==report['frontend_accepted']*24
          print('S17 result: accepted={frontend_accepted}/12, rejected={frontend_rejected}/12, generated fusion rewrites={generated_fusions}, native checks={native_checks}'.format(**report))
          PY
      - name: Preserve full audit results even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: s17-musl-real-source-audit
          path: |
            /tmp/s17-raw-musl.log
            /tmp/s17-musl-report.json
          if-no-files-found: warn
