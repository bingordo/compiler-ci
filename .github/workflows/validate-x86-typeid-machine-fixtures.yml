name: Validate x86 canonical TypeId to executable machine SSA fixtures
on:
  pull_request:
    paths:
      - '.github/workflows/validate-x86-typeid-machine-fixtures.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  x86-typeid-selected:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 89f9ed589343efe8770919d82ff233f181fe7450
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Pin source and isolate selected backend
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C compiler rev-parse HEAD)" = "89f9ed589343efe8770919d82ff233f181fe7450"
          cat > compiler/Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir", "crates/backend", "crates/backend-x86"]
          EOF
          rm -f compiler/Cargo.lock
          echo "Compiler: 89f9ed589343efe8770919d82ff233f181fe7450" >> "$GITHUB_STEP_SUMMARY"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: x86-machine-typeid-fixtures
      - name: Text and binary native TypeId to selected machine and executable C oracles
        working-directory: compiler
        shell: bash
        run: |
          set -euo pipefail
          cargo test --offline -p compiler-backend-x86 --test machine_typeid_fixture_cli -- --nocapture
          cargo test --offline -p compiler-backend-x86 --test machine_text_v1
      - name: Strict selected machine CLI and backend lint
        working-directory: compiler
        run: cargo clippy --offline -p compiler-backend-x86 --all-targets -- -D warnings
