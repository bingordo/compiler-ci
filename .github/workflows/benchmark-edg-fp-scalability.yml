name: EDG FP backend scalability benchmark
on:
  push:
    branches: [benchmark-edg-fp-scalability]
    paths: ['.github/workflows/benchmark-edg-fp-scalability.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: edg-fp-scalability-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    container:
      # Reuse the same pinned EDG CI environment as edg-yarpgen.yml.
      image: ghcr.io/edgcpp/ci-runner@sha256:14b3948c2ce12cfa5472e5a6c468393d15426f3a67685cc35d830ea5db2acdf8
    defaults:
      run:
        shell: edg-container-exec "bash -eo pipefail {0}"
    env:
      EDG_SOURCE_SHA: b195677be8b9b56c8337afad6be8064d21a54082
      EDG_RELEASE_TAG: edgcpfe-v2026.11.14-upstream-177765bb7731
      EDG_RELEASE_SHA256: 1ce495b629924f31382ecccc891a7a72caae1014ddfa2ba7dd39b44d8b0a9526
      RUST_TOOLCHAIN_VERSION: 1.99.1
      CARGO_PROFILE_DEV_DEBUG: '0'
      EDGCPP_SOURCE_DIR: ${{ github.workspace }}/edgcpp
      EDGCPP_COMPILE_COMMANDS: ${{ github.workspace }}/edgcpp/build/gcc-release/compile_commands.json
      EDGCPP_LIB_DIR: ${{ github.workspace }}/edgcpp/build/gcc-release/lib
      EDGCPP_EDG_REVISION: b195677be8b9b56c8337afad6be8064d21a54082
    steps:
      - name: Check out exact EDG Rust revision (pinned on compiler-ci PR/push)
        uses: actions/checkout@v4
        with:
          repository: bingordo/edgcpp-rust
          ref: ${{ '799f496939d38d4894c4972467022fd2ec8923a6' }}
          path: edgcpp-rust
          persist-credentials: false
      - name: Record exact revision
        working-directory: edgcpp-rust
        run: |
          set -euo pipefail
          sha=$(git rev-parse HEAD)
          test "${#sha}" -eq 40
          echo "EDG Rust commit: $sha" | tee -a "$GITHUB_STEP_SUMMARY"
          test "$sha" = 799f496939d38d4894c4972467022fd2ec8923a6
      - name: Check out source headers matching the pinned EDG library
        uses: actions/checkout@v4
        with:
          repository: bingundu/edgcpp
          ref: b195677be8b9b56c8337afad6be8064d21a54082
          path: edgcpp
          persist-credentials: false
      - name: Configure EDG bridge metadata without rebuilding full EDG
        working-directory: edgcpp
        env:
          EDG_BASE: ${{ github.workspace }}/edgcpp/bases/docker/dev-env/gcc
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EDG_SOURCE_SHA"
          test "$(git rev-parse HEAD:src/lower_il.c)" = 832fee1d985cd666c05090a35ea0a71a78880564
          ! grep -q 'edgcpp_capture_' src/lower_il.c
          cmake --preset linux-gcc-release \
            -DEDG_BUILD_LIB=OFF -DEDG_BUILD_CALLABLE_LIBRARY=ON \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
          cmake --build build/gcc-release --target error-info --parallel 2
          test -s build/gcc-release/src/includes/err_codes.h
          test -s build/gcc-release/src/includes/err_data.h
      - name: Download and verify pinned prebuilt EDG archive
        working-directory: edgcpp
        run: |
          set -euo pipefail
          mkdir -p build/gcc-release/lib build/prebuilt-edg
          curl --fail --location --silent --show-error --retry 4 --retry-delay 2 \
            "https://github.com/bingundu/edgcpp/releases/download/$EDG_RELEASE_TAG/edgcpfe-ci-upstream-callable-edg-release-20261114-linux-x86_64.tar.gz" \
            -o build/prebuilt-edg/archive.tar.gz
          printf '%s  %s\n' "$EDG_RELEASE_SHA256" build/prebuilt-edg/archive.tar.gz | sha256sum -c -
          tar -xzf build/prebuilt-edg/archive.tar.gz -C build/prebuilt-edg
          grep -Fx "commit=$EDG_SOURCE_SHA" build/prebuilt-edg/BUILD-INFO.txt
          grep -Fx 'platform=linux-x86_64' build/prebuilt-edg/BUILD-INFO.txt
          test -s build/prebuilt-edg/lib/libedgcpfe.a
          cp build/prebuilt-edg/lib/libedgcpfe.a build/gcc-release/lib/libedgcpfe.a
      - name: Install pinned Rust toolchain
        run: |
          set -euo pipefail
          if ! command -v cargo >/dev/null; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | \
              sh -s -- -y --profile minimal --default-toolchain "$RUST_TOOLCHAIN_VERSION"
          fi
          export PATH="$HOME/.cargo/bin:$PATH"
          rustup toolchain install "$RUST_TOOLCHAIN_VERSION" --profile minimal
          rustup default "$RUST_TOOLCHAIN_VERSION"
      - name: Build both compiler revisions with identical release settings
        run: |
          set -euo pipefail
          export PATH="$HOME/.cargo/bin:$PATH"
          mkdir -p "$RUNNER_TEMP/fp-bench/bin"
          cd edgcpp-rust
          cat > examples/fp_bench.rs <<'RS'
          use edgcpp::{compile, codegen::emit_edg_object};
          use std::{time::Instant, hint::black_box};
          fn main() {
              let input=std::env::args().nth(1).expect("source file");
              let start=Instant::now();
              let parsed=compile(&["edgcpfe","--c11",input.as_str()]).unwrap();
              assert_eq!(parsed.status,0);
              let frontend=start.elapsed();
              let start=Instant::now();
              let object=emit_edg_object(black_box(&parsed.il)).unwrap();
              let backend=start.elapsed();
              assert_eq!(&object[..4],b"\x7fELF");
              println!("FPBENCH,{},{},{}",frontend.as_nanos(),backend.as_nanos(),object.len());
          }
          RS
          cp examples/fp_bench.rs "$RUNNER_TEMP/fp-bench/harness.rs"
          cargo build --locked --release --features codegen --example fp_bench
          cp target/release/examples/fp_bench "$RUNNER_TEMP/fp-bench/bin/baseline"
          git fetch --no-tags origin 6b15774ed266e08a46cc25c491826c920b25ca34
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = 6b15774ed266e08a46cc25c491826c920b25ca34
          cp "$RUNNER_TEMP/fp-bench/harness.rs" examples/fp_bench.rs
          cargo build --locked --release --features codegen --example fp_bench
          cp target/release/examples/fp_bench "$RUNNER_TEMP/fp-bench/bin/candidate"
      - name: Compare frontend and backend scaling on identical generated C
        working-directory: edgcpp
        run: |
          set -euo pipefail
          source build/gcc-release/environment.sh
          cd build/gcc-release
          python3 - <<'PY'
          import csv, os, pathlib, statistics, subprocess
          root = pathlib.Path(os.environ["RUNNER_TEMP"]) / "fp-bench"
          cases = []
          for n in (64, 256, 512):
              cases.append(("sparse_routines", n, "\n".join(
                  f"double f{i}(double x) {{ return x+{i}.25; }}" for i in range(n))))
              cases.append(("locals", n, "double f(double x) {\n" + "\n".join(
                  f"double v{i} = " + ("x" if i == 0 else f"v{i-1}") + "+1.0;"
                  for i in range(n)) + f"\nreturn v{n-1}; }}"))
              cases.append(("globals", n, "\n".join(
                  f"double g{i}={i}.25;" for i in range(n)) +
                  f"\ndouble f(double x) {{ g0=x; return g0+g{n-1}; }}"))
          for n in (8,16,32):
              lines=[]
              for i in range(1,n+1):
                  types=",".join(["double"]*i)
                  args=",".join(["x"]*i)
                  lines.append(f"double f{i}(double (*p)({types}),double x) {{return p({args});}}")
              cases.append(("callbacks", n, "\n".join(lines)))
          def run(revision, source):
              cmd=[str(root/"bin"/revision),str(source)]
              completed=subprocess.run(cmd, capture_output=True, text=True, check=True, timeout=120)
              lines=[x for x in completed.stdout.splitlines() if x.startswith("FPBENCH,")]
              if len(lines)!=1: raise RuntimeError(completed.stdout+completed.stderr)
              return tuple(map(int,lines[0].split(",")[1:]))
          rows=[]
          report=["# FP backend scaling", "",
                  "Baseline: 799f496939d38d4894c4972467022fd2ec8923a6",
                  "Candidate: 6b15774ed266e08a46cc25c491826c920b25ca34", "",
                  "Median of 5 interleaved trials after one warmup per revision; release builds, same runner.",
                  "Backend includes IL validation, lowering, Cranelift and object serialization. Times in ms.", "",
                  "| Workload | Size | Frontend old | Frontend new | Backend old | Backend new | Backend speedup |",
                  "|---|---:|---:|---:|---:|---:|---:|"]
          for case,n,text in cases:
              source=root/f"{case}-{n}.c"
              source.write_text(text)
              subprocess.run(["gcc","-std=c11","-fsyntax-only",str(source)],check=True)
              samples={"baseline":[],"candidate":[]}
              for rev in samples: run(rev,source)
              for trial in range(5):
                  order=["baseline","candidate"] if trial%2==0 else ["candidate","baseline"]
                  for rev in order:
                      fe,be,size=run(rev,source)
                      samples[rev].append((fe,be))
                      rows.append((case,n,trial,rev,fe,be,size))
              old,new=([statistics.median(x[i] for x in samples[rev])/1e6 for i in (0,1)]
                       for rev in ("baseline","candidate"))
              line=f"| {case} | {n} | {old[0]:.3f} | {new[0]:.3f} | {old[1]:.3f} | {new[1]:.3f} | {old[1]/new[1]:.2f}x |"
              report.append(line)
              print(line,flush=True)
          with (root/"samples.csv").open("w",newline="") as f:
              writer=csv.writer(f)
              writer.writerow(["workload","size","trial","revision","frontend_ns","backend_ns","object_bytes"])
              writer.writerows(rows)
          (root/"report.md").write_text("\n".join(report)+"\n")
          with open(os.environ["GITHUB_STEP_SUMMARY"],"a") as f: f.write("\n".join(report)+"\n")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: edg-fp-scalability-results
          path: |
            ${{ runner.temp }}/fp-bench/report.md
            ${{ runner.temp }}/fp-bench/samples.csv
