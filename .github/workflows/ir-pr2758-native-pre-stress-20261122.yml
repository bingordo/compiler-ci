# Validation for native TypeId PRE stress and generic-PRE mainline parity.
name: IR PR2758 TypeId PRE native stress
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ir-pr2758-native-pre-stress-20261122.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-pre:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      SOURCE_SHA: 2d3905c38d10608791f3f76d43aeb401ee1af9ab
      CARGO_INCREMENTAL: '0'
      CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
    steps:
      - name: Check out exact compiler revision
        uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: ${{ env.SOURCE_SHA }}
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Verify pinned revision and isolate core
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C compiler rev-parse HEAD)" = "$SOURCE_SHA"
          cat > compiler/Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir", "crates/opt", "crates/backend", "crates/backend-x86", "crates/backend-aarch64"]
          EOF
          rm -f compiler/Cargo.lock
      - name: Cache core Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: ir-pr2758-pre-native-stress
      - name: Run entire native PRE integration test (including generic baseline)
        working-directory: compiler
        shell: bash
        run: |
          set -euo pipefail
          cargo test -p compiler-opt --test typed_pre_native -- --nocapture --test-threads=1
      - name: Check PRE test with Clippy
        working-directory: compiler
        shell: bash
        run: |
          set -euo pipefail
          cargo clippy -p compiler-opt --test typed_pre_native -- -D clippy::all -A clippy::collapsible_match
