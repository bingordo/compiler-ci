# Temporary exact-source TypeId scalar acceptance; close unmerged.
name: Temporary M4 x86 scalar native TypeId inputs
on:
  pull_request:
    paths:
      - '.github/workflows/temporary-m4-scalar-typeid-3103.yml'
permissions:
  contents: read
jobs:
  native-scalar:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      SOURCE_SHA: 0848a3191370dc15ee038790965c78b4b10a8c39
      CARGO_INCREMENTAL: '0'
      CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
    steps:
      - name: Checkout exact compiler source
        uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: ${{ env.SOURCE_SHA }}
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Verify compiler SHA and isolate backend workspace
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C compiler rev-parse HEAD)" = "$SOURCE_SHA"
          cat > compiler/Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir", "crates/opt", "crates/backend", "crates/backend-x86", "crates/backend-aarch64"]
          EOF
          rm -f compiler/Cargo.lock
      - name: Cache core workspace
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: temporary-m4-scalar-typeid-3103
      - name: Run native M4 scalar C11 oracle in ELF/GAS and both frame modes
        working-directory: compiler
        shell: bash
        run: |
          set -euo pipefail
          cargo test -p compiler-backend-x86 --test m4_scalar_native -- --nocapture
      - name: Scoped Clippy with unrelated baseline allowances
        working-directory: compiler
        shell: bash
        run: |
          set -euo pipefail
          cargo clippy -p compiler-backend-x86 --test m4_scalar_native -- -D clippy::all -A clippy::needless_borrows_for_generic_args -A clippy::too_many_arguments -A clippy::needless_range_loop -A clippy::collapsible_if -A clippy::collapsible_match -A clippy::needless_lifetimes -A clippy::type_complexity -A clippy::empty_line_after_doc_comments
