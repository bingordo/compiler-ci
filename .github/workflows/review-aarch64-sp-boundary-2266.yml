name: Review AArch64 SP boundary matrices PR 2266
on:
  push:
    branches: [review/aarch64-sp-boundary-2266]
    paths:
      - .github/workflows/review-aarch64-sp-boundary-2266.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  aarch64-liveness:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 25
    steps:
      - name: Checkout pinned compiler change
        uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 5cf4518cd0ab0701f2d1de78a9994ba9483d014e
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Verify compiler SHA
        run: test "$(git -C compiler rev-parse HEAD)" = "5cf4518cd0ab0701f2d1de78a9994ba9483d014e"
      - uses: dtolnay/rust-toolchain@stable
      - name: Isolated backend workspace
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work/crates
          cp -a compiler/crates/{ir,backend,backend-aarch64} work/crates/
          cat > work/Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir", "crates/backend", "crates/backend-aarch64"]
          EOF
      - name: AArch64 all-targets compile
        working-directory: work
        run: RUSTFLAGS="-D warnings" cargo check -p compiler-backend-aarch64 --all-targets
      - name: Native AArch64 tests
        working-directory: work
        run: cargo test -p compiler-backend-aarch64 --all-targets -- --test-threads=1
      - name: Generated SP access encoding boundaries
        working-directory: work
        run: cargo test -p compiler-backend-aarch64 generated_sp_access_boundaries_select_exact_direct_or_fallback_words -- --nocapture
      - name: Generated near-limit frame geometry
        working-directory: work
        run: cargo test -p compiler-backend-aarch64 generated_frame_boundary_geometry_is_disjoint_and_bounded -- --nocapture
