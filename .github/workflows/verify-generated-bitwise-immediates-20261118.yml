name: source-pinned generated bitwise immediate rematerialization
on:
  push:
    branches: [main]
    paths: [.github/workflows/verify-generated-bitwise-immediates-20261118.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bitwise-immediate-source-oracles:
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: d1826d0439099e74a9b717d841f921b03cd0c0cd
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Verify immutable source SHA and generated form catalog
        run: |
          set -euo pipefail
          test "$(git -C compiler rev-parse HEAD)" = "d1826d0439099e74a9b717d841f921b03cd0c0cd"
          git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
          (cd compiler && python3 tools/regen_x86_forms.py --check)
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: x86-generated-bitwise-immediates-20261118
      - name: Native generated bitwise forms versus independent C11 ELF GAS
        working-directory: compiler
        run: |
          set -euo pipefail
          cargo test -p compiler-backend-x86 --lib scalar_immediate::tests -- --nocapture
          cargo test -p compiler-backend-x86 --lib reviewed_bitwise_immediate_native_tests -- --nocapture
          cargo test -p compiler-backend-x86 --lib
          cargo test -p compiler-backend --lib
          cargo test -p compiler-backend-aarch64 --lib
          cargo clippy -p compiler-backend --lib -- --no-deps -D warnings
          cargo clippy -p compiler-backend-x86 --lib -- --no-deps -D warnings -A dead_code
          cargo test -p compiler --test x7_s4_rolling_checksum_source -- --nocapture
          cargo test -p compiler --test x86_inline_source_ablation -- --nocapture
