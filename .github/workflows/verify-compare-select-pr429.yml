name: Validate x86 compare-select equality fusion PR 429
on:
  push:
    branches: [ci/compare-select-eqne-pr429-20261106]
permissions:
  contents: read
jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: bb7cf0ae4e39273883eb074e9911710a1a21ac7b
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Verify immutable compiler revision
        run: test "$(git -C compiler rev-parse HEAD)" = "bb7cf0ae4e39273883eb074e9911710a1a21ac7b"
      - name: Isolate independent core workspace
        shell: bash
        run: |
          cat > compiler/Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir", "crates/opt", "crates/backend", "crates/backend-x86"]
          EOF
          rm -f compiler/Cargo.lock
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: pr429-cmp-select
      - name: Targeted native compare-select C oracle
        working-directory: compiler
        run: cargo test -p compiler-backend-x86 --test compare_select_equality_native -- --nocapture
      - name: Full independent core and x86 native suites
        working-directory: compiler
        run: cargo test -p compiler-ir -p compiler-opt -p compiler-backend -p compiler-backend-x86
      - name: Strict x86 and IR Clippy
        working-directory: compiler
        run: |
          cargo clippy -p compiler-backend-x86 --all-targets -- -D warnings
          cargo clippy -p compiler-ir -p compiler-opt --all-targets -- -D warnings
