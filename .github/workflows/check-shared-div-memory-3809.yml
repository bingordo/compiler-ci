name: Verify shared division and memory call fixtures
on:
  pull_request:
    paths: ['.github/workflows/check-shared-div-memory-3809.yml']
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            package: compiler-backend-x86
            tests: '--test m4_scalar_div_traps --test m4_i64_memory_call_native --test shared_integer_scalar'
          - runner: ubuntu-24.04-arm
            package: compiler-backend-aarch64
            tests: '--test shared_division_memory_call --test shared_t5_scalar --test modern_i32 --test i64_transport'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: f47fe050f1793a2a78fdb97adc333456073129d9
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Verify source and isolate compiler-core workspace
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = f47fe050f1793a2a78fdb97adc333456073129d9
          git rev-parse HEAD
          cat > Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir", "crates/ir-macros", "crates/opt", "crates/backend", "crates/backend-x86", "crates/backend-aarch64"]
          EOF
      - uses: Swatinem/rust-cache@v2
        with:
          key: shared-t5-scalar-${{ matrix.runner }}
      - name: Verify native shared fixtures
        run: |
          set -euo pipefail
          cargo test -p ${{ matrix.package }} ${{ matrix.tests }} -- --nocapture
