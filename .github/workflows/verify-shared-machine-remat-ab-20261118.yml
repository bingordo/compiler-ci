name: candidate remat full-vs-partial planner validation
on:
  push:
    branches: [validation/remat-cost-20261124]
    paths: ['.github/workflows/verify-shared-machine-remat-ab-20261118.yml']
permissions:
  contents: read
  statuses: write
jobs:
  remat-planner-validation:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
      COMPILER_SHA: 'a6066230523d48119416e3b27a74320d50a9799e'
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 'a6066230523d48119416e3b27a74320d50a9799e'
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Verify exact compiler candidate SHA
        run: |
          set -euo pipefail
          actual="$(git -C compiler rev-parse HEAD)"
          test "$actual" = "$COMPILER_SHA"
          echo "Tested compiler SHA: $actual" >> "$GITHUB_STEP_SUMMARY"
          git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: remat-planner-cost-20261124
      - name: Generated cost matrix and generic backend unit tests
        working-directory: compiler
        run: |
          set -euo pipefail
          cargo test -p compiler-backend --lib remat::optimal_cost_tests -- --nocapture
          cargo test -p compiler-backend --lib remat::tests
          cargo test -p compiler-backend --lib machine_dominance::tests
          cargo test -p compiler-backend --lib
      - name: Verify x86 AArch64 and RV64 shared-planner consumers
        working-directory: compiler
        run: |
          set -euo pipefail
          cargo test -p compiler-backend-x86 --lib
          cargo test -p compiler-backend-aarch64 --lib
          cargo test -p compiler-backend-riscv64 --lib
      - name: Check impacted crates with strict Clippy
        working-directory: compiler
        run: |
          set -euo pipefail
          cargo clippy -p compiler-backend -p compiler-backend-x86 -p compiler-backend-aarch64 -p compiler-backend-riscv64 --lib -- -D warnings
      - name: Publish validation status on compiler-ci commit
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_OUTCOME: ${{ job.status }}
        run: |
          set -euo pipefail
          case "$JOB_OUTCOME" in
            success) state=success ;;
            cancelled) state=error ;;
            *) state=failure ;;
          esac
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state="$state" \
            -f context="compiler/remat-planner-cost" \
            -f description="Exact-source ${COMPILER_SHA:0:12} remat planner/backend tests and Clippy: $JOB_OUTCOME" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
