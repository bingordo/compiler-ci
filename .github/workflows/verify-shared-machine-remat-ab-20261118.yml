name: pinned mixed x86 ADD SUB pure rematerialization
on:
  push:
    branches: [validation/x86-mixed-addsub-remat-20261124]
    paths: ['.github/workflows/verify-shared-machine-remat-ab-20261118.yml']
permissions:
  contents: read
  statuses: write
jobs:
  mixed-remat:
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
      COMPILER_SHA: '5ed779f9344dbc80abd1a9e7bd3464850bf43b6a'
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: '5ed779f9344dbc80abd1a9e7bd3464850bf43b6a'
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Verify exact source pin and architecture
        run: |
          set -euo pipefail
          actual="$(git -C compiler rev-parse HEAD)"
          test "$actual" = "$COMPILER_SHA"
          echo "compiler source: $actual" >> "$GITHUB_STEP_SUMMARY"
          lscpu | grep -E '^Architecture:|^Model name:' || true
          git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: x86-addsub-remat-20261124
      - name: Shared width-exact composition and generic planner
        working-directory: compiler
        run: |
          set -euo pipefail
          cargo test -p compiler-backend --lib remat::compose_same_kind_tests -- --nocapture
          cargo test -p compiler-backend --lib remat::optimal_cost_tests
          cargo test -p compiler-backend --lib machine_dominance
      - name: Selected x86 machine SSA and independent physical C11 oracle
        working-directory: compiler
        run: |
          set -euo pipefail
          cargo test -p compiler-backend-x86 --lib machine::pure_immediate_chain_tests -- --nocapture
          cargo test -p compiler-backend-x86 --lib pure_immediate_chain_native_tests -- --nocapture
          cargo test -p compiler-backend-x86 --lib scalar_immediate::tests
      - name: Production source TypeId native ELF and GAS GCC oracle plus pass hits
        working-directory: compiler
        run: |
          set -euo pipefail
          cargo test -p compiler --test x86_pure_remat_source -- --nocapture
      - name: Broader x86 and RV64 AArch64 compatibility
        working-directory: compiler
        run: |
          set -euo pipefail
          cargo test -p compiler-backend-x86 --lib -- \
            --skip call::tests::invalid_call_requests_do_not_partially_modify_stream \
            --skip scalar_abi::tests::reject_unpromoted_variadic_float_and_invalid_counts \
            --skip typeid_fp_staged_native_tests::typeid_fp_staged_stack_argument_abi_oracle
          cargo test -p compiler-backend-riscv64 --lib pure_cross_block_tests
          cargo test -p compiler-backend-aarch64 --lib
      - name: Scoped generic Clippy with pre-existing ABI warning exceptions
        working-directory: compiler
        run: |
          set -euo pipefail
          cargo clippy -p compiler-backend --lib -- \
            -D warnings -A clippy::needless_lifetimes -A clippy::too_many_arguments
      - name: Publish pinned test status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          OUTCOME: ${{ job.status }}
        run: |
          case "$OUTCOME" in
            success) state=success ;;
            cancelled) state=error ;;
            *) state=failure ;;
          esac
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state="$state" \
            -f context="compiler/x86-addsub-pure-remat" \
            -f description="Pinned compiler ${COMPILER_SHA:0:12} mixed remat $OUTCOME" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
