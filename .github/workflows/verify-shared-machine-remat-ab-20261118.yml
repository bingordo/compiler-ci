name: source-pinned shared x86 RV64 pure remat candidate
on:
  push:
    branches: [validation/x86-shared-pure-remat-20261124]
    paths: ['.github/workflows/verify-shared-machine-remat-ab-20261118.yml']
permissions:
  contents: read
  statuses: write
jobs:
  remat:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
      COMPILER_SHA: 'ed66941e5e4f0c999e60f9067ff3f0b3857b585a'
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 'ed66941e5e4f0c999e60f9067ff3f0b3857b585a'
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Record and assert exact compiler SHA
        run: |
          set -euo pipefail
          actual="$(git -C compiler rev-parse HEAD)"
          echo "Exact compiler source SHA: $actual" >> "$GITHUB_STEP_SUMMARY"
          test "$actual" = "$COMPILER_SHA"
          git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: x86-rv-shared-pure-remat-20261124
      - name: Shared pure-expression semantics and remat planner
        working-directory: compiler
        run: |
          set -euo pipefail
          cargo test -p compiler-backend --lib remat::compose_same_kind_tests -- --nocapture
          cargo test -p compiler-backend --lib remat::optimal_cost_tests
          cargo test -p compiler-backend --lib remat::tests
          cargo test -p compiler-backend --lib machine_dominance::tests
      - name: x86 selected SSA pure-immediate chain tests and native regressions
        working-directory: compiler
        run: |
          set -euo pipefail
          cargo test -p compiler-backend-x86 --lib machine::pure_immediate_chain_tests -- --nocapture
          cargo test -p compiler-backend-x86 --lib pure_immediate_chain_native_tests -- --nocapture
          cargo test -p compiler-backend-x86 --lib reviewed_bitwise_immediate_native_tests
          cargo test -p compiler-backend-x86 --lib reviewed_scalar_immediate32_native_tests
          cargo test -p compiler-backend-x86 --lib commutative_left_immediate_native_tests
          cargo test -p compiler-backend-x86 --lib machine::dominance_remat_tests
          cargo test -p compiler-backend-x86 --lib -- \
            --skip call::tests::invalid_call_requests_do_not_partially_modify_stream \
            --skip scalar_abi::tests::reject_unpromoted_variadic_float_and_invalid_counts \
            --skip typeid_fp_staged_native_tests::typeid_fp_staged_stack_argument_abi_oracle
      - name: RV64 and AArch64 compatibility suites
        working-directory: compiler
        run: |
          set -euo pipefail
          python3 tools/regen_riscv_native_selector_rules.py --check
          cargo test -p compiler-backend-riscv64 --lib pure_cross_block_tests
          cargo test -p compiler-backend-riscv64 --lib pure_bitwise_tests
          cargo test -p compiler-backend-riscv64 --lib
          cargo test -p compiler-backend-aarch64 --lib
      - name: Strict changed generic backend Clippy, two existing ABI exceptions
        working-directory: compiler
        run: |
          set -euo pipefail
          cargo clippy -p compiler-backend --lib -- \
            -D warnings -A clippy::needless_lifetimes -A clippy::too_many_arguments
      - name: Publish source-pinned CI status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          OUTCOME: ${{ job.status }}
        run: |
          set -euo pipefail
          case "$OUTCOME" in
            success) state=success ;;
            cancelled) state=error ;;
            *) state=failure ;;
          esac
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state="$state" \
            -f context="compiler/x86-pure-remat" \
            -f description="Pure remat x86 RV64 A64 source ${COMPILER_SHA:0:12}: $OUTCOME" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
