name: source-pinned A64 nonflags immediate and SSA pure remat
on:
  push:
    branches: [validation/a64-nonflags-pure-remat-20261124]
    paths: ['.github/workflows/verify-shared-machine-remat-ab-20261118.yml']
permissions:
  contents: read
  statuses: write
jobs:
  check-a64:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
      COMPILER_SHA: 'ac27cbd4b987b1223064132b583134b9248b84e6'
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 'ac27cbd4b987b1223064132b583134b9248b84e6'
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Verify exact revision
        run: |
          set -euo pipefail
          test "$(git -C compiler rev-parse HEAD)" = "$COMPILER_SHA"
          echo "Pinned A64 compiler $COMPILER_SHA" >> "$GITHUB_STEP_SUMMARY"
          git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: a64-nonflags-remat-20261124
      - name: Source-checked generated A64 GP forms
        working-directory: compiler
        run: |
          set -euo pipefail
          python3 tools/regen_aarch64_scalar_gp_forms.py --check
      - name: Pure A64 physical form, SSA use and dominance regressions
        working-directory: compiler
        run: |
          set -euo pipefail
          cargo test -p compiler-backend-aarch64 --lib machine::pure_addsub_remat_tests -- --nocapture
          cargo test -p compiler-backend-aarch64 --lib machine::dominance_remat_tests
      - name: Full A64 and shared backend compatibility
        working-directory: compiler
        run: |
          set -euo pipefail
          cargo test -p compiler-backend-aarch64 --lib
          cargo test -p compiler-backend --lib remat::
          cargo test -p compiler-backend-riscv64 --lib pure_cross_block_tests
          cargo test -p compiler-backend-x86 --lib machine::pure_immediate_chain_tests
      - name: Scoped generic backend Clippy with existing warnings excluded
        working-directory: compiler
        run: |
          set -euo pipefail
          cargo clippy -p compiler-backend --lib -- \
            -D warnings -A clippy::needless_lifetimes -A clippy::too_many_arguments
      - name: Publish source-pinned compiler-ci result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          OUTCOME: ${{ job.status }}
        run: |
          case "$OUTCOME" in
            success) state=success ;;
            cancelled) state=error ;;
            *) state=failure ;;
          esac
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state="$state" -f context="compiler/a64-pure-remat" \
            -f description="Pinned ${COMPILER_SHA:0:12} A64 pure remat $OUTCOME" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
