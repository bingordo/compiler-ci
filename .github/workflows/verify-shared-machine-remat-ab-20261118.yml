name: AArch64 native source pure ADD SUB remat GCC oracle
on:
  push:
    branches: [validation/a64-pure-remat-native-20261124]
    paths: ['.github/workflows/verify-shared-machine-remat-ab-20261118.yml']
permissions:
  contents: read
  statuses: write
jobs:
  native:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 70
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
      COMPILER_SHA: 'ac27cbd4b987b1223064132b583134b9248b84e6'
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 'ac27cbd4b987b1223064132b583134b9248b84e6'
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Pin exact compiler SHA and native host
        run: |
          set -euo pipefail
          test "$(git -C compiler rev-parse HEAD)" = "$COMPILER_SHA"
          uname -m | grep -Eq 'aarch64|arm64'
          echo "Native A64 source SHA $COMPILER_SHA" >> "$GITHUB_STEP_SUMMARY"
          gcc --version | head -n1
          git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: a64-pure-remat-native-20261124
      - name: Checked reviewed ISA words and generic remat regression
        working-directory: compiler
        run: |
          set -euo pipefail
          python3 tools/regen_aarch64_scalar_gp_forms.py --check
          cargo test -p compiler-backend-aarch64 --lib machine::pure_addsub_remat_tests -- --nocapture
      - name: Real AArch64 production source native ELF and GAS C11 execution
        working-directory: compiler
        run: |
          set -euo pipefail
          cargo test -p compiler --test aarch64_pure_addsub_remat_native -- --nocapture
      - name: Publish pinned native A64 result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          OUTCOME: ${{ job.status }}
        run: |
          case "$OUTCOME" in
            success) state=success ;;
            cancelled) state=error ;;
            *) state=failure ;;
          esac
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state="$state" -f context="compiler/a64-pure-remat-native" \
            -f description="Pinned ${COMPILER_SHA:0:12} native A64 pure remat $OUTCOME" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
