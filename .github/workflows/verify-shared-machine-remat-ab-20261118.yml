name: native ARM source before after A64 pure remat ELF measurement
on:
  push:
    branches: [benchmark/a64-pure-addsub-source-ab-20261124]
    paths: ['.github/workflows/verify-shared-machine-remat-ab-20261118.yml']
permissions:
  contents: read
  statuses: write
jobs:
  source-ab:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 95
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
      BASE_SHA: 'de2411621718803b02a45ac612cb4587d5d7f391'
      CAND_SHA: 'ac27cbd4b987b1223064132b583134b9248b84e6'
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 'de2411621718803b02a45ac612cb4587d5d7f391'
          path: old
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 'ac27cbd4b987b1223064132b583134b9248b84e6'
          path: new
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Confirm exact source pins and extract an identical C oracle
        run: |
          set -euo pipefail
          test "$(git -C old rev-parse HEAD)" = "$BASE_SHA"
          test "$(git -C new rev-parse HEAD)" = "$CAND_SHA"
          uname -m | grep -Eq 'aarch64|arm64'
          git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
          mkdir -p bench
          python3 - <<'PY'
          from pathlib import Path
          test=Path('new/crates/driver/tests/aarch64_pure_addsub_remat_native.rs').read_text()
          for name,output in [('SOURCE','src.c'),('ORACLE','oracle.c')]:
              token='const '+name+':&str=r#"'
              assert test.count(token)==1
              Path('bench/'+output).write_text(test.split(token,1)[1].split('"#;',1)[0])
          PY
          echo "A64 before $BASE_SHA after $CAND_SHA" >> "$GITHUB_STEP_SUMMARY"
          sha256sum bench/src.c bench/oracle.c
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            old -> target
            new -> target
          key: a64-pure-remat-native-physical-ab-20261124
      - name: Build both pinned compilers and validate both native objects against GCC
        run: |
          set -euo pipefail
          for variant in old new; do
            cargo build -p compiler --bin compiler --manifest-path "$variant/Cargo.toml"
            "$variant/target/debug/compiler" bench/src.c \
              --language mini-c --target aarch64 --emit obj \
              -o "bench/$variant.o"
            gcc -std=c11 -O2 -Wall -Wextra -Werror bench/oracle.c \
              "bench/$variant.o" -o "bench/$variant.exe"
            "bench/$variant.exe"
            objcopy -O binary --only-section=.text \
              "bench/$variant.o" "bench/$variant.text"
            objdump -d --no-show-raw-insn "bench/$variant.o" > "bench/$variant.dis"
          done
      - name: Report observed ARM64 .text bytes and function instruction counts
        run: |
          python3 - <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          from pathlib import Path
          import re
          functions=('mixed_add_sub','mixed_sub_add','mixed_sub_sub','mixed_branch')
          data={}
          for variant in ('old','new'):
              text=Path(f'bench/{variant}.text').read_bytes()
              counts={};function=None
              for line in Path(f'bench/{variant}.dis').read_text().splitlines():
                  header=re.match(r'^[0-9a-f]+ <([^>]+)>:$',line.strip())
                  if header:
                      function=header.group(1);counts.setdefault(function,0)
                      continue
                  if function and re.match(r'^\s*[0-9a-f]+:\s+[A-Za-z]',line):
                      counts[function]+=1
              for f in functions: assert f in counts,(variant,f,counts)
              data[variant]=(len(text),counts)
              print(f'{variant} real A64 ELF .text bytes={len(text)}')
              for f in functions:print(f'{variant} {f} instructions={counts[f]}')
          print('physical .text delta=',data['new'][0]-data['old'][0])
          for f in functions:
              print('instruction delta',f,
                    data['new'][1][f]-data['old'][1][f])
          print('No timing or broad performance claims; both objects passed a GCC C11 oracle.')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: a64-pure-remat-native-source-ab-objects
          path: bench/
      - name: Publish pinned before after result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          OUTCOME: ${{ job.status }}
        run: |
          case "$OUTCOME" in
            success) state=success ;;
            cancelled) state=error ;;
            *) state=failure ;;
          esac
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state="$state" -f context="compiler/a64-pure-remat-source-ab" \
            -f description="Pinned A64 old ${BASE_SHA:0:12} new ${CAND_SHA:0:12}: $OUTCOME" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
