name: Pinned AArch64 physical trace CFG source ABBA
on:
  push:
    branches: [benchmark/a64-trace-layout-20261125]
    paths: ['.github/workflows/verify-shared-machine-remat-ab-20261118.yml']
permissions:
  contents: read
  statuses: write
jobs:
  native:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 95
    env:
      OLD_SHA: 'ccf20e941a9f1622c84210009cd1e0b47530a021'
      NEW_SHA: '7ea54c0f00ff003993898f9489693b9a9e85d71f'
      CARGO_INCREMENTAL: '0'
      CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 'ccf20e941a9f1622c84210009cd1e0b47530a021'
          path: old
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: '7ea54c0f00ff003993898f9489693b9a9e85d71f'
          path: new
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Verify pinned code and independently identical test source
        run: |
          set -euo pipefail
          test "$(git -C old rev-parse HEAD)" = "$OLD_SHA"
          test "$(git -C new rev-parse HEAD)" = "$NEW_SHA"
          uname -m | grep -Eq 'aarch64|arm64'
          git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
          cmp old/tests/fixtures/remat/aarch64_loop_pressure.c new/tests/fixtures/remat/aarch64_loop_pressure.c
          cmp old/tests/fixtures/remat/aarch64_loop_pressure_oracle.c new/tests/fixtures/remat/aarch64_loop_pressure_oracle.c
          mkdir -p results
          cp new/tests/fixtures/remat/aarch64_loop_pressure.c results/source.c
          cp new/tests/fixtures/remat/aarch64_loop_pressure_oracle.c results/oracle.c
          sha256sum results/source.c results/oracle.c
          printf 'A64 physical CFG layout: baseline `%s`, candidate `%s`\n' "$OLD_SHA" "$NEW_SHA" >> "$GITHUB_STEP_SUMMARY"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            old -> target
            new -> target
          key: a64-physical-cfg-trace-20261125
      - name: Build exact compiler revisions and independently validate both ELF/GAS encodings
        run: |
          set -euo pipefail
          for rev in old new; do
            cargo build -p compiler --bin compiler --manifest-path "$rev/Cargo.toml"
            "$rev/target/debug/compiler" results/source.c --language mini-c --target aarch64 --emit obj -o "results/$rev.o"
            "$rev/target/debug/compiler" results/source.c --language mini-c --target aarch64 --emit asm -o "results/$rev.s"
            gcc -c "results/$rev.s" -o "results/$rev-gas.o"
            for variant in "$rev" "$rev-gas"; do
              gcc -std=c11 -O2 -Wall -Wextra -Werror results/oracle.c "results/$variant.o" -o "results/$variant.exe"
              "results/$variant.exe"
            done
            objcopy -O binary --only-section=.text "results/$rev.o" "results/$rev.text"
            objcopy -O binary --only-section=.text "results/$rev-gas.o" "results/$rev-gas.text"
            cmp "results/$rev.text" "results/$rev-gas.text"
            objdump -d --no-show-raw-insn "results/$rev.o" > "results/$rev.dis"
          done
      - name: Physical code-size, branch and per-function counts
        run: |
          python3 - <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          import re
          from pathlib import Path
          data={}
          names=('chain_loop','branch_loop','pressure_loop','call_pressure_loop')
          for rev in ('old','new'):
              text=Path(f'results/{rev}.text').read_bytes()
              assert text and len(text)%4==0
              words=[int.from_bytes(text[i:i+4],'little') for i in range(0,len(text),4)]
              b=sum(w&0xfc000000==0x14000000 for w in words)
              counts={};function=None
              for line in Path(f'results/{rev}.dis').read_text().splitlines():
                  m=re.match(r'^\s*[0-9a-f]+ <([^>]+)>:$',line)
                  if m:
                      function=m.group(1);counts[function]=0
                  elif function and re.match(r'^\s*[0-9a-f]+:\s+[A-Za-z]',line):
                      counts[function]+=1
              assert all(n in counts for n in names)
              data[rev]=(len(text),b,counts)
              print(f'{rev} real A64 .text bytes={len(text)} words={len(words)} unconditional_B={b}')
              for name in names:print(f'{rev} {name} instructions={counts[name]}')
          a,b=data['old'],data['new']
          print(f'DELTA total_bytes={b[0]-a[0]} total_unconditional_B={b[1]-a[1]}')
          for name in names: print(f'DELTA {name} instructions={b[2][name]-a[2][name]}')
          print('Native direct/GAS ELF verified byte-identical, all original and reordered variants pass independent C11 oracle.')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: a64-physical-trace-cfg-pinned-ab
          path: results/
      - name: Publish pinned A64 source AB status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          OUTCOME: ${{ job.status }}
        run: |
          case "$OUTCOME" in success) state=success;; cancelled) state=error;; *) state=failure;; esac
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state="$state" -f context="compiler/a64-physical-trace-ab" \
            -f description="Pinned source ABI/CFG text A/B $OUTCOME" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
