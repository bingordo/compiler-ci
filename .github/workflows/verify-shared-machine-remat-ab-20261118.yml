name: A64 real source edge profile replay GCC ELF GAS
on:
  push:
    branches: [validation/a64-source-edge-replay-20261126]
    paths: ['.github/workflows/verify-shared-machine-remat-ab-20261118.yml']
permissions:
  contents: read
  statuses: write
jobs:
  native:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 70
    env:
      COMPILER_SHA: 'fc4babe1a81785818a187a56be7566d2f2c6eb7a'
      CARGO_INCREMENTAL: '0'
      CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 'fc4babe1a81785818a187a56be7566d2f2c6eb7a'
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Exact source and native A64
        run: |
          set -euo pipefail
          test "$(git -C compiler rev-parse HEAD)" = "$COMPILER_SHA"
          uname -m | grep -Eq 'aarch64|arm64'
          git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
          echo "Native A64 physical layout SHA `$COMPILER_SHA`" >> "$GITHUB_STEP_SUMMARY"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: a64-real-edge-source-replay-native-20261126
      - name: Full A64 machine library, trace schedule, unwind and edge polarity tests
        working-directory: compiler
        run: |
          set -euo pipefail
          cargo test -p compiler-backend-aarch64 --lib -- --nocapture
          python3 tools/regen_aarch64_scalar_gp_forms.py --check
      - name: Native production source GCC C11 independent ELF/GAS oracle
        working-directory: compiler
        run: |
          set -euo pipefail
          cargo test -p compiler --test aarch64_nested_control_flow_native -- --nocapture
          cargo test -p compiler --test aarch64_remat_loop_pressure_native -- --nocapture
          cargo test -p compiler --test aarch64_pure_addsub_remat_native -- --nocapture
          cargo test -p compiler --test native_lp64_aarch64_dynamic_memset -- --nocapture
      - name: Native A64 real executable edge counter collection and GCC oracle
        working-directory: compiler
        run: |
          set -euo pipefail
          cargo test -p compiler --test aarch64_edge_pgo_native -- --ignored --nocapture
      - name: Publish pin status to compiler-ci source
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          OUTCOME: ${{ job.status }}
        run: |
          case "$OUTCOME" in success) state=success;; cancelled) state=error;; *) state=failure;; esac
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state="$state" -f context="compiler/a64-real-source-replay-native" \
            -f description="Exact A64 physical layout ${COMPILER_SHA:0:12}: $OUTCOME" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
