name: A64 before after adjacent fallthrough and branch layout A/B
on:
  push:
    branches: [benchmark/a64-cfg-fallthrough-20261125]
    paths: ['.github/workflows/verify-shared-machine-remat-ab-20261118.yml']
permissions:
  contents: read
  statuses: write
jobs:
  measure:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 110
    env:
      BASE_SHA: 'ffc786011c594502dbd03fb6e5679f34af395521'
      CAND_SHA: '14c1d29e660fef26809fb001414f4829314bf38e'
      CARGO_INCREMENTAL: '0'
      CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 'ffc786011c594502dbd03fb6e5679f34af395521'
          path: old
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: '14c1d29e660fef26809fb001414f4829314bf38e'
          path: new
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Exact source and compiler pins
        run: |
          set -euo pipefail
          test "$(git -C old rev-parse HEAD)" = "$BASE_SHA"
          test "$(git -C new rev-parse HEAD)" = "$CAND_SHA"
          uname -m | grep -Eq 'aarch64|arm64'
          mkdir -p bench
          cmp old/tests/fixtures/remat/aarch64_loop_pressure.c new/tests/fixtures/remat/aarch64_loop_pressure.c
          cmp old/tests/fixtures/remat/aarch64_loop_pressure_oracle.c new/tests/fixtures/remat/aarch64_loop_pressure_oracle.c
          cp new/tests/fixtures/remat/aarch64_loop_pressure.c bench/source.c
          cp new/tests/fixtures/remat/aarch64_loop_pressure_oracle.c bench/oracle.c
          sha256sum bench/source.c bench/oracle.c
          git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
          printf 'A64 branch fallthrough A/B: old `%s`, new `%s`\n' "$BASE_SHA" "$CAND_SHA" >> "$GITHUB_STEP_SUMMARY"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            old -> target
            new -> target
          key: a64-cfg-adjacent-fallthrough-native-abba-20261125
      - name: Build source pinned release compilers and check physical object correctness
        run: |
          set -euo pipefail
          for rev in old new; do
            cargo build --release -p compiler --bin compiler --manifest-path "$rev/Cargo.toml"
            "$rev/target/release/compiler" bench/source.c \
              --language mini-c --target aarch64 --emit obj -o "bench/$rev.o"
            "$rev/target/release/compiler" bench/source.c \
              --language mini-c --target aarch64 --emit asm -o "bench/$rev.s"
            gcc -c "bench/$rev.s" -o "bench/$rev-gas.o"
            objcopy -O binary --only-section=.text "bench/$rev.o" "bench/$rev.text"
            objcopy -O binary --only-section=.text "bench/$rev-gas.o" "bench/$rev-gas.text"
            cmp "bench/$rev.text" "bench/$rev-gas.text"
            objdump -d --no-show-raw-insn "bench/$rev.o" > "bench/$rev.dis"
            gcc -std=c11 -O2 -Wall -Wextra -Werror bench/oracle.c "bench/$rev.o" -o "bench/$rev.oracle"
            "bench/$rev.oracle" | tee "bench/$rev.oracle.log"
          done
      - name: Build four controlled alignment variants per revision with independent C11 validation
        run: |
          set -euo pipefail
          cat > bench/measure.c <<'EOF'
          #define _POSIX_C_SOURCE 200809L
          #include <stdint.h>
          #include <stdio.h>
          #include <stdlib.h>
          #include <time.h>
          extern unsigned int branch_loop(unsigned int,unsigned int);
          /* Required even though only branch_loop is timed: the object also
           * defines call_pressure_loop with an unresolved external call. */
          __attribute__((noinline))
          unsigned int external_mix(unsigned int value,unsigned int i){
              return (value ^ (i * 0x9e3779b9u)) + 37u;
          }
          int main(void){
              volatile unsigned int check=0;
              struct timespec t;
              unsigned long long start,end;
              if(clock_gettime(CLOCK_MONOTONIC_RAW,&t))return 3;
              start=(unsigned long long)t.tv_sec*1000000000ull+t.tv_nsec;
              for(unsigned int i=0;i<110u;i++)
                  check=check+branch_loop(0x12345678u + i*13u,120000u);
              if(clock_gettime(CLOCK_MONOTONIC_RAW,&t))return 4;
              end=(unsigned long long)t.tv_sec*1000000000ull+t.tv_nsec;
              printf("%llu %u\n",end-start,check);
              return 0;
          }
          EOF
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          for rev in ('old','new'):
              source=Path(f'bench/{rev}.s').read_text()
              anchor='branch_loop:\n'
              assert source.count(anchor)==1,(rev,source.find('branch_loop'))
              for extra in (0,4,8,16,24,32,48):
                  # Change ONLY the address alignment of the entire function,
                  # not any internal PC-relative A64 .inst displacement.
                  pad=('    .p2align 6\n'
                       +''.join('    nop\n' for _ in range(extra//4)))
                  variant=source.replace(anchor,pad+anchor)
                  Path(f'bench/{rev}-{extra}.s').write_text(variant)
                  obj=f'bench/{rev}-{extra}.o'
                  subprocess.run(['gcc','-c',f'bench/{rev}-{extra}.s','-o',obj],check=True)
                  subprocess.run(['gcc','-std=c11','-O2','-Wall','-Wextra',
                      '-Werror','bench/oracle.c',obj,'-o',f'bench/{rev}-{extra}.oracle'],check=True)
                  check=subprocess.run([f'bench/{rev}-{extra}.oracle'],
                                       capture_output=True,text=True,check=True)
                  assert 'A64_LOOP_PRESSURE_C11_ORACLE_OK' in check.stdout
                  subprocess.run(['gcc','-std=c11','-O2','-Wall','-Wextra',
                      '-Werror','-fno-lto','bench/measure.c',obj,
                      '-o',f'bench/{rev}-{extra}.bench'],check=True)
          PY
      - name: Summarize native text, branch bytes and randomized-layout ABBA medians
        run: |
          python3 - <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          import os,re,statistics,subprocess
          from pathlib import Path
          allowed=os.sched_getaffinity(0);cpu=min(allowed)
          os.sched_setaffinity(0,{cpu})
          print('Native ARM64 pinned CPU=',cpu)
          names=('chain_loop','branch_loop','pressure_loop','call_pressure_loop')
          counts_by_rev={}
          for rev in ('old','new'):
              code=Path(f'bench/{rev}.text').read_bytes()
              counts={};function=None
              for line in Path(f'bench/{rev}.dis').read_text().splitlines():
                  m=re.match(r'^[0-9a-f]+ <([^>]+)>:$',line.strip())
                  if m:
                      function=m.group(1);counts.setdefault(function,0)
                  elif function and re.match(r'^\s*[0-9a-f]+:\s+[A-Za-z]',line):
                      counts[function]+=1
              assert all(n in counts for n in names)
              counts_by_rev[rev]=counts
              print(f'{rev} physical text bytes={len(code)}')
              for name in names:
                  print(f'{rev} {name} instructions={counts[name]}')
          print('physical total byte change=',len(Path('bench/new.text').read_bytes())-len(Path('bench/old.text').read_bytes()))
          for name in names:
              print(f'{name} instruction delta={counts_by_rev["new"][name]-counts_by_rev["old"][name]}')
          print('All direct/GAS objects and all padded variants pass independent GCC C11 oracle.')
          # Fixed code layout changes should not modify behavior, but can
          # expose alignment/branch-predictor sensitivity of a small loop.
          for pad in (0,4,8,16,24,32,48):
              sample={'old':[],'new':[]}
              checks={'old':set(),'new':set()}
              for rev in ('old','new'):
                  subprocess.run([f'bench/{rev}-{pad}.bench'],check=True,
                      capture_output=True,text=True)
              for rev in ('old','new','new','old','new','old','old','new')*2:
                  s=subprocess.run([f'bench/{rev}-{pad}.bench'],check=True,
                      capture_output=True,text=True).stdout.strip().split()
                  assert len(s)==2
                  sample[rev].append(int(s[0]))
                  checks[rev].add(int(s[1]))
              assert len(checks['old'])==len(checks['new'])==1
              assert checks['old']==checks['new'],(pad,checks)
              a=statistics.median(sample['old']);b=statistics.median(sample['new'])
              print(f'LAYOUT-{pad} old={a:.0f} ns new={b:.0f} ns delta={100*(b/a-1):+.2f}%')
              print(f'LAYOUT-{pad} all samples old={sample["old"]} new={sample["new"]}')
          print('Branch timing is noisy and layout-dependent. No regression pin or general speedup claim.')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: a64-cfg-fallthrough-layout-abba
          path: bench/
      - name: Publish source pinned A64 measured status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          OUTCOME: ${{ job.status }}
        run: |
          case "$OUTCOME" in
            success) state=success ;;
            cancelled) state=error ;;
            *) state=failure ;;
          esac
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state="$state" -f context="compiler/a64-fallthrough-layout-abba" \
            -f description="Pinned branch layout A/B $OUTCOME" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
