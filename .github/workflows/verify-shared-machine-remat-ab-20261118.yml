name: candidate generic remat crate scoped lint
on:
  push:
    branches: [validation/remat-cost-20261124]
    paths: ['.github/workflows/verify-shared-machine-remat-ab-20261118.yml']
permissions:
  contents: read
  statuses: write
jobs:
  remat-planner-validation:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
      COMPILER_SHA: '2a3225642d9aecaf9243bc23f3a15e1371ee4262'
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: '2a3225642d9aecaf9243bc23f3a15e1371ee4262'
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Verify exact compiler candidate SHA
        run: |
          set -euo pipefail
          actual="$(git -C compiler rev-parse HEAD)"
          test "$actual" = "$COMPILER_SHA"
          echo "Tested compiler SHA: $actual" >> "$GITHUB_STEP_SUMMARY"
          git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: remat-planner-cost-20261124
      - name: Strict generic remat crate Clippy with two existing ABI lint exceptions
        working-directory: compiler
        run: |
          set -euo pipefail
          # The change is entirely inside compiler-backend. Existing
          # unrelated ABI files trigger these two warning categories.
          cargo clippy -p compiler-backend --lib -- \
            -D warnings \
            -A clippy::needless_lifetimes \
            -A clippy::too_many_arguments
      - name: Publish validation status on compiler-ci commit
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_OUTCOME: ${{ job.status }}
        run: |
          set -euo pipefail
          case "$JOB_OUTCOME" in
            success) state=success ;;
            cancelled) state=error ;;
            *) state=failure ;;
          esac
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state="$state" \
            -f context="compiler/remat-generic-lint" \
            -f description="Exact-source ${COMPILER_SHA:0:12} generic remat crate lint (2 ABI exceptions): $JOB_OUTCOME" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
