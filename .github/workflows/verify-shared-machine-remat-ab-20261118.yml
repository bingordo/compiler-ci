name: A64 native loop pressure remat source and GCC oracle
on:
  push:
    branches: [validation/a64-loop-pressure-source-20261125]
    paths: ['.github/workflows/verify-shared-machine-remat-ab-20261118.yml']
permissions:
  contents: read
  statuses: write
jobs:
  source:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 65
    env:
      COMPILER_SHA: '37024a3bd30f9ac0dd254c3bd83c23a59b347654'
      CARGO_INCREMENTAL: '0'
      CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: '37024a3bd30f9ac0dd254c3bd83c23a59b347654'
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Exact compiler SHA and architecture
        run: |
          set -euo pipefail
          test "$(git -C compiler rev-parse HEAD)" = "$COMPILER_SHA"
          uname -m | grep -Eq 'aarch64|arm64'
          git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
          printf 'Native A64 loop corpus source pin: %s\n' "$COMPILER_SHA" >> "$GITHUB_STEP_SUMMARY"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: a64-loop-pressure-native-c11-20261125
      - name: Execute independent C11 source oracle with ELF and GAS
        working-directory: compiler
        run: |
          set -euo pipefail
          cargo test -p compiler --test aarch64_remat_loop_pressure_native -- --nocapture
      - name: Retain native A64 remat and source baseline
        working-directory: compiler
        run: |
          set -euo pipefail
          cargo test -p compiler-backend-aarch64 --lib machine::pure_addsub_remat_tests
          cargo test -p compiler --test aarch64_pure_addsub_remat_native -- --nocapture
          python3 tools/regen_aarch64_scalar_gp_forms.py --check
      - name: Publish exact-source result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          OUTCOME: ${{ job.status }}
        run: |
          case "$OUTCOME" in
            success) state=success ;;
            cancelled) state=error ;;
            *) state=failure ;;
          esac
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state="$state" -f context="compiler/a64-loop-pressure-c11" \
            -f description="Pinned ${COMPILER_SHA:0:12} source loops $OUTCOME" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
