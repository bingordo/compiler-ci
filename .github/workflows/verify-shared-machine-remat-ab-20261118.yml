name: pinned source ABBA x86 pure chain remat 3080
on:
  push:
    branches: [benchmark/x86-pure-chain-remat-3080-20261124]
    paths: ['.github/workflows/verify-shared-machine-remat-ab-20261118.yml']
permissions:
  contents: read
  statuses: write
jobs:
  abba:
    runs-on: ubuntu-24.04
    timeout-minutes: 85
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
      BASE_SHA: 'a61096f79b690a742688cec7e3e7f1222fc9a9f7'
      CAND_SHA: '06769ca4740a1108650f20151759e64a0a6f7bcf'
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 'a61096f79b690a742688cec7e3e7f1222fc9a9f7'
          path: old
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: '06769ca4740a1108650f20151759e64a0a6f7bcf'
          path: new
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Prove source pins and identical benchmark input
        run: |
          set -euo pipefail
          test "$(git -C old rev-parse HEAD)" = "$BASE_SHA"
          test "$(git -C new rev-parse HEAD)" = "$CAND_SHA"
          test "$(git -C old show HEAD:crates/driver/tests/x86_source_runtime_performance.rs | sha256sum)" = "$(git -C new show HEAD:crates/driver/tests/x86_source_runtime_performance.rs | sha256sum)"
          test "$(git -C old show HEAD:tests/fixtures/inliner/rolling_checksum.c | sha256sum)" = "$(git -C new show HEAD:tests/fixtures/inliner/rolling_checksum.c | sha256sum)"
          echo "BASE=$BASE_SHA CAND=$CAND_SHA" | tee -a "$GITHUB_STEP_SUMMARY"
          lscpu | grep -E '^Model name:|^Architecture:|^CPU\\(s\\):' || true
          grep Cpus_allowed_list /proc/self/status
          git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            old -> target
            new -> target
          key: x86-pure-chain-abba-3080
      - name: Match full fixture and prepare source-pinned release test
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          rel=Path('crates/driver/tests/x86_source_runtime_performance.rs')
          base=(Path('old')/rel).read_bytes()
          candidate=(Path('new')/rel).read_bytes()
          assert base==candidate,'benchmark file drift'
          needle=b'REPS=7, ITERS=1800'
          assert base.count(needle)==1
          for root in ('old','new'):
              (Path(root)/rel).write_bytes(base.replace(needle,b'REPS=7, ITERS=18000'))
          PY
          for d in old new; do
            (cd "$d" && cargo test --release -p compiler --test x86_source_runtime_performance --no-run)
          done
      - name: Same pinned CPU ABBA x2 with independent GCC checksums and physical counts
        run: |
          set -euo pipefail
          cpu=$(awk '/^Cpus_allowed_list:/ {split($2,a,/[-,]/);print a[1]}' /proc/self/status)
          test -n "$cpu"
          i=0
          for variant in old new new old old new new old; do
            i=$((i+1))
            logfile="$RUNNER_TEMP/ab-$i-$variant.log"
            (cd "$variant" && taskset -c "$cpu" cargo test --release -p compiler --test x86_source_runtime_performance -- --ignored --nocapture) 2>&1 | tee "$logfile"
            grep -q 'X86_RUNTIME_FUNCTION mode=mini_default symbol=scan>' "$logfile"
            grep -q 'X86_SOURCE_RUNTIME mode=mini_default workload=combined ' "$logfile"
            grep -q 'X86_SOURCE_RUNTIME mode=gcc_O2 workload=combined ' "$logfile"
          done
          python3 - "$RUNNER_TEMP" <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          from pathlib import Path
          import sys,statistics
          root=Path(sys.argv[1]); results=[]
          for idx in range(1,9):
              variant='old' if idx in (1,4,5,8) else 'new'
              data=(root/f'ab-{idx}-{variant}.log').read_text(errors='replace')
              def last(prefix):
                  lines=[x for x in data.splitlines() if prefix in x]
                  assert lines,(variant,idx,prefix)
                  return dict(token.split('=',1) for token in lines[-1].split() if '=' in token)
              mini=last('X86_SOURCE_RUNTIME mode=mini_default workload=combined ')
              gcc=last('X86_SOURCE_RUNTIME mode=gcc_O2 workload=combined ')
              scan=last('X86_RUNTIME_FUNCTION mode=mini_default symbol=scan>')
              assert mini['checksum']==gcc['checksum']
              row=(variant,int(mini['median_ns']),int(gcc['median_ns']),scan)
              results.append(row)
              print(f"{idx} {variant}: native_ns={row[1]} gcc_ns={row[2]} scan_instr={scan['instructions']} moves={scan['moves']} stack_mem={scan['stack_memory']}")
          for variant in ('old','new'):
              values=[r[1] for r in results if r[0]==variant]
              print(f'{variant} average_median_ns={statistics.mean(values):.1f}, median_median_ns={statistics.median(values):.1f}')
              scans=[r[3] for r in results if r[0]==variant]
              assert all(x==scans[0] for x in scans),'unstable machine code in source pin'
          before=next(x[3] for x in results if x[0]=='old')
          after=next(x[3] for x in results if x[0]=='new')
          for field in ('instructions','moves','stack_memory'):
              delta=int(after[field])-int(before[field])
              print(f'scan {field}: {before[field]} -> {after[field]} (delta {delta:+d})')
          print('Unstable shared-runner timings are descriptive only; no regression thresholds.')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: x86-pure-chain-remat-3080-abba-logs
          path: ${{ runner.temp }}/ab-*.log
          if-no-files-found: ignore
      - name: Publish exact-source ABBA result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          OUTCOME: ${{ job.status }}
        run: |
          case "$OUTCOME" in
            success) state=success ;;
            cancelled) state=error ;;
            *) state=failure ;;
          esac
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state="$state" \
            -f context="compiler/x86-pure-chain-abba" \
            -f description="ABBA baseline ${BASE_SHA:0:12} new ${CAND_SHA:0:12}: $OUTCOME" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
