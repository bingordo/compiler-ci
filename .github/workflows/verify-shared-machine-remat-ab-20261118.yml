name: Native AArch64 true-adjacent conditional polarity A/B source
on:
  push:
    branches: [benchmark/a64-true-fallthrough-20261125]
    paths: ['.github/workflows/verify-shared-machine-remat-ab-20261118.yml']
permissions:
  contents: read
  statuses: write
jobs:
  native:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    env:
      BASE_SHA: 'ad48a07ed6c7b324de156e09250d348fb234a3aa'
      CAND_SHA: 'fd16a772916dba7031ee9d50ceb191114f2ec792'
      CARGO_INCREMENTAL: '0'
      CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 'ad48a07ed6c7b324de156e09250d348fb234a3aa'
          path: old
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 'fd16a772916dba7031ee9d50ceb191114f2ec792'
          path: new
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Exact pins and unchanged source fixtures
        run: |
          set -euo pipefail
          test "$(git -C old rev-parse HEAD)" = "$BASE_SHA"
          test "$(git -C new rev-parse HEAD)" = "$CAND_SHA"
          uname -m | grep -Eq 'aarch64|arm64'
          git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
          cmp old/tests/fixtures/remat/aarch64_loop_pressure.c new/tests/fixtures/remat/aarch64_loop_pressure.c
          cmp old/tests/fixtures/remat/aarch64_loop_pressure_oracle.c new/tests/fixtures/remat/aarch64_loop_pressure_oracle.c
          mkdir -p results
          cp new/tests/fixtures/remat/aarch64_loop_pressure.c results/source.c
          cp new/tests/fixtures/remat/aarch64_loop_pressure_oracle.c results/oracle.c
          sha256sum results/source.c results/oracle.c
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            old -> target
            new -> target
          key: a64-adjacent-true-source-diff-20261125
      - name: Build both pinned native compiler executables and link independent C11 oracles
        run: |
          set -euo pipefail
          for rev in old new; do
            cargo build -p compiler --bin compiler --manifest-path "$rev/Cargo.toml"
            "$rev/target/debug/compiler" results/source.c --language mini-c --target aarch64 --emit obj -o "results/$rev.o"
            "$rev/target/debug/compiler" results/source.c --language mini-c --target aarch64 --emit asm -o "results/$rev.s"
            gcc -c "results/$rev.s" -o "results/$rev-gas.o"
            objcopy -O binary --only-section=.text "results/$rev.o" "results/$rev.text"
            objcopy -O binary --only-section=.text "results/$rev-gas.o" "results/$rev-gas.text"
            cmp "results/$rev.text" "results/$rev-gas.text"
            objdump -d --no-show-raw-insn "results/$rev.o" > "results/$rev.dis"
            for variant in "$rev" "$rev-gas"; do
              gcc -std=c11 -O2 -Wall -Wextra -Werror \
                  results/oracle.c "results/$variant.o" -o "results/$variant.exe"
              "results/$variant.exe"
            done
          done
      - name: Count exact physical ARM64 words including unconditional B, and per-function size
        run: |
          python3 - <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          from pathlib import Path
          import re
          instructions={}
          for rev in ('old','new'):
              data=Path(f'results/{rev}.text').read_bytes()
              assert len(data)%4==0 and data
              words=[int.from_bytes(data[i:i+4],'little') for i in range(0,len(data),4)]
              physical_b=sum(1 for w in words if w&0xfc000000==0x14000000)
              print(f'{rev} total_text_bytes={len(data)} total_A64_words={len(words)} unconditional_B={physical_b}')
              per={};current=None
              for line in Path(f'results/{rev}.dis').read_text().splitlines():
                  m=re.match(r'^\s*[0-9a-f]+ <([^>]+)>:$',line)
                  if m:
                      current=m.group(1);per[current]=0
                  elif current and re.match(r'^\s*[0-9a-f]+:\s+[A-Za-z]',line):
                      per[current]+=1
              instructions[rev]=(len(data),physical_b,per)
              for fn in ('chain_loop','branch_loop','pressure_loop','call_pressure_loop'):
                  assert fn in per
                  print(f'{rev} {fn} A64_words={per[fn]}')
          a=instructions['old'];b=instructions['new']
          assert b[0]<=a[0],f'no expected extra branches in corpus: {a[0]} -> {b[0]}'
          print(f'Physical byte delta={b[0]-a[0]} unconditional-B delta={b[1]-a[1]}')
          for fn in ('chain_loop','branch_loop','pressure_loop','call_pressure_loop'):
              print(f'Physical {fn} delta={b[2][fn]-a[2][fn]}')
          print('A/B source unchanged; direct ELF/GAS match on both; native independent C11 oracle passed four times.')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: a64-true-adjacent-branch-native-source-ab
          path: results/
      - name: Publish SHA-pinned validation
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          OUTCOME: ${{ job.status }}
        run: |
          case "$OUTCOME" in success) state=success;; cancelled) state=error;; *) state=failure;; esac
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state="$state" -f context="compiler/a64-true-adjacent-ab" \
            -f description="Exact native A64 conditional source A/B $OUTCOME" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
