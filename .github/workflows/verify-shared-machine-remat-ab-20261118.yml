name: A64 true-adjacent conditional branch and PHI oracle
on:
  push:
    branches: [validation/a64-true-fallthrough-20261125]
    paths: ['.github/workflows/verify-shared-machine-remat-ab-20261118.yml']
permissions:
  contents: read
  statuses: write
jobs:
  native:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 65
    env:
      COMPILER_SHA: 'fd16a772916dba7031ee9d50ceb191114f2ec792'
      CARGO_INCREMENTAL: '0'
      CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 'fd16a772916dba7031ee9d50ceb191114f2ec792'
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Exact compiler pin and actual native ARM64
        run: |
          set -euo pipefail
          test "$(git -C compiler rev-parse HEAD)" = "$COMPILER_SHA"
          uname -m | grep -Eq 'aarch64|arm64'
          git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
          echo "AArch64 true-adjacent conditional pin $COMPILER_SHA" >> "$GITHUB_STEP_SUMMARY"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: a64-true-fallthrough-phi-native-20261125
      - name: Full native AArch64 backend library and reviewed generated forms
        working-directory: compiler
        run: |
          set -euo pipefail
          cargo test -p compiler-backend-aarch64 --lib -- --nocapture
          python3 tools/regen_aarch64_scalar_gp_forms.py --check
      - name: Native Linux ARM64 full production source through ELF/GAS GCC oracle
        working-directory: compiler
        run: |
          set -euo pipefail
          cargo test -p compiler --test aarch64_remat_loop_pressure_native -- --nocapture
          cargo test -p compiler --test aarch64_pure_addsub_remat_native -- --nocapture
          cargo test -p compiler --test native_lp64_aarch64_dynamic_memset -- --nocapture
      - name: Publish pinned compiler CI outcome
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          OUTCOME: ${{ job.status }}
        run: |
          case "$OUTCOME" in success) state=success;; cancelled) state=error;; *) state=failure;; esac
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state="$state" -f context="compiler/a64-true-adjacent-phi" \
            -f description="Pinned A64 true-edge branch + PHI $OUTCOME" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
