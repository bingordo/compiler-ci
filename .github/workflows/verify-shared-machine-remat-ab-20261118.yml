name: A64 adjacent CFG fallthrough native ELF and GAS validation
on:
  push:
    branches: [validation/a64-cfg-fallthrough-20261125]
    paths: ['.github/workflows/verify-shared-machine-remat-ab-20261118.yml']
permissions:
  contents: read
  statuses: write
jobs:
  native:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 65
    env:
      COMPILER_SHA: '14c1d29e660fef26809fb001414f4829314bf38e'
      CARGO_INCREMENTAL: '0'
      CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: '14c1d29e660fef26809fb001414f4829314bf38e'
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Verify exact commit and native AArch64
        run: |
          set -euo pipefail
          test "$(git -C compiler rev-parse HEAD)" = "$COMPILER_SHA"
          uname -m | grep -Eq 'aarch64|arm64'
          git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
          echo "Native A64 source pin: $COMPILER_SHA" >> "$GITHUB_STEP_SUMMARY"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: a64-adjacent-branch-fallthrough-20261125
      - name: All A64 machine and remat/unit regressions
        working-directory: compiler
        run: |
          set -euo pipefail
          python3 tools/regen_aarch64_scalar_gp_forms.py --check
          cargo test -p compiler-backend-aarch64 --lib
      - name: Source-level native independent C11 loops register pressure and PHI edge copies
        working-directory: compiler
        run: |
          set -euo pipefail
          cargo test -p compiler --test aarch64_remat_loop_pressure_native -- --nocapture
          cargo test -p compiler --test aarch64_pure_addsub_remat_native -- --nocapture
          cargo test -p compiler --test native_lp64_aarch64_dynamic_memset -- --nocapture
      - name: Publish source pinned compiler-ci status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          OUTCOME: ${{ job.status }}
        run: |
          case "$OUTCOME" in
            success) state=success ;;
            cancelled) state=error ;;
            *) state=failure ;;
          esac
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state="$state" -f context="compiler/a64-adjacent-fallthrough" \
            -f description="Pinned ${COMPILER_SHA:0:12} A64 fallthrough $OUTCOME" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
