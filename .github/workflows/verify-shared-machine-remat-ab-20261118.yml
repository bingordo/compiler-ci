name: exact RV64 terminator vs PHI remat census
on:
  push:
    branches: [validation/remat-exact-edge-census-20261124]
    paths: ['.github/workflows/verify-shared-machine-remat-ab-20261118.yml']
permissions:
  contents: read
  statuses: write
jobs:
  census:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
      COMPILER_SHA: '1c853628fdd514704013f312959ab48beee95803'
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: '1c853628fdd514704013f312959ab48beee95803'
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Verify exact source
        run: |
          set -euo pipefail
          test "$(git -C compiler rev-parse HEAD)" = "$COMPILER_SHA"
          echo "compiler SHA: $COMPILER_SHA" >> "$GITHUB_STEP_SUMMARY"
          git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: remat-edge-census-20261124
      - name: Generic remat planner and machine SSA tests
        working-directory: compiler
        run: |
          set -euo pipefail
          cargo test -p compiler-backend --lib remat:: -- --nocapture
          cargo test -p compiler-backend --lib machine_dominance
          cargo test -p compiler-backend --lib
      - name: RV64 exact PHI census and crossblock optimizations
        working-directory: compiler
        run: |
          set -euo pipefail
          cargo test -p compiler-backend-riscv64 --lib rv64_remat_counts_condition_and_each_phi_slot_exactly_once -- --nocapture
          cargo test -p compiler-backend-riscv64 --lib rv64_pure_jump_phi_use_has_no_phantom_terminator_site -- --nocapture
          cargo test -p compiler-backend-riscv64 --lib pure_cross_block_tests
          cargo test -p compiler-backend-riscv64 --lib
      - name: x86 and AArch64 compatibility suites
        working-directory: compiler
        run: |
          set -euo pipefail
          cargo test -p compiler-backend-x86 --lib -- \
            --skip call::tests::invalid_call_requests_do_not_partially_modify_stream \
            --skip scalar_abi::tests::reject_unpromoted_variadic_float_and_invalid_counts \
            --skip typeid_fp_staged_native_tests::typeid_fp_staged_stack_argument_abi_oracle
          cargo test -p compiler-backend-aarch64 --lib
      - name: Scoped generic backend strict Clippy with existing ABI exceptions
        working-directory: compiler
        run: |
          set -euo pipefail
          cargo clippy -p compiler-backend --lib -- \
            -D warnings -A clippy::needless_lifetimes -A clippy::too_many_arguments
      - name: Publish pinned result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          OUTCOME: ${{ job.status }}
        run: |
          case "$OUTCOME" in
            success) state=success ;;
            cancelled) state=error ;;
            *) state=failure ;;
          esac
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state="$state" -f context="compiler/remat-edge-census" \
            -f description="Exact compiler ${COMPILER_SHA:0:12} edge census $OUTCOME" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
