name: AArch64 source-CFG 96-function controlled single/dual trace study
on:
  push:
    branches: [experiment/a64-source-cfg-census-20261126]
    paths:
      - '.github/workflows/verify-shared-machine-remat-ab-20261118.yml'
      - 'scripts/a64_cfg_source_census.py'
permissions:
  contents: read
  statuses: write
jobs:
  native:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 95
    env:
      CONTROL_SHA: '826bce0faf927f998a3282dcf06742721005d2fa'
      DUAL_SHA: '41ba00f60b00adc58d969df85c4ac44d34094a1f'
      CARGO_INCREMENTAL: '0'
      CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: '826bce0faf927f998a3282dcf06742721005d2fa'
          path: single
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: '41ba00f60b00adc58d969df85c4ac44d34094a1f'
          path: dual
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Assert same compiler source except deliberately controlled A64 scheduler
        run: |
          set -euo pipefail
          test "$(git -C single rev-parse HEAD)" = "$CONTROL_SHA"
          test "$(git -C dual rev-parse HEAD)" = "$DUAL_SHA"
          uname -m | grep -Eq 'aarch64|arm64'
          git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
          python3 - <<'PY'
          import subprocess
          from pathlib import Path
          files=lambda tree:subprocess.check_output(['git','-C',tree,'ls-files','-z']).split(b'\0')
          a,b=files('single'),files('dual')
          assert a==b,(len(a),len(b))
          changed=[p.decode() for p in a if p and
              Path('single',p.decode()).read_bytes()!=Path('dual',p.decode()).read_bytes()]
          assert changed==['crates/backend-aarch64/src/block_layout.rs'],changed
          print('CONTROL_DIFF_OK: only AArch64 physical scheduler differs')
          PY
          echo "C11 source CFG census: control $CONTROL_SHA, dual $DUAL_SHA" >> "$GITHUB_STEP_SUMMARY"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            single -> target
            dual -> target
          key: a64-source-cfg-census-control-20261126
      - name: Generate deterministic shared source and independent GCC reference
        run: |
          set -euo pipefail
          python3 scripts/a64_cfg_source_census.py generate results
          sha256sum results/generated.c results/gcc_reference.c results/oracle.c
      - name: Compile both exact revisions through TypeId, verify GAS parity, execute GCC oracle
        run: |
          set -euo pipefail
          gcc -std=c11 -O2 -Wall -Wextra -Werror -c results/gcc_reference.c -o results/reference.o
          for rev in single dual; do
            cargo build --release -p compiler --bin compiler --manifest-path "$rev/Cargo.toml"
            "$rev/target/release/compiler" results/generated.c --language mini-c --target aarch64 --emit obj -o "results/$rev.o"
            "$rev/target/release/compiler" results/generated.c --language mini-c --target aarch64 --emit asm -o "results/$rev.s"
            gcc -c "results/$rev.s" -o "results/$rev-gas.o"
            objcopy -O binary --only-section=.text "results/$rev.o" "results/$rev.text"
            objcopy -O binary --only-section=.text "results/$rev-gas.o" "results/$rev-gas.text"
            cmp "results/$rev.text" "results/$rev-gas.text"
            readelf -sW "results/$rev.o" > "results/$rev.sym"
            gcc -std=c11 -O2 -Wall -Wextra -Werror results/oracle.c "results/$rev.o" results/reference.o -o "results/$rev.exe"
            "results/$rev.exe"
          done
      - name: Count physical instruction bytes and unconditional B by production function
        run: |
          set -euo pipefail
          python3 scripts/a64_cfg_source_census.py report results | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: a64-96-function-source-cfg-census
          path: results/
      - name: Publish exact-source census status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          OUTCOME: ${{ job.status }}
        run: |
          case "$OUTCOME" in success) state=success;; cancelled) state=error;; *) state=failure;; esac
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state="$state" -f context="compiler/a64-source-cfg-census" \
            -f description="A64 96-source-functions controlled dual trace: $OUTCOME" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
