name: Atomic main integration basic contract
on:
  pull_request:
    paths:
      - .github/workflows/atomic-main-integration-20261118.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  atomic-source-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: ee06cbe00872030f4e598b18754a6c9df672d9d0
          ssh-key: ${{ secrets.CI_KEY }}
          path: compiler
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Verify exact compiler integration head
        run: test "$(git -C compiler rev-parse HEAD)" = ee06cbe00872030f4e598b18754a6c9df672d9d0
      - name: Restrict workspace to standalone IR
        run: |
          printf '[workspace]\nresolver = "2"\nmembers = ["crates/ir"]\n' > compiler/Cargo.toml
          rm -f compiler/Cargo.lock
      - name: Basic checked atomic contract tests
        working-directory: compiler
        run: |
          cargo test -p compiler-ir
          cargo check -p compiler-ir
