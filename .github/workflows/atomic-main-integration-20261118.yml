name: Atomic TypeId load/store basic integration
on:
  pull_request:
    paths:
      - .github/workflows/atomic-main-integration-20261118.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  atomic-shared-machine:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 4d7a310c788437254480312d3a3fa0bdfd99afbe
          ssh-key: ${{ secrets.CI_KEY }}
          path: compiler
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Verify exact compiler integration head
        run: test "$(git -C compiler rev-parse HEAD)" = 4d7a310c788437254480312d3a3fa0bdfd99afbe
      - name: Restrict workspace to standalone IR
        run: |
          printf '[workspace]\nresolver = "2"\nmembers = ["crates/ir", "crates/opt", "crates/backend", "crates/backend-x86"]\n' > compiler/Cargo.toml
          rm -f compiler/Cargo.lock
      - name: TypeId atomic load-store basic compile and IR tests
        working-directory: compiler
        run: |
          cargo check --workspace
          cargo test -p compiler-ir --lib
          cargo test -p compiler-backend-x86 --lib basic_generated_atomic_load_store_executes_in_shared_elf
          cargo test -p compiler-backend-x86 --lib basic_generated_atomic_exchange_returns_old_value_in_shared_elf
          cargo test -p compiler-backend-x86 --lib basic_generated_atomic_fetch_add_returns_old_value_in_shared_elf
          cargo test -p compiler-backend-x86 --lib basic_generated_atomic_fetch_sub_returns_old_value_in_shared_elf
          cargo test -p compiler-backend-x86 --lib basic_generated_fetch_and_or_xor_executes_in_shared_elf
          cargo test -p compiler-backend-x86 --lib shared_locked_cmpxchg_emits_four_widths_and_rejects_nonmemory
          cargo test -p compiler-backend-x86 --lib shared_physical_locked_xadd_has_exact_elf_and_gas
          cargo test -p compiler-backend-x86 --lib atomic_typeid_shared_machine_tests
          cargo test -p compiler-backend-x86 --lib shared_physical_atomic_thread_fence_emits_mfence_in_elf_and_gas
