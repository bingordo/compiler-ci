name: Atomic shared x86 machine integration
on:
  pull_request:
    paths:
      - .github/workflows/atomic-main-integration-20261118.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  atomic-shared-machine:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 09aec6a0c03fb615d07757c17014e317b8ce1a05
          ssh-key: ${{ secrets.CI_KEY }}
          path: compiler
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Verify exact compiler integration head
        run: test "$(git -C compiler rev-parse HEAD)" = 09aec6a0c03fb615d07757c17014e317b8ce1a05
      - name: Restrict workspace to standalone IR
        run: |
          printf '[workspace]\nresolver = "2"\nmembers = ["crates/ir", "crates/opt", "crates/backend", "crates/backend-x86"]\n' > compiler/Cargo.toml
          rm -f compiler/Cargo.lock
      - name: Basic native x86 physical fence tests
        working-directory: compiler
        run: |
          cargo check --workspace
          cargo test -p compiler-ir --lib
          cargo test -p compiler-backend-x86 --lib atomic_typeid_shared_machine_tests
          cargo test -p compiler-backend-x86 --lib shared_physical_atomic_thread_fence_emits_mfence_in_elf_and_gas
