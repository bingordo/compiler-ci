name: Shared remat partial profitability source-pinned acceptance
on:
  pull_request:
    paths:
      - '.github/workflows/remat-partial-profitability-20261120.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  shared-planner-x86-aarch64:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
    steps:
      - name: Checkout exact compiler PR candidate (only compiler-ci runs Actions)
        uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 86f6e47f4cd9ebd7df8cf7526417e8e233199c35
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Fail closed unless exact candidate is checked out
        run: |
          set -euo pipefail
          test "$(git -C compiler rev-parse HEAD)" = "86f6e47f4cd9ebd7df8cf7526417e8e233199c35"
          git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
          rustc --version
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: remat-partial-profitability-20261120
      - name: Shared remat new regression and full backend library tests
        working-directory: compiler
        run: |
          set -euo pipefail
          cargo test -p compiler-backend --lib remat::tests -- --nocapture
          cargo test -p compiler-backend --lib
          cargo test -p compiler-backend-x86 --lib
          cargo test -p compiler-backend-aarch64 --lib
      - name: Production native x86 TypeId and GCC differential integration
        working-directory: compiler
        run: |
          set -euo pipefail
          cargo test -p compiler --test x86_inline_source_ablation -- --nocapture
          cargo test -p compiler --test x7_s4_rolling_checksum_source -- --nocapture
      - name: Backend Clippy (two documented unrelated pre-existing exceptions)
        working-directory: compiler
        run: |
          set -euo pipefail
          # Existing generated compiler-opt shadow parameters and x86 selector docs.
          # Remat PR #2379 changes neither source; all other warnings remain fatal.
          cargo clippy -p compiler-backend -p compiler-backend-x86 -p compiler-backend-aarch64 --lib -- -D warnings -A unused-variables -A clippy::empty_line_after_doc_comments
      - name: Record exact checked revision
        if: always()
        run: |
          echo "Compiler source: 86f6e47f4cd9ebd7df8cf7526417e8e233199c35" >> "$GITHUB_STEP_SUMMARY"
          git -C compiler status --porcelain
