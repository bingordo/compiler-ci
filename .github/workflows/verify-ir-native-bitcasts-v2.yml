name: IR native bit constants casts v2 (compiler-ci)
on:
  pull_request:
    paths:
      - '.github/workflows/verify-ir-native-bitcasts-v2.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-bitcasts:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout pinned compiler candidate
        uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 9f39bc3723bf7be76621c718126676e0d488ab5d
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Confirm exact source
        working-directory: compiler
        run: |
          test "$(git rev-parse HEAD)" = "9f39bc3723bf7be76621c718126676e0d488ab5d"
          echo "Compiler candidate 9f39bc3723bf7be76621c718126676e0d488ab5d" >> "$GITHUB_STEP_SUMMARY"
      - name: Set isolated native compiler workspace
        working-directory: compiler
        run: |
          cat > Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir", "crates/opt", "crates/backend", "crates/backend-x86"]
          EOF
          rm -f Cargo.lock
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: ir-native-bitcasts-v2
          cache-workspace-crates: 'true'
      - name: Focused native bit constants and casts
        working-directory: compiler
        run: |
          cargo test -p compiler-ir --test typed_integer_constants_casts -- --nocapture
          cargo test -p compiler-ir --test typed_integer_v2
          cargo test -p compiler-ir native_int_semantics
      - name: Full IR optimizer and backend native suite
        working-directory: compiler
        run: cargo test -p compiler-ir -p compiler-opt -p compiler-backend -p compiler-backend-x86
      - name: Strict core Clippy
        working-directory: compiler
        run: cargo clippy -p compiler-ir -p compiler-opt -p compiler-backend -p compiler-backend-x86 --all-targets -- -D warnings
