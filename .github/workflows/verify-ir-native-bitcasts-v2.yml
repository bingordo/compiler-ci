name: IR native bit constants casts v2 (compiler-ci)
on:
  pull_request:
    paths:
      - '.github/workflows/verify-ir-native-bitcasts-v2.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-bitcasts:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout pinned compiler candidate
        uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 72583e7646b827f34e4d31d1fe4c9d956be19b74
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Confirm exact source
        working-directory: compiler
        run: |
          test "$(git rev-parse HEAD)" = "72583e7646b827f34e4d31d1fe4c9d956be19b74"
          echo "Compiler candidate 72583e7646b827f34e4d31d1fe4c9d956be19b74" >> "$GITHUB_STEP_SUMMARY"
      - name: Set isolated native compiler workspace
        working-directory: compiler
        run: |
          cat > Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir", "crates/opt", "crates/backend", "crates/backend-x86", "crates/backend-aarch64"]
          EOF
          rm -f Cargo.lock
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: ir-native-bitcasts-v2
          cache-workspace-crates: 'true'
      - name: Focused native bit constants and casts
        working-directory: compiler
        run: |
          cargo test -p compiler-ir --test typed_integer_constants_casts -- --nocapture
          cargo test -p compiler-ir --test typed_integer_v2
          cargo test -p compiler-ir native_int_semantics
      - name: Native v2 CLI replay and unsupported optimizer guard
        working-directory: compiler
        shell: bash
        run: |
          set -euo pipefail
          file=crates/ir/tests/fixtures/native_int_casts_v2.ir
          cargo run -p compiler-ir --bin ir-tool -- verify "$file"
          cargo run -p compiler-ir --bin ir-tool -- roundtrip "$file"
          cargo run -p compiler-ir --bin ir-tool -- normalize "$file" > "$RUNNER_TEMP/native-int-casts-v2.ir"
          cmp "$file" "$RUNNER_TEMP/native-int-casts-v2.ir"
          if cargo run -p compiler-opt --bin ir-opt -- run "$file" --passes=fold > "$RUNNER_TEMP/opt.out" 2> "$RUNNER_TEMP/opt.err"; then
            echo "ERROR: nonlegalized native casts passed optimizer" >&2
            exit 1
          fi
          grep -F 'optimizer legalization is not implemented' "$RUNNER_TEMP/opt.err"
      - name: Full IR optimizer and backend native suite
        working-directory: compiler
        run: cargo test -p compiler-ir -p compiler-opt -p compiler-backend -p compiler-backend-x86
      - name: AArch64 independent backend admission and build
        working-directory: compiler
        run: cargo check -p compiler-backend-aarch64 --all-targets
      - name: Strict core all-target Clippy
        working-directory: compiler
        run: cargo clippy -p compiler-ir -p compiler-opt -p compiler-backend -p compiler-backend-x86 --all-targets -- -D warnings
      - name: Strict AArch64 production-library Clippy
        working-directory: compiler
        # Existing AArch64 test-only warnings are tracked separately;
        # avoid unrelated changes in an IR opcode-migration PR.
        run: cargo clippy -p compiler-backend-aarch64 --lib -- -D warnings
