name: Validate native masked OR bulk length PR3156
on:
  push:
    branches: [test/bulk-masked-or-count-pr3156]
    paths: ['.github/workflows/validate-bulk-masked-or-pr3156.yml']
permissions:
  contents: read
jobs:
  differential:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: fb42628eeb875383d75596441470da04854919ca
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Confirm exact compiler candidate
        run: test "$(git -C compiler rev-parse HEAD)" = "fb42628eeb875383d75596441470da04854919ca"
      - name: Configure dependencies
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan github.com >> ~/.ssh/known_hosts
          git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: masked-bulk-length-pr3156
      - name: TypeId integer bound regression
        working-directory: compiler
        run: cargo test -p compiler-ir --test typed_memcpy_count_bounds -- --nocapture
      - name: GCC native memmove GAS and direct ELF differential
        working-directory: compiler
        run: cargo test -p compiler --test native_lp64_disjoint_memmove -- --nocapture
      - name: Record pinned source
        if: always()
        run: |
          echo 'Pinned compiler source fb42628eeb875383d75596441470da04854919ca' >> "$GITHUB_STEP_SUMMARY"
