name: Verify X7 ISL source-DAG SMT equivalence
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/verify-x7-isl-smt.yml']
permissions:
  contents: read
jobs:
  smt:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 3a69aa454084e046a8e84d90a79f99f7d39e2c85
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Install pinned offline-only Z3 solver in isolated venv
        run: |
          set -euo pipefail
          python3 -m venv /tmp/x7-z3
          /tmp/x7-z3/bin/python -m pip install --disable-pip-version-check 'z3-solver==4.13.4.0'
          /tmp/x7-z3/bin/python -c 'import z3; print("X7_Z3_VERSION", z3.get_version_string())'
      - name: Run independent source-vs-DAG SMT proof and mutation controls
        run: |
          set -euo pipefail
          git rev-parse HEAD
          /tmp/x7-z3/bin/python -m unittest discover -s tools -p 'test_x86_isl_smt_verify.py' -v
          /tmp/x7-z3/bin/python -m py_compile tools/x86_isl_smt_verify.py
