name: Practical inline and CTFE native v3 fixtures
on:
  push:
    branches: [ci/ir-practical-inline-ctfe-v3-20261114]
    paths: ['.github/workflows/ir-practical-inline-ctfe-v3.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: d4e50a2395daf5b4a9df21440db81228a477489d
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Exact compiler source and isolated core workspace
        run: |
          set -euo pipefail
          test "$(git -C compiler rev-parse HEAD)" = "d4e50a2395daf5b4a9df21440db81228a477489d"
          echo "Compiler SHA: d4e50a2395daf5b4a9df21440db81228a477489d" >> "$GITHUB_STEP_SUMMARY"
          cat > compiler/Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir", "crates/opt", "crates/backend", "crates/backend-x86"]
          EOF
          rm -f compiler/Cargo.lock
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: ir-practical-inline-ctfe-v3
      - name: Export original practical inliner native input graphs
        working-directory: compiler
        run: cargo test -p compiler-opt --test inline_practical_native export_original_practical_inliner_typeid_inputs -- --nocapture
      - name: Export original CTFE native input graphs
        working-directory: compiler
        run: cargo test -p compiler-opt --test ctfe export_original_ctfe_native_inputs -- --nocapture
