name: Practical inline and CTFE native v3 fixtures
on:
  push:
    branches: [ci/ir-practical-inline-ctfe-v3-20261114]
    paths: ['.github/workflows/ir-practical-inline-ctfe-v3.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: bd70b12530760497dc0ba0b4b2c63ba8da490d01
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Exact compiler source and isolated core workspace
        run: |
          set -euo pipefail
          test "$(git -C compiler rev-parse HEAD)" = "bd70b12530760497dc0ba0b4b2c63ba8da490d01"
          echo "Compiler SHA: bd70b12530760497dc0ba0b4b2c63ba8da490d01" >> "$GITHUB_STEP_SUMMARY"
          cat > compiler/Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir", "crates/opt", "crates/backend", "crates/backend-x86"]
          EOF
          rm -f compiler/Cargo.lock
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: ir-practical-inline-ctfe-v3
      - name: Original practical inliner and CTFE native/legacy/C11 test suites
        working-directory: compiler
        run: |
          set -euo pipefail
          cargo test -p compiler-opt --test inline_practical_native --test ctfe -- --nocapture
      - name: Adjacent canonical TypeId inliner, CTFE and optimizer regressions
        working-directory: compiler
        run: |
          set -euo pipefail
          cargo test -p compiler-opt --test typed_ctfe --test typed_inline_cfg_native --test typed_inline_wide_void_native --test typed_inline_leaf_native --test typed_inline_memory_native --test typed_core_pipeline --test typed_dse
      - name: Core production library compilation
        working-directory: compiler
        run: cargo check --workspace --lib
      - name: Strict scoped IR/optimizer Clippy and affected test targets
        working-directory: compiler
        run: |
          set -euo pipefail
          cargo clippy -p compiler-ir -p compiler-opt -p compiler-backend --lib -- -D warnings
          cargo clippy -p compiler-opt --test inline_practical_native --test ctfe -- -D warnings -A unused-variables
      - name: Record successful exact-source migration gate
        run: |
          echo 'Seven original native practical inliner + CTFE graphs, independent C11/legacy tests, adjacent TypeId regression suites, core check and scoped Clippy PASS' >> "$GITHUB_STEP_SUMMARY"
