name: x86 real physical driver dump compiler PR 1148
on:
  pull_request:
    paths:
      - '.github/workflows/verify-x86-driver-physical-dump-pr1148.yml'
permissions:
  contents: read
jobs:
  native-x86-physical-dump:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.CI_KEY }}
      - name: Trust pinned frontends source host
        run: ssh-keyscan github.com >> ~/.ssh/known_hosts
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: af47274bde57735ec4fa91483a787cd6679d2374
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Require exact source commit
        run: test "$(git -C compiler rev-parse HEAD)" = "af47274bde57735ec4fa91483a787cd6679d2374"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: x86-driver-physical-dump
          cache-workspace-crates: 'true'
      - name: Run actual driver x86 physical snapshot and replay integration
        working-directory: compiler
        run: |
          cargo test -p compiler --test typeid_x86_physical_dump -- --nocapture
          cargo test -p compiler --test typeid_ir_dump_replay -- --nocapture
      - name: Strict driver and backend Clippy
        working-directory: compiler
        run: |
          cargo clippy -p compiler -p compiler-backend-x86 --all-targets -- -D warnings
