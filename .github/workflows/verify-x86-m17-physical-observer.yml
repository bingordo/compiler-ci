name: x86 M1.7 real TypeId physical observer
on:
  pull_request:
    paths:
      - '.github/workflows/verify-x86-m17-physical-observer.yml'
permissions:
  contents: read
jobs:
  x86-physical-observer:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact compiler PR head
        uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 3abd44182caf73525522a9ee6e3927933a890daf
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Verify source pin
        run: test "$(git -C compiler rev-parse HEAD)" = "3abd44182caf73525522a9ee6e3927933a890daf"
      - name: Restrict workspace to independent compiler core
        run: |
          cat > compiler/Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir", "crates/opt", "crates/backend", "crates/backend-x86"]
          EOF
          rm -f compiler/Cargo.lock
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: x86-m17-physical-observer
          cache-workspace-crates: 'true'
      - name: Verify exact physical observer
        working-directory: compiler
        run: |
          cargo test -p compiler-backend-x86 --test typeid_real_physical_observer -- --nocapture
      - name: Verify native x86 backend regressions and lint
        working-directory: compiler
        run: |
          cargo test -p compiler-backend-x86
          cargo clippy -p compiler-backend-x86 --all-targets -- -D warnings
