name: FZ-2.5 PR1041 array memory deadphi ifconv
on:
  push:
    branches: [fuzz/fz25-array-mem-deadphi-ifconv-pr1041]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  focused:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 60641de71b1feea93776cbcedb22fbb7ad9000ec
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Verify exact source and targeted suite
        run: |
          test "$(git -C compiler rev-parse HEAD)" = "60641de71b1feea93776cbcedb22fbb7ad9000ec"
          test -s compiler/crates/opt/tests/typeid_fuzz_memory_cfg_targeted.rs
      - name: Isolate public-dependency-free core
        run: |
          cat > compiler/Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir", "crates/opt", "crates/backend", "crates/backend-x86"]
          EOF
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: fz25-array-mem-deadphi-ifconv
          cache-workspace-crates: 'true'
      - name: Run new targeted fuzz and native GAS ELF oracle
        working-directory: compiler
        run: cargo test -p compiler-opt --test typeid_fuzz_memory_cfg_targeted -- --nocapture
      - name: Guard previous FZ2 and FZ25 tests
        working-directory: compiler
        run: |
          cargo test -p compiler-opt --test typeid_fuzz_local_cfg_targeted
          cargo test -p compiler-opt --test typeid_fuzz_targeted
          cargo test -p compiler-opt --test typeid_fuzz_bias
          cargo test -p compiler-opt --test typeid_fuzz_pass_registry
          cargo test -p compiler-opt --test typed_core_native_verifier
      - name: Strict targeted Clippy
        working-directory: compiler
        run: cargo clippy -p compiler-opt --test typeid_fuzz_memory_cfg_targeted --test typeid_fuzz_pass_registry -- -D warnings
