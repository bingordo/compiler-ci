name: Compiler documentation audit validation
on:
  push:
    branches: [main]
    paths: ['.github/workflows/docs-audit-validation.yml']
  workflow_dispatch:
    inputs:
      compiler_ref:
        description: 'Exact compiler commit SHA to validate'
        required: false
        type: string
permissions:
  contents: read
jobs:
  docs:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout exact compiler documentation revision
        uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: ${{ inputs.compiler_ref || '4de684341886f9cccad70a5b573ada5caafbd8c5' }}
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Confirm exact compiler revision
        env:
          COMPILER_REF: ${{ inputs.compiler_ref || '4de684341886f9cccad70a5b573ada5caafbd8c5' }}
        run: test "$(git -C compiler rev-parse HEAD)" = "$COMPILER_REF"
      - name: Validate repository Markdown links
        working-directory: compiler
        run: python3 tools/check_doc_links.py
      - name: Unit-test documentation link checker
        working-directory: compiler
        run: python3 -m unittest discover -s tools -p 'test_check_doc_links.py' -v
