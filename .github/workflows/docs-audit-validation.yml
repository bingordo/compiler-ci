name: Compiler documentation audit validation
on:
  push:
    branches: [main]
    paths: ['.github/workflows/docs-audit-validation.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  docs:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout exact compiler documentation revision
        uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: a296358b305ff0b8515fb9a347510303ba20647b
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Confirm exact compiler revision
        run: test "$(git -C compiler rev-parse HEAD)" = "a296358b305ff0b8515fb9a347510303ba20647b"
      - name: Validate repository Markdown links
        working-directory: compiler
        run: python3 tools/check_doc_links.py
      - name: Unit-test documentation link checker
        working-directory: compiler
        run: python3 -m unittest discover -s tools -p 'test_check_doc_links.py' -v
