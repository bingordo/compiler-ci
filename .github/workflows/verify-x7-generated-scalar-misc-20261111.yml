name: X7 generated reviewed scalar CMP BSF DIV NOT ELF cutover
on:
  pull_request:
    branches: [main]
    paths: [.github/workflows/verify-x7-generated-scalar-misc-20261111.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-gp-encoder:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout exact compiler source
        uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 27e01ef1458bcfb13fab7e159ec37dd0a76f2803
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Validate generated source form tables
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 27e01ef1458bcfb13fab7e159ec37dd0a76f2803
          python3 tools/regen_x86_scalar_misc_forms.py --check
          python3 tools/regen_x86_scalar_bin_forms.py --check
          python3 tools/regen_x86_selector_rules.py --check
          python3 -m unittest discover -s tools -p 'test_x86_scalar_misc_forms.py' -v
          python3 -m unittest discover -s tools -p 'test_x86_scalar_bin_forms.py' -v
      - name: Native x86 library and same selected machine ELF parity
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          Path("Cargo.toml").write_text("""[workspace]
          resolver = "2"
          members = ["crates/ir", "crates/opt", "crates/backend", "crates/backend-x86"]
          """)
          PY
          cargo test -p compiler-backend-x86 --lib --offline
          cargo test -p compiler-backend-x86 --lib --features x7-native-form-validation --offline
          cargo test -p compiler-backend-x86 --no-default-features --lib --offline
          cargo test -p compiler-backend-x86 --test x7_shared_machine_native_parity --offline
          echo X7_GENERATED_SCALAR_MISC_NATIVE_GREEN
