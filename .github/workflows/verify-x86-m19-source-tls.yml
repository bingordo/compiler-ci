name: x86 M1.19a source TLS v5 physical snapshots PR 1236
on:
  pull_request:
    paths:
      - '.github/workflows/verify-x86-m19-source-tls.yml'
permissions:
  contents: read
jobs:
  x86-source-tls:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.CI_KEY }}
      - run: ssh-keyscan github.com >> ~/.ssh/known_hosts
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 1b3d5af291bb86a7ddef899f318286f8b8b37628
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Check exact source
        run: test "$(git -C compiler rev-parse HEAD)" = "1b3d5af291bb86a7ddef899f318286f8b8b37628"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: x86-m19-source-tls
          cache-workspace-crates: 'true'
      - name: Test source TLS and existing source physical dump regressions
        working-directory: compiler
        run: |
          cargo test -p compiler --test typeid_x86_source_tls_snapshot -- --nocapture
          cargo test -p compiler --test typeid_x86_source_machine_dump -- --nocapture
          cargo test -p compiler --test typeid_x86_physical_dump -- --nocapture
      - name: Strict driver/backend Clippy
        working-directory: compiler
        run: cargo clippy -p compiler -p compiler-backend-x86 --all-targets -- -D warnings
