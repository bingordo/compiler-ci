name: LTO TypeId target envelope verification
on:
  push:
    branches: [verify/lto-target-envelope-20261114]
    paths:
      - '.github/workflows/lto-target-envelope-20261114.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lto-target-envelope:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 44d9b627d7b3bca78bb2e8a71c9952a1ee7a7e58
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Verify source revision
        run: test "$(git -C compiler rev-parse HEAD)" = "44d9b627d7b3bca78bb2e8a71c9952a1ee7a7e58"
      - name: Focus workspace on IR crate
        run: |
          cat > compiler/Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir"]
          EOF
          rm -f compiler/Cargo.lock
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: lto-target-envelope
      - name: Validate LTO envelope and all IR tests
        working-directory: compiler
        run: |
          cargo test -p compiler-ir --test lto_target_envelope
          cargo test -p compiler-ir
          cargo clippy -p compiler-ir --tests -- -D warnings
