name: X7 S3.L L4a generated flags-only native GAS ELF
on:
  pull_request:
    paths:
      - '.github/workflows/x86-s3l-l4a-flags-only-native.yml'
permissions:
  contents: read
  actions: read
jobs:
  source-generated-flags-native:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      SOURCE_SHA: 'a19f46735b264229aeccf03f95896710fc7c96a8'
      PYTHONPATH: compiler/tools
      X7_S3L_L4A_WORKLIST: /tmp/x7-s3l-l4a/source/original-source-xed-iforms.json
      X7_S3L_L4A_SMT: /tmp/x7-s3l-l4a/semantics/semantics-z3.json
    steps:
      - name: Checkout exact compiler source, no actions in compiler
        uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: a19f46735b264229aeccf03f95896710fc7c96a8
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Import original proven Intel/XED 200-form candidate worklist
        uses: actions/download-artifact@v4
        with:
          name: x7-s3l-l3c-source-XED-gated-production-admission
          run-id: 43728544711
          repository: bingordo/compiler-ci
          github-token: ${{ github.token }}
          path: /tmp/x7-s3l-l4a/source
      - name: Import generic Intel source Z3 semantic proof and helper ASTs
        uses: actions/download-artifact@v4
        with:
          name: x7-s3l-l2b-l3a-9-ops-generic-helper-smt-source-evidence
          run-id: 43687620382
          repository: bingordo/compiler-ci
          github-token: ${{ github.token }}
          path: /tmp/x7-s3l-l4a/semantics
      - name: Regenerate four source-pinned flags-only native recipes from data
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C compiler rev-parse HEAD)" = "$SOURCE_SHA"
          test -s "$X7_S3L_L4A_WORKLIST"
          test -s "$X7_S3L_L4A_SMT"
          mkdir -p /tmp/x7-s3l-l4a/out
          python3 compiler/tools/x86_s3l_l4a_flags_recipe.py \
            --worklist "$X7_S3L_L4A_WORKLIST" \
            --generic-smt "$X7_S3L_L4A_SMT" \
            --report /tmp/x7-s3l-l4a/out/physical-recipes.json
          git -C compiler diff --exit-code -- \
            crates/backend-x86/src/generated_x7_s3l_l4a_flags_only_recipes.rs
          python3 compiler/tools/x86_s3l_l4a_flags_recipe.py \
            --worklist "$X7_S3L_L4A_WORKLIST" \
            --generic-smt "$X7_S3L_L4A_SMT" \
            --report /tmp/x7-s3l-l4a/out/physical-recipes.json --check
          echo X7_S3L_L4A_FOUR_ORIGINAL_SOURCE_RECIPES_REPRODUCIBLE_PASS
      - name: Confirm data-only regeneration and mutation fail-closed
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest -v test_x86_s3l_l4a_flags_recipe
          echo X7_S3L_L4A_RECIPE_NEGATIVE_MUTATIONS_PASS
      - name: Isolate backend offline Rust workspace
        shell: bash
        run: |
          cd compiler
          python3 - <<'PY'
          from pathlib import Path
          Path("Cargo.toml").write_text("""[workspace]
          resolver = "2"
          members = ["crates/ir", "crates/opt", "crates/backend", "crates/backend-x86"]
          """)
          PY
      - name: Run real GAS and direct-ELF native signed CMP and bitwise TEST
        shell: bash
        run: |
          set -euo pipefail
          cd compiler
          cargo test -p compiler-backend-x86 \
            --features 'x7-native-form-validation x7-c-defined-64 x7-c-defined-bitwise' \
            --test x7_s3l_l4a_flags_only_native --offline -- --nocapture
          echo X7_S3L_L4A_REAL_GAS_DIRECT_ELF_C11_NATIVE_PASS
      - name: Existing compiler native selector and flag effects unchanged
        shell: bash
        run: |
          set -euo pipefail
          cd compiler
          cargo test -p compiler-backend-x86 --lib flags --offline
          cargo test -p compiler-backend-x86 \
            --features 'x7-native-form-validation x7-c-defined-64 x7-c-defined-bitwise' \
            --lib x7_late_selector --offline
          cargo test -p compiler-backend-x86 \
            --features 'x7-native-form-validation x7-c-defined-64 x7-c-defined-bitwise' \
            --test x7_s3k_cmp_native --offline
          cargo test -p compiler-backend-x86 \
            --no-default-features --test x7_g10_n15_no_default_fallback --offline
      - name: Archive SHA-bound flags-only physical recipes, NOT TypeId selection
        uses: actions/upload-artifact@v4
        with:
          name: x7-s3l-l4a-new-flags-only-native-GAS-ELF-four-forms
          path: /tmp/x7-s3l-l4a/out/physical-recipes.json
          if-no-files-found: error
