name: ASM1-D4 physical text alignment source-pinned acceptance
on:
  push:
    branches: [ci/asm1-d4-text-alignment]
    paths: ['.github/workflows/asm1-d4-text-alignment.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  x86-text-align:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: d322cf71183ade352a5b80871d14617dabde792b
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Verify compiler SHA
        run: test "$(git rev-parse HEAD)" = "d322cf71183ade352a5b80871d14617dabde792b"
      - name: Core compiler workspace
        run: |
          cat > Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir", "crates/opt", "crates/backend", "crates/backend-x86"]
          EOF
          rm -f Cargo.lock
      - uses: Swatinem/rust-cache@v2
        with:
          key: asm1-d4-text-alignment
      - name: Run assembler/ELF/GNU-as branch and alignment tests
        run: |
          set -euo pipefail
          python3 tools/regen_x86_att_forms.py --check
          python3 -m unittest discover -s tools -p test_regen_x86_att_forms.py -v
          cargo check -p compiler-backend-x86 --all-targets
          cargo test -p compiler-backend-x86 --test att_text_alignment -- --nocapture
          for suite in att_asm att_module att_module_strings att_aliases \
            att_mid_labels att_section_cursor m4_global_data_only_native \
            m4_global_definitions_native m4_global_pointer_relocations_native \
            m4_global_external_native m4_global_branch_relax_native \
            machine_text_v1; do
            cargo test -p compiler-backend-x86 --test "$suite"
          done
          cargo test -p compiler-backend-x86 --lib
          cargo test -p compiler-backend --lib
          cargo clippy -p compiler-backend-x86 --lib --test att_text_alignment --test att_asm --test att_section_cursor -- -D warnings -A unused_variables -A clippy::suspicious_assignment_formatting
          echo 'ASM1_D4_TEXT_ALIGNMENT status=PASS' >> "$GITHUB_STEP_SUMMARY"
