name: AArch64 native TypeId fixed ABI and checked arrays fixture migration
on:
  push:
    branches: [verify/aarch64-abi-arrays-typeid-20261115]
    paths: ['.github/workflows/aarch64-abi-arrays-typeid-20261115.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: fd8f729d8cd0db24254cbdbf89e3656c1695dd0e
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Verify exact compiler source
        run: test "$(git -C compiler rev-parse HEAD)" = "fd8f729d8cd0db24254cbdbf89e3656c1695dd0e"
      - name: Restrict workspace
        run: |
          cat > compiler/Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir", "crates/backend", "crates/backend-aarch64"]
          EOF
          rm -f compiler/Cargo.lock
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: aarch64-typeid-abi-arrays-fixtures
      - name: Export original fixed native TypeId ABI and array graphs
        working-directory: compiler
        run: |
          cargo test -p compiler-backend-aarch64 --test typeid_abi_calls_native temporary_export_original_fixed_aarch64_abi_graphs -- --nocapture
          cargo test -p compiler-backend-aarch64 --test checked_arrays temporary_export_original_checked_arrays_typeid_graphs -- --nocapture
