name: AArch64 native TypeId fixed ABI and checked arrays fixture migration
on:
  push:
    branches: [verify/aarch64-abi-arrays-typeid-20261115]
    paths: ['.github/workflows/aarch64-abi-arrays-typeid-20261115.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: e66a8d7608af4696d1491a3d241214d1e308ec5a
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Verify exact compiler source
        run: test "$(git -C compiler rev-parse HEAD)" = "e66a8d7608af4696d1491a3d241214d1e308ec5a"
      - name: Restrict workspace
        run: |
          cat > compiler/Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir", "crates/backend", "crates/backend-aarch64"]
          EOF
          rm -f compiler/Cargo.lock
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: aarch64-typeid-abi-arrays-fixtures
      - name: Install real AArch64 GCC glibc cross headers and QEMU
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends gcc-aarch64-linux-gnu libc6-dev-arm64-cross binutils-aarch64-linux-gnu qemu-user
      - name: Verify original AAPCS64 ABI and checked-array C11 runtime oracles
        working-directory: compiler
        env:
          COMPILER_REQUIRE_AARCH64_QEMU: "1"
        run: |
          cargo test -p compiler-backend-aarch64 --test typeid_abi_calls_native --test checked_arrays -- --nocapture
      - name: Verify adjacent native TypeId globals and v3 IR reader
        working-directory: compiler
        run: |
          cargo test -p compiler-backend-aarch64 --test typeid_globals_native --test module_globals
          cargo test -p compiler-ir --test native_module_text_v3 --test native_fixture_text
          cargo clippy -p compiler-backend-aarch64 --no-deps --test typeid_abi_calls_native --test checked_arrays -- -D warnings
