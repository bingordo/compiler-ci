name: One-off scalar local frame range validation
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/bench-scalar-local-range.yml'
permissions:
  contents: read
jobs:
  validate:
    if: github.head_ref == 'bench/scalar-local-range' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 65155cd3fcca4134d4db96a8ac8ab972ecc4e224
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: scalar-local-range
      - name: Validate frame range and native GCC oracle
        working-directory: compiler
        run: |
          set -euo pipefail
          git rev-parse HEAD
          git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
          cargo test --release -p compiler-backend --lib
          cargo test --release -p compiler-backend-x86 --test mixed_frame_native
          cargo test --release -p compiler-backend-aarch64 --lib
          cargo check --workspace
          cargo clippy -p compiler-backend --lib -- -D warnings
