name: Validate relational compare CMOVcc PR 432
on:
  push:
    branches: [ci/relational-cmovcc-pr432-20261106]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 8a65de98dee4c6cdd12aba9e41540fca5dcb50b4
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Verify pinned compiler source
        run: test "$(git -C compiler rev-parse HEAD)" = "8a65de98dee4c6cdd12aba9e41540fca5dcb50b4"
      - name: Isolate core compiler crates
        shell: bash
        run: |
          cat > compiler/Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir", "crates/opt", "crates/backend", "crates/backend-x86"]
          EOF
          rm -f compiler/Cargo.lock
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: pr432-cmovcc
      - name: Native all-predicate GAS and ELF oracle
        working-directory: compiler
        run: cargo test -p compiler-backend-x86 --test compare_select_relational_native -- --nocapture
      - name: Full independent IR opt backend and x86 tests
        working-directory: compiler
        run: cargo test -p compiler-ir -p compiler-opt -p compiler-backend -p compiler-backend-x86
      - name: Strict Clippy
        working-directory: compiler
        run: |
          cargo clippy -p compiler-backend-x86 --all-targets -- -D warnings
          cargo clippy -p compiler-ir -p compiler-opt --all-targets -- -D warnings
