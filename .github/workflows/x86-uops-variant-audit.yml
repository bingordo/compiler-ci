name: X86 uops.info exact variant identity audit
on:
  push:
    branches: [ci/x86-uops-variant-audit-20261106]
permissions:
  contents: read
jobs:
  upstream:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Download current upstream uops.info XML and pin checksum
        run: |
          set -euo pipefail
          curl --fail --show-error --location --retry 2 --connect-timeout 15 --max-time 160 \
            https://uops.info/instructions.xml -o instructions.xml
          sha256sum instructions.xml
      - name: Emit compact exact 32-bit register and immediate variants with CPU measures
        shell: bash
        run: |
          python3 - <<'PY'
          import json,xml.etree.ElementTree as ET
          opcodes={'39','3B','81','83','0F94','0F95','0F9F','0F9C','0F9E','0F9D',
            '0FB6','0F44','0F45','0F4F','0F4C','0F47','0F42'}
          pairs=set()
          count=0
          for _,elem in ET.iterparse('instructions.xml',events=('end',)):
            if elem.tag!='instruction':continue
            a=elem.attrib
            opcode=''.join(a.get('opcode','').split()).upper()
            if opcode not in opcodes: elem.clear();continue
            if not a.get('iform','').startswith(('CMP_','SET','MOVZX_','CMOV')):
              elem.clear();continue
            if a.get('eosz') not in ('2',None):
              elem.clear();continue
            ops=[o.attrib for o in elem.findall('operand') if o.get('suppressed')!='1']
            optypes=[o.get('type') for o in ops]
            widths=[o.get('width') for o in ops]
            # Suppress non32bit SET/MOVZX variants using operand widths.
            if any(x not in ('32','8',None) for x in widths):
              elem.clear();continue
            key=(opcode,a.get('iform'),tuple(optypes),tuple(widths),a.get('rm'),a.get('eosz'))
            if key in pairs:elem.clear();continue
            pairs.add(key)
            arch={arch.get('name'):m.attrib for arch in elem.iter('architecture')
                  for m in arch.findall('measurement')
                  if arch.get('name') in ('SKL','HSW','ZEN4')}
            data={'opcode':opcode,'iform':a.get('iform'),'variant':{
              k:a.get(k) for k in ('iform','agen','bcast','eosz','high8','immzero','mask',
                 'nf','opcode','rep','rm','sae','zeroing')},
                 'operand_types':optypes,'widths':widths,
                 'arch':{k:{j:v.get(j) for j in ('TP_unrolled','TP_loop','uops','ports')}
                     for k,v in arch.items()}}
            print('MATCH',json.dumps(data,sort_keys=True,separators=(',',':')))
            count+=1
            elem.clear()
          print('VARIANT_ROWS',count)
          PY
