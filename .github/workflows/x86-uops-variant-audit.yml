name: X86 uops.info exact variant identity audit
on:
  push:
    branches: [ci/x86-uops-variant-audit-20261106]
permissions:
  contents: read
jobs:
  upstream:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Download current upstream uops.info XML and pin checksum
        run: |
          set -euo pipefail
          curl --fail --show-error --location --retry 2 --connect-timeout 15 --max-time 160 \
            https://uops.info/instructions.xml -o instructions.xml
          sha256sum instructions.xml
      - name: Verify high8 register byte variant semantics
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          for _,e in ET.iterparse('instructions.xml',events=('end',)):
            if e.tag!='instruction':continue
            if e.get('iform') in ('SETL_GPR8','SETNBE_GPR8','SETZ_GPR8','MOVZX_GPRv_GPR8'):
              print('BYTE_VARIANT',{'iform':e.get('iform'),'high8':e.get('high8'),
                'string':e.get('string'),'url':e.get('url'),
                'eosz':e.get('eosz'),'op':e.get('opcode'),
                'operands':[o.attrib for o in e.findall('operand') if o.get('suppressed')!='1']})
            e.clear()
          PY
