name: AArch64 shifted arithmetic native acceptance (compiler PR 571)
on:
  push:
    paths:
      - '.github/workflows/aarch64-shifted-571.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: aarch64-shifted-571
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.CI_KEY }}
      - run: ssh-keyscan github.com >> ~/.ssh/known_hosts
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 2d34e44fc84c80cf2c6146dbdca4ebcd7a585a25
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Exact-source isolated workspace
        run: |
          set -euo pipefail
          test "$(git -C compiler rev-parse HEAD)" = "2d34e44fc84c80cf2c6146dbdca4ebcd7a585a25"
          mkdir -p workspace/crates
          cp -a compiler/crates/ir compiler/crates/backend compiler/crates/backend-aarch64 workspace/crates/
          cat > workspace/Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir", "crates/backend", "crates/backend-aarch64"]
          EOF
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: workspace
          key: aarch64-shifted-571
      - name: Warnings-denied AArch64 compilation
        working-directory: workspace
        run: RUSTFLAGS="-D warnings" cargo check -p compiler-backend-aarch64 --all-targets
      - name: Shifted SSA folding selector tests
        working-directory: workspace
        run: cargo test -p compiler-backend-aarch64 machine::tests:: -- --nocapture
      - name: Shifted ADD/SUB ISA exact encodings
        working-directory: workspace
        run: cargo test -p compiler-backend-aarch64 encoding::tests::shifted_add_sub_encodings_and_limits -- --nocapture
      - name: All IR/backend/AArch64 tests including native executable checks
        working-directory: workspace
        run: cargo test -p compiler-ir -p compiler-backend -p compiler-backend-aarch64 -- --test-threads=1
      - name: Strict AArch64 production Clippy
        working-directory: workspace
        run: cargo clippy -p compiler-backend-aarch64 --lib -- -D warnings
      - name: Accepted source
        run: echo 'AArch64 shifted ADD/SUB source-locked SHA 2d34e44fc84c80cf2c6146dbdca4ebcd7a585a25' >> "$GITHUB_STEP_SUMMARY"
