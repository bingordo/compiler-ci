name: IR BT3b selected memory folding native TypeId - exact source pin
on:
  pull_request:
    paths:
      - '.github/workflows/verify-ir-bt3b-native-memory-folding-20261114.yml'
permissions:
  contents: read
jobs:
  native-arm:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.CI_KEY }}
      - run: ssh-keyscan github.com >> ~/.ssh/known_hosts
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 1c85736a1e82174b1e8d54562e4fe5056444cf85
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - run: |
          test "$(git -C compiler rev-parse HEAD)" = 1c85736a1e82174b1e8d54562e4fe5056444cf85
          test "$(uname -m)" = aarch64
          command -v cc
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler
          key: ir-bt3b-native-memory-folding-arm
      - name: Strict all-target typecheck
        working-directory: compiler
        run: RUSTFLAGS="-D warnings" cargo check -p compiler-ir -p compiler-backend -p compiler-backend-aarch64 --all-targets
      - name: Original indexed/displaced/address-chain runtime plus actual machine-shape witnesses on ARM
        working-directory: compiler
        run: cargo test -p compiler-backend-aarch64 --test indexed_memory -- --nocapture
          cargo test -p compiler-backend-aarch64 --test displaced_memory -- --nocapture
          cargo test -p compiler-backend-aarch64 --test address_chains -- --nocapture
      - name: Full backend all-target suite
        working-directory: compiler
        run: cargo test -p compiler-backend-aarch64 --all-targets -- --test-threads=2
      - name: Strict all-target Clippy
        working-directory: compiler
        run: cargo clippy -p compiler-backend-aarch64 --all-targets -- -D warnings
  qemu:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc-aarch64-linux-gnu libc6-dev-arm64-cross linux-libc-dev-arm64-cross binutils-aarch64-linux-gnu qemu-user
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.CI_KEY }}
      - run: ssh-keyscan github.com >> ~/.ssh/known_hosts
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 1c85736a1e82174b1e8d54562e4fe5056444cf85
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - run: test "$(git -C compiler rev-parse HEAD)" = 1c85736a1e82174b1e8d54562e4fe5056444cf85
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler
          key: ir-bt3b-native-memory-folding-qemu
      - name: Original three C11 oracles and exact selected machine snapshots in QEMU
        working-directory: compiler
        env:
          COMPILER_REQUIRE_AARCH64_QEMU: "1"
        run: cargo test -p compiler-backend-aarch64 --test indexed_memory -- --nocapture
          cargo test -p compiler-backend-aarch64 --test displaced_memory -- --nocapture
          cargo test -p compiler-backend-aarch64 --test address_chains -- --nocapture
