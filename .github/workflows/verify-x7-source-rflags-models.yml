name: X7 independent Intel source RFLAGS model and pure Std::Bits
on:
  push:
    branches: [ci/x7-source-rflags-models-20261111]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact-rflags:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 7e9e195bc717526c02d7c5552ffeac44fa955be2
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Pin source and Z3 interpreter
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 7e9e195bc717526c02d7c5552ffeac44fa955be2
          python3 -m venv /tmp/x7-rflags-z3
          /tmp/x7-rflags-z3/bin/python -m pip install --disable-pip-version-check 'z3-solver==4.13.4.0'
      - name: Verify all flag-only source models and negative/effect regressions
        run: |
          set -euo pipefail
          /tmp/x7-rflags-z3/bin/python -m py_compile tools/x86_isl_operation_proof_worker.py tools/test_x86_isl_operation_proof_worker.py
          /tmp/x7-rflags-z3/bin/python -m unittest discover -s tools -p 'test_x86_isl_operation_proof_worker.py' -v
          /tmp/x7-rflags-z3/bin/python -m unittest discover -s tools -p 'test_x86_isl_smt_verify.py' -v
          /tmp/x7-rflags-z3/bin/python -m unittest discover -s tools -p 'test_x86_isl_record_effects_smt.py' -v
          /tmp/x7-rflags-z3/bin/python -m unittest discover -s tools -p 'test_x86_isl_definedness_smt.py' -v
          echo X7_EXACT_SOURCE_RFLAGS_MODEL_PASS
