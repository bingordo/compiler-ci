name: x86 M1.17b v5 TLS and ELF symbol annotations compiler PR 1226
on:
  pull_request:
    paths:
      - '.github/workflows/verify-x86-m17b-v5-annotations.yml'
permissions:
  contents: read
jobs:
  x86-annotations-v5:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.CI_KEY }}
      - name: Trust GitHub pinned frontend host
        run: ssh-keyscan github.com >> ~/.ssh/known_hosts
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: bf5db1ecc14c4053f586f13b3585370a63591d40
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Verify exact compiler SHA
        run: test "$(git -C compiler rev-parse HEAD)" = "bf5db1ecc14c4053f586f13b3585370a63591d40"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: x86-m17b-annotations
          cache-workspace-crates: 'true'
      - name: Focused machine v5 annotations, legacy module and driver tests
        working-directory: compiler
        run: |
          cargo test -p compiler-backend-x86 --test typeid_physical_module_v5 -- --nocapture
          cargo test -p compiler-backend-x86 --test typeid_physical_module_v3 -- --nocapture
          cargo test -p compiler --test typeid_x86_physical_dump -- --nocapture
      - name: Full x86 backend tests and strict driver/backend Clippy
        working-directory: compiler
        run: |
          cargo test -p compiler-backend-x86
          cargo clippy -p compiler -p compiler-backend-x86 --all-targets -- -D warnings
