# Temporary, source-pinned CI for a justified BT4 X4 ADD32 original oracle.
name: BT4 audited X4 generated ADD32 parity
on:
  pull_request:
    paths:
      - '.github/workflows/ir-bt4-audited-x4-add-pr1652.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-x4-add:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      CARGO_INCREMENTAL: '0'
      SOURCE_SHA: 13d5f194d2d4fc92c48ea5f912ff39e37cfbed7b
    steps:
      - name: Checkout exact compiler candidate
        uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 13d5f194d2d4fc92c48ea5f912ff39e37cfbed7b
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Verify SHA and isolate core workspace
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C compiler rev-parse HEAD)" = "$SOURCE_SHA"
          cat > compiler/Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir", "crates/opt", "crates/backend", "crates/backend-x86"]
          EOF
          rm -f compiler/Cargo.lock
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: ir-bt4-audited-add
      - name: Original audited generated ADD32 source quality and C11 oracles
        working-directory: compiler
        run: cargo test -p compiler-backend-x86 --test dag_add_integration_native -- --nocapture
      - name: Adjacent native X4 generated DAG, CFG, effects and ABI regressions
        working-directory: compiler
        run: |
          set -euo pipefail
          cargo test -p compiler-backend-x86 --test x4_cfg_pressure_native --test x4_effects_native --test native_typeid_direct --test rbp_alloc_native --test native_typeid_call_liveness
      - name: All-target IR/backend checks
        working-directory: compiler
        run: cargo check -p compiler-ir -p compiler-backend -p compiler-backend-x86 --all-targets
      - name: Strict original test lint
        working-directory: compiler
        run: cargo clippy -p compiler-backend-x86 --test dag_add_integration_native -- -D warnings
