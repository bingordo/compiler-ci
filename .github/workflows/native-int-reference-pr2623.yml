name: Validate native-int reference oracle batch PR2623
on:
  pull_request:
    paths:
      - '.github/workflows/native-int-reference-pr2623.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reference-oracles:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_INCREMENTAL: '0'
      SOURCE_SHA: 7794a4c8ea8338d63eb85b659de2bc6c1fab9297
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 7794a4c8ea8338d63eb85b659de2bc6c1fab9297
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Verify source pin and isolate optimizer
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C compiler rev-parse HEAD)" = "$SOURCE_SHA"
          cat > compiler/Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir", "crates/opt", "crates/backend", "crates/backend-x86"]
          EOF
          rm -f compiler/Cargo.lock
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: native-int-seeded-generator
      - name: Validate all eight historical generated suites and differential oracles
        working-directory: compiler
        shell: bash
        run: |
          set -euo pipefail
          cargo test -p compiler-opt --test generated_native_shared_masked_sub_s2332 -- --nocapture
          cargo test -p compiler-opt --test generated_native_reverse_subtractive_s2329 -- --nocapture
          cargo test -p compiler-opt --test generated_native_subtractive_partition_s2322 -- --nocapture
          cargo test -p compiler-opt --test generated_native_complement_pair_s2325 -- --nocapture
          cargo test -p compiler-opt --test generated_native_dual_arithmetic_cancellation_s2333 -- --nocapture
          cargo test -p compiler-opt --test generated_native_xor_partition_s2324 -- --nocapture
          cargo test -p compiler-opt --test generated_native_carry_reconstruction_s2327 -- --nocapture
          cargo test -p compiler-opt --test generated_native_add_xor_carry_comparison_s2331 -- --nocapture
      - name: Focused lint (known unrelated x86 warnings exempt)
        working-directory: compiler
        run: cargo clippy -p compiler-opt --test generated_native_shared_masked_sub_s2332 --test generated_native_reverse_subtractive_s2329 --test generated_native_subtractive_partition_s2322 --test generated_native_complement_pair_s2325 --test generated_native_dual_arithmetic_cancellation_s2333 --test generated_native_xor_partition_s2324 --test generated_native_carry_reconstruction_s2327 --test generated_native_add_xor_carry_comparison_s2331 -- -D warnings -A dead-code -A clippy::empty-line-after-doc-comments
