name: Validate compiler x86 selector
on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: 'Compiler branch, tag, or commit'
        required: false
        default: 'main'
        type: string
  schedule:
    - cron: '7,22,37,52 * * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/x86-selector-validation.yml'
permissions:
  contents: read
concurrency:
  group: x86-selector-validation
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Fetch private compiler source
        uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: ${{ inputs.source_ref || 'main' }}
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Identify revision
        working-directory: compiler
        run: git rev-parse HEAD
      - name: Skip unchanged revision
        id: revision
        shell: bash
        working-directory: compiler
        run: |
          set -euo pipefail
          sha=$(git rev-parse HEAD)
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "source revision: $sha"
      - name: Check previously validated revision
        id: validated
        uses: actions/cache/restore@v4
        with:
          path: .x86-selector-validated
          key: x86-selector-v4-${{ hashFiles('.github/workflows/x86-selector-validation.yml') }}-${{ steps.revision.outputs.sha }}
      - name: Test x86 Python tooling
        if: steps.validated.outputs.cache-hit != 'true'
        working-directory: compiler
        run: |
          # The generator's Python tests and tooling live on the experimental
          # pattern branch; main currently has no test_x86_*.py tests.
          if compgen -G 'tests/test_x86_*.py' > /dev/null; then
            python3 -m unittest discover -s tests -p 'test_x86_*.py' -v
          fi
          for script in validate_x86_selector_source.py regen_x86_selector_patterns.py validate_x86_costs.py x86_form_inventory.py; do
            if [ ! -f "tools/$script" ]; then
              echo "Skipping experimental generator tool $script (not on this ref)"
              continue
            fi
            case "$script" in
              regen_x86_selector_patterns.py) python3 "tools/$script" --check ;;
              validate_x86_costs.py) python3 "tools/$script" data/x86_costs_generic.json ;;
              x86_form_inventory.py) python3 "tools/$script" --json > /tmp/x86-inventory.json ;;
              *) python3 "tools/$script" ;;
            esac
          done
      - name: Test x86 Rust backend without private Oberon driver
        if: steps.validated.outputs.cache-hit != 'true'
        working-directory: compiler
        shell: bash
        run: |
          set -euo pipefail
          # Cargo resolves all workspace members, even when -p selects a backend.
          # Use an isolated temporary workspace containing only the backend's
          # local dependency closure; never edit the checked-out source.
          mkdir -p "$RUNNER_TEMP/x86-workspace/crates"
          for crate in ir opt backend backend-x86; do
            cp -a "crates/$crate" "$RUNNER_TEMP/x86-workspace/crates/$crate"
          done
          cat > "$RUNNER_TEMP/x86-workspace/Cargo.toml" <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir", "crates/opt", "crates/backend", "crates/backend-x86"]
          EOF
          cargo test --manifest-path "$RUNNER_TEMP/x86-workspace/Cargo.toml" -p compiler-backend-x86
      - name: T5.5 native selection semantics and negative controls
        if: steps.validated.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=10s 5m \
            cargo test --manifest-path "$RUNNER_TEMP/x86-workspace/Cargo.toml" \
              -p compiler-backend-x86 --test t5_x86_semantics -- --nocapture --test-threads=1 \
              2>&1 | tee "$RUNNER_TEMP/x86-t5-semantics.log"
          python3 - "$RUNNER_TEMP/x86-t5-semantics.log" <<'PY'
          import json, pathlib, re, sys
          log=pathlib.Path(sys.argv[1]).read_text(errors='replace')
          tests={
              't5_selected_cmp_flags_and_register_widths',
              't5_machine_negative_controls_are_detectable',
              't5_selected_native_elf_and_assembly_match_independent_c',
          }
          passed=set(re.findall(r'test (t5_\w+) \.\.\. ok',log))
          if not tests <= passed:
              raise SystemExit(f'Missing x86 semantic validation tests: {sorted(tests-passed)}')
          if not re.search(r'T5_X86_SELECTED status=PASS kinds=18 widths=32,64,8,16 flags=6',log):
              raise SystemExit('No selected width/flags verification')
          if not re.search(r'T5_X86_NEGATIVE status=PASS flags_mutants=[1-9][0-9]* addressing_mutants=3',log):
              raise SystemExit('No x86 negative mutant verification')
          pairs=re.findall(r'T5_X86_NATIVE_FORMAT mode=(\w+) format=(\w+) status=PASS',log)
          if set(pairs)!={(mode,fmt) for mode in ('framed','frameless') for fmt in ('elf','gas')} or len(pairs)!=4:
              raise SystemExit('Native x86 ELF/GAS coverage incomplete')
          rows=[dict(scope='x86_selection_native', mode=m, format=f,
                     status='NATIVE_DIFFERENTIAL_PASS', smt_proven=False)
                for m,f in sorted(pairs)]
          pathlib.Path('x86-t5-semantics.jsonl').write_text(
              ''.join(json.dumps(r,sort_keys=True)+'\n' for r in rows))
          print('Validated 4 native x86 formats and independent negative controls')
          PY
      - name: Upload T5.5 native semantic evidence
        if: success() && steps.validated.outputs.cache-hit != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: x86-t5-semantics
          path: |
            x86-t5-semantics.jsonl
            ${{ runner.temp }}/x86-t5-semantics.log
          retention-days: 14
      - name: Mark revision validated
        if: steps.validated.outputs.cache-hit != 'true'
        run: echo "${{ steps.revision.outputs.sha }}" > .x86-selector-validated
      - name: Cache successful revision
        if: steps.validated.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .x86-selector-validated
          key: x86-selector-v4-${{ hashFiles('.github/workflows/x86-selector-validation.yml') }}-${{ steps.revision.outputs.sha }}
