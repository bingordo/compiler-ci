name: Validate compiler x86 selector
on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: 'Compiler branch, tag, or commit'
        required: false
        default: 'feature/x86-cost-inventory'
        type: string
  schedule:
    - cron: '7,22,37,52 * * * *'
permissions:
  contents: read
concurrency:
  group: x86-selector-validation
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Fetch private compiler source
        uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: ${{ inputs.source_ref || 'feature/x86-cost-inventory' }}
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Identify revision
        working-directory: compiler
        run: git rev-parse HEAD
      - name: Skip unchanged revision
        id: revision
        shell: bash
        working-directory: compiler
        run: |
          set -euo pipefail
          sha=$(git rev-parse HEAD)
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "source revision: $sha"
      - name: Check previously validated revision
        id: validated
        uses: actions/cache/restore@v4
        with:
          path: .x86-selector-validated
          key: x86-selector-v1-${{ steps.revision.outputs.sha }}
      - name: Test x86 Python tooling
        if: steps.validated.outputs.cache-hit != 'true'
        working-directory: compiler
        run: |
          python3 -m unittest discover -s tests -p 'test_x86_*.py' -v
          python3 tools/regen_x86_selector_patterns.py --check
          python3 tools/validate_x86_costs.py data/x86_costs_generic.json
          python3 tools/x86_form_inventory.py --json > /tmp/x86-inventory.json
      - name: Test x86 Rust backend
        if: steps.validated.outputs.cache-hit != 'true'
        working-directory: compiler
        run: cargo test -p compiler-backend-x86
      - name: Mark revision validated
        if: steps.validated.outputs.cache-hit != 'true'
        run: echo "${{ steps.revision.outputs.sha }}" > .x86-selector-validated
      - name: Cache successful revision
        if: steps.validated.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .x86-selector-validated
          key: x86-selector-v1-${{ steps.revision.outputs.sha }}
