name: Validate compiler x86 selector
on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: 'Compiler branch, tag, or commit'
        required: false
        default: 'main'
        type: string
  schedule:
    - cron: '7,22,37,52 * * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/x86-selector-validation.yml'
permissions:
  contents: read
concurrency:
  group: x86-selector-validation
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout CI workflow sources for versioned keys
        uses: actions/checkout@v4
      - name: Fetch private compiler source
        uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: ${{ inputs.source_ref || 'main' }}
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Identify revision
        working-directory: compiler
        run: git rev-parse HEAD
      - name: Skip unchanged revision
        id: revision
        shell: bash
        working-directory: compiler
        run: |
          set -euo pipefail
          sha=$(git rev-parse HEAD)
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "source revision: $sha"
      - name: Check previously validated revision
        id: validated
        uses: actions/cache/restore@v4
        with:
          path: .x86-selector-validated
          key: x86-selector-v4-${{ hashFiles('.github/workflows/x86-selector-validation.yml') }}-${{ steps.revision.outputs.sha }}
      - name: Test x86 Python tooling
        if: steps.validated.outputs.cache-hit != 'true'
        working-directory: compiler
        run: |
          # The generator's Python tests and tooling live on the experimental
          # pattern branch; main currently has no test_x86_*.py tests.
          if compgen -G 'tests/test_x86_*.py' > /dev/null; then
            python3 -m unittest discover -s tests -p 'test_x86_*.py' -v
          fi
          for script in validate_x86_selector_source.py regen_x86_selector_patterns.py validate_x86_costs.py x86_form_inventory.py; do
            if [ ! -f "tools/$script" ]; then
              echo "Skipping experimental generator tool $script (not on this ref)"
              continue
            fi
            case "$script" in
              regen_x86_selector_patterns.py) python3 "tools/$script" --check ;;
              validate_x86_costs.py) python3 "tools/$script" data/x86_costs_generic.json ;;
              x86_form_inventory.py) python3 "tools/$script" --json > /tmp/x86-inventory.json ;;
              *) python3 "tools/$script" ;;
            esac
          done
      - name: Test x86 Rust backend without private Oberon driver
        if: steps.validated.outputs.cache-hit != 'true'
        working-directory: compiler
        shell: bash
        run: |
          set -euo pipefail
          # Cargo resolves all workspace members, even when -p selects a backend.
          # Use an isolated temporary workspace containing only the backend's
          # local dependency closure; never edit the checked-out source.
          mkdir -p "$RUNNER_TEMP/x86-workspace/crates"
          for crate in ir opt backend backend-x86; do
            cp -a "crates/$crate" "$RUNNER_TEMP/x86-workspace/crates/$crate"
          done
          cat > "$RUNNER_TEMP/x86-workspace/Cargo.toml" <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir", "crates/opt", "crates/backend", "crates/backend-x86"]
          EOF
          cargo test --manifest-path "$RUNNER_TEMP/x86-workspace/Cargo.toml" -p compiler-backend-x86 \
            -- --nocapture --test-threads=1 2>&1 | tee "$RUNNER_TEMP/x86-all-backend-tests.log"
      - name: T5.5 audit 64-bit native C reference matrix
        if: steps.validated.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$RUNNER_TEMP/x86-all-backend-tests.log" <<'PY'
          import json,pathlib,re,sys
          log=pathlib.Path(sys.argv[1]).read_text(errors='replace')
          if not re.search(r'test typed_scalar_integer_operations_match_gcc_for_elf_and_gas \.\.\.',log):
              raise SystemExit('M4 i64 native C reference suite did not run')
          pairs=re.findall(r'T5_X86_I64_NATIVE_FORMAT mode=(\w+) format=(\w+) status=PASS',log)
          expected={(mode,fmt) for mode in ('framed','frameless') for fmt in ('gas','elf')}
          if len(pairs)!=4 or set(pairs)!=expected:
              raise SystemExit(f'Incomplete I64 ELF/GAS native reference matrix: {pairs}')
          rows=[dict(scope='x86_i64_native_differential',mode=mode,format=fmt,
                     status='NATIVE_DIFFERENTIAL_PASS',smt_proven=False,
                     source_sha='${{ steps.revision.outputs.sha }}')
                for mode,fmt in sorted(pairs)]
          pathlib.Path('x86-t5-i64-native.jsonl').write_text(
              ''.join(json.dumps(row,sort_keys=True)+'\n' for row in rows))
          print('Validated four I64 native GCC matrix variants')
          PY
      - name: T5.5 audit native signed and unsigned division/remainder traps
        if: steps.validated.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$RUNNER_TEMP/x86-all-backend-tests.log" <<'PY'
          import json,pathlib,re,sys
          log=pathlib.Path(sys.argv[1]).read_text(errors='replace')
          if not re.search(r'test scalar_division_traps_for_zero_divisors_and_signed_min_overflow \.\.\.',log):
              raise SystemExit('Native division trap regression test did not run')
          records=re.findall(
              r'T5_X86_DIV_TRAP_FORMAT mode=(\w+) format=(\w+) cases=(\d+) status=PASS',log
          )
          expected={(mode,fmt) for mode in ('framed','frameless') for fmt in ('gas','elf')}
          if len(records)!=4 or {(m,f) for m,f,_ in records} != expected:
              raise SystemExit(f'Incomplete native division trap matrix: {records}')
          if any(int(cases)!=12 for _,_,cases in records):
              raise SystemExit('Native division test did not check all 12 trap cases')
          rows=[dict(scope='x86_divide_trap_native',mode=m,format=f,
                     exceptional_cases=int(cases),status='NATIVE_DIFFERENTIAL_PASS',
                     smt_proven=False,source_sha='${{ steps.revision.outputs.sha }}')
                for m,f,cases in sorted(records)]
          pathlib.Path('x86-t5-i64-div-native.jsonl').write_text(
              ''.join(json.dumps(row,sort_keys=True)+'\n' for row in rows))
          print('Validated 4 native divide/remainder trap formats, 12 trap inputs each')
          PY
      - name: T5.5 audit physical flags liveness through 64-bit operations
        if: steps.validated.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$RUNNER_TEMP/x86-all-backend-tests.log" <<'PY'
          import json,pathlib,re,sys
          log=pathlib.Path(sys.argv[1]).read_text(errors='replace')
          if not re.search(r'test flags_survive_intervening_64_bit_arithmetic \.\.\.',log):
              raise SystemExit('No physical flags-liveness native regression executed')
          found=re.findall(
              r'T5_X86_FLAGS_NATIVE mode=(\w+) format=(\w+) predicates=(\d+) pairs=(\d+) status=PASS',
              log
          )
          expected={(mode,fmt) for mode in ('framed','frameless') for fmt in ('gas','elf')}
          if len(found)!=4 or {(m,f) for m,f,_,_ in found}!=expected:
              raise SystemExit('Incomplete x86 i64 physical-flags native matrix')
          if any((int(predicates),int(pairs))!=(10,81)
                 for _,_,predicates,pairs in found):
              raise SystemExit('Incomplete signed/unsigned flags predicate observations')
          rows=[dict(scope='x86_i64_materialized_flags_native',
                     mode=m,format=f,predicates=int(predicates),
                     input_pairs=int(pairs),status='NATIVE_DIFFERENTIAL_PASS',
                     smt_proven=False,source_sha='${{ steps.revision.outputs.sha }}')
                for m,f,predicates,pairs in sorted(found)]
          pathlib.Path('x86-t5-i64-flags-native.jsonl').write_text(
              ''.join(json.dumps(row,sort_keys=True)+'\n' for row in rows))
          print('Validated four i64 native RFLAGS clobber variants, 10 predicates, 81 pairs')
          PY
      - name: T5.5 verify selected physical flag provenance and negative controls
        if: steps.validated.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$RUNNER_TEMP/x86-all-backend-tests.log" <<'PY'
          import json,pathlib,re,sys
          log=pathlib.Path(sys.argv[1]).read_text(errors='replace')
          if not re.search(r'test t5_selected_physical_cmp_provenance_and_mutants \.\.\.',log):
              raise SystemExit('Physical flag-provenance test did not execute')
          result=re.findall(
              r'T5_X86_FLAG_PROVENANCE status=PASS consumers=(\d+) mutants=(\d+)',log
          )
          if result!=[('3','6')]:
              raise SystemExit(f'Physical CMP producer identity controls incomplete: {result}')
          pathlib.Path('x86-t5-physical-flags.jsonl').write_text(
              json.dumps(dict(
                  scope='selected_x86_physical_flag_provenance',
                  condition_consumers=3,negative_controls=6,
                  status='STRUCTURAL_VALIDATION_PASS',
                  smt_proven=False,
                  source_sha='${{ steps.revision.outputs.sha }}'),sort_keys=True)+'\n')
          print('Validated physical compare provenance with six negative controls')
          PY
      - name: T5.5 validate SSA-to-physical compare identity and mutants
        if: steps.validated.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$RUNNER_TEMP/x86-all-backend-tests.log" <<'PY'
          import json,pathlib,re,sys
          log=pathlib.Path(sys.argv[1]).read_text(errors='replace')
          if not re.search(r'test t5_ssa_to_physical_comparison_identity_and_mutants \.\.\.',log):
              raise SystemExit('SSA-to-physical comparison identity test did not run')
          results=re.findall(
              r'T5_X86_SSA_CMP_PROVENANCE status=PASS sites=(\d+) mutants=(\d+) fused_source_id=(\d+)',
              log
          )
          if results!=[('2','7','7')]:
              raise SystemExit(f'Incomplete SSA-to-physical comparison provenance: {results}')
          pathlib.Path('x86-t5-ssa-comparison.jsonl').write_text(
              json.dumps(dict(scope='selected_ssa_to_physical_comparison',
                              compare_sites=2,negative_controls=7,
                              fused_source_id_retained=True,
                              status='STRUCTURAL_VALIDATION_PASS',
                              smt_proven=False,
                              source_sha='${{ steps.revision.outputs.sha }}'),sort_keys=True)+'\n')
          print('Validated SSA-to-physical comparison operand/width and post-layout mutants')
          PY
      - name: T5.5 native selection semantics and negative controls
        if: steps.validated.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=10s 5m \
            cargo test --manifest-path "$RUNNER_TEMP/x86-workspace/Cargo.toml" \
              -p compiler-backend-x86 --test t5_x86_semantics -- --nocapture --test-threads=1 \
              2>&1 | tee "$RUNNER_TEMP/x86-t5-semantics.log"
          python3 - "$RUNNER_TEMP/x86-t5-semantics.log" <<'PY'
          import json, pathlib, re, sys
          log=pathlib.Path(sys.argv[1]).read_text(errors='replace')
          tests={
              't5_selected_cmp_flags_and_register_widths',
              't5_machine_negative_controls_are_detectable',
              't5_selected_native_elf_and_assembly_match_independent_c',
          }
          # --nocapture prints diagnostics between "test name ..." and
          # "ok" on a later line. Cargo's nonzero exit and summary enforce
          # success; here verify that each expected test actually executed.
          if not re.search(r'test result: ok\.\s+3 passed; 0 failed;',log):
              raise SystemExit('T5.5 test binary did not pass all three checks')
          passed=set(re.findall(r'test (t5_\w+) \.\.\.',log))
          if not tests <= passed:
              raise SystemExit(f'Missing x86 semantic validation tests: {sorted(tests-passed)}')
          if not re.search(r'T5_X86_SELECTED status=PASS kinds=18 widths=32,64,8,16 flags=6',log):
              raise SystemExit('No selected width/flags verification')
          if not re.search(r'T5_X86_NEGATIVE status=PASS flags_mutants=[1-9][0-9]* addressing_mutants=3',log):
              raise SystemExit('No x86 negative mutant verification')
          pairs=re.findall(r'T5_X86_NATIVE_FORMAT mode=(\w+) format=(\w+) status=PASS',log)
          if set(pairs)!={(mode,fmt) for mode in ('framed','frameless') for fmt in ('elf','gas')} or len(pairs)!=4:
              raise SystemExit('Native x86 ELF/GAS coverage incomplete')
          rows=[dict(scope='x86_selection_native', mode=m, format=f,
                     status='NATIVE_DIFFERENTIAL_PASS', smt_proven=False)
                for m,f in sorted(pairs)]
          pathlib.Path('x86-t5-semantics.jsonl').write_text(
              ''.join(json.dumps(r,sort_keys=True)+'\n' for r in rows))
          print('Validated 4 native x86 formats and independent negative controls')
          PY
      - name: Install Z3 for independent selected-op semantics
        if: steps.validated.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v z3 >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq --no-install-recommends z3
          fi
          z3 --version
      - name: T5.5 selected instruction SMT proofs and wrong-pattern controls
        if: steps.validated.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=10s 5m \
            cargo test --manifest-path "$RUNNER_TEMP/x86-workspace/Cargo.toml" \
              -p compiler-backend-x86 --test t5_x86_semantics \
              -- --ignored --nocapture --test-threads=1 \
              2>&1 | tee "$RUNNER_TEMP/x86-t5-smt.log"
          python3 - "$RUNNER_TEMP/x86-t5-smt.log" <<'PY'
          import json, pathlib, re, sys
          log=pathlib.Path(sys.argv[1]).read_text(errors='replace')
          expected_tests = {
              't5_selected_x86_symbolic_flags_widths_and_addresses',
              't5_selected_i64_scalar_smt_flags_shifts_casts',
              't5_selected_i64_division_result_and_trap_obligations',
          }
          for name in expected_tests:
              if not re.search(r'test '+name+r' \.\.\.',log):
                  raise SystemExit(f'Missing x86 SMT test: {name}')
          if not re.search(r'test result: ok\.\s+3 passed; 0 failed;',log):
              raise SystemExit('Z3 x86 semantic obligations did not pass')
          match=re.search(r'T5_X86_SMT status=PROVEN obligations=(\d+) mutants=(\d+)',log)
          if not match or (int(match[1]),int(match[2]))!=(16,5):
              raise SystemExit('Missing exact x86 SMT proof or negative controls')
          row=dict(scope='selected_x86_operation_semantics',smt_proven=True,
                   native_binary_formally_proven=False,proof_obligations=16,
                   mutant_counterexamples=5,
                   source_sha='${{ steps.revision.outputs.sha }}')
          pathlib.Path('x86-t5-smt.jsonl').write_text(json.dumps(row,sort_keys=True)+'\n')
          m64=re.search(r'T5_X86_I64_SMT status=PROVEN obligations=(\d+) mutants=(\d+)',log)
          if not m64 or (int(m64[1]),int(m64[2]))!=(23,5):
              raise SystemExit('Incomplete I64 selected-op proofs and negative controls')
          row64=dict(scope='selected_x86_i64_operation_semantics',smt_proven=True,
                     native_binary_formally_proven=False,proof_obligations=23,
                     mutant_counterexamples=5,
                     source_sha='${{ steps.revision.outputs.sha }}')
          pathlib.Path('x86-t5-i64-smt.jsonl').write_text(
              json.dumps(row64,sort_keys=True)+'\n')
          div=re.search(r'T5_X86_I64_DIV_SMT status=PROVEN obligations=(\d+) mutants=(\d+)',log)
          if not div or (int(div[1]),int(div[2]))!=(8,5):
              raise SystemExit('Missing 64-bit DIV/IDIV trap and result proof or negative controls')
          row_div=dict(scope='selected_x86_i64_division_semantics',
                       smt_proven=True,native_binary_formally_proven=False,
                       proof_obligations=8,mutant_counterexamples=5,
                       source_sha='${{ steps.revision.outputs.sha }}')
          pathlib.Path('x86-t5-i64-div-smt.jsonl').write_text(
              json.dumps(row_div,sort_keys=True)+'\n')
          print('Validated 16 I32, 23 I64 and 8 division SMT obligations with 15 mutants')
          PY
      - name: Upload T5.5 native semantic evidence
        if: success() && steps.validated.outputs.cache-hit != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: x86-t5-semantics
          path: |
            x86-t5-semantics.jsonl
            x86-t5-smt.jsonl
            x86-t5-i64-native.jsonl
            x86-t5-i64-smt.jsonl
            x86-t5-i64-div-native.jsonl
            x86-t5-i64-flags-native.jsonl
            x86-t5-physical-flags.jsonl
            x86-t5-ssa-comparison.jsonl
            x86-t5-i64-div-smt.jsonl
            ${{ runner.temp }}/x86-all-backend-tests.log
            ${{ runner.temp }}/x86-t5-semantics.log
          retention-days: 14
      - name: Preserve T5.5 semantic failures
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: x86-t5-semantics-failures
          path: |
            ${{ runner.temp }}/x86-t5-semantics.log
            ${{ runner.temp }}/x86-t5-smt.log
            ${{ runner.temp }}/x86-all-backend-tests.log
          if-no-files-found: ignore
          retention-days: 14
      - name: Mark revision validated
        if: steps.validated.outputs.cache-hit != 'true'
        run: echo "${{ steps.revision.outputs.sha }}" > .x86-selector-validated
      - name: Cache successful revision
        if: steps.validated.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .x86-selector-validated
          key: x86-selector-v4-${{ hashFiles('.github/workflows/x86-selector-validation.yml') }}-${{ steps.revision.outputs.sha }}
