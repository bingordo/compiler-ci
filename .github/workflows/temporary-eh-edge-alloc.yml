# Temporary exact-source generic EH allocator validation.
name: Machine edge-defined values and call clobbers
on:
  pull_request:
    paths: ['.github/workflows/temporary-eh-edge-alloc.yml']
permissions:
  contents: read
jobs:
  alloc:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      SOURCE_SHA: a45ad23a088eb8851658d30632b94470165b93e9
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: ${{ env.SOURCE_SHA }}
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Verify exact source and isolate native backend workspace
        run: |
          set -euo pipefail
          test "$(git -C compiler rev-parse HEAD)" = "$SOURCE_SHA"
          cat > compiler/Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir-macros", "crates/ir", "crates/backend", "crates/backend-x86", "crates/backend-aarch64"]
          EOF
          rm -f compiler/Cargo.lock
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: temporary-eh-shared-cfi
          cache-on-failure: true
      - name: Generic allocator and both native backend regressions
        working-directory: compiler
        run: |
          cargo test -p compiler-backend -p compiler-backend-x86 -p compiler-backend-aarch64 --lib
