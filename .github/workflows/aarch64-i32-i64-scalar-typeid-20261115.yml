name: AArch64 fixed TypeId I32 and I64 scalar input migration
on:
  push:
    branches: [verify/aarch64-i32-i64-scalar-typeid-20261115]
    paths: ['.github/workflows/aarch64-i32-i64-scalar-typeid-20261115.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 27a7e221653e1f0a255b35a5203b8f5599134d6a
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Verify exact compiler source
        run: test "$(git -C compiler rev-parse HEAD)" = "27a7e221653e1f0a255b35a5203b8f5599134d6a"
      - name: Restrict core workspace
        run: |
          cat > compiler/Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir", "crates/backend", "crates/backend-aarch64"]
          EOF
          rm -f compiler/Cargo.lock
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: aarch64-i32-i64-native-fixtures
      - name: Install AArch64 GNU C, glibc cross headers and QEMU
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends gcc-aarch64-linux-gnu libc6-dev-arm64-cross binutils-aarch64-linux-gnu qemu-user
      - name: Run original 44-graph scalar C11 QEMU ABI/trap/parity oracles
        working-directory: compiler
        env:
          COMPILER_REQUIRE_AARCH64_QEMU: "1"
        run: |
          cargo test -p compiler-backend-aarch64 --test modern_i32 --test i64_unsigned_div_rem --test i64_scalar_complete -- --nocapture
      - name: Validate neighboring ABI, native IR fixture parser and strict lint
        working-directory: compiler
        run: |
          cargo test -p compiler-backend-aarch64 --test ptr64_calls --test ctz_select_calls
          cargo test -p compiler-ir --test native_fixture_text --test native_module_text_v3
          cargo clippy -p compiler-backend-aarch64 --no-deps --test modern_i32 --test i64_unsigned_div_rem --test i64_scalar_complete -- -D warnings
