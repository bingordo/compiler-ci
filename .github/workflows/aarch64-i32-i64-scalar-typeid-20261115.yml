name: AArch64 fixed TypeId I32 and I64 scalar input migration
on:
  push:
    branches: [verify/aarch64-i32-i64-scalar-typeid-20261115]
    paths: ['.github/workflows/aarch64-i32-i64-scalar-typeid-20261115.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 9dab964c67ce0b6a6ec53d0075530a113cdd6fc9
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Verify exact compiler source
        run: test "$(git -C compiler rev-parse HEAD)" = "9dab964c67ce0b6a6ec53d0075530a113cdd6fc9"
      - name: Restrict core workspace
        run: |
          cat > compiler/Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir", "crates/backend", "crates/backend-aarch64"]
          EOF
          rm -f compiler/Cargo.lock
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: aarch64-i32-i64-native-fixtures
      - name: Export exact existing TypeId scalar function corpora
        working-directory: compiler
        run: |
          cargo test -p compiler-backend-aarch64 --test modern_i32 temporary_export_original_fixed_native_scalar_typeid -- --nocapture
          cargo test -p compiler-backend-aarch64 --test i64_unsigned_div_rem temporary_export_original_fixed_native_scalar_typeid -- --nocapture
          cargo test -p compiler-backend-aarch64 --test i64_scalar_complete temporary_export_original_fixed_native_scalar_typeid -- --nocapture
