name: Verify mergeable X1 Intel source slice
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-x86-x1-merge.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-x86-x1-merge
  cancel-in-progress: true
jobs:
  source-and-concrete:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out clean X1 integration branch
        uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: integration/x86-x1-pinned-semantics-20261102
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Record exact tested revision
        run: |
          sha="$(git rev-parse HEAD)"
          echo "X1 integration branch revision: $sha" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Install Z3
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq z3
          z3 --version
      - name: Verify reviewed Intel source hashes
        run: |
          set -euo pipefail
          python3 tools/fetch_x86_isl_subset.py /tmp/intel-isl
          python3 tools/import_intel_isl_subset.py /tmp/intel-isl
      - name: Run all extracted X1 tests with real pinned Intel source
        env:
          INTEL_ISL_DIR: /tmp/intel-isl
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tools -p 'test_import_intel_isl_subset.py' -v
          python3 -m unittest discover -s tools -p 'test_x86_semantics.py' -v
          python3 -m unittest discover -s tools -p 'test_x86_instruction_effects.py' -v
          python3 -m unittest discover -s tools -p 'test_x86_isl_interpreter.py' -v
          echo "X1 source-integrated tests passed with real pinned Intel XML" >> "$GITHUB_STEP_SUMMARY"
