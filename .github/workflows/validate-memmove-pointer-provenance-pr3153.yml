name: Validate source memmove pointer provenance PR3153
on:
  push:
    branches: [test/memmove-pointer-provenance-pr3153]
    paths: ['.github/workflows/validate-memmove-pointer-provenance-pr3153.yml']
permissions:
  contents: read
jobs:
  differential:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: ddf6045378ebfee38e601cd41b126333a37ef1b3
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Confirm source pinned exactly
        run: test "$(git -C compiler rev-parse HEAD)" = "ddf6045378ebfee38e601cd41b126333a37ef1b3"
      - name: Configure dependencies
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan github.com >> ~/.ssh/known_hosts
          git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: memmove-pointer-provenance-pr3153
      - name: Run GCC GAS and ELF source differential
        working-directory: compiler
        run: cargo test -p compiler --test native_lp64_disjoint_memmove -- --nocapture
      - name: Record pinned candidate
        if: always()
        run: |
          echo 'Pinned compiler source ddf6045378ebfee38e601cd41b126333a37ef1b3' >> "$GITHUB_STEP_SUMMARY"
