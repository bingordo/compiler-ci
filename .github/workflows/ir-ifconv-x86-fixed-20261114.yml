name: Fixed TypeId x86 if-conversion fixture migration
on:
  push:
    branches: [verify/ir-ifconv-x86-fixed-20261114]
    paths: ['.github/workflows/ir-ifconv-x86-fixed-20261114.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 39c21902925b8a8a5032fc77eb20dc41c658b10d
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Check exact source SHA
        run: test "$(git -C compiler rev-parse HEAD)" = "39c21902925b8a8a5032fc77eb20dc41c658b10d"
      - name: Restrict workspace
        run: |
          cat > compiler/Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir", "crates/opt", "crates/backend", "crates/backend-x86"]
          EOF
          rm -f compiler/Cargo.lock
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: ifconv-x86-fixtures
      - name: Validate migrated fixed TypeId x86 CMOV/pressure native oracles
        working-directory: compiler
        run: |
          cargo test -p compiler-opt --test if_conversion_typeid_x86 -- --nocapture
          cargo test -p compiler-opt --test if_conversion_typeid_multimerge --test typed_if_conversion_pure
          cargo test -p compiler-opt --test typed_pre_native --test ir_fixture_directives
          cargo test -p compiler-ir --test native_fixture_text --test native_module_text_v3
          cargo clippy -p compiler-opt --no-deps --test if_conversion_typeid_x86 -- -D warnings
