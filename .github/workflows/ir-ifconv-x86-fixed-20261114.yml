name: Fixed TypeId x86 if-conversion fixture migration
on:
  push:
    branches: [verify/ir-ifconv-x86-fixed-20261114]
    paths: ['.github/workflows/ir-ifconv-x86-fixed-20261114.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 40755fbbf7fc9c470d270625c609be60038894e6
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Check exact source SHA
        run: test "$(git -C compiler rev-parse HEAD)" = "40755fbbf7fc9c470d270625c609be60038894e6"
      - name: Restrict workspace
        run: |
          cat > compiler/Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir", "crates/opt", "crates/backend", "crates/backend-x86"]
          EOF
          rm -f compiler/Cargo.lock
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: ifconv-x86-fixtures
      - name: Export original TypeId x86 if-conversion graphs
        working-directory: compiler
        run: cargo test -p compiler-opt --test if_conversion_typeid_x86 temporary_export_exact_ifconv_x86_typeid_graphs -- --nocapture
