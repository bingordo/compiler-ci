name: C99 aggregate-member source pin native ELF GAS and unchanged musl census
on:
  pull_request:
    paths:
      - '.github/workflows/c99-aggregate-member-source.yml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/c99-aggregate-member-source.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pinned-aggregate-member-native-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
    steps:
      - name: Checkout exact integrated C99 aggregate declarator source
        uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: dea8ca6adcd200c59031aa4f2f43db08e2dfb210
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Checkout exact unchanged original upstream musl
        uses: actions/checkout@v4
        with:
          repository: ifduyue/musl
          ref: 7813e9119eb5fe681b6750b8a033a0490bca0941
          path: musl
          persist-credentials: false
      - name: Verify compiler and original musl pins plus updated Mini-C dependency
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C compiler rev-parse HEAD)" = dea8ca6adcd200c59031aa4f2f43db08e2dfb210
          test "$(git -C musl rev-parse HEAD)" = 7813e9119eb5fe681b6750b8a033a0490bca0941
          test "$(grep -c 'rev = "66a8d2420ffbd3838b6bca2c4954d1d28e6b88e8"' compiler/crates/driver/Cargo.toml)" -eq 2
          test "$(grep -c 'rev = "66a8d2420ffbd3838b6bca2c4954d1d28e6b88e8"' compiler/tools/mini-c-driver/Cargo.toml)" -eq 2
          git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
          rustc --version
          python3 -m py_compile compiler/tools/s23_full_upstream_tu_census.py
      - name: Reuse production Rust source compiler cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: c99-aggregate-checked-native-source
      - name: Compile GCC-differential C99 aggregate member source in native ELF and GAS
        shell: bash
        working-directory: compiler
        run: |
          set -euo pipefail
          cargo test --release -p compiler --test c99_aggregate_member_source -- --nocapture
      - name: Verify standalone Mini-C consumer resolves same checked syntax and semantic crates
        shell: bash
        run: |
          set -euo pipefail
          cargo check --manifest-path compiler/tools/mini-c-driver/Cargo.toml
      - name: Build exact release TypeId source compiler for original musl header census
        shell: bash
        run: |
          set -euo pipefail
          cargo build --release --manifest-path compiler/Cargo.toml -p compiler --bin compiler
      - name: Generate pinned native musl x86-64 headers and external preprocessor shim
        shell: bash
        run: |
          set -euo pipefail
          make -C musl ARCH=x86_64 obj/include/bits/alltypes.h obj/include/bits/syscall.h
          test -s musl/obj/include/bits/alltypes.h
          test -s musl/obj/include/bits/syscall.h
          git -C musl diff --exit-code
          mkdir -p cc-musl-wrapper results
          cat > cc-musl-wrapper/cc <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          exec /usr/bin/cc -nostdinc -D_XOPEN_SOURCE=700 \
            -I"${MUSL_HEADERS_ROOT}/arch/x86_64" \
            -I"${MUSL_HEADERS_ROOT}/arch/generic" \
            -I"${MUSL_HEADERS_ROOT}/obj/src/internal" \
            -I"${MUSL_HEADERS_ROOT}/src/include" \
            -I"${MUSL_HEADERS_ROOT}/src/internal" \
            -I"${MUSL_HEADERS_ROOT}/obj/include" \
            -I"${MUSL_HEADERS_ROOT}/include" \
            "$@"
          EOF
          chmod +x cc-musl-wrapper/cc
      - name: Retest all 27 unchanged upstream TUs without hiding rejected inputs
        shell: bash
        run: |
          set -euo pipefail
          export MUSL_HEADERS_ROOT="$PWD/musl"
          export PATH="$PWD/cc-musl-wrapper:$PATH"
          python3 -u compiler/tools/s23_full_upstream_tu_census.py \
            --musl-root musl \
            --compiler compiler/target/release/compiler \
            --compiler-sha dea8ca6adcd200c59031aa4f2f43db08e2dfb210 \
            --output results/c99-aggregate-unchanged-musl-native-headers.json \
            --rounds 3 --allow-empty-cohort \
            2>&1 | tee results/c99-aggregate-unchanged-musl-native-headers.log
          python3 -c 'import json; r=json.load(open("results/c99-aggregate-unchanged-musl-native-headers.json")); assert r["attempted"]==27 and r["accepted"]+r["rejected"]==27'
          grep '^S2339_SUMMARY ' results/c99-aggregate-unchanged-musl-native-headers.log | tee -a "$GITHUB_STEP_SUMMARY"
          git -C musl diff --exit-code
      - name: Strict driver C99 integration test Clippy
        shell: bash
        working-directory: compiler
        run: |
          set -euo pipefail
          cargo clippy -p compiler --test c99_aggregate_member_source -- -D warnings
      - name: Preserve all original musl success/failure diagnostics and codegen stats
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: c99-aggregate-unchanged-musl-census
          path: results/
          if-no-files-found: warn
          retention-days: 30
