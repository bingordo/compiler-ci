# TEMP source-pinned FP TypeId staging acceptance. Never merge into compiler-ci main.
name: TEMP TypeId direct indirect SSE varargs ABI integration
on:
  push:
    branches: [ci/fp-typeid-sse-varargs-20261116]
    paths: [.github/workflows/fp-typeid-mixed-eight-xmm-20261115.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fp-typeid-abi:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      SOURCE_SHA: 6025f9e51d36a7aca299c2842910a5864a28594d
      CARGO_INCREMENTAL: '0'
    steps:
      - name: Checkout exact compiler FP source
        uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 6025f9e51d36a7aca299c2842910a5864a28594d
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Verify SHA and limit workspace to shared native crates
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C compiler rev-parse HEAD)" = "$SOURCE_SHA"
          cat > compiler/Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir", "crates/opt", "crates/backend", "crates/backend-x86", "crates/backend-aarch64", "crates/backend-riscv64", "crates/backend-wasm"]
          EOF
          rm -f compiler/Cargo.lock
          rustc --version
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: fp-typeid-sse-varargs-20261116
      - name: Native TypeId direct and indirect SSE variadics codec prototypes
        working-directory: compiler
        run: cargo test -p compiler-ir --test native_fp_opcode_roundtrip typed_fp_direct_indirect_variadics_roundtrip_and_fail_closed -- --nocapture
      - name: End to end TypeId C varargs direct and indirect GCC va_arg ELF GAS
        working-directory: compiler
        run: cargo test -p compiler-backend-x86 --lib typeid_fp_variadics_direct_indirect_gcc_va_arg_oracle -- --nocapture
      - name: Scalar variadic F32 promotions AL and atomically rejected pointers
        working-directory: compiler
        run: cargo test -p compiler-backend-x86 --lib scalar_variadics_promote_f32_set_al_and_reject_invalid_slots_atomically -- --nocapture
      - name: Scalar variadic GCC va_arg 16 mixed GP SSE arguments direct indirect ELF GAS
        working-directory: compiler
        run: cargo test -p compiler-backend-x86 --lib scalar_variadics_gcc_va_arg_mixed_overflow_direct_indirect_elf_gas -- --nocapture
      - name: TypeId mixed GP XMM sixteen direct-call ABI GCC ELF GAS
        working-directory: compiler
        run: cargo test -p compiler-backend-x86 --lib typeid_fp_mixed_sixteen_arg_call_gcc_abi -- --nocapture
      - name: Typed indirect mixed GP XMM target slot disjointness tests
        working-directory: compiler
        run: cargo test -p compiler-backend-x86 --lib typed_indirect_mixed_scalar_call_validates_target_atomically -- --nocapture
      - name: Typed FP indirect function pointer TypeId codec and signature gate
        working-directory: compiler
        run: cargo test -p compiler-ir --test native_fp_opcode_roundtrip typed_scalar_indirect_fp_call_text_binary_and_prototype -- --nocapture
      - name: Typed FP indirect GCC F32 F64 code-pointer oracle (ELF and GAS)
        working-directory: compiler
        run: cargo test -p compiler-backend-x86 --lib typeid_fp_typed_indirect_call_gcc_oracle -- --nocapture
      - name: Native FP TypeId direct call exact text binary prototypes
        working-directory: compiler
        run: cargo test -p compiler-ir --test native_fp_opcode_roundtrip exact_fp_direct_call_text_binary_and_declared_prototype -- --nocapture
      - name: Native FP TypeId external calls preserve live XMM through GCC ELF GAS
        working-directory: compiler
        run: cargo test -p compiler-backend-x86 --lib typeid_fp_direct_calls_preserve_live_xmm_gcc_oracle -- --nocapture
      - name: Mixed fixed SysV GP XMM overflow and return GCC ELF GAS
        working-directory: compiler
        run: cargo test -p compiler-backend-x86 --lib fixed_mixed_scalar_call -- --nocapture
      - name: Native TypeId FP F32 F64 pointer load store GCC oracle
        working-directory: compiler
        run: cargo test -p compiler-backend-x86 --lib typeid_fp_pointer_load_store_gcc_oracle -- --nocapture
      - name: Exact FP-to-GP32 CVTTSS2SI CVTTSD2SI bytes and GAS
        working-directory: compiler
        run: cargo test -p compiler-backend-x86 --lib exact_cvttss2si_cvttsd2si_indefinite_bytes_and_gas
      - name: TypeId explicit FP-to-i32 indefinite GCC oracle
        working-directory: compiler
        run: cargo test -p compiler-backend-x86 --lib typeid_fp_to_signed_i32_indefinite_gcc_oracle -- --nocapture
      - name: Exact signed GP32 CVTSI2SS/CVTSI2SD SSE2 bytes and GAS
        working-directory: compiler
        run: cargo test -p compiler-backend-x86 --lib exact_cvtsi2ss_cvtsi2sd_signed_i32_bytes_and_gas
      - name: TypeId mixed GP32 XMM signed i32 to F32 F64 GCC oracle
        working-directory: compiler
        run: cargo test -p compiler-backend-x86 --lib typeid_fp_signed_i32_to_scalar_gcc_oracle -- --nocapture
      - name: Exact SSE2 CVTSS2SD CVTSD2SS encoding and GAS forms
        working-directory: compiler
        run: cargo test -p compiler-backend-x86 --lib exact_cvtss2sd_cvtsd2ss_bytes_and_gas
      - name: TypeId F32 F64 conversion GCC C numerical differential
        working-directory: compiler
        run: cargo test -p compiler-backend-x86 --lib typeid_fp_f32_f64_convert_gcc_oracle -- --nocapture
      - name: Exact UCOMISS UCOMISD encoding and GAS cross-check
        working-directory: compiler
        run: cargo test -p compiler-backend-x86 --lib exact_ucomi_bytes_and_gas_agree_across_sse_widths
      - name: TypeId F32 F64 all 14 ordered unordered GCC C oracle
        working-directory: compiler
        run: cargo test -p compiler-backend-x86 --lib typeid_fp_all_ieee_predicates_gcc_oracle -- --nocapture
      - name: TypeId FP ninth through sixteenth stack-argument ABI GCC oracle
        working-directory: compiler
        run: cargo test -p compiler-backend-x86 --lib typeid_fp_staged_stack_argument_abi_oracle -- --nocapture
      - name: Staged shared-machine TypeId FP physical ELF GAS API
        working-directory: compiler
        run: cargo test -p compiler-backend-x86 --lib typeid_fp_explicit_shared_machine_emitter_elf_gas -- --nocapture
      - name: FP TypeId CFG phi swap and bit payload ELF GAS runtime
        working-directory: compiler
        run: cargo test -p compiler-backend-x86 --lib typeid_fp_cfg_phi_swap_and_payload_through_existing_xmm -- --nocapture
      - name: New eight-XMM mixed F32/F64 ABI integration test
        working-directory: compiler
        run: cargo test -p compiler-backend-x86 --lib typeid_scalar_fp_mixed_eight_xmm_argument_oracle -- --nocapture
      - name: Existing staged TypeId FP XMM executable and rejection tests
        working-directory: compiler
        run: cargo test -p compiler-backend-x86 --lib typeid_scalar_fp -- --nocapture
      - name: Seeded F32/F64 arithmetic versus GCC C reference
        working-directory: compiler
        run: cargo test -p compiler-backend-x86 --lib typeid_fp_arithmetic_seeded_gcc_reference -- --nocapture
      - name: TypeId FP semantics and codec regression
        working-directory: compiler
        run: |
          set -euo pipefail
          cargo test -p compiler-ir --test native_fp_scalar_reference
          cargo test -p compiler-ir --test native_fp_opcode_roundtrip
      - name: Backend all-target compatibility
        working-directory: compiler
        run: |
          set -euo pipefail
          cargo check -p compiler-backend-x86 -p compiler-backend-aarch64 -p compiler-backend-riscv64 -p compiler-backend-wasm --all-targets
          # Main currently has unrelated Clippy all-targets source_provenance.rs
          # cloned_ref_to_slice_refs warnings; keep strict checks on changed libs.
          cargo clippy -p compiler-ir -p compiler-opt --lib -- -D warnings
          cargo test -p compiler-ir --lib
          cargo test -p compiler-opt --lib
          cargo test -p compiler-backend-x86 --lib
