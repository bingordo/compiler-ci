# TEMP source-pinned FP TypeId staging acceptance. Never merge into compiler-ci main.
name: TEMP TypeId FP eight XMM argument oracle
on:
  push:
    branches: [ci/fp-typeid-mixed-eight-xmm-20261115]
    paths: [.github/workflows/fp-typeid-mixed-eight-xmm-20261115.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fp-typeid-abi:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      SOURCE_SHA: aa143910f8aca6d214418eb92c3d4443082e10dd
      CARGO_INCREMENTAL: '0'
    steps:
      - name: Checkout exact compiler FP source
        uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: aa143910f8aca6d214418eb92c3d4443082e10dd
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Verify SHA and limit workspace to shared native crates
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C compiler rev-parse HEAD)" = "$SOURCE_SHA"
          cat > compiler/Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir", "crates/opt", "crates/backend", "crates/backend-x86", "crates/backend-aarch64", "crates/backend-riscv64", "crates/backend-wasm"]
          EOF
          rm -f compiler/Cargo.lock
          rustc --version
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: fp-typeid-eight-xmm-20261115
      - name: FP TypeId CFG phi swap and bit payload ELF GAS runtime
        working-directory: compiler
        run: cargo test -p compiler-backend-x86 --lib typeid_fp_cfg_phi_swap_and_payload_through_existing_xmm -- --nocapture
      - name: New eight-XMM mixed F32/F64 ABI integration test
        working-directory: compiler
        run: cargo test -p compiler-backend-x86 --lib typeid_scalar_fp_mixed_eight_xmm_argument_oracle -- --nocapture
      - name: Existing staged TypeId FP XMM executable and rejection tests
        working-directory: compiler
        run: cargo test -p compiler-backend-x86 --lib typeid_scalar_fp -- --nocapture
      - name: Seeded F32/F64 arithmetic versus GCC C reference
        working-directory: compiler
        run: cargo test -p compiler-backend-x86 --lib typeid_fp_arithmetic_seeded_gcc_reference -- --nocapture
      - name: TypeId FP semantics and codec regression
        working-directory: compiler
        run: |
          set -euo pipefail
          cargo test -p compiler-ir --test native_fp_scalar_reference
          cargo test -p compiler-ir --test native_fp_opcode_roundtrip
      - name: Backend all-target compatibility
        working-directory: compiler
        run: |
          set -euo pipefail
          cargo check -p compiler-backend-x86 -p compiler-backend-aarch64 -p compiler-backend-riscv64 -p compiler-backend-wasm --all-targets
          cargo clippy -p compiler-ir --all-targets -- -D warnings
