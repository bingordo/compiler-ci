name: ABI x86 target-owned GP argument mapping (compiler #1708)
on:
  push:
    branches: [main]
    paths: ['.github/workflows/verify-abi-x86-gp-target-20261115.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  abi-x86:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 5679f65339fa80f88d4ef57e66141d2372f0f915
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Verify exact candidate SHA
        working-directory: compiler
        run: |
          test "$(git rev-parse HEAD)" = 5679f65339fa80f88d4ef57e66141d2372f0f915
      - name: Restrict workspace to original core crates
        run: |
          cat > compiler/Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir", "crates/opt", "crates/backend", "crates/backend-x86"]
          EOF
          rm -f compiler/Cargo.lock
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: x86-abi-target-20261115
      - name: Install native debugging oracle used by existing backend tests
        run: sudo apt-get update -qq && sudo apt-get install -y -qq gdb
      - name: x86 staged, scalar and native ABI regression tests
        working-directory: compiler
        run: |
          set -euo pipefail
          cargo test -p compiler-backend-x86 --lib
          cargo test -p compiler-backend-x86 --tests
          cargo test -p compiler-ir -p compiler-backend
      - name: Reject new compiler-backend-x86 warnings
        working-directory: compiler
        run: cargo clippy -p compiler-backend-x86 --all-targets -- -D warnings
