name: Validate Mini-C streaming preprocessor sink
on:
  push:
    branches: [ci/validate-mini-c-streaming-sink-p1]
    paths:
      - '.github/workflows/validate-mini-c-streaming-sink-p1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sink:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact Mini-C streaming branch commit
        uses: actions/checkout@v4
        with:
          repository: bingordo/mini-c
          ref: 55d56d37b598d59a201a2da0db1239c28e5b6a12
          path: mini-c
          persist-credentials: false
      - name: Print source version
        run: git -C mini-c rev-parse HEAD
      - name: Test parser pull-token source, scoped typedef and two-token lookahead
        working-directory: mini-c
        run: |
          set -euo pipefail
          cargo test -p mini-c-syntax pull_token_source
          cargo test -p mini-c-syntax parser_owned_token_source
          cargo test -p mini-c-syntax parser_releases_shared_spellings
          cargo test -p mini-c-syntax
          cargo clippy -p mini-c-syntax --all-targets -- -D warnings

      - name: Test sink parity and fail-closed output budgets
        working-directory: mini-c
        run: |
          set -euo pipefail
          # The independent standalone vendor test suite also has system
          # header and formatting fixtures that are not configured by the
          # root Mini-C workspace. Run the changed code and its budget
          # regressions here, then the full supported adapter integration.
          cargo test --manifest-path vendor/rcc_preprocess/Cargo.toml --lib output_sink
          cargo test --manifest-path vendor/rcc_preprocess/Cargo.toml --lib macro_free_long_region
          cargo test --manifest-path vendor/rcc_preprocess/Cargo.toml --lib macro_generated_open_paren
          cargo test --manifest-path vendor/rcc_preprocess/Cargo.toml --lib chunked_macro_free_region
          cargo test --manifest-path vendor/rcc_preprocess/Cargo.toml --lib source_context_sink
          cargo test --manifest-path vendor/rcc_preprocess/Cargo.toml --lib lazy_input_scanner
          cargo test --manifest-path vendor/rcc_preprocess/Cargo.toml --lib nested_include_sink
          cargo test --manifest-path vendor/rcc_preprocess/Cargo.toml --lib streaming_nested_includes
          cargo test --manifest-path vendor/rcc_preprocess/Cargo.toml --lib guard::tests
          cargo test --manifest-path vendor/rcc_preprocess/Cargo.toml --lib detect_pragma_once
          cargo test --manifest-path vendor/rcc_preprocess/Cargo.toml --lib pragma_once_skipped

          cargo test --manifest-path vendor/rcc_preprocess/Cargo.toml --lib accumulated_output_buffer_limit
          cargo test --manifest-path vendor/rcc_preprocess/Cargo.toml --lib output_budget_counts_included_header
      - name: Test bounded internal CPP producer, late errors and cancellation
        working-directory: mini-c
        run: cargo test -p mini-c-preprocess --features internal-rcc stream::tests

      - name: Test internal Mini-C preprocessor integration and GCC/Clang token oracle
        working-directory: mini-c
        run: cargo test -p mini-c-preprocess --features internal-rcc
      - name: Verify production adapter streaming source and origin regressions
        working-directory: mini-c
        run: |
          cargo test -p mini-c-preprocess --features internal-rcc internal_adapter_consumes_many_macro_free_chunks
          cargo test -p mini-c-preprocess --features internal-rcc line_directives_preserve_virtual_filenames
          cargo test -p mini-c-preprocess --features internal-rcc preprocessor_errors_respect_line_directive_overrides
          cargo test -p mini-c-preprocess --features internal-rcc rejects_invalid_directives_without_returning_partial_source
      - name: Check bounded internal CPP directly into syntax and sema
        working-directory: mini-c
        run: |
          set -euo pipefail
          cargo test -p mini-c --features internal-cpp opt_in_bounded_cpp_pipe
          cargo clippy -p mini-c --all-targets --features internal-cpp -- -D warnings
          cargo run -q -p mini-c --features internal-cpp -- check \
            --cpp=internal-stream -D_GNU_SOURCE tests/fixtures/glibc-s12/hello_stdio.c

      - name: Bootstrap-scale 68 MiB streaming CPP checker and peak RSS
        working-directory: mini-c
        timeout-minutes: 12
        run: |
          set -euo pipefail
          cargo build -q -p mini-c --features internal-cpp
          python3 - <<'PY'
          from pathlib import Path
          import os
          root = Path(os.environ["RUNNER_TEMP"]) / "generated-68mib.c"
          target = 68 * 1024 * 1024
          with root.open("wb") as out:
              out.write(b"#define ADD1(x) ((x)+1)\n")
              for i in range(12000):
                  out.write(f"int generated_{i} = ADD1({i});\n".encode())
              out.write(b"/*")
              remaining = target - out.tell() - len(b"*/\nint final_value = ADD1(41);\n")
              chunk = b"x" * (1024 * 1024)
              while remaining > 0:
                  n = min(remaining, len(chunk))
                  out.write(chunk[:n])
                  remaining -= n
              out.write(b"*/\nint final_value = ADD1(41);\n")
          assert root.stat().st_size == target, root.stat().st_size
          print(f"Generated valid C input: {root.stat().st_size:,} bytes")
          PY
          # Legacy mode must retain its existing defensive 16 MiB failure.
          if target/debug/mini-c check --cpp=internal -nostdinc "$RUNNER_TEMP/generated-68mib.c" \
              >"$RUNNER_TEMP/legacy-output.txt" 2>&1; then
            echo "ERROR: legacy 16 MiB cap unexpectedly disabled"
            exit 1
          fi
          grep -q 'source byte limit exceeded' "$RUNNER_TEMP/legacy-output.txt"
          # Streamed mode must parse the entire 68 MiB file, including the
          # final declaration after the long source comment.
          timeout --signal=TERM --kill-after=10s 360s \
            /usr/bin/time -f 'Elapsed seconds: %e; Peak RSS KiB: %M' \
            -o "$RUNNER_TEMP/stream-68mib-metrics.txt" \
            target/debug/mini-c check --cpp=internal-stream -nostdinc \
              "$RUNNER_TEMP/generated-68mib.c"
          echo '### 68 MiB generated C streaming checker benchmark' >> "$GITHUB_STEP_SUMMARY"
          cat "$RUNNER_TEMP/stream-68mib-metrics.txt" >> "$GITHUB_STEP_SUMMARY"
          echo 'Generated workload: 12,000 macro-expanded global initializers plus a long source comment.' >> "$GITHUB_STEP_SUMMARY"
      - name: Mini-C parser and Cranelift internal CPP integration
        working-directory: mini-c
        run: |
          set -euo pipefail
          cargo test -p mini-c -p mini-c-cranelift --features internal-cpp
          source=tests/fixtures/glibc-s12/hello_stdio.c
          cargo run -q -p mini-c --features internal-cpp -- check --cpp=internal -D_GNU_SOURCE "$source"
          cargo run -q -p mini-c-cranelift --features internal-cpp -- \
            --emit-obj "$RUNNER_TEMP/stream-cpp-hello.o" --cpp=internal -D_GNU_SOURCE "$source"
          cc "$RUNNER_TEMP/stream-cpp-hello.o" -o "$RUNNER_TEMP/stream-cpp-hello"
          "$RUNNER_TEMP/stream-cpp-hello" > "$RUNNER_TEMP/stream-cpp-hello.actual"
          printf 'Hello, world!\n' > "$RUNNER_TEMP/stream-cpp-hello.expected"
          cmp "$RUNNER_TEMP/stream-cpp-hello.expected" "$RUNNER_TEMP/stream-cpp-hello.actual"
      - name: Strict check of changed preprocessor crate
        working-directory: mini-c
        run: cargo clippy --manifest-path vendor/rcc_preprocess/Cargo.toml --all-targets -- -D warnings
