# Ephemeral source-pinned BT4 24-CFG acceptance. Close PR unmerged.
name: BT4 audited twenty-four CFG TypeId native oracles
on:
  pull_request:
    paths:
      - '.github/workflows/ir-bt4-cfg24-pr1665.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-cfg:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      CARGO_INCREMENTAL: '0'
      SOURCE_SHA: 8e147edb726ba7c3bcb4d54446ff43680a186237
    steps:
      - name: Checkout exact compiler candidate
        uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 8e147edb726ba7c3bcb4d54446ff43680a186237
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Verify SHA and isolate core workspace
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C compiler rev-parse HEAD)" = "$SOURCE_SHA"
          cat > compiler/Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir", "crates/opt", "crates/backend", "crates/backend-x86"]
          EOF
          rm -f compiler/Cargo.lock
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: ir-bt4-cfg24
      - name: Original 24 generated CFG/phi C oracles in GAS and ELF framed/frameless
        working-directory: compiler
        run: cargo test -p compiler-backend-x86 --test typed_generated_cfg_native -- --nocapture
      - name: Adjacent phi loop memory and backend oracles
        working-directory: compiler
        run: |
          set -euo pipefail
          cargo test -p compiler-backend-x86 --test x4_cfg_pressure_native --test typed_alias_calls_native --test native_typeid_direct --test bt2b_typeid_index_pressure_native --test rbp_alloc_native
      - name: Affected crates all-target check
        working-directory: compiler
        run: cargo check -p compiler-ir -p compiler-backend -p compiler-backend-x86 --all-targets
      - name: Strict migrated test lint
        working-directory: compiler
        run: cargo clippy -p compiler-backend-x86 --test typed_generated_cfg_native -- -D warnings
