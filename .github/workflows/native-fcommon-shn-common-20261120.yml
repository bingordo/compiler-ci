name: Native checked -fcommon SHN_COMMON ELF
on:
  push:
    branches: [ci/native-fcommon-shn-common-20261120]
    paths: ['.github/workflows/native-fcommon-shn-common-20261120.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  common:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      SOURCE_SHA: 9c9479ad906637bc5d52f1f32bc84a5362071cc5
      CARGO_INCREMENTAL: '0'
      CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 9c9479ad906637bc5d52f1f32bc84a5362071cc5
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Exact compiler source SHA and pinned frontend public checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C compiler rev-parse HEAD)" = "$SOURCE_SHA"
          git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: native-fcommon-shn-common
      - name: Compile shared backend/x86 and source driver
        working-directory: compiler
        run: |
          cargo check -p compiler-backend -p compiler-backend-x86
          cargo check -p compiler --bin compiler
      - name: Native SHN_COMMON/strong and system-GCC differential linkage
        working-directory: compiler
        run: cargo test -p compiler --test native_fcommon_elf -- --nocapture
      - name: Existing native ELF and LTO weak/common regression
        working-directory: compiler
        run: |
          cargo test -p compiler --test lto_prevailing_weak_strong
          cargo test -p compiler --test lto_elf_visibility
          cargo test -p compiler --test lto_coemit
      - name: Shared ELF and x86 physical backend unit regressions
        working-directory: compiler
        run: |
          cargo test -p compiler-backend --lib
          cargo test -p compiler-backend-x86 --lib
      - name: Strict scoped backend Clippy
        working-directory: compiler
        run: cargo clippy -p compiler-backend --lib -- -D warnings
