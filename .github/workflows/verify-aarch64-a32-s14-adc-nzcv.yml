name: AArch64 S14 exact-source carry NZCV reference oracle
on:
  pull_request:
    paths:
      - '.github/workflows/verify-aarch64-a32-s14-adc-nzcv.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pinned-oracle:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 1b1cc8ea8a53f127f3326de4fdc5553048307402
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Verify original source commit and AArch64 Python suite
        run: |
          set -euo pipefail
          test "$(git -C compiler rev-parse HEAD)" = 1b1cc8ea8a53f127f3326de4fdc5553048307402
          python3 -m unittest discover -s compiler/tools -p 'test_aarch64*.py' -v
          python3 -m py_compile compiler/tools/aarch64_a32_adc_semantics.py compiler/tools/test_aarch64_a32_adc_semantics.py
          python3 compiler/tools/regen_aarch64_native_selector_rules.py --check
          python3 compiler/tools/regen_aarch64_scalar_gp_forms.py --check
