name: Source-pinned ARM64 sixteen incoming mixed arguments review 689
on:
  push:
    branches: [review/aarch64-16-incoming-two-calls-689]
    paths: ['.github/workflows/review-aarch64-16-incoming-two-calls-689.yml']
  pull_request:
    paths: ['.github/workflows/review-aarch64-16-incoming-two-calls-689.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Checkout exact compiler PR source
        uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 17610faf1d5fdb3e71c6b88a57f3b2d43cda4040
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Pin check and native host
        run: |
          set -euo pipefail
          test "$(git -C compiler rev-parse HEAD)" = "17610faf1d5fdb3e71c6b88a57f3b2d43cda4040"
          test "$(uname -m)" = "aarch64"
          command -v gcc
      - uses: dtolnay/rust-toolchain@stable
      - name: Isolate core workspace
        working-directory: compiler
        run: |
          python3 - <<'PY'
          from pathlib import Path
          Path('Cargo.toml').write_text("""[workspace]
          resolver = "2"
          members = ["crates/ir", "crates/opt", "crates/backend", "crates/backend-x86", "crates/backend-aarch64"]
          """)
          PY
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: review-689-aarch64-16incoming
      - name: New sixteen incoming mixed ABI large-frame C11 and physical regression
        working-directory: compiler
        run: cargo test -p compiler-opt --test review_aarch64_16incoming_two_calls -- --nocapture
      - name: Prior two-wide-call and physical outgoing controls
        working-directory: compiler
        run: cargo test -p compiler-opt --test review_aarch64_two_wide_call_frame -- --nocapture
      - name: Existing native AArch64 mixed ABI and high-pressure controls
        working-directory: compiler
        run: |
          set -euo pipefail
          cargo test -p compiler-backend-aarch64 --test typeid_abi_calls_native -- --nocapture
          cargo test -p compiler-backend-aarch64 --test typeid_historical_pressure -- --nocapture
      - name: Strict IR opt backend and ARM64 Clippy
        working-directory: compiler
        run: |
          set -euo pipefail
          cargo clippy -p compiler-ir -p compiler-opt -p compiler-backend -p compiler-backend-aarch64 --lib -- -D warnings
          cargo clippy -p compiler-opt --test review_aarch64_16incoming_two_calls -- -D warnings
