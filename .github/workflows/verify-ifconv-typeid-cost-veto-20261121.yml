name: Validate TypeId if-conversion policy veto (compiler #2573)
on:
  push:
    branches: [verify/ifconv-typeid-cost-veto-20261121]
    paths: ['.github/workflows/verify-ifconv-typeid-cost-veto-20261121.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ifconv-veto-${{ github.ref }}
  cancel-in-progress: true
jobs:
  source-pinned-ifconv:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 2d0a2763d7d81c34705e4a00461e032d46ee5e26
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Verify exact compiler source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C compiler rev-parse HEAD)" = "2d0a2763d7d81c34705e4a00461e032d46ee5e26"
          git -C compiler rev-parse HEAD | tee -a "$GITHUB_STEP_SUMMARY"
          rustc --version | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Isolate TypeId optimizer and native x86 test dependencies
        shell: bash
        run: |
          cat > compiler/Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir", "crates/opt", "crates/backend", "crates/backend-x86"]
          EOF
          rm -f compiler/Cargo.lock
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: typeid-ifconv-veto
      - name: TypeId regression, independent scalar and machine oracles
        working-directory: compiler
        shell: bash
        run: |
          set -euo pipefail
          cargo test -p compiler-opt --lib
          cargo test -p compiler-opt --test typed_if_conversion_native
          cargo test -p compiler-opt --test typed_if_conversion_pure
          # Historical tests if_conversion_typeid_x86/multimerge still import
          # removed backend-x86::native_typeid; separate baseline migration.
      - name: Strict optimizer Clippy for library and changed integration test
        working-directory: compiler
        run: |
          cargo clippy -p compiler-opt --lib -- -D warnings
          cargo clippy -p compiler-opt --test typed_if_conversion_native -- -D warnings
