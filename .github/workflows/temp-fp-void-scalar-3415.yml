name: TEMP AArch64 FP effects and scalar return ABI
on:
  pull_request:
    paths:
      - '.github/workflows/temp-fp-void-scalar-3415.yml'
permissions:
  contents: read
jobs:
  a64-fp-call:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 62a0cb6b862e62061aa9014b5b61561fc1337701
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Verify exact source SHA
        working-directory: compiler
        run: test "$(git rev-parse HEAD)" = "62a0cb6b862e62061aa9014b5b61561fc1337701"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Isolate AArch64 backend workspace
        run: |
          set -euo pipefail
          mkdir -p a64/crates
          cp -a compiler/crates/ir compiler/crates/backend compiler/crates/backend-aarch64 a64/crates/
          cat > a64/Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir","crates/backend","crates/backend-aarch64"]
          EOF
      - name: Native F32 F64 void, pointer and I64 return memory oracles
        working-directory: a64
        run: cargo test -p compiler-backend-aarch64 --test typeid_fp_memory_native -- --nocapture
      - name: Warnings denied backend and test build
        working-directory: a64
        run: RUSTFLAGS="-D warnings" cargo check -p compiler-backend-aarch64 --all-targets
