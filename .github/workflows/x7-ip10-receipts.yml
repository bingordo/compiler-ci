name: X7 IP10g real optimized physical A/B corpus
on:
  pull_request:
    paths:
      - '.github/workflows/x7-ip10-receipts.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  x7-ip10:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: e9f9092b6e87ba2e01a53c1458d6f24f579dab8
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 265a0d42f382d400a9eae36cc231b1475a26961b
          path: compiler-base
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Verify compiler source pin
        run: |
          set -euo pipefail
          test "$(git -C compiler rev-parse HEAD)" = "e9f9092b6e87ba2e01a53c1458d6f24f579dab8"
          rustc --version
          cargo --version
          git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
          git config --global --add url."https://github.com/".insteadOf "git@github.com:"
      - name: Focused IP10 admission receipt tests
        run: |
          set -euo pipefail
          cd compiler
          cargo test -p compiler-backend-x86 --lib ip10_decision_receipt_tests -- --nocapture
      - name: Focused native physical A/B tests
        run: |
          set -euo pipefail
          cd compiler
          cargo test -p compiler-backend-x86 --lib --features x7-typeid-source-dag-optin x7_ip10_allocation_ab -- --nocapture
      - name: Focused native encoded byte A/B tests
        run: |
          set -euo pipefail
          cd compiler
          cargo test -p compiler-backend-x86 --lib --features x7-typeid-source-dag-optin x7_ip10_encoded_ab -- --nocapture
      - name: ADD OR XOR native GNU-as/direct-ELF C11 baseline parity
        run: |
          set -euo pipefail
          cd compiler
          cargo test -p compiler-backend-x86 --lib --features x7-typeid-source-dag-optin gas_elf_and_c11_parity_for_source_proven_rule_families -- --nocapture
      - name: ADD OR XOR native experimental-rule GNU-as/direct-ELF C11 parity
        run: |
          set -euo pipefail
          cd compiler
          cargo test -p compiler-backend-x86 --lib --features 'x7-ip4-auto-dag-probe x7-ip9-source-logic-probe' gas_elf_and_c11_parity_for_source_proven_rule_families -- --nocapture
      - name: Prove unrelated generated AT&T count regression exists on PR base
        run: |
          set -euo pipefail
          test "$(git -C compiler-base rev-parse HEAD)" = "265a0d42f382d400a9eae36cc231b1475a26961b"
          set +e
          (cd compiler-base && cargo test -p compiler-backend-x86 --lib --features x7-typeid-source-dag-optin every_generated_form_assembles_through_existing_encoder -- --nocapture) > /tmp/x7-atttable-baseline.log 2>&1
          status=$?
          set -e
          tail -25 /tmp/x7-atttable-baseline.log
          test "$status" -ne 0
          grep -q 'left: 60' /tmp/x7-atttable-baseline.log
          grep -q 'right: 54' /tmp/x7-atttable-baseline.log
          echo "KNOWN_BASE_RED: existing generated form count 60 versus stale assertion 54; unrelated to X7/IP10c"
      - name: All generated DAG / x86 backend library regressions
        run: |
          set -euo pipefail
          cd compiler
          cargo test -p compiler-backend-x86 --lib --features x7-typeid-source-dag-optin -- --skip every_generated_form_assembles_through_existing_encoder
      - name: Source DAG experimental feature regressions
        run: |
          set -euo pipefail
          cd compiler
          cargo test -p compiler-backend-x86 --lib --features 'x7-ip4-auto-dag-probe x7-ip9-source-logic-probe' -- --skip every_generated_form_assembles_through_existing_encoder

  source-corpus:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: e9f9092b6e87ba2e01a53c1458d6f24f579dab8
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Verify shared X7 candidate and fetch dependencies
        run: |
          set -euo pipefail
          test "$(git -C compiler rev-parse HEAD)" = "e9f9092b6e87ba2e01a53c1458d6f24f579dab8"
          git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
          git config --global --add url."https://github.com/".insteadOf "git@github.com:"
      - name: Run current checked Mini-C and Oberon optimized TypeId source corpus
        run: |
          set -euo pipefail
          cargo test --manifest-path compiler/Cargo.toml -p compiler --bin compiler --features x7-ip7-workload-profile real_checked_ -- --nocapture 2>&1 | tee /tmp/x7-checked-source.log
          grep 'test result: ok. 2 passed; 0 failed' /tmp/x7-checked-source.log
          grep 'x7_ip7_real_source_shapes::real_checked_' /tmp/x7-checked-source.log | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Real optimized Mini-C and Oberon post-RA physical A/B — standard rules
        run: |
          set -euo pipefail
          cargo test --manifest-path compiler/Cargo.toml -p compiler --bin compiler --features 'x7-ip7-workload-profile x7-ip10-workload-profile' optimized_real_checked_frontend_physical_ab_census -- --nocapture 2>&1 | tee /tmp/x7-real-physical-normal.log
          grep 'test result: ok. 1 passed; 0 failed' /tmp/x7-real-physical-normal.log
          grep 'X7_IP10G_SUMMARY ' /tmp/x7-real-physical-normal.log | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Same real optimized source physical A/B — experimental IP4 and IP9
        run: |
          set -euo pipefail
          cargo test --manifest-path compiler/Cargo.toml -p compiler --bin compiler --features 'x7-ip7-workload-profile x7-ip10-workload-experimental' optimized_real_checked_frontend_physical_ab_census -- --nocapture 2>&1 | tee /tmp/x7-real-physical-experimental.log
          grep 'test result: ok. 1 passed; 0 failed' /tmp/x7-real-physical-experimental.log
          grep 'X7_IP10G_SUMMARY ' /tmp/x7-real-physical-experimental.log | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Run optimized Mini-C source through actual shared x86 machine GAS/ELF runtime
        run: |
          set -euo pipefail
          cargo test --manifest-path compiler/Cargo.toml -p compiler --test x7_selected_machine_source normal_optimized_source_can_explicitly_use_shared_machine_elf_and_gas -- --nocapture 2>&1 | tee /tmp/x7-minic-runtime.log
          grep 'test result: ok. 1 passed; 0 failed' /tmp/x7-minic-runtime.log
