name: X7 IP10c exact-source encoded bytes A/B
on:
  pull_request:
    paths:
      - '.github/workflows/x7-ip10-receipts.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  x7-ip10:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 4cccc728533cd00d4ae52bee3a70f2048bccfbd1
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 265a0d42f382d400a9eae36cc231b1475a26961b
          path: compiler-base
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Verify compiler source pin
        run: |
          set -euo pipefail
          test "$(git -C compiler rev-parse HEAD)" = "4cccc728533cd00d4ae52bee3a70f2048bccfbd1"
          rustc --version
          cargo --version
          git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
          git config --global --add url."https://github.com/".insteadOf "git@github.com:"
      - name: Focused IP10 admission receipt tests
        run: |
          set -euo pipefail
          cd compiler
          cargo test -p compiler-backend-x86 --lib ip10_decision_receipt_tests -- --nocapture
      - name: Focused native physical A/B tests
        run: |
          set -euo pipefail
          cd compiler
          cargo test -p compiler-backend-x86 --lib --features x7-typeid-source-dag-optin x7_ip10_allocation_ab -- --nocapture
      - name: Focused native encoded byte A/B tests
        run: |
          set -euo pipefail
          cd compiler
          cargo test -p compiler-backend-x86 --lib --features x7-typeid-source-dag-optin x7_ip10_encoded_ab -- --nocapture
      - name: Prove unrelated generated AT&T count regression exists on PR base
        run: |
          set -euo pipefail
          test "$(git -C compiler-base rev-parse HEAD)" = "265a0d42f382d400a9eae36cc231b1475a26961b"
          set +e
          (cd compiler-base && cargo test -p compiler-backend-x86 --lib --features x7-typeid-source-dag-optin every_generated_form_assembles_through_existing_encoder -- --nocapture) > /tmp/x7-atttable-baseline.log 2>&1
          status=$?
          set -e
          tail -25 /tmp/x7-atttable-baseline.log
          test "$status" -ne 0
          grep -q 'left: 60' /tmp/x7-atttable-baseline.log
          grep -q 'right: 54' /tmp/x7-atttable-baseline.log
          echo "KNOWN_BASE_RED: existing generated form count 60 versus stale assertion 54; unrelated to X7/IP10c"
      - name: All generated DAG / x86 backend library regressions
        run: |
          set -euo pipefail
          cd compiler
          cargo test -p compiler-backend-x86 --lib --features x7-typeid-source-dag-optin -- --skip every_generated_form_assembles_through_existing_encoder
      - name: Source DAG experimental feature regressions
        run: |
          set -euo pipefail
          cd compiler
          cargo test -p compiler-backend-x86 --lib --features 'x7-ip4-auto-dag-probe x7-ip9-source-logic-probe' -- --skip every_generated_form_assembles_through_existing_encoder
