name: X7 IP10 exact-source admission receipts
on:
  pull_request:
    paths:
      - '.github/workflows/x7-ip10-receipts.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  x7-ip10:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: db37eb0bbf411a6c6b8a29e31d8af94955a61308
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Verify compiler source pin
        run: |
          set -euo pipefail
          test "$(git -C compiler rev-parse HEAD)" = "db37eb0bbf411a6c6b8a29e31d8af94955a61308"
          rustc --version
          cargo --version
          git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
          git config --global --add url."https://github.com/".insteadOf "git@github.com:"
      - name: Focused IP10 admission receipt tests
        run: |
          set -euo pipefail
          cd compiler
          cargo test -p compiler-backend-x86 --lib ip10_decision_receipt_tests -- --nocapture
      - name: All generated DAG / x86 backend library regressions
        run: |
          set -euo pipefail
          cd compiler
          cargo test -p compiler-backend-x86 --lib --features x7-typeid-source-dag-optin
      - name: Source DAG experimental feature regressions
        run: |
          set -euo pipefail
          cd compiler
          cargo test -p compiler-backend-x86 --lib --features 'x7-ip4-auto-dag-probe x7-ip9-source-logic-probe'
