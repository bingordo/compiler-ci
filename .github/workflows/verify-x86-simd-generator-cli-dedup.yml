name: x86 SIMD generator CLI dedup and source parity
on:
  pull_request:
    paths: ['.github/workflows/verify-x86-simd-generator-cli-dedup.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  simd-generator-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout immutable compiler source
        uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 39c34f528737a1ac6fe146801584ea650c6e93ad
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Assert compiler source commit
        run: test "$(git -C compiler rev-parse HEAD)" = "39c34f528737a1ac6fe146801584ea650c6e93ad"
      - name: Verify all reviewed SIMD Rust outputs remain byte-identical
        working-directory: compiler
        run: |
          set -euo pipefail
          export PYTHONPATH="$PWD/tools"
          python3 tools/regen_x86_sse_packed_forms.py --check
          python3 tools/regen_x86_sse_vex_forms.py --check
          python3 tools/regen_x86_sse_move_forms.py --check
          python3 tools/regen_x86_sse_shift_imm_forms.py --check
          python3 tools/regen_x86_sse_evex_forms.py --check
          python3 tools/regen_x86_sse_evex_mask_compare_forms.py --check
          python3 tools/regen_x86_sse_evex_shift_imm_forms.py --check
          python3 tools/regen_x86_sse_evex_ternlog_forms.py --check
      - name: Run all source admission, mutation, and shared-CLI tests
        working-directory: compiler
        run: |
          set -euo pipefail
          export PYTHONPATH="$PWD/tools"
          python3 -m unittest discover -s tools -p test_x86_simd_generator_cli.py -v
          python3 -m unittest discover -s tools -p test_regen_x86_sse_packed_forms.py -v
          python3 -m unittest discover -s tools -p test_regen_x86_sse_vex_forms.py -v
          python3 -m unittest discover -s tools -p test_regen_x86_sse_move_forms.py -v
          python3 -m unittest discover -s tools -p test_regen_x86_sse_shift_imm_forms.py -v
          python3 -m unittest discover -s tools -p test_regen_x86_sse_evex_forms.py -v
          python3 -m unittest discover -s tools -p test_regen_x86_sse_evex_mask_compare_forms.py -v
          python3 -m unittest discover -s tools -p test_regen_x86_sse_evex_shift_imm_forms.py -v
          python3 -m unittest discover -s tools -p test_regen_x86_sse_evex_ternlog_forms.py -v
