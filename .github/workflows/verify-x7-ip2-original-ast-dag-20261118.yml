name: X7 IP2 exact original Intel AST to generic DAG
on:
  pull_request:
    paths: ['.github/workflows/verify-x7-ip2-original-ast-dag-20261118.yml']
permissions:
  contents: read
jobs:
  original-intel-ast:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 0f6263c3ece9c7d099628f29ab954e87080e923d
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Install Z3
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y z3
      - name: Exact-source Intel AST normalizer, symbolic graph, and adversarial tests
        working-directory: compiler
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "0f6263c3ece9c7d099628f29ab954e87080e923d"
          python3 -m py_compile tools/x7_ip2_original_source_graph.py tools/test_x7_ip2_original_source_graph.py
          PYTHONPATH=tools python3 -m unittest -v test_x7_ip2_original_source_graph test_x7_ip2_semantic_certificate_join test_x7_ip2_ir_equivalence test_x86_s3l_isl_operation_ast
          echo X7_ORIGINAL_AST_GRAPH_EVIDENCE_GREEN
