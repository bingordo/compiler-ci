name: Candidate machine operand visitors 3259
on:
  pull_request:
    paths: ['.github/workflows/verify-machine-operand-visitors-3259.yml']
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: eecc7ac081a6a560a54ec02f1d5fde1e961d91aa
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Verify revision and isolate workspace
        run: |
          test "$(git -C compiler rev-parse HEAD)" = "eecc7ac081a6a560a54ec02f1d5fde1e961d91aa"
          git -C compiler rev-parse HEAD | tee -a "$GITHUB_STEP_SUMMARY"
          cat > compiler/Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir", "crates/opt", "crates/backend", "crates/backend-x86", "crates/backend-aarch64", "crates/backend-riscv64", "crates/backend-wasm"]
          exclude = ["tools/mini-c-driver"]
          EOF
          rm -f compiler/Cargo.lock
      - name: Workspace compilation
        working-directory: compiler
        run: cargo check --workspace
      - name: Ordered operand visitor regression
        if: ${{ !cancelled() }}
        working-directory: compiler
        run: cargo test -p compiler-backend-x86 -p compiler-backend-aarch64 -p compiler-backend-riscv64 --test machine_operand_visitors
      - name: Shared allocator tests
        if: ${{ !cancelled() }}
        working-directory: compiler
        run: cargo test -p compiler-backend --lib
      - name: x86 unit tests
        if: ${{ !cancelled() }}
        working-directory: compiler
        run: cargo test -p compiler-backend-x86 --lib
      - name: AArch64 unit tests
        if: ${{ !cancelled() }}
        working-directory: compiler
        run: cargo test -p compiler-backend-aarch64 --lib
      - name: RISC-V unit tests
        if: ${{ !cancelled() }}
        working-directory: compiler
        run: cargo test -p compiler-backend-riscv64 --lib
      - name: WebAssembly unit tests
        if: ${{ !cancelled() }}
        working-directory: compiler
        run: cargo test -p compiler-backend-wasm --lib
