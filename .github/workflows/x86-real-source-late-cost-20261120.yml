name: x86 real TypeId source late cost telemetry
on:
  pull_request:
    paths:
      - '.github/workflows/x86-real-source-late-cost-20261120.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  real-source-cost-report-and-native:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 3c82d1a9ca05d88384f40898017f48b0d3ed9641
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Exact source and public GitHub dependency transport
        run: |
          set -euo pipefail
          test "$(git -C compiler rev-parse HEAD)" = "3c82d1a9ca05d88384f40898017f48b0d3ed9641"
          git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: x86-source-x7-shadow-20261120
      - name: Real TypeId Mini-C ELF and GAS output equality and cost profile checks
        working-directory: compiler
        run: |
          set -euo pipefail
          cargo test -p compiler --test x86_late_cost_source -- --nocapture
      - name: Independent rolling-checksum GCC native oracle
        working-directory: compiler
        run: |
          set -euo pipefail
          cargo test -p compiler --test x7_s4_rolling_checksum_source -- --nocapture
  backend-source-evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 3c82d1a9ca05d88384f40898017f48b0d3ed9641
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Verify exact candidate source
        run: |
          set -euo pipefail
          test "$(git -C compiler rev-parse HEAD)" = "3c82d1a9ca05d88384f40898017f48b0d3ed9641"
          git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: x86-source-x7-shadow-backend-20261120
      - name: Full x86 library and both CPU exact-form shadow tests
        working-directory: compiler
        run: |
          set -euo pipefail
          cargo test -p compiler-backend-x86 --lib
      - name: No-default-features backend and scoped Clippy
        working-directory: compiler
        run: |
          set -euo pipefail
          cargo check -p compiler-backend-x86 --no-default-features
          # Existing unrelated compiler-opt/src/cse.rs:13 unused re-export, outside this x86 change.
          cargo clippy -p compiler-backend-x86 --lib -- -D warnings -A unused-imports -A unused-variables -A clippy::empty_line_after_doc_comments
