# Source-pinned opt-in canonical binary v2 checks; never run compiler Actions.
name: IR PR2891 canonical binary v2
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ir-pr2891-binary-v2-20261122.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  codec:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      SOURCE_SHA: 4698f66ab97783141af479727df7e37ab79b8d9c
      CARGO_INCREMENTAL: '0'
      CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
    steps:
      - name: Checkout exact compiler commit
        uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: ${{ env.SOURCE_SHA }}
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Verify pinned SHA and isolate core
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C compiler rev-parse HEAD)" = "$SOURCE_SHA"
          cat > compiler/Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir", "crates/opt", "crates/backend", "crates/backend-x86", "crates/backend-aarch64"]
          EOF
          rm -f compiler/Cargo.lock
      - name: Cache isolated core Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: ir-pr2891-binary-v2
      - name: Verify canonical v2 and unchanged v1 codec
        working-directory: compiler
        run: |
          set -euo pipefail
          cargo test -p compiler-ir --test native_binary_v2 -- --nocapture
          cargo test -p compiler-ir --test native_binary_v1 -- --nocapture
          cargo test -p compiler-ir --test native_module_text_v3 -- --nocapture
          cargo test -p compiler-ir --test lto_merge -- --nocapture
      - name: Strict focused Clippy
        working-directory: compiler
        run: |
          set -euo pipefail
          cargo clippy -p compiler-ir --test native_binary_v2 -- -D clippy::all -A clippy::empty_line_after_doc_comments
