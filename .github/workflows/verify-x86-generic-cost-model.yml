name: Verify x86 generic generated DAG cost model
on:
  push:
    branches: [main]
    paths: ['.github/workflows/verify-x86-generic-cost-model.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  generated-costs:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: feature/x86-generic-dag-cost-model-20261102
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Record candidate commit
        run: git rev-parse HEAD
      - name: Validate deterministic generic cost schema
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tools -p 'test_x86_match_costs.py' -v
          python3 tools/regen_x86_match_costs.py --check
      - name: Isolate core workspace
        run: |
          cat > Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir","crates/opt","crates/backend","crates/backend-x86"]
          EOF
          rm -f Cargo.lock
      - uses: Swatinem/rust-cache@v2
        with:
          key: x86-generic-dag-costs
      - name: Check generic model, matcher proof IDs, and native sinks
        run: |
          set -euo pipefail
          cargo test -p compiler-ir -p compiler-opt -p compiler-backend -p compiler-backend-x86
          cargo test -p compiler-backend-x86 --lib cost_model::tests -- --nocapture
          cargo test -p compiler-backend-x86 --lib dag_add_match::tests -- --nocapture
          cargo test -p compiler-backend-x86 --lib dag_ctz_match::tests -- --nocapture
          cargo test -p compiler-backend-x86 --test dag_add_integration_native -- --nocapture
          cargo test -p compiler-backend-x86 --test x6_add64_native -- --nocapture
          cargo test -p compiler-backend-x86 --test x4_cfg_pressure_native -- --nocapture
          cargo test -p compiler-backend-x86 --test x4_effects_native -- --nocapture
          echo 'X86_GENERIC_DAG_COSTS status=PASS' | tee -a "$GITHUB_STEP_SUMMARY"
