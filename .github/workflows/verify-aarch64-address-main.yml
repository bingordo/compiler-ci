name: AArch64 address forms on main (compiler-ci)
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-aarch64-address-main.yml'

permissions:
  contents: read
concurrency:
  group: aarch64-address-main-integration
  cancel-in-progress: true

jobs:
  core:
    # Reuse the established SHA-pinned, secret-authorized core/x86 gate.
    uses: ./.github/workflows/verify-compiler-pr-head.yml
    with:
      source_ref: 5490e25121b295bb54d1bb512e7c355ddd9d5b2c
    secrets: inherit

  strict-clippy:
    needs: core
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 5490e25121b295bb54d1bb512e7c355ddd9d5b2c
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Verify exact source SHA and restrict workspace to core
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C compiler rev-parse HEAD)" = 5490e25121b295bb54d1bb512e7c355ddd9d5b2c
          cat > compiler/Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir", "crates/opt", "crates/backend", "crates/backend-x86"]
          EOF
          rm -f compiler/Cargo.lock
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: aarch64-address-main-clippy
      - name: Strict shared-backend and x86 Clippy
        working-directory: compiler
        run: cargo clippy -p compiler-backend -p compiler-backend-x86 --all-targets -- -D warnings
