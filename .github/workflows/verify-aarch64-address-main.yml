name: AArch64 address forms on main (compiler-ci)
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-aarch64-address-main.yml'

permissions:
  contents: read
concurrency:
  group: aarch64-address-main-integration
  cancel-in-progress: true

jobs:
  focused:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 5490e25121b295bb54d1bb512e7c355ddd9d5b2c
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Verify exact source SHA and restrict workspace to core crates
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C compiler rev-parse HEAD)" = 5490e25121b295bb54d1bb512e7c355ddd9d5b2c
          cat > compiler/Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir", "crates/opt", "crates/backend", "crates/backend-x86"]
          EOF
          rm -f compiler/Cargo.lock
          echo 'Source: 5490e25121b295bb54d1bb512e7c355ddd9d5b2c' >> "$GITHUB_STEP_SUMMARY"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: aarch64-address-main
          cache-workspace-crates: 'true'
      - name: Exact ported immediate/index form and original address tests
        working-directory: compiler
        run: cargo test -p compiler-backend address::tests -- --test-threads=1
      - name: Verify shared backend and x86 downstream compile
        working-directory: compiler
        run: cargo check -p compiler-backend -p compiler-backend-x86 --all-targets
      - name: Strict backend/x86 Clippy
        working-directory: compiler
        run: cargo clippy -p compiler-backend -p compiler-backend-x86 --all-targets -- -D warnings
