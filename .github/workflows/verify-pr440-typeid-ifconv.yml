name: Verify PR440 TypeId zero-speculation if-conversion
on:
  push:
    branches: [ci/pr440-typeid-ifconv]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: d90b6d099513c879a57df0d05614e17169209632
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Verify pinned compiler SHA
        run: test "$(git -C compiler rev-parse HEAD)" = "d90b6d099513c879a57df0d05614e17169209632"
      - name: Isolate compiler core and native workspace
        run: |
          cat > compiler/Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir", "crates/opt", "crates/backend", "crates/backend-x86"]
          EOF
          rm -f compiler/Cargo.lock
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: typeid-ifconv-pr440
          cache-workspace-crates: 'true'
      - name: Focused TypeId and legacy ifconversion native replay
        working-directory: compiler
        run: cargo test -p compiler-opt --test typed_if_conversion_native --test if_conversion_native --test typed_core_pipeline --test ir_replay_cli -- --nocapture
      - name: Full isolated IR optimizer backend and x86 regression
        working-directory: compiler
        run: cargo test -p compiler-ir -p compiler-opt -p compiler-backend -p compiler-backend-x86
      - name: Strict optimizer Clippy all targets
        working-directory: compiler
        run: cargo clippy -p compiler-opt --all-targets -- -D warnings
