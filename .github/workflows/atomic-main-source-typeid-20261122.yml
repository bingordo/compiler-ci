name: Shared language-independent atomic storage and retry protocol
on:
  push:
    branches: [ci/generic-atomic-storage-20261124]
  pull_request:
    paths: [.github/workflows/atomic-main-source-typeid-20261122.yml]
  workflow_dispatch:
permissions:
  contents: read
  statuses: write
jobs:
  native-mini-c-atomic-source:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Checkout exact compiler source candidate
        uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 9b2ec272e500c553805c3f0099326ae393672520
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Checkout exact checked Mini-C frontend
        uses: actions/checkout@v4
        with:
          repository: bingordo/mini-c
          ref: cd5ebe518b5d09f217d4b850ca7e2da32c3cdacd
          path: mini-c
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Limit compiler workspace to native driver dependencies
        shell: bash
        run: |
          cat > compiler/Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir", "crates/opt", "crates/backend", "crates/backend-x86", "crates/backend-aarch64"]
          EOF
          rm -f compiler/Cargo.lock
      - name: Pin local checked frontend dependencies without SSH
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          manifest = Path('compiler/tools/mini-c-driver/Cargo.toml')
          data = manifest.read_text()
          for crate in ('mini-c-syntax', 'mini-c-sema'):
              folder = crate.split('-')[-1]
              before = (f'{crate} = {{ git = "ssh://git@github.com/bingordo/mini-c.git", '
                        'rev = "cd5ebe518b5d09f217d4b850ca7e2da32c3cdacd" }')
              after = f'{crate} = {{ path = "../../../mini-c/crates/{folder}" }}'
              if data.count(before) != 1:
                  raise SystemExit(f'expected one exact pinned {crate} dependency')
              data = data.replace(before, after)
          manifest.write_text(data)
          PY
      - name: Generic atomic storage and retry protocol tests
        run: cargo test --manifest-path compiler/Cargo.toml -p compiler-ir --test atomic_storage
      - name: Check current native TypeId source adapter
        run: cargo check --manifest-path compiler/tools/mini-c-driver/Cargo.toml --lib
      - name: Test source adapter atomic regressions
        run: cargo test --manifest-path compiler/tools/mini-c-driver/Cargo.toml --lib gnu_atomic_
      - name: Install AArch64 cross compiler and QEMU user emulator
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu qemu-user
      - name: Test C11 qualified atomic ABI and GCC native ELF/GAS
        env:
          COMPILER_REQUIRE_AARCH64_QEMU: "1"
        run: cargo test --manifest-path compiler/tools/mini-c-driver/Cargo.toml --test c11_atomic_qualified_source -- --nocapture
      - name: Exact GP atomic representation native ELF/GAS
        env:
          COMPILER_REQUIRE_AARCH64_QEMU: "1"
        run: cargo test --manifest-path compiler/tools/mini-c-driver/Cargo.toml --test atomic_gp_representation -- --nocapture
      - name: Source Mini-C typed atomic checking
        working-directory: mini-c
        run: cargo test -p mini-c-syntax -p mini-c-sema
      - name: Native driver lint (known pre-existing warning classes excepted)
        run: |
          cargo clippy --manifest-path compiler/tools/mini-c-driver/Cargo.toml --lib -- \
            -D warnings -A unused-imports \
            -A clippy::match-like-matches-macro -A clippy::too-many-arguments
      - name: Full native Mini-C driver library acceptance
        if: ${{ !cancelled() }}
        run: cargo test --manifest-path compiler/tools/mini-c-driver/Cargo.toml --lib
      - name: Publish exact-source validation status
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ job.status }}
        run: |
          state="$RESULT"
          if [ "$state" = cancelled ]; then state=error; fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state="$state" -f context="atomic/native-candidate" \
            -f description="compiler 9b2ec27; mini-c cd5ebe5" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
  baseline-native-mini-c:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CARGO_INCREMENTAL: "0"
    steps:
      - name: Checkout exact unmodified compiler base
        uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 4e0dc1d03d47886bb350745ba31aee124701415b
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Checkout original Mini-C dependency pin
        uses: actions/checkout@v4
        with:
          repository: bingordo/mini-c
          ref: ce0dbe8dc1434c27ad9ffb67efb318250eb6b868
          path: mini-c
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Configure identical minimal workspace and local frontend
        run: |
          cat > compiler/Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir", "crates/opt", "crates/backend", "crates/backend-x86", "crates/backend-aarch64"]
          EOF
          rm -f compiler/Cargo.lock
          python3 - <<'PY'
          from pathlib import Path
          p = Path('compiler/tools/mini-c-driver/Cargo.toml')
          s = p.read_text()
          for crate in ('mini-c-syntax', 'mini-c-sema'):
              old = f'{crate} = {{ git = "ssh://git@github.com/bingordo/mini-c.git", rev = "ce0dbe8dc1434c27ad9ffb67efb318250eb6b868" }}'
              assert s.count(old) == 1, crate
              s = s.replace(old, f'{crate} = {{ path = "../../../mini-c/crates/{crate.split("-")[-1]}" }}')
          p.write_text(s)
          PY
      - name: Full unmodified baseline native driver library acceptance
        run: cargo test --manifest-path compiler/tools/mini-c-driver/Cargo.toml --lib
      - name: Publish exact-source validation status
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ job.status }}
        run: |
          state="$RESULT"
          if [ "$state" = cancelled ]; then state=error; fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state="$state" -f context="atomic/native-baseline" \
            -f description="compiler 4e0dc1d; mini-c ce0dbe8" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
