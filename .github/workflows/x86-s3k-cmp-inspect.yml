name: X7 S3.K inspect original CMP source and XED
on:
  pull_request:
    paths:
      - '.github/workflows/x86-s3k-cmp-inspect.yml'
permissions:
  contents: read
  actions: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: cab2714f9ae8fd320651e43af9ad7345a2dfebc5
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: x7-s2-pinned-intel-xed-variant-join
          run-id: 43635408689
          repository: bingordo/compiler-ci
          github-token: ${{ github.token }}
          path: /tmp/s3k-s2
      - name: Print exact CMP Intel iform fingerprint and matching XED variant
        shell: bash
        env:
          PYTHONPATH: compiler/tools
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --retry 2 --max-time 45 \
            'https://raw.githubusercontent.com/intel/SDM/35eface1b7ee003a1cda95005ec5fd83de658a64/data/instruction/CMP.xml' \
            -o /tmp/s3k-cmp.xml
          python3 - <<'PY'
          import json,hashlib
          from pathlib import Path
          from x86_intel_iform_effect_audit import inspect_intel_iform_xml
          xml=Path("/tmp/s3k-cmp.xml").read_bytes()
          rec=inspect_intel_iform_xml(xml,"CMP_GPRv_MEMv")
          print("X7_S3K_CMP_XML_SHA",hashlib.sha256(xml).hexdigest())
          print("X7_S3K_CMP_SOURCE",json.dumps(rec,sort_keys=True))
          s2=json.loads(Path("/tmp/s3k-s2/join-1.json").read_text())
          matches=[r for r in s2["forms"] if r.get("xed_iform")=="CMP_GPRv_MEMv"]
          print("X7_S3K_CMP_XED",json.dumps(matches,sort_keys=True))
          assert len(matches)==1
          PY
