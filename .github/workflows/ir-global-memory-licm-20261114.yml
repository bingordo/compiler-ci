name: Existing TypeId global-memory and LICM fixtures
on:
  push:
    branches: [verify/ir-global-memory-licm-20261114]
    paths: ['.github/workflows/ir-global-memory-licm-20261114.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: ea4593748b9920481408d67fd4130f2bf8386d5d
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Verify exact source
        run: test "$(git -C compiler rev-parse HEAD)" = "ea4593748b9920481408d67fd4130f2bf8386d5d"
      - name: Restrict workspace to compiler core
        run: |
          cat > compiler/Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir", "crates/opt", "crates/backend", "crates/backend-x86"]
          EOF
          rm -f compiler/Cargo.lock
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: typeid-global-memory-licm-fixtures
      - name: Export fixed native TypeId inputs and validate original tests
        working-directory: compiler
        run: |
          cargo test -p compiler-opt --test typed_global_memory temporary_export_global_memory_fixed_corpus_as_native_text -- --nocapture
          cargo test -p compiler-opt --test typed_global_memory --test typed_licm_native
