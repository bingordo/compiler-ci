name: Existing TypeId global-memory and LICM fixtures
on:
  push:
    branches: [verify/ir-global-memory-licm-20261114]
    paths: ['.github/workflows/ir-global-memory-licm-20261114.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: b3c8ea028912cc8caa6de42ef1b305be11292154
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Verify exact source
        run: test "$(git -C compiler rev-parse HEAD)" = "b3c8ea028912cc8caa6de42ef1b305be11292154"
      - name: Restrict workspace to compiler core
        run: |
          cat > compiler/Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir", "crates/opt", "crates/backend", "crates/backend-x86"]
          EOF
          rm -f compiler/Cargo.lock
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: typeid-global-memory-licm-fixtures
      - name: Validate migrated TypeId global-memory and LICM suites plus C11 oracle
        working-directory: compiler
        run: |
          cargo test -p compiler-opt --test typed_global_memory --test typed_licm_native
          cargo test -p compiler-opt --test typed_local_memory --test typed_mem2reg --test typed_dse
          cargo test -p compiler-opt --test typed_pre_native --test typed_transitive_phi
          cargo test -p compiler-opt --test ir_fixture_directives --test native_ir_pass_replay
          cargo test -p compiler-ir --test native_fixture_text --test native_module_text_v3
          cargo clippy -p compiler-opt --test typed_global_memory --test typed_licm_native -- -D warnings
