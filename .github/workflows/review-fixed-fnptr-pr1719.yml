name: One-off strict fixed TypeId function-pointer ABI PR1719
on:
  pull_request:
    paths:
      - '.github/workflows/review-fixed-fnptr-pr1719.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: d7a57c79f651fa3bbdf39c140732e4b4440b4c8a
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Pin exact compiler revision
        run: test "$(git -C compiler rev-parse HEAD)" = "d7a57c79f651fa3bbdf39c140732e4b4440b4c8a"
      - name: Self-contained IR and native scalar workspace
        shell: bash
        run: |
          cat > compiler/Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir", "crates/opt", "crates/backend", "crates/backend-x86", "crates/backend-aarch64"]
          EOF
          rm -f compiler/Cargo.lock
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: review-fixed-fnptr-pr1719
      - name: Fixed typed function pointer contract and negative cases
        working-directory: compiler
        run: cargo test -p compiler-ir --test typed_opcode_types -- --nocapture
      - name: Native ABI and source-checked indirect calls
        working-directory: compiler
        run: |
          cargo test -p compiler-ir --test typed_module_abi
          cargo test -p compiler-ir --test typed_verifier_parity
      - name: All compiler-ir unit and integration tests
        working-directory: compiler
        run: cargo test -p compiler-ir
      - name: Native scalar backend library tests
        working-directory: compiler
        run: cargo test -p compiler-backend --lib
      - name: Strict compiler-ir and native scalar Clippy
        working-directory: compiler
        run: cargo clippy -p compiler-ir -p compiler-backend --all-targets -- -D warnings
