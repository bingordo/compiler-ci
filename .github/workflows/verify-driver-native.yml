name: Driver native ABI tests (prebuilt)
on:
  schedule:
    - cron: '43 1,7,13,19 * * *'
  workflow_dispatch:
    inputs:
      expected_source_sha:
        description: 'Expected compiler source SHA (optional)'
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: driver-native-tests
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: expr-rule-gen-binaries
          path: binary-source
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
          sparse-checkout: |
            dist/driver-native
      - name: Verify provenance and unpack
        shell: bash
        env:
          EXPECTED_SHA: ${{ inputs.expected_source_sha }}
        run: |
          set -euo pipefail
          cd binary-source/dist/driver-native
          grep -Eq '^[0-9a-f]{40}$' source-sha.txt
          if [ -n "$EXPECTED_SHA" ]; then
            grep -Eq '^[0-9a-f]{40}$' <<< "$EXPECTED_SHA"
            test "$(cat source-sha.txt)" = "$EXPECTED_SHA"
          fi
          sha256sum -c sha256.txt
          mkdir -p "$RUNNER_TEMP/driver-native"
          tar -xzf driver-native-linux-x86_64.tar.gz -C "$RUNNER_TEMP/driver-native"
          test -x "$RUNNER_TEMP/driver-native/driver-native-tests"
          echo "Compiler source: $(cat source-sha.txt)"
      - name: Execute driver native ABI suite
        shell: bash
        run: |
          "$RUNNER_TEMP/driver-native/driver-native-tests" --nocapture

  report-failure:
    needs: verify
    if: ${{ always() && needs.verify.result == 'failure' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: File or update compiler regression issue
        env:
          GH_TOKEN: ${{ secrets.COMPILER_ISSUES_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::Set COMPILER_ISSUES_TOKEN to a fine-grained token with bingordo/compiler Issues: read/write."
            exit 1
          fi
          title="[CI] Prebuilt driver native ABI verification failing"
          existing="$(gh api --method GET 'repos/bingordo/compiler/issues' -f state=open -f per_page=100 --jq '.[] | select(.pull_request == null and .title == "[CI] Prebuilt driver native ABI verification failing") | .number' | head -n 1)"
          if [ -n "$existing" ]; then
            gh api --method POST "repos/bingordo/compiler/issues/$existing/comments" -f body="Driver verification failed again: $RUN_URL" >/dev/null
            echo "Updated existing issue #$existing"
          else
            gh api --method POST repos/bingordo/compiler/issues -f title="$title" -f body="Automated driver ABI verification failed. Run: $RUN_URL\n\nCheck the verification job logs and the matching publisher run. This issue is reused for subsequent failures." >/dev/null
            echo "Opened regression issue in bingordo/compiler"
          fi
