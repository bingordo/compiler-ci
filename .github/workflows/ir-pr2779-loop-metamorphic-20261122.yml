# Source-pinned, branch-isolated native loop metamorphic migration validation.
name: IR PR2779 TypeId loop metamorphic validation
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ir-pr2779-loop-metamorphic-20261122.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  loop-metamorphic:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      SOURCE_SHA: a6392dd62eae64339ac064f4682344b312bd5ea6
      CARGO_INCREMENTAL: '0'
      CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
    steps:
      - name: Checkout exact private compiler PR
        uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: ${{ env.SOURCE_SHA }}
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Validate pinned source and minimal core workspace
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C compiler rev-parse HEAD)" = "$SOURCE_SHA"
          cat > compiler/Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir", "crates/opt", "crates/backend", "crates/backend-x86", "crates/backend-aarch64"]
          EOF
          rm -f compiler/Cargo.lock
          rustc --version
          cc --version | head -n 1
      - name: Cache isolated source-pinned Rust compilation
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: ir-pr2779-loop-metamorphic
      - name: Run PRE/LICM matrix, CFG metamorphisms and ELF oracle
        working-directory: compiler
        shell: bash
        run: |
          set -euo pipefail
          cargo test -p compiler-opt --test pre_licm_semantic_matrix -- --nocapture
          cargo test -p compiler-opt --test licm_preheaders -- --nocapture
      - name: Enforce targeted Clippy findings excluding pre-existing x86 doc spacing
        working-directory: compiler
        run: |
          cargo clippy -p compiler-opt --test pre_licm_semantic_matrix -- -D clippy::all -A clippy::empty_line_after_doc_comments
