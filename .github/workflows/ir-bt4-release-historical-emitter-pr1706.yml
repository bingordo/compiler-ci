# Ephemeral source-pinned BT4 x86 historical emitter release isolation.
name: BT4 x86 historical emitter release isolation and oracle parity
on:
  pull_request:
    paths: ['.github/workflows/ir-bt4-release-historical-emitter-pr1706.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bt4-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      CARGO_INCREMENTAL: '0'
      SOURCE_SHA: abe18ec1bb61f4b0817cf0bb362557dd7b4b2769
    steps:
      - name: Checkout exact compiler candidate
        uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: abe18ec1bb61f4b0817cf0bb362557dd7b4b2769
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Pin source and narrow backend workspace
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C compiler rev-parse HEAD)" = "$SOURCE_SHA"
          cat > compiler/Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir", "crates/opt", "crates/backend", "crates/backend-x86", "crates/backend-aarch64"]
          EOF
          rm -f compiler/Cargo.lock
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: bt4-legacy-module-isolation
      - name: Crucial release TypeId build with no historical feature
        working-directory: compiler
        run: cargo check -p compiler-backend-x86 -p compiler-backend-aarch64 --release --lib
      - name: Debug all-targets retain original test compilation
        working-directory: compiler
        run: cargo check -p compiler-ir -p compiler-backend -p compiler-backend-x86 -p compiler-backend-aarch64 --all-targets
      - name: Original default x86 unit and allocator machine reference tests
        working-directory: compiler
        run: cargo test -p compiler-backend-x86 --lib
      - name: Original x86 T5 X7 and native TypeId ELF GAS C oracle suites
        working-directory: compiler
        run: |
          set -euo pipefail
          cargo test -p compiler-backend-x86 --test t5_x86_semantics --test x7_g10_native_memory_oracle --test typed_i32_compare_branch_native --test typed_i64_compare_branch_native --test typed_alias_calls_native --test m4_8_checked_symbol_attributes_native
      - name: Original opt-in X7 source-selection fault and quality tests
        working-directory: compiler
        run: |
          set -euo pipefail
          cargo test -p compiler-backend-x86 --features x7-native-form-validation,x7-c-defined-64 --test x7_g10_late_selector_native --test x7_g10_n11_cfg_spill_probe --test x7_g10_n12_c_defined_native --test x7_g10_n14_sub_native --test x7_g10_n16_bitwise_native --test x7_g10_n19_64_native --test x7_g10_n20_cfg_pressure_64_native
      - name: Release library Clippy with pre-existing X7 warning isolated
        working-directory: compiler
        run: cargo clippy -p compiler-backend-x86 --lib --release -- -D warnings -A private_interfaces
