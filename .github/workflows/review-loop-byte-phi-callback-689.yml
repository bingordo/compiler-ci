name: Source-pinned cyclic TypeId byte pointer PHI callback review 689
on:
  push:
    branches: [review/loop-byte-phi-callback-689]
    paths: ['.github/workflows/review-loop-byte-phi-callback-689.yml']
  pull_request:
    paths: ['.github/workflows/review-loop-byte-phi-callback-689.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 28
    steps:
      - name: Checkout temporary compiler-ci configuration
        uses: actions/checkout@v4
      - name: Checkout exact source commit
        uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: e9748ce458e8fe0fcf6e34265c9a9297db2d0e81
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Assert pinned compiler commit
        working-directory: compiler
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "e9748ce458e8fe0fcf6e34265c9a9297db2d0e81"
      - name: Core-only workspace for faster external test
        working-directory: compiler
        run: |
          python3 - <<'PY'
          from pathlib import Path
          Path('Cargo.toml').write_text("""[workspace]
          resolver = "2"
          members = ["crates/ir", "crates/opt", "crates/backend", "crates/backend-x86", "crates/backend-aarch64"]
          """)
          PY
      - name: Cache core Rust crates
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: review-loop-byte-phi-callback-689
      - name: New physical self-PHI loop callback oracle C11 × eight modes
        working-directory: compiler
        run: cargo test -p compiler-opt --test review_loop_byte_phi_callback -- --nocapture
      - name: Existing physical byte-PHI and indirect callback controls
        working-directory: compiler
        run: |
          set -euo pipefail
          cargo test -p compiler-opt --test review_byte_phi_indirect_memory -- --nocapture
          cargo test -p compiler-opt --test review_memory_callback_order -- --nocapture
      - name: Independent CFG memory loops and byte alias regressions
        working-directory: compiler
        run: |
          set -euo pipefail
          cargo test -p compiler-opt --test memory_execution_oracle -- --nocapture
          cargo test -p compiler-opt --test typed_global_memory -- --nocapture
          cargo test -p compiler-opt --test alias_phi_exhaustive -- --nocapture
      - name: Strict affected Clippy
        working-directory: compiler
        run: |
          set -euo pipefail
          cargo clippy -p compiler-ir -p compiler-opt -p compiler-backend -p compiler-backend-x86 --lib -- -D warnings
          cargo clippy -p compiler-opt --test review_loop_byte_phi_callback -- -D warnings
