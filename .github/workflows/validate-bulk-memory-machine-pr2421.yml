name: Validate bulk-memory machine pseudo PR 2421

on:
  push:
    branches: [main]
    paths: ['.github/workflows/validate-bulk-memory-machine-pr2421.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 07091bb1f78d2308dc2f5d60e38f45655c7d5b93
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Verify exact compiler source SHA
        run: test "$(git -C compiler rev-parse HEAD)" = 07091bb1f78d2308dc2f5d60e38f45655c7d5b93
      - name: Isolate target-neutral compiler core
        run: |
          cat > compiler/Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir", "crates/backend"]
          EOF
          rm -f compiler/Cargo.lock
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: bulk-memory-pr2421
      - name: Install GDB required by existing DWARF integration test
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends gdb
      - name: Check new source formatting
        working-directory: compiler
        run: rustfmt --edition 2021 --check crates/backend/src/bulk_memory.rs
      - name: Test typed machine pseudo contracts
        working-directory: compiler
        run: cargo test -p compiler-backend bulk_memory -- --nocapture
      - name: All shared backend unit tests
        working-directory: compiler
        run: cargo test -p compiler-backend
      - name: Shared backend Clippy
        working-directory: compiler
        run: cargo clippy -p compiler-backend --lib -- -D clippy::all
