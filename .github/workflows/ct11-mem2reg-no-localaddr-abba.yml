name: CT-11 typed mem2reg no-local-address clone preflight ABBA
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/ct11-mem2reg-no-localaddr-abba.yml']
permissions:
  contents: read
concurrency:
  group: ct11-mem2reg-no-localaddr-abba-${{ github.ref }}
  cancel-in-progress: true
jobs:
  paired-native:
    strategy:
      fail-fast: false
      matrix:
        independent_runner: [a]  # baseline failure triage + second independent ABBA runner
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: dfc69a3f488a14a08ad01d1f26cf91352adef6f2
          path: parent
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 255291af62a2edbf83ddb60924ca2906a0ceb271
          path: candidate
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Exact pins, toolchains and script syntax
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p results
          test "$(git -C parent rev-parse HEAD)" = dfc69a3f488a14a08ad01d1f26cf91352adef6f2
          test "$(git -C candidate rev-parse HEAD)" = 255291af62a2edbf83ddb60924ca2906a0ceb271
          git -C parent rev-parse HEAD | tee results/parent-sha.txt
          git -C candidate rev-parse HEAD | tee results/candidate-sha.txt
          rustc --version | tee results/toolchain.txt
          cc --version | head -1 | tee results/gcc.txt
          git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
          python3 -m py_compile candidate/tools/ct11_source_compile_abba.py candidate/tools/ct11_loop_source_profile.py
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            parent -> target
            candidate -> target
          key: ct11-mem2reg-no-localaddr-abba-${{ matrix.independent_runner }}
      - name: Compile two exact-source release compilers
        shell: bash
        run: |
          set -euo pipefail
          cargo build --release --manifest-path parent/Cargo.toml -p compiler --bin compiler
          cargo build --release --manifest-path candidate/Cargo.toml -p compiler --bin compiler
      - name: Candidate no-op, malformed input, and strict Clippy
        shell: bash
        run: |
          set -euo pipefail
          cargo test --release --manifest-path candidate/Cargo.toml -p compiler-opt --test typed_mem2reg -- --nocapture
          cargo test --release --manifest-path candidate/Cargo.toml -p compiler-opt --test native_s2316_profile
          cargo test --release --manifest-path candidate/Cargo.toml -p compiler --test typeid_native_s2316_profile
          cargo clippy --manifest-path candidate/Cargo.toml -p compiler-opt --lib -- -D warnings
          cargo clippy --manifest-path candidate/Cargo.toml -p compiler --bin compiler --test typeid_native_s2316_profile -- -D warnings
      - name: Complete release IR and optimizer regression suites on runner A (known failure diagnostics)
        if: matrix.independent_runner == 'a'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          cargo test --release --manifest-path candidate/Cargo.toml -p compiler-ir -p compiler-opt
      - name: Exact-parent control for generated native comparison-DAG failure
        if: matrix.independent_runner == 'a'
        shell: bash
        run: |
          set -uo pipefail
          cargo test --release --manifest-path parent/Cargo.toml \
            -p compiler-opt --test generated_native_compare_dag \
            generated_comparison_dag_all_widths_with_cfg_and_negative_guards \
            > results/parent-dag.log 2>&1
          p_rc=$?
          cargo test --release --manifest-path candidate/Cargo.toml \
            -p compiler-opt --test generated_native_compare_dag \
            generated_comparison_dag_all_widths_with_cfg_and_negative_guards \
            > results/candidate-dag.log 2>&1
          c_rc=$?
          echo "CT11_DAG_BASELINE_CONTROL parent_exit=$p_rc candidate_exit=$c_rc" | tee results/dag-control.txt
          grep -E 'FAILED|left:|right:' results/parent-dag.log | tail -8 || true
          grep -E 'FAILED|left:|right:' results/candidate-dag.log | tail -8 || true
          if [ "$p_rc" -ne "$c_rc" ]; then
            echo 'DIFFERENTIAL FAILURE: candidate and parent disagree'
            exit 1
          fi
          echo 'No differential test status; benchmark experiment still requires meaningful real-source gain.'
      - name: Independent exact-parent whole-source native ABBA with RSS and C runtime oracle
        shell: bash
        run: |
          set -euo pipefail
          python3 candidate/tools/ct11_source_compile_abba.py \
            --baseline parent/target/release/compiler \
            --candidate candidate/target/release/compiler \
            --output results/abba.json --rounds 7 \
            2>&1 | tee results/abba.log
          test "$(grep -c '^CT11_ABBA name=' results/abba.log)" -eq 8
          grep '^CT11_ABBA ' results/abba.log | tee -a "$GITHUB_STEP_SUMMARY"
          grep '^CT11_ABBA_SUMMARY ' results/abba.log | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ct11-mem2reg-no-localaddr-abba-${{ matrix.independent_runner }}
          path: results/
          retention-days: 30
