name: T5 TypeId pipeline semantic oracle (focused)
on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: "Compiler commit/branch to test (default: main)"
        required: false
        type: string
  push:
    branches: [main]
    paths:
      - '.github/workflows/t5-typed-pipeline-oracle.yml'
permissions:
  contents: read
concurrency:
  group: t5-typed-pipeline-oracle-${{ inputs.source_ref || 'default' }}
  cancel-in-progress: true
jobs:
  typed-pipeline:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout verifier workflow
        uses: actions/checkout@v4
      - name: Checkout exact compiler revision
        uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: ${{ inputs.source_ref || 'main' }}
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Record exact tested SHA and require T5 source
        shell: bash
        run: |
          set -euo pipefail
          sha="$(git -C compiler rev-parse HEAD)"
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]]
          test -s compiler/crates/opt/tests/typed_native_parity.rs
          printf 'Compiler SHA: %s\n' "$sha" >> "$GITHUB_STEP_SUMMARY"
      - name: Use dependency-independent compiler core
        shell: bash
        run: |
          cat > compiler/Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir", "crates/opt"]
          EOF
          rm -f compiler/Cargo.lock
      - name: Cache Rust build objects
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: t5-typed-pipeline-v1
          cache-workspace-crates: 'true'
      - name: Test independent typed-pass oracle and negative controls
        shell: bash
        working-directory: compiler
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=10s 7m \
            cargo test -p compiler-opt --test typed_native_parity -- --nocapture \
            2>&1 | tee "$RUNNER_TEMP/t5-typed-pipeline.log"
          grep -F 'test typed_pipeline_semantics_match_independent_reference_across_pass_orders ... ok' "$RUNNER_TEMP/t5-typed-pipeline.log"
          grep -F 'test typed_pipeline_oracle_detects_wrong_values_and_dropped_traps ... ok' "$RUNNER_TEMP/t5-typed-pipeline.log"
          grep -F 'T5_TYPED_PIPELINE samples=28800 pass_orders=3' "$RUNNER_TEMP/t5-typed-pipeline.log"
          echo 'T5 bounded reference comparison: passed; no SMT claim' >> "$GITHUB_STEP_SUMMARY"
      - name: Check test and optimizer with strict Clippy
        shell: bash
        working-directory: compiler
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=10s 4m \
            cargo clippy -p compiler-opt --test typed_native_parity -- -D warnings
      - name: Preserve failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: t5-typed-pipeline-failure
          path: ${{ runner.temp }}/t5-typed-pipeline.log
          if-no-files-found: ignore
          retention-days: 7
