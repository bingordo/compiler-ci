name: x86 M1.12 physical control replay PR 1177
on:
  pull_request:
    paths:
      - '.github/workflows/verify-x86-m12-control-replay.yml'
permissions:
  contents: read
jobs:
  x86-control-replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: a82343bb773db86f2558d89cb2de63620361d9a3
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Check exact source SHA
        run: test "$(git -C compiler rev-parse HEAD)" = "a82343bb773db86f2558d89cb2de63620361d9a3"
      - name: Isolate independent core workspace
        run: |
          cat > compiler/Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir", "crates/opt", "crates/backend", "crates/backend-x86"]
          EOF
          rm -f compiler/Cargo.lock
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: x86-m12-control-replay
          cache-workspace-crates: 'true'
      - name: Focused physical replay and actual TypeId stream
        working-directory: compiler
        run: |
          cargo test -p compiler-backend-x86 --test typeid_physical_control_replay -- --nocapture
          cargo test -p compiler-backend-x86 --test typeid_physical_memory_replay -- --nocapture
          cargo test -p compiler-backend-x86 --test typeid_physical_subset_replay -- --nocapture
      - name: Full x86 backend tests and strict Clippy
        working-directory: compiler
        run: |
          cargo test -p compiler-backend-x86
          cargo clippy -p compiler-backend-x86 --all-targets -- -D warnings
