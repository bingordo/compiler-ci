name: Candidate IR storage census 3234
on:
  pull_request:
    paths:
      - '.github/workflows/verify-ir-storage-census-3234.yml'
permissions:
  contents: read
jobs:
  census:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 1cecb946aa40cd7cee8ee90873da0f9669e1ea39
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Verify candidate and restrict workspace
        run: |
          test "$(git -C compiler rev-parse HEAD)" = "1cecb946aa40cd7cee8ee90873da0f9669e1ea39"
          git -C compiler rev-parse HEAD | tee -a "$GITHUB_STEP_SUMMARY"
          rustc --version | tee -a "$GITHUB_STEP_SUMMARY"
          cat > compiler/Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir", "crates/backend"]
          EOF
          rm -f compiler/Cargo.lock
      - name: Run storage census
        working-directory: compiler
        shell: bash
        run: |
          set -euo pipefail
          cargo build -p compiler-backend --release --example ir_storage_census
          target/release/examples/ir_storage_census \
            crates/backend-aarch64/tests/fixtures/arithmetic_v3.ir \
            crates/backend-aarch64/tests/fixtures/typeid_abi_pressure_v3.ir \
            crates/backend-aarch64/tests/fixtures/direct_calls_sixteen_internal_v3.ir \
            crates/backend-aarch64/tests/fixtures/indexed_scales_v3.ir | tee -a "$GITHUB_STEP_SUMMARY"
