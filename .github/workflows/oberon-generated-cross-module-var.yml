name: Oberon generated cross-module VAR differential
on:
  push:
    paths:
      - '.github/workflows/oberon-generated-cross-module-var.yml'
  workflow_dispatch:
    inputs:
      source_ref:
        description: 'Compiler branch, tag or commit'
        type: string
        required: true
        default: main
      base_seed:
        description: 'First deterministic seed'
        type: string
        required: true
        default: '1'
      seeds:
        description: 'Number of seeds per run (1-64)'
        type: string
        required: true
        default: '4'
  schedule:
    # 02:17 PST / 03:17 PDT, every night.
    - cron: '17 10 * * *'
permissions:
  contents: read
concurrency:
  group: oberon-cross-module-${{ inputs.source_ref || 'main' }}
  cancel-in-progress: true
jobs:
  modules:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
      CARGO_INCREMENTAL: '0'
      OBERON_MODULE_BASE_SEED: ${{ inputs.base_seed || '1' }}
      OBERON_MODULE_SEEDS: ${{ inputs.seeds || '4' }}
    steps:
      - name: Checkout exact compiler candidate
        uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          # Exact candidate; restore the default compiler/main before merging.
          ref: c5ecdebdb468969ab4780dbe4fef3bf7b3def4f5
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Record selected compiler revision and resolve public frontend
        shell: bash
        run: |
          set -euo pipefail
          git -C compiler rev-parse HEAD
          git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: oberon-generated-cross-module-var-v1
      - name: Select fresh reproducible nightly seed window
        if: github.event_name == 'schedule'
        shell: bash
        run: |
          set -euo pipefail
          # UTC epoch-day gives stable, nonoverlapping four-seed windows;
          # workflow_dispatch retains its exact user-supplied replay seeds.
          epoch_day=$(( $(date -u +%s) / 86400 ))
          base=$((epoch_day * 4 + 1))
          echo "OBERON_MODULE_BASE_SEED=$base" >> "$GITHUB_ENV"
          echo "Nightly four-seed window begins at $base"
      - name: Run seeded cross-module VAR INTEGER/BOOLEAN C differential
        run: cargo test --manifest-path compiler/Cargo.toml -p compiler --test oberon_generated_module_var_native -- --nocapture
      - name: Reject generated bad module graphs, VAR actuals and ABI interfaces atomically
        run: cargo test --manifest-path compiler/Cargo.toml -p compiler --test oberon_generated_module_var_native generated_invalid_module_graphs_and_var_signatures_fail_atomically -- --nocapture
      - name: Generate and validate converging 5-10-module VAR ABI DAGs
        run: cargo test --manifest-path compiler/Cargo.toml -p compiler --test oberon_generated_module_dag_native -- --nocapture
      - name: Test seeded mixed-BEGIN DAG startup against independent C recurrence
        run: cargo test --manifest-path compiler/Cargo.toml -p compiler --test oberon_generated_module_initializers_native -- --nocapture
      - name: Benchmark exact compiler SHA reuse in checked multi-root batches
        run: cargo test --manifest-path compiler/Cargo.toml -p compiler --test oberon_module_batch_native -- --nocapture
      - name: Test independently compiled Oberon roots and mixed-object constructor ordering
        run: cargo test --manifest-path compiler/Cargo.toml -p compiler --test oberon_cross_build_module_initializers_native -- --nocapture
      - name: Compose independent native module builds and reject incompatible duplicates
        run: cargo test --manifest-path compiler/Cargo.toml -p compiler --test oberon_composed_module_builds_native -- --nocapture
      - name: Validate compiler executable and rustc/dependency-lock build identities
        run: cargo test --manifest-path compiler/Cargo.toml -p compiler --test oberon_composed_module_builds_native module_composition_rejects_mixed_and_unverified_compiler_build_identifiers -- --nocapture
      - name: Check strict module source-closure provenance schema
        run: cargo test --manifest-path compiler/Cargo.toml -p compiler --bin compiler module_build_provenance -- --nocapture
      - name: Validate shared ELF constructor priority relabeling
        run: cargo test --manifest-path compiler/Cargo.toml -p compiler-backend elf::constructor_priority -- --nocapture
      - name: Verify x86 runtime startup and AArch64 ELF/GAS constructor metadata
        run: cargo test --manifest-path compiler/Cargo.toml -p compiler --test oberon_ordered_module_initializers_native -- --nocapture
      - name: Preserve prior checked module graph and BOOLEAN imports
        run: cargo test --manifest-path compiler/Cargo.toml -p compiler --bin compiler native_multi_module_ -- --nocapture
      - name: Preserve exact failing generated sources for replay
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: oberon-generated-cross-module-failures
          path: |
            /tmp/oberon-module-generated-*
            /tmp/oberon-module-negative-*
            /tmp/oberon-module-dag-*
            /tmp/oberon-module-ctor-dag-*
            /tmp/oberon-module-seeded-ctor-*
            /tmp/oberon-cross-build-init-*
            /tmp/oberon-compose-*
            /tmp/oberon-batch-*
          if-no-files-found: ignore
          retention-days: 14
