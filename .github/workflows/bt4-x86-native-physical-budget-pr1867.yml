# Temporary exact-source BT4 native x86 physical register budget acceptance.
name: BT4 native x86 physical budget GAS/ELF/C TypeId parity
on:
  pull_request:
    paths: ['.github/workflows/bt4-x86-native-physical-budget-pr1867.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  aarch64-native:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 35
    env:
      CARGO_INCREMENTAL: '0'
      SOURCE_SHA: 8c64eed760651e3cd51b14a99909d168990d9b89
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 8c64eed760651e3cd51b14a99909d168990d9b89
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Verify exact compiler and persistent source boundary
        run: |
          set -euo pipefail
          test "$(git -C compiler rev-parse HEAD)" = "$SOURCE_SHA"
          python3 compiler/tools/check_bt4_backend_boundary.py
      - name: Isolate native ARM core Rust workspace
        run: |
          cat > compiler/Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir", "crates/opt", "crates/backend", "crates/backend-x86", "crates/backend-aarch64"]
          EOF
          rm -f compiler/Cargo.lock
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: bt4-x86-physical-budget-1867
      - name: Strict native ARM full AArch64 all-target compile
        working-directory: compiler
        run: RUSTFLAGS='-D warnings' cargo check -p compiler-backend-aarch64 --all-targets
      - name: Native historical machine quality four exact byte tests and five C oracles
        working-directory: compiler
        run: cargo test -p compiler-backend-aarch64 --test typeid_historical_pressure -- --nocapture
      - name: AArch64 all-native TypeId after complete Function historical source deletion
        working-directory: compiler
        run: cargo test -p compiler-backend-aarch64 --all-targets -- --test-threads=1
      - name: Strict AArch64 native test Clippy
        working-directory: compiler
        run: cargo clippy -p compiler-backend-aarch64 --lib --test typeid_historical_pressure -- -D warnings
  full-workspace:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      CARGO_INCREMENTAL: '0'
      SOURCE_SHA: 8c64eed760651e3cd51b14a99909d168990d9b89
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 8c64eed760651e3cd51b14a99909d168990d9b89
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.CI_KEY }}
      - name: Pin exact compiler and source-boundary test
        run: |
          set -euo pipefail
          test "$(git -C compiler rev-parse HEAD)" = "$SOURCE_SHA"
          ssh-keyscan github.com >> "$HOME/.ssh/known_hosts"
          python3 compiler/tools/check_bt4_backend_boundary.py
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler
          key: bt4-x86-physical-budget-full-1867
      - name: Original source C11 ProfileWide and Swap native physical 0/2/8/9/14/15 GAS/ELF budgets
        working-directory: compiler
        run: cargo test -p compiler-backend-x86 --test bt4_x86_physical_budget_native -- --nocapture
      - name: Native TypeId physical bank 0/2/8/9/14/15-budget + C/ELF/GAS references
        working-directory: compiler
        run: cargo test -p compiler-backend-x86 --test bt4_x86_profile_wide_native -- --nocapture
      - name: Native BT4 cyclic PHI and 17-argument rejection source regression
        working-directory: compiler
        run: cargo test -p compiler-backend-x86 --test bt4_x86_historical_arity_phi_native
      - name: Entire compiler workspace all-targets with frontend and driver
        working-directory: compiler
        run: cargo check --workspace --all-targets
      - name: Both production TypeId backends optimized without historical feature
        working-directory: compiler
        run: cargo check -p compiler-backend-x86 -p compiler-backend-aarch64 --release --lib
      - name: Strict original native x86 ProfileWide pressure/ABI Clippy
        working-directory: compiler
        run: cargo clippy -p compiler-backend-x86 --lib --test bt4_x86_profile_wide_native --test bt4_x86_physical_budget_native -- -D warnings
      - name: Full retained x86 backend library historical machine and ABI oracles
        working-directory: compiler
        run: cargo test -p compiler-backend-x86 --lib -- --test-threads=1
      - name: Native x86 narrow SSA CFG and flags/call regressions
        working-directory: compiler
        run: |
          cargo test -p compiler-backend-x86 --test m4_scalar_native --test native_typeid_call_liveness
          cargo test -p compiler-backend-x86 --test native_typeid_fused_cmp_select --test review_narrow_shift_oracle
          cargo test -p compiler-backend-x86 --test t5_x86_flag_provenance --test typed_i64_compare_branch_native
      - name: Positive boundary 16 mixed SysV arguments executable C11 ELF and GAS
        working-directory: compiler
        run: cargo test -p compiler-backend-x86 --test mixed_sixteen_call_native -- --nocapture
      - name: x86 native CMOV ABI and compiler optimizer original C references
        working-directory: compiler
        run: |
          cargo test -p compiler-opt --test if_conversion_typeid_remaining
          cargo test -p compiler-backend-x86 --test native_typeid_select_cmov --test typed_alias_calls_native
