name: One-off Csmith scoped variadic verifier A/B
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/bench-csmith-variadic.yml'
permissions:
  contents: read
  actions: read
concurrency:
  group: csmith-variadic-bench-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  compile-time:
    if: github.head_ref == 'bench/csmith-variadic-verifier' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 634e186ede654db1b1aabef0597dad7c5d90efb4
          path: baseline
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 03f221bd5b8c07e3997c331a8c644d3f795161c0
          path: candidate
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: large-csmith-compile-time
          run-id: 46029541162
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/original-csmith
      - name: Prepare exact inputs and revisions
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/csmith-ab" "$RUNNER_TEMP/bench-bin"
          git -C baseline rev-parse HEAD | tee "$RUNNER_TEMP/csmith-ab/baseline-sha"
          git -C candidate rev-parse HEAD | tee "$RUNNER_TEMP/csmith-ab/candidate-sha"
          git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
          python3 - "$RUNNER_TEMP/original-csmith" "$RUNNER_TEMP/csmith-ab" <<'PY'
          import hashlib, json, pathlib, shutil, sys
          src,dst=map(pathlib.Path,sys.argv[1:])
          report=json.loads((src/"report.json").read_text())
          for seed in (1001,):
              case=next(c for c in report["cases"] if c["seed"]==seed)
              for ext,key in (("c","source_sha256"),("i","preprocessed_sha256")):
                  p=src/f"case-{seed}.{ext}"
                  assert hashlib.sha256(p.read_bytes()).hexdigest()==case[key]
                  shutil.copyfile(p,dst/p.name)
              print("VERIFIED_INPUT",seed,case["lines"],case["preprocessed_sha256"])
          PY
          lscpu > "$RUNNER_TEMP/csmith-ab/host.txt"
          gcc --version > "$RUNNER_TEMP/csmith-ab/gcc.txt"
          rustc --version > "$RUNNER_TEMP/csmith-ab/rustc.txt"
          for rev in baseline candidate; do
            sed -i 's#ssh://git@github.com/bingordo/mini-c.git#https://github.com/bingordo/mini-c.git#g' "$rev/tools/mini-c-driver/Cargo.toml"
          done
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            baseline/tools/mini-c-driver -> target
            candidate/tools/mini-c-driver -> target
            candidate -> target
          key: csmith-scoped-verifier-ab-v1
      - name: Verify candidate ABI and PRE regressions
        run: |
          set -euo pipefail
          cargo test --manifest-path candidate/Cargo.toml -p compiler-ir --release --lib sysv_gp_variadic_tests 2>&1 | tee "$RUNNER_TEMP/csmith-ab/abi-tests.log"
          cargo test --manifest-path candidate/Cargo.toml -p compiler-opt --release --lib typed_pre 2>&1 | tee "$RUNNER_TEMP/csmith-ab/pre-tests.log"
          cargo clippy --manifest-path candidate/Cargo.toml -p compiler-ir --lib -- -D warnings 2>&1 | tee "$RUNNER_TEMP/csmith-ab/clippy.log"
      - name: Build same-runner release baseline and candidate
        run: |
          set -euo pipefail
          for rev in baseline candidate; do
            cargo build --release --manifest-path "$rev/tools/mini-c-driver/Cargo.toml" -p compiler-mini-c --bin compiler-mini-c 2>&1 | tee "$RUNNER_TEMP/csmith-ab/build-$rev.log"
            cp "$rev/tools/mini-c-driver/target/release/compiler-mini-c" "$RUNNER_TEMP/bench-bin/$rev"
            sha256sum "$RUNNER_TEMP/bench-bin/$rev" >> "$RUNNER_TEMP/csmith-ab/driver-sha256"
          done
      - name: Measure and verify exact original inputs
        run: |
          set -euo pipefail
          python3 - "$RUNNER_TEMP/csmith-ab" "$RUNNER_TEMP/bench-bin" <<'PY'
          import json, pathlib, subprocess, sys, time
          out,bins=map(pathlib.Path,sys.argv[1:])
          results=[]
          def save():
              (out/"ab.json").write_text(json.dumps(results,indent=2))
          def execute(cmd,limit,log):
              with log.open("wb") as stream:
                  return subprocess.run(["timeout","--kill-after=5s",f"{limit}s",*map(str,cmd)],stdout=stream,stderr=subprocess.STDOUT).returncode
          for seed in (1001,):
              src=out/f"case-{seed}.i"
              checksum=out/f"gcc-{seed}.checksum"
              gcc=out/f"gcc-{seed}"
              status=execute(["gcc","-O2","-w",src,"-o",gcc],120,out/f"gcc-{seed}.log")
              reference=execute([gcc],15,checksum) if status==0 else -1
              print("GCC_ORACLE",seed,status,reference,flush=True)
              for rep,order in enumerate((("baseline","candidate"),("candidate","baseline"),("baseline","candidate"))):
                  for rev in order:
                      # Baseline large-input timeout is a censored sample, not a timing.
                      label=f"{seed}-{rev}-{rep}"
                      obj=out/f"{label}.o"
                      timing=out/f"{label}.time"
                      start=time.monotonic()
                      rc=execute(["/usr/bin/time","-f","%e %U %S %M","-o",timing,bins/rev,src,
                                  "--emit","obj","-o",obj,"--omit-unreferenced-static-bodies"],
                                 90 if rev=="baseline" else 180,out/f"{label}.log")
                      record={"seed":seed,"revision":rev,"rep":rep,"exit":rc,"wall_seconds":time.monotonic()-start}
                      if rc==0 and obj.exists():
                          elapsed,user,system,rss=map(float,timing.read_text().splitlines()[-1].split())
                          record.update(cpu_seconds=user+system,wall_seconds=elapsed,rss_kib=int(rss),object_bytes=obj.stat().st_size)
                          exe=out/f"{label}.exe"
                          link=execute(["gcc",obj,"-o",exe],60,out/f"{label}.link")
                          check=out/f"{label}.checksum"
                          run=execute([exe],15,check) if link==0 else -1
                          record["verified"]=reference==0 and run==0 and check.read_bytes()==checksum.read_bytes()
                      else:
                          print("DIAGNOSTIC",label,(out/f"{label}.log").read_text(errors="replace")[:2000],flush=True)
                      results.append(record)
                      print("AB",json.dumps(record),flush=True)
                      save()
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scoped-variadic-csmith-ab
          path: ${{ runner.temp }}/csmith-ab/
          retention-days: 14
