name: Verify shared-predicate if-conversion CMOV lowering
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-ifconv-cmov-share.yml'
permissions:
  contents: read
concurrency:
  group: verify-ifconv-cmov-share
  cancel-in-progress: true
jobs:
  core-and-native:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: ifconv/share-cmov-predicate
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Record exact tested revision
        run: git -C compiler rev-parse HEAD | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Restrict to the self-contained optimizer and backend workspace
        shell: bash
        run: |
          set -euo pipefail
          cat > compiler/Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir", "crates/opt", "crates/backend", "crates/backend-x86"]
          EOF
          rm -f compiler/Cargo.lock
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: ifconv-cmov-share
      - name: Run full core and native x86 test suites
        working-directory: compiler
        run: cargo test -p compiler-ir -p compiler-opt -p compiler-backend -p compiler-backend-x86
      - name: Run strict Clippy on changed core and x86 crates
        working-directory: compiler
        run: cargo clippy -p compiler-opt -p compiler-backend-x86 --all-targets -- -D warnings
