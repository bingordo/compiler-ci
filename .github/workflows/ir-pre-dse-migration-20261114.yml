name: PRE/DSE native IR fixture migration (temporary)
on:
  push:
    branches: [verify/ir-pre-dse-migration-20261114]
    paths: ['.github/workflows/ir-pre-dse-migration-20261114.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 597f042851523459ef7825c928250b28cfd0293f
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Verify exact compiler revision
        run: test "$(git -C compiler rev-parse HEAD)" = "597f042851523459ef7825c928250b28cfd0293f"
      - name: Restrict workspace to compiler core
        run: |
          cat > compiler/Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir", "crates/opt", "crates/backend", "crates/backend-x86"]
          EOF
          rm -f compiler/Cargo.lock
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: ir-pre-dse-migration
      - name: Export fixed DSE graphs and test migrated PRE oracle
        working-directory: compiler
        run: |
          cargo test -p compiler-opt --test typed_dse temporarily_dump_dse_fixture_for_migration -- --nocapture
          cargo test -p compiler-opt --test typed_pre_native
