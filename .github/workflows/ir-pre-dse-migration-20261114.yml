name: PRE/DSE native IR fixture migration (temporary)
on:
  push:
    branches: [verify/ir-pre-dse-migration-20261114]
    paths: ['.github/workflows/ir-pre-dse-migration-20261114.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 47e8fee464af814ab65dc57000310469411e4889
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Verify exact compiler revision
        run: test "$(git -C compiler rev-parse HEAD)" = "47e8fee464af814ab65dc57000310469411e4889"
      - name: Restrict workspace to compiler core
        run: |
          cat > compiler/Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir", "crates/opt", "crates/backend", "crates/backend-x86"]
          EOF
          rm -f compiler/Cargo.lock
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: ir-pre-dse-migration
      - name: Validate migrated PRE/DSE and existing fixed-IR execution oracles
        working-directory: compiler
        run: |
          cargo test -p compiler-opt --test typed_pre_native --test typed_dse
          cargo test -p compiler-opt --test typed_sccp --test typed_ctfe --test typed_local_memory
          cargo test -p compiler-opt --test typed_phi_cfg --test typed_phi_dead_linear --test typed_if_conversion_pure
          cargo test -p compiler-opt --test ir_fixture_directives --test native_ir_pass_replay
          cargo test -p compiler-ir --test native_fixture_text --test native_module_text_v3
          cargo clippy -p compiler-opt --test typed_pre_native --test typed_dse -- -D warnings
