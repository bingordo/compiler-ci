name: Capture verified original TypeId verifier fixture graphs
on:
  push:
    branches: [verify/ir-verifier-fixed-originals-20261116]
    paths: ['.github/workflows/ir-verifier-fixed-originals-20261116.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: ccfffd2c5a61eff6c289587a7403c4b172c95123
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Verify exact source tree
        run: test "$(git -C compiler rev-parse HEAD)" = "ccfffd2c5a61eff6c289587a7403c4b172c95123"
      - name: Isolate native IR workspace
        run: |
          cat > compiler/Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir"]
          EOF
          rm -f compiler/Cargo.lock
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: fixed-typeid-verifier-original-export
      - name: Export six original native TypeId graphs without mutations
        working-directory: compiler
        run: |
          cargo test -p compiler-ir --test typed_value_flow export_original_fixed_native_v3 -- --nocapture
          cargo test -p compiler-ir --test typed_opcode_types export_original_fixed_native_v3 -- --nocapture
          cargo test -p compiler-ir --test typed_module_abi export_original_fixed_native_v3 -- --nocapture
      - name: Verify original value-flow opcode typing and ABI mutation tests
        working-directory: compiler
        run: |
          cargo test -p compiler-ir --test typed_value_flow --test typed_opcode_types --test typed_module_abi -- --nocapture
