name: Capture verified original TypeId verifier fixture graphs
on:
  push:
    branches: [verify/ir-verifier-fixed-originals-20261116]
    paths: ['.github/workflows/ir-verifier-fixed-originals-20261116.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 64f20fe39132e869c78ece86ca6ae6e3eaf113c4
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Verify exact source tree
        run: test "$(git -C compiler rev-parse HEAD)" = "64f20fe39132e869c78ece86ca6ae6e3eaf113c4"
      - name: Isolate native IR workspace
        run: |
          cat > compiler/Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir"]
          EOF
          rm -f compiler/Cargo.lock
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: fixed-typeid-verifier-original-export
      - name: Verify six compact verifier modules and exact text/binary ABI parity
        working-directory: compiler
        run: |
          cargo test -p compiler-ir --test native_fixed_verifier_fixtures -- --nocapture
          cargo test -p compiler-ir --test native_fixture_text --test native_module_text_v3
      - name: Verify original value-flow opcode typing and ABI mutation tests
        working-directory: compiler
        run: |
          cargo test -p compiler-ir --test typed_value_flow --test typed_opcode_types --test typed_module_abi -- --nocapture
      - name: Strict Clippy for all original and new verifier tests
        working-directory: compiler
        run: |
          cargo clippy -p compiler-ir --no-deps --test native_fixed_verifier_fixtures --test typed_value_flow --test typed_opcode_types --test typed_module_abi -- -D warnings
