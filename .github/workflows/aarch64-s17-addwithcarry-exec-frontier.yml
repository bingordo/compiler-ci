name: AArch64 S17 authentic AddWithCarry ASL execution frontier
on:
  pull_request:
    paths:
      - '.github/workflows/aarch64-s17-addwithcarry-exec-frontier.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-helper:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: d0824fcf3050b59dbf0fb8efca4608f6c66ce92e
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: herd/herdtools7
          ref: cfc4f56c522ec0d701acaf5a23139b47e8711299
          path: herd
          sparse-checkout: |
            herd/libdir/asl-pseudocode/bundler.py
          persist-credentials: false
      - name: Discover exact original helper declaration and dependencies
        run: |
          set -euo pipefail
          curl -fLsS --retry 3 --connect-timeout 20 --max-time 240 --max-filesize 200000000 -o /tmp/arm2026.tar.gz https://developer.arm.com/-/cdn-downloads/permalink/Exploration-Tools-A64-ISA/ISA_A64/ISA_A64_xml_A_profile-2026-09.tar.gz
          echo "44cfb89c763c7eea8e59de0ad2221e3c012e6aa77899bd7f1c3e1f24537191d7  /tmp/arm2026.tar.gz" | sha256sum -c -
          python3 - <<'PY'
          import sys, re, hashlib, tarfile, tempfile
          from pathlib import Path
          from argparse import Namespace
          import xml.etree.ElementTree as ET
          sys.path.insert(0,'compiler/tools')
          from aarch64_a32_aslref_compat import load_bundler
          from aarch64_a32_asl_source_links import ROOT
          bundle=load_bundler(Path('herd/herd/libdir/asl-pseudocode/bundler.py'))
          with tempfile.TemporaryDirectory() as tmp:
              folder=Path(tmp)
              with tarfile.open('/tmp/arm2026.tar.gz','r:gz') as tar:
                  item=tar.getmember(ROOT+'shared_pseudocode.xml')
                  raw=tar.extractfile(item).read()
              (folder/'shared_pseudocode.xml').write_bytes(raw)
              target=folder/'shared.asl'
              bundle.make_shared_pseudocode(Namespace(i_files=[folder/'shared_pseudocode.xml'],o_dir=target))
              src=target.read_text()
              lines=src.splitlines()
              headers=[(i,line.strip()) for i,line in enumerate(lines) if re.search(r'\b(?:func|procedure)\s+AddWithCarry\b',line)]
              calls=[i for i,line in enumerate(lines) if 'AddWithCarry' in line]
              print('S17_ORIGINAL_SOURCE',len(raw),hashlib.sha256(raw).hexdigest(),len(src),hashlib.sha256(src.encode()).hexdigest())
              print('S17_HELPER_DECLARATIONS',len(headers),'source_occurrences',len(calls))
              for index,line in headers:
                  print('S17_HELPER_SIGNATURE', 'line',index,'length',len(line),'sha',hashlib.sha256(line.encode()).hexdigest(),
                        'generic',bool(re.search(r'\{N\}',line)), 'tuple_result', 'bits(4)' in line,
                        'arity3',line.count(',')>=2, 'return_arrow','=>' in line)
                  nearby='\n'.join(lines[index:index+110])
                  print('S17_HELPER_BODY_SHAPE','AddWithCarry_selfcalls',nearby.count('AddWithCarry'),
                        'UInt',nearby.count('UInt('),'SInt',nearby.count('SInt('),
                        'IsZero',nearby.count('IsZero('),'return',len(re.findall(r'\breturn\b',nearby)),
                        'ends',len(re.findall(r'\bend\s*;',nearby)))
              xml=ET.fromstring(raw)
              containing=[]
              for ps in xml.iter('ps'):
                  txt=''.join(ps.itertext())
                  if re.search(r'\bAddWithCarry\b',txt):
                      containing.append((ps.get('name'),ps.get('secttype'),len(txt),hashlib.sha256(txt.encode()).hexdigest(),len(re.findall(r'\bAddWithCarry\b',txt))))
              print('S17_ORIGINAL_XML_SECTIONS',containing[:20])
              assert len(headers)==1, 'source declaration not unique'
          PY

  execute-original-helper:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    container:
      image: ocaml/opam:alpine-3.21-ocaml-5.2
      options: --user root
    env:
      OPAMROOT: /home/opam/.opam
      OPAMROOTISOK: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          repository: herd/herdtools7
          ref: cfc4f56c522ec0d701acaf5a23139b47e8711299
          path: herd
          persist-credentials: false
      - name: Build pinned upstream ASLRef
        shell: sh
        run: |
          set -eu
          apk add --no-cache bash python3 curl coreutils git openssh-client gmp-dev pkgconf
          opam install -y dune menhir zarith
          (cd herd && opam exec -- dune build -p aslref --profile release)
          ./herd/_build/default/asllib/aslref.exe --version | grep -Fx 'aslref version 1.0-EAC2'
      - name: Run exact Arm published AddWithCarry code in ASLRef
        shell: sh
        run: |
          set -eu
          curl -fLsS --retry 3 --connect-timeout 20 --max-time 240 --max-filesize 200000000 -o /tmp/arm2026.tar.gz https://developer.arm.com/-/cdn-downloads/permalink/Exploration-Tools-A64-ISA/ISA_A64/ISA_A64_xml_A_profile-2026-09.tar.gz
          echo '44cfb89c763c7eea8e59de0ad2221e3c012e6aa77899bd7f1c3e1f24537191d7  /tmp/arm2026.tar.gz' | sha256sum -c -
          python3 - <<'PY'
          import hashlib,tarfile,xml.etree.ElementTree as ET
          root='ISA_A64_xml_A_profile-2026-09/'
          with tarfile.open('/tmp/arm2026.tar.gz','r:gz') as tar:
              xml=tar.extractfile(root+'shared_pseudocode.xml').read()
          matches=[]
          for ps in ET.fromstring(xml).iter('ps'):
              if ps.get('name')=='shared/functions/integer/AddWithCarry':
                  matches.append(''.join(ps.itertext()))
          assert len(matches)==1
          original=matches[0]
          assert len(original)==683
          assert hashlib.sha256(original.encode()).hexdigest()=='1e80df3bc60c0393805a5c93aab8aeca6a3428e22fe2dc1d8c484f8f969e5129'
          assert original.count('func AddWithCarry')==1
          def literal(bits,value):
              return "'"+format(value,'0'+str(bits)+'b')+"'"
          cases=[
              (32,0,0,0,0,4),
              (32,(1<<32)-1,0,1,0,6),
              (64,0,0,0,0,4),
              (64,1<<63,1<<63,0,0,7),
              (64,(1<<64)-1,0,1,0,6),
          ]
          lines=['func main() => integer','begin']
          for i,(bits,a,b,carry,result,nzcv) in enumerate(cases):
              lines.append('    let (r'+str(i)+',f'+str(i)+') = AddWithCarry{'+str(bits)+'}('+
                           literal(bits,a)+', '+literal(bits,b)+', '+literal(1,carry)+');')
              lines.append('    assert r'+str(i)+' == '+literal(bits,result)+';')
              lines.append('    assert f'+str(i)+' == '+literal(4,nzcv)+';')
          lines+=['    return 0;','end;','']
          open('/tmp/addwithcarry-original.asl','w').write(original+'\n'+'\n'.join(lines))
          print('ORIGINAL_ARM_HELPER_ASL_RUN',len(cases),'source_section_sha256',
                hashlib.sha256(original.encode()).hexdigest(), 'original_helper_unmodified=true')
          PY
          ./herd/_build/default/asllib/aslref.exe --version-eac1 --type-check-strict -1 /tmp/addwithcarry-original.asl
          echo 'SOURCE_EXECUTED_ASLREF_ADDWITHCARRY_CARRY_NZCV_PASS'

      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: e4a965517c583971d0ae8e7e3c16cdd6e220cca0
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Test compiler S17 source-pinned 272-case full helper harness
        shell: sh
        run: |
          set -eu
          test "$(git -C compiler rev-parse HEAD)" = e4a965517c583971d0ae8e7e3c16cdd6e220cca0
          python3 -m unittest discover -s compiler/tools -p 'test_aarch64_a32_addwithcarry_asl_runtime.py' -v
          python3 compiler/tools/aarch64_a32_addwithcarry_asl_runtime.py --archive /tmp/arm2026.tar.gz \
            --aslref "$(pwd)/herd/_build/default/asllib/aslref.exe" --out /tmp/original-addwithcarry-result.json
          python3 - <<'PY'
          import json
          j=json.load(open('/tmp/original-addwithcarry-result.json'))
          assert j['sample_count']==272
          assert j['aslref_execution_passed'] and j['helper_differential_passed']
          assert not j['full_instruction_semantics_verified']
          assert not j['typed_ir_equivalence_proven']
          assert not j['selection_eligible']
          print('S17_272_ORIGINAL_HELPER_EXECUTED_AND_CHECKED', j['sample_count'])
          PY
