# Temporary checked IR export only; never merge.
name: Temporary IR mem2reg fixed-fixture validation
on:
  pull_request:
    paths: ['.github/workflows/ir-mem2reg-export-20261114.yml']
  push:
    branches: [ci/ir-mem2reg-fixed-export-20261114]
    paths: ['.github/workflows/ir-mem2reg-export-20261114.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 78a673060ff6a3d1b5a7baf64f74458145e656d6
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Verify source and isolate core workspace
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C compiler rev-parse HEAD)" = "78a673060ff6a3d1b5a7baf64f74458145e656d6"
          echo "compiler SHA: 78a673060ff6a3d1b5a7baf64f74458145e656d6" >> "$GITHUB_STEP_SUMMARY"
          cat > compiler/Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir", "crates/opt", "crates/backend", "crates/backend-x86"]
          EOF
          rm -f compiler/Cargo.lock
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: typed-mem2reg-fixture
      - name: Execute all original mem2reg oracle and CLI replay tests
        working-directory: compiler
        run: |
          set -euo pipefail
          cargo test -p compiler-opt --test typed_mem2reg -- --nocapture
      - name: Verify adjacent migrated PRE and DSE fixture oracles
        working-directory: compiler
        run: |
          cargo test -p compiler-opt --test typed_pre_native
          cargo test -p compiler-opt --test typed_dse
      - name: Check compiler core all target tests
        working-directory: compiler
        run: cargo check --workspace --all-targets
      - name: Strict compiler core Clippy
        working-directory: compiler
        run: cargo clippy -p compiler-ir -p compiler-opt -p compiler-backend -p compiler-backend-x86 --all-targets -- -D warnings
