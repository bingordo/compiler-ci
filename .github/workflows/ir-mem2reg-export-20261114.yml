# Temporary checked IR export only; never merge.
name: Temporary IR mem2reg fixed-graph export
on:
  pull_request:
    paths: ['.github/workflows/ir-mem2reg-export-20261114.yml']
  push:
    branches: [ci/ir-mem2reg-fixed-export-20261114]
    paths: ['.github/workflows/ir-mem2reg-export-20261114.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 3d4c72561c3bee47aa686a61d0538d564f29ebea
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Verify source and isolate core workspace
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C compiler rev-parse HEAD)" = "3d4c72561c3bee47aa686a61d0538d564f29ebea"
          echo "compiler SHA: 3d4c72561c3bee47aa686a61d0538d564f29ebea" >> "$GITHUB_STEP_SUMMARY"
          cat > compiler/Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir", "crates/opt", "crates/backend", "crates/backend-x86"]
          EOF
          rm -f compiler/Cargo.lock
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: typed-mem2reg-fixture
      - name: Export canonical v3 fixed inputs from existing checked Rust builders
        working-directory: compiler
        run: |
          set -euo pipefail
          cargo test -p compiler-opt --test typed_mem2reg export_existing_fixed_mem2reg_ir_for_fixture_migration -- --nocapture
