name: One-off typed algebra PR1663 exact-parent tests and ABBA
on:
  pull_request:
    paths:
      - '.github/workflows/review-typed-algebra-pr1663.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: c7c75ae580a66caa2cdb13221cb59d217e037de0
          path: compiler
          fetch-depth: 3
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Confirm immutable compiler head
        run: test "$(git -C compiler rev-parse HEAD)" = "c7c75ae580a66caa2cdb13221cb59d217e037de0"
      - name: Core-only workspace for independent CI
        shell: bash
        run: |
          cat > compiler/Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir", "crates/opt", "crates/backend", "crates/backend-x86", "crates/backend-aarch64"]
          EOF
          rm -f compiler/Cargo.lock
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: review-algebra-1663
      - name: Focused exact-noop and zero-removal algebra regressions
        working-directory: compiler
        run: cargo test -p compiler-opt --test typed_algebra -- --nocapture
      - name: Strict library Clippy (unrelated S23.50 test compile fixed separately)
        working-directory: compiler
        run: cargo clippy -p compiler-ir -p compiler-opt --lib -- -D warnings
      - name: Prepare exact-parent release benchmark
        shell: bash
        run: |
          git clone --no-checkout compiler parent
          git -C parent checkout 5502ed733d996cf896a796273dd97a1a86616401
          test "$(git -C parent rev-parse HEAD)" = "5502ed733d996cf896a796273dd97a1a86616401"
          cat > parent/Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir", "crates/opt", "crates/backend", "crates/backend-x86", "crates/backend-aarch64"]
          EOF
          rm -f parent/Cargo.lock
          for dir in parent compiler; do
            mkdir -p "$dir/crates/opt/examples"
            cat > "$dir/crates/opt/examples/review_typed_algebra.rs" <<'EOF'
          use compiler_ir::native_module_text_v3::read_native_module_text_v3;
          use compiler_opt::typed_algebra::simplify_typed;
          use std::{env,hint::black_box,time::Instant};
          fn main() {
              let mode=env::args().nth(1).expect("mode");
              let src=if mode=="removed" {include_str!("../tests/fixtures/typed_algebra_diamond_v3.ir")}
                  else {include_str!("../tests/fixtures/typed_algebra_cross_block_v3.ir")};
              let fixture=read_native_module_text_v3(src).unwrap();
              let mut prepared=fixture.clone();
              let initial=simplify_typed(&mut prepared).unwrap();
              if mode=="removed" {assert!(initial>0);} else {assert_eq!(initial,0);}
              let mut samples=Vec::new();
              for _ in 0..500 {
                  let start=Instant::now();
                  match mode.as_str() {
                      "noop" => {
                          assert_eq!(simplify_typed(&mut prepared).unwrap(),0);
                          black_box(&prepared);
                      },
                      "rewrite" | "removed" => {
                          let mut m=fixture.clone();
                          let removed=simplify_typed(&mut m).unwrap();
                          if mode=="removed" {assert!(removed>0);}
                          else {assert_eq!(removed,0);}
                          assert_ne!(m,fixture);
                          black_box(m);
                      },
                      _ => panic!("unknown mode"),
                  }
                  samples.push(start.elapsed().as_nanos());
              }
              samples.sort_unstable();
              println!("{} {}",mode,samples[samples.len()/2]);
          }
          EOF
          done
      - name: Build exact-parent and candidate release benchmark
        shell: bash
        run: |
          (cd parent && cargo build -p compiler-opt --release --example review_typed_algebra)
          (cd compiler && cargo build -p compiler-opt --release --example review_typed_algebra)
      - name: Run same-runner exact-parent ABBA both no-op and rewrite
        shell: bash
        run: |
          set -euo pipefail
          : > /tmp/algebra_abba.txt
          for mode in noop rewrite removed; do
            for round in 1 2 3 4 5; do
              for side in parent compiler compiler parent; do
                printf '%s %s %s ' "$mode" "$round" "$side" >> /tmp/algebra_abba.txt
                "$side/target/release/examples/review_typed_algebra" "$mode" >> /tmp/algebra_abba.txt
              done
            done
          done
          cat /tmp/algebra_abba.txt
          python3 - <<'PY'
          from collections import defaultdict
          from statistics import median
          groups=defaultdict(list)
          for line in open("/tmp/algebra_abba.txt"):
              case,iteration,side,reported,ns=line.split()
              assert case==reported
              groups[case,side].append(int(ns))
          for case in ("noop","rewrite","removed"):
              a=median(groups[case,"parent"])
              b=median(groups[case,"compiler"])
              print("CT11_ALGEBRA_ABBA",case,"parent_ns",a,"candidate_ns",b,"speedup",round(a/b,4))
          PY
