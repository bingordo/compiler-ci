name: Oberon VAR BOOLEAN native ABI regression
on:
  push:
    paths:
      - '.github/workflows/oberon-var-boolean-native.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  var-boolean-native:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
      CARGO_INCREMENTAL: '0'
    steps:
      - name: Checkout exact compiler candidate
        uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: fc1f1acb1cffd7886b5d0f628dacb8581bd2c82d
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Verify compiler and checked Oberon dependency revisions
        run: |
          set -euo pipefail
          test "$(git -C compiler rev-parse HEAD)" = "fc1f1acb1cffd7886b5d0f628dacb8581bd2c82d"
          grep -Fq 'rev = "99f576f7bc793e6b04e4e0ad75eb5cad780ba875"' compiler/crates/driver/Cargo.toml
          git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: oberon-var-boolean-native-v1
      - name: Validate VAR BOOLEAN mutation forwarding alias and short-circuit
        run: cargo test --manifest-path compiler/Cargo.toml -p compiler --test oberon_var_boolean_native -- --nocapture
      - name: Regression - checked integer VAR and arrays
        run: cargo test --manifest-path compiler/Cargo.toml -p compiler --test oberon_indexed_var_native -- --nocapture
      - name: Regression - boolean native source driver
        run: cargo test --manifest-path compiler/Cargo.toml -p compiler --bin compiler native_boolean -- --nocapture
