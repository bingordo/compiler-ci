name: Validate compiler PR head
on:
  workflow_call:
    inputs:
      source_ref:
        required: true
        type: string
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: ${{ inputs.source_ref }}
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Verify exact revision
        run: test "$(git -C compiler rev-parse HEAD)" = "${{ inputs.source_ref }}"
      - uses: actions/checkout@v4
        with:
          path: ci-workflow
      - name: Enforce production TypeId-only source driver boundary
        shell: bash
        run: |
          set -euo pipefail
          python3 compiler/tools/check_typeid_driver_boundary.py --root compiler
          python3 compiler/tools/test_check_typeid_driver_boundary.py
      - name: Check successful SHA cache
        id: passed
        uses: actions/cache/restore@v4
        with:
          path: .verified-compiler-pr
          key: compiler-pr-passed-v1-${{ hashFiles('ci-workflow/.github/workflows/verify-compiler-pr-head.yml') }}-${{ inputs.source_ref }}
          lookup-only: true
      - name: Identify regression environment
        if: steps.passed.outputs.cache-hit != 'true'
        id: environment
        shell: bash
        run: |
          set -euo pipefail
          # Retry at least once per UTC day even if main is unchanged.
          # Never reuse across source, workflow, toolchain or image changes.
          fingerprint=$(printf '%s\n' "${ImageOS:-unknown}" "${ImageVersion:-unknown}" "$(rustc -vV)" "$(cargo -V)" | sha256sum | cut -d' ' -f1)
          echo "fingerprint=$fingerprint" >> "$GITHUB_OUTPUT"
          echo "day=$(date -u +%F)" >> "$GITHUB_OUTPUT"
          if [[ -n "${ImageOS:-}" && -n "${ImageVersion:-}" ]]; then echo 'known=true' >> "$GITHUB_OUTPUT"; fi
      - name: Check previous completed ordinary regression failure
        if: steps.passed.outputs.cache-hit != 'true' && steps.environment.outputs.known == 'true'
        id: failed
        uses: actions/cache/restore@v4
        with:
          path: .failed-compiler-core
          key: compiler-core-failed-v2-${{ hashFiles('ci-workflow/.github/workflows/verify-compiler-pr-head.yml', 'ci-workflow/tools/core_failure_receipt.py') }}-${{ steps.environment.outputs.fingerprint }}-${{ steps.environment.outputs.day }}-${{ inputs.source_ref }}
      - name: Report previously confirmed failure on unchanged source
        if: steps.failed.outputs.cache-hit == 'true'
        shell: bash
        env:
          SOURCE_SHA: ${{ inputs.source_ref }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          result = json.loads(Path(".failed-compiler-core/result.json").read_text())
          assert result["source_sha"] == os.environ["SOURCE_SHA"]
          assert result["failed"] > 0 and result["passed"] > 0
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
              print("Reused confirmed ordinary Rust regression failure on unchanged source.", file=summary)
              print(f"Compiler revision: {result['source_sha']}", file=summary)
              print(f"Previously executed: {result['passed']} passed, {result['failed']} failed, {result['ignored']} ignored.", file=summary)
              print(f"Original run: {result['run_url']}", file=summary)
              print("Not a new test execution; retry at the next UTC day or dispatch the manual core gate.", file=summary)
          PY
          exit 1
      - name: Restrict workspace to core crates
        if: steps.passed.outputs.cache-hit != 'true' && steps.failed.outputs.cache-hit != 'true'
        shell: bash
        run: |
          cat > compiler/Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir", "crates/opt", "crates/backend", "crates/backend-x86"]
          exclude = ["crates/ir-macros", "crates/backend-aarch64"]
          EOF
          rm -f compiler/Cargo.lock
      - name: Verify exact four-package runner scope
        if: steps.passed.outputs.cache-hit != 'true'
        working-directory: compiler
        run: |
          python3 - <<'PY'
          import json, subprocess
          metadata = json.loads(subprocess.check_output(
              ["cargo", "metadata", "--no-deps", "--format-version", "1"]))
          members = set(metadata["workspace_members"])
          actual = {p["name"] for p in metadata["packages"] if p["id"] in members}
          expected = {"compiler-ir", "compiler-opt", "compiler-backend", "compiler-backend-x86"}
          assert actual == expected, "Core package scope changed; review the explicit test selection"
          PY
      - uses: Swatinem/rust-cache@v2
        if: steps.passed.outputs.cache-hit != 'true'
        with:
          workspaces: compiler -> target
          key: external-pr-core
      - name: Install required native GDB test dependency
        if: steps.passed.outputs.cache-hit != 'true'
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends gdb
          command -v gdb
          gdb --version | head -n 1
      - name: Run ordinary core regression
        id: ordinary
        if: steps.passed.outputs.cache-hit != 'true' && steps.failed.outputs.cache-hit != 'true'
        working-directory: compiler
        run: python3 tools/regression.py --profile workspace --suite cargo-tests --no-isolate-build-failures --output target/regression-core
      - name: Classify completed ordinary test failure for exact-SHA reuse
        id: failure-receipt
        if: ${{ failure() && steps.ordinary.outcome == 'failure' && steps.failed.outputs.cache-hit != 'true' && steps.environment.outputs.known == 'true' }}
        env:
          SOURCE_SHA: ${{ inputs.source_ref }}
        run: |
          python3 ci-workflow/tools/core_failure_receipt.py compiler/target/regression-core/summary.json .failed-compiler-core/result.json
      - name: Cache completed ordinary regression failure receipt
        if: ${{ failure() && steps.failure-receipt.outputs.reusable == 'true' }}
        uses: actions/cache/save@v4
        with:
          path: .failed-compiler-core
          key: compiler-core-failed-v2-${{ hashFiles('ci-workflow/.github/workflows/verify-compiler-pr-head.yml', 'ci-workflow/tools/core_failure_receipt.py') }}-${{ steps.environment.outputs.fingerprint }}-${{ steps.environment.outputs.day }}-${{ inputs.source_ref }}
      - name: Record passing source
        if: steps.passed.outputs.cache-hit != 'true' && success()
        run: |
          mkdir -p .verified-compiler-pr
          printf '%s\n' "${{ inputs.source_ref }}" > .verified-compiler-pr/sha
      - name: Cache passing source
        if: steps.passed.outputs.cache-hit != 'true' && success()
        uses: actions/cache/save@v4
        with:
          path: .verified-compiler-pr
          key: compiler-pr-passed-v1-${{ hashFiles('ci-workflow/.github/workflows/verify-compiler-pr-head.yml') }}-${{ inputs.source_ref }}
