name: Validate compiler PR head
on:
  workflow_call:
    inputs:
      source_ref:
        required: true
        type: string
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: ${{ inputs.source_ref }}
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Verify exact revision
        run: test "$(git -C compiler rev-parse HEAD)" = "${{ inputs.source_ref }}"
      - uses: actions/checkout@v4
        with:
          path: ci-workflow
      - name: Enforce production TypeId-only source driver boundary
        shell: bash
        run: |
          set -euo pipefail
          python3 compiler/tools/check_typeid_driver_boundary.py --root compiler
          python3 compiler/tools/test_check_typeid_driver_boundary.py
      - name: Check successful SHA cache
        id: passed
        uses: actions/cache/restore@v4
        with:
          path: .verified-compiler-pr
          key: compiler-pr-passed-v1-${{ hashFiles('ci-workflow/.github/workflows/verify-compiler-pr-head.yml') }}-${{ inputs.source_ref }}
          lookup-only: true
      - name: Restrict workspace to core crates
        if: steps.passed.outputs.cache-hit != 'true'
        shell: bash
        run: |
          cat > compiler/Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir", "crates/opt", "crates/backend", "crates/backend-x86"]
          exclude = ["crates/ir-macros", "crates/backend-aarch64"]
          EOF
          rm -f compiler/Cargo.lock
      - name: Verify exact four-package runner scope
        if: steps.passed.outputs.cache-hit != 'true'
        working-directory: compiler
        run: |
          python3 - <<'PY'
          import json, subprocess
          metadata = json.loads(subprocess.check_output(
              ["cargo", "metadata", "--no-deps", "--format-version", "1"]))
          members = set(metadata["workspace_members"])
          actual = {p["name"] for p in metadata["packages"] if p["id"] in members}
          expected = {"compiler-ir", "compiler-opt", "compiler-backend", "compiler-backend-x86"}
          assert actual == expected, "Core package scope changed; review the explicit test selection"
          PY
      - uses: Swatinem/rust-cache@v2
        if: steps.passed.outputs.cache-hit != 'true'
        with:
          workspaces: compiler -> target
          key: external-pr-core
      - name: Install required native GDB test dependency
        if: steps.passed.outputs.cache-hit != 'true'
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends gdb
          command -v gdb
          gdb --version | head -n 1
      - name: Run core TypeId regression suite
        if: steps.passed.outputs.cache-hit != 'true'
        working-directory: compiler
        run: |
          # The isolated workspace contains exactly the four original core crates.
          python3 tools/regression.py --profile workspace --suite cargo-tests --no-isolate-build-failures --output target/regression-core
          # Retired Function generated-rule feature is no longer a separate gate.
          # The workspace profile executes the maintained native TypeId tests.
      - name: Record passing source
        if: steps.passed.outputs.cache-hit != 'true' && success()
        run: |
          mkdir -p .verified-compiler-pr
          printf '%s\n' "${{ inputs.source_ref }}" > .verified-compiler-pr/sha
      - name: Cache passing source
        if: steps.passed.outputs.cache-hit != 'true' && success()
        uses: actions/cache/save@v4
        with:
          path: .verified-compiler-pr
          key: compiler-pr-passed-v1-${{ hashFiles('ci-workflow/.github/workflows/verify-compiler-pr-head.yml') }}-${{ inputs.source_ref }}
