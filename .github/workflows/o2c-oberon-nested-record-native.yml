name: O2c nested homogeneous Oberon records native TypeId candidate
on:
  pull_request:
    paths:
      - '.github/workflows/o2c-oberon-nested-record-native.yml'
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 47f51df14aaa96824018e7f80161fb201b4a34e5
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Source and pinned frontend identity
        run: |
          set -euxo pipefail
          test "$(git -C compiler rev-parse HEAD)" = 47f51df14aaa96824018e7f80161fb201b4a34e5
          grep -Fq 'rev = "90b53194231de32288183bde568fa5ba8f71cab6"' compiler/crates/driver/Cargo.toml
          git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: oberon-o2c-nested-record
      - name: Checked native TypeId nested record + O2a/O2b regression C oracles
        run: |
          set -euxo pipefail
          cargo check --manifest-path compiler/Cargo.toml -p compiler --all-targets
          cargo test --manifest-path compiler/Cargo.toml -p compiler --bin compiler \
            checked_oberon_nested_integer_record_fields_native_typeid_gas_elf -- --nocapture
          cargo test --manifest-path compiler/Cargo.toml -p compiler --bin compiler \
            checked_oberon_inherited_record_layout_prefix_copies_execute_typeid -- --nocapture
          cargo test --manifest-path compiler/Cargo.toml -p compiler --bin compiler \
            checked_oberon_contiguous_record_layout_and_copies_execute_typeid -- --nocapture
      - name: Strict all-target driver Clippy
        run: cargo clippy --manifest-path compiler/Cargo.toml -p compiler --all-targets -- -D warnings
