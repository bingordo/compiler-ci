name: X7 B3 bounded source-model Z3 shard and exact-query dedup
on:
  push:
    branches: [ci/x7-b3-proof-dedup-shards-20261111]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact-model:
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 0f2438574a7218012c0a06723eaa0f9e76ec7f7b
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Pin exact source and independent verifier version
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 0f2438574a7218012c0a06723eaa0f9e76ec7f7b
          python3 -m venv /tmp/x7-source-z3
          /tmp/x7-source-z3/bin/python -m pip install --disable-pip-version-check 'z3-solver==4.13.4.0'
          /tmp/x7-source-z3/bin/python -c 'import z3; print("X7_Z3_VERSION",z3.get_version_string())'
      - name: Check dedup, task shard union and direct Z3 negative controls
        run: |
          set -euo pipefail
          /tmp/x7-source-z3/bin/python -m py_compile tools/x86_isl_operation_proof_worker.py tools/test_x86_isl_operation_proof_worker.py
          /tmp/x7-source-z3/bin/python -m unittest discover -s tools -p 'test_x86_isl_operation_proof_worker.py' -v
          /tmp/x7-source-z3/bin/python -m unittest discover -s tools -p 'test_x86_isl_smt_verify.py' -v
          /tmp/x7-source-z3/bin/python -m unittest discover -s tools -p 'test_x86_isl_definedness_smt.py' -v
          /tmp/x7-source-z3/bin/python -m unittest discover -s tools -p 'test_x86_isl_record_effects_smt.py' -v
          echo X7_B3_MODEL_QUERY_DEDUP_SHARDS_GREEN
