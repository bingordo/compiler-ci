name: X7 S3 cross-layer provenance (source-pinned)
on:
  pull_request:
    paths:
      - '.github/workflows/x86-s3-cross-layer-provenance-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  x86-s3-cross-layer:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      SOURCE_SHA: '2864bdaf99ad768879245e9360e12e57b86ad65c'
      PYTHONPATH: compiler/tools
    steps:
      - name: Checkout exact compiler source, not Actions on compiler
        uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 2864bdaf99ad768879245e9360e12e57b86ad65c
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false

      - name: Verify exact compiler commit
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git -C compiler rev-parse HEAD)"
          echo "Compiler source: $actual"
          test "$actual" = "$SOURCE_SHA"

      - name: Check Python syntax and earlier proof bridge regressions
        shell: bash
        run: |
          set -euo pipefail
          python3 -m compileall -q \
            compiler/tools/x86_s3_source_proof_variant_bridge.py \
            compiler/tools/x86_s3_add_width_native_join.py \
            compiler/tools/x86_s3_cross_layer_bundle.py \
            compiler/tools/test_x86_s3_cross_layer_bundle.py
          python3 -m unittest -v \
            test_x86_s3_source_proof_variant_bridge \
            test_x86_s3_add_width_native_join \
            test_x86_s3_cross_layer_bundle
          echo 'S3 cross-layer schema/mutation tests passed (synthetic fixtures only)'
