      - name: Execute actual Alive-lite proof tests
        if: steps.verified.outputs.cache-hit != 'true' || inputs.force_recheck || github.event_name == 'push'
        shell: bash
        env:
          ALIVE_LITE_FAILURE_DIR: ${{ runner.temp }}/alive-lite-failures
          AL05_REPLAY_DIR: ${{ github.workspace }}/alive-lite-al05-replay
          AL05_P3_REPLAY_DIR: ${{ github.workspace }}/alive-lite-al05-p3-replay
          AL05_SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          set -euo pipefail
          mkdir -p "$ALIVE_LITE_FAILURE_DIR" "$AL05_REPLAY_DIR"
          cd compiler
          timeout --signal=TERM --kill-after=15s 10m \
            cargo test -p compiler-opt --test alive_lite -- --ignored --nocapture --test-threads=1 \
            2>&1 | tee "$RUNNER_TEMP/alive-lite-proof.log"
          python3 - "$RUNNER_TEMP/alive-lite-proof.log" <<'PY'
          import pathlib, re, sys
          log=pathlib.Path(sys.argv[1]).read_text(errors='replace')
          passed=sum(map(int,re.findall(r'test result: ok\.\s+(\d+) passed;',log)))
          if passed < 1:
              raise SystemExit('No ignored Alive-lite proofs ran')
          if not re.search(r'test t5_comparisons_and_boolean_branches_have_correct_smt_semantics \.\.\. ok', log):
              raise SystemExit('Missing SMT comparison and boolean CFG semantics check')
          if not re.search(r'test alive_lite_codec::prove_saved_replay_fixtures_against_real_passes \.\.\. ok', log):
              raise SystemExit('Missing Z3 proof of saved replay fixtures')
          if not re.search(r'test prove_seeded_select_against_real_optimizer_passes \.\.\.', log):
              raise SystemExit('Missing seeded select real-pass SMT proof campaign')
          if not re.search(r'T5_SELECT_PROOF seeds=12 passes=4 changed=\[[0-9, ]+\] status=PROVEN', log):
              raise SystemExit('Missing seeded select proof summary')
          if not re.search(r'test prove_select_phi_traps_against_real_passes \.\.\.', log):
              raise SystemExit('Missing select-PHI-trap real-pass proof campaign')
          if not re.search(r'T5_SELECT_PHI_TRAP_PROOF seeds=8 passes=4 changed=\[[0-9, ]+\] status=PROVEN', log):
              raise SystemExit('Missing select-PHI-trap proof summary')
          if not re.search(r'test prove_select_phi_pre_sccp_real_transformations \.\.\.', log):
              raise SystemExit('Missing selected PRE/SCCP proof test')
          trigger = re.search(r'T5_SELECT_PRE_SCCP_PROOF seeds=6 passes=2 changed=\[(\d+), (\d+)\] status=PROVEN', log)
          if not trigger or min(map(int, trigger.groups())) < 1:
              raise SystemExit('PRE and SCCP must both show proven changed transformations')
          if not re.search(r'T5_SCCP_BRANCH_NEGATIVE seeds=6 wrong_arms=6 status=COUNTEREXAMPLE', log):
              raise SystemExit('Missing wrong-arm Z3 counterexamples')
          proofs = re.findall(r'T5_PROOF shape=(\d+) seed=(\d+) pass=(\w+) changed=(true|false) concrete_tested=true status=(\w+)', log)
          if not proofs:
              raise SystemExit('Missing per-pass T5 proof results')
          if any(p[4] not in ('PROVEN', 'NOT_EXERCISED') for p in proofs):
              raise SystemExit('Non-proven T5 proof record')
          changed_proofs = [p for p in proofs if p[3] == 'true' and p[4] == 'PROVEN']
          if not changed_proofs:
              raise SystemExit('No changed optimizer transformation was formally proven')
          if any((p[3] == 'true') != (p[4] == 'PROVEN') for p in proofs):
              raise SystemExit('T5 changed/proven status inconsistency')
          with open('../alive-lite-proofs.jsonl', 'w') as out:
              for shape, seed, name, changed, status in proofs:
                  out.write(__import__('json').dumps(dict(shape=int(shape),seed=int(seed),pass_name=name,changed=changed=='true',status=status,source_sha='${{ steps.source.outputs.sha }}'))+'\n')
          # Keep bounded concrete local-memory claims separate from the
          # strict exact-word SMT proof subset.
          for test in (
              't5_exact_local_memory_proofs_and_negative_controls',
              't5_exact_local_memory_actual_pass_proofs',
              't5_exact_local_memory_smt_matches_independent_expectations',
          ):
              if not re.search(r'test alive_lite_memory::'+test+r' \.\.\.', log):
                  raise SystemExit(f'Missing exact-word memory SMT test: {test}')
          records = re.findall(
              r'T5_MEMORY_PROOF fixture=(\w+) pass=(\w+) changed=(true|false) status=(\w+)', log
          )
          expected = {(f,p) for f in ('overwrite','forward_join','pointer_phi','bulk_zero')
                              for p in ('forward','dse','pipeline')}
          if len(records) != 12 or {(f,p) for f,p,_,_ in records} != expected:
              raise SystemExit('Incomplete exact-word SMT memory proof matrix')
          if any((changed == 'true') != (status == 'PROVEN') for _,_,changed,status in records):
              raise SystemExit('Exact-word memory SMT record incorrectly classified')
          proven = sum(changed == 'true' for _,_,changed,_ in records)
          if proven < 1:
              raise SystemExit('No changed local-memory optimization proved by SMT')
          if 'T5_MEMORY_NEGATIVE_SMT status=COUNTEREXAMPLE cases=4' not in log:
              raise SystemExit('Missing exact-word SMT negative controls')
          if 'T5_MEMORY_SMT_INDEPENDENT status=PASS cases=41' not in log:
              raise SystemExit('Missing independent local-memory semantics controls')
          import json
          with open('../alive-lite-memory-proofs.jsonl','w') as out:
              for fixture,name,changed,status in records:
                  out.write(json.dumps(dict(
                      scope='exact_local_i32_words',fixture=fixture,pass_name=name,
                      changed=(changed=='true'),status=status,
                      smt_proven=(status=='PROVEN'),
                      source_sha='${{ steps.source.outputs.sha }}',
                  ),sort_keys=True)+'\n')
          print(f'Validated {proven} exact-word memory transformations with SMT proofs')
          # AL-02: never count an unexecuted or unchanged pass as proved.
          import json
          stages = [
              json.loads(line.split('AL02_TYPEID_LEDGER ',1)[1])
              for line in log.splitlines() if 'AL02_TYPEID_LEDGER ' in line
          ]
          production = pathlib.Path('crates/opt/src/typed_pass_manager.rs').read_text()
          declared = re.search(
              r'pub const TYPED_CORE_PASS_NAMES.*?=\s*\[(.*?)\];',
              production, re.S
          )
          if not declared:
              raise SystemExit('Production TypeId core pass inventory missing')
          actual_names = re.findall(r'"([^"]+)"', declared.group(1))
          if len(actual_names) != 21 or len(set(actual_names)) != 21:
              raise SystemExit('Production TypeId pass catalog changed')
          if len(stages) != len(actual_names) or [
              row['stage'] for row in stages
          ] != actual_names:
              raise SystemExit('AL-02 proof ledger must enumerate each production pass exactly once')
          expected = {'cse','constant_fold','dce','sccp','trivial_phi',
                      'algebra','identical_merges','dead_phi','cfg_bypass','cfg_merge',
                      'pre','if_conversion'}
          proven = [row for row in stages if row['status'] == 'PROVEN']
          if {row['stage'] for row in proven} != expected:
              raise SystemExit('AL-02 missing changed, SMT-proven TypeId witnesses')
          if not all(row['executed'] is True and row['changed'] is True
                     and row['changes'] > 0 and row['smt_proven'] is True
                     and row['fixture'] for row in proven):
              raise SystemExit('AL-02 declared PROVEN without actual optimizer edits')
          unknown = [row for row in stages if row['status'] == 'UNKNOWN_NOT_ADMITTED']
          if len(unknown) != 9 or not all(
              row['executed'] is False and row['changed'] is None
              and row['changes'] == 0 and row['smt_proven'] is False
              for row in unknown
          ):
              raise SystemExit('AL-02 unadmitted pass misclassified as proved/no-op')
          if 'AL02_TYPEID_SUMMARY stages=21 changed_proven=12 unknown_not_admitted=9 sat_controls=4 verdict=PROVEN' not in log:
              raise SystemExit('AL-02 proof summary missing')
          with open('../alive-lite-typeid-stage-proofs.jsonl','w') as evidence:
              for row in stages:
                  row['source_sha'] = '${{ steps.source.outputs.sha }}'
                  evidence.write(json.dumps(row, sort_keys=True)+'\n')
          if not all(row.get('policy') == ('select_capable' if row['stage'] == 'if_conversion' else 'default') for row in proven):
              raise SystemExit('AL-02 proof stage policy is not recorded accurately')
          composed = [
              json.loads(line.split('AL02_TYPEID_SOURCE_LEDGER ',1)[1])
              for line in log.splitlines() if 'AL02_TYPEID_SOURCE_LEDGER ' in line
          ]
          if {row['fixture'] for row in composed} != {
              'arithmetic_trap_cse', 'guarded_phi_constant'
          } or len(composed) != 2:
              raise SystemExit('Missing distinct whole TypeId source-composition proofs')
          if not all(row['path'] == 'optimize_typeid_source'
                     and row['changed'] is True and row['changes'] > 0
                     and row['verdict'] == 'PROVEN' for row in composed):
              raise SystemExit('Whole production TypeId transaction not changed and SMT-proven')
          if 'AL02_TYPEID_SOURCE_SUMMARY transactions=2 changed_proven=2 policy=default_select_disabled verdict=PROVEN' not in log:
              raise SystemExit('AL-02 source-pipeline composition summary missing')
          with open('../alive-lite-typeid-source-proofs.jsonl','w') as evidence:
              for row in composed:
                  row['source_sha'] = '${{ steps.source.outputs.sha }}'
                  evidence.write(json.dumps(row, sort_keys=True)+'\n')
          print('Validated two actual default TypeId source optimizer transactions')
          print('Validated 21 TypeId production stages: 12 changed+proven, 9 unknown')
          if not re.search(r'AL01_DIRECT_TYPEID_SMT changed_passes=1 changed_operations=[1-9][0-9]* proofs=1 sat_mutants=2 unknown_controls=3 status=PROVEN', log):
              raise SystemExit('Missing changed TypeId-native AL-01 Z3 proof and negative controls')
          if not re.search(r'test alive_lite_typeid::al02_typeid_stage_proof_ledger \.\.\.', log):
              raise SystemExit('AL-02 direct TypeId Z3 proof test did not execute')
          if not re.search(r'test alive_lite_typeid::al01_direct_typeid_proves_changed_cse_and_finds_phi_trap_mutants \.\.\. AL01_DIRECT_TYPEID_SMT', log):
              raise SystemExit('Missing passing AL-01 TypeId Z3 test')
          if not re.search(
              r'test alive_lite_memory::al04_static_checked_local_word_real_passes_and_alias_negatives \.\.\. AL04_INDEXED_WORD exact_local=1 passes=3 changed=[1-3] sat_wrong_index=1 sat_wrong_alias=1 independent_fixed=8 verdict=PROVEN',
              log,
          ):
              raise SystemExit('Missing changed AL-04 exact-index optimizer proofs, SAT alias mutants or independent expectation checks')
          if not re.search(
              r'test alive_lite_memory::al04_symbolic_checked_index_actual_passes_and_sat_controls \.\.\. AL04_SYMBOLIC_INDEX exact_local=1 choices=3 passes=3 changed=[1-3] unsat=3 sat_wrong_index=1 sat_wrong_alias=1 sat_missing_trap=1 independent_fixed=12 verdict=PROVEN',
              log,
          ):
              raise SystemExit('Missing bounded dynamic indexed-word changed optimizer UNSAT/SAT and independent expectations')
          # AL-04 width contracts are permanent: unchanged solver pairs
          # do not count as changed-pass coverage, while SAT mutants and
          # independent observation controls must remain present.
          concrete_log = pathlib.Path(__import__('os').environ['RUNNER_TEMP']).joinpath(
              'alive-lite-concrete.log').read_text()
          for test in (
              'al04_byte_lane_scope_and_unknown_cases',
              'al04_wide_memory_abi_and_bounds_fail_closed',
          ):
              if f'test alive_lite_memory::{test} ... ok' not in concrete_log:
                  raise SystemExit(f'Missing accepted AL-04 non-Z3 scope check: {test}')
          if not re.search(
              r'AL04_PARAMETER_MATRIX layouts=7 proved=21 changed=[1-9][0-9]* sat=13 independent=84 verdict=PROVEN',
              log,
          ):
              raise SystemExit('Missing exact-word AL-04 parameterized proof matrix')
          if not re.search(
              r'AL04_BYTE_LANES fixtures=9 proved=27 changed=[1-9][0-9]* sat=10 independent=72 verdict=PROVEN',
              log,
          ):
              raise SystemExit('Missing accepted AL-04 narrow/byte proof matrix')
          if not re.search(
              r'AL04_WIDE_MEMORY cases=4 pass_pairs=12\s+sat_mutants=8 independent=28\s+changed_wide_passes=0 verdict=PROVEN',
              log,
          ):
              raise SystemExit('Missing accepted i64 ABI/overlapping byte-memory proof matrix')
          # Actual production edits in forwarding, DSE and the whole
          # pipeline, plus independent observations and SAT controls.
          # Unchanged proof pairs do not count toward the changed totals.
          if not re.search(
              r'AL04_BYTE_RANGE proofs=39 forward_changed=[1-9][0-9]* dse_changed=[1-9][0-9]* pipeline_changed=[1-9][0-9]* sat=12 independent=75 verdict=PROVEN',
              log,
          ):
              raise SystemExit('Missing proved AL-04.P3b changed mixed-width optimizer outputs')
          # P3c tests must exercise genuine direct forwarding changes.
          # Zero changed whole-pipeline outcomes are documented, not
          # falsely counted as extra production optimizer evidence.
          if not re.search(
              r'AL04_NARROW_READ proofs=48 forward_changed=8\s+pipeline_changed=[0-9]+ sat=8 independent=128 verdict=PROVEN',
              log,
          ):
              raise SystemExit('Missing proved changed narrow-read forwarding and signedness mutants')
          # Store-to-load reconstruction must prove an actual altered SSA
          # program, not just compare a no-op pair. Wrong generated masks,
          # signed shift counts, removed overwrites and source signedness
          # are required SAT mutants; the independent oracle is above.
          if not re.search(
              r'AL04_NARROW_STORE_VALUE proofs=66 forward_changed=14\s+pipeline_changed=[1-9][0-9]* sat=12 independent=198 verdict=PROVEN',
              log,
          ):
              raise SystemExit('Missing accepted AL-04.P3c.2 changed store-to-load proofs and SAT masks')
          # A PHI with two different precise byte origins only forwards
          # if both have equal dominating value facts. Reject wrong origin,
          # wrong incoming store, sign and synthesized mask/shift mutants.
          # The changed TypeId pipeline must also produce real edits.
          if not re.search(
              r'AL04_BYTE_PHI_PAIR proofs=48 forward_changed=[1-9][0-9]*\s+pipeline_changed=[1-9][0-9]* sat=16 independent=128 verdict=PROVEN',
              log,
          ):
              raise SystemExit('Missing proved AL-04.P3c.3a changed two-origin byte-PHI forward and SAT controls')
          # AL-04.P3c.3b proves changed native/legacy byte composition
          # through a single shared memory SMT interpreter. Retain SAT
          # counterexamples for wrong sources/sign/assembled shift and
          # independent native C11 expectations above.
          if not re.search(
              r'AL04_COMPOSED_BYTES proofs=18 forward_changed=4\s+pipeline_changed=[1-9][0-9]* sat=12 independent=32 verdict=PROVEN',
              log,
          ):
              raise SystemExit('Missing permanent AL-04.P3c.3b composed-byte proof/negative controls')
          # P4a proofs must include real changed direct and owned-TypeId
          # outputs, and SAT mutants for external order/arguments/mutations.
          # All unmodeled calls, trapping effects and globals still UNKNOWN.
          if not re.search(
              r'AL04_ORDERED_EFFECTS proofs=9 forward_changed=3\s+pipeline_changed=3 sat=3 independent=18 verdict=PROVEN',
              log,
          ):
              raise SystemExit('Missing permanent AL-04.P4a ordered observable-call proofs or mutants')
          # P4b.1 must prove an actual changed TypeId pipeline and local
          # forwarding, while rejecting incorrect ordering, high-word
          # source, and return. Incomplete frame extent/init stays UNKNOWN.
          if not re.search(
              r'AL04_VISIBLE_FRAME8 proofs=6 forward_changed=2\s+pipeline_changed=2 sat=6 independent=12 verdict=PROVEN',
              log,
          ):
              raise SystemExit('Missing permanent AL-04.P4b.1 complete frame8 proofs and SAT mutants')
          # P4b.2: full public final memory state, exact module initializers
          # and distinct nonpreempted symbol roots. Require actual direct
          # and native TypeId optimizer changes, SAT wrong alias/missing
          # write/return mutants, and 18 independently fixed memory cases.
          if not re.search(
              r'AL04_VISIBLE_GLOBALS proofs=9 forward_changed=3\s+pipeline_changed=3 sat=10 independent=18 verdict=PROVEN',
              log,
          ):
              raise SystemExit('Permanent AL-04.P4b.2 global-state UNSAT/SAT and independent bytes missing')
          # P4b.3 must preserve exactly the call and public global-state
          # history before BOTH signed-division traps, not merely the trap
          # condition or events from successful returns. Require real
          # changed native/legacy passes and explicit SAT rearrangements.
          if not re.search(
              r'AL04_PRETRAP_EFFECTS proofs=6 forward_changed=2\s+pipeline_changed=2 sat=8 independent=16 verdict=PROVEN',
              log,
          ):
              raise SystemExit('Permanent AL-04.P4b.3 trap-prefix UN/SAT and independent expected histories missing')
          # P4b.4 must retain the exact call history and global byte state
          # at BOTH out-of-bounds index sites, including negative indices.
          # Require real changed native/direct pass outputs, wrong-index and
          # effect-reordering SAT, and independent expected input histories.
          if not re.search(
              r'AL04_CHECKED_PRETRAP proofs=6 forward_changed=2\s+pipeline_changed=2 sat=10 independent=20 verdict=PROVEN',
              log,
          ):
              raise SystemExit('Permanent AL-04.P4b.4 checked-index pretrap effects UNSAT/SAT evidence missing')
          # A literal negative or oversized checked index MUST trap even
          # when no path can return. Check exact prior call/public memory
          # state and i8/i16 sign extension on real native source passes.
          if not re.search(
              r'AL04_NARROW_CONST_TRAPS proofs=36 forward_changed=12\s+pipeline_changed=12 sat=28 independent=96 verdict=PROVEN',
              log,
          ):
              raise SystemExit('Permanent P4b.5 constant OOB/short-width UNSAT/SAT and independent history missing')
          # P4b.6: 32-bit wrapping derived signed checked indices under
          # the same exact byte-lane/event/verified-root model. Require
          # actual changed direct and owned TypeId outputs and solver SAT
          # on arithmetic-bias, alias and pretrap history mutations.
          if not re.search(
              r'AL04_DERIVED_INDEX_PROPERTIES proofs=12 forward_changed=4\s+pipeline_changed=4 sat=46 independent=160 verdict=PROVEN',
              log,
          ):
              raise SystemExit('Permanent AL-04.P4b.6 derived-index true-pass UNSAT/SAT and independent history missing')
          # P4b.7 requires every SAT model to replay to a real
          # independently executed change. Also require accepted real
          # optimizer rewrites, ten UNSAT semantics-preserving mutations,
          # and an independently grounded deterministic C11 oracle.
          # Reject malformed/unreplayable Z3 witnesses, not just UNKNOWN.
          if not re.search(
              r'AL04_GENERATED_ALIAS_TRAP proofs=12 forward_changed=4\s+pipeline_changed=4 sat=78 witness_replay=78 independent=160 invariants=10 verdict=PROVEN',
              log,
          ):
              raise SystemExit('Permanent AL-04.P4b.7 generated SAT witness replay/invariant evidence missing')
          if not re.search(
              r'AL05_FIXED_TRIP proofs=4 changed_passes=4\s+sat_mutants=3 nontermination_unknown=1 verdict=PROVEN\s+scope=closed_i32_fixed_trip_0_to_3',
              log,
          ):
              raise SystemExit('Permanent AL-05 changed-TypeId-loop UNSAT/SAT and UNKNOWN evidence missing')
          if not re.search(
              r'AL05_INDUCTION proofs=4 changed_cse=4\s+sat_mutants=5 signed_bound=all_i32 solver=Z3 scope=inductive_scalar verdict=PROVEN',
              log,
          ):
              raise SystemExit('Permanent AL-05 variable-trip inductive TypeId UNSAT/SAT evidence missing')
          if not re.search(
              r'AL05_AFFINE_INDUCTION proofs=4 changed_cse=4\s+sat_mutants=7 signed_bound=all_i32 solver=Z3\s+scope=inductive_affine_i32 verdict=PROVEN',
              log,
          ):
              raise SystemExit('AL-05 affine-in-iteration changed CSE induction or SAT controls missing')
          if not re.search(
              r'FS1_CFG_DRAFT_SMT changed_cse_proofs=4\s+sat_mutants=8 eager_sat=1 exact_typeid_concrete_parity=44\s+bool_literals=2 solver=Z3 verdict=PROVEN',
              log,
          ):
              raise SystemExit('FS-1 draft Bool/parallel PHI/Select conditional-trap TypeId Z3 proof, parity or SAT mutants missing')
          if not re.search(
              r'AL05_REPLAY_V1 proofs=4 changed_cse=4\s+files=4 contract=al05-closed-i32-cse-loop-v1\s+ir=compiler-ir-native-module-3\s+sha=[0-9a-f]{40} solver=Z3 verdict=PROVEN',
              log,
          ):
              raise SystemExit('AL-05 four source-pinned TypeId snapshot replay proofs missing')
          if not re.search(
              r'AL05_REPLAY_AFFINE_V2 proofs=4 changed_cse=4\s+files=4 contract=al05-closed-i32-affine-cse-loop-v2\s+ir=compiler-ir-native-module-3\s+sha=[0-9a-f]{40} solver=Z3 verdict=PROVEN',
              log,
          ):
              raise SystemExit('AL-05 affine v2 CSE proof and serialized snapshot evidence missing')
          print(f'Validated {passed} Alive-lite tests and {len(proofs)} per-pass proof records')
          PY
          mkdir -p "$GITHUB_WORKSPACE/.alive-lite-verified"
          cp "$GITHUB_WORKSPACE/alive-lite-coverage.jsonl" "$GITHUB_WORKSPACE/alive-lite-proofs.jsonl" "$GITHUB_WORKSPACE/.alive-lite-verified/"
          printf '%s\n' "${{ steps.source.outputs.sha }}" > "$GITHUB_WORKSPACE/.alive-lite-verified/source-sha.txt"
          echo "Alive-lite Z3 proof tests passed" >> "$GITHUB_STEP_SUMMARY"
      - name: AL-05 separately reprove archived TypeId induction snapshots
        if: steps.verified.outputs.cache-hit != 'true' || inputs.force_recheck || github.event_name == 'push'
        shell: bash
        env:
          AL05_REPLAY_INPUT_DIR: ${{ github.workspace }}/alive-lite-al05-replay
          AL05_SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          set -euo pipefail
          cd compiler
          timeout --signal=TERM --kill-after=10s 4m \
            cargo test -p compiler-opt --test alive_lite \
              al05_replay_v1_read_only_archived_files_with_z3 -- --ignored --nocapture \
            2>&1 | tee "$GITHUB_WORKSPACE/alive-lite-al05-replay-readonly.log"
          grep -F "AL05_REPLAY_READ_ONLY proofs=4 files=4 source_sha=${{ steps.source.outputs.sha }} contract=al05-closed-i32-cse-loop-v1 verdict=PROVEN" \
            "$GITHUB_WORKSPACE/alive-lite-al05-replay-readonly.log"
          timeout --signal=TERM --kill-after=10s 3m \
            cargo test -p compiler-opt --test alive_lite \
              al05_replay_v2_affine_read_only_saved_files_with_z3 -- --ignored --nocapture \
            2>&1 | tee "$GITHUB_WORKSPACE/alive-lite-al05-affine-readonly.log"
          grep -F "AL05_AFFINE_REPLAY_READ_ONLY proofs=4 files=4 source_sha=${{ steps.source.outputs.sha }} contract=al05-closed-i32-affine-cse-loop-v2 verdict=PROVEN" \
            "$GITHUB_WORKSPACE/alive-lite-al05-affine-readonly.log"

      - name: Verify AL-05 versioned source-tagged replay artifacts
        if: steps.verified.outputs.cache-hit != 'true' || inputs.force_recheck || github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tools -p 'test_validate_al05_replay.py' -v
          python3 tools/validate_al05_replay.py \
            --dir alive-lite-al05-replay \
            --source-sha "${{ steps.source.outputs.sha }}" \
            | tee alive-lite-al05-replay-summary.log
          grep -F "AL05_REPLAY_ARTIFACTS files=8 source_sha=${{ steps.source.outputs.sha }} contracts=constant-v1,affine-v2 ir=compiler-ir-native-module-3 verdict=PASS" \
            alive-lite-al05-replay-summary.log

      - name: Audit reviewed AL-05 scalar/CFG assumptions and SHA256-bind all eight replay files
        if: steps.verified.outputs.cache-hit != 'true' || inputs.force_recheck || github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tools -p 'test_al05_semantic_manifest.py' -v
          python3 tools/al05_semantic_manifest.py --create \
            --manifest alive-lite-al05-semantic-manifest.json \
            --replay-dir alive-lite-al05-replay \
            --scope-file compiler/crates/opt/tests/contracts/al05_semantic_scope_v1.txt \
            --source-sha "${{ steps.source.outputs.sha }}" \
            | tee alive-lite-al05-semantic-manifest.log
          python3 tools/al05_semantic_manifest.py --verify \
            --manifest alive-lite-al05-semantic-manifest.json \
            --replay-dir alive-lite-al05-replay \
            --scope-file compiler/crates/opt/tests/contracts/al05_semantic_scope_v1.txt \
            --source-sha "${{ steps.source.outputs.sha }}" \
            | tee -a alive-lite-al05-semantic-manifest.log
          grep -E "AL05_SCOPE_MANIFEST files=8 source_sha=${{ steps.source.outputs.sha }} scope_sha256=[0-9a-f]{64} normative_fs1=false verdict=PASS" \
            alive-lite-al05-semantic-manifest.log

      - name: Permanent AL-05.P3 versioned v3 archive and read-only Z3
        if: steps.verified.outputs.cache-hit != 'true' || inputs.force_recheck || github.event_name == 'push'
        shell: bash
        working-directory: compiler
        env:
          AL05_SOURCE_SHA: ${{ steps.source.outputs.sha }}
          AL05_P3_REPLAY_INPUT_DIR: ${{ github.workspace }}/alive-lite-al05-p3-replay
        run: |
          set -euo pipefail
          test "$(find "$AL05_P3_REPLAY_INPUT_DIR" -maxdepth 1 -type f -name '*.replay' | wc -l)" -eq 4
          timeout --signal=TERM --kill-after=15s 4m \
            cargo test -p compiler-opt --test alive_lite \
              al05_parameterized_replay_v3_read_only_z3 -- --ignored --nocapture \
            2>&1 | tee "$RUNNER_TEMP/al05-p3-read-only.log"
          grep -E "AL05_P3_READ_ONLY proofs=4 files=4 sha=$AL05_SOURCE_SHA contract=al05-closed-i32-parametric-cse-loop-v3 verdict=PROVEN" \
            "$RUNNER_TEMP/al05-p3-read-only.log"

      - name: Enforce permanent AL-03 concrete and Z3 proof manifest
        if: steps.verified.outputs.cache-hit != 'true' || inputs.force_recheck || github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tools -p 'test_validate_al03_manifest.py' -v
          python3 tools/validate_al03_manifest.py \
            --manifest tools/al03_proof_manifest.json \
            --source compiler/crates/opt/tests/support/alive_lite_typeid_wide.rs \
            --concrete "$RUNNER_TEMP/alive-lite-concrete.log" \
            --proofs "$RUNNER_TEMP/alive-lite-proof.log" \
            --source-sha "${{ steps.source.outputs.sha }}" \
            --output alive-lite-al03-manifest.json
          cat alive-lite-al03-manifest.json >> "$GITHUB_STEP_SUMMARY"

      - name: Audit complete Alive-lite evidence with independent negative controls
        if: steps.verified.outputs.cache-hit != 'true' || inputs.force_recheck || github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tools -p 'test_validate_alive_lite_evidence.py' -v
          python3 tools/validate_alive_lite_evidence.py \
            --source-sha "${{ steps.source.outputs.sha }}" \
            --coverage alive-lite-coverage.jsonl \
            --proofs alive-lite-proofs.jsonl \
            --bounded-memory alive-lite-memory.jsonl \
            --memory-proofs alive-lite-memory-proofs.jsonl
      - name: Upload coverage and proof evidence
        if: success() && (steps.verified.outputs.cache-hit != 'true' || inputs.force_recheck || github.event_name == 'push')
        uses: actions/upload-artifact@v4
        with:
          name: alive-lite-evidence
          path: |
            alive-lite-coverage.jsonl
            alive-lite-proofs.jsonl
            alive-lite-memory.jsonl
            alive-lite-memory-proofs.jsonl
            alive-lite-typeid-stage-proofs.jsonl
            alive-lite-typeid-source-proofs.jsonl
            alive-lite-al03-manifest.json
            alive-lite-al05-replay/*.replay
            alive-lite-al05-p3-replay/*.replay
            alive-lite-al05-semantic-manifest.json
            alive-lite-al05-semantic-manifest.log
            alive-lite-al05-replay-summary.log
            alive-lite-al05-replay-readonly.log
            alive-lite-al05-affine-readonly.log
            alive-lite-al05-affine.log
            alive-lite-al04-native-c.log
          retention-days: 14
      - name: Cache exact passing source revision
        if: success() && steps.verified.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .alive-lite-verified
          key: alive-lite-source-v1-${{ hashFiles('.github/workflows/verify-alive-lite.yml', 'tools/al03_proof_manifest.json', 'tools/validate_al03_manifest.py', 'tools/test_validate_al03_manifest.py') }}-${{ steps.source.outputs.sha }}
      - name: Report previously validated revision
        if: steps.verified.outputs.cache-hit == 'true' && !inputs.force_recheck && github.event_name != 'push'
        run: echo "Exact compiler revision previously passed Alive-lite proofs" >> "$GITHUB_STEP_SUMMARY"
      - name: Identify failed source revision
        if: failure()
        shell: bash
        run: |
          echo "Alive-lite failed while validating compiler revision: ${{ steps.source.outputs.sha }}" >> "$GITHUB_STEP_SUMMARY"
          echo "See alive-lite-source-failures artifact for compiler diagnostics." >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve proof failures and build diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: alive-lite-source-failures
          path: |
            ${{ runner.temp }}/alive-lite-concrete.log
            ${{ runner.temp }}/alive-lite-build.log
            ${{ runner.temp }}/alive-lite-bounded-loops.log
            ${{ runner.temp }}/alive-lite-memory.log
            ${{ runner.temp }}/alive-lite-proof.log
            ${{ runner.temp }}/alive-lite-failures/
          if-no-files-found: ignore
          retention-days: 14
