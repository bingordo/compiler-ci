name: Build and verify Alive-lite optimizer proofs

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Compiler branch, tag or commit
        required: false
        default: main
        type: string
      force_recheck:
        description: Rerun previously passing Z3 proofs
        required: false
        default: false
        type: boolean
  pull_request:
    paths: ['.github/workflows/verify-alive-lite.yml']
  schedule:
    - cron: '12,27,42,57 * * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-alive-lite.yml'

permissions:
  contents: read

concurrency:
  group: alive-lite-source-${{ inputs.source_ref || 'al03-pure-sccp-1152' }}
  cancel-in-progress: true

jobs:
  prove:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout workflow repository for versioned cache keys
        uses: actions/checkout@v4
      - name: Checkout exact compiler source
        uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: ${{ inputs.source_ref || '7fd6ab819f3cfbed0f1b061dfcdba1baf81027dc' }}
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Identify source revision and proof target
        id: source
        shell: bash
        run: |
          set -euo pipefail
          sha="$(git -C compiler rev-parse HEAD)"
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]]
          test -s compiler/crates/opt/tests/alive_lite.rs
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "Compiler revision: $sha" >> "$GITHUB_STEP_SUMMARY"
      - name: Skip proofs already validated for exact source and workflow
        id: verified
        uses: actions/cache/restore@v4
        with:
          path: .alive-lite-verified
          key: alive-lite-source-v1-${{ hashFiles('.github/workflows/verify-alive-lite.yml') }}-${{ steps.source.outputs.sha }}
          lookup-only: true
      - name: Restrict workspace to compiler core
        if: steps.verified.outputs.cache-hit != 'true' || inputs.force_recheck || github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          Path('compiler/Cargo.toml').write_text('''[workspace]
          resolver = "2"
          members = ["crates/ir", "crates/opt", "crates/backend", "crates/backend-x86"]
          ''')
          PY
      - name: Reuse Rust compilation cache
        if: steps.verified.outputs.cache-hit != 'true' || inputs.force_recheck || github.event_name == 'push'
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: alive-lite-source-v1
          cache-workspace-crates: 'true'
      - name: Build Alive-lite proof test binary
        if: steps.verified.outputs.cache-hit != 'true' || inputs.force_recheck || github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          cd compiler
          timeout --signal=TERM --kill-after=10s 12m \
            cargo test -p compiler-opt --test alive_lite --no-run \
            2>&1 | tee "$RUNNER_TEMP/alive-lite-build.log"
          test -n "$(find target/debug/deps -maxdepth 1 -type f -name 'alive_lite-*' -executable -print -quit)"
      - name: Run non-Z3 Alive-lite checks and coverage ledger
        if: steps.verified.outputs.cache-hit != 'true' || inputs.force_recheck || github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          cd compiler
          timeout --signal=TERM --kill-after=15s 5m \
            cargo test -p compiler-opt --test alive_lite -- --nocapture \
            2>&1 | tee "$RUNNER_TEMP/alive-lite-concrete.log"
          python3 - "$RUNNER_TEMP/alive-lite-concrete.log" <<'PY'
          import json, pathlib, re, sys
          log = pathlib.Path(sys.argv[1]).read_text(errors='replace')
          rows = [json.loads(line.split('T5_LEDGER ', 1)[1]) for line in log.splitlines() if 'T5_LEDGER ' in line]
          if not rows:
              raise SystemExit('Missing T5 coverage ledger')
          if not re.search(r'test result: ok\.\s+[1-9][0-9]* passed;', log):
              raise SystemExit('No successful concrete Alive-lite tests')
          if not re.search(r'test t5_scalar_comparison_branches_match_independent_signed_expectations \.\.\. ok', log):
              raise SystemExit('Missing independent signed-comparison truth-table test')
          # T5.3 replay coverage must not silently disappear from the fast gate.
          for test in (
              'replay_select_arm_order_and_strict_decode',
              'replay_codec_rejects_semantically_unexecutable_functions',
              'replay_fixture_rejects_broken_pass_and_missing_transformation',
              'generated_cfg_replay_matches_original_pass_output',
              'replay_saved_fixtures_and_optional_external_file',
          ):
              if not re.search(r'test alive_lite_codec::'+test+r' \.\.\. ok', log):
                  raise SystemExit(f'Missing passing replay regression: {test}')
          if not re.search(r'test alive_lite_typeid::al02_source_pipeline_compositions_changed_and_replayable \.\.\. ok', log):
              raise SystemExit('AL-02 composed default TypeId source non-Z3 replay missing')
          if not re.search(r'test alive_lite_typeid::al02_typeid_witnesses_are_changed_replayable_and_catalogued \.\.\. ok', log):
              raise SystemExit('AL-02 changed TypeId/replay controls missing')
          if 'test alive_lite_typeid_wide::al03_pure_integer_sccp_real_branch_concrete_and_scope_controls ... ok' not in log:
              raise SystemExit('Missing 1040-case production TypeId narrow SCCP concrete oracle and fail-closed scope gates')
          if not re.search(r'test seeded_select_corpus_is_replayable_and_distinct \.\.\. ok', log):
              raise SystemExit('Missing passing seeded select corpus check')
          if not re.search(r'test seeded_select_phi_traps_roundtrip_and_negative_controls \.\.\. ok', log):
              raise SystemExit('Missing select-PHI-trap concrete/replay controls')
          if not re.search(r'test select_phi_pass_triggers_replay_and_remain_distinct \.\.\. ok', log):
              raise SystemExit('Missing replayable PRE/SCCP select-PHI trigger fixtures')
          if not re.search(r'test select_phi_sccp_both_branch_directions_preserve_traps \.\.\. ok', log):
              raise SystemExit('Missing SCCP branch-direction trap checks')
          output = pathlib.Path('..') / 'alive-lite-coverage.jsonl'
          output.write_text(''.join(json.dumps(row, sort_keys=True) + '\n' for row in rows))
          print(f'Validated {len(rows)} concrete coverage records')
          PY
      - name: Check bounded loop verdicts (not universal proofs)
        if: steps.verified.outputs.cache-hit != 'true' || inputs.force_recheck || github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          cd compiler
          timeout --signal=TERM --kill-after=10s 3m \
            cargo test -p compiler-opt --test loop_trap_semantics \
              t5_bounded_loop_classification_is_fail_closed -- --exact --nocapture \
            2>&1 | tee "$RUNNER_TEMP/alive-lite-bounded-loops.log"
          grep -F 'test t5_bounded_loop_classification_is_fail_closed ... ok' \
            "$RUNNER_TEMP/alive-lite-bounded-loops.log"
      - name: Check bounded local memory effects and fail-closed verdicts
        if: steps.verified.outputs.cache-hit != 'true' || inputs.force_recheck || github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          cd compiler
          timeout --signal=TERM --kill-after=10s 3m \
            cargo test -p compiler-opt --test memory_execution_oracle -- --nocapture --test-threads=1 \
            2>&1 | tee "$RUNNER_TEMP/alive-lite-memory.log"
          python3 - "$RUNNER_TEMP/alive-lite-memory.log" <<'PY'
          import json, pathlib, re, sys
          log = pathlib.Path(sys.argv[1]).read_text(errors='replace')
          expected = {
              't5_memory_alias_effect_and_trap_negative_controls',
              't5_memory_unknowns_are_fail_closed',
              't5_memory_actual_passes_are_bounded_only',
              't5_memory_call_order_is_observable',
              't5_memory_generated_alias_corpus_is_bounded_only',
          }
          # With --nocapture and serial execution, test output appears between
          # the test name and its final 'ok' on a different line.
          tests = set(re.findall(r'test (t5_memory_\w+) \.\.\.', log))
          if not expected <= tests:
              raise SystemExit(f'Missing bounded memory controls: {sorted(expected-tests)}')
          rows = []
          for fixture, name, cases in re.findall(
              r'T5_MEMORY status=BOUNDED_ONLY fixture=(\w+) pass=(\w+) cases=(\d+)', log
          ):
              rows.append(dict(scope='bounded_local_memory', fixture=fixture,
                               pass_name=name, cases=int(cases), status='BOUNDED_ONLY',
                               smt_proven=False))
          expected_pairs = {(f,p) for f in ('pointer_phi','overlap_zero','loop_memory')
                                  for p in ('forward','dse','pipeline')}
          if {(r['fixture'],r['pass_name']) for r in rows} != expected_pairs or len(rows) != 9:
              raise SystemExit('Missing per-pass bounded memory coverage')
          generated = [
              json.loads(line.split('T5_MEMORY_LEDGER ', 1)[1])
              for line in log.splitlines() if 'T5_MEMORY_LEDGER ' in line
          ]
          if len(generated) != 93:
              raise SystemExit(f'Expected 93 generated memory checks, got {len(generated)}')
          unique = {(r['family'],r['seed'],r['pass']) for r in generated}
          if len(unique) != len(generated):
              raise SystemExit('Duplicate generated memory coverage records')
          if any(r['status'] != 'BOUNDED_ONLY' or r['smt_proven'] is not False
                 or r['cases'] != 7 for r in generated):
              raise SystemExit('Invalid or overstated generated memory verdict')
          if not any(r['changed'] for r in generated):
              raise SystemExit('Generated memory campaign exercised no transformation')
          rows.extend(generated)
          if 'T5_MEMORY_NEGATIVE status=COUNTEREXAMPLE cases=4' not in log:
              raise SystemExit('Missing memory negative controls')
          if 'T5_MEMORY_UNKNOWN status=UNKNOWN_UNSUPPORTED_OR_BOUNDED cases=5' not in log:
              raise SystemExit('Missing fail-closed memory unknown controls')
          out = pathlib.Path('..') / 'alive-lite-memory.jsonl'
          out.write_text(''.join(json.dumps(r,sort_keys=True)+'\n' for r in rows))
          print(f'Validated {len(rows)} bounded-only memory cases with negative/unknown controls')
          PY
      - name: Install checksum-pinned Z3 4.8.12
        if: steps.verified.outputs.cache-hit != 'true' || inputs.force_recheck || github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          # Use the original validated solver version, independent of
          # unavailable/unstable Ubuntu package mirrors. Newer Z3 versions
          # may time out on historically passing 2-second proof obligations.
          file="$RUNNER_TEMP/z3-4.8.12-x64-glibc-2.31.zip"
          timeout --signal=TERM --kill-after=5s 120s \
            curl -fL --retry 3 --retry-delay 2 --connect-timeout 12 \
                 -o "$file" \
                 https://github.com/Z3Prover/z3/releases/download/z3-4.8.12/z3-4.8.12-x64-glibc-2.31.zip
          printf '%s  %s\n' 648e8a7afb57445440ad711b733bd675e3888da2767c14ae5122582c924d8d52 "$file" \
            | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/z3-4.8.12"
          unzip -q "$file" '*/bin/z3' -d "$RUNNER_TEMP/z3-4.8.12"
          binary="$(find "$RUNNER_TEMP/z3-4.8.12" -type f -name z3 -print -quit)"
          test -n "$binary"
          chmod +x "$binary"
          echo "$(dirname "$binary")" >> "$GITHUB_PATH"
          "$binary" -version
      - name: Execute actual Alive-lite proof tests
        if: steps.verified.outputs.cache-hit != 'true' || inputs.force_recheck || github.event_name == 'push'
        shell: bash
        env:
          ALIVE_LITE_FAILURE_DIR: ${{ runner.temp }}/alive-lite-failures
        run: |
          set -euo pipefail
          mkdir -p "$ALIVE_LITE_FAILURE_DIR"
          cd compiler
          timeout --signal=TERM --kill-after=15s 10m \
            cargo test -p compiler-opt --test alive_lite -- --ignored --nocapture --test-threads=1 \
            2>&1 | tee "$RUNNER_TEMP/alive-lite-proof.log"
          python3 - "$RUNNER_TEMP/alive-lite-proof.log" <<'PY'
          import pathlib, re, sys
          log=pathlib.Path(sys.argv[1]).read_text(errors='replace')
          passed=sum(map(int,re.findall(r'test result: ok\.\s+(\d+) passed;',log)))
          if passed < 1:
              raise SystemExit('No ignored Alive-lite proofs ran')
          if not re.search(r'test t5_comparisons_and_boolean_branches_have_correct_smt_semantics \.\.\. ok', log):
              raise SystemExit('Missing SMT comparison and boolean CFG semantics check')
          if not re.search(r'test alive_lite_codec::prove_saved_replay_fixtures_against_real_passes \.\.\. ok', log):
              raise SystemExit('Missing Z3 proof of saved replay fixtures')
          if not re.search(r'test prove_seeded_select_against_real_optimizer_passes \.\.\.', log):
              raise SystemExit('Missing seeded select real-pass SMT proof campaign')
          if not re.search(r'T5_SELECT_PROOF seeds=12 passes=4 changed=\[[0-9, ]+\] status=PROVEN', log):
              raise SystemExit('Missing seeded select proof summary')
          if not re.search(r'test prove_select_phi_traps_against_real_passes \.\.\.', log):
              raise SystemExit('Missing select-PHI-trap real-pass proof campaign')
          if not re.search(r'T5_SELECT_PHI_TRAP_PROOF seeds=8 passes=4 changed=\[[0-9, ]+\] status=PROVEN', log):
              raise SystemExit('Missing select-PHI-trap proof summary')
          if not re.search(r'test prove_select_phi_pre_sccp_real_transformations \.\.\.', log):
              raise SystemExit('Missing selected PRE/SCCP proof test')
          trigger = re.search(r'T5_SELECT_PRE_SCCP_PROOF seeds=6 passes=2 changed=\[(\d+), (\d+)\] status=PROVEN', log)
          if not trigger or min(map(int, trigger.groups())) < 1:
              raise SystemExit('PRE and SCCP must both show proven changed transformations')
          if not re.search(r'T5_SCCP_BRANCH_NEGATIVE seeds=6 wrong_arms=6 status=COUNTEREXAMPLE', log):
              raise SystemExit('Missing wrong-arm Z3 counterexamples')
          proofs = re.findall(r'T5_PROOF shape=(\d+) seed=(\d+) pass=(\w+) changed=(true|false) concrete_tested=true status=(\w+)', log)
          if not proofs:
              raise SystemExit('Missing per-pass T5 proof results')
          if any(p[4] not in ('PROVEN', 'NOT_EXERCISED') for p in proofs):
              raise SystemExit('Non-proven T5 proof record')
          changed_proofs = [p for p in proofs if p[3] == 'true' and p[4] == 'PROVEN']
          if not changed_proofs:
              raise SystemExit('No changed optimizer transformation was formally proven')
          if any((p[3] == 'true') != (p[4] == 'PROVEN') for p in proofs):
              raise SystemExit('T5 changed/proven status inconsistency')
          with open('../alive-lite-proofs.jsonl', 'w') as out:
              for shape, seed, name, changed, status in proofs:
                  out.write(__import__('json').dumps(dict(shape=int(shape),seed=int(seed),pass_name=name,changed=changed=='true',status=status,source_sha='${{ steps.source.outputs.sha }}'))+'\n')
          # Keep bounded concrete local-memory claims separate from the
          # strict exact-word SMT proof subset.
          for test in (
              't5_exact_local_memory_proofs_and_negative_controls',
              't5_exact_local_memory_actual_pass_proofs',
              't5_exact_local_memory_smt_matches_independent_expectations',
          ):
              if not re.search(r'test alive_lite_memory::'+test+r' \.\.\.', log):
                  raise SystemExit(f'Missing exact-word memory SMT test: {test}')
          records = re.findall(
              r'T5_MEMORY_PROOF fixture=(\w+) pass=(\w+) changed=(true|false) status=(\w+)', log
          )
          expected = {(f,p) for f in ('overwrite','forward_join','pointer_phi','bulk_zero')
                              for p in ('forward','dse','pipeline')}
          if len(records) != 12 or {(f,p) for f,p,_,_ in records} != expected:
              raise SystemExit('Incomplete exact-word SMT memory proof matrix')
          if any((changed == 'true') != (status == 'PROVEN') for _,_,changed,status in records):
              raise SystemExit('Exact-word memory SMT record incorrectly classified')
          proven = sum(changed == 'true' for _,_,changed,_ in records)
          if proven < 1:
              raise SystemExit('No changed local-memory optimization proved by SMT')
          if 'T5_MEMORY_NEGATIVE_SMT status=COUNTEREXAMPLE cases=4' not in log:
              raise SystemExit('Missing exact-word SMT negative controls')
          if 'T5_MEMORY_SMT_INDEPENDENT status=PASS cases=41' not in log:
              raise SystemExit('Missing independent local-memory semantics controls')
          import json
          with open('../alive-lite-memory-proofs.jsonl','w') as out:
              for fixture,name,changed,status in records:
                  out.write(json.dumps(dict(
                      scope='exact_local_i32_words',fixture=fixture,pass_name=name,
                      changed=(changed=='true'),status=status,
                      smt_proven=(status=='PROVEN'),
                      source_sha='${{ steps.source.outputs.sha }}',
                  ),sort_keys=True)+'\n')
          print(f'Validated {proven} exact-word memory transformations with SMT proofs')
          # AL-02: never count an unexecuted or unchanged pass as proved.
          import json
          stages = [
              json.loads(line.split('AL02_TYPEID_LEDGER ',1)[1])
              for line in log.splitlines() if 'AL02_TYPEID_LEDGER ' in line
          ]
          production = pathlib.Path('crates/opt/src/typed_pipeline.rs').read_text()
          declared = re.search(
              r'pub const TYPED_CORE_PASS_NAMES.*?=\s*\[(.*?)\];',
              production, re.S
          )
          if not declared:
              raise SystemExit('Production TypeId core pass inventory missing')
          actual_names = re.findall(r'"([^"]+)"', declared.group(1))
          if len(actual_names) != 21 or len(set(actual_names)) != 21:
              raise SystemExit('Production TypeId pass catalog changed')
          if len(stages) != len(actual_names) or [
              row['stage'] for row in stages
          ] != actual_names:
              raise SystemExit('AL-02 proof ledger must enumerate each production pass exactly once')
          expected = {'cse','constant_fold','dce','sccp','trivial_phi',
                      'algebra','identical_merges','dead_phi','cfg_bypass','cfg_merge',
                      'pre','if_conversion'}
          proven = [row for row in stages if row['status'] == 'PROVEN']
          if {row['stage'] for row in proven} != expected:
              raise SystemExit('AL-02 missing changed, SMT-proven TypeId witnesses')
          if not all(row['executed'] is True and row['changed'] is True
                     and row['changes'] > 0 and row['smt_proven'] is True
                     and row['fixture'] for row in proven):
              raise SystemExit('AL-02 declared PROVEN without actual optimizer edits')
          unknown = [row for row in stages if row['status'] == 'UNKNOWN_NOT_ADMITTED']
          if len(unknown) != 9 or not all(
              row['executed'] is False and row['changed'] is None
              and row['changes'] == 0 and row['smt_proven'] is False
              for row in unknown
          ):
              raise SystemExit('AL-02 unadmitted pass misclassified as proved/no-op')
          if 'AL02_TYPEID_SUMMARY stages=21 changed_proven=12 unknown_not_admitted=9 sat_controls=4 verdict=PROVEN' not in log:
              raise SystemExit('AL-02 proof summary missing')
          with open('../alive-lite-typeid-stage-proofs.jsonl','w') as evidence:
              for row in stages:
                  row['source_sha'] = '${{ steps.source.outputs.sha }}'
                  evidence.write(json.dumps(row, sort_keys=True)+'\n')
          if not all(row.get('policy') == ('select_capable' if row['stage'] == 'if_conversion' else 'default') for row in proven):
              raise SystemExit('AL-02 proof stage policy is not recorded accurately')
          composed = [
              json.loads(line.split('AL02_TYPEID_SOURCE_LEDGER ',1)[1])
              for line in log.splitlines() if 'AL02_TYPEID_SOURCE_LEDGER ' in line
          ]
          if {row['fixture'] for row in composed} != {
              'arithmetic_trap_cse', 'guarded_phi_constant'
          } or len(composed) != 2:
              raise SystemExit('Missing distinct whole TypeId source-composition proofs')
          if not all(row['path'] == 'optimize_typeid_source'
                     and row['changed'] is True and row['changes'] > 0
                     and row['verdict'] == 'PROVEN' for row in composed):
              raise SystemExit('Whole production TypeId transaction not changed and SMT-proven')
          if 'AL02_TYPEID_SOURCE_SUMMARY transactions=2 changed_proven=2 policy=default_select_disabled verdict=PROVEN' not in log:
              raise SystemExit('AL-02 source-pipeline composition summary missing')
          with open('../alive-lite-typeid-source-proofs.jsonl','w') as evidence:
              for row in composed:
                  row['source_sha'] = '${{ steps.source.outputs.sha }}'
                  evidence.write(json.dumps(row, sort_keys=True)+'\n')
          print('Validated two actual default TypeId source optimizer transactions')
          print('Validated 21 TypeId production stages: 12 changed+proven, 9 unknown')
          if not re.search(r'AL01_DIRECT_TYPEID_SMT changed_passes=1 changed_operations=[1-9][0-9]* proofs=1 sat_mutants=2 unknown_controls=3 status=PROVEN', log):
              raise SystemExit('Missing changed TypeId-native AL-01 Z3 proof and negative controls')
          if not re.search(r'test alive_lite_typeid::al02_typeid_stage_proof_ledger \.\.\.', log):
              raise SystemExit('AL-02 direct TypeId Z3 proof test did not execute')
          if not re.search(r'test alive_lite_typeid::al01_direct_typeid_proves_changed_cse_and_finds_phi_trap_mutants \.\.\. AL01_DIRECT_TYPEID_SMT', log):
              raise SystemExit('Missing passing AL-01 TypeId Z3 test')
          if 'test alive_lite_typeid_wide::al03_pure_integer_sccp_changed_pass_smt_and_sat_controls ... AL03_PURE_SCCP' not in log:
              raise SystemExit('Missing real narrow TypeId SCCP branch selection SMT proof test')
          if 'AL03_PURE_SCCP changed_passes=8 unsat=8 sat_phi=8 sat_value=8 concrete=1040 widths=8,16,32,64 optimizer=typed_sccp branches=constant_bool verdict=PROVEN' not in log:
              raise SystemExit('Missing 8 changed SCCP UNSAT proofs and 16 SAT controls')
          print(f'Validated {passed} Alive-lite tests and {len(proofs)} per-pass proof records')
          PY
          mkdir -p "$GITHUB_WORKSPACE/.alive-lite-verified"
          cp "$GITHUB_WORKSPACE/alive-lite-coverage.jsonl" "$GITHUB_WORKSPACE/alive-lite-proofs.jsonl" "$GITHUB_WORKSPACE/.alive-lite-verified/"
          printf '%s\n' "${{ steps.source.outputs.sha }}" > "$GITHUB_WORKSPACE/.alive-lite-verified/source-sha.txt"
          echo "Alive-lite Z3 proof tests passed" >> "$GITHUB_STEP_SUMMARY"
      - name: Check AL-01 direct TypeId proof test with strict Clippy
        if: steps.verified.outputs.cache-hit != 'true' || inputs.force_recheck || github.event_name == 'push'
        shell: bash
        working-directory: compiler
        run: |
          timeout --signal=TERM --kill-after=10s 3m \
            cargo clippy -p compiler-opt --test alive_lite -- -D warnings
      - name: Audit complete Alive-lite evidence with independent negative controls
        if: steps.verified.outputs.cache-hit != 'true' || inputs.force_recheck || github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tools -p 'test_validate_alive_lite_evidence.py' -v
          python3 tools/validate_alive_lite_evidence.py \
            --source-sha "${{ steps.source.outputs.sha }}" \
            --coverage alive-lite-coverage.jsonl \
            --proofs alive-lite-proofs.jsonl \
            --bounded-memory alive-lite-memory.jsonl \
            --memory-proofs alive-lite-memory-proofs.jsonl
      - name: Upload coverage and proof evidence
        if: success() && (steps.verified.outputs.cache-hit != 'true' || inputs.force_recheck || github.event_name == 'push')
        uses: actions/upload-artifact@v4
        with:
          name: alive-lite-evidence
          path: |
            alive-lite-coverage.jsonl
            alive-lite-proofs.jsonl
            alive-lite-memory.jsonl
            alive-lite-memory-proofs.jsonl
            alive-lite-typeid-stage-proofs.jsonl
            alive-lite-typeid-source-proofs.jsonl
          retention-days: 14
      - name: Cache exact passing source revision
        if: success() && steps.verified.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .alive-lite-verified
          key: alive-lite-source-v1-${{ hashFiles('.github/workflows/verify-alive-lite.yml') }}-${{ steps.source.outputs.sha }}
      - name: Report previously validated revision
        if: steps.verified.outputs.cache-hit == 'true' && !inputs.force_recheck && github.event_name != 'push'
        run: echo "Exact compiler revision previously passed Alive-lite proofs" >> "$GITHUB_STEP_SUMMARY"
      - name: Identify failed source revision
        if: failure()
        shell: bash
        run: |
          echo "Alive-lite failed while validating compiler revision: ${{ steps.source.outputs.sha }}" >> "$GITHUB_STEP_SUMMARY"
          echo "See alive-lite-source-failures artifact for compiler diagnostics." >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve proof failures and build diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: alive-lite-source-failures
          path: |
            ${{ runner.temp }}/alive-lite-concrete.log
            ${{ runner.temp }}/alive-lite-build.log
            ${{ runner.temp }}/alive-lite-bounded-loops.log
            ${{ runner.temp }}/alive-lite-memory.log
            ${{ runner.temp }}/alive-lite-proof.log
            ${{ runner.temp }}/alive-lite-failures/
          if-no-files-found: ignore
          retention-days: 14
