name: Build and verify Alive-lite optimizer proofs

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Compiler branch, tag or commit
        required: false
        default: main
        type: string
      force_recheck:
        description: Rerun previously passing Z3 proofs
        required: false
        default: false
        type: boolean
  pull_request:
    paths:
      - '.github/workflows/verify-alive-lite.yml'
      - 'tools/al03_proof_manifest.json'
      - 'tools/validate_al03_manifest.py'
      - 'tools/test_validate_al03_manifest.py'
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-alive-lite.yml'
      - 'tools/al03_proof_manifest.json'
      - 'tools/validate_al03_manifest.py'
      - 'tools/test_validate_al03_manifest.py'

permissions:
  contents: read

concurrency:
  group: alive-lite-source-${{ inputs.source_ref || 'main' }}-${{ github.event_name == 'pull_request' && github.head_ref || 'main' }}
  cancel-in-progress: true

jobs:
  prove:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout workflow repository for versioned cache keys
        uses: actions/checkout@v4
      - name: Checkout exact compiler source
        uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 4c2f1c77e14757c7c6264d48541792ff1ecd136d
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Identify source revision and proof target
        id: source
        shell: bash
        run: |
          set -euo pipefail
          sha="$(git -C compiler rev-parse HEAD)"
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]]
          test -s compiler/crates/opt/tests/alive_lite.rs
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "Compiler revision: $sha" >> "$GITHUB_STEP_SUMMARY"
          [[ "$sha" == "4c2f1c77e14757c7c6264d48541792ff1ecd136d" ]] || { echo "AArch64 emitter source SHA mismatch"; exit 1; }
      - name: Skip proofs already validated for exact source and workflow
        id: verified
        uses: actions/cache/restore@v4
        with:
          path: .alive-lite-verified
          key: alive-lite-source-v1-${{ hashFiles('.github/workflows/verify-alive-lite.yml', 'tools/al03_proof_manifest.json', 'tools/validate_al03_manifest.py', 'tools/test_validate_al03_manifest.py') }}-${{ steps.source.outputs.sha }}
          lookup-only: true
      - name: Restrict workspace to compiler core
        if: steps.verified.outputs.cache-hit != 'true' || inputs.force_recheck || github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          Path('compiler/Cargo.toml').write_text('''[workspace]
          resolver = "2"
          members = ["crates/ir", "crates/opt", "crates/backend", "crates/backend-x86"]
          ''')
          PY
      - name: Reuse Rust compilation cache
        if: steps.verified.outputs.cache-hit != 'true' || inputs.force_recheck || github.event_name == 'push'
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: alive-lite-source-v1
          cache-workspace-crates: 'true'
      - name: Build Alive-lite proof test binary
        if: steps.verified.outputs.cache-hit != 'true' || inputs.force_recheck || github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          cd compiler
          timeout --signal=TERM --kill-after=10s 12m \
            cargo test -p compiler-opt --test alive_lite --no-run \
            2>&1 | tee "$RUNNER_TEMP/alive-lite-build.log"
          # Cargo --no-run verifies successful test executable creation itself.
          # The actual artifact may be under a build-script OUT_DIR or a
          # configured CARGO_TARGET_DIR, not necessarily target/debug/deps.
          # The pipeline's pipefail already preserves cargo/timeout failures.
      # Reject compiler/backend warnings before spending time on AL solver proofs.
      # Keep this the same strict whole-dependency Clippy gate as the old
      # end-of-workflow step; no warnings are downgraded or suppressed.
      - name: Check AL-01 direct TypeId proof test with strict Clippy
        if: steps.verified.outputs.cache-hit != 'true' || inputs.force_recheck || github.event_name == 'push'
        shell: bash
        working-directory: compiler
        run: |
          timeout --signal=TERM --kill-after=10s 3m \
            cargo clippy -p compiler-opt --test alive_lite -- -D warnings
      - name: Verify P17 selected shared-plan TypeId/parity smoke without legacy production fallback
        if: steps.verified.outputs.cache-hit != 'true' || inputs.force_recheck || github.event_name == 'push'
        shell: bash
        working-directory: compiler
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=10s 5m \
            cargo test -p compiler-opt --test alive_lite \
              al05_p17_cross_view::al05_p17_selected_plans_legacy_proof_and_direct_typeid_reference_agree \
              -- --exact --nocapture \
            2>&1 | tee "$RUNNER_TEMP/al05-p17-cross-view.log"
          grep -F 'test al05_p17_cross_view::al05_p17_selected_plans_legacy_proof_and_direct_typeid_reference_agree ... ok' \
            "$RUNNER_TEMP/al05-p17-cross-view.log"
          grep -F 'AL05_P17_SHARED_PLAN_TYPEID_PARITY selected=24 observations=120 legacy=PROOF_ONLY native=OWNED_TYPEID verdict=PASS' \
            "$RUNNER_TEMP/al05-p17-cross-view.log"

      - name: Verify native TypeId and legacy narrow-store reconstruction parity
        if: steps.verified.outputs.cache-hit != 'true' || inputs.force_recheck || github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          cd compiler
          timeout --signal=TERM --kill-after=10s 5m \
            cargo test -p compiler-opt --test typed_global_memory \
              p3c2_typed_and_legacy_narrow_store_reconstruction_match -- --nocapture

      - name: Verify permanent AL-04.P3c.3a native two-byte pointer-PHI parity
        if: steps.verified.outputs.cache-hit != 'true' || inputs.force_recheck || github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          cd compiler
          timeout --signal=TERM --kill-after=10s 5m \
            cargo test -p compiler-opt --test typed_global_memory \
              p3c3_two_origin_byte_phi_typeid_and_legacy_parity -- --nocapture

      - name: Verify permanent AL-04.P3c.3b composed-byte TypeId parity
        if: steps.verified.outputs.cache-hit != 'true' || inputs.force_recheck || github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          cd compiler
          timeout --signal=TERM --kill-after=10s 5m \
            cargo test -p compiler-opt --test typed_global_memory \
              p3c3b_composed_byte_typeid_and_legacy_parity -- --nocapture
          timeout --signal=TERM --kill-after=10s 5m \
            cargo test -p compiler-opt --lib \
              partially_overlapped_bytes_keep_only_initialized_lanes -- --nocapture

      - name: Verify permanent AL-04.P4a fail-closed effect contract
        if: steps.verified.outputs.cache-hit != 'true' || inputs.force_recheck || github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          cd compiler
          timeout --signal=TERM --kill-after=10s 5m \
            cargo test -p compiler-opt --test alive_lite \
              al04_p4a_ordered_frame_effects_and_fail_closed_scope -- --nocapture

      - name: Verify permanent AL-04.P4b.1 full initialized frame8 scope
        if: steps.verified.outputs.cache-hit != 'true' || inputs.force_recheck || github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          cd compiler
          timeout --signal=TERM --kill-after=10s 5m \
            cargo test -p compiler-opt --test alive_lite \
              al04_p4b1_frame_extent_init_effect_budgets_and_pass_changes -- --nocapture

      - name: Permanent AL-04.P4b.2 exact public-global contract and UNKNOWN guards
        if: steps.verified.outputs.cache-hit != 'true' || inputs.force_recheck || github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          cd compiler
          timeout --signal=TERM --kill-after=10s 5m \
            cargo test -p compiler-opt --test alive_lite \
              al04_p4b2_exact_globals_scope_and_real_forward_changes -- --nocapture

      - name: Permanent AL-04.P4b.3 pretrap call/global UNKNOWN and real-forward scope
        if: steps.verified.outputs.cache-hit != 'true' || inputs.force_recheck || github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          cd compiler
          timeout --signal=TERM --kill-after=10s 5m \
            cargo test -p compiler-opt --test alive_lite \
              al04_p4b3_pretrap_event_scope_fail_closed_and_real_forward -- --nocapture

      - name: Permanent AL-04.P4b.4 checked-index pretrap path scope and UNKNOWN guards
        if: steps.verified.outputs.cache-hit != 'true' || inputs.force_recheck || github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          cd compiler
          timeout --signal=TERM --kill-after=10s 5m \
            cargo test -p compiler-opt --test alive_lite \
              al04_p4b4_checked_effect_histories_and_fail_closed_bounds -- --nocapture

      - name: Permanent AL-04.P4b.5 exact narrow-literal bounds and all-trap scope
        if: steps.verified.outputs.cache-hit != 'true' || inputs.force_recheck || github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          cd compiler
          timeout --signal=TERM --kill-after=10s 5m \
            cargo test -p compiler-opt --test alive_lite \
              al04_p4b5_narrow_constant_bounds_scope_and_real_rewrites -- --nocapture

      - name: Permanent AL-04.P4b.6 derived-index scope and real forwarding proof
        if: steps.verified.outputs.cache-hit != 'true' || inputs.force_recheck || github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          cd compiler
          timeout --signal=TERM --kill-after=10s 5m \
            cargo test -p compiler-opt --test alive_lite \
              al04_p4b6_derived_signed_index_scope_and_actual_forward -- --nocapture

      - name: Permanent AL-04.P4b.7 generated verified mutations and concrete replay
        if: steps.verified.outputs.cache-hit != 'true' || inputs.force_recheck || github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          cd compiler
          timeout --signal=TERM --kill-after=10s 5m \
            cargo test -p compiler-opt --test alive_lite \
              al04_p4b7_generated_mutations_are_valid_and_bounded -- --nocapture

      - name: Run non-Z3 Alive-lite checks and coverage ledger
        if: steps.verified.outputs.cache-hit != 'true' || inputs.force_recheck || github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          cd compiler
          timeout --signal=TERM --kill-after=15s 5m \
            cargo test -p compiler-opt --test alive_lite -- --nocapture \
            2>&1 | tee "$RUNNER_TEMP/alive-lite-concrete.log"
          python3 - "$RUNNER_TEMP/alive-lite-concrete.log" <<'PY'
          import json, pathlib, re, sys
          log = pathlib.Path(sys.argv[1]).read_text(errors='replace')
          rows = [json.loads(line.split('T5_LEDGER ', 1)[1]) for line in log.splitlines() if 'T5_LEDGER ' in line]
          if not rows:
              raise SystemExit('Missing T5 coverage ledger')
          if not re.search(r'test result: ok\.\s+[1-9][0-9]* passed;', log):
              raise SystemExit('No successful concrete Alive-lite tests')
          if not re.search(r'test t5_scalar_comparison_branches_match_independent_signed_expectations \.\.\. ok', log):
              raise SystemExit('Missing independent signed-comparison truth-table test')
          # T5.3 replay coverage must not silently disappear from the fast gate.
          for test in (
              'replay_select_arm_order_and_strict_decode',
              'replay_codec_rejects_semantically_unexecutable_functions',
              'replay_fixture_rejects_broken_pass_and_missing_transformation',
              'generated_cfg_replay_matches_original_pass_output',
              'replay_saved_fixtures_and_optional_external_file',
          ):
              if not re.search(r'test alive_lite_codec::'+test+r' \.\.\. ok', log):
                  raise SystemExit(f'Missing passing replay regression: {test}')
          if not re.search(r'test alive_lite_typeid::al02_source_pipeline_compositions_changed_and_replayable \.\.\. ok', log):
              raise SystemExit('AL-02 composed default TypeId source non-Z3 replay missing')
          if not re.search(r'test alive_lite_typeid::al02_typeid_witnesses_are_changed_replayable_and_catalogued \.\.\. ok', log):
              raise SystemExit('AL-02 changed TypeId/replay controls missing')
          if 'test alive_lite_memory::al04_checked_local_word_concrete_scope_and_unknowns ... ok' not in log:
              raise SystemExit('Missing AL-04 checked local indexed-word concrete/UNKNOWN regression')
          if 'test alive_lite_memory::al04_symbolic_checked_index_scope_and_fail_closed_budgets ... ok' not in log:
              raise SystemExit('Missing dynamic checked-index guarded memory paths and fail-closed budgets')
          if not re.search(r'test seeded_select_corpus_is_replayable_and_distinct \.\.\. ok', log):
              raise SystemExit('Missing passing seeded select corpus check')
          if not re.search(r'test seeded_select_phi_traps_roundtrip_and_negative_controls \.\.\. ok', log):
              raise SystemExit('Missing select-PHI-trap concrete/replay controls')
          if not re.search(r'test select_phi_pass_triggers_replay_and_remain_distinct \.\.\. ok', log):
              raise SystemExit('Missing replayable PRE/SCCP select-PHI trigger fixtures')
          if not re.search(r'test select_phi_sccp_both_branch_directions_preserve_traps \.\.\. ok', log):
              raise SystemExit('Missing SCCP branch-direction trap checks')
          if 'test alive_lite_restricted_loops::al05_fixed_trip_admission_is_strict_without_solver ... ok' not in log:
              raise SystemExit('Permanent AL-05 finite-loop admission and UNKNOWN controls missing')
          if 'test alive_lite_inductive_loops::al05_inductive_scope_and_no_solver_controls ... ok' not in log:
              raise SystemExit('Permanent AL-05 induction structural and UNKNOWN controls missing')
          if 'test alive_lite_inductive_replay::al05_local_semantic_scope_matches_production_flags_and_smt ... ok' not in log:
              raise SystemExit('AL-05 reviewed scalar/CFG Op flags and SMT semantic-scope check missing')
          if not re.search(
              r'FS1_TYPEID_CAST_CTZ admitted=3 invalid=8\s+ctz_smt=UNKNOWN native_typeid=verified verdict=PASS',
              log,
          ):
              raise SystemExit('FS-1 CTZ/cast/NOT native TypeId invalid input and fail-closed UNKNOWN gate missing')
          if not re.search(
              r'FS1_CFG_DRAFT_CONCRETE cases=4964 traps=[1-9][0-9]* normal=[1-9][0-9]*\s+changed_cse=4 mutants=8 bool_literals=2 eager_faults=2 phi_swap=parallel\s+invalid_unknown=3 verdict=PASS',
              log,
          ):
              raise SystemExit('FS-1 draft owned TypeId independent Bool/PHI/Select/trap and 8-mutant concrete gate missing')
          output = pathlib.Path('..') / 'alive-lite-coverage.jsonl'
          output.write_text(''.join(json.dumps(row, sort_keys=True) + '\n' for row in rows))
          print(f'Validated {len(rows)} concrete coverage records')
          PY
      - name: Check bounded loop verdicts (not universal proofs)
        if: steps.verified.outputs.cache-hit != 'true' || inputs.force_recheck || github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          cd compiler
          timeout --signal=TERM --kill-after=10s 3m \
            cargo test -p compiler-opt --test loop_trap_semantics \
              t5_bounded_loop_classification_is_fail_closed -- --exact --nocapture \
            2>&1 | tee "$RUNNER_TEMP/alive-lite-bounded-loops.log"
          grep -F 'test t5_bounded_loop_classification_is_fail_closed ... ok' \
            "$RUNNER_TEMP/alive-lite-bounded-loops.log"
      - name: Check bounded local memory effects and fail-closed verdicts
        if: steps.verified.outputs.cache-hit != 'true' || inputs.force_recheck || github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          cd compiler
          timeout --signal=TERM --kill-after=10s 3m \
            cargo test -p compiler-opt --test memory_execution_oracle -- --nocapture --test-threads=1 \
            2>&1 | tee "$RUNNER_TEMP/alive-lite-memory.log"
          python3 - "$RUNNER_TEMP/alive-lite-memory.log" <<'PY'
          import json, pathlib, re, sys
          log = pathlib.Path(sys.argv[1]).read_text(errors='replace')
          expected = {
              't5_memory_alias_effect_and_trap_negative_controls',
              't5_memory_unknowns_are_fail_closed',
              't5_memory_actual_passes_are_bounded_only',
              't5_memory_call_order_is_observable',
              't5_memory_generated_alias_corpus_is_bounded_only',
          }
          # With --nocapture and serial execution, test output appears between
          # the test name and its final 'ok' on a different line.
          tests = set(re.findall(r'test (t5_memory_\w+) \.\.\.', log))
          if not expected <= tests:
              raise SystemExit(f'Missing bounded memory controls: {sorted(expected-tests)}')
          rows = []
          for fixture, name, cases in re.findall(
              r'T5_MEMORY status=BOUNDED_ONLY fixture=(\w+) pass=(\w+) cases=(\d+)', log
          ):
              rows.append(dict(scope='bounded_local_memory', fixture=fixture,
                               pass_name=name, cases=int(cases), status='BOUNDED_ONLY',
                               smt_proven=False))
          expected_pairs = {(f,p) for f in ('pointer_phi','overlap_zero','loop_memory')
                                  for p in ('forward','dse','pipeline')}
          if {(r['fixture'],r['pass_name']) for r in rows} != expected_pairs or len(rows) != 9:
              raise SystemExit('Missing per-pass bounded memory coverage')
          generated = [
              json.loads(line.split('T5_MEMORY_LEDGER ', 1)[1])
              for line in log.splitlines() if 'T5_MEMORY_LEDGER ' in line
          ]
          if len(generated) != 93:
              raise SystemExit(f'Expected 93 generated memory checks, got {len(generated)}')
          unique = {(r['family'],r['seed'],r['pass']) for r in generated}
          if len(unique) != len(generated):
              raise SystemExit('Duplicate generated memory coverage records')
          if any(r['status'] != 'BOUNDED_ONLY' or r['smt_proven'] is not False
                 or r['cases'] != 7 for r in generated):
              raise SystemExit('Invalid or overstated generated memory verdict')
          if not any(r['changed'] for r in generated):
              raise SystemExit('Generated memory campaign exercised no transformation')
          rows.extend(generated)
          if 'T5_MEMORY_NEGATIVE status=COUNTEREXAMPLE cases=4' not in log:
              raise SystemExit('Missing memory negative controls')
          if 'T5_MEMORY_UNKNOWN status=UNKNOWN_UNSUPPORTED_OR_BOUNDED cases=5' not in log:
              raise SystemExit('Missing fail-closed memory unknown controls')
          out = pathlib.Path('..') / 'alive-lite-memory.jsonl'
          out.write_text(''.join(json.dumps(r,sort_keys=True)+'\n' for r in rows))
          print(f'Validated {len(rows)} bounded-only memory cases with negative/unknown controls')
          PY
      - name: Check independent native C11 AL-04 indexed-word oracle
        if: steps.verified.outputs.cache-hit != 'true' || inputs.force_recheck || github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          cc -std=c11 -O2 -Wall -Wextra -Werror \
            compiler/crates/opt/tests/oracles/al04_checked_local_word.c \
            -o "$RUNNER_TEMP/al04-checked-word-c"
          "$RUNNER_TEMP/al04-checked-word-c" | tee alive-lite-al04-native-c.log
          grep -Fx 'AL04_NATIVE_C_INDEXED cases=8 wrong_index=7 wrong_alias=7 verdict=PASS' \
            alive-lite-al04-native-c.log

      - name: Check independent native C11 AL-04 symbolic-index/trap oracle
        if: steps.verified.outputs.cache-hit != 'true' || inputs.force_recheck || github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          cc -std=c11 -O2 -Wall -Wextra -Werror \
            compiler/crates/opt/tests/oracles/al04_symbolic_checked_index.c \
            -o "$RUNNER_TEMP/al04-symbolic-index-c"
          "$RUNNER_TEMP/al04-symbolic-index-c" | tee alive-lite-al04-symbolic-c.log
          grep -Fx 'AL04_NATIVE_C_SYMBOLIC cases=12 wrong_index=6 wrong_alias=5 missing_trap=9 verdict=PASS' \
            alive-lite-al04-symbolic-c.log

      - name: Verify accepted AL-04.P2 subword C11 oracle
        if: steps.verified.outputs.cache-hit != 'true' || inputs.force_recheck || github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          cc -std=c11 -O2 -Wall -Wextra -Werror \
            compiler/crates/opt/tests/oracles/al04_byte_lanes.c \
            -o "$RUNNER_TEMP/al04-byte-lanes-c"
          "$RUNNER_TEMP/al04-byte-lanes-c" | tee alive-lite-al04-byte-lanes.log
          grep -Fx 'AL04_NATIVE_C_BYTE_LANES cases=64 wrong_offset_detected=1 wrong_sign_detected=1 verdict=PASS' \
            alive-lite-al04-byte-lanes.log

      - name: Verify accepted AL-04.P3a wide C11 oracle
        if: steps.verified.outputs.cache-hit != 'true' || inputs.force_recheck || github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          cc -std=c11 -O2 -Wall -Wextra -Werror \
            compiler/crates/opt/tests/oracles/al04_wide_memory.c \
            -o "$RUNNER_TEMP/al04-wide-memory-c"
          "$RUNNER_TEMP/al04-wide-memory-c" | tee alive-lite-al04-wide-memory.log
          grep -Fx 'AL04_NATIVE_C_WIDE cases=28 wrong_offset_detected=1 lost_write_detected=1 verdict=PASS' \
            alive-lite-al04-wide-memory.log

      - name: Verify AL-04.P3b changed mixed-width C11 oracle
        if: steps.verified.outputs.cache-hit != 'true' || inputs.force_recheck || github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          cc -std=c11 -O2 -Wall -Wextra -Werror \
            compiler/crates/opt/tests/oracles/al04_byte_range.c \
            -o "$RUNNER_TEMP/al04-byte-range-c"
          "$RUNNER_TEMP/al04-byte-range-c" | tee alive-lite-al04-p3b-native.log
          grep -Fx 'AL04_NATIVE_C_BYTE_RANGE cases=75 wrong_alias_detected=1 lost_later_detected=1 verdict=PASS' \
            alive-lite-al04-p3b-native.log

      - name: Verify accepted AL-04.P3c narrow-read C11 oracle
        if: steps.verified.outputs.cache-hit != 'true' || inputs.force_recheck || github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          cc -std=c11 -O2 -Wall -Wextra -Werror \
            compiler/crates/opt/tests/oracles/al04_narrow_read.c \
            -o "$RUNNER_TEMP/al04-narrow-read-c"
          "$RUNNER_TEMP/al04-narrow-read-c" | tee alive-lite-al04-narrow-read.log
          grep -Fx 'AL04_NATIVE_C_NARROW_READ cases=128 wrong_sign_detected=1 lost_overlap_detected=1 verdict=PASS' \
            alive-lite-al04-narrow-read.log

      - name: Verify permanent AL-04.P3c.2 store-reconstruction C11 oracle
        if: steps.verified.outputs.cache-hit != 'true' || inputs.force_recheck || github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          cc -std=c11 -O2 -Wall -Wextra -Werror \
            compiler/crates/opt/tests/oracles/al04_store_reconstruction.c \
            -o "$RUNNER_TEMP/al04-store-reconstruction-c"
          "$RUNNER_TEMP/al04-store-reconstruction-c" | tee alive-lite-al04-store-reconstruction.log
          grep -Fx 'AL04_NATIVE_C_STORE_RECON cases=198 wrong_sign=1 lost_later=1 wrong_mask=1 trap_cases=8 verdict=PASS' \
            alive-lite-al04-store-reconstruction.log

      - name: Verify permanent AL-04.P3c.3a independent C11 byte-PHI oracle
        if: steps.verified.outputs.cache-hit != 'true' || inputs.force_recheck || github.event_name == 'push'
        shell: bash
        run: |
