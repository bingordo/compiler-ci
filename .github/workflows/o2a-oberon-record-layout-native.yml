name: O2a Oberon contiguous record native TypeId candidate
on:
  pull_request:
    paths:
      - '.github/workflows/o2a-oberon-record-layout-native.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 7d5de003a7c69b45e7c9f340e2ae0eacf30bf8de
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Verify exact candidate and frontend pin
        shell: bash
        run: |
          set -euxo pipefail
          test "$(git -C compiler rev-parse HEAD)" = 7d5de003a7c69b45e7c9f340e2ae0eacf30bf8de
          grep -Fq 'rev = "c2c7911e0e8f1c1f9c6255fd8626d2e92aa7eb66"' compiler/crates/driver/Cargo.toml
          git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: o2a-oberon-record-layout
      - name: Check driver all targets, native record GAS/ELF oracle and prior O1
        run: |
          set -euxo pipefail
          cargo check --manifest-path compiler/Cargo.toml -p compiler --all-targets
          cargo test --manifest-path compiler/Cargo.toml -p compiler --bin compiler \
            checked_oberon_contiguous_record_layout_and_copies_execute_typeid -- --nocapture
          cargo test --manifest-path compiler/Cargo.toml -p compiler --bin compiler \
            checked_oberon_private_integer_record_fields_link_and_execute_typeid -- --nocapture
          cargo test --manifest-path compiler/Cargo.toml -p compiler --bin compiler \
            checked_oberon_source_uses_native_typeid_gas_and_elf -- --nocapture
      - name: Strict all-target driver Clippy
        run: cargo clippy --manifest-path compiler/Cargo.toml -p compiler --all-targets -- -D warnings
