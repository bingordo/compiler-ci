# Temporary exact-source Itanium LSDA validation; do not merge.
name: Shared Itanium LSDA GCC interoperability
on:
  pull_request:
    paths: ['.github/workflows/temporary-eh-lsda.yml']
permissions:
  contents: read
jobs:
  lsda:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      SOURCE_SHA: b6a745d9651ec9716b04c9bb1d09142f0ad88f1a
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: ${{ env.SOURCE_SHA }}
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Verify exact revision and isolate shared backend
        run: |
          set -euo pipefail
          test "$(git -C compiler rev-parse HEAD)" = "$SOURCE_SHA"
          cat > compiler/Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir-macros", "crates/ir", "crates/backend"]
          EOF
          rm -f compiler/Cargo.lock
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: temporary-eh-lsda
          cache-on-failure: true
      - name: Verify byte encoding and real GCC personality interoperation
        working-directory: compiler
        run: |
          set -euo pipefail
          cargo test -p compiler-backend --lib itanium_lsda -- --nocapture
          cargo test -p compiler-backend --test itanium_lsda_runtime -- --nocapture
