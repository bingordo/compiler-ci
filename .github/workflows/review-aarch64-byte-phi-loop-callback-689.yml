name: Source-pinned ARM64 cyclic byte-PHI narrow callback review 689
on:
  push:
    branches: [review/aarch64-byte-phi-loop-callback-689]
    paths: ['.github/workflows/review-aarch64-byte-phi-loop-callback-689.yml']
  pull_request:
    paths: ['.github/workflows/review-aarch64-byte-phi-loop-callback-689.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 35
    steps:
      - name: Checkout temporary compiler-ci workflow
        uses: actions/checkout@v4
      - name: Checkout pinned compiler PR source
        uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: f4eecbef11de95dd50e6659579c6140d70194b2c
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Assert reviewed source and native ARM64
        run: |
          set -euo pipefail
          test "$(git -C compiler rev-parse HEAD)" = "f4eecbef11de95dd50e6659579c6140d70194b2c"
          test "$(uname -m)" = "aarch64"
          command -v gcc
      - uses: dtolnay/rust-toolchain@stable
      - name: Isolate core Rust crates on external CI only
        working-directory: compiler
        run: |
          python3 - <<'PY'
          from pathlib import Path
          Path('Cargo.toml').write_text("""[workspace]
          resolver = "2"
          members = ["crates/ir", "crates/opt", "crates/backend", "crates/backend-x86", "crates/backend-aarch64"]
          """)
          PY
      - name: Cache review core build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: review-aarch64-byte-phi-loop-callback-689
      - name: New native AArch64 cyclic byte PHI halfword alias callback C11 oracle
        working-directory: compiler
        run: cargo test -p compiler-opt --test review_aarch64_loop_byte_phi_callback -- --nocapture
      - name: Prior AArch64 mixed local/global cyclic PHI callback
        working-directory: compiler
        run: cargo test -p compiler-opt --test review_aarch64_mixed_global_escape_loop -- --nocapture
      - name: Existing native AArch64 local narrow memory and address tests
        working-directory: compiler
        run: |
          set -euo pipefail
          cargo test -p compiler-backend-aarch64 --test local_memory -- --nocapture
          cargo test -p compiler-backend-aarch64 --test ptr64_calls -- --nocapture
          cargo test -p compiler-backend-aarch64 --test typeid_abi_calls_native -- --nocapture
      - name: Existing shared TypeId memory solver and alias PHI controls
        working-directory: compiler
        run: |
          set -euo pipefail
          cargo test -p compiler-opt --test memory_execution_oracle -- --nocapture
          cargo test -p compiler-opt --test alias_phi_exhaustive -- --nocapture
          cargo test -p compiler-opt --test typed_global_memory -- --nocapture
      - name: Strict affected libraries and new native AArch64 review test Clippy
        working-directory: compiler
        run: |
          set -euo pipefail
          cargo clippy -p compiler-ir -p compiler-opt -p compiler-backend -p compiler-backend-aarch64 --lib -- -D warnings
          cargo clippy -p compiler-opt --test review_aarch64_loop_byte_phi_callback -- -D warnings
