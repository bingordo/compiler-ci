# Wasm W5 target-aware pointer32, native64 differential, regression.
name: Wasm W5 pointer32 TypeId

on:
  pull_request:
    paths:
      - '.github/workflows/wasm-w5-pointer32.yml'
  workflow_dispatch:
    inputs:
      compiler_sha:
        description: 'Exact compiler commit SHA'
        required: true
        type: string

permissions:
  contents: read

jobs:
  wasm-w5:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact compiler source
        uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: ${{ inputs.compiler_sha || 'aea8945e0ddced3d561e810f0da1b235fd28b483' }}
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Record source pin and isolate credential-free workspace
        shell: bash
        run: |
          set -euo pipefail
          echo "Compiler source: $(git -C compiler rev-parse HEAD)"
          cat > compiler/Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir", "crates/opt", "crates/backend", "crates/backend-x86", "crates/backend-wasm"]
          EOF
          rm -f compiler/Cargo.lock
          rustc --version
          cc --version | head -1
      - name: Setup independent WebAssembly runtime
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: wasm-w5-pointer32
      - name: Run W0-W5 Wasm and native64 differential tests
        working-directory: compiler
        run: cargo test -p compiler-backend-wasm --tests -- --nocapture
      - name: Strict Wasm backend Clippy
        working-directory: compiler
        run: cargo clippy -p compiler-backend-wasm --all-targets -- -D warnings
      - name: Native backend scalar helper tests
        working-directory: compiler
        run: cargo test -p compiler-backend --lib native_integer -- --nocapture
