name: C1 AArch64 fail-closed generated TypeId selector and legacy test-only parity
on:
  pull_request:
    paths:
      - '.github/workflows/verify-aarch64-c1-fail-closed-2487.yml'
permissions:
  contents: read
jobs:
  generator-and-cross-target:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: e57dcc4fcac87618444408128cdafb8a5515f1af
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Assert exact production source SHA and isolate backend workspace
        run: |
          set -euo pipefail
          test "$(git -C compiler rev-parse HEAD)" = "e57dcc4fcac87618444408128cdafb8a5515f1af"
          cat > compiler/Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir", "crates/backend", "crates/backend-aarch64", "crates/backend-x86"]
          EOF
          rm -f compiler/Cargo.lock
      - name: Verify complete generated A64 rules, independent encoding oracles and negative tests
        working-directory: compiler
        run: |
          set -euo pipefail
          if ! python3 tools/regen_aarch64_native_selector_rules.py --check; then
            cp crates/backend-aarch64/src/generated_native_selector_rules.rs /tmp/current-a64-rules.rs
            python3 tools/regen_aarch64_native_selector_rules.py --write
            diff -u /tmp/current-a64-rules.rs crates/backend-aarch64/src/generated_native_selector_rules.rs | head -100 || true
            exit 1
          fi
          python3 -m unittest discover -s tools -p 'test_regen_aarch64_native_selector_rules.py' -v
          python3 tools/regen_aarch64_scalar_gp_forms.py --check
          python3 -m unittest discover -s tools -p 'test_regen_aarch64_scalar_gp_forms.py' -v
          python3 tools/regen_aarch64_scalar_fp_forms.py --check
          python3 -m unittest discover -s tools -p 'test_regen_aarch64_scalar_fp_forms.py' -v
      - name: Warnings denied TypeId/shared x86 and AArch64 all targets
        working-directory: compiler
        run: |
          set -euo pipefail
          RUSTFLAGS="-D warnings" cargo check -p compiler-backend -p compiler-backend-aarch64 --all-targets
          cargo check -p compiler-backend-x86 --lib
          cargo test -p compiler-backend --lib -- --test-threads=1
          # Preserve all existing FP/GP encoding oracles while validating the
          # generated-only TypeId production selection under test.
          cargo test -p compiler-backend-aarch64 --test generated_scalar_fp_forms -- --nocapture
          cargo test -p compiler-backend-aarch64 --test generated_scalar_gp_forms -- --test-threads=1
          cargo test -p compiler-backend-aarch64 --lib -- --test-threads=1
      - name: Verify shared selector and x86 native rule regression
        working-directory: compiler
        run: |
          set -euo pipefail
          cargo test -p compiler-backend-x86 --lib -- --test-threads=1
  real-native-aarch64:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: e57dcc4fcac87618444408128cdafb8a5515f1af
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Assert exact production source and isolate AArch64 workspace
        run: |
          set -euo pipefail
          test "$(uname -m)" = aarch64
          test "$(git -C compiler rev-parse HEAD)" = "e57dcc4fcac87618444408128cdafb8a5515f1af"
          cat > compiler/Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir", "crates/backend", "crates/backend-aarch64"]
          EOF
          rm -f compiler/Cargo.lock
          command -v cc
          command -v objcopy
      - name: Build production crate warnings denied
        working-directory: compiler
        run: |
          set -euo pipefail
          RUSTFLAGS="-D warnings" cargo check -p compiler-backend-aarch64 --all-targets
          # Keep Clippy strict on production while compiling test-only parity
          # selector with warnings denied on every target.
          # Execute all target tests below and prohibit production lint regressions.
          cargo clippy -p compiler-backend-aarch64 --lib -- -D warnings
      - name: Exercise generated TypeId selection and handwritten test parity on real native AArch64
        working-directory: compiler
        run: |
          set -euo pipefail
          cargo test -p compiler-backend-aarch64 --all-targets -- --test-threads=1 --nocapture
          echo 'PASS C1 generated-only production TypeId: test-only handwritten oracle, generator tests, native A64 TypeId/C11/ABI/ELF/GAS, x86 shared regressions' >> "$GITHUB_STEP_SUMMARY"
