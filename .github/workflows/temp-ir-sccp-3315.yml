name: Temporary native SCCP expectations
on:
  pull_request:
    paths: ['.github/workflows/temp-ir-sccp-3315.yml']
permissions:
  contents: read
jobs:
  native-sccp:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      SOURCE_SHA: bc3d2ba2229812478c91f8efb440d220f17136fe
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: ${{ env.SOURCE_SHA }}
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Confirm source and isolate core workspace
        working-directory: compiler
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          cat > Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir", "crates/opt", "crates/backend", "crates/backend-x86", "crates/backend-aarch64"]
          EOF
          rm -f Cargo.lock
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: ir-native-sccp-expectations
      - name: Check native SCCP exact expected module and counters
        working-directory: compiler
        run: cargo test -p compiler-opt --test typed_sccp
      - name: Optimizer unit regression
        if: ${{ !cancelled() }}
        working-directory: compiler
        run: cargo test -p compiler-opt --lib
      - name: Compare alternate fact storage
        if: ${{ !cancelled() }}
        working-directory: compiler
        run: cargo test -p compiler-opt --test typed_sccp --features experimental-sccp-hash
