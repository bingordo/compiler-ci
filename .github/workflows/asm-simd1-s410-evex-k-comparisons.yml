          grep -qF 'generated_evex_imm8_rejects_wrong_bank_mask_width_and_immediates: test' /tmp/evex-imm-listed
          grep -qF 'generated_evex_imm8_bytes_and_operands_match_gnu_as_objdump: test' /tmp/evex-imm-listed
          cargo test -p compiler-backend-x86 --test att_sse_evex_shift_imm -- --nocapture
