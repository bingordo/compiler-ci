name: Temporary Mini-C C99 VLA prototype parameters 306
on:
  pull_request:
    paths: ['.github/workflows/temp-mini-c-vla-parameters-306.yml']
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/mini-c
          ref: 99c250bcb0c4e4c4d1e903bbbea02f00fe0451e0
          persist-credentials: false
      - run: git rev-parse HEAD
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/debug
          key: mini-c-native-vla-scopes-306
          restore-keys: |
            mini-c-native-ubuntu-block-static-296
            mini-c-native-
      - run: cargo test -p mini-c-syntax -p mini-c-sema -p mini-c-cranelift
      - run: cargo clippy -p mini-c-sema -p mini-c-cranelift --all-targets -- -D warnings
      - name: GCC differential for definition parameter bounds
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/vla.c" <<'EOF'
          int f(int n,int m,int a[n][m]);
          unsigned long g(int n,int (*p)[n++]);
          int f(int n,int m,int a[n][m]) {
              int (*p)[m]=a;
              m=1; p[1][2]=17;
              return sizeof(*p)==16 && a[1][2]==17;
          }
          unsigned long g(int n,int (*p)[n++]) {
              return sizeof(*p)+(unsigned long)n;
          }
          int main(void) {
              int a[3][4];
              if(!f(3,4,a) || a[1][2]!=17) return 1;
              if(g(4,a)!=21) return 2;
              return 0;
          }
          EOF
          gcc -std=c99 -pedantic-errors "$RUNNER_TEMP/vla.c" -o "$RUNNER_TEMP/oracle"
          "$RUNNER_TEMP/oracle"
          cargo run -q -p mini-c-cranelift -- --cpp=none --emit-obj "$RUNNER_TEMP/vla.o" "$RUNNER_TEMP/vla.c"
          gcc "$RUNNER_TEMP/vla.o" -o "$RUNNER_TEMP/native"
          "$RUNNER_TEMP/native"
