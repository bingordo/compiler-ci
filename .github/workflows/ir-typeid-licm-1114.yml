# One-off exact-source acceptance; close this PR unmerged after validation.
name: IR P0 TypeId scalar-loop and F16 replay cutover (PR 1114)
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/ir-typeid-licm-1114.yml'
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: ir-licm-1114-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typeid-licm:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_INCREMENTAL: '0'
    steps:
      - name: Checkout exact compiler PR
        uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: a80329cec783a8d84c998d3df518340d88a31c83
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Check SHA and select credential-independent core workspace
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C compiler rev-parse HEAD)" = "a80329cec783a8d84c998d3df518340d88a31c83"
          git -C compiler rev-parse HEAD | tee -a "$GITHUB_STEP_SUMMARY"
          rustc --version | tee -a "$GITHUB_STEP_SUMMARY"
          cat > compiler/Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir", "crates/opt", "crates/backend", "crates/backend-x86"]
          EOF
          rm -f compiler/Cargo.lock
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: ir-typeid-licm-native-parity
      - name: Canonical LICM regression, rollback, C11 ELF/GAS x86 oracle
        working-directory: compiler
        run: cargo test -p compiler-opt --test typed_licm_native -- --nocapture
      - name: TypeId counted induction canonical signed i32 proof and 525-input C11 ELF/GAS oracle
        working-directory: compiler
        run: cargo test -p compiler-opt --test typed_induction_native -- --nocapture
      - name: Native TypeId core pipeline CLI replay
        working-directory: compiler
        run: cargo test -p compiler-opt --test typed_core_pipeline -- --nocapture
      - name: Install debugger required by existing backend DWARF test
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v gdb >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq gdb
          fi
          gdb --version | head -1
      - name: TypeId algebra CLI replay after F16 native-only input cutover
        working-directory: compiler
        run: cargo test -p compiler-opt --test typed_algebra ir_opt_replays_explicit_typed_algebra_without_enabling_typed_pipeline -- --nocapture
      - name: All-target strict Clippy for touched core
        working-directory: compiler
        run: cargo clippy -p compiler-ir -p compiler-opt --all-targets -- -D warnings
      - name: Broad IR/optimizer/backend suite (known unrelated S23 #1058 excluded)
        working-directory: compiler
        run: |
          # The comparison DAG non-idempotence failure is tracked separately
          # in bingordo/compiler#1058; do not misattribute it to native LICM.
          cargo test -p compiler-ir -p compiler-opt -p compiler-backend -p compiler-backend-x86 -- --skip generated_comparison_dag_all_widths_with_cfg_and_negative_guards
