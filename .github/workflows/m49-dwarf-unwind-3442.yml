name: M49 checked source DWARF production unwind parity
on:
  pull_request:
    paths: ['.github/workflows/m49-dwarf-unwind-3442.yml']
permissions:
  contents: read
jobs:
  provenance:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 6f8ea4c408e9fe6fb860ffe42b0d51103f548715
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Resolve compiler dependencies
        run: git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
      - name: Exact source production .eh_frame and DWARF line acceptance
        working-directory: compiler
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "6f8ea4c408e9fe6fb860ffe42b0d51103f548715"
          cargo test -p compiler-backend-x86 --lib typeid_dwarf::tests -- --nocapture
          cargo test -p compiler-backend-x86 --lib
          cd tools/mini-c-driver
          cargo test --test checked_optimized_debug_lines
          cargo test --test source_declaration_dwarf
          cd ../..
          cargo clippy -p compiler-backend-x86 --lib -- -D clippy::all -A clippy::empty_line_after_doc_comments -A clippy::collapsible_match -A clippy::too_many_arguments -A clippy::unnecessary_lazy_evaluations
