name: x86 full ALU and ABI physical measured costs
on:
  push:
    branches: [ci/x86-alu-abi-audit-20261107]
permissions:
  contents: read
jobs:
  profiles:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 887be65f2bf784f868821b46a7f06e2c4cdfa093
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Generator freshness, exact mapping tests and checked CPU profiles
        working-directory: compiler
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "887be65f2bf784f868821b46a7f06e2c4cdfa093"
          python3 tools/regen_x86_forms.py --check
          python3 tools/regen_x86_physical_costs.py --check
          PYTHONPATH=tools python3 -m unittest discover -s tools -p test_import_uops_info.py -v
          python3 tools/validate_x86_costs.py data/x86_costs_generic.json data/x86_costs_skl.json data/x86_costs_zen4.json
      - name: Reproduce 127 exact forms independently against vendor XML checksum
        working-directory: compiler
        run: |
          set -euo pipefail
          curl -fsSL --retry 2 --max-time 180 https://uops.info/instructions.xml -o /tmp/instructions.xml
          echo 'e5e702caaf04c4fc1f75192a9bbe4d8554b3e174f7933a14d124cc33ca677ab3  /tmp/instructions.xml' | sha256sum -c -
          for arch in SKL ZEN4; do
            python3 tools/import_uops_info.py /tmp/instructions.xml --architecture "$arch" \
              --mapping data/x86_uops_variant_mapping.json --output "/tmp/${arch}.json"
            python3 - "$arch" <<'PY'
          import json,sys
          from pathlib import Path
          arch=sys.argv[1]
          expected=json.loads(Path('data/x86_costs_'+arch.lower()+'.json').read_text())
          actual=json.loads(Path('/tmp',arch+'.json').read_text())
          assert actual==expected, 'CPU profile drift: '+arch
          assert len(actual['forms'])==127
          print('PASS 127 exact forms',arch)
          PY
          done
  native-backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 887be65f2bf784f868821b46a7f06e2c4cdfa093
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Backend-only workspace
        run: |
          cat > compiler/Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir", "crates/opt", "crates/backend", "crates/backend-x86"]
          EOF
          rm -f compiler/Cargo.lock
      - name: Full x86 unit, native GAS/ELF and strict Clippy
        working-directory: compiler
        run: |
          set -euo pipefail
          cargo test -p compiler-backend-x86
          cargo clippy -p compiler-backend-x86 --all-targets -- -D warnings
      - name: Enforce canonical Rust formatting on physical-cost analysis
        working-directory: compiler
        run: rustfmt --edition 2021 --check crates/backend-x86/src/physical_costs.rs
  mini-c:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 887be65f2bf784f868821b46a7f06e2c4cdfa093
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Release Mini-C actual physical emission census for SKL/Zen4
        run: |
          set -euo pipefail
          git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
          mkdir -p results
          cargo run --release --manifest-path compiler/tools/mini-c-driver/Cargo.toml \
            -p compiler-mini-c --example shared_select_physical_costs \
            | tee results/alu_abi_coverage.csv
          python3 - <<'PY'
          import csv
          from pathlib import Path
          rows=list(csv.DictReader(Path('results/alu_abi_coverage.csv').open()))
          assert len(rows)==28
          for r in rows:
              assert int(r['physical_instructions'])==int(r['measured_sites'])+int(r['unpriced_sites'])
              assert int(r['spill_words'])>=int(r['spill_homes'])
          baseline={'branches_24':172,'branches_48':312,'branches_72':467,'branches_144':871}
          for name,previous in baseline.items():
              selected=[r for r in rows if r['case']==name and r['budget']=='15' and r['cpu']=='SKL']
              assert len(selected)==1
              r=selected[0]
              assert int(r['measured_sites'])>previous, (name,r['measured_sites'],previous)
              print('COVERAGE',name,r['measured_sites'],'/',r['physical_instructions'],
                    'spills read/write',r['static_spill_reads'],r['static_spill_writes'])
          assert any(int(r['unpriced_sites'])>0 for r in rows), 'No blanket fake 100% coverage'
          print('PASS 28 checked source actual emitter profiles')
          PY
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: x86-physical-alu-abi-coverage
          path: results/alu_abi_coverage.csv
          retention-days: 30
  same-runner-native-abba:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          path: harness
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: a3fa176e19a4a16ec6a7223d72ed1f1631eed390
          path: before
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 887be65f2bf784f868821b46a7f06e2c4cdfa093
          path: after
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Verify exact revisions and use HTTPS for compiler frontend
        run: |
          set -euo pipefail
          test "$(git -C before rev-parse HEAD)" = "a3fa176e19a4a16ec6a7223d72ed1f1631eed390"
          test "$(git -C after rev-parse HEAD)" = "887be65f2bf784f868821b46a7f06e2c4cdfa093"
          git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
          python3 -m py_compile harness/tools/ct05d_select_budget_compare.py after/tools/source_cli_profile.py
      - name: Build independent baseline and candidate optimized Mini-C
        run: |
          set -euo pipefail
          cargo build --release --manifest-path before/tools/mini-c-driver/Cargo.toml -p compiler-mini-c --bin compiler-mini-c
          cargo build --release --manifest-path after/tools/mini-c-driver/Cargo.toml -p compiler-mini-c --bin compiler-mini-c
      - name: Full independent GCC oracle and three-round native ABBA comparison
        run: |
          set -euo pipefail
          mkdir -p results
          python3 harness/tools/ct05d_select_budget_compare.py \
            --helpers after/tools \
            --before before/tools/mini-c-driver/target/release/compiler-mini-c \
            --after after/tools/mini-c-driver/target/release/compiler-mini-c \
            --rounds 3 --results results/cases
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          root=Path('results/cases')
          objects=list(root.glob('*/before.o'))
          assert len(objects)==8,len(objects)
          for old in objects:
              new=old.with_name('after.o')
              assert new.exists()
              a=hashlib.sha256(old.read_bytes()).hexdigest()
              b=hashlib.sha256(new.read_bytes()).hexdigest()
              assert a==b, 'native code changed even though only opt-in cost data should change: '+str(old)
              print('IDENTICAL_NATIVE_OBJECT',old.parent.name,a)
          print('PASS native ELF byte identity, GCC semantic oracle and ABBA')
          PY
          cat results/cases/report.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: x86-alu-abi-cost-abba
          path: results/
          retention-days: 30
