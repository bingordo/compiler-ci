name: Dawn of Men Godot smoke
on:
  pull_request:
    paths: ['.github/workflows/dawn-of-men-smoke.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Fetch public game source
        run: |
          git clone --depth 1 https://github.com/oliver-frommel/dawn-of-men.git game
          git -C game rev-parse HEAD
      - name: Install Godot
        run: |
          set -euo pipefail
          version=4.7.2-stable
          archive="Godot_v${version}_linux.x86_64.zip"
          curl --fail --location --retry 2 "https://github.com/godotengine/godot-builds/releases/download/${version}/${archive}" -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          sudo install "/tmp/godot/Godot_v${version}_linux.x86_64" /usr/local/bin/godot
          godot --version
      - name: Import and parse project
        run: |
          set -euo pipefail
          godot --headless --path game --editor --import 2>&1 | tee import.log
          ! grep -E 'SCRIPT ERROR|Parse Error|ERROR:' import.log
      - name: Run main scene
        run: |
          set -euo pipefail
          timeout 120 godot --headless --path game --quit-after 600 2>&1 | tee smoke.log
          ! grep -E 'SCRIPT ERROR|Parse Error|ERROR:' smoke.log
