name: P5d native TypeId checked indirect GP variadic ABI
on:
  push:
    branches: [test/typeid-p5d-gp-indirect-variadics-20261111]
  pull_request:
    paths: [.github/workflows/verify-p5d-typeid-indirect-varargs.yml]
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 88bf55044ec92d15adae694c30f55f8db43b6fb8
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Verify exact source; isolate non-private core
        working-directory: compiler
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "88bf55044ec92d15adae694c30f55f8db43b6fb8"
          python3 - <<'PY'
          from pathlib import Path
          Path('Cargo.toml').write_text('''[workspace]
          resolver = "2"
          members = ["crates/ir", "crates/opt", "crates/backend", "crates/backend-x86"]
          ''')
          PY
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: typeid-p5d-checked-gp-abi
      - name: IR ABI and native x86 regressions
        working-directory: compiler
        run: |
          set -euo pipefail
          cargo test -p compiler-ir -p compiler-backend -p compiler-backend-x86 --lib 2>&1 | tee "$RUNNER_TEMP/p5d.log"
          cargo test -p compiler-backend-x86 --test native_typeid_indirect_gp_varargs -- --nocapture 2>&1 | tee "$RUNNER_TEMP/p5d-native.log"
          grep -F 'typeid_indirect_gp_varargs_match_gcc_in_direct_elf_and_assembly ... ok' "$RUNNER_TEMP/p5d-native.log"
          cargo clippy -p compiler-ir -p compiler-backend -p compiler-backend-x86 --lib -- -D warnings
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: p5d-failure
          path: ${{ runner.temp }}/p5d.log
          if-no-files-found: ignore
