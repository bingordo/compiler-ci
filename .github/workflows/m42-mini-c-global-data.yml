name: M4.2 Mini-C global-data bridge
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/m42-mini-c-global-data.yml
permissions:
  contents: read
concurrency:
  group: m42-mini-c-global-data
  cancel-in-progress: true
jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: feature/m4-2-mini-c-globals
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: bingordo/mini-c
          ref: main
          path: mini-c
          fetch-depth: 0
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: bingordo/oberon
          ref: main
          path: oberon
          fetch-depth: 0
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Exact revisions
        run: |
          git -C compiler rev-parse HEAD
          git -C mini-c rev-parse HEAD
          git -C oberon rev-parse HEAD
      - name: Checked Mini-C native globals end-to-end
        shell: bash
        env:
          CARGO_NET_GIT_FETCH_WITH_CLI: "true"
        run: |
          set -euo pipefail
          git config --global url."file://$GITHUB_WORKSPACE/oberon".insteadOf "ssh://git@github.com/bingordo/oberon.git"
          git config --global url."file://$GITHUB_WORKSPACE/mini-c".insteadOf "ssh://git@github.com/bingordo/mini-c.git"
          cargo test --manifest-path compiler/Cargo.toml -p compiler --test m42_mini_c_globals_native
          cargo test --manifest-path compiler/Cargo.toml -p compiler --bin compiler mini_c::
          cargo test --manifest-path compiler/Cargo.toml -p compiler-backend --lib
