name: P0 TypeId shared Mini-C and Oberon rollback PR 814 acceptance
on:
  push:
    branches: [ci/verify-ir-shared-frontends-814-20261110]
    paths: ['.github/workflows/verify-ir-shared-frontends-814.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ir-core:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
      CARGO_INCREMENTAL: '0'
    steps:
      - name: Checkout immutable compiler PR #814 source
        uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: b726a930f9c1e6f2060a96e389ddbe37a3aa7488
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Assert exact source SHA
        run: |
          set -euo pipefail
          test "$(git -C compiler rev-parse HEAD)" = b726a930f9c1e6f2060a96e389ddbe37a3aa7488
          printf 'Compiler PR 814 source SHA: %s\n' "b726a930f9c1e6f2060a96e389ddbe37a3aa7488" >> "$GITHUB_STEP_SUMMARY"
      - name: Isolate dependency-free IR and backend workspace
        run: |
          cat > compiler/Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir", "crates/opt", "crates/backend", "crates/backend-x86"]
          EOF
          rm -f compiler/Cargo.lock
      - name: Install GDB required by existing x86 DWARF runtime integration test
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gdb
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: ir-source-rollback-814-core
      - name: New common TypeId projection, source-opcode callback, invalid TypeId tests
        working-directory: compiler
        run: cargo test -p compiler-ir --test typed_ssa_body -- --nocapture
      - name: Full core IR, optimizer, native backend, x86 regressions
        working-directory: compiler
        run: cargo test -p compiler-ir -p compiler-opt -p compiler-backend -p compiler-backend-x86
      - name: Strict IR and optimizer Clippy
        working-directory: compiler
        run: cargo clippy -p compiler-ir -p compiler-opt -p compiler-backend -p compiler-backend-x86 --all-targets -- -D warnings

  unified-driver:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
      CARGO_INCREMENTAL: '0'
    steps:
      - name: Checkout immutable compiler PR #814 source
        uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: b726a930f9c1e6f2060a96e389ddbe37a3aa7488
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Assert exact source SHA
        run: |
          set -euo pipefail
          test "$(git -C compiler rev-parse HEAD)" = b726a930f9c1e6f2060a96e389ddbe37a3aa7488
          printf 'Compiler PR 814 source SHA: %s\n' "b726a930f9c1e6f2060a96e389ddbe37a3aa7488" >> "$GITHUB_STEP_SUMMARY"
      - name: Use HTTPS for pinned public Oberon and Mini-C dependencies
        run: git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: ir-source-rollback-814-driver
      - name: Unified Oberon and Mini-C builder unit tests
        working-directory: compiler
        run: cargo test -p compiler --bin compiler -- --test-threads=2
      - name: Explicit legacy rollback and native TypeId ELF/GAS source regressions
        working-directory: compiler
        run: cargo test -p compiler --test ir_default_cli --test mini_c_cli --test typeid_elf_linker_matrix --test m42_oberon_arrays_native -- --test-threads=2
      - name: Full driver Clippy including tests
        working-directory: compiler
        run: cargo clippy -p compiler --all-targets -- -D warnings

  standalone-minic:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
      CARGO_INCREMENTAL: '0'
    steps:
      - name: Checkout immutable compiler PR #814 source
        uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: b726a930f9c1e6f2060a96e389ddbe37a3aa7488
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Assert exact source SHA
        run: |
          set -euo pipefail
          test "$(git -C compiler rev-parse HEAD)" = b726a930f9c1e6f2060a96e389ddbe37a3aa7488
          printf 'Compiler PR 814 source SHA: %s\n' "b726a930f9c1e6f2060a96e389ddbe37a3aa7488" >> "$GITHUB_STEP_SUMMARY"
      - name: Use HTTPS for pinned public Mini-C dependencies
        run: git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler/tools/mini-c-driver -> target
          key: ir-source-rollback-814-standalone-minic
      - name: Standalone checked Mini-C frontend/rollback unit and TypeId default tests
        working-directory: compiler
        run: |
          cargo test --manifest-path tools/mini-c-driver/Cargo.toml --lib -- --test-threads=2
          cargo test --manifest-path tools/mini-c-driver/Cargo.toml --test typeid_cli -- --test-threads=2
      - name: Run actual C/GCC generated differential on standalone compiler
        working-directory: compiler
        run: |
          cargo build --manifest-path tools/mini-c-driver/Cargo.toml --bin compiler-mini-c
          python3 tools/mini-c-driver/tests/differential.py \
            --compiler tools/mini-c-driver/target/debug/compiler-mini-c \
            --seed-count 2 --steps 60 --ct04-seed-count 1 --m10-compound-seed-count 1 \
            --artifacts target/ir-rollback-814-c-repro
      - name: Strict standalone Mini-C Clippy including tests
        working-directory: compiler
        run: cargo clippy --manifest-path tools/mini-c-driver/Cargo.toml --all-targets -- -D warnings
      - name: Archive failing GCC differential reproducers
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ir-rollback-814-mini-c-failure
          path: compiler/target/ir-rollback-814-c-repro
          if-no-files-found: ignore
