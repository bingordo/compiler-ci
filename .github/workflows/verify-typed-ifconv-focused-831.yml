name: P0 PR831 focused native plus legacy ifconv acceptance
on:
  push:
    branches: [ci/verify-typed-ifconv-policy-831-20261110]
    paths: ['.github/workflows/verify-typed-ifconv-focused-831.yml']
permissions:
  contents: read
jobs:
  policy-and-both-adapters:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: a6e1e5fb987a3e984be2ca24d5d51790b4ac9e62
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Attest exact source and isolate core optimizer
        run: |
          set -euo pipefail
          test "$(git -C compiler rev-parse HEAD)" = a6e1e5fb987a3e984be2ca24d5d51790b4ac9e62
          cat > compiler/Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir", "crates/opt", "crates/backend", "crates/backend-x86"]
          EOF
          rm -f compiler/Cargo.lock
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: typeid-ifconv-policy-831-focused
      - name: Pure shared policy and old adapter unit tests
        working-directory: compiler
        run: cargo test -p compiler-opt --lib if_conversion -- --test-threads=4
      - name: Native TypeId pure if-conversion execution and legality
        working-directory: compiler
        run: cargo test -p compiler-opt --test typed_if_conversion_pure -- --test-threads=4
      - name: Native TypeId target executable differential
        working-directory: compiler
        run: cargo test -p compiler-opt --test typed_if_conversion_native -- --test-threads=4
      - name: Legacy if-conversion executable differential
        working-directory: compiler
        run: cargo test -p compiler-opt --test if_conversion_native -- --test-threads=4
      - name: Strict full optimizer Clippy default and backend typecheck
        working-directory: compiler
        run: |
          cargo clippy -p compiler-opt --all-targets -- -D warnings
          cargo check -p compiler-backend-x86
