name: Temporary native Mini-C VLA strides 3567
on:
  pull_request:
    paths: ['.github/workflows/temp-mini-c-native-vla-strides-3567.yml']
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 9e36f94b82f0c031a42634dc52c4afea5061cc16
          fetch-depth: 0
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.CI_KEY }}
      - run: git rev-parse HEAD
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            tools/mini-c-driver/target/debug
          key: mini-c-typeid-vla-strides-3567
          restore-keys: |
            mini-c-typeid-static-literals-3524
            mini-c-typeid-static-storage-3522
            mini-c-typeid-
      - run: cargo test --manifest-path tools/mini-c-driver/Cargo.toml --lib global_data
      - run: cargo test --manifest-path tools/mini-c-driver/Cargo.toml --test c99_saved_vla_strides
      - run: cargo build --manifest-path tools/mini-c-driver/Cargo.toml
      - name: GCC differential runtime for ELF and GAS
        shell: bash
        run: |
          set -euo pipefail
          src=tools/mini-c-driver/tests/fixtures/c99_saved_vla_strides.c
          driver=tools/mini-c-driver/target/debug/compiler-mini-c
          gcc -std=c99 -pedantic-errors "$src" -o "$RUNNER_TEMP/oracle"
          "$RUNNER_TEMP/oracle"
          "$driver" "$src" -o "$RUNNER_TEMP/native.o"
          gcc "$RUNNER_TEMP/native.o" -o "$RUNNER_TEMP/native"
          "$RUNNER_TEMP/native"
          "$driver" "$src" --emit asm -o "$RUNNER_TEMP/native.s"
          gcc "$RUNNER_TEMP/native.s" -o "$RUNNER_TEMP/native-gas"
          "$RUNNER_TEMP/native-gas"
          readelf -r "$RUNNER_TEMP/native.o"
