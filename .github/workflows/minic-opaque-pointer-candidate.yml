name: Mini-C opaque pointer candidate
on:
  pull_request:
    paths:
      - '.github/workflows/minic-opaque-pointer-candidate.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 31c78fafb7c565a00927b743e5da0f4ceb2aa245
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Record exact source and retain frontend pin
        run: |
          set -euo pipefail
          git -C compiler rev-parse HEAD | tee -a "$GITHUB_STEP_SUMMARY"
          grep 'rev =' compiler/tools/mini-c-driver/Cargo.toml | tee -a "$GITHUB_STEP_SUMMARY"
          python3 - <<'PY'
          from pathlib import Path
          p=Path("compiler/tools/mini-c-driver/Cargo.toml")
          s=p.read_text()
          assert s.count("ssh://git@github.com/bingordo/mini-c.git")==2
          p.write_text(s.replace("ssh://git@github.com/bingordo/mini-c.git","https://github.com/bingordo/mini-c.git"))
          PY
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler/tools/mini-c-driver -> target
          key: minic-opaque-pointer-candidate
      - name: Focused GCC cross-object and negative tests
        run: cargo test --manifest-path compiler/tools/mini-c-driver/Cargo.toml --test opaque_object_pointer_transport -- --nocapture
      - name: Existing Mini-C adapter tests
        run: cargo test --manifest-path compiler/tools/mini-c-driver/Cargo.toml --lib
