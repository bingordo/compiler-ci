name: Compiler docs PR 1524 validation
on:
  push:
    branches: [main]
    paths: ['.github/workflows/docs-pr1524-validation.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  docs:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 8248837c9e38e69b89333a8e958829c38b731db2
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Confirm exact revision
        run: test "$(git -C compiler rev-parse HEAD)" = "8248837c9e38e69b89333a8e958829c38b731db2"
      - name: Validate documentation links
        working-directory: compiler
        run: python3 tools/check_doc_links.py
      - name: Test documentation checker
        working-directory: compiler
        run: python3 -m unittest discover -s tools -p 'test_check_doc_links.py' -v
