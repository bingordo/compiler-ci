name: TypeId post-opt real x86 inline trial size oracle
on:
  push:
    branches: [main]
    paths: [.github/workflows/verify-typeid-inline-postopt-native-20261110.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  real-native:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 23866bc6a3d2f5710764e7f9f0a534e2227b979f
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Verify exact source pin
        run: |
          test "$(git -C compiler rev-parse HEAD)" = "23866bc6a3d2f5710764e7f9f0a534e2227b979f"
      - name: Isolate public TypeId optimizer and native target backend
        run: |
          cat > compiler/Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir", "crates/opt", "crates/backend", "crates/backend-x86"]
          EOF
          rm -f compiler/Cargo.lock
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: typeid-postopt-inline-oracle-20261110
      - name: Run real native object byte scoring, GCC runtime oracle, and rollback checks
        working-directory: compiler
        run: |
          set -euo pipefail
          cargo test -p compiler-opt --test typed_inline_postopt_native_trial -- --nocapture
          cargo test -p compiler-opt --test typed_inline_cfg_native -- --nocapture
          cargo test -p compiler-opt --test typed_core_inline_integration -- --nocapture
          cargo clippy -p compiler-opt --all-targets -- -D warnings
