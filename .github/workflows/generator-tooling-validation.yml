# General-purpose source-pinned Python/Rust generator smoke gate. Runs only in compiler-ci.
name: Generator tooling validation
on:
  pull_request:
    paths:
      - '.github/workflows/generator-tooling-validation.yml'
  workflow_dispatch:
    inputs:
      typeid_sha:
        description: 'Exact 40-character compiler commit SHA for TypeId generator suite'
        type: string
        required: true
        default: '70d97ba111ef2a227669577847f0c4aa3406687e'
      sse_sha:
        description: 'Exact 40-character compiler commit SHA for x86 SSE generator suite'
        type: string
        required: true
        default: 'c302600e7140fe8f9f364bae2b2263cc027ba20f'
      scalar_sha:
        description: 'Exact 40-character compiler commit SHA for scalar GP form validators'
        type: string
        required: true
        default: '6cb835feee25a42ebe38a6e2af76d7b236b20263'
      encoding_sha:
        description: 'Exact 40-character compiler commit SHA for core x86 opcode catalog'
        type: string
        required: true
        default: '6cebfc7734d0fa51f83ed04fba567dbf776f3106'
      aarch64_sha:
        description: 'Exact 40-character compiler SHA for reviewed AArch64 scalar GP forms'
        type: string
        required: true
        default: '6d7048b3fbee55d004a139c7329e2c5220ae9785'
      riscv_sha:
        description: 'Exact 40-character compiler SHA for RV64 selector fingerprint validation'
        type: string
        required: true
        default: 'db8254c08f6b4c2a8aa80ac7a5248ed2e2461f99'
permissions:
  contents: read
jobs:
  typeid-generator:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout pinned private compiler source
        uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: ${{ inputs.typeid_sha || '70d97ba111ef2a227669577847f0c4aa3406687e' }}
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Verify exact SHA and run Python and generated Rust tests
        shell: bash
        working-directory: compiler
        run: |
          set -euo pipefail
          expected="${{ inputs.typeid_sha || '70d97ba111ef2a227669577847f0c4aa3406687e' }}"
          [[ "$expected" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$expected"
          python3 -m compileall -q tools/typeid-rule-gen
          python3 -m unittest discover -s tools/typeid-rule-gen -p 'test_*.py' -v
          python3 tools/typeid-rule-gen/rules.py tools/typeid-rule-gen/examples.rules --emit-rust > "$RUNNER_TEMP/typeid-tree.rs"
          rustc --edition=2021 -D warnings --crate-type=lib "$RUNNER_TEMP/typeid-tree.rs" -o "$RUNNER_TEMP/libtypeid-tree.rlib"
          python3 tools/typeid-rule-gen/rules.py tools/typeid-rule-gen/examples.rules --emit-ssa-rust > "$RUNNER_TEMP/typeid-ssa.rs"
          rustc --edition=2021 -D warnings --crate-type=lib "$RUNNER_TEMP/typeid-ssa.rs" -o "$RUNNER_TEMP/libtypeid-ssa.rlib"
  x86-isa-generators:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout pinned private compiler source
        uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: ${{ inputs.sse_sha || 'c302600e7140fe8f9f364bae2b2263cc027ba20f' }}
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Validate pinned catalog mutations and generated artifacts
        shell: bash
        working-directory: compiler
        run: |
          set -euo pipefail
          expected="${{ inputs.sse_sha || 'c302600e7140fe8f9f364bae2b2263cc027ba20f' }}"
          [[ "$expected" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$expected"
          export PYTHONPATH="$PWD/tools"
          python3 -m unittest tools/test_regen_x86_sse_packed_forms.py tools/test_regen_x86_sse_vex_forms.py -v
          python3 tools/regen_x86_sse_packed_forms.py --check
          python3 tools/regen_x86_sse_vex_forms.py --check
  x86-scalar-validators:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact compiler scalar-validator candidate
        uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: ${{ inputs.scalar_sha || '6cb835feee25a42ebe38a6e2af76d7b236b20263' }}
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Run scalar form CLI regressions and single GP recipe output check
        shell: bash
        working-directory: compiler
        run: |
          set -euo pipefail
          expected="${{ inputs.scalar_sha || '6cb835feee25a42ebe38a6e2af76d7b236b20263' }}"
          [[ "$expected" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$expected"
          export PYTHONPATH="$PWD/tools"
          python3 -m py_compile tools/regen_x86_scalar_bin_forms.py tools/regen_x86_scalar_misc_forms.py
          python3 -m unittest tools/test_x86_scalar_bin_forms.py tools/test_x86_scalar_misc_forms.py tools/test_x86_gp_recipes.py -v
          python3 tools/regen_x86_scalar_bin_forms.py --check
          python3 tools/regen_x86_scalar_misc_forms.py --check
          python3 tools/regen_x86_gp_recipes.py --check
  x86-core-encoding-forms:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact compiler core forms generator candidate
        uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: ${{ inputs.encoding_sha || '6cebfc7734d0fa51f83ed04fba567dbf776f3106' }}
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Verify form input safety, including python -O, and byte-identical Rust
        shell: bash
        working-directory: compiler
        run: |
          set -euo pipefail
          expected="${{ inputs.encoding_sha || '6cebfc7734d0fa51f83ed04fba567dbf776f3106' }}"
          [[ "$expected" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$expected"
          export PYTHONPATH="$PWD/tools"
          rustfmt --version
          python3 -m py_compile tools/regen_x86_forms.py tools/test_regen_x86_forms.py
          python3 -m unittest tools/test_regen_x86_forms.py -v
          python3 -O tools/regen_x86_forms.py --check
          python3 tools/regen_x86_forms.py --check
  aarch64-scalar-gp-forms:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout pinned private AArch64 scalar GP generator candidate
        uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: ${{ inputs.aarch64_sha || '6d7048b3fbee55d004a139c7329e2c5220ae9785' }}
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Check exact source, independently pinned opcode identities and Rust parity
        shell: bash
        working-directory: compiler
        run: |
          set -euo pipefail
          expected="${{ inputs.aarch64_sha || '6d7048b3fbee55d004a139c7329e2c5220ae9785' }}"
          [[ "$expected" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$expected"
          python3 -m py_compile tools/regen_aarch64_scalar_gp_forms.py tools/test_regen_aarch64_scalar_gp_forms.py
          python3 -m unittest discover -s tools -p 'test_regen_aarch64_scalar_gp_forms.py' -v
          python3 tools/regen_aarch64_scalar_gp_forms.py --check
  riscv-native-selector:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact compiler RV64 UDB validation candidate
        uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: ${{ inputs.riscv_sha || 'db8254c08f6b4c2a8aa80ac7a5248ed2e2461f99' }}
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Validate independent reviewed UDB hashes and selector output parity
        shell: bash
        working-directory: compiler
        run: |
          set -euo pipefail
          expected="${{ inputs.riscv_sha || 'db8254c08f6b4c2a8aa80ac7a5248ed2e2461f99' }}"
          [[ "$expected" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$expected"
          python3 -m py_compile tools/regen_riscv_native_selector_rules.py tools/test_riscv_native_selector_rules.py
          python3 -m unittest discover -s tools -p 'test_riscv_native_selector_rules.py' -v
          python3 tools/regen_riscv_native_selector_rules.py --check
