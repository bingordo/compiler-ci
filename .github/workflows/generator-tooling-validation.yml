# General-purpose source-pinned Python/Rust generator smoke gate. Runs only in compiler-ci.
name: Generator tooling validation
on:
  pull_request:
    paths:
      - '.github/workflows/generator-tooling-validation.yml'
  workflow_dispatch:
    inputs:
      typeid_sha:
        description: 'Exact 40-character compiler commit SHA for TypeId generator suite'
        type: string
        required: true
        default: '70d97ba111ef2a227669577847f0c4aa3406687e'
      sse_sha:
        description: 'Exact 40-character compiler commit SHA for x86 SSE generator suite'
        type: string
        required: true
        default: 'c302600e7140fe8f9f364bae2b2263cc027ba20f'
      scalar_sha:
        description: 'Exact 40-character compiler commit SHA for scalar GP form validators'
        type: string
        required: true
        default: '6cb835feee25a42ebe38a6e2af76d7b236b20263'
      encoding_sha:
        description: 'Exact 40-character compiler commit SHA for core x86 opcode catalog'
        type: string
        required: true
        default: '1ec594451aa919fed19fd1dc753bf8ab62520cdb'
      aarch64_sha:
        description: 'Exact 40-character compiler SHA for reviewed AArch64 scalar GP forms'
        type: string
        required: true
        default: '6d7048b3fbee55d004a139c7329e2c5220ae9785'
      riscv_sha:
        description: 'Exact 40-character compiler SHA for RV64 selector fingerprint validation'
        type: string
        required: true
        default: '4407f665fa27e3f72822e5fbc2f5d157eef3d4f8'
      vpcmp_sha:
        description: 'Exact compiler commit SHA for independent x86 VPCMP GNU-as oracle'
        type: string
        required: true
        default: 'aaa223082965818a0287fcce930a573bed137edc'
      evex_shift_tern_sha:
        description: 'Exact compiler SHA for ternlog and EVEX immediate-shift GNU-as oracle'
        type: string
        required: true
        default: 'af6a33d847f49f46c03f37f7479f0c20a873f38e'
      evex_production_sha:
        description: 'Exact compiler SHA for 249-case production x86 EVEX vs GNU-as oracle'
        type: string
        required: true
        default: '5d8237b1ae296408e02fd75bc68a7b5948c5a716'
      vex_production_sha:
        description: 'Exact compiler SHA for independent 48-form x86 VEX production/GNU-as oracle'
        type: string
        required: true
        default: '5fe33a47afb10984932836dbc1ed2ef7a439eeef'
      simd_production_sha:
        description: 'Exact compiler SHA for legacy SSE/VEX move/shift/packed GNU differential'
        type: string
        required: true
        default: '14599dd67bb763aa3c7d13371a713a0f4f96297a'
      x86_cost_source_sha:
        description: 'Exact compiler SHA for cross-tool uops.info XML provenance validation'
        type: string
        required: true
        default: '1ec594451aa919fed19fd1dc753bf8ab62520cdb'
permissions:
  contents: read
jobs:
  typeid-generator:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout pinned private compiler source
        uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: ${{ inputs.typeid_sha || '70d97ba111ef2a227669577847f0c4aa3406687e' }}
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Verify exact SHA and run Python and generated Rust tests
        shell: bash
        working-directory: compiler
        run: |
          set -euo pipefail
          expected="${{ inputs.typeid_sha || '70d97ba111ef2a227669577847f0c4aa3406687e' }}"
          [[ "$expected" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$expected"
          python3 -m compileall -q tools/typeid-rule-gen
          python3 -m unittest discover -s tools/typeid-rule-gen -p 'test_*.py' -v
          python3 tools/typeid-rule-gen/rules.py tools/typeid-rule-gen/examples.rules --emit-rust > "$RUNNER_TEMP/typeid-tree.rs"
          rustc --edition=2021 -D warnings --crate-type=lib "$RUNNER_TEMP/typeid-tree.rs" -o "$RUNNER_TEMP/libtypeid-tree.rlib"
          python3 tools/typeid-rule-gen/rules.py tools/typeid-rule-gen/examples.rules --emit-ssa-rust > "$RUNNER_TEMP/typeid-ssa.rs"
          rustc --edition=2021 -D warnings --crate-type=lib "$RUNNER_TEMP/typeid-ssa.rs" -o "$RUNNER_TEMP/libtypeid-ssa.rlib"
  x86-isa-generators:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout pinned private compiler source
        uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: ${{ inputs.sse_sha || 'c302600e7140fe8f9f364bae2b2263cc027ba20f' }}
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Validate pinned catalog mutations and generated artifacts
        shell: bash
        working-directory: compiler
        run: |
          set -euo pipefail
          expected="${{ inputs.sse_sha || 'c302600e7140fe8f9f364bae2b2263cc027ba20f' }}"
          [[ "$expected" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$expected"
          export PYTHONPATH="$PWD/tools"
          python3 -m unittest tools/test_regen_x86_sse_packed_forms.py tools/test_regen_x86_sse_vex_forms.py -v
          python3 tools/regen_x86_sse_packed_forms.py --check
          python3 tools/regen_x86_sse_vex_forms.py --check
  x86-scalar-validators:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact compiler scalar-validator candidate
        uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: ${{ inputs.scalar_sha || '6cb835feee25a42ebe38a6e2af76d7b236b20263' }}
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Run scalar form CLI regressions and single GP recipe output check
        shell: bash
        working-directory: compiler
        run: |
          set -euo pipefail
          expected="${{ inputs.scalar_sha || '6cb835feee25a42ebe38a6e2af76d7b236b20263' }}"
          [[ "$expected" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$expected"
          export PYTHONPATH="$PWD/tools"
          python3 -m py_compile tools/regen_x86_scalar_bin_forms.py tools/regen_x86_scalar_misc_forms.py
          python3 -m unittest tools/test_x86_scalar_bin_forms.py tools/test_x86_scalar_misc_forms.py tools/test_x86_gp_recipes.py -v
          python3 tools/regen_x86_scalar_bin_forms.py --check
          python3 tools/regen_x86_scalar_misc_forms.py --check
          python3 tools/regen_x86_gp_recipes.py --check
  x86-core-encoding-forms:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact compiler core forms generator candidate
        uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: ${{ inputs.encoding_sha || '1ec594451aa919fed19fd1dc753bf8ab62520cdb' }}
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Verify form input safety, including python -O, and byte-identical Rust
        shell: bash
        working-directory: compiler
        run: |
          set -euo pipefail
          expected="${{ inputs.encoding_sha || '1ec594451aa919fed19fd1dc753bf8ab62520cdb' }}"
          [[ "$expected" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$expected"
          export PYTHONPATH="$PWD/tools"
          rustfmt --version
          python3 -m py_compile tools/regen_x86_forms.py tools/test_regen_x86_forms.py tools/regen_x86_att_forms.py tools/test_regen_x86_att_forms.py
          python3 -m unittest tools/test_regen_x86_forms.py tools/test_regen_x86_att_forms.py -v
          python3 -O tools/regen_x86_forms.py --check
          python3 tools/regen_x86_forms.py --check
          python3 tools/regen_x86_att_forms.py --check
  aarch64-scalar-gp-forms:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout pinned private AArch64 scalar GP generator candidate
        uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: ${{ inputs.aarch64_sha || '6d7048b3fbee55d004a139c7329e2c5220ae9785' }}
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Check exact source, independently pinned opcode identities and Rust parity
        shell: bash
        working-directory: compiler
        run: |
          set -euo pipefail
          expected="${{ inputs.aarch64_sha || '6d7048b3fbee55d004a139c7329e2c5220ae9785' }}"
          [[ "$expected" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$expected"
          python3 -m py_compile tools/regen_aarch64_scalar_gp_forms.py tools/test_regen_aarch64_scalar_gp_forms.py
          python3 -m unittest discover -s tools -p 'test_regen_aarch64_scalar_gp_forms.py' -v
          python3 tools/regen_aarch64_scalar_gp_forms.py --check
  riscv-native-selector:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact compiler RV64 UDB validation candidate
        uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: ${{ inputs.riscv_sha || '4407f665fa27e3f72822e5fbc2f5d157eef3d4f8' }}
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Validate independent reviewed UDB hashes and selector output parity
        shell: bash
        working-directory: compiler
        run: |
          set -euo pipefail
          expected="${{ inputs.riscv_sha || '4407f665fa27e3f72822e5fbc2f5d157eef3d4f8' }}"
          [[ "$expected" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$expected"
          python3 -m py_compile tools/regen_riscv_native_selector_rules.py tools/test_riscv_native_selector_rules.py
          python3 -m unittest discover -s tools -p 'test_riscv_native_selector_rules.py' -v
          python3 -m unittest discover -s tools -p 'test_riscv_udb_rust_leaf_forms.py' -v
          python3 tools/regen_riscv_native_selector_rules.py --check
          python3 tools/riscv_udb_rust_leaf_forms.py --catalog data/riscv_udb_r0_catalog.json --output crates/backend-riscv64/src/generated_encoding.rs --check
          python3 -m unittest discover -s tools -p 'test_riscv_udb_gas_oracle.py' -v

  riscv-gas-independent-oracle:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact compiler source for RV64 independent GNU-as comparison
        uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: ${{ inputs.riscv_sha || '4407f665fa27e3f72822e5fbc2f5d157eef3d4f8' }}
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Install independent GNU RISC-V assembler and source parser
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y binutils-riscv64-linux-gnu python3-yaml
      - name: Compare all 36 reviewed RV64 leaf encodings against GNU as
        shell: bash
        working-directory: compiler
        run: |
          set -euo pipefail
          expected="${{ inputs.riscv_sha || '4407f665fa27e3f72822e5fbc2f5d157eef3d4f8' }}"
          [[ "$expected" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$expected"
          python3 tools/riscv_udb_gas_oracle.py data/riscv_udb_r0_catalog.json

  x86-vpcmp-independent-gas-oracle:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout source-pinned x86 EVEX VPCMP oracle candidate
        uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: ${{ inputs.vpcmp_sha || 'aaa223082965818a0287fcce930a573bed137edc' }}
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Validate 84-case matrix and independent GNU as/objdump encoding parity
        shell: bash
        working-directory: compiler
        run: |
          set -euo pipefail
          expected="${{ inputs.vpcmp_sha || 'aaa223082965818a0287fcce930a573bed137edc' }}"
          [[ "$expected" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$expected"
          command -v as
          command -v objcopy
          command -v objdump
          export PYTHONPATH="$PWD/tools"
          python3 -m py_compile tools/x86_evex_mask_compare_gas_oracle.py tools/test_x86_evex_mask_compare_gas_oracle.py
          python3 -m unittest discover -s tools -p 'test_x86_evex_mask_compare_gas_oracle.py' -v
          python3 tools/regen_x86_sse_evex_mask_compare_forms.py --check
          python3 tools/x86_evex_mask_compare_gas_oracle.py

  x86-evex-ternlog-shift-independent-gas:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact EVEX ternlog and shift oracle candidate
        uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: ${{ inputs.evex_shift_tern_sha || 'af6a33d847f49f46c03f37f7479f0c20a873f38e' }}
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Validate all 165 EVEX GNU-as encodings, reviewed catalogs and byte mutations
        shell: bash
        working-directory: compiler
        run: |
          set -euo pipefail
          expected="${{ inputs.evex_shift_tern_sha || 'af6a33d847f49f46c03f37f7479f0c20a873f38e' }}"
          [[ "$expected" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$expected"
          command -v as
          command -v objcopy
          command -v objdump
          export PYTHONPATH="$PWD/tools"
          python3 -m py_compile tools/x86_evex_ternlog_shift_gas_oracle.py tools/test_x86_evex_ternlog_shift_gas_oracle.py
          python3 -m unittest discover -s tools -p 'test_x86_evex_ternlog_shift_gas_oracle.py' -v
          python3 -m unittest discover -s tools -p 'test_x86_evex_ternlog_gas_reference.py' -v
          python3 tools/regen_x86_sse_evex_ternlog_forms.py --check
          python3 tools/regen_x86_sse_evex_shift_imm_forms.py --check
          python3 tools/x86_evex_ternlog_shift_gas_oracle.py

  x86-evex-production-vs-gas:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - name: Checkout candidate with actual production x86 EVEX encoder
        uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: ${{ inputs.evex_production_sha || '5d8237b1ae296408e02fd75bc68a7b5948c5a716' }}
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Check source SHA and independently generated physical cases
        shell: bash
        working-directory: compiler
        run: |
          set -euo pipefail
          expected="${{ inputs.evex_production_sha || '5d8237b1ae296408e02fd75bc68a7b5948c5a716' }}"
          [[ "$expected" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$expected"
          export PYTHONPATH="$PWD/tools"
          python3 -m py_compile tools/x86_evex_production_gas_parity.py tools/x86_evex_extended_parity.py tools/test_x86_evex_production_gas_parity.py
          python3 -m unittest discover -s tools -p 'test_x86_evex_production_gas_parity.py' -v
          python3 tools/x86_evex_mask_compare_gas_oracle.py
          python3 tools/x86_evex_ternlog_shift_gas_oracle.py
      - name: Restrict compiler Rust workspace to physical x86 backend
        shell: bash
        working-directory: compiler
        run: |
          cat > Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir", "crates/opt", "crates/backend", "crates/backend-x86"]
          EOF
          rm -f Cargo.lock
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler
          key: generator-evex-prod-gas
      - name: Reject invalid physical operands; compare 1293 production encodings to GNU as
        shell: bash
        working-directory: compiler
        timeout-minutes: 15
        run: |
          set -euo pipefail
          cargo test -p compiler-backend-x86 --example x86_evex_production_oracle -- --nocapture
          export PYTHONPATH="$PWD/tools"
          python3 tools/x86_evex_production_gas_parity.py

  x86-vex-production-vs-gas:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - name: Checkout exact VEX production encoder candidate
        uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: ${{ inputs.vex_production_sha || '5fe33a47afb10984932836dbc1ed2ef7a439eeef' }}
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Verify VEX source pin, generated forms and independent negative tests
        shell: bash
        working-directory: compiler
        run: |
          set -euo pipefail
          expected="${{ inputs.vex_production_sha || '5fe33a47afb10984932836dbc1ed2ef7a439eeef' }}"
          [[ "$expected" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$expected"
          export PYTHONPATH="$PWD/tools"
          python3 -m py_compile tools/x86_vex_production_gas_oracle.py tools/test_x86_vex_production_gas_oracle.py
          python3 -m unittest discover -s tools -p 'test_x86_vex_production_gas_oracle.py' -v
          python3 tools/regen_x86_sse_vex_forms.py --check
      - name: Restrict Rust workspace to production x86 physical encoder
        shell: bash
        working-directory: compiler
        run: |
          cat > Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir", "crates/opt", "crates/backend", "crates/backend-x86"]
          EOF
          rm -f Cargo.lock
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler
          key: generator-vex-prod-gas
      - name: Run production VEX negative tests and compare 384 encodings to GNU as
        shell: bash
        working-directory: compiler
        timeout-minutes: 15
        run: |
          set -euo pipefail
          cargo test -p compiler-backend-x86 --example x86_vex_production_gas_oracle -- --nocapture
          export PYTHONPATH="$PWD/tools"
          python3 tools/x86_vex_production_gas_oracle.py

  x86-simd-production-vs-gas:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - name: Checkout exact compiler physical SSE/VEX batch candidate
        uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: ${{ inputs.simd_production_sha || '14599dd67bb763aa3c7d13371a713a0f4f96297a' }}
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Check exact source SHA, reviewed manifests and generated negative tests
        shell: bash
        working-directory: compiler
        run: |
          set -euo pipefail
          expected="${{ inputs.simd_production_sha || '14599dd67bb763aa3c7d13371a713a0f4f96297a' }}"
          [[ "$expected" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$expected"
          export PYTHONPATH="$PWD/tools"
          python3 -m py_compile tools/x86_simd_production_gas_oracle.py tools/test_x86_simd_production_gas_oracle.py
          python3 -m unittest discover -s tools -p 'test_x86_simd_production_gas_oracle.py' -v
          python3 tools/regen_x86_sse_packed_forms.py --check
          python3 tools/regen_x86_sse_move_forms.py --check
          python3 tools/regen_x86_sse_shift_imm_forms.py --check
      - name: Restrict Rust workspace to physical x86 backend
        shell: bash
        working-directory: compiler
        run: |
          cat > Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir", "crates/opt", "crates/backend", "crates/backend-x86"]
          EOF
          rm -f Cargo.lock
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler
          key: generator-simd-prod-gas
      - name: Check three real production encoders against 348 independent GNU instructions
        shell: bash
        working-directory: compiler
        timeout-minutes: 15
        run: |
          set -euo pipefail
          command -v as
          command -v objcopy
          command -v objdump
          cargo test -p compiler-backend-x86 --example x86_simd_production_gas_oracle -- --nocapture
          export PYTHONPATH="$PWD/tools"
          python3 tools/x86_simd_production_gas_oracle.py

  x86-cost-source-consistency:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout exact reviewed x86 cost-provenance candidate
        uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: ${{ inputs.x86_cost_source_sha || '1ec594451aa919fed19fd1dc753bf8ab62520cdb' }}
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Validate shared XML allowlist and all cost and latency consumers
        shell: bash
        working-directory: compiler
        run: |
          set -euo pipefail
          expected="${{ inputs.x86_cost_source_sha || '1ec594451aa919fed19fd1dc753bf8ab62520cdb' }}"
          [[ "$expected" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$expected"
          export PYTHONPATH="$PWD/tools"
          python3 -m py_compile tools/validate_x86_costs.py tools/regen_x86_physical_costs.py tools/regen_x86_operand_latencies.py tools/regen_x86_memory_operand_latencies.py tools/regen_x86_match_costs.py tools/test_x86_cost_source_gate.py
          python3 -m unittest discover -s tools -p 'test_x86_cost_source_gate.py' -v
          python3 -m unittest discover -s tools -p 'test_x86_match_costs.py' -v
          python3 -m unittest discover -s tools -p 'test_x86_operand_latencies.py' -v
          python3 -m unittest discover -s tools -p 'test_x86_memory_operand_latencies.py' -v
          python3 -m unittest discover -s tools -p 'test_import_uops_info.py' -v
          python3 tools/regen_x86_match_costs.py --check
          python3 tools/regen_x86_physical_costs.py --check
          python3 tools/validate_x86_costs.py data/x86_costs_skl.json data/x86_costs_zen4.json
