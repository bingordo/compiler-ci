# Disposable source-pinned AL04 observed-call verification.
name: IR PR3446 TypeId observed memory effects
on:
  push:
    branches: [verify-ir-observed-3446-20261126]
    paths: ['.github/workflows/ir-pr3446-observed.yml']
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      SOURCE_SHA: be56c380198f4621840677a45539f5c6bd15fa16
      CARGO_INCREMENTAL: '0'
      CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: ${{ env.SOURCE_SHA }}
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Pin source and isolate supported optimizer
        run: |
          set -euo pipefail
          test "$(git -C compiler rev-parse HEAD)" = "$SOURCE_SHA"
          cat > compiler/Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir", "crates/opt", "crates/backend", "crates/backend-x86", "crates/backend-aarch64"]
          EOF
          rm -f compiler/Cargo.lock
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: ir-pr3446-observed
      - name: All-target compile and observed-call regression fixtures
        working-directory: compiler
        run: |
          set -euo pipefail
          cargo check -p compiler-opt --all-targets
          cargo test -p compiler-opt --test alive_lite al04_p4a_
          cargo test -p compiler-opt --test alive_lite al04_p4b1_
          cargo test -p compiler-opt --test memory_execution_oracle
      - name: Prove observed-call trace invariance using independent Z3
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq z3
          cd compiler
          cargo test -p compiler-opt --test alive_lite al04_p4a_ordered_call_trace_actual_pass_proofs_and_negative_controls -- --ignored --nocapture
      - name: Scoped strict lint
        working-directory: compiler
        run: |
          set -euo pipefail
          cargo clippy --no-deps -p compiler-opt --test alive_lite -- -D warnings -A dead_code -A unused_imports -A unused_variables -A clippy::too_many_arguments
