name: BT4 AArch64 I64 ABI and branch C11 TypeId parity - exact source pin
on:
  pull_request:
    paths:
      - '.github/workflows/verify-bt4-i64-scalar-branch-typeid-20261114.yml'
permissions:
  contents: read
jobs:
  native-arm:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.CI_KEY }}
      - run: ssh-keyscan github.com >> ~/.ssh/known_hosts
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: a7a27d4ecb1ed66893f4b858da15aa4ea32e2767
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - run: |
          test "$(git -C compiler rev-parse HEAD)" = a7a27d4ecb1ed66893f4b858da15aa4ea32e2767
          test "$(uname -m)" = aarch64
          command -v cc
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler
          key: bt4-i64-scalar-branch-typeid-arm
      - name: Whole-workspace all-target typecheck (existing unrelated lint warnings permitted)
        working-directory: compiler
        run: cargo check --workspace --all-targets
      - name: Warnings-denied IR/shared-backend/AArch64 all-target typecheck
        working-directory: compiler
        run: RUSTFLAGS="-D warnings" cargo check -p compiler-ir -p compiler-backend -p compiler-backend-aarch64 --all-targets
      - name: Four native TypeId I64 and branch C11 ABI oracles on ARM
        working-directory: compiler
        run: |
          cargo test -p compiler-backend-aarch64 --test i64_scalar_complete -- --nocapture
          cargo test -p compiler-backend-aarch64 --test bit_branch_native -- --nocapture
          cargo test -p compiler-backend-aarch64 --test zero_branch_native -- --nocapture
          cargo test -p compiler-backend-aarch64 --test compare_branch_native -- --nocapture
      - name: Full backend all-target suite
        working-directory: compiler
        run: cargo test -p compiler-backend-aarch64 --all-targets -- --test-threads=2
      - name: Strict all-target Clippy
        working-directory: compiler
        run: cargo clippy -p compiler-backend-aarch64 --all-targets -- -D warnings
  qemu:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc-aarch64-linux-gnu libc6-dev-arm64-cross linux-libc-dev-arm64-cross binutils-aarch64-linux-gnu qemu-user
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.CI_KEY }}
      - run: ssh-keyscan github.com >> ~/.ssh/known_hosts
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: a7a27d4ecb1ed66893f4b858da15aa4ea32e2767
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - run: test "$(git -C compiler rev-parse HEAD)" = a7a27d4ecb1ed66893f4b858da15aa4ea32e2767
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler
          key: bt4-i64-scalar-branch-typeid-qemu
      - name: Four original I64 ABI and branch C11 oracles in QEMU
        working-directory: compiler
        env:
          COMPILER_REQUIRE_AARCH64_QEMU: "1"
        run: |
          cargo test -p compiler-backend-aarch64 --test i64_scalar_complete -- --nocapture
          cargo test -p compiler-backend-aarch64 --test bit_branch_native -- --nocapture
          cargo test -p compiler-backend-aarch64 --test zero_branch_native -- --nocapture
          cargo test -p compiler-backend-aarch64 --test compare_branch_native -- --nocapture
