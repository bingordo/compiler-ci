name: IR F41 direct-TypeId Alive memory proofs
on:
  push:
    branches:
      - ci/ir-f41-alive-memory-typeid-20261113
  pull_request:
    paths:
      - '.github/workflows/ir-f41-alive-memory-typeid-20261113.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  alive-memory:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CARGO_INCREMENTAL: '0'
    steps:
      - name: Checkout exact compiler F41 source
        uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 5abdd28b0366055846d1fb8df4a83974e2125601
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Pin source and restrict core workspace
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C compiler rev-parse HEAD)" = "5abdd28b0366055846d1fb8df4a83974e2125601"
          cat > compiler/Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir", "crates/opt", "crates/backend", "crates/backend-x86"]
          EOF
          rm -f compiler/Cargo.lock
          echo "Exact compiler SHA: 5abdd28b0366055846d1fb8df4a83974e2125601" >> "$GITHUB_STEP_SUMMARY"
      - name: Install external Z3 solver
        run: sudo apt-get update && sudo apt-get install -y z3
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: ir-f41-alive-memory-typeid-v1
      - name: Run all Alive-lite memory Z3 proofs and negative controls
        working-directory: compiler
        run: |
          cargo test -p compiler-opt --test alive_lite alive_lite_memory:: -- --ignored --nocapture
      - name: Non-ignored Alive-lite correctness and fail-closed suite
        working-directory: compiler
        run: cargo test -p compiler-opt --test alive_lite -- --nocapture
      - name: TypeId memory runtime and scalar generated differential suites
        working-directory: compiler
        run: |
          set -euo pipefail
          cargo test -p compiler-opt --test memory_execution_oracle
          cargo test -p compiler-opt --test generated_native_oracle
          cargo test -p compiler-opt --test typed_native_parity
      - name: IR and x86 backend unit suites
        working-directory: compiler
        run: |
          cargo test -p compiler-ir --lib
          cargo test -p compiler-backend-x86 --lib
      - name: Strict all-target Clippy
        working-directory: compiler
        run: cargo clippy -p compiler-ir -p compiler-opt -p compiler-backend -p compiler-backend-x86 --all-targets -- -D warnings
