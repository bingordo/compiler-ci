name: Temporary guarded affine regression PR3844
on:
  push:
    branches: [ci/temp-affine-3844]
permissions:
  contents: read
  statuses: write
jobs:
  differential:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      SOURCE_SHA: e74bc36a86ef8dfa2a8addf4464e64d2bb7b2e5d
      CARGO_TARGET_DIR: ${{ github.workspace }}/compiler/target
      CARGO_INCREMENTAL: 0
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: ${{ env.SOURCE_SHA }}
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Verify revision and use public frontend URLs
        run: |
          set -euo pipefail
          test "$(git -C compiler rev-parse HEAD)" = "$SOURCE_SHA"
          sed -i 's|ssh://git@github.com/bingordo/|https://github.com/bingordo/|g' compiler/tools/mini-c-driver/Cargo.toml compiler/crates/driver/Cargo.toml
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: affine-guarded-regression
      - name: Guarded admission unit tests
        working-directory: compiler
        run: cargo test -p compiler-opt --lib generated_guarded_admission::tests -- --nocapture
      - name: Reproduce six Mini-C seeds against GCC
        if: success() || failure()
        run: |
          set -euo pipefail
          cargo build --manifest-path compiler/tools/mini-c-driver/Cargo.toml -p compiler-mini-c --bin compiler-mini-c
          python3 compiler/tools/mini-c-driver/tests/differential.py --compiler "$CARGO_TARGET_DIR/debug/compiler-mini-c" --seed-count 6 --steps 120 --timeout 15 --artifacts "$RUNNER_TEMP/mini-c-failures" 2>&1 | tee "$RUNNER_TEMP/mini-c-differential.log"
          grep -Eq '^PASS: [1-9][0-9]* fixtures, 6 seeds, mixed ABI calls and negative cases$' "$RUNNER_TEMP/mini-c-differential.log"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: affine-regression-failures
          path: |
            ${{ runner.temp }}/mini-c-failures/
            ${{ runner.temp }}/mini-c-differential.log
          if-no-files-found: ignore
      - name: Publish exact result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          state=failure
          if [ "$JOB_STATUS" = success ]; then state=success; fi
          gh api "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" -f state="$state" -f context=compiler/affine-3844 -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
