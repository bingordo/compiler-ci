name: TypeId ELF M48 checked symbols acceptance PR 792
on:
  pull_request:
    paths:
      - '.github/workflows/ir-typeid-symbol-attrs-792.yml'
permissions:
  contents: read
jobs:
  symbol-attrs:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.CI_KEY }}
      - run: ssh-keyscan github.com >> ~/.ssh/known_hosts
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 476fea054ea7e4399fc05344cf919b20a78e1a60
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler
          key: ir-typeid-elf-symbol-attrs
      - name: Exact source and warnings-denied compiler/backend check
        working-directory: compiler
        run: |
          test "$(git rev-parse HEAD)" = "476fea054ea7e4399fc05344cf919b20a78e1a60"
          RUSTFLAGS="-D warnings" cargo check -p compiler -p compiler-backend-x86 --all-targets
      - name: Native TypeId ELF and GAS weak/hidden/protected linked runtime
        working-directory: compiler
        run: cargo test -p compiler --test ir_default_cli -- --nocapture
      - name: Full compiler-driver tests
        working-directory: compiler
        run: cargo test -p compiler --bin compiler -- --test-threads=2
      - name: Native x86 backend unit tests
        working-directory: compiler
        run: cargo test -p compiler-backend-x86 --lib -- --test-threads=2
      - name: Strict compiler/native backend clippy
        working-directory: compiler
        run: cargo clippy -p compiler -p compiler-backend-x86 --all-targets -- -D warnings
      - name: Standalone Mini-C warnings-denied check
        working-directory: compiler
        run: RUSTFLAGS="-D warnings" cargo check --manifest-path tools/mini-c-driver/Cargo.toml --all-targets
      - name: Standalone Mini-C ELF/GAS linked-runtime attributes
        working-directory: compiler
        run: cargo test --manifest-path tools/mini-c-driver/Cargo.toml --test typeid_cli -- --nocapture
      - name: Full standalone Mini-C regression
        working-directory: compiler
        run: cargo test --manifest-path tools/mini-c-driver/Cargo.toml -- --test-threads=2
      - name: Strict standalone Mini-C clippy
        working-directory: compiler
        run: cargo clippy --manifest-path tools/mini-c-driver/Cargo.toml --all-targets -- -D warnings
