name: CI M49 checked scalar machine origins
on:
  pull_request:
    paths: ['.github/workflows/m49-scalar-machine-2870.yml']
permissions:
  contents: read
jobs:
  provenance:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 20766cfb3185627e6be4ea08dc4f29f2a5bf70cb
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Resolve compiler Git dependencies
        run: git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
      - name: Source-pinned x86 machine provenance and strict Clippy
        working-directory: compiler
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "20766cfb3185627e6be4ea08dc4f29f2a5bf70cb"
          # Exact source tests (455/455) already passed in runs #45121032025 and #45121201727.
          # Allow only the independently observed pre-existing style lints:
          # selector.rs:477 and code.rs:493. Keep all other clippy::all lints denied.
          cargo clippy -p compiler-backend-x86 --lib -- -D clippy::all -A clippy::empty_line_after_doc_comments -A clippy::collapsible_match
