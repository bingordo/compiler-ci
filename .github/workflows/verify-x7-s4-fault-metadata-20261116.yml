# Explicitly pinned external compiler SHA; no GitHub Actions in compiler.
# Pinned external compiler revision, verify the corrected native-reject fixture.
name: X7 S4 actual SIGSEGV memory and threaded TLS visibility native-selected parity
on:
  pull_request:
    paths:
      - '.github/workflows/verify-x7-s4-fault-metadata-20261116.yml'
permissions:
  contents: read
jobs:
  x7-s4-abi-regressions:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: f8c8acfebe0a64e9e63d227b20ba52a89e08c532
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Verify exact compiler SHA
        run: test "$(git -C compiler rev-parse HEAD)" = "f8c8acfebe0a64e9e63d227b20ba52a89e08c532"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: x7-s4-fault-metadata-abi
      - name: Isolate x86 backend workspace
        shell: bash
        run: |
          set -euo pipefail
          cat > compiler/Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir","crates/opt","crates/backend","crates/backend-x86"]
          EOF
          rm -f compiler/Cargo.lock
      - name: Full x86 default and no-default backend libraries and real ABI parity
        shell: bash
        working-directory: compiler
        run: |
          set -euo pipefail
          cargo test -p compiler-backend-x86 --lib
          cargo test -p compiler-backend-x86 --no-default-features --lib
          cargo test -p compiler-backend-x86 --test x7_s4_selected_unwind_native_parity -- --nocapture
          cargo test -p compiler-backend-x86 --no-default-features --test x7_s4_selected_unwind_native_parity -- --nocapture
          python3 tools/regen_x86_selector_rules.py --check
          export X7_S4_INVENTORY_OUT="$(pwd)/../x7-s4-acceptance-inventory/default"
          cargo test -p compiler-backend-x86 --test x7_s4_native_success_inventory -- --nocapture
          export X7_S4_INVENTORY_OUT="$(pwd)/../x7-s4-acceptance-inventory/no-default"
          cargo test -p compiler-backend-x86 --no-default-features --test x7_s4_native_success_inventory -- --nocapture
          python3 tools/x7_s4_verify_native_inventory.py \
            --compiler-sha f8c8acfebe0a64e9e63d227b20ba52a89e08c532 \
            --default ../x7-s4-acceptance-inventory/default \
            --no-default ../x7-s4-acceptance-inventory/no-default
          unset X7_S4_INVENTORY_OUT
          export X7_S4_EFFECTS_OUT="$(pwd)/../x7-s4-effects-linkage/default"
          cargo test -p compiler-backend-x86 --test x7_s4_effect_linkage_native_parity -- --nocapture
          export X7_S4_EFFECTS_OUT="$(pwd)/../x7-s4-effects-linkage/no-default"
          cargo test -p compiler-backend-x86 --no-default-features --test x7_s4_effect_linkage_native_parity -- --nocapture
          python3 tools/x7_s4_verify_effect_linkage.py \
            --compiler-sha f8c8acfebe0a64e9e63d227b20ba52a89e08c532 \
            --default ../x7-s4-effects-linkage/default \
            --no-default ../x7-s4-effects-linkage/no-default
          unset X7_S4_EFFECTS_OUT
          export X7_S4_FAULT_OUT="$(pwd)/../x7-s4-fault-metadata/fault-default"
          cargo test -p compiler-backend-x86 --test x7_s4_memory_fault_parity -- --nocapture
          export X7_S4_FAULT_OUT="$(pwd)/../x7-s4-fault-metadata/fault-no-default"
          cargo test -p compiler-backend-x86 --no-default-features --test x7_s4_memory_fault_parity -- --nocapture
          unset X7_S4_FAULT_OUT
          export X7_S4_SYMBOL_OUT="$(pwd)/../x7-s4-fault-metadata/symbol-default"
          cargo test -p compiler-backend-x86 --test x7_s4_symbol_metadata_parity -- --nocapture
          export X7_S4_SYMBOL_OUT="$(pwd)/../x7-s4-fault-metadata/symbol-no-default"
          cargo test -p compiler-backend-x86 --no-default-features --test x7_s4_symbol_metadata_parity -- --nocapture
          unset X7_S4_SYMBOL_OUT
          python3 tools/x7_s4_verify_fault_metadata.py \
            --compiler-sha f8c8acfebe0a64e9e63d227b20ba52a89e08c532 \
            --fault-default ../x7-s4-fault-metadata/fault-default \
            --fault-no-default ../x7-s4-fault-metadata/fault-no-default \
            --symbol-default ../x7-s4-fault-metadata/symbol-default \
            --symbol-no-default ../x7-s4-fault-metadata/symbol-no-default

          cargo test -p compiler-backend-x86 --test x7_s4_narrow_ctz_parity -- --nocapture
          cargo test -p compiler-backend-x86 --no-default-features --test x7_s4_narrow_ctz_parity -- --nocapture
          cargo test -p compiler-backend-x86 --test x7_s4_narrow_divrem_fault_parity -- --nocapture
          cargo test -p compiler-backend-x86 --no-default-features --test x7_s4_narrow_divrem_fault_parity -- --nocapture
          cargo test -p compiler-backend-x86 --test x7_s4_narrow_shift_cmp_parity -- --nocapture
          cargo test -p compiler-backend-x86 --no-default-features --test x7_s4_narrow_shift_cmp_parity -- --nocapture
          cargo test -p compiler-backend-x86 --test x7_shared_machine_native_parity
          cargo test -p compiler-backend-x86 --test m4_8_ssa_tls_native -- --nocapture
          cargo test -p compiler-backend-x86 --no-default-features --test m4_8_ssa_tls_native -- --nocapture
          cargo test -p compiler-backend-x86 --test m4_8_checked_symbol_attributes_native
          cargo test -p compiler-backend-x86 --test x7_shared_pic_global_native
          cargo test -p compiler-backend-x86 --test native_typeid_indirect_gp_varargs -- --nocapture
          cargo test -p compiler-backend-x86 --test m4_7_indirect_ssa_native -- --nocapture
          cargo test -p compiler-backend-x86 --test native_typeid_call_liveness -- --nocapture
          cargo test -p compiler-backend-x86 --test mixed_sixteen_call_native -- --nocapture
          echo X7_S4_FAULT_METADATA_BACKEND_GREEN
      - name: Pack full ABI and effects evidence into individual archives
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          for folder in x7-s4-acceptance-inventory x7-s4-effects-linkage; do
            if test -d "$folder"; then
              tar -czf "$folder.tar.gz" "$folder"
              ls -lh "$folder.tar.gz"
            fi
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: x7-s4-acceptance-inventory
          path: x7-s4-acceptance-inventory.tar.gz
          compression-level: 0
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: x7-s4-effects-linkage-objects
          path: x7-s4-effects-linkage.tar.gz
          compression-level: 0
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: x7-s4-fault-metadata-objects
          path: x7-s4-fault-metadata
          if-no-files-found: warn
  x7-s4-source-oracles:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.CI_KEY }}
      - name: Trust GitHub SSH for external compiler frontend
        run: ssh-keyscan github.com >> ~/.ssh/known_hosts
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: f8c8acfebe0a64e9e63d227b20ba52a89e08c532
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Verify exact compiler SHA
        run: test "$(git -C compiler rev-parse HEAD)" = "f8c8acfebe0a64e9e63d227b20ba52a89e08c532"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: x7-s4-fault-metadata-source
      - name: Build production source compiler and check ABI/metadata integration
        shell: bash
        working-directory: compiler
        run: |
          set -euo pipefail
          cargo build -p compiler
          python3 tools/test_x7_s4_executable_source_gate.py -v
          cargo test -p compiler --test x7_selected_machine_source -- --nocapture
          cargo test -p compiler --test x7_s4_rolling_checksum_source -- --nocapture
          cargo test -p compiler --test x7_s4_source_elf_metadata -- --nocapture
          cargo test -p compiler --test typeid_tls_linker_matrix -- --nocapture
      - name: Full 48 real C Oberon source native-selected ELF/GAS parity and cost
        shell: bash
        working-directory: compiler
        run: |
          set -euo pipefail
          python3 tools/x7_s4_executable_source_gate.py \
            --compiler target/debug/compiler \
            --source-sha f8c8acfebe0a64e9e63d227b20ba52a89e08c532 \
            --out ../x7-s4-acceptance-source \
            --scales 8 24 48 \
            --languages mini_c oberon \
            --modes plain framed pic pic_framed \
            --groups 3
          echo X7_S4_FAULT_METADATA_SOURCE_GREEN
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: x7-s4-acceptance-source
          path: x7-s4-acceptance-source
          if-no-files-found: ignore
