name: IR fixtures CSE array local migration
on:
  push:
    branches: [verify/ir-fixture-batch-cse-array-local-20261114]
    paths: ['.github/workflows/ir-fixture-batch-cse-array-local-20261114.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 737e708ed7e701581f79f55a0d8ed3b777d004bb
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Pin source SHA
        run: test "$(git -C compiler rev-parse HEAD)" = "737e708ed7e701581f79f55a0d8ed3b777d004bb"
      - name: Restrict workspace to IR and optimization dependencies
        run: |
          cat > compiler/Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir", "crates/opt", "crates/backend", "crates/backend-x86"]
          EOF
          rm -f compiler/Cargo.lock
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: ir-fixture-batch-cse-array-local
      - name: Test native fixture replacements and existing CFG regressions
        working-directory: compiler
        run: |
          cargo test -p compiler-opt --test typed_cse --test typed_array_fold --test typed_local
          cargo test -p compiler-opt --test typed_identical_merges --test typed_phi_cfg --test typed_phi_dead_linear
          cargo test -p compiler-opt --test ir_fixture_directives --test native_ir_pass_replay
          cargo test -p compiler-ir --test native_module_comment_fixtures
          cargo clippy -p compiler-opt --test typed_cse --test typed_array_fold --test typed_local -- -D warnings
