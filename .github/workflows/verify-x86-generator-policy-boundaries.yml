name: x86 generator exact policy boundary tests
on:
  pull_request:
    paths: ['.github/workflows/verify-x86-generator-policy-boundaries.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  generator-boundaries:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact compiler candidate
        uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 93b4aa9868bb45d0ac5c12e6d386ac4de8133cb7
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Assert immutable candidate
        run: test "$(git -C compiler rev-parse HEAD)" = "93b4aa9868bb45d0ac5c12e6d386ac4de8133cb7"
      - name: Run source admission and exact cardinality boundary tests
        working-directory: compiler
        run: |
          set -euo pipefail
          export PYTHONPATH="$PWD/tools"
          python3 tools/regen_x86_selector_rules.py --check
          python3 tools/regen_x86_dag_rule_groups.py --check
          python3 -m unittest discover -s tools -p test_x86_selector_rules.py -v
          python3 -m unittest discover -s tools -p test_x86_dag_codegen.py -v
          python3 -m unittest discover -s tools -p test_ranked_generator_index.py -v
