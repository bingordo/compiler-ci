name: Validate private inline native mask oracle PR2726
on:
  pull_request:
    paths:
      - '.github/workflows/validate-private-inline-native-2726.yml'
permissions:
  contents: read
jobs:
  private-inline:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      SOURCE_SHA: fd711c9d938605e77ff59efc8539df91571e1cb3
      CARGO_INCREMENTAL: '0'
      CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: ${{ env.SOURCE_SHA }}
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Pin source and isolate native crates
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C compiler rev-parse HEAD)" = "$SOURCE_SHA"
          cat > compiler/Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir", "crates/opt", "crates/backend", "crates/backend-x86"]
          EOF
          rm -f compiler/Cargo.lock
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: private-inline-native-2726
      - name: Assert native source and IR boundary
        working-directory: compiler
        run: |
          set -euo pipefail
          ! grep -qE 'typeid_executable_fixture|typed_fixture|from_legacy' crates/opt/tests/inline_private_decision_oracle.rs
          python3 tools/ir_consumer_inventory.py --check-production
      - name: Compile optimizer and backend
        working-directory: compiler
        run: |
          cargo check -p compiler-opt --lib --test inline_private_decision_oracle
          cargo check -p compiler-backend-x86 --lib
      - name: Run all 12 private inline masks and code-size oracle
        working-directory: compiler
        run: cargo test -p compiler-opt --test inline_private_decision_oracle -- --nocapture
