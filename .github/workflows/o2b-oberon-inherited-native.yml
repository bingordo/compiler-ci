name: O2b Oberon inherited record native TypeId candidate
on:
  pull_request:
    paths:
      - '.github/workflows/o2b-oberon-inherited-native.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 9a8ca35d9183493355c2422dc5c1f2a896cd9bcb
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Verify source SHA and frontend pin
        run: |
          set -euxo pipefail
          test "$(git -C compiler rev-parse HEAD)" = 9a8ca35d9183493355c2422dc5c1f2a896cd9bcb
          grep -Fq 'rev = "e2f47c4764cdc401c8aa192f84bfdbb146ea7586"' compiler/crates/driver/Cargo.toml
          git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: o2b-oberon-inherited-native
      - name: Execute inherited record native GAS/ELF and prior record oracle
        run: |
          set -euxo pipefail
          cargo check --manifest-path compiler/Cargo.toml -p compiler --all-targets
          cargo test --manifest-path compiler/Cargo.toml -p compiler --bin compiler \
            checked_oberon_inherited_record_layout_prefix_copies_execute_typeid -- --nocapture
          cargo test --manifest-path compiler/Cargo.toml -p compiler --bin compiler \
            checked_oberon_contiguous_record_layout_and_copies_execute_typeid -- --nocapture
          cargo clippy --manifest-path compiler/Cargo.toml -p compiler --all-targets -- -D warnings
