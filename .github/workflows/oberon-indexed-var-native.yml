name: Oberon indexed VAR native GAS and ELF acceptance
on:
  push:
    paths:
      - '.github/workflows/oberon-indexed-var-native.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-indexed-var:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
      CARGO_INCREMENTAL: '0'
    steps:
      - name: Checkout exact compiler candidate
        uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 85aea0ae350c41fd7141a44a2319b01c1d5a29ae
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Verify exact source and checked frontend pin
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C compiler rev-parse HEAD)" = "85aea0ae350c41fd7141a44a2319b01c1d5a29ae"
          grep -Fq 'rev = "8e687074ad97e65a722a2bc816eed885d1ac6e19"' compiler/crates/driver/Cargo.toml
          git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: oberon-indexed-var-native-v1
      - name: Execute indexed VAR mutation, aliasing, exact-once and bounds in GAS/ELF/PIC
        run: cargo test --manifest-path compiler/Cargo.toml -p compiler --test oberon_indexed_var_native -- --nocapture
      - name: Regression - checked Oberon module arrays
        run: cargo test --manifest-path compiler/Cargo.toml -p compiler --test m42_oberon_arrays_native -- --nocapture
