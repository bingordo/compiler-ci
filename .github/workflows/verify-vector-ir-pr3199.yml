name: Vector IR PR 3199 validation
on:
  pull_request:
    paths:
      - '.github/workflows/verify-vector-ir-pr3199.yml'
permissions:
  contents: read
jobs:
  ir:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 32ced0997d8275c4493851f70d012368c4e2e801
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Verify source and restrict workspace
        working-directory: compiler
        run: |
          test "$(git rev-parse HEAD)" = 32ced0997d8275c4493851f70d012368c4e2e801
          printf '[workspace]\nresolver = "2"\nmembers = ["crates/ir", "crates/opt", "crates/backend", "crates/backend-x86", "crates/backend-aarch64", "crates/backend-riscv64", "crates/backend-wasm"]\n' > Cargo.toml
          rm -f Cargo.lock
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: vector-ir-focused
      - name: Run all IR tests independently of backend test compilation
        working-directory: compiler
        run: cargo test -p compiler-ir
      - name: Check shared optimizer and backend consumers without baseline test compilation
        if: always()
        working-directory: compiler
        run: cargo check -p compiler-opt -p compiler-backend -p compiler-backend-x86 -p compiler-backend-aarch64 -p compiler-backend-riscv64 -p compiler-backend-wasm --lib
      - name: Test shared vector representation and spill layout
        if: always()
        working-directory: compiler
        run: cargo test -p compiler-backend --test native_vector --test vector_scalarize
      - name: Exercise actual target vector register classes
        if: always()
        working-directory: compiler
        run: cargo test -p compiler-backend-x86 -p compiler-backend-aarch64 --test vector_forms
      - name: Execute scalarized vector differential oracle through ELF and GAS
        if: always()
        working-directory: compiler
        run: cargo test -p compiler-backend-x86 --test vector_scalarize_native --test vector_memory_native --test vector_packed_native
      - name: Install AArch64 execution tools
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends gcc-aarch64-linux-gnu libc6-dev-arm64-cross qemu-user
      - name: Execute shared packed NEON matrix through ELF and GAS
        working-directory: compiler
        env:
          COMPILER_TEST_AARCH64_QEMU: "1"
        run: cargo test -p compiler-backend-aarch64 --test vector_packed_native
