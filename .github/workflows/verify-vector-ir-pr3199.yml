name: Vector IR PR 3199 validation
on:
  pull_request:
    paths:
      - '.github/workflows/verify-vector-ir-pr3199.yml'
permissions:
  contents: read
jobs:
  ir:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: fde3b7711ce94ae81e44c1cce56ca80ba09736e2
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Verify source and restrict workspace
        working-directory: compiler
        run: |
          test "$(git rev-parse HEAD)" = fde3b7711ce94ae81e44c1cce56ca80ba09736e2
          printf '[workspace]\nresolver = "2"\nmembers = ["crates/ir"]\n' > Cargo.toml
          rm -f Cargo.lock
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: vector-ir-focused
      - name: Run all IR tests independently of backend test compilation
        working-directory: compiler
        run: cargo test -p compiler-ir
