# Source-pinned ALIVE-Lite P4a native TypeId and P4b regression acceptance.
name: IR PR2883 AL04 native P4a and P4b Z3
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ir-pr2883-al04-p4a-native-20261122.yml'
  workflow_dispatch:
permissions:
  contents: read

jobs:
  alive-lite-observed-memory:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      SOURCE_SHA: 77f18f059ba0a81865174997dd3c83a04bbdf67a
      CARGO_INCREMENTAL: '0'
      CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
    steps:
      - name: Install independent Z3 SMT solver
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends z3
          z3 -version
      - name: Check out exact private compiler revision
        uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: ${{ env.SOURCE_SHA }}
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Check source pin and isolate core workspace
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C compiler rev-parse HEAD)" = "$SOURCE_SHA"
          cat > compiler/Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir", "crates/opt", "crates/backend", "crates/backend-x86", "crates/backend-aarch64"]
          EOF
          rm -f compiler/Cargo.lock
      - name: Cache ALIVE Lite Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: ir-al04-p4a-direct-typeid
      - name: Check direct native TypeId source parity and all P4a SMT proofs
        working-directory: compiler
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=10s 660s cargo test -p compiler-opt --test alive_lite al04_p4a_ -- --include-ignored --nocapture --test-threads=1
      - name: Preserve P4b observed-memory and trap semantics
        working-directory: compiler
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=10s 900s cargo test -p compiler-opt --test alive_lite al04_p4b -- --include-ignored --nocapture --test-threads=1
      - name: Clippy ALIVE Lite test under current native TypeId
        working-directory: compiler
        shell: bash
        run: |
          set -euo pipefail
          cargo clippy -p compiler-opt --test alive_lite -- -D clippy::all -A clippy::collapsible_match -A clippy::empty_line_after_doc_comments -A clippy::needless_range_loop
