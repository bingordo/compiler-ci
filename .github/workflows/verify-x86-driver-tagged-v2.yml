name: x86 M1.14 driver tagged physical v2 compiler PR 1198
on:
  pull_request:
    paths:
      - '.github/workflows/verify-x86-driver-tagged-v2.yml'
permissions:
  contents: read
jobs:
  x86-driver-tagged:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.CI_KEY }}
      - name: Trust pinned frontend host
        run: ssh-keyscan github.com >> ~/.ssh/known_hosts
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: c801961228bd9ab33be79acd7c22b82d23e6c55a
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Require exact source SHA
        run: test "$(git -C compiler rev-parse HEAD)" = "c801961228bd9ab33be79acd7c22b82d23e6c55a"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: x86-driver-tagged-v2
          cache-workspace-crates: 'true'
      - name: Run x86 tagged-v2 CLI integration and TypeId dump/replay
        working-directory: compiler
        run: |
          cargo test -p compiler --test typeid_x86_physical_dump -- --nocapture
          cargo test -p compiler --test typeid_ir_dump_replay -- --nocapture
      - name: Strict driver and backend Clippy
        working-directory: compiler
        run: |
          cargo clippy -p compiler -p compiler-backend-x86 --all-targets -- -D warnings
