name: Temporary legacy x86 X7 oracle retirement #3732
on:
  pull_request:
    paths: ['.github/workflows/temp-retire-x7-old-oracles-3732.yml']
permissions:
  contents: read
jobs:
  retire:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      SOURCE_SHA: 0db992ae3c857c50cea27e80ffa6be4c62f375a7
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: ${{ env.SOURCE_SHA }}
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.CI_KEY }}
      - name: Trust GitHub for private frontend crates
        run: ssh-keyscan github.com >> ~/.ssh/known_hosts
      - name: Exact-SHA legacy X7 test caller inventory
        working-directory: compiler
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          git grep -n -E 'x7_g10_n(10_ssa|11_cfg|12_c_defined|14_sub|15_no_default|16_bitwise|19_64|20_cfg|20c_compile)|x7_g10_native_memory_oracle|bulk_zero_profile' -- .github tools crates ':!crates/backend-x86/tests/*' || true
      - name: TypeId and native physical X7 validation
        working-directory: compiler
        run: |
          set -euo pipefail
          cargo test -p compiler-backend-x86 --lib
          cargo test -p compiler-backend-x86 --features x7-native-form-validation \
            --test x7_g10_late_selector_native --test x7_g10_n10_real_ssa_native \
            --test x7_g10_n7_real_ssa_native -- --nocapture
          cargo test -p compiler-opt --test typed_core_pipeline --test ct03_typed_alias_epoch_native
          cargo check -p compiler
