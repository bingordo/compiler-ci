name: Temporary legacy x86 X7 oracle retirement #3732
on:
  pull_request:
    paths: ['.github/workflows/temp-retire-x7-old-oracles-3732.yml']
permissions:
  contents: read
jobs:
  retire:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      SOURCE_SHA: 37693b668a454ee0a0124c48504d93906d28953a
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: ${{ env.SOURCE_SHA }}
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.CI_KEY }}
      - name: Trust GitHub for private frontend crates
        run: ssh-keyscan github.com >> ~/.ssh/known_hosts
      - name: Exact-SHA legacy X7 test caller inventory
        working-directory: compiler
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          git grep -n -E 'x7_g10_n(10_ssa|11_cfg|12_c_defined|14_sub|15_no_default|16_bitwise|19_64|20_cfg|20c_compile)|x7_g10_native_memory_oracle|bulk_zero_profile' -- .github tools crates ':!crates/backend-x86/tests/*' || true
      - name: Final source/workflow retirement audit (Rust scope previously passed)
        working-directory: compiler
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          python3 tools/ir_consumer_inventory.py --check-production
          python3 - <<'PY'
          from pathlib import Path
          workflow = Path(".github/workflows/mem2reg-profile.yml").read_text()
          assert "bulk_zero_profile" not in workflow
          assert "bulk-zero-profile.log" not in workflow
          assert "mem2reg_profile" in workflow
          assert "cargo test -p compiler-opt --test mem2reg_profile" in workflow
          opt = Path("crates/opt/tests/ct03_typed_alias_epoch_native.rs").read_text()
          assert "to_legacy()" not in opt
          assert "LegacyFunctionBackend" not in opt
          assert "emit_typeid_object" in opt
          assert "emit_typeid_assembly" in opt
          PY
