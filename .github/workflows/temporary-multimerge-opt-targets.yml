name: TypeId multimerge production oracle and broad optimizer compilation
on:
  pull_request:
    paths:
      - '.github/workflows/temporary-multimerge-opt-targets.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      SOURCE_SHA: a50ac2ff3a354ed7338840fc44a91ba378600003
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: ${{ env.SOURCE_SHA }}
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Pin source and isolate native core
        run: |
          set -euo pipefail
          test "$(git -C compiler rev-parse HEAD)" = "$SOURCE_SHA"
          cat > compiler/Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir", "crates/opt", "crates/backend", "crates/backend-x86", "crates/backend-aarch64"]
          EOF
          rm -f compiler/Cargo.lock
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: ir-multimerge-opt-targets
      - name: Execute multimerge C11 parity oracles
        working-directory: compiler
        run: cargo test -p compiler-opt --test if_conversion_typeid_multimerge -- --nocapture
      - name: Execute nested-loop same-successor PHI C11 oracle
        working-directory: compiler
        run: cargo test -p compiler-opt --test review_nested_same_successor_phi -- --nocapture
      - name: Execute remaining if-conversion C11 runtime oracles
        working-directory: compiler
        run: cargo test -p compiler-opt --test if_conversion_typeid_remaining -- --nocapture
      - name: Strict native TypeId production optimizer and x86 Clippy
        working-directory: compiler
        run: |
          set -euo pipefail
          cargo clippy -p compiler-opt --lib -- -D warnings
          cargo clippy -p compiler-backend-x86 --lib -- -D warnings
      - name: Compile all optimizer integration test targets
        working-directory: compiler
        run: cargo test -p compiler-opt --tests --no-run
      - name: Compile all IR integration test targets
        working-directory: compiler
        run: cargo test -p compiler-ir --tests --no-run
