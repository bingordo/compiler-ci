name: If-conversion multi-merge validation
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-if-conversion-multi.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: if-conversion-multi
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: opt/if-conversion-multi-merge
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Report revision
        run: git -C compiler rev-parse HEAD | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Restrict workspace to core crates
        shell: bash
        run: |
          cat > compiler/Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir", "crates/opt", "crates/backend", "crates/backend-x86"]
          EOF
          rm -f compiler/Cargo.lock
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: if-conversion-multi
      - name: Test core compiler and backend
        working-directory: compiler
        run: cargo test -p compiler-ir -p compiler-opt -p compiler-backend -p compiler-backend-x86
      - name: Validate generated-rule compatibility
        working-directory: compiler
        run: cargo test -p compiler-opt --features experimental-generated-rules
