# Exact-commit generated CFG and ABI verification for compiler PR #364.
name: Verify PR364 TypeId CFG and ABI parity
on:
  push:
    branches: [ci/pr364-generated-cfg-abi]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 380773a3de9af8ab879be8d42229a7f65ed916ff
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Verify exact source commit
        run: test "$(git -C compiler rev-parse HEAD)" = "380773a3de9af8ab879be8d42229a7f65ed916ff"
      - name: Isolate compiler IR core native workspace
        run: |
          cat > compiler/Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir", "crates/opt", "crates/backend", "crates/backend-x86"]
          EOF
          rm -f compiler/Cargo.lock
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: generated-cfg-abi-pr364
          cache-workspace-crates: 'true'
      - name: Generated TypeId CFG, ABI and fixed-seed parity tests
        working-directory: compiler
        run: cargo test -p compiler-ir --test typed_verifier_generated --test typed_verifier_parity -- --nocapture
      - name: Full self-contained IR optimizer and native backend suites
        working-directory: compiler
        run: cargo test -p compiler-ir -p compiler-opt -p compiler-backend -p compiler-backend-x86
      - name: Strict IR Clippy with all tests
        working-directory: compiler
        run: cargo clippy -p compiler-ir --all-targets -- -D warnings
