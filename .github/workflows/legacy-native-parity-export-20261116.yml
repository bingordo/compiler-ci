name: Original native and old-sidecar graph export baseline
on:
  push:
    branches: [verify/legacy-native-parity-export-20261116]
    paths: ['.github/workflows/legacy-native-parity-export-20261116.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: fa64a85cef95410a8719b8f1bd712d42c832be0a
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Verify source exact SHA
        run: test "$(git -C compiler rev-parse HEAD)" = "fa64a85cef95410a8719b8f1bd712d42c832be0a"
      - name: Restrict IR-only workspace
        run: |
          cat > compiler/Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir"]
          EOF
          rm -f compiler/Cargo.lock
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: native-legacy-fixture-parity-export
      - name: Export authoritative original TypeId native v3 canonical bytes
        working-directory: compiler
        run: |
          cargo test -p compiler-ir --test typed_ssa_body export_original_native_typeid_baseline_for_parity -- --nocapture
          cargo test -p compiler-ir --test ssa_typeids export_original_native_typeid_baseline_for_parity -- --nocapture
      - name: Keep original independent sidecar and native acceptance green
        working-directory: compiler
        run: cargo test -p compiler-ir --test typed_ssa_body --test ssa_typeids
