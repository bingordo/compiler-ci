name: Historical native TypeId and sidecar independent parity acceptance
on:
  push:
    branches: [verify/legacy-native-parity-export-20261116]
    paths: ['.github/workflows/legacy-native-parity-export-20261116.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 327c0ec2da30a7780d547cd2693177fa1db663e5
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Verify exact source SHA
        run: test "$(git -C compiler rev-parse HEAD)" = "327c0ec2da30a7780d547cd2693177fa1db663e5"
      - name: Isolate native IR workspace
        run: |
          cat > compiler/Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir"]
          EOF
          rm -f compiler/Cargo.lock
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: historic-as7-vector-typeid-native-parity
      - name: Native fixed TypeId plus strict historical vector and pointer-AS7 binary parity
        working-directory: compiler
        run: |
          cargo test -p compiler-ir --test native_fixed_verifier_fixtures -- --nocapture
          cargo test -p compiler-ir --test native_fixture_text --test native_module_text_v3 --test native_binary_v1
      - name: Original independent v1 and sidecar codecs and all verifier mutation tests
        working-directory: compiler
        run: |
          cargo test -p compiler-ir --test typed_ssa_body --test ssa_typeids -- --nocapture
          cargo test -p compiler-ir --test typed_module --test typed_module_abi --test typed_opcode_types --test typed_value_flow
      - name: Strict scoped Clippy
        working-directory: compiler
        run: |
          cargo clippy -p compiler-ir --no-deps --test typed_ssa_body --test ssa_typeids --test native_fixed_verifier_fixtures -- -D warnings
