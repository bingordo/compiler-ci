name: Review AArch64 indexed scale validation PR 2321
on:
  push:
    branches: [review/aarch64-index-scale-2321]
    paths:
      - .github/workflows/review-aarch64-index-scale-2321.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  aarch64-liveness:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 25
    steps:
      - name: Checkout pinned compiler change
        uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 573ec2d4b4e20d46b3a886d8ce0ebe3e5609eb4f
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Verify compiler SHA
        run: test "$(git -C compiler rev-parse HEAD)" = "573ec2d4b4e20d46b3a886d8ce0ebe3e5609eb4f"
      - uses: dtolnay/rust-toolchain@stable
      - name: Isolated backend workspace
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work/crates
          cp -a compiler/crates/{ir,backend,backend-aarch64} work/crates/
          cat > work/Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir", "crates/backend", "crates/backend-aarch64"]
          EOF
      - name: AArch64 all-targets compile
        working-directory: work
        run: RUSTFLAGS="-D warnings" cargo check -p compiler-backend-aarch64 --all-targets
      - name: Native AArch64 tests
        working-directory: work
        run: cargo test -p compiler-backend-aarch64 --all-targets -- --test-threads=1
      - name: Generated SP access encoding boundaries
        working-directory: work
        run: cargo test -p compiler-backend-aarch64 checked_index_shift_rejects_non_power_of_two_and_oversized_scales -- --nocapture