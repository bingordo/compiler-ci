# Isolated source-pinned TypeId global memory fixture migration acceptance.
name: IR PR2786 native global-memory matrices
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ir-pr2786-global-memory-native-20261122.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  global-memory-matrix:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      SOURCE_SHA: 5d42c7963f7d39bc45ddb133ecc0da817796d354
      CARGO_INCREMENTAL: '0'
      CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
    steps:
      - name: Check out exact private compiler PR
        uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: ${{ env.SOURCE_SHA }}
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Verify pinned source and isolate core workspace
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C compiler rev-parse HEAD)" = "$SOURCE_SHA"
          cat > compiler/Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir", "crates/opt", "crates/backend", "crates/backend-x86", "crates/backend-aarch64"]
          EOF
          rm -f compiler/Cargo.lock
          rustc --version
          cc --version | head -n 1
      - name: Cache isolated Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: ir-pr2786-global-memory-matrix
      - name: Execute global-memory and native regression tests
        working-directory: compiler
        shell: bash
        run: |
          set -euo pipefail
          cargo test -p compiler-opt --test typed_global_memory -- --nocapture
          cargo test -p compiler-opt --test m4_integer_effects -- --nocapture
      - name: Clippy of edited test module (existing x86 doc-spacing excluded)
        working-directory: compiler
        run: |
          cargo clippy -p compiler-opt --test typed_global_memory -- -D clippy::all -A clippy::empty_line_after_doc_comments
