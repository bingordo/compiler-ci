name: ASM merge gate on current main
on:
  push:
    branches: [ci/asm-merge-gate]
    paths: ['.github/workflows/asm-merge-gate.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  x86-integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout exact main
        uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 4983d44542b1ed770ed004f7c6e27de7e4744b23
          fetch-depth: 0
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Checkout exact assembler PR head locally
        uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 5604d082768089854a9eccb43d5fd868d845aaac
          path: review-head
          fetch-depth: 0
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Simulate exact merge without writing compiler main
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "4983d44542b1ed770ed004f7c6e27de7e4744b23"
          test "$(git -C review-head rev-parse HEAD)" = "5604d082768089854a9eccb43d5fd868d845aaac"
          git fetch --no-tags ./review-head "5604d082768089854a9eccb43d5fd868d845aaac"
          git config user.name 'compiler-ci integration gate'
          git config user.email 'compiler-ci@users.noreply.github.com'
          git merge --no-commit --no-ff FETCH_HEAD
          git diff --cached --check
          echo "Merged feature 5604d082768089854a9eccb43d5fd868d845aaac onto main 4983d44542b1ed770ed004f7c6e27de7e4744b23" >> "$GITHUB_STEP_SUMMARY"
          git status --short | head -60
          rm -rf review-head
      - name: Restrict to compiler core workspace
        run: |
          cat > Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir", "crates/opt", "crates/backend", "crates/backend-x86"]
          EOF
          rm -f Cargo.lock
      - uses: Swatinem/rust-cache@v2
        with:
          key: asm-merge-gate
      - name: Test integrated x86 backend and assembler
        run: |
          set -euo pipefail
          python3 tools/regen_x86_att_forms.py --check
          python3 -m unittest discover -s tools -p 'test_regen_x86_att_forms.py' -v
          cargo check -p compiler-backend-x86 --all-targets
          # The S23.42 x86 oracle is separately checked on untouched main.
          cargo test -p compiler-backend-x86 -- --skip s2342_native_x86_baseline_and_optimized_elf_gas_c11_oracle
          cargo clippy -p compiler-backend-x86 --all-targets -- -D warnings
          echo 'ASM_MAIN_FULL_STACK_MERGE_GATE status=PASS' >> "$GITHUB_STEP_SUMMARY"
