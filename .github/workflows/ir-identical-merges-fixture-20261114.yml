name: Native IR fixture replacement parity
on:
  push:
    branches: [verify/ir-identical-merges-fixture-20261114]
    paths:
      - '.github/workflows/ir-identical-merges-fixture-20261114.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 37049dc9d238961da959d5b2dba40b9b4d220afd
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Check exact revision
        run: test "$(git -C compiler rev-parse HEAD)" = "37049dc9d238961da959d5b2dba40b9b4d220afd"
      - name: Restrict workspace to compiler core
        run: |
          cat > compiler/Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir", "crates/opt", "crates/backend", "crates/backend-x86"]
          EOF
          rm -f compiler/Cargo.lock
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: native-ir-identical-merges
      - name: Verify replaced CFG corpus, old oracles and TypeId replay
        working-directory: compiler
        run: |
          cargo test -p compiler-opt --test typed_identical_merges
          cargo test -p compiler-opt --test ir_fixture_directives
          cargo test -p compiler-opt --test native_ir_pass_replay
          cargo test -p compiler-ir --test native_module_text_v3
          cargo clippy -p compiler-opt --test typed_identical_merges --test ir_fixture_directives -- -D warnings
