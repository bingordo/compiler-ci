name: x86 remat 81 pinned external C source and original local-source decision frontier
on:
  push:
    branches: [main]
    paths: [.github/workflows/verify-x86-remat-external-frontier-20261119.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  actual-source-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
    steps:
      - name: Source pin current compiler and analyzer
        uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 01cad4b72bf43bad9daf2e07575dd84d7186be00
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Exact original musl source files
        uses: actions/checkout@v4
        with:
          repository: ifduyue/musl
          ref: 7813e9119eb5fe681b6750b8a033a0490bca0941
          path: musl
          persist-credentials: false
      - name: Exact original Lua source files
        uses: actions/checkout@v4
        with:
          repository: lua/lua
          ref: c42d820bc0c3bc4f2ad536e19d2f05405af10387
          path: lua
          persist-credentials: false
      - name: Exact original zlib source files
        uses: actions/checkout@v4
        with:
          repository: madler/zlib
          ref: 99623ef7097352da7993ba614161fd6a311e046e
          path: zlib
          persist-credentials: false
      - name: Verify all source revisions and unit tests
        run: |
          set -euo pipefail
          test "$(git -C compiler rev-parse HEAD)" = "01cad4b72bf43bad9daf2e07575dd84d7186be00"
          test "$(git -C musl rev-parse HEAD)" = "7813e9119eb5fe681b6750b8a033a0490bca0941"
          test "$(git -C lua rev-parse HEAD)" = "c42d820bc0c3bc4f2ad536e19d2f05405af10387"
          test "$(git -C zlib rev-parse HEAD)" = "99623ef7097352da7993ba614161fd6a311e046e"
          python3 -m unittest discover -s compiler/tools -p 'test_x86_i32_remat_source_frontier.py' -v
          python3 -m unittest discover -s compiler/tools -p 'test_x86_i32_remat_trace_cases.py' -v
          python3 -m py_compile compiler/tools/x86_i32_remat_source_frontier.py
          git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: x86-external-remat-frontier-20261119
      - name: Build production TypeId compiler (release) at exact pin
        working-directory: compiler
        run: cargo build --release -p compiler --bin compiler
      - name: Complete original 81-file external C and extra local fixture trace/no-trace audit
        run: |
          set -euo pipefail
          mkdir -p benchmark-output
          python3 compiler/tools/x86_i32_remat_source_frontier.py \
            --compiler-root compiler \
            --compiler compiler/target/release/compiler \
            --musl-root musl --lua-root lua --zlib-root zlib \
            --output benchmark-output/x86-i32-remat-source-frontier.json
      - name: Upload exact per-source accepted and rejected evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: x86-i32-remat-pinned-external-source-frontier
          path: benchmark-output/x86-i32-remat-source-frontier.json
          if-no-files-found: warn
