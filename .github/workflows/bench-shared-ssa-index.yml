name: One-off shared SSA index validation
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/bench-shared-ssa-index.yml'
permissions:
  contents: read
jobs:
  validate:
    if: github.head_ref == 'bench/shared-ssa-index' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 651fb337478515111d8033265660d6420419af78
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: shared-ssa-index
      - name: Verify SSA definition and optimizer regressions
        working-directory: compiler
        run: |
          set -euo pipefail
          git rev-parse HEAD
          git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
          cargo test --release -p compiler-ir --lib
          cargo test --release -p compiler-ir --test typed_value_flow --test typed_verifier_generated --test typed_verifier_parity --test typed_opcode_types --test typed_module_abi
          cargo test --release -p compiler-opt --lib
          cargo test --release -p compiler-backend --lib
          cargo check --workspace
          cargo clippy -p compiler-ir -p compiler-opt --lib -- -D warnings
