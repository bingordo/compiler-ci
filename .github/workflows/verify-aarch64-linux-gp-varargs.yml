name: AArch64 M7 Linux GP varargs native gate
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-aarch64-linux-gp-varargs.yml'
permissions:
  contents: read
concurrency:
  group: aarch64-m7-gp-varargs
  cancel-in-progress: true

jobs:
  arm-source:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - name: Configure read-only SSH for pinned frontends
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.CI_KEY }}
      - name: Trust GitHub SSH host for pinned source dependencies
        run: ssh-keyscan github.com >> ~/.ssh/known_hosts
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: d5930703e186a28fac7b9dfc762eaee40ea87675
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Verify exact compiler source SHA
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C compiler rev-parse HEAD)" = d5930703e186a28fac7b9dfc762eaee40ea87675
          test "$(uname -m)" = aarch64
          command -v cc
          command -v readelf
          echo 'AArch64 source integration at compiler SHA d5930703e186a28fac7b9dfc762eaee40ea87675' >> "$GITHUB_STEP_SUMMARY"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: aarch64-m7-gp-varargs
          cache-workspace-crates: 'true'
      - name: Compile real Oberon/Mini-C unified compiler binary
        working-directory: compiler
        run: RUSTFLAGS="-D warnings" cargo build -p compiler --bin compiler
      - name: Check AArch64 GAS encoder and CFI unit tests
        working-directory: compiler
        run: |
          set -euo pipefail
          RUSTFLAGS="-D warnings" cargo test -p compiler-backend-aarch64 -- --test-threads=1
          RUSTFLAGS="-D warnings" cargo test -p compiler-backend -- --test-threads=1
      - name: Execute checked source to ELF/GAS linked native C oracles
        working-directory: compiler
        shell: bash
        run: |
          set -euo pipefail
          COMPILER_DRIVER="$PWD/target/debug/compiler" bash tests/aarch64_driver_integration.sh
          echo 'Native ARM64 Linux AAPCS64 checked GP variadic glibc stdout ABI and full ELF/GAS/PIC source acceptance passed.' >> "$GITHUB_STEP_SUMMARY"
