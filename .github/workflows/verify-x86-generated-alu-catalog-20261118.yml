name: x86 reviewed generated ALU catalog pinned acceptance
on:
  push:
    branches: [main]
    paths: [.github/workflows/verify-x86-generated-alu-catalog-20261118.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  generated-scalar-alu-catalog:
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: c77061421753b0dfd9d3e4844e5f089d2a75e297
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Verify exact source and generator is in sync with committed Rust
        run: |
          set -euo pipefail
          test "$(git -C compiler rev-parse HEAD)" = "c77061421753b0dfd9d3e4844e5f089d2a75e297"
          git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
          (cd compiler && python3 tools/regen_x86_forms.py --check)
          (cd compiler && python3 -m unittest discover -s tools -p 'test_regen_x86_forms.py' -v)
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: x86-reviewed-alu-catalog-20261118
      - name: Generated ISA admissions native ELF GAS and full backend regression
        working-directory: compiler
        run: |
          set -euo pipefail
          cargo test -p compiler-backend-x86 --lib scalar_immediate::tests -- --nocapture
          cargo test -p compiler-backend-x86 --lib reviewed_bitwise_immediate_native_tests -- --nocapture
          cargo test -p compiler-backend-x86 --lib
          cargo test -p compiler-backend --lib
          cargo test -p compiler-backend-aarch64 --lib
          cargo clippy -p compiler-backend --lib -- --no-deps -D warnings
          cargo clippy -p compiler-backend-x86 --lib -- --no-deps -D warnings -A dead_code
          cargo test -p compiler --test x7_s4_rolling_checksum_source -- --nocapture
