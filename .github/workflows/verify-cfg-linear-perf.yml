name: Validate and A/B profile CFG linear merge verification fix
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-cfg-linear-perf.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cfg-linear-perf-validation
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
      RUSTFLAGS: '-C debuginfo=1 -C force-frame-pointers=yes'
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 7a0ae2f6eda75cb1ee2573fd0eb3c509442d62bb
          path: before
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: opt/cfg-linear-verify-once
          path: after
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 34b65af104211f5175c606442b392be9ded90db7
          path: helper
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Record exact revisions and compiler/CPU details
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p results
          git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
          for dir in before after helper; do
            echo "$dir $(git -C "$dir" rev-parse HEAD)" | tee -a results/revisions.txt
          done
          rustc --version | tee results/runner.txt
          lscpu | grep -E '^(Model name|CPU\(s\)):' | tee -a results/runner.txt
          uname -r | tee -a results/runner.txt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: after/tools/mini-c-driver -> target
          key: cfg-linear-perf-once
      - name: Run core and Mini-C regression tests on candidate branch
        shell: bash
        run: |
          set -euo pipefail
          cat > after/Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir", "crates/opt", "crates/backend", "crates/backend-x86"]
          EOF
          rm -f after/Cargo.lock
          cargo test --manifest-path after/Cargo.toml \
            -p compiler-ir -p compiler-opt -p compiler-backend -p compiler-backend-x86
          cargo test --manifest-path after/tools/mini-c-driver/Cargo.toml \
            -p compiler-mini-c --lib
      - name: Build baseline and candidate optimally with stack frames
        shell: bash
        run: |
          set -euo pipefail
          cargo build --release --manifest-path before/tools/mini-c-driver/Cargo.toml -p compiler-mini-c --bin compiler-mini-c
          cargo build --release --manifest-path after/tools/mini-c-driver/Cargo.toml -p compiler-mini-c --bin compiler-mini-c
          python3 helper/tools/source_compile_corpus.py --out corpus
      - name: Paired ABBA fresh-process timings and object-equivalence checks
        shell: bash
        run: |
          set -euo pipefail
          B="$PWD/before/tools/mini-c-driver/target/release/compiler-mini-c"
          A="$PWD/after/tools/mini-c-driver/target/release/compiler-mini-c"
          for entry in "branch_chain 24 80" "branch_chain 48 45" \
                       "array_loop 24 80" "array_loop 48 45" "call_graph 48 120"; do
            read -r kind scale n <<< "$entry"
            case_id="${kind}_${scale}"
            source="$PWD/corpus/mini_c/${case_id}.c"
            for mode in before1 after1 after2 before2; do
              if [[ "$mode" == before* ]]; then compiler="$B"; else compiler="$A"; fi
              python3 helper/tools/perf_repeat_compile.py \
                --compiler "$compiler" --source "$source" --count "$n" \
                > "results/${case_id}.${mode}.json"
            done
          done
          python3 - <<'PY' | tee results/comparison.md | tee -a "$GITHUB_STEP_SUMMARY"
          import json, statistics
          from pathlib import Path
          print("# Same-runner CFG linear merge verification A/B")
          print()
          print("Both binaries built with release optimization, debug symbols and frame pointers.")
          print("ABBA repetitions cover fresh compiler processes; exact ELF object SHA256 must match.")
          print()
          print("| Source | Baseline ms/compile | One-verifier ms/compile | Baseline / optimized |")
          print("|:--|--:|--:|--:|")
          for kind,scale in [("branch_chain",24),("branch_chain",48),("array_loop",24),
                             ("array_loop",48),("call_graph",48)]:
              name=f"{kind}_{scale}"
              d={}
              for label in ("before1","after1","after2","before2"):
                  d[label]=json.loads(Path(f"results/{name}.{label}.json").read_text())
              hashes={v["object_sha256"] for v in d.values()}
              if len(hashes)!=1: raise ValueError(f"{name}: object mismatch between revisions")
              before=statistics.median(d[x]["wall_ms_per_compile"] for x in ("before1","before2"))
              after=statistics.median(d[x]["wall_ms_per_compile"] for x in ("after1","after2"))
              print(f"| {name} | {before:.3f} | {after:.3f} | {before/after:.2f}x |")
          PY
      - name: Perf-record the corrected 48-branch compile for call-path confirmation
        shell: bash
        run: |
          set -euo pipefail
          sudo sysctl -w kernel.perf_event_paranoid=1
          perf record --quiet -e cpu-clock:u -F 499 \
            -g --call-graph fp -o results/after-branch48.perf.data -- \
            python3 helper/tools/perf_repeat_compile.py \
              --compiler "$PWD/after/tools/mini-c-driver/target/release/compiler-mini-c" \
              --source "$PWD/corpus/mini_c/branch_chain_48.c" --count 150 \
              > results/after-branch48.json
          perf report --stdio --children --sort comm,dso,symbol \
            --percent-limit 0.4 -i results/after-branch48.perf.data \
            > results/after-branch48.stacks.txt
          perf report --stdio --no-children --sort comm,dso,symbol \
            --percent-limit 0.3 -i results/after-branch48.perf.data \
            > results/after-branch48.leaf.txt
          grep -n -m 6 -B 4 -A 7 'compiler_opt::cfg::merge_linear_blocks' \
            results/after-branch48.stacks.txt | head -n 90 || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cfg-linear-verify-once-perf
          path: results/
          retention-days: 30
          overwrite: true
          compression-level: 3
