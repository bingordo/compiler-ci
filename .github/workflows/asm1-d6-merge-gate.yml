name: ASM1-D6 main integration gate
on:
  push:
    branches: [ci/asm1-d6-unowned-symbols]
    paths: ['.github/workflows/asm1-d6-merge-gate.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  d6-main:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 386f0832f32a3109bf355aaabd8d3228ae997787
          fetch-depth: 0
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 47b7b4675ee9e30a8ec57a5f922a650403bfca82
          path: feature-head
          fetch-depth: 0
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Simulate main integration without touching compiler main
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "386f0832f32a3109bf355aaabd8d3228ae997787"
          test "$(git -C feature-head rev-parse HEAD)" = "47b7b4675ee9e30a8ec57a5f922a650403bfca82"
          git config user.name 'compiler-ci integration gate'
          git config user.email 'compiler-ci@users.noreply.github.com'
          git fetch --no-tags ./feature-head 47b7b4675ee9e30a8ec57a5f922a650403bfca82
          git merge --no-commit --no-ff FETCH_HEAD
          git diff --cached --check
          rm -rf feature-head
      - name: Core compiler workspace
        run: |
          cat > Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir", "crates/opt", "crates/backend", "crates/backend-x86"]
          EOF
          rm -f Cargo.lock
      - uses: Swatinem/rust-cache@v2
        with:
          key: asm1-d6-main-integration
      - name: Validate source-integrated ELF symbols and assembler
        run: |
          set -euo pipefail
          python3 tools/regen_x86_att_forms.py --check
          python3 -m unittest discover -s tools -p test_regen_x86_att_forms.py -v
          cargo check -p compiler-backend-x86 --all-targets
          cargo test -p compiler-backend-x86 --test att_unowned_symbols -- --nocapture
          for suite in att_data_differences att_asm att_module att_module_strings \
            att_aliases att_mid_labels att_section_cursor att_text_alignment \
            m4_global_data_only_native m4_global_definitions_native \
            m4_global_pointer_relocations_native machine_text_v1; do
            cargo test -p compiler-backend-x86 --test "$suite"
          done
          cargo test -p compiler-backend-x86 --lib
          cargo test -p compiler-backend --lib
          cargo clippy -p compiler-backend-x86 --lib --test att_unowned_symbols --test att_data_differences --test att_module -- -D warnings -A unused_variables -A clippy::suspicious_assignment_formatting
          echo 'ASM1_D6_MAIN_GATE status=PASS' >> "$GITHUB_STEP_SUMMARY"
