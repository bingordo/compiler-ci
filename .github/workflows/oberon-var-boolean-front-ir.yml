name: Oberon VAR BOOLEAN frontend and interface validation
on:
  push:
    paths:
      - '.github/workflows/oberon-var-boolean-front-ir.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out exact Oberon frontend
        uses: actions/checkout@v4
        with:
          repository: bingordo/oberon
          ref: 99f576f7bc793e6b04e4e0ad75eb5cad780ba875
          path: oberon
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Verify frontend candidate
        run: test "$(git -C oberon rev-parse HEAD)" = "99f576f7bc793e6b04e4e0ad75eb5cad780ba875"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: oberon/oberon -> target
          key: oberon-var-boolean-front-ir-v1
      - name: Verify VAR BOOLEAN AST and imports
        run: cargo test --manifest-path oberon/oberon/Cargo.toml -p oberon-front-ir --test var_boolean_params -- --nocapture
      - name: Full Oberon front-ir regression suite
        run: cargo test --manifest-path oberon/oberon/Cargo.toml -p oberon-front-ir
      - name: Strict front-ir Clippy
        run: cargo clippy --manifest-path oberon/oberon/Cargo.toml -p oberon-front-ir --all-targets -- -D warnings
