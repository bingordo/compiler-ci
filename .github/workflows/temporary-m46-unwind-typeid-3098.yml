# Temporary exact-source TypeId unwind migration gate. Close unmerged.
name: Temporary native TypeId x86 M46 unwind source
on:
  pull_request:
    paths:
      - '.github/workflows/temporary-m46-unwind-typeid-3098.yml'
permissions:
  contents: read
jobs:
  native-unwind:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      SOURCE_SHA: 4aa081b476879c8ad81436aa70584c2ac1a29548
      CARGO_INCREMENTAL: '0'
      CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
    steps:
      - name: Checkout exact compiler source
        uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: ${{ env.SOURCE_SHA }}
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Verify source and isolate backend workspace
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C compiler rev-parse HEAD)" = "$SOURCE_SHA"
          cat > compiler/Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir", "crates/opt", "crates/backend", "crates/backend-x86", "crates/backend-aarch64"]
          EOF
          rm -f compiler/Cargo.lock
      - name: Cache core workspace
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: temporary-m46-unwind-typeid-3098
      - name: Execute M4.6 CFI/PIC and shared-library C11 unwind oracles
        working-directory: compiler
        shell: bash
        run: |
          set -euo pipefail
          cargo test -p compiler-backend-x86 --test m4_6_source_unwind_native --test m4_6_unwind_shared_native -- --nocapture
      - name: Focused Clippy with unrelated baseline exemptions
        working-directory: compiler
        shell: bash
        run: |
          set -euo pipefail
          cargo clippy -p compiler-backend-x86 --test m4_6_source_unwind_native --test m4_6_unwind_shared_native -- -D clippy::all -A clippy::needless_borrows_for_generic_args -A clippy::too_many_arguments -A clippy::needless_range_loop -A clippy::collapsible_if -A clippy::collapsible_match -A clippy::needless_lifetimes -A clippy::type_complexity -A clippy::empty_line_after_doc_comments
