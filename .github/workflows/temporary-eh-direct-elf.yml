# Temporary direct ELF exception section validation; do not merge.
name: Native ELF exception sections GCC interoperability
on:
  pull_request:
    paths: ['.github/workflows/temporary-eh-direct-elf.yml']
permissions:
  contents: read
jobs:
  elf:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      SOURCE_SHA: 74f1426b83e297e22df9aa217246ebcb34369e1f
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: ${{ env.SOURCE_SHA }}
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Verify exact revision and isolate backend workspace
        run: |
          set -euo pipefail
          test "$(git -C compiler rev-parse HEAD)" = "$SOURCE_SHA"
          cat > compiler/Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir-macros", "crates/ir", "crates/backend"]
          EOF
          rm -f compiler/Cargo.lock
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: temporary-eh-lsda
          cache-on-failure: true
      - name: Existing ELF regressions and native exception runtime
        working-directory: compiler
        run: |
          set -euo pipefail
          cargo test -p compiler-backend --lib
          cargo test -p compiler-backend --test itanium_lsda_runtime -- --nocapture
