name: Validate typed native-int operation families PR2658
on:
  pull_request:
    paths:
      - '.github/workflows/native-int-family-ops-pr2658.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  family-opcodes:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      CARGO_INCREMENTAL: '0'
      SOURCE_SHA: 4137981b5b1bc73b43b0e0f170f4bf09c00793a1
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 4137981b5b1bc73b43b0e0f170f4bf09c00793a1
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Verify exact revision and isolate optimizer workspace
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C compiler rev-parse HEAD)" = "$SOURCE_SHA"
          cat > compiler/Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir", "crates/opt", "crates/backend", "crates/backend-x86"]
          EOF
          rm -f compiler/Cargo.lock
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: native-int-seeded-generator
      - name: Run four original generated differential and rollback suites
        working-directory: compiler
        shell: bash
        run: |
          set -euo pipefail
          cargo test -p compiler-opt --test generated_native_bitwise_comparison_s2321 -- --nocapture
          cargo test -p compiler-opt --test generated_native_complement_pair_s2325 -- --nocapture
          cargo test -p compiler-opt --test generated_native_matchpd_complement_s2312 -- --nocapture
          cargo test -p compiler-opt --test generated_native_xor_partition_s2324 -- --nocapture
      - name: Focused Clippy with known unrelated upstream lint exemptions
        working-directory: compiler
        run: cargo clippy -p compiler-opt --test generated_native_bitwise_comparison_s2321 --test generated_native_complement_pair_s2325 --test generated_native_matchpd_complement_s2312 --test generated_native_xor_partition_s2324 -- -D warnings -A dead-code -A clippy::empty-line-after-doc-comments -A unused-imports -A clippy::too-many-arguments
