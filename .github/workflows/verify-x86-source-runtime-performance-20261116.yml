name: X86 physical MOV origins in real TypeId scan #3255
on:
  push:
    branches: [main]
    paths: [.github/workflows/verify-x86-source-runtime-performance-20261116.yml]
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/verify-x86-source-runtime-performance-20261116.yml'
permissions:
  contents: read
jobs:
  runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 676fac836eaa79c66e7364909ed8188bfa88b560
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Verify exact source and configure private frontends
        run: |
          test "$(git -C compiler rev-parse HEAD)" = "676fac836eaa79c66e7364909ed8188bfa88b560"
          git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: x86-mov-origin-census-20261125
      - name: Verify complete source-bound physical MOV attribution
        working-directory: compiler
        shell: bash
        run: |
          set -euo pipefail
          cargo test -p compiler-backend-x86 --lib move_census::tests -- --nocapture
          # Retired LP64 indirect-call fixture is tracked on compiler #3145.
          cargo test -p compiler-backend-x86 --lib --quiet -- \
            --skip typeid_fp_staged_native_tests::mixed_body_typed_gp_indirect_value_and_void_calls
          cargo clippy -p compiler-backend-x86 --lib -- -D warnings
      - name: Native runtime median and GCC independent correctness oracle
        working-directory: compiler
        shell: bash
        run: |
          set -euo pipefail
          cargo test --release -p compiler --test x7_s4_rolling_checksum_source -- --nocapture
          COMPILER_X86_MOV_CENSUS=1 cargo test --release -p compiler --test x86_source_runtime_performance -- --ignored --nocapture 2>&1 | tee "$RUNNER_TEMP/x86-generated-runtime.log"
          grep -F 'X86_MOV_SOURCE function=scan region=machine' "$RUNNER_TEMP/x86-generated-runtime.log"
          grep -F 'X86_MOV_SUMMARY function=scan region=total count=' "$RUNNER_TEMP/x86-generated-runtime.log"
          grep -q 'X86_RUNTIME_FUNCTION mode=gcc_O2 symbol=' "$RUNNER_TEMP/x86-generated-runtime.log"
          grep -q 'X86_RUNTIME_FUNCTION mode=mini_default symbol=' "$RUNNER_TEMP/x86-generated-runtime.log"
          grep -q 'X86_SOURCE_RUNTIME mode=gcc_O2 workload=batch ' "$RUNNER_TEMP/x86-generated-runtime.log"
          grep -q 'X86_SOURCE_RUNTIME mode=mini_default workload=delta ' "$RUNNER_TEMP/x86-generated-runtime.log"
          grep -q 'X86_SOURCE_RUNTIME mode=gcc_O2 ' "$RUNNER_TEMP/x86-generated-runtime.log"
          grep -q 'X86_SOURCE_RUNTIME mode=mini_default ' "$RUNNER_TEMP/x86-generated-runtime.log"
          grep -q 'X86_SOURCE_RUNTIME mode=mini_noinline ' "$RUNNER_TEMP/x86-generated-runtime.log"
          grep -q 'X86_SOURCE_RUNTIME mode=gcc_Os ' "$RUNNER_TEMP/x86-generated-runtime.log"
      - name: Summarize attributed MOV origins and independent GCC oracle
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          {
            echo '### x86 scan physical MOV origin census'
            echo 'Tested compiler SHA: \`676fac836eaa79c66e7364909ed8188bfa88b560\`'
            echo 'Read-only accounting of selected machine sites (no codegen change)'
            echo '~~~'
            grep -F 'X86_MOV_' "$RUNNER_TEMP/x86-generated-runtime.log" | grep -F 'function=scan '
            grep -E '^X86_(SOURCE_RUNTIME|RUNTIME_FUNCTION) ' "$RUNNER_TEMP/x86-generated-runtime.log"
            echo '~~~'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve executable runtime and GCC checksums
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: x86-generated-runtime
          path: ${{ runner.temp }}/x86-generated-runtime.log
          if-no-files-found: ignore
