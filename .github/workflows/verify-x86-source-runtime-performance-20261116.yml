name: x86 physical direct empty edge branch PR3263
on:
  push:
    branches: [main]
    paths: [.github/workflows/verify-x86-source-runtime-performance-20261116.yml]
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/verify-x86-source-runtime-performance-20261116.yml'
permissions:
  contents: read
jobs:
  runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: ff369fe660d471ceef5bd6344873fa94fdc75cb9
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Verify exact source and configure private frontends
        run: |
          test "$(git -C compiler rev-parse HEAD)" = "ff369fe660d471ceef5bd6344873fa94fdc75cb9"
          git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: x86-direct-empty-edge-20261125
      - name: Selected x86 empty edge policy, real native GAS/ELF and strict backend
        working-directory: compiler
        shell: bash
        run: |
          set -euo pipefail
          cargo test -p compiler-backend-x86 --lib direct_empty_edges_tests -- --nocapture
          # Historical LP64 Op::CallIndirect test not yet migrated to
          # CallIndirectTyped after #3145. Record separately, do not enable
          # its retired ABI just to validate branch layout.
          cargo test -p compiler-backend-x86 --lib --quiet -- \
            --skip typeid_fp_staged_native_tests::mixed_body_typed_gp_indirect_value_and_void_calls
          cargo clippy -p compiler-backend-x86 --lib -- -D warnings
      - name: Native runtime median and GCC independent correctness oracle
        working-directory: compiler
        shell: bash
        run: |
          set -euo pipefail
          cargo test --release -p compiler --test x7_s4_rolling_checksum_source -- --nocapture
          cargo test --release -p compiler --test x86_source_runtime_performance -- --ignored --nocapture 2>&1 | tee "$RUNNER_TEMP/x86-generated-runtime.log"
          grep -q 'X86_RUNTIME_FUNCTION mode=gcc_O2 symbol=' "$RUNNER_TEMP/x86-generated-runtime.log"
          grep -q 'X86_RUNTIME_FUNCTION mode=mini_default symbol=' "$RUNNER_TEMP/x86-generated-runtime.log"
          grep -q 'X86_SOURCE_RUNTIME mode=gcc_O2 workload=batch ' "$RUNNER_TEMP/x86-generated-runtime.log"
          grep -q 'X86_SOURCE_RUNTIME mode=mini_default workload=delta ' "$RUNNER_TEMP/x86-generated-runtime.log"
          grep -q 'X86_SOURCE_RUNTIME mode=gcc_O2 ' "$RUNNER_TEMP/x86-generated-runtime.log"
          grep -q 'X86_SOURCE_RUNTIME mode=mini_default ' "$RUNNER_TEMP/x86-generated-runtime.log"
          grep -q 'X86_SOURCE_RUNTIME mode=mini_noinline ' "$RUNNER_TEMP/x86-generated-runtime.log"
          grep -q 'X86_SOURCE_RUNTIME mode=gcc_Os ' "$RUNNER_TEMP/x86-generated-runtime.log"
      - name: Checkout same-runner pre-change compiler for native A/B
        uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: cdb92f6bb83d7e06bf23d2e7e481ae97fac4946a
          path: compiler-baseline
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Native source checksum, branch and instruction baseline
        working-directory: compiler-baseline
        shell: bash
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/compiler/target
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "cdb92f6bb83d7e06bf23d2e7e481ae97fac4946a"
          cargo test --release -p compiler --test x86_source_runtime_performance -- --ignored --nocapture 2>&1 | tee "$RUNNER_TEMP/x86-baseline-runtime.log"
          grep -F 'X86_RUNTIME_FUNCTION mode=mini_default symbol=scan>' "$RUNNER_TEMP/x86-baseline-runtime.log"
      - name: Summarize exact paired x86 native result
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "### x86 direct-empty-edge A/B"
            echo "Candidate: ff369fe660d471ceef5bd6344873fa94fdc75cb9"
            echo "Baseline: cdb92f6bb83d7e06bf23d2e7e481ae97fac4946a"
            echo '~~~'
            echo 'Before:'
            grep -E 'X86_(SOURCE_RUNTIME|RUNTIME_FUNCTION) ' "$RUNNER_TEMP/x86-baseline-runtime.log" | grep -E 'symbol=(scan>|BenchBatch>|BenchDelta>)|workload=combined'
            echo 'After:'
            grep -E 'X86_(SOURCE_RUNTIME|RUNTIME_FUNCTION) ' "$RUNNER_TEMP/x86-generated-runtime.log" | grep -E 'symbol=(scan>|BenchBatch>|BenchDelta>)|workload=combined'
            echo '~~~'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve executable runtime and GCC checksums
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: x86-generated-runtime
          path: |
            ${{ runner.temp }}/x86-generated-runtime.log
            ${{ runner.temp }}/x86-baseline-runtime.log
          if-no-files-found: ignore
