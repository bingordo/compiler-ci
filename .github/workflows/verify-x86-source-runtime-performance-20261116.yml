name: x86 source edge profile counters and live physical copy costs PR3275
on:
  push:
    branches: [main]
    paths: [.github/workflows/verify-x86-source-runtime-performance-20261116.yml]
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/verify-x86-source-runtime-performance-20261116.yml'
permissions:
  contents: read
jobs:
  runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: a689ae147e593e47ee9863002208af8db2fcd22f
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Verify exact source and configure private frontends
        run: |
          test "$(git -C compiler rev-parse HEAD)" = "a689ae147e593e47ee9863002208af8db2fcd22f"
          git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: x86-real-edge-profile-20261125
      - name: Verify shared flow contract and x86 backend before source profiling
        working-directory: compiler
        shell: bash
        run: |
          set -euo pipefail
          cargo test -p compiler-backend --lib profile_counters -- --nocapture
          cargo test -p compiler-backend-x86 --lib --quiet -- \
            --skip typeid_fp_staged_native_tests::mixed_body_typed_gp_indirect_value_and_void_calls
          cargo clippy -p compiler-backend-x86 --lib -- -D warnings
          # Do not treat unrelated current backend-wasm strict-Clippy
          # warnings as an x86 PGO test failure. The standalone driver
          # integration test is compiled and executed in the next step;
          # this source pin does not modify wasm or suppress its diagnostics.
      - name: Collect real TypeId edge profile, native GCC/GAS/ELF proof
        working-directory: compiler
        shell: bash
        run: |
          set -euo pipefail
          cargo test --release -p compiler --test x86_edge_pgo_runtime_source -- --ignored --nocapture 2>&1 | tee "$RUNNER_TEMP/x86-generated-runtime.log"
          grep -q 'X86_PGO_PROVENANCE object_sha256=' "$RUNNER_TEMP/x86-generated-runtime.log"
          grep -q 'X86_PGO_EDGE function=scan from=' "$RUNNER_TEMP/x86-generated-runtime.log"
          grep -q 'X86_PGO_AGG function=scan calls=' "$RUNNER_TEMP/x86-generated-runtime.log"
      - name: Summarize measured hot edge frequencies and copy demand
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          {
            echo '### Real x86 TypeId PGO edge counts and post-RA copies'
            echo 'Exact compiler SHA: a689ae147e593e47ee9863002208af8db2fcd22f'
            echo 'Native C/GCC/GAS/direct ELF identities and all edge flow checked'
            echo '~~~'
            grep 'X86_PGO_' "$RUNNER_TEMP/x86-generated-runtime.log"
            echo '~~~'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve executable runtime and GCC checksums
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: x86-source-pgo-profile
          path: ${{ runner.temp }}/x86-generated-runtime.log
          if-no-files-found: ignore
