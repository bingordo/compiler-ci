name: x86 soft scalar result affinity native GCC PR3256
on:
  push:
    branches: [main]
    paths: [.github/workflows/verify-x86-source-runtime-performance-20261116.yml]
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/verify-x86-source-runtime-performance-20261116.yml'
permissions:
  contents: read
jobs:
  runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: cb5795ae43b9f6a8b6bd9038dc8878d6955f24b4
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Verify exact source and configure private frontends
        run: |
          test "$(git -C compiler rev-parse HEAD)" = "cb5795ae43b9f6a8b6bd9038dc8878d6955f24b4"
          git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: x86-soft-scalar-affinity-20261125
      - name: Shared allocator soft affinities, native GAS/ELF and strict Clippy
        working-directory: compiler
        shell: bash
        run: |
          set -euo pipefail
          cargo test -p compiler-backend --lib -- --nocapture
          cargo test -p compiler-backend-x86 --lib soft_scalar_affinity_tests -- --nocapture
          # Historical LP64 indirect-call fixture must migrate to
          # CallIndirectTyped after #3145. Kept separately reported there.
          cargo test -p compiler-backend-x86 --lib --quiet -- \
            --skip typeid_fp_staged_native_tests::mixed_body_typed_gp_indirect_value_and_void_calls
          cargo clippy -p compiler-backend -p compiler-backend-x86 --lib -- -D warnings
      - name: Native runtime median and GCC independent correctness oracle
        working-directory: compiler
        shell: bash
        run: |
          set -euo pipefail
          cargo test --release -p compiler --test x7_s4_rolling_checksum_source -- --nocapture
          cargo test --release -p compiler --test x86_source_runtime_performance -- --ignored --nocapture 2>&1 | tee "$RUNNER_TEMP/x86-generated-runtime.log"
          grep -q 'X86_RUNTIME_FUNCTION mode=gcc_O2 symbol=' "$RUNNER_TEMP/x86-generated-runtime.log"
          grep -q 'X86_RUNTIME_FUNCTION mode=mini_default symbol=' "$RUNNER_TEMP/x86-generated-runtime.log"
          grep -q 'X86_SOURCE_RUNTIME mode=gcc_O2 workload=batch ' "$RUNNER_TEMP/x86-generated-runtime.log"
          grep -q 'X86_SOURCE_RUNTIME mode=mini_default workload=delta ' "$RUNNER_TEMP/x86-generated-runtime.log"
          grep -q 'X86_SOURCE_RUNTIME mode=gcc_O2 ' "$RUNNER_TEMP/x86-generated-runtime.log"
          grep -q 'X86_SOURCE_RUNTIME mode=mini_default ' "$RUNNER_TEMP/x86-generated-runtime.log"
          grep -q 'X86_SOURCE_RUNTIME mode=mini_noinline ' "$RUNNER_TEMP/x86-generated-runtime.log"
          grep -q 'X86_SOURCE_RUNTIME mode=gcc_Os ' "$RUNNER_TEMP/x86-generated-runtime.log"
      - name: Checkout exact pre-affinity compiler for same-runner A/B
        uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 2a655a5229db863bc628c28eae8f442534e92d82
          path: compiler-baseline
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Native GCC runtime and machine mix at original source
        working-directory: compiler-baseline
        shell: bash
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/compiler/target
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "2a655a5229db863bc628c28eae8f442534e92d82"
          cargo test --release -p compiler --test x86_source_runtime_performance -- --ignored --nocapture 2>&1 | tee "$RUNNER_TEMP/x86-baseline-runtime.log"
          grep -q 'X86_RUNTIME_FUNCTION mode=mini_default symbol=scan>' "$RUNNER_TEMP/x86-baseline-runtime.log"
          grep -q 'X86_SOURCE_RUNTIME mode=mini_default workload=combined' "$RUNNER_TEMP/x86-baseline-runtime.log"
      - name: Report x86 physical code mix from exact-source native A/B
        shell: bash
        if: success()
        run: |
          set -euo pipefail
          {
            echo '### Soft scalar allocator affinity, production TypeId A/B'
            echo 'Source commit: \`cb5795ae43b9f6a8b6bd9038dc8878d6955f24b4\`'
            echo 'Same-runner baseline: 2a655a5229db863bc628c28eae8f442534e92d82'
            echo 'Candidate and baseline checksum / physical counts:'
            echo 'Baseline:'
            grep -E 'X86_(SOURCE_RUNTIME|RUNTIME_FUNCTION) ' "$RUNNER_TEMP/x86-baseline-runtime.log" | grep -E 'symbol=(scan>|BenchBatch>|BenchDelta>)|workload=combined'
            echo 'Candidate:'
            echo '~~~'
            grep -E 'X86_(SOURCE_RUNTIME|RUNTIME_FUNCTION) ' "$RUNNER_TEMP/x86-generated-runtime.log" | grep -E 'symbol=(scan>|BenchBatch>|BenchDelta>)|workload=combined'
            echo '~~~'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve executable runtime and GCC checksums
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: x86-generated-runtime
          path: |
            ${{ runner.temp }}/x86-generated-runtime.log
            ${{ runner.temp }}/x86-baseline-runtime.log
          if-no-files-found: ignore
