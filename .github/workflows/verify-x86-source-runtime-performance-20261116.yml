name: Generic verified edge affinity and x86 default regression PR3289
on:
  push:
    branches: [main]
    paths: [.github/workflows/verify-x86-source-runtime-performance-20261116.yml]
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/verify-x86-source-runtime-performance-20261116.yml'
permissions:
  contents: read
jobs:
  runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: fca10b702d3de087a6203c3a0e1200f66262befd
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Verify exact source and configure private frontends
        run: |
          test "$(git -C compiler rev-parse HEAD)" = "fca10b702d3de087a6203c3a0e1200f66262befd"
          git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: generic-verified-edge-affinity-20261125
      - name: Generic frequency bridge, allocator safety and strict backend lint
        working-directory: compiler
        shell: bash
        run: |
          set -euo pipefail
          cargo test -p compiler-backend --lib regalloc_profile -- --nocapture
          cargo test -p compiler-backend --lib --quiet
          cargo test -p compiler-backend-x86 --lib profiled_allocation_tests -- --nocapture
          cargo test -p compiler-backend-x86 --lib --quiet -- \
            --skip typeid_fp_staged_native_tests::mixed_body_typed_gp_indirect_value_and_void_calls
          cargo clippy -p compiler-backend -p compiler-backend-x86 --lib -- -D warnings
      - name: Native runtime median and GCC independent correctness oracle
        working-directory: compiler
        shell: bash
        run: |
          set -euo pipefail
          cargo test --release -p compiler --test x7_s4_rolling_checksum_source -- --nocapture
          cargo test --release -p compiler --test x86_source_runtime_performance -- --ignored --nocapture 2>&1 | tee "$RUNNER_TEMP/x86-generated-runtime.log"
          grep -q 'X86_RUNTIME_FUNCTION mode=gcc_O2 symbol=' "$RUNNER_TEMP/x86-generated-runtime.log"
          grep -q 'X86_RUNTIME_FUNCTION mode=mini_default symbol=' "$RUNNER_TEMP/x86-generated-runtime.log"
          grep -q 'X86_SOURCE_RUNTIME mode=gcc_O2 workload=batch ' "$RUNNER_TEMP/x86-generated-runtime.log"
          grep -q 'X86_SOURCE_RUNTIME mode=mini_default workload=delta ' "$RUNNER_TEMP/x86-generated-runtime.log"
          grep -q 'X86_SOURCE_RUNTIME mode=gcc_O2 ' "$RUNNER_TEMP/x86-generated-runtime.log"
          grep -q 'X86_SOURCE_RUNTIME mode=mini_default ' "$RUNNER_TEMP/x86-generated-runtime.log"
          grep -q 'X86_SOURCE_RUNTIME mode=mini_noinline ' "$RUNNER_TEMP/x86-generated-runtime.log"
          grep -q 'X86_SOURCE_RUNTIME mode=gcc_Os ' "$RUNNER_TEMP/x86-generated-runtime.log"
      - name: Preserve executable runtime and GCC checksums
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: x86-generated-runtime
          path: ${{ runner.temp }}/x86-generated-runtime.log
          if-no-files-found: ignore
