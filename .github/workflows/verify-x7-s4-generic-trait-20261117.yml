name: X7 S4 generic x86 TypeId trait shared emitter migration
on:
  pull_request:
    paths: ['.github/workflows/verify-x7-s4-generic-trait-20261117.yml']
permissions:
  contents: read
jobs:
  shared-trait-real-elf-gcc:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.CI_KEY }}
      - name: Trust GitHub SSH
        run: ssh-keyscan github.com >> ~/.ssh/known_hosts
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: f3dbf1445ccd974a5c6c7e81d5756af0e4bc0a0d
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Confirm exact source SHA
        run: test "$(git -C compiler rev-parse HEAD)" = "f3dbf1445ccd974a5c6c7e81d5756af0e4bc0a0d"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: x7-s4-generic-typeid-shared
      - name: Exact four-mode TypeId trait equals production selected ELF/GAS
        working-directory: compiler
        shell: bash
        run: |
          set -euo pipefail
          cargo test -p compiler-backend-x86 --test x7_s4_generic_trait_shared_default -- --nocapture
          cargo test -p compiler-backend-x86 --lib
          cargo test -p compiler-backend-x86 --no-default-features --lib
          cargo test -p compiler --test x7_s4_shared_default
          cargo test -p compiler --test x7_s4_mixed_lto_shared_default
          cargo test -p compiler --test x7_s4_source_elf_metadata
          cargo test -p compiler --test x7_s4_pragmatic_driver_cutover
          echo X7_S4_GENERIC_TRAIT_SHARED_ACCEPTANCE_GREEN
      - name: Selected real source GCC oracle
        working-directory: compiler
        shell: bash
        run: |
          set -euo pipefail
          cargo build -p compiler
          python3 tools/x7_s4_executable_source_gate.py \
            --compiler target/debug/compiler \
            --source-sha f3dbf1445ccd974a5c6c7e81d5756af0e4bc0a0d \
            --out ../x7-s4-generic-trait-source \
            --scales 8 24 48 \
            --languages mini_c oberon \
            --modes plain framed pic pic_framed \
            --groups 3
          echo X7_S4_GENERIC_TRAIT_SOURCE_GCC_GREEN
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: x7-s4-generic-trait-source
          path: x7-s4-generic-trait-source
          if-no-files-found: warn
