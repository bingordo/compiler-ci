name: pinned shared comparison SSA use planner proof
on:
  push:
    branches: [main]
    paths: [.github/workflows/verify-shared-compare-uses-20261118.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compare-use-parity:
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 4b832673773a99d13eabea6ba8c3edd4c2c42d80
          path: baseline
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: ea8015b34267daeac96d39eff63187f89dab7d6b
          path: proposed
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Verify immutable commit identities
        run: |
          set -euo pipefail
          test "$(git -C baseline rev-parse HEAD)" = "4b832673773a99d13eabea6ba8c3edd4c2c42d80"
          test "$(git -C proposed rev-parse HEAD)" = "ea8015b34267daeac96d39eff63187f89dab7d6b"
          git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
          lscpu | grep '^Model name:' || true
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            baseline -> target
            proposed -> target
          key: shared-comparison-use-20261118
      - name: Shared proof and x86 TypeId/DAG/branch full suites
        working-directory: proposed
        run: |
          set -euo pipefail
          cargo test -p compiler-backend --lib compare_uses::tests -- --nocapture
          cargo test -p compiler-backend --lib
          cargo test -p compiler-backend-x86 --lib
          cargo clippy -p compiler-backend --lib -- --no-deps -D warnings
          # Pre-existing x86 unused migration/test adapters are covered
          # by existing tests; only this pre-existing lint is exempt.
          cargo clippy -p compiler-backend-x86 --lib -- --no-deps -D warnings -A dead_code
          cargo test -p compiler --test x86_inline_source_ablation -- --nocapture
          cargo test -p compiler --test x7_s4_rolling_checksum_source -- --nocapture
      - name: Immutable baseline generic and x86 library parity
        working-directory: baseline
        run: |
          set -euo pipefail
          cargo test -p compiler-backend --lib
          cargo test -p compiler-backend-x86 --lib
      - name: Source-identical native x86 runtime and independent GCC checksum
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path=Path("crates/driver/tests/x86_source_runtime_performance.rs")
          old=(Path("baseline")/path).read_bytes()
          new=(Path("proposed")/path).read_bytes()
          assert old==new, "runtime source fixture drift"
          needle=b"REPS=7, ITERS=1800"
          assert old.count(needle)==1
          for d in ("baseline","proposed"):
              (Path(d)/path).write_bytes(old.replace(needle,b"REPS=7, ITERS=18000"))
          PY
          for d in baseline proposed; do
            (cd "$d" && cargo test --release -p compiler --test x86_source_runtime_performance --no-run)
          done
          cpu=$(awk '/^Cpus_allowed_list:/ {split($2,a,/[-,]/); print a[1]}' /proc/self/status)
          test -n "$cpu"
          echo "CPU_PIN=$cpu"
          i=0
          for d in baseline proposed proposed baseline; do
            i=$((i+1))
            file="$RUNNER_TEMP/compare-ab-$i-$d.log"
            (cd "$d" && taskset -c "$cpu" cargo test --release -p compiler --test x86_source_runtime_performance -- --ignored --nocapture) 2>&1 | tee "$file"
            grep -q 'X86_SOURCE_RUNTIME mode=mini_default workload=combined' "$file"
            grep -q 'X86_SOURCE_RUNTIME mode=gcc_O2 workload=combined' "$file"
          done
          python3 - "$RUNNER_TEMP" <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          from pathlib import Path
          import sys,statistics
          base=Path(sys.argv[1])
          runs=[]
          for i,d in enumerate(("baseline","proposed","proposed","baseline"),1):
              data=(base/f"compare-ab-{i}-{d}.log").read_text()
              def entry(prefix):
                  lines=[line for line in data.splitlines() if prefix in line]
                  assert lines,(i,d,prefix)
                  return {part.split("=",1)[0]:part.split("=",1)[1]
                          for part in lines[-1].split() if "=" in part}
              mini=entry("X86_SOURCE_RUNTIME mode=mini_default workload=combined")
              gcc=entry("X86_SOURCE_RUNTIME mode=gcc_O2 workload=combined")
              scan=entry("X86_RUNTIME_FUNCTION mode=mini_default symbol=scan>")
              assert mini["checksum"]==gcc["checksum"],(d,i,"gcc mismatch")
              runs.append((d,int(mini["median_ns"]),mini["checksum"],scan))
              print(f"{d} run={i} median_ns={mini['median_ns']} scan_inst={scan['instructions']} moves={scan['moves']} stack_mem={scan['stack_memory']}")
          assert len({x[2] for x in runs})==1, "baseline/proposed checksum drift"
          assert runs[0][3]==runs[1][3], "unexpected scan mix drift in pure refactor"
          for d in ("baseline","proposed"):
              vals=[r[1] for r in runs if r[0]==d]
              print(f"{d} mean_median_ns={statistics.mean(vals):.1f}")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shared-compare-use-pinned-a-b
          path: ${{ runner.temp }}/compare-ab-*.log
          if-no-files-found: ignore
