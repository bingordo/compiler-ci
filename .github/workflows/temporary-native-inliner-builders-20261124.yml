# One-time source-pinned validation for TypeId-only inliner test inputs.
name: Temporary native inliner builder migration
on:
  pull_request:
    paths:
      - '.github/workflows/temporary-native-inliner-builders-20261124.yml'
permissions:
  contents: read
jobs:
  inliner-native-builders:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      SOURCE_SHA: 623e4d57f04406a6ffc1a65e16c782182cc77b31
      CARGO_INCREMENTAL: '0'
      CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
    steps:
      - name: Checkout pinned compiler SHA
        uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: ${{ env.SOURCE_SHA }}
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Check source and isolate core workspace
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C compiler rev-parse HEAD)" = "$SOURCE_SHA"
          cat > compiler/Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir", "crates/opt", "crates/backend", "crates/backend-x86", "crates/backend-aarch64"]
          EOF
          rm -f compiler/Cargo.lock
          rustc --version
      - name: Cache isolated Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: temporary-native-inline-builders
      - name: Run both full inliner suites and neighbor TypeId regressions
        shell: bash
        working-directory: compiler
        run: |
          set -euo pipefail
          cargo test -p compiler-opt --test typed_inline_leaf_native -- --nocapture
          cargo test -p compiler-opt --test typed_inline_cfg_native -- --nocapture
          cargo test -p compiler-opt --test typed_inline_postopt_native_trial -- --nocapture
          cargo test -p compiler-opt --test native_v3_fixture_inventory -- --nocapture
      - name: Focused test Clippy
        shell: bash
        working-directory: compiler
        run: |
          set -euo pipefail
          cargo clippy -p compiler-opt --test typed_inline_leaf_native --test typed_inline_cfg_native -- -D clippy::all -A clippy::empty_line_after_doc_comments -A clippy::collapsible_match -A clippy::collapsible_if -A clippy::needless_range_loop -A clippy::needless_borrows_for_generic_args
