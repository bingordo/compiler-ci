name: LTO PR2988 native multi-group ELF
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/lto-native-multi-group-pr2988-20261123.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-multigroup:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      SOURCE_SHA: e44924db2f5a492cd38c82a933063beaf2b9fb76
      CARGO_INCREMENTAL: '0'
      CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: ${{ env.SOURCE_SHA }}
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Verify source SHA
        shell: bash
        run: test "$(git -C compiler rev-parse HEAD)" = "$SOURCE_SHA"
      - name: Private dependency SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.CI_KEY }}
      - name: Rust build cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: lto-pr2988-native-elf
      - name: Check native ELF composer and x86 backend
        working-directory: compiler
        shell: bash
        run: |
          set -euo pipefail
          cargo check -p compiler-backend -p compiler-backend-x86
          cargo test -p compiler-ir --test lto_target_envelope -- --nocapture
          cargo test -p compiler-lto-plugin-core --test comdat_single_function_gnu multi_group_typeid_source_emits_two_independent_native_comdat_objects -- --nocapture
