name: TEMP FP5 AArch64 native mixed FP direct-call C differential
on:
  pull_request:
    paths:
      - '.github/workflows/temp-fp5-aarch64-direct-calls-20261122.yml'
permissions:
  contents: read
jobs:
  a64-fp-call:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: f2c9fb5f567b53d92d9c03ccf56fc3d93b78c3e9
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Verify exact source SHA
        working-directory: compiler
        run: test "$(git rev-parse HEAD)" = "f2c9fb5f567b53d92d9c03ccf56fc3d93b78c3e9"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Isolate AArch64 backend workspace
        run: |
          set -euo pipefail
          mkdir -p a64/crates
          cp -a compiler/crates/ir compiler/crates/backend compiler/crates/backend-aarch64 a64/crates/
          cat > a64/Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir","crates/backend","crates/backend-aarch64"]
          EOF
      - name: All target warnings denied check
        working-directory: a64
        run: RUSTFLAGS="-D warnings" cargo check -p compiler-backend-aarch64 --all-targets
      - name: Strict Clippy library and all five FP oracles
        working-directory: a64
        run: |
          cargo clippy -p compiler-backend-aarch64 --lib -- -D warnings
          cargo clippy -p compiler-backend-aarch64 --test typeid_fp_direct_call_native -- -D warnings
          cargo clippy -p compiler-backend-aarch64 --test typeid_fp_mixed_entry_native -- -D warnings
          cargo clippy -p compiler-backend-aarch64 --test typeid_fp_cfg_native -- -D warnings
          cargo clippy -p compiler-backend-aarch64 --test typeid_fp_compare_native -- -D warnings
          cargo clippy -p compiler-backend-aarch64 --test typeid_fp_native -- -D warnings
      - name: 20480 native C11/GCC fixed external calls including FP live through call
        working-directory: a64
        run: cargo test -p compiler-backend-aarch64 --test typeid_fp_direct_call_native -- --nocapture
      - name: Prior 57344 mixed GP FP entry ABI differential
        working-directory: a64
        run: cargo test -p compiler-backend-aarch64 --test typeid_fp_mixed_entry_native -- --nocapture
      - name: Prior 24576 native FP CFG PHI differential
        working-directory: a64
        run: cargo test -p compiler-backend-aarch64 --test typeid_fp_cfg_native -- --nocapture
      - name: Prior 114688 NaN predicate C11 differential
        working-directory: a64
        run: cargo test -p compiler-backend-aarch64 --test typeid_fp_compare_native -- --nocapture
      - name: Prior 53248 FP arithmetic and exact constants oracle
        working-directory: a64
        run: cargo test -p compiler-backend-aarch64 --test typeid_fp_native -- --nocapture
      - name: Full native AArch64 backend all-target regression suite
        working-directory: a64
        run: cargo test -p compiler-backend-aarch64 --all-targets -- --test-threads=1
