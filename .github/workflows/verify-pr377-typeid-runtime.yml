# External exact-commit TypeId-validated native runtime gate, compiler PR #377.
name: Verify PR377 generated native CFG runtime
on:
  push:
    branches: [ci/pr377-typeid-runtime]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 42dfd042650e02d3a4fe6915874c480294312e2f
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Verify immutable compiler revision
        run: test "$(git -C compiler rev-parse HEAD)" = "42dfd042650e02d3a4fe6915874c480294312e2f"
      - name: Use self-contained compiler core and native workspace
        run: |
          cat > compiler/Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir", "crates/opt", "crates/backend", "crates/backend-x86"]
          EOF
          rm -f compiler/Cargo.lock
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: typeid-runtime-pr377
          cache-workspace-crates: 'true'
      - name: Native TypeId checked generated CFGs against independent C in GAS and ELF
        working-directory: compiler
        run: cargo test -p compiler-backend-x86 --test typed_generated_cfg_native -- --nocapture
      - name: Complete four-crate core and native regressions
        working-directory: compiler
        run: cargo test -p compiler-ir -p compiler-opt -p compiler-backend -p compiler-backend-x86
      - name: Strict x86 Clippy all targets
        working-directory: compiler
        run: cargo clippy -p compiler-backend-x86 --all-targets -- -D warnings
