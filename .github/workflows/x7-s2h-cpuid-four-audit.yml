name: X7 S2H audit four pinned CPUID alternative discrepancies
on:
  push:
    branches: [feature/x7-s2h-cpuid-four-audit-20261114]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: x7-s2-pinned-intel-xed-variant-join
          run-id: 43634984478
          repository: bingordo/compiler-ci
          github-token: ${{ github.token }}
          path: /tmp/join
      - name: Identify exact source and XED feature group discrepancies
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          j=json.loads(Path('/tmp/join/join-1.json').read_text())
          mismatches=[]
          for f in j['forms']:
              for v in f['xed_variants']:
                  c=v['cpuid_alternatives_evidence']
                  if c['status']=='named_cpuid_alternatives_differ_review_only':
                      mismatches.append({'iform':f['xed_iform'],
                        'intel_iform_sha256':f['intel_iform_sha256'],
                        'xed_variant_sha256':v['variant_id'],
                        'source_group_names':c['source_group_names'],
                        'xed_group_names':c['xed_group_names'],
                        'alternatives':c['alternatives'],
                        'existing_exclusions':v['excluded'],
                        'original_join_status':f['join_status']})
          print('X7_S2H_CPUID_MISMATCH_COUNT',len(mismatches))
          for row in mismatches:
              print('X7_S2H_CPUID_MISMATCH',json.dumps(row,sort_keys=True))
          assert len(mismatches)==4
          PY
