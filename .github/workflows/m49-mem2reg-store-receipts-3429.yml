name: M49 verified mem2reg checked store elimination receipts
on:
  pull_request:
    paths: ['.github/workflows/m49-mem2reg-store-receipts-3429.yml']
permissions:
  contents: read
jobs:
  provenance:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: afd027fb188a1ab1a7bff4aadbbed410d206ec67
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Resolve compiler Git dependencies
        run: git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
      - name: Source-pinned mem2reg mutation witnesses and full opt unit regressions
        working-directory: compiler
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "afd027fb188a1ab1a7bff4aadbbed410d206ec67"
          cd tools/mini-c-driver
          cargo test --test mem2reg_source_store_receipts -- --nocapture
          cargo test --test source_optimizer_receipts -- --nocapture
          cd ../..
          cargo test -p compiler-opt --lib
          cargo clippy -p compiler-opt --lib -- -D clippy::all
