name: Validate typed native-int arithmetic graph families PR2674
on:
  pull_request:
    paths:
      - '.github/workflows/native-int-arithmetic-graphs-pr2674.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  arithmetic-graph-families:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      CARGO_INCREMENTAL: '0'
      SOURCE_SHA: d09e3f7b68b3fbade34bb91cd0fc753910f84e36
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: d09e3f7b68b3fbade34bb91cd0fc753910f84e36
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Verify exact source and isolate optimizer
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C compiler rev-parse HEAD)" = "$SOURCE_SHA"
          cat > compiler/Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir", "crates/opt", "crates/backend", "crates/backend-x86"]
          EOF
          rm -f compiler/Cargo.lock
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: native-int-seeded-generator
      - name: Run both original five-width arithmetic suites and negative oracles
        working-directory: compiler
        shell: bash
        run: |
          set -euo pipefail
          cargo test -p compiler-opt --test generated_native_matchpd_arithmetic_s2320 -- --nocapture
          cargo test -p compiler-opt --test generated_native_disjoint_arithmetic_s2323 -- --nocapture
      - name: Focused Clippy, unrelated upstream warnings exempt
        working-directory: compiler
        run: cargo clippy -p compiler-opt --test generated_native_matchpd_arithmetic_s2320 --test generated_native_disjoint_arithmetic_s2323 -- -D warnings -A dead-code -A clippy::empty-line-after-doc-comments -A unused-imports -A clippy::too-many-arguments
