name: X7 physical default-vs-generated logic A/B
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/x7-physical-logic-ab-20261124.yml'
      - 'scripts/x7_logic_physical_ab.py'
permissions:
  contents: read
jobs:
  compare-native-logic:
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    env:
      CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 7b986e93d92f6200d98ad292cf8f1afa92a9605a
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Pin exact merged compiler and toolchain
        run: |
          set -euo pipefail
          test "$(git -C compiler rev-parse HEAD)" = 7b986e93d92f6200d98ad292cf8f1afa92a9605a
          git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
          git config --global --add url."https://github.com/".insteadOf "git@github.com:"
          rustc --version
          cc --version | head -1
          nm --version | head -1
      - name: Verify fresh IP11 Z3 proofs and exact source/XED-generated certificates
        working-directory: compiler
        run: |
          set -euo pipefail
          if ! command -v z3 >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y z3
          fi
          python3 tools/x7_ip11_surviving_not_and_xor.py --check
          python3 tools/x7_instruction_driven_dag.py --check
          python3 -m unittest discover -s tools -p 'test_x7_instruction_driven_dag.py' -v
          python3 -m unittest discover -s tools -p 'test_x7_ip8_experimental_dag_certificates.py' -v
          python3 tools/x7_ip8_experimental_dag_certificates.py --check
          cargo test -p compiler-backend-x86 --lib --features x7-production-generated-logic \
            ip11_production_surviving_not_xor_selects_and32_and64_without_bypassing_uses -- --nocapture
          cargo test -p compiler-backend-x86 --lib --features x7-production-generated-logic \
            instruction_driven_ip12_selects_six_source_proven_results_and_rejects_shared_inputs -- --nocapture
          cargo test -p compiler-backend-x86 --lib --features x7-production-generated-logic \
            production_gate_replaces_all_eight_logic_shapes_and_preserves_shared_uses -- --nocapture
          cargo test -p compiler --test x7_production_generated_logic \
            --features compiler-backend-x86/x7-production-generated-logic -- --nocapture
      - name: Build exact default and opt-in production compiler binaries
        working-directory: compiler
        run: |
          set -euo pipefail
          cargo build -p compiler --bin compiler
          cp target/debug/compiler "$RUNNER_TEMP/x7-default"
          cargo build -p compiler --bin compiler --features compiler-backend-x86/x7-production-generated-logic
          cp target/debug/compiler "$RUNNER_TEMP/x7-logic"
      - name: Compare physical x86 output across 16 ABI and emitter configurations
        working-directory: compiler
        run: |
          set -euo pipefail
          python3 ../scripts/x7_logic_physical_ab.py --baseline "$RUNNER_TEMP/x7-default" --candidate "$RUNNER_TEMP/x7-logic"
      - name: Identify real-source IR shapes and emitted instruction sequences
        working-directory: compiler
        run: |
          set -euo pipefail
          python3 ../scripts/x7_logic_source_shapes.py --compiler "$RUNNER_TEMP/x7-logic"
