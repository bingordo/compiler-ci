name: Validate declarative complement-mask graphs PR2687
on:
  pull_request:
    paths:
      - '.github/workflows/native-int-complement-mask-pr2687.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  complement-mask:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      CARGO_INCREMENTAL: '0'
      SOURCE_SHA: 5d2202f469eaebf7938ea9b0d346242862c32b09
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 5d2202f469eaebf7938ea9b0d346242862c32b09
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Verify source pin and isolate optimizer workspace
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C compiler rev-parse HEAD)" = "$SOURCE_SHA"
          cat > compiler/Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir", "crates/opt", "crates/backend", "crates/backend-x86"]
          EOF
          rm -f compiler/Cargo.lock
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: native-int-seeded-generator
      - name: Run complete S23.26 generated differential and rollback tests
        working-directory: compiler
        shell: bash
        run: |
          set -euo pipefail
          cargo test -p compiler-opt --test generated_native_complement_mask_s2326 -- --nocapture
      - name: Strict focused Clippy with unrelated upstream lint exemptions
        working-directory: compiler
        run: cargo clippy -p compiler-opt --test generated_native_complement_mask_s2326 -- -D warnings -A dead-code -A clippy::empty-line-after-doc-comments -A unused-imports -A clippy::too-many-arguments
