name: EDG C++5 native scope asm provenance (source-pinned)

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/verify-edg-cxx5-native-scope-asm-20261115.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: edg-cxx5-native-scope-asm
  cancel-in-progress: true

jobs:
  native-scope-asm:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    container:
      image: ghcr.io/edgcpp/ci-runner@sha256:14b3948c2ce12cfa5472e5a6c468393d15426f3a67685cc35d830ea5db2acdf8
    defaults:
      run:
        shell: edg-container-exec "bash -eo pipefail {0}"
    env:
      EDG_BRIDGE_SHA: 37bfda14b81ab8fc66d49fe1ddaff0ca6b777c64
      EDG_SOURCE_SHA: b195677be8b9b56c8337afad6be8064d21a54082
      EDG_RELEASE_TAG: edgcpfe-v2026.11.14-upstream-177765bb7731
      EDG_RELEASE_SHA256: 1ce495b629924f31382ecccc891a7a72caae1014ddfa2ba7dd39b44d8b0a9526
      RUST_TOOLCHAIN_VERSION: 1.99.1
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'

    steps:
      - name: Checkout the exact EDG Rust patch
        uses: actions/checkout@v4
        with:
          repository: bingordo/edgcpp-rust
          ref: 37bfda14b81ab8fc66d49fe1ddaff0ca6b777c64
          path: edgcpp-rust
          persist-credentials: false

      - name: Checkout exact EDG headers
        uses: actions/checkout@v4
        with:
          repository: bingundu/edgcpp
          ref: b195677be8b9b56c8337afad6be8064d21a54082
          path: edgcpp
          persist-credentials: false

      - name: Assert source pins and configure EDG metadata
        working-directory: edgcpp
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EDG_SOURCE_SHA"
          test "$(git -C ../edgcpp-rust rev-parse HEAD)" = "$EDG_BRIDGE_SHA"
          export EDG_BASE="$GITHUB_WORKSPACE/edgcpp/bases/docker/dev-env/gcc"
          cmake --preset linux-gcc-release -DEDG_BUILD_LIB=OFF -DEDG_BUILD_CALLABLE_LIBRARY=ON -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
          cmake --build build/gcc-release --target error-info --parallel 2
          test -s build/gcc-release/src/includes/err_codes.h
          test -s build/gcc-release/src/includes/err_data.h

      - name: Verify and install exact prebuilt EDG callable archive
        working-directory: edgcpp
        run: |
          set -euo pipefail
          mkdir -p build/gcc-release/lib build/prebuilt-edg
          curl --proto '=https' --tlsv1.2 --fail --location --silent --show-error --retry 4 --retry-delay 2             "https://github.com/bingundu/edgcpp/releases/download/$EDG_RELEASE_TAG/edgcpfe-ci-upstream-callable-edg-release-20261114-linux-x86_64.tar.gz"             -o build/prebuilt-edg/archive.tar.gz
          printf '%s  %s\n' "$EDG_RELEASE_SHA256" build/prebuilt-edg/archive.tar.gz | sha256sum -c -
          tar -xzf build/prebuilt-edg/archive.tar.gz -C build/prebuilt-edg
          grep -Fx "commit=$EDG_SOURCE_SHA" build/prebuilt-edg/BUILD-INFO.txt
          grep -Fx 'platform=linux-x86_64' build/prebuilt-edg/BUILD-INFO.txt
          test -s build/prebuilt-edg/lib/libedgcpfe.a
          cp build/prebuilt-edg/lib/libedgcpfe.a build/gcc-release/lib/libedgcpfe.a

      - name: Install pinned Rust toolchain
        run: |
          set -euo pipefail
          if ! command -v cargo >/dev/null; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs |               sh -s -- -y --profile minimal --default-toolchain "$RUST_TOOLCHAIN_VERSION"
          fi
          export PATH="$HOME/.cargo/bin:$PATH"
          rustup toolchain install "$RUST_TOOLCHAIN_VERSION" --profile minimal
          rustup default "$RUST_TOOLCHAIN_VERSION"

      - name: Test exact startup roots and call evidence
        working-directory: edgcpp-rust
        run: |
          set -euo pipefail
          export PATH="$HOME/.cargo/bin:$PATH"
          export EDGCPP_SOURCE_DIR="$GITHUB_WORKSPACE/edgcpp"
          export EDGCPP_COMPILE_COMMANDS="$GITHUB_WORKSPACE/edgcpp/build/gcc-release/compile_commands.json"
          export EDGCPP_LIB_DIR="$GITHUB_WORKSPACE/edgcpp/build/gcc-release/lib"
          export EDGCPP_EDG_REVISION="$EDG_SOURCE_SHA"
          python3 tools/gen_wire_schema.py --check
          cargo test --features codegen --lib startup_provenance::tests -- --nocapture
          cargo test --features codegen --lib native_scope_asm_wire_tests -- --nocapture
          cargo test --features codegen --lib file_scope_init_schedule_wire_tests -- --nocapture
          cargo test --features codegen --lib file_scope_lowered_startup_wire_tests -- --nocapture
          cargo test --features codegen --lib file_scope_runtime_link_wire_tests -- --nocapture
          cargo test --features codegen --test native_backend_contract -- --nocapture
          cargo build --example parse
          echo 'EDG C++5 generated startup immediate-call tests passed on pinned source' >>"$GITHUB_STEP_SUMMARY"

      - name: Source-owned native startup call evidence from effectful C++ global
        working-directory: edgcpp/build/gcc-release
        run: |
          set -euo pipefail
          source environment.sh
          fixture="$GITHUB_WORKSPACE/edgcpp-rust/tests/fixtures/cxx5_global_init_owner.cpp"
          cp "$fixture" global-init-owner.cpp
          version="$(g++ -dumpfullversion -dumpversion)"
          IFS=. read -r major minor patch <<<"$version"
          gnu_number=$((10#$major*10000+10#${minor:-0}*100+10#${patch:-0}))
          "$GITHUB_WORKSPACE/edgcpp-rust/target/debug/examples/parse" \
            --g++ --c++17 --no_strict_gnu --gnu_version "$gnu_number" \
            global-init-owner.cpp >"$RUNNER_TEMP/edg-cxx5-startup-owner.log" 2>&1
          grep -Fq 'EDG status: 0' "$RUNNER_TEMP/edg-cxx5-startup-owner.log"
          grep -Eq '^EDG_CXX5_STARTUP_EVIDENCE roots=[1-9][0-9]* calls=[0-9]+ executable_schedule_proven=false$' "$RUNNER_TEMP/edg-cxx5-startup-owner.log"
          grep -F 'EDG_CXX5_STARTUP_ROOT_SOURCE' "$RUNNER_TEMP/edg-cxx5-startup-owner.log" | head -n 12
          grep -F 'EDG_CXX5_INIT_OWNER_CENSUS ' "$RUNNER_TEMP/edg-cxx5-startup-owner.log"
          grep -F 'EDG_CXX5_DYNAMIC_OWNER ' "$RUNNER_TEMP/edg-cxx5-startup-owner.log" | head -n 20 || true
          grep -F 'EDG_CXX5_STARTUP_CALL' "$RUNNER_TEMP/edg-cxx5-startup-owner.log" | head -n 24 || true
          ! grep -Fq 'executable_schedule_proven=true' "$RUNNER_TEMP/edg-cxx5-startup-owner.log"
          echo "EDG_CXX5_STARTUP native_effectful_owner=result_provenance_pass no_elf_admission=true" >>"$GITHUB_STEP_SUMMARY"

      - name: Original GCC C++17 iostream source startup provenance (no ELF admission)
        working-directory: edgcpp/build/gcc-release
        run: |
          set -euo pipefail
          source environment.sh
          cat >original-iostream.cpp <<'CPP'
          #include <iostream>
          int main() { std::cout << "Hello, world!" << std::endl; }
          CPP
          g++ -std=c++17 -v -E -x c++ /dev/null >"$RUNNER_TEMP/edg-cxx5-include-search.log" 2>&1
          mapfile -t include_dirs < <(awk '
            /#include <\.\.\.> search starts here:/{active=1;next}
            /^End of search list/{active=0}
            active && /^ /{sub(/^[[:space:]]+/,"");print}
          ' "$RUNNER_TEMP/edg-cxx5-include-search.log")
          test "${#include_dirs[@]}" -ge 3
          include_flags=()
          for dir in "${include_dirs[@]}"; do
            if test -d "$dir"; then include_flags+=("-I$dir"); fi
          done
          version="$(g++ -dumpfullversion -dumpversion)"
          IFS=. read -r major minor patch <<<"$version"
          gnu_number=$((10#$major*10000+10#${minor:-0}*100+10#${patch:-0}))
          "$GITHUB_WORKSPACE/edgcpp-rust/target/debug/examples/parse" \
            --g++ --c++17 --no_strict_gnu --gnu_version "$gnu_number" \
            "${include_flags[@]}" original-iostream.cpp >"$RUNNER_TEMP/edg-cxx5-original-iostream.log" 2>&1
          grep -Fq 'EDG status: 0' "$RUNNER_TEMP/edg-cxx5-original-iostream.log"
          grep -F 'EDG_CXX5_STARTUP_EVIDENCE ' "$RUNNER_TEMP/edg-cxx5-original-iostream.log" | head -n 1
          grep -F 'EDG_CXX5_INIT_OWNER_CENSUS ' "$RUNNER_TEMP/edg-cxx5-original-iostream.log" | tee -a "$GITHUB_STEP_SUMMARY"
          grep -F 'EDG_CXX5_SCOPE_ASM count=' "$RUNNER_TEMP/edg-cxx5-original-iostream.log" | tee -a "$GITHUB_STEP_SUMMARY"
          grep -F 'EDG_CXX5_SCOPE_ASM_ENTRY' "$RUNNER_TEMP/edg-cxx5-original-iostream.log" | head -n 12 | tee -a "$GITHUB_STEP_SUMMARY"
          grep -F 'EDG_CXX5_SCOPE_ASM_ENTRY' "$RUNNER_TEMP/edg-cxx5-original-iostream.log" |
            grep -Fq '.globl _ZSt21ios_base_library_initv'
          grep -F 'EDG_CXX5_MATERIALIZED_GLOBAL ' "$RUNNER_TEMP/edg-cxx5-original-iostream.log" | tee -a "$GITHUB_STEP_SUMMARY"
          grep -F 'EDG_CXX5_IOINIT_SYMBOL ' "$RUNNER_TEMP/edg-cxx5-original-iostream.log" | head -n 16 || true
          grep -F 'EDG_CXX5_DYNAMIC_OWNER ' "$RUNNER_TEMP/edg-cxx5-original-iostream.log" | head -n 40 || true
          grep -Fq 'executable_schedule_proven=false' "$RUNNER_TEMP/edg-cxx5-original-iostream.log"
          # Independent G++ object is an oracle, not a source for inferred EDG roots.
          g++ -std=c++17 -c original-iostream.cpp -o "$RUNNER_TEMP/edg-cxx5-original-gxx.o"
          nm -aC "$RUNNER_TEMP/edg-cxx5-original-gxx.o" >"$RUNNER_TEMP/edg-cxx5-original-gxx-symbols.txt"
          grep -E '(ios_base::Init|__ioinit|_GLOBAL__sub_I_)' "$RUNNER_TEMP/edg-cxx5-original-gxx-symbols.txt" | head -n 32 | tee -a "$GITHUB_STEP_SUMMARY" || true
          # GCC 15 may use library-level initialization without TU-local
          # __ioinit or _GLOBAL__sub_I_ symbols. Log evidence, do not invent it.
          sed -n '1,40p' "$RUNNER_TEMP/edg-cxx5-original-gxx-symbols.txt" | tee -a "$GITHUB_STEP_SUMMARY"
          readelf -SW "$RUNNER_TEMP/edg-cxx5-original-gxx.o" >"$RUNNER_TEMP/edg-cxx5-original-gxx-sections.txt"
          readelf -rW "$RUNNER_TEMP/edg-cxx5-original-gxx.o" >"$RUNNER_TEMP/edg-cxx5-original-gxx-relocations.txt"
          grep -E '(\.init_array|\.ctors|\.fini_array)' "$RUNNER_TEMP/edg-cxx5-original-gxx-sections.txt" | head -n 24 | tee -a "$GITHUB_STEP_SUMMARY" || true
          grep -E '(init_array|__cxa_atexit|_ZStL8__ioinit|_GLOBAL__sub_I_)' "$RUNNER_TEMP/edg-cxx5-original-gxx-relocations.txt" | head -n 24 | tee -a "$GITHUB_STEP_SUMMARY" || true
          for dir in "${include_dirs[@]}"; do
            if test -f "$dir/iostream"; then
              echo "EDG_GNU_IOSTREAM_ORACLE header=$dir/iostream" | tee -a "$GITHUB_STEP_SUMMARY"
              grep -nE '(__ioinit|ios_base::Init|init_priority)' "$dir/iostream" | head -n 24 | tee -a "$GITHUB_STEP_SUMMARY" || true
              break
            fi
          done
          # Verify the active GCC 15 configuration selects library-level
          # iostream initialization (rather than TU-local __ioinit).
          cat >"$RUNNER_TEMP/edg-cxx5-priority-mode.cpp" <<'CPP'
          #include <iostream>
          #if !(_GLIBCXX_USE_INIT_PRIORITY_ATTRIBUTE && __has_attribute(__init_priority__))
          #error Expected GCC15 libstdc++ library-level iostream initialization
          #endif
          int main() { return 0; }
          CPP
          g++ -std=c++17 -fsyntax-only "$RUNNER_TEMP/edg-cxx5-priority-mode.cpp"
          g++ -std=c++17 original-iostream.cpp -o "$RUNNER_TEMP/edg-cxx5-original-gxx"
          timeout 15s "$RUNNER_TEMP/edg-cxx5-original-gxx" >"$RUNNER_TEMP/edg-cxx5-original-gxx.out"
          printf 'Hello, world!\n' >"$RUNNER_TEMP/edg-cxx5-original-gxx.expected"
          test "$(sha256sum "$RUNNER_TEMP/edg-cxx5-original-gxx.expected" | cut -d' ' -f1)" = \
               "$(sha256sum "$RUNNER_TEMP/edg-cxx5-original-gxx.out" | cut -d' ' -f1)"
          # GCC15's iostream header provides a linker-level reference to
          # library initialization instead of a TU-local __ioinit object.
          grep -Fq ' U std::ios_base_library_init()' "$RUNNER_TEMP/edg-cxx5-original-gxx-symbols.txt"
          echo 'EDG_GNU_IOSTREAM_ORACLE library_init_priority_mode=true gcc_reference_hello_world=pass' >>"$GITHUB_STEP_SUMMARY"
          grep -E '^EDG_CXX5_STARTUP_(ROOT_SOURCE|CALL) ' "$RUNNER_TEMP/edg-cxx5-original-iostream.log" | head -n 32 || true
          ! grep -Fq 'executable_schedule_proven=true' "$RUNNER_TEMP/edg-cxx5-original-iostream.log"
          echo 'EDG_CXX5_STARTUP original_iostream=source_diagnostic_pass no_elf_admission=true' >>"$GITHUB_STEP_SUMMARY"

      - name: Native file-scope asm declaration control (no assembly execution)
        working-directory: edgcpp/build/gcc-release
        run: |
          set -euo pipefail
          source environment.sh
          cat >native-asm-control.cpp <<'CPP'
          asm(".globl edg_cxx5_asm_control_symbol");
          int main() { return 0; }
          CPP
          version="$(g++ -dumpfullversion -dumpversion)"
          IFS=. read -r major minor patch <<<"$version"
          gnu_number=$((10#$major*10000+10#${minor:-0}*100+10#${patch:-0}))
          "$GITHUB_WORKSPACE/edgcpp-rust/target/debug/examples/parse" \
            --g++ --c++17 --no_strict_gnu --gnu_version "$gnu_number" \
            native-asm-control.cpp >"$RUNNER_TEMP/edg-cxx5-native-asm-control.log" 2>&1
          grep -Fq 'EDG status: 0' "$RUNNER_TEMP/edg-cxx5-native-asm-control.log"
          grep -F 'EDG_CXX5_SCOPE_ASM_ENTRY' "$RUNNER_TEMP/edg-cxx5-native-asm-control.log" |
            grep -Fq '.globl edg_cxx5_asm_control_symbol'
          echo 'EDG_CXX5_NATIVE_SCOPE_ASM user_directive=preserved iostream_link_anchor=preserved diagnostic_only=true' >>"$GITHUB_STEP_SUMMARY"
