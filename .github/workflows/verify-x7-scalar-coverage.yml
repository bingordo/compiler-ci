name: X7 scoped scalar coverage
on:
  pull_request:
    paths: ['.github/workflows/verify-x7-scalar-coverage.yml']
permissions:
  contents: read
  actions: read
jobs:
  scoped-coverage:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: bfdbdf069bc23a995434c0918d6259ccfa20fed8
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Reuse audited original-source census (before signed/saturation batch)
        uses: actions/download-artifact@v4
        with:
          name: x7-full-semantic-census
          run-id: 46093056157
          github-token: ${{ github.token }}
          path: /tmp/x7-census
      - name: Validate conservative scalar shape classification and scoped census
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = bfdbdf069bc23a995434c0918d6259ccfa20fed8
          python3 -m unittest discover -s tools -p test_x7_scalar_scope_coverage.py -v
          python3 -m unittest discover -s tools -p test_x7_cross_scope_coverage.py -v
          python3 tools/x7_scalar_scope_coverage.py --index /tmp/x7-census/index.json --census /tmp/x7-census/{8,16,32,64}-scalar.json --out /tmp/x7-scalar-coverage.json
      - uses: actions/upload-artifact@v4
        with:
          name: x7-scalar-coverage
          path: /tmp/x7-scalar-coverage.json
