name: M4.2 module initializers
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/m42-module-initializers.yml
permissions:
  contents: read
concurrency:
  group: m42-module-init
  cancel-in-progress: true
jobs:
  module-initializers:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: feature/m42-module-initializers
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: bingordo/oberon
          ref: feature/m42-module-initializers
          path: oberon
          fetch-depth: 0
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Exact revisions
        run: |
          git -C compiler rev-parse HEAD
          git -C oberon rev-parse HEAD
      - name: Checked frontend and native compiler constructors
        shell: bash
        env:
          CARGO_NET_GIT_FETCH_WITH_CLI: "true"
        run: |
          set -euo pipefail
          git config --global url."file://$GITHUB_WORKSPACE/oberon".insteadOf "ssh://git@github.com/bingordo/oberon.git"
          cargo test --manifest-path oberon/oberon/Cargo.toml -p oberon-front-ir
          cargo test --manifest-path compiler/Cargo.toml -p compiler-ir -p compiler-opt -p compiler-backend-x86 -p compiler
