name: IR binary layout admission
on:
  push:
    branches: [verify/ir-layout-admission-20261114]
    paths:
      - '.github/workflows/ir-layout-admission-20261114.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: ac8d41971314853c71e5e3d16ea6642fbc970bf6
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Verify pinned source SHA
        run: test "$(git -C compiler rev-parse HEAD)" = "ac8d41971314853c71e5e3d16ea6642fbc970bf6"
      - name: Restrict workspace to IR crate
        run: |
          cat > compiler/Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir"]
          EOF
          rm -f compiler/Cargo.lock
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: ir-layout-admission
      - name: Test layout preflight, binary codec, and full IR suite
        working-directory: compiler
        run: |
          cargo test -p compiler-ir --test native_binary_layout_admission
          cargo test -p compiler-ir --test native_binary_v1
          cargo test -p compiler-ir --test native_binary_corruption_matrix
          cargo test -p compiler-ir
          cargo clippy -p compiler-ir --tests -- -D warnings
