name: Temporary mixed GP FP emission order #3715
on:
  pull_request:
    paths: ['.github/workflows/temp-mixed-emission-order-3715.yml']
permissions:
  contents: read
jobs:
  mixed:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      SOURCE_SHA: 90660f9a1e69ef5c0b8db9732070b1eec7ca04e2
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: ${{ env.SOURCE_SHA }}
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.CI_KEY }}
      - name: Trust GitHub for frontend dependency fetches
        run: ssh-keyscan github.com >> ~/.ssh/known_hosts
      - name: Verify mixed TypeId GP FP ordering and GCC interop
        working-directory: compiler
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          cargo test -p compiler-backend-x86 --test mixed_typeid_product_gcc -- --nocapture
