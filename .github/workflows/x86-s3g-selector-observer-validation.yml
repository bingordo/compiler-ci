name: X7 S3.G observed selector accept, reject and fallback
on:
  pull_request:
    paths:
      - '.github/workflows/x86-s3g-selector-observer-validation.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  x7-s3g-selector:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      SOURCE_SHA: '7f9fa8c42461e29baee56989760127f7da83a5b8'
    steps:
      - name: Exact compiler source (only compiler-ci Actions)
        uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 7f9fa8c42461e29baee56989760127f7da83a5b8
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false

      - name: Download final original real Intel/XED effect source certificate
        uses: actions/download-artifact@v4
        with:
          name: x7-s3f-source-xed-flag-effect-no-admission
          run-id: 43667287999
          repository: bingordo/compiler-ci
          github-token: ${{ github.token }}
          path: /tmp/x7-s3g-s3f

      - name: Prepare offline native TypeId and reviewed machine test crates
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C compiler rev-parse HEAD)" = "$SOURCE_SHA"
          test -s /tmp/x7-s3g-s3f/source-xed-effects.json
          mkdir -p /tmp/x7-s3g
          cd compiler
          python3 - <<'PY'
          from pathlib import Path
          Path("Cargo.toml").write_text("""[workspace]
          resolver = "2"
          members = ["crates/ir", "crates/opt", "crates/backend", "crates/backend-x86"]
          """)
          PY
          PYTHONPATH=tools python3 -m unittest -v test_x86_s3g_selector_decision_join
          python3 -m compileall -q tools/x86_s3g_selector_decision_join.py

      - name: Observe actual accepted and refused reviewed forms with features ON
        shell: bash
        run: |
          set -euo pipefail
          cd compiler
          cargo test -p compiler-backend-x86 \
            --features 'x7-c-defined-bitwise x7-c-defined-64' \
            --test x7_s3g_selector_decisions --offline -- --nocapture \
            2>&1 | tee /tmp/x7-s3g/feature-on.log
          cargo test -p compiler-backend-x86 \
            --features 'x7-c-defined-bitwise x7-c-defined-64' \
            --lib x7_late_selector --offline

      - name: Observe actual fallback and source SHA when feature gates are OFF
        shell: bash
        run: |
          set -euo pipefail
          cd compiler
          cargo test -p compiler-backend-x86 --no-default-features \
            --features x7-native-form-validation \
            --test x7_s3g_selector_decisions --offline -- --nocapture \
            2>&1 | tee /tmp/x7-s3g/feature-off.log

      - name: Bind actual selected source SHA to S3.F and reject invented evidence
        shell: bash
        run: |
          set -euo pipefail
          cd compiler
          python3 tools/x86_s3g_selector_decision_join.py \
            --s3f /tmp/x7-s3g-s3f/source-xed-effects.json \
            --enabled-log /tmp/x7-s3g/feature-on.log \
            --disabled-log /tmp/x7-s3g/feature-off.log \
            --out /tmp/x7-s3g/real-selector-decisions.json
          python3 tools/x86_s3g_selector_decision_join.py \
            --s3f /tmp/x7-s3g-s3f/source-xed-effects.json \
            --enabled-log /tmp/x7-s3g/feature-on.log \
            --disabled-log /tmp/x7-s3g/feature-off.log \
            --out /tmp/x7-s3g/real-selector-decisions.json --check
          python3 - <<'PY'
          import json
          r=json.load(open('/tmp/x7-s3g/real-selector-decisions.json'))
          assert r["feature_on_selected_source_bound_forms"]==6
          assert r["feature_off_selected_source_bound_forms"]==0
          assert r["total_observed_decisions"]==60
          assert r["production_selection_eligible"] is False
          assert r["newly_bulk_source_admitted_forms"]==0
          print("X7_S3G_OBSERVED_SOURCE_SHA_FALLBACK_PASS decisions=60 ISA_admitted=0")
          PY

      - name: Verify actual independent native TypeId GAS/ELF and opt-out regressions
        shell: bash
        run: |
          set -euo pipefail
          cd compiler
          cargo test -p compiler-backend-x86 \
            --features 'x7-c-defined-bitwise x7-c-defined-64' \
            --test x7_g10_n16_bitwise_native --offline
          cargo test -p compiler-backend-x86 \
            --features 'x7-c-defined-bitwise x7-c-defined-64' \
            --test x7_g10_n19_64_native --offline
          cargo test -p compiler-backend-x86 --no-default-features \
            --test x7_g10_n15_no_default_fallback --offline
          echo X7_S3G_NATIVE_TYPEID_GAS_ELF_FALLBACK_PASS

      - name: Archive observed source SHA decisions, not ISA admission
        uses: actions/upload-artifact@v4
        with:
          name: x7-s3g-actual-selector-decision-evidence
          path: |
            /tmp/x7-s3g/real-selector-decisions.json
            /tmp/x7-s3g/feature-on.log
            /tmp/x7-s3g/feature-off.log
          if-no-files-found: error
