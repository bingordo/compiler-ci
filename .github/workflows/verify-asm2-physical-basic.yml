name: ASM2 physical basic asm production byte gate
on:
  push:
    branches: [main]
    paths: ['.github/workflows/verify-asm2-physical-basic.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  physical:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 83e16c1df257f9f31df7fc4ce3b69989870869ea
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
          path: compiler
      - name: Verify exact pinned source
        run: test "$(git -C compiler rev-parse HEAD)" = '83e16c1df257f9f31df7fc4ce3b69989870869ea'
      - name: Build isolated compiler core
        working-directory: compiler
        run: |
          cat > Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir", "crates/opt", "crates/backend", "crates/backend-x86"]
          EOF
          rm -f Cargo.lock
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler
          key: asm2-physical-basic
      - name: Run physical ELF and independent GNU as oracle
        working-directory: compiler
        run: |
          set -euo pipefail
          cargo test -p compiler-backend-x86 --lib asm_basic -- --nocapture
          cargo test -p compiler-backend-x86 --test asm2_basic_physical -- --nocapture
          cargo test -p compiler-backend-x86 --test att_sse_evex_ternlog -- --nocapture
          cargo clippy -p compiler-backend-x86 --lib -- -D warnings
          echo "ASM2_PHYSICAL gate=PASS compiler=83e16c1df257f9f31df7fc4ce3b69989870869ea" >> "$GITHUB_STEP_SUMMARY"
