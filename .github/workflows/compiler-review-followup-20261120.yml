name: Compiler review follow-up corrections
on:
  push:
    branches: [ci/compiler-review-followup-20261120]
    paths: ['.github/workflows/compiler-review-followup-20261120.yml']
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        area: [driver, optimizer, generators, wasm]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      SOURCE_SHA: '646445d42a0c942b1fec5f353758637ce65458b9'
      CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: ${{ env.SOURCE_SHA }}
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Test exact revision
        working-directory: compiler
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
          case '${{ matrix.area }}' in
            driver)
              sudo apt-get update -qq
              sudo apt-get install -y -qq gcc-aarch64-linux-gnu qemu-user
              cargo test --manifest-path tools/mini-c-driver/Cargo.toml --lib
              cargo test -p compiler --bin compiler module_build::tests
              cargo test -p compiler --bin compiler graph_
              cargo test -p compiler --bin compiler mixed_lto_consumes_checked_snapshot_after_publication_changes
              cargo test -p compiler --test ir_default_cli aarch64_source_preprocessor_uses_selected_target
              cargo test -p compiler --test ir_default_cli defaults_to_typeid
              cargo test -p compiler --test ir_default_cli weak_source_calls_preserve_linker_override
              cargo test -p compiler --test ir_default_cli native_source_forms_one_past_local_array_address
              COMPILER_TEST_CROSS_ABI=1 cargo test -p compiler --test ir_default_cli native_bool_ingress_ignores_unspecified_upper_bits
              cargo test -p compiler --test ir_default_cli source_sidecar_and_interface_outputs_preserve_input_aliases
              cargo test -p compiler --test ir_default_cli pic_source_calls_honor_elf_interposition
              cargo test -p compiler --test ir_default_cli diagnostic_collisions_preserve_source_and_existing_artifacts
              python3 tools/review_coverage.py --check
              cargo test -p compiler --test lto_cli --test lto_mixed_link --test lto_ordered_build ;;
            optimizer)
              printf '[workspace]\nresolver = "2"\nmembers = ["crates/ir","crates/opt","crates/backend","crates/backend-x86"]\n' > Cargo.toml
              cargo test -p compiler-opt --test review_byte_phi_indirect_memory --test review_target_abi_pipeline
              cargo test -p compiler-ir --lib typed_module_abi
              cargo test -p compiler-backend --lib abi_ ;;
            wasm)
              cargo test -p compiler-backend-wasm ;;
            generators)
              export PYTHONPATH="$PWD/tools"
              python3 -m unittest tools/test_regen_x86_sse_evex_forms.py tools/test_regen_x86_sse_vex_forms.py tools/test_x7_s4_retirement_runtime_gate.py tools/test_x7_s4_executable_source_gate.py -v
              python3 tools/regen_x86_sse_evex_forms.py --check
              python3 tools/regen_x86_sse_vex_forms.py --check
              python3 -m unittest tools/test_regen_aarch64_native_selector_rules.py tools/test_regen_aarch64_scalar_gp_forms.py -v
              python3 tools/regen_aarch64_native_selector_rules.py --check
              python3 tools/regen_aarch64_scalar_gp_forms.py --check
              python3 tools/regen_riscv_native_selector_rules.py --check ;;
          esac
  startup-schedule-decoder:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    container:
      image: ghcr.io/edgcpp/ci-runner@sha256:14b3948c2ce12cfa5472e5a6c468393d15426f3a67685cc35d830ea5db2acdf8
    defaults:
      run:
        shell: edg-container-exec "bash -eo pipefail {0}"
    env:
      EDG_BRIDGE_SHA: 135cae8688452ca3132ad0c6cb39ec588b40fd8d
      EDG_SOURCE_SHA: b195677be8b9b56c8337afad6be8064d21a54082
      EDG_RELEASE_TAG: edgcpfe-v2026.11.14-upstream-177765bb7731
      EDG_RELEASE_SHA256: 1ce495b629924f31382ecccc891a7a72caae1014ddfa2ba7dd39b44d8b0a9526
      RUST_TOOLCHAIN_VERSION: 1.99.1
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'

    steps:
      - name: Checkout the exact EDG Rust patch
        uses: actions/checkout@v4
        with:
          repository: bingordo/edgcpp-rust
          ref: 135cae8688452ca3132ad0c6cb39ec588b40fd8d
          path: edgcpp-rust
          persist-credentials: false

      - name: Checkout exact EDG headers
        uses: actions/checkout@v4
        with:
          repository: bingundu/edgcpp
          ref: b195677be8b9b56c8337afad6be8064d21a54082
          path: edgcpp
          persist-credentials: false

      - name: Assert source pins and configure EDG metadata
        working-directory: edgcpp
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EDG_SOURCE_SHA"
          test "$(git -C ../edgcpp-rust rev-parse HEAD)" = "$EDG_BRIDGE_SHA"
          export EDG_BASE="$GITHUB_WORKSPACE/edgcpp/bases/docker/dev-env/gcc"
          cmake --preset linux-gcc-release -DEDG_BUILD_LIB=OFF -DEDG_BUILD_CALLABLE_LIBRARY=ON -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
          cmake --build build/gcc-release --target error-info --parallel 2
          test -s build/gcc-release/src/includes/err_codes.h
          test -s build/gcc-release/src/includes/err_data.h

      - name: Verify and install exact prebuilt EDG callable archive
        working-directory: edgcpp
        run: |
          set -euo pipefail
          mkdir -p build/gcc-release/lib build/prebuilt-edg
          curl --proto '=https' --tlsv1.2 --fail --location --silent --show-error --retry 4 --retry-delay 2             "https://github.com/bingundu/edgcpp/releases/download/$EDG_RELEASE_TAG/edgcpfe-ci-upstream-callable-edg-release-20261114-linux-x86_64.tar.gz"             -o build/prebuilt-edg/archive.tar.gz
          printf '%s  %s\n' "$EDG_RELEASE_SHA256" build/prebuilt-edg/archive.tar.gz | sha256sum -c -
          tar -xzf build/prebuilt-edg/archive.tar.gz -C build/prebuilt-edg
          grep -Fx "commit=$EDG_SOURCE_SHA" build/prebuilt-edg/BUILD-INFO.txt
          grep -Fx 'platform=linux-x86_64' build/prebuilt-edg/BUILD-INFO.txt
          test -s build/prebuilt-edg/lib/libedgcpfe.a
          cp build/prebuilt-edg/lib/libedgcpfe.a build/gcc-release/lib/libedgcpfe.a

      - name: Install pinned Rust toolchain
        run: |
          set -euo pipefail
          if ! command -v cargo >/dev/null; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs |               sh -s -- -y --profile minimal --default-toolchain "$RUST_TOOLCHAIN_VERSION"
          fi
          export PATH="$HOME/.cargo/bin:$PATH"
          rustup toolchain install "$RUST_TOOLCHAIN_VERSION" --profile minimal
          rustup default "$RUST_TOOLCHAIN_VERSION"

      - name: Check out the reviewed compiler revision
        uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 646445d42a0c942b1fec5f353758637ce65458b9
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false

      - name: Build and test EDG against the checked native callable
        working-directory: compiler
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "646445d42a0c942b1fec5f353758637ce65458b9"
          export PATH="$HOME/.cargo/bin:$PATH"
          export EDGCPP_SOURCE_DIR="$GITHUB_WORKSPACE/edgcpp"
          export EDGCPP_COMPILE_COMMANDS="$GITHUB_WORKSPACE/edgcpp/build/gcc-release/compile_commands.json"
          export EDGCPP_LIB_DIR="$GITHUB_WORKSPACE/edgcpp/build/gcc-release/lib"
          export EDGCPP_EDG_REVISION="$EDG_SOURCE_SHA"
          git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
          cargo test --manifest-path tools/edg-driver/Cargo.toml
          cargo build --manifest-path tools/edg-driver/Cargo.toml
          driver="$PWD/tools/edg-driver/target/debug/compiler-edg-driver"
          cd "$GITHUB_WORKSPACE/edgcpp/build/gcc-release"
          source environment.sh
          cat > review-kernel.c <<'C'
          static int leaf(int x) { return 2*x+3; }
          int answer(int x) { return leaf(x)+leaf(5); }
          C
          cat > review-caller.c <<'C'
          int answer(int);
          int main(void) { return (unsigned)answer(-7) & 255u; }
          C
          gcc -o review-gcc review-kernel.c review-caller.c
          expected=0
          ./review-gcc || expected=$?
          for mode in default leaves cfg; do
            options=()
            if [[ "$mode" != default ]]; then options+=("--typeid-inline=$mode"); fi
            "$driver" review-kernel.o "${options[@]}" --c11 review-kernel.c
            gcc -o review-edg review-kernel.o review-caller.c
            actual=0
            ./review-edg || actual=$?
            test "$actual" = "$expected"
          done

  depth-parent:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 2566df1809d0252ad25fd46cd24d46050784b8f4
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Validate the rebased depth-review parent
        working-directory: compiler
        shell: bash
        env:
          CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "2566df1809d0252ad25fd46cd24d46050784b8f4"
          git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc-riscv64-linux-gnu qemu-user
          cargo test -p compiler-ir
          cargo test -p compiler-backend-riscv64 --test leaf
          cargo test -p compiler-opt --test typed_pre_native --test typed_if_conversion_native
          cargo test -p compiler --test lto_mixed_link
          cargo test -p compiler --test ir_default_cli weak_source_calls_preserve_linker_override
          cargo test -p compiler --test ir_default_cli oberon
          python3 -m unittest discover -s tools -p test_review_coverage.py -v
          python3 tools/review_coverage.py --check
