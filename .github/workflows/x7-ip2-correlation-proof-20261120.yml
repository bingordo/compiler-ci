name: X7 IP2 source certificate correlation fail-closed acceptance
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/x7-ip2-correlation-proof-20261120.yml'
permissions:
  contents: read
jobs:
  x7-correlation:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 2d5e3dc3a3116eea62a370a0a9624852a2b21e7d
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Verify exact compiler candidate and install independent SMT
        run: |
          set -euo pipefail
          test "$(git -C compiler rev-parse HEAD)" = "2d5e3dc3a3116eea62a370a0a9624852a2b21e7d"
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends z3
          z3 -version
          python3 -m venv "$RUNNER_TEMP/x7-ip2-z3"
          "$RUNNER_TEMP/x7-ip2-z3/bin/python" -m pip install --disable-pip-version-check --quiet 'z3-solver==4.13.4.0'
          "$RUNNER_TEMP/x7-ip2-z3/bin/python" -c 'import z3; print("X7_Z3_VERSION", z3.get_version_string())'
      - name: IP2 equivalence, source proof, physical receipt and negative mutations
        run: |
          set -euo pipefail
          export PYTHONPATH="$PWD/compiler/tools"
          PY="$RUNNER_TEMP/x7-ip2-z3/bin/python"
          "$PY" -m compileall -q compiler/tools/x7_ip2_semantic_certificate_join.py compiler/tools/test_x7_ip2_semantic_certificate_join.py
          "$PY" -m unittest -v \
            test_x7_ip2_semantic_certificate_join \
            test_x7_ip2_ir_equivalence \
            test_x7_ip2_pure_dag_candidates \
            test_x7_ip2_source_verified_dag \
            test_x7_ip2_physical_receipt_join
      - name: Check generator never admits unreviewed ISA instructions
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          source=Path('compiler/tools/x7_ip2_semantic_certificate_join.py').read_text()
          assert 'production_selection_eligible": False' in source
          assert '"new_production_rules": 0' in source
          print('X7_IP2_CORRELATION_FAIL_CLOSED_SOURCE')
          PY
