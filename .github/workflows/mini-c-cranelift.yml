name: Mini-C Cranelift targeted validation
on:
  pull_request:
    paths:
      - '.github/workflows/mini-c-cranelift.yml'
  workflow_dispatch:
    inputs:
      full_workspace:
        description: 'Run the full Mini-C Rust workspace instead of targeted tests'
        type: boolean
        required: false
        default: false
      cpp_seed_count:
        description: 'Number of deterministic internal-CPP macro graphs (1-128)'
        type: number
        required: false
        default: 4
  schedule:
    - cron: '*/15 * * * *'
  push:
    paths:
      - '.github/workflows/mini-c-cranelift.yml'

permissions:
  contents: read

concurrency:
  group: mini-c-cranelift-pr173
  cancel-in-progress: true

jobs:
  check-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.source.outputs.sha }}
      already_passed: ${{ steps.passed.outputs.cache-hit }}
    steps:
      # Validate aggregate + scalar FP work at Mini-C PR #173, tip ec25924a95b2.
      - name: Read current Mini-C source revision
        id: source
        shell: bash
        run: |
          set -euo pipefail
          sha="$(git ls-remote https://github.com/bingordo/mini-c.git refs/heads/cranelift-sysv-aggregate-abi-foundation | cut -f1)"
          test "${#sha}" -eq 40
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "Mini-C revision: $sha"
      - name: Check previously successful source revision
        id: passed
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/mini-c-passed
          key: mini-c-cranelift-passed-v2-${{ steps.source.outputs.sha }}

  native:
    if: github.event_name != 'schedule' || needs.check-source.outputs.already_passed != 'true'
    needs: check-source
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CARGO_INCREMENTAL: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/mini-c
          ref: ${{ needs.check-source.outputs.sha }}
          path: mini-c
          persist-credentials: false
      - name: Cache Rust dependencies and debug build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            mini-c/target/debug
          key: mini-c-native-${{ runner.os }}-${{ hashFiles('mini-c/Cargo.lock') }}-${{ needs.check-source.outputs.sha }}
          restore-keys: |
            mini-c-native-${{ runner.os }}-${{ hashFiles('mini-c/Cargo.lock') }}-
      - name: Targeted frontend, preprocessing and Cranelift regression tests
        if: github.event_name != 'workflow_dispatch' || !inputs.full_workspace
        working-directory: mini-c
        run: cargo test -p mini-c-syntax -p mini-c-preprocess -p mini-c -p mini-c-sema -p mini-c-cranelift
      - name: Internal CPP GCC-Clang macros and source-origin conformance
        working-directory: mini-c
        env:
          MINI_C_CPP_SEED_COUNT: ${{ inputs.cpp_seed_count || '4' }}
        run: cargo test -p mini-c-preprocess --features internal-rcc
      - name: Internal CPP driver-to-ELF feature integration
        working-directory: mini-c
        run: cargo test -p mini-c -p mini-c-cranelift --features internal-cpp
      - name: Internal CPP end-to-end glibc stdio Hello World
        working-directory: mini-c
        shell: bash
        run: |
          set -euo pipefail
          source=tests/fixtures/glibc-s12/hello_stdio.c
          cargo run -q -p mini-c --features internal-cpp -- check --cpp=internal -D_GNU_SOURCE "$source"
          cargo run -q -p mini-c-cranelift --features internal-cpp -- --emit-obj "$RUNNER_TEMP/mini-c-internal-hello.o" --cpp=internal -D_GNU_SOURCE "$source"
          cc "$RUNNER_TEMP/mini-c-internal-hello.o" -o "$RUNNER_TEMP/mini-c-internal-hello"
          "$RUNNER_TEMP/mini-c-internal-hello" > "$RUNNER_TEMP/mini-c-internal-hello.actual"
          printf 'Hello, world!\n' > "$RUNNER_TEMP/mini-c-internal-hello.expected"
          cmp "$RUNNER_TEMP/mini-c-internal-hello.expected" "$RUNNER_TEMP/mini-c-internal-hello.actual"
      - name: Unmodified musl strcmp with internal CPP and system string.h
        working-directory: mini-c
        shell: bash
        run: |
          set -euo pipefail
          source=tests/fixtures/musl-s10/string/strcmp.c
          cargo run -q -p mini-c --features internal-cpp -- check --cpp=internal "$source"
          cargo run -q -p mini-c-cranelift --features internal-cpp -- --emit-obj "$RUNNER_TEMP/mini-c-internal-strcmp.o" --cpp=internal "$source"
          test -s "$RUNNER_TEMP/mini-c-internal-strcmp.o"
      - name: Six unmodified musl string-memory sources through internal CPP
        working-directory: mini-c
        shell: bash
        run: |
          set -euo pipefail
          cargo build -q -p mini-c --features internal-cpp
          for name in memcmp memchr strcat strcmp strcpy strcasestr; do
            echo "Checking original musl ${name}.c with host headers"
            target/debug/mini-c check --cpp=internal -D_GNU_SOURCE "tests/fixtures/musl-s10/string/${name}.c"
          done
      - name: Clippy experimental C99 preprocessing adapter
        working-directory: mini-c
        run: cargo clippy -p mini-c-preprocess --features internal-rcc --all-targets -- -D warnings
      - name: Full Rust workspace regression suite
        if: github.event_name == 'workflow_dispatch' && inputs.full_workspace
        working-directory: mini-c
        run: cargo test --workspace
      - name: Clippy frontend, preprocessing, driver and Cranelift
        working-directory: mini-c
        run: cargo clippy -p mini-c-syntax -p mini-c-preprocess -p mini-c -p mini-c-sema -p mini-c-cranelift --all-targets -- -D warnings
      - name: Build backend and fuzzer
        working-directory: mini-c
        run: cargo build -p mini-c-cranelift -p mini-c-fuzz
      - name: GCC differential execution including aggregate ABI and preprocessing compatibility
        working-directory: mini-c
        run: python3 tools/test_cranelift.py --seed-count 4 --steps 100
      - name: Mark successfully validated source revision
        if: success()
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/mini-c-passed"
          printf '%s\n' '${{ needs.check-source.outputs.sha }}' > "$RUNNER_TEMP/mini-c-passed/source-sha"
      - name: Save successful source marker
        if: success()
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/mini-c-passed
          key: mini-c-cranelift-passed-v2-${{ needs.check-source.outputs.sha }}
      - name: Upload failure reproducers
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: mini-c-cranelift-failures
          path: mini-c/target/cranelift-failures/
          if-no-files-found: ignore
          retention-days: 14
