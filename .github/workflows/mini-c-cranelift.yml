name: Mini-C Cranelift targeted validation
on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'
  push:
    paths:
      - '.github/workflows/mini-c-cranelift.yml'

permissions:
  contents: read

concurrency:
  group: mini-c-cranelift
  cancel-in-progress: true

jobs:
  check-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.source.outputs.sha }}
      already_passed: ${{ steps.passed.outputs.cache-hit }}
    steps:
      - name: Read current Mini-C source revision
        id: source
        shell: bash
        env:
          MINI_C_DEPLOY_KEY: ${{ secrets.CI_KEY }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s\n' "$MINI_C_DEPLOY_KEY" > "$RUNNER_TEMP/mini-c-ci-key"
          trap 'rm -f "$RUNNER_TEMP/mini-c-ci-key"' EXIT
          sha="$(GIT_SSH_COMMAND="ssh -o StrictHostKeyChecking=accept-new -i $RUNNER_TEMP/mini-c-ci-key" git ls-remote git@github.com:bingordo/mini-c.git refs/heads/main | cut -f1)"
          test "${#sha}" -eq 40
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "Mini-C revision: $sha"
      - name: Check previously successful source revision
        id: passed
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/mini-c-passed
          key: mini-c-cranelift-passed-v1-${{ steps.source.outputs.sha }}

  native:
    if: github.event_name != 'schedule' || needs.check-source.outputs.already_passed != 'true'
    needs: check-source
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CARGO_INCREMENTAL: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/mini-c
          ref: ${{ needs.check-source.outputs.sha }}
          path: mini-c
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Cache Rust dependencies and debug build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            mini-c/target/debug
          key: mini-c-native-${{ runner.os }}-${{ hashFiles('mini-c/Cargo.lock') }}-${{ needs.check-source.outputs.sha }}
          restore-keys: |
            mini-c-native-${{ runner.os }}-${{ hashFiles('mini-c/Cargo.lock') }}-
      - name: Targeted Cranelift tests
        working-directory: mini-c
        run: cargo test -p mini-c-cranelift
      - name: Clippy backend
        working-directory: mini-c
        run: cargo clippy -p mini-c-cranelift --all-targets -- -D warnings
      - name: Build backend and fuzzer
        working-directory: mini-c
        run: cargo build -p mini-c-cranelift -p mini-c-fuzz
      - name: GCC differential execution including globals and mixed objects
        working-directory: mini-c
        run: python3 tools/test_cranelift.py --seed-count 4 --steps 100
      - name: Mark successfully validated source revision
        if: success()
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/mini-c-passed"
          printf '%s\n' '${{ needs.check-source.outputs.sha }}' > "$RUNNER_TEMP/mini-c-passed/source-sha"
      - name: Save successful source marker
        if: success()
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/mini-c-passed
          key: mini-c-cranelift-passed-v1-${{ needs.check-source.outputs.sha }}
      - name: Upload failure reproducers
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: mini-c-cranelift-failures
          path: mini-c/target/cranelift-failures/
          if-no-files-found: ignore
          retention-days: 14
