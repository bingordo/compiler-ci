name: Reconciled driver review
on:
  push:
    branches: [ci/compiler-review-followup-20261120]
    paths: ['.github/workflows/compiler-driver-review-reconcile-20261121.yml']
permissions:
  contents: read
jobs:
  driver:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
      COMPILER_TEST_CROSS_ABI: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 6182021e90781a82bb545266aea74f40cd2d161d
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Run driver and linking regressions
        working-directory: compiler
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "6182021e90781a82bb545266aea74f40cd2d161d"
          git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc-aarch64-linux-gnu qemu-user
          cargo test -p compiler --test ir_default_cli --test mini_c_cli --test lto_cli --test lto_mixed_link --test lto_ordered_build
          cargo test -p compiler --bin compiler module_build::tests
