name: X7 IP4 isolated original-source automatic AND DAG native matcher
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/x7-ip4-real-source-optin-native-20261120.yml'
permissions:
  actions: read
  contents: read
jobs:
  ip4:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 2a25340816434184fe33c5691eb70d3106943573
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: x7-s2-pinned-intel-xed-variant-join
          run-id: 43635408689
          repository: bingordo/compiler-ci
          github-token: ${{ github.token }}
          path: /tmp/x7-ip4/s2
      - uses: actions/download-artifact@v4
        with:
          name: x7-s3l-l2b-l3a-9-ops-generic-helper-smt-source-evidence
          run-id: 43687620382
          repository: bingordo/compiler-ci
          github-token: ${{ github.token }}
          path: /tmp/x7-ip4/smt
      - name: Install independent Z3 and verify original Intel XML source
        run: |
          set -euo pipefail
          test "$(git -C compiler rev-parse HEAD)" = 2a25340816434184fe33c5691eb70d3106943573
          mkdir -p /tmp/x7-ip4/intel
          rev=35eface1b7ee003a1cda95005ec5fd83de658a64
          for name in ADD AND OR SUB XOR; do
            curl --fail --silent --show-error --location --retry 2 --max-time 45 \
              "https://raw.githubusercontent.com/intel/SDM/${rev}/data/instruction/${name}.xml" \
              -o "/tmp/x7-ip4/intel/${name}.xml"
          done
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends z3
          python3 -m venv "$RUNNER_TEMP/ip4-venv"
          "$RUNNER_TEMP/ip4-venv/bin/python" -m pip install --disable-pip-version-check --quiet 'z3-solver==4.13.4.0'
      - name: Re-prove and source-regenerate the two exact-width experimental RuleSpecs
        run: |
          set -euo pipefail
          export PYTHONPATH="$PWD/compiler/tools"
          PY="$RUNNER_TEMP/ip4-venv/bin/python"
          "$PY" -m unittest -v test_x86_dag_codegen test_x7_ip3_real_source_gp_join test_x7_ip2_source_rewrite_search
          "$PY" compiler/tools/x7_ip4_emit_and_dag_probe.py --check \
            --semantic-manifest compiler/data/x86_s3l_batch_family_contracts.json \
            --intel-dir /tmp/x7-ip4/intel \
            --operation-ast /tmp/x7-ip4/smt/operations.json \
            --helper-ast /tmp/x7-ip4/smt/helpers.json \
            --source-smt /tmp/x7-ip4/smt/semantics-z3.json \
            --source-xed /tmp/x7-ip4/s2/join-1.json
          echo X7_IP4_PINNED_INTEL_PROOF_AND_GENERATED_TABLE_PARITY_PASS
      - name: Actual TypeId-native SSA generated matcher/RA regression matrix
        run: |
          set -euo pipefail
          cd compiler
          printf '[workspace]\nresolver = "2"\nmembers = ["crates/ir", "crates/opt", "crates/backend", "crates/backend-x86"]\n' > Cargo.toml
          cargo test -p compiler-backend-x86 --no-default-features \
            --features x7-ip4-auto-dag-probe --lib \
            dag_match::tests::ip4_probe --offline -- --nocapture
          cargo test -p compiler-backend-x86 --features x7-ip4-auto-dag-probe \
            --lib dag_match::tests::ip4_probe --offline -- --nocapture
          cargo test -p compiler-backend-x86 --no-default-features \
            --features x7-typeid-source-dag-optin --lib \
            dag_match::tests::native_selector::optin_generated_rules_only --offline -- --nocapture
          echo X7_IP4_OPTIN_NATIVE_SSA_MATCHER_MATRIX_PASS
      - name: Real TypeId GAS/direct ELF native C11 differential and baseline/probe .text
        run: |
          set -euo pipefail
          cd compiler
          cargo test -p compiler-backend-x86 --no-default-features \
            --features x7-typeid-source-dag-optin \
            --test x7_ip4_source_and_native --offline -- --nocapture \
            2>&1 | tee /tmp/x7-ip4-baseline.log
          cargo test -p compiler-backend-x86 --no-default-features \
            --features x7-ip4-auto-dag-probe \
            --test x7_ip4_source_and_native --offline -- --nocapture \
            2>&1 | tee /tmp/x7-ip4-probe.log
          python3 - <<'PY'
          from pathlib import Path
          import re
          metric=re.compile(r'X7_IP4_NATIVE_METRICS mode=(\w+) frame=(\w+) sink=(\w+) text_bytes=(\d+) emit_ns=(\d+)')
          rows={}
          for mode in ("baseline","probe"):
              log=Path(f'/tmp/x7-ip4-{mode}.log').read_text()
              assert 'test result: ok.' in log,mode
              matches=metric.findall(log)
              assert len(matches)==4,(mode,matches)
              for seen,frame,sink,size,elapsed in matches:
                  assert seen==mode
                  assert int(size)>0 and int(elapsed)>0
                  key=frame,sink
                  assert (mode,key) not in rows
                  rows[mode,key]=int(size)
          for frame in ("frameless","framed"):
              for sink in ("gas","elf"):
                  before=rows["baseline",(frame,sink)]
                  after=rows["probe",(frame,sink)]
                  assert after < before,(frame,sink,before,after)
                  print(f'X7_IP4_REAL_NATIVE_TEXT_WIN frame={frame} sink={sink} old={before} new={after} saved={before-after}')
          PY
          echo X7_IP4_NATIVE_GCC_AND_CODE_SIZE_AB_PASS
      - name: Retain real source/feature non-admission boundaries
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          toml=Path("compiler/crates/backend-x86/Cargo.toml").read_text()
          header=toml.split("default = [",1)[1].split("]",1)[0]
          assert "x7-ip4-auto-dag-probe" not in header
          assert 'x7-ip4-auto-dag-probe = ["x7-typeid-source-dag-optin"]' in toml
          src=Path("compiler/crates/backend-x86/src/dag_match.rs").read_text()
          assert '#[cfg(feature="x7-ip4-auto-dag-probe")]' in src
          assert "GENERATED_X7_IP4_AND_DAG_RULES" in src
          print("X7_IP4_PROBE_DEFAULT_OFF_PASS")
          PY
