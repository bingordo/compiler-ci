name: Mini-C C11 atomic checked types and guarded native emission
on:
  push:
    branches: [ci/minic-c11-atomic-checked-types-20261123]
    paths: ['.github/workflows/minic-c11-atomic-checked-types-20261123.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mini-c-c11-atomic:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Checkout exact Mini-C atomic candidate
        uses: actions/checkout@v4
        with:
          repository: bingordo/mini-c
          ref: debb45f62a44f98725d4188833ebfbd8a78abe3e
          path: mini-c
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Check immutable candidate SHA
        run: test "$(git -C mini-c rev-parse HEAD)" = debb45f62a44f98725d4188833ebfbd8a78abe3e
      - name: Check all Mini-C semantic and reference backend targets
        working-directory: mini-c
        run: cargo check -p mini-c-syntax -p mini-c-sema -p mini-c-cranelift --all-targets
      - name: All Mini-C syntax and semantic tests
        working-directory: mini-c
        run: cargo test -p mini-c-syntax -p mini-c-sema
      - name: Checked C11 atomic rejection from Cranelift native ELF
        working-directory: mini-c
        run: cargo test -p mini-c-cranelift --test c11_atomic_rejection -- --nocapture
      - name: Full existing Cranelift reference regression
        working-directory: mini-c
        run: cargo test -p mini-c-cranelift --lib
      - name: Strict scoped Mini-C Clippy
        working-directory: mini-c
        run: cargo clippy -p mini-c-syntax -p mini-c-sema -p mini-c-cranelift --all-targets -- -D warnings
