name: x86 native TypeId per-call liveness saves and independent GP-clobber C11 oracle
on:
  push:
    branches: [ci/x86-per-call-live-saves-20261114]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-call-liveness:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 0d7468f042558d5f278dbc2de4d06dcc847070f7
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Pin compiler source and scope backend workspace
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 0d7468f042558d5f278dbc2de4d06dcc847070f7
          python3 - <<'PY'
          from pathlib import Path
          Path("Cargo.toml").write_text("""[workspace]
          resolver = "2"
          members = ["crates/ir", "crates/backend", "crates/opt", "crates/backend-x86"]
          """)
          PY
      - name: Check per-call liveness, no dead saves, all native ABI cases
        run: |
          set -euo pipefail
          cargo check -p compiler-backend-x86 --all-targets
          cargo test -p compiler-backend-x86 --lib call_saves_follow_liveness_not_all_allocated_colors -- --nocapture
          cargo test -p compiler-backend-x86 --test native_typeid_call_liveness -- --nocapture
          cargo test -p compiler-backend-x86 --test native_typeid_indirect_gp_varargs -- --nocapture
          cargo test -p compiler-backend-x86 --test native_typeid_memory_calls -- --nocapture
          cargo test -p compiler-backend-x86 --test native_typeid_direct -- --nocapture
          cargo test -p compiler-backend-x86 --tests
          cargo clippy -p compiler-backend-x86 --all-targets -- -D warnings
          echo X86_NATIVE_PER_CALL_LIVENESS_ALL_TARGET_TESTS_CLOBBER_C11_PASS
      - name: Verify native call save under no default X7 features
        run: |
          set -euo pipefail
          cargo test -p compiler-backend-x86 --no-default-features --lib call_saves_follow_liveness_not_all_allocated_colors -- --nocapture
          cargo test -p compiler-backend-x86 --no-default-features --test native_typeid_call_liveness -- --nocapture
          echo X86_NATIVE_PER_CALL_LIVENESS_NO_DEFAULT_PASS
