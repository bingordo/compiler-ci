name: AArch64 S20 exact undefined architectural dependency frontier
on:
  pull_request:
    paths: ['.github/workflows/aarch64-s19-state-owner.yml']
permissions:
  contents: read
jobs:
  source-owners:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 2292ef335a8941d9c0f4fa7f6c4648c0cc7d3909
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: herd/herdtools7
          ref: cfc4f56c522ec0d701acaf5a23139b47e8711299
          path: herd
          sparse-checkout: |
            herd/libdir/asl-pseudocode/bundler.py
          persist-credentials: false
      - name: Identify unchanged authoritative state declarations and owner sections
        run: |
          set -euo pipefail
          curl -fLsS --retry 3 --connect-timeout 20 --max-time 240 --max-filesize 200000000 -o /tmp/arm2026.tar.gz https://developer.arm.com/-/cdn-downloads/permalink/Exploration-Tools-A64-ISA/ISA_A64/ISA_A64_xml_A_profile-2026-09.tar.gz
          echo '44cfb89c763c7eea8e59de0ad2221e3c012e6aa77899bd7f1c3e1f24537191d7  /tmp/arm2026.tar.gz' | sha256sum -c -
          git -C compiler rev-parse HEAD | tee /tmp/s19-compiler-head
          grep -Fx 2292ef335a8941d9c0f4fa7f6c4648c0cc7d3909 /tmp/s19-compiler-head
          python3 -m unittest discover -s compiler/tools -p 'test_aarch64_a32_source_state_owners.py' -v
          python3 -m unittest discover -s compiler/tools -p 'test_aarch64_a32_original_register_bank.py' -v
          python3 compiler/tools/aarch64_a32_original_register_bank.py --archive /tmp/arm2026.tar.gz --out /tmp/s20-bank-evidence.json
          python3 compiler/tools/aarch64_a32_source_state_owners.py --archive /tmp/arm2026.tar.gz --out /tmp/s19-owner-evidence.json
          python3 - <<'PY'
          import json
          x=json.load(open('/tmp/s19-owner-evidence.json'))
          assert len(x['owners'])==2 and x['original_source_only']
          assert all(not x[k] for k in ('architectural_initial_state_available','original_instruction_executed','state_effect_equivalence_verified','selection_eligible'))
          print('S19_COMPILER_ORIGINAL_OWNER_SOURCE_GATE',len(x['owners']))
          PY
          python3 - <<'PY'
          import sys, hashlib, re, tarfile, tempfile, xml.etree.ElementTree as ET
          from pathlib import Path
          from argparse import Namespace
          sys.path.insert(0,'compiler/tools')
          from aarch64_a32_aslref_compat import load_bundler
          from aarch64_a32_asl_source_links import ROOT
          b=load_bundler(Path('herd/herd/libdir/asl-pseudocode/bundler.py'))
          with tempfile.TemporaryDirectory() as td, tarfile.open('/tmp/arm2026.tar.gz','r:gz') as tar:
              folder=Path(td)
              raw=tar.extractfile(ROOT+'shared_pseudocode.xml').read()
              (folder/'shared_pseudocode.xml').write_bytes(raw)
              shared=folder/'shared.asl'
              b.make_shared_pseudocode(Namespace(i_files=[folder/'shared_pseudocode.xml'],o_dir=shared))
              contents=shared.read_text()
              for n in ('X','PSTATE','PSTATE.C','read_register','write_register'):
                  match=[(i,l.strip()) for i,l in enumerate(contents.splitlines()) if re.search(r'\b'+re.escape(n)+r'\b',l)]
                  heads=[(i,l) for i,l in match if re.match(r'^(?:var |let |constant |config |func |getter |setter |type |record |impdef |readonly |array |bits\()',l)]
                  print('S19_SHARED_SYMBOL',n,'occurrences',len(match),'declaration_hints',[(i,hashlib.sha256(l.encode()).hexdigest(),len(l)) for i,l in heads[:12]])
              xml=ET.fromstring(raw)
              for token in ('X','PSTATE','AArch64','Registers'):
                  rows=[]
                  for ps in xml.iter('ps'):
                      name=ps.get('name','')
                      if token.lower() in name.lower():
                          text=''.join(ps.itertext())
                          rows.append((name,len(text),hashlib.sha256(text.encode()).hexdigest()))
                  print('S19_PUBLISHED_SECTIONS',token,'count',len(rows),'first',rows[:25])
              owners=[(ps.get('name'),len(''.join(ps.itertext())),hashlib.sha256(''.join(ps.itertext()).encode()).hexdigest()) for ps in xml.iter('ps') if re.match(r'^(?:aarch64/functions/registers/|shared/functions/system/PSTATE$)',ps.get('name',''))]
              print('S19_A64_REGISTER_OWNERS',owners[:90], 'total',len(owners))
              regtoken='_R'
              rows=[]
              for ps in xml.iter('ps'):
                  body=''.join(ps.itertext())
                  if re.search(r'\b_R\b',body):
                      name=ps.get('name','')
                      rows.append((name,len(body),hashlib.sha256(body.encode()).hexdigest(),
                                   len(re.findall(r'\b_R\b',body)),
                                   bool(re.search(r'\b(?:var|array|let|constant|config|type)\s+_R\b',body))))
              print('S20_REAL_R_PUBLISHED_SECTION_MATCHES',len(rows),rows[:30])
              defs=[(i,hashlib.sha256(line.encode()).hexdigest(),line[:160])
                    for i,line in enumerate(contents.splitlines())
                    if re.search(r'\b(?:var|array|let|constant|config|type)\s+_R\b',line)]
              print('S20_ORIGINAL_SHARED_R_DECLARATIONS',len(defs),defs[:15])
              stub=Path('herd/herd/libdir/asl-pseudocode/type-checking-implementations.asl')
              if stub.is_file():
                  data=stub.read_text()
                  print('S20_UPSTREAM_STUB_R',len(re.findall(r'\b_R\b',data)),
                        hashlib.sha256(data.encode()).hexdigest(),
                        [(i,hashlib.sha256(line.encode()).hexdigest())
                          for i,line in enumerate(data.splitlines()) if '_R' in line][:8])
              for op in ('adc','adcs'):
                  path=folder/(op+'.xml')
                  path.write_bytes(tar.extractfile(ROOT+op+'.xml').read())
                  asl=b.one_instruction_to_string(path)
                  for tok in ('X','PSTATE','R','AddWithCarry'):
                      print('S19_INSTR_USE',op,tok,'count',len(re.findall(r'\b'+tok+r'\b',asl)))
          PY

  source-owner-typecheck:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    container:
      image: ocaml/opam:alpine-3.21-ocaml-5.2
      options: --user root
    env:
      OPAMROOT: /home/opam/.opam
      OPAMROOTISOK: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          repository: herd/herdtools7
          ref: cfc4f56c522ec0d701acaf5a23139b47e8711299
          path: herd
          persist-credentials: false
      - name: Build exact upstream ASLRef
        shell: sh
        run: |
          set -eu
          apk add --no-cache bash python3 curl coreutils git openssh-client gmp-dev pkgconf
          opam install -y dune menhir zarith
          (cd herd && opam exec -- dune build -p aslref --profile release)
          ./herd/_build/default/asllib/aslref.exe --version | grep -Fx 'aslref version 1.0-EAC2'
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 2292ef335a8941d9c0f4fa7f6c4648c0cc7d3909
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Compare real source-owned X PSTATE vs original missing-state typing
        shell: sh
        run: |
          set -eu
          test "$(git -C compiler rev-parse HEAD)" = 2292ef335a8941d9c0f4fa7f6c4648c0cc7d3909
          curl -fLsS --retry 3 --connect-timeout 20 --max-time 240 --max-filesize 200000000 -o /tmp/arm2026.tar.gz https://developer.arm.com/-/cdn-downloads/permalink/Exploration-Tools-A64-ISA/ISA_A64/ISA_A64_xml_A_profile-2026-09.tar.gz
          echo '44cfb89c763c7eea8e59de0ad2221e3c012e6aa77899bd7f1c3e1f24537191d7  /tmp/arm2026.tar.gz' | sha256sum -c -
          python3 - <<'PY'
          import sys, json, tarfile, tempfile, re, subprocess, hashlib
          from pathlib import Path
          sys.path.insert(0,'compiler/tools')
          from aarch64_a32_addwithcarry_asl_runtime import published_addwithcarry
          from aarch64_a32_source_state_owners import pinned_state_sources,state_candidate
          from aarch64_a32_original_register_bank import original_register_bank,register_state_candidate
          from aarch64_a32_adc_full_instruction_frontier import INSTRUCTIONS,valid_entry,probe_program
          from aarch64_a32_aslref_compat import load_bundler
          from aarch64_a32_asl_source_links import ROOT
          from aarch64_a32_full_source_catalog import validate_catalog
          from aarch64_a32_asl_source_links import source_entries
          archive=Path('/tmp/arm2026.tar.gz')
          sources=pinned_state_sources(archive)
          state=state_candidate(sources)
          extended_state=register_state_candidate(sources,original_register_bank(archive))
          helper=published_addwithcarry(archive)
          bundler=load_bundler(Path('herd/herd/libdir/asl-pseudocode/bundler.py'))
          exe=str(Path('herd/_build/default/asllib/aslref.exe').resolve())
          # Cross-check original pins and only compare the effect of real owner additions.
          with tarfile.open(archive,'r:gz') as tar,tempfile.TemporaryDirectory() as td:
              folder=Path(td)
              for op,pin in INSTRUCTIONS.items():
                  raw=tar.extractfile(ROOT+op.lower()+'.xml').read()
                  path=folder/(op.lower()+'.xml')
                  path.write_bytes(raw)
                  instruction=bundler.one_instruction_to_string(path)
                  assert hashlib.sha256(raw).hexdigest()==pin['xml_sha256']
                  assert hashlib.sha256(instruction.encode()).hexdigest()==pin['bundled_sha256']
                  outcomes=[]
                  for label,preamble in (('baseline',''),('owners',state),('owners_and_bank',extended_state)):
                      script=(preamble+'\n' if preamble else '') + probe_program(helper,instruction,pin['entry'])
                      inp=folder/(op.lower()+'_'+label+'.asl')
                      inp.write_text(script)
                      r=subprocess.run([exe,'--version-eac1','--type-check-strict','--no-exec','-1',inp.name],cwd=folder,capture_output=True,timeout=70)
                      diag=r.stderr.decode('utf8','replace')
                      kinds={k:len(re.findall(v,diag,re.I)) for k,v in [
                          ('undefined',r'\bundefined\b'),
                          ('type_error',r'type error'),
                          ('grammar_error',r'grammar error'),
                          ('conflicting',r'conflict'),
                          ('unbound',r'\bunbound\b')]}
                      # Error lines only, bounded: never export Arm source.
                      error_lines=[line.strip() for line in diag.splitlines()
                                   if re.search(r'undefined|unbound|type error|exception|error:',line,re.I)]
                      print('S20_UNRESOLVED_ORIGINAL',op,'state',label,
                            'errors',[line[:250] for line in error_lines[:4]])
                      outcomes.append((label,r.returncode,kinds,len(r.stderr)))
                  print('S20_ORIGINAL_TYPED_OWNER_DIFFERENTIAL',op,outcomes)
                  assert len(outcomes)==3 and outcomes[0][1]!=0
          PY

      - name: Execute original ADC ADCS with source-owned register and flag state
        shell: sh
        run: |
          set -eu
          python3 - <<'PY'
          import sys,tarfile,tempfile,subprocess,hashlib
          from pathlib import Path
          sys.path.insert(0,'compiler/tools')
          from aarch64_a32_original_register_bank import original_register_bank,register_state_candidate
          from aarch64_a32_source_state_owners import pinned_state_sources
          from aarch64_a32_addwithcarry_asl_runtime import published_addwithcarry
          from aarch64_a32_adc_full_instruction_frontier import INSTRUCTIONS
          from aarch64_a32_asl_source_links import ROOT
          from aarch64_a32_aslref_compat import load_bundler
          archive=Path('/tmp/arm2026.tar.gz')
          bank=original_register_bank(archive)
          state=register_state_candidate(pinned_state_sources(archive),bank)
          helper=published_addwithcarry(archive)
          bundler=load_bundler(Path('herd/herd/libdir/asl-pseudocode/bundler.py'))
          exe=str(Path('herd/_build/default/asllib/aslref.exe').resolve())
          print('S21_OWNED_STATE_SIGNATURES')
          for line in state.splitlines():
              if any(k in line for k in ('PSTATE','var _R','getter X','setter X','func X','type PSTATE')):
                  print('S21_STATE_LINE',line.strip()[:125])
          def lit(bits,value): return "'"+format(value,'0'+str(bits)+'b')+"'"
          with tarfile.open(archive,'r:gz') as tar,tempfile.TemporaryDirectory() as tmp:
              folder=Path(tmp)
              for op,pin in INSTRUCTIONS.items():
                  path=folder/(op.lower()+'.xml')
                  path.write_bytes(tar.extractfile(ROOT+op.lower()+'.xml').read())
                  original=bundler.one_instruction_to_string(path)
                  assert hashlib.sha256(original.encode()).hexdigest()==pin['bundled_sha256']
                  for bits in (32,64):
                      instruction=(0x1a000000 | ((bits==64)<<31) | ((op=='ADCS')<<29) | (2<<16) | (1<<5) | 3)
                      main=[
                          'func main() => integer','begin',
                          '    _R[1] = '+lit(64,1)+';',
                          '    _R[2] = '+lit(64,2)+';',
                          '    _R[3] = '+lit(64,0)+';',
                          '    PSTATE.N = '+lit(1,1)+';',
                          '    PSTATE.Z = '+lit(1,1)+';',
                          '    PSTATE.C = '+lit(1,1)+';',
                          '    PSTATE.V = '+lit(1,1)+';',
                          '    '+pin['entry']+'('+lit(32,instruction)+');',
                          '    assert _R[3] == '+lit(64,4)+';',
                      ]
                      for k in ('N','Z','C','V'):
                          v=0 if op=='ADCS' else 1
                          main.append('    assert PSTATE.'+k+' == '+lit(1,v)+';')
                      main+=['    return 0;','end;','']
                      script=state+'\n'+helper+'\n'+original+'\n'+'\n'.join(main)
                      f=folder/(op.lower()+str(bits)+'.asl')
                      f.write_text(script)
                      run=subprocess.run([exe,'--version-eac1','--type-check-strict','-1',f.name],cwd=folder,capture_output=True,timeout=50)
                      print('S21_ORIGINAL_INSTRUCTION_EXECUTION',op,bits,'encoding',hex(instruction),'rc',run.returncode,
                            'errors',[x[:210] for x in run.stderr.decode('utf-8','replace').splitlines()[:7]])
                      assert run.returncode==0
          PY
