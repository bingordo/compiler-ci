name: AArch64 S19 original X PSTATE source-owner frontier
on:
  pull_request:
    paths: ['.github/workflows/aarch64-s19-state-owner.yml']
permissions:
  contents: read
jobs:
  source-owners:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 83f60a5eddc1745745af73b1fe1f7f7d7dc788d9
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: herd/herdtools7
          ref: cfc4f56c522ec0d701acaf5a23139b47e8711299
          path: herd
          sparse-checkout: |
            herd/libdir/asl-pseudocode/bundler.py
          persist-credentials: false
      - name: Identify unchanged authoritative state declarations and owner sections
        run: |
          set -euo pipefail
          curl -fLsS --retry 3 --connect-timeout 20 --max-time 240 --max-filesize 200000000 -o /tmp/arm2026.tar.gz https://developer.arm.com/-/cdn-downloads/permalink/Exploration-Tools-A64-ISA/ISA_A64/ISA_A64_xml_A_profile-2026-09.tar.gz
          echo '44cfb89c763c7eea8e59de0ad2221e3c012e6aa77899bd7f1c3e1f24537191d7  /tmp/arm2026.tar.gz' | sha256sum -c -
          test "$(git -C compiler rev-parse HEAD)" = 83f60a5eddc1745745af73b1fe1f7f7dc788d9
          python3 -m unittest discover -s compiler/tools -p 'test_aarch64_a32_source_state_owners.py' -v
          python3 compiler/tools/aarch64_a32_source_state_owners.py --archive /tmp/arm2026.tar.gz --out /tmp/s19-owner-evidence.json
          python3 - <<'PY'
          import json
          x=json.load(open('/tmp/s19-owner-evidence.json'))
          assert len(x['owners'])==2 and x['original_source_only']
          assert all(not x[k] for k in ('architectural_initial_state_available','original_instruction_executed','state_effect_equivalence_verified','selection_eligible'))
          print('S19_COMPILER_ORIGINAL_OWNER_SOURCE_GATE',len(x['owners']))
          PY
          python3 - <<'PY'
          import sys, hashlib, re, tarfile, tempfile, xml.etree.ElementTree as ET
          from pathlib import Path
          from argparse import Namespace
          sys.path.insert(0,'compiler/tools')
          from aarch64_a32_aslref_compat import load_bundler
          from aarch64_a32_asl_source_links import ROOT
          b=load_bundler(Path('herd/herd/libdir/asl-pseudocode/bundler.py'))
          with tempfile.TemporaryDirectory() as td, tarfile.open('/tmp/arm2026.tar.gz','r:gz') as tar:
              folder=Path(td)
              raw=tar.extractfile(ROOT+'shared_pseudocode.xml').read()
              (folder/'shared_pseudocode.xml').write_bytes(raw)
              shared=folder/'shared.asl'
              b.make_shared_pseudocode(Namespace(i_files=[folder/'shared_pseudocode.xml'],o_dir=shared))
              contents=shared.read_text()
              for n in ('X','PSTATE','PSTATE.C','read_register','write_register'):
                  match=[(i,l.strip()) for i,l in enumerate(contents.splitlines()) if re.search(r'\b'+re.escape(n)+r'\b',l)]
                  heads=[(i,l) for i,l in match if re.match(r'^(?:var |let |constant |config |func |getter |setter |type |record |impdef |readonly |array |bits\()',l)]
                  print('S19_SHARED_SYMBOL',n,'occurrences',len(match),'declaration_hints',[(i,hashlib.sha256(l.encode()).hexdigest(),len(l)) for i,l in heads[:12]])
              xml=ET.fromstring(raw)
              for token in ('X','PSTATE','AArch64','Registers'):
                  rows=[]
                  for ps in xml.iter('ps'):
                      name=ps.get('name','')
                      if token.lower() in name.lower():
                          text=''.join(ps.itertext())
                          rows.append((name,len(text),hashlib.sha256(text.encode()).hexdigest()))
                  print('S19_PUBLISHED_SECTIONS',token,'count',len(rows),'first',rows[:25])
              owners=[(ps.get('name'),len(''.join(ps.itertext())),hashlib.sha256(''.join(ps.itertext()).encode()).hexdigest()) for ps in xml.iter('ps') if re.match(r'^(?:aarch64/functions/registers/|shared/functions/system/PSTATE$)',ps.get('name',''))]
              print('S19_A64_REGISTER_OWNERS',owners[:90], 'total',len(owners))
              for op in ('adc','adcs'):
                  path=folder/(op+'.xml')
                  path.write_bytes(tar.extractfile(ROOT+op+'.xml').read())
                  asl=b.one_instruction_to_string(path)
                  for tok in ('X','PSTATE','R','AddWithCarry'):
                      print('S19_INSTR_USE',op,tok,'count',len(re.findall(r'\b'+tok+r'\b',asl)))
          PY
