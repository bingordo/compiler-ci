name: X87 physical F80 long double SysV oracle
on:
  pull_request:
    paths:
      - '.github/workflows/x87-f80-physical-native-20261125.yml'
permissions:
  contents: read
jobs:
  x87-f80-native:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 526179bc75cdda6b20b2b3bde4644ac397968c6e
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Pin compiler, toolchain, and GCC native ABI
        run: |
          set -euo pipefail
          test "$(git -C compiler rev-parse HEAD)" = 526179bc75cdda6b20b2b3bde4644ac397968c6e
          git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
          git config --global --add url."https://github.com/".insteadOf "git@github.com:"
          rustc --version
          cc --version | head -1
      - name: Build default physical x86 backend and driver
        working-directory: compiler
        run: |
          set -euo pipefail
          cargo check -p compiler-backend-x86
          cargo check -p compiler --bin compiler
      - name: Native x87 80-bit ABI oracle plus negative depth and exact bytes
        working-directory: compiler
        run: |
          set -euo pipefail
          cargo test -p compiler-backend-x86 --lib x87_f80_physical_native_tests -- --nocapture
      - name: Existing scalar FP and PGO flags tests compile and run
        working-directory: compiler
        run: |
          set -euo pipefail
          cargo test -p compiler-backend-x86 --lib float_machine_native_tests -- --nocapture
          python3 tools/x86_blanket_instruction_bans.py --check
          python3 -m unittest discover -s tools -p 'test_x86_blanket_instruction_bans.py' -v
