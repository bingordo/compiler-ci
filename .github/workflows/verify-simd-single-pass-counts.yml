name: x86 SIMD single validation per CLI and byte exact tables
on:
  pull_request:
    paths: ['.github/workflows/verify-simd-single-pass-counts.yml']
permissions:
  contents: read
jobs:
  source-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout immutable compiler candidate
        uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: af3924b6bbfcd8f4f44e2e552db6475f65ecec88
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Require exact compiler commit
        run: test "$(git -C compiler rev-parse HEAD)" = "af3924b6bbfcd8f4f44e2e552db6475f65ecec88"
      - name: Verify all seven generated SIMD Rust tables match checked-in exact bytes
        working-directory: compiler
        run: |
          set -euo pipefail
          export PYTHONPATH="$PWD/tools"
          python3 -m compileall -q tools/regen_x86_sse_packed_forms.py tools/regen_x86_sse_move_forms.py tools/regen_x86_sse_shift_imm_forms.py tools/regen_x86_sse_evex_forms.py tools/regen_x86_sse_evex_mask_compare_forms.py tools/regen_x86_sse_evex_shift_imm_forms.py tools/regen_x86_sse_vex_forms.py tools/test_x86_simd_single_pass_counts.py
          for generator in \
              regen_x86_sse_packed_forms \
              regen_x86_sse_move_forms \
              regen_x86_sse_shift_imm_forms \
              regen_x86_sse_evex_forms \
              regen_x86_sse_evex_mask_compare_forms \
              regen_x86_sse_evex_shift_imm_forms \
              regen_x86_sse_vex_forms; do
            python3 "tools/${generator}.py" --check
          done
      - name: Assert exactly one admission, unchanged counts and complete SIMD negative suites
        working-directory: compiler
        run: |
          set -euo pipefail
          export PYTHONPATH="$PWD/tools"
          python3 -m unittest discover -s tools -p test_x86_simd_single_pass_counts.py -v
          python3 -m unittest discover -s tools -p 'test_regen_x86_sse_*.py' -v
          python3 -m unittest discover -s tools -p test_x86_simd_generator_cli.py -v
