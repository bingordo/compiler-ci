name: Mini-C prebuilt GCC differential tests

on:
  schedule:
    - cron: '43 */6 * * *'
  workflow_dispatch:
    inputs:
      expected_source_sha:
        description: 'Expected compiler commit SHA (optional)'
        required: false
        type: string
      seed_count:
        description: 'Generated seed count'
        required: false
        default: '6'
        type: string
      force_recheck:
        description: 'Re-run fixed and seeded C/GCC comparisons even when the exact binary already passed'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: mini-c-differential
  cancel-in-progress: true

jobs:
  differential:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Download only prebuilt Mini-C bundle
        uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: expr-rule-gen-binaries
          path: private-binary
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
          sparse-checkout: |
            dist/mini-c-differential
      - name: Verify checksum and source commit
        shell: bash
        run: |
          set -euo pipefail
          cd private-binary/dist/mini-c-differential
          grep -Eq '^[0-9a-f]{40}$' source-sha.txt
          expected="${{ inputs.expected_source_sha }}"
          if [ -n "$expected" ]; then
            grep -Eq '^[0-9a-f]{40}$' <<< "$expected"
            test "$(cat source-sha.txt)" = "$expected"
          fi
          sha256sum --check sha256.txt
          tar -tzf mini-c-differential-linux-x86_64.tar.gz | grep -Fx compiler-mini-c
          tar -tzf mini-c-differential-linux-x86_64.tar.gz | grep -Fx differential.py
          mkdir -p "$RUNNER_TEMP/mini-c-differential"
          tar -xzf mini-c-differential-linux-x86_64.tar.gz -C "$RUNNER_TEMP/mini-c-differential"
          test -x "$RUNNER_TEMP/mini-c-differential/compiler-mini-c"
          test -s "$RUNNER_TEMP/mini-c-differential/differential.py"
          echo "Compiler source SHA: $(cat source-sha.txt)"
      - name: Validate bounded seed budget
        env:
          SEED_COUNT: ${{ inputs.seed_count || '6' }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SEED_COUNT" =~ ^[0-9]+$ ]]
          (( SEED_COUNT >= 1 && SEED_COUNT <= 64 ))
          echo "C/GCC differential seeds requested: $SEED_COUNT"
      - name: Reuse verified exact binary and seed-corpus result
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/mini-c-validated
          key: mini-c-gcc-v2-${{ hashFiles('private-binary/dist/mini-c-differential/sha256.txt') }}-seeds-${{ inputs.seed_count || '6' }}
      - name: Compare prebuilt Mini-C compiler with GCC
        if: steps.cache.outputs.cache-hit != 'true' || inputs.force_recheck
        shell: bash
        env:
          SEED_COUNT: ${{ inputs.seed_count || '6' }}
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=15s 16m \
            python3 "$RUNNER_TEMP/mini-c-differential/differential.py" \
            --compiler "$RUNNER_TEMP/mini-c-differential/compiler-mini-c" \
            --seed-count "$SEED_COUNT" --steps 120 --timeout 15 \
            --artifacts "$RUNNER_TEMP/mini-c-failures" | tee "$RUNNER_TEMP/mini-c-differential.log"
          grep -Eq "^PASS: [1-9][0-9]* fixtures, $SEED_COUNT seeds, mixed ABI calls and negative cases$" "$RUNNER_TEMP/mini-c-differential.log"
          mkdir -p "$RUNNER_TEMP/mini-c-validated"
          cp private-binary/dist/mini-c-differential/source-sha.txt "$RUNNER_TEMP/mini-c-validated/source-sha.txt"
          echo "Verified fixed cases, $SEED_COUNT generated seeds, mixed ABI and negative cases" >> "$GITHUB_STEP_SUMMARY"
      - name: Cache only actual successful differential comparisons
        if: success() && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/mini-c-validated
          key: mini-c-gcc-v2-${{ hashFiles('private-binary/dist/mini-c-differential/sha256.txt') }}-seeds-${{ inputs.seed_count || '6' }}
      - name: Report previously verified exact corpus
        if: success() && steps.cache.outputs.cache-hit == 'true' && !inputs.force_recheck
        run: echo "Exact binary and seed range already passed; skipped redundant compilation" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload failed differential cases
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: mini-c-differential-failures
          path: ${{ runner.temp }}/mini-c-failures/
          if-no-files-found: ignore
          retention-days: 14
