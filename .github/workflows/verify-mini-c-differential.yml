name: Mini-C source-build GCC differential tests

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: 'Compiler branch, tag or commit'
        required: false
        default: '2e5b57fa00dbabbd2e907c4e79be40e6737e2ea6'
        type: string
      seed_count:
        description: 'Generated seed count (1-64)'
        required: false
        default: '6'
        type: string
      force_recheck:
        description: 'Repeat previously passing cohort'
        required: false
        default: false
        type: boolean
  schedule:
    - cron: '4,19,34,49 * * * *'
  push:
    branches: [main, ci/m10-float-prototypes-20261104]
    paths:
      - '.github/workflows/verify-mini-c-differential.yml'

permissions:
  contents: read

concurrency:
  group: mini-c-differential-${{ inputs.source_ref || 'main' }}
  cancel-in-progress: true

jobs:
  differential:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout compiler source using existing read-only deploy key
        uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: ${{ inputs.source_ref || '2e5b57fa00dbabbd2e907c4e79be40e6737e2ea6' }}
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Identify exact source and validate cohort size
        id: source
        shell: bash
        env:
          SEED_COUNT: ${{ inputs.seed_count || '6' }}
        run: |
          set -euo pipefail
          sha="$(git -C compiler rev-parse HEAD)"
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]]
          [[ "$SEED_COUNT" =~ ^[0-9]+$ ]]
          (( 10#$SEED_COUNT >= 1 && 10#$SEED_COUNT <= 64 ))
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          test -s compiler/tools/mini-c-driver/tests/differential.py
          test -s compiler/tools/mini-c-driver/Cargo.toml
          test "$sha" = 2e5b57fa00dbabbd2e907c4e79be40e6737e2ea6
          echo "Compiler revision: $sha" >> "$GITHUB_STEP_SUMMARY"
      - name: Check for previously successful source and cohort
        id: verified
        # This diagnostic branch must execute all new tests, not reuse the
        # previously cached source SHA for a different workflow.
        if: github.event_name != 'push'
        uses: actions/cache/restore@v4
        with:
          path: .mini-c-verified
          key: mini-c-source-v1-${{ hashFiles('.github/workflows/verify-mini-c-differential.yml') }}-${{ steps.source.outputs.sha }}-${{ inputs.seed_count || '6' }}
          lookup-only: true
      - name: Make public Mini-C dependency accessible without another deploy key
        if: steps.verified.outputs.cache-hit != 'true' || inputs.force_recheck
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          manifest=Path('compiler/tools/mini-c-driver/Cargo.toml')
          text=manifest.read_text()
          old='ssh://git@github.com/bingordo/mini-c.git'
          assert text.count(old)==2, 'Mini-C dependency declaration changed'
          manifest.write_text(text.replace(old,'https://github.com/bingordo/mini-c.git'))
          PY
      - name: Cache Rust objects and dependencies
        if: steps.verified.outputs.cache-hit != 'true' || inputs.force_recheck
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler/tools/mini-c-driver -> target
          key: mini-c-source-differential-v1
          cache-workspace-crates: 'true'
      - name: Build compiler-mini-c once
        if: steps.verified.outputs.cache-hit != 'true' || inputs.force_recheck
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=10s 12m cargo build \
            --manifest-path compiler/tools/mini-c-driver/Cargo.toml \
            -p compiler-mini-c --bin compiler-mini-c \
            2>&1 | tee "$RUNNER_TEMP/mini-c-build.log"
          test -x compiler/tools/mini-c-driver/target/debug/compiler-mini-c
      - name: Run strict native Mini-C Rust unit and targeted M10 tests
        if: steps.verified.outputs.cache-hit != 'true' || inputs.force_recheck
        shell: bash
        run: |
          set -euo pipefail
          cargo test --manifest-path compiler/tools/mini-c-driver/Cargo.toml \
            -p compiler-mini-c --lib
          cargo clippy --manifest-path compiler/tools/mini-c-driver/Cargo.toml \
            -p compiler-mini-c --all-targets -- -D warnings
      - name: Compare compiled Mini-C against GCC
        if: steps.verified.outputs.cache-hit != 'true' || inputs.force_recheck
        shell: bash
        env:
          SEED_COUNT: ${{ inputs.seed_count || '6' }}
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=10s 10m python3 \
            compiler/tools/mini-c-driver/tests/differential.py \
            --compiler "$PWD/compiler/tools/mini-c-driver/target/debug/compiler-mini-c" \
            --seed-count "$SEED_COUNT" --steps 120 --timeout 15 \
            --artifacts "$RUNNER_TEMP/mini-c-failures" \
            2>&1 | tee "$RUNNER_TEMP/mini-c-differential.log"
          grep -Eq "^PASS: [1-9][0-9]* fixtures, $SEED_COUNT seeds, mixed ABI calls and negative cases$" "$RUNNER_TEMP/mini-c-differential.log"
          mkdir -p .mini-c-verified
          printf '%s\n' "${{ steps.source.outputs.sha }}" > .mini-c-verified/source-sha.txt
          echo "Passed fixed, seeded, ABI and negative GCC oracles" >> "$GITHUB_STEP_SUMMARY"
      - name: Probe eight original Csmith TUs on the candidate compiler
        if: steps.verified.outputs.cache-hit != 'true' || inputs.force_recheck
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -qq -y --no-install-recommends csmith libcsmith-dev clang gcc
          version="$(dpkg-query -W csmith | awk '{print $2}')"
          [[ "$version" == 2.3.0-* ]] || { echo "::error::Unexpected Csmith version $version"; exit 1; }
          header="$(dpkg -L libcsmith-dev | grep '/csmith.h$' | head -n1)"
          test -s "$header"
          frontend_sha="$(python3 - <<'PY'
          import sys
          sys.path.insert(0, 'compiler/tools')
          from csmith_probe import pinned_frontend_revision
          print(pinned_frontend_revision(open('compiler/tools/mini-c-driver/Cargo.toml').read()))
          PY
          )"
          test "$frontend_sha" = 3c0e6f4548f24686a65dc29d6acb3d6da04f7d78
          python3 compiler/tools/csmith_probe.py --generate \
            --cases-dir "$RUNNER_TEMP/m10-cases" --csmith csmith \
            --profile restricted-observable --seed-base 1 --seed-count 8
          python3 compiler/tools/csmith_probe.py --probe --preprocess-c \
            --cases-dir "$RUNNER_TEMP/m10-cases" \
            --artifacts-dir "$RUNNER_TEMP/m10-results" \
            --include-dir "$(dirname "$header")" \
            --driver "$PWD/compiler/tools/mini-c-driver/target/debug/compiler-mini-c" \
            --compiler-sha "2e5b57fa00dbabbd2e907c4e79be40e6737e2ea6" \
            --frontend-sha "$frontend_sha" --minimum-native 0 \
            --compile-timeout 15 --run-timeout 3
          python3 - "$RUNNER_TEMP/m10-results/summary.json" <<'PY'
          import json,sys
          summary=json.load(open(sys.argv[1]))
          print("M10_ORIGINAL_CSMITH",json.dumps({k:summary[k] for k in (
              "compiler_sha","frontend_sha","reference_agreed","native_accepted",
              "total_seeds","counts","frontend_blockers","status")},sort_keys=True))
          assert summary['compiler_sha']=="2e5b57fa00dbabbd2e907c4e79be40e6737e2ea6"
          assert summary['frontend_sha']=="3c0e6f4548f24686a65dc29d6acb3d6da04f7d78"
          PY
      - name: Preserve original Csmith seeds and full evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m10-float-prototype-original-csmith
          path: |
            ${{ runner.temp }}/m10-cases/
            ${{ runner.temp }}/m10-results/
          if-no-files-found: ignore
          retention-days: 14
      - name: Save successful exact revision evidence
        if: success() && steps.verified.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .mini-c-verified
          key: mini-c-source-v1-${{ hashFiles('.github/workflows/verify-mini-c-differential.yml') }}-${{ steps.source.outputs.sha }}-${{ inputs.seed_count || '6' }}
      - name: Report cached result
        if: steps.verified.outputs.cache-hit == 'true' && !inputs.force_recheck
        run: echo "Exact compiler revision and seed cohort previously passed" >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve build logs and failing test cases
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: mini-c-source-differential-failures
          path: |
            ${{ runner.temp }}/mini-c-build.log
            ${{ runner.temp }}/mini-c-differential.log
            ${{ runner.temp }}/mini-c-failures/
          if-no-files-found: ignore
          retention-days: 14
