name: Mini-C prebuilt GCC differential tests

on:
  workflow_dispatch:
    inputs:
      expected_source_sha:
        description: 'Expected compiler commit SHA (optional)'
        required: false
        type: string
      seed_count:
        description: 'Generated seed count'
        required: false
        default: '6'
        type: string

permissions:
  contents: read

concurrency:
  group: mini-c-differential
  cancel-in-progress: true

jobs:
  differential:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Download only prebuilt Mini-C bundle
        uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: expr-rule-gen-binaries
          path: private-binary
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
          sparse-checkout: |
            dist/mini-c-differential
      - name: Verify checksum and source commit
        shell: bash
        run: |
          set -euo pipefail
          cd private-binary/dist/mini-c-differential
          grep -Eq '^[0-9a-f]{40}$' source-sha.txt
          expected="${{ inputs.expected_source_sha }}"
          if [ -n "$expected" ]; then
            grep -Eq '^[0-9a-f]{40}$' <<< "$expected"
            test "$(cat source-sha.txt)" = "$expected"
          fi
          sha256sum --check sha256.txt
          tar -tzf mini-c-differential-linux-x86_64.tar.gz | grep -Fx compiler-mini-c
          tar -tzf mini-c-differential-linux-x86_64.tar.gz | grep -Fx differential.py
          mkdir -p "$RUNNER_TEMP/mini-c-differential"
          tar -xzf mini-c-differential-linux-x86_64.tar.gz -C "$RUNNER_TEMP/mini-c-differential"
          test -x "$RUNNER_TEMP/mini-c-differential/compiler-mini-c"
          test -s "$RUNNER_TEMP/mini-c-differential/differential.py"
          echo "Compiler source SHA: $(cat source-sha.txt)"
      - name: Compare prebuilt Mini-C compiler with GCC
        shell: bash
        env:
          SEED_COUNT: ${{ inputs.seed_count }}
        run: |
          set -euo pipefail
          [[ "$SEED_COUNT" =~ ^[0-9]+$ ]] && (( SEED_COUNT <= 64 ))
          python3 "$RUNNER_TEMP/mini-c-differential/differential.py" \
            --compiler "$RUNNER_TEMP/mini-c-differential/compiler-mini-c" \
            --seed-count "$SEED_COUNT" --steps 120 \
            --artifacts "$RUNNER_TEMP/mini-c-failures"
      - name: Upload failed differential cases
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: mini-c-differential-failures
          path: ${{ runner.temp }}/mini-c-failures/
          if-no-files-found: ignore
          retention-days: 14
