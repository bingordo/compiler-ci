name: X7 B3 real Z3 source Integer-width specialization
on:
  push:
    branches: [ci/x7-b3-width-model-specialization-20261111]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-width:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 254c1ae6457f201027ed4633cc919f1c32a3572b
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Pin exact source and independent SMT version
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 254c1ae6457f201027ed4633cc919f1c32a3572b
          python3 -m venv /tmp/x7-width-z3
          /tmp/x7-width-z3/bin/python -m pip install --disable-pip-version-check 'z3-solver==4.13.4.0'
          /tmp/x7-width-z3/bin/python -c 'import z3; print("X7_WIDTH_Z3_VERSION",z3.get_version_string())'
      - name: Execute typed fixed-width model proofs and mutation gates
        run: |
          set -euo pipefail
          /tmp/x7-width-z3/bin/python -m py_compile tools/x86_isl_operation_proof_worker.py
          /tmp/x7-width-z3/bin/python -m unittest discover -s tools -p 'test_x86_isl_operation_proof_worker.py' -v
          /tmp/x7-width-z3/bin/python -m unittest discover -s tools -p 'test_x86_isl_smt_verify.py' -v
          /tmp/x7-width-z3/bin/python -m unittest discover -s tools -p 'test_x86_isl_definedness_smt.py' -v
          /tmp/x7-width-z3/bin/python -m unittest discover -s tools -p 'test_x86_isl_record_effects_smt.py' -v
          echo X7_B3_CONCRETE_INTEGER_WIDTH_Z3_PASS
