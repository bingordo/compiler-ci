name: Standalone Mini-C TypeId cutover (compiler PR 777)
on:
  pull_request:
    paths:
      - .github/workflows/mini-c-typeid-777.yml
permissions:
  contents: read
jobs:
  standalone-mini-c:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.CI_KEY }}
      - run: ssh-keyscan github.com >> ~/.ssh/known_hosts
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: f33a7851a30c959e7e0e9a5eedeba94b2f54c01d
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Verify exact source
        run: test "$(git -C compiler rev-parse HEAD)" = "f33a7851a30c959e7e0e9a5eedeba94b2f54c01d"
      - name: Warnings-denied standalone Mini-C all-target build
        working-directory: compiler
        run: RUSTFLAGS="-D warnings" cargo check --manifest-path tools/mini-c-driver/Cargo.toml --all-targets
      - name: Standalone ELF/GAS runtime and fail-closed TypeId acceptance
        working-directory: compiler
        run: cargo test --manifest-path tools/mini-c-driver/Cargo.toml --test typeid_cli -- --nocapture
      - name: Existing Mini-C library and integration regression
        working-directory: compiler
        run: cargo test --manifest-path tools/mini-c-driver/Cargo.toml -- --test-threads=2
      - name: Strict Clippy across standalone Mini-C targets
        working-directory: compiler
        run: cargo clippy --manifest-path tools/mini-c-driver/Cargo.toml --all-targets -- -D warnings
