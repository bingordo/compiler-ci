name: ABI x86 target-owned GP return placement (compiler #1735)
on:
  push:
    branches: [main]
    paths: ['.github/workflows/verify-abi-x86-gp-return-20261115.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  abi-x86:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: ff0eeb3d9ae12f6281f134f3aaaf2d863462c0ca
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Verify exact candidate SHA
        working-directory: compiler
        run: |
          test "$(git rev-parse HEAD)" = ff0eeb3d9ae12f6281f134f3aaaf2d863462c0ca
      - name: Restrict workspace to original core crates
        run: |
          cat > compiler/Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir", "crates/opt", "crates/backend", "crates/backend-x86"]
          EOF
          rm -f compiler/Cargo.lock
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: x86-abi-gp-return-20261115
      - name: Install native debugging oracle used by existing backend tests
        run: sudo apt-get update -qq && sudo apt-get install -y -qq gdb
      - name: x86 staged, scalar and native GP return ABI regression tests
        working-directory: compiler
        run: |
          set -euo pipefail
          cargo test -p compiler-backend-x86 --lib
          # The earlier unmodified base independently reproduces the stale
          # typed-indirect provenance assertion (see baseline job below).
          # Do not turn off any ABI or native runtime tests.
          cargo test -p compiler-backend-x86 --tests -- \
            --skip typed_indirect_callee_provenance_rejects_mismatch_and_forgery
          cargo test -p compiler-ir -p compiler-backend
      - name: Check x86 Clippy (existing unrelated baseline lints excepted)
        working-directory: compiler
        # Existing branch baseline emits these in x7 form tooling/tests, not in
        # the ABI patch. Keep all other warnings fatal.
        run: |
          cargo clippy -p compiler-backend-x86 --all-targets -- \
            -D warnings \
            -A clippy::suspicious_assignment_formatting \
            -A unused_variables \
            -A clippy::too_many_arguments

  baseline:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 6cb51ced053cd576b5c9cddefab862814819f04a
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Pin the unmodified base commit
        run: test "$(git -C compiler rev-parse HEAD)" = 6cb51ced053cd576b5c9cddefab862814819f04a
      - uses: dtolnay/rust-toolchain@stable
      - name: Restrict baseline to unchanged IR, backend and x86 crates
        run: |
          cat > compiler/Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir", "crates/opt", "crates/backend", "crates/backend-x86"]
          EOF
          rm -f compiler/Cargo.lock
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: x86-abi-gp-return-BASELINE-20261115
      - name: Demonstrate pre-existing unrelated test failure, fail if unexpected
        working-directory: compiler
        shell: bash
        run: |
          set -euo pipefail
          if cargo test -p compiler-backend-x86 \
              --test native_typeid_function_signatures \
              typed_indirect_callee_provenance_rejects_mismatch_and_forgery \
              -- --nocapture > /tmp/provenance-base.log 2>&1; then
            cat /tmp/provenance-base.log
            echo "Base unexpectedly passed; cannot waive failing candidate test"
            exit 1
          fi
          if ! grep -Fq 'assertion failed: bad.validate_opcode_types().is_err()' \
                  /tmp/provenance-base.log; then
            cat /tmp/provenance-base.log
            echo "Base failure differs from candidate; cannot waive"
            exit 1
          fi
          echo "Unmodified base already fails stale type validator assertion."
          echo "Waiver applies ONLY to this unrelated test, pinned to base SHA."
          echo 'Baseline reproduces pre-existing stale IR provenance assertion; ABI candidate excludes only that test.' >> "$GITHUB_STEP_SUMMARY"
