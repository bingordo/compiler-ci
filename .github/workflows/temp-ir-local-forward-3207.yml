name: Temporary combined local forwarding and array fold retirement acceptance
on:
  pull_request:
    paths: ['.github/workflows/temp-ir-local-forward-3207.yml']
permissions:
  contents: read
jobs:
  local-forward-retirement:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      SOURCE_SHA: 957e1d48a2c4fe799c80e190478b7b168111fc02
      CARGO_INCREMENTAL: '0'
      CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: ${{ env.SOURCE_SHA }}
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Confirm source and isolate core workspace
        working-directory: compiler
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          cat > Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir", "crates/opt", "crates/backend", "crates/backend-x86", "crates/backend-aarch64"]
          EOF
          rm -f Cargo.lock
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: ir-local-forward-retirement
      - name: Audit all tracked historical wrapper calls
        working-directory: compiler
        run: |
          set -euo pipefail
          if git grep -nE '(^|[^[:alnum:]_])local_memory::|compiler_opt::local_memory([^[:alnum:]_]|$)|\bfold_constant_local_array_indices\b' -- '*.rs' '*.toml'; then
            echo "Historical local forwarding callers remain"
            exit 1
          fi
      - name: Native exact SSA and independent C execution
        if: ${{ !cancelled() }}
        working-directory: compiler
        run: cargo test --no-fail-fast -p compiler-opt --test typed_local_memory --test local_memory_native --test typed_native_parity --test memory_execution_oracle --test typed_array_fold
      - name: Native array folding does not invoke historical verifier
        if: ${{ !cancelled() }}
        working-directory: compiler
        run: cargo test -p compiler-opt --test typed_array_fold --features verify-counts
      - name: Optimizer all-target and unit regression
        if: ${{ !cancelled() }}
        working-directory: compiler
        run: |
          set -euo pipefail
          cargo check -p compiler-opt --lib
          cargo check -p compiler-opt --all-targets
          cargo test -p compiler-opt --lib
      - name: Permanent graph exclusion
        if: ${{ !cancelled() }}
        working-directory: compiler
        run: python3 tools/check_mixed_function_export_boundary.py

  main-baseline-indirect-oracles:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      SOURCE_SHA: 1094ddc531bd2548524c51e8fdb49ef9e794d48c
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: ${{ env.SOURCE_SHA }}
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Verify unmodified main source and isolate core workspace
        working-directory: compiler
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          cat > Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir", "crates/opt", "crates/backend", "crates/backend-x86", "crates/backend-aarch64"]
          EOF
          rm -f Cargo.lock
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: ir-local-forward-retirement-baseline
      - name: Test full seeded optimizer corpus on unmodified main
        working-directory: compiler
        run: cargo test -p compiler-opt --test typed_native_parity
