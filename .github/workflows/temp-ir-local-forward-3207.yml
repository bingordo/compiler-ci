name: Temporary historical local forwarding retirement acceptance
on:
  pull_request:
    paths: ['.github/workflows/temp-ir-local-forward-3207.yml']
permissions:
  contents: read
jobs:
  local-forward-retirement:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      SOURCE_SHA: 972bd35c5172b97c96f314e24ffde7b385c5eeaf
      CARGO_INCREMENTAL: '0'
      CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: ${{ env.SOURCE_SHA }}
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Confirm source and isolate core workspace
        working-directory: compiler
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          cat > Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir", "crates/opt", "crates/backend", "crates/backend-x86", "crates/backend-aarch64"]
          EOF
          rm -f Cargo.lock
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: ir-local-forward-retirement
      - name: Audit all tracked historical wrapper calls
        working-directory: compiler
        run: |
          set -euo pipefail
          if git grep -nE '(^|[^[:alnum:]_])local_memory::|compiler_opt::local_memory([^[:alnum:]_]|$)' -- '*.rs' '*.toml'; then
            echo "Historical local forwarding callers remain"
            exit 1
          fi
      - name: Native exact SSA and independent C execution
        if: ${{ !cancelled() }}
        working-directory: compiler
        run: cargo test --no-fail-fast -p compiler-opt --test typed_local_memory --test local_memory_native --test typed_native_parity --test memory_execution_oracle
      - name: Optimizer all-target and unit regression
        if: ${{ !cancelled() }}
        working-directory: compiler
        run: |
          set -euo pipefail
          cargo check -p compiler-opt --lib
          cargo check -p compiler-opt --all-targets
          cargo test -p compiler-opt --lib
      - name: Permanent graph exclusion
        if: ${{ !cancelled() }}
        working-directory: compiler
        run: python3 tools/check_mixed_function_export_boundary.py

  main-baseline-indirect-oracles:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      SOURCE_SHA: df89a0e93d79b61acb83f041d42e99be7eef1c3b
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: ${{ env.SOURCE_SHA }}
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Verify unmodified main source and isolate core workspace
        working-directory: compiler
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          cat > Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir", "crates/opt", "crates/backend", "crates/backend-x86", "crates/backend-aarch64"]
          EOF
          rm -f Cargo.lock
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: ir-local-forward-retirement-baseline
      - name: Test full seeded optimizer corpus on unmodified main
        working-directory: compiler
        run: cargo test -p compiler-opt --test typed_native_parity
