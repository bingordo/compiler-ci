name: Validate x86 main cost-import fix
on:
  pull_request:
    paths:
      - '.github/workflows/verify-x86-main-cost-import-fix.yml'
permissions:
  contents: read
jobs:
  x86-main-compat:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 6b97c2a53cc66f8fbb509a2d07e582166253cb1d
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Verify x86 Python source/profile test discovery
        run: |
          set -euo pipefail
          test "$(git -C compiler rev-parse HEAD)" = 6b97c2a53cc66f8fbb509a2d07e582166253cb1d
          cd compiler
          python3 -m unittest discover -s tests -p 'test_x86_*.py' -v
          python3 -m unittest discover -s tools -p 'test_x86_generic_form_matcher.py' -v
          python3 tools/validate_x86_costs.py data/x86_costs_generic.json
      - name: Compile x86 backend and run native regression
        run: |
          set -euo pipefail
          mkdir -p /tmp/x86-main-workspace/crates
          cp -a compiler/tools /tmp/x86-main-workspace/
          cp -a compiler/data /tmp/x86-main-workspace/
          for c in ir opt backend backend-x86 backend-aarch64; do
            cp -a "compiler/crates/$c" /tmp/x86-main-workspace/crates/
          done
          printf '[workspace]\nresolver = "2"\nmembers = ["crates/ir","crates/opt","crates/backend","crates/backend-x86","crates/backend-aarch64"]\n' > /tmp/x86-main-workspace/Cargo.toml
          cd /tmp/x86-main-workspace
          RUSTFLAGS='-D warnings' cargo check -p compiler-backend-x86 --lib
          cargo test -p compiler-backend-x86 --lib -- --test-threads=1
