name: Validate x86 selected overlap-safe bulk move PR 2956
on:
  push:
    branches: [ci-memcpy-x86-memmove-pr-20261123]
    paths: ['.github/workflows/ci-memcpy-x86-memmove-pr2956.yml']
  pull_request:
    paths: ['.github/workflows/ci-memcpy-x86-memmove-pr2956.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-memmove:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 9d1f1d527db0a1913a66fd48716d49dfad122535
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Verify source commit
        run: test "$(git -C compiler rev-parse HEAD)" = 9d1f1d527db0a1913a66fd48716d49dfad122535
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.CI_KEY }}
      - run: ssh-keyscan github.com >> ~/.ssh/known_hosts
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: x86-memmove-pr2956
      - name: Verify Rust formatter in new implementation and tests
        working-directory: compiler
        run: rustfmt --check --edition 2021 crates/backend-x86/src/bulk_move.rs crates/backend-x86/tests/unit/bulk_move.rs
      - name: Selected machine and independent GCC GAS/direct-ELF overlap oracle
        working-directory: compiler
        run: cargo test -p compiler-backend-x86 --lib bulk_move_tests -- --nocapture
      - name: Existing machine memcpy regression
        working-directory: compiler
        run: cargo test -p compiler-backend-x86 --lib bulk_copy -- --nocapture
      - name: Existing selected memset regression
        working-directory: compiler
        run: cargo test -p compiler-backend-x86 --lib bulk_fill_tests -- --nocapture
      - name: Shared bulk-memory contract
        working-directory: compiler
        run: cargo test -p compiler-backend --lib bulk_memory -- --nocapture
      - name: Full x86 library tests excluding two recorded baseline cases
        working-directory: compiler
        run: cargo test -p compiler-backend-x86 --lib -- --skip x4_generated_rules_preserve_cfg_phi_edges_and_pressure_in_both_native_sinks --skip native_s2314_matchpd_factor_gas_elf_per_family
