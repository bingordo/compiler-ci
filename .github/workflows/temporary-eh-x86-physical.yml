# Temporary native physical EH validation; do not merge.
name: Final x86 physical call ranges and GCC EH interoperability
on:
  pull_request:
    paths: ['.github/workflows/temporary-eh-x86-physical.yml']
permissions:
  contents: read
jobs:
  x86:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      SOURCE_SHA: c1b2edc79ebfd7c91dbef3b30943160aad18e024
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: ${{ env.SOURCE_SHA }}
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Verify exact revision and isolate backend workspace
        run: |
          set -euo pipefail
          test "$(git -C compiler rev-parse HEAD)" = "$SOURCE_SHA"
          cat > compiler/Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir-macros", "crates/ir", "crates/backend", "crates/backend-x86"]
          EOF
          rm -f compiler/Cargo.lock
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: temporary-eh-shared-cfi
          cache-on-failure: true
      - name: Existing native backend regressions and actual physical x86 EH
        working-directory: compiler
        run: |
          set -euo pipefail
          cargo test -p compiler-backend -p compiler-backend-x86 --lib
          cargo test -p compiler-backend-x86 --test exception_physical_runtime -- --nocapture
