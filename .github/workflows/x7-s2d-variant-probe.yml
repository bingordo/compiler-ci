name: X7 S2D inspect pinned XED variant metadata
on:
  push:
    branches: [feature/x7-s2d-variant-contracts-20261114]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Download already validated exact-source candidate join
        uses: actions/download-artifact@v4
        with:
          name: x7-s2-pinned-intel-xed-variant-join
          run-id: 43615224836
          repository: bingordo/compiler-ci
          github-token: ${{ github.token }}
          path: /tmp/variants
      - name: Count real-world operand, opcode and feature field shapes
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          from collections import Counter
          d=json.loads(Path('/tmp/variants/join-1.json').read_text())
          forms=d['forms']
          hist=Counter()
          samples={}
          for f in forms:
              for v in f['xed_variants']:
                  x=v['identity']
                  for key in ('explicit_operands','parsed_operands','operand_list','implicit_operands','mod_required','opcode_base16','map','encoding_space','osz_66_required','f2_required','f3_required','rexw_prefix','cpuid_groups','isa_set','flags','eosz_list','easz_list','mode_restriction'):
                      val=x.get(key)
                      shape=type(val).__name__
                      if isinstance(val,list) and val: shape+=':'+type(val[0]).__name__
                      hist[(key,shape)]+=1
                      if (key,shape) not in samples: samples[(key,shape)]=str(val)[:360]
          for (k,shape),count in sorted(hist.items(),key=lambda x:(x[0][0],-x[1])):
              print('XED_FIELD',k,shape,count,samples[(k,shape)])
          for kind in ('unique_exact_xed_variant_candidate_unproved','multiple_exact_xed_variants_need_constraints','all_xed_variants_contradict_intel_source'):
              found=next((f for f in forms if f['join_status']==kind),None)
              if found:
                  print('XED_REAL_EXAMPLE',kind,found['xed_iform'],json.dumps(found['xed_variants'][0]['identity'],sort_keys=True)[:3500])
          PY
