name: IR F8 Oberon source ABI and ELF GAS tests on native TypeId
on:
  push:
    branches: [ci/f8-oberon-typeid-runtime-20261111]
    paths: ['.github/workflows/f8-oberon-typeid-runtime.yml']
permissions:
  contents: read
jobs:
  native-oberon-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: e43bf09c4e800a683d6ad5b68e4e17bc4baabf52
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Attest exact source and Oberon checked-source test migration
        run: |
          set -euo pipefail
          test "$(git -C compiler rev-parse HEAD)" = e43bf09c4e800a683d6ad5b68e4e17bc4baabf52
          python3 - <<'PY'
          from pathlib import Path
          s=Path('compiler/crates/driver/tests/unit/driver_cases.rs').read_text()
          names=[
            'checked_oberon_sixteen_arguments_and_nested_calls_link_to_c',
            'checked_oberon_eight_integer_arguments_roundtrip_to_c',
            'checked_oberon_live_across_nested_calls_and_stack_arguments',
            'checked_oberon_direct_calls_link_and_execute_with_recursion',
            'compiles_checked_oberon_in_process',
            'rejects_bad_oberon',
            'emits_if_while_and_phi_edges',
            'multi_procedure_direct_elf_object_links_and_runs',
            'compiles_native_integer_loops_against_c_reference',
          ]
          for name in names:
              span=s.split('fn '+name+'()',1)[1].split('\n    #[',1)[0]
              assert 'emit_typeid_source(src,"oberon"' in span, name
              assert 'compile_object(' not in span and 'compile(src,' not in span, name
              assert 'lower_functions(' not in span, name
          PY
          git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: oberon-typeid-driver-f8
      - name: Full real Oberon checked-source tests, native ELF/GAS and x86 runtime
        working-directory: compiler
        run: |
          set -euo pipefail
          cargo test -p compiler --bin compiler -- --test-threads=2
          cargo test -p compiler --test f6_source_runtime_parity -- --test-threads=1
          cargo test -p compiler --test mini_c_cli --test ir_default_cli -- --test-threads=2
          cargo test -p compiler-ir -p compiler-opt --lib -- --test-threads=2
          cargo clippy -p compiler -p compiler-ir -p compiler-opt --all-targets -- -D warnings
