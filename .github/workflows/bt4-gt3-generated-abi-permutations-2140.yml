# Source-pinned GT3 actual outgoing CALL parallel register/stack hazards and result scratch live-through.
# Independent C GAS ELF call reference and all x86/ARM historical oracles remain required.
# Acceptance includes exact native original i64 PHI cycle and all retained historical ABI oracles.
# Exact-source 0/2/8 GP instructionful dead-formal C GAS ELF and preserved 16-family regression.
# Run exact full validation of returned ABI GP register in both GNU GAS and direct ELF.
# Final documented compiler SHA acceptance; all jobs remain external to compiler.
name: BT4 GT3 generated SysV permutations x86 ARM
on:
  pull_request:
    paths: ['.github/workflows/bt4-gt3-generated-abi-permutations-2140.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  aarch64-native:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 35
    env:
      CARGO_INCREMENTAL: '0'
      SOURCE_SHA: 18470b56a1096fbf2e979488af4eca1da8f60fe1
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 18470b56a1096fbf2e979488af4eca1da8f60fe1
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Verify exact compiler and persistent source boundary
        run: |
          set -euo pipefail
          test "$(git -C compiler rev-parse HEAD)" = "$SOURCE_SHA"
          python3 compiler/tools/check_bt4_backend_boundary.py
      - name: Isolate native ARM core Rust workspace
        run: |
          cat > compiler/Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir", "crates/opt", "crates/backend", "crates/backend-x86", "crates/backend-aarch64"]
          EOF
          rm -f compiler/Cargo.lock
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: bt4-gt3-tied-imul-sidebyside-20261116
      - name: Strict native ARM full AArch64 all-target compile
        working-directory: compiler
        run: RUSTFLAGS='-D warnings' cargo check -p compiler-backend-aarch64 --all-targets
      - name: Native historical machine quality four exact byte tests and five C oracles
        working-directory: compiler
        run: cargo test -p compiler-backend-aarch64 --test typeid_historical_pressure -- --nocapture
      - name: AArch64 all-native TypeId after complete Function historical source deletion
        working-directory: compiler
        run: cargo test -p compiler-backend-aarch64 --all-targets -- --test-threads=1
      - name: Strict AArch64 native test Clippy
        working-directory: compiler
        run: cargo clippy -p compiler-backend-aarch64 --lib --test typeid_historical_pressure -- -D warnings
  full-workspace:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      CARGO_INCREMENTAL: '0'
      SOURCE_SHA: 18470b56a1096fbf2e979488af4eca1da8f60fe1
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 18470b56a1096fbf2e979488af4eca1da8f60fe1
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.CI_KEY }}
      - name: Pin exact compiler and source-boundary test
        run: |
          set -euo pipefail
          test "$(git -C compiler rev-parse HEAD)" = "$SOURCE_SHA"
          ssh-keyscan github.com >> "$HOME/.ssh/known_hosts"
          python3 compiler/tools/check_bt4_backend_boundary.py
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler
          key: bt4-x86-final-budget-full-1874
      - name: GT-1 physical witness coverage and deliberate deleted Jcc/64bit spill mutants
        working-directory: compiler
        run: cargo test -p compiler-backend-x86 --test bt4_gt1_coverage_manifest -- --nocapture
      - name: GT3 physical 16-byte frame policy and every return path exact negative mutations
        working-directory: compiler
        run: cargo test -p compiler-backend-x86 --test bt4_gt3_frame_alignment_native -- --nocapture
      - name: GT-1 C GAS ELF sixteen canonical families including mixed seven nine signed stack and sixteen incoming reverse
        working-directory: compiler
        run: cargo test -p compiler-backend-x86 --test bt4_gt1_generated_native_differential -- --nocapture
      - name: Existing GT-2 Alive-lite proof bridge shares canonical 12-family source
        working-directory: compiler
        run: cargo test -p compiler-opt --test alive_lite gt2_generated_typeid -- --nocapture
      - name: Original six signed i32 compare-branches direct CMP Jcc native 2/0 C ELF/GAS
        working-directory: compiler
        run: cargo test -p compiler-backend-x86 --test bt4_x86_historical_signed_cmp_branches_native -- --nocapture
      - name: Original 7/13 64-bit pointer parallel swap native TypeId physical C GAS/ELF
        working-directory: compiler
        run: cargo test -p compiler-backend-x86 --test bt4_x86_historical_wide_copy_cycle_native -- --nocapture
      - name: Original 4-value pointer PHI two-local source 64-bit spill C ELF/GAS
        working-directory: compiler
        run: cargo test -p compiler-backend-x86 --test bt4_x86_historical_pointer_phi_native -- --nocapture
      - name: Original indexed local memory store-load native LEA, 64-bit spill, R11D and C ELF/GAS
        working-directory: compiler
        run: cargo test -p compiler-backend-x86 --test bt4_x86_historical_memory_roundtrip_native -- --nocapture
      - name: Exact outgoing CALL hazard and result-temp physical frame unit regression
        working-directory: compiler
        run: cargo test -p compiler-backend-x86 --lib real_call_frame_omits_unused_outgoing_and_result_words_but_keeps_tail_slots -- --nocapture
      - name: Original TypeId PHI-wide copy packed live source and frame unit tests
        working-directory: compiler
        run: cargo test -p compiler-backend-x86 --lib original_source_owned_edges_reserve_only_live_noncoalesced_temp_words -- --nocapture
      - name: Instructionful dead-parameter generic-RA projections and wrong-source C GAS ELF mutants
        working-directory: compiler
        run: cargo test -p compiler-backend-x86 --test bt4_gt3_dead_parameter_homes_native -- --nocapture
      - name: Original SingleLive production full-bank and budget8 no-frame no-copy x86 GAS ELF C
        working-directory: compiler
        run: cargo test -p compiler-backend-x86 --test bt4_x86_single_live_ingress_native -- --nocapture
      - name: Original LiveThrough two-block dead PHI C11 combined ELF/GAS physical oracle
        working-directory: compiler
        run: cargo test -p compiler-backend-x86 --test bt4_x86_historical_dead_phi_native -- --nocapture
      # Pre-existing independent X7 S4 native-vs-shared emitter byte-parity
      # failure (Swap/ProfileWide, diagnostic 15 colors vs production writer).
      # Exact base/candidate blob IDs for this unchanged test and emitter
      # match. Keep the test intact in compiler; track under compiler #1949.
      # This scoped GT3 acceptance does not claim that gate passed.
      # Existing diagnostic full-bank vs production physical-profile mismatch:
      # original_profile_wide_executes... / original_9_and_15_color_profile...
      # This source-unmodified byte-parity category belongs to X7 S4 #1949;
      # it remains enabled in the compiler suite and is NOT considered green.
      # Original cyclic PHI label-format witness fails unchanged on PR base;\n      # retain exact unsupported 17-argument rejection without weakening it.\n      - name: BT4 original 17-argument native ABI rejection
        working-directory: compiler
        run: cargo test -p compiler-backend-x86 --test bt4_x86_historical_arity_phi_native original_17_gp_call_arity_rejected_by_every_native_emitter -- --exact --nocapture
      - name: Entire compiler workspace all-targets with frontend and driver
        working-directory: compiler
        run: cargo check --workspace --all-targets
      - name: Both production TypeId backends optimized without historical feature
        working-directory: compiler
        run: cargo check -p compiler-backend-x86 -p compiler-backend-aarch64 --release --lib
      - name: Strict original native x86 ProfileWide pressure/ABI Clippy
        working-directory: compiler
        run: cargo clippy -p compiler-backend-x86 --lib --test bt4_x86_profile_wide_native --test bt4_x86_physical_budget_native --test bt4_x86_historical_dead_phi_native --test bt4_x86_single_live_ingress_native --test bt4_x86_historical_memory_roundtrip_native --test bt4_x86_historical_pointer_phi_native --test bt4_x86_historical_wide_copy_cycle_native --test bt4_x86_historical_signed_cmp_branches_native --test bt4_gt1_generated_native_differential --test bt4_gt1_coverage_manifest --test bt4_gt3_frame_alignment_native --test bt4_gt3_dead_parameter_homes_native -- -D warnings
      - name: GT3 retained historical CMP Bool and SHL31 machine quality after C runner pruning
        working-directory: compiler
        run: |
          cargo test -p compiler-backend-x86 --lib fused_compare_branch_executes_after_flag_clobber_and_phi_copies
          cargo test -p compiler-backend-x86 --lib multiply_used_boolean_remains_materialized_across_phi_edges
          cargo test -p compiler-backend-x86 --lib selected_power_of_two_rules_execute_against_c_with_imul_fallback
          cargo test -p compiler-backend-x86 --lib tied_two_address_add_sub_execute_with_live_sources_and_spills
          cargo test -p compiler-backend-x86 --lib imul_is_tied_to_allocated_destination_with_stack_fallback
          cargo test -p compiler-backend-x86 --lib seven_and_nine_arg_calls_preserve_negative_values_and_outgoing_slots
          cargo test -p compiler-backend-x86 --lib sixteen_integer_arguments_roundtrip_through_c_with_live_across_call
          cargo test -p compiler-backend-x86 --lib machine_ssa_eight_args_call_and_stack_entry_agree_with_c
          cargo test -p compiler-backend-x86 --lib outgoing_sysv_stack_area_never_overlaps_spills_phi_temp_or_locals
          cargo test -p compiler-backend-x86 --lib frame_layout_keeps_spills_cycle_temp_and_locals_disjoint
          cargo test -p compiler-backend-x86 --lib abi_ingress_avoids_unnecessary_stack_slots_and_copies
          cargo test -p compiler-backend-x86 --lib local_frame_region_preserves_eight_byte_alignment
          cargo test -p compiler-backend-x86 --lib cyclic_abi_parallel_copy_and_fanout_run_from_elf_and_assembly
      - name: Full retained x86 backend library historical machine and ABI oracles
        working-directory: compiler
        run: cargo test -p compiler-backend-x86 --lib -- --test-threads=1
      - name: Native x86 narrow SSA CFG and flags/call regressions
        working-directory: compiler
        run: |
          cargo test -p compiler-backend-x86 --test m4_scalar_native --test native_typeid_call_liveness
          cargo test -p compiler-backend-x86 --test native_typeid_fused_cmp_select --test review_narrow_shift_oracle
          cargo test -p compiler-backend-x86 --test t5_x86_flag_provenance --test typed_i64_compare_branch_native
      - name: Positive boundary 16 mixed SysV arguments executable C11 ELF and GAS
        working-directory: compiler
        run: cargo test -p compiler-backend-x86 --test mixed_sixteen_call_native -- --nocapture
      - name: x86 native CMOV ABI and compiler optimizer original C references
        working-directory: compiler
        run: |
          cargo test -p compiler-opt --test if_conversion_typeid_remaining
          cargo test -p compiler-backend-x86 --test native_typeid_select_cmov --test typed_alias_calls_native
      - name: Check parsed JSON coverage counts, source pin and real physical witnesses
        working-directory: compiler
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path("target/bt4-gt1-coverage/physical-manifest.json").read_text())
          assert data["schema_version"] == 1
          assert data["compiler_sha"] == "18470b56a1096fbf2e979488af4eca1da8f60fe1"
          assert data["ir_format"] == "native-v3"
          assert data["machine_proof"] == "NOT_ADMITTED"
          assert data["execution_status"] == "SEPARATE_GT1_C_GAS_ELF_TEST_REQUIRED"
          records=data["records"]
          assert data["families"] == 16 and data["seeds_per_family"] == 4
          assert len(records) == 768
          assert len(records) == data["families"]*data["seeds_per_family"]*12
          calls=[r for r in records if r["family"] in (9,10,11)]
          assert len(calls) == 144
          assert all(r["calls"] == 1 for r in calls)
          assert all(r["store32"] > 0 for r in calls if r["family"] in (10,11))
          assert sum(r["calls"] for r in records) == 288
          keys={(r["family"],r["seed"],r["gp_budget"],r["pic"],r["framed"]) for r in records}
          assert len(keys) == len(records)
          assert all(r["physical_ops"] > 0 and r["illegal_mem_to_mem"] == 0 for r in records)
          for r in records:
              if r["family"] == 7 and r["gp_budget"] == 0:
                  assert r["stack_load64"] > 0 and r["stack_store64"] > 0
              if r["family"] == 6:
                  assert r["lea64"] > 0 and r["load32"] > 0 and r["store32"] > 0
          arithmetic=[r for r in records if r["family"] in (12,13)]
          assert len(arithmetic)==96
          assert all(r["source_entry_args"]==3 for r in arithmetic)
          assert all(r["add32"]>=2 and r["sub32"]>=2
                     for r in arithmetic if r["family"]==12)
          assert all(r["reg_to_eax32"]>0 for r in arithmetic
                     if r["family"]==12 and r["gp_budget"]==15)
          assert all(r["load32"]>0 and r["store32"]>0 for r in arithmetic
                     if r["family"]==12 and r["gp_budget"]==0)
          assert all(r["mul"]>=3 for r in arithmetic if r["family"]==13)
          assert all(r["imul_eax32"]>=3 for r in arithmetic
                     if r["family"]==13 and r["gp_budget"]==0)
          assert data["allocated_non_eax_imul_parity"].startswith("NOT_ESTABLISHED")
          distinct_immul_non_eax=sum(r["imul_other_gp32"] for r in arithmetic
                                   if r["family"]==13 and r["gp_budget"]==15)
          outgoing=[r for r in records if r["family"] in (9,10,11)]
          assert len(outgoing)==144
          assert sum(r["abi_exact_rsp32_stores"] for r in outgoing)==576
          assert sum(r["abi_outgoing_words"] for r in outgoing)==576
          assert all(r["abi_exact_rsp32_stores"]=={9:0,10:2,11:10}[r["family"]]
                     for r in outgoing)
          assert all(r["abi_frame_bytes"]>{9:0,10:16,11:80}[r["family"]]
                     for r in outgoing)
          assert all(r["abi_frame_accesses"]>0 for r in outgoing)
          assert sum(r["abi_local_leas"] for r in outgoing if r["family"]==11)>=48
          assert all(r["abi_nearest_non_arg_frame_offset"]>=r["abi_outgoing_words"]*8
                     for r in outgoing)
          print("BT4_GT3_OUTGOING_ABI_VERIFIED",len(outgoing),
                "exact_rsp32_stores",sum(r["abi_exact_rsp32_stores"] for r in outgoing),
                "local_leas",sum(r["abi_local_leas"] for r in outgoing))
          print("BT4_GT3_TIED_IMUL_PHYSICAL", len(arithmetic),
                "non_eax_imul_wide",distinct_immul_non_eax,
                "parity NOT_ESTABLISHED")
          mixed=[r for r in records if r["family"] in (14,15)]
          assert len(mixed)==96
          assert all(r["abi_call_sites"]==2 and r["abi_outgoing_words"]==4
                     and r["abi_exact_rsp32_stores"]==4
                     and r["abi_incoming_stack_words"]==0 and
                     r["source_entry_args"]==2 for r in mixed if r["family"]==14)
          assert all(r["abi_call_sites"]==1 and r["abi_outgoing_words"]==10
                     and r["abi_exact_rsp32_stores"]==10
                     and r["abi_incoming_stack_words"]==10 and
                     r["source_entry_args"]==16 for r in mixed if r["family"]==15)
          allcalls=[r for r in records if r["family"] in (9,10,11,14,15)]
          assert len(allcalls)==240
          assert sum(r["abi_call_sites"] for r in allcalls)==288
          assert sum(r["abi_exact_rsp32_stores"] for r in allcalls)==1248
          assert sum(r["abi_incoming_stack_words"] for r in allcalls)==480
          assert all(r["abi_nearest_non_arg_frame_offset"]>=r["abi_outgoing_words"]*8
                     for r in allcalls)
          print("BT4_GT3_MIXED_ABI_VERIFIED",
                "physical_calls",sum(r["abi_call_sites"] for r in allcalls),
                "outgoing_stores",sum(r["abi_exact_rsp32_stores"] for r in allcalls),
                "incoming_16_stack_words",sum(r["abi_incoming_stack_words"] for r in allcalls))
          print("BT4_GT1_JSON_VALIDATED",len(records), "rows; proof NOT_ADMITTED")
          PY
      - name: Upload deterministic TypeId physical coverage JSON
        uses: actions/upload-artifact@v4
        with:
          name: bt4-gt1-physical-coverage
          path: compiler/target/bt4-gt1-coverage/physical-manifest.json
          if-no-files-found: error
      - name: Preserve reproducible generated TypeId failures
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: bt4-gt1-repro-${{ github.run_id }}
          path: compiler/target/bt4-gt1-repros/**
          if-no-files-found: ignore
