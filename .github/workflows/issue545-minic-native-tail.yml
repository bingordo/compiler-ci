name: Native Mini-C source musttail to TypeId x86 (#545)
on:
  pull_request:
    paths: ['.github/workflows/issue545-minic-native-tail.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  minic-native:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 1fda56839c263d5cd112f33acace42349a96d6ba
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Verify exact compiler candidate and Mini-C dependency pin
        run: |
          test "$(git -C compiler rev-parse HEAD)" = '1fda56839c263d5cd112f33acace42349a96d6ba'
          grep -Fq '72bdda236cd45d1b696b2c51ef8d7c9339ec342d' compiler/tools/mini-c-driver/Cargo.toml
          echo "compiler 1fda56839c263d5cd112f33acace42349a96d6ba" >> "$GITHUB_STEP_SUMMARY"
      - name: Use public pinned Mini-C dependency
        run: git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler/tools/mini-c-driver -> target
          key: issue545-minic-native-source
      - name: Build Mini-C to canonical TypeId native bridge
        run: cargo check --manifest-path compiler/tools/mini-c-driver/Cargo.toml -p compiler-mini-c --lib --test musttail_source_native
      - name: Source musttail x86 canonical ELF GAS C11 execution
        run: cargo test --manifest-path compiler/tools/mini-c-driver/Cargo.toml -p compiler-mini-c --test musttail_source_native -- --nocapture
      - name: Source-native M4.8 linked smoke
        run: cargo test --manifest-path compiler/tools/mini-c-driver/Cargo.toml -p compiler-mini-c --test m4_8_source_native -- --nocapture
      - name: Native TypeId local frame escape safety and anti-alias unit tests
        run: |
          mkdir -p ir-work/crates
          cp -a compiler/crates/ir ir-work/crates/
          cat > ir-work/Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir"]
          EOF
          cargo test --manifest-path ir-work/Cargo.toml -p compiler-ir --test musttail_frame_escape -- --nocapture
      - name: Broader Mini-C library baseline (non-gating; known unrelated failures)
        continue-on-error: true
        run: |
          cargo test --manifest-path compiler/tools/mini-c-driver/Cargo.toml -p compiler-mini-c --lib -- --test-threads=2
      - name: Focused checked source Clippy correctness
        run: cargo clippy --manifest-path compiler/tools/mini-c-driver/Cargo.toml -p compiler-mini-c --lib -- -D clippy::correctness

  minic-aarch64-native:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 35
    env:
      CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 1fda56839c263d5cd112f33acace42349a96d6ba
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Verify exact source and merged Mini-C frontend
        run: |
          test "$(git -C compiler rev-parse HEAD)" = '1fda56839c263d5cd112f33acace42349a96d6ba'
          grep -Fq '72bdda236cd45d1b696b2c51ef8d7c9339ec342d' compiler/tools/mini-c-driver/Cargo.toml
      - name: Configure public GitHub dependency
        run: git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler/tools/mini-c-driver -> target
          key: issue545-minic-source-aarch64
      - name: Build canonical Mini-C source to AArch64 native target
        run: cargo check --manifest-path compiler/tools/mini-c-driver/Cargo.toml -p compiler-mini-c --test musttail_source_aarch64
      - name: Native ARM64 C11 independent host ELF and GAS PIC/nonPIC
        run: cargo test --manifest-path compiler/tools/mini-c-driver/Cargo.toml -p compiler-mini-c --test musttail_source_aarch64 -- --nocapture
