name: IR TypeId cutover parity (compiler PR 722)
on:
  pull_request:
    paths:
      - '.github/workflows/ir-cutover-parity-722.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ir-cutover-parity-722-${{ github.ref }}
  cancel-in-progress: true
jobs:
  parity:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.CI_KEY }}
      - run: ssh-keyscan github.com >> ~/.ssh/known_hosts
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 66b59139c028e1543f071e140a37772bfe1025bc
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler
          key: ir-cutover-parity-722
      - name: Verify exact compiler PR SHA
        run: test "$(git -C compiler rev-parse HEAD)" = "66b59139c028e1543f071e140a37772bfe1025bc"
      - name: Compile all driver targets with warnings denied
        working-directory: compiler
        run: RUSTFLAGS="-D warnings" cargo check -p compiler --all-targets
      - name: Execute TypeId versus legacy parity matrix
        working-directory: compiler
        run: cargo test -p compiler --bin compiler legacy_and_typeid_checked_sources_match_c_oracles_in_gas_and_elf -- --nocapture
      - name: Execute PIC and frame-pointer TypeId matrix
        working-directory: compiler
        run: cargo test -p compiler --bin compiler typeid_source_pic_and_frame_pointer_modes_execute_both_emitters -- --nocapture
      - name: Full driver regression
        working-directory: compiler
        run: cargo test -p compiler --bin compiler -- --test-threads=2
      - name: Strict driver Clippy
        working-directory: compiler
        run: cargo clippy -p compiler --all-targets -- -D warnings
      - name: Report accepted source
        run: |
          echo "Compiler PR #722 exact source 66b59139c028e1543f071e140a37772bfe1025bc" >> "$GITHUB_STEP_SUMMARY"
