name: LTO object sidecar fingerprint validation
on:
  push:
    branches: [verify/lto-object-sidecar-fingerprint-20261115]
    paths: ['.github/workflows/lto-object-sidecar-fingerprint-20261115.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sidecar-binding:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 547e0b878981fd5298c75be3e1cc6c5cb2fdde70
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Verify SHA and public frontend deps
        run: |
          test "$(git -C compiler rev-parse HEAD)" = "547e0b878981fd5298c75be3e1cc6c5cb2fdde70"
          git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
      - name: Focus driver workspace
        run: |
          cat > compiler/Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir", "crates/opt", "crates/backend", "crates/backend-x86", "crates/backend-aarch64", "crates/driver"]
          EOF
          rm -f compiler/Cargo.lock
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: lto-object-sidecar-binding
      - name: Check stale/coherent native-object sidecar pairs and LTO regressions
        working-directory: compiler
        run: |
          cargo test -p compiler --test lto_mixed_link -- --nocapture
          cargo test -p compiler --test lto_coemit
          cargo test -p compiler --test lto_source_sidecar
          cargo test -p compiler --test lto_generated_multitu
          cargo test -p compiler --test lto_generated_abi_memory
          cargo test -p compiler --test lto_fnptr_stack_abi
          cargo test -p compiler --test lto_cli
      - name: Strict object-bound LTO driver lint
        working-directory: compiler
        run: cargo clippy -p compiler --test lto_mixed_link -- -D warnings
