name: C++5 original iostream rejected scalar TypeId provenance

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/verify-cxx5-scalar-width-provenance-20261116.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cxx5-scalar-width-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cxx5-scalar-provenance:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    container:
      image: ghcr.io/edgcpp/ci-runner@sha256:14b3948c2ce12cfa5472e5a6c468393d15426f3a67685cc35d830ea5db2acdf8
    defaults:
      run:
        shell: edg-container-exec "bash -eo pipefail {0}"
    env:
      COMPILER_SHA: ceaf9cdf955e2a7e2b9fcd05676b16a164625006
      EDG_SOURCE_SHA: b195677be8b9b56c8337afad6be8064d21a54082
      EDG_BRIDGE_SHA: 7f67a31a9ad5db038c8b1544e49117f23b462e45
      EDG_RELEASE_TAG: edgcpfe-v2026.11.14-upstream-177765bb7731
      EDG_RELEASE_SHA256: 1ce495b629924f31382ecccc891a7a72caae1014ddfa2ba7dd39b44d8b0a9526
      RUST_TOOLCHAIN_VERSION: 1.99.1
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      EDGCPP_SOURCE_DIR: ${{ github.workspace }}/edgcpp
      EDGCPP_COMPILE_COMMANDS: ${{ github.workspace }}/edgcpp/build/gcc-release/compile_commands.json
      EDGCPP_LIB_DIR: ${{ github.workspace }}/edgcpp/build/gcc-release/lib
      EDGCPP_EDG_REVISION: b195677be8b9b56c8337afad6be8064d21a54082
    steps:
      - name: Check out exactly pinned compiler integration candidate
        uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: ceaf9cdf955e2a7e2b9fcd05676b16a164625006
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false

      - name: Check out source headers matching upstream EDG release
        uses: actions/checkout@v4
        with:
          repository: bingundu/edgcpp
          ref: b195677be8b9b56c8337afad6be8064d21a54082
          path: edgcpp
          persist-credentials: false

      - name: Assert source revisions and unmodified Hello World
        run: |
          set -euo pipefail
          test "$(git -C compiler rev-parse HEAD)" = "$COMPILER_SHA"
          test "$(git -C edgcpp rev-parse HEAD)" = "$EDG_SOURCE_SHA"
          grep -Fq 'rev = "7f67a31a9ad5db038c8b1544e49117f23b462e45"' compiler/tools/edg-driver/Cargo.toml
          ! grep -q 'edgcpp_capture_' edgcpp/src/lower_il.c
          fixture=compiler/tools/edg-driver/tests/fixtures/edg_native_cxx5_iostream.cpp
          test -f "$fixture"
          grep -Fq '#include <iostream>' "$fixture"
          grep -Fq 'std::cout << "Hello, world!" << std::endl;' "$fixture"
          printf 'Compiler SHA: %s\nEDG package SHA: %s\nBridge SHA: %s\n' "$COMPILER_SHA" "$EDG_SOURCE_SHA" "$EDG_BRIDGE_SHA" >>"$GITHUB_STEP_SUMMARY"

      - name: Configure EDG header tooling without rebuilding full frontend
        working-directory: edgcpp
        env:
          EDG_BASE: ${{ github.workspace }}/edgcpp/bases/docker/dev-env/gcc
        run: |
          set -euo pipefail
          cmake --preset linux-gcc-release -DEDG_BUILD_LIB=OFF -DEDG_BUILD_CALLABLE_LIBRARY=ON -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
          cmake --build build/gcc-release --target error-info --parallel 2
          test -s build/gcc-release/src/includes/err_codes.h
          test -s build/gcc-release/src/includes/err_data.h

      - name: Restore checksummed upstream EDG callable release
        working-directory: edgcpp
        run: |
          set -euo pipefail
          mkdir -p build/gcc-release/lib build/prebuilt-edg
          curl --proto '=https' --tlsv1.2 --fail --location --silent --show-error --retry 4 --retry-delay 2 \
            "https://github.com/bingundu/edgcpp/releases/download/$EDG_RELEASE_TAG/edgcpfe-ci-upstream-callable-edg-release-20261114-linux-x86_64.tar.gz" \
            -o build/prebuilt-edg/archive.tar.gz
          printf '%s  %s\n' "$EDG_RELEASE_SHA256" build/prebuilt-edg/archive.tar.gz | sha256sum -c -
          tar -xzf build/prebuilt-edg/archive.tar.gz -C build/prebuilt-edg
          grep -Fx "commit=$EDG_SOURCE_SHA" build/prebuilt-edg/BUILD-INFO.txt
          grep -Fx 'platform=linux-x86_64' build/prebuilt-edg/BUILD-INFO.txt
          test -s build/prebuilt-edg/lib/libedgcpfe.a
          cp build/prebuilt-edg/lib/libedgcpfe.a build/gcc-release/lib/libedgcpfe.a

      - name: Install pinned Rust toolchain
        run: |
          set -euo pipefail
          if ! command -v cargo >/dev/null; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | \
              sh -s -- -y --profile minimal --default-toolchain "$RUST_TOOLCHAIN_VERSION"
          fi
          export PATH="$HOME/.cargo/bin:$PATH"
          rustup toolchain install "$RUST_TOOLCHAIN_VERSION" --profile minimal
          rustup default "$RUST_TOOLCHAIN_VERSION"


      - name: Resolve public pinned frontend source deps over HTTPS
        run: |
          set -euo pipefail
          # mini-c/oberon are public; avoid unconfigured GitHub SSH trust.
          git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
          git config --global --add url."https://github.com/".insteadOf "git@github.com:"
          git config --global --get-regexp 'insteadOf' || true


      - name: Validate strict native manipulator pointer ABI tests
        working-directory: compiler
        run: |
          set -euo pipefail
          export PATH="$HOME/.cargo/bin:$PATH"
          cargo test --manifest-path tools/edg-driver/Cargo.toml cxx5_manipulator_function_pointer_tests -- --nocapture
          cargo build --manifest-path tools/edg-driver/Cargo.toml
          test -x tools/edg-driver/target/debug/compiler-edg-driver
          echo 'EDG_FN_PTR_ABI unit_proofs=passed' >>"$GITHUB_STEP_SUMMARY"

      - name: Link actual EDG routine-address operand against independent G++ owner
        working-directory: edgcpp/build/gcc-release
        run: |
          set -euo pipefail
          source ./environment.sh
          driver="$GITHUB_WORKSPACE/compiler/tools/edg-driver/target/debug/compiler-edg-driver"
          work="$RUNNER_TEMP/cxx5-fnptr-parity"
          mkdir -p "$work"
          cd "$work"
          cat >main.cpp <<'CPP'
          struct Stream;
          extern Stream& manip(Stream&);
          extern int observe(Stream& (*)(Stream&));
          int main() { return observe(manip); }
          CPP
          cat >owner.cpp <<'CPP'
          struct Stream { int x; };
          Stream& manip(Stream& x) { return x; }
          int observe(Stream& (*callback)(Stream&)) {
            return callback == &manip ? 0 : 1;
          }
          CPP
          g++ -std=c++17 -Wall -Wextra -Werror -c owner.cpp -o owner.o
          g++ -std=c++17 -Wall -Wextra -Werror main.cpp owner.o -o reference
          timeout 15s ./reference
          version="$(g++ -dumpfullversion -dumpversion)"
          IFS=. read -r major minor patch <<<"$version"
          gnu_number=$((10#$major*10000+10#${minor:-0}*100+10#${patch:-0}))
          "$driver" native.o --dump-edg-global-provenance --typeid-native --g++ --c++17 --no_strict_gnu \
            --gnu_version "$gnu_number" main.cpp >native.log 2>&1 || {
              echo 'EDG_FN_PTR_SOURCE_OPERAND_BEGIN' >&2
              grep -E 'EDG_CXX5_MAIN_CALL|EDG_CXX5_CALL_(EXPR|ROUTINE_ADDRESS)' native.log | head -n 80 >&2 || true
              tail -n 80 native.log >&2
              echo 'EDG_FN_PTR_SOURCE_OPERAND_END' >&2
              test ! -e native.o
              exit 1
            }
          test "$(od -An -tx1 -N4 native.o | tr -d '[:space:]')" = 7f454c46
          nm -u native.o | tee native.undefined
          readelf -rW native.o | tee native.relocs
          test "$(grep -c -E ' U _Z5manipR6Stream$' native.undefined)" -eq 1
          grep -F '_Z5manipR6Stream' native.relocs
          g++ native.o owner.o -o native
          timeout 15s ./native
          echo 'EDG_FN_PTR_ABI linkable_source_constant=pass owner_executable=pass' >>"$GITHUB_STEP_SUMMARY"

      - name: Reject non-manipulator function-pointer ABI without partial ELF
        working-directory: edgcpp/build/gcc-release
        run: |
          set -euo pipefail
          source ./environment.sh
          driver="$GITHUB_WORKSPACE/compiler/tools/edg-driver/target/debug/compiler-edg-driver"
          work="$RUNNER_TEMP/cxx5-fnptr-negative"
          mkdir -p "$work"
          cd "$work"
          cat >invalid.cpp <<'CPP'
          extern int observe(int (*)(int));
          extern int f(int);
          int main() { return observe(f); }
          CPP
          version="$(g++ -dumpfullversion -dumpversion)"
          IFS=. read -r major minor patch <<<"$version"
          gnu_number=$((10#$major*10000+10#${minor:-0}*100+10#${patch:-0}))
          g++ -std=c++17 -Wall -Wextra -Werror -fsyntax-only invalid.cpp
          if "$driver" invalid.o --typeid-native --g++ --c++17 --no_strict_gnu \
            --gnu_version "$gnu_number" invalid.cpp >invalid.log 2>&1; then
            echo '::error::Non-manipulator function pointer wrongly admitted'
            exit 1
          fi
          test ! -e invalid.o
          grep -E '(manipulator|scalar memory)' invalid.log
          echo 'EDG_FN_PTR_ABI unsupported_function_pointer=no_partial_elf' >>"$GITHUB_STEP_SUMMARY"

      - name: Verify original GCC15 iostream exact scalar type rejection and no partial ELF
        working-directory: edgcpp/build/gcc-release
        run: |
          set -euo pipefail
          source ./environment.sh
          driver="$GITHUB_WORKSPACE/compiler/tools/edg-driver/target/debug/compiler-edg-driver"
          fixture="$GITHUB_WORKSPACE/compiler/tools/edg-driver/tests/fixtures/edg_native_cxx5_iostream.cpp"
          out="$RUNNER_TEMP/cxx5-original-iostream-scalar"
          mkdir -p "$out"
          cd "$out"
          cp "$fixture" original.cpp
          g++ -std=c++17 -fno-exceptions original.cpp -o gcc-reference
          timeout 15s ./gcc-reference >gcc.stdout 2>gcc.stderr
          printf 'Hello, world!\\n' >expected.stdout
          cmp gcc.stdout expected.stdout
          test ! -s gcc.stderr
          g++ -std=c++17 -v -E -x c++ /dev/null >include-search.log 2>&1
          mapfile -t dirs < <(awk '
            /#include <\\.\\.\\.> search starts here:/{active=1;next}
            /^End of search list/{active=0}
            active && /^ /{sub(/^[[:space:]]+/,"");print}
          ' include-search.log)
          includes=()
          for dir in "${dirs[@]}"; do
            if test -d "$dir"; then includes+=("-I$dir"); fi
          done
          version="$(g++ -dumpfullversion -dumpversion)"
          IFS=. read -r major minor patch <<<"$version"
          gnu_number=$((10#$major*10000+10#${minor:-0}*100+10#${patch:-0}))
          rm -f original.o
          set +e
          "$driver" original.o --dump-edg-global-provenance --typeid-native \\
            --g++ --c++17 --no_strict_gnu --gnu_version "$gnu_number" \\
            "${includes[@]}" original.cpp >original.log 2>&1
          status=$?
          set -e
          echo "EDG_CXX5_SCALAR_PROBE status=$status"
          grep 'EDG_CXX5_CALL_ROUTINE_ADDRESS' original.log | head -n 8 || true
          grep -F 'C scalar memory type has no exact native width:' original.log || true
          tail -n 12 original.log || true
          test "$status" -ne 0
          test ! -e original.o
          grep -Fq 'EDG_CXX5_CALL_ROUTINE_ADDRESS' original.log
          grep -Eq 'C scalar memory type has no exact native width: requested=TypeId\\([0-9]+\\) resolved=TypeId\\([0-9]+\\) native_kind=[0-9]+ integer_records=0 layouts=[0-9]+ details=[0-9]+' original.log
          grep -Fq 'source definition std::char_traits<char>::length' original.log
          grep -F 'C scalar memory type has no exact native width:' original.log >>"$GITHUB_STEP_SUMMARY"
          echo 'EDG_CXX5_SCALAR_PROBE source_type_reported=yes no_partial_elf=yes gxx_reference=pass' >>"$GITHUB_STEP_SUMMARY"
