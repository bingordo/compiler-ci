name: Validate compiler PR1825 opt oracle and physical tags
on:
  push:
    branches: [ci/fix-opt-tagged-1825-20261115]
permissions:
  contents: read
jobs:
  focused:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout exact compiler fix commit
        uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: c28a71a08c072ad6e92dcef9c2ce517cd1d2d0e2
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Require exact commit and isolate private workspace dependencies
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C compiler rev-parse HEAD)" = "c28a71a08c072ad6e92dcef9c2ce517cd1d2d0e2"
          cat > compiler/Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir", "crates/opt", "crates/backend", "crates/backend-x86", "crates/backend-aarch64"]
          EOF
          rm -f compiler/Cargo.lock
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: pr1825-fix-opt-tagged
      - name: Assert production compiler-opt feature remains isolated
        working-directory: compiler
        run: cargo check -p compiler-opt --lib
      - name: Verify exact physical tags and ELF parity
        working-directory: compiler
        run: cargo test -p compiler-backend-x86 --test typeid_physical_tagged_v2 -- --nocapture
      - name: Verify TypeId optimizer historical-size tests compile and execute
        working-directory: compiler
        run: |
          cargo test -p compiler-opt --test pre_licm_semantic_matrix --test induction_native --test pre_native --test mem2reg_native -- --nocapture
      - name: Check strict Rust lint
        working-directory: compiler
        run: |
          cargo clippy -p compiler-opt --test pre_licm_semantic_matrix --test induction_native -- -D warnings
      - name: Verify broader core regression suite
        working-directory: compiler
        run: |
          cargo test -p compiler-ir -p compiler-opt -p compiler-backend -p compiler-backend-x86 --lib

      - name: Install native GDB oracle dependency
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends gdb
      - name: Validate source-proven GP-GP flags and negative shapes
        working-directory: compiler
        run: cargo test -p compiler-backend-x86 --test x7_s3l_l4a_flags_only_native -- --nocapture
      - name: Verify repaired optimizer tests with generated rewrites enabled
        working-directory: compiler
        shell: bash
        run: |
          set -euo pipefail
          cargo test -p compiler-opt \
            --test generated_native_additive_pair_cancellation_s2334 \
            --test generated_native_complement_dag \
            --test generated_native_complement_xor_pair_s2342 \
            --test generated_native_matchpd_boolean_factor_s2314 \
            --test generated_native_matchpd_pairwise_s2319 \
            --test native_s2316_profile \
            --test native_s2350_gcc_boolean_batch
      - name: Verify repaired optimizer tests with generated rewrites disabled
        working-directory: compiler
        run: |
          cargo test -p compiler-opt --no-default-features \
            --test generated_native_additive_pair_cancellation_s2334 \
            --test generated_native_complement_dag \
            --test generated_native_complement_xor_pair_s2342 \
            --test generated_native_matchpd_boolean_factor_s2314 \
            --test generated_native_matchpd_pairwise_s2319 \
            --test native_s2316_profile \
            --test native_s2350_gcc_boolean_batch
      - name: Verify complete compiler core and x86 integration tests
        working-directory: compiler
        run: |
          cargo test -p compiler-ir -p compiler-opt -p compiler-backend -p compiler-backend-x86 --no-fail-fast -- --test-threads=1
