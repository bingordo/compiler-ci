              python3 -c 'import json,sys; m=json.load(open(sys.argv[1])); n=int(sys.argv[3]); c=next(x for x in m["cases"] if x["case"]==sys.argv[2]); print("Failing R17 vector:",c["vectors"][n-1] if 1<=n<=len(c["vectors"]) else "SP/s-registers/machine code failure")' "$root/manifest.json" "$kind" "$status"
              exit 1
            fi
            echo "$kind: 24 LP64 GCC/QEMU comparisons, eight caller stack words max and native ELF/GAS parity"
          done
          echo "PASSED 96 new R17 LP64 13-16 stack GP comparisons; previous 5544 retained"

      - name: R18 13-16 incoming LP64 GP words GCC-to-TypeId QEMU and ELF/GAS parity
        shell: bash
        working-directory: compiler
        run: |
          set -euo pipefail
          root=/tmp/rv64-wide-ingress
          python3 tools/riscv_ingress_oracle.py --output "$root" --seed 20261121 --vectors 24 --include-wide-stack-gp
          python3 tools/riscv_ingress_oracle.py --output /tmp/rv64-wide-ingress-replay --seed 20261121 --vectors 24 --include-wide-stack-gp
          diff -qr "$root" /tmp/rv64-wide-ingress-replay
          python3 -c 'import json; m=json.load(open("/tmp/rv64-wide-ingress/manifest.json")); assert len(m["cases"])==10 and [c["arity"] for c in m["cases"][5:]]==[13,14,15,16,16] and m["vectors_per_case"]==24'
          for kind in incall13 inmixed14 incall15 inmixed16 inpressure16; do
            cargo run -p compiler-backend-riscv64 --example rv64_leaf -- \
              "$root/$kind.o" "$root/$kind"_native.s "$kind" --isa=rv64i
            riscv64-linux-gnu-as -march=rv64i -mabi=lp64 \
