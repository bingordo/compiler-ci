          done
          echo "PASSED 120 new R18 incoming LP64 13-16 stack comparisons; prior 5640 preserved"

      - name: R19 16-GP native-to-native LP64 forwarding, GCC/QEMU and ELF/GAS byte parity
        shell: bash
        working-directory: compiler
        run: |
          set -euo pipefail
          root=/tmp/rv64-forward
          python3 tools/riscv_forward_oracle.py --output "$root" --seed 20261121 --vectors 24
          python3 tools/riscv_forward_oracle.py --output /tmp/rv64-forward-replay --seed 20261121 --vectors 24
          diff -qr "$root" /tmp/rv64-forward-replay
          python3 -c 'import json; m=json.load(open("/tmp/rv64-forward/manifest.json")); assert [c["kind"] for c in m["cases"]]==["forward16","forwardmixed16","forwardpressure16","forwardcombined16"] and m["vectors_per_case"]==24'
          for kind in forward16 forwardmixed16 forwardpressure16 forwardcombined16; do
            cargo run -p compiler-backend-riscv64 --example rv64_leaf -- \
              "$root/$kind.o" "$root/$kind"_native.s "$kind" --isa=rv64i
            riscv64-linux-gnu-as -march=rv64i -mabi=lp64 \
              "$root/$kind"_native.s -o "$root/$kind"_gas.o
            riscv64-linux-gnu-objcopy -O binary -j .text \
              "$root/$kind.o" "$root/$kind"_native.bin
            riscv64-linux-gnu-objcopy -O binary -j .text \
              "$root/$kind"_gas.o "$root/$kind"_gas.bin
            cmp "$root/$kind"_native.bin "$root/$kind"_gas.bin
            grep -q 'R_RISCV_CALL_PLT' "$root/$kind"_native.s
            grep -q 'ld x5, 0(x6)' "$root/$kind"_native.s
            grep -q 'ld x5, 56(x6)' "$root/$kind"_native.s
            grep -q 'sd x5, 0(x2)' "$root/$kind"_native.s
            grep -q 'sd x5, 56(x2)' "$root/$kind"_native.s
            riscv64-linux-gnu-gcc -march=rv64im -mabi=lp64 -O2 \
              -ffreestanding -fno-builtin -fno-pie -fno-stack-protector \
              -fwrapv -c "$root/$kind.c" -o "$root/$kind"_gcc.o
            riscv64-linux-gnu-as -march=rv64im -mabi=lp64 \
              "$root/$kind.s" -o "$root/$kind"_harness.o
            if [ "$kind" = forwardcombined16 ]; then
              # Two compiler-produced functions in ONE ELF object.
              grep -q 'rv64_inmixed16:' "$root/$kind"_native.s
              riscv64-linux-gnu-ld -m elf64lriscv -static --no-relax -e _start \
                "$root/$kind"_harness.o "$root/$kind.o" \
                "$root/$kind"_gcc.o -o "$root/$kind.elf"
            else
              # Independent TWO native TypeId object files, linked by name.
              if [ "$kind" = forward16 ]; then callee_kind=incall16; else callee_kind=inmixed16; fi
              cargo run -p compiler-backend-riscv64 --example rv64_leaf -- \
                "$root/$kind"_callee.o "$root/$kind"_callee.s "$callee_kind" --isa=rv64i
              riscv64-linux-gnu-as -march=rv64i -mabi=lp64 \
                "$root/$kind"_callee.s -o "$root/$kind"_callee_gas.o
              riscv64-linux-gnu-objcopy -O binary -j .text \
                "$root/$kind"_callee.o "$root/$kind"_callee_native.bin
              riscv64-linux-gnu-objcopy -O binary -j .text \
                "$root/$kind"_callee_gas.o "$root/$kind"_callee_gas.bin
              cmp "$root/$kind"_callee_native.bin "$root/$kind"_callee_gas.bin
              riscv64-linux-gnu-ld -m elf64lriscv -static --no-relax -e _start \
                "$root/$kind"_harness.o "$root/$kind.o" "$root/$kind"_callee.o \
                "$root/$kind"_gcc.o -o "$root/$kind.elf"
            fi
            set +e
            timeout 20s qemu-riscv64 "$root/$kind.elf"
            status=$?
            set -e
            if [ "$status" -ne 0 ]; then
              echo "RV64 R19 native forwarding mismatch $kind exit=$status" >&2
              python3 -c 'import json,sys; m=json.load(open(sys.argv[1])); n=int(sys.argv[3]); c=next(x for x in m["cases"] if x["kind"]==sys.argv[2]); print("Failing R19 vector:",c["vectors"][n-1] if 1<=n<=len(c["vectors"]) else "SP/s-registers/machine code failure")' "$root/manifest.json" "$kind" "$status"
              exit 1
            fi
            echo "$kind: 24 native-native LP64 GCC/QEMU comparisons, SP/s0..s11, mathematical expected values, ELF/GAS parity"
          done
          echo "PASSED 96 new R19 native-to-native LP64 GP comparisons; prior 5760 preserved"

      - name: R20 dead overflow GP inputs and duplicate 16-argument native-to-native calls GCC/QEMU
        shell: bash
        working-directory: compiler
        run: |
          set -euo pipefail
          root=/tmp/rv64-dead-forward
          python3 tools/riscv_forward_oracle.py --output "$root" --seed 20261121 --vectors 24 --include-dead-stack-gp
          python3 tools/riscv_forward_oracle.py --output /tmp/rv64-dead-forward-replay --seed 20261121 --vectors 24 --include-dead-stack-gp
          diff -qr "$root" /tmp/rv64-dead-forward-replay
          python3 -c 'import json; m=json.load(open("/tmp/rv64-dead-forward/manifest.json")); assert [c["kind"] for c in m["cases"][4:]] == ["forwarddead16","forwarddeadpressure16","forwarddeadcombined16"] and len(m["cases"])==7 and m["vectors_per_case"]==24'
          for kind in forwarddead16 forwarddeadpressure16 forwarddeadcombined16; do
            cargo run -p compiler-backend-riscv64 --example rv64_leaf -- \
              "$root/$kind.o" "$root/$kind"_native.s "$kind" --isa=rv64i
            riscv64-linux-gnu-as -march=rv64i -mabi=lp64 \
              "$root/$kind"_native.s -o "$root/$kind"_gas.o
            riscv64-linux-gnu-objcopy -O binary -j .text \
              "$root/$kind.o" "$root/$kind"_native.bin
            riscv64-linux-gnu-objcopy -O binary -j .text \
              "$root/$kind"_gas.o "$root/$kind"_gas.bin
            cmp "$root/$kind"_native.bin "$root/$kind"_gas.bin
            grep -q 'R_RISCV_CALL_PLT' "$root/$kind"_native.s
            awk '/^rv64_inmixed16:/{exit} {print}' "$root/$kind"_native.s > "$root/$kind"_wrapper.s
            grep -q 'ld x5, 0(x6)' "$root/$kind"_wrapper.s
            grep -q 'ld x5, 48(x6)' "$root/$kind"_wrapper.s
            for offset in 8 16 24 32 40 56; do
              if grep -q "ld x5, $offset(x6)" "$root/$kind"_wrapper.s; then
                echo "$kind: dead incoming GP parameter offset $offset was loaded" >&2
                exit 1
              fi
            done
            grep -q 'sd x5, 0(x2)' "$root/$kind"_wrapper.s
            grep -q 'sd x5, 56(x2)' "$root/$kind"_wrapper.s
            riscv64-linux-gnu-gcc -march=rv64im -mabi=lp64 -O2 \
              -ffreestanding -fno-builtin -fno-pie -fno-stack-protector \
              -fwrapv -c "$root/$kind.c" -o "$root/$kind"_gcc.o
            riscv64-linux-gnu-as -march=rv64im -mabi=lp64 \
              "$root/$kind.s" -o "$root/$kind"_harness.o
            if [ "$kind" = forwarddeadcombined16 ]; then
              grep -q 'rv64_inmixed16:' "$root/$kind"_native.s
              riscv64-linux-gnu-ld -m elf64lriscv -static --no-relax -e _start \
                "$root/$kind"_harness.o "$root/$kind.o" \
                "$root/$kind"_gcc.o -o "$root/$kind.elf"
            else
              cargo run -p compiler-backend-riscv64 --example rv64_leaf -- \
                "$root/$kind"_callee.o "$root/$kind"_callee.s inmixed16 --isa=rv64i
              riscv64-linux-gnu-as -march=rv64i -mabi=lp64 \
                "$root/$kind"_callee.s -o "$root/$kind"_callee_gas.o
              riscv64-linux-gnu-objcopy -O binary -j .text \
                "$root/$kind"_callee.o "$root/$kind"_callee_native.bin
              riscv64-linux-gnu-objcopy -O binary -j .text \
                "$root/$kind"_callee_gas.o "$root/$kind"_callee_gas.bin
              cmp "$root/$kind"_callee_native.bin "$root/$kind"_callee_gas.bin
              riscv64-linux-gnu-ld -m elf64lriscv -static --no-relax -e _start \
                "$root/$kind"_harness.o "$root/$kind.o" "$root/$kind"_callee.o \
                "$root/$kind"_gcc.o -o "$root/$kind.elf"
            fi
            set +e
            timeout 20s qemu-riscv64 "$root/$kind.elf"
            status=$?
            set -e
            if [ "$status" -ne 0 ]; then
              echo "RV64 R20 dead/duplicate GP mismatch $kind exit=$status" >&2
              python3 -c 'import json,sys; m=json.load(open(sys.argv[1])); n=int(sys.argv[3]); c=next(x for x in m["cases"] if x["kind"]==sys.argv[2]); print("Failing R20 vector:",c["vectors"][n-1] if 1<=n<=len(c["vectors"]) else "SP/s-registers/native machine code failure")' "$root/manifest.json" "$kind" "$status"
              exit 1
            fi
            echo "$kind: 24 independent GCC/QEMU, math result, SP/s0..s11, dead home rejection and ELF/GAS parity"
          done
          echo "PASSED 72 new R20 dead/duplicate GP comparisons; prior 5856 preserved"

      - name: Archive generated failing source and QEMU vector reproducers
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rv64-r20-dead-overflow-frame-repro-${{ github.run_id }}
          path: |
            /tmp/rv64-diff/manifest.json
            /tmp/rv64-diff/plan.tsv
            /tmp/rv64-diff/src/
            /tmp/rv64-diff/ref/
            /tmp/rv64-diff/harness/
            /tmp/rv64-pressure/
            /tmp/rv64-calls/
            /tmp/rv64-phi/
            /tmp/rv64-live-calls/
            /tmp/rv64-stack-calls/
            /tmp/rv64-ingress/
            /tmp/rv64-wide-outgoing/
            /tmp/rv64-wide-ingress/
            /tmp/rv64-forward/
            /tmp/rv64-dead-forward/
          if-no-files-found: warn
          retention-days: 14
