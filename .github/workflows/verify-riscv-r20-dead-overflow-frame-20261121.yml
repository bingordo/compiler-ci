            if [ "$status" -ne 0 ]; then
              echo "RV64 R18 incoming LP64 stack mismatch $kind exit=$status" >&2
              python3 -c 'import json,sys; m=json.load(open(sys.argv[1])); n=int(sys.argv[3]); c=next(x for x in m["cases"] if x["kind"]==sys.argv[2]); print("Failing R18 vector:",c["vectors"][n-1] if 1<=n<=len(c["vectors"]) else "SP/s-registers/machine code failure")' "$root/manifest.json" "$kind" "$status"
              exit 1
