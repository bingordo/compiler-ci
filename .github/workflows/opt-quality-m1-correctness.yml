# Correctness-only validation for compiler optimization-quality benchmark M1.
# Pin exact compiler source to avoid silently validating a different branch.
name: Optimization quality M1 source-pinned correctness
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/opt-quality-m1-correctness.yml']
permissions:
  contents: read
concurrency:
  group: opt-quality-m1-${{ github.ref }}
  cancel-in-progress: true
jobs:
  correctness:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
      CARGO_INCREMENTAL: '0'
      COMPILER_SHA: 71d7d82a1ee4a2d9d17b163aaa8e35d4ecd382b8
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: ${{ env.COMPILER_SHA }}
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Check source pin and prerequisites
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p results
          test "$(git -C compiler rev-parse HEAD)" = "$COMPILER_SHA"
          git -C compiler rev-parse HEAD | tee results/compiler-sha.txt
          command -v gcc
          command -v clang
          gcc --version | head -n 1 | tee results/gcc-version.txt
          clang --version | head -n 1 | tee results/clang-version.txt
          python3 -m py_compile compiler/tools/opt_quality_correctness_m1.py compiler/tools/test_opt_quality_correctness_m1.py
          python3 -m unittest discover -s compiler/tools -p 'test_opt_quality_correctness_m1.py' -v
      - name: Resolve Mini-C dependency with public HTTPS
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('compiler/tools/mini-c-driver/Cargo.toml')
          content=p.read_text()
          before='ssh://git@github.com/bingordo/mini-c.git'
          assert content.count(before)==2, 'Mini-C dependency changed; review checkout policy'
          p.write_text(content.replace(before, 'https://github.com/bingordo/mini-c.git'))
          PY
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler/tools/mini-c-driver -> target
          key: opt-quality-m1
      - name: Build native Mini-C compiler
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=10s 12m cargo build \
            --manifest-path compiler/tools/mini-c-driver/Cargo.toml \
            -p compiler-mini-c --bin compiler-mini-c
          test -x compiler/tools/mini-c-driver/target/debug/compiler-mini-c
      - name: Native C differential execution (5 cases x 36 input pairs)
        shell: bash
        run: |
          set -euo pipefail
          set +e
          timeout --signal=TERM --kill-after=10s 8m python3 \
            compiler/tools/opt_quality_correctness_m1.py \
            --compiler "$PWD/compiler/tools/mini-c-driver/target/debug/compiler-mini-c" \
            --output results/opt-quality-m1.json \
            2>&1 | tee results/opt-quality-m1.log
          status=${PIPESTATUS[0]}
          set -e
          test -s results/opt-quality-m1.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('results/opt-quality-m1.json').read_text())
          assert data['total_count']==5 and len(data['cases'])==5, 'incomplete corpus'
          assert len({case['name'] for case in data['cases']})==5, 'duplicate case'
          assert data['source_corpus_sha256'], 'missing corpus digest'
          print('M1 classifications:', {case['name']:case['classification'] for case in data['cases']})
          PY
          test "$status" -eq 0
          python3 - <<'PY'
          import json
          data=json.load(open('results/opt-quality-m1.json'))
          assert data['pass_count']==5
          assert all(case['classification']=='PASS' for case in data['cases'])
          PY
          echo "M1: 5/5 native cases agree with GCC and Clang" >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve complete results and build provenance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: opt-quality-m1-${{ env.COMPILER_SHA }}
          path: results/
          retention-days: 30
          if-no-files-found: warn
