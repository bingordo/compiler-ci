name: TypeId variadic callback memory effects PR1119
on:
  push:
    branches: [test/typeid-variadic-memory-review-1119-20261111]
  pull_request:
    paths:
      - '.github/workflows/test-typeid-variadic-callback-1119.yml'
permissions:
  contents: read
jobs:
  typed-memory:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: a2ca04631cddf564bf79d0c5a286712b5b8b9b7b
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Verify exact source and isolate core workspace
        working-directory: compiler
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "a2ca04631cddf564bf79d0c5a286712b5b8b9b7b"
          python3 - <<'PY'
          from pathlib import Path
          Path('Cargo.toml').write_text('''[workspace]
          resolver = "2"
          members = ["crates/ir", "crates/opt", "crates/backend", "crates/backend-x86"]
          ''')
          PY
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: typeid-indirect-memory-review
      - name: TypeId MemorySSA and callback barrier regression
        working-directory: compiler
        run: |
          set -euo pipefail
          cargo test -p compiler-opt --features typeid-memory-ssa --test m6_typeid_memoryssa_cfg -- --nocapture 2>&1 | tee "$RUNNER_TEMP/memoryssa-cfg.log"
          grep -F 'test native_memoryssa_gp_variadic_callback_blocks_all_memory_rewrites ... ok' "$RUNNER_TEMP/memoryssa-cfg.log"
          grep -F 'test native_memoryssa_interblock_variadic_callback_kills_forward_facts ... ok' "$RUNNER_TEMP/memoryssa-cfg.log"
          cargo test -p compiler-opt --test memory_execution_oracle
          cargo clippy -p compiler-opt --lib -- -D warnings
      - name: Preserve failure logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: typeid-indirect-memory-failure
          path: ${{ runner.temp }}/memoryssa-cfg.log
          if-no-files-found: ignore
