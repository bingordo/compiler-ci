name: Native TypeId M6 egraph and source-no-inline fixture migration
on:
  push:
    branches: [verify/ir-m6-egraph-noinline-20261114]
    paths: ['.github/workflows/ir-m6-egraph-noinline-20261114.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 4f14aa9dcd74fe254251b7abc370523faab44fee
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Verify exact source SHA
        run: test "$(git -C compiler rev-parse HEAD)" = "4f14aa9dcd74fe254251b7abc370523faab44fee"
      - name: Restrict workspace
        run: |
          cat > compiler/Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir", "crates/opt", "crates/backend", "crates/backend-x86"]
          EOF
          rm -f compiler/Cargo.lock
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: m6-egraph-noinline-ir
      - name: Export existing fixed graphs through native v3 writer
        working-directory: compiler
        run: |
          cargo test -p compiler-opt --features typeid-egraph --test m6_typeid_egraph temporary_export_original_native_m6_arithmetic_graph -- --nocapture
          cargo test -p compiler-opt --test typeid_source_no_inline temporary_export_original_native_no_inline_graphs -- --nocapture
