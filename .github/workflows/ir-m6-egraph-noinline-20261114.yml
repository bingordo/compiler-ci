name: Native TypeId M6 egraph and source-no-inline fixture migration
on:
  push:
    branches: [verify/ir-m6-egraph-noinline-20261114]
    paths: ['.github/workflows/ir-m6-egraph-noinline-20261114.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 342eac4bd0e92ff9c867afd16d3046574c10499b
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Verify exact source SHA
        run: test "$(git -C compiler rev-parse HEAD)" = "342eac4bd0e92ff9c867afd16d3046574c10499b"
      - name: Restrict workspace
        run: |
          cat > compiler/Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir", "crates/opt", "crates/backend", "crates/backend-x86"]
          EOF
          rm -f compiler/Cargo.lock
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: m6-egraph-noinline-ir
      - name: Validate migrated native M6 egraph and source no-inline TypeId suites
        working-directory: compiler
        run: |
          cargo test -p compiler-opt --features typeid-egraph --test m6_typeid_egraph
          cargo test -p compiler-opt --test typeid_source_no_inline
          cargo test -p compiler-opt --features verify-counts --test typeid_source_no_inline
          cargo test -p compiler-opt --test typed_core_pipeline --test typed_sccp --test typed_ctfe
          cargo test -p compiler-opt --test ir_fixture_directives --test native_ir_pass_replay
          cargo test -p compiler-ir --test native_fixture_text --test native_module_text_v3
          cargo clippy -p compiler-opt --features typeid-egraph --test m6_typeid_egraph --test typeid_source_no_inline -- -D warnings
