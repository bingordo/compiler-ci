name: x86 source inline ablation (checked C/GCC)
on:
  push:
    branches: [main]
    paths: [.github/workflows/verify-x86-inline-source-ablation-20261115.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-ablation:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 4344d7a1b3280ae3946661a5063356667a5bbeb2
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Verify exact compiler source and configure pinned frontends
        run: |
          test "$(git -C compiler rev-parse HEAD)" = "4344d7a1b3280ae3946661a5063356667a5bbeb2"
          git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: x86-source-inline-ablation-20261115
      - name: Real checked Mini-C default/no-inline and GCC O2/Os executable and text comparison
        working-directory: compiler
        run: |
          set -euo pipefail
          cargo test -p compiler --test x86_inline_source_ablation -- --nocapture
          cargo test -p compiler-opt --test typed_core_inline_integration -- --nocapture
          cargo test -p compiler-opt --test typed_inline_leaf_native -- --nocapture
          cargo test -p compiler-opt --test typed_inline_cfg_native -- --nocapture
          cargo clippy -p compiler-opt --lib -- -D warnings
          cargo clippy -p compiler-backend-x86 --lib -- -D warnings
