name: Daily standalone Mini-C TypeId GCC differential
on:
  pull_request:
    paths:
      - .github/workflows/mini-c-typeid-differential.yml
  workflow_dispatch:
  schedule:
    # Production TypeId migration parity check in compiler-ci, not compiler.
    - cron: '13 9 * * *'
permissions:
  contents: read
jobs:
  typeid-differential:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.CI_KEY }}
      - run: ssh-keyscan github.com >> ~/.ssh/known_hosts
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          # TEMP wasm W7 source pin for compiler PR #3171; NEVER MERGE.
          ref: ff3a6e8d2ffc9096fce5edf13e101325ff1e9e94
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Build exact standalone Mini-C compiler
        working-directory: compiler
        run: |
          echo "compiler main commit: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
          cargo build --manifest-path tools/mini-c-driver/Cargo.toml --bin compiler-mini-c
      - name: Validate native TypeId wasm W7 private function table and ABI
        working-directory: compiler
        run: |
          cargo test -p compiler-backend-wasm --test private_indirect_typeid -- --nocapture
          cargo test -p compiler-backend-wasm --test host_callback_guard
          cargo test -p compiler-backend-wasm --test import_calls
          cargo test -p compiler-ir --lib canonical_indirect
          cargo check -p compiler -p compiler-backend-x86 -p compiler-backend-aarch64 -p compiler-backend-wasm
          cargo test --manifest-path tools/mini-c-driver/Cargo.toml --lib checked_wasm32_private_function_pointers_lower_to_canonical_typeid_calls
          cargo test --manifest-path tools/mini-c-driver/Cargo.toml --test production_typeid_boundary
      - name: Run historical executable Mini-C/GCC differential through TypeId default
        working-directory: compiler
        run: |
          set -euo pipefail
          python3 tools/mini-c-driver/tests/differential.py \
            --compiler tools/mini-c-driver/target/debug/compiler-mini-c \
            --seed-count 2 --steps 60 \
            --ct04-seed-count 1 --m10-compound-seed-count 1 \
            --artifacts target/mini-c-typeid-reproducers
          echo "PASS: Standalone Mini-C DEFAULT native TypeId ELF/GAS GCC mixed-object differential" >> "$GITHUB_STEP_SUMMARY"
      - name: Native TypeId Mini-C ELF/GAS symbols, TLS pthread runtime and default-vs-explicit parity
        working-directory: compiler
        run: |
          cargo test --manifest-path tools/mini-c-driver/Cargo.toml --test typeid_cli -- --test-threads=2
          cargo test -p compiler --test ir_default_cli -- --test-threads=2
          echo "PASS: x86 TypeId weak/hidden/protected, TLS pthread, LE/IE relocations and default cutover" >> "$GITHUB_STEP_SUMMARY"
      - name: Validate unified TypeId driver on GCC runtime and IR replay
        # Keep independent validation evidence even if an earlier legacy
        # differential/ABI test fails. Do not turn that earlier failure green.
        if: ${{ success() || failure() }}
        working-directory: compiler
        shell: bash
        run: |
          set -euo pipefail
          # Tests set COMPILER_TEST_VALIDATION=full only in their compiler
          # children. Baseline compilation remains production-fast and its
          # bytes are compared against the checked native artifacts.
          cargo test -p compiler --test f6_source_runtime_parity \
            f6_x86_test_validation_preserves_native_runtime_and_output \
            -- --exact --nocapture
          cargo test -p compiler --test typeid_ir_dump_replay \
            replay_test_validation_keeps_native_objects_identical \
            -- --exact --nocapture
          {
            echo '### Unified TypeId test-only native validation'
            echo "Compiler source: $(git rev-parse HEAD)"
            echo 'GCC-linked ELF and assembly runtime oracle: PASS'
            echo 'Text/binary TypeId replay x86_64/AArch64: PASS'
            echo 'Per-stage structural and semantic coverage assertions: PASS'
            echo 'Production output parity: PASS'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Record differential failure reproducers
        if: failure()
        working-directory: compiler
        run: |
          find target/mini-c-typeid-reproducers -name case.c -o -name run.json | head -40 || true
          find target/mini-c-typeid-reproducers -name case.c -print -exec sed -n '1,180p' '{}' ';' | head -260 || true
      - name: Archive exact failing test cases
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: mini-c-typeid-differential-repro
          path: compiler/target/mini-c-typeid-reproducers
          if-no-files-found: ignore
