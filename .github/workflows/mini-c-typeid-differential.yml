name: Daily standalone Mini-C TypeId GCC differential
on:
  pull_request:
    paths:
      - .github/workflows/mini-c-typeid-differential.yml
  workflow_dispatch:
  schedule:
    # Production TypeId migration parity check in compiler-ci, not compiler.
    - cron: '13 9 * * *'
permissions:
  contents: read
jobs:
  typeid-differential:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.CI_KEY }}
      - run: ssh-keyscan github.com >> ~/.ssh/known_hosts
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          # candidate native adapter source e6ffd03c736c
          ref: mini-c-frontend-abi-rebase-20261113
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Build exact standalone Mini-C compiler
        working-directory: compiler
        run: |
          echo "compiler main commit: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
          cargo build --manifest-path tools/mini-c-driver/Cargo.toml --bin compiler-mini-c
      - name: Compile and test pinned checked Mini-C frontend against TypeId adapter
        working-directory: compiler
        env:
          CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
        run: |
          set -euo pipefail
          cargo test --manifest-path tools/mini-c-driver/Cargo.toml --lib -- --test-threads=2
          cargo clippy --manifest-path tools/mini-c-driver/Cargo.toml --all-targets -- -D warnings
          cargo check -p compiler
      - name: Run historical executable Mini-C/GCC differential through TypeId default
        working-directory: compiler
        run: |
          set -euo pipefail
          python3 tools/mini-c-driver/tests/differential.py \
            --compiler tools/mini-c-driver/target/debug/compiler-mini-c \
            --seed-count 2 --steps 60 \
            --ct04-seed-count 1 --m10-compound-seed-count 1 \
            --artifacts target/mini-c-typeid-reproducers
          echo "PASS: Standalone Mini-C DEFAULT native TypeId ELF/GAS GCC mixed-object differential" >> "$GITHUB_STEP_SUMMARY"
      - name: Native TypeId Mini-C ELF/GAS symbols, TLS pthread runtime and default-vs-explicit parity
        working-directory: compiler
        run: |
          cargo test --manifest-path tools/mini-c-driver/Cargo.toml --test typeid_cli -- --test-threads=2
          cargo test -p compiler --test ir_default_cli -- --test-threads=2
          echo "PASS: x86 TypeId weak/hidden/protected, TLS pthread, LE/IE relocations and default cutover" >> "$GITHUB_STEP_SUMMARY"
      - name: Record differential failure reproducers
        if: failure()
        working-directory: compiler
        run: |
          find target/mini-c-typeid-reproducers -name case.c -o -name run.json | head -40 || true
          find target/mini-c-typeid-reproducers -name case.c -print -exec sed -n '1,180p' '{}' ';' | head -260 || true
      - name: Archive exact failing test cases
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: mini-c-typeid-differential-repro
          path: compiler/target/mini-c-typeid-reproducers
          if-no-files-found: ignore
