name: X7 IP8 generic certified AND probe differential
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/x7-ip8-experimental-and-certificates-20261122.yml'
permissions:
  contents: read
jobs:
  source-proofed-experimental-and:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 16281bf254618a9a9f729e79a85a3ff29cdd6181
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Exact compiler source and pinned Cargo git dependencies
        run: |
          set -euo pipefail
          test "$(git -C compiler rev-parse HEAD)" = "16281bf254618a9a9f729e79a85a3ff29cdd6181"
          git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
          git config --global --add url."https://github.com/".insteadOf "git@github.com:"
          rustc --version
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: x7-ip8-experimental-source-certificates
      - name: Verify pinned source tables and negative certificate mutations
        working-directory: compiler
        run: |
          set -euo pipefail
          python3 tools/regen_x86_dag_rule_groups.py --check
          python3 tools/x7_ip8_dag_certificates.py --check
          python3 tools/x7_ip8_experimental_dag_certificates.py --check
          PYTHONPATH=tools python3 -m unittest -v \
            test_x7_ip8_dag_certificates \
            test_x7_ip8_experimental_dag_certificates \
            test_x7_ip4_emit_and_dag_probe
      - name: Generic Rust certificate and shared matcher regressions
        working-directory: compiler
        run: |
          set -euo pipefail
          cargo test -p compiler-backend --lib --quiet
          cargo test -p compiler-backend-x86 --lib \
            --features x7-ip4-auto-dag-probe \
            ip8_source_dag_certificate -- --nocapture
          cargo test -p compiler-backend-x86 --lib \
            --features x7-ip4-auto-dag-probe \
            dag_match -- --nocapture
          cargo test -p compiler-backend-x86 --lib \
            --features x7-ip4-auto-dag-probe --quiet
      - name: Native independent GCC C11 baseline without AND probe
        working-directory: compiler
        run: |
          set -euo pipefail
          cargo test -p compiler-backend-x86 --test x7_ip4_source_and_native \
            --features x7-typeid-source-dag-optin \
            -- --nocapture
      - name: Native independent GCC C11 AND probe GAS + direct ELF
        working-directory: compiler
        run: |
          set -euo pipefail
          cargo test -p compiler-backend-x86 --test x7_ip4_source_and_native \
            --features x7-ip4-auto-dag-probe \
            -- --nocapture
      - name: Strict correctness and suspicious Clippy
        working-directory: compiler
        run: |
          set -euo pipefail
          cargo clippy -p compiler-backend-x86 --lib \
            --features x7-ip4-auto-dag-probe -- \
            -D clippy::correctness -D clippy::suspicious \
            -A clippy::empty_line_after_doc_comments
  # IP9 proof/selection job is placed in an already registered workflow
  # so a PR can validate it even before Github recognizes a new workflow file.
  ip9-source-z3-certificate-native:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 52ce59d9c7087e7e4aa181d81ee3949f9373af30
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Exact pinned compiler and git dependency setup
        run: |
          set -euo pipefail
          test "$(git -C compiler rev-parse HEAD)" = "52ce59d9c7087e7e4aa181d81ee3949f9373af30"
          git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
          git config --global --add url."https://github.com/".insteadOf "git@github.com:"
          rustc --version
      - name: Install explicit bounded QF_BV solver
        run: |
          set -euo pipefail
          sudo apt-get -qq update
          sudo apt-get -qq install -y z3
          z3 --version
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: x7-ip9-source-z3-certified-logic
      - name: Recheck independent original source pins fresh Z3 and generated certificates
        working-directory: compiler
        run: |
          set -euo pipefail
          python3 tools/regen_x86_dag_rule_groups.py --check
          python3 tools/x7_ip8_dag_certificates.py --check
          python3 tools/x7_ip9_logic_dag_probe.py --check
          python3 tools/x7_ip8_experimental_dag_certificates.py --check
          PYTHONPATH=tools python3 -m unittest -v \
            test_x7_ip9_logic_dag_probe \
            test_x7_ip8_experimental_dag_certificates \
            test_x7_ip8_dag_certificates \
            test_x7_ip4_emit_and_dag_probe
      - name: Shared backend and source-DAG mutation/full x86 tests
        working-directory: compiler
        run: |
          set -euo pipefail
          cargo test -p compiler-backend --lib --quiet
          cargo test -p compiler-backend-x86 --lib \
            --features x7-ip9-source-logic-probe \
            ip8_source_dag_certificate -- --nocapture
          cargo test -p compiler-backend-x86 --lib \
            --features x7-ip9-source-logic-probe --quiet
          cargo test -p compiler-backend-x86 --lib \
            --features x7-ip4-auto-dag-probe,x7-ip9-source-logic-probe \
            ip8_source_dag_certificate -- --nocapture
      - name: Actual TypeId GCC C11 baseline with OR XOR not enabled
        working-directory: compiler
        run: |
          set -euo pipefail
          cargo test -p compiler-backend-x86 \
            --test x7_ip9_logic_source_native \
            --features x7-typeid-source-dag-optin -- --nocapture
      - name: Actual TypeId OR XOR native pre-RA selected GAS and direct ELF
        working-directory: compiler
        run: |
          set -euo pipefail
          cargo test -p compiler-backend-x86 \
            --test x7_ip9_logic_source_native \
            --features x7-ip9-source-logic-probe -- --nocapture
      - name: Strict lint on exact source-linked research feature
        working-directory: compiler
        run: |
          set -euo pipefail
          cargo clippy -p compiler-backend-x86 --lib \
            --features x7-ip9-source-logic-probe -- \
            -D clippy::correctness -D clippy::suspicious \
            -A clippy::empty_line_after_doc_comments
