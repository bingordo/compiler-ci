name: X7 native TypeId selector runtime hit/miss instrumentation
on:
  pull_request:
    paths: ['.github/workflows/verify-x7-typeid-selector-hit-miss-20261119.yml']
permissions:
  contents: read
jobs:
  selector-hit-miss:
    runs-on: ubuntu-24.04
    timeout-minutes: 27
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: ded09992023ab6e827839c6e0b2fbee9aab21882
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Source-pinned selector compile and parser unit checks
        working-directory: compiler
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "ded09992023ab6e827839c6e0b2fbee9aab21882"
          python3 -m py_compile tools/x7_typeid_selection_telemetry.py tools/test_x7_typeid_selection_telemetry.py
          PYTHONPATH=tools python3 -m unittest -v test_x7_typeid_selection_telemetry
          cargo test -p compiler-backend-x86 --lib selector::tests --quiet
      - name: Runtime selection trace smoke test
        working-directory: compiler
        run: |
          set -euo pipefail
          X7_TYPEID_SELECT_TRACE=1 cargo test -p compiler-backend-x86 --lib selector::tests::generated_native_scalar_family_admission_matches_reviewed_width_matrix -- --nocapture > /tmp/x7-selector.log 2>&1
          grep -q '^X7_TYPEID_SELECT' /tmp/x7-selector.log
          PYTHONPATH=tools python3 tools/x7_typeid_selection_telemetry.py /tmp/x7-selector.log > /tmp/x7-selector-summary.json
          python3 -c 'import json; d=json.load(open("/tmp/x7-selector-summary.json")); assert d["attempts"]>0 and d["hits"]>0 and d["misses"]>0; assert not d["new_isa_admission_or_proof"]; print("X7_ACTUAL_TYPEID_ATTEMPTS", d["attempts"], "HITS",d["hits"], "MISSES",d["misses"])'
