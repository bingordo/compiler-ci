name: IR F47 temporary nested-CMOV test-only compatibility acceptance
on:
  push:
    branches:
      - ci/ir-f47-temporary-ifconversion-shim-20261113
  workflow_dispatch:
permissions:
  contents: read
jobs:
  nested-cmov-compat:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      CARGO_INCREMENTAL: '0'
    steps:
      - name: Checkout exact compiler shim source
        uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 193136a45da5ba929bdee5e4134ac5122feff06f
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Verify source and restrict core workspace
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C compiler rev-parse HEAD)" = "193136a45da5ba929bdee5e4134ac5122feff06f"
          cat > compiler/Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir", "crates/opt", "crates/backend", "crates/backend-x86"]
          EOF
          rm -f compiler/Cargo.lock
          echo "Pinned source: 193136a45da5ba929bdee5e4134ac5122feff06f" >> "$GITHUB_STEP_SUMMARY"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: ir-f47-temp-ifconversion-v1
      - name: Preserve all seven historical x86 CMOV flags, assembly, ELF and C oracle tests
        working-directory: compiler
        run: cargo test -p compiler-opt --test if_conversion_native -- --nocapture
      - name: Native typed-pipeline and reference compiler regression
        working-directory: compiler
        run: |
          set -euo pipefail
          cargo test -p compiler-opt --test typed_native_parity
          cargo test -p compiler-opt --lib
          cargo test -p compiler-backend-x86 --lib
          cargo test -p compiler-ir --lib
      - name: Strict all-target Clippy
        working-directory: compiler
        run: cargo clippy -p compiler-ir -p compiler-opt -p compiler-backend -p compiler-backend-x86 --all-targets -- -D warnings
