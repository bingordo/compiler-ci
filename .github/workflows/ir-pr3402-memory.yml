# Disposable source-pinned test, not for compiler-ci main.
name: IR PR3402 native memory contracts
on:
  push:
    branches: [verify-ir-memory-3402-20261126]
    paths: ['.github/workflows/ir-pr3402-memory.yml']
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      SOURCE_SHA: a8c5d302386c93ab405639f3433adf51181059e2
      CARGO_INCREMENTAL: '0'
      CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: ${{ env.SOURCE_SHA }}
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Verify source SHA and isolate core workspace
        run: |
          set -euo pipefail
          test "$(git -C compiler rev-parse HEAD)" = "$SOURCE_SHA"
          cat > compiler/Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir", "crates/opt", "crates/backend", "crates/backend-x86", "crates/backend-aarch64"]
          EOF
          rm -f compiler/Cargo.lock
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: ir-pr3402-memory
      - name: Compile all optimizer targets and run memory regression tests
        working-directory: compiler
        run: |
          set -euo pipefail
          cargo check -p compiler-opt --all-targets
          cargo test -p compiler-opt --test typed_dse
          cargo test -p compiler-opt --test typed_global_memory
          cargo test -p compiler-opt --test memory_native
          cargo test -p compiler-opt --test memory_analysis_bounds
      - name: Strict focused optimizer Clippy
        working-directory: compiler
        run: |
          set -euo pipefail
          cargo clippy --no-deps -p compiler-opt --test typed_dse --test typed_global_memory -- -D warnings -A dead_code
