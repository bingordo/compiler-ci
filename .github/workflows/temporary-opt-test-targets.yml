name: Compiler optimizer full test target compile
on:
  pull_request:
    paths:
      - '.github/workflows/temporary-opt-test-targets.yml'
permissions:
  contents: read
jobs:
  compile:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      SOURCE_SHA: 250defb63f024fecd6332a168ea8cc1573cccdf2
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: ${{ env.SOURCE_SHA }}
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Verify exact compiler SHA and isolate core
        run: |
          set -euo pipefail
          test "$(git -C compiler rev-parse HEAD)" = "$SOURCE_SHA"
          cat > compiler/Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir", "crates/opt", "crates/backend", "crates/backend-x86", "crates/backend-aarch64"]
          EOF
          rm -f compiler/Cargo.lock
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: all-opt-test-targets-v2
      - name: Compile all optimizer integration test targets
        working-directory: compiler
        run: |
          set -euo pipefail
          cargo test -p compiler-opt --tests --no-run
      - name: Compile all IR integration test targets
        working-directory: compiler
        run: |
          set -euo pipefail
          cargo test -p compiler-ir --tests --no-run
