name: X7 S0 actual original source GP encoder selections from real TypeId
on:
  pull_request:
    paths:
      - '.github/workflows/verify-x7-s0-actual-encoder-events-20261115.yml'
permissions:
  contents: read
jobs:
  source-vs-fallback-actual-elf-encoder:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 05361033c2691429d4ff7aade96967e7cc4c5048
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Pin compiler branch exactly
        run: test "$(git -C compiler rev-parse HEAD)" = "05361033c2691429d4ff7aade96967e7cc4c5048"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: x7-s0-actual-gp-native-encoded
      - name: Offline local backend workspace only (no compiler Actions)
        shell: bash
        run: |
          cat > compiler/Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir", "crates/opt", "crates/backend", "crates/backend-x86"]
          EOF
          rm -f compiler/Cargo.lock
      - name: Real TypeId production/fallback encoder byte parity and native C11
        shell: bash
        working-directory: compiler
        run: |
          set -euo pipefail
          cargo test -p compiler-backend-x86 --test x7_s3l_l5d_gp_write_typeid_native -- --nocapture
          cargo test -p compiler-backend-x86 --no-default-features --test x7_s3l_l5d_gp_write_typeid_native -- --nocapture
          cargo test -p compiler-backend-x86 --lib
          cargo test -p compiler-backend-x86 --no-default-features --lib
          echo X7_S0_ACTUAL_NATIVE_SOURCE_AND_FALLBACK_ENCODER_PASS
  unmodified-mini-c-source-production-report:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.CI_KEY }}
      - name: Trust pinned Oberon and Mini-C GitHub host
        run: ssh-keyscan github.com >> ~/.ssh/known_hosts
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 05361033c2691429d4ff7aade96967e7cc4c5048
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Pin compiler branch exactly
        run: test "$(git -C compiler rev-parse HEAD)" = "05361033c2691429d4ff7aade96967e7cc4c5048"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: x7-s0-real-source-report
      - name: Unmodified C source to real optimized TypeId ELF JSON report
        working-directory: compiler
        shell: bash
        run: |
          set -euo pipefail
          cargo test -p compiler --test x7_s0_source_encoder_report -- --nocapture
          cargo test -p compiler --test x86_annotated_asm
          cargo check -p compiler
          echo X7_S0_REAL_SOURCE_DIRECT_ELF_REPORT_PASS
