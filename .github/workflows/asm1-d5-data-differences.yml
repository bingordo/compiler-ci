name: ASM1-D5 same-section data differences acceptance
on:
  push:
    branches: [ci/asm1-d5-data-differences]
    paths: ['.github/workflows/asm1-d5-data-differences.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  data-differences:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 9a4a703b35bf4720bd27d8632f20388329da613e
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Verify compiler exact SHA
        run: test "$(git rev-parse HEAD)" = "9a4a703b35bf4720bd27d8632f20388329da613e"
      - name: Restrict workspace to compiler core
        run: |
          cat > Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir", "crates/opt", "crates/backend", "crates/backend-x86"]
          EOF
          rm -f Cargo.lock
      - uses: Swatinem/rust-cache@v2
        with:
          key: asm1-d5-data-differences
      - name: Test constant differences, GNU as native oracle and regressions
        run: |
          set -euo pipefail
          python3 tools/regen_x86_att_forms.py --check
          python3 -m unittest discover -s tools -p test_regen_x86_att_forms.py -v
          cargo check -p compiler-backend-x86 --all-targets
          cargo test -p compiler-backend-x86 --test att_data_differences -- --nocapture
          for suite in att_asm att_module att_module_strings att_aliases \
            att_mid_labels att_section_cursor att_text_alignment \
            m4_global_data_only_native m4_global_definitions_native \
            m4_global_pointer_relocations_native m4_global_external_native \
            m4_global_branch_relax_native machine_text_v1; do
            cargo test -p compiler-backend-x86 --test "$suite"
          done
          cargo test -p compiler-backend-x86 --lib
          cargo test -p compiler-backend --lib
          cargo clippy -p compiler-backend-x86 --lib --test att_data_differences --test att_module --test att_text_alignment -- -D warnings -A unused_variables -A clippy::suspicious_assignment_formatting
          echo 'ASM1_D5_SECTION_DIFFERENCES status=PASS' >> "$GITHUB_STEP_SUMMARY"
