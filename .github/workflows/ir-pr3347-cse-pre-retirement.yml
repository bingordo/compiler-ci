# Temporary source-pinned validation on compiler-ci only; never merge to main.
name: IR PR3347 CSE PRE retirement
on:
  push:
    branches: [verify-ir-cse-pre-3347-20261126]
    paths: ['.github/workflows/ir-pr3347-cse-pre-retirement.yml']
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      SOURCE_SHA: bce6710933e3aed4fbf597735728b8279bfc3e7f
      CARGO_INCREMENTAL: '0'
      CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: ${{ env.SOURCE_SHA }}
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Verify source and isolate core workspace
        run: |
          set -euo pipefail
          test "$(git -C compiler rev-parse HEAD)" = "$SOURCE_SHA"
          cat > compiler/Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir", "crates/opt", "crates/backend", "crates/backend-x86", "crates/backend-aarch64"]
          EOF
          rm -f compiler/Cargo.lock
          echo 'Remaining direct Function CSE/PRE references (audit):'
          git -C compiler grep -n -E '(^|[^[:alnum:]_])(cse|pre)::|legacy-function-(cse|pre)-oracle|compiler_opt::(cse|pre)' -- crates/opt || :
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: ir-pr3347-cse-pre
      - name: Compile all optimizer test targets
        working-directory: compiler
        run: |
          set -euo pipefail
          cargo check -p compiler-opt --all-targets
          cargo test -p compiler-opt --lib
          cargo test -p compiler-opt --test typed_cse
          cargo test -p compiler-opt --test typed_pre_native
          cargo test -p compiler-opt --test cse_native
          cargo test -p compiler-opt --test ct03_multi_edit_native
          cargo test -p compiler-opt --test alive_lite
          cargo test -p compiler-opt --test pre_licm_semantic_matrix
          cargo test -p compiler-opt --test loop_trap_semantics
      - name: Lint native optimizer
        working-directory: compiler
        run: |
          set -euo pipefail
          cargo clippy -p compiler-opt --lib -- -D warnings -A dead_code
