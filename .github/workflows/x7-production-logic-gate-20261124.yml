name: X7 source-pinned production logic selector validation
on:
  workflow_dispatch:
  push:
    branches:
      - 'test/x7-production-logic-gate-20261124'
    paths:
      - '.github/workflows/x7-production-logic-gate-20261124.yml'
  pull_request:
    paths:
      - '.github/workflows/x7-production-logic-gate-20261124.yml'
permissions:
  contents: read
jobs:
  x7-logic-native:
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    env:
      CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 96a9e9250753c593894831930308ccf19b1933de
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Exact source commit and toolchain
        run: |
          set -euo pipefail
          test "$(git -C compiler rev-parse HEAD)" = 96a9e9250753c593894831930308ccf19b1933de
          git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
          git config --global --add url."https://github.com/".insteadOf "git@github.com:"
          rustc --version
          cc --version | head -1
      - name: Validate unchanged generated rule admission proofs
        working-directory: compiler
        run: |
          set -euo pipefail
          python3 tools/x7_ip8_experimental_dag_certificates.py --check
          python3 -m py_compile tools/x7_ip8_experimental_dag_certificates.py
      - name: Compile feature-off/default and opt-in program boundaries
        working-directory: compiler
        run: |
          set -euo pipefail
          cargo check -p compiler-backend-x86 --no-default-features
          cargo check -p compiler --bin compiler
          cargo check -p compiler --bin compiler --features compiler-backend-x86/x7-production-generated-logic
      - name: Exact native proof, eight logic replacements and fallback
        working-directory: compiler
        run: |
          set -euo pipefail
          cargo test -p compiler-backend-x86 --lib --features x7-production-generated-logic \
            production_gate_replaces_all_eight_logic_shapes_and_preserves_shared_uses -- --nocapture
          cargo test -p compiler-backend-x86 --lib --features x7-production-generated-logic \
            nonmatching_logic_remains_unchanged_in_production -- --nocapture
          cargo test -p compiler-backend-x86 --lib --features x7-production-generated-logic \
            ip8_source_dag_certificate_tests -- --nocapture
          cargo test -p compiler-backend-x86 --lib --features x7-production-generated-logic \
            production_ctz_address_cutover -- --nocapture
      - name: Real checked Mini-C plus GCC C11 GAS/ELF/PIC/RBP differential
        working-directory: compiler
        run: |
          set -euo pipefail
          cargo test -p compiler --test x7_production_generated_logic \
            --features compiler-backend-x86/x7-production-generated-logic -- --nocapture
