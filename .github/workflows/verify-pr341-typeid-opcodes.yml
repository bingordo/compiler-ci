# Single-purpose exact source SHA validation; compiler PR #341.
name: Verify PR341 TypeId opcode types
on:
  push:
    branches: [ci/pr341-typeid-opcodes]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: cac46fa5be971170263c6c4aaa5bbbe88ce17505
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Verify checked out source revision
        run: test "$(git -C compiler rev-parse HEAD)" = "cac46fa5be971170263c6c4aaa5bbbe88ce17505"
      - name: Restrict to self-contained core workspace
        run: |
          cat > compiler/Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir", "crates/opt", "crates/backend", "crates/backend-x86"]
          EOF
          rm -f compiler/Cargo.lock
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: typed-opcode-pr341
          cache-workspace-crates: 'true'
      - name: Focused opcode typing and native value flow tests
        working-directory: compiler
        run: cargo test -p compiler-ir --test typed_opcode_types --test typed_value_flow
      - name: All compiler IR opt backend and native tests
        working-directory: compiler
        run: cargo test -p compiler-ir -p compiler-opt -p compiler-backend -p compiler-backend-x86
      - name: IR Clippy all targets strict
        working-directory: compiler
        run: cargo clippy -p compiler-ir --all-targets -- -D warnings
