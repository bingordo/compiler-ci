name: LTO ordered build link native and archive integration
on:
  push:
    branches: [verify/lto-ordered-build-link-20261115]
    paths: ['.github/workflows/lto-ordered-build-link-20261115.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ordered-link:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 9219d61464f63c70ba12807c1466579e89b3859d
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Verify source and public Git frontend dependencies
        run: |
          test "$(git -C compiler rev-parse HEAD)" = "9219d61464f63c70ba12807c1466579e89b3859d"
          git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
      - name: Focus native compiler driver workspace
        run: |
          cat > compiler/Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir", "crates/opt", "crates/backend", "crates/backend-x86", "crates/backend-aarch64", "crates/driver"]
          EOF
          rm -f compiler/Cargo.lock
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: lto-ordered-build-link
      - name: Ordered native / LTO build link and archive extraction
        working-directory: compiler
        run: |
          cargo test -p compiler --test lto_ordered_build -- --nocapture
          cargo test -p compiler --test lto_mixed_link
          cargo test -p compiler --test lto_elf_admission
          cargo test -p compiler --test lto_elf_visibility
          cargo test -p compiler --test lto_generated_multitu
      - name: Strict ordered link lint
        working-directory: compiler
        run: cargo clippy -p compiler --test lto_ordered_build -- -D warnings
