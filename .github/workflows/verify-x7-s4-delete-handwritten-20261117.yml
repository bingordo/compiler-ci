name: X7 S4 delete handwritten x86 physical emitter acceptance
on:
  pull_request:
    paths:
      - '.github/workflows/verify-x7-s4-delete-handwritten-20261117.yml'
permissions:
  contents: read
jobs:
  build-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    steps:
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.CI_KEY }}
      - name: Trust GitHub SSH
        run: ssh-keyscan github.com >> ~/.ssh/known_hosts
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 04b300ddc9de44c7cde540d2f4dc85bc2273ee1b
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Verify source
        run: test "$(git -C compiler rev-parse HEAD)" = 04b300ddc9de44c7cde540d2f4dc85bc2273ee1b
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: x7-s4-delete-handwritten-20261117
      - name: Check x86 compiler code without old module
        working-directory: compiler
        shell: bash
        run: |
          set -euo pipefail
          test ! -e crates/backend-x86/src/native_typeid.rs
          cargo check -p compiler
          echo X7_S4_DELETED_HANDWRITTEN_MAIN_BUILD_GREEN
      - name: Compile new backend and driver tests without legacy x86 module
        working-directory: compiler
        shell: bash
        run: |
          set -euo pipefail
          cargo test -p compiler-backend-x86 --lib
          cargo test -p compiler --test x7_s4_source_elf_metadata
          cargo test -p compiler --test x7_s4_pragmatic_driver_cutover
          echo X7_S4_DELETED_HANDWRITTEN_FOCUSED_GREEN
      - name: List tests and source references requiring retirement
        if: always()
        working-directory: compiler
        shell: bash
        run: |
          set -uo pipefail
          echo X7_S4_OLD_ONLY_TESTS_BEGIN
          git grep -l -E 'native_typeid::|use.*native_typeid|native_typeid[[:space:]]*\{' -- crates/backend-x86/tests crates/driver/tests tools/edg-driver/src | sort || true
          echo X7_S4_OLD_ONLY_TESTS_END
          echo X7_S4_OLD_CODE_REFS_BEGIN
          git grep -n 'native_typeid::' -- crates/backend-x86/src crates/driver/src tools/edg-driver/src || true
          echo X7_S4_OLD_CODE_REFS_END
