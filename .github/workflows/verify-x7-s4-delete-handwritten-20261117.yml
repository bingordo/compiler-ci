name: X7 S4 delete handwritten x86 physical emitter acceptance
on:
  pull_request:
    paths:
      - '.github/workflows/verify-x7-s4-delete-handwritten-20261117.yml'
permissions:
  contents: read
jobs:
  build-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    steps:
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.CI_KEY }}
      - name: Trust GitHub SSH
        run: ssh-keyscan github.com >> ~/.ssh/known_hosts
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: feature/x7-s4-remove-handwritten-emitter-20261117
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Verify source
        run: test "$(git -C compiler rev-parse HEAD)" = 6c46f4d990123587b9325d41910b5c52b96ea06e
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: x7-s4-delete-handwritten-20261117
      - name: Check x86 compiler code without old module
        working-directory: compiler
        shell: bash
        run: |
          set -euo pipefail
          test ! -e crates/backend-x86/src/native_typeid.rs
          cargo check -p compiler
          echo X7_S4_DELETED_HANDWRITTEN_MAIN_BUILD_GREEN
      - name: Compile new backend and driver tests without legacy x86 module
        working-directory: compiler
        shell: bash
        run: |
          set -euo pipefail
          cargo test -p compiler-backend-x86 --lib
          cargo test -p compiler-backend-x86 --no-default-features --lib
          cargo test -p compiler-backend-x86 --test typeid_shared_machine
          cargo test -p compiler --test x7_s4_shared_default
          cargo test -p compiler --test x7_s4_selected_ir_replay
          cargo test -p compiler --test x7_s4_mixed_lto_shared_default
          cargo test -p compiler --test x7_s4_selected_lto
          cargo test -p compiler --test x7_s4_source_elf_metadata
          cargo test -p compiler --test x7_s4_pragmatic_driver_cutover
          echo X7_S4_DELETED_HANDWRITTEN_FOCUSED_GREEN
      - name: List tests and source references requiring retirement
        if: always()
        working-directory: compiler
        shell: bash
        run: |
          set -uo pipefail
          echo X7_S4_OLD_ONLY_TESTS_BEGIN
          git grep -l -E 'native_typeid::|use.*native_typeid|native_typeid[[:space:]]*\{' -- crates/backend-x86/tests crates/driver/tests tools/edg-driver/src | sort || true
          echo X7_S4_OLD_ONLY_TESTS_END
          echo X7_S4_OLD_CODE_REFS_BEGIN
          git grep -n 'native_typeid::' -- crates/backend-x86/src crates/driver/src tools/edg-driver/src || true
          echo X7_S4_OLD_CODE_REFS_END

  all-surviving-rust-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    steps:
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.CI_KEY }}
      - name: Trust GitHub SSH
        run: ssh-keyscan github.com >> ~/.ssh/known_hosts
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 6c46f4d990123587b9325d41910b5c52b96ea06e
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Verify pinned compiler revision
        run: test "$(git -C compiler rev-parse HEAD)" = 6c46f4d990123587b9325d41910b5c52b96ea06e
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: x7-s4-deleted-all-surviving-rust-tests
      - name: all-surviving-rust-tests
        working-directory: compiler
        shell: bash
        run: |
          set -uo pipefail
          set +e
          cargo test --no-fail-fast -p compiler-backend-x86 --tests
          x86=$?
          cargo test --no-fail-fast -p compiler --tests
          driver=$?
          echo "X7_S4_ALL_RETAINED_TESTS x86=$x86 driver=$driver"
          test "$x86" -eq 0 && test "$driver" -eq 0

  gcc-source-48-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    steps:
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.CI_KEY }}
      - name: Trust GitHub SSH
        run: ssh-keyscan github.com >> ~/.ssh/known_hosts
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 6c46f4d990123587b9325d41910b5c52b96ea06e
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Verify pinned compiler revision
        run: test "$(git -C compiler rev-parse HEAD)" = 6c46f4d990123587b9325d41910b5c52b96ea06e
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: x7-s4-deleted-gcc-source-48-gate
      - name: gcc-source-48-gate
        working-directory: compiler
        shell: bash
        run: |
          set -uo pipefail
          set -e
          cargo build -p compiler
          python3 tools/x7_s4_executable_source_gate.py \
            --compiler target/debug/compiler \
            --source-sha 6c46f4d990123587b9325d41910b5c52b96ea06e \
            --out ../x7-s4-post-delete-source \
            --scales 8 24 48 \
            --languages mini_c oberon \
            --modes plain framed pic pic_framed \
            --groups 3
          echo X7_S4_POST_DELETE_SOURCE_GCC_PASS
