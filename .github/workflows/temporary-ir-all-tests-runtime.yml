name: Temporary complete TypeId IR test execution
on:
  pull_request:
    paths:
      - '.github/workflows/temporary-ir-all-tests-runtime.yml'
permissions:
  contents: read
jobs:
  ir:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      SOURCE_SHA: 59982564731a385cda673a8dc942117c51d09655
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: ${{ env.SOURCE_SHA }}
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Verify source and isolate IR package
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C compiler rev-parse HEAD)" = "$SOURCE_SHA"
          cat > compiler/Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir"]
          EOF
          rm -f compiler/Cargo.lock
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: isolated-ir-all-test-runtime
      - name: Execute every IR unit and integration test
        working-directory: compiler
        shell: bash
        run: |
          set -euo pipefail
          cargo test -p compiler-ir --tests -- --test-threads=4
