name: TypeId P3.6 shared legacy CT-04 transitive phi worklist
on:
  pull_request:
    paths:
      - '.github/workflows/verify-typeid-p36-ct04-phi.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  p36:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
      CARGO_INCREMENTAL: '0'
    steps:
      - name: Checkout pinned compiler TypeId P3.6 candidate
        uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 475850afb91fb6f6e89b4471b1e45345de06fc0d
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Verify immutable compiler source SHA
        working-directory: compiler
        run: test "$(git rev-parse HEAD)" = "475850afb91fb6f6e89b4471b1e45345de06fc0d"
      - name: Resolve pinned frontend dependencies through HTTPS
        run: git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: typeid-p36-ct04-shared-phi
      - name: Direct TypeId vs independent legacy CT-04 transitive phi and C11 GAS/ELF runtime
        working-directory: compiler
        run: cargo test -p compiler-opt --test typed_transitive_phi -- --nocapture
      - name: Zero production legacy SSA verifier calls during CT-04 TypeId rewrite
        working-directory: compiler
        run: cargo test -p compiler-opt --features verify-counts --test typed_transitive_phi -- --nocapture
      - name: Old CT-04 phi and other TypeId CFG/optimizer regressions
        working-directory: compiler
        run: |
          cargo test -p compiler-opt --lib phi -- --nocapture
          cargo test -p compiler-opt --test typed_core_pipeline
          cargo test -p compiler-opt --test typed_core_native_verifier
          cargo test -p compiler-opt --test typed_identical_merges
      - name: Checked Mini-C/Oberon independent native C11 GAS and direct ELF
        working-directory: compiler
        run: cargo test -p compiler --bin compiler typeid_native_source -- --nocapture
      - name: Complete Mini-C/Oberon checked frontend regression including legacy backend
        working-directory: compiler
        run: cargo test -p compiler --bin compiler
      - name: AArch64 shared TypeId frontend/backend API
        working-directory: compiler
        run: cargo check -p compiler-backend-aarch64 --all-targets
      - name: Strict IR optimizer compiler x86 and AArch64 Clippy
        working-directory: compiler
        run: |
          cargo clippy -p compiler-ir -p compiler-opt -p compiler -p compiler-backend-x86 --all-targets -- -D warnings
          cargo clippy -p compiler-backend-aarch64 --lib -- -D warnings
      - name: Install GDB for preexisting native DWARF debugger oracle
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y gdb
      - name: Full IR optimizer machine backend and x86 regressions
        working-directory: compiler
        run: cargo test -p compiler-ir -p compiler-opt -p compiler-backend -p compiler-backend-x86
