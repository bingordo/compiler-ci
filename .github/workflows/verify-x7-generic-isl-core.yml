name: Validate X7 generic ISL semantic core
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/verify-x7-generic-isl-core.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 98b3765e57d19ff82c91e6b52659f0ff54d319f2
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Record tested compiler revision
        run: git rev-parse HEAD
      - name: Validate bounded generic ISL semantics
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tools -p 'test_x86_isl_semantic_core.py' -v
          python3 -m unittest discover -s tools -p 'test_x86_isl_generic_expr.py' -v
          python3 -m unittest discover -s tools -p 'test_x86_isl_semantic_features.py' -v
          python3 -m unittest discover -s tools -p 'test_x86_isl_semantic_corpus_report.py' -v
          python3 -m unittest discover -s tools -p 'test_x86_isl_corpus.py' -v
          python3 -m unittest discover -s tools -p 'test_x86_isl_bit_primitives.py' -v
          python3 -m unittest discover -s tools -p 'test_x86_isl_record_parity.py' -v
          python3 -m unittest discover -s tools -p 'test_x86_isl_tuples.py' -v
          python3 -m unittest discover -s tools -p 'test_x86_isl_pure_functions.py' -v
          python3 -m unittest discover -s tools -p 'test_x86_isl_symbolic_dag.py' -v
          python3 -m unittest discover -s tools -p 'test_x86_isl_symbolic_helpers.py' -v
          python3 -m unittest discover -s tools -p 'test_x86_generic_form_matcher.py' -v
          python3 -m unittest discover -s tools -p 'test_x86_generic_form_catalog.py' -v
          python3 -m unittest discover -s tools -p 'test_x86_form_memory_ssa_concrete.py' -v
          python3 -m unittest discover -s tools -p 'test_x86_intel_iform_effect_audit.py' -v
          python3 -m unittest discover -s tools -p 'test_x86_isl_iform_source_bridge.py' -v
          python3 -m py_compile tools/x86_isl_iform_source_bridge.py
          python3 -m py_compile tools/x86_intel_iform_effect_audit.py
          python3 -m py_compile tools/x86_form_memory_ssa.py
          python3 tools/x86_generic_form_catalog.py --check
          python3 -m py_compile tools/x86_isl_ordered_effect_trace.py tools/x86_isl_form_evidence.py
          python3 -m py_compile tools/x86_generic_form_catalog.py
          python3 -m py_compile tools/x86_generic_form_matcher.py
          python3 -m py_compile tools/x86_isl_semantic_core.py tools/x86_isl_semantic_features.py tools/x86_isl_symbolic_dag.py
