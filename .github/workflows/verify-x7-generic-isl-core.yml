name: Validate X7 generic ISL semantic core
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/verify-x7-generic-isl-core.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 06069e143aebb63db29a2e3c3697ccb86b00d85f
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Record tested compiler revision
        run: git rev-parse HEAD
      - name: Validate bounded generic ISL semantics
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tools -p 'test_x86_isl_semantic_core.py' -v
          python3 -m unittest discover -s tools -p 'test_x86_isl_generic_expr.py' -v
          python3 -m unittest discover -s tools -p 'test_x86_isl_semantic_features.py' -v
          python3 -m unittest discover -s tools -p 'test_x86_isl_semantic_corpus_report.py' -v
          python3 -m unittest discover -s tools -p 'test_x86_isl_corpus.py' -v
          python3 -m py_compile tools/x86_isl_semantic_core.py tools/x86_isl_semantic_features.py
