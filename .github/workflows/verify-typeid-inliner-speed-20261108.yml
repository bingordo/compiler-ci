name: Compare exact-source TypeId inliner release benchmarks
on:
  push:
    branches: [ci/typeid-inliner-speed-20261108]
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: abb55a33bacca95505f700d40772f19c17dc97b7
          path: old
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 9e7656db0516536bb7560d13090a22d6bfb9b1da
          path: new
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Verify both exact source hashes
        run: |
          test "$(git -C old rev-parse HEAD)" = "abb55a33bacca95505f700d40772f19c17dc97b7"
          test "$(git -C new rev-parse HEAD)" = "9e7656db0516536bb7560d13090a22d6bfb9b1da"
          git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: old -> target
          key: typeid-inline-comparison-old-v1
      - name: Baseline release TypeId native ablation (unchanged)
        working-directory: old
        run: |
          cargo test --release -p compiler-opt --test typed_core_inline_integration composed_typed_core_native_oracle_and_compile_time_ablation -- --nocapture 2>&1 | tee ../old-release.log
          grep -E 'TYPED_CORE_ABLATION ' ../old-release.log
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: new -> target
          key: typeid-inline-comparison-new-v1
      - name: Candidate release native ablation and padded-module scaling
        working-directory: new
        run: |
          cargo test --release -p compiler-opt --test typed_core_inline_integration composed_typed_core_native_oracle_and_compile_time_ablation -- --nocapture 2>&1 | tee ../new-release.log
          cargo test --release -p compiler-opt --test typed_core_inline_integration bounded_inliner_release_profile_reports_padded_module_time -- --nocapture 2>&1 | tee ../padded-release.log
          grep -E 'TYPED_CORE_ABLATION ' ../new-release.log
          grep -E 'TYPEID_INLINER_PADDED_ABLATION ' ../padded-release.log
      - name: Report comparable generated bytes and noisy median timings
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          for path in ['old-release.log','new-release.log','padded-release.log']:
              s=Path(path).read_text()
              print(f'=== {path} ===')
              for line in s.splitlines():
                  if 'TYPED_CORE_ABLATION ' in line or 'TYPEID_INLINER_PADDED_ABLATION ' in line:
                      print(line.split('TYPED_CORE_ABLATION ')[-1] if 'TYPED_CORE_ABLATION ' in line else line.split('TYPEID_INLINER_PADDED_ABLATION ')[-1])
              assert 'test result: ok' in s
          PY
          echo "Both exact-source release profiles and original C11 native A/B passed; wall-clock medians are descriptive, not a hard speed guarantee." >> "$GITHUB_STEP_SUMMARY"
