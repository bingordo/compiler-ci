name: Candidate ordered TypeId result verification PR 3227
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/verify-ordered-results-pr3227.yml']
permissions:
  contents: read
jobs:
  candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: ae12d1ddb1e10cfcaa06017066e1b803a89bc2ae
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Test isolated canonical IR crate
        run: |
          test "$(git -C compiler rev-parse HEAD)" = ae12d1ddb1e10cfcaa06017066e1b803a89bc2ae
          mkdir -p "$RUNNER_TEMP/core/crates"
          cp -a compiler/crates/ir "$RUNNER_TEMP/core/crates/"
          printf '[workspace]\nresolver = "2"\nmembers = ["crates/ir"]\n' > "$RUNNER_TEMP/core/Cargo.toml"
          cargo test --manifest-path "$RUNNER_TEMP/core/Cargo.toml" -p compiler-ir --lib
