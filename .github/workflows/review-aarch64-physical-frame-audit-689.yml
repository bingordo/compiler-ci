name: Source-pinned native AArch64 physical stack region audit #689
on:
  push:
    branches: [review/aarch64-physical-frame-audit-689]
    paths: ['.github/workflows/review-aarch64-physical-frame-audit-689.yml']
  pull_request:
    paths: ['.github/workflows/review-aarch64-physical-frame-audit-689.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 35
    steps:
      - name: Checkout temporary compiler-ci
        uses: actions/checkout@v4
      - name: Checkout exact compiler PR source
        uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 5d465b36ce80e4be7d20aa020f5b86e4e757c120
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Check pinned source and native ARM64 runner
        run: |
          set -euo pipefail
          test "$(git -C compiler rev-parse HEAD)" = "5d465b36ce80e4be7d20aa020f5b86e4e757c120"
          test "$(uname -m)" = "aarch64"
          command -v gcc
      - uses: dtolnay/rust-toolchain@stable
      - name: Isolate core workspace for exact-source audit
        working-directory: compiler
        run: |
          python3 - <<'PY'
          from pathlib import Path
          Path('Cargo.toml').write_text("""[workspace]
          resolver = "2"
          members = ["crates/ir", "crates/opt", "crates/backend", "crates/backend-x86", "crates/backend-aarch64"]
          """)
          PY
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: review-aarch64-physical-frame-audit-689
      - name: Physical SP slots, mutation checks and independent 4800-case C11 oracle
        working-directory: compiler
        run: cargo test -p compiler-opt --test review_aarch64_nested_same_successor_phi -- --nocapture
      - name: Prior ARM64 critical-edge and narrow memory callback controls
        working-directory: compiler
        run: |
          set -euo pipefail
          cargo test -p compiler-opt --test review_aarch64_mixed_phi_critical_call -- --nocapture
          cargo test -p compiler-opt --test review_aarch64_mixed_global_escape_loop -- --nocapture
          cargo test -p compiler-opt --test review_aarch64_loop_byte_phi_callback -- --nocapture
          cargo test -p compiler-opt --test review_aarch64_byte_phi_indirect_memory -- --nocapture
      - name: Existing native AArch64 pointer ABI and physical spill pressure
        working-directory: compiler
        run: |
          set -euo pipefail
          cargo test -p compiler-backend-aarch64 --test typeid_historical_pressure -- --nocapture
          cargo test -p compiler-backend-aarch64 --test ptr64_calls -- --nocapture
          cargo test -p compiler-backend-aarch64 --test typeid_abi_calls_native -- --nocapture
      - name: Strict IR optimizer and AArch64 library and test Clippy
        working-directory: compiler
        run: |
          set -euo pipefail
          cargo clippy -p compiler-ir -p compiler-opt -p compiler-backend -p compiler-backend-aarch64 --lib -- -D warnings
          cargo clippy -p compiler-opt --test review_aarch64_nested_same_successor_phi -- -D warnings
