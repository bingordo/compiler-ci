name: x86 native TypeId PHI same-home copy elimination and runtime oracle
on:
  push:
    branches: [ci/x86-native-phi-home-coalescing-20261114]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  x86-native-phi:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: bc329e61d283ec5d9815b36248c3988a4abe6099
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Pin source and scope backend workspace
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = bc329e61d283ec5d9815b36248c3988a4abe6099
          python3 - <<'PY'
          from pathlib import Path
          Path("Cargo.toml").write_text("""[workspace]
          resolver = "2"
          members = ["crates/ir", "crates/backend", "crates/opt", "crates/backend-x86"]
          """)
          PY
      - name: Verify exact physical copy count, negative width and swap
        run: |
          set -euo pipefail
          cargo check -p compiler-backend-x86 --all-targets
          cargo test -p compiler-backend-x86 --lib coalesced_edge_omits_identity_copies_but_preserves_parallel_swaps -- --nocapture
          cargo test -p compiler-backend-x86 --test native_typeid_direct -- --nocapture
          cargo test -p compiler-backend-x86 --test native_typeid_indirect_gp_varargs -- --nocapture
          cargo test -p compiler-backend-x86 --test native_typeid_indexed_indirect -- --nocapture
          cargo test -p compiler-backend-x86 --tests
          cargo clippy -p compiler-backend-x86 --all-targets -- -D warnings
          echo X86_NATIVE_PHI_HOME_IDENTITY_FULL_BACKEND_PASS
      - name: Check framing and default-feature independence
        run: |
          set -euo pipefail
          cargo test -p compiler-backend-x86 --no-default-features --lib coalesced_edge_omits_identity_copies_but_preserves_parallel_swaps -- --nocapture
          cargo test -p compiler-backend-x86 --no-default-features --test native_typeid_direct -- --nocapture
          echo X86_NATIVE_PHI_HOME_IDENTITY_NO_DEFAULT_PASS
