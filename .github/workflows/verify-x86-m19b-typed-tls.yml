name: x86 M1.19b physical TLS addresses compiler PR 1241
on:
  pull_request:
    paths:
      - '.github/workflows/verify-x86-m19b-typed-tls.yml'
permissions:
  contents: read
jobs:
  x86-typed-tls:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.CI_KEY }}
      - run: ssh-keyscan github.com >> ~/.ssh/known_hosts
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: feature/x86-typed-tls-physical-v2
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Check exact source
        run: test "$(git -C compiler rev-parse HEAD)" = "82f17e3fa48d07695e5a0863de2cf430539293b"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: x86-m19b-physical-tls
          cache-workspace-crates: 'true'
      - name: Real source TLS instruction ELF replay and codec checks
        working-directory: compiler
        run: |
          cargo test -p compiler-backend-x86 --test typeid_physical_tls_address_v2 -- --nocapture
          cargo test -p compiler --test typeid_x86_tls_access_snapshot -- --nocapture
          cargo test -p compiler --test typeid_x86_source_tls_snapshot -- --nocapture
          cargo test -p compiler --test typeid_x86_source_machine_dump -- --nocapture
      - name: Complete x86 backend and strict driver/backend Clippy
        working-directory: compiler
        run: |
          cargo test -p compiler-backend-x86
          cargo clippy -p compiler -p compiler-backend-x86 --all-targets -- -D warnings
