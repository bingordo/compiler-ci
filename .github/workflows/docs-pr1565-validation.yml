name: Compiler docs PR 1565 validation
on:
  push:
    branches: [main]
    paths: ['.github/workflows/docs-pr1565-validation.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  docs:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 2880ba0c6b5de26be2ec60c532e99cadb63093ed
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Confirm exact compiler revision
        run: test "$(git -C compiler rev-parse HEAD)" = "2880ba0c6b5de26be2ec60c532e99cadb63093ed"
      - name: Validate Markdown links
        working-directory: compiler
        run: python3 tools/check_doc_links.py
      - name: Test link checker
        working-directory: compiler
        run: python3 -m unittest discover -s tools -p 'test_check_doc_links.py' -v
