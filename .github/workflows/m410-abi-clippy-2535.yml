name: CI M410 Rust 1.100 ABI Clippy fix
on:
  pull_request:
    paths: ['.github/workflows/m410-abi-clippy-2535.yml']
permissions:
  contents: read
jobs:
  clippy:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 1cd9d7ee6d9fff386b8f46d62816b0d579848dd5
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Resolve compiler Git dependencies
        run: git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
      - name: Verify compiler SHA and test ABI planning
        working-directory: compiler
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "1cd9d7ee6d9fff386b8f46d62816b0d579848dd5"
          cargo test -p compiler-backend --lib abi_plan::
          cargo clippy -p compiler-backend --all-targets -- -D warnings
          cargo clippy -p compiler-backend --features elf-fuzz --lib -- -D warnings
