name: x86 TypeId inline release compile-time profile
on:
  push:
    branches: [main]
    paths: [.github/workflows/verify-x86-inline-release-profile-20261115.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  profile:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: b796b22814ad2ade077d3faa690ec438b946bd14
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Verify pinned compiler source and private frontend configuration
        run: |
          test "$(git -C compiler rev-parse HEAD)" = "b796b22814ad2ade077d3faa690ec438b946bd14"
          git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: x86-inline-release-profile-20261115
      - name: Two checked sources, alternating mode order, release native compiler
        working-directory: compiler
        shell: bash
        run: |
          set -euo pipefail
          cargo test --release -p compiler --test x86_inline_source_ablation -- --nocapture
          cargo test --release -p compiler --test x86_inline_source_ablation source_inline_release_compile_profile -- --ignored --nocapture 2>&1 | tee "$RUNNER_TEMP/x86-inline-release-profile.log"
          grep -q 'X86_INLINE_RELEASE_PROFILE source=chain mode=mini_default ' "$RUNNER_TEMP/x86-inline-release-profile.log"
          grep -q 'X86_INLINE_RELEASE_PROFILE source=branching mode=mini_noinline ' "$RUNNER_TEMP/x86-inline-release-profile.log"
      - name: Retain median and p90 source compiler samples
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: x86-inline-release-profile
          path: ${{ runner.temp }}/x86-inline-release-profile.log
          if-no-files-found: ignore
