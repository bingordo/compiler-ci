name: AArch64 S13 source-hybrid overlap and selection evidence
on:
  pull_request:
    paths:
      - '.github/workflows/verify-aarch64-a32-s13-hybrid-boundary.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pinned-python:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 2e582ab99789944cc983ce22c7b7acf93ed1a053
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Verify exact compiler source and offline AArch64 tests
        run: |
          set -euo pipefail
          test "$(git -C compiler rev-parse HEAD)" = 2e582ab99789944cc983ce22c7b7acf93ed1a053
          python3 -m unittest discover -s compiler/tools -p 'test_aarch64*.py' -v
          python3 -m py_compile compiler/tools/aarch64_a32_ast_hybrid_probe.py compiler/tools/test_aarch64_a32_ast_hybrid_probe.py
