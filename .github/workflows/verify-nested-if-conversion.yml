name: Validate nested if-conversion
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-nested-if-conversion.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: nested-if-conversion
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: opt/nested-if-conversion
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Report exact revision
        run: git -C compiler rev-parse HEAD | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Restrict workspace to compiler core
        shell: bash
        run: |
          cat > compiler/Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir", "crates/opt", "crates/backend", "crates/backend-x86"]
          EOF
          rm -f compiler/Cargo.lock
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: nested-if-conversion
      - name: Compile and test optimizer IR and backend
        working-directory: compiler
        run: cargo test -p compiler-ir -p compiler-opt -p compiler-backend -p compiler-backend-x86
      - name: Test generated-rule compatibility
        working-directory: compiler
        run: cargo test -p compiler-opt --features experimental-generated-rules
