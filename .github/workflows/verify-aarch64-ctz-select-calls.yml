name: AArch64 M7 CTZ select indirect-call native gate
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-aarch64-ctz-select-calls.yml'
permissions:
  contents: read
concurrency:
  group: aarch64-m7-ctz-select-calls
  cancel-in-progress: true
jobs:
  native:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - name: Checkout exact compiler candidate
        uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 6b19258c8fd817b999bc4d699339201766e31dbe
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Pin and isolate self-contained backend workspace
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C compiler rev-parse HEAD)" = 6b19258c8fd817b999bc4d699339201766e31dbe
          cat > compiler/Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir", "crates/backend", "crates/backend-aarch64"]
          EOF
          rm -f compiler/Cargo.lock
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: m7-ctz-select-calls-v1
      - name: Check AArch64 crate with warnings denied
        working-directory: compiler
        run: |
          RUSTFLAGS="-D warnings" cargo check -p compiler-backend-aarch64 --all-targets
          cargo clippy -p compiler-backend-aarch64 --lib -- -D warnings
      - name: Verify native backend tests and independent C oracle
        working-directory: compiler
        run: |
          cargo test -p compiler-backend-aarch64 -- --test-threads=1
          echo 'PASS native AArch64 CTZ, spill-safe select, void, 12-arg indirect callback and all prior backend suites' >> "$GITHUB_STEP_SUMMARY"
