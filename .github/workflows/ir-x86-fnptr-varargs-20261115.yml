name: TypeId function pointer and GP varargs fixed fixture migration
on:
  push:
    branches: [verify/ir-x86-fnptr-varargs-20261115]
    paths: ['.github/workflows/ir-x86-fnptr-varargs-20261115.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 77c8b60135b78f22ed5a5ae58fd54858eb49ed8b
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Verify exact compiler source
        run: test "$(git -C compiler rev-parse HEAD)" = "77c8b60135b78f22ed5a5ae58fd54858eb49ed8b"
      - name: Restrict workspace
        run: |
          cat > compiler/Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir", "crates/backend", "crates/backend-x86"]
          EOF
          rm -f compiler/Cargo.lock
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: typeid-fnptr-gpvarargs-fixture
      - name: Export original exact native TypeId callable graphs
        working-directory: compiler
        run: |
          cargo test -p compiler-backend-x86 --test native_typeid_function_signatures temporary_export_original_fixed_native_fnptr_graphs -- --nocapture
          cargo test -p compiler-backend-x86 --test native_typeid_indirect_gp_varargs temporary_export_original_fixed_native_fnptr_graphs -- --nocapture
