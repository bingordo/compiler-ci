name: TypeId function pointer and GP varargs fixed fixture migration
on:
  push:
    branches: [verify/ir-x86-fnptr-varargs-20261115]
    paths: ['.github/workflows/ir-x86-fnptr-varargs-20261115.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 88860cc3381b9917ac67f165774446006362fe18
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Verify exact compiler source
        run: test "$(git -C compiler rev-parse HEAD)" = "88860cc3381b9917ac67f165774446006362fe18"
      - name: Restrict workspace
        run: |
          cat > compiler/Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir", "crates/backend", "crates/backend-x86"]
          EOF
          rm -f compiler/Cargo.lock
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: typeid-fnptr-gpvarargs-fixture
      - name: Validate native TypeId function pointer fixture and old GP varargs gate
        working-directory: compiler
        run: |
          cargo test -p compiler-backend-x86 --test native_typeid_function_signatures --test native_typeid_indirect_gp_varargs
          cargo test -p compiler-backend-x86 --test native_typeid_direct --test native_typeid_select_cmov
          cargo test -p compiler-ir --test native_module_text_v3 --test native_fixture_text
          cargo clippy -p compiler-backend-x86 --no-deps --test native_typeid_function_signatures --test native_typeid_indirect_gp_varargs -- -D warnings
