name: Validate source memmove self alias PR3041
on:
  push:
    branches: [test/memmove-self-alias-pr3041]
    paths: ['.github/workflows/validate-memmove-self-alias-pr3041.yml']
permissions:
  contents: read
jobs:
  differential:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 402e1e0e73dd1536d00d81bda5fb67294d6c360f
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Confirm source pinned exactly
        run: test "$(git -C compiler rev-parse HEAD)" = "402e1e0e73dd1536d00d81bda5fb67294d6c360f"
      - name: Configure private dependency access
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan github.com >> ~/.ssh/known_hosts
          eval "$(ssh-agent -s)"
          git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: source-memmove-self-alias-pr3041
      - name: Run source-level GCC/GAS/ELF differential
        working-directory: compiler
        run: cargo test -p compiler --test native_lp64_disjoint_memmove -- --nocapture
      - name: Verify available Rust tools
        run: cargo --version && rustc --version
      - name: Record candidate identity
        run: echo 'Validated compiler SHA 402e1e0e73dd1536d00d81bda5fb67294d6c360f' >> "$GITHUB_STEP_SUMMARY"
