# Validate the exact compiler PR #3005 head on compiler-ci, not compiler Actions.
name: Rust GCC header-option and link-preflight acceptance
on:
  pull_request:
    paths: ['.github/workflows/verify-rust-gcc-header-options-pr3005.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  gcc-header-options:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 4e96565545aae130d3d4ede6da0a6c14f35b05f9
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.CI_KEY }}
      - name: Compile production Rust driver
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C compiler rev-parse HEAD)" = 4e96565545aae130d3d4ede6da0a6c14f35b05f9
          timeout --signal=TERM --kill-after=10s 14m cargo build -p compiler --bin compiler --manifest-path compiler/Cargo.toml
      - name: All isolated GCC driver planner regression tests
        shell: bash
        run: |
          set -euo pipefail
          d="$(mktemp -d)"
          trap 'rm -rf "$d"' EXIT
          root="$PWD/compiler"
          printf '#[path="%s/crates/driver/src/gcc_driver.rs"]\nmod gcc_driver;\n#[path="%s/crates/driver/tests/unit/gcc_driver_cases.rs"]\nmod gcc_driver_cases;\n' \
            "$root" "$root" > "$d/harness.rs"
          rustc --edition=2021 --test "$d/harness.rs" -o "$d/gcc_planner_tests"
          "$d/gcc_planner_tests" --nocapture
      - name: Native and GCC header search/forced include acceptance
        shell: bash
        run: |
          set -euo pipefail
          c="$PWD/compiler/target/debug/compiler"
          d="$(mktemp -d)"
          trap 'rm -rf "$d"' EXIT
          cd "$d"
          mkdir -p quoted system late headers
          printf '#define Q 1\n' > quoted/quoted.h
          printf '#define S 2\n' > system/system.h
          printf '#define L 3\n' > late/late.h
          printf '#define F 4\n' > headers/forced.h
          printf '#define M 32\n' > headers/macros.h
          cat > main.c <<'EOF'
          #include "quoted.h"
          #include <system.h>
          #include <late.h>
          int main(void) { return Q + S + L + F + M == 42 ? 0 : 1; }
          EOF
          # Separate operand spelling, including both forced preprocessing inputs.
          "$c" --gcc-driver -std=gnu11 -c main.c -o native.o \
            -iquote quoted -isystem system -idirafter late -I headers \
            -include forced.h -imacros macros.h -MD -MF native.d -MT native.o
          gcc native.o -o native
          ./native
          test -s native.d
          for header in quoted.h system.h late.h forced.h macros.h; do
            grep -F "$header" native.d
          done
          # GCC is the independent semantic oracle, not the native backend.
          gcc -std=gnu11 -c main.c -o reference.o \
            -iquote quoted -isystem system -idirafter late -I headers \
            -include forced.h -imacros macros.h
          gcc reference.o -o reference
          ./reference
          # Joined spellings must also be forwarded unchanged.
          "$c" --gcc-driver -c main.c -o joined.o \
            -iquotequoted -isystemsystem -idirafterlate -Iheaders \
            -includeheaders/forced.h -imacrosheaders/macros.h
          gcc joined.o -o joined
          ./joined
          echo 'RUST_GCC_PR3005_HEADER_DIFFERENTIAL=PASS' >> "$GITHUB_STEP_SUMMARY"
      - name: Fail-closed object-only link and PIC/common preflight
        shell: bash
        run: |
          set -euo pipefail
          c="$PWD/compiler/target/debug/compiler"
          d="$(mktemp -d)"
          trap 'rm -rf "$d"' EXIT
          cd "$d"
          printf 'int main(void) { return 0; }\n' > source.c
          gcc -c source.c -o existing.o
          for opt in -DTEST=1 -iquoteheaders -includeheaders/forced.h -std=c11; do
            if "$c" --gcc-driver existing.o "$opt" -o rejected; then
              echo "unexpected acceptance of object-only CPP flag $opt" >&2
              exit 1
            fi
            test ! -e rejected
          done
          for pic in -fPIC -fpic; do
            if "$c" --gcc-driver -fcommon "$pic" source.c -o rejected; then
              echo "unexpected acceptance of incompatible $pic + -fcommon" >&2
              exit 1
            fi
            test ! -e rejected
          done
          echo 'RUST_GCC_PR3005_FAIL_CLOSED_PREFLIGHT=PASS' >> "$GITHUB_STEP_SUMMARY"
