name: Validate AArch64 TypeId native source memset
on:
  push:
    branches: [ci-aarch64-typeid-bulkfill-20261123]
    paths: ['.github/workflows/ci-aarch64-typeid-bulkfill-20261123.yml']
  pull_request:
    paths: ['.github/workflows/ci-aarch64-typeid-bulkfill-20261123.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  aarch64-fill:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 6856553e124eeb67bceca26c5340b58297c624c9
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Verify compiler source SHA
        run: test "$(git -C compiler rev-parse HEAD)" = 6856553e124eeb67bceca26c5340b58297c624c9
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.CI_KEY }}
      - run: ssh-keyscan github.com >> ~/.ssh/known_hosts
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: aarch64-typeid-bulkfill
      - name: Rustfmt selected loop and native test
        working-directory: compiler
        run: rustfmt --check --edition 2021 crates/backend-aarch64/src/bulk_fill.rs crates/driver/tests/native_lp64_aarch64_dynamic_memset.rs
      - name: Compile all backend workspace targets
        working-directory: compiler
        run: cargo check --workspace --all-targets
      - name: AArch64 TypeId source-to-object fill loop and memcpy fallback
        working-directory: compiler
        run: cargo test -p compiler --test native_lp64_aarch64_dynamic_memset -- --nocapture
      - name: Existing AArch64 library suite
        working-directory: compiler
        run: cargo test -p compiler-backend-aarch64 --lib -- --nocapture
      - name: Mini-C independently gated native fill source
        working-directory: compiler
        run: cargo test --manifest-path tools/mini-c-driver/Cargo.toml --lib native_bulk_memcpy_capability -- --nocapture
      - name: x86 dynamic source memset regression
        working-directory: compiler
        run: cargo test -p compiler --test native_lp64_dynamic_memset -- --nocapture
