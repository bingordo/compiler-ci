name: Intel operand normalization single-read validation
on:
  pull_request:
    paths: ['.github/workflows/verify-iform-normalize-single-read.yml']
permissions:
  contents: read
jobs:
  verify-normalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: f7aa040dea3bdeab969b46e798e5c93997d4b769
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: d8ff2f3a05440b2cda354ad418af6ffcad7e7d7f
          path: baseline
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Verify candidate and run affected suites
        working-directory: compiler
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "f7aa040dea3bdeab969b46e798e5c93997d4b769"
          python3 -m unittest discover -s tools -p test_x86_g10_catalog_census.py -v
          python3 -m unittest discover -s tools -p test_x86_g10_source_operand_shapes.py -v
          python3 -m unittest discover -s tools -p test_x86_iform_batch_worklist.py -v
      - name: Compare complete normalized reports with previous implementation
        working-directory: compiler
        run: |
          set -euo pipefail
          PYTHONPATH=tools python3 - <<'PY'
          import importlib.util
          import json
          import tempfile
          from pathlib import Path
          from test_x86_g10_catalog_census import populated
          from x86_iform_batch_worklist import worklist, normalize_source_operand_shapes
          spec = importlib.util.spec_from_file_location("old_worklist", "../baseline/tools/x86_iform_batch_worklist.py")
          old = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(old)
          for duplicate in (False, True):
              with tempfile.TemporaryDirectory() as tmp:
                  src = populated(Path(tmp), duplicate=duplicate)
                  (src / "EMPTY.xml").write_text("<instruction/>")
                  report = worklist(src)
                  assert json.dumps(normalize_source_operand_shapes(report, src), sort_keys=True) == json.dumps(old.normalize_source_operand_shapes(report, src), sort_keys=True)
          print("NORMALIZED_REPORT_BYTE_PARITY_OK")
          PY
