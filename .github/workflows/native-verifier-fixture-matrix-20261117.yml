name: Generated TypeId fixture-driven native/legacy verifier matrix
on:
  push:
    branches: [verify/native-verifier-fixture-matrix-20261117]
    paths: ['.github/workflows/native-verifier-fixture-matrix-20261117.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 982abaebbf4b2c74b01bdb29291899d4832eb175
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Verify exact source SHA
        run: test "$(git -C compiler rev-parse HEAD)" = "982abaebbf4b2c74b01bdb29291899d4832eb175"
      - name: Isolate native IR workspace
        run: |
          cat > compiler/Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir"]
          EOF
          rm -f compiler/Cargo.lock
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: native-verifier-fixture-generated-20261117
      - name: Generated fixture-driven valid extension and invalid structural matrix
        working-directory: compiler
        run: cargo test -p compiler-ir --test native_verifier_fixture_matrix -- --nocapture
      - name: Independently generated CFGs and native/v1 verifier acceptance parity
        working-directory: compiler
        run: cargo test -p compiler-ir --test typed_verifier_generated --test typed_verifier_parity --test verifier_mutations -- --nocapture
      - name: All fixed TypeId canonical text and native binary codec regression
        working-directory: compiler
        run: |
          cargo test -p compiler-ir --test native_fixed_verifier_fixtures
          cargo test -p compiler-ir --test native_fixture_text --test native_module_text_v3 --test native_binary_v1
      - name: Strict scoped Clippy for generated and fixed verifier tests
        working-directory: compiler
        run: cargo clippy -p compiler-ir --no-deps --test native_verifier_fixture_matrix --test native_fixed_verifier_fixtures -- -D warnings
