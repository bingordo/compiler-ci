name: SCCP CSR index prototype benchmark
'on':
  pull_request:
    paths:
      - '.github/workflows/sccp-csr-index-probe-20261109.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 95b1cffa73cfc4a1ac073632d4beb8354d6635f6
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Confirm compiler SHA and host
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C compiler rev-parse HEAD)" = "95b1cffa73cfc4a1ac073632d4beb8354d6635f6"
          rustc --version
          cargo --version
          lscpu | grep -E 'Model name|CPU\(s\)|L1d cache|L2 cache|L3 cache' || true
      - name: Restrict self-contained workspace
        shell: bash
        run: |
          cat > compiler/Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir", "crates/opt", "crates/backend", "crates/backend-x86"]
          EOF
          rm -f compiler/Cargo.lock
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: sccp-csr-index-probe
      - name: Release build and strict Clippy
        working-directory: compiler
        run: |
          cargo build --release -p compiler-opt --example sccp_csr_probe
          cargo clippy -p compiler-opt --example sccp_csr_probe -- -D warnings
      - name: Measure index construction and propagation
        working-directory: compiler
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/time -v ./target/release/examples/sccp_csr_probe > "$RUNNER_TEMP/sccp-csr.csv" 2> "$RUNNER_TEMP/sccp-csr-time.txt"
          cat "$RUNNER_TEMP/sccp-csr.csv"
          cat "$RUNNER_TEMP/sccp-csr-time.txt" | grep -E 'Maximum resident set size|User time|System time|Elapsed \(wall' || true
          {
            echo '### Source-pinned SCCP indexed consumer microbenchmark'
            echo 'Measured compiler source commit 95b1cffa73cfc4a1ac073632d4beb8354d6635f6'
            echo 'Bench records: name, SSA instructions, ValueId stride, graph shape, rounds, median ns, median allocations, median allocated bytes.'
            echo 'WARNING: monotone synthetic value-publication, not actual SCCP/CFG/phi code or whole-source compilation.'
            echo '~~~csv'
            cat "$RUNNER_TEMP/sccp-csr.csv"
            echo '~~~'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Retain raw measured outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sccp-csr-index-probe
          path: |
            ${{ runner.temp }}/sccp-csr.csv
            ${{ runner.temp }}/sccp-csr-time.txt
          if-no-files-found: warn
