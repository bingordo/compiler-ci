name: X7.G10.N20 real I64 CFG phi and pressure native differential
on:
  push:
    branches: [ci/x7-g10-n20-cfg-pressure-64]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-native:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - name: Checkout exact N20 CFG/pressure compiler head
        uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 58d52af45f225cb78c10c1ac3cfb13b0d319a51a
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Real verified I64 SSA CFG/phi/stack-spill through GAS/direct ELF
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 58d52af45f225cb78c10c1ac3cfb13b0d319a51a
          python3 - <<'PY'
          from pathlib import Path
          Path("Cargo.toml").write_text("""[workspace]
          resolver = "2"
          members = ["crates/ir","crates/opt","crates/backend","crates/backend-x86"]
          """)
          PY
          cargo test -p compiler-backend-x86 --features x7-c-defined-64 \
            --test x7_g10_n20_cfg_pressure_64_native --offline -- --nocapture
          cargo test -p compiler-backend-x86 --features x7-c-defined-64 \
            --test x7_g10_n19_64_native --offline
          cargo test -p compiler-backend-x86 --features x7-c-defined-64 \
            --lib x7_late_selector --offline
          cargo test -p compiler-backend-x86 --no-default-features \
            --test x7_g10_n15_no_default_fallback --offline
          echo X7_G10_N20_CFG64_PRODUCTION_PASS
  full-workspace:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact N20 CFG/pressure compiler head
        uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 58d52af45f225cb78c10c1ac3cfb13b0d319a51a
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Private frontend git access
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.CI_KEY }}
      - name: Set up GitHub SSH and debugger
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H github.com >> ~/.ssh/known_hosts
          sudo apt-get update -qq
          sudo apt-get install -y gdb
      - name: Complete workspace, opt-in I64 CFG, disabled baseline
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 58d52af45f225cb78c10c1ac3cfb13b0d319a51a
          cargo test --workspace
          cargo test -p compiler-backend-x86 --features x7-c-defined-64
          cargo test -p compiler-backend-x86 --no-default-features
          echo X7_G10_N20_CFG64_WORKSPACE_PASS
