name: TypeId inliner pre-clone selective trials and native rollback
on:
  push:
    branches: [main]
    paths: [.github/workflows/verify-typeid-inline-prefilter-20261110.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  prefilter-native:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: ae437c4d103d449dd6f03d72665b11c06701bf6e
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Verify exact checked source revision
        run: |
          test "$(git -C compiler rev-parse HEAD)" = "ae437c4d103d449dd6f03d72665b11c06701bf6e"
      - name: Restrict workspace to optimizer and native backend crates
        run: |
          cat > compiler/Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir", "crates/opt", "crates/backend", "crates/backend-x86"]
          EOF
          rm -f compiler/Cargo.lock
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: typeid-inline-prefilter-20261110
      - name: Run new postopt negative and prefilter native tests
        working-directory: compiler
        run: |
          set -euo pipefail
          cargo test -p compiler-opt --test typed_inline_postopt_native_trial -- --nocapture
          cargo test -p compiler-opt --test typed_inline_cfg_native -- --nocapture
          cargo test -p compiler-opt --test typed_inline_memory_native -- --nocapture
          cargo test -p compiler-opt --test typed_inline_wide_void_native -- --nocapture
          cargo test -p compiler-opt --lib typed_inline::tests -- --nocapture
          cargo clippy -p compiler-opt --all-targets -- -D warnings
