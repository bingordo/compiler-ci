name: x86 physical MOV LEA CMP measured cost coverage
on:
  push:
    branches: [ci/x86-mov-lea-form-audit-20261107]
permissions:
  contents: read
jobs:
  profiles:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: eee2cb82c26609f7b23e52c50ab21837050322b9
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Generator freshness, exact mapping tests and checked CPU profiles
        working-directory: compiler
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "eee2cb82c26609f7b23e52c50ab21837050322b9"
          python3 tools/regen_x86_forms.py --check
          python3 tools/regen_x86_physical_costs.py --check
          PYTHONPATH=tools python3 -m unittest discover -s tools -p test_import_uops_info.py -v
          python3 tools/validate_x86_costs.py data/x86_costs_generic.json data/x86_costs_skl.json data/x86_costs_zen4.json
      - name: Reproduce 69 exact forms independently against vendor XML checksum
        working-directory: compiler
        run: |
          set -euo pipefail
          curl -fsSL --retry 2 --max-time 180 https://uops.info/instructions.xml -o /tmp/instructions.xml
          echo 'e5e702caaf04c4fc1f75192a9bbe4d8554b3e174f7933a14d124cc33ca677ab3  /tmp/instructions.xml' | sha256sum -c -
          for arch in SKL ZEN4; do
            python3 tools/import_uops_info.py /tmp/instructions.xml --architecture "$arch" \
              --mapping data/x86_uops_variant_mapping.json --output "/tmp/${arch}.json"
            python3 - "$arch" <<'PY'
          import json,sys
          from pathlib import Path
          arch=sys.argv[1]
          expected=json.loads(Path('data/x86_costs_'+arch.lower()+'.json').read_text())
          actual=json.loads(Path('/tmp',arch+'.json').read_text())
          assert actual==expected, 'CPU profile drift: '+arch
          assert len(actual['forms'])==69
          print('PASS 69 exact forms',arch)
          PY
          done
  native-backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: eee2cb82c26609f7b23e52c50ab21837050322b9
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Backend-only workspace
        run: |
          cat > compiler/Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir", "crates/opt", "crates/backend", "crates/backend-x86"]
          EOF
          rm -f compiler/Cargo.lock
      - name: Full x86 unit, native GAS/ELF and strict Clippy
        working-directory: compiler
        run: |
          set -euo pipefail
          cargo test -p compiler-backend-x86
          cargo clippy -p compiler-backend-x86 --all-targets -- -D warnings
      - name: Capture rustfmt canonical output for new module
        working-directory: compiler
        run: |
          rustfmt --edition 2021 crates/backend-x86/src/physical_costs.rs
          git diff --numstat -- crates/backend-x86/src/physical_costs.rs
          python3 - <<'PY'
          from pathlib import Path
          print('BEGIN_FORMATTED_PHYSICAL_COSTS')
          print(Path('crates/backend-x86/src/physical_costs.rs').read_text(),end='')
          print('END_FORMATTED_PHYSICAL_COSTS')
          PY
  mini-c:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: eee2cb82c26609f7b23e52c50ab21837050322b9
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Release Mini-C actual physical emission census for SKL/Zen4
        run: |
          set -euo pipefail
          git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
          mkdir -p results
          cargo run --release --manifest-path compiler/tools/mini-c-driver/Cargo.toml \
            -p compiler-mini-c --example shared_select_physical_costs \
            | tee results/mov_lea_coverage.csv
          python3 - <<'PY'
          import csv
          from pathlib import Path
          rows=list(csv.DictReader(Path('results/mov_lea_coverage.csv').open()))
          assert len(rows)==28
          for r in rows:
              assert int(r['physical_instructions'])==int(r['measured_sites'])+int(r['unpriced_sites'])
              assert int(r['spill_words'])>=int(r['spill_homes'])
          baseline={'branches_24':49,'branches_48':81,'branches_72':114,'branches_144':196}
          for name,previous in baseline.items():
              selected=[r for r in rows if r['case']==name and r['budget']=='15' and r['cpu']=='SKL']
              assert len(selected)==1
              r=selected[0]
              assert int(r['measured_sites'])>previous, (name,r['measured_sites'],previous)
              print('COVERAGE',name,r['measured_sites'],'/',r['physical_instructions'],
                    'spills read/write',r['static_spill_reads'],r['static_spill_writes'])
          assert any(int(r['unpriced_sites'])>0 for r in rows), 'No blanket fake 100% coverage'
          print('PASS 28 checked source actual emitter profiles')
          PY
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: x86-physical-mov-lea-cmp-coverage
          path: results/mov_lea_coverage.csv
          retention-days: 30
