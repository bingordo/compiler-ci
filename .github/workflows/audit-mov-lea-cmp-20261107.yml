name: pin imported 69 exact MOV LEA CMP CPU variants
on:
  push:
    branches: [ci/x86-mov-lea-form-audit-20261107]
permissions:
  contents: read
jobs:
  profiles:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: ee873f3bd308d988c86b039ec7937446cea03041
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Reimport reviewed SKL and Zen4 exact full-width CPU profiles
        working-directory: compiler
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "ee873f3bd308d988c86b039ec7937446cea03041"
          python3 tools/regen_x86_forms.py --check
          curl -fsSL --retry 2 --max-time 180 https://uops.info/instructions.xml -o /tmp/instructions.xml
          echo 'e5e702caaf04c4fc1f75192a9bbe4d8554b3e174f7933a14d124cc33ca677ab3  /tmp/instructions.xml' | sha256sum -c -
          for arch in SKL ZEN4; do
            python3 tools/import_uops_info.py /tmp/instructions.xml --architecture "$arch" \
              --mapping data/x86_uops_variant_mapping.json --output "/tmp/${arch}.json"
            python3 tools/validate_x86_costs.py "/tmp/${arch}.json"
            python3 - "$arch" <<'PY'
          import json,sys
          from pathlib import Path
          arch=sys.argv[1]
          data=json.loads(Path('/tmp',arch+'.json').read_text())
          print('COVERAGE',arch,len(data['forms']))
          print('BEGIN_PROFILE',arch)
          print(json.dumps(data,sort_keys=True,indent=2))
          print('END_PROFILE',arch)
          assert len(data['forms']) == 69
          PY
          done
