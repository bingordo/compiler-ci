name: CI M4.9 verified physical source origin DWARF
on:
  pull_request:
    paths: ['.github/workflows/m49-origin-adapter-2288.yml']
permissions:
  contents: read
jobs:
  dwarf:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 4c9f6dce8fe87fb093a0ed2cb9114407bc6e7226
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Resolve compiler Git dependencies
        run: git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
      - name: Install GDB for native CU source breakpoint oracle
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y gdb
      - name: Exact-source native DWARF and backend acceptance
        working-directory: compiler
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "4c9f6dce8fe87fb093a0ed2cb9114407bc6e7226"
          cargo test -p compiler-backend --test x86_dwarf_line_native
          cargo test -p compiler-backend --test x86_dwarf_cu_native
          cargo test -p compiler-backend --lib
          cargo clippy -p compiler-backend --all-targets -- -D warnings
