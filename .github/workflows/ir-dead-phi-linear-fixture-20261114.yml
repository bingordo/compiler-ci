name: TypeId dead phi linear IR fixture migration
on:
  push:
    branches: [verify/ir-dead-phi-linear-fixture-20261114]
    paths: ['.github/workflows/ir-dead-phi-linear-fixture-20261114.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 206e47890ca27069efb54db5b7bc7d0110605e2a
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Check pinned source
        run: test "$(git -C compiler rev-parse HEAD)" = "206e47890ca27069efb54db5b7bc7d0110605e2a"
      - name: Restrict workspace to core crates
        run: |
          cat > compiler/Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir", "crates/opt", "crates/backend", "crates/backend-x86"]
          EOF
          rm -f compiler/Cargo.lock
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: ir-dead-phi-linear-v3
      - name: Native CFG/PHI parity and real GAS/ELF execution
        working-directory: compiler
        run: |
          cargo test -p compiler-opt --test typed_phi_dead_linear
          cargo test -p compiler-opt --test typed_phi_cfg
          cargo test -p compiler-opt --test ir_fixture_directives --test native_ir_pass_replay
          cargo test -p compiler-ir --test native_module_text_v3
          cargo clippy -p compiler-opt --test typed_phi_dead_linear --test typed_phi_cfg -- -D warnings
