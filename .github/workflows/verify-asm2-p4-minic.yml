name: ASM2 P4 extended asm clobber-only Mini-C
on:
  push:
    branches: [main]
    paths: ['.github/workflows/verify-asm2-p4-minic.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/mini-c
          ref: 2580109df8fb68fef7f40bad8d944afe6c3104e2
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Verify pinned candidate
        run: test "$(git rev-parse HEAD)" = '2580109df8fb68fef7f40bad8d944afe6c3104e2'
      - uses: Swatinem/rust-cache@v2
        with:
          key: asm2-p4-minic
      - name: Run complete syntax, semantic and Cranelift regressions
        run: |
          set -euo pipefail
          cargo test --workspace
          cargo clippy --workspace --all-targets -- -D warnings
          echo "ASM2_P4_FRONTEND=PASS source=2580109df8fb68fef7f40bad8d944afe6c3104e2" >> "$GITHUB_STEP_SUMMARY"
