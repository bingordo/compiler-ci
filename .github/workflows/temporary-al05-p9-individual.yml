name: Temporary AL05 P9-P16 per-test native timing
on:
  pull_request:
    paths:
      - '.github/workflows/temporary-al05-p9-individual.yml'
permissions:
  contents: read
jobs:
  x86-native:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    env:
      SOURCE_SHA: 59982564731a385cda673a8dc942117c51d09655
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: ${{ env.SOURCE_SHA }}
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Verify source and isolate optimizer
        run: |
          set -euo pipefail
          test "$(git -C compiler rev-parse HEAD)" = "$SOURCE_SHA"
          cat > compiler/Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir", "crates/opt", "crates/backend", "crates/backend-x86", "crates/backend-aarch64"]
          EOF
          rm -f compiler/Cargo.lock
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: al05-p9-per-test-timing
      - name: Compile single AL05 P9-P16 optimizer test binary once
        working-directory: compiler
        run: cargo test -p compiler-opt --test al05_p9_mixed_native_bridge --no-run
      - name: Execute each x86 native oracle separately with 150-second cap
        working-directory: compiler
        shell: bash
        run: |
          set -euo pipefail
          for name in \
            al05_p9_mixed_native_x86_elf_and_gas_match_c11_reference \
            al05_p14_generated_dag_native_x86_elf_and_gas_match_c11 \
            al05_p15_generated_phi_extremes_native_x86_elf_and_gas_match_c11 \
            al05_p16_coverage_guided_native_x86_elf_gas_c11; do
            echo "AL05_START $name"
            /usr/bin/time -f 'AL05_ELAPSED seconds=%e cpu=%P' \
              timeout --signal=TERM --kill-after=5s 150s \
              cargo test -p compiler-opt --test al05_p9_mixed_native_bridge "$name" -- --exact --nocapture --test-threads=1
            echo "AL05_PASS $name"
          done
