name: Validate nonwrapping bulk addition PR3158
on:
  push:
    branches: [test/bulk-add-count-pr3158]
    paths: ['.github/workflows/validate-bulk-add-pr3158.yml']
permissions:
  contents: read
jobs:
  differential:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 54bb653407e58ff0d174334fa4a9847ed42d9d11
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Confirm exact compiler candidate
        run: test "$(git -C compiler rev-parse HEAD)" = "54bb653407e58ff0d174334fa4a9847ed42d9d11"
      - name: Configure dependencies
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan github.com >> ~/.ssh/known_hosts
          git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: masked-bulk-add-pr3158
      - name: TypeId bounded addition regression
        working-directory: compiler
        run: cargo test -p compiler-ir --test typed_memcpy_count_bounds -- --nocapture
      - name: GCC native memmove GAS and ELF differential
        working-directory: compiler
        run: cargo test -p compiler --test native_lp64_disjoint_memmove -- --nocapture
      - name: Record pinned source
        if: always()
        run: |
          echo 'Pinned compiler source 54bb653407e58ff0d174334fa4a9847ed42d9d11' >> "$GITHUB_STEP_SUMMARY"
