name: Static rematerialization final smoke on production TypeId
on:
  push:
    branches: [verify/remat-static-wrapup-20261127]
    paths: [.github/workflows/verify-remat-static-wrapup-20261127.yml]
  workflow_dispatch:
permissions:
  contents: read
  statuses: write
jobs:
  final-static:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      COMPILER_SHA: 8a70c6263cf25a9b79bcd9d56ac55abf9adda69f
      CARGO_INCREMENTAL: '0'
      CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: ${{ env.COMPILER_SHA }}
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Verify source identity
        run: |
          set -euo pipefail
          test "$(git -C compiler rev-parse HEAD)" = "$COMPILER_SHA"
          git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
          echo "Compiler main tested: $COMPILER_SHA" >> "$GITHUB_STEP_SUMMARY"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: static-remat-wrapup-20261127
      - name: Generic SSA planner and all target remat regressions
        working-directory: compiler
        run: |
          set -euo pipefail
          cargo test -p compiler-backend --lib remat::
          cargo test -p compiler-backend-x86 --lib machine::pure_immediate_chain_tests
          cargo test -p compiler-backend-x86 --lib machine::dominance_remat_tests
          cargo test -p compiler-backend-x86 --lib remat_spill_census_tests
          cargo test -p compiler-backend-aarch64 --lib
          cargo test -p compiler-backend-riscv64 --lib
      - name: Native checked source oracle and no-PGO spill census
        working-directory: compiler
        run: |
          set -euo pipefail
          cargo test -p compiler --test x7_s4_rolling_checksum_source -- --nocapture
          cargo build -p compiler --bin compiler
          python3 tools/x86_remat_spill_audit.py
          python3 -m unittest discover -s tools -p 'test_x86_i32_remat_source_abba.py' -v
      - name: Report conclusion
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          case "$JOB_STATUS" in
            success) state=success ;;
            cancelled) state=error ;;
            *) state=failure ;;
          esac
          gh api -X POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state="$state" -f context="compiler/remat-static-wrapup" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            -f description="Current main static remat, all targets, C11 and spill audit"
