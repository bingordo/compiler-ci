name: Verify mergeable X3 offline discovery slice
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-x86-x3-merge.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-x86-x3-merge
  cancel-in-progress: true
jobs:
  offline-discovery:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: integration/x86-x3-offline-discovery-20261102
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Record tested X3 integration commit
        run: |
          echo "X3 integration revision: $(git rev-parse HEAD)" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Install Z3 and fetch reviewed Intel ISL XML
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq z3
          python3 tools/fetch_x86_isl_subset.py /tmp/intel-isl
          python3 tools/import_intel_isl_subset.py /tmp/intel-isl
      - name: Test Z3 bounded ADD, CTZ and BSF discovery
        env:
          INTEL_ISL_DIR: /tmp/intel-isl
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tools -p 'test_x86_pattern_discovery.py' -v
          python3 -m unittest discover -s tools -p 'test_x86_ctz_discovery.py' -v
          python3 -m unittest discover -s tools -p 'test_x86_bit_scan_discovery.py' -v
          echo "X3 bounded source-backed discovery passed; compiler IR support deliberately not asserted" >> "$GITHUB_STEP_SUMMARY"
