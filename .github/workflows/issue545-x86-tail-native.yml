# Source-pinned issue #545 x86-64 acceptance, owned by compiler-ci.
name: x86-64 TypeId direct tail-call acceptance (#545)
on:
  pull_request:
    paths:
      - '.github/workflows/issue545-x86-tail-native.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  x86-tail-native:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout exact compiler source
        uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 0571d8a316a7d2f6c1a7a7c720c9a98e91a95ffa
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Verify exact tested source
        run: |
          test "$(git -C compiler rev-parse HEAD)" = '0571d8a316a7d2f6c1a7a7c720c9a98e91a95ffa'
          echo 'Compiler SHA: \`0571d8a316a7d2f6c1a7a7c720c9a98e91a95ffa\`' >> "$GITHUB_STEP_SUMMARY"
      - uses: dtolnay/rust-toolchain@stable
      - name: Prepare isolated target workspace with generator tools
        run: |
          set -euo pipefail
          mkdir -p work/crates
          cp -a compiler/crates/ir compiler/crates/opt compiler/crates/backend \
            compiler/crates/backend-x86 compiler/crates/backend-aarch64 work/crates/
          cp -a compiler/tools compiler/examples compiler/tests work/
          cat > work/Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir", "crates/opt", "crates/backend",
                     "crates/backend-x86", "crates/backend-aarch64"]
          EOF
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: work
          key: issue545-x86-tail-native
      - name: x86 backend all-target typecheck
        working-directory: work
        # Optimizer has pre-existing legacy-oracle unused/dead-code warnings.
        # Strict changed-target Clippy remains separately enforced below.
        run: cargo check -p compiler-backend-x86 --all-targets
      - name: Previously failing 16-seed generated tail-jump ELF/GAS regression
        working-directory: work
        run: |
          cargo test -p compiler-opt --test typeid_fuzz_targeted \
            generated_internal_call_profiles_cover_auto_detected_direct_tail_exits -- --exact --nocapture
      - name: New 8-way direct tail and fallback C oracles
        working-directory: work
        run: cargo test -p compiler-backend-x86 --test tailcall_native -- --nocapture
      - name: Full TypeId targeted fuzz and x86 library regression
        working-directory: work
        run: |
          cargo test -p compiler-opt --test typeid_fuzz_targeted -- --test-threads=2
          cargo test -p compiler-backend-x86 --lib -- --test-threads=2
      - name: Production/test Clippy correctness and suspicious categories
        working-directory: work
        # The source baseline contains one existing doc-comment-spacing lint
        # in selector.rs, unrelated to this PR. Retain correctness and all
        # other suspicious lints as errors; avoid unrelated style churn.
        run: |
          cargo clippy -p compiler-backend-x86 --lib -- -D clippy::correctness -D clippy::suspicious -A clippy::empty_line_after_doc_comments
          cargo clippy -p compiler-backend-x86 --test tailcall_native -- -D clippy::correctness -D clippy::suspicious -A clippy::empty_line_after_doc_comments
