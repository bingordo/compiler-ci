name: ASM1-D1 zero-length data aliases
on:
  push:
    branches: [ci/asm1-d1-aliases]
    paths: ['.github/workflows/asm1-d1-aliases.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  x86-aliases:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 24bfcf4b403f9c6cee37ea1a99c0379dfb9e962c
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Verify exact compiler SHA
        run: test "$(git rev-parse HEAD)" = "24bfcf4b403f9c6cee37ea1a99c0379dfb9e962c"
      - name: Core workspace
        run: |
          cat > Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir", "crates/opt", "crates/backend", "crates/backend-x86"]
          EOF
          rm -f Cargo.lock
      - uses: Swatinem/rust-cache@v2
        with:
          key: asm1-d1-aliases
      - name: Run zero-size ELF aliases, GAS oracle, and core x86 regressions
        run: |
          set -euo pipefail
          python3 tools/regen_x86_att_forms.py --check
          python3 -m unittest discover -s tools -p test_regen_x86_att_forms.py -v
          cargo check -p compiler-backend-x86 --all-targets
          cargo test -p compiler-backend-x86 --test att_aliases -- --nocapture
          cargo test -p compiler-backend-x86 --test att_module
          cargo test -p compiler-backend-x86 --test att_module_strings
          cargo test -p compiler-backend-x86 --test att_asm
          cargo test -p compiler-backend-x86 --lib
          cargo test -p compiler-backend --lib
          cargo clippy -p compiler-backend-x86 --lib --test att_aliases --test att_module --test att_module_strings -- -D warnings -A unused_variables -A clippy::suspicious_assignment_formatting
          echo 'ASM1_D1_ALIASES status=PASS' >> "$GITHUB_STEP_SUMMARY"
