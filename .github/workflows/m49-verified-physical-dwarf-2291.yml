name: CI M4.9 final physical origins to DWARF
on:
  pull_request:
    paths: ['.github/workflows/m49-verified-physical-dwarf-2291.yml']
permissions:
  contents: read
jobs:
  dwarf:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: d7abd2d5e69fbfbeace306b02d205e07966e9b05
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Resolve compiler git dependencies
        run: git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
      - name: Exact-source final physical DWARF linked oracle and x86 regressions
        working-directory: compiler
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "d7abd2d5e69fbfbeace306b02d205e07966e9b05"
          cargo test -p compiler-backend-x86 --lib verified_physical_origins_attach_real_dwarf_after_branch_relaxation
          cargo test -p compiler-backend-x86 --lib
          cargo clippy -p compiler-backend-x86 --lib -- -D warnings
