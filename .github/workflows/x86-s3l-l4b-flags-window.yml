name: X7 S3.L L4b generic flags-only physical postallocation matcher
on:
  pull_request:
    paths:
      - '.github/workflows/x86-s3l-l4b-flags-window.yml'
permissions:
  contents: read
  actions: read
jobs:
  physical-window-flags-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 38
    env:
      SOURCE_SHA: 'f6e147aab47e6e1188b7f06b4750fdbb9cd70c5f'
      PYTHONPATH: compiler/tools
      X7_S3L_L4B_WORKLIST: /tmp/x7-s3l-l4b/source/original-source-xed-iforms.json
      X7_S3L_L4B_SMT: /tmp/x7-s3l-l4b/semantics/semantics-z3.json
    steps:
      - name: Checkout exact compiler source without using compiler Actions
        uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: f6e147aab47e6e1188b7f06b4750fdbb9cd70c5f
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Import pinned Intel-XED original 200-form source candidate evidence
        uses: actions/download-artifact@v4
        with:
          name: x7-s3l-l3c-source-XED-gated-production-admission
          run-id: 43728544711
          repository: bingordo/compiler-ci
          github-token: ${{ github.token }}
          path: /tmp/x7-s3l-l4b/source
      - name: Import independent generic Intel operation semantic SMT proofs
        uses: actions/download-artifact@v4
        with:
          name: x7-s3l-l2b-l3a-9-ops-generic-helper-smt-source-evidence
          run-id: 43687620382
          repository: bingordo/compiler-ci
          github-token: ${{ github.token }}
          path: /tmp/x7-s3l-l4b/semantics
      - name: Confirm exact source/XED proof again regenerates all 4 native recipes
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C compiler rev-parse HEAD)" = "$SOURCE_SHA"
          mkdir -p /tmp/x7-s3l-l4b/out
          python3 compiler/tools/x86_s3l_l4a_flags_recipe.py \
            --worklist "$X7_S3L_L4B_WORKLIST" \
            --generic-smt "$X7_S3L_L4B_SMT" \
            --report /tmp/x7-s3l-l4b/out/source-physical-recipes.json
          git -C compiler diff --exit-code -- \
            crates/backend-x86/src/generated_x7_s3l_l4a_flags_only_recipes.rs
          python3 compiler/tools/x86_s3l_l4a_flags_recipe.py \
            --worklist "$X7_S3L_L4B_WORKLIST" \
            --generic-smt "$X7_S3L_L4B_SMT" \
            --report /tmp/x7-s3l-l4b/out/source-physical-recipes.json --check
          python3 -m unittest -v test_x86_s3l_l4a_flags_recipe
          echo X7_S3L_L4B_PINNED_SOURCE_XED_SMT_RECIPES_PASS
      - name: Restrict offline Cargo workspace to backend
        shell: bash
        run: |
          cd compiler
          python3 - <<'PY'
          from pathlib import Path
          Path("Cargo.toml").write_text("""[workspace]
          resolver = "2"
          members = ["crates/ir", "crates/opt", "crates/backend", "crates/backend-x86"]
          """)
          PY
      - name: Run real postalloc selected CMP reverse and dead-AND TEST versus original for GAS and direct ELF
        shell: bash
        run: |
          set -euo pipefail
          cd compiler
          cargo test -p compiler-backend-x86 \
            --features 'x7-native-form-validation x7-c-defined-64 x7-c-defined-bitwise' \
            --test x7_s3l_l4b_flags_window_native --offline -- --nocapture
          echo X7_S3L_L4B_REAL_SELECTED_GAS_ELF_DIFF_PASS
      - name: Run shared physical matcher and original L4a flags-only encoder regressions
        shell: bash
        run: |
          set -euo pipefail
          cd compiler
          cargo test -p compiler-backend-x86 \
            --features 'x7-native-form-validation x7-c-defined-64 x7-c-defined-bitwise' \
            --lib dag_match::physical_window_tests --offline
          cargo test -p compiler-backend-x86 \
            --features 'x7-native-form-validation x7-c-defined-64 x7-c-defined-bitwise' \
            --lib x7_late_selector --offline
          cargo test -p compiler-backend-x86 \
            --features 'x7-native-form-validation x7-c-defined-64 x7-c-defined-bitwise' \
            --test x7_s3l_l4a_flags_only_native --offline
          cargo test -p compiler-backend-x86 \
            --features 'x7-native-form-validation x7-c-defined-64 x7-c-defined-bitwise' \
            --test x7_s3k_cmp_native --offline
          echo X7_S3L_L4B_EXISTING_NATIVE_SELECTOR_UNCHANGED_PASS
      - name: Compile no-default production feature and show flags-only fallback
        shell: bash
        run: |
          set -euo pipefail
          cd compiler
          cargo test -p compiler-backend-x86 --no-default-features \
            --features x7-native-form-validation \
            --test x7_s3l_l4b_flags_window_native --offline -- --nocapture
          cargo test -p compiler-backend-x86 --no-default-features \
            --test x7_g10_n15_no_default_fallback --offline
          echo X7_S3L_L4B_NO_DEFAULT_SAFE_FALLBACK_PASS
      - name: Archive original source proof and real postalloc selection evidence
        uses: actions/upload-artifact@v4
        with:
          name: x7-s3l-l4b-flags-only-postalloc-selected-native-gas-elf
          path: /tmp/x7-s3l-l4b/out/
          if-no-files-found: error
