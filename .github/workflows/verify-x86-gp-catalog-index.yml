name: x86 GP reviewed source catalog indexing dedup
on:
  pull_request:
    paths: ['.github/workflows/verify-x86-gp-catalog-index.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  gp-encoding-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout immutable compiler source
        uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 2b1f717916bb520a97788445803600123c3392cb
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Assert source pin
        run: test "$(git -C compiler rev-parse HEAD)" = "2b1f717916bb520a97788445803600123c3392cb"
      - name: Require byte-identical reviewed x86 GP Rust generation
        working-directory: compiler
        run: |
          set -euo pipefail
          export PYTHONPATH="$PWD/tools"
          python3 tools/regen_x86_scalar_bin_forms.py --check
          python3 tools/regen_x86_scalar_misc_forms.py --check
          python3 tools/regen_x86_gp_recipes.py --check
          python3 tools/regen_x86_selector_rules.py --check
      - name: Run independent form validators, GP and catalog mutation negatives
        working-directory: compiler
        run: |
          set -euo pipefail
          export PYTHONPATH="$PWD/tools"
          python3 -m unittest discover -s tools -p test_x86_encoding_catalog_index.py -v
          python3 -m unittest discover -s tools -p test_x86_scalar_bin_forms.py -v
          python3 -m unittest discover -s tools -p test_x86_scalar_misc_forms.py -v
          python3 -m unittest discover -s tools -p test_x86_gp_recipes.py -v
          python3 -m unittest discover -s tools -p test_x86_selector_rules.py -v
