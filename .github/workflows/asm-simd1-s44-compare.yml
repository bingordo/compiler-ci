name: ASM SIMD1 S4.4 packed compares GAS objdump acceptance
on:
  push:
    branches: [ci/asm-simd1-s44-compare-20261115]
    paths: ['.github/workflows/asm-simd1-s44-compare.yml']
  pull_request:
    branches: [main]
    paths: ['.github/workflows/asm-simd1-s44-compare.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  feature:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: e21bc0ff3129e28ed4e279edd516f07a88652dd8
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Verify feature pin
        run: test "$(git rev-parse HEAD)" = "e21bc0ff3129e28ed4e279edd516f07a88652dd8"
      - name: Restrict workspace
        run: |
          cat > Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir", "crates/opt", "crates/backend", "crates/backend-x86"]
          EOF
          rm -f Cargo.lock
      - uses: Swatinem/rust-cache@v2
        with:
          key: asm-simd1-s44-compare-feature
      - name: Validate generated VEX, GNU as and objdump
        run: |
          set -euo pipefail
          as --version | head -n1
          objdump --version | head -n1
          python3 tools/regen_x86_sse_packed_forms.py --check
          python3 tools/regen_x86_sse_vex_forms.py --check
          python3 tools/regen_x86_sse_evex_forms.py --check
          python3 -m unittest discover -s tools -p test_regen_x86_sse_evex_forms.py -v
          python3 -m unittest discover -s tools -p test_regen_x86_sse_vex_forms.py -v
          cargo check -p compiler-backend-x86 --all-targets
          cargo test -p compiler-backend-x86 --test att_sse_evex -- --list | tee /tmp/evex-listed-tests
          grep -qF 'generated_evex_forms_use_shared_physical_stream_and_elf_encoder: test' /tmp/evex-listed-tests
          grep -qF 'generated_evex_target_feature_and_mask_constraints: test' /tmp/evex-listed-tests
          grep -qF 'generated_evex_invalid_modifiers_banks_and_memory_fail_closed: test' /tmp/evex-listed-tests
          grep -qF 'generated_evex_bytes_and_decoded_operands_match_gnu_as_objdump: test' /tmp/evex-listed-tests
          grep -qF 'generated_evex_0f38_tuple_and_bw_feature_split: test' /tmp/evex-listed-tests
          grep -qF 'basic_packed_integer_evex_opcode_and_target_requirements: test' /tmp/evex-listed-tests
          grep -qF 'shared_mnemonics_select_evex_only_when_operands_require_it: test' /tmp/evex-listed-tests
          cargo test -p compiler-backend-x86 --test att_sse_evex -- --nocapture
          cargo test -p compiler-backend-x86 --lib sse_evex -- --nocapture
          cargo test -p compiler-backend-x86 --lib sse_packed -- --nocapture
          cargo test -p compiler-backend-x86 --lib sse_vex -- --nocapture
          cargo test -p compiler-backend-x86 --test att_sse_packed -- --list | tee /tmp/packed-listed-tests
          grep -qF 'generated_packed_sse_bytes_and_objdump_agree_with_gnu_as: test' /tmp/packed-listed-tests
          grep -qF 'every_generated_packed_sse_form_enters_shared_physical_encoder: test' /tmp/packed-listed-tests
          cargo test -p compiler-backend-x86 --test att_sse_packed -- --nocapture
          cargo test -p compiler-backend-x86 --test att_sse_vex -- --list | tee /tmp/vex-listed-tests
          grep -qF 'all_generated_vex_forms_enter_production_physical_encoder: test' /tmp/vex-listed-tests
          grep -qF 'all_generated_vex_forms_reject_invalid_vector_and_memory_operands: test' /tmp/vex-listed-tests
          grep -qF 'generated_vex_encoding_and_objdump_match_gnu_as: test' /tmp/vex-listed-tests
          grep -qF 'all_generated_vex_forms_enter_production_physical_encoder: test' /tmp/vex-listed-tests
          grep -qF 'generated_0f38_forms_have_width_specific_avx2_target_constraints: test' /tmp/vex-listed-tests
          cargo test -p compiler-backend-x86 --test att_sse_vex -- --nocapture
          cargo test -p compiler-backend-x86 --lib sse_vex -- --nocapture
          cargo test -p compiler-backend-x86 --test att_sse_packed -- --nocapture
          cargo test -p compiler-backend-x86 --test att_sse_scalar -- --nocapture
          cargo test -p compiler-backend-x86 --lib generated_form_tests -- --nocapture
          cargo test -p compiler-backend-x86 --test att_asm
          cargo test -p compiler-backend-x86 --test att_module
          cargo clippy -p compiler-backend-x86 --lib --test att_sse_vex -- -D warnings -A private_interfaces -A unused_variables -A clippy::suspicious_assignment_formatting
          echo 'ASM_SIMD1_S42_EVEX_FEATURE source=e21bc0ff3129e28ed4e279edd516f07a88652dd8 status=PASS' >> "$GITHUB_STEP_SUMMARY"
  integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: a952a281be5872cf93dda158403f26ee711f8fa0
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
          fetch-depth: 128
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: e21bc0ff3129e28ed4e279edd516f07a88652dd8
          path: feature
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
          fetch-depth: 128
      - name: Simulate and assert exact main merge
        run: |
          set -euo pipefail
          test "$(git -C compiler rev-parse HEAD)" = "a952a281be5872cf93dda158403f26ee711f8fa0"
          test "$(git -C feature rev-parse HEAD)" = "e21bc0ff3129e28ed4e279edd516f07a88652dd8"
          cd compiler
          git config user.name compiler-ci
          git config user.email compiler-ci@example.invalid
          git fetch ../feature HEAD
          test "$(git rev-parse FETCH_HEAD)" = "e21bc0ff3129e28ed4e279edd516f07a88652dd8"
          git merge --no-commit --no-ff FETCH_HEAD
          test "$(git rev-parse MERGE_HEAD)" = "e21bc0ff3129e28ed4e279edd516f07a88652dd8"
          grep -q 'pub mod sse_vex' crates/backend-x86/src/lib.rs
          grep -q 'pub mod sse_evex' crates/backend-x86/src/lib.rs
          grep -q 'pub(crate) fn encode_evex' crates/backend-x86/src/binary.rs
          grep -q 'pub(crate) fn encode_vex' crates/backend-x86/src/binary.rs
          git diff --check
          git diff --cached --check
          echo 'ASM_SIMD1_S42_EVEX_MERGE main=a952a281be5872cf93dda158403f26ee711f8fa0 feature=e21bc0ff3129e28ed4e279edd516f07a88652dd8' >> "$GITHUB_STEP_SUMMARY"
      - name: Restrict workspace
        working-directory: compiler
        run: |
          cat > Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir", "crates/opt", "crates/backend", "crates/backend-x86"]
          EOF
          rm -f Cargo.lock
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler
          key: asm-simd1-s44-compare-integration
      - name: Validate merged VEX with GNU as and objdump
        working-directory: compiler
        run: |
          set -euo pipefail
          as --version | head -n1
          objdump --version | head -n1
          python3 tools/regen_x86_sse_packed_forms.py --check
          python3 tools/regen_x86_sse_vex_forms.py --check
          python3 tools/regen_x86_sse_evex_forms.py --check
          python3 -m unittest discover -s tools -p test_regen_x86_sse_evex_forms.py -v
          python3 -m unittest discover -s tools -p test_regen_x86_sse_vex_forms.py -v
          cargo check -p compiler-backend-x86 --all-targets
          cargo test -p compiler-backend-x86 --test att_sse_evex -- --list | tee /tmp/evex-listed-tests
          grep -qF 'generated_evex_forms_use_shared_physical_stream_and_elf_encoder: test' /tmp/evex-listed-tests
          grep -qF 'generated_evex_target_feature_and_mask_constraints: test' /tmp/evex-listed-tests
          grep -qF 'generated_evex_invalid_modifiers_banks_and_memory_fail_closed: test' /tmp/evex-listed-tests
          grep -qF 'generated_evex_bytes_and_decoded_operands_match_gnu_as_objdump: test' /tmp/evex-listed-tests
          grep -qF 'generated_evex_0f38_tuple_and_bw_feature_split: test' /tmp/evex-listed-tests
          grep -qF 'basic_packed_integer_evex_opcode_and_target_requirements: test' /tmp/evex-listed-tests
          grep -qF 'shared_mnemonics_select_evex_only_when_operands_require_it: test' /tmp/evex-listed-tests
          cargo test -p compiler-backend-x86 --test att_sse_evex -- --nocapture
          cargo test -p compiler-backend-x86 --lib sse_evex -- --nocapture
          cargo test -p compiler-backend-x86 --lib sse_packed -- --nocapture
          cargo test -p compiler-backend-x86 --lib sse_vex -- --nocapture
          cargo test -p compiler-backend-x86 --test att_sse_packed -- --list | tee /tmp/packed-listed-tests
          grep -qF 'generated_packed_sse_bytes_and_objdump_agree_with_gnu_as: test' /tmp/packed-listed-tests
          grep -qF 'every_generated_packed_sse_form_enters_shared_physical_encoder: test' /tmp/packed-listed-tests
          cargo test -p compiler-backend-x86 --test att_sse_packed -- --nocapture
          cargo test -p compiler-backend-x86 --test att_sse_vex -- --list | tee /tmp/vex-listed-tests
          grep -qF 'all_generated_vex_forms_enter_production_physical_encoder: test' /tmp/vex-listed-tests
          grep -qF 'all_generated_vex_forms_reject_invalid_vector_and_memory_operands: test' /tmp/vex-listed-tests
          grep -qF 'generated_vex_encoding_and_objdump_match_gnu_as: test' /tmp/vex-listed-tests
          grep -qF 'all_generated_vex_forms_enter_production_physical_encoder: test' /tmp/vex-listed-tests
          grep -qF 'generated_0f38_forms_have_width_specific_avx2_target_constraints: test' /tmp/vex-listed-tests
          cargo test -p compiler-backend-x86 --test att_sse_vex -- --nocapture
          cargo test -p compiler-backend-x86 --lib sse_vex -- --nocapture
          cargo test -p compiler-backend-x86 --test att_sse_packed -- --nocapture
          cargo test -p compiler-backend-x86 --test att_sse_scalar -- --nocapture
          cargo test -p compiler-backend-x86 --lib generated_form_tests -- --nocapture
          cargo test -p compiler-backend-x86 --test att_asm
          cargo test -p compiler-backend-x86 --test att_module
          cargo clippy -p compiler-backend-x86 --lib --test att_sse_vex -- -D warnings -A private_interfaces -A unused_variables -A clippy::suspicious_assignment_formatting
          echo 'ASM_SIMD1_S42_EVEX_INTEGRATION status=PASS' >> "$GITHUB_STEP_SUMMARY"
