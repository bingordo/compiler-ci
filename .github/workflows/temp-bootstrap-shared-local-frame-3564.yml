# Temporary exact-source validation; do not merge.
name: Native Mini-C shared static frame candidate
on:
  pull_request:
    paths: ['.github/workflows/temp-bootstrap-shared-local-frame-3564.yml']
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: d6adfb4e359f6528cef99a5699a959040a9a5221
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.CI_KEY }}
      - name: Confirm exact source and unchanged frontend pin
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = d6adfb4e359f6528cef99a5699a959040a9a5221
          grep -F '24ec064faea8b0bfe0701c3ce4e9ff24c880ddcd' tools/mini-c-driver/Cargo.toml
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            tools/mini-c-driver/target/debug
          key: mini-c-typeid-shared-frame-3564
          restore-keys: |
            mini-c-typeid-
      - name: Focused GCC ELF and GAS differential
        run: cargo test --manifest-path tools/mini-c-driver/Cargo.toml --test shared_local_frame -- --nocapture
      - name: Full adapter regression and unchanged exact-parent comparison
        shell: bash
        run: |
          set -euo pipefail
          export CARGO_TARGET_DIR="$PWD/tools/mini-c-driver/target"
          set +e
          cargo test --manifest-path tools/mini-c-driver/Cargo.toml --lib 2>&1 | tee "$RUNNER_TEMP/candidate.log"
          candidate_status=${PIPESTATUS[0]}
          set -e
          git fetch --no-tags --depth=1 ssh://git@github.com/bingordo/compiler.git c65e9d474c3293af61f68e64bed81f517c0ab043
          git checkout --detach c65e9d474c3293af61f68e64bed81f517c0ab043
          test "$(git rev-parse HEAD)" = c65e9d474c3293af61f68e64bed81f517c0ab043
          set +e
          cargo test --manifest-path tools/mini-c-driver/Cargo.toml --lib 2>&1 | tee "$RUNNER_TEMP/parent.log"
          parent_status=${PIPESTATUS[0]}
          set -e
          echo "CANDIDATE_EXIT=$candidate_status PARENT_EXIT=$parent_status"
          for name in candidate parent; do
            grep -E '^test .* \.\.\. FAILED
 "$RUNNER_TEMP/$name.log" | sort > "$RUNNER_TEMP/$name.failed" || true
            grep -E '^test result:' "$RUNNER_TEMP/$name.log"
          done
          echo "Candidate-only failures:"
          comm -23 "$RUNNER_TEMP/candidate.failed" "$RUNNER_TEMP/parent.failed"
          echo "Parent-only failures:"
          comm -13 "$RUNNER_TEMP/candidate.failed" "$RUNNER_TEMP/parent.failed"
          test "$candidate_status" = 0
