      - name: Prove native signed-byte formal ignores poisoned high register bits
        working-directory: edgcpp/build/gcc-release
        run: |
          set -euo pipefail
          source ./environment.sh
          driver="$GITHUB_WORKSPACE/compiler/tools/edg-driver/target/debug/compiler-edg-driver"
          work="$RUNNER_TEMP/cxx5-signed-byte-formal"
          mkdir -p "$work"
          cd "$work"
          cat >impl.cpp <<'CPP'
          extern "C" int char_formal(signed char c) { return c; }
          CPP
          cat >driver.cpp <<'CPP'
          extern "C" int poison_call(int byte);
          int main() {
            if (poison_call(0x80)!=-128) return 11;
            if (poison_call(0xff)!=-1) return 12;
            if (poison_call(0x00)!=0) return 13;
            if (poison_call(0x01)!=1) return 14;
            if (poison_call(0x7f)!=127) return 15;
            return 0;
          }
          CPP
          cat >caller.S <<'ASM'
          .text
          .globl poison_call
          .type poison_call,@function
          poison_call:
              andl $255, %edi
              orl $0x7eadbe00, %edi
              subq $8, %rsp
              call char_formal
              addq $8, %rsp
              ret
          .section .note.GNU-stack,"",@progbits
          ASM
          gcc -c caller.S -o caller.o
          g++ -std=c++17 -Wall -Wextra -Werror -fno-exceptions -c impl.cpp -o gcc-owner.o
          g++ -std=c++17 -Wall -Wextra -Werror -fno-exceptions driver.cpp caller.o gcc-owner.o -o gcc-reference
