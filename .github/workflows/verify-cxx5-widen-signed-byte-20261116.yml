      - name: Prove same-owner this-to-member direct call with external G++ method owner
        working-directory: edgcpp/build/gcc-release
        run: |
          set -euo pipefail
          source ./environment.sh
          driver="$GITHUB_WORKSPACE/compiler/tools/edg-driver/target/debug/compiler-edg-driver"
          work="$RUNNER_TEMP/cxx5-borrowed-this-delegation"
          mkdir -p "$work"
          cd "$work"
          cat >relay.hpp <<'CPP'
          struct Relay {
            int seed;
            int target(int x) const;
            int forward(int x) const;
          };
          CPP
          cat >impl.cpp <<'CPP'
          #include "relay.hpp"
          int Relay::forward(int x) const { return this->target(x); }
          CPP
          cat >owner.cpp <<'CPP'
          #include "relay.hpp"
          int Relay::target(int x) const { return seed + x * 2; }
          CPP
          cat >main.cpp <<'CPP'
          #include "relay.hpp"
          int main() {
            Relay r{7};
            if (r.forward(3) != 13) return 11;
            if (r.forward(-8) != -9) return 12;
            return 0;
          }
          CPP
          g++ -std=c++17 -fno-exceptions -Wall -Wextra -Werror -c owner.cpp -o owner.o
          g++ -std=c++17 -fno-exceptions -Wall -Wextra -Werror impl.cpp main.cpp owner.o -o reference
          timeout 15s ./reference
          version="$(g++ -dumpfullversion -dumpversion)"
          gnu_number="$(printf '%s\n' "$version" | awk -F. '{printf "%d", $1*10000+($2+0)*100+($3+0)}')"
          "$driver" native.o --typeid-native --g++ --c++17 --no_exceptions --no_strict_gnu \
            --gnu_version "$gnu_number" impl.cpp >native.log 2>&1 || {
              tail -n 65 native.log >&2
              test ! -e native.o
              exit 1
            }
          test "$(od -An -tx1 -N4 native.o | tr -d '[:space:]')" = 7f454c46
          nm -u native.o | grep -F 'Relay'
          readelf -rW native.o | grep -F '_ZNK5Relay6targetEi'
          g++ -fno-exceptions main.cpp native.o owner.o -o native
          timeout 15s ./native
          echo 'CXX5_BORROWED_THIS independent_GCC_member_owner=executable_parity' >>"$GITHUB_STEP_SUMMARY"

      - name: Reject virtual this-member dispatch without native object or partial ELF
        working-directory: edgcpp/build/gcc-release
        run: |
          set -euo pipefail
          source ./environment.sh
          driver="$GITHUB_WORKSPACE/compiler/tools/edg-driver/target/debug/compiler-edg-driver"
          work="$RUNNER_TEMP/cxx5-virtual-this-negative"
          mkdir -p "$work"
          cd "$work"
          cat >bad.cpp <<'CPP'
          struct Bad {
            virtual int target(int) const;
            int forward(int x) const;
          };
          int Bad::forward(int x) const { return this->target(x); }
          CPP
          g++ -std=c++17 -fno-exceptions -Wall -Wextra -Werror -fsyntax-only bad.cpp
          version="$(g++ -dumpfullversion -dumpversion)"
          gnu_number="$(printf '%s\n' "$version" | awk -F. '{printf "%d", $1*10000+($2+0)*100+($3+0)}')"
          set +e
          "$driver" bad.o --typeid-native --g++ --c++17 --no_exceptions --no_strict_gnu \
            --gnu_version "$gnu_number" bad.cpp >bad.log 2>&1
          rc=$?
          set -e
          echo "CXX5_VIRTUAL_NEGATIVE rc=$rc"
          tail -n 35 bad.log || true
          if test -e bad.o; then
            echo '::error::virtual negative emitted native object'
            nm -a bad.o | tail -n 25 || true
          fi
          test "$rc" -ne 0
          test ! -e bad.o
          grep -E '(virtual|unsupported|member|callee|Error:)' bad.log
          grep -Fq 'EDG -> compiler-ir rejected source:' bad.log
          # An unsupported virtual call now reaches a more precise
          # source-shape verifier. The fail-closed no-object property,
          # not a stale diagnostic literal, is the invariant.
          echo 'CXX5_BORROWED_THIS virtual_dispatch=fail_closed_no_partial_elf' >>"$GITHUB_STEP_SUMMARY"
