          g++ -fno-exceptions driver.cpp caller.o native.o -o native
          timeout 15s ./native
          echo 'CXX5_SIGNED_AL source_formal=poisoned_register_GCC_executable_parity' >>"$GITHUB_STEP_SUMMARY"

