name: Validate native memcpy PR 2927 and IR bounds PR 2931

on:
  push:
    branches: [validate-memcpy-pr2927-pr2931-20261122]
    paths:
      - .github/workflows/validate-memcpy-pr2927-pr2931.yml
  pull_request:
    paths:
      - .github/workflows/validate-memcpy-pr2927-pr2931.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ir-bounds:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 108e80186dd2df0e8b6f449dc62993aee6a0f68e
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Check exact immutable IR candidate
        run: test "$(git -C compiler rev-parse HEAD)" = 108e80186dd2df0e8b6f449dc62993aee6a0f68e
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: memcpy-ir-count-pr2931
      - name: Check Rust format for shared proof and its independent tests
        working-directory: compiler
        run: rustfmt --check --edition 2021 crates/ir/src/typed_local_byte_ranges.rs crates/ir/tests/typed_memcpy_count_bounds.rs
      - name: Focused byte-count proof tests
        working-directory: compiler
        run: cargo test -p compiler-ir --test typed_memcpy_count_bounds -- --nocapture
      - name: Existing TypeId memcpy provenance regressions
        working-directory: compiler
        run: cargo test -p compiler-ir --lib typed_memcopy -- --nocapture
      - name: IR library regression suite
        working-directory: compiler
        run: cargo test -p compiler-ir --lib

  native-copy-matrix:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 29a6b56afca35e4503b4a41f4b478a900f54cb7d
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Check exact immutable differential candidate
        run: test "$(git -C compiler rev-parse HEAD)" = 29a6b56afca35e4503b4a41f4b478a900f54cb7d
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: memcpy-lp64-matrix-pr2927
      - name: Verify differential test format
        working-directory: compiler
        run: rustfmt --check --edition 2021 crates/driver/tests/native_lp64_memcpy_differential_matrix.rs
      - name: GCC versus emitted GAS and direct ELF executable matrix
        working-directory: compiler
        run: cargo test -p compiler --test native_lp64_memcpy_differential_matrix -- --nocapture
      - name: Existing bounded runtime LP64 memcpy differential
        working-directory: compiler
        run: cargo test -p compiler --test native_lp64_bounded_dynamic_memcpy -- --nocapture
