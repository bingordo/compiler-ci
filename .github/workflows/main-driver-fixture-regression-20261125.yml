name: Main compiler driver test fixture regression
on:
  pull_request:
    paths:
      - '.github/workflows/main-driver-fixture-regression-20261125.yml'
permissions:
  contents: read
jobs:
  main-driver-test-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 150e76da940aa34e806f8d800200cb7c6f55bac1
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Pin exact compiler main and toolchain
        run: |
          set -euo pipefail
          test "$(git -C compiler rev-parse HEAD)" = 150e76da940aa34e806f8d800200cb7c6f55bac1
          git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
          git config --global --add url."https://github.com/".insteadOf "git@github.com:"
          rustc --version
      - name: Build complete compiler driver test target, no exclusions
        working-directory: compiler
        run: |
          set -euo pipefail
          cargo test -p compiler --bin compiler --no-run
          echo 'MAIN_DRIVER_TEST_BUILD=PASS' >> "$GITHUB_STEP_SUMMARY"
      - name: Run exact historical source and X7 S4 fixture tests
        working-directory: compiler
        run: |
          set -euo pipefail
          cargo test -p compiler --bin compiler selected_machine_source_ir_dumps_preserve_exact_elf_and_gas_bytes -- --nocapture
          cargo test -p compiler --bin compiler gcc_driver_cases -- --nocapture
          echo 'MAIN_DRIVER_OLD_FIXTURES=PASS' >> "$GITHUB_STEP_SUMMARY"
