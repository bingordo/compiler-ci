# Temporary exact-source TypeId wide/void inliner acceptance; close unmerged.
name: Temporary TypeId wide void inliner native cutover
on:
  pull_request:
    paths:
      - '.github/workflows/temporary-wide-void-native-3058.yml'
permissions:
  contents: read
jobs:
  wide-void-native:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      SOURCE_SHA: e7a8801bc7ec4afc709eaee144222657b6d951bc
      CARGO_INCREMENTAL: '0'
      CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
    steps:
      - name: Checkout exact compiler source
        uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: ${{ env.SOURCE_SHA }}
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Verify compiler source and isolate core workspace
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C compiler rev-parse HEAD)" = "$SOURCE_SHA"
          cat > compiler/Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir", "crates/opt", "crates/backend", "crates/backend-x86", "crates/backend-aarch64"]
          EOF
          rm -f compiler/Cargo.lock
          rustc --version
      - name: Cache workspace
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: temporary-wide-void-native-3058
      - name: Run TypeId wide pointer void inliner integration and C11 executable oracle
        working-directory: compiler
        shell: bash
        run: |
          set -euo pipefail
          cargo test -p compiler-opt --test typed_inline_wide_void_native -- --nocapture
      - name: Scoped Clippy
        working-directory: compiler
        shell: bash
        run: |
          set -euo pipefail
          cargo clippy -p compiler-opt --test typed_inline_wide_void_native -- -D clippy::all -A clippy::needless_range_loop -A clippy::empty_line_after_doc_comments -A clippy::collapsible_match -A clippy::collapsible_if
