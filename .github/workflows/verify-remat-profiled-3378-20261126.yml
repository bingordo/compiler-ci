name: Source-pinned shared profiled rematerialization PR 3378
# Validation-only branch; no new recurring main-branch workload.
on:
  push:
    branches:
      - verify/remat-profiled-3378-20261126
    paths:
      - .github/workflows/verify-remat-profiled-3378-20261126.yml
  workflow_dispatch:
permissions:
  contents: read
  statuses: write
jobs:
  shared-remat:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
      COMPILER_SHA: 5879eae1119900b86a06ba1e459a80f199c0e12c
    steps:
      - name: Checkout exact candidate source
        uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: ${{ env.COMPILER_SHA }}
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Check exact source
        run: |
          set -euo pipefail
          test "$(git -C compiler rev-parse HEAD)" = "$COMPILER_SHA"
          echo "Compiler SHA: $COMPILER_SHA" >> "$GITHUB_STEP_SUMMARY"
          git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: profiled-remat-3378-20261126
      - name: Compile and run all shared rematerialization tests
        working-directory: compiler
        run: |
          set -euo pipefail
          cargo test -p compiler-backend --lib remat:: -- --nocapture
          cargo test -p compiler-backend --lib
      - name: Check shared backend Clippy
        working-directory: compiler
        run: cargo clippy -p compiler-backend --lib -- --no-deps -D warnings
      - name: Check target backend integration
        working-directory: compiler
        run: |
          set -euo pipefail
          cargo test -p compiler-backend-x86 --lib
          cargo test -p compiler-backend-aarch64 --lib
          cargo test -p compiler-backend-riscv64 --lib
      - name: Publish source-pinned validation status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          case "$JOB_STATUS" in
            success) state=success ;;
            cancelled) state=error ;;
            *) state=failure ;;
          esac
          gh api -X POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA"             -f state="$state"             -f context="compiler/remat-profiled-pr3378"             -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"             -f description="Merged main+PR compiler source 5879eae: shared remat tests, Clippy and target libraries"
