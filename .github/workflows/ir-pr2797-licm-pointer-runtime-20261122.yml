# Source-pinned acceptance for the independent LICM TypeId migration PR.
name: IR PR2797 LICM pointer-PHI and runtime native
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ir-pr2797-licm-pointer-runtime-20261122.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  licm-pointer:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      SOURCE_SHA: 0866439a117d69bc9157ae87d55384cb8df7c3b8
      CARGO_INCREMENTAL: '0'
      CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
    steps:
      - name: Check out exact compiler PR source
        uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: ${{ env.SOURCE_SHA }}
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Verify revision and isolate core workspace
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C compiler rev-parse HEAD)" = "$SOURCE_SHA"
          cat > compiler/Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir", "crates/opt", "crates/backend", "crates/backend-x86", "crates/backend-aarch64"]
          EOF
          rm -f compiler/Cargo.lock
          rustc --version
          cc --version | head -n 1
      - name: Cache isolated Rust compilation
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: ir-pr2797-licm-pointer
      - name: Test full native LICM structural and C11 GAS direct-ELF execution
        working-directory: compiler
        shell: bash
        run: |
          set -euo pipefail
          cargo test -p compiler-opt --test typed_licm_native -- --nocapture
          cargo test -p compiler-opt --test licm_preheaders -- --nocapture
          cargo test -p compiler-opt --test m4_integer_effects -- --nocapture
      - name: Clippy edited tests except unrelated existing x86 doc comment spacing
        working-directory: compiler
        run: |
          cargo clippy -p compiler-opt --test typed_licm_native -- -D clippy::all -A clippy::empty_line_after_doc_comments
