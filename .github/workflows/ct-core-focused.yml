name: CT compiler IR and optimizer focused gate
on:
  workflow_dispatch:
    inputs:
      compiler_ref:
        description: Exact compiler commit or branch to verify
        required: true
        type: string
        default: main
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/ct-core-focused.yml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/ct-core-focused.yml'
permissions:
  contents: read
  statuses: write
concurrency:
  group: ct-core-focused-${{ inputs.compiler_ref || github.ref }}
  cancel-in-progress: true
jobs:
  compiler-ir-opt:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: ${{ inputs.compiler_ref || (github.event_name == 'pull_request' && 'a2de28eaac45aa123c182a6ed5c310b649d932a8') || 'main' }}
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Confirm tested compiler revision
        shell: bash
        run: |
          git -C compiler rev-parse HEAD | tee -a "$GITHUB_STEP_SUMMARY"
          rustc --version | tee -a "$GITHUB_STEP_SUMMARY"
      - name: CT11 Python accounting regressions
        working-directory: compiler
        run: |
          if test -f tools/test_ct11_pass_accounting.py; then
            python3 -m unittest discover -s tools -p test_ct11_pass_accounting.py -v
          fi
      - name: Restrict workspace to independent verifier and optimizer
        shell: bash
        run: |
          cat > compiler/Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir", "crates/opt"]
          EOF
          rm -f compiler/Cargo.lock
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: focused-ct-ir-opt
      - name: Verify strict Clippy on IR and optimizer
        working-directory: compiler
        run: cargo clippy -p compiler-ir -p compiler-opt --lib --features compiler-opt/check-body-features -- -D warnings
      - name: Reproduce external-effect oracle independently on both revisions
        if: github.event_name == 'pull_request'
        working-directory: compiler
        run: |
          cargo test -p compiler-opt --features check-body-features --test typeid_fuzz_interactions external_effect_tests::generated_pointer_escape_through_internal_helper_preserves_c_effects_and_caller_frame -- --exact
      - name: Check baseline external-effect oracle with identical settings
        if: github.event_name == 'pull_request' && always()
        uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 0c9828f9d685fe72d05f46dc0cb71d4e92a12267
          path: baseline
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Baseline isolated comparison
        if: github.event_name == 'pull_request' && always()
        working-directory: baseline
        run: |
          cp ../compiler/Cargo.toml Cargo.toml
          rm -f Cargo.lock
          cargo test -p compiler-opt --features check-body-features --test typeid_fuzz_interactions external_effect_tests::generated_pointer_escape_through_internal_helper_preserves_c_effects_and_caller_frame -- --exact
      - name: Publish focused gate result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ job.status }}
        shell: bash
        run: |
          state=failure
          if [ "$RESULT" = success ]; then state=success; fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state="$state" -f context=ct/core-focused \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            -f description="Focused IR and optimizer validation: $RESULT"
