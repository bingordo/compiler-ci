name: CT TypeId pass-manager tier source-pinned validation
on:
  workflow_dispatch:
    inputs:
      compiler_ref:
        description: Exact compiler commit or branch to verify
        required: true
        type: string
        default: main
  push:
    branches: [validation/typeid-opt-level-policy-20261122]
    paths:
      - '.github/workflows/ct-core-focused.yml'
permissions:
  contents: read
concurrency:
  group: ct-core-focused-${{ inputs.compiler_ref || 'bootstrap' }}
  cancel-in-progress: true
jobs:
  compiler-ir-opt:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: ${{ inputs.compiler_ref || 'f2e2cabf5310ae6ea2f42ce9ba7f8d63f3bd41da' }}
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Confirm tested compiler revision
        shell: bash
        run: |
          git -C compiler rev-parse HEAD | tee -a "$GITHUB_STEP_SUMMARY"
          rustc --version | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Restrict workspace to independent verifier and optimizer
        shell: bash
        run: |
          cat > compiler/Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir", "crates/opt"]
          EOF
          rm -f compiler/Cargo.lock
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: focused-ct-ir-opt
      - name: Run source-pinned pass-manager integration and unit tests
        working-directory: compiler
        run: |
          cargo test -p compiler-opt --test typeid_core_pass_manager
          cargo test -p compiler-opt --lib typed_pass_manager
      - name: Check optimizer Clippy independently of stale unrelated integration tests
        working-directory: compiler
        run: cargo clippy -p compiler-opt --lib -- -D clippy::all
