name: CT compiler IR and optimizer focused gate
on:
  workflow_dispatch:
    inputs:
      compiler_ref:
        description: Exact compiler commit or branch to verify
        required: true
        type: string
        default: main
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/ct-core-focused.yml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/ct-core-focused.yml'
permissions:
  contents: read
  statuses: write
concurrency:
  group: ct-core-focused-${{ inputs.compiler_ref || github.ref }}
  cancel-in-progress: true
jobs:
  compiler-ir-opt:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: ${{ inputs.compiler_ref || (github.event_name == 'pull_request' && 'e6808618e6673523ba9ec8d48c97f2d85230b86b') || 'main' }}
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Confirm tested compiler revision
        shell: bash
        run: |
          git -C compiler rev-parse HEAD | tee -a "$GITHUB_STEP_SUMMARY"
          rustc --version | tee -a "$GITHUB_STEP_SUMMARY"
      - name: CT11 Python accounting regressions
        working-directory: compiler
        run: |
          if test -f tools/test_ct11_pass_accounting.py; then
            python3 -m unittest discover -s tools -p test_ct11_pass_accounting.py -v
          fi
      - name: Restrict workspace to independent verifier and optimizer
        shell: bash
        run: |
          cat > compiler/Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir", "crates/opt"]
          EOF
          rm -f compiler/Cargo.lock
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: focused-ct-ir-opt
      - name: Focused PRE and pass-manager regressions
        if: github.event_name == 'pull_request'
        working-directory: compiler
        run: |
          cargo test -p compiler-ir -p compiler-opt --lib
          cargo test -p compiler-ir --test body_feature_hooks
          cargo test -p compiler-opt --features check-body-features --test typed_dse --test typed_local_memory --test typed_algebra --test al05_affine_native_bridge --test typed_cse --test typed_global_memory --test typed_phi_cfg --test typed_phi_dead_linear --test typed_sccp --test typed_licm_native --test typed_induction_native --test typed_local --test typed_mem2reg --test typed_array_fold --test typed_ctfe --test typed_pre_native --test typeid_source_profile_parity --test pre_licm_semantic_matrix --test typeid_fuzz_pre_induction_targeted --test typeid_core_pass_manager --test typeid_fuzz_pass_registry
          cargo test -p compiler-opt --features check-body-features --test typed_ctfe ctfe_retry_changed_function_census -- --nocapture
          COMPILER_TEST_VALIDATION=full cargo test -p compiler-opt --test typeid_core_pass_manager -- --nocapture
      - name: Verify strict Clippy on IR and optimizer
        working-directory: compiler
        run: cargo clippy -p compiler-ir -p compiler-opt --lib --features compiler-opt/check-body-features -- -D warnings
      - name: Run all IR and optimizer unit/integration tests
        working-directory: compiler
        run: cargo test -p compiler-ir -p compiler-opt --features compiler-opt/check-body-features --no-fail-fast
      - name: Publish focused gate result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ job.status }}
        shell: bash
        run: |
          state=failure
          if [ "$RESULT" = success ]; then state=success; fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state="$state" -f context=ct/core-focused \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            -f description="Focused IR and optimizer validation: $RESULT"

  mask-regression-comparison:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: dd5d7ccb2535cab0f888ca5572edbf72359b4315
          path: baseline
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: e6808618e6673523ba9ec8d48c97f2d85230b86b
          path: candidate
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Reproduce generated mask algebra regression on both revisions
        shell: bash
        run: |
          set -euo pipefail
          # Both revisions must run the identical corrected regression assertion.
          # The original test file was byte-identical on baseline and candidate.
          cp candidate/crates/opt/tests/generated_native_masks.rs baseline/crates/opt/tests/generated_native_masks.rs
          failed=0
          for v in baseline candidate; do
            git -C "$v" rev-parse HEAD
            printf '[workspace]\nresolver = "2"\nmembers = ["crates/ir", "crates/opt"]\n' > "$v/Cargo.toml"
            rm -f "$v/Cargo.lock"
            if (cd "$v" && cargo test -p compiler-opt --test generated_native_masks mask_absorption_keeps_a_trapping_division_producer -- --exact --nocapture); then
              echo "MASK_REGRESSION $v passed"
            else
              echo "MASK_REGRESSION $v failed"
              failed=1
            fi
          done
          # Check the same updated profitability expectations on both pinned revisions.
          cp candidate/crates/opt/tests/generated_native_matchpd_boolean_factor_s2314.rs baseline/crates/opt/tests/generated_native_matchpd_boolean_factor_s2314.rs
          for v in baseline candidate; do
            if (cd "$v" && cargo test -p compiler-opt --test generated_native_matchpd_boolean_factor_s2314); then
              echo "S2314_REGRESSION $v passed"
            else
              echo "S2314_REGRESSION $v failed"
              failed=1
            fi
          done
          exit "$failed"
