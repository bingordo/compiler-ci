name: CT compiler IR and optimizer focused gate
on:
  workflow_dispatch:
    inputs:
      compiler_ref:
        description: Exact compiler commit or branch to verify
        required: true
        type: string
        default: main
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/ct-core-focused.yml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/ct-core-focused.yml'
permissions:
  contents: read
  statuses: write
concurrency:
  group: ct-core-focused-${{ inputs.compiler_ref || github.ref }}
  cancel-in-progress: true
jobs:
  compiler-ir-opt:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: ${{ inputs.compiler_ref || (github.event_name == 'pull_request' && '5d7ce9dac9fa0bf7aea3051470cb083e35a16035') || 'main' }}
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Confirm tested compiler revision
        shell: bash
        run: |
          git -C compiler rev-parse HEAD | tee -a "$GITHUB_STEP_SUMMARY"
          rustc --version | tee -a "$GITHUB_STEP_SUMMARY"
      - name: CT11 Python accounting regressions
        working-directory: compiler
        run: |
          if test -f tools/test_ct11_pass_accounting.py; then
            python3 -m unittest discover -s tools -p test_ct11_pass_accounting.py -v
          fi
      - name: Restrict workspace to independent verifier and optimizer
        shell: bash
        run: |
          cat > compiler/Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir", "crates/opt"]
          EOF
          rm -f compiler/Cargo.lock
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: focused-ct-ir-opt
      - name: Run all IR and optimizer unit/integration tests
        working-directory: compiler
        run: |
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            cargo test -p compiler-opt --no-fail-fast --test review_byte_phi_indirect_memory --test review_loop_byte_phi_callback --test review_mixed_global_escape_loop --test review_mixed_phi_critical_call --test review_nested_same_successor_phi --test review_phi_call_pressure --test review_target_abi_pipeline
          else
            cargo test -p compiler-ir -p compiler-opt
          fi
      - name: Verify strict Clippy on IR and optimizer
        working-directory: compiler
        run: |
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            cargo clippy -p compiler-opt --no-deps --test review_byte_phi_indirect_memory --test review_loop_byte_phi_callback --test review_mixed_global_escape_loop --test review_mixed_phi_critical_call --test review_nested_same_successor_phi --test review_phi_call_pressure --test review_target_abi_pipeline -- -D warnings
          else
            cargo clippy -p compiler-ir -p compiler-opt --all-targets -- -D warnings
          fi
      - name: Publish focused gate result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ job.status }}
        shell: bash
        run: |
          state=failure
          if [ "$RESULT" = success ]; then state=success; fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state="$state" -f context=ct/core-focused \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            -f description="Focused IR and optimizer validation: $RESULT"
