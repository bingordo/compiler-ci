name: CT compiler IR and optimizer focused gate
on:
  workflow_dispatch:
    inputs:
      compiler_ref:
        description: Exact compiler commit or branch to verify
        required: true
        type: string
        default: main
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/ct-core-focused.yml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/ct-core-focused.yml'
permissions:
  contents: read
  statuses: write
concurrency:
  group: ct-core-focused-${{ inputs.compiler_ref || github.ref }}
  cancel-in-progress: true
jobs:
  compiler-ir-opt:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: ${{ inputs.compiler_ref || (github.event_name == 'pull_request' && 'bef362ab4c19c077fb9da4e4418ff49b7d3cd27b') || 'main' }}
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Confirm tested compiler revision
        shell: bash
        run: |
          git -C compiler rev-parse HEAD | tee -a "$GITHUB_STEP_SUMMARY"
          rustc --version | tee -a "$GITHUB_STEP_SUMMARY"
      - name: CT11 Python accounting regressions
        working-directory: compiler
        run: |
          if test -f tools/test_ct11_pass_accounting.py; then
            python3 -m unittest discover -s tools -p test_ct11_pass_accounting.py -v
          fi
      - name: Restrict workspace to independent verifier and optimizer
        shell: bash
        run: |
          cat > compiler/Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir", "crates/opt"]
          EOF
          rm -f compiler/Cargo.lock
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: focused-ct-ir-opt
      - name: CT11 focused Rust regressions
        if: github.event_name == 'pull_request'
        working-directory: compiler
        run: |
          cargo test -p compiler-ir -p compiler-opt --lib
          cargo test -p compiler-opt --test typeid_source_profile_parity --test typed_ctfe --test typed_aggregate_pipeline --test semantic_debug --test generated_native_integer_algebra --test typeid_core_pass_manager --test typeid_fuzz_pass_registry
      - name: Run all IR and optimizer unit/integration tests
        if: github.event_name != 'pull_request'
        working-directory: compiler
        run: cargo test -p compiler-ir -p compiler-opt
      - name: Check optimizer Clippy diagnostics
        working-directory: compiler
        run: cargo clippy -p compiler-opt --lib -- -D warnings
      - name: Publish focused gate result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ job.status }}
        shell: bash
        run: |
          state=failure
          if [ "$RESULT" = success ]; then state=success; fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state="$state" -f context=ct/core-focused \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            -f description="Focused IR and optimizer validation: $RESULT"
  ct11-source:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: bef362ab4c19c077fb9da4e4418ff49b7d3cd27b
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Record compiler revision and configure dependency fetches
        run: |
          git -C compiler rev-parse HEAD | tee -a "$GITHUB_STEP_SUMMARY"
          git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: ct11-source-release
      - name: Build actual compiler driver
        working-directory: compiler
        run: cargo build --release -p compiler --bin compiler
      - name: Measure pass timings and check native output parity
        working-directory: compiler
        run: |
          set -euo pipefail
          mkdir -p results
          python3 tools/ct11_loop_source_profile.py --compiler target/release/compiler --rounds 3 --output results/ct11-loop.json | tee results/ct11-loop.log
          python3 - <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          import json
          data = json.load(open("results/ct11-loop.json"))
          for name, case in data["cases"].items():
              print(name, json.dumps(case["ranked_core_passes"][:5]))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ct11-source-profile
          path: compiler/results/
