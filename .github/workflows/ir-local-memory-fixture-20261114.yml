name: Local-memory fixture replacement parity
on:
  push:
    branches: [verify/ir-local-memory-fixture-20261114]
    paths: ['.github/workflows/ir-local-memory-fixture-20261114.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 17616dae999a9ab4b88d1d495715190fa6818845
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Check exact compiler source
        run: test "$(git -C compiler rev-parse HEAD)" = "17616dae999a9ab4b88d1d495715190fa6818845"
      - name: Restrict workspace to core crates
        run: |
          cat > compiler/Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir", "crates/opt", "crates/backend", "crates/backend-x86"]
          EOF
          rm -f compiler/Cargo.lock
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: ir-local-memory-native-v3
      - name: Validate local-memory migration and existing TypeId regressions
        working-directory: compiler
        run: |
          cargo test -p compiler-opt --test typed_local_memory
          cargo test -p compiler-opt --test typed_sccp --test typed_ctfe
          cargo test -p compiler-opt --test typed_local --test typed_cse --test typed_array_fold
          cargo test -p compiler-opt --test typed_phi_cfg --test typed_phi_dead_linear
          cargo test -p compiler-opt --test ir_fixture_directives --test native_ir_pass_replay
          cargo test -p compiler-ir --test native_fixture_text --test native_module_text_v3
          cargo clippy -p compiler-opt --test typed_local_memory -- -D warnings
