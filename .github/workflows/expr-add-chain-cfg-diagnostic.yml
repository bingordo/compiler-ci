name: S21 if-conversion select-budget candidate
on:
  push:
    branches: [main]
    paths: ['.github/workflows/expr-add-chain-cfg-diagnostic.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout merged production baseline
        uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 2ed3ee8400ee426aba635d79f5a8331abdbd2e0f
          path: old
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Checkout select-budget candidate
        uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 0b831f1de61f1bf200ff851123af84b97270419a
          path: new
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Instrument only benchmark harness and expose public frontend
        run: |
          python3 - <<'PY'
          from pathlib import Path
          for root in ('old', 'new'):
              manifest = Path(root)/'tools/mini-c-driver/Cargo.toml'
              s = manifest.read_text()
              private = 'ssh://git@github.com/bingordo/mini-c.git'
              assert s.count(private) == 2, (root, s.count(private))
              manifest.write_text(s.replace(private, 'https://github.com/bingordo/mini-c.git'))

              main = Path(root)/'tools/mini-c-driver/examples/benchmark_generated_fusion.rs'
              s = main.read_text()
              needle = '    std::fs::remove_dir_all(&tmp).map_err(|e|e.to_string())?;'
              assert s.count(needle) == 1, root
              diag = '''
              // Read-only diagnostic on two pinned S8 cases. All native checks ran first.
              if name == "s21aa_001" || name == "s21aa_041" {
                  for (variant,path) in [("default",&obj_baseline),("post_fusion",&obj_fused)] {
            let mut dis = Command::new("objdump");
            dis.arg("-dr").arg(path);
            println!("S21_DIAG_DISASM_BEGIN case={name} version={} variant={variant}", env!("CARGO_PKG_VERSION"));
            println!("{}", command(dis,"objdump -dr")?);
            println!("S21_DIAG_DISASM_END case={name} variant={variant}");
                  }
              }
          '''
              main.write_text(s.replace(needle, diag+needle))

              sampled = Path(root)/'tools/mini-c-driver/examples/benchmark_generated_fusion/sampled.rs'
              s = sampled.read_text()
              needle = '        let (old_size,new_size,calls)=native_check('
              assert s.count(needle) == 1, root
              diag = '''
                  if index == 1 || index == 41 {
            println!("S21_DIAG_SOURCE case={index} source={source}");
            println!("S21_DIAG_DEFAULT_SSA case={index} {:#?}",base[0]);
            println!("S21_DIAG_POST_FUSION_SSA case={index} {:#?}",experimental[0]);
                  }
          '''
              sampled.write_text(s.replace(needle, diag+needle))
          PY
      - name: Cache checked Mini-C crates
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: new/tools/mini-c-driver -> target
          key: s21-cfg-diag
      - name: Test and lint affected optimizer crate
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          Path('new/Cargo.toml').write_text(chr(10).join(['[workspace]', 'resolver = "2"', 'members = ["crates/ir", "crates/opt", "crates/backend", "crates/backend-x86"]', '']))
          PY
          cargo test --manifest-path new/Cargo.toml -p compiler-opt --offline
          cargo clippy --manifest-path new/Cargo.toml -p compiler-opt --all-targets --offline -- -D warnings
      - name: Build both diagnostic binaries
        run: |
          set -euo pipefail
          cargo build --release --manifest-path old/tools/mini-c-driver/Cargo.toml --features experimental-fusion-benchmark --example benchmark_generated_fusion
          cargo build --release --manifest-path new/tools/mini-c-driver/Cargo.toml --features experimental-fusion-benchmark --example benchmark_generated_fusion
      - name: Native differential, SSA and x86 disassembly for pinned cases
        run: |
          set -euo pipefail
          RULE_S8_CASES=48 RULE_S8_SEED=1592590374 \
            timeout --signal=TERM --kill-after=10s 10m old/tools/mini-c-driver/target/release/examples/benchmark_generated_fusion \
            --sampled --add-chain-eval | tee /tmp/s21-before.log
          RULE_S8_CASES=48 RULE_S8_SEED=1592590374 \
            timeout --signal=TERM --kill-after=10s 10m new/tools/mini-c-driver/target/release/examples/benchmark_generated_fusion \
            --sampled --add-chain-eval | tee /tmp/s21-after.log
      - name: Native GCC differential for 12 unchanged pinned musl bodies on both compilers
        run: |
          set -euo pipefail
          RULE_S9_REPEATS=3 old/tools/mini-c-driver/target/release/examples/benchmark_generated_fusion --real-world | tee /tmp/s21-musl-before.log
          RULE_S9_REPEATS=3 new/tools/mini-c-driver/target/release/examples/benchmark_generated_fusion --real-world | tee /tmp/s21-musl-after.log
          python3 - <<'PY'
          from pathlib import Path
          def read(label):
              lines=Path('/tmp/s21-musl-'+label+'.log').read_text().splitlines()
              rows=[s.split(',') for s in lines if s.startswith('S9_ROW,')]
              assert len(rows)==12,(label,len(rows))
              m={}
              for row in rows:
                  assert len(row)==17,row
                  _,name,mode,sourcehash,compiledhash,blocks,ssa_hand,ssa_fused,arith_hand,arith_fused,applied,text_hand,text_fused,*timing=row
                  assert name not in m and mode=='unchanged' and sourcehash==compiledhash
                  m[name]=(sourcehash,int(text_hand),int(text_fused))
              summaries=[s for s in lines if s.startswith('S9_SUMMARY ')]
              assert len(summaries)==1
              info=dict(t.split('=',1) for t in summaries[0].split()[1:])
              assert all(int(info[k])==v for k,v in {'candidates':12,'supported':12,'unchanged_source':12,'unsupported':0,'native_calls':288}.items())
              assert sum(row[1] for row in m.values())==int(info['text_hand_bytes'])
              return m
          old,new=read('before'),read('after')
          assert old.keys()==new.keys()
          for name,(sourcehash,base,_) in old.items():
              assert new[name][0]==sourcehash
              assert new[name][1]<=base,(name,base,new[name][1])
          print('S21_MUSL_VERIFIED',len(new),'before_bytes',sum(v[1] for v in old.values()),
              'after_bytes',sum(v[1] for v in new.values()),
              'native_calls',576)
          PY
      - name: Reconcile exact source and native size regressions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          def read(name):
              data=Path(f'/tmp/s21-{name}.log').read_text()
              lines=data.splitlines()
              rows=[r.split(',') for r in lines if r.startswith('S21AA_ROW,')]
              assert len(rows)==48,(name,len(rows))
              for idx in ('1','41'):
                  assert f'S21_DIAG_SOURCE case={idx} ' in data
                  assert f'S21_DIAG_DEFAULT_SSA case={idx} ' in data
                  assert f'S21_DIAG_POST_FUSION_SSA case={idx} ' in data
                  assert f'S21_DIAG_DISASM_BEGIN case=s21aa_{int(idx):03}' in data
              out={}
              for r in rows:
                  assert len(r)==11 and int(r[-1])==24,r
                  _,idx,shape,h,cand,elig,shared,applied,normal,extra,calls=r
                  out[int(idx)]=(h,shape,int(normal),int(extra),int(applied))
              assert sum(int(r[-1]) for r in rows)==1152
              return out
          old,new=read('before'),read('after')
          assert old.keys()==new.keys()==set(range(48))
          for idx in range(48):
              assert old[idx][:2]==new[idx][:2],idx
          for idx,old_size in ((1,63),(41,69)):
              assert old[idx][2]==old_size,(idx,old[idx])
              assert new[idx][2]<old_size,(idx,new[idx])
              print('S21_DIAG_VERIFIED',idx,'old_default',old[idx][2],
                  'old_post_fusion',old[idx][3],'new_default',new[idx][2],
                  'new_post_fusion',new[idx][3],'source_sha_tag',old[idx][0])
          old_total=sum(row[2] for row in old.values())
          new_total=sum(row[2] for row in new.values())
          gains=[idx for idx in old if new[idx][2]<old[idx][2]]
          regressions=[idx for idx in old if new[idx][2]>old[idx][2]]
          print('S21_BUDGET_SUMMARY old_total',old_total,'new_total',new_total,
                'improved_cases',gains,'regressed_cases',regressions)
          assert not regressions,regressions
          assert new_total < old_total,(old_total,new_total)
          print('S21_DIAG_NATIVE_VERIFIED cases=48 per_version_calls=1152')
          PY
      - name: Preserve source, SSA, disassembly and native differential evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: s21-add-chain-cfg-regression-evidence
          if-no-files-found: warn
          path: /tmp/s21-*.log
