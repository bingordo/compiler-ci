name: BT4 M48 aggregate retirement combined TypeId ELF GAS C
on:
  pull_request:
    paths:
      - '.github/workflows/verify-bt4-x86-m48-aggregate-native-combined-20261115.yml'
permissions:
  contents: read
jobs:
  source-pinned-x86-m48-combined-tls-visibility-x7:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 02c8138c942fc28c25c848b533c7ccb2f1154985
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: bt4-x86-m48-aggregate-native-combined
      - name: Exact source pin, BT4 source boundary, and whole-repo retired M4.8 references
        working-directory: compiler
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "02c8138c942fc28c25c848b533c7ccb2f1154985"
          python3 tools/check_bt4_backend_boundary.py
          if git grep -nE '(X86M48ModuleOptions|validate_m48_module|emit_object_with_m48_annotations|emit_assembly_with_m48_annotations|assembly_with_data_mode)' -- '*.rs'; then
            echo 'BT4_FAIL: removed Function-only M4.8 aggregate still referenced in repository'
            exit 1
          fi
          echo BT4_M48_OLD_AGGREGATE_ZERO_RUST_REFERENCES
      - name: Isolate core native TypeId backend workspace; skip optional frontend git dependencies
        shell: bash
        run: |
          set -euo pipefail
          cat > compiler/Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir", "crates/opt", "crates/backend", "crates/backend-x86"]
          EOF
          rm -f compiler/Cargo.lock
      - name: Full x86 compile and native/historical TLS visibility ELF GAS C and X7 oracles
        working-directory: compiler
        shell: bash
        run: |
          set -euo pipefail
          cargo check -p compiler-backend-x86 --all-targets
          cargo check -p compiler-backend-x86 --lib --no-default-features
          cargo test -p compiler-backend-x86 --lib
          cargo test -p compiler-backend-x86 --no-default-features --lib
          cargo test -p compiler-backend-x86 --test m4_8_checked_symbol_attributes_native -- --nocapture
          cargo test -p compiler-backend-x86 --test m4_8_ssa_tls_native -- --nocapture
          cargo test -p compiler-backend-x86 --test m4_7_gp_variadic_native -- --nocapture
          cargo test -p compiler-backend-x86 --test m4_global_definitions_native -- --nocapture
          cargo test -p compiler-backend-x86 --test m4_relro_linkage_native -- --nocapture
          cargo test -p compiler-backend-x86 --test typeid_real_physical_observer -- --nocapture
          cargo test -p compiler-backend-x86 --features x7-native-form-validation --test x7_g10_n11_cfg_spill_probe -- --nocapture
          cargo test -p compiler-backend-x86 --features x7-native-form-validation --test x7_g10_n16_bitwise_native -- --nocapture
          cargo test -p compiler-backend-x86 --test bt4_x86_physical_budget_native -- --nocapture
          echo BT4_M48_NATIVE_COMBINED_ELF_GAS_TLS_PTHREAD_X7_ALL_PASS
