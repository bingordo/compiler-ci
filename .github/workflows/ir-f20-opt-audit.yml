name: IR F20 Function optimizer callers, source-pinned
on:
  pull_request:
    paths: ['.github/workflows/ir-f20-opt-audit.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 2bdfc42b95e77a32d7b8001e4ca8d1e4415b5756
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
          path: compiler
      - name: Report real Function optimizer API callers and native dependencies
        run: |
          test "$(git -C compiler rev-parse HEAD)" = "2bdfc42b95e77a32d7b8001e4ca8d1e4415b5756"
          python3 - <<'PY'
          import pathlib,re,collections
          root=pathlib.Path("compiler")
          patterns={
          'legacy_runner':r'(?<!fn )\b(?:crate::|compiler_opt::|super::super::)?optimize_module(?:_with_inline_mode|_with_target_inline_policy|_without_inlining|_profiled|_with_if_conversion_policy)?\s*\(',
          'legacy_single':r'(?<!fn )\b(?:crate::|compiler_opt::)?optimize(?:_profiled|_with_if_conversion_policy)?\s*\(',
          'legacy_named_modules':r'\b(?:compiler_opt::|crate::)(?:algebra|array_fold|cfg|cse|dead_functions|dse|global_memory|if_conversion|induction|inline|licm|local_memory|mem2reg|phi|pre|sccp|profile)::',
          'native_import_old':r'(?<![a-z])(?:super|crate)::(?:algebra|array_fold|cfg|cse|dse|global_memory|if_conversion|induction|inline|licm|local_memory|mem2reg|phi|pre|sccp)::'
          }
          for key,regex in patterns.items():
            hits=[]
            for f in sorted(root.rglob('*.rs')):
              p=f.relative_to(root).as_posix()
              for line,s in enumerate(f.read_text(errors='replace').splitlines(),1):
                if re.search(regex,s):
                  hits.append((p,line,s.strip()[:140]))
            print(f'=== {key} matches={len(hits)} files={len(set(x[0] for x in hits))} ===')
            for p,l,s in hits:
              print(f'{p}:{l}: {s}')
          PY
