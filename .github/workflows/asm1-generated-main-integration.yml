name: ASM1 generated current-main integration
on:
  push:
    branches: [ci/asm1-generated-objdump-20261115]
    paths: ['.github/workflows/asm1-generated-main-integration.yml']
  pull_request:
    branches: [main]
    paths: ['.github/workflows/asm1-generated-main-integration.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  main-integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 588742421677f998268bba2ea276fe3b29d05c72
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 38893b7bc6d483ab9a1557138cdba394488efb3c
          path: feature
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
          fetch-depth: 0
      - name: Simulate exact feature merge into pinned current main
        run: |
          set -euo pipefail
          test "$(git -C compiler rev-parse HEAD)" = "588742421677f998268bba2ea276fe3b29d05c72"
          test "$(git -C feature rev-parse HEAD)" = "38893b7bc6d483ab9a1557138cdba394488efb3c"
          cd compiler
          git config user.email compiler-ci@example.invalid
          git config user.name compiler-ci
          git fetch ../feature HEAD
          test "$(git rev-parse FETCH_HEAD)" = "38893b7bc6d483ab9a1557138cdba394488efb3c"
          git merge --no-commit --no-ff FETCH_HEAD
          # A shallow/incorrect merge must not falsely claim a green main
          # integration by running only main's baseline test suite.
          test "$(git rev-parse MERGE_HEAD)" = "38893b7bc6d483ab9a1557138cdba394488efb3c"
          grep -q 'generated_gp_forms_match_gas_bytes_and_objdump_for_register_and_address_variants' crates/backend-x86/tests/unit/att_generated.rs
          git diff --check
          git diff --cached --check
          echo "ASM1_MERGE main=588742421677f998268bba2ea276fe3b29d05c72 feature=38893b7bc6d483ab9a1557138cdba394488efb3c" >> "$GITHUB_STEP_SUMMARY"
      - name: Restrict compiler workspace
        working-directory: compiler
        run: |
          cat > Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir", "crates/opt", "crates/backend", "crates/backend-x86"]
          EOF
          rm -f Cargo.lock
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler
          key: asm1-generated-main-integration
      - name: Run generated differential acceptance on merged main
        working-directory: compiler
        run: |
          set -euo pipefail
          python3 tools/regen_x86_att_forms.py --check
          python3 -m unittest discover -s tools -p test_regen_x86_att_forms.py -v
          cargo check -p compiler-backend-x86 --all-targets
          cargo test -p compiler-backend-x86 --lib generated_form_tests -- --list | tee /tmp/asm1-generated-main-tests.txt
          grep -qF 'generated_gp_forms_match_gas_bytes_and_objdump_for_register_and_address_variants: test' /tmp/asm1-generated-main-tests.txt
          grep -qF 'generated_gp_forms_reject_simd_registers_in_gp_slots: test' /tmp/asm1-generated-main-tests.txt
          cargo test -p compiler-backend-x86 --lib generated_form_tests -- --nocapture
          cargo test -p compiler-backend-x86 --test att_asm
          cargo test -p compiler-backend-x86 --test att_module
          cargo clippy -p compiler-backend-x86 --lib -- -D warnings -A unused_variables -A clippy::suspicious_assignment_formatting
          echo "ASM1_MAIN_INTEGRATION status=PASS" >> "$GITHUB_STEP_SUMMARY"
