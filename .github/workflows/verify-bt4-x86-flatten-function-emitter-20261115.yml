name: BT4 flatten historical Function emitter wrappers
on:
  pull_request:
    paths:
      - '.github/workflows/verify-bt4-x86-flatten-function-emitter-20261115.yml'
permissions:
  contents: read
jobs:
  x86-exact-legacy-oracles-unchanged:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 1bf2e70103de9a72122d9a5b74a00094708159c1
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: bt4-x86-flatten-old-function-emitter
      - name: Exact pin and full-repository retired helper absence/source preservation
        working-directory: compiler
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "1bf2e70103de9a72122d9a5b74a00094708159c1"
          python3 tools/check_bt4_backend_boundary.py
          if git grep -nE '(emit_object_with_data_mode|emit_object_with_data_pic_mode|emit_object_with_initializers_mode|assembly_with_data_pic_mode|assembly_with_initializers_mode)[[:space:]]*\(' -- '*.rs'; then
            echo 'BT4_FAIL: old Function emitter forwarding layer resurrected or has external users'
            exit 1
          fi
          echo BT4_HISTORICAL_FORWARDING_ZERO_RUST_REFERENCES
      - name: Use isolated native TypeId x86 backend workspace
        shell: bash
        run: |
          set -euo pipefail
          cat > compiler/Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir", "crates/opt", "crates/backend", "crates/backend-x86"]
          EOF
          rm -f compiler/Cargo.lock
      - name: x86 native and independent historical ELF GAS C oracles
        working-directory: compiler
        shell: bash
        run: |
          set -euo pipefail
          cargo check -p compiler-backend-x86 --all-targets
          cargo check -p compiler-backend-x86 --lib --no-default-features
          cargo test -p compiler-backend-x86 --lib
          cargo test -p compiler-backend-x86 --no-default-features --lib
          cargo test -p compiler-backend-x86 --test m4_global_definitions_native -- --nocapture
          cargo test -p compiler-backend-x86 --test m4_relro_linkage_native -- --nocapture
          cargo test -p compiler-backend-x86 --test m4_7_gp_variadic_native -- --nocapture
          cargo test -p compiler-backend-x86 --test m4_8_ssa_tls_native -- --nocapture
          cargo test -p compiler-backend-x86 --test m4_8_checked_symbol_attributes_native -- --nocapture
          cargo test -p compiler-backend-x86 --features x7-native-form-validation --test x7_g10_n11_cfg_spill_probe -- --nocapture
          cargo test -p compiler-backend-x86 --features x7-native-form-validation --test x7_g10_n16_bitwise_native -- --nocapture
          cargo test -p compiler-backend-x86 --test bt4_x86_physical_budget_native -- --nocapture
          echo BT4_FLATTENED_EMITTER_NATIVE_AND_X7_ORACLES_PASS
