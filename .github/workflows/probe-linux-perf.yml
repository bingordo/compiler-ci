name: Probe Linux perf permissions on GitHub runner
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/probe-linux-perf.yml'
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Inspect host perf capabilities and software sampling
        shell: bash
        run: |
          set -u
          uname -a
          id
          command -v perf || true
          cat /proc/sys/kernel/perf_event_paranoid || true
          cat /proc/sys/kernel/kptr_restrict || true
          perf --version || true
          perf stat -e task-clock -- /bin/true 2>&1 || true
          perf record -e cpu-clock -F 49 --call-graph fp -o /tmp/probe.data -- /bin/sleep 0.3 2>&1 || true
          echo "Attempting less restrictive perf_event_paranoid via sudo:"
          sudo sysctl -w kernel.perf_event_paranoid=1 2>&1 || true
          perf stat -e task-clock -- /bin/true 2>&1 || true
          perf record -e cpu-clock -F 49 --call-graph fp -o /tmp/probe2.data -- /bin/sleep 0.3 2>&1 || true
          ls -l /tmp/probe*.data 2>/dev/null || true
