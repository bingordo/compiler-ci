name: IR verifier and CT03 alias fixed fixture gate
on:
  push:
    branches: [ci/ir-verifier-ct03-alias-20261114]
    paths: ['.github/workflows/ir-verifier-ct03-fixture-gate.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 2391de111d2c340741ad4399115622f1c6504bd3
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Verify exact source and isolate compiler core
        run: |
          set -euo pipefail
          test "$(git -C compiler rev-parse HEAD)" = "2391de111d2c340741ad4399115622f1c6504bd3"
          echo "Compiler SHA: 2391de111d2c340741ad4399115622f1c6504bd3" >> "$GITHUB_STEP_SUMMARY"
          cat > compiler/Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir", "crates/opt", "crates/backend", "crates/backend-x86"]
          EOF
          rm -f compiler/Cargo.lock
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: ir-verifier-ct03-fixed
      - name: Export original native verifier two-function source
        working-directory: compiler
        run: cargo test -p compiler-opt --test typed_core_native_verifier export_original_typeid_native_verifier_fixed_graphs -- --nocapture
      - name: Export original CT03 alias epoch four-case corpus
        working-directory: compiler
        run: cargo test -p compiler-opt --test ct03_typed_alias_epoch_native export_original_ct03_alias_epoch_fixed_graphs -- --nocapture
