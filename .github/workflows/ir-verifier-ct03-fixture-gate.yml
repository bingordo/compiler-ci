name: IR verifier and CT03 alias fixed fixture gate
on:
  push:
    branches: [ci/ir-verifier-ct03-alias-20261114]
    paths: ['.github/workflows/ir-verifier-ct03-fixture-gate.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 8f7512256456b36d8e5f7a1ce5864cdfca5ec275
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Verify exact source and isolate compiler core
        run: |
          set -euo pipefail
          test "$(git -C compiler rev-parse HEAD)" = "8f7512256456b36d8e5f7a1ce5864cdfca5ec275"
          echo "Compiler SHA: 8f7512256456b36d8e5f7a1ce5864cdfca5ec275" >> "$GITHUB_STEP_SUMMARY"
          cat > compiler/Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir", "crates/opt", "crates/backend", "crates/backend-x86"]
          EOF
          rm -f compiler/Cargo.lock
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: ir-verifier-ct03-fixed
      - name: Original verified TypeId native and CT03 independent C11 suites
        working-directory: compiler
        run: |
          set -euo pipefail
          cargo test -p compiler-opt --test typed_core_native_verifier --test ct03_typed_alias_epoch_native -- --nocapture
      - name: Verify production native gate never invokes legacy SSA verifier
        working-directory: compiler
        run: cargo test -p compiler-opt --features verify-counts --test typed_core_native_verifier -- --nocapture
      - name: Adjacent memory/CFG inliner and prior migration regressions
        working-directory: compiler
        run: |
          set -euo pipefail
          cargo test -p compiler-opt --test typed_global_memory --test typed_local_memory --test typed_dse --test typed_mem2reg --test typed_core_pipeline --test typed_inline_cfg_native --test typed_pre_native
      - name: Production compiler core libraries typecheck
        working-directory: compiler
        run: cargo check --workspace --lib
      - name: Scoped strict Clippy production and migrated tests
        working-directory: compiler
        run: |
          set -euo pipefail
          cargo clippy -p compiler-ir -p compiler-opt -p compiler-backend -p compiler-backend-x86 --lib -- -D warnings
          cargo clippy -p compiler-opt --test typed_core_native_verifier --test ct03_typed_alias_epoch_native -- -D warnings
      - name: Record successful source-pinned acceptance
        run: |
          echo 'Fixed TypeId verifier and CT03 alias-epoch graph migration, independent C11 and legacy controls, adjacent regressions, verify-counts, production check and scoped Clippy PASS' >> "$GITHUB_STEP_SUMMARY"
