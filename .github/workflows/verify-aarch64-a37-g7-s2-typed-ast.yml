name: AArch64 A3.7 G7 S2 original ASLRef typed AST effect frontier
on:
  pull_request:
    paths:
      - '.github/workflows/verify-aarch64-a37-g7-s2-typed-ast.yml'
permissions:
  contents: read
jobs:
  source-guard-join:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 88d7f4865402debe122f61b28f92ea5f8b39e0f7
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Check A3.7 guard and generic matcher negative tests
        run: |
          set -euo pipefail
          test "$(git -C compiler rev-parse HEAD)" = 88d7f4865402debe122f61b28f92ea5f8b39e0f7
          python3 -m unittest discover -s compiler/tools -p 'test_aarch64_a36_source_guards.py' -v
          python3 -m unittest discover -s compiler/tools -p 'test_aarch64_a35_candidate_bridge.py' -v
          python3 -m unittest discover -s compiler/tools -p 'test_aarch64_mrs_catalog.py' -v
          python3 -m unittest discover -s compiler/tools -p 'test_x86_generic_form_matcher.py' -v
          python3 compiler/tools/regen_aarch64_scalar_gp_forms.py --check
          python3 compiler/tools/regen_aarch64_native_selector_rules.py --check
          python3 -m unittest discover -s compiler/tools -p 'test_aarch64_a37_guard_census.py' -v
          python3 -m unittest discover -s compiler/tools -p 'test_aarch64_a37_boolean_guards.py' -v
          python3 -m unittest discover -s compiler/tools -p 'test_aarch64_a37_source_bitfields.py' -v
          python3 -m unittest discover -s compiler/tools -p 'test_aarch64_a37_universal_masks.py' -v
          python3 -m unittest discover -s compiler/tools -p 'test_aarch64_a32_asl_source_links.py' -v
          python3 -m unittest discover -s compiler/tools -p 'test_aarch64_a32_full_source_catalog.py' -v
          python3 -m unittest discover -s compiler/tools -p 'test_aarch64_a37_asl_source_frontier.py' -v
          python3 -m unittest discover -s compiler/tools -p 'test_aarch64_a37_executed_asl_handoff.py' -v
          python3 -m unittest discover -s compiler/tools -p 'test_aarch64_a37_original_effect_aliases.py' -v
          python3 -m unittest discover -s compiler/tools -p 'test_aarch64_a37_typed_effect_frontier.py' -v
      - name: Evaluate 2026-09 pinned AARCHMRS conditions and source joins
        run: |
          set -euo pipefail
          curl -fLsS --retry 3 --connect-timeout 20 --max-time 240 \
            'https://kernel.googlesource.com/pub/scm/linux/kernel/git/maz/AARCHMRS/+/1346b16d47619400448f3cb6d4f22d62d3b76848/Instructions.json?format=TEXT' \
            -o /tmp/aarchmrs-instructions.b64
          base64 -d /tmp/aarchmrs-instructions.b64 > /tmp/aarchmrs-instructions.json
          echo 'ef75f3ec02df1b9b9c0612f4ea259d6710ac3de686b097d8f9c83d1d97aa800a  /tmp/aarchmrs-instructions.json' | sha256sum -c -
          wc -c /tmp/aarchmrs-instructions.json
          python3 compiler/tools/aarch64_mrs_catalog.py \
            --instructions /tmp/aarchmrs-instructions.json \
            --expect-sha256 ef75f3ec02df1b9b9c0612f4ea259d6710ac3de686b097d8f9c83d1d97aa800a \
            --out /tmp/aarchmrs-a64.json
          python3 compiler/tools/aarch64_a35_candidate_bridge.py \
            --aarchmrs-catalog /tmp/aarchmrs-a64.json \
            --original-aarchmrs /tmp/aarchmrs-instructions.json \
            --reviewed-forms compiler/data/aarch64_scalar_gp_forms.json \
            --out /tmp/aarch64-a36-report.json
          python3 - <<'PY'
          import json
          j=json.load(open('/tmp/aarch64-a36-report.json'))
          assert j['reviewed_form_count']==12
          assert j['source_guard_source_authenticated']
          assert j['source_guard_literal_true_form_count']==12
          assert j['source_mask_matched_form_count']==12
          assert j['source_joined_form_count']==12, [
              (x['reviewed_operation'], x['width_bits'],x['blocker_counts']) for x in j['forms']]
          counts=j['source_guard_full_catalog_statuses']
          assert sum(counts.values())==4429
          assert all(x['candidate_count']>=1 for x in j['forms'])
          assert all(not x['selection_eligible'] and not x['machine_effect_equivalence_proven'] and not x['asl_semantic_equivalence_proven'] for x in j['forms'])
          assert not j['selection_eligible'] and not j['source_join_is_proof']
          print('A36_REAL_SOURCE_GUARDS',counts,
                'source-compatible',j['source_joined_form_count'],
                'semantic_proofs',0,'new_rules',0)
          PY

          python3 compiler/tools/aarch64_a37_guard_census.py \
            --original-aarchmrs /tmp/aarchmrs-instructions.json \
            --aarchmrs-catalog /tmp/aarchmrs-a64.json \
            --out /tmp/aarch64-a37-guard-census.json
          python3 compiler/tools/aarch64_a37_guard_census.py \
            --original-aarchmrs /tmp/aarchmrs-instructions.json \
            --aarchmrs-catalog /tmp/aarchmrs-a64.json \
            --out /tmp/aarch64-a37-guard-census.json --check
          python3 - <<'PY'
          import json
          p=json.load(open('/tmp/aarch64-a37-guard-census.json'))
          assert p['format']=='aarch64-a37-original-condition-census-v1'
          assert p['instruction_path_count']==4429
          assert sum(p['path_guard_statuses'].values())==4429
          assert p['path_guard_statuses']['true']>=293
          assert p['path_guard_statuses']['unknown']<=4136
          assert p['operators_per_inherited_path'].get('||',0)>0
          assert p['operators_per_inherited_path'].get('&&',0)>0
          assert p['distinct_condition_ast_hashes']>0
          assert p['inherited_condition_edges']>=4429
          assert not any(p[k] for k in [
              'selection_eligible','unknown_conditions_evaluated',
              'asl_semantic_equivalence_proven','source_operand_legality_proven'])
          print('A37_REAL_SOURCE_CONDITION_CENSUS',
                'roots',p['root_kinds_per_inherited_path'],
                'unresolved',p['unresolved_root_kinds_per_inherited_path'],
                'operators',p['operators_per_inherited_path'])
          PY

          python3 compiler/tools/aarch64_a37_source_bitfields.py \
            --original-aarchmrs /tmp/aarchmrs-instructions.json \
            --aarchmrs-catalog /tmp/aarchmrs-a64.json \
            --out /tmp/aarch64-a37-g3-witnesses.json
          python3 compiler/tools/aarch64_a37_source_bitfields.py \
            --original-aarchmrs /tmp/aarchmrs-instructions.json \
            --aarchmrs-catalog /tmp/aarchmrs-a64.json \
            --out /tmp/aarch64-a37-g3-witnesses.json --check
          python3 - <<'PY'
          import json
          p=json.load(open('/tmp/aarch64-a37-g3-witnesses.json'))
          assert p['format']=='aarch64-a37-g3-bitfield-word-witness-v1'
          assert p['source_paths']==4429 and len(p['rows'])==4429
          assert p['source_recomputed_exactly'] and p['word_specific_only']
          assert p['original_path_statuses']=={'true':293, 'unknown':4136, 'false':0}
          assert sum(p['sampled_word_guard_statuses'].values())==4429
          assert not p['selection_eligible'] and not p['asl_semantic_equivalence_proven']
          assert not p['source_operand_legality_proven']
          assert all(not x['selection_eligible'] and x['word_specific_only'] and
                     not x['semantic_equivalence_proven'] for x in p['rows'])
          assert all('_original_condition_asts' not in x for x in p['rows'])
          print('A37_G3_FULL_SOURCE_WORD_DIAGNOSTIC',
                p['sampled_word_guard_statuses'],
                p['blocked_counts'], 'selector_admitted=0')
          PY

          python3 compiler/tools/aarch64_a37_universal_masks.py \
            --original-aarchmrs /tmp/aarchmrs-instructions.json \
            --aarchmrs-catalog /tmp/aarchmrs-a64.json \
            --out /tmp/aarch64-a37-g4-universal-mask.json
          python3 compiler/tools/aarch64_a37_universal_masks.py \
            --original-aarchmrs /tmp/aarchmrs-instructions.json \
            --aarchmrs-catalog /tmp/aarchmrs-a64.json \
            --out /tmp/aarch64-a37-g4-universal-mask.json --check
          python3 - <<'PY'
          import json
          a=json.load(open('/tmp/aarch64-a37-g4-universal-mask.json'))
          assert a['format']=='aarch64-a37-g4-universal-mask-predicates-v1'
          assert a['source_path_count']==4429 and len(a['rows'])==4429
          assert a['original_catalog_recomputed_exactly']
          assert a['original_unbound_path_statuses']=={
              'true':293, 'false':0, 'unknown':4136}
          assert sum(a['universal_mask_predicate_statuses'].values())==4429
          assert not a['selection_eligible']
          assert not a['source_legality_proven']
          assert not a['asl_semantic_equivalence_proven']
          assert not a['machine_effect_equivalence_proven']
          assert all(not row['selection_eligible'] and
                     not row['source_legality_proven'] and
                     not row['asl_semantic_equivalence_proven'] and
                     not row['machine_effect_equivalence_proven'] and
                     row['source_mask_only_quantifier']
                     for row in a['rows'])
          samples=json.load(open('/tmp/aarch64-a37-g3-witnesses.json'))
          prior={(x['path'],x['operation_id']):x['word_condition_status']
                 for x in samples['rows']}
          for row in a['rows']:
              candidate=prior[(row['path'],row['operation_id'])]
              universal=row['universal_mask_predicate_status']
              assert not (universal=='true' and candidate=='false'), row
              assert not (universal=='false' and candidate=='true'), row
          print('A37_G4_UNIVERSAL_GUARD_RESULTS',
                a['universal_mask_predicate_statuses'],
                'blocked',a['blocked_counts'],'selector_admitted=0')
          PY

      - name: Verify original official Arm 2026-09 XML ASL sources and crosswalk
        run: |
          set -euo pipefail
          curl -fLsS --retry 3 --connect-timeout 25 --max-time 300 \
            'https://developer.arm.com/-/cdn-downloads/permalink/Exploration-Tools-A64-ISA/ISA_A64/ISA_A64_xml_A_profile-2026-09.tar.gz' \
            -o /tmp/ISA_A64_xml_A_profile-2026-09.tar.gz
          echo '44cfb89c763c7eea8e59de0ad2221e3c012e6aa77899bd7f1c3e1f24537191d7  /tmp/ISA_A64_xml_A_profile-2026-09.tar.gz' | sha256sum -c -
          python3 compiler/tools/aarch64_a32_full_source_catalog.py \
            --isa-xml-archive /tmp/ISA_A64_xml_A_profile-2026-09.tar.gz \
            --out /tmp/aarch64-g5-xml-only-catalog.json
          python3 compiler/tools/aarch64_a32_full_source_catalog.py \
            --isa-xml-archive /tmp/ISA_A64_xml_A_profile-2026-09.tar.gz \
            --out /tmp/aarch64-g5-xml-only-catalog.json --check
          python3 compiler/tools/aarch64_a37_asl_source_frontier.py \
            --original-aarchmrs /tmp/aarchmrs-instructions.json \
            --aarchmrs-catalog /tmp/aarchmrs-a64.json \
            --isa-xml-archive /tmp/ISA_A64_xml_A_profile-2026-09.tar.gz \
            --out /tmp/aarch64-g5-source-frontier.json
          python3 compiler/tools/aarch64_a37_asl_source_frontier.py \
            --original-aarchmrs /tmp/aarchmrs-instructions.json \
            --aarchmrs-catalog /tmp/aarchmrs-a64.json \
            --isa-xml-archive /tmp/ISA_A64_xml_A_profile-2026-09.tar.gz \
            --out /tmp/aarch64-g5-source-frontier.json --check
          python3 - <<'PY'
          import json
          j=json.load(open('/tmp/aarch64-g5-source-frontier.json'))
          assert j['format']=='aarch64-a37-g5-cross-source-semantic-frontier-v1'
          assert j['encoding_paths']==4429 and len(j['rows'])==4429
          assert j['source_catalogs_independently_rebuilt']
          assert j['isa_xml_release']=='2026-09'
          assert j['isa_xml_archive_sha256']=='44cfb89c763c7eea8e59de0ad2221e3c012e6aa77899bd7f1c3e1f24537191d7'
          assert j['aarchmrs_instructions_sha256']=='ef75f3ec02df1b9b9c0612f4ea259d6710ac3de686b097d8f9c83d1d97aa800a'
          by_source=j['cross_source_path_statuses']
          assert sum(sum(x.values()) for x in by_source.values())==4429
          assert not j['selection_eligible'] and not j['asl_semantic_equivalence_proven']
          assert not j['source_legality_proven'] and not j['machine_effect_equivalence_proven']
          assert all(not r['selection_eligible'] and
                     not r['source_legality_proven'] and
                     not r['asl_semantic_equivalence_proven'] and
                     not r['machine_effect_equivalence_proven'] and
                     len(r['blockers'])>=4 for r in j['rows'])
          assert 'X[d]' not in str(j)
          print('A37_G5_REAL_CROSS_SOURCE',by_source,
                'unique_xml',j['linked_distinct_xml_operations'],
                'total_xml',j['official_xml_operations'],'admitted=0')
          PY

  replay-original-ASL-instruction-state:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    container:
      image: ocaml/opam:alpine-3.21-ocaml-5.2
      options: --user root
    env:
      OPAMROOT: /home/opam/.opam
      OPAMROOTISOK: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          repository: herd/herdtools7
          ref: cfc4f56c522ec0d701acaf5a23139b47e8711299
          path: herd
          persist-credentials: false
      - name: Build unchanged pinned upstream ASLRef 1.0-EAC2
        shell: sh
        run: |
          set -eu
          apk add --no-cache bash python3 curl coreutils git openssh-client gmp-dev pkgconf
          opam install -y dune menhir zarith
          (cd herd && opam exec -- dune build -p aslref --profile release)
          ./herd/_build/default/asllib/aslref.exe --version | grep -Fx 'aslref version 1.0-EAC2'
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 88d7f4865402debe122f61b28f92ea5f8b39e0f7
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Replay authentic ADC ADCS 224 state/NZCV vectors and bind to G5 original sources
        shell: sh
        run: |
          set -eu
          test "$(git -C compiler rev-parse HEAD)" = 88d7f4865402debe122f61b28f92ea5f8b39e0f7
          curl -fLsS --retry 3 --connect-timeout 20 --max-time 240 \
            'https://kernel.googlesource.com/pub/scm/linux/kernel/git/maz/AARCHMRS/+/1346b16d47619400448f3cb6d4f22d62d3b76848/Instructions.json?format=TEXT' \
            -o /tmp/g6-aarchmrs.b64
          base64 -d /tmp/g6-aarchmrs.b64 > /tmp/g6-aarchmrs-instructions.json
          echo 'ef75f3ec02df1b9b9c0612f4ea259d6710ac3de686b097d8f9c83d1d97aa800a  /tmp/g6-aarchmrs-instructions.json' | sha256sum -c -
          curl -fLsS --retry 3 --connect-timeout 20 --max-time 240 --max-filesize 200000000 \
            'https://developer.arm.com/-/cdn-downloads/permalink/Exploration-Tools-A64-ISA/ISA_A64/ISA_A64_xml_A_profile-2026-09.tar.gz' \
            -o /tmp/g6-arm2026.tar.gz
          echo '44cfb89c763c7eea8e59de0ad2221e3c012e6aa77899bd7f1c3e1f24537191d7  /tmp/g6-arm2026.tar.gz' | sha256sum -c -
          python3 -m unittest discover -s compiler/tools -p 'test_aarch64_a32_adc_original_instruction_execution.py' -v
          python3 -m unittest discover -s compiler/tools -p 'test_aarch64_a37_executed_asl_handoff.py' -v
          python3 compiler/tools/aarch64_mrs_catalog.py \
            --instructions /tmp/g6-aarchmrs-instructions.json \
            --expect-sha256 ef75f3ec02df1b9b9c0612f4ea259d6710ac3de686b097d8f9c83d1d97aa800a \
            --out /tmp/g6-a64-original-catalog.json
          python3 compiler/tools/aarch64_a37_executed_asl_handoff.py \
            --original-aarchmrs /tmp/g6-aarchmrs-instructions.json \
            --aarchmrs-catalog /tmp/g6-a64-original-catalog.json \
            --isa-xml-archive /tmp/g6-arm2026.tar.gz \
            --bundler herd/herd/libdir/asl-pseudocode/bundler.py \
            --aslref herd/_build/default/asllib/aslref.exe \
            --out /tmp/g6-executed-source-handoff.json
          python3 - <<'PY'
          import json
          m=json.load(open('/tmp/g6-executed-source-handoff.json'))
          assert m['format']=='aarch64-a37-g6-executed-source-witness-handoff-v1'
          assert m['source_path_count']==4429
          assert m['source_execution_case_count']==224
          assert m['source_execution_word_variants']==4
          assert m['source_execution_operations']==['ADC','ADCS']
          assert m['source_execution_verification']=='pinned_ASLRef_replayed_in_this_run'
          assert not m['selection_eligible']
          assert not m['shared_DAG_translation_verified']
          assert not m['typed_DAG_equivalence_proven']
          assert not m['complete_effect_equivalence_proven']
          assert len(m['word_witnesses'])==4
          assert sum(w['source_executed_case_count'] for w in m['word_witnesses'])==224
          assert all(not w['selection_eligible'] and
                     not w['typed_DAG_equivalence_proven'] and
                     not w['complete_effect_equivalence_proven']
                     for w in m['word_witnesses'])
          print('G6_ASLREF_ORIGINAL_SOURCE_EXECUTED_HANDOFF',224,
                [(w['operation_id'],w['width_bits'],w['matched_encoding_candidates'],w['source_mask_predicate'],
                  w['blockers']) for w in m['word_witnesses']],
                'selector_admitted=0')
          PY

          python3 compiler/tools/aarch64_a32_full_source_catalog.py \
            --isa-xml-archive /tmp/g6-arm2026.tar.gz \
            --out /tmp/g7-official-xml-catalog.json
          python3 compiler/tools/aarch64_a37_original_effect_aliases.py \
            --archive /tmp/g6-arm2026.tar.gz \
            --bundler herd/herd/libdir/asl-pseudocode/bundler.py \
            --aslref herd/_build/default/asllib/aslref.exe \
            --catalog /tmp/g7-official-xml-catalog.json \
            --out /tmp/g7-executed-source-alias-effects.json
          python3 - <<'PY'
          import json
          p=json.load(open('/tmp/g7-executed-source-alias-effects.json'))
          assert p['format']=='aarch64-a37-g7-executed-gp-alias-state-effects-v1'
          assert p['executed_source_cases']==112
          assert len(p['source_instructions'])==2
          assert p['source_original_register_aliases_checked']
          assert not p['all_register31_roles_checked']
          assert not p['source_effects_exhaustively_proven']
          assert not p['typed_ASL_DAG_extracted']
          assert not p['ordered_source_effects_proven']
          assert not p['TypeId_effect_equivalence_proven']
          assert not p['selection_eligible']
          for row in p['source_instructions']:
              assert row['operation_id'] in ('ADC','ADCS')
              assert row['cases']==56 and row['widths']==[32,64]
              assert len(row['alias_layouts'])==7
              assert row['observed_registers']==[0,1,2,3,4,30]
              assert row['source_executed'] and row['source_register_NZCV_assertions_passed']
              assert not row['source_SP_ZR_register31_checked']
              assert not row['typed_ASL_DAG_extracted']
              assert not row['TypeId_effect_equivalence_proven']
              assert not row['selection_eligible']
          print('G7_AUTHENTIC_ORIGINAL_ASL_ALIAS_EFFECTS_PASSED',
                p['executed_source_cases'],'G6 baseline 224',
                'typed_DAG=0 effect_proofs=0 selector_admitted=0')
          PY
          mkdir -p herd/asllib/offline_g7
          cp compiler/tools/aarch64_a37_typed_effect_ast.ml \
            herd/asllib/offline_g7/aarch64_g7_typed_effect_ast.ml
          echo '(executable (name aarch64_g7_typed_effect_ast) (libraries aslref) (flags (:standard -w -40-42)))' \
            > herd/asllib/offline_g7/dune
          (cd herd && opam exec -- dune build asllib/offline_g7/aarch64_g7_typed_effect_ast.exe)
          test -x herd/_build/default/asllib/offline_g7/aarch64_g7_typed_effect_ast.exe
          python3 compiler/tools/aarch64_a37_typed_effect_frontier.py \
            --archive /tmp/g6-arm2026.tar.gz \
            --bundler herd/herd/libdir/asl-pseudocode/bundler.py \
            --aslref herd/_build/default/asllib/aslref.exe \
            --typed-exporter herd/_build/default/asllib/offline_g7/aarch64_g7_typed_effect_ast.exe \
            --catalog /tmp/g7-official-xml-catalog.json \
            --out /tmp/g7-s2-typed-ast-frontier.json
          python3 - <<'PY'
          import json
          p=json.load(open('/tmp/g7-s2-typed-ast-frontier.json'))
          assert p['format']=='aarch64-a37-g7-s2-upstream-typed-asl-event-frontier-v1'
          assert p['arm_isa_xml_sha256']=='44cfb89c763c7eea8e59de0ad2221e3c012e6aa77899bd7f1c3e1f24537191d7'
          assert p['upstream_typed_ast'] and p['event_stream_is_syntax_only']
          assert [x['operation_id'] for x in p['operations']]==['ADC','ADCS']
          for row in p['operations']:
              assert row['typed_aslref_ast'] and row['event_count']>0
              assert row['typed_expression_event_count']>0
              assert len(row['events'])==row['event_count']
              assert not row['architectural_effects_resolved']
              assert not row['semantic_equivalence_proven']
              assert not row['selection_eligible']
          assert not p['shared_DAG_translation_proven']
          assert not p['complete_effects_proven']
          assert not p['selector_admitted']
          assert not p['selection_eligible']
          print('G7_S2_REAL_UPSTREAM_TYPED_AST', [
             (x['operation_id'],x['event_count'],x['typed_expression_event_count'],
              x['event_kinds']) for x in p['operations']],
             'selector_admitted=0')
          PY
