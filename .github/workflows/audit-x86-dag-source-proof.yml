name: Audit x86 DAG source-backed proof gate
on:
  pull_request:
    paths: ['.github/workflows/audit-x86-dag-source-proof.yml']
  workflow_dispatch:
    inputs:
      source_sha:
        description: 'Exact 40-character compiler source commit'
        required: true
        default: '6f52efed6bacdf0011d03195324ab829e99b85e5'
        type: string
permissions:
  contents: read
jobs:
  source-proven-dag-groups:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact compiler candidate (never run on compiler Actions)
        uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: ${{ inputs.source_sha || '6f52efed6bacdf0011d03195324ab829e99b85e5' }}
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Check candidate SHA, Python syntax, and fast structural regressions
        shell: bash
        working-directory: compiler
        run: |
          set -euo pipefail
          expected="${{ inputs.source_sha || '6f52efed6bacdf0011d03195324ab829e99b85e5' }}"
          [[ "$expected" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$expected"
          export PYTHONPATH="$PWD/tools"
          python3 -m py_compile tools/regen_x86_dag_rule_groups.py tools/test_x86_dag_rule_groups.py
          python3 -m unittest discover -s tools -p 'test_x86_dag_rule_groups.py' -v
          python3 tools/regen_x86_dag_rule_groups.py --check
      - name: Install offline proof dependencies and fetch exact reviewed Intel semantics
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends z3 python3-venv
          python3 -m venv "$RUNNER_TEMP/x86-dag-venv"
          "$RUNNER_TEMP/x86-dag-venv/bin/pip" install --quiet z3-solver
          z3 -version
          mkdir -p "$RUNNER_TEMP/intel-isl"
          revision=35eface1b7ee003a1cda95005ec5fd83de658a64
          for op in ADD BSF; do
            curl --fail --silent --show-error --location --retry 3 \
              --connect-timeout 15 --max-time 60 \
              "https://raw.githubusercontent.com/intel/SDM/${revision}/data/instruction/${op}.xml" \
              -o "$RUNNER_TEMP/intel-isl/${op}.xml"
          done
      - name: Rerun all DAG producer SMT proofs and require exact generated bytes
        shell: bash
        working-directory: compiler
        run: |
          set -euo pipefail
          export PYTHONPATH="$PWD/tools"
          "$RUNNER_TEMP/x86-dag-venv/bin/python" tools/regen_x86_dag_rule_groups.py \
            --check-source --intel-dir "$RUNNER_TEMP/intel-isl"
          echo X86_DAG_SOURCE_GROUP_PROOF_PASS
