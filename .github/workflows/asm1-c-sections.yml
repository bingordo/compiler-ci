name: ASM1-C sectioned AT&T assembler source-pinned acceptance
on:
  push:
    branches: [ci/asm1-c-sections]
    paths: ['.github/workflows/asm1-c-sections.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  x86-att-sections:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 8240262ac24f00b693dd946a61e342dce3060ac8
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Record exact compiler source
        run: |
          git rev-parse HEAD | tee -a "$GITHUB_STEP_SUMMARY"
          rustc --version
      - name: Build core workspace without private frontends
        run: |
          cat > Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir", "crates/opt", "crates/backend", "crates/backend-x86"]
          EOF
          rm -f Cargo.lock
      - uses: Swatinem/rust-cache@v2
        with:
          key: asm1-c-sections
      - name: Verify generated form catalog and run core tests
        run: |
          set -euo pipefail
          python3 tools/regen_x86_att_forms.py --check
          python3 -m unittest discover -s tools -p 'test_regen_x86_att_forms.py' -v
          cargo check -p compiler-backend-x86 --all-targets
          cargo test -p compiler-backend-x86 --test att_module -- --nocapture
          cargo test -p compiler-backend-x86 --test att_asm -- --nocapture
          cargo test -p compiler-backend-x86
          cargo clippy -p compiler-backend-x86 --all-targets -- -D warnings
          echo 'ASM1_C_SECTIONED_ELF status=PASS' | tee -a "$GITHUB_STEP_SUMMARY"
