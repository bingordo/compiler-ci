name: BT4 retire obsolete Function linkage data trait
on:
  pull_request:
    paths:
      - '.github/workflows/verify-bt4-x86-retire-function-link-globals-20261115.yml'
permissions:
  contents: read
jobs:
  x86-source-owned-linkage-elf-gas-oracles:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 738f02931cbd5ff001b9bf04fece070dcd843e6c
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: bt4-x86-retired-function-link-globals
      - name: Exact pinned commit and full repo obsolete Function method references
        working-directory: compiler
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "738f02931cbd5ff001b9bf04fece070dcd843e6c"
          python3 tools/check_bt4_backend_boundary.py
          if git grep -nE '(emit_assembly_linked_with_globals|emit_object_linked_with_globals|emit_assembly_with_globals|emit_object_with_globals|emit_assembly_linked|emit_object_linked)[[:space:]]*\(' -- '*.rs'; then
            echo 'BT4_FAIL: removed Function-only trait linkage/data method has Rust callers or definitions'
            exit 1
          fi
          echo BT4_NO_OLD_FUNCTION_LINKAGE_GLOBAL_TRAIT_REFERENCES
      - name: Keep isolated native TypeId x86 backend workspace and avoid frontend git dependencies
        shell: bash
        run: |
          set -euo pipefail
          cat > compiler/Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir", "crates/opt", "crates/backend", "crates/backend-x86"]
          EOF
          rm -f compiler/Cargo.lock
      - name: Native x86 all-target compile and distinct legacy/native ELF/GAS C oracles
        working-directory: compiler
        shell: bash
        run: |
          set -euo pipefail
          cargo check -p compiler-backend-x86 --all-targets
          cargo check -p compiler-backend-x86 --lib --no-default-features
          cargo test -p compiler-backend-x86 --lib
          cargo test -p compiler-backend-x86 --no-default-features --lib
          cargo test -p compiler-backend-x86 --test m4_global_definitions_native -- --nocapture
          cargo test -p compiler-backend-x86 --test m4_relro_linkage_native -- --nocapture
          cargo test -p compiler-backend-x86 --test m4_8_checked_symbol_attributes_native -- --nocapture
          cargo test -p compiler-backend-x86 --features x7-native-form-validation --test x7_g10_n11_cfg_spill_probe -- --nocapture
          cargo test -p compiler-backend-x86 --features x7-native-form-validation --test x7_g10_n16_bitwise_native -- --nocapture
          cargo test -p compiler-backend-x86 --test bt4_x86_physical_budget_native -- --nocapture
          echo BT4_LINKAGE_GLOBAL_TRAIT_RETIREMENT_NATIVE_AND_X7_ORACLES_PASS
