# One-shot exact-source TypeId module ABI regression, compiler PR #353.
name: Verify PR353 TypeId native module ABI
on:
  push:
    branches: [ci/pr353-typeid-module-abi]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 644aa580f69f23764bc2b1fbfe3a763c77aa323c
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Verify immutable compiler revision
        run: test "$(git -C compiler rev-parse HEAD)" = "644aa580f69f23764bc2b1fbfe3a763c77aa323c"
      - name: Use the self-contained compiler core workspace
        run: |
          cat > compiler/Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir", "crates/opt", "crates/backend", "crates/backend-x86"]
          EOF
          rm -f compiler/Cargo.lock
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: typeid-module-abi-pr353
          cache-workspace-crates: 'true'
      - name: Focused native TypeId module ABI and memory tests
        working-directory: compiler
        run: cargo test -p compiler-ir --test typed_module_abi --test typed_memory_provenance --test typed_opcode_types --test typed_value_flow
      - name: Full self-contained compiler IR optimizer and native suites
        working-directory: compiler
        run: cargo test -p compiler-ir -p compiler-opt -p compiler-backend -p compiler-backend-x86
      - name: Strict IR Clippy all targets
        working-directory: compiler
        run: cargo clippy -p compiler-ir --all-targets -- -D warnings
