name: Temporary native Mini-C static addends 3469
on:
  pull_request:
    paths: ['.github/workflows/temp-mini-c-native-addends-3469.yml']
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: d98de085e23dc2490d1b361a24341de2ba09a325
          persist-credentials: false
      - run: |
          git rev-parse HEAD
          git config --global url.https://github.com/.insteadOf ssh://git@github.com/
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            tools/mini-c-driver/target/debug
          key: mini-c-typeid-static-addends-3469
          restore-keys: |
            mini-c-typeid-
      - run: cargo test --manifest-path tools/mini-c-driver/Cargo.toml --lib global_data
      - run: cargo build --manifest-path tools/mini-c-driver/Cargo.toml
      - name: GCC differential runtime
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/static.c" <<'EOF'
          int a[5]={2,4,6,8,10};
          int *p=a+2;
          int *q=&a[3];
          int *r=(a+4)-3;
          int main(void) { return *p!=6 || *q!=8 || *r!=4; }
          EOF
          gcc -std=c99 -pedantic-errors "$RUNNER_TEMP/static.c" -o "$RUNNER_TEMP/gcc-static"
          "$RUNNER_TEMP/gcc-static"
          tools/mini-c-driver/target/debug/compiler-mini-c "$RUNNER_TEMP/static.c" -o "$RUNNER_TEMP/native-static.o"
          gcc "$RUNNER_TEMP/native-static.o" -o "$RUNNER_TEMP/native-static"
          "$RUNNER_TEMP/native-static"
          readelf -r "$RUNNER_TEMP/native-static.o"
