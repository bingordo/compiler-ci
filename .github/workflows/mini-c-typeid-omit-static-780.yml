name: Standalone Mini-C TypeId omitted-body cutover 780
on:
  pull_request:
    paths:
      - .github/workflows/mini-c-typeid-omit-static-780.yml
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.CI_KEY }}
      - run: ssh-keyscan github.com >> ~/.ssh/known_hosts
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 29e8d2bb7a44698cd8c5e52d9a27854a782e462b
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Verify source commit
        run: test "$(git -C compiler rev-parse HEAD)" = "29e8d2bb7a44698cd8c5e52d9a27854a782e462b"
      - name: Warnings-denied full standalone Mini-C targets
        working-directory: compiler
        run: RUSTFLAGS="-D warnings" cargo check --manifest-path tools/mini-c-driver/Cargo.toml --all-targets
      - name: Executable TypeId ELF + legacy source filtering and fail-closed
        working-directory: compiler
        run: cargo test --manifest-path tools/mini-c-driver/Cargo.toml --test typeid_cli -- --nocapture
      - name: Existing standalone Mini-C full regression
        working-directory: compiler
        run: cargo test --manifest-path tools/mini-c-driver/Cargo.toml -- --test-threads=2
      - name: Strict Clippy
        working-directory: compiler
        run: cargo clippy --manifest-path tools/mini-c-driver/Cargo.toml --all-targets -- -D warnings
