name: TypeId P2 direct Mini-C checked producer migration
on:
  pull_request:
    paths:
      - '.github/workflows/verify-typeid-direct-minic-p2.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  p2:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
      CARGO_INCREMENTAL: '0'
    steps:
      - name: Checkout exact compiler P2 SHA
        uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 00a454c523af7c5bc4ee7c5daaaf4379fefafd32
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Verify compiler SHA
        working-directory: compiler
        run: test "$(git rev-parse HEAD)" = "00a454c523af7c5bc4ee7c5daaaf4379fefafd32"
      - name: Resolve pinned Mini-C and Oberon frontend dependencies
        run: git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: typeid-direct-minic-p2
      - name: Direct owned Mini-C TypeId SSA plus independent GAS and ELF C11 oracles
        working-directory: compiler
        run: cargo test -p compiler --bin compiler typeid_native_source -- --nocapture
      - name: Complete checked Mini-C and Oberon driver suite
        working-directory: compiler
        run: cargo test -p compiler --bin compiler
      - name: Existing IR source compatibility acceptance
        working-directory: compiler
        run: cargo test -p compiler-ir --test native_source_bridge
      - name: AArch64 shared TypeId API
        working-directory: compiler
        run: cargo check -p compiler-backend-aarch64 --all-targets
      - name: Strict IR compiler optimizer x86 Clippy
        working-directory: compiler
        run: cargo clippy -p compiler -p compiler-ir -p compiler-opt -p compiler-backend-x86 --all-targets -- -D warnings
      - name: Strict AArch64 Clippy
        working-directory: compiler
        run: cargo clippy -p compiler-backend-aarch64 --lib -- -D warnings
      - name: Install GDB for existing DWARF regression
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y gdb
      - name: Full IR optimizer and x86 backend regressions
        working-directory: compiler
        run: cargo test -p compiler-ir -p compiler-opt -p compiler-backend -p compiler-backend-x86
