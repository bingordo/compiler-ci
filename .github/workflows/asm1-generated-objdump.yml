name: ASM1 generated GAS objdump acceptance
on:
  push:
    branches: [ci/asm1-generated-objdump-20261115]
    paths: ['.github/workflows/asm1-generated-objdump.yml']
  pull_request:
    branches: [main]
    paths: ['.github/workflows/asm1-generated-objdump.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  generated-differential:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 38893b7bc6d483ab9a1557138cdba394488efb3c
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Verify exact compiler source pin
        run: test "$(git rev-parse HEAD)" = "38893b7bc6d483ab9a1557138cdba394488efb3c"
      - name: Restrict workspace to compiler core
        run: |
          cat > Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir", "crates/opt", "crates/backend", "crates/backend-x86"]
          EOF
          rm -f Cargo.lock
      - uses: Swatinem/rust-cache@v2
        with:
          key: asm1-generated-objdump
      - name: Check generator, compile and run GAS/objdump byte differential
        run: |
          set -euo pipefail
          as --version | head -n1
          objdump --version | head -n1
          objcopy --version | head -n1
          python3 tools/regen_x86_att_forms.py --check
          python3 -m unittest discover -s tools -p test_regen_x86_att_forms.py -v
          cargo check -p compiler-backend-x86 --all-targets
          cargo test -p compiler-backend-x86 --lib generated_form_tests -- --list | tee /tmp/asm1-generated-tests.txt
          grep -qF 'generated_gp_forms_match_gas_bytes_and_objdump_for_register_and_address_variants: test' /tmp/asm1-generated-tests.txt
          grep -qF 'generated_gp_forms_reject_simd_registers_in_gp_slots: test' /tmp/asm1-generated-tests.txt
          cargo test -p compiler-backend-x86 --lib generated_form_tests -- --nocapture
          cargo test -p compiler-backend-x86 --test att_asm
          cargo test -p compiler-backend-x86 --test att_module
          cargo clippy -p compiler-backend-x86 --lib -- -D warnings -A unused_variables -A clippy::suspicious_assignment_formatting
          echo "ASM1_GENERATED_OBJDUMP source=38893b7bc6d483ab9a1557138cdba394488efb3c status=PASS" >> "$GITHUB_STEP_SUMMARY"
