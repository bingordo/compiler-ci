name: X7 IP2 original Intel source certificate cross-check
on:
  pull_request:
    paths: ['.github/workflows/verify-x7-ip2-source-cert-join-20261118.yml']
permissions:
  contents: read
jobs:
  verify-source-boundary:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: b06443128c91228ab916cf6722a04fbfc04a440f
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Install Z3
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y z3
      - name: Exact-source original proof gate and independent typed DAG tests
        working-directory: compiler
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "b06443128c91228ab916cf6722a04fbfc04a440f"
          python3 -m py_compile tools/x7_ip2_semantic_certificate_join.py tools/test_x7_ip2_semantic_certificate_join.py
          PYTHONPATH=tools python3 -m unittest -v test_x7_ip2_semantic_certificate_join test_x7_ip2_ir_equivalence test_x7_ip2_pure_dag_candidates
          echo X7_IP2_CERTIFICATE_BOUNDARY_GREEN
