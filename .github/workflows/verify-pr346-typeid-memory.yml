# Single-purpose exact source SHA validation; compiler PR #346.
name: Verify PR346 TypeId memory provenance
on:
  push:
    branches: [ci/pr346-typeid-memory]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 699aa3528f32bee9ae05eb07750c377b19ef468f
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Confirm checked-out compiler revision
        run: test "$(git -C compiler rev-parse HEAD)" = "699aa3528f32bee9ae05eb07750c377b19ef468f"
      - name: Restrict workspace to compiler core crates
        run: |
          cat > compiler/Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir", "crates/opt", "crates/backend", "crates/backend-x86"]
          EOF
          rm -f compiler/Cargo.lock
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: typed-memory-pr346
          cache-workspace-crates: 'true'
      - name: Focused native memory and legacy verifier regressions
        working-directory: compiler
        run: cargo test -p compiler-ir --test typed_memory_provenance
      - name: Full self-contained IR opt backend and native suite
        working-directory: compiler
        run: cargo test -p compiler-ir -p compiler-opt -p compiler-backend -p compiler-backend-x86
      - name: Strict IR Clippy all targets
        working-directory: compiler
        run: cargo clippy -p compiler-ir --all-targets -- -D warnings
