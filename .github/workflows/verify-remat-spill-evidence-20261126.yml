name: Remat allocator spill evidence (read-only)
on:
  push:
    branches: [verify/remat-spill-evidence-20261126]
    paths: [.github/workflows/verify-remat-spill-evidence-20261126.yml]
  workflow_dispatch:
permissions:
  contents: read
  statuses: write
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    env:
      COMPILER_SHA: 18b0e66bdf27bf11632d33275055db900828eff0
      CARGO_INCREMENTAL: '0'
      CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: ${{ env.COMPILER_SHA }}
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Verify pinned compiler source
        run: |
          set -euo pipefail
          test "$(git -C compiler rev-parse HEAD)" = "$COMPILER_SHA"
          echo "Source: $COMPILER_SHA" >> "$GITHUB_STEP_SUMMARY"
          git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: remat-spill-evidence-20261126
      - name: Focused SSA/spill attribution tests
        working-directory: compiler
        run: |
          set -euo pipefail
          cargo test -p compiler-backend-x86 --lib remat_spill_census_tests -- --nocapture
          cargo test -p compiler-backend-x86 --lib machine::pure_immediate_chain_tests
          cargo test -p compiler-backend --lib remat::
      - name: Native source TypeId compiler and read-only opportunity census
        working-directory: compiler
        run: |
          set -euo pipefail
          cargo build -p compiler --bin compiler
          python3 tools/x86_remat_spill_audit.py
      - name: Other target regressions and existing source oracle
        working-directory: compiler
        run: |
          set -euo pipefail
          cargo test -p compiler-backend-aarch64 --lib
          cargo test -p compiler-backend-riscv64 --lib
          cargo test -p compiler --test x7_s4_rolling_checksum_source -- --nocapture
      - name: Check x86 lints without suppressing new regressions
        working-directory: compiler
        run: |
          set -euo pipefail
          cargo clippy -p compiler-backend-x86 --lib -- --no-deps -D warnings \
            -A dead_code -A clippy::too_many_arguments \
            -A clippy::unnecessary_lazy_evaluations
      - name: Report validation
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          case "$JOB_STATUS" in
            success) state=success ;;
            cancelled) state=error ;;
            *) state=failure ;;
          esac
          gh api -X POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state="$state" \
            -f context="compiler/remat-spill-evidence" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            -f description="Pinned compiler: x86 SSA spill census and real source oracle"
