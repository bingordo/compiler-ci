name: TypeId PHI callback production selector verification
on:
  pull_request:
    paths:
      - '.github/workflows/ir-phi-production-selector.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      SOURCE_SHA: cddd8463bafe7ee9d4eb5d3b574ef28f6478d6b2
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: ${{ env.SOURCE_SHA }}
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Verify exact compiler SHA and isolate core
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C compiler rev-parse HEAD)" = "$SOURCE_SHA"
          cat > compiler/Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir", "crates/opt", "crates/backend", "crates/backend-x86"]
          EOF
          rm -f compiler/Cargo.lock
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: ir-phi-production-selector
      - name: Compile and execute 16 production ELF/GAS runtime binaries
        working-directory: compiler
        run: cargo test -p compiler-opt --test review_phi_call_pressure -- --nocapture
      - name: Strict production opt and x86 Clippy
        working-directory: compiler
        run: |
          set -euo pipefail
          cargo clippy -p compiler-opt --lib -- -D warnings
          cargo clippy -p compiler-backend-x86 --lib -- -D warnings
