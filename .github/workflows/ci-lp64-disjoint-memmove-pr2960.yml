name: Validate LP64 disjoint source memmove PR 2960
on:
  push:
    branches: [ci-lp64-disjoint-memmove-pr2960]
    paths: ['.github/workflows/ci-lp64-disjoint-memmove-pr2960.yml']
  pull_request:
    paths: ['.github/workflows/ci-lp64-disjoint-memmove-pr2960.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lp64-source-memmove:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: c5c8fcfe2c5d24d2ad924d835febca26fecca9ae
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Verify source-pinned commit
        run: test "$(git -C compiler rev-parse HEAD)" = c5c8fcfe2c5d24d2ad924d835febca26fecca9ae
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.CI_KEY }}
      - run: ssh-keyscan github.com >> ~/.ssh/known_hosts
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: lp64-disjoint-memmove-pr2960
      - name: Rust format new differential test
        working-directory: compiler
        run: rustfmt --check --edition 2021 crates/driver/tests/native_lp64_disjoint_memmove.rs
      - name: GCC executable GAS/direct ELF disjoint memmove and overlap fallback
        working-directory: compiler
        run: cargo test -p compiler --test native_lp64_disjoint_memmove -- --nocapture
      - name: Existing dynamic memcpy GCC executable oracle
        working-directory: compiler
        run: cargo test -p compiler --test native_lp64_bounded_dynamic_memcpy -- --nocapture
      - name: Shared source-checked local memcpy/memmove/memset tests
        working-directory: compiler
        run: cargo test -p mini-c-driver --lib checked_local_memcpy -- --nocapture
