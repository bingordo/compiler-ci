name: One-off linear CFG cycle and symbol index validation
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/bench-linear-cycle-symbol.yml'
permissions:
  contents: read
jobs:
  validate:
    if: github.head_ref == 'bench/linear-cycle-symbol-index' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 06bcabdba036d7d548dad30bd244c10f91e57645
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: linear-cycle-symbol-index
      - name: Test optimizer and generic backend
        working-directory: compiler
        run: |
          set -euo pipefail
          git rev-parse HEAD
          git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
          cargo test --release -p compiler-opt --lib
          cargo test --release -p compiler-backend --lib
          cargo clippy -p compiler-opt -p compiler-backend --lib -- -D warnings
