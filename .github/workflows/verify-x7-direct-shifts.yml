name: X7 integrated scalar shifts
on:
  pull_request:
    paths: ['.github/workflows/verify-x7-direct-shifts.yml']
permissions:
  contents: read
jobs:
  focused:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 8de3ef4e317a078a8b08d8a49661eeae615965a5
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Verify candidate and native feature support
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 8de3ef4e317a078a8b08d8a49661eeae615965a5
          grep -m1 -w bmi2 /proc/cpuinfo
      - name: Generated matcher and allocated ELF/GAS oracle
        run: |
          set -euo pipefail
          cargo test -p compiler-backend-x86 --lib --locked x7_generated_gp_matcher -- --nocapture
          cargo test -p compiler-backend-x86 --lib --locked
          cargo check -p compiler-backend-x86 --locked --no-default-features
