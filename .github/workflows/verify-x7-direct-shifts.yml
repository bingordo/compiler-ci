name: X7 integrated scalar shifts
on:
  pull_request:
    paths: ['.github/workflows/verify-x7-direct-shifts.yml']
permissions:
  contents: read
jobs:
  focused:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 8de3ef4e317a078a8b08d8a49661eeae615965a5
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Verify candidate and native feature support
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 8de3ef4e317a078a8b08d8a49661eeae615965a5
          grep -m1 -w bmi2 /proc/cpuinfo
      - name: Restrict workspace to core crates (same as reusable core gate)
        run: |
          cat > Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir", "crates/opt", "crates/backend", "crates/backend-x86"]
          exclude = ["crates/ir-macros", "crates/backend-aarch64"]
          EOF
          rm -f Cargo.lock
      - uses: Swatinem/rust-cache@v2
        with:
          key: external-pr-core
      - name: Generated matcher and allocated ELF/GAS oracle
        run: |
          set -euo pipefail
          cargo test -p compiler-backend-x86 --lib x7_generated_gp_matcher -- --nocapture
          cargo test -p compiler-backend-x86 --lib
          cargo check -p compiler-backend-x86 --no-default-features
