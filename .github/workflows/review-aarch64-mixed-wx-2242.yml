name: Review AArch64 mixed W/X call pressure PR 2242
on:
  push:
    branches: [review/aarch64-mixed-wx-2242]
    paths:
      - .github/workflows/review-aarch64-mixed-wx-2242.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  aarch64-liveness:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 25
    steps:
      - name: Checkout pinned compiler change
        uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 234e033787279e9d75c100a4619bce87c5c02535
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Verify compiler SHA
        run: test "$(git -C compiler rev-parse HEAD)" = "234e033787279e9d75c100a4619bce87c5c02535"
      - uses: dtolnay/rust-toolchain@stable
      - name: Isolated backend workspace
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work/crates
          cp -a compiler/crates/{ir,backend,backend-aarch64} work/crates/
          cat > work/Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir", "crates/backend", "crates/backend-aarch64"]
          EOF
      - name: AArch64 all-targets compile
        working-directory: work
        run: RUSTFLAGS="-D warnings" cargo check -p compiler-backend-aarch64 --all-targets
      - name: Native AArch64 tests
        working-directory: work
        run: cargo test -p compiler-backend-aarch64 --all-targets -- --test-threads=1
      - name: Generated mixed W/X call-live CFG spill oracle
        working-directory: work
        run: cargo test -p compiler-backend-aarch64 generated_mixed_gp_width_call_results_survive_spills_and_cfg_phi -- --nocapture
