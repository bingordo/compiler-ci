name: LTO ELF machine and ABI input admission
on:
  push:
    branches: [verify/lto-target-elf-admission-20261115]
    paths: ['.github/workflows/lto-target-elf-admission-20261115.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  elf-abi:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: c2dbfd67b9fb71cf9c25f035c55b0066f182aaae
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Verify pinned source and public Git dependency access
        run: |
          test "$(git -C compiler rev-parse HEAD)" = "c2dbfd67b9fb71cf9c25f035c55b0066f182aaae"
          git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
      - name: Isolate the driver workspace
        run: |
          cat > compiler/Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir", "crates/opt", "crates/backend", "crates/backend-x86", "crates/backend-aarch64", "crates/driver"]
          EOF
          rm -f compiler/Cargo.lock
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: lto-elf-abi
      - name: Reject wrong target ELF objects and rerun native LTO regressions
        working-directory: compiler
        run: |
          cargo test -p compiler --test lto_elf_admission -- --nocapture
          cargo test -p compiler --test lto_mixed_link
          cargo test -p compiler --test lto_coemit
          cargo test -p compiler --test lto_elf_visibility
          cargo test -p compiler --test lto_source_sidecar
          cargo test -p compiler --test lto_cli
      - name: Strict targeted lint
        working-directory: compiler
        run: cargo clippy -p compiler --test lto_elf_admission -- -D warnings
