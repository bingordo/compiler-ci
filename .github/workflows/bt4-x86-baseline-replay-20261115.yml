name: BT4 compare x86 historical physical replay pre-change baseline
on:
  pull_request:
    paths:
      - '.github/workflows/bt4-x86-baseline-replay-20261115.yml'
permissions:
  contents: read
jobs:
  baseline:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 630e81d0a6a1e3a153c67e400a67d9116e18733f
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Reproduce exact original x86 physical-v1 replay failure at pre-change main
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C compiler rev-parse HEAD)" = 630e81d0a6a1e3a153c67e400a67d9116e18733f
          cd compiler
          printf '[workspace]\nresolver="2"\nmembers=["crates/ir","crates/opt","crates/backend","crates/backend-x86"]\n' > Cargo.toml
          set +e
          cargo test --offline -p compiler-backend-x86 --test typeid_physical_control_replay production_typeid_machine_stream_replays_when_supported -- --exact --nocapture > /tmp/replay.out 2>&1
          status=$?
          set -e
          tail -n 27 /tmp/replay.out | cut -c1-240
          if test "$status" -eq 0; then
            echo 'BASELINE PASS; candidate failure IS A REGRESSION and must be corrected'
            exit 1
          fi
          grep -F "assertion \`left == right\` failed" /tmp/replay.out
          echo BT4_PRECHANGE_ORIGINAL_REPLAY_FAILURE_REPRODUCED
