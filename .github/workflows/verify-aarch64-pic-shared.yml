name: AArch64 M7 PIC GOT shared library native gate
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-aarch64-pic-shared.yml'
permissions:
  contents: read
concurrency:
  group: aarch64-m7-pic-shared
  cancel-in-progress: true

jobs:
  arm-source:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - name: Configure read-only SSH for pinned frontends
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.CI_KEY }}
      - name: Trust GitHub SSH host for pinned source dependencies
        run: ssh-keyscan github.com >> ~/.ssh/known_hosts
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 9371ca679b5d2bfb0fa2f1ab6cc524d0194e3c9c
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Verify exact compiler source SHA
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C compiler rev-parse HEAD)" = 9371ca679b5d2bfb0fa2f1ab6cc524d0194e3c9c
          test "$(uname -m)" = aarch64
          command -v cc
          command -v readelf
          echo 'AArch64 source integration at compiler SHA 9371ca679b5d2bfb0fa2f1ab6cc524d0194e3c9c' >> "$GITHUB_STEP_SUMMARY"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: aarch64-m7-pic-shared
          cache-workspace-crates: 'true'
      - name: Compile real Oberon/Mini-C unified compiler binary
        working-directory: compiler
        run: RUSTFLAGS="-D warnings" cargo build -p compiler --bin compiler
      - name: Execute checked source-to-AArch64 ELF linked C oracles
        working-directory: compiler
        shell: bash
        run: |
          set -euo pipefail
          COMPILER_DRIVER="$PWD/target/debug/compiler" bash tests/aarch64_driver_integration.sh
          echo 'Native ARM64 AArch64Pic GOT shared object, dlopen host interposition and imports, plus real checked Oberon/Mini-C source regressions passed.' >> "$GITHUB_STEP_SUMMARY"
