name: ASM SIMD0 existing scalar SSE acceptance
on:
  push:
    branches: [ci/asm-simd0-scalar-20261115]
    paths: ['.github/workflows/asm-simd0-scalar.yml']
  pull_request:
    branches: [main]
    paths: ['.github/workflows/asm-simd0-scalar.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sse-scalar:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 1a13bc1bdeb04a2d9688b719c8386ddcc9c0143d
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Verify exact source
        run: test "$(git rev-parse HEAD)" = "1a13bc1bdeb04a2d9688b719c8386ddcc9c0143d"
      - name: Restrict workspace to backend core
        run: |
          cat > Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir", "crates/opt", "crates/backend", "crates/backend-x86"]
          EOF
          rm -f Cargo.lock
      - uses: Swatinem/rust-cache@v2
        with:
          key: asm-simd0-scalar
      - name: SSE scalar assembler / encoder / GNU as
        run: |
          set -euo pipefail
          as --version | head -n1
          objcopy --version | head -n1
          cargo check -p compiler-backend-x86 --all-targets
          cargo test -p compiler-backend-x86 --test att_sse_scalar -- --list | tee /tmp/asm-simd0-tests
          grep -qF 'scalar_sse_enters_existing_physical_program_and_elf_writer: test' /tmp/asm-simd0-tests
          grep -qF 'scalar_sse_encoding_agrees_with_independent_gnu_as: test' /tmp/asm-simd0-tests
          cargo test -p compiler-backend-x86 --test att_sse_scalar -- --nocapture
          cargo test -p compiler-backend-x86 --test att_asm
          cargo test -p compiler-backend-x86 --test att_module
          cargo test -p compiler-backend-x86 --lib sse_scalar -- --nocapture
          cargo clippy -p compiler-backend-x86 --lib --test att_sse_scalar -- -D warnings -A unused_variables -A clippy::suspicious_assignment_formatting
          echo 'ASM_SIMD0 source=1a13bc1bdeb04a2d9688b719c8386ddcc9c0143d status=PASS' >> "$GITHUB_STEP_SUMMARY"
