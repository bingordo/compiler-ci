# One-off source-pinned ABI validation for compiler PR #2800.
# This workflow runs on a push to main that introduces this file, avoiding
# workflow_dispatch permissions that are unavailable through the connector.
name: Validate nested Mini-C checked subrecord ABI #2903
on:
  push:
    branches: [main, 'ci/mini-c-nested-subrecord-abi-20261122']
    paths:
      - '.github/workflows/verify-abi-pr2800-once.yml'
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  abi:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout exact compiler PR revision
        uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: abi/mini-c-nested-subrecord-call-20261122
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Verify source revision
        run: |
          set -euo pipefail
          test "$(git -C compiler rev-parse HEAD)" = d058cc72dcb861b40427494c8215e5e0a95599e2
          test -s compiler/tools/mini-c-driver/tests/differential.py
      - name: Make Mini-C dependency available over HTTPS
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path("compiler/tools/mini-c-driver/Cargo.toml")
          contents=p.read_text()
          old="ssh://git@github.com/bingordo/mini-c.git"
          assert contents.count(old)==2, "unexpected dependency manifest"
          p.write_text(contents.replace(old, "https://github.com/bingordo/mini-c.git"))
          PY
      - name: Cache build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler/tools/mini-c-driver -> target
          key: mini-c-nested-subrecord-abi-20261122
      - name: Build Mini-C driver
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=10s 12m cargo build \
            --manifest-path compiler/tools/mini-c-driver/Cargo.toml \
            -p compiler-mini-c --bin compiler-mini-c \
            2>&1 | tee "$RUNNER_TEMP/abi-build.log"
      - name: Check native nested-record TypeId lowering
        run: |
          set -euo pipefail
          cargo test --manifest-path compiler/tools/mini-c-driver/Cargo.toml \
            -p compiler-mini-c --lib aggregate_call -- --nocapture
          python3 -m py_compile compiler/tools/mini-c-driver/tests/differential.py
      - name: Check named GCC nested-subrecord ABI oracles
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=10s 3m python3 \
            compiler/tools/mini-c-driver/tests/differential.py \
            --compiler "$PWD/compiler/tools/mini-c-driver/target/debug/compiler-mini-c" \
            --mixed-only \
            --mixed-case mini_calls_gcc_nested_subrecord_two_gp \
            --mixed-case mini_calls_gcc_nested_subrecord_one_gp \
            --timeout 20 \
            --artifacts "$RUNNER_TEMP/abi-reproducers-focused" \
            2>&1 | tee "$RUNNER_TEMP/abi-focused.log"
          grep -Fxq 'PASS: mixed ABI calls' "$RUNNER_TEMP/abi-focused.log"
      - name: Run mixed-object ABI tests against GCC
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=10s 8m python3 \
            compiler/tools/mini-c-driver/tests/differential.py \
            --compiler "$PWD/compiler/tools/mini-c-driver/target/debug/compiler-mini-c" \
            --mixed-only --timeout 15 \
            --artifacts "$RUNNER_TEMP/abi-reproducers" \
            2>&1 | tee "$RUNNER_TEMP/abi-tests.log"
          grep -Fxq 'PASS: mixed ABI calls' "$RUNNER_TEMP/abi-tests.log"
          echo "ABI mixed-object tests passed for compiler d058cc72dcb861b40427494c8215e5e0a95599e2" >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve failures
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: abi-nested-subrecord-failures
          path: |
            ${{ runner.temp }}/abi-build.log
            ${{ runner.temp }}/abi-tests.log
            ${{ runner.temp }}/abi-focused.log
            ${{ runner.temp }}/abi-reproducers-focused/
            ${{ runner.temp }}/abi-reproducers/
          if-no-files-found: ignore
          retention-days: 14
      - name: Publish ABI result as commit status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          case "$RESULT" in
            success) state=success ;;
            *) state=failure ;;
          esac
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state="$state" \
            -f context="abi/pr2800" \
            -f description="Source-pinned GCC/Mini-C ABI validation: $RESULT" \
            -f target_url="$RUN_URL"
