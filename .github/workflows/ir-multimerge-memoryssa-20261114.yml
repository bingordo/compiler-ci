name: TypeId fixed multimerge and MemorySSA migration
on:
  push:
    branches: [verify/ir-multimerge-memoryssa-20261114]
    paths: ['.github/workflows/ir-multimerge-memoryssa-20261114.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 3a2b31c6f774dc880922f1b69d4621028c2827fb
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Verify exact source revision
        run: test "$(git -C compiler rev-parse HEAD)" = "3a2b31c6f774dc880922f1b69d4621028c2827fb"
      - name: Restrict workspace to compiler core
        run: |
          cat > compiler/Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir", "crates/opt", "crates/backend", "crates/backend-x86"]
          EOF
          rm -f compiler/Cargo.lock
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: ir-multimerge-memoryssa-migration
      - name: Export checked original TypeId fixtures and run existing assertions
        working-directory: compiler
        run: |
          cargo test -p compiler-opt --test if_conversion_typeid_multimerge -- --nocapture
          cargo test -p compiler-opt --test m6_typeid_memoryssa_cfg -- --nocapture
