name: TypeId fixed multimerge and MemorySSA migration
on:
  push:
    branches: [verify/ir-multimerge-memoryssa-20261114]
    paths: ['.github/workflows/ir-multimerge-memoryssa-20261114.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 52063a426d0d226af7eae1a68fb9d39ec51bf71a
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Verify exact source revision
        run: test "$(git -C compiler rev-parse HEAD)" = "52063a426d0d226af7eae1a68fb9d39ec51bf71a"
      - name: Restrict workspace to compiler core
        run: |
          cat > compiler/Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir", "crates/opt", "crates/backend", "crates/backend-x86"]
          EOF
          rm -f compiler/Cargo.lock
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: ir-multimerge-memoryssa-migration
      - name: Validate migrated native TypeId multimerge and MemorySSA suites
        working-directory: compiler
        run: |
          cargo test -p compiler-opt --features typeid-memory-ssa --test if_conversion_typeid_multimerge --test m6_typeid_memoryssa_cfg
          cargo test -p compiler-opt --test typed_if_conversion_pure --test typed_global_memory --test typed_local_memory
          cargo test -p compiler-opt --test ir_fixture_directives
          cargo test -p compiler-ir --test native_module_text_v3 --test native_fixture_text
          cargo clippy -p compiler-opt --features typeid-memory-ssa --test if_conversion_typeid_multimerge --test m6_typeid_memoryssa_cfg -- -D warnings
