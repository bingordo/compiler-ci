# Differential baseline for PR2763 P16 hang: same new main code, old
# P16 historical Function->TypeId fixture instead of new neutral graph plan.
name: IR PR2763 P16 x86 pre-migration baseline
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ir-pr2763-al05-p16-baseline-20261122.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  p16-baseline:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      SOURCE_SHA: c50b73a8ff38eaa0378ec020df97b4fda5df3fef
      CARGO_INCREMENTAL: '0'
      CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
    steps:
      - name: Check out exact pre-PR2763 main
        uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: ${{ env.SOURCE_SHA }}
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Check revision and isolate core workspace
        run: |
          set -euo pipefail
          test "$(git -C compiler rev-parse HEAD)" = "$SOURCE_SHA"
          cat > compiler/Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir", "crates/opt", "crates/backend", "crates/backend-x86", "crates/backend-aarch64"]
          EOF
          rm -f compiler/Cargo.lock
      - name: Cache IR baseline build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: ir-pr2763-p16-x86-baseline
      - name: Run identical bounded P16 x86 C11 ELF GAS oracle without migration
        working-directory: compiler
        shell: bash
        run: |
          set -euo pipefail
          echo "P16_BASELINE_SOURCE=$SOURCE_SHA"
          timeout --signal=TERM --kill-after=10s 180s cargo test -p compiler-opt --test al05_p9_mixed_native_bridge al05_p16_coverage_guided_native_x86_elf_gas_c11 -- --exact --nocapture
          echo "P16_BASELINE_VERDICT=PASS"
