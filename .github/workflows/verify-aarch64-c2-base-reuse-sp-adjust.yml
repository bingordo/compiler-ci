name: C2 AArch64 scaled memory catalog reuse and fixed-SP ADD/SUB oracle
on:
  pull_request:
    paths:
      - '.github/workflows/verify-aarch64-c2-base-reuse-sp-adjust.yml'
permissions:
  contents: read
jobs:
  generator-and-cross-target:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: d51c52e812015b54a051179ce30bdbd08b8bc981
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Assert exact production source SHA and isolate backend workspace
        run: |
          set -euo pipefail
          test "$(git -C compiler rev-parse HEAD)" = "d51c52e812015b54a051179ce30bdbd08b8bc981"
          cat > compiler/Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir", "crates/backend", "crates/backend-aarch64", "crates/backend-x86"]
          EOF
          rm -f compiler/Cargo.lock
      - name: Verify deterministic generated A64 rule and offline rejection tests
        working-directory: compiler
        run: |
          set -euo pipefail
          if ! python3 tools/regen_aarch64_native_selector_rules.py --check; then
            cp crates/backend-aarch64/src/generated_native_selector_rules.rs /tmp/current-a64-rules.rs
            python3 tools/regen_aarch64_native_selector_rules.py --write
            diff -u /tmp/current-a64-rules.rs crates/backend-aarch64/src/generated_native_selector_rules.rs | head -100 || true
            exit 1
          fi
          python3 -m unittest discover -s tools -p 'test_regen_aarch64_native_selector_rules.py' -v
          python3 tools/regen_aarch64_scalar_gp_forms.py --check
          python3 -m unittest discover -s tools -p 'test_regen_aarch64_scalar_gp_forms.py' -v
      - name: Warnings denied TypeId/shared x86 and AArch64 all targets
        working-directory: compiler
        run: |
          set -euo pipefail
          RUSTFLAGS="-D warnings" cargo check -p compiler-backend -p compiler-backend-aarch64 --all-targets
          cargo check -p compiler-backend-x86 --lib
          cargo test -p compiler-backend --lib -- --test-threads=1
          # Require the reviewed scaled base memory reuse and new fixed-SP ADD/SUB physical regressions explicitly as well as all A64 tests.
          cargo test -p compiler-backend-aarch64 --test generated_scalar_gp_forms reviewed_scaled_base_memory_reuses_20_existing_physical_forms -- --nocapture
          cargo test -p compiler-backend-aarch64 --test generated_scalar_gp_forms generated_sp_add_sub_match_independent_clang_and_chunk_alignment -- --nocapture
          cargo test -p compiler-backend-aarch64 --test generated_scalar_gp_forms generated_sp_direct_and_x16_fallback_sequences_remain_separate -- --nocapture
          cargo test -p compiler-backend-aarch64 --lib -- --test-threads=1
      - name: Verify shared selector and x86 native rule regression
        working-directory: compiler
        run: |
          set -euo pipefail
          cargo test -p compiler-backend-x86 --lib -- --test-threads=1
  real-native-aarch64:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: d51c52e812015b54a051179ce30bdbd08b8bc981
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Assert exact production source and isolate AArch64 workspace
        run: |
          set -euo pipefail
          test "$(uname -m)" = aarch64
          test "$(git -C compiler rev-parse HEAD)" = "d51c52e812015b54a051179ce30bdbd08b8bc981"
          cat > compiler/Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir", "crates/backend", "crates/backend-aarch64"]
          EOF
          rm -f compiler/Cargo.lock
          command -v cc
          command -v objcopy
      - name: Build production crate warnings denied
        working-directory: compiler
        run: |
          set -euo pipefail
          RUSTFLAGS="-D warnings" cargo check -p compiler-backend-aarch64 --all-targets
          # Clippy 1.100 adds style lints for unrelated existing integration tests.
          # Compile every test with -D warnings and execute all tests below;
          # keep Clippy strict on the production AArch64 library.
          cargo clippy -p compiler-backend-aarch64 --lib -- -D warnings
      - name: Run full native A64 compiled TypeId, ABI, CFG, C11, ELF/GAS and assembler oracles
        working-directory: compiler
        run: |
          set -euo pipefail
          cargo test -p compiler-backend-aarch64 --all-targets -- --test-threads=1 --nocapture
          echo 'PASS C2 reviewed base memory reuse and generated fixed-SP stack adjustment, source-pinned native A64 integer C11/ABI/ELF/GAS and shared x86 regressions' >> "$GITHUB_STEP_SUMMARY"
