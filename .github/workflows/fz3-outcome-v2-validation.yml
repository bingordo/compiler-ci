name: FZ-3 v2 trap history acceptance tests
on:
  push:
    branches: [ci/fz3-v2-trap-history-20261114]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  v2-history:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Run strict v2 outcome triage and existing v1 regressions
        run: |
          set -euo pipefail
          python3 -m py_compile tools/fz3_outcome_triage.py tests/test_fz3_outcome_triage.py
          python3 -m unittest discover -s tests -p 'test_fz3_*.py' -v
