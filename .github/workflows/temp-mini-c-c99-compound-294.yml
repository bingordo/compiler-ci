name: Temporary Mini-C C99 compound offsets 294
on:
  pull_request:
    paths: ['.github/workflows/temp-mini-c-c99-compound-294.yml']
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/mini-c
          ref: 05877cab9c0368806aa885b7c7022c7de8c73d51
          persist-credentials: false
      - run: git rev-parse HEAD
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/debug
          key: mini-c-native-ubuntu-compound-294
          restore-keys: |
            mini-c-native-
      - run: cargo test -p mini-c-cranelift
      - run: cargo clippy -p mini-c-cranelift --all-targets -- -D warnings
      - name: GCC differential runtime
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/compound.c" <<'EOF'
          int *p=(int[]){1,2,3}+1;
          struct S { int x; }; int *q=&((struct S[]){{4},{5}})[1].x;
          int *table[2]={(int[]){6,7}+1,(int[]){8,9}+1};
          int main(void) {
              return *p!=2 || *q!=5 || *table[0]!=7 || *table[1]!=9;
          }
          EOF
          gcc -std=c99 -pedantic-errors "$RUNNER_TEMP/compound.c" -o "$RUNNER_TEMP/gcc-compound"
          "$RUNNER_TEMP/gcc-compound"
          cargo run -q -p mini-c-cranelift -- --cpp=none --emit-obj "$RUNNER_TEMP/compound.o" "$RUNNER_TEMP/compound.c"
          gcc "$RUNNER_TEMP/compound.o" -o "$RUNNER_TEMP/mini-compound"
          "$RUNNER_TEMP/mini-compound"
          readelf -r "$RUNNER_TEMP/compound.o"
