name: LP1 GNU linker plugin ABI claim and resolution trace
on:
  push:
    branches: [ci/lp1-linker-plugin-trace-20261120]
    paths: ['.github/workflows/lp1-linker-plugin-trace-20261120.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lp1-trace:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      SOURCE_SHA: baed4f662c4c15c74ca8f143f04111c60f0c7b9f
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: baed4f662c4c15c74ca8f143f04111c60f0c7b9f
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Verify pinned compiler source and linker versions
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C compiler rev-parse HEAD)" = "$SOURCE_SHA"
          ld --version | head -1
          cc --version | head -1
          python3 --version
      - name: Install system GNU linker plugin C ABI
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq binutils-dev
          test -f /usr/include/plugin-api.h
      - name: Probe claim, linker-selected resolutions, native replacement and archive extraction
        working-directory: compiler
        run: python3 tools/test_lto_linker_plugin_probe.py
      - name: Check probe syntax and portable Python
        working-directory: compiler
        run: python3 -m py_compile tools/test_lto_linker_plugin_probe.py
