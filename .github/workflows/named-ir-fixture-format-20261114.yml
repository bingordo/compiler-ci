name: Human-readable TypeId native fixture
on:
  push:
    branches: [verify/named-ir-fixture-format-20261114]
    paths: ['.github/workflows/named-ir-fixture-format-20261114.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 8b0beb52604655a5e8a87e1419b84e6a6691e05f
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Verify source SHA
        run: test "$(git -C compiler rev-parse HEAD)" = "8b0beb52604655a5e8a87e1419b84e6a6691e05f"
      - name: Restrict workspace to IR/optimizer crates
        run: |
          cat > compiler/Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir", "crates/opt", "crates/backend", "crates/backend-x86"]
          EOF
          rm -f compiler/Cargo.lock
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: named-typeid-fixture-format
      - name: Test compact named SSA lowering, optimizer parity, and strict Clippy
        working-directory: compiler
        run: |
          cargo test -p compiler-ir --test native_fixture_text --test native_module_text_v3 --test native_module_comment_fixtures
          cargo test -p compiler-opt --test typed_cse --test typed_array_fold --test typed_local
          cargo test -p compiler-opt --test ir_fixture_directives --test ir_replay_cli
          cargo clippy -p compiler-ir --lib --test native_fixture_text -- -D warnings
          cargo clippy -p compiler-opt --test typed_cse --test typed_array_fold -- -D warnings
