# Verify IR/LTO order equivalence on the exact source commit; no compiler-repo CI.
name: IR PR2832 canonical LTO order
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ir-pr2832-lto-order-20261122.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lto-order:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      SOURCE_SHA: 0271e8474123407b869e30ddab9ef17e1808fd01
      CARGO_INCREMENTAL: '0'
      CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
    steps:
      - name: Checkout source pinned compiler PR
        uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: ${{ env.SOURCE_SHA }}
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Verify source and isolate core workspace
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C compiler rev-parse HEAD)" = "$SOURCE_SHA"
          cat > compiler/Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir", "crates/opt", "crates/backend", "crates/backend-x86", "crates/backend-aarch64"]
          EOF
          rm -f compiler/Cargo.lock
      - name: Cache isolated Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: ir-pr2832-lto-order
      - name: Verify LTO consumer and native codecs
        working-directory: compiler
        run: |
          set -euo pipefail
          cargo test -p compiler-ir --test lto_merge -- --nocapture
          cargo test -p compiler-ir --test native_binary_v1 -- --nocapture
          cargo test -p compiler-ir --test native_module_text_v3 -- --nocapture
      - name: Check strict Clippy
        working-directory: compiler
        run: |
          cargo clippy -p compiler-ir --test lto_merge -- -D clippy::all -A clippy::empty_line_after_doc_comments
