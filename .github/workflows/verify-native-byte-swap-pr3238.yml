name: Candidate native byte swap PR 3238
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/verify-native-byte-swap-pr3238.yml']
permissions:
  contents: read
jobs:
  candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 3f4a6cbd325e6e0936a1b9d3f9b61ee87f167932
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: bingordo/mini-c
          ref: b6437138d0ef26fb42d117220c94b228d98003bf
          path: mini-c
          persist-credentials: false
      - name: Exact sources
        run: |
          test "$(git -C compiler rev-parse HEAD)" = 3f4a6cbd325e6e0936a1b9d3f9b61ee87f167932
          test "$(git -C mini-c rev-parse HEAD)" = b6437138d0ef26fb42d117220c94b228d98003bf
          sed -i 's|ssh://git@github.com/bingordo/mini-c.git|https://github.com/bingordo/mini-c.git|g' compiler/tools/mini-c-driver/Cargo.toml
      - name: Check source builtin registry and constant evaluator
        run: cargo test --manifest-path mini-c/Cargo.toml -p mini-c-sema --lib
      - name: Check independent reference backend
        run: cargo check --manifest-path mini-c/Cargo.toml -p mini-c-cranelift
      - name: Run native byte-swap GCC differential
        run: cargo test --manifest-path compiler/tools/mini-c-driver/Cargo.toml --test builtin_byte_swap -- --nocapture
      - name: Check libc byteswap header source admission
        run: |
          printf '#include <byteswap.h>\nunsigned short f(unsigned short x) { return bswap_16(x); }\n' > "$RUNNER_TEMP/header.c"
          gcc -E -P "$RUNNER_TEMP/header.c" -o "$RUNNER_TEMP/header.i.c"
          compiler/tools/mini-c-driver/target/debug/compiler-mini-c "$RUNNER_TEMP/header.i.c" --emit obj -o "$RUNNER_TEMP/header.o"
