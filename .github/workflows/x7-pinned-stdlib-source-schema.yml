name: X7 inspect pinned Intel standard-library definition XML schema
on:
  push:
    branches: [ci/x7-intel-stdlib-schema-inspect-20261111]
permissions:
  contents: read
jobs:
  inspect-pinned-stdlib:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Download exact Intel SDM upstream snapshot
        run: |
          set -euo pipefail
          rev=35eface1b7ee003a1cda95005ec5fd83de658a64
          curl --fail --silent --show-error --location --retry 2 --max-time 180 \
            "https://codeload.github.com/intel/SDM/tar.gz/${rev}" -o /tmp/intel.tar.gz
      - name: Inspect stdlib definition schema and provenance without asserting proof
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import gzip,hashlib,tarfile,collections
          import xml.etree.ElementTree as ET
          with tarfile.open('/tmp/intel.tar.gz','r:gz') as tar:
              members=[x for x in tar if x.isfile() and x.name.endswith('/data/definitions.xml.gz')]
              assert len(members)==1
              raw=tar.extractfile(members[0]).read()
          assert 0<len(raw)<20*1024*1024
          decoded=gzip.decompress(raw)
          assert len(decoded)<50*1024*1024
          print('X7_INTEL_STDLIB_GZIP',{'raw_bytes':len(raw),'xml_bytes':len(decoded),
              'compressed_sha256':hashlib.sha256(raw).hexdigest(),
              'decompressed_sha256':hashlib.sha256(decoded).hexdigest()})
          root=ET.fromstring(decoded)
          print('X7_INTEL_STDLIB_ROOT',root.tag,root.attrib)
          print('X7_INTEL_STDLIB_CHILD_TAGS',collections.Counter(x.tag for x in root))
          for x in list(root)[:9]:
              print('X7_INTEL_STDLIB_SAMPLE',{'tag':x.tag,'attributes':x.attrib,
                  'children':[{'tag':y.tag,'attributes':y.attrib,
                               'text':(y.text or '').strip()[:120]}
                              for y in list(x)[:16]]})
          PY
