# Temporary compiler-ci S23.50 shadow-parity compile defect acceptance. Do not merge.
name: S23.50 shadow parity exhaustive match audit
on:
  push:
    branches: [ci/s2350-shadow-parity-audit-20261115]
    paths: [.github/workflows/s2350-shadow-parity-audit-20261115.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  shadow-parity:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      SOURCE_SHA: e5d19a9816364d89783f6b26c536d691bdef4373
      CARGO_INCREMENTAL: '0'
    steps:
      - name: Checkout exact compiler SHA
        uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: e5d19a9816364d89783f6b26c536d691bdef4373
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Verify SHA and isolate optimizer workspace
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C compiler rev-parse HEAD)" = "$SOURCE_SHA"
          cat > compiler/Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir", "crates/opt"]
          EOF
          rm -f compiler/Cargo.lock
          rustc --version
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: s2350-shadow-parity-audit
      - name: S23.50 parity test
        working-directory: compiler
        run: cargo test -p compiler-opt --test native_s2350_shadow_parity -- --nocapture
      - name: Audit stale legacy compiler backend imports
        working-directory: compiler
        run: |
          set -euo pipefail
          if git grep -n -F 'compiler_backend::Backend' -- crates/opt/tests; then
            echo "::error::stale cross-target Backend import in optimizer tests"
            exit 1
          fi
      - name: Optimizer all-target compilation
        working-directory: compiler
        run: cargo check -p compiler-opt --all-targets
      - name: Affected optimizer integration oracles
        working-directory: compiler
        run: |
          set -euo pipefail
          cargo test -p compiler-opt --test native_s2350_migration_batch -- --nocapture
          cargo test -p compiler-opt --test if_conversion_typeid_x86 -- --nocapture
          cargo test -p compiler-opt --test if_conversion_typeid_multimerge -- --nocapture
      - name: S23.34 both generated-on and handwritten-only tests
        working-directory: compiler
        run: |
          set -euo pipefail
          cargo test -p compiler-opt --test generated_native_additive_pair_cancellation_s2334 -- --nocapture
          cargo test -p compiler-opt --no-default-features --test generated_native_additive_pair_cancellation_s2334 -- --nocapture
      - name: Complement-DAG convergence generated and handwritten
        working-directory: compiler
        run: |
          set -euo pipefail
          cargo test -p compiler-opt --test generated_native_complement_dag -- --nocapture
          cargo test -p compiler-opt --no-default-features --test generated_native_complement_dag -- --nocapture
      - name: Generated rule near-miss and phase-profile focused regressions
        working-directory: compiler
        run: |
          set -euo pipefail
          for name in generated_native_complement_xor_pair_s2342 generated_native_matchpd_boolean_factor_s2314 generated_native_matchpd_pairwise_s2319 native_s2316_profile native_s2350_gcc_boolean_batch; do
            cargo test -p compiler-opt --test "$name" -- --nocapture
          done
          for name in generated_native_complement_xor_pair_s2342 generated_native_matchpd_boolean_factor_s2314 generated_native_matchpd_pairwise_s2319 native_s2316_profile; do
            cargo test -p compiler-opt --no-default-features --test "$name" -- --nocapture
          done
      - name: Full compiler-opt regression suite
        working-directory: compiler
        run: cargo test -p compiler-opt --no-fail-fast -- --test-threads=2
      - name: Optimizer library Clippy
        working-directory: compiler
        run: cargo clippy -p compiler-opt --lib -- -D warnings
