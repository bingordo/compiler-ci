name: AArch64 and RV64 native selector source inventory audit
on:
  pull_request:
    paths: ['.github/workflows/verify-aarch64-rv64-source-inventory.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reviewed-selector-inventory:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact compiler candidate
        uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: c53616bfff43a5b5041bc8cb922ccc5386abec01
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Require pinned compiler commit
        run: test "$(git -C compiler rev-parse HEAD)" = "c53616bfff43a5b5041bc8cb922ccc5386abec01"
      - name: Validate exact generated tables and all reviewed source-mutation tests
        working-directory: compiler
        run: |
          set -euo pipefail
          export PYTHONPATH="$PWD/tools"
          python3 tools/regen_aarch64_native_selector_rules.py --check
          python3 tools/regen_riscv_native_selector_rules.py --check
          python3 -m unittest discover -s tools -p test_regen_aarch64_native_selector_rules.py -v
          python3 -m unittest discover -s tools -p test_riscv_native_selector_rules.py -v
          python3 -m unittest discover -s tools -p test_ranked_generator_index.py -v
