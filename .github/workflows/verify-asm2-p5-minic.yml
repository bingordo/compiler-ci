name: ASM2 P5 checked GP operand frontend
on:
  push:
    branches: [main]
    paths: ['.github/workflows/verify-asm2-p5-minic.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  operand-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/mini-c
          ref: 74102f04b25d64cac1cebe9454f9a7ef3104326d
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Verify exact source
        run: test "$(git rev-parse HEAD)" = '74102f04b25d64cac1cebe9454f9a7ef3104326d'
      - uses: Swatinem/rust-cache@v2
        with:
          key: asm2-p5-minic
      - name: Test all Mini-C frontend consumers, constraints and strict lint
        run: |
          set -euo pipefail
          cargo test --workspace
          cargo clippy --workspace --all-targets -- -D warnings
          echo "ASM2_P5_MINIC_FRONT=PASS source=74102f04b25d64cac1cebe9454f9a7ef3104326d" >> "$GITHUB_STEP_SUMMARY"
