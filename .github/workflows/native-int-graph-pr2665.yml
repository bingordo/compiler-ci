name: Validate declarative native-int SSA graphs PR2665
on:
  pull_request:
    paths:
      - '.github/workflows/native-int-graph-pr2665.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  graph-descriptions:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      CARGO_INCREMENTAL: '0'
      SOURCE_SHA: 27bd660cf8a5ce64c464b8de94923f04114b7177
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 27bd660cf8a5ce64c464b8de94923f04114b7177
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Verify exact source and isolate optimizer workspace
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C compiler rev-parse HEAD)" = "$SOURCE_SHA"
          cat > compiler/Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir", "crates/opt", "crates/backend", "crates/backend-x86"]
          EOF
          rm -f compiler/Cargo.lock
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: native-int-seeded-generator
      - name: Full historical three-suite generated differential and rollback tests
        working-directory: compiler
        shell: bash
        run: |
          set -euo pipefail
          cargo test -p compiler-opt --test generated_native_matchpd_subset_s2318 -- --nocapture
          cargo test -p compiler-opt --test generated_native_complement_pair_s2325 -- --nocapture
          cargo test -p compiler-opt --test generated_native_bitwise_comparison_s2321 -- --nocapture
      - name: Focused Clippy with existing upstream lint exemptions
        working-directory: compiler
        run: cargo clippy -p compiler-opt --test generated_native_matchpd_subset_s2318 --test generated_native_complement_pair_s2325 --test generated_native_bitwise_comparison_s2321 -- -D warnings -A dead-code -A clippy::empty-line-after-doc-comments -A unused-imports -A clippy::too-many-arguments
