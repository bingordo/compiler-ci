name: ASM merge baseline check on untouched compiler main
on:
  push:
    branches: [ci/asm-merge-gate]
    paths: ['.github/workflows/asm-main-baseline.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  baseline-x86:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 4983d44542b1ed770ed004f7c6e27de7e4744b23
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Verify exact unmodified baseline
        run: git rev-parse HEAD
      - name: Isolate compiler core workspace
        run: |
          cat > Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir", "crates/opt", "crates/backend", "crates/backend-x86"]
          EOF
          rm -f Cargo.lock
      - uses: Swatinem/rust-cache@v2
        with:
          key: asm-merge-baseline
      - name: Reproduce unrelated s2342 x86 test failure on current main
        run: cargo test -p compiler-backend-x86 --test native_s2342_xor_complements -- --nocapture
      - name: Baseline strict Clippy with unmodified x86 code
        if: always()
        run: cargo clippy -p compiler-backend-x86 --all-targets -- -D warnings
