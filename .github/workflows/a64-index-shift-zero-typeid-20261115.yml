name: AArch64 fixed TypeId index shift and zero-branch fixtures
on:
  push:
    branches: [verify/a64-index-shift-zero-typeid-20261115]
    paths: ['.github/workflows/a64-index-shift-zero-typeid-20261115.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: fb0053d4f7d3b6ed21cfa6e43e4b58ce1dec1a6b
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Check exact compiler SHA
        run: test "$(git -C compiler rev-parse HEAD)" = "fb0053d4f7d3b6ed21cfa6e43e4b58ce1dec1a6b"
      - name: Restrict core workspace
        run: |
          cat > compiler/Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir", "crates/backend", "crates/backend-aarch64"]
          EOF
          rm -f compiler/Cargo.lock
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: a64-index-shift-zero-typeid
      - name: Install AArch64 GCC glibc cross headers and QEMU
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends gcc-aarch64-linux-gnu libc6-dev-arm64-cross binutils-aarch64-linux-gnu qemu-user
      - name: Validate original double-index shift and CBZ C11 oracles under QEMU
        working-directory: compiler
        env:
          COMPILER_REQUIRE_AARCH64_QEMU: "1"
        run: |
          cargo test -p compiler-backend-aarch64 --test double_index_store_native --test extended_scaled_native --test logical_shifted_native --test zero_branch_native -- --nocapture
      - name: Validate neighboring TypeId tests native parser and strict Clippy
        working-directory: compiler
        run: |
          cargo test -p compiler-backend-aarch64 --test adds_loop_native --test compare_immediate_branch_native
          cargo test -p compiler-ir --test native_fixture_text --test native_module_text_v3
          cargo clippy -p compiler-backend-aarch64 --no-deps --test double_index_store_native --test extended_scaled_native --test logical_shifted_native --test zero_branch_native -- -D warnings
