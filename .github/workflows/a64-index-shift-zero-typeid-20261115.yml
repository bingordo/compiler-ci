name: AArch64 fixed TypeId index shift and zero-branch fixtures
on:
  push:
    branches: [verify/a64-index-shift-zero-typeid-20261115]
    paths: ['.github/workflows/a64-index-shift-zero-typeid-20261115.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 1a43de961e28a9a1c694c06281329921bb8337c5
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Check exact compiler SHA
        run: test "$(git -C compiler rev-parse HEAD)" = "1a43de961e28a9a1c694c06281329921bb8337c5"
      - name: Restrict core workspace
        run: |
          cat > compiler/Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir", "crates/backend", "crates/backend-aarch64"]
          EOF
          rm -f compiler/Cargo.lock
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: a64-index-shift-zero-typeid
      - name: Export original four native TypeId instruction corpora
        working-directory: compiler
        run: |
          cargo test -p compiler-backend-aarch64 --test double_index_store_native temporary_export_original_a64_fixed_instruction_graphs -- --nocapture
          cargo test -p compiler-backend-aarch64 --test extended_scaled_native temporary_export_original_a64_fixed_instruction_graphs -- --nocapture
          cargo test -p compiler-backend-aarch64 --test logical_shifted_native temporary_export_original_a64_fixed_instruction_graphs -- --nocapture
          cargo test -p compiler-backend-aarch64 --test zero_branch_native temporary_export_original_a64_fixed_instruction_graphs -- --nocapture
