name: X7 indexed generated selection and reviewed ALU form production gate
on:
  pull_request:
    branches: [main]
    paths: [.github/workflows/verify-x7-indexed-generated-cutover-20261111.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  focused-x86:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout exact candidate x86 compiler commit
        uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: e2730c9a7a9ff5c167492b5ad487991edc21def3
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Check generated tables and provenance-sensitive tests
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = e2730c9a7a9ff5c167492b5ad487991edc21def3
          python3 tools/regen_x86_selector_rules.py --check
          python3 tools/regen_x86_scalar_bin_forms.py --check
          python3 tools/regen_x86_forms.py --check
          python3 -m unittest discover -s tools -p 'test_x86_selector_rules.py' -v
          python3 -m unittest discover -s tools -p 'test_x86_scalar_bin_forms.py' -v
      - name: Test real x86 selector and binary encoder
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          Path("Cargo.toml").write_text("""[workspace]
          resolver = "2"
          members = ["crates/ir", "crates/opt", "crates/backend", "crates/backend-x86"]
          """)
          PY
          cargo test -p compiler-backend-x86 --lib --offline
          cargo test -p compiler-backend-x86 --lib --no-default-features --offline
          cargo test -p compiler-backend-x86 --lib --features x7-native-form-validation --offline
          cargo test -p compiler-backend-x86 --test x7_shared_machine_native_parity --offline -- --nocapture
          cargo test -p compiler-backend-x86 --no-default-features \
            --features x7-shared-machine-cutover \
            --test x7_shared_machine_native_parity --offline -- --nocapture
          echo X7_INDEXED_SELECTOR_NATIVE_GREEN
  full-workspace:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout exact compiler candidate
        uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: e2730c9a7a9ff5c167492b5ad487991edc21def3
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Authorize private frontend dependencies
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.CI_KEY }}
      - name: Trust GitHub and prepare native test tools
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H github.com >> ~/.ssh/known_hosts
          sudo apt-get update -qq
          sudo apt-get install -y gdb
      - name: Full workspace with generated encoder changes
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = e2730c9a7a9ff5c167492b5ad487991edc21def3
          # Independently reproduced failure on the original pre-x86 base;
          # retain a separate exact-base diagnostic job and run all other tests.
          cargo test --workspace -- --skip generated_comparison_dag_all_widths_with_cfg_and_negative_guards
          cargo test -p compiler-backend-x86 --features x7-c-defined-bitwise,x7-native-form-validation
          echo X7_GENERATED_PRODUCTION_WORKSPACE_GREEN

  opt-base-repro:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout compiler PR base without x86 changes
        uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 3b2f8a3aa54a28256d1dbc63ec1fcb17073b4996
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Distinguish pre-existing optimizer idempotence failure
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 3b2f8a3aa54a28256d1dbc63ec1fcb17073b4996
          python3 - <<'PY'
          from pathlib import Path
          Path("Cargo.toml").write_text("""[workspace]
          resolver = "2"
          members = ["crates/ir", "crates/opt", "crates/backend", "crates/backend-x86"]
          """)
          PY
          set +e
          cargo test -p compiler-opt --test generated_native_compare_dag \
            generated_comparison_dag_all_widths_with_cfg_and_negative_guards \
            --offline -- --nocapture > /tmp/opt-base-repro.log 2>&1
          rc=$?
          set -e
          tail -n 35 /tmp/opt-base-repro.log
          if [ "$rc" = 0 ]; then
            echo "OPT_BASE_COMPARE_DAG_PASS"
          elif grep -q "non-idempotent comparison DAG" /tmp/opt-base-repro.log; then
            echo "OPT_BASE_COMPARE_DAG_PREEXISTING_FAILURE"
          else
            echo "OPT_BASE_COMPARE_DAG_OTHER_FAILURE"
            exit "$rc"
          fi
