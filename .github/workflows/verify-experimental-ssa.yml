name: Verify prebuilt experimental SSA tests
on:
  workflow_dispatch:
    inputs:
      expected_source_sha:
        description: 'Expected 40-character compiler source SHA (optional)'
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: experimental-ssa-prebuilt
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: expr-rule-gen-binaries
          path: private-binary
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
          sparse-checkout: |
            dist/experimental-ssa
      - name: Check provenance and unpack
        shell: bash
        run: |
          set -euo pipefail
          cd private-binary/dist/experimental-ssa
          grep -Eq '^[0-9a-f]{40}$' source-sha.txt
          expected="${{ inputs.expected_source_sha }}"
          if [ -n "$expected" ]; then
            grep -Eq '^[0-9a-f]{40}$' <<< "$expected"
            test "$(cat source-sha.txt)" = "$expected"
          fi
          sha256sum -c sha256.txt
          mkdir -p "$RUNNER_TEMP/experimental-ssa"
          tar -xzf experimental-ssa-linux-x86_64.tar.gz -C "$RUNNER_TEMP/experimental-ssa"
          test -x "$RUNNER_TEMP/experimental-ssa/experimental-ssa-tests"
      - name: Run experimental generated-rule and algebra tests
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/experimental-ssa/experimental-ssa-tests" experimental_generated_rules
          "$RUNNER_TEMP/experimental-ssa/experimental-ssa-tests" algebra::tests
