name: CT-10 all module and scalar verifier calls attributed
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/ct10-module-verify-stage-gate.yml'
permissions:
  contents: read
concurrency:
  group: ct10-module-verify-stage-gate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  mini-c:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: '21499bf458b76fecc81d6045df8801c7bca745eb'
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Record pinned compiler and runner
        shell: bash
        run: |
          mkdir -p results
          git -C compiler rev-parse HEAD | tee results/sha-mini-c.txt
          rustc --version | tee results/rust-mini-c.txt
          git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler/tools/mini-c-driver -> target
          key: ct10-real-mini-c-verify
      - name: Verify real checked Mini-C stage counts and output equivalence
        shell: bash
        run: |
          set -euo pipefail
          cargo test --release --manifest-path compiler/tools/mini-c-driver/Cargo.toml -p compiler-mini-c --lib --features ct10-verifier-source-profile ct10_real_mini_c_legacy_verifier_stage_counts -- --nocapture 2>&1 | tee results/mini-c.log
          grep CT10_REAL_SOURCE results/mini-c.log | tee -a "$GITHUB_STEP_SUMMARY"
          test "$(grep -c CT10_REAL_SOURCE results/mini-c.log)" -eq 2
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ct10-real-mini-c-verifier-counts
          path: results/
  oberon:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: '21499bf458b76fecc81d6045df8801c7bca745eb'
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Record pinned compiler and runner
        shell: bash
        run: |
          mkdir -p results
          git -C compiler rev-parse HEAD | tee results/sha-oberon.txt
          rustc --version | tee results/rust-oberon.txt
          git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: ct10-real-oberon-verify
      - name: Verify real checked Oberon stage counts and output equivalence
        shell: bash
        run: |
          set -euo pipefail
          cargo test --release --manifest-path compiler/Cargo.toml -p compiler --bin compiler --features ct10-verifier-source-profile ct10_real_oberon_legacy_verifier_stage_counts -- --nocapture 2>&1 | tee results/oberon.log
          grep CT10_REAL_SOURCE results/oberon.log | tee -a "$GITHUB_STEP_SUMMARY"
          test "$(grep -c CT10_REAL_SOURCE results/oberon.log)" -eq 2
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ct10-real-oberon-verifier-counts
          path: results/
