# One-off exact source validation; close PR unmerged after verification.
name: IR PR3704 reducer canonical replay
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/ir-pr3704-reducer-replay.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ir-pr3704-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native-reducer:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      COMPILER_SHA: 6b40360f8b38605ad20d4bccdfbdf6f4b6b64836
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: ${{ env.COMPILER_SHA }}
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Check exact source and isolate optimizer workspace
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C compiler rev-parse HEAD)" = "$COMPILER_SHA"
          echo "Verified compiler candidate: $COMPILER_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo 'Remaining serialization aliases and legacy graph callers:'
          git -C compiler grep -n -E 'typed_ssa_text|read_typed_ssa|write_typed_ssa|project_legacy_compat_function|ModuleSnapshot' -- '*.rs' '*.toml' '*.py' || test "$?" -eq 1
          cat > compiler/Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir", "crates/opt"]
          EOF
          rm -f compiler/Cargo.lock
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: ir-pr3704-opt-reducer
      - name: Focused canonical replay, optimizer tests and target compilation
        working-directory: compiler
        shell: bash
        run: |
          set -euo pipefail
          cargo test -p compiler-opt --test typeid_delta_canonical_replay
          cargo test -p compiler-opt --lib
          cargo check -p compiler-opt --all-targets
      - name: Strict scoped Clippy
        working-directory: compiler
        shell: bash
        run: |
          set -euo pipefail
          cargo clippy -p compiler-opt --lib -- -D warnings -A dead_code -A clippy::too_many_arguments
