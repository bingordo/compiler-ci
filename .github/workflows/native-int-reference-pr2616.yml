name: Validate independent native-int SSA evaluator PR2616
on:
  pull_request:
    paths:
      - '.github/workflows/native-int-reference-pr2616.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reference-evaluator:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_INCREMENTAL: '0'
      SOURCE_SHA: 031593ab0b43289ccebced4ad4a34ae14aa6cac4
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 031593ab0b43289ccebced4ad4a34ae14aa6cac4
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Verify exact source and isolate optimizer
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C compiler rev-parse HEAD)" = "$SOURCE_SHA"
          cat > compiler/Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir", "crates/opt", "crates/backend", "crates/backend-x86"]
          EOF
          rm -f compiler/Cargo.lock
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: native-int-seeded-generator
      - name: Run four original source-pinned differential suites
        working-directory: compiler
        shell: bash
        run: |
          set -euo pipefail
          cargo test -p compiler-opt --test generated_native_bitwise_comparison_s2321 -- --nocapture
          cargo test -p compiler-opt --test generated_native_disjoint_arithmetic_s2323 -- --nocapture
          cargo test -p compiler-opt --test generated_native_reverse_carry_s2330 -- --nocapture
          cargo test -p compiler-opt --test generated_native_additive_pair_cancellation_s2334 -- --nocapture
      - name: Focused lint with known unrelated x86 warnings exempt
        working-directory: compiler
        run: cargo clippy -p compiler-opt --test generated_native_bitwise_comparison_s2321 --test generated_native_disjoint_arithmetic_s2323 --test generated_native_reverse_carry_s2330 --test generated_native_additive_pair_cancellation_s2334 -- -D warnings -A dead-code -A clippy::empty-line-after-doc-comments
