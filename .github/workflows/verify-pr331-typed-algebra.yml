# One-shot exact-SHA regression for compiler PR #331; isolated branch.
name: Verify PR331 typed algebra exact SHA
on:
  push:
    branches: [ci/pr331-ir-algebra]
  pull_request:
    paths: ['.github/workflows/verify-pr331-typed-algebra.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 25a7d1948d285883f77240874d1d2ae88695bc34
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Confirm immutable source revision
        run: test "$(git -C compiler rev-parse HEAD)" = "25a7d1948d285883f77240874d1d2ae88695bc34"
      - name: Make core workspace self-contained
        run: |
          cat > compiler/Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir", "crates/opt", "crates/backend", "crates/backend-x86"]
          EOF
          rm -f compiler/Cargo.lock
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: typed-algebra-pr331
          cache-workspace-crates: 'true'
      - name: Focused TypeId algebra and legacy affine regression
        working-directory: compiler
        run: cargo test -p compiler-opt --test typed_algebra --test affine_cancellation
      - name: Complete self-contained IR optimizer backend and native suites
        working-directory: compiler
        run: cargo test -p compiler-ir -p compiler-opt -p compiler-backend -p compiler-backend-x86
      - name: Strict optimizer Clippy
        working-directory: compiler
        run: cargo clippy -p compiler-opt --all-targets -- -D warnings
