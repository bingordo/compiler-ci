name: X7 3179 exact BSF hardware dependencies
on:
  pull_request:
    paths:
      - '.github/workflows/x7-3179-bsf-dependency.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  focused:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 789a4a7c90988d7c8b91b37c7610fccebc82db42
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Verify candidate SHA
        run: test "$(git -C compiler rev-parse HEAD)" = "789a4a7c90988d7c8b91b37c7610fccebc82db42"
      - name: Importer tests
        working-directory: compiler
        run: python3 -m unittest discover -s tools -p 'test_x86*latenc*.py'
      - name: Focused backend integration
        working-directory: compiler
        run: cargo test -p compiler-backend-x86 --test x7_measured_bsf_dependencies
      - name: Backend checks
        working-directory: compiler
        run: cargo check -p compiler-backend-x86 && cargo check -p compiler-backend-x86 --no-default-features
  exact-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 789a4a7c90988d7c8b91b37c7610fccebc82db42
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Check exact candidate and pinned upstream data
        run: |
          set -euo pipefail
          test "$(git -C compiler rev-parse HEAD)" = "789a4a7c90988d7c8b91b37c7610fccebc82db42"
          curl -fL --retry 2 --max-time 600 https://uops.info/instructions.xml -o instructions.xml
          test "$(sha256sum instructions.xml | cut -d' ' -f1)" = "e5e702caaf04c4fc1f75192a9bbe4d8554b3e174f7933a14d124cc33ca677ab3"
          cd compiler
          python3 tools/regen_x86_operand_latencies.py --xml ../instructions.xml --check
