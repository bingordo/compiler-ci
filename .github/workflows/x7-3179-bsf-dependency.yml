name: X7 3179 exact BSF hardware dependencies
on:
  pull_request:
    paths:
      - '.github/workflows/x7-3179-bsf-dependency.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  focused:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 49e4f418b815f34beb135b78f4b5e6b8827e2ffe
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Verify candidate SHA
        run: test "$(git -C compiler rev-parse HEAD)" = "49e4f418b815f34beb135b78f4b5e6b8827e2ffe"
      - name: Importer tests
        working-directory: compiler
        run: python3 -m unittest discover -s tools -p 'test_x86*latenc*.py'
      # Checkout's temporary SSH key is removed after checkout. The pinned
      # Mini-C/Oberon git crate dependencies are public, so fetch them over
      # HTTPS instead of relying on that temporary key.
      - name: Resolve public Cargo git dependencies over HTTPS
        run: |
          git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
          git config --global --add url."https://github.com/".insteadOf "git@github.com:"
      - name: Focused backend integration
        working-directory: compiler
        env:
          CARGO_NET_GIT_FETCH_WITH_CLI: "true"
        run: cargo test -p compiler-backend-x86 --test x7_measured_bsf_dependencies
      - name: Backend checks
        working-directory: compiler
        env:
          CARGO_NET_GIT_FETCH_WITH_CLI: "true"
        run: cargo check -p compiler-backend-x86 && cargo check -p compiler-backend-x86 --no-default-features
  exact-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 49e4f418b815f34beb135b78f4b5e6b8827e2ffe
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Check exact candidate and pinned upstream data
        run: |
          set -euo pipefail
          test "$(git -C compiler rev-parse HEAD)" = "49e4f418b815f34beb135b78f4b5e6b8827e2ffe"
          curl -fL --retry 2 --max-time 600 https://uops.info/instructions.xml -o instructions.xml
          test "$(sha256sum instructions.xml | cut -d' ' -f1)" = "e5e702caaf04c4fc1f75192a9bbe4d8554b3e174f7933a14d124cc33ca677ab3"
          cd compiler
          python3 - <<'PY'
          import json,xml.etree.ElementTree as ET
          from pathlib import Path
          from sys import path
          path.insert(0,"tools")
          from x86_latency_sources import reviewed_variant_matches
          ids=json.loads(Path("data/x86_uops_variant_mapping.json").read_text())["forms"]
          names=("BSF_R_R_32","BSF_R_R_64")
          for _,inst in ET.iterparse("../instructions.xml",events=("end",)):
              if inst.tag!="instruction":continue
              for name in reviewed_variant_matches(inst,names,ids):
                  print("FORM",name,"OPERANDS",[x.attrib for x in inst.findall("operand")],flush=True)
                  for arch in inst.findall("architecture"):
                      if arch.get("name") in ("SKL","ZEN4"):
                          print("CPU",arch.get("name"),"LATENCIES",[x.attrib for m in arch.findall("measurement") for x in m.findall("latency")],flush=True)
              inst.clear()
          PY
          python3 tools/regen_x86_operand_latencies.py --xml ../instructions.xml --check
