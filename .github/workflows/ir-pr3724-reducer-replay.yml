# One-off exact source validation; close PR unmerged after verification.
name: IR PR3724 native text retirement
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/ir-pr3724-reducer-replay.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ir-pr3724-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native-text:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      COMPILER_SHA: e418bbd66c8540357655ba3a957f3a17913e43f7
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: ${{ env.COMPILER_SHA }}
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Check exact source and isolate optimizer workspace
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C compiler rev-parse HEAD)" = "$COMPILER_SHA"
          echo "Verified compiler candidate: $COMPILER_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo 'Retired Rust API inventory (must be empty):'
          if git -C compiler grep -n -E 'typed_ssa_text|read_typed_ssa|write_typed_ssa' -- '*.rs'; then exit 1; else test "$?" -eq 1; fi
          echo 'Other tracked source references:'
          git -C compiler grep -n -E 'typed_ssa_text|read_typed_ssa|write_typed_ssa' -- '*.toml' '*.py' '*.sh' '*.yml' '*.yaml' || test "$?" -eq 1
          cat > compiler/Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir", "crates/opt"]
          EOF
          rm -f compiler/Cargo.lock
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: ir-pr3704-opt-reducer
      - name: Focused canonical replay, optimizer tests and target compilation
        working-directory: compiler
        shell: bash
        run: |
          set -euo pipefail
          cargo check -p compiler-ir -p compiler-opt --all-targets
          cargo test -p compiler-ir --test typed_ssa_body
          cargo test -p compiler-opt --no-fail-fast --test typed_core_pipeline --test typed_native_parity --test alive_lite --test delta_reduce_ir --test typed_algebra --test typed_core_inline_integration --test typed_ctfe --test typed_global_memory --test typed_if_conversion_pure --test typed_induction_native --test typed_inline_cfg_native --test typed_inline_leaf_native --test typed_inline_memory_native --test typed_inline_wide_void_native --test typed_licm_native --test typed_mem2reg --test typed_phi_cfg --test typed_phi_dead_linear --test typed_pre_native --test typeid_delta_dominance --test typeid_fuzz_bias --test typeid_fuzz_corpus_reduce --test typeid_fuzz_interactions --test typeid_fuzz_licm_identical_targeted --test typeid_fuzz_local_cfg_targeted --test typeid_fuzz_memory_cfg_targeted --test typeid_fuzz_pre_induction_targeted --test typeid_fuzz_promotion_stages --test typeid_fuzz_targeted --test typeid_native_campaign --test typeid_native_memory_call --test typeid_native_reference_ddmin --test typeid_native_trap_differential
      - name: Strict scoped Clippy
        working-directory: compiler
        shell: bash
        run: |
          set -euo pipefail
          cargo clippy -p compiler-ir -p compiler-opt --all-targets --no-deps -- -D warnings
