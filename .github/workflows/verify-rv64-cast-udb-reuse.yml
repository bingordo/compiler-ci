name: RV64 validated UDB cast reuse and exact Rust parity
on:
  pull_request:
    paths: ['.github/workflows/verify-rv64-cast-udb-reuse.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rv64-cast-reuse:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout immutable compiler candidate
        uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 65978e2cf74191d5e7512e5a1d11fbebf5a2d92b
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Assert exact source commit
        run: test "$(git -C compiler rev-parse HEAD)" = "65978e2cf74191d5e7512e5a1d11fbebf5a2d92b"
      - name: Verify RV64 generated selector Rust is identical
        working-directory: compiler
        run: |
          set -euo pipefail
          export PYTHONPATH="$PWD/tools"
          python3 tools/regen_riscv_native_selector_rules.py --check
          python3 tools/regen_aarch64_native_selector_rules.py --check
          python3 tools/regen_x86_selector_rules.py --check
      - name: Verify reviewed RV64 leaf encoder byte parity
        working-directory: compiler
        run: |
          set -euo pipefail
          export PYTHONPATH="$PWD/tools"
          python3 tools/riscv_udb_rust_leaf_forms.py --catalog data/riscv_udb_r0_catalog.json --output crates/backend-riscv64/src/generated_encoding.rs --check
      - name: Run UDB source, cast, leaf and ranked-index mutation tests
        working-directory: compiler
        run: |
          set -euo pipefail
          export PYTHONPATH="$PWD/tools"
          python3 -m unittest discover -s tools -p test_riscv_native_selector_rules.py -v
          python3 -m unittest discover -s tools -p test_riscv_udb_rust_leaf_forms.py -v
          python3 -m unittest discover -s tools -p test_ranked_generator_index.py -v
