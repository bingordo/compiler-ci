name: TypeId inliner non-generated checked source controls
on:
  push:
    branches: [main]
    paths: [.github/workflows/verify-typeid-inline-real-leaves-20261108.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mini-c-real-leaves:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 1669f547d50d6ef1fc0f216d059dff2697bb8701
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: bingordo/mini-c
          ref: 57c81b38386cc34f95c5928eb4410ea6dacd8df7
          path: mini-c
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Verify exact frontend and compiler sources
        run: |
          test "$(git -C compiler rev-parse HEAD)" = "1669f547d50d6ef1fc0f216d059dff2697bb8701"
          test "$(git -C mini-c rev-parse HEAD)" = "57c81b38386cc34f95c5928eb4410ea6dacd8df7"
          git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler/tools/mini-c-driver -> target
          key: typeid-real-musl-inliner-20261108
      - name: Checked upstream musl C source to original TypeId SSA
        working-directory: compiler
        shell: bash
        run: |
          set -euo pipefail
          export TYPEID_REAL_C_FIXTURES="$GITHUB_WORKSPACE/mini-c/tests/fixtures/musl-s9"
          cargo test --manifest-path tools/mini-c-driver/Cargo.toml --release --features experimental-fusion-benchmark --test typeid_source_inline_profile source_checked_musl_c_library_noop -- --ignored --nocapture 2>&1 | tee "$RUNNER_TEMP/typeid-real-minic.log"
          grep 'TYPEID_REAL_MINIC_NOOP' "$RUNNER_TEMP/typeid-real-minic.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: typeid-real-minic-noop
          path: ${{ runner.temp }}/typeid-real-minic.log
          if-no-files-found: ignore

  oberon-real-examples:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 1669f547d50d6ef1fc0f216d059dff2697bb8701
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Verify exact source and configure pinned frontend dependencies
        run: |
          test "$(git -C compiler rev-parse HEAD)" = "1669f547d50d6ef1fc0f216d059dff2697bb8701"
          git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: typeid-real-oberon-inliner-20261108
      - name: Checked non-generated Oberon repository examples to TypeId SSA
        working-directory: compiler
        shell: bash
        run: |
          set -euo pipefail
          cargo test --release -p compiler --bin compiler source_checked_oberon_repository_examples_noop -- --ignored --nocapture 2>&1 | tee "$RUNNER_TEMP/typeid-real-oberon.log"
          grep 'TYPEID_REAL_OBERON_NOOP' "$RUNNER_TEMP/typeid-real-oberon.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: typeid-real-oberon-noop
          path: ${{ runner.temp }}/typeid-real-oberon.log
          if-no-files-found: ignore
