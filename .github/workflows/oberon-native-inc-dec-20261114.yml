name: Oberon native INC DEC differential
on:
  push:
    paths:
      - '.github/workflows/oberon-native-inc-dec-20261114.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-inc-dec:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
      CARGO_INCREMENTAL: '0'
    steps:
      - name: Checkout frontend candidate
        uses: actions/checkout@v4
        with:
          repository: bingordo/oberon
          ref: 43bdd840f5540aa56abb8acd3390d5fbb5f151a2
          path: oberon
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Checkout compiler candidate
        uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: abe58627aef5faf1e2e0cc18d587a8ea56d0ea0b
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Verify SHA and link local frontend
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C oberon rev-parse HEAD)" = 43bdd840f5540aa56abb8acd3390d5fbb5f151a2
          test "$(git -C compiler rev-parse HEAD)" = abe58627aef5faf1e2e0cc18d587a8ea56d0ea0b
          python3 - <<'PY'
          from pathlib import Path
          cargo = Path('compiler/crates/driver/Cargo.toml')
          content = cargo.read_text()
          old = 'oberon-front-ir = { git = "ssh://git@github.com/bingordo/oberon.git", rev = "43bdd840f5540aa56abb8acd3390d5fbb5f151a2" }'
          assert content.count(old) == 1, "frontend SHA pin mismatched"
          cargo.write_text(content.replace(old, 'oberon-front-ir = { path = "../../../oberon/oberon/crates/front-ir" }'))
          PY
          git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: oberon-native-inc-dec-v1
      - name: Frontend INC DEC admission tests
        run: cargo test --manifest-path oberon/oberon/Cargo.toml -p oberon-front-ir native_inc_dec
      - name: Native compiler build
        run: cargo check --manifest-path compiler/Cargo.toml -p compiler --bin compiler
      - name: Native ELF and GAS once-evaluated index oracle
        run: cargo test --manifest-path compiler/Cargo.toml -p compiler --bin compiler native_inc_dec_array_index_is_evaluated_once_for_elf_and_gas -- --nocapture
      - name: Strict frontend Clippy
        run: cargo clippy --manifest-path oberon/oberon/Cargo.toml -p oberon-front-ir --all-targets -- -D warnings
