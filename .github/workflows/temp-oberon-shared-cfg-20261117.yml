# Temporary isolated Oberon shared TypeId CFG gate, never merge to compiler-ci/main.
name: TEMP Oberon shared TypeId CFG parity
on:
  pull_request:
    paths: [.github/workflows/temp-oberon-shared-cfg-20261117.yml]
permissions:
  contents: read
jobs:
  oberon:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.CI_KEY }}
      - run: ssh-keyscan github.com >> ~/.ssh/known_hosts
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: bf418e32994457e3617d9c7828d6acb876da0883
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Verify exact source
        working-directory: compiler
        run: test "$(git rev-parse HEAD)" = "bf418e32994457e3617d9c7828d6acb876da0883"
      - uses: dtolnay/rust-toolchain@stable
      - name: Shared TypeId CFG + Oberon driver unit source corpus
        working-directory: compiler
        run: |
          cargo test -p compiler-ir --lib
          cargo test -p compiler --bin compiler m6_checked_oberon_source_vs_c_oracle -- --nocapture
      - name: Oberon source CFG ABI globals and direct ELF/GAS/PIC runtime acceptance
        working-directory: compiler
        run: |
          cargo test -p compiler --test m42_oberon_arrays_native
          cargo test -p compiler --test m4_oberon_globals_native
          cargo test -p compiler --test typeid_oberon_ctor_pic_dso
          cargo test -p compiler --test typeid_oberon_pic_frame_dso
          cargo test -p compiler --test typeid_x86_oberon_begin_snapshot
      - name: Exact TypeId driver CLI and native source sanity
        working-directory: compiler
        run: cargo test -p compiler --test ir_default_cli
      - name: Warnings-denied shared IR and Oberon driver
        working-directory: compiler
        run: cargo clippy -p compiler-ir -p compiler --all-targets -- -D warnings
