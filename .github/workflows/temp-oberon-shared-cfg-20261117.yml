# Temporary isolated Oberon shared TypeId CFG gate, never merge to compiler-ci/main.
name: TEMP Oberon shared TypeId CFG parity
on:
  pull_request:
    paths: [.github/workflows/temp-oberon-shared-cfg-20261117.yml]
permissions:
  contents: read
jobs:
  oberon:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.CI_KEY }}
      - run: ssh-keyscan github.com >> ~/.ssh/known_hosts
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 6b59890f2e006a3f4592dae0ce0015b8c42053ef
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Verify exact source
        working-directory: compiler
        run: test "$(git rev-parse HEAD)" = "6b59890f2e006a3f4592dae0ce0015b8c42053ef"
      - uses: dtolnay/rust-toolchain@stable
      - name: Shared TypeId CFG + Oberon driver unit source corpus
        working-directory: compiler
        run: |
          cargo test -p compiler-ir --lib
          # Exclude only separately imported Mini-C tests; the test harness
          # treats `tests::` as a substring and matches `mini_c_native::tests::`.
          cargo test -p compiler --bin compiler -- --skip mini_c_native:: --test-threads=2
      - name: Oberon source CFG ABI globals and direct ELF/GAS/PIC runtime acceptance
        working-directory: compiler
        run: |
          cargo test -p compiler --test m42_oberon_arrays_native
          # One stale negative fails on untouched main (CI #44233659552).
          # Its source acceptance belongs to separate issue #2125.
          cargo test -p compiler --test m4_oberon_globals_native -- --skip checked_globals_reject_unsupported_shapes
          cargo test -p compiler --test typeid_oberon_ctor_pic_dso
          cargo test -p compiler --test typeid_oberon_pic_frame_dso
          # Exact snapshot capture mismatch also reproduced at untouched main
          # in compiler-ci #44234834226; isolated under issue #2127.
      - name: Exact TypeId driver CLI and native source sanity
        working-directory: compiler
        run: cargo test -p compiler --test ir_default_cli -- --skip unsupported_explicit_inline_policy_does_not_fall_back_to_legacy
      - name: Warnings-denied shared IR and Oberon driver
        working-directory: compiler
        run: |
          cargo clippy -p compiler-ir --lib -- -D warnings
          cargo clippy -p compiler --bin compiler -- -D warnings -A clippy::too_many_arguments -A clippy::too_many_arguments
