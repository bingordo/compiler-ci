name: CI M49 source TypeId to real DWARF
on:
  pull_request:
    paths: ['.github/workflows/m49-typeid-dwarf-3327.yml']
permissions:
  contents: read
jobs:
  dwarf:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 308cb9d746dae71fcef55bffb10b942c71ff5464
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Resolve compiler Git dependencies
        run: git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
      - name: Exact TypeId source to DWARF linked-oracle regression
        working-directory: compiler
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "308cb9d746dae71fcef55bffb10b942c71ff5464"
          cargo test -p compiler-backend-x86 --lib typeid_dwarf::tests -- --nocapture
          cargo test -p compiler-backend-x86 --lib
          cargo clippy -p compiler-backend-x86 --lib -- -D clippy::all -A clippy::empty_line_after_doc_comments -A clippy::collapsible_match
