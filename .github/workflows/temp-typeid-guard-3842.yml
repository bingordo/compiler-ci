name: Temporary TypeId retirement guard PR3842
on:
  push:
    branches: [ci/temp-typeid-guard-3842]
permissions:
  contents: read
  statuses: write
jobs:
  guard:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      SOURCE_SHA: 3ea3f1e8d2218d5b386b9861099a7d683f204ace
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: ${{ env.SOURCE_SHA }}
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Exact SHA and native IR boundary guards
        working-directory: compiler
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          PYTHONPATH=tools python3 -m unittest tools.test_ir_consumer_inventory
          python3 tools/ir_consumer_inventory.py --check-production
          python3 tools/check_mixed_function_export_boundary.py
      - name: Publish result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          state=failure
          if [ "$JOB_STATUS" = success ]; then state=success; fi
          gh api "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" -f state="$state" -f context=compiler/typeid-guard-3842 -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
