name: Compiler documentation PR 1504 link validation
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/docs-pr1504-link-validation.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  docs:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout exact compiler docs PR revision
        uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 5dfed50aa1a287d487ebbfebde627229c4412ed6
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Verify source revision
        run: test "$(git -C compiler rev-parse HEAD)" = "5dfed50aa1a287d487ebbfebde627229c4412ed6"
      - name: Run repository Markdown link checker
        working-directory: compiler
        run: python3 tools/check_doc_links.py
      - name: Test Markdown link checker
        working-directory: compiler
        run: python3 -m unittest discover -s tools -p 'test_check_doc_links.py' -v
