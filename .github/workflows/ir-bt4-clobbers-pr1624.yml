# Temporary source-pinned migration verification; no compiler Actions.
name: BT4 division and fixed-clobber TypeId migration
on:
  pull_request:
    paths:
      - '.github/workflows/ir-bt4-clobbers-pr1624.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-div-clobbers:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      CARGO_INCREMENTAL: '0'
      SOURCE_SHA: 3be849c4b66296815379afb2dea119c2a3637ed9
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 3be849c4b66296815379afb2dea119c2a3637ed9
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Pin SHA and isolate core workspace
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C compiler rev-parse HEAD)" = "$SOURCE_SHA"
          cat > compiler/Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir", "crates/opt", "crates/backend", "crates/backend-x86"]
          EOF
          rm -f compiler/Cargo.lock
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: ir-bt4-div-clobbers
      - name: Preserve original C11 division SIGFPE and fixed-register clobber oracles
        working-directory: compiler
        run: cargo test -p compiler-backend-x86 --test division_native --test fixed_clobber_interactions_native -- --nocapture
      - name: Check all target build and related native ABI tests
        working-directory: compiler
        run: |
          set -euo pipefail
          cargo check -p compiler-ir -p compiler-backend -p compiler-backend-x86 --all-targets
          cargo test -p compiler-backend-x86 --test m4_scalar_div_traps --test call_clobber_pressure_native --test mixed_frame_native
      - name: Strict Clippy of migrated tests
        working-directory: compiler
        run: cargo clippy -p compiler-backend-x86 --test division_native --test fixed_clobber_interactions_native -- -D warnings
