name: Validate native-int seeded generator sharing PR2589
on:
  pull_request:
    paths:
      - '.github/workflows/native-int-seed-share-pr2589.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  generator-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CARGO_INCREMENTAL: '0'
      SOURCE_SHA: 51ca8e0c639aa68d8fb7b8fc9267fe22b681199c
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 51ca8e0c639aa68d8fb7b8fc9267fe22b681199c
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Verify exact source and isolate optimizer
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C compiler rev-parse HEAD)" = "$SOURCE_SHA"
          cat > compiler/Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir", "crates/opt", "crates/backend", "crates/backend-x86"]
          EOF
          rm -f compiler/Cargo.lock
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: native-int-seeded-generator
      - name: All four original generated matrix suites (including independent interpreters)
        working-directory: compiler
        shell: bash
        run: |
          set -euo pipefail
          cargo test -p compiler-opt --test generated_native_boolean_dag -- --nocapture
          cargo test -p compiler-opt --test generated_native_compare_dag -- --nocapture
          cargo test -p compiler-opt --test generated_native_additive_pair_cancellation_s2334 -- --nocapture
          cargo test -p compiler-opt --test generated_native_add_xor_carry_comparison_s2331 -- --nocapture
      - name: Focused test Clippy with upstream x86-only known exemptions
        working-directory: compiler
        shell: bash
        run: |
          cargo clippy -p compiler-opt --test generated_native_boolean_dag --test generated_native_compare_dag --test generated_native_additive_pair_cancellation_s2334 --test generated_native_add_xor_carry_comparison_s2331 -- -D warnings -A dead-code -A clippy::empty-line-after-doc-comments
