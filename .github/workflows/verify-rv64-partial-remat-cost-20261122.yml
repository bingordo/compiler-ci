name: RV64 partial remat register-read cost and liveness
on:
  push:
    branches: [main]
    paths: ['.github/workflows/verify-rv64-partial-remat-cost-20261122.yml']
  workflow_dispatch:
    inputs:
      source_ref:
        description: Compiler source SHA to validate
        type: string
        required: true
        default: '5c52b2abbf066bdaf5241128de0866179ff8946e'
permissions:
  contents: read
jobs:
  rv64-partial-remat:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: ${{ inputs.source_ref || '5c52b2abbf066bdaf5241128de0866179ff8946e' }}
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Pin source revision
        run: |
          set -euo pipefail
          actual="$(git -C compiler rev-parse HEAD)"
          echo "Partial remat source: $actual" >> "$GITHUB_STEP_SUMMARY"
          if [ "$GITHUB_EVENT_NAME" = push ]; then test "$actual" = '5c52b2abbf066bdaf5241128de0866179ff8946e'; fi
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Isolate TypeId native workspace
        working-directory: compiler
        run: |
          cat > Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir", "crates/backend", "crates/backend-riscv64"]
          EOF
          rm -f Cargo.lock
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: rv64-partial-remat-20261122
      - name: Verify source-reviewed selector regeneration
        working-directory: compiler
        run: |
          set -euo pipefail
          python3 tools/regen_riscv_native_selector_rules.py --check
          python3 -m unittest discover -s tools -p test_riscv_native_selector_rules.py -v
          python3 tools/riscv_udb_rust_leaf_forms.py \
            --catalog data/riscv_udb_r0_catalog.json \
            --output crates/backend-riscv64/src/generated_encoding.rs --check
      - name: Check focused partial liveness and all RV64 targets
        working-directory: compiler
        run: |
          set -euo pipefail
          cargo test -p compiler-backend --lib remat::tests
          cargo test -p compiler-backend-riscv64 --lib remat_cost_tests -- --nocapture
          cargo test -p compiler-backend-riscv64 --all-targets
          cargo clippy -p compiler-backend-riscv64 --all-targets -- --no-deps -D warnings
      - name: Install independent RISC-V assembler and emulator
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y binutils-riscv64-linux-gnu qemu-user
      - name: Compare direct ELF output with GNU assembler
        working-directory: compiler
        run: |
          set -euo pipefail
          for kind in addi_phi slti32_neg sltiu32_neg; do
            cargo run -p compiler-backend-riscv64 --example rv64_leaf -- \
              "/tmp/rv64_${kind}.o" "/tmp/rv64_${kind}.s" "$kind" --isa=rv64i
            riscv64-linux-gnu-as -march=rv64i -mabi=lp64 \
              "/tmp/rv64_${kind}.s" -o "/tmp/rv64_${kind}_gas.o"
            riscv64-linux-gnu-objcopy -O binary -j .text \
              "/tmp/rv64_${kind}.o" "/tmp/rv64_${kind}_direct.bin"
            riscv64-linux-gnu-objcopy -O binary -j .text \
              "/tmp/rv64_${kind}_gas.o" "/tmp/rv64_${kind}_gas.bin"
            cmp "/tmp/rv64_${kind}_direct.bin" "/tmp/rv64_${kind}_gas.bin"
          done
      - name: QEMU oracle for retained PHI constant and i32 unsigned ordering
        run: |
          set -euo pipefail
          cat > /tmp/rv64_partial_start.s <<'EOF'
          .option norvc
          .option norelax
          .text
          .globl _start
          _start:
            li a0, 7
            li a1, 18
            call rv64_addi_phi
            li t0, 29
            bne a0, t0, fail1
            li a0, 20
            li a1, 6
            call rv64_addi_phi
            li t0, 42
            bne a0, t0, fail2
            li a0, -1
            call rv64_sltiu32_neg
            bnez a0, fail3
            li a0, -2147483648
            call rv64_sltiu32_neg
            li t0, 1
            bne a0, t0, fail4
            li a0, -20
            call rv64_slti32_neg
            li t0, 1
            bne a0, t0, fail5
            li a0, 0
            j exit
          fail1: li a0, 1
            j exit
          fail2: li a0, 2
            j exit
          fail3: li a0, 3
            j exit
          fail4: li a0, 4
            j exit
          fail5: li a0, 5
          exit:
            li a7, 93
            ecall
          EOF
          riscv64-linux-gnu-as -march=rv64i -mabi=lp64 \
            /tmp/rv64_partial_start.s -o /tmp/rv64_partial_start.o
          riscv64-linux-gnu-ld -m elf64lriscv -static --no-relax \
            -e _start /tmp/rv64_partial_start.o \
            /tmp/rv64_addi_phi.o /tmp/rv64_slti32_neg.o \
            /tmp/rv64_sltiu32_neg.o -o /tmp/rv64_partial.elf
          timeout 15s qemu-riscv64 /tmp/rv64_partial.elf
          echo 'RV64 partial remat native oracles: 5 cases passed'
