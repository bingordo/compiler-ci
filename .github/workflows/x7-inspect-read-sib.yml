name: X7 inspect original pinned Intel Read_SIB helper
on:
  pull_request:
    paths: ['.github/workflows/x7-inspect-read-sib.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - name: Get pinned Intel standard library and show Read_SIB
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 2 --max-time 55 "https://raw.githubusercontent.com/intel/SDM/35eface1b7ee003a1cda95005ec5fd83de658a64/data/definitions.xml.gz" -o /tmp/defs.gz
          python3 - <<'PY'
          import gzip,hashlib,xml.etree.ElementTree as ET
          d=open('/tmp/defs.gz','rb').read()
          assert hashlib.sha256(d).hexdigest()=='c5607c5774d45e2300410e519a65c7d48981afc55a50c4219ee9e6b2eb1f301e'
          r=ET.fromstring(gzip.decompress(d))
          for name in ['Read_SIB','Get_Effective_Segment']:
              found=[x for x in r.findall('definition') if x.get('name')==name]
              print('BEGIN',name,'COUNT',len(found))
              for x in found:
                  print('DEFINITION_SHA',hashlib.sha256(ET.tostring(x,encoding='utf-8')).hexdigest())
                  for op in x.findall('operation'):
                      for c in op:
                          if c.tag=='code':print('CODE',repr((c.text or '').strip()))
                          elif c.tag=='callee':print('CALLEE',(c.text or '').strip())
              print('END',name)
          PY
