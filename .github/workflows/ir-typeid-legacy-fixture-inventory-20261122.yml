# Repository-wide source-pinned inventory before retiring TypeId legacy test bridge.
name: IR TypeId legacy fixture inventory
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ir-typeid-legacy-fixture-inventory-20261122.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fixture-inventory:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      SOURCE_SHA: e6cc845a9911c1de00e50b4fe4808799aa487a36
    steps:
      - name: Check out exact compiler source
        uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: ${{ env.SOURCE_SHA }}
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Verify revision and enumerate legacy TypeId test-bridge callers
        shell: bash
        run: |
          set -euo pipefail
          cd compiler
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          echo "IR_LEGACY_INVENTORY_SOURCE=$SOURCE_SHA"
          echo "IR_LEGACY_BRIDGE_CONSUMERS_BEGIN"
          git grep -n -e 'typeid_executable_fixture' -e 'typed_fixture' -- crates/opt/tests || true
          echo "IR_LEGACY_BRIDGE_CONSUMERS_END"
          echo "IR_LEGACY_FROM_LEGACY_BEGIN"
          git grep -n -e 'from_legacy(' -- crates/opt/tests || true
          echo "IR_LEGACY_FROM_LEGACY_END"
          echo "IR_LEGACY_ALL_CRATES_CONSUMERS_BEGIN"
          git grep -n -e 'typeid_executable_fixture' -e 'typed_fixture' -- crates || true
          echo "IR_LEGACY_ALL_CRATES_CONSUMERS_END"
