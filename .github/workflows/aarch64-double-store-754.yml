name: AArch64 shifted codegen test (compiler PR 754)
on:
  push:
    paths:
      - '.github/workflows/aarch64-double-store-754.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: aarch64-double-store-754
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.CI_KEY }}
      - run: ssh-keyscan github.com >> ~/.ssh/known_hosts
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 0d13cf6519e22a83ab83d5f427bdcb9f2a549a65
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Exact-source isolated workspace
        run: |
          set -euo pipefail
          test "$(git -C compiler rev-parse HEAD)" = "0d13cf6519e22a83ab83d5f427bdcb9f2a549a65"
          mkdir -p workspace/crates
          cp -a compiler/crates/ir compiler/crates/backend compiler/crates/backend-aarch64 workspace/crates/
          cat > workspace/Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir", "crates/backend", "crates/backend-aarch64"]
          EOF
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: workspace
          key: aarch64-double-store-754
      - name: Warnings-denied all-target compilation
        working-directory: workspace
        run: RUSTFLAGS="-D warnings" cargo check -p compiler-backend-aarch64 --all-targets
      - name: Targeted AArch64 tied repairs with machine allocator
        working-directory: workspace
        run: cargo test -p compiler-backend-aarch64 double_index_store_native::selects_two_index_stores_and_forces_real_spills -- --nocapture
      - name: Targeted generic allocator regression
        working-directory: workspace
        run: cargo test -p compiler-backend-aarch64 double_index_store_native::native_two_dynamic_indices_store_oracle -- --nocapture
      - name: Full self-contained IR/shared/backend/AArch64 regression
        working-directory: workspace
        run: cargo test -p compiler-ir -p compiler-backend -p compiler-backend-aarch64 -- --test-threads=1
      - name: Strict production backend Clippy
        working-directory: workspace
        run: cargo clippy -p compiler-backend-aarch64 --lib -- -D warnings
      - name: Accepted source
        run: echo 'Native AArch64 tied repairs verified exact SHA 0d13cf6519e22a83ab83d5f427bdcb9f2a549a65' >> "$GITHUB_STEP_SUMMARY"
