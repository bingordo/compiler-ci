name: Temporary Mini-C C99 VLA scopes 302
on:
  pull_request:
    paths: ['.github/workflows/temp-mini-c-vla-scopes-302.yml']
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/mini-c
          ref: 37010f9e2384dfeb636a5659dd2a1e7c21a5a6b3
          persist-credentials: false
      - run: git rev-parse HEAD
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/debug
          key: mini-c-native-vla-scopes-302
          restore-keys: |
            mini-c-native-ubuntu-block-static-296
            mini-c-native-
      - run: cargo test -p mini-c-syntax -p mini-c-sema -p mini-c-cranelift
      - run: cargo clippy -p mini-c-sema -p mini-c-cranelift --all-targets -- -D warnings
      - name: GCC differential for captured typedef bounds
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/vla.c" <<'EOF'
          int main(void) {
              int a[3][4]; int n=4;
              typedef int Row[n++];
              typedef Row Alias; Alias *p=a;
              if(n!=5 || sizeof(Row)!=16)return 1;
              n=7;p[1][2]=19;
              if(a[1][2]!=19 || sizeof(Alias)!=16)return 2;
              for(int i=1;i<5;i++){typedef char T[n++];if(sizeof(T)!=6+i)return 3;}
              if(n!=11 || sizeof(Row)!=16)return 4;
              int k=2;L:;typedef char S[k++];if(k<5)goto L;
              if(sizeof(S)!=4 || k!=5)return 5;
              return 0;
          }
          EOF
          gcc -std=c99 -pedantic-errors "$RUNNER_TEMP/vla.c" -o "$RUNNER_TEMP/oracle"
          "$RUNNER_TEMP/oracle"
          cargo run -q -p mini-c-cranelift -- --cpp=none --emit-obj "$RUNNER_TEMP/vla.o" "$RUNNER_TEMP/vla.c"
          gcc "$RUNNER_TEMP/vla.o" -o "$RUNNER_TEMP/native"
          "$RUNNER_TEMP/native"
