name: AArch64 native TypeId fixed local and memory fixture migration
on:
  push:
    branches: [verify/aarch64-local-memory-typeid-20261115]
    paths: ['.github/workflows/aarch64-local-memory-typeid-20261115.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 0c73b3643cd2eefd373a7deb6909d1fbbdbe0031
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Confirm exact compiler source
        run: test "$(git -C compiler rev-parse HEAD)" = "0c73b3643cd2eefd373a7deb6909d1fbbdbe0031"
      - name: Restrict workspace
        run: |
          cat > compiler/Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir", "crates/backend", "crates/backend-aarch64"]
          EOF
          rm -f compiler/Cargo.lock
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: aarch64-local-memory-typeid-fixture
      - name: Export original TypeId local and memory functions
        working-directory: compiler
        run: |
          cargo test -p compiler-backend-aarch64 --test local_memory temporary_export_existing_typeid_native_input -- --nocapture
          cargo test -p compiler-backend-aarch64 --test memory temporary_export_existing_typeid_native_input -- --nocapture
