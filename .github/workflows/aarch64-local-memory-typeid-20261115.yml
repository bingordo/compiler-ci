name: AArch64 native TypeId fixed local and memory fixture migration
on:
  push:
    branches: [verify/aarch64-local-memory-typeid-20261115]
    paths: ['.github/workflows/aarch64-local-memory-typeid-20261115.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 7876875ed39683542e7f246d13ccf50f125ea923
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Confirm exact compiler source
        run: test "$(git -C compiler rev-parse HEAD)" = "7876875ed39683542e7f246d13ccf50f125ea923"
      - name: Restrict workspace
        run: |
          cat > compiler/Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir", "crates/backend", "crates/backend-aarch64"]
          EOF
          rm -f compiler/Cargo.lock
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: aarch64-local-memory-typeid-fixture
      - name: Install AArch64 GNU C, glibc cross headers and QEMU
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends gcc-aarch64-linux-gnu libc6-dev-arm64-cross binutils-aarch64-linux-gnu qemu-user
      - name: Run original local and pointer memory C11 oracles under AArch64 QEMU
        working-directory: compiler
        env:
          COMPILER_REQUIRE_AARCH64_QEMU: "1"
        run: |
          cargo test -p compiler-backend-aarch64 --test local_memory --test memory -- --nocapture
      - name: Validate native AArch64 neighboring arrays and checked IR
        working-directory: compiler
        run: |
          cargo test -p compiler-backend-aarch64 --test checked_arrays --test module_globals
          cargo test -p compiler-ir --test native_module_text_v3 --test native_fixture_text
          cargo clippy -p compiler-backend-aarch64 --no-deps --test local_memory --test memory -- -D warnings
