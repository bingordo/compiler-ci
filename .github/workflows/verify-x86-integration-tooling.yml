name: Verify ported x86 cost-import tooling
on:
  push:
    branches: [main]
    paths: ['.github/workflows/verify-x86-integration-tooling.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tooling:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: integration/x86-tooling-main-20261102
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Record compiler SHA
        run: git rev-parse HEAD
      - name: Validate imported cost profiles and mappings against current catalog
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p 'test_x86_uops_import.py' -v
          python3 -m unittest discover -s tests -p 'test_x86_cost_profiles.py' -v
          python3 tools/validate_x86_costs.py data/x86_costs_generic.json
          python3 tools/x86_form_inventory.py --json > /tmp/x86-inventory.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          catalog=json.loads(Path("data/x86_encoding_forms.json").read_text())
          mapping=json.loads(Path("data/x86_uops_variant_mapping.json").read_text())["forms"]
          assert len(catalog)>25
          assert set(mapping).issubset({f["name"] for f in catalog})
          print("X86_TOOLING_MAIN status=PASS")
          PY
