name: LTO admitted binary envelope merge
on:
  push:
    branches: [verify/lto-admitted-envelope-merge-20261114]
    paths: ['.github/workflows/lto-admitted-envelope-merge-20261114.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  merge:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 81ca9c83606ecbec25ef353f6b52dda13152b0a4
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Assert pinned source
        run: test "$(git -C compiler rev-parse HEAD)" = "81ca9c83606ecbec25ef353f6b52dda13152b0a4"
      - name: Focus IR crate
        run: |
          cat > compiler/Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir"]
          EOF
          rm -f compiler/Cargo.lock
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: lto-admitted-envelope
      - name: Test serialized fusion, IR suite and strict Clippy
        working-directory: compiler
        run: |
          cargo test -p compiler-ir --test lto_envelope_merge
          cargo test -p compiler-ir
          cargo clippy -p compiler-ir --tests -- -D warnings
