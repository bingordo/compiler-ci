name: Validate declarative S23.11 Boolean graph PR2685
on:
  pull_request:
    paths:
      - '.github/workflows/native-int-s2311-graph-pr2685.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  negative-only-graph:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      CARGO_INCREMENTAL: '0'
      SOURCE_SHA: 731eaf05eef619c39624df6ae0f0a8595ccec45c
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 731eaf05eef619c39624df6ae0f0a8595ccec45c
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Verify exact source and isolate optimizer
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C compiler rev-parse HEAD)" = "$SOURCE_SHA"
          cat > compiler/Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir", "crates/opt", "crates/backend", "crates/backend-x86"]
          EOF
          rm -f compiler/Cargo.lock
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: native-int-seeded-generator
      - name: Run full S23.11 generated Boolean, golden negative-only and rollback tests
        working-directory: compiler
        shell: bash
        run: |
          set -euo pipefail
          cargo test -p compiler-opt --test generated_native_matchpd_boolean_s2311 -- --nocapture
      - name: Focused strict Clippy with unrelated production warning exemptions
        working-directory: compiler
        run: cargo clippy -p compiler-opt --test generated_native_matchpd_boolean_s2311 -- -D warnings -A dead-code -A clippy::empty-line-after-doc-comments -A unused-imports -A clippy::too-many-arguments
