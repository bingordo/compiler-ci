# Temporary only: all compiler build/test jobs run on compiler-ci.
name: X7 S4 real optimized source constructors and ELF visibility TLS metadata
on:
  pull_request:
    paths: ['.github/workflows/verify-x7-s4-source-elf-metadata-20261115.yml']
permissions:
  contents: read
jobs:
  real-source-constructors-symbols-and-tls:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.CI_KEY }}
      - name: Trust pinned Mini-C/Oberon source repos
        run: ssh-keyscan github.com >> ~/.ssh/known_hosts
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 7f9aebe3a109faf92c4de0b057acc2c8293aaa59
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Exact pinned source without compiler Actions
        run: test "$(git -C compiler rev-parse HEAD)" = "7f9aebe3a109faf92c4de0b057acc2c8293aaa59"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: x7-s4-source-elf-visibility-tls
      - name: Independent C11 source constructors and metadata validation
        shell: bash
        working-directory: compiler
        run: |
          set -euo pipefail
          cargo test -p compiler --test m42_module_initialization_native -- --nocapture
          cargo test -p compiler --test x7_s4_source_elf_metadata -- --nocapture
          cargo test -p compiler --test x7_selected_machine_source -- --nocapture
          cargo test -p compiler --test x7_s4_rolling_checksum_source -- --nocapture
          cargo check -p compiler
          echo X7_S4_SOURCE_CONSTRUCTORS_SYMBOLS_TLS_ELF_PASS
  shared-selected-machine-backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 7f9aebe3a109faf92c4de0b057acc2c8293aaa59
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Verify exact candidate
        run: test "$(git -C compiler rev-parse HEAD)" = "7f9aebe3a109faf92c4de0b057acc2c8293aaa59"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: x7-s4-phys-metadata-rust
      - name: Standalone backend workspace; avoid private frontend dependency
        shell: bash
        run: |
          cat > compiler/Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir","crates/opt","crates/backend","crates/backend-x86"]
          EOF
          rm -f compiler/Cargo.lock
      - name: Existing shared-machine and ELF validation
        shell: bash
        working-directory: compiler
        run: |
          set -euo pipefail
          cargo test -p compiler-backend-x86 --test x7_shared_machine_native_parity
          cargo test -p compiler-backend-x86 --test x7_shared_pic_global_native
          cargo test -p compiler-backend-x86 --test m4_8_checked_symbol_attributes_native
          cargo test -p compiler-backend-x86 --lib
          echo X7_S4_SHARED_MACHINE_ELF_METADATA_BACKEND_PASS
