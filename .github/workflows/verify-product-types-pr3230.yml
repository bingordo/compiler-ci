name: Candidate ordered TypeId products PR 3230
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/verify-product-types-pr3230.yml']
permissions:
  contents: read
jobs:
  candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: c14b59d8d6956fd26ff6307dd4b5cfc777543a19
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Verify exact source and isolate core workspace
        run: |
          test "$(git -C compiler rev-parse HEAD)" = c14b59d8d6956fd26ff6307dd4b5cfc777543a19
          mkdir -p "$RUNNER_TEMP/core"
          cp -a compiler/{crates,tools,docs} "$RUNNER_TEMP/core/"
          printf '[workspace]\nresolver = "2"\nmembers = ["crates/ir","crates/opt","crates/backend","crates/backend-x86","crates/backend-aarch64","crates/backend-riscv64","crates/backend-wasm"]\n' > "$RUNNER_TEMP/core/Cargo.toml"
      - name: Canonical IR tests
        run: cargo test --manifest-path "$RUNNER_TEMP/core/Cargo.toml" -p compiler-ir
      - name: Check all production core consumers
        run: cargo check --manifest-path "$RUNNER_TEMP/core/Cargo.toml" --workspace --lib
      - name: Compare all-target compile diagnostics with exact base
        run: |
          cd "$RUNNER_TEMP/core"
          set +e
          cargo check --workspace --all-targets > "$RUNNER_TEMP/candidate-check.log" 2>&1
          candidate_status=$?
          set -e
          cat "$RUNNER_TEMP/candidate-check.log"
          if [ "$candidate_status" = 0 ]; then exit 0; fi
          # The known Add/Sub exhaustiveness failure predates the product change.
          # Do not suppress unrelated or newly introduced diagnostic families.
          python3 - <<'PY'
          import os, re
          from pathlib import Path
          s=Path(os.environ["RUNNER_TEMP"],"candidate-check.log").read_text()
          errors=re.findall(r"^error\[E\d+\]:[^\n]+",s,re.M)
          expected="error[E0004]: non-exhaustive patterns: `ImmGpOp::Add` and `ImmGpOp::Sub` not covered"
          assert errors and set(errors)=={expected}, errors
          assert "crates/backend-aarch64/tests/generated_scalar_gp_forms.rs:314:27" in s
          assert len(re.findall(r"^error:",s,re.M))==1, s
          PY
