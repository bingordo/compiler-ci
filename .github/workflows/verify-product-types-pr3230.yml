name: Candidate ordered TypeId products PR 3230
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/verify-product-types-pr3230.yml']
permissions:
  contents: read
jobs:
  candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: c081fd382337e0992d6b34497023fea723305925
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Verify exact source and isolate core workspace
        run: |
          test "$(git -C compiler rev-parse HEAD)" = c081fd382337e0992d6b34497023fea723305925
          mkdir -p "$RUNNER_TEMP/core/crates"
          cp -a compiler/crates/{ir,opt,backend,backend-x86,backend-aarch64,backend-riscv64,backend-wasm} "$RUNNER_TEMP/core/crates/"
          printf '[workspace]\nresolver = "2"\nmembers = ["crates/ir","crates/opt","crates/backend","crates/backend-x86","crates/backend-aarch64","crates/backend-riscv64","crates/backend-wasm"]\n' > "$RUNNER_TEMP/core/Cargo.toml"
      - name: Canonical IR tests
        run: cargo test --manifest-path "$RUNNER_TEMP/core/Cargo.toml" -p compiler-ir
      - name: Check all core consumers
        if: always()
        run: cargo check --manifest-path "$RUNNER_TEMP/core/Cargo.toml" --workspace --all-targets
