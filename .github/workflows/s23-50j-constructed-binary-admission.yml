name: S23.50j source-pinned constructed binary SSA root admission
on:
  pull_request:
    paths:
      - '.github/workflows/s23-50j-constructed-binary-admission.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  s2350j-constructed-binary:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      CARGO_INCREMENTAL: '0'
    steps:
      - name: Checkout exact compiler candidate (never run compiler Actions)
        uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: ced83ab7bcf358d057612b211deb848d5a81c8f1
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false

      - name: Check source pin and use optimizer-only cargo workspace
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C compiler rev-parse HEAD)" = ced83ab7bcf358d057612b211deb848d5a81c8f1
          cat > compiler/Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir", "crates/opt", "crates/backend", "crates/backend-x86"]
          EOF
          rm -f compiler/Cargo.lock
          rustc --version
          python3 --version

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: s23-50j-generated-rule-admission

      - name: Parse all 37 families and compile generated SSA matcher
        working-directory: compiler
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tools/typeid-rule-gen -p 'test_*.py' -v
          python3 tools/typeid-rule-gen/rules.py \
            tools/typeid-rule-gen/examples.rules --emit-ssa-rust > "$RUNNER_TEMP/s2350j-ssa.rs"
          rustc --edition=2021 --crate-type=lib "$RUNNER_TEMP/s2350j-ssa.rs" \
            -o "$RUNNER_TEMP/libs2350j-ssa.rlib"

      - name: Install exact SHA256-pinned Z3 binary for QF_BV proof gate
        shell: bash
        run: |
          set -euo pipefail
          asset="z3-5.3.1-x64-glibc-2.39.zip"
          archive="$RUNNER_TEMP/$asset"
          curl --fail --location --retry 4 --retry-all-errors \
            --connect-timeout 15 --max-time 180 \
            --output "$archive" \
            "https://github.com/Z3Prover/z3/releases/download/z3-5.3.1/$asset"
          echo "acca9625e8cc8edeb9647b653a1bd696544ddeb5d1c2970a4576734a0c175b40  $archive" | sha256sum --check -
          unzip -q "$archive" -d "$RUNNER_TEMP/z3-release"
          solver="$(find "$RUNNER_TEMP/z3-release" -type f -path '*/bin/z3' -print -quit)"
          test -n "$solver"
          chmod +x "$solver"
          echo "$(dirname "$solver")" >> "$GITHUB_PATH"
          "$solver" -version

      - name: Prove 725 exact-width and orientation obligations with 5 SAT negative controls
        working-directory: compiler
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/typeid-rule-gen/prove.py tools/typeid-rule-gen/examples.rules \
            --timeout-ms 2500 --process-timeout 5 \
            --manifest "$RUNNER_TEMP/s2350j-proofs.json"
          python3 - "$RUNNER_TEMP/s2350j-proofs.json" <<'PY'
          import json,sys
          x=json.load(open(sys.argv[1]))
          assert x['schema']=='compiler.typeid-proofs.v1'
          assert x['logic']=='QF_BV'
          assert x['family_count']==37
          assert x['proof_count']==725
          assert x['sat_negative_controls']==5
          assert len({(p['id'],p['width'],p['orientation']) for p in x['proofs']})==725
          assert all(p['result']=='unsat' for p in x['proofs'])
          print("S2350J_PROOFS families=37 unsat=725 sat_controls=5",flush=True)
          PY

      - name: Native binary root smoke, prior Boolean regression, strict Clippy
        working-directory: compiler
        shell: bash
        run: |
          set -euo pipefail
          cargo test -p compiler-opt --features experimental-typeid-generated-rewrites \
            --test native_s2350_constructed_binary_batch -- --nocapture
          cargo test -p compiler-opt --features experimental-typeid-generated-rewrites \
            --test native_s2350_unary_complement_batch -- --nocapture
          cargo test -p compiler-opt --features experimental-typeid-generated-rewrites \
            --test native_s2350_boolean_alias_batch -- --nocapture
          cargo test -p compiler-opt --features experimental-typeid-generated-rewrites \
            --test native_s2350_gcc_boolean_batch -- --nocapture
          cargo clippy -p compiler-opt --features experimental-typeid-generated-rewrites \
            --test native_s2350_constructed_binary_batch -- -D warnings
          echo "S2350J_ADMISSION deterministic_native=passed full_randomized=deferred"
