name: TEMP combined aggregate ABI 3440
on:
  pull_request:
    branches: [main]
    paths: [.github/workflows/validate-combined-aggregate-3440.yml]
permissions:
  contents: read
jobs:
  combined:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 373831eb506d25dc33345bf3dd7c4f3565a8bda5
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Verify exact source and prepare Mini-C dependency
        run: |
          set -euxo pipefail
          test "$(git -C compiler rev-parse HEAD)" = 373831eb506d25dc33345bf3dd7c4f3565a8bda5
          python3 - <<'PY'
          from pathlib import Path
          p=Path('compiler/tools/mini-c-driver/Cargo.toml')
          s=p.read_text()
          old='ssh://git@github.com/bingordo/mini-c.git'
          assert s.count(old)==2
          p.write_text(s.replace(old,'https://github.com/bingordo/mini-c.git'))
          PY
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler/tools/mini-c-driver -> target
          key: mini-c-source-differential-v1
      - name: Build native driver
        run: cargo build --manifest-path compiler/tools/mini-c-driver/Cargo.toml -p compiler-mini-c --bin compiler-mini-c
      - name: Run harness unit controls
        run: python3 -m unittest discover -s compiler/tests/gcc -p 'test_*.py'
      - name: Run all combined aggregate probes at GCC O0 and O2
        run: |
          set -euo pipefail
          PYTHONPATH="$PWD/compiler/tests/gcc" python3 - <<'PY'
          import json, os
          from pathlib import Path
          from gcc_compat_argument_probes import generate_combined
          from gcc_compat_inventory import inventory
          from gcc_compat_runner import run_case, fatal, missing_required
          from gcc_compat_coverage import summarize
          work = Path(os.environ["RUNNER_TEMP"]) / "combined-abi"
          root = work / "sources"
          root.mkdir(parents=True)
          generate_combined(root)
          cases = inventory(root, "probe-arg-combined-")
          assert len(cases) == 100
          adapters = {"minic": [str(Path("compiler/tools/mini-c-driver/target/debug/compiler-mini-c").resolve()), "{source}", "--emit", "obj", "-o", "{object}"]}
          records = []
          for opt in ("-O0", "-O2"):
              for case in cases:
                  record = run_case(case, root, work / opt[1:] / case["case"], "gcc", ["-std=gnu11", opt, "-w", "-fno-pie"], adapters)
                  record["origin"] = "generated-argument-probe"
                  records.append(record)
                  (work / "report.json").write_text(json.dumps({"compiler_sha": "373831eb506d25dc33345bf3dd7c4f3565a8bda5", "records": records, "planned_records": 200}, indent=2))
                  print(opt, case["case"], record["status"], {k: v["status"] for k,v in record["frontends"].get("minic", {}).get("directions", {}).items()}, flush=True)
          summary = summarize(records, adapters, 200)
          (work / "coverage-summary.json").write_text(json.dumps(summary, indent=2))
          print(json.dumps(summary), flush=True)
          assert len(records) == 200 and all(r["status"] == "REFERENCE_PASS" and not fatal(r) for r in records)
          manifest = json.loads(Path("compiler/tests/gcc/gcc_compat_required_returns.json").read_text())
          requirements = [r for r in manifest["requirements"] if r.get("source_run") == 45893187759]
          assert len(requirements) == 1 and len(requirements[0]["cases"]) == 100
          missing = missing_required(records, requirements, adapters)
          print("COMBINED_REQUIRED_MISSING", missing, flush=True)
          assert not missing
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: combined-aggregate-abi
          path: |
            ${{ runner.temp }}/combined-abi/report.json
            ${{ runner.temp }}/combined-abi/coverage-summary.json
            ${{ runner.temp }}/combined-abi/sources
          if-no-files-found: warn

  edg-combined:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    container:
      image: ghcr.io/edgcpp/ci-runner@sha256:14b3948c2ce12cfa5472e5a6c468393d15426f3a67685cc35d830ea5db2acdf8
    defaults:
      run:
        shell: edg-container-exec "bash -eo pipefail {0}"
    env:
      COMPILER_SHA: 373831eb506d25dc33345bf3dd7c4f3565a8bda5
      EDG_SOURCE_SHA: b195677be8b9b56c8337afad6be8064d21a54082
      EDG_RELEASE_TAG: edgcpfe-v2026.11.14-upstream-177765bb7731
      EDG_RELEASE_SHA256: 1ce495b629924f31382ecccc891a7a72caae1014ddfa2ba7dd39b44d8b0a9526
      RUST_TOOLCHAIN_VERSION: 1.99.1
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      EDGCPP_SOURCE_DIR: ${{ github.workspace }}/edgcpp
      EDGCPP_COMPILE_COMMANDS: ${{ github.workspace }}/edgcpp/build/gcc-release/compile_commands.json
      EDGCPP_LIB_DIR: ${{ github.workspace }}/edgcpp/build/gcc-release/lib
      EDGCPP_EDG_REVISION: b195677be8b9b56c8337afad6be8064d21a54082
    steps:
      - name: Check out shared ABI test harness
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check out exact compiler candidate
        uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 373831eb506d25dc33345bf3dd7c4f3565a8bda5
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false

      - name: Check out source headers matching upstream EDG release
        uses: actions/checkout@v4
        with:
          repository: bingundu/edgcpp
          ref: b195677be8b9b56c8337afad6be8064d21a54082
          path: edgcpp
          persist-credentials: false

      - name: Assert source revisions and unmodified Hello World
        run: |
          set -euo pipefail
          test "$(git -C compiler rev-parse HEAD)" = "$COMPILER_SHA"
          test "$(git -C edgcpp rev-parse HEAD)" = "$EDG_SOURCE_SHA"
          printf 'Compiler SHA: %s\nEDG package SHA: %s\n' "$COMPILER_SHA" "$EDG_SOURCE_SHA" >>"$GITHUB_STEP_SUMMARY"

      - name: Configure EDG header tooling without rebuilding full frontend
        working-directory: edgcpp
        env:
          EDG_BASE: ${{ github.workspace }}/edgcpp/bases/docker/dev-env/gcc
        run: |
          set -euo pipefail
          cmake --preset linux-gcc-release -DEDG_BUILD_LIB=OFF -DEDG_BUILD_CALLABLE_LIBRARY=ON -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
          cmake --build build/gcc-release --target error-info --parallel 2
          test -s build/gcc-release/src/includes/err_codes.h
          test -s build/gcc-release/src/includes/err_data.h

      - name: Restore checksummed upstream EDG callable release
        working-directory: edgcpp
        run: |
          set -euo pipefail
          mkdir -p build/gcc-release/lib build/prebuilt-edg
          curl --proto '=https' --tlsv1.2 --fail --location --silent --show-error --retry 4 --retry-delay 2 \
            "https://github.com/bingundu/edgcpp/releases/download/$EDG_RELEASE_TAG/edgcpfe-ci-upstream-callable-edg-release-20261114-linux-x86_64.tar.gz" \
            -o build/prebuilt-edg/archive.tar.gz
          printf '%s  %s\n' "$EDG_RELEASE_SHA256" build/prebuilt-edg/archive.tar.gz | sha256sum -c -
          tar -xzf build/prebuilt-edg/archive.tar.gz -C build/prebuilt-edg
          grep -Fx "commit=$EDG_SOURCE_SHA" build/prebuilt-edg/BUILD-INFO.txt
          grep -Fx 'platform=linux-x86_64' build/prebuilt-edg/BUILD-INFO.txt
          test -s build/prebuilt-edg/lib/libedgcpfe.a
          cp build/prebuilt-edg/lib/libedgcpfe.a build/gcc-release/lib/libedgcpfe.a

      - name: Install pinned Rust toolchain
        run: |
          set -euo pipefail
          if ! command -v cargo >/dev/null; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | \
              sh -s -- -y --profile minimal --default-toolchain "$RUST_TOOLCHAIN_VERSION"
          fi
          export PATH="$HOME/.cargo/bin:$PATH"
          rustup toolchain install "$RUST_TOOLCHAIN_VERSION" --profile minimal
          rustup default "$RUST_TOOLCHAIN_VERSION"

      - name: Build EDG native TypeId driver
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          cargo build --manifest-path compiler/tools/edg-driver/Cargo.toml
          test -x compiler/tools/edg-driver/target/debug/compiler-edg-driver
      - name: Run all combined aggregate probes at GCC O0 and O2
        run: |
          set -euo pipefail
          source edgcpp/build/gcc-release/environment.sh
          PYTHONPATH="$PWD/compiler/tests/gcc" python3 - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          from gcc_compat_argument_probes import generate_combined
          from gcc_compat_inventory import inventory
          from gcc_compat_runner import run_case, fatal, missing_required
          from gcc_compat_coverage import summarize
          work = Path(os.environ["RUNNER_TEMP"]) / "combined-abi"
          root = work / "sources"
          root.mkdir(parents=True)
          generate_combined(root)
          cases = inventory(root, "probe-arg-combined-")
          assert len(cases) == 100
          parts = [int(x) for x in subprocess.check_output(["gcc", "-dumpfullversion", "-dumpversion"], text=True).strip().split(".")]
          parts += [0] * (3-len(parts))
          version = str(parts[0]*10000 + parts[1]*100 + parts[2])
          adapters = {"edg": [str(Path("compiler/tools/edg-driver/target/debug/compiler-edg-driver").resolve()), "{object}", "--gcc", "--c11", "--no_strict_gnu", "--gnu_version", version, "{original}"]}
          records = []
          for opt in ("-O0", "-O2"):
              for case in cases:
                  record = run_case(case, root, work / opt[1:] / case["case"], "gcc", ["-std=gnu11", opt, "-w", "-fno-pie"], adapters)
                  record["origin"] = "generated-argument-probe"
                  records.append(record)
                  (work / "report.json").write_text(json.dumps({"compiler_sha": "373831eb506d25dc33345bf3dd7c4f3565a8bda5", "records": records, "planned_records": 200}, indent=2))
                  print(opt, case["case"], record["status"], {k: v["status"] for k,v in record["frontends"].get("edg", {}).get("directions", {}).items()}, flush=True)
          summary = summarize(records, adapters, 200)
          (work / "coverage-summary.json").write_text(json.dumps(summary, indent=2))
          print(json.dumps(summary), flush=True)
          assert len(records) == 200 and all(r["status"] == "REFERENCE_PASS" and not fatal(r) for r in records)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: combined-aggregate-edg-abi
          path: |
            ${{ runner.temp }}/combined-abi/report.json
            ${{ runner.temp }}/combined-abi/coverage-summary.json
            ${{ runner.temp }}/combined-abi/sources
          if-no-files-found: warn
