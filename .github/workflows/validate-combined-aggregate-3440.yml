name: TEMP GCC layout admission current main
on:
  pull_request:
    branches: [main]
    paths: [.github/workflows/validate-combined-aggregate-3440.yml]
permissions:
  contents: read
jobs:
  layout-minic:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: c8c6cd73b1b06b80933b990ab07a30eeeba4aab9
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Verify exact source and prepare Mini-C dependency
        run: |
          set -euxo pipefail
          test "$(git -C compiler rev-parse HEAD)" = c8c6cd73b1b06b80933b990ab07a30eeeba4aab9
          python3 - <<'PY'
          from pathlib import Path
          p=Path('compiler/tools/mini-c-driver/Cargo.toml')
          s=p.read_text()
          old='ssh://git@github.com/bingordo/mini-c.git'
          assert s.count(old)==2
          p.write_text(s.replace(old,'https://github.com/bingordo/mini-c.git'))
          PY
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler/tools/mini-c-driver -> target
          key: mini-c-source-differential-v1
      - name: Build native driver
        run: cargo build --manifest-path compiler/tools/mini-c-driver/Cargo.toml -p compiler-mini-c --bin compiler-mini-c
      - name: Run harness unit controls
        run: python3 -m unittest discover -s compiler/tests/gcc -p 'test_*.py'
      - name: Restore pinned GCC source cache
        id: gcc-source-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/gcc-compat-source
          key: gcc-tests-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('compiler/tests/gcc/gcc_compat_abi_pilot.py', 'compiler/tests/gcc/fetch_gcc.py', 'compiler/tests/gcc/gcc_bitfield_execute.py') }}
      - name: Fetch or validate pinned GCC sources
        run: python3 compiler/tests/gcc/fetch_gcc.py "$RUNNER_TEMP/gcc-compat-source"
      - name: Save verified GCC source cache
        if: steps.gcc-source-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/gcc-compat-source
          key: ${{ steps.gcc-source-cache.outputs.cache-primary-key }}
      - name: Sample unchanged GCC layout batches at O0 and O2
        run: |
          set -euo pipefail
          PYTHONPATH="$PWD/compiler/tests/gcc" python3 - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          from gcc_compat_abi_pilot import GCC_COMPAT_DIR, GCC_REVISION
          from gcc_compat_bitfield_layout import generate_layout
          from gcc_compat_runner import run_case, fatal
          from gcc_compat_coverage import summarize
          work = Path(os.environ["RUNNER_TEMP"]) / "layout-abi"
          work.mkdir()
          source = Path(os.environ["RUNNER_TEMP"]) / "gcc-compat-source" / GCC_COMPAT_DIR
          root, cases, inventory = generate_layout(source, work, "gcc", 12, all_layout=True, extended=True)
          (work / "inventory.json").write_text(json.dumps(inventory, indent=2))
          adapters = {"minic": [str(Path("compiler/tools/mini-c-driver/target/debug/compiler-mini-c").resolve()), "{source}", "--emit", "obj", "-o", "{object}"]}
          records = []
          for profile, extra in (("full", []), ("no-dfp-complex-int", ["-DSKIP_DECIMAL_FLOAT", "-DSKIP_COMPLEX_INT"])):
              for opt in ("-O0", "-O2"):
                  for case in cases:
                      flags = ["-std=gnu11", opt, "-w", "-fno-pie", "-Wno-abi", "-mno-mmx", *extra]
                      record = run_case(case, root, work / profile / opt[1:] / case["case"], "gcc", flags, adapters)
                      record.update(origin="upstream-generated-layout", profile=profile)
                      records.append(record)
                      print(profile, opt, case["case"], record["status"], flush=True)
                      for name, entry in record["frontends"].items():
                          for role, build in entry["builds"].items():
                              print(name, role, build["status"], str(build["result"].get("stderr", ""))[:1000], flush=True)
                      (work / "report.json").write_text(json.dumps({"compiler_sha": "c8c6cd73b1b06b80933b990ab07a30eeeba4aab9", "gcc_revision": GCC_REVISION, "records": records, "planned_records": 48}, indent=2))
          summaries = {profile: summarize([r for r in records if r["profile"] == profile], adapters, 24) for profile in ("full", "no-dfp-complex-int")}
          print("LAYOUT_PROFILE_SUMMARY", json.dumps(summaries), flush=True)
          (work / "coverage-summary.json").write_text(json.dumps(summaries, indent=2))
          assert len(records) == 48
          assert all(not fatal(r) for r in records if r["profile"] == "full")
          assert all(not fatal(r) for r in records if r["profile"] != "full" and r["status"] == "REFERENCE_PASS")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: layout-admission-minic
          path: |
            ${{ runner.temp }}/layout-abi/report.json
            ${{ runner.temp }}/layout-abi/inventory.json
            ${{ runner.temp }}/layout-abi/coverage-summary.json
