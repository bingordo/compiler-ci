name: TEMP AArch64 GP variadic sibling tail relocation validation
on:
  pull_request:
    paths:
      - '.github/workflows/temp-aarch64-gp-varargs-tail-test-20261122.yml'
permissions:
  contents: read
jobs:
  aarch64:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 38b86fac8957c7ca8a2a1c67d5ac036dacb79acb
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Verify exact compiler SHA
        working-directory: compiler
        run: test "$(git rev-parse HEAD)" = "38b86fac8957c7ca8a2a1c67d5ac036dacb79acb"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Isolate AArch64 compiler packages
        run: |
          set -euo pipefail
          mkdir -p a64/crates
          cp -a compiler/crates/ir compiler/crates/backend compiler/crates/backend-aarch64 a64/crates/
          cat > a64/Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir","crates/backend","crates/backend-aarch64"]
          EOF
      - name: Warnings denied target compilation
        working-directory: a64
        run: RUSTFLAGS="-D warnings" cargo check -p compiler-backend-aarch64 --test gp_varargs
      - name: Strict Clippy GP variadic ABI test
        working-directory: a64
        run: cargo clippy -p compiler-backend-aarch64 --test gp_varargs -- -D warnings
      - name: AArch64 source-verified GP varargs tests and native GCC
        working-directory: a64
        run: cargo test -p compiler-backend-aarch64 --test gp_varargs -- --nocapture
