name: X7 IP7e pinned LEA32 SSA binding verification
on:
  workflow_dispatch:
  pull_request:
    paths: ['.github/workflows/x7-ip7e-lea32-ssa-bindings-20261121.yml']
permissions:
  contents: read
jobs:
  exact-source-lea32:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 57e03bde5d679d902f9fa25aaed49477002f1db1
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Check exact source revision and public dependency access
        run: |
          set -euo pipefail
          test "$(git -C compiler rev-parse HEAD)" = "57e03bde5d679d902f9fa25aaed49477002f1db1"
          git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
          git config --global --add url."https://github.com/".insteadOf "git@github.com:"
          rustc --version
          gcc --version | head -1
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: x7-ip7e-lea32-ssa-bindings-20261121
      - name: Exact IP7e binding and arithmetic regression
        working-directory: compiler
        run: |
          set -euo pipefail
          cargo test -p compiler-backend-x86 --lib --features x7-ip7-workload-profile x7_ip7_lea_census -- --nocapture
          cargo test -p compiler-backend-x86 --test x7_ip7d_lea32_physical --features x7-ip7-workload-profile -- --nocapture
      - name: Whole x86 native backend unit regression and targeted Clippy
        working-directory: compiler
        run: |
          set -euo pipefail
          cargo test -p compiler-backend-x86 --lib --features x7-ip7-workload-profile --quiet
          cargo clippy -p compiler-backend-x86 --lib --features x7-ip7-workload-profile -- \
            -D clippy::correctness -D clippy::suspicious -A clippy::empty_line_after_doc_comments
