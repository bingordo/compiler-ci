name: S19 compare 62 vs 152 proven rules on actual SSA
on:
  push:
    branches: [main]
    paths: ['.github/workflows/expr-s14-real-ssa-s19.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  independent-s14:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Read exact compiler S19 revision
        uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: c1264094aedb86d6f446c9389e0578a054920220
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Install Z3
        run: sudo apt-get update -qq && sudo apt-get install -y z3
      - name: Regenerate and independently check complete S14 rule set
        run: |
          set -euo pipefail
          cargo run --release --manifest-path compiler/tools/expr-rule-gen/Cargo.toml -- \
            --infer-guards --compose-guards --minimize-rules --commute-inferred \
            --max-proofs 2000 --max-rules 500 --format rust --output /tmp/s14-s19.rs
          cargo run --release --manifest-path compiler/tools/expr-rule-gen/Cargo.toml -- \
            --infer-guards --compose-guards --minimize-rules --commute-inferred \
            --max-proofs 2000 --max-rules 500 --format rust --check /tmp/s14-s19.rs
          grep -q 'pub const RULE_COUNT: usize = 152;' /tmp/s14-s19.rs
          grep -q 'pub const RULE_LIMIT_REACHED: bool = false;' /tmp/s14-s19.rs
          rustc --edition=2021 -O --test /tmp/s14-s19.rs -o /tmp/s14-s19-tests
          /tmp/s14-s19-tests
      - name: Allow read-only public Mini-C frontend
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path=Path('compiler/tools/mini-c-driver/Cargo.toml')
          data=path.read_text()
          old='ssh://git@github.com/bingordo/mini-c.git'
          assert data.count(old)==2
          path.write_text(data.replace(old,'https://github.com/bingordo/mini-c.git'))
          PY
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler/tools/mini-c-driver -> target
          key: s19-s14-ssa-audit
      - name: Build actual Mini-C benchmark with fresh 152-rule matcher
        env:
          S14_MATCHER_FILE: /tmp/s14-s19.rs
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=10s 12m cargo build --release \
            --manifest-path compiler/tools/mini-c-driver/Cargo.toml \
            --features s14-ssa-audit --example benchmark_generated_fusion
      - name: Check S14 typed-SSA bitwise and negative regressions
        env:
          S14_MATCHER_FILE: /tmp/s14-s19.rs
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          Path('compiler/Cargo.toml').write_text(
              '[workspace]\\nresolver = "2"\\nmembers = ["crates/ir","crates/opt"]\\n')
          PY
          cargo test --manifest-path compiler/Cargo.toml -p compiler-opt \\
            --features experimental-s14-audit s19_ -- --nocapture \\
            2>&1 | tee /tmp/s19-unit.log
          grep -F 's19_proven_bitwise_rules_audit_real_typed_i32_ssa_without_mutation ... ok' /tmp/s19-unit.log
          grep -F 's19_excludes_trapping_and_64_bit_operations ... ok' /tmp/s19-unit.log
      - name: Execute independent unchanged musl C and native GCC oracle
        run: |
          set -euo pipefail
          RULE_S9_REPEATS=3 timeout --signal=TERM --kill-after=10s 9m \
            compiler/tools/mini-c-driver/target/release/examples/benchmark_generated_fusion \
            --real-world | tee /tmp/s19-real-ssa.log
      - name: Verify complete per-stage comparison and rule provenance
        run: |
          python3 - <<'PY'
          from pathlib import Path
          lines=Path('/tmp/s19-real-ssa.log').read_text().splitlines()
          s9=[s for s in lines if s.startswith('S9_SUMMARY ')]
          s18=[s for s in lines if s.startswith('S18_SUMMARY ')]
          s19=[s for s in lines if s.startswith('S19_SUMMARY ')]
          rows=[s.split(',') for s in lines if s.startswith('S19_ROW,')]
          assert len(s9)==1 and len(s18)==2 and len(s19)==2 and len(rows)==24
          names={r[1] for r in rows}
          assert len(names)==12 and {r[2] for r in rows}=={'raw','optimized'}
          counts={}
          for r in rows:
              assert len(r)==9, r
              _,name,stage,*ns=r
              assert len([q for q in rows if q[1]==name and q[2]==stage])==1
              ops,candidates,matches,represented,shared,eligible=map(int,ns)
              assert 0<=eligible<=represented<=matches<=candidates<=ops
              assert shared<=matches
              arr=counts.setdefault(stage,[0]*6)
              for i,n in enumerate(map(int,ns)):arr[i]+=n
          labels=('operations','candidates','matches','representable','shared_inner','eligible')
          for row in s19:
              meta=dict(part.split('=',1) for part in row.split()[1:])
              stage=meta.pop('stage')
              assert stage in counts
              assert meta.pop('generated_rules')=='152'
              assert tuple(int(meta.pop(k)) for k in ('attempted','accepted','rejected'))==(12,12,0)
              assert [int(meta[k]) for k in labels]==counts[stage]
          print('S19_CENSUS_OK',counts)
          PY
      - name: Save report and regeneration evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: s19-s14-real-ssa-audit
          if-no-files-found: warn
          path: |
            /tmp/s19-real-ssa.log
            /tmp/s19-unit.log
            /tmp/s14-s19.rs
