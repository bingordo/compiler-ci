name: Temporary historical mem2reg retirement acceptance
on:
  pull_request:
    paths: ['.github/workflows/temp-ir-mem2reg-retirement-3270.yml']
permissions:
  contents: read
jobs:
  mem2reg-retirement:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      SOURCE_SHA: 251046883242f5cdf39433c66a6e983bf94eb7bd
      CARGO_INCREMENTAL: '0'
      CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: ${{ env.SOURCE_SHA }}
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Confirm source and isolate core workspace
        working-directory: compiler
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          cat > Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir", "crates/opt", "crates/backend", "crates/backend-x86", "crates/backend-aarch64"]
          EOF
          rm -f Cargo.lock
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: ir-mem2reg-retirement
      - name: Audit historical mem2reg callers
        working-directory: compiler
        run: |
          if git grep -nE 'legacy-function-mem2reg-oracle|(^|[^[:alnum:]_])mem2reg::|\bpromote_nonescaping_locals\b' -- '*.rs' '*.toml'; then
            exit 1
          fi
      - name: Native mem2reg per-slot and unit regressions
        if: ${{ !cancelled() }}
        working-directory: compiler
        run: cargo test -p compiler-opt --lib
      - name: Native mem2reg integration and execution
        if: ${{ !cancelled() }}
        working-directory: compiler
        run: cargo test --no-fail-fast -p compiler-opt --test typed_mem2reg --test mem2reg_native --test memory_execution_oracle
      - name: All optimizer targets
        if: ${{ !cancelled() }}
        working-directory: compiler
        run: |
          set -euo pipefail
          cargo check -p compiler-opt --lib
          cargo check -p compiler-opt --all-targets
      - name: Production graph boundary
        if: ${{ !cancelled() }}
        working-directory: compiler
        run: python3 tools/check_mixed_function_export_boundary.py
