name: x86 M1.19c source ELF attributes physical v5 PR 1244
on:
  pull_request:
    paths:
      - '.github/workflows/verify-x86-m19c-source-attrs.yml'
permissions:
  contents: read
jobs:
  x86-source-attrs:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.CI_KEY }}
      - run: ssh-keyscan github.com >> ~/.ssh/known_hosts
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: feature/x86-source-elf-attributes-v5-parity
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Verify exact source SHA
        run: test "$(git -C compiler rev-parse HEAD)" = "8a8764bf2414389263e04616850364133a60a2b9"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: x86-m19c-source-attrs
          cache-workspace-crates: 'true'
      - name: Real source TLS and symbol visibility v5 ELF parity
        working-directory: compiler
        run: |
          cargo test -p compiler --test typeid_x86_source_attributes_snapshot -- --nocapture
          cargo test -p compiler --test typeid_x86_tls_access_snapshot -- --nocapture
          cargo test -p compiler --test typeid_x86_source_machine_dump -- --nocapture
      - name: Strict driver/backend Clippy
        working-directory: compiler
        run: cargo clippy -p compiler -p compiler-backend-x86 --all-targets -- -D warnings
