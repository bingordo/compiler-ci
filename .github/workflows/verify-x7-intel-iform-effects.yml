name: Verify pinned Intel x86 iform memory callsites
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/verify-x7-intel-iform-effects.yml']
permissions:
  contents: read
jobs:
  intel-iform-effects:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 52f666eb8e402a2c7f3b9307bfef071419f127e5
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Check exact source-form parser and negative controls
        run: |
          set -euo pipefail
          git rev-parse HEAD
          python3 -m unittest discover -s tools -p 'test_x86_intel_iform_effect_audit.py' -v
          python3 -m py_compile tools/x86_intel_iform_effect_audit.py tools/verify_x86_intel_iform_effects.py
      - name: Audit real, commit-pinned Intel SDM form XML without vendoring
        run: |
          set -euo pipefail
          mkdir -p /tmp/intel-x7-iforms
          intel_rev=35eface1b7ee003a1cda95005ec5fd83de658a64
          for form in ADD MOV XOR; do
            curl --fail --silent --show-error --location --retry 2 --max-time 45 \
              "https://raw.githubusercontent.com/intel/SDM/${intel_rev}/data/instruction/${form}.xml" \
              --output "/tmp/intel-x7-iforms/${form}.xml"
          done
          python3 tools/verify_x86_intel_iform_effects.py --xml-dir /tmp/intel-x7-iforms
