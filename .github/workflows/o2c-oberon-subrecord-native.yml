name: O2c selected Oberon subrecord copies native TypeId candidate
on:
  pull_request:
    paths:
      - '.github/workflows/o2c-oberon-subrecord-native.yml'
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 3741b2748bc929c1ac5424342462fd18e5af3f8b
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Verify exact source and checked frontend
        run: |
          set -euxo pipefail
          test "$(git -C compiler rev-parse HEAD)" = 3741b2748bc929c1ac5424342462fd18e5af3f8b
          grep -Fq 'rev = "ed7b2574d1203704f1257df06d2b68c35d9b2547"' compiler/crates/driver/Cargo.toml
          git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: oberon-o2c-subrecord-copy
      - name: C-linked GAS and direct ELF oracles, all-target check
        run: |
          set -euxo pipefail
          cargo check --manifest-path compiler/Cargo.toml -p compiler --all-targets
          cargo test --manifest-path compiler/Cargo.toml -p compiler --bin compiler \
            checked_oberon_selected_subrecord_copies_typeid_gas_elf -- --nocapture
          cargo test --manifest-path compiler/Cargo.toml -p compiler --bin compiler \
            checked_oberon_nested_integer_record_fields_native_typeid_gas_elf -- --nocapture
          cargo test --manifest-path compiler/Cargo.toml -p compiler --bin compiler \
            checked_oberon_inherited_record_layout_prefix_copies_execute_typeid -- --nocapture
      - name: Strict all-target driver Clippy
        run: cargo clippy --manifest-path compiler/Cargo.toml -p compiler --all-targets -- -D warnings

  arm64:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    env:
      CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 3741b2748bc929c1ac5424342462fd18e5af3f8b
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Verify source and native architecture
        run: |
          test "$(uname -m)" = aarch64
          test "$(git -C compiler rev-parse HEAD)" = 3741b2748bc929c1ac5424342462fd18e5af3f8b
          git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: oberon-subrecord-aarch64
      - name: Execute real selected subrecord copies via AArch64 ELF and GAS
        working-directory: compiler
        shell: bash
        run: |
          set -euxo pipefail
          cargo build -p compiler --bin compiler
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          cat > "$tmp/ArmSub.mod" <<'EOF'
          MODULE ArmSub;
          TYPE Pair=RECORD x,y:INTEGER END;
               Outer=RECORD left,right:Pair END;
          VAR state:Outer;
          PROCEDURE Eval*(n:INTEGER):INTEGER;
          VAR local:Outer; part:Pair;
          BEGIN
              part.x:=n; part.y:=n+1;
              local.left:=part; local.right:=local.left;
              state:=local;
              RETURN state.left.x+10*state.right.y
          END Eval;
          END ArmSub.
          EOF
          cat > "$tmp/oracle.c" <<'EOF'
          extern int ArmSub__Eval(int);
          int main(void) {
              return ArmSub__Eval(2)!=32 || ArmSub__Eval(7)!=87;
          }
          EOF
          for fmt in obj asm; do
            ext=o
            if [ "$fmt" = asm ]; then ext=s; fi
            ./target/debug/compiler "$tmp/ArmSub.mod" --language oberon \
              --target aarch64 --ir typeid --emit "$fmt" -o "$tmp/native.$ext"
            cc -std=c11 -O2 -no-pie "$tmp/oracle.c" "$tmp/native.$ext" -o "$tmp/test-$fmt"
            "$tmp/test-$fmt"
            echo "O2C_AARCH64_SUBRECORD_PASS format=$fmt" >> "$GITHUB_STEP_SUMMARY"
          done
