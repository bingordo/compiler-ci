name: O2c selected Oberon subrecord copies native TypeId candidate
on:
  pull_request:
    paths:
      - '.github/workflows/o2c-oberon-subrecord-native.yml'
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 10e79a29e015400a3e2f7598f2d4013b3db72c36
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Verify exact source and checked frontend
        run: |
          set -euxo pipefail
          test "$(git -C compiler rev-parse HEAD)" = 10e79a29e015400a3e2f7598f2d4013b3db72c36
          grep -Fq 'rev = "4f4178bd0bc279e0efc4552c1468af2f01563f40"' compiler/crates/driver/Cargo.toml
          git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: oberon-o2c-subrecord-copy
      - name: C-linked GAS and direct ELF oracles, all-target check
        run: |
          set -euxo pipefail
          cargo check --manifest-path compiler/Cargo.toml -p compiler --all-targets
          cargo test --manifest-path compiler/Cargo.toml -p compiler --bin compiler \
            checked_oberon_selected_subrecord_copies_typeid_gas_elf -- --nocapture
          cargo test --manifest-path compiler/Cargo.toml -p compiler --bin compiler \
            checked_oberon_nested_integer_record_fields_native_typeid_gas_elf -- --nocapture
          cargo test --manifest-path compiler/Cargo.toml -p compiler --bin compiler \
            checked_oberon_inherited_record_layout_prefix_copies_execute_typeid -- --nocapture
      - name: Strict all-target driver Clippy
        run: cargo clippy --manifest-path compiler/Cargo.toml -p compiler --all-targets -- -D warnings
