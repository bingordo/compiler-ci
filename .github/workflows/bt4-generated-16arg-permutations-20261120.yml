name: BT4 generated 16-arg ABI budgeted permutations
on:
  pull_request:
    paths:
      - '.github/workflows/bt4-generated-16arg-permutations-20261120.yml'
permissions:
  contents: read
jobs:
  x86-abi-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.CI_KEY }}
      - name: Trust GitHub for private compiler checkout
        run: ssh-keyscan github.com >> ~/.ssh/known_hosts
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 8c289f3382a256d75e27627230b863c41d5bca8c
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Verify candidate source
        run: test "$(git -C compiler rev-parse HEAD)" = "8c289f3382a256d75e27627230b863c41d5bca8c"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: bt4-budgeted-abi-runner
      - name: Build x86 unit test binary and run every refactored ABI oracle
        working-directory: compiler
        shell: bash
        run: |
          set -euo pipefail
          for test in \
            machine_ssa_call_preserves_live_values_and_passes_six_arguments \
            source_ir_calls_survive_optimization_and_link_to_external_c \
            machine_ssa_eight_args_call_and_stack_entry_agree_with_c \
            sixteen_integer_arguments_roundtrip_through_c_with_live_across_call \
            seven_and_nine_arg_calls_preserve_negative_values_and_outgoing_slots
          do
            cargo test -p compiler-backend-x86 --lib "$test" -- --nocapture
          done
          cargo test -p compiler-backend-x86 --lib generated_sixteen_arg_abi_permutations_all_budgets -- --nocapture
      - name: Strict backend lib Clippy
        working-directory: compiler
        shell: bash
        run: |
          set -euo pipefail
          cargo clippy -p compiler-backend-x86 --lib -- -D warnings
