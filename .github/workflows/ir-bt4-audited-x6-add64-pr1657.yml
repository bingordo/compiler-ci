# Temporary exact-source validation of audited retained X6 ADD64 original oracle.
name: BT4 audited unique X6 ADD64 native TypeId
on:
  pull_request:
    paths:
      - '.github/workflows/ir-bt4-audited-x6-add64-pr1657.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-x6-add64:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      CARGO_INCREMENTAL: '0'
      SOURCE_SHA: d8d8693838b59bd2598313402778e8a605ea54f3
    steps:
      - name: Checkout exact compiler candidate
        uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: d8d8693838b59bd2598313402778e8a605ea54f3
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Verify SHA and narrow core workspace
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C compiler rev-parse HEAD)" = "$SOURCE_SHA"
          cat > compiler/Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir", "crates/opt", "crates/backend", "crates/backend-x86"]
          EOF
          rm -f compiler/Cargo.lock
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: ir-bt4-audited-add64
      - name: Original X6 ADD64 and native physical quality plus C oracle
        working-directory: compiler
        run: cargo test -p compiler-backend-x86 --test x6_add64_native -- --nocapture
      - name: Neighboring 64-bit native CFG, effects and ABI
        working-directory: compiler
        run: |
          set -euo pipefail
          cargo test -p compiler-backend-x86 --test dag_add_integration_native --test x4_cfg_pressure_native --test x4_effects_native --test m4_i64_memory_call_native --test call_clobber_pressure_native --test rbp_alloc_native
      - name: Affected crate all-target check
        working-directory: compiler
        run: cargo check -p compiler-ir -p compiler-backend -p compiler-backend-x86 --all-targets
      - name: Strict original test lint
        working-directory: compiler
        run: cargo clippy -p compiler-backend-x86 --test x6_add64_native -- -D warnings
