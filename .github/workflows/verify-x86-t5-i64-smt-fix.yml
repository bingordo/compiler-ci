name: x86 T5.5 current selected i64 predicate SMT repair
on:
  pull_request:
    paths:
      - '.github/workflows/verify-x86-t5-i64-smt-fix.yml'
permissions:
  contents: read
jobs:
  x86-t5-smt:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: e0ee286806a5b20a361eaba8e4cb66006b1b4109
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Z3 proof checker
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends z3
          z3 --version
      - name: Build complete isolated x86 backend proof test dependencies
        run: |
          set -euo pipefail
          test "$(git -C compiler rev-parse HEAD)" = e0ee286806a5b20a361eaba8e4cb66006b1b4109
          mkdir -p /tmp/x86-t5-workspace/crates
          for c in ir opt backend backend-x86 backend-aarch64; do cp -a "compiler/crates/$c" /tmp/x86-t5-workspace/crates/; done
          cp -a compiler/tools compiler/data /tmp/x86-t5-workspace/
          printf '[workspace]\nresolver="2"\nmembers=["crates/ir","crates/opt","crates/backend","crates/backend-x86","crates/backend-aarch64"]\n' > /tmp/x86-t5-workspace/Cargo.toml
          cd /tmp/x86-t5-workspace
          cargo test -p compiler-backend-x86 --test t5_x86_semantics \
            -- --ignored --nocapture --test-threads=1 | tee /tmp/x86-t5-smt.log
          grep -F 'T5_X86_SMT status=PROVEN obligations=16 mutants=5' /tmp/x86-t5-smt.log
          grep -F 'T5_X86_I64_SMT status=PROVEN obligations=23 mutants=5' /tmp/x86-t5-smt.log
          grep -F 'T5_X86_I64_DIV_SMT status=PROVEN obligations=8 mutants=5' /tmp/x86-t5-smt.log
