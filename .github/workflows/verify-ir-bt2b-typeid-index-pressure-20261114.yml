name: IR BT2b native TypeId signed-index and pressure C11 oracle
on:
  push:
    branches: [ci/ir-bt2b-typeid-index-pressure-20261114]
    paths: ['.github/workflows/verify-ir-bt2b-typeid-index-pressure-20261114.yml']
  pull_request:
    paths: ['.github/workflows/verify-ir-bt2b-typeid-index-pressure-20261114.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ir-bt2b-index-pressure-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native-pic-matrix:
    name: Original X5 signed index/pressure oracle on TypeId 4 modes, Clippy
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: c866ee94560fb411f678539fa87062ebff5bf203
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Verify pinned source and unmodified shared C oracle
        working-directory: compiler
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "c866ee94560fb411f678539fa87062ebff5bf203"
          test -f crates/backend-x86/tests/bt2b_typeid_index_pressure_native.rs
          ! grep -E '^use compiler_backend::Backend|^use compiler_ir::.*Function' crates/backend-x86/tests/bt2b_typeid_index_pressure_native.rs
          grep -F 'NativeTypeIdBackend' crates/backend-x86/tests/bt2b_typeid_index_pressure_native.rs
          grep -F 'include_str!("fixtures/lea_indexed_c_oracle.c")' crates/backend-x86/tests/bt2b_typeid_index_pressure_native.rs
          grep -F '4096' crates/backend-x86/tests/fixtures/lea_indexed_c_oracle.c
      - name: Isolate core workspace from private frontend dependencies
        working-directory: compiler
        run: |
          cat > Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir","crates/opt","crates/backend","crates/backend-x86"]
          EOF
          rm -f Cargo.lock
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler
          key: ir-bt2b-native-pic-focused
      - name: Exact unchanged 4096-vector original C11 LEA/index/pressure oracle on TypeId four modes
        working-directory: compiler
        run: cargo test -p compiler-backend-x86 --test bt2b_typeid_index_pressure_native -- --nocapture --test-threads=1
          cargo test -p compiler-backend-x86 --test lea_indexed_native -- --nocapture --test-threads=1
      - name: Adjacent source-owned TypeId signed-index shared machine
        working-directory: compiler
        run: cargo test -p compiler-backend-x86 --features x7-shared-machine-cutover --test x7_shared_signed_index_native -- --nocapture --test-threads=1
      - name: Fail on all-target x86 Clippy warnings
        working-directory: compiler
        run: cargo clippy -p compiler-backend-x86 --all-targets --all-features -- -D warnings
  core-regression:
    name: Full x86 default/all-features and TypeId IR/opt regressions
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: c866ee94560fb411f678539fa87062ebff5bf203
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Verify pinned source
        working-directory: compiler
        run: test "$(git rev-parse HEAD)" = "c866ee94560fb411f678539fa87062ebff5bf203"
      - name: Isolate core workspace from private frontend dependencies
        working-directory: compiler
        run: |
          cat > Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir","crates/opt","crates/backend","crates/backend-x86"]
          EOF
          rm -f Cargo.lock
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler
          key: ir-bt2b-native-pic-regressions
      - name: Full default x86 backend tests
        working-directory: compiler
        run: cargo test -p compiler-backend-x86 -- --test-threads=2
      - name: Full all-features x86 backend tests
        working-directory: compiler
        run: cargo test -p compiler-backend-x86 --all-features -- --test-threads=2
      - name: Install GDB for historical DWARF oracle
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends gdb
      - name: Full core TypeId IR/optimization tests
        working-directory: compiler
        run: cargo test -p compiler-ir -p compiler-opt -p compiler-backend -- --test-threads=2
