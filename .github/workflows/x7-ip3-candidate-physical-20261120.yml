name: X7 IP3 automatic source candidate exact physical receipt join
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/x7-ip3-candidate-physical-20261120.yml'
permissions:
  contents: read
jobs:
  ip3-physical:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 70aea4da4e7349a73e71d3601d320b9d9251d82f
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Verify pinned compiler head and install CLI/Python Z3
        run: |
          set -euo pipefail
          test "$(git -C compiler rev-parse HEAD)" = 70aea4da4e7349a73e71d3601d320b9d9251d82f
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends z3
          z3 -version
          python3 -m venv "$RUNNER_TEMP/x7-ip3-z3"
          "$RUNNER_TEMP/x7-ip3-z3/bin/python" -m pip install --disable-pip-version-check --quiet 'z3-solver==4.13.4.0'
      - name: Regenerate candidates and validate exact XED, semantic, and effect identity
        run: |
          set -euo pipefail
          export PYTHONPATH="$PWD/compiler/tools"
          PY="$RUNNER_TEMP/x7-ip3-z3/bin/python"
          "$PY" -m compileall -q compiler/tools/x7_ip3_discovered_physical_join.py compiler/tools/test_x7_ip3_discovered_physical_join.py
          "$PY" -m unittest -v \
            test_x7_ip3_discovered_physical_join \
            test_x7_ip2_source_rewrite_search \
            test_x7_ip2_physical_receipt_join \
            test_x7_ip2_helper_source_smt \
            test_x7_ip2_source_verified_dag \
            test_x7_ip2_semantic_certificate_join \
            test_x7_ip2_ir_equivalence
      - name: Assert physical join does not admit production source DAG
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          src=Path("compiler/tools/x7_ip3_discovered_physical_join.py").read_text()
          assert '"candidate_selector_admitted": False' in src
          assert '"candidate_ssa_matcher_legal": False' in src
          assert '"candidate_native_execution_validated": False' in src
          assert '"new_production_rules": 0' in src
          print("X7_IP3_AUTO_PHYSICAL_JOIN_NONADMISSION_PASS")
          PY
