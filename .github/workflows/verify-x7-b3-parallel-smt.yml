name: X7 B3 independent parallel Z3 model check parity
on:
  push:
    branches: [ci/x7-b3-parallel-smt-20261111]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  model-process-isolation:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 00ad8559c48e38c9fbdcf19b44dcfe8952a78703
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Pin exact source and install independent solver
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 00ad8559c48e38c9fbdcf19b44dcfe8952a78703
          python3 -m venv /tmp/x7-model-smt
          /tmp/x7-model-smt/bin/python -m pip install --disable-pip-version-check 'z3-solver==4.13.4.0'
          /tmp/x7-model-smt/bin/python -c 'import z3; print(z3.get_version_string())'
      - name: Prove serial/two-process parity and all unproved form safety contracts
        run: |
          set -euo pipefail
          /tmp/x7-model-smt/bin/python -m py_compile tools/x86_isl_operation_proof_worker.py
          /tmp/x7-model-smt/bin/python -m unittest discover -s tools -p 'test_x86_isl_operation_proof_worker.py' -v
          /tmp/x7-model-smt/bin/python -m unittest discover -s tools -p 'test_x86_isl_smt_verify.py' -v
          /tmp/x7-model-smt/bin/python -m unittest discover -s tools -p 'test_x86_isl_definedness_smt.py' -v
          /tmp/x7-model-smt/bin/python -m unittest discover -s tools -p 'test_x86_isl_record_effects_smt.py' -v
          echo X7_B3_PARALLEL_Z3_DETERMINISM_PASS
