# On-demand tracked source census. No compilation, no schedule, no source artifacts.
name: Source line census
on:
  pull_request:
    paths:
      - '.github/workflows/source-line-census.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  count:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: main
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: bingordo/mini-c
          ref: main
          path: mini-c
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: bingordo/edgcpp-rust
          ref: cranelift-codegen
          path: edgcpp-rust
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: bingordo/oberon
          ref: main
          path: oberon
          persist-credentials: false
      - name: Count physical and nonblank source lines by category
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' | tee "$GITHUB_STEP_SUMMARY"
          import collections
          import pathlib
          import re
          import subprocess

          extensions = {".rs", ".py", ".c", ".cpp", ".h", ".inc", ".ir",
                        ".lalrpop", ".mod", ".sh", ".ml", ".js", ".S"}
          categories = ("implementation", "tests", "tooling", "generated", "vendor", "archive")

          def category(path):
              if path.startswith("docs/archive/"):
                  return "archive"
              if re.search(r"(^|/)vendor/", path):
                  return "vendor"
              if re.search(r"generated[^/]*\.(rs|inc)$|crates/syntax/src/(grammar|oberon)\.rs$", path):
                  return "generated"
              if re.search(r"(^|/)(tests?|fixtures|golden|e2e|csmoke|bench|fuzz|examples)(/|\.|_)|_tests?\.rs$|_test_[^/]+\.rs$", path):
                  return "tests"
              if pathlib.PurePosixPath(path).suffix in {".rs", ".lalrpop", ".c", ".cpp", ".h", ".inc", ".mod", ".S"}:
                  return "implementation"
              return "tooling"

          print("Repository | Commit | Category | Files | Physical | Nonblank")
          print("--- | --- | --- | ---: | ---: | ---:")
          totals = collections.Counter()
          for name in ("compiler", "mini-c", "edgcpp-rust", "oberon"):
              root = pathlib.Path(name)
              sha = subprocess.check_output(["git", "-C", name, "rev-parse", "HEAD"], text=True).strip()
              counts = {k: collections.Counter() for k in categories}
              by_ext = collections.defaultdict(collections.Counter)
              ir_groups = collections.defaultdict(collections.Counter)
              files = subprocess.check_output(["git", "-C", name, "ls-files", "-z"]).split(b"\0")
              for raw in files:
                  if not raw:
                      continue
                  path = raw.decode("utf-8")
                  if pathlib.PurePosixPath(path).suffix not in extensions:
                      continue
                  if path.startswith("docs/") and not path.startswith("docs/archive/"):
                      continue
                  data = (root / path).read_bytes()
                  lines = data.split(b"\n")
                  if lines[-1] == b"":
                      lines.pop()
                  item = counts[category(path)]
                  item["files"] += 1
                  item["physical"] += len(lines)
                  item["nonblank"] += sum(bool(line.strip()) for line in lines)
                  if category(path) != "archive":
                      groups = [by_ext[pathlib.PurePosixPath(path).suffix]]
                      if path.endswith(".ir"):
                          groups.append(ir_groups["/".join(path.split("/")[:2])])
                      for group in groups:
                          group["files"] += 1
                          group["physical"] += len(lines)
                          group["nonblank"] += sum(bool(line.strip()) for line in lines)
              active = collections.Counter()
              for key, item in counts.items():
                  print(f'{name} | {sha} | {key} | {item["files"]} | {item["physical"]} | {item["nonblank"]}')
                  if key != "archive":
                      active.update(item)
              assert active["files"] > 0
              for ext, item in sorted(by_ext.items()):
                  print(f\'{name} | {sha} | EXT {ext} | {item["files"]} | {item["physical"]} | {item["nonblank"]}\')
              for group, item in sorted(ir_groups.items()):
                  print(f\'{name} | {sha} | IR {group} | {item["files"]} | {item["physical"]} | {item["nonblank"]}\')
              totals.update(active)
              print(f'{name} | {sha} | ACTIVE TOTAL | {active["files"]} | {active["physical"]} | {active["nonblank"]}')
          print(f'ALL | - | ACTIVE TOTAL | {totals["files"]} | {totals["physical"]} | {totals["nonblank"]}')
          PY
