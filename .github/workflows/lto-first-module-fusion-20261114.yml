name: LTO first native module fusion
on:
  push:
    branches: [verify/lto-first-module-fusion-20261114]
    paths: ['.github/workflows/lto-first-module-fusion-20261114.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fusion:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: bc0762c3581b4e3d6f56c05248a73da600cc001a
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Assert exact source
        run: test "$(git -C compiler rev-parse HEAD)" = "bc0762c3581b4e3d6f56c05248a73da600cc001a"
      - name: Focus IR crate
        run: |
          cat > compiler/Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir"]
          EOF
          rm -f compiler/Cargo.lock
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: lto-first-module-fusion
      - name: Run fusion regressions, complete IR suite and Clippy
        working-directory: compiler
        run: |
          cargo test -p compiler-ir --test lto_merge
          cargo test -p compiler-ir
          cargo clippy -p compiler-ir --tests -- -D warnings
