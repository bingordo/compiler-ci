name: Temporary x86 CMP placement #3412 exact source
# Source-pinned one-off validation, never a recurring workflow.
on:
  pull_request:
    paths:
      - '.github/workflows/temp-x86-cmp-placement-3412.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cmp-placement:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: fb9807444c00e2306aefae1d39cd72674ba7583b
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Verify exact compiler revision and configure git
        run: |
          set -euo pipefail
          test "$(git -C compiler rev-parse HEAD)" = "fb9807444c00e2306aefae1d39cd72674ba7583b"
          git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
          git config --global --add url."https://github.com/".insteadOf "git@github.com:"
      - name: Limit workspace to relevant backend crates
        run: |
          cat > compiler/Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir", "crates/opt", "crates/backend", "crates/backend-x86"]
          EOF
          rm -f compiler/Cargo.lock
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: cmp3412
      - name: Focused 32 and 64 bit placement tests
        working-directory: compiler
        run: cargo test -p compiler-backend-x86 --lib cmp_placement -- --nocapture
      - name: Complete shared and x86 backend library tests
        working-directory: compiler
        run: |
          set -euo pipefail
          cargo test -p compiler-backend --lib
          cargo test -p compiler-backend-x86 --lib
          cargo check -p compiler-backend-x86 --no-default-features
      - name: Scoped x86 Clippy
        working-directory: compiler
        run: cargo clippy -p compiler-backend-x86 --lib -- -D warnings
