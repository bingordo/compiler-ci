name: Diagnose preexisting X4 CFG pressure on memcpy PR base

on:
  push:
    branches: [main]
    paths: ['.github/workflows/diagnose-memcpy-pr2382-baseline.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  base:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 64600d5ad4e7ebcbb8a81af31107a72d4ae7bf4f
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Verify exact base source SHA
        run: test "$(git -C compiler rev-parse HEAD)" = 64600d5ad4e7ebcbb8a81af31107a72d4ae7bf4f
      - name: Isolate core crates
        run: |
          cat > compiler/Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir", "crates/opt", "crates/backend", "crates/backend-x86"]
          EOF
          rm -f compiler/Cargo.lock
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: memcpy-pr2382-baseline
      - name: Check X4 CFG pressure assertion on base
        working-directory: compiler
        run: cargo test -p compiler-backend-x86 --test x4_cfg_pressure_native x4_generated_rules_preserve_cfg_phi_edges_and_pressure_in_both_native_sinks -- --nocapture
