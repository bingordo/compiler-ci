name: Diagnose preexisting S23.14 profitability on memcpy PR base

on:
  push:
    branches: [main]
    paths: ['.github/workflows/diagnose-memcpy-pr2382-baseline.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  base:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 64600d5ad4e7ebcbb8a81af31107a72d4ae7bf4f
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Verify exact base source SHA
        run: test "$(git -C compiler rev-parse HEAD)" = 64600d5ad4e7ebcbb8a81af31107a72d4ae7bf4f
      - name: Isolate core crates
        run: |
          cat > compiler/Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir", "crates/opt", "crates/backend", "crates/backend-x86"]
          EOF
          rm -f compiler/Cargo.lock
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: memcpy-pr2382-baseline
      - name: Check S23.14 matchpd profitability regression on base
        working-directory: compiler
        run: cargo test -p compiler-backend-x86 --test native_s23_profitability native_s2314_matchpd_factor_gas_elf_per_family -- --nocapture
