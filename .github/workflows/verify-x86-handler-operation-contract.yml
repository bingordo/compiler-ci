name: x86 selector handler-operation source validation
on:
  pull_request:
    paths: ['.github/workflows/verify-x86-handler-operation-contract.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  x86-handler-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact compiler generator candidate
        uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 09c7ce22812152939fa93f93f4b0bdcc80f70b29
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Require pinned SHA
        run: test "$(git -C compiler rev-parse HEAD)" = "09c7ce22812152939fa93f93f4b0bdcc80f70b29"
      - uses: dtolnay/rust-toolchain@stable
      - name: Validate independent manifest handler/origin matrix and mutations
        working-directory: compiler
        run: |
          set -euo pipefail
          export PYTHONPATH="$PWD/tools"
          python3 tools/regen_x86_selector_rules.py --check
          python3 -m unittest discover -s tools -p test_regen_x86_selector_handler_contract.py -v
          python3 -m unittest discover -s tools -p test_x86_selector_rules.py -v
      - name: Preserve real x86 generic selected-rule tests
        working-directory: compiler
        run: |
          set -euo pipefail
          cat > Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir", "crates/backend", "crates/opt", "crates/backend-x86", "crates/backend-aarch64"]
          EOF
          rm -f Cargo.lock
          cargo test -p compiler-backend-x86 --lib selector::tests
