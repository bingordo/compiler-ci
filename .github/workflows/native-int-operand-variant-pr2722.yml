name: Validate declarative noncommutative native-int graphs PR2722
on:
  pull_request:
    paths:
      - '.github/workflows/native-int-operand-variant-pr2722.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  noncommutative-graph:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      CARGO_INCREMENTAL: '0'
      SOURCE_SHA: ce71994f78306e1ffc67c51b8fcdd7a783b06343
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: ce71994f78306e1ffc67c51b8fcdd7a783b06343
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Verify exact source pin and isolate optimizer
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C compiler rev-parse HEAD)" = "$SOURCE_SHA"
          cat > compiler/Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir", "crates/opt", "crates/backend", "crates/backend-x86"]
          EOF
          rm -f compiler/Cargo.lock
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: native-int-seeded-generator
      - name: Run complete S23.32 and S23.33 generated differential and rollback suites
        working-directory: compiler
        shell: bash
        run: |
          set -euo pipefail
          cargo test -p compiler-opt --test generated_native_shared_masked_sub_s2332 -- --nocapture
          cargo test -p compiler-opt --test generated_native_dual_arithmetic_cancellation_s2333 -- --nocapture
      - name: Strict focused Clippy with unrelated upstream warning categories exempt
        working-directory: compiler
        shell: bash
        run: |
          set -euo pipefail
          cargo clippy -p compiler-opt --test generated_native_shared_masked_sub_s2332 --test generated_native_dual_arithmetic_cancellation_s2333 -- -D warnings -A dead-code -A clippy::empty-line-after-doc-comments -A unused-imports -A clippy::too-many-arguments
