# Independent pinned acceptance for the first TypeId core pass manager.
name: TypeId core pass manager PR2784
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/typeid-core-pass-manager-pr2784-20261122.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pass-manager:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      SOURCE_SHA: d97c13f310d9770b97c504e25d26c35eeec6cefa
      CARGO_INCREMENTAL: '0'
      CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
    steps:
      - name: Check out exact compiler candidate
        uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: ${{ env.SOURCE_SHA }}
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Confirm source SHA and isolate core workspace
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C compiler rev-parse HEAD)" = "$SOURCE_SHA"
          cat > compiler/Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir", "crates/opt", "crates/backend", "crates/backend-x86", "crates/backend-aarch64"]
          EOF
          rm -f compiler/Cargo.lock
          rustc --version
          cargo --version
          cc --version | head -n 1
      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: typeid-core-pass-manager-pr2784
      - name: Run pass-manager and existing optimizer regression targets
        working-directory: compiler
        shell: bash
        run: |
          set -euo pipefail
          cargo test -p compiler-opt --test typeid_core_pass_manager -- --nocapture
          cargo test -p compiler-opt --test typeid_fuzz_pass_registry -- --nocapture
          cargo test -p compiler-opt --test pre_licm_semantic_matrix -- --nocapture
          cargo test -p compiler-opt --test m4_integer_effects -- --nocapture
          cargo test -p compiler-opt --test licm_preheaders -- --nocapture
      - name: Clippy on pass-manager and regression targets
        working-directory: compiler
        run: |
          cargo clippy -p compiler-opt --test typeid_core_pass_manager --test typeid_fuzz_pass_registry --test pre_licm_semantic_matrix -- -D clippy::all -A clippy::empty_line_after_doc_comments
