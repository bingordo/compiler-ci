name: Temporary S1 switch compile gate
on:
  pull_request:
    paths:
      - '.github/workflows/switch-s1-check-3528.yml'
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: a0696a86fb9f624936a71aa2c8fbbe3540a86c0e
          path: compiler
          fetch-depth: 0
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Verify exact revision
        working-directory: compiler
        run: test "$(git rev-parse HEAD)" = 'a0696a86fb9f624936a71aa2c8fbbe3540a86c0e'
      - name: Integrate pinned main and resolve reviewed conflicts
        working-directory: compiler
        run: |
          git -c user.name=ci -c user.email=ci@example.invalid merge --no-commit --no-ff 8effc959e1f5de1785c6bb2731b0fe50ee24bd02 || true
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess
          def git(*args):
              return subprocess.check_output(["git", *args], text=True)
          files = git("diff", "--name-only", "--diff-filter=U").splitlines()
          expected = {"crates/opt/src/induction_analysis.rs", "crates/opt/src/memory_alias_analysis.rs", "crates/opt/src/sccp_solver.rs", "crates/opt/tests/support/alive_lite_typeid_wide.rs"}
          assert set(files) <= expected, files
          pattern = re.compile(r"^<<<<<<< HEAD\n(.*?)^=======\n(.*?)^>>>>>>> [^\n]*\n", re.M | re.S)
          for name in files:
              path = Path(name)
              def resolve(m):
                  ours, theirs = m.groups()
                  if name.endswith("induction_analysis.rs"):
                      assert "pub(crate) fn acyclic" in ours and not theirs.strip()
                      return theirs
                  if name.endswith("memory_alias_analysis.rs"):
                      assert "fn outgoing<B: AliasBody>" in ours and "TypedAliasBody" in theirs
                      return ours.replace("fn outgoing<B: AliasBody>(f: &B,", "fn outgoing(f: &TypedAliasBody<'_>,")
                  if name.endswith("sccp_solver.rs"):
                      assert any(s in ours for s in ("let mut edge_offsets", "Terminator::Switch", "executable: vec![false; edge_base.len()]")), ours
                      return ours.replace("f.blocks_len()", "f.blocks.len()").replace("for bi in 0..f.blocks.len() {", "for (bi, block) in f.blocks.iter().enumerate() {").replace("f.end(bi)", "&block.end").replace("self.&block.end", "&self.f.blocks[bi].end")
                  if name.endswith("alive_lite_typeid_wide.rs"):
                      assert "Terminator::Switch" in ours and "Terminator::Invoke" in theirs
                      return next(s+"\n" for s in ours.splitlines() if "Terminator::Switch" in s)+theirs
                  raise AssertionError(name)
              old=path.read_text()
              new,count=pattern.subn(resolve,old)
              assert count and "<<<<<<<" not in new, name
              path.write_text(new)
              subprocess.check_call(["git","add",name])
          assert not git("diff","--name-only","--diff-filter=U").strip()
          assert not git("diff","--name-only").strip()
          print("MERGE_TREE "+git("write-tree").strip())
          PY
      - name: Export merge tree delta for guarded connector commit
        working-directory: compiler
        run: |
          python3 - <<'PY'
          import json, subprocess
          from pathlib import Path
          def git(*args):
              return subprocess.check_output(["git", *args], text=True)
          base="8effc959e1f5de1785c6bb2731b0fe50ee24bd02"
          head="a0696a86fb9f624936a71aa2c8fbbe3540a86c0e"
          for path in git("diff","--cached","--name-only",base).splitlines():
              entry=git("ls-files","-s","--",path).strip()
              if not entry:
                  print("MERGE_ENTRY "+json.dumps({"path":path,"sha":None}))
                  continue
              mode,sha,_=entry.split("\t")[0].split()
              original=subprocess.run(["git","rev-parse",f"{head}:{path}"],capture_output=True,text=True)
              print("MERGE_ENTRY "+json.dumps({"path":path,"mode":mode,"type":"blob","sha":sha,"novel":original.returncode!=0 or original.stdout.strip()!=sha}))
              if original.returncode!=0 or original.stdout.strip()!=sha:
                  data=Path(path).read_text()
                  for i in range(0,len(data),3000):
                      print("MERGE_CONTENT "+json.dumps([path,data[i:i+3000]],ensure_ascii=True))
          PY
      - name: Isolate frontend-independent workspace
        working-directory: compiler
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("Cargo.toml")
          text = p.read_text()
          assert '"crates/driver", ' in text
          p.write_text(text.replace('"crates/driver", ', ''))
          PY
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: switch-s1-core
      - name: Check core crates and all backend consumers
        working-directory: compiler
        run: |
          set -o pipefail
          cargo check --keep-going -p compiler-ir -p compiler-opt -p compiler-backend -p compiler-backend-x86 -p compiler-backend-aarch64 -p compiler-backend-riscv64 -p compiler-backend-wasm --all-targets 2>&1 | tee /tmp/switch-check.log
      - name: Focused switch regression
        working-directory: compiler
        run: |
          cargo test -p compiler-ir --test switch_cfg
          cargo test -p compiler-backend --lib switch_lowering
      - name: Preserve compiler diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: switch-compile-diagnostics
          path: /tmp/switch-check.log
          if-no-files-found: warn
          retention-days: 7
