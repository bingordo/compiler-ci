name: Temporary S1 checked-source validation
on:
  pull_request:
    paths:
      - '.github/workflows/switch-s1-check-3528.yml'
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 53983d266e023e806b6ddc8b0e7974f4fdede105
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Verify exact revision
        working-directory: compiler
        run: test "$(git rev-parse HEAD)" = '53983d266e023e806b6ddc8b0e7974f4fdede105'
      - name: Use public pinned Mini-C dependency
        run: git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler/tools/mini-c-driver -> target
          key: switch-source
      - name: Verify canonical switch and real native execution
        run: |
          set -o pipefail
          cargo test --manifest-path compiler/tools/mini-c-driver/Cargo.toml --test switch_native --test goto_labels 2>&1 | tee /tmp/switch-check.log
      - name: Preserve compiler diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: switch-compile-diagnostics
          path: /tmp/switch-check.log
          if-no-files-found: warn
          retention-days: 7
