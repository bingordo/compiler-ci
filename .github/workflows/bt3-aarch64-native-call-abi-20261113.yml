name: BT3 AArch64 direct TypeId ABI and QEMU C11 parity
on:
  push:
    branches:
      - ci/bt3-aarch64-native-call-abi-20261113
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-aarch64-abi:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      CARGO_INCREMENTAL: '0'
    steps:
      - name: Checkout exact compiler source
        uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 37829ba0fa6c081699241e30cce54852811d060d
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Verify pin and limit workspace to core crates
        run: |
          set -euo pipefail
          test "$(git -C compiler rev-parse HEAD)" = "37829ba0fa6c081699241e30cce54852811d060d"
          cat > compiler/Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir", "crates/opt", "crates/backend", "crates/backend-x86", "crates/backend-aarch64"]
          EOF
          rm -f compiler/Cargo.lock
          echo "BT3 AArch64 exact source: 37829ba0fa6c081699241e30cce54852811d060d" >> "$GITHUB_STEP_SUMMARY"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: bt3-typeid-aarch64-call-abi-v1
      - name: Direct TypeId AArch64 object/GAS emission on host (no QEMU dependencies)
        working-directory: compiler
        run: cargo test -p compiler-backend-aarch64 --test typeid_abi_calls_native -- --nocapture
      - name: Install AArch64 cross C toolchain and user-mode emulator
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends gcc-aarch64-linux-gnu qemu-user binutils-aarch64-linux-gnu
          command -v aarch64-linux-gnu-gcc
          command -v qemu-aarch64
      - name: Execute AArch64 object and GAS against independent 16-arg C11 oracle
        working-directory: compiler
        env:
          COMPILER_REQUIRE_AARCH64_QEMU: '1'
        run: cargo test -p compiler-backend-aarch64 --test typeid_abi_calls_native -- --nocapture
      - name: Preserve existing native target and old ABI test compilation
        working-directory: compiler
        run: |
          set -euo pipefail
          cargo test -p compiler-backend-aarch64 --lib
          cargo check --workspace --all-targets
          cargo clippy --workspace --all-targets -- -D warnings
