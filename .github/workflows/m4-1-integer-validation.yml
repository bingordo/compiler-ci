name: M4.1 integer foundation validation
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/m4-1-integer-validation.yml
  schedule:
    - cron: '11,26,41,56 * * * *'
permissions:
  contents: read
concurrency:
  group: m4-1-integer-validation
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout compiler feature branch
        uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: feature/m4-1-integer-foundation
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Identify revision
        run: git -C compiler rev-parse HEAD
      - name: Build and test isolated core
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/m4-workspace/crates"
          for crate in ir opt backend backend-x86; do
            cp -a "compiler/crates/$crate" "$RUNNER_TEMP/m4-workspace/crates/$crate"
          done
          cat > "$RUNNER_TEMP/m4-workspace/Cargo.toml" <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir", "crates/opt", "crates/backend", "crates/backend-x86"]
          EOF
          cargo test --manifest-path "$RUNNER_TEMP/m4-workspace/Cargo.toml" -p compiler-ir
          cargo test --manifest-path "$RUNNER_TEMP/m4-workspace/Cargo.toml" -p compiler-backend-x86
          cargo test --manifest-path "$RUNNER_TEMP/m4-workspace/Cargo.toml" -p compiler-opt --lib
