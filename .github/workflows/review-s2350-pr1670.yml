name: One-off S2350 migration test PR1670
on:
  pull_request:
    paths:
      - '.github/workflows/review-s2350-pr1670.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 855b49e03fbfb65bf991ac569782afed0c8cba6d
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Pin exact compiler source
        run: test "$(git -C compiler rev-parse HEAD)" = "855b49e03fbfb65bf991ac569782afed0c8cba6d"
      - name: Core-only workspace
        run: |
          cat > compiler/Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir", "crates/opt", "crates/backend", "crates/backend-x86", "crates/backend-aarch64"]
          EOF
          rm -f compiler/Cargo.lock
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: review-s2350-pr1670
      - name: Focused migration matrix
        working-directory: compiler
        run: cargo test -p compiler-opt --test native_s2350_migration_batch -- --nocapture
      - name: Focused TypeId physical flag-stream and alignment regression
        working-directory: compiler
        run: cargo test -p compiler-opt --test if_conversion_typeid_multimerge -- --nocapture
      - name: Focused TypeId x86 CMOV and alignment regression
        working-directory: compiler
        run: cargo test -p compiler-opt --test if_conversion_typeid_x86 -- --nocapture
      - name: Focused S2350 shadow parity regression
        working-directory: compiler
        run: cargo test -p compiler-opt --test native_s2350_shadow_parity -- --nocapture
      - name: Complete IR and optimizer suites
        working-directory: compiler
        run: cargo test -p compiler-ir -p compiler-opt
      - name: Strict IR and optimizer Clippy
        working-directory: compiler
        run: cargo clippy -p compiler-ir -p compiler-opt --all-targets -- -D warnings
