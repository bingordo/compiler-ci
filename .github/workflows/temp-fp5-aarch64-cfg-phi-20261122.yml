name: TEMP FP5 native AArch64 F32 F64 CFG PHI full regression
on:
  pull_request:
    paths:
      - '.github/workflows/temp-fp5-aarch64-cfg-phi-20261122.yml'
permissions:
  contents: read
jobs:
  native-a64-fp-phi:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: d27beceb8b98e132331f50fae22b8394f4b547e0
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Verify source exactly
        working-directory: compiler
        run: test "$(git rev-parse HEAD)" = "d27beceb8b98e132331f50fae22b8394f4b547e0"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Isolate AArch64 dependency closure
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p a64/crates
          cp -a compiler/crates/ir compiler/crates/backend compiler/crates/backend-aarch64 a64/crates/
          cat > a64/Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir","crates/backend","crates/backend-aarch64"]
          EOF
      - name: AArch64 all-target strict compile
        working-directory: a64
        run: RUSTFLAGS="-D warnings" cargo check -p compiler-backend-aarch64 --all-targets
      - name: Strict production and FP-test Clippy
        working-directory: a64
        run: |
          cargo clippy -p compiler-backend-aarch64 --lib -- -D warnings
          cargo clippy -p compiler-backend-aarch64 --test typeid_fp_cfg_native -- -D warnings
          cargo clippy -p compiler-backend-aarch64 --test typeid_fp_native -- -D warnings
          cargo clippy -p compiler-backend-aarch64 --test typeid_fp_compare_native -- -D warnings
      - name: New canonical FP multi-block CFG PHI pressure differential
        working-directory: a64
        run: cargo test -p compiler-backend-aarch64 --test typeid_fp_cfg_native -- --nocapture
      - name: Previous IEEE FP constant and binary C oracle
        working-directory: a64
        run: cargo test -p compiler-backend-aarch64 --test typeid_fp_native -- --nocapture
      - name: Previous NaN-aware comparison 114688 C oracle
        working-directory: a64
        run: cargo test -p compiler-backend-aarch64 --test typeid_fp_compare_native -- --nocapture
      - name: Full AArch64 backend all-target native regression suite
        working-directory: a64
        run: cargo test -p compiler-backend-aarch64 --all-targets -- --test-threads=1
