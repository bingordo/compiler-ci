name: Check compiler archive removal
on:
  pull_request:
    paths: ['.github/workflows/check-archive-deletion-3768.yml']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 872f94e29cc18d31f0a63416b4ab2b9030db8396
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
          fetch-depth: 3
      - name: Confirm deletion scope and references
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 872f94e29cc18d31f0a63416b4ab2b9030db8396
          test "$(git diff --name-only a08926a69f7f0d8807b9f0241caee40201ee2f2c HEAD | wc -l)" -eq 77
          test "$(git diff --diff-filter=D --name-only a08926a69f7f0d8807b9f0241caee40201ee2f2c HEAD -- docs/archive/x7-s4-handwritten-tests | wc -l)" -eq 75
          test ! -e docs/archive/x7-s4-handwritten-tests
          refs="$(git grep -n -F 'x7-s4-handwritten-tests')"
          test "$(printf '%s\n' "$refs" | wc -l)" -eq 2
          if printf '%s\n' "$refs" | grep -vF 'https://github.com/bingordo/compiler/blob/a08926a69f7f0d8807b9f0241caee40201ee2f2c/docs/archive/'; then
            echo 'Unexpected nonhistorical archive references'
            exit 1
          fi
          python3 tools/check_doc_links.py
