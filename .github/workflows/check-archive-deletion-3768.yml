name: Check compiler archive removal
on:
  pull_request:
    paths: ['.github/workflows/check-archive-deletion-3768.yml']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 56b6260002703f6c7bb2f8b21e74bff97f56b94b
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
          fetch-depth: 2
      - name: Confirm deletion scope and references
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 56b6260002703f6c7bb2f8b21e74bff97f56b94b
          test "$(git diff --name-only HEAD^ HEAD | wc -l)" -eq 75
          test "$(git diff --diff-filter=D --name-only HEAD^ HEAD -- docs/archive/x7-s4-handwritten-tests | wc -l)" -eq 75
          test ! -e docs/archive/x7-s4-handwritten-tests
          if git grep -n -F 'x7-s4-handwritten-tests'; then
            echo 'Remaining archive references'
            exit 1
          else
            test "$?" -eq 1
          fi
          python3 tools/check_doc_links.py
