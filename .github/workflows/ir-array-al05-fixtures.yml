name: IR array fold and AL05 fixed fixture gate
on:
  push:
    branches: [ci/ir-array-al05-fixed-20261114]
    paths: ['.github/workflows/ir-array-al05-fixtures.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: a71ea40b2322997a508870a0aad4fea8e25c8424
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Exact source SHA and isolated core workspace
        run: |
          set -euo pipefail
          test "$(git -C compiler rev-parse HEAD)" = "a71ea40b2322997a508870a0aad4fea8e25c8424"
          echo "Compiler SHA: a71ea40b2322997a508870a0aad4fea8e25c8424" >> "$GITHUB_STEP_SUMMARY"
          cat > compiler/Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir", "crates/opt", "crates/backend", "crates/backend-x86", "crates/backend-aarch64"]
          EOF
          rm -f compiler/Cargo.lock
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: ir-array-al05-fixed
      - name: Run array-folding trap oracle and AL05 original native x86 C11
        working-directory: compiler
        run: |
          set -euo pipefail
          cargo test -p compiler-opt --test array_fold_native --test al05_native_bridge -- --nocapture
      - name: Run adjacent previously migrated typed optimizer/alias oracles
        working-directory: compiler
        run: |
          set -euo pipefail
          cargo test -p compiler-opt --test typed_local_memory --test typed_global_memory --test typed_cse --test typed_core_pipeline --test typed_dse --test typed_if_conversion_native
      - name: Check production compiler core libraries
        working-directory: compiler
        run: cargo check --workspace --lib
      - name: Strict scoped Clippy on IR/optimizer and affected integration tests
        working-directory: compiler
        run: |
          set -euo pipefail
          cargo clippy -p compiler-ir -p compiler-opt -p compiler-backend -p compiler-backend-aarch64 --lib -- -D warnings
          cargo clippy -p compiler-opt --test array_fold_native --test al05_native_bridge -- -D warnings -A unused-variables
      - name: Record pinned acceptance gate
        run: |
          echo '12 array fold and AL05 fixed TypeId v3 graphs, original C11 and trap oracles, adjacent suite, library typecheck and scoped Clippy PASS' >> "$GITHUB_STEP_SUMMARY"
