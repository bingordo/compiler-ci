name: IR array fold and AL05 fixed fixture gate
on:
  push:
    branches: [ci/ir-array-al05-fixed-20261114]
    paths: ['.github/workflows/ir-array-al05-fixtures.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 3c7ca5f9442caecae12dd76f1f27182907306bec
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Exact source SHA and isolated core workspace
        run: |
          set -euo pipefail
          test "$(git -C compiler rev-parse HEAD)" = "3c7ca5f9442caecae12dd76f1f27182907306bec"
          echo "Compiler SHA: 3c7ca5f9442caecae12dd76f1f27182907306bec" >> "$GITHUB_STEP_SUMMARY"
          cat > compiler/Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir", "crates/opt", "crates/backend", "crates/backend-x86", "crates/backend-aarch64"]
          EOF
          rm -f compiler/Cargo.lock
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: ir-array-al05-fixed
      - name: Export original array-folding fixed corpus
        working-directory: compiler
        run: cargo test -p compiler-opt --test array_fold_native export_original_array_fold_fixed_inputs -- --nocapture
      - name: Export original AL05 admitted-loop fixed corpus
        working-directory: compiler
        run: cargo test -p compiler-opt --test al05_native_bridge export_original_al05_fixed_inputs -- --nocapture
