name: Temporary TypeId snapshot-order contract #3687
on:
  pull_request:
    paths: ['.github/workflows/temp-typeid-order-3687.yml']
permissions:
  contents: read
jobs:
  replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      SOURCE_SHA: 46aced39a2e49332c7911c5bac114875501ada36
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: ${{ env.SOURCE_SHA }}
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.CI_KEY }}
      - name: Trust GitHub for frontend dependency fetches
        run: ssh-keyscan github.com >> ~/.ssh/known_hosts
      - name: Exact source and replay ordering contract
        working-directory: compiler
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          cargo test -p compiler --test typeid_ir_dump_replay -- --nocapture
