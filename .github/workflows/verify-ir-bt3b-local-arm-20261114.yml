name: Source-pinned native ARM BT3b local C11 oracle
on:
  pull_request:
    paths:
      - '.github/workflows/verify-ir-bt3b-local-arm-20261114.yml'
permissions:
  contents: read
jobs:
  native-arm:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.CI_KEY }}
      - run: ssh-keyscan github.com >> ~/.ssh/known_hosts
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: d316ba4e7dc44c7f3a947357eba71d49fa791556
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - run: |
          test "$(git -C compiler rev-parse HEAD)" = d316ba4e7dc44c7f3a947357eba71d49fa791556
          test "$(uname -m)" = aarch64
          command -v cc
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler
          key: ir-bt3b-local-arm
      - name: Warnings-denied native ARM check
        working-directory: compiler
        run: RUSTFLAGS="-D warnings" cargo check -p compiler-ir -p compiler-backend -p compiler-backend-aarch64 --all-targets
      - name: Original C11 oracle on actual ARM (ELF/GAS x PIC/non-PIC)
        working-directory: compiler
        run: cargo test -p compiler-backend-aarch64 --test local_memory -- --nocapture
      - name: Full ARM backend all-target suite
        working-directory: compiler
        run: cargo test -p compiler-backend-aarch64 --all-targets -- --test-threads=2
      - name: Strict AArch64 Clippy
        working-directory: compiler
        run: cargo clippy -p compiler-backend-aarch64 --all-targets -- -D warnings
