name: TEMP BT4 maintained native boundary exact-source acceptance
on:
  push:
    paths:
      - '.github/workflows/bt4-boundary-acceptance-20261121.yml'
permissions:
  contents: read
jobs:
  x86-live:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.CI_KEY }}
      - run: ssh-keyscan github.com >> ~/.ssh/known_hosts
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 6167fcdbad726f2441d8e75cab2f677d0fe888dd
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Fail-closed BT4 guard
        run: |
          set -euo pipefail
          python3 -m py_compile compiler/tools/check_bt4_backend_boundary.py
          python3 compiler/tools/check_bt4_backend_boundary.py
      - name: Independently execute maintained native x86 ABI and ELF oracles
        working-directory: compiler
        run: |
          set -euo pipefail
          cargo test -p compiler-backend-x86 \
            --test m4_7_indirect_ssa_native \
            --test m4_global_definitions_native \
            --test m4_relro_linkage_native \
            --test call_clobber_pressure_native \
            --test fixed_clobber_interactions_native \
            --test x4_cfg_pressure_native \
            --test bt2b_typeid_index_pressure_native \
            -- --test-threads=1
          cargo test -p compiler-backend \
            --test x86_elf_symbol_attributes \
            --test x86_elf_symbol_link_native \
            --test x86_elf_tls_native \
            --test x86_elf_contract \
            -- --test-threads=1
      - name: Run compiler source TLS/physical replay suites
        working-directory: compiler
        run: |
          set -euo pipefail
          cargo test -p compiler \
            --test typeid_x86_physical_dump \
            --test typeid_tls_linker_matrix \
            -- --test-threads=1
  arm-source:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 25
    steps:
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.CI_KEY }}
      - run: ssh-keyscan github.com >> ~/.ssh/known_hosts
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 6167fcdbad726f2441d8e75cab2f677d0fe888dd
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Native ARM64 BT4 gate (same as scheduled workflow)
        run: |
          set -euo pipefail
          python3 compiler/tools/check_bt4_backend_boundary.py
          cd compiler
          cargo test -p compiler-backend-aarch64 --all-targets -- --test-threads=1
