name: Validate five AL05 native TypeId families PR2756
on:
  push:
    branches:
      - ci/validate-al05-five-family-2756-20261122
    paths:
      - '.github/workflows/validate-native-al05-five-2756.yml'
  pull_request:
    paths:
      - '.github/workflows/validate-native-al05-five-2756.yml'
permissions:
  contents: read
jobs:
  al05-native:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      SOURCE_SHA: e74415e59cc32245f6214ebfccae478351548d77
      CARGO_INCREMENTAL: '0'
      CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
    steps:
      - name: Checkout exact compiler candidate
        uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: ${{ env.SOURCE_SHA }}
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Verify SHA and isolate optimizer and target backends
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C compiler rev-parse HEAD)" = "$SOURCE_SHA"
          cat > compiler/Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir", "crates/opt", "crates/backend", "crates/backend-x86", "crates/backend-aarch64"]
          EOF
          rm -f compiler/Cargo.lock
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: native-al05-five-2756
      - name: Audit no legacy Function fixture bridge and production IR
        working-directory: compiler
        run: |
          set -euo pipefail
          ! grep -qE 'typeid_executable_fixture|typed_fixture|from_legacy' crates/opt/tests/al05_affine_native_bridge.rs crates/opt/tests/al05_parameterized_native_bridge.rs crates/opt/tests/al05_linear_native_bridge.rs crates/opt/tests/al05_diamond_native_bridge.rs crates/opt/tests/al05_dag_native_bridge.rs crates/opt/tests/support/native_al05_variants.rs
          python3 tools/ir_consumer_inventory.py --check-production
      - name: Compile all five AL05 suites and both native backend crates
        working-directory: compiler
        run: |
          cargo check -p compiler-opt --lib --test al05_affine_native_bridge --test al05_parameterized_native_bridge --test al05_linear_native_bridge --test al05_diamond_native_bridge --test al05_dag_native_bridge
          cargo check -p compiler-backend-x86 --lib
          cargo check -p compiler-backend-aarch64 --lib
      - name: Run all five x86-64 AL05 CSE GAS and direct ELF C differential oracles
        working-directory: compiler
        run: |
          for target in al05_affine_native_bridge al05_parameterized_native_bridge al05_linear_native_bridge al05_diamond_native_bridge al05_dag_native_bridge; do
            cargo test -p compiler-opt --test "$target" -- --nocapture
          done
      - name: Install AArch64 cross runner
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq gcc-aarch64-linux-gnu qemu-user
      - name: Run all five AArch64 QEMU AL05 GAS and ELF independent C oracles
        working-directory: compiler
        env:
          AL05_REQUIRE_AARCH64: '1'
        run: |
          for target in al05_affine_native_bridge al05_parameterized_native_bridge al05_linear_native_bridge al05_diamond_native_bridge al05_dag_native_bridge; do
            cargo test -p compiler-opt --test "$target" -- --ignored --nocapture
          done
