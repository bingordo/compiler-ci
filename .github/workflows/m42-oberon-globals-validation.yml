name: M4.2 Oberon source globals integration
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/m42-oberon-globals-validation.yml
permissions:
  contents: read
concurrency:
  group: m42-oberon-globals
  cancel-in-progress: true
jobs:
  globals:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout compiler branch
        uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: main
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Checkout frontend branch
        uses: actions/checkout@v4
        with:
          repository: bingordo/oberon
          ref: main
          path: oberon
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Identify exact source revisions
        run: |
          git -C compiler rev-parse HEAD
          git -C oberon rev-parse HEAD
      - name: Validate Oberon projection and complete compiler driver
        shell: bash
        env:
          CARGO_NET_GIT_FETCH_WITH_CLI: "true"
        run: |
          set -euo pipefail
          # Resolve the driver's pinned frontend Git revision directly
          # from this checked out repository. No secondary SSH access
          # or unpinned branch pulls from Cargo are required.
          git config --global url."file://$GITHUB_WORKSPACE/oberon".insteadOf "ssh://git@github.com/bingordo/oberon.git"
          cargo test --manifest-path oberon/oberon/Cargo.toml -p oberon-front-ir
          cargo test --manifest-path compiler/Cargo.toml -p compiler
