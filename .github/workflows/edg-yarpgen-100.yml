# Extended EDG/Cranelift reference coverage, using the same pinned
# toolchains and independent GCC/Clang differential as the 10-seed smoke.
# Keep extended cohorts out of every commit/PR to control CI minutes.
name: EDG Cranelift 100-seed coverage
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/edg-yarpgen-100.yml'
  schedule:
    - cron: '21 7 * * 0'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  coverage:
    uses: ./.github/workflows/edg-yarpgen.yml
    with:
      source_ref: cranelift-codegen
      count: '100'
      start_seed: '12345'
