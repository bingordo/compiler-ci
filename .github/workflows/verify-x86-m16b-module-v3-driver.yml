name: x86 M1.16b module v3 driver replay compiler PR 1220
on:
  pull_request:
    paths:
      - '.github/workflows/verify-x86-m16b-module-v3-driver.yml'
permissions:
  contents: read
jobs:
  x86-module-v3-driver:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.CI_KEY }}
      - name: Trust pinned frontend host
        run: ssh-keyscan github.com >> ~/.ssh/known_hosts
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: f84f21a00f671784c2927ae935c95527ccf5f052
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Verify exact source SHA
        run: test "$(git -C compiler rev-parse HEAD)" = "f84f21a00f671784c2927ae935c95527ccf5f052"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: x86-m16b-module-v3-driver
          cache-workspace-crates: 'true'
      - name: Driver x86 module v3 and legacy replay integration
        working-directory: compiler
        run: |
          cargo test -p compiler --test typeid_x86_physical_dump -- --nocapture
          cargo test -p compiler --test typeid_ir_dump_replay -- --nocapture
          cargo test -p compiler-backend-x86 --test typeid_physical_module_v3 -- --nocapture
      - name: Full backend tests and driver/backend strict Clippy
        working-directory: compiler
        run: |
          cargo test -p compiler-backend-x86
          cargo clippy -p compiler -p compiler-backend-x86 --all-targets -- -D warnings
