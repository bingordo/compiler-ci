name: Source-pinned native AArch64 mixed-width critical-edge PHI review #689
on:
  push:
    branches: [review/aarch64-critical-phi-call-result-689]
    paths: ['.github/workflows/review-aarch64-critical-phi-call-result-689.yml']
  pull_request:
    paths: ['.github/workflows/review-aarch64-critical-phi-call-result-689.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 35
    steps:
      - name: Checkout temporary compiler-ci source
        uses: actions/checkout@v4
      - name: Checkout exact compiler PR source
        uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 55a7594168d2cefed19335f4843747b0b6802047
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Verify source pin and native AArch64 architecture
        run: |
          set -euo pipefail
          test "$(git -C compiler rev-parse HEAD)" = "55a7594168d2cefed19335f4843747b0b6802047"
          test "$(uname -m)" = "aarch64"
          command -v gcc
      - uses: dtolnay/rust-toolchain@stable
      - name: Isolate core Rust workspace on ARM64 CI
        working-directory: compiler
        run: |
          python3 - <<'PY'
          from pathlib import Path
          Path('Cargo.toml').write_text("""[workspace]
          resolver = "2"
          members = ["crates/ir", "crates/opt", "crates/backend", "crates/backend-x86", "crates/backend-aarch64"]
          """)
          PY
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: review-aarch64-critical-phi-call-result-689
      - name: New mixed pointer scalar critical-edge and returned indirect C11 oracle
        working-directory: compiler
        run: cargo test -p compiler-opt --test review_aarch64_mixed_phi_critical_call -- --nocapture
      - name: Previous ARM64 local/global escaped indirect callback and narrow byte-PHI tests
        working-directory: compiler
        run: |
          set -euo pipefail
          cargo test -p compiler-opt --test review_aarch64_mixed_global_escape_loop -- --nocapture
          cargo test -p compiler-opt --test review_aarch64_loop_byte_phi_callback -- --nocapture
          cargo test -p compiler-opt --test review_aarch64_byte_phi_indirect_memory -- --nocapture
      - name: Existing AArch64 pointer PHI, multi-arg ABI, memory, and pressure controls
        working-directory: compiler
        run: |
          set -euo pipefail
          cargo test -p compiler-backend-aarch64 --test ptr64_calls -- --nocapture
          cargo test -p compiler-backend-aarch64 --test typeid_abi_calls_native -- --nocapture
          cargo test -p compiler-backend-aarch64 --test typeid_historical_pressure -- --nocapture
      - name: Strict affected libraries and new ARM64 test Clippy
        working-directory: compiler
        run: |
          set -euo pipefail
          cargo clippy -p compiler-ir -p compiler-opt -p compiler-backend -p compiler-backend-aarch64 --lib -- -D warnings
          cargo clippy -p compiler-opt --test review_aarch64_mixed_phi_critical_call -- -D warnings
