name: x86 DAG group admission source identity audit
on:
  pull_request:
    paths: ['.github/workflows/verify-x86-dag-group-source-admission.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  dag-source-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact compiler candidate
        uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 480fcb6310b2ec0a9ecb3e34c2ab06d06802a65a
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Require exact source SHA
        run: test "$(git -C compiler rev-parse HEAD)" = "480fcb6310b2ec0a9ecb3e34c2ab06d06802a65a"
      - name: Check pinned DAG table admission and negative mutations
        working-directory: compiler
        run: |
          set -euo pipefail
          export PYTHONPATH="$PWD/tools"
          python3 tools/regen_x86_dag_rule_groups.py --check
          python3 -m unittest discover -s tools -p test_x86_dag_rule_groups.py -v
          python3 -m unittest discover -s tools -p test_x86_dag_codegen.py -v
