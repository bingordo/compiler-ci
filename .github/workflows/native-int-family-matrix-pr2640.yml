name: Validate native-int family matrix PR2640
on:
  pull_request:
    paths:
      - '.github/workflows/native-int-family-matrix-pr2640.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  family-matrix:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      CARGO_INCREMENTAL: '0'
      SOURCE_SHA: 55f9714b3557342db6b98b199b68181448daaf53
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 55f9714b3557342db6b98b199b68181448daaf53
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Verify source revision and isolate optimizer workspace
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C compiler rev-parse HEAD)" = "$SOURCE_SHA"
          cat > compiler/Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir", "crates/opt", "crates/backend", "crates/backend-x86"]
          EOF
          rm -f compiler/Cargo.lock
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: native-int-seeded-generator
      - name: All 15 generated family and CFG suite differential and rollback tests
        working-directory: compiler
        shell: bash
        run: |
          set -euo pipefail
          cargo test -p compiler-opt --test generated_native_add_partition_comparison_s2328 -- --nocapture
          cargo test -p compiler-opt --test generated_native_add_xor_carry_comparison_s2331 -- --nocapture
          cargo test -p compiler-opt --test generated_native_additive_pair_cancellation_s2334 -- --nocapture
          cargo test -p compiler-opt --test generated_native_bitwise_comparison_s2321 -- --nocapture
          cargo test -p compiler-opt --test generated_native_carry_reconstruction_s2327 -- --nocapture
          cargo test -p compiler-opt --test generated_native_complement_mask_s2326 -- --nocapture
          cargo test -p compiler-opt --test generated_native_complement_pair_s2325 -- --nocapture
          cargo test -p compiler-opt --test generated_native_disjoint_arithmetic_s2323 -- --nocapture
          cargo test -p compiler-opt --test generated_native_dual_arithmetic_cancellation_s2333 -- --nocapture
          cargo test -p compiler-opt --test generated_native_matchpd_arithmetic_s2320 -- --nocapture
          cargo test -p compiler-opt --test generated_native_reverse_carry_s2330 -- --nocapture
          cargo test -p compiler-opt --test generated_native_reverse_subtractive_s2329 -- --nocapture
          cargo test -p compiler-opt --test generated_native_shared_masked_sub_s2332 -- --nocapture
          cargo test -p compiler-opt --test generated_native_subtractive_partition_s2322 -- --nocapture
          cargo test -p compiler-opt --test generated_native_xor_partition_s2324 -- --nocapture
      - name: Focused lint (upstream production warning categories exempt)
        working-directory: compiler
        shell: bash
        run: |
          cargo clippy -p compiler-opt --test generated_native_add_partition_comparison_s2328 --test generated_native_add_xor_carry_comparison_s2331 --test generated_native_additive_pair_cancellation_s2334 --test generated_native_bitwise_comparison_s2321 --test generated_native_carry_reconstruction_s2327 --test generated_native_complement_mask_s2326 --test generated_native_complement_pair_s2325 --test generated_native_disjoint_arithmetic_s2323 --test generated_native_dual_arithmetic_cancellation_s2333 --test generated_native_matchpd_arithmetic_s2320 --test generated_native_reverse_carry_s2330 --test generated_native_reverse_subtractive_s2329 --test generated_native_shared_masked_sub_s2332 --test generated_native_subtractive_partition_s2322 --test generated_native_xor_partition_s2324 -- -D warnings -A dead-code -A clippy::empty-line-after-doc-comments -A unused-imports -A clippy::too-many-arguments
