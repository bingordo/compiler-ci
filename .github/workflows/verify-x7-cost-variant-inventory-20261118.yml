name: X7 cost exact-variant inventory
on:
  pull_request:
    paths:
      - '.github/workflows/verify-x7-cost-variant-inventory-20261118.yml'
permissions:
  contents: read
jobs:
  reviewed-variant-mapping:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact compiler candidate
        uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: f04ce4a53b817d57816173e99d63155544544ddc
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Source-pinned cost mapping inventory and mutation tests
        working-directory: compiler
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "f04ce4a53b817d57816173e99d63155544544ddc"
          python3 -m py_compile tools/x7_cost_variant_inventory.py tools/test_x7_cost_variant_inventory.py
          PYTHONPATH=tools python3 -m unittest -v test_x7_cost_variant_inventory test_import_uops_info
          python3 tools/x7_cost_variant_inventory.py > ../x7-cost-variant-inventory.json
          python3 - <<'PY'
          from pathlib import Path
          import json
          d=json.loads(Path("../x7-cost-variant-inventory.json").read_text())
          assert d["catalog_encoding_forms"] > 0
          assert sum(d["statuses"].values()) == d["catalog_encoding_forms"]
          assert d["auto_admitted_cost_entries"] == 0
          assert d["per_cpu_measurement_coverage"] is None
          print("X7_COST_VARIANT_INVENTORY_GREEN", d["statuses"])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: x7-cost-variant-inventory
          path: x7-cost-variant-inventory.json
          if-no-files-found: warn
