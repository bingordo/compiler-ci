name: ASM1 bounded AT&T assembler source-pinned check
on:
  push:
    branches: [ci/asm1-att-bootstrap]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  x86-asm:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: d22e887e7a8c453e917235ab20d51283b3c2e70a
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Record compiler source revision
        run: |
          git rev-parse HEAD
          rustc --version
      - name: Use core workspace without private frontend dependencies
        run: |
          cat > Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir", "crates/opt", "crates/backend", "crates/backend-x86"]
          EOF
          rm -f Cargo.lock
      - uses: Swatinem/rust-cache@v2
        with:
          key: asm1-att-bootstrap
      - name: Compile x86 targets and run focused assembler tests
        run: |
          set -euo pipefail
          python3 tools/regen_x86_att_forms.py --check
          python3 -m unittest discover -s tools -p 'test_regen_x86_att_forms.py' -v
          cargo check -p compiler-backend-x86 --all-targets
          cargo test -p compiler-backend-x86 --test att_asm -- --nocapture
          cargo test -p compiler-backend-x86
          cargo clippy -p compiler-backend-x86 --all-targets -- -D warnings
          echo 'ASM1_BOUNDED_AT_T status=PASS' | tee -a "$GITHUB_STEP_SUMMARY"
