# Source-pinned diagnostic warm-hit cache breakdown on actual x86 ELF CLI.
name: LTO PR2980 cache profile
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/lto-pr2980-cache-profile-20261123.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cache-profile:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      SOURCE_SHA: 84bd2b11f77b22fa05e6b67f9c3e9d1eb1b31026
      CARGO_INCREMENTAL: '0'
      CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
    steps:
      - name: Checkout exact compiler source
        uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: ${{ env.SOURCE_SHA }}
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Verify pinned source
        run: test "$(git -C compiler rev-parse HEAD)" = "$SOURCE_SHA"
      - name: Make private frontend dependencies available
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.CI_KEY }}
      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: lto-pr2980-cache-profile
      - name: End-to-end ELF LTO cache profile and GCC native oracle
        working-directory: compiler
        shell: bash
        run: |
          set -euo pipefail
          cargo test -p compiler --test lto_cli lto_cli_cache_cold_warm_corrupt_and_option_invalidation -- --nocapture
          cargo test -p compiler --bin compiler lto_object_cache -- --nocapture
      - name: Compare release ELF cache cold and warm phase timings
        working-directory: compiler
        shell: bash
        run: |
          set -euo pipefail
          cargo test --release -p compiler --test lto_cli lto_cli_cache_cold_warm_corrupt_and_option_invalidation -- --nocapture
      - name: Check full driver
        working-directory: compiler
        run: cargo check -p compiler --bin compiler
