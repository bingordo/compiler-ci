name: AArch64 backend (compiler-ci)
on:
  workflow_dispatch:
    inputs:
      compiler_ref:
        description: 'Compiler branch, tag, or commit to test'
        required: true
        default: 'aarch64-bootstrap-20261029'
        type: string
  schedule:
    - cron: '*/30 * * * *'

permissions:
  contents: read

concurrency:
  group: aarch64-backend
  cancel-in-progress: true

jobs:
  aarch64-targeted:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - name: Configure SSH for private compiler and Oberon
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.CI_KEY }}
      - name: Trust GitHub SSH host
        run: ssh-keyscan github.com >> ~/.ssh/known_hosts
      - name: Checkout compiler source
        uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: ${{ inputs.compiler_ref || 'aarch64-bootstrap-20261029' }}
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler
          key: aarch64-targeted
      - name: Check AArch64 backend
        working-directory: compiler
        run: cargo check -p compiler-backend-aarch64 --locked
      - name: Test AArch64 backend natively
        working-directory: compiler
        run: cargo test -p compiler-backend-aarch64 --locked
