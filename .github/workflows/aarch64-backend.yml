name: AArch64 backend (compiler-ci)
on:
  workflow_dispatch:
    inputs:
      compiler_ref:
        description: 'Compiler branch, tag, or commit to test'
        required: true
        default: 'aarch64-bootstrap-20261029'
        type: string
  push:
    paths:
      - '.github/workflows/aarch64-backend.yml'
  schedule:
    - cron: '*/15 * * * *'

permissions:
  contents: read

concurrency:
  group: aarch64-backend
  cancel-in-progress: true

jobs:
  detect-change:
    runs-on: ubuntu-24.04
    outputs:
      source_sha: ${{ steps.source.outputs.sha }}
      should_test: ${{ steps.decision.outputs.should_test }}
    steps:
      - name: Configure SSH for compiler lookup
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.CI_KEY }}
      - name: Trust GitHub SSH host
        run: ssh-keyscan github.com >> ~/.ssh/known_hosts
      - name: Resolve compiler revision
        id: source
        env:
          REF: ${{ inputs.compiler_ref || 'aarch64-bootstrap-20261029' }}
        run: |
          set -euo pipefail
          sha=$(git ls-remote ssh://git@github.com/bingordo/compiler.git "refs/heads/$REF" "refs/tags/$REF" | head -n1 | cut -f1)
          if [ -z "$sha" ]; then
            git init -q lookup
            git -C lookup remote add origin ssh://git@github.com/bingordo/compiler.git
            git -C lookup fetch -q --depth=1 origin "$REF"
            sha=$(git -C lookup rev-parse FETCH_HEAD)
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - name: Check successful verification marker
        id: marker
        uses: actions/cache/restore@v4
        with:
          path: .aarch64-verified
          key: aarch64-verified-v1-${{ steps.source.outputs.sha }}
          enableCrossOsArchive: true
      - name: Decide whether to test
        id: decision
        env:
          CACHE_HIT: ${{ steps.marker.outputs.cache-hit }}
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" = workflow_dispatch ] || [ "$CACHE_HIT" != true ]; then
            echo 'should_test=true' >> "$GITHUB_OUTPUT"
          else
            echo 'should_test=false' >> "$GITHUB_OUTPUT"
            echo 'Compiler SHA already verified; skipping ARM64 runner.' >> "$GITHUB_STEP_SUMMARY"
          fi
  aarch64-targeted:
    needs: detect-change
    if: needs.detect-change.outputs.should_test == 'true'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - name: Configure SSH for compiler checkout
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.CI_KEY }}
      - name: Trust GitHub SSH host
        run: ssh-keyscan github.com >> ~/.ssh/known_hosts
      - name: Checkout compiler source
        uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: ${{ needs.detect-change.outputs.source_sha }}
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Prepare isolated AArch64 workspace
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p aarch64-workspace/crates
          cp -a compiler/crates/ir compiler/crates/backend compiler/crates/backend-aarch64 aarch64-workspace/crates/
          cat > aarch64-workspace/Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir", "crates/backend", "crates/backend-aarch64"]
          EOF
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: aarch64-workspace
          key: aarch64-targeted
      - name: Check AArch64 backend
        working-directory: aarch64-workspace
        run: cargo check -p compiler-backend-aarch64
      - name: Test AArch64 backend natively
        working-directory: aarch64-workspace
        run: cargo test -p compiler-backend-aarch64
      - name: Record successful verification
        run: |
          mkdir -p .aarch64-verified
          printf '%s\n' '${{ needs.detect-change.outputs.source_sha }}' > .aarch64-verified/source-sha
      - name: Cache successful verification marker
        uses: actions/cache/save@v4
        with:
          path: .aarch64-verified
          key: aarch64-verified-v1-${{ needs.detect-change.outputs.source_sha }}
          enableCrossOsArchive: true
