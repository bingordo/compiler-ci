name: X7 IP16 real source pressure CFG and call physical A B
on:
  pull_request:
    paths:
      - '.github/workflows/x7-ip16-pressure-cfg-source-20261125.yml'
permissions:
  contents: read
jobs:
  ip16-real-physical:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: fe687503005b3dcb0de7b13429e5c44eee1bdbf3
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Confirm exact compiler source and Rust
        run: |
          set -euo pipefail
          test "$(git -C compiler rev-parse HEAD)" = fe687503005b3dcb0de7b13429e5c44eee1bdbf3
          git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
          git config --global --add url."https://github.com/".insteadOf "git@github.com:"
          rustc --version
          cc --version | head -1
      - name: Real high pressure 32 and 64 bit checked source matrix
        working-directory: compiler
        run: |
          set -euo pipefail
          cargo test -p compiler --bin compiler --features 'x7-ip7-workload-profile x7-ip16-pressure-cfg' ip16_auto_source_pressure_sweep_measures_real_spills_and_winners -- --nocapture 2>&1 | tee /tmp/x7-ip16-pressure.log
          grep 'X7_IP16_SUMMARY tag=pressure' /tmp/x7-ip16-pressure.log | tee -a "$GITHUB_STEP_SUMMARY"
          grep -E 'X7_IP16_RULE tag=pressure' /tmp/x7-ip16-pressure.log | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Real CFG branches, loops, calls and shared use sources
        working-directory: compiler
        run: |
          set -euo pipefail
          cargo test -p compiler --bin compiler --features 'x7-ip7-workload-profile x7-ip16-pressure-cfg' ip16_branches_loops_calls_and_shared_uses_fail_closed_if_unmeasured -- --nocapture 2>&1 | tee /tmp/x7-ip16-control.log
          grep 'X7_IP16_CONTROL_SUMMARY' /tmp/x7-ip16-control.log | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Existing IP15 exact ELF GAS GCC C11 A B remains green
        working-directory: compiler
        run: |
          set -euo pipefail
          cargo test -p compiler-backend-x86 --lib --features x7-ip14-auto-dag-probe ip15_real_encoded_elf_gas_and_gcc_ab_covers_every_auto_discovered_rule -- --nocapture
      - name: Existing optimized checked-source physical A B and default builds
        working-directory: compiler
        run: |
          set -euo pipefail
          cargo test -p compiler --bin compiler --features 'x7-ip7-workload-profile x7-ip16-pressure-cfg' ip15_actual_checked_minic_source_raw_and_optimized_physical_census -- --nocapture
          cargo check -p compiler-backend-x86
          cargo check -p compiler-backend-x86 --features x7-production-generated-logic
          cargo check -p compiler --bin compiler
