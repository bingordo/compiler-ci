# Source-pinned algebra TypeId generated-fixture migration acceptance.
name: IR PR2830 native algebra generated tests
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ir-pr2830-algebra-native-20261122.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-algebra:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      SOURCE_SHA: 70594ea5c27375f3b63fd3f4cf522c553ca7e14d
      CARGO_INCREMENTAL: '0'
      CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
    steps:
      - name: Check out exact compiler source
        uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: ${{ env.SOURCE_SHA }}
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Verify source and isolate Rust core workspace
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C compiler rev-parse HEAD)" = "$SOURCE_SHA"
          cat > compiler/Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir", "crates/opt", "crates/backend", "crates/backend-x86", "crates/backend-aarch64"]
          EOF
          rm -f compiler/Cargo.lock
          rustc --version
      - name: Cache isolated Rust compilation
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: ir-pr2830-native-algebra
      - name: Verify generated TypeId algebra and M4 semantics
        working-directory: compiler
        shell: bash
        run: |
          set -euo pipefail
          cargo test -p compiler-opt --test typed_algebra -- --nocapture
          cargo test -p compiler-opt --test m4_integer_effects -- --nocapture
      - name: Targeted Clippy excluding unrelated existing x86 doc spacing
        working-directory: compiler
        run: |
          cargo clippy -p compiler-opt --test typed_algebra -- -D clippy::all -A clippy::empty_line_after_doc_comments
