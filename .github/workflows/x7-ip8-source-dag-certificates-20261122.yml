name: X7 IP8 source-backed DAG certificate admission
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/x7-ip8-source-dag-certificates-20261122.yml'
permissions:
  contents: read
jobs:
  source-checked-generic-dag-admission:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 4c77c6478ac40c028db040bfeb7e5a6729f61697
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Verify exact compiler candidate and git dependency setup
        run: |
          set -euo pipefail
          test "$(git -C compiler rev-parse HEAD)" = "4c77c6478ac40c028db040bfeb7e5a6729f61697"
          git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
          git config --global --add url."https://github.com/".insteadOf "git@github.com:"
          rustc --version
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: x7-ip8-certified-source-dag-20261122
      - name: Check source-pinned generic rule groups and complete DAG certificates
        working-directory: compiler
        run: |
          set -euo pipefail
          python3 tools/regen_x86_dag_rule_groups.py --check
          python3 tools/x7_ip8_dag_certificates.py --check
          PYTHONPATH=tools python3 -m unittest -v test_x7_ip8_dag_certificates
      - name: Native generic TypeId rule/certificate and backend tests
        working-directory: compiler
        run: |
          set -euo pipefail
          cargo test -p compiler-backend --lib --quiet
          cargo test -p compiler-backend-x86 --lib ip8_source_dag_certificate -- --nocapture
          cargo test -p compiler-backend-x86 --lib dag_match -- --nocapture
          cargo test -p compiler-backend-x86 --lib \
            --features x7-typeid-source-dag-optin --quiet
          cargo clippy -p compiler-backend-x86 --lib \
            --features x7-typeid-source-dag-optin -- \
            -D clippy::correctness -D clippy::suspicious \
            -A clippy::empty_line_after_doc_comments
