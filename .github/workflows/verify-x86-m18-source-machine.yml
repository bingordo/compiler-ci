name: x86 M1.18 source physical module snapshot compiler PR 1232
on:
  pull_request:
    paths:
      - '.github/workflows/verify-x86-m18-source-machine.yml'
permissions:
  contents: read
jobs:
  x86-source-machine:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.CI_KEY }}
      - name: Trust pinned frontend git host
        run: ssh-keyscan github.com >> ~/.ssh/known_hosts
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 202cc47d66311d4d6197d8351e8734c733eaef9b
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Check exact source revision
        run: test "$(git -C compiler rev-parse HEAD)" = "202cc47d66311d4d6197d8351e8734c733eaef9b"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: x86-m18-source-machine
          cache-workspace-crates: 'true'
      - name: Test real Mini-C source physical machine dump/replay
        working-directory: compiler
        run: |
          cargo test -p compiler --test typeid_x86_source_machine_dump -- --nocapture
          cargo test -p compiler --test typeid_x86_physical_dump -- --nocapture
          cargo test -p compiler --test typeid_ir_dump_replay -- --nocapture
      - name: Full x86 backend tests and strict driver/decoder Clippy
        working-directory: compiler
        run: |
          cargo test -p compiler-backend-x86
          cargo clippy -p compiler -p compiler-backend-x86 --all-targets -- -D warnings
