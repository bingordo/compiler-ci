name: X7 pinned ISL parser cache and proof-work regression
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/x7-isl-cache-protocol-20261120.yml'
permissions:
  contents: read
jobs:
  protocol:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 196ef17952e00278eb02a0554b035261712c5e87
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Enforce exact compiler PR 1065 candidate
        run: |
          set -euo pipefail
          test "$(git -C compiler rev-parse HEAD)" = 196ef17952e00278eb02a0554b035261712c5e87
          python3 --version
      - name: Cache corruption, malformed protocol, negative and replay regressions
        run: |
          set -euo pipefail
          python3 -m compileall -q compiler/tools/x86_isl_batch.py compiler/tools/test_x86_isl_batch_protocol.py
          PYTHONPATH=compiler/tools python3 -m unittest -v             test_x86_isl_batch_protocol             test_x86_iform_proof_work_dag
      - name: Verify no selection or semantic proof admission changed
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import ast
          from pathlib import Path
          text = Path('compiler/tools/x86_isl_batch.py').read_text()
          module = ast.parse(text)
          assert any(isinstance(x, ast.FunctionDef) and x.name == 'parse_many' for x in module.body)
          assert 'selection_eligible' not in text
          print('X7_ISL_CACHE_PROTOCOL_CANDIDATE_CHECKED')
          PY
