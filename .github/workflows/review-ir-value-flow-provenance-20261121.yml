name: Review TypeId value flow and pointer provenance
on:
  push:
    branches: [ci/review-ir-value-flow-provenance-20261121]
    paths: ['.github/workflows/review-ir-value-flow-provenance-20261121.yml']
permissions:
  contents: read
jobs:
  ir:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      SOURCE_SHA: "cf5666bb29d796a859193ebb9d9676c04734ff90"
      CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: ${{ env.SOURCE_SHA }}
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Run the IR suite on the reviewed revision
        working-directory: compiler
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
          cargo test -p compiler-ir
          python3 -m unittest discover -s tools -p test_review_coverage.py -v
