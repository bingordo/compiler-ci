# Temporary exact-source LTO v13/v14 metadata verification.
name: LTO PR3048 canonical metadata ELF
on:
  push:
    branches: [validate/lto-pr3048-v2-meta-20261124]
    paths:
      - '.github/workflows/lto-pr3048-v2-meta-20261124.yml'
  workflow_dispatch:
permissions:
  contents: read
  statuses: write
jobs:
  metadata:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      SOURCE_SHA: e119da3bec307763bd77abfd1bcc0d52cf1de223
      CARGO_INCREMENTAL: '0'
      CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
    steps:
      - name: Checkout exact compiler source
        uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: ${{ env.SOURCE_SHA }}
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Verify actual source commit
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C compiler rev-parse HEAD)" = "$SOURCE_SHA"
          git -C compiler log -1 --oneline
      - name: Enable private frontend dependency checkout
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.CI_KEY }}
      - name: Cache compiler build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: lto-pr3048-canonical-v2-meta
      - name: Native IR format and metadata strict regression
        working-directory: compiler
        shell: bash
        run: |
          set -euo pipefail
          cargo test -p compiler-ir --test lto_binary_v2_metadata -- --nocapture
          cargo test -p compiler-ir --test lto_target_envelope -- --nocapture
          cargo test -p compiler-ir --test lto_canonical_binary_v2 -- --nocapture
          cargo test -p compiler-ir --test lto_envelope_merge -- --nocapture
      - name: Source canonical v2 and GCC ELF execution
        working-directory: compiler
        shell: bash
        run: |
          set -euo pipefail
          cargo test -p compiler --test lto_binary_v2_source -- --nocapture
          cargo test -p compiler --test lto_binary_v2_metadata_source -- --nocapture
          cargo test -p compiler --test lto_elf_visibility -- --nocapture
          cargo test -p compiler --test lto_common_elf -- --nocapture
          cargo test -p compiler --test lto_prevailing_weak_strong -- --nocapture
      - name: Full driver check and targeted Clippy
        working-directory: compiler
        shell: bash
        run: |
          set -euo pipefail
          cargo check -p compiler --bin compiler
          cargo clippy -p compiler-ir --test lto_binary_v2_metadata -- -D clippy::all -A clippy::empty_line_after_doc_comments -A clippy::collapsible_if -A clippy::needless_borrows_for_generic_args
          cargo clippy -p compiler --test lto_binary_v2_metadata_source --test lto_binary_v2_source -- -D clippy::all -A clippy::empty_line_after_doc_comments -A clippy::collapsible_if -A clippy::needless_borrows_for_generic_args
      - name: Publish discoverable exact-source status
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_OUTCOME: ${{ job.status }}
        run: |
          case "$JOB_OUTCOME" in
            success) state=success ;;
            cancelled) state=error ;;
            *) state=failure ;;
          esac
          gh api -X POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state="$state" \
            -f context="candidate/lto-pr3048-v2-meta-elf" \
            -f description="PR3048 exact compiler SHA $SOURCE_SHA" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
