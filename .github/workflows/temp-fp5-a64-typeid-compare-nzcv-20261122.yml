# Temporary exact SHA real ARM64 gate. Close unmerged when source merged.
name: TEMP FP5 AArch64 FCMP TypeId 14 NaN-aware Bool predicates
on:
  pull_request:
    paths:
      - '.github/workflows/temp-fp5-a64-typeid-compare-nzcv-20261122.yml'
permissions:
  contents: read
jobs:
  native-a64-typeid-fcmp:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 3005042880fb63bdaf48fee67ea40c2efa90eed4
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Verify exact compiler source
        working-directory: compiler
        run: test "$(git rev-parse HEAD)" = "3005042880fb63bdaf48fee67ea40c2efa90eed4"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Isolate AArch64 backend dependency closure
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p a64/crates
          cp -a compiler/crates/ir compiler/crates/backend compiler/crates/backend-aarch64 a64/crates/
          cat > a64/Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir","crates/backend","crates/backend-aarch64"]
          EOF
      - name: Strict AArch64 all-target TypeId typecheck
        working-directory: a64
        run: RUSTFLAGS="-D warnings" cargo check -p compiler-backend-aarch64 --all-targets
      - name: Native FCMP Bool C11 GCC 114688 cases and NZCV oracle
        working-directory: a64
        run: cargo test -p compiler-backend-aarch64 --test typeid_fp_compare_native -- --nocapture
      - name: Previous F32 F64 arithmetic and exact IEEE constants regression
        working-directory: a64
        run: cargo test -p compiler-backend-aarch64 --test typeid_fp_native -- --nocapture
      - name: Full native AArch64 backend regression suite
        working-directory: a64
        run: cargo test -p compiler-backend-aarch64 --all-targets -- --test-threads=1
      - name: Strict Clippy of production library and both FP regression modules
        working-directory: a64
        run: |
          cargo clippy -p compiler-backend-aarch64 --lib -- -D warnings
          cargo clippy -p compiler-backend-aarch64 --test typeid_fp_compare_native -- -D warnings
          cargo clippy -p compiler-backend-aarch64 --test typeid_fp_native -- -D warnings
