name: FZ-2.5 PR1016 SCCP and trivial PHI targeted oracle
on:
  push:
    branches: [fuzz/fz25-sccp-phi-pr1016-20261111]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  targeted:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: b925f2a4250c47db985d12bf96104a4df421f14d
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Validate exact source and FZ-2.5 tests
        run: |
          test "$(git -C compiler rev-parse HEAD)" = "b925f2a4250c47db985d12bf96104a4df421f14d"
          test -s compiler/crates/opt/tests/typeid_fuzz_targeted.rs
      - name: Isolate dependency-free core
        run: |
          cat > compiler/Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir", "crates/opt", "crates/backend", "crates/backend-x86"]
          EOF
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: fz25-sccp-phi
          cache-workspace-crates: 'true'
      - name: Focused pass positive no-op boundary and native execution
        working-directory: compiler
        run: cargo test -p compiler-opt --test typeid_fuzz_targeted -- --nocapture
      - name: Existing TypeId bias and 21-stage inventory regression
        working-directory: compiler
        run: |
          cargo test -p compiler-opt --test typeid_fuzz_bias
          cargo test -p compiler-opt --test typeid_fuzz_pass_registry
          cargo test -p compiler-opt --test typed_core_native_verifier
      - name: Strict Clippy for targeted and existing fuzzer
        working-directory: compiler
        run: cargo clippy -p compiler-opt --test typeid_fuzz_targeted --test typeid_fuzz_bias --test typeid_fuzz_pass_registry -- -D warnings
