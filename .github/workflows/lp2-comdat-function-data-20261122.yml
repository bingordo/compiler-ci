name: LP2 atomic function and readonly data COMDAT group real GNU selection
on:
  push:
    branches: [ci/lp2-comdat-function-data-20261122]
    paths: ['.github/workflows/lp2-comdat-function-data-20261122.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      SOURCE_SHA: ed7d3dc0d036af2ef6ae6aff717eb4ed7f1e7428
      CARGO_INCREMENTAL: '0'
      CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: ed7d3dc0d036af2ef6ae6aff717eb4ed7f1e7428
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Verify source SHA
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C compiler rev-parse HEAD)" = "$SOURCE_SHA"
          git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
          ld --version | head -1
      - name: Install GNU plugin interface
        run: |
          sudo apt-get update -qq
          sudo apt-get install -qq -y binutils-dev
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: lp2-comdat-function-data
      - name: Test pure Rust core and strict Clippy
        working-directory: compiler
        run: |
          cargo test -p compiler-lto-plugin-core --all-targets -- --nocapture
          cargo clippy -p compiler-lto-plugin-core --lib -- -D warnings
          # Preserve strict linting of the new shared symbol ABI; no suppressions.
      - name: Versioned CLTOIR09/10 COMDAT canonical metadata, corruption and merge rejection
        working-directory: compiler
        run: |
          cargo test -p compiler-ir --test lto_target_envelope -- --nocapture
          cargo test -p compiler-lto-plugin-core --test fat_member_admission -- --nocapture
      - name: Real ELF SHT_GROUP and SHF_GROUP native TypeId double-definition GNU selection
        working-directory: compiler
        run: |
          cargo test -p compiler-backend-x86 --test comdat_single_function_native -- --nocapture
      - name: Checked Mini-C qualifier lowering unit tests
        working-directory: compiler
        run: |
          cargo test --manifest-path tools/mini-c-driver/Cargo.toml \
            --lib global_data::tests -- --nocapture
      - name: Build canonical Rust dynamic ABI and source compiler
        working-directory: compiler
        run: |
          cargo build -p compiler-lto-plugin-core --lib --bin fat-lto-admit
          cargo build -p compiler --bin compiler
      - name: Build opt-in production-slice C ABI adapter
        working-directory: compiler
        shell: bash
        run: |
          set -euo pipefail
          cc -std=c11 -O2 -fPIC -shared -Wall -Wextra -Werror \
            tools/lto-plugin-probe/simple_typeid_plugin.c \
            -L "$PWD/target/debug" -lcompiler_lto_plugin_core \
            "-Wl,-rpath,$PWD/target/debug" \
            -o "$RUNNER_TEMP/lp2-simple-typeid.so"
          test -f "$RUNNER_TEMP/lp2-simple-typeid.so"
      - name: GNU ld real TypeId optimization and ELF replacement incl archives
        working-directory: compiler
        run: |
          python3 tools/test_lto_fat_object.py \
            --compiler target/debug/compiler \
            --rust-admit target/debug/fat-lto-admit \
            --simple-plugin "$RUNNER_TEMP/lp2-simple-typeid.so"
      - name: Native SHA-bound CLTOIR10 COMDAT acceptance with real GNU linker
        working-directory: compiler
        shell: bash
        run: |
          set -euo pipefail
          LP2_PLUGIN_SO="$RUNNER_TEMP/lp2-simple-typeid.so" \
          LP2_COMPILER_BIN="$PWD/target/debug/compiler" \
          cargo test -p compiler-lto-plugin-core --test comdat_single_function_gnu -- --nocapture
      - name: Native canonical TypeId immutable RELRO + private data GNU plugin oracle
        working-directory: compiler
        shell: bash
        run: |
          LP2_PLUGIN_SO="$RUNNER_TEMP/lp2-simple-typeid.so" \
          LP2_COMPILER_BIN="$PWD/target/debug/compiler" \
          cargo test -p compiler-lto-plugin-core --test private_relro_native -- --nocapture
      - name: Original LP1 callback and archive regression
        working-directory: compiler
        run: python3 tools/test_lto_linker_plugin_probe.py
