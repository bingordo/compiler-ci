name: TypeId inline real checked Mini-C source A/B
on:
  push:
    branches: [ci/typeid-inline-source-profile-20261108]
permissions:
  contents: read
jobs:
  mini-c-profile:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 99dfc3ea24c4aa9c2a17ddab8aab4025c1dab3f2
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Verify exact pinned compiler
        run: |
          test "$(git -C compiler rev-parse HEAD)" = "99dfc3ea24c4aa9c2a17ddab8aab4025c1dab3f2"
          git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler/tools/mini-c-driver -> target
          key: typeid-source-c-20261108
      - name: Actual checked Mini-C frontend source and independent GCC runtime A/B
        working-directory: compiler
        run: |
          cargo test --manifest-path tools/mini-c-driver/Cargo.toml --release --features experimental-fusion-benchmark --test typeid_source_inline_profile -- --nocapture 2>&1 | tee ../typeid-source-profile.log
          grep '^TYPEID_SOURCE_INLINE' ../typeid-source-profile.log
          grep '^TYPEID_SOURCE_RUNTIME' ../typeid-source-profile.log
      - name: Preserve complete measured output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: typeid-source-mini-c-profile
          path: typeid-source-profile.log
          if-no-files-found: ignore
      - name: Summary
        run: |
          echo "Checked source frontend, compiler optimizer, native object sizes, independent GCC correctness and runtime A/B completed." >> "$GITHUB_STEP_SUMMARY"
