name: TypeId inline real checked Mini-C source A/B
on:
  push:
    branches: [ci/typeid-inline-source-profile-20261108]
permissions:
  contents: read
jobs:
  mini-c-profile:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: fa6cd9084c1b22e17a29173055df30265c8b90b9
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Verify exact pinned compiler
        run: |
          test "$(git -C compiler rev-parse HEAD)" = "fa6cd9084c1b22e17a29173055df30265c8b90b9"
          git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler/tools/mini-c-driver -> target
          key: typeid-source-c-20261108
      - name: Actual checked Mini-C frontend source and independent GCC runtime A/B
        working-directory: compiler
        run: |
          set -o pipefail
          cargo test --manifest-path tools/mini-c-driver/Cargo.toml --release --features experimental-fusion-benchmark --test typeid_source_inline_profile -- --nocapture 2>&1 | tee ../typeid-source-profile.log
          grep '^TYPEID_SOURCE_INLINE' ../typeid-source-profile.log
          grep '^TYPEID_SOURCE_RUNTIME' ../typeid-source-profile.log
      - name: Preserve complete measured output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: typeid-source-mini-c-profile
          path: typeid-source-profile.log
          if-no-files-found: ignore
      - name: Summary
        run: |
          echo "Checked source frontend, compiler optimizer, native object sizes, independent GCC correctness and runtime A/B completed." >> "$GITHUB_STEP_SUMMARY"

  oberon-profile:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: fa6cd9084c1b22e17a29173055df30265c8b90b9
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Pin and configure checked source frontends
        run: |
          test "$(git -C compiler rev-parse HEAD)" = "fa6cd9084c1b22e17a29173055df30265c8b90b9"
          git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: typeid-source-oberon-20261108
      - name: Actual checked Oberon frontend and independent GCC native A/B
        working-directory: compiler
        run: |
          set -o pipefail
          cargo test --release -p compiler --bin compiler source_checked_oberon_policy_profile -- --ignored --nocapture 2>&1 | tee ../typeid-oberon-profile.log
          grep '^TYPEID_SOURCE_INLINE' ../typeid-oberon-profile.log
          grep '^TYPEID_SOURCE_RUNTIME' ../typeid-oberon-profile.log
      - name: Preserve complete measured Oberon output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: typeid-source-oberon-profile
          path: typeid-oberon-profile.log
          if-no-files-found: ignore

  core-regressions:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: fa6cd9084c1b22e17a29173055df30265c8b90b9
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Source pin and git dependencies
        run: |
          test "$(git -C compiler rev-parse HEAD)" = "fa6cd9084c1b22e17a29173055df30265c8b90b9"
          git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: typeid-inline-source-root-20261108
      - name: Full typed core integration and prior inliner native oracles
        working-directory: compiler
        run: |
          cargo test -p compiler-opt --test typed_core_inline_integration -- --nocapture
          cargo test -p compiler-opt --test typed_core_pipeline
          cargo test -p compiler-opt --test typed_inline_cfg_native
          cargo test -p compiler-opt --test typed_inline_memory_native
          cargo test -p compiler-opt --test typed_inline_wide_void_native
          cargo test -p compiler-opt --test typed_inline_leaf_native
          cargo clippy -p compiler-opt --lib -- -D warnings
          cargo clippy -p compiler --bin compiler -- -D warnings
