name: X7 IP2 independent typed IR SMT equivalence
on:
  pull_request:
    paths: ['.github/workflows/verify-x7-ip2-ir-smt-20261118.yml']
permissions:
  contents: read
jobs:
  independent-pure-expression-equivalence:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 2cbba2214c7d685d743334363e39ffe72649c353
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Install independent SMT reference solver
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y z3
          z3 -version
      - name: Exact-source IP-2 IR SMT and symbolic DAG negative cases
        working-directory: compiler
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "2cbba2214c7d685d743334363e39ffe72649c353"
          python3 -m py_compile tools/x7_ip2_ir_equivalence.py tools/test_x7_ip2_ir_equivalence.py
          PYTHONPATH=tools python3 -m unittest -v test_x7_ip2_ir_equivalence test_x7_ip2_pure_dag_candidates test_x86_isl_symbolic_dag
          echo X7_IP2_INDEPENDENT_PURE_EXPRESSION_SMT_GREEN
