name: Fixed PHI and pure if-conversion IR migration
on:
  push:
    branches: [verify/ir-phi-ifconv-fixtures-20261114]
    paths: ['.github/workflows/ir-phi-ifconv-fixtures-20261114.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: fea525226bf3ff09e1fec28147f41e8e752c39ca
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Verify exact compiler revision
        run: test "$(git -C compiler rev-parse HEAD)" = "fea525226bf3ff09e1fec28147f41e8e752c39ca"
      - name: Restrict workspace to compiler core
        run: |
          cat > compiler/Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir", "crates/opt", "crates/backend", "crates/backend-x86"]
          EOF
          rm -f compiler/Cargo.lock
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: ir-transitive-phi-ifconv
      - name: Run migrated PHI and native four-sink ifconv oracle
        working-directory: compiler
        run: |
          cargo test -p compiler-opt --test typed_transitive_phi --test typed_if_conversion_pure
          cargo test -p compiler-opt --test typed_phi_cfg --test typed_phi_dead_linear --test typed_identical_merges
          cargo test -p compiler-opt --test typed_sccp --test typed_ctfe --test typed_local_memory
          cargo test -p compiler-ir --test native_fixture_text --test native_module_text_v3
          cargo clippy -p compiler-opt --test typed_transitive_phi --test typed_if_conversion_pure -- -D warnings
