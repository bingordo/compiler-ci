name: M49 mem2reg checked load SSA alias
on:
  pull_request:
    paths: ['.github/workflows/m49-load-alias-3438.yml']
permissions:
  contents: read
jobs:
  provenance:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: fc5f8441abc1c7bfa274ca51361c7224322653c6
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Resolve private dependencies
        run: git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
      - name: Source-pinned load alias witnesses, stores and full optimizer regression
        working-directory: compiler
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "fc5f8441abc1c7bfa274ca51361c7224322653c6"
          cd tools/mini-c-driver
          cargo test --test mem2reg_load_alias_receipts -- --nocapture
          cargo test --test mem2reg_source_store_receipts -- --nocapture
          cd ../..
          cargo test -p compiler-opt --lib
          cargo clippy -p compiler-opt --lib -- -D clippy::all
