name: X7 B3c batched Intel operation AST source proofs
on:
  workflow_dispatch:
  push:
    branches: [ci/x7-batched-ast-worker-20261111]
permissions:
  contents: read
jobs:
  batched-fixtures:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 53a57636166e1cf96742671e5217e7931f78b2b2
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Test pinned solver, serial/parallel AST dedup, source proof and corrupted cache negatives
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 53a57636166e1cf96742671e5217e7931f78b2b2
          python3 -m venv /tmp/x7-z3
          /tmp/x7-z3/bin/python -m pip install --disable-pip-version-check 'z3-solver==4.13.4.0'
          /tmp/x7-z3/bin/python -m unittest discover -s tools -p 'test_x86_iform_operation_proof_batch.py' -v
          /tmp/x7-z3/bin/python -m unittest discover -s tools -p 'test_x86_iform_operation_proof_worker.py' -v
          /tmp/x7-z3/bin/python -m unittest discover -s tools -p 'test_x86_isl_batch.py' -v
          /tmp/x7-z3/bin/python -m unittest discover -s tools -p 'test_x86_isl_smt_verify.py' -v
          /tmp/x7-z3/bin/python -m py_compile tools/x86_iform_operation_proof_worker.py
