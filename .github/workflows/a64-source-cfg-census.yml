name: AArch64 generated source CFG GCC differential and branch census
on:
  push:
    paths:
      - scripts/a64_cfg_source_census.py
      - .github/workflows/a64-source-cfg-census.yml
  workflow_dispatch:
    inputs:
      control_ref:
        description: 'Control bingordo/compiler commit SHA or branch (default main)'
        required: false
        type: string
        default: 'main'
      candidate_ref:
        description: 'Candidate bingordo/compiler commit SHA or branch (default main)'
        required: false
        type: string
        default: 'main'
permissions:
  contents: read
  statuses: write
jobs:
  native:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 95
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: ${{ inputs.control_ref || 'main' }}
          path: control
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: ${{ inputs.candidate_ref || 'main' }}
          path: candidate
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Record actual compiler sources and native platform
        run: |
          set -euo pipefail
          uname -m | grep -Eq 'aarch64|arm64'
          git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
          echo "CONTROL_SHA=$(git -C control rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "CANDIDATE_SHA=$(git -C candidate rev-parse HEAD)" >> "$GITHUB_ENV"
          printf 'A64 CFG source corpus, control: %s, candidate: %s\n' \
            "$(git -C control rev-parse HEAD)" "$(git -C candidate rev-parse HEAD)" \
            >> "$GITHUB_STEP_SUMMARY"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            control -> target
            candidate -> target
          key: a64-source-cfg-96-c11-differential
      - name: Reproduce 96 deterministic source functions and independent GCC oracle
        run: |
          set -euo pipefail
          python3 scripts/a64_cfg_source_census.py generate results
          sha256sum results/generated.c results/gcc_reference.c results/oracle.c
      - name: Native compiler source, direct ELF/GAS parity, independent GCC execution
        run: |
          set -euo pipefail
          gcc -std=c11 -O2 -Wall -Wextra -Werror -c results/gcc_reference.c -o results/reference.o
          for rev in control candidate; do
            if [ "$rev" = candidate ] && [ "$CONTROL_SHA" = "$CANDIDATE_SHA" ]; then
              for ext in o s text sym exe; do
                cp "results/control.$ext" "results/candidate.$ext"
              done
              cp results/control-gas.o results/candidate-gas.o
              cp results/control-gas.text results/candidate-gas.text
              echo 'Compiler SHA identical; reuse byte-identical control artifact' >> "$GITHUB_STEP_SUMMARY"
              continue
            fi
            cargo build --release -p compiler --bin compiler --manifest-path "$rev/Cargo.toml"
            "$rev/target/release/compiler" results/generated.c --language mini-c --target aarch64 --emit obj -o "results/$rev.o"
            "$rev/target/release/compiler" results/generated.c --language mini-c --target aarch64 --emit asm -o "results/$rev.s"
            gcc -c "results/$rev.s" -o "results/$rev-gas.o"
            objcopy -O binary --only-section=.text "results/$rev.o" "results/$rev.text"
            objcopy -O binary --only-section=.text "results/$rev-gas.o" "results/$rev-gas.text"
            cmp "results/$rev.text" "results/$rev-gas.text"
            readelf -sW "results/$rev.o" > "results/$rev.sym"
            gcc -std=c11 -O2 -Wall -Wextra -Werror results/oracle.c "results/$rev.o" results/reference.o -o "results/$rev.exe"
            "results/$rev.exe"
          done
      - name: Emit per-function actual AArch64 code size and unconditional B delta
        run: |
          set -euo pipefail
          python3 scripts/a64_cfg_source_census.py report results | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: a64-source-cfg-census
          path: results/
      - name: Publish discoverable compiler-ci commit status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          OUTCOME: ${{ job.status }}
        run: |
          case "$OUTCOME" in success) state=success;; cancelled) state=error;; *) state=failure;; esac
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state="$state" -f context="compiler/a64-source-cfg-census" \
            -f description="A64 96-function GCC/ELF/GAS native source census: $OUTCOME" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
