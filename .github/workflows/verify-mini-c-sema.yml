name: Mini-C semantic regression at exact source SHA

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-mini-c-sema.yml'
  pull_request:
    paths:
      - '.github/workflows/verify-mini-c-sema.yml'
  workflow_dispatch:
    inputs:
      mini_c_sha:
        description: 'Full 40-character Mini-C commit SHA to validate'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: mini-c-sema-${{ inputs.mini_c_sha || '1c5781877e51810eaa1dd4b1674b30e95a75e4a9' }}
  cancel-in-progress: false

jobs:
  sema:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Validate requested immutable revision
        shell: bash
        env:
          MINI_C_SHA: ${{ inputs.mini_c_sha || '1c5781877e51810eaa1dd4b1674b30e95a75e4a9' }}
        run: |
          set -euo pipefail
          [[ "$MINI_C_SHA" =~ ^[0-9a-f]{40}$ ]] || {
            echo "Expected a full lowercase Mini-C commit SHA" >&2
            exit 1
          }
      - name: Checkout exact Mini-C source
        uses: actions/checkout@v4
        with:
          repository: bingordo/mini-c
          ref: ${{ inputs.mini_c_sha || '1c5781877e51810eaa1dd4b1674b30e95a75e4a9' }}
          path: mini-c
          persist-credentials: false
      - name: Confirm exact checkout
        shell: bash
        env:
          MINI_C_SHA: ${{ inputs.mini_c_sha || '1c5781877e51810eaa1dd4b1674b30e95a75e4a9' }}
        run: |
          set -euo pipefail
          test "$(git -C mini-c rev-parse HEAD)" = "$MINI_C_SHA"
          echo "Mini-C SHA: $MINI_C_SHA" >> "$GITHUB_STEP_SUMMARY"
      - name: Rust toolchain
        run: rustc --version && cargo --version
      - name: Show source checkout for audit
        run: git -C mini-c log -1 --format='%H %s'
      - name: Run targeted C99 pointer arithmetic regressions
        shell: bash
        run: |
          set -euo pipefail
          cargo test --manifest-path mini-c/Cargo.toml -p mini-c-sema --lib \
            c99_pointer_arithmetic_offset_promotions_and_array_scaling 2>&1 | tee "$RUNNER_TEMP/mini-c-sema-tests.log"
          grep -Eq 'test .*c99_pointer_arithmetic_offset_promotions_and_array_scaling \.\.\. ok' "$RUNNER_TEMP/mini-c-sema-tests.log"
          cargo test --manifest-path mini-c/Cargo.toml -p mini-c-sema --lib \
            c99_pointer_compound_offsets_and_updates_require_complete_pointees 2>&1 | tee -a "$RUNNER_TEMP/mini-c-sema-tests.log"
          grep -Eq 'test .*c99_pointer_compound_offsets_and_updates_require_complete_pointees \.\.\. ok' "$RUNNER_TEMP/mini-c-sema-tests.log"
      - name: Run full checked C semantic suite
        shell: bash
        run: |
          set -euo pipefail
          cargo test --manifest-path mini-c/Cargo.toml -p mini-c-sema --lib 2>&1 | tee -a "$RUNNER_TEMP/mini-c-sema-tests.log"
          echo "Mini-C semantic tests passed" >> "$GITHUB_STEP_SUMMARY"
      - name: Full syntax and independent Cranelift regression
        shell: bash
        run: |
          set -euo pipefail
          cargo test --manifest-path mini-c/Cargo.toml -p mini-c-syntax -p mini-c-cranelift --no-default-features
      - name: Mini-C CLI regression
        run: cargo test --manifest-path mini-c/Cargo.toml -p mini-c-cli --no-default-features
      - name: GCC differential byte-swap reference
        shell: bash
        run: |
          set -euo pipefail
          cargo build --manifest-path mini-c/Cargo.toml -p mini-c-cranelift --no-default-features
          cat > "$RUNNER_TEMP/swap.c" <<'C'
          unsigned short swap16(unsigned int v) { return __builtin_bswap16(v); }
          unsigned int swap32(unsigned int v) { return __builtin_bswap32(v); }
          unsigned long swap64(unsigned long v) { return __builtin_bswap64(v); }
          unsigned int once(unsigned int *p) { return __builtin_bswap16((*p)++); }
          C
          cat > "$RUNNER_TEMP/oracle.c" <<'C'
          #include <stdint.h>
          extern unsigned short swap16(unsigned int);
          extern unsigned int swap32(unsigned int);
          extern unsigned long swap64(unsigned long);
          extern unsigned int once(unsigned int *);
          int main(void) {
              for (unsigned v=0; v<65536; ++v)
                  if (swap16(v|0xabcd0000U)!=__builtin_bswap16(v)) return 1;
              uint64_t v=0x0123456789abcdefUL;
              for (unsigned i=0;i<1024;++i) {
                  v=v*6364136223846793005UL+1;
                  if (swap32((uint32_t)v)!=__builtin_bswap32((uint32_t)v)) return 2;
                  if (swap64(v)!=__builtin_bswap64(v)) return 3;
              }
              unsigned n=0xfeed1234;
              return once(&n)!=0x3412 || n!=0xfeed1235;
          }
          C
          mini-c/target/debug/mini-c-cranelift -std=gnu11 --cpp=cc --emit-obj "$RUNNER_TEMP/swap.o" "$RUNNER_TEMP/swap.c"
          gcc -O2 -no-pie "$RUNNER_TEMP/oracle.c" "$RUNNER_TEMP/swap.o" -o "$RUNNER_TEMP/swap-test"
          "$RUNNER_TEMP/swap-test"
          echo "CLIF_BSWAP_GCC_DIFFERENTIAL=pass"
      - name: Save diagnostic log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: mini-c-sema-failure
          path: ${{ runner.temp }}/mini-c-sema-tests.log
          if-no-files-found: ignore
          retention-days: 14
