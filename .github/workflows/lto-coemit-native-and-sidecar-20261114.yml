name: LTO native object and sidecar co-emission
on:
  push:
    branches: [verify/lto-coemit-native-and-sidecar-20261114]
    paths: ['.github/workflows/lto-coemit-native-and-sidecar-20261114.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  coemit:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 314788a9789ce5d0a185e7c7eaa29b96a3ff75ab
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Verify source pin and redirect public Git dependencies
        run: |
          test "$(git -C compiler rev-parse HEAD)" = "314788a9789ce5d0a185e7c7eaa29b96a3ff75ab"
          git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
      - name: Isolate driver workspace
        run: |
          cat > compiler/Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir", "crates/opt", "crates/backend", "crates/backend-x86", "crates/backend-aarch64", "crates/driver"]
          EOF
          rm -f compiler/Cargo.lock
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: lto-coemit-native-and-sidecar
      - name: Test source-object-sidecar linked executable parity and existing LTO flows
        working-directory: compiler
        run: |
          cargo test -p compiler --test lto_coemit -- --nocapture
          cargo test -p compiler --test lto_source_sidecar
          cargo test -p compiler --test lto_cli
      - name: Strict co-emission integration lint
        working-directory: compiler
        run: cargo clippy -p compiler --test lto_coemit -- -D warnings
