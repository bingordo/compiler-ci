name: Mini-C F4 indirect aggregate result exact-source gate

on:
  pull_request:
    paths:
      - '.github/workflows/verify-mini-c-f4-indirect-aggregate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mini-c-f4-source-native:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
      CARGO_INCREMENTAL: '0'
    steps:
      - name: Checkout pinned public Mini-C F4 source
        uses: actions/checkout@v4
        with:
          repository: bingordo/mini-c
          ref: 27d5a120aa7eb18b356d2b07a7e274d5f1d83a56
          path: mini-c
          persist-credentials: false
      - name: Verify Mini-C source and run full checked sema suite
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C mini-c rev-parse HEAD)" = '27d5a120aa7eb18b356d2b07a7e274d5f1d83a56'
          cargo test --manifest-path mini-c/Cargo.toml -p mini-c-sema
      - name: Checkout pinned private compiler source
        uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 8d1c2f8e69de4a71875793bc486c367d6eb67121
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Verify compiler SHA and pin both production Mini-C manifests
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C compiler rev-parse HEAD)" = '8d1c2f8e69de4a71875793bc486c367d6eb67121'
          python3 - <<'PY'
          from pathlib import Path
          import re
          pin = '27d5a120aa7eb18b356d2b07a7e274d5f1d83a56'
          files = (
              (Path('compiler/crates/driver/Cargo.toml'), 3),
              (Path('compiler/tools/mini-c-driver/Cargo.toml'), 2),
          )
          for path, expected in files:
              source = path.read_text()
              pattern = r'(mini-c-(?:syntax|sema|preprocess)\s*=\s*\{[^\n]*?rev\s*=\s*")[0-9a-f]{40}(")'
              updated, count = re.subn(pattern, lambda m: m.group(1) + pin + m.group(2), source)
              assert count == expected, (path, count, expected)
              path.write_text(updated)
          PY
          git config --global url."https://github.com/bingordo/mini-c.git".insteadOf "ssh://git@github.com/bingordo/mini-c.git"
          echo "Compiler 8d1c2f8e69de4a71875793bc486c367d6eb67121; Mini-C 27d5a120aa7eb18b356d2b07a7e274d5f1d83a56" >> "$GITHUB_STEP_SUMMARY"
      - name: Compile standalone integrated Mini-C tests and exact source driver
        shell: bash
        working-directory: compiler
        run: |
          set -euo pipefail
          cargo test --manifest-path tools/mini-c-driver/Cargo.toml -p compiler-mini-c --lib
          cargo build --manifest-path tools/mini-c-driver/Cargo.toml -p compiler-mini-c --bin compiler-mini-c
          # The pinned compiler baseline has one pre-existing 8-argument lowerer.
          # Gate every other warning while testing this unrelated frontend fix.
          # The two stale examples still import retired native_typeid; validate
          # production lib/bin/tests only, leaving example cleanup to compiler review.
          cargo clippy --manifest-path tools/mini-c-driver/Cargo.toml -p compiler-mini-c --lib --bins --tests -- -D warnings -A clippy::too_many_arguments
      - name: Verify GCC accepts MEMORY return and current backend fails closed
        shell: bash
        working-directory: compiler
        run: |
          set -euo pipefail
          mkdir -p /tmp/mini-c-f4
          cat > /tmp/mini-c-f4/source.c <<'EOF'
          struct T { long a, b, c; };
          struct T step(long n, struct T t) { t.a += n; return t; }
          int main(void) {
            struct T t = {1,2,3};
            struct T (*fp)(long,struct T) = step;
            struct T q = fp(7,t);
            return !(q.a == 8 && q.b == 2 && q.c == 3);
          }
          EOF
          cc -O0 /tmp/mini-c-f4/source.c -o /tmp/mini-c-f4/gcc
          /tmp/mini-c-f4/gcc
          # The source checker accepts this after #212. The current M9 native
          # adapter does NOT lower aggregate results: require an explicit error,
          # never silently emit an invalid native object.
          if tools/mini-c-driver/target/debug/compiler-mini-c /tmp/mini-c-f4/source.c \
              --emit obj -o /tmp/mini-c-f4/unsupported.o \
              2>/tmp/mini-c-f4/unsupported.stderr; then
            echo 'ERROR: unverified MEMORY result accepted by M9 backend' >&2
            exit 1
          fi
          grep -F 'M9 supports 32/64-bit integer and checked object pointer results' /tmp/mini-c-f4/unsupported.stderr
          test ! -e /tmp/mini-c-f4/unsupported.o
          cat > /tmp/mini-c-f4/negative.c <<'EOF'
          struct A { long x; }; struct B { long x; };
          struct A make(void) { struct A a={1}; return a; }
          int main(void) {
            struct A (*fp)(void)=make;
            struct B b=fp();
            return (int)b.x;
          }
          EOF
          if tools/mini-c-driver/target/debug/compiler-mini-c /tmp/mini-c-f4/negative.c \
              --emit obj -o /tmp/mini-c-f4/bad.o 2>/tmp/mini-c-f4/bad.stderr; then
            echo 'ERROR: accepted nominally incompatible aggregates' >&2
            exit 1
          fi
          grep -F 'incompatible assignment' /tmp/mini-c-f4/bad.stderr
          test ! -e /tmp/mini-c-f4/bad.o
          echo 'PASS: checked source compiles under GCC; M9 aggregate return remains explicitly unsupported' >> "$GITHUB_STEP_SUMMARY"
      - name: Prove supported indirect GP callbacks still match GCC in ELF and GAS
        shell: bash
        working-directory: compiler
        run: |
          set -euo pipefail
          python3 tools/mini-c-driver/tests/s13_p5c_native.py \
            --compiler tools/mini-c-driver/target/debug/compiler-mini-c \
            --artifacts /tmp/mini-c-f4/native-callbacks
          echo 'PASS: supported indirect GP callbacks execute against independent GCC in ELF and GAS' >> "$GITHUB_STEP_SUMMARY"
