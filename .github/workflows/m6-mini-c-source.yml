name: Validate compiler #3076 Mini-C checked aggregate call API
on:
  pull_request:
    paths:
      - '.github/workflows/m6-mini-c-source.yml'
  workflow_dispatch:
    inputs:
      source_ref:
        description: "Compiler branch, tag, or exact SHA"
        required: true
        type: string
        default: main
  push:
    branches: [ci/m6-mini-c-source-validation]
    paths: [.github/workflows/m6-mini-c-source.yml]

permissions:
  contents: read

jobs:
  mini-c-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
      CARGO_INCREMENTAL: '0'
    steps:
      - name: Checkout exact compiler candidate
        uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 8988163ea13adb251d56b46a3be55fd219d8d17a
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Confirm source revision
        run: |
          test "$(git -C compiler rev-parse HEAD)" = '8988163ea13adb251d56b46a3be55fd219d8d17a'
          echo "Exact source 8988163ea13adb251d56b46a3be55fd219d8d17a" >> "$GITHUB_STEP_SUMMARY"
      - name: Use public pinned Mini-C dependency
        run: git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler/tools/mini-c-driver -> target
          key: m6-mini-c-checked-source-v1
      - name: Compile Mini-C aggregate direct call consumer and targeted unit tests
        run: |
          set -euo pipefail
          cargo test --manifest-path compiler/tools/mini-c-driver/Cargo.toml \
            -p compiler-mini-c --lib aggregate_call -- --nocapture
      - name: Check strict Mini-C Clippy
        run: cargo clippy --manifest-path compiler/tools/mini-c-driver/Cargo.toml -p compiler-mini-c --all-targets -- -D warnings
      - name: Save diagnostic log
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m6-mini-c-source-corpus
          path: results/m6-mini-c-source.log
          if-no-files-found: ignore
          retention-days: 14
