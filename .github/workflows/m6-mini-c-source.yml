name: M6 Mini-C source corpus diagnostic
on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: "Compiler branch, tag, or exact SHA"
        required: true
        type: string
        default: main
  push:
    branches: [validation/compiler-minic-pin-3097]
    paths: [.github/workflows/m6-mini-c-source.yml]

permissions:
  contents: read

jobs:
  mini-c-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
      CARGO_INCREMENTAL: '0'
    steps:
      - name: Checkout exact compiler candidate
        uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: ${{ inputs.source_ref || '879ad7fac4bdd2695a3e3297e6255c9464829a61' }}
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Confirm source revision
        run: git -C compiler rev-parse HEAD
      - name: Use public pinned Mini-C dependency
        run: git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler/tools/mini-c-driver -> target
          key: m6-mini-c-checked-source-v1
      - name: Verify actual Mini-C dependency compatibility contract
        run: python3 compiler/tools/ir_compat_report.py --check
      - name: Run feature-gated real M6 checked Mini-C/GCC oracle
        shell: bash
        run: |
          set -euo pipefail
          cargo test --manifest-path compiler/tools/mini-c-driver/Cargo.toml \
            -p compiler-mini-c --features typeid-egraph --lib \
            tests::m6_source::m6_real_checked_mini_c_source_vs_gcc -- --exact --nocapture
      - name: Production TypeId ELF and GAS executable oracle
        shell: bash
        run: |
          cargo test --manifest-path compiler/tools/mini-c-driver/Cargo.toml \
            --test typeid_cli typeid_alone_compiles_and_executes_with_elf_and_gas -- --exact
          cargo test --manifest-path compiler/tools/mini-c-driver/Cargo.toml \
            --test typeid_cli checked_local_integer_array_initializers_execute_in_elf_and_gas \
            -- --exact --nocapture
      - name: Diagnose unchanged musl memmem.c production TypeId lowering
        shell: bash
        run: |
          set -euo pipefail
          fixture="$RUNNER_TEMP/musl-memmem.c"
          curl --fail --silent --show-error --location \
            'https://raw.githubusercontent.com/bingordo/mini-c/66c599591115e9c17a1d802db3d048cf4f39d294/tests/fixtures/musl-s10/string/memmem.c' \
            -o "$fixture"
          cargo build --manifest-path compiler/tools/mini-c-driver/Cargo.toml --bin compiler-mini-c
          set +e
          compiler/tools/mini-c-driver/target/debug/compiler-mini-c \
            "$fixture" --ir typeid --emit obj -o "$RUNNER_TEMP/musl-memmem.o" \
            >"$RUNNER_TEMP/musl-memmem.stdout" 2>"$RUNNER_TEMP/musl-memmem.stderr"
          status=$?
          set -e
          echo "MUSL_MEMMEM_TYPEID_EXIT=$status" | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "$status" -eq 0 ]; then
            test -s "$RUNNER_TEMP/musl-memmem.o"
            echo 'MUSL_MEMMEM_TYPEID_OBJECT=PASS' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'MUSL_MEMMEM_TYPEID_OBJECT=NOT_YET_SUPPORTED' >> "$GITHUB_STEP_SUMMARY"
            sed -n '1,20p' "$RUNNER_TEMP/musl-memmem.stderr"
          fi
      - name: Check strict Mini-C Clippy
        run: cargo clippy --manifest-path compiler/tools/mini-c-driver/Cargo.toml -p compiler-mini-c --all-targets -- -D warnings
      - name: Save diagnostic log
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m6-mini-c-source-corpus
          path: results/m6-mini-c-source.log
          if-no-files-found: ignore
          retention-days: 14
