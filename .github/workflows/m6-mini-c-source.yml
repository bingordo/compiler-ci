name: M6 Mini-C source corpus diagnostic
on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: "Compiler branch, tag, or exact SHA"
        required: true
        type: string
        default: main
  push:
    branches: [validation/compiler-minic-pin-3097]
    paths: [.github/workflows/m6-mini-c-source.yml]

permissions:
  contents: read

jobs:
  mini-c-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
      CARGO_INCREMENTAL: '0'
    steps:
      - name: Checkout exact compiler candidate
        uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: ${{ inputs.source_ref || 'bf32d8890aabacfa34c1e93cbfccfa8ea3e8a0f1' }}
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Confirm source revision
        run: git -C compiler rev-parse HEAD
      - name: Use public pinned Mini-C dependency
        run: git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler/tools/mini-c-driver -> target
          key: m6-mini-c-checked-source-v1
      - name: Verify actual Mini-C dependency compatibility contract
        run: python3 compiler/tools/ir_compat_report.py --check
      - name: Run focused M6 checked Mini-C adapter regressions
        shell: bash
        run: |
          set -euo pipefail
          cargo test --manifest-path compiler/tools/mini-c-driver/Cargo.toml \
            -p compiler-mini-c --lib m6 -- --test-threads=2
      - name: Production TypeId ELF and GAS executable oracle
        shell: bash
        run: |
          cargo test --manifest-path compiler/tools/mini-c-driver/Cargo.toml \
            --test typeid_cli typeid_alone_compiles_and_executes_with_elf_and_gas -- --exact
      - name: Check strict Mini-C Clippy
        run: cargo clippy --manifest-path compiler/tools/mini-c-driver/Cargo.toml -p compiler-mini-c --all-targets -- -D warnings
      - name: Save diagnostic log
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m6-mini-c-source-corpus
          path: results/m6-mini-c-source.log
          if-no-files-found: ignore
          retention-days: 14
