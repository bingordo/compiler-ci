# One-off BT4 source-pinned validation; do not spend compiler repository Actions minutes.
name: BT4 x86 scalar and frame TypeId migration
on:
  pull_request:
    paths:
      - '.github/workflows/ir-bt4-x86-scalar-pr1613.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  x86-scalar-native:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      CARGO_INCREMENTAL: '0'
      SOURCE_SHA: 1d3383914c56374af8cb472993a0d221930be3e7
    steps:
      - name: Check out exact compiler PR revision
        uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 1d3383914c56374af8cb472993a0d221930be3e7
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Verify pinned revision and isolate core crates
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C compiler rev-parse HEAD)" = "$SOURCE_SHA"
          cat > compiler/Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir", "crates/opt", "crates/backend", "crates/backend-x86"]
          EOF
          rm -f compiler/Cargo.lock
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: ir-bt4-x86-scalar
      - name: Original scalar and mixed-frame C11 differential in ELF/GAS
        working-directory: compiler
        run: cargo test -p compiler-backend-x86 --test m4_scalar_native --test mixed_frame_native -- --nocapture
      - name: Check all target compilation and nearby native tests
        working-directory: compiler
        run: |
          set -euo pipefail
          cargo check -p compiler-ir -p compiler-backend -p compiler-backend-x86 --all-targets
          cargo test -p compiler-backend-x86 --test m4_not_native --test m4_6_unwind_native --test native_typeid_direct
      - name: Strict lint for migrated x86 test
        working-directory: compiler
        run: cargo clippy -p compiler-backend-x86 --test m4_scalar_native --test mixed_frame_native -- -D warnings
