# Temporary exact-source BT4 historical AArch64 proof-source extraction.
name: BT4 AArch64 history archive native plus x86 production parity
on:
  pull_request:
    paths:
      - '.github/workflows/bt4-aarch64-historical-source-pr1742.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  aarch64-native:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 35
    env:
      CARGO_INCREMENTAL: '0'
      SOURCE_SHA: d63377b9d6f9618eb28fb50545652aa836b90418
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: d63377b9d6f9618eb28fb50545652aa836b90418
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Verify source and isolate AArch64 core workspace
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C compiler rev-parse HEAD)" = "$SOURCE_SHA"
          cat > compiler/Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir", "crates/opt", "crates/backend", "crates/backend-x86", "crates/backend-aarch64"]
          EOF
          rm -f compiler/Cargo.lock
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: bt4-archived-arm-native
      - name: Strict native AArch64 library and historical-test compilation
        working-directory: compiler
        run: RUSTFLAGS='-D warnings' cargo check -p compiler-backend-aarch64 --all-targets
      - name: Original AArch64 historical and TypeId full suite on native ARM
        working-directory: compiler
        run: cargo test -p compiler-backend-aarch64 --all-targets -- --test-threads=1
      - name: Strict AArch64 library Clippy
        working-directory: compiler
        run: cargo clippy -p compiler-backend-aarch64 --lib -- -D warnings
  cross-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      CARGO_INCREMENTAL: '0'
      SOURCE_SHA: d63377b9d6f9618eb28fb50545652aa836b90418
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: d63377b9d6f9618eb28fb50545652aa836b90418
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Verify pin and isolate all core crates
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C compiler rev-parse HEAD)" = "$SOURCE_SHA"
          cat > compiler/Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir", "crates/opt", "crates/backend", "crates/backend-x86", "crates/backend-aarch64"]
          EOF
          rm -f compiler/Cargo.lock
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: bt4-archived-arm-cross
      - name: Verify both native TypeId backends release without legacy Function
        working-directory: compiler
        run: cargo check -p compiler-backend-x86 -p compiler-backend-aarch64 --release --lib
      - name: Full core TypeId backend and optimizer all-target compilation
        working-directory: compiler
        run: cargo check -p compiler-ir -p compiler-opt -p compiler-backend -p compiler-backend-x86 -p compiler-backend-aarch64 --all-targets
      - name: Existing native TypeId LEA CMOV ABI source-linked C oracles
        working-directory: compiler
        run: |
          set -euo pipefail
          cargo test -p compiler-backend-x86 --test lea_indexed_native --test native_typeid_select_cmov --test typed_alias_calls_native
          cargo test -p compiler-opt --test if_conversion_typeid_remaining
