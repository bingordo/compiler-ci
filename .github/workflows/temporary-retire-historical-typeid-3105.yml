# Temporary exact-source final x86 historical TypeId import retirement gate.
name: Temporary native callee saved and historical input retirement
on:
  pull_request:
    paths:
      - '.github/workflows/temporary-retire-historical-typeid-3105.yml'
permissions:
  contents: read
jobs:
  last-historical-input:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      SOURCE_SHA: 104d416efdc3d0423c8878d4371b179f80254f2d
      CARGO_INCREMENTAL: '0'
      CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
    steps:
      - name: Checkout exact compiler commit
        uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: ${{ env.SOURCE_SHA }}
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Assert source and no historical x86 input imports
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C compiler rev-parse HEAD)" = "$SOURCE_SHA"
          test ! -e compiler/crates/backend-x86/tests/support/historical_typeid.rs
          if git -C compiler grep -n -F historical_typeid -- crates/backend-x86/tests; then
            echo "Retired import helper still referenced" >&2
            exit 1
          fi
          cat > compiler/Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir", "crates/opt", "crates/backend", "crates/backend-x86", "crates/backend-aarch64"]
          EOF
          rm -f compiler/Cargo.lock
      - name: Cache core workspace
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: temporary-retire-historical-typeid-3105
      - name: Test callee-saved legacy allocator reference and native C sentinel
        working-directory: compiler
        shell: bash
        run: |
          set -euo pipefail
          cargo test -p compiler-backend-x86 --test callee_saved_native -- --nocapture
      - name: Scoped Clippy with preexisting unrelated baseline exceptions
        working-directory: compiler
        shell: bash
        run: |
          set -euo pipefail
          cargo clippy -p compiler-backend-x86 --test callee_saved_native -- -D clippy::all -A clippy::needless_borrows_for_generic_args -A clippy::too_many_arguments -A clippy::needless_range_loop -A clippy::collapsible_if -A clippy::collapsible_match -A clippy::needless_lifetimes -A clippy::type_complexity -A clippy::empty_line_after_doc_comments
