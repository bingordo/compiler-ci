name: M49 source file and real GDB breakpoint
on:
  pull_request:
    paths: ['.github/workflows/m49-real-gdb-3413.yml']
permissions:
  contents: read
jobs:
  acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 78ff94ce554ff9171c12365c95576ef920a87dfc
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Resolve private dependencies and prepare GDB
        run: |
          git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
          sudo apt-get update -qq
          sudo apt-get install -y gdb
      - name: Exact source real file, GDB and native regressions
        working-directory: compiler
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "78ff94ce554ff9171c12365c95576ef920a87dfc"
          cd tools/mini-c-driver
          cargo test --test checked_real_file_gdb -- --nocapture
          cargo test --test checked_optimized_debug_lines -- --nocapture
          cargo test --test source_declaration_dwarf -- --nocapture
          cargo check --bin compiler-mini-c
          cd ../..
          cargo test -p compiler-backend-x86 --lib typeid_dwarf::tests
          cargo clippy -p compiler-backend-x86 --lib -- -D clippy::all -A clippy::empty_line_after_doc_comments -A clippy::collapsible_match -A clippy::too_many_arguments -A clippy::unnecessary_lazy_evaluations
