name: CT-10 pinned native TypeId validation phase profile
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/ct10-native-typeid-validation-profile.yml']
permissions:
  contents: read
concurrency:
  group: ct10-native-typeid-validation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checked-native:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: e0b5f0a2a52d75661865aeda0141ad62a0830e57
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Pinned source and toolchain
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p results
          test "$(git -C compiler rev-parse HEAD)" = e0b5f0a2a52d75661865aeda0141ad62a0830e57
          git -C compiler rev-parse HEAD | tee results/sha.txt
          rustc --version | tee results/toolchain.txt
          git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
          python3 -m py_compile compiler/tools/s23_native_profile_source.py
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: ct10-native-validation-profile
      - name: Opt-in CLI phase records and exact ELF and GAS parity
        shell: bash
        working-directory: compiler
        run: |
          set -euo pipefail
          cargo test --release -p compiler --test typeid_native_s2316_profile -- --nocapture
          cargo test --release -p compiler-opt --test native_s2316_profile -- --nocapture
          cargo clippy -p compiler-opt --lib -- -D warnings
          cargo clippy -p compiler --bin compiler --test typeid_native_s2316_profile -- -D warnings
          cargo build --release -p compiler --bin compiler
      - name: Pinned C source phase census and ELF/GAS checks
        shell: bash
        run: |
          set -euo pipefail
          python3 compiler/tools/s23_native_profile_source.py \
            --root compiler --compiler compiler/target/release/compiler \
            --output results/ct10-native-validation-profile.json --rounds 3 \
            2>&1 | tee results/corpus.log
          test "$(grep -c '^S2316_SOURCE_PROFILE ' results/corpus.log)" -eq 14
          grep '^S2316_SOURCE_SUMMARY ' results/corpus.log | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ct10-native-typeid-phase-profile
          path: results/
          retention-days: 30
