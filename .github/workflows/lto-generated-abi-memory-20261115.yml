name: LTO I64 ABI memory generated corpus
on:
  push:
    branches: [verify/lto-generated-abi-memory-20261115]
    paths: ['.github/workflows/lto-generated-abi-memory-20261115.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  abi-memory:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 900e2ee5492c02ea6eac319196773e564d17e17f
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Verify source SHA and route public frontend Git dependencies
        run: |
          test "$(git -C compiler rev-parse HEAD)" = "900e2ee5492c02ea6eac319196773e564d17e17f"
          git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
      - name: Focus driver workspace
        run: |
          cat > compiler/Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir", "crates/opt", "crates/backend", "crates/backend-x86", "crates/backend-aarch64", "crates/driver"]
          EOF
          rm -f compiler/Cargo.lock
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: lto-abi-memory-generated
      - name: Generated I64 multiargument loop private-global differential
        working-directory: compiler
        run: cargo test -p compiler --test lto_generated_abi_memory -- --nocapture
      - name: Existing generated three-unit corpus
        working-directory: compiler
        run: cargo test -p compiler --test lto_generated_multitu
      - name: Strict focused lint
        working-directory: compiler
        run: cargo clippy -p compiler --test lto_generated_abi_memory -- -D warnings
