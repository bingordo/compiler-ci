name: P0 broad TypeId phi alias bitwise dependency batch PR845
on:
  push:
    branches: [ci/verify-neutral-opt-batch-845-20261110]
    paths: ['.github/workflows/verify-neutral-opt-batch-845.yml']
permissions:
  contents: read
jobs:
  core-native-and-legacy:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 8352606f4eddbf7929572ec86d95030d745a0501
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Verify exact source and isolate standalone IR optimizer and both backends
        run: |
          set -euo pipefail
          test "$(git -C compiler rev-parse HEAD)" = 8352606f4eddbf7929572ec86d95030d745a0501
          cat > compiler/Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir", "crates/opt", "crates/backend", "crates/backend-x86", "crates/backend-aarch64"]
          EOF
          rm -f compiler/Cargo.lock
          sudo apt-get update -qq
          sudo apt-get install -y -qq gdb
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: typeid-neutral-opt-batch-845-core
      - name: Full native and legacy optimizer and both backends regression
        working-directory: compiler
        run: cargo test -p compiler-ir -p compiler-opt -p compiler-backend -p compiler-backend-x86 -p compiler-backend-aarch64
      - name: Strict full core default Clippy
        working-directory: compiler
        run: cargo clippy -p compiler-ir -p compiler-opt -p compiler-backend -p compiler-backend-x86 -p compiler-backend-aarch64 --all-targets -- -D warnings
  checked-frontends:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 8352606f4eddbf7929572ec86d95030d745a0501
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Attest exact source and resolve pinned frontends
        run: |
          set -euo pipefail
          test "$(git -C compiler rev-parse HEAD)" = 8352606f4eddbf7929572ec86d95030d745a0501
          git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: typeid-neutral-opt-batch-845-driver
      - name: Unified Oberon and Mini-C native and explicit legacy rollback CLI tests
        working-directory: compiler
        run: cargo test -p compiler --bin compiler --test ir_default_cli --test mini_c_cli --test typeid_elf_linker_matrix
      - name: Checked frontend strict Clippy
        working-directory: compiler
        run: cargo clippy -p compiler --all-targets -- -D warnings
  standalone-minic:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 8352606f4eddbf7929572ec86d95030d745a0501
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Attest exact source and resolve C syntax/sema
        run: |
          set -euo pipefail
          test "$(git -C compiler rev-parse HEAD)" = 8352606f4eddbf7929572ec86d95030d745a0501
          git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler/tools/mini-c-driver -> target
          key: typeid-neutral-opt-batch-845-minic
      - name: Standalone Mini-C native/default and explicit legacy library tests
        working-directory: compiler
        run: |
          cargo test --manifest-path tools/mini-c-driver/Cargo.toml --lib -- --test-threads=2
          cargo test --manifest-path tools/mini-c-driver/Cargo.toml --test typeid_cli -- --test-threads=2
      - name: GCC original C source differential
        working-directory: compiler
        run: |
          cargo build --manifest-path tools/mini-c-driver/Cargo.toml --bin compiler-mini-c
          python3 tools/mini-c-driver/tests/differential.py \
            --compiler tools/mini-c-driver/target/debug/compiler-mini-c \
            --seed-count 2 --steps 60 --ct04-seed-count 1 --m10-compound-seed-count 1 \
            --artifacts target/typeid-neutral-opt-batch-845-repro
      - name: Strict standalone Mini-C Clippy
        working-directory: compiler
        run: cargo clippy --manifest-path tools/mini-c-driver/Cargo.toml --all-targets -- -D warnings

  native-and-legacy-phi-alias-algebra:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 8352606f4eddbf7929572ec86d95030d745a0501
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Attest exact source and isolate core optimizer
        run: |
          set -euo pipefail
          test "$(git -C compiler rev-parse HEAD)" = 8352606f4eddbf7929572ec86d95030d745a0501
          cat > compiler/Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir", "crates/opt", "crates/backend", "crates/backend-x86"]
          EOF
          rm -f compiler/Cargo.lock
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: typeid-neutral-opt-batch-845-focused
      - name: Direct neutral kernels, TypeId and rollback parity unit tests
        working-directory: compiler
        run: |
          cargo test -p compiler-opt --lib phi_plan
          cargo test -p compiler-opt --lib ssa_alias_rewrite
          cargo test -p compiler-opt --lib algebra_bitwise_common
      - name: Native TypeId phi, memory promotion and integer algebra executable parity
        working-directory: compiler
        run: |
          cargo test -p compiler-opt --test typed_phi_cfg
          cargo test -p compiler-opt --test typed_transitive_phi
          cargo test -p compiler-opt --test typed_phi_dead_linear
          cargo test -p compiler-opt --test typed_mem2reg
          cargo test -p compiler-opt --test typed_local_memory
          cargo test -p compiler-opt --test typed_global_memory
          cargo test -p compiler-opt --test typed_algebra
          cargo test -p compiler-opt --test generated_native_integer_algebra
          cargo test -p compiler-opt --test typed_induction_native
      - name: Legacy SSA phi, alias/memory and generated integer reference tests
        working-directory: compiler
        run: |
          cargo test -p compiler-opt --test phi_native
          cargo test -p compiler-opt --test alias_phis
          cargo test -p compiler-opt --test alias_phi_exhaustive
          cargo test -p compiler-opt --test sparse_definition_index_phi
          cargo test -p compiler-opt --test mem2reg_native
          cargo test -p compiler-opt --test ct03_typed_alias_epoch_native
      - name: Strict optimizer Clippy under default TypeId build
        working-directory: compiler
        run: cargo clippy -p compiler-opt --all-targets -- -D warnings
