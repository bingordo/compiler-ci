name: Verify shared integer scalar and ABI transport fixtures
on:
  pull_request:
    paths: ['.github/workflows/check-shared-scalar-3796.yml']
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            package: compiler-backend-x86
            tests: '--test shared_integer_scalar --test t5_x86_semantics'
          - runner: ubuntu-24.04-arm
            package: compiler-backend-aarch64
            tests: '--test modern_i32 --test i64_transport --test native_fixed_v3_canonical --test shared_t5_scalar'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 21b26bcff857072af57be62aeb43e42357ee737d
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Verify source and isolate compiler-core workspace
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 21b26bcff857072af57be62aeb43e42357ee737d
          git rev-parse HEAD
          cat > Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir", "crates/ir-macros", "crates/opt", "crates/backend", "crates/backend-x86", "crates/backend-aarch64"]
          EOF
      - uses: Swatinem/rust-cache@v2
        with:
          key: shared-t5-scalar-${{ matrix.runner }}
      - name: Verify shared fixtures with native C oracles
        run: |
          set -euo pipefail
          cargo test -p ${{ matrix.package }} ${{ matrix.tests }} -- --nocapture
