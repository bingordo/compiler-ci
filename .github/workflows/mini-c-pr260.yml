name: Mini-C PR 260 exact revision validation
on:
  push:
    branches: [validate-mini-c-pr260]
    paths: ['.github/workflows/mini-c-pr260.yml']
permissions:
  contents: read
  statuses: write
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/mini-c
          ref: 0d3423d12298db9876f79c5943b6bac3d50c9dff
          persist-credentials: false
      - name: Frontend and reference backend tests
        run: cargo test -p mini-c-syntax -p mini-c-preprocess -p mini-c-sema -p mini-c -p mini-c-cranelift
      - name: Clippy
        run: cargo clippy -p mini-c-syntax -p mini-c-sema -p mini-c -p mini-c-cranelift --all-targets -- -D warnings
      - name: Build reference backend and run differential tests
        run: |
          cargo build -p mini-c-cranelift -p mini-c-fuzz
          python3 tools/test_cranelift.py --seed-count 4 --steps 100
      - name: Publish exact-revision validation result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          state=failure
          if [ "$RESULT" = success ]; then state=success; fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" -f state="$state" -f context=mini-c/pr260 -f target_url="$RUN_URL" -f description="Mini-C PR 260 exact-revision validation"
