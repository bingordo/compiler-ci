name: LTO driver native executable integration
on:
  push:
    branches: [verify/lto-driver-optin-20261114]
    paths: ['.github/workflows/lto-driver-optin-20261114.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  driver-lto:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 34a707ea2aeb7e543ddff02a0054cff700be0a63
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Assert exact source and public frontend HTTPS routing
        run: |
          test "$(git -C compiler rev-parse HEAD)" = "34a707ea2aeb7e543ddff02a0054cff700be0a63"
          git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
      - name: Restrict workspace to driver and library dependencies
        run: |
          cat > compiler/Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir", "crates/opt", "crates/backend", "crates/backend-x86", "crates/backend-aarch64", "crates/driver"]
          EOF
          rm -f compiler/Cargo.lock
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: lto-driver-experimental
      - name: End-to-end driver LTO ELF test
        working-directory: compiler
        run: cargo test -p compiler --test lto_cli -- --nocapture
      - name: Strict targeted driver and test lint
        working-directory: compiler
        run: cargo clippy -p compiler --test lto_cli -- -D warnings
