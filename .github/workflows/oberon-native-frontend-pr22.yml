name: Oberon native frontend candidate gate
on:
  push:
    paths:
      - '.github/workflows/oberon-native-frontend-pr22.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  front-ir:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
      CARGO_INCREMENTAL: '0'
    steps:
      - name: Checkout exact native frontend candidate
        uses: actions/checkout@v4
        with:
          repository: bingordo/oberon
          ref: cb3aea28841bde79c371ab83a2ae4382c55a020e
          path: oberon
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Record tested frontend commit
        run: git -C oberon rev-parse HEAD
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: oberon/oberon -> target
          key: native-front-ir-pr22-v1
      - name: Unit tests for frontend projection
        run: cargo test --manifest-path oberon/oberon/Cargo.toml -p oberon-front-ir
      - name: Strict Clippy frontend projection
        run: cargo clippy --manifest-path oberon/oberon/Cargo.toml -p oberon-front-ir --all-targets -- -D warnings
      - name: Checkout compiler native consumer
        uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: ffb9352520687a2d7d8323b8100f1c1a2726dee5
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Verify compiler pin and link exact checked-out frontend
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          cargo = Path('compiler/crates/driver/Cargo.toml')
          data = cargo.read_text()
          lines = data.splitlines()
          found = [i for i, line in enumerate(lines) if line.startswith('oberon-front-ir = ')]
          assert len(found) == 1, 'cannot locate native frontend dependency'
          assert 'cb3aea28841bde79c371ab83a2ae4382c55a020e' in lines[found[0]], 'compiler pin differs from candidate'
          lines[found[0]] = 'oberon-front-ir = { path = "../../../oberon/oberon/crates/front-ir" }'
          cargo.write_text('\n'.join(lines) + '\n')
          PY
          git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
      - name: Build native compiler against candidate frontend
        run: cargo check --manifest-path compiler/Cargo.toml -p compiler --bin compiler
      - name: Native source differential ELF and GAS vs C oracle
        run: cargo test --manifest-path compiler/Cargo.toml -p compiler --bin compiler m6_checked_oberon_source_vs_c_oracle -- --nocapture
