name: X7 S3.L L5d GP write source/XED probe
on:
  pull_request:
    paths:
      - '.github/workflows/x86-s3l-l5d-gp-write-20261115.yml'
permissions:
  contents: read
  actions: read
jobs:
  pinned-original-gp-write:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Download immutable Intel/XED S2 join
        uses: actions/download-artifact@v4
        with:
          name: x7-s2-pinned-intel-xed-variant-join
          run-id: 43635408689
          repository: bingordo/compiler-ci
          github-token: ${{ github.token }}
          path: /tmp/x7l5d/s2
      - name: Inspect real XED five-form register result candidates
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          db=json.load(open('/tmp/x7l5d/s2/join-1.json'))
          target={'ADD_GPRv_GPRv_01','SUB_GPRv_GPRv_29','AND_GPRv_GPRv_21',
                  'OR_GPRv_GPRv_09','XOR_GPRv_GPRv_31'}
          print('X7_L5D_S2_SCHEMA', db.get('kind'),db.get('intel_sdm_commit'))
          for row in db['forms']:
            if row.get('xed_iform') not in target: continue
            print('X7_L5D_GP_WRITE_CANDIDATE',row['xed_iform'],'source_sha',row.get('intel_iform_sha256'),'status',row.get('join_status'),'variants',len(row.get('xed_variants',[])))
            for v in row['xed_variants']:
              x=v.get('identity',{})
              print('X7_L5D_GP_WRITE_VARIANT',v.get('variant_id'),'record',v.get('xed_record_sha256'),'excluded',v.get('excluded'),
                    {k:x.get(k) for k in ('opcode_base16','operand_list','parsed_operands','mod_required',
                    'eosz_list','easz_list','mode_restriction','flags','isa_set','cpuid_groups',
                    'attributes','explicit_operands','implicit_operands','nd','nf','default_64b','cpl')})
          PY
