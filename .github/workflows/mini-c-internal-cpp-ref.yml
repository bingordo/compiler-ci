name: Validate Mini-C internal CPP ref
on:
  push:
    branches: [probe-mini-c-internal-libc-headers]
    paths: ['.github/workflows/mini-c-internal-cpp-ref.yml']
  workflow_dispatch:
    inputs:
      mini_c_ref:
        description: 'Branch, tag or commit in bingordo/mini-c (default: main)'
        type: string
        required: false
        default: main
      cpp_seed_count:
        description: 'Number of generated CPP macro graphs (1-128)'
        type: number
        required: false
        default: 4
permissions:
  contents: read

concurrency:
  group: mini-c-cpp-ref-${{ github.ref }}
  cancel-in-progress: true

jobs:
  internal-cpp:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out selected Mini-C revision
        uses: actions/checkout@v4
        with:
          repository: bingordo/mini-c
          ref: ${{ github.event_name == 'push' && 'cpp-c99-hosted-musl-preprocess-corpus' || inputs.mini_c_ref || 'main' }}
          path: mini-c
          persist-credentials: false
      - name: Show tested revision
        working-directory: mini-c
        run: git log -1 --format='%H %s'
      - name: Cache dependencies and debug builds
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            mini-c/target/debug
          key: mini-c-cpp-ref-${{ runner.os }}-${{ hashFiles('mini-c/Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            mini-c-cpp-ref-${{ runner.os }}-${{ hashFiles('mini-c/Cargo.lock') }}-
      - name: Internal CPP unit and GCC-Clang differential tests
        working-directory: mini-c
        env:
          MINI_C_CPP_SEED_COUNT: ${{ inputs.cpp_seed_count || '4' }}
        run: cargo test -p mini-c-preprocess --features internal-rcc
      - name: Internal CPP Clippy
        working-directory: mini-c
        run: cargo clippy -p mini-c-preprocess --features internal-rcc --all-targets -- -D warnings
      - name: Feature-gated checker and Cranelift CPP smoke
        working-directory: mini-c
        run: cargo test -p mini-c -p mini-c-cranelift --features internal-cpp
      - name: Internal CPP end-to-end glibc stdio Hello World
        working-directory: mini-c
        shell: bash
        run: |
          set -euo pipefail
          source=tests/fixtures/glibc-s12/hello_stdio.c
          cargo run -q -p mini-c --features internal-cpp -- check --cpp=internal -D_GNU_SOURCE "$source"
          cargo run -q -p mini-c-cranelift --features internal-cpp -- --emit-obj "$RUNNER_TEMP/mini-c-internal-hello.o" --cpp=internal -D_GNU_SOURCE "$source"
          cc "$RUNNER_TEMP/mini-c-internal-hello.o" -o "$RUNNER_TEMP/mini-c-internal-hello"
          "$RUNNER_TEMP/mini-c-internal-hello" > "$RUNNER_TEMP/mini-c-internal-hello.actual"
          printf 'Hello, world!\n' > "$RUNNER_TEMP/mini-c-internal-hello.expected"
          cmp "$RUNNER_TEMP/mini-c-internal-hello.expected" "$RUNNER_TEMP/mini-c-internal-hello.actual"
      - name: Unmodified musl strcmp with internal CPP and system string.h
        working-directory: mini-c
        shell: bash
        run: |
          set -euo pipefail
          source=tests/fixtures/musl-s10/string/strcmp.c
          cargo run -q -p mini-c --features internal-cpp -- check --cpp=internal "$source"
          cargo run -q -p mini-c-cranelift --features internal-cpp -- --emit-obj "$RUNNER_TEMP/mini-c-internal-strcmp.o" --cpp=internal "$source"
          test -s "$RUNNER_TEMP/mini-c-internal-strcmp.o"

      - name: Diagnose real musl libc source acceptance through internal CPP
        working-directory: mini-c
        shell: bash
        run: |
          set -u
          cargo build -q -p mini-c --features internal-cpp
          # The audit reports each rejection rather than exiting early.
          set +e
          for name in memcmp memchr memmove memcpy memset strcat strcmp strcpy strchr strcasecmp strcasestr; do
            src="tests/fixtures/musl-s10/string/${name}.c"
            test -f "$src" || continue
            echo "=== SOURCE: $name ==="
            target/debug/mini-c check --cpp=internal -D_GNU_SOURCE "$src" > /tmp/mini-c-cpp-audit-out 2>/tmp/mini-c-cpp-audit-err
            result=$?
            echo "CHECK_STATUS=$result"
            if [ "$result" -ne 0 ]; then
              head -n 12 /tmp/mini-c-cpp-audit-err
            fi
          done
          echo "=== END OF DIAGNOSTIC CORPUS ==="
