name: Validate Mini-C internal CPP ref
on:
  # One-shot branch validation for Mini-C draft PR #123.
  push:
    branches: [validate-mini-c-cpp-token-cap-120]
    paths: ['.github/workflows/mini-c-internal-cpp-ref.yml']
  workflow_dispatch:
    inputs:
      mini_c_ref:
        description: 'Branch, tag or commit in bingordo/mini-c (default: main)'
        type: string
        required: false
        default: main
      cpp_seed_count:
        description: 'Number of generated CPP macro graphs (1-128)'
        type: number
        required: false
        default: 4
permissions:
  contents: read

concurrency:
  group: mini-c-cpp-ref-${{ github.ref }}
  cancel-in-progress: true

jobs:
  internal-cpp:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out selected Mini-C revision
        uses: actions/checkout@v4
        with:
          repository: bingordo/mini-c
          ref: ${{ github.event_name == 'push' && 'cpp-c99-substitution-buffer-limit' || inputs.mini_c_ref || 'main' }}
          path: mini-c
          persist-credentials: false
      - name: Show tested revision
        working-directory: mini-c
        run: git log -1 --format='%H %s'
      - name: Cache dependencies and debug builds
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            mini-c/target/debug
          key: mini-c-cpp-ref-${{ runner.os }}-${{ hashFiles('mini-c/Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            mini-c-cpp-ref-${{ runner.os }}-${{ hashFiles('mini-c/Cargo.lock') }}-
      - name: Internal CPP unit and GCC-Clang differential tests
        working-directory: mini-c
        env:
          MINI_C_CPP_SEED_COUNT: ${{ inputs.cpp_seed_count || '4' }}
        run: cargo test -p mini-c-preprocess --features internal-rcc
      - name: Internal CPP Clippy
        working-directory: mini-c
        run: cargo clippy -p mini-c-preprocess --features internal-rcc --all-targets -- -D warnings
      - name: Feature-gated checker and Cranelift CPP smoke
        working-directory: mini-c
        run: cargo test -p mini-c -p mini-c-cranelift --features internal-cpp
