name: IR M6 MemorySSA fixed-graph fixture gate
on:
  push:
    branches: [ci/ir-m6-memoryssa-fixed-v3-20261114]
    paths: ['.github/workflows/ir-m6-memoryssa-fixed-v3.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 457646aca5ab98b68d1e6aae9ecc714f589fb6d4
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Verify exact source and isolate core
        run: |
          set -euo pipefail
          test "$(git -C compiler rev-parse HEAD)" = "457646aca5ab98b68d1e6aae9ecc714f589fb6d4"
          echo "Compiler SHA: 457646aca5ab98b68d1e6aae9ecc714f589fb6d4" >> "$GITHUB_STEP_SUMMARY"
          cat > compiler/Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir", "crates/opt", "crates/backend", "crates/backend-x86"]
          EOF
          rm -f compiler/Cargo.lock
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: ir-m6-mssa-fixed
      - name: Original feature-enabled M6 alias/disjoint and stress oracles
        working-directory: compiler
        run: |
          set -euo pipefail
          cargo test -p compiler-opt --features typeid-memory-ssa --test m6_typeid_memoryssa --test m6_typeid_memoryssa_stress -- --nocapture
      - name: Adjacent MemorySSA CFG and prior migrated fixture regressions
        working-directory: compiler
        run: |
          set -euo pipefail
          cargo test -p compiler-opt --features typeid-memory-ssa --test m6_typeid_memoryssa_cfg
          cargo test -p compiler-opt --test typed_local_memory --test typed_global_memory --test typed_mem2reg --test typed_pre_native --test typed_dse
      - name: Production-library compiler check
        working-directory: compiler
        run: cargo check --workspace --lib
      - name: Strict Clippy on relevant production libs and modified tests
        working-directory: compiler
        run: |
          set -euo pipefail
          cargo clippy -p compiler-ir -p compiler-opt -p compiler-backend -p compiler-backend-x86 --lib --features compiler-opt/typeid-memory-ssa -- -D warnings
          cargo clippy -p compiler-opt --features typeid-memory-ssa --test m6_typeid_memoryssa --test m6_typeid_memoryssa_stress -- -D warnings
      - name: Acceptance result
        run: |
          echo 'M6 MemorySSA six fixed native v3 graphs, generated stress, C11, adjacent regressions and scoped strict Clippy PASS' >> "$GITHUB_STEP_SUMMARY"
