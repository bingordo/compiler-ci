name: IR M6 MemorySSA fixed-graph fixture gate
on:
  push:
    branches: [ci/ir-m6-memoryssa-fixed-v3-20261114]
    paths: ['.github/workflows/ir-m6-memoryssa-fixed-v3.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 6bc99533381a9d8cb7b0467a70b36d72af4f0f0f
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Verify exact source and isolate core
        run: |
          set -euo pipefail
          test "$(git -C compiler rev-parse HEAD)" = "6bc99533381a9d8cb7b0467a70b36d72af4f0f0f"
          echo "Compiler SHA: 6bc99533381a9d8cb7b0467a70b36d72af4f0f0f" >> "$GITHUB_STEP_SUMMARY"
          cat > compiler/Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir", "crates/opt", "crates/backend", "crates/backend-x86"]
          EOF
          rm -f compiler/Cargo.lock
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: ir-m6-mssa-fixed
      - name: Export original alias and disjoint graphs
        working-directory: compiler
        run: cargo test -p compiler-opt --test m6_typeid_memoryssa export_original_memoryssa_alias_disjoint_inputs -- --nocapture
      - name: Export four original fixed clobber and load-key graphs
        working-directory: compiler
        run: cargo test -p compiler-opt --test m6_typeid_memoryssa_stress export_original_memoryssa_stress_fixed_inputs -- --nocapture
