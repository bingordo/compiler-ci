name: FZ-3 structured outcome and lifecycle source-pinned validation
on:
  push:
    branches: [ci/fz3-structured-outcome-lifecycle-20261114]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fz3-structured:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          path: ci
          persist-credentials: false
      - name: Test v1 and v2 history, evidence and lifecycle
        run: |
          set -euo pipefail
          python3 -m py_compile ci/tools/fz3_outcome_recheck.py ci/tests/test_fz3_outcome_recheck.py
          python3 -m unittest discover -s ci/tests -p 'test_fz3_*.py' -v
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 51d1e131dfb5ba469763a2edf3ce85034f0d72f9
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Compile exact compiler PR and test unpinned native report
        shell: bash
        run: |
          set -euo pipefail
          ulimit -c 0
          sha="$(git -C compiler rev-parse HEAD)"
          test "$sha" = "51d1e131dfb5ba469763a2edf3ce85034f0d72f9"
          cat > compiler/Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir", "crates/opt", "crates/backend", "crates/backend-x86"]
          EOF
          cd compiler
          cargo test -p compiler-opt --example typeid_native_diff_repro -- --nocapture
          cargo test -p compiler-opt --test typeid_native_trap_differential -- --nocapture
          cargo build -p compiler-opt --example typeid_native_diff_repro
          cargo run -p compiler-opt --example typeid_native_campaign -- \
            --out "$RUNNER_TEMP/fz3-replay-selftest" --source-sha "$sha" \
            --first-seed 1 --seeds 2 --max-evaluations 16 \
            --max-unique 2 --max-probes 12 --self-test
          ir="$RUNNER_TEMP/fz3-replay-selftest/failure-000/before.ir"
          test -s "$ir"
          result="$(./target/debug/examples/typeid_native_diff_repro \
            "$ir" --a 5 --b 7 --sink gas --report-outcomes)"
          printf 'Unpinned real native execution: %s\n' "$result"
          test "$result" = 'OUTCOMES_V1 a=5 b=7 expected=value:12 observed=value:12'
          if ./target/debug/examples/typeid_native_diff_repro \
            "$ir" --a 5 --b 7 --report-outcomes --inject-add-as-sub; then
            echo 'Unpinned mode unexpectedly accepted injection' >&2
            exit 1
          else
            test "$?" -eq 2
          fi
      - name: Retain native smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fz3-structured-source-pinned
          path: ${{ runner.temp }}/fz3-replay-selftest/
          if-no-files-found: warn
          retention-days: 7
