# Exact source-owned TypeId global inlining exhaustive size-corpus acceptance.
name: IR PR2759 TypeId native inline corpus
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ir-pr2759-inline-native-corpus-20261122.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-inline-corpus:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      SOURCE_SHA: a99caa4777833a499cb5c548c373337dbfe9006a
      CARGO_INCREMENTAL: '0'
      CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
    steps:
      - name: Check out exact compiler source
        uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: ${{ env.SOURCE_SHA }}
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Verify source SHA and isolate TypeId backend crates
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C compiler rev-parse HEAD)" = "$SOURCE_SHA"
          cat > compiler/Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir", "crates/opt", "crates/backend", "crates/backend-x86", "crates/backend-aarch64"]
          EOF
          rm -f compiler/Cargo.lock
      - name: Cache TypeId compiler build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: ir-pr2759-inline-native-corpus
      - name: Run bounded exhaustive native inline size corpus
        working-directory: compiler
        shell: bash
        run: |
          set -euo pipefail
          cargo test -p compiler-opt --test inline_interaction_corpus -- --nocapture --test-threads=1
      - name: Clippy native inline corpus
        working-directory: compiler
        shell: bash
        run: |
          set -euo pipefail
          cargo clippy -p compiler-opt --test inline_interaction_corpus -- -D clippy::all -A clippy::collapsible_match -A clippy::empty_line_after_doc_comments
