name: IR induction CT05 fixed fixture gate
on:
  push:
    branches: [ci/ir-induction-ct05-20261114]
    paths: ['.github/workflows/ir-induction-ct05-fixture-gate.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: e81a7000b8cf4774ad314bc67646ddaf755ae5ba
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Verify exact pinned source and isolate core workspace
        run: |
          set -euo pipefail
          test "$(git -C compiler rev-parse HEAD)" = "e81a7000b8cf4774ad314bc67646ddaf755ae5ba"
          echo "Compiler SHA: e81a7000b8cf4774ad314bc67646ddaf755ae5ba" >> "$GITHUB_STEP_SUMMARY"
          cat > compiler/Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir", "crates/opt", "crates/backend", "crates/backend-x86"]
          EOF
          rm -f compiler/Cargo.lock
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: induction-ct05-fixed-v3
      - name: Export original induction fixed scenarios
        working-directory: compiler
        run: cargo test -p compiler-opt --test typed_induction_native export_original_induction_native_fixed_inputs -- --nocapture
      - name: Export original four CT05 fixed CFGs
        working-directory: compiler
        run: cargo test -p compiler-opt --test ct05_identical_native export_original_ct05_identical_fixed_inputs -- --nocapture
