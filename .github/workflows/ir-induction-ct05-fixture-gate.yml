name: IR induction CT05 fixed fixture gate
on:
  push:
    branches: [ci/ir-induction-ct05-20261114]
    paths: ['.github/workflows/ir-induction-ct05-fixture-gate.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 1d27ed620499a4144c486cfe1a5a133b3c8288c4
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Verify exact pinned source and isolate core workspace
        run: |
          set -euo pipefail
          test "$(git -C compiler rev-parse HEAD)" = "1d27ed620499a4144c486cfe1a5a133b3c8288c4"
          echo "Compiler SHA: 1d27ed620499a4144c486cfe1a5a133b3c8288c4" >> "$GITHUB_STEP_SUMMARY"
          cat > compiler/Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir", "crates/opt", "crates/backend", "crates/backend-x86"]
          EOF
          rm -f compiler/Cargo.lock
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: induction-ct05-fixed-v3
      - name: Run migrated original induction and CT05 C11 native oracles
        working-directory: compiler
        run: |
          set -euo pipefail
          cargo test -p compiler-opt --test typed_induction_native --test ct05_identical_native -- --nocapture
      - name: Run adjacent existing TypeId induction and CFG fixed fixtures
        working-directory: compiler
        run: |
          set -euo pipefail
          cargo test -p compiler-opt --test typed_licm_native --test typed_pre_native --test typed_if_conversion_native --test typed_core_pipeline --test typed_mem2reg --test typed_sccp --test typed_cse --test typed_dse
      - name: Check compiler core production libraries
        working-directory: compiler
        run: cargo check --workspace --lib
      - name: Strict scoped Clippy on production and affected tests
        working-directory: compiler
        run: |
          set -euo pipefail
          cargo clippy -p compiler-ir -p compiler-opt -p compiler-backend -p compiler-backend-x86 --lib -- -D warnings
          cargo clippy -p compiler-opt --test typed_induction_native --test ct05_identical_native -- -D warnings
      - name: Record source-pinned acceptance
        run: |
          echo '30 fixed induction/CT05 v3 graphs, original C11 oracles, adjacent fixtures, production library check and scoped strict Clippy PASS' >> "$GITHUB_STEP_SUMMARY"
