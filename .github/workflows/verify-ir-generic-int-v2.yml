name: IR native generic integer v2 (compiler-ci)
on:
  pull_request:
    paths:
      - '.github/workflows/verify-ir-generic-int-v2.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-ir:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact compiler candidate
        uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: a9e9804e43063a66e18cfb3117c9a75db3effd25
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Assert immutable compiler source SHA
        working-directory: compiler
        run: |
          test "$(git rev-parse HEAD)" = "a9e9804e43063a66e18cfb3117c9a75db3effd25"
          echo "Compiler PR 493 revision: a9e9804e43063a66e18cfb3117c9a75db3effd25" >> "$GITHUB_STEP_SUMMARY"
      - name: Create isolated compiler core workspace
        working-directory: compiler
        run: |
          cat > Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir", "crates/opt", "crates/backend", "crates/backend-x86"]
          EOF
          rm -f Cargo.lock
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: ir-generic-int-v2
          cache-workspace-crates: 'true'
      - name: Focused TypeId v2 roundtrip and v1 rejection
        working-directory: compiler
        run: cargo test -p compiler-ir --test typed_integer_v2 -- --nocapture
      - name: ir-tool v2 verification and roundtrip, reject unlegalized optimizer
        working-directory: compiler
        run: |
          set -euo pipefail
          f=crates/ir/tests/fixtures/native_int16_v2.ir
          cargo run -p compiler-ir --bin ir-tool -- verify "$f"
          cargo run -p compiler-ir --bin ir-tool -- roundtrip "$f"
          cargo run -p compiler-ir --bin ir-tool -- normalize "$f" > "$RUNNER_TEMP/native-v2.ir"
          cmp "$f" "$RUNNER_TEMP/native-v2.ir"
          if cargo run -p compiler-opt --bin ir-opt -- run "$f" --passes=fold > "$RUNNER_TEMP/opt.out" 2> "$RUNNER_TEMP/opt.err"; then
            echo 'ERROR: unlegalized native v2 passed optimizer' >&2
            exit 1
          fi
          grep -F "optimizer legalization is not implemented" "$RUNNER_TEMP/opt.err"
      - name: Existing typed opcode and verifier parity
        working-directory: compiler
        run: cargo test -p compiler-ir --test typed_opcode_types --test typed_verifier_parity --test typed_verifier_generated
      - name: Full IR optimizer and backend core regression
        working-directory: compiler
        run: cargo test -p compiler-ir -p compiler-opt -p compiler-backend -p compiler-backend-x86
      - name: Strict full-core Clippy
        working-directory: compiler
        run: cargo clippy -p compiler-ir -p compiler-opt -p compiler-backend -p compiler-backend-x86 --all-targets -- -D warnings
