name: Validate four-input native-int graph descriptions PR2721
on:
  pull_request:
    paths:
      - '.github/workflows/native-int-four-input-pr2721.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  four-input-graph:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CARGO_INCREMENTAL: '0'
      SOURCE_SHA: 6abda995134c84b84e8086519733b1059ee5ec91
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 6abda995134c84b84e8086519733b1059ee5ec91
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Verify exact source pin and isolate optimizer
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C compiler rev-parse HEAD)" = "$SOURCE_SHA"
          cat > compiler/Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir", "crates/opt", "crates/backend", "crates/backend-x86"]
          EOF
          rm -f compiler/Cargo.lock
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: native-int-seeded-generator
      - name: Run all four original 4-input differential and negative-rollback suites
        working-directory: compiler
        shell: bash
        run: |
          set -euo pipefail
          cargo test -p compiler-opt --test generated_native_additive_pair_cancellation_s2334 -- --nocapture
          cargo test -p compiler-opt --test generated_native_reverse_difference_s2335 -- --nocapture
          cargo test -p compiler-opt --test generated_native_demorgan_existing_s2337 -- --nocapture
          cargo test -p compiler-opt --test generated_native_complement_xor_pair_s2342 -- --nocapture
      - name: Strict focused Clippy with unrelated upstream warning categories exempt
        working-directory: compiler
        shell: bash
        run: |
          set -euo pipefail
          cargo clippy -p compiler-opt --test generated_native_additive_pair_cancellation_s2334 --test generated_native_reverse_difference_s2335 --test generated_native_demorgan_existing_s2337 --test generated_native_complement_xor_pair_s2342 -- -D warnings -A dead-code -A clippy::empty-line-after-doc-comments -A unused-imports -A clippy::too-many-arguments
