name: Native TypeId TLS cutover PR 794
on:
  pull_request:
    paths:
      - .github/workflows/ir-typeid-tls-794.yml
permissions:
  contents: read
jobs:
  tls:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.CI_KEY }}
      - run: ssh-keyscan github.com >> ~/.ssh/known_hosts
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 4e9185afe879824e7e075372adb6e70deac0c48d
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler
          key: ir-typeid-native-tls
      - name: Warnings-denied compiler, IR, and backend all-target check
        working-directory: compiler
        run: |
          test "$(git rev-parse HEAD)" = "4e9185afe879824e7e075372adb6e70deac0c48d"
          RUSTFLAGS="-D warnings" cargo check -p compiler -p compiler-ir -p compiler-opt -p compiler-backend -p compiler-backend-x86 --all-targets
      - name: Typed and legacy TLS verifier, shared backend tests
        working-directory: compiler
        run: |
          cargo test -p compiler-ir --lib -- --test-threads=2
          cargo test -p compiler-backend --lib -- --test-threads=2
          cargo test -p compiler-backend-x86 --lib -- --test-threads=2
      - name: Real TLS ELF/GAS PIC/non-PIC pthread oracle via unified compiler
        working-directory: compiler
        run: cargo test -p compiler --test ir_default_cli -- --nocapture
      - name: Unified compiler full driver suite
        working-directory: compiler
        run: cargo test -p compiler --bin compiler -- --test-threads=2
      - name: Standalone Mini-C all-target warnings denied
        working-directory: compiler
        run: RUSTFLAGS="-D warnings" cargo check --manifest-path tools/mini-c-driver/Cargo.toml --all-targets
      - name: Standalone Mini-C TLS pthread and ELF/GAS source fixtures
        working-directory: compiler
        run: cargo test --manifest-path tools/mini-c-driver/Cargo.toml --test typeid_cli -- --nocapture
      - name: Standalone Mini-C full regression
        working-directory: compiler
        run: cargo test --manifest-path tools/mini-c-driver/Cargo.toml -- --test-threads=2
      - name: Strict IR, backend and unified compiler clippy
        working-directory: compiler
        run: cargo clippy -p compiler -p compiler-ir -p compiler-opt -p compiler-backend -p compiler-backend-x86 --all-targets -- -D warnings
      - name: Strict standalone Mini-C clippy
        working-directory: compiler
        run: cargo clippy --manifest-path tools/mini-c-driver/Cargo.toml --all-targets -- -D warnings
