name: CI M49 real Mini-C declaration source DWARF
on:
  pull_request:
    paths: ['.github/workflows/m49-minic-store-dwarf-3330.yml']
permissions:
  contents: read
jobs:
  source-store:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 60b14eccb25520cfeb42fde2bba672c5db391ba9
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Resolve compiler Git dependencies
        run: git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
      - name: Source pinned checked Mini-C declaration DWARF and x86 regressions
        working-directory: compiler
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "60b14eccb25520cfeb42fde2bba672c5db391ba9"
          cd tools/mini-c-driver
          cargo test --test source_declaration_dwarf -- --nocapture
          cd ../..
          cargo test -p compiler-backend-x86 --lib physical_provenance::tests
          cargo test -p compiler-backend-x86 --lib
          cargo clippy -p compiler-backend-x86 --lib -- -D clippy::all -A clippy::empty_line_after_doc_comments -A clippy::collapsible_match
