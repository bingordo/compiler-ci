name: Checked source mem2reg eligibility paired profile
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/checked-source-optimizer-profile.yml']
permissions:
  contents: read
concurrency:
  group: checked-mem2reg-eligibility-${{ github.ref }}
  cancel-in-progress: true
jobs:
  profile:
    strategy:
      fail-fast: false
      matrix:
        frontend: [mini-c]
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
      CARGO_INCREMENTAL: '0'
      OPT_PROFILE_REPETITIONS: '7'
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: de28078dd50c273ce5d50a5af01f65e328c58343
          path: baseline
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: c1cfcc234125fb1e499de526e7e9e2fe8b8fb06e
          path: candidate
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Prepare matched release test binaries
        shell: bash
        env:
          FRONTEND: ${{ matrix.frontend }}
        run: |
          set -euo pipefail
          git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
          mkdir -p results
          rustc --version | tee results/runner.txt
          lscpu | tee -a results/runner.txt
          if [[ "$FRONTEND" == mini-c ]]; then
            manifest=tools/mini-c-driver/Cargo.toml
            args=(-p compiler-mini-c --lib)
          else
            manifest=Cargo.toml
            args=(-p compiler --bin compiler)
          fi
          # Export existing per-case expected IR/ELF outside the timed loop.
          python3 - <<'PY'
          from pathlib import Path
          for v in ("baseline","candidate"):
              p=Path(v)/"tools/mini-c-driver/tests/unit/lib.rs"
              s=p.read_text()
              start=s.index("fn full_optimizer_stage_profile_mini_c()")
              pos=s.index("            let mut frontend=Vec::new();",start)
              s=s[:pos]+'''            if let Ok(out)=std::env::var("PROFILE_OUT") {
                          std::fs::create_dir_all(&out).unwrap();
                          std::fs::write(format!("{out}/{name}.ir"),
                              compiler_ir::native_module_text_v3::write_native_module_text_v3(&baseline).unwrap()).unwrap();
                          if let Some(bytes)=&expected {
                              std::fs::write(format!("{out}/{name}.o"),bytes).unwrap();
                          }
                      }
          '''+s[pos:]
              p.write_text(s)
          PY
          for v in baseline candidate; do
            git -C "$v" rev-parse HEAD | tee "results/$v.sha"
            CARGO_TARGET_DIR="$PWD/$v/target-profile" cargo test --release --manifest-path "$v/$manifest" "${args[@]}" --no-run --message-format=json > "results/$v-build.jsonl"
            python3 - "$v" <<'PY'
          import json, sys
          from pathlib import Path
          v=sys.argv[1]
          records=[json.loads(line) for line in Path(f"results/{v}-build.jsonl").read_text().splitlines()]
          executables={r["executable"] for r in records if r.get("reason")=="compiler-artifact" and r.get("executable") and r.get("profile",{}).get("test")}
          assert len(executables)==1, executables
          Path(f"results/{v}.exe").write_text(executables.pop())
          PY
          done
      - name: ABBA source optimizer profiles on the same runner
        shell: bash
        env:
          FRONTEND: ${{ matrix.frontend }}
        run: |
          set -euo pipefail
          if [[ "$FRONTEND" == mini-c ]]; then
            test_name=full_optimizer_stage_profile_mini_c
            cwd=tools/mini-c-driver
          else
            test_name=full_optimizer_stage_profile_oberon
            cwd=crates/driver
          fi
          root="$PWD"
          for v in baseline candidate; do
            exe=$(cat "results/$v.exe")
            (cd "$v/$cwd" && PROFILE_OUT="$root/results/$v-output" "$exe" "$test_name" --ignored --nocapture) > "results/$v-warmup.log" 2>&1
            grep -q '1 passed; 0 failed' "results/$v-warmup.log"
          done
          diff -r results/baseline-output results/candidate-output
          echo "MEM2REG_SOURCE_CANONICAL_AND_ELF_PARITY"
          i=0
          for v in baseline candidate candidate baseline; do
            i=$((i+1))
            exe=$(cat "results/$v.exe")
            (cd "$v/$cwd" && /usr/bin/time -f 'elapsed_s=%e peak_rss_kib=%M' -o "$root/results/$i-$v.time" "$exe" "$test_name" --ignored --nocapture) 2>&1 | tee "results/$i-$v.log"
            grep -q '1 passed; 0 failed' "results/$i-$v.log"
            cat "results/$i-$v.time"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: checked-mem2reg-eligibility-${{ matrix.frontend }}
          path: results/
          retention-days: 14
