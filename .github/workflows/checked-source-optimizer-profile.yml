name: Checked mixed-scalar memory admission paired profile
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/checked-source-optimizer-profile.yml']
permissions:
  contents: read
concurrency:
  group: checked-memory-admission-${{ github.ref }}
  cancel-in-progress: false
jobs:
  profile-mixed:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 7f78c3cd69d70ab1d63c88ffc75dc6a204011425
          path: baseline
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 92bda5898d9abb7a5aa0dba231bf31f1d21506cf
          path: candidate
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Build identical temporary mixed-source measurement harness
        shell: bash
        run: |
          set -euo pipefail
          git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
          mkdir -p results
          rustc --version | tee results/runner.txt
          lscpu | tee -a results/runner.txt
          cat > probe.rs <<'RS'
          use compiler_mini_c::{lower_source_native_typeid,compile_native_typeid};
          use compiler_opt::typed_pipeline::{optimize_checked_typeid_source_owned,TypeIdSourceOptions};
          use compiler_ir::native_module_text_v3::write_native_module_text_v3;
          use compiler_ir::Op;
          use std::{fs,time::Instant};
          #[path="../../../tests/c/generators/fp_pointer_memory.rs"]
          #[allow(dead_code)]
          mod pointer;
          #[test]
          fn mixed_checked_profile() {
              let mut many=String::from("double anchor(double x) {return x+x;}\n");
              for i in 0..96 {
                  many.push_str(&format!("int pure_{i}(int a,int b) {{return (a+b)*(a-b)+(a*b);}}\n"));
              }
              let cases=[
                  ("fp_admission",include_str!("../../../tests/c/fixtures/fp_optimizer_admission/source.c").to_string()),
                  ("fp_mixed_module",include_str!("../../../tests/c/fixtures/fp_mixed_module/source.c").to_string()),
                  ("fp_pointer_memory",pointer::source()),
                  ("many_pure_with_fp_anchor",many),
              ];
              let out=std::env::var("PROFILE_OUT").unwrap();
              fs::create_dir_all(&out).unwrap();
              for (name,source) in cases {
                  let input=lower_source_native_typeid(&source).unwrap();
                  input.validate_generic_fp_memory_provenance().unwrap();
                  assert!(input.functions.iter().flat_map(|f|&f.blocks).flat_map(|b|&b.instructions).any(|i|matches!(i.op,Op::Fp(..))));
                  let expected=optimize_checked_typeid_source_owned(input.clone(),TypeIdSourceOptions::default()).unwrap();
                  let canonical=write_native_module_text_v3(&expected).unwrap();
                  fs::write(format!("{out}/{name}.ir"),&canonical).unwrap();
                  fs::write(format!("{out}/{name}.o"),compile_native_typeid(&source,false,false).unwrap()).unwrap();
                  let mut ns=Vec::new();
                  for _ in 0..21 {
                      let work=input.clone();
                      let start=Instant::now();
                      let optimized=optimize_checked_typeid_source_owned(work,TypeIdSourceOptions::default()).unwrap();
                      ns.push(start.elapsed().as_nanos());
                      assert_eq!(write_native_module_text_v3(&optimized).unwrap(),canonical);
                  }
                  ns.sort_unstable();
                  println!("MIXED_PROFILE,{name},{},{},{}",input.functions.len(),input.functions.iter().flat_map(|f|&f.blocks).map(|b|b.instructions.len()).sum::<usize>(),ns[ns.len()/2]);
                  println!("MIXED_SAMPLES,{name},{ns:?}");
              }
          }
          RS
          for v in baseline candidate; do
            git -C "$v" rev-parse HEAD | tee "results/$v.sha"
            cp probe.rs "$v/tools/mini-c-driver/tests/checked_memory_admission_profile.rs"
            CARGO_TARGET_DIR="$PWD/$v/target-profile" cargo test --release --manifest-path "$v/tools/mini-c-driver/Cargo.toml" -p compiler-mini-c --test checked_memory_admission_profile --no-run --message-format=json > "results/$v-build.jsonl"
            python3 - "$v" <<'PY'
          import json,sys
          from pathlib import Path
          v=sys.argv[1]
          executables={r["executable"] for r in map(json.loads,Path(f"results/{v}-build.jsonl").read_text().splitlines()) if r.get("reason")=="compiler-artifact" and r.get("executable") and r.get("target",{}).get("name")=="checked_memory_admission_profile"}
          assert len(executables)==1,executables
          Path(f"results/{v}.exe").write_text(executables.pop())
          PY
          done
      - name: Compare exact output and ABBA mixed-source timings
        shell: bash
        run: |
          set -euo pipefail
          root="$PWD"
          for v in baseline candidate; do
            exe=$(cat "results/$v.exe")
            (cd "$v/tools/mini-c-driver" && PROFILE_OUT="$root/results/$v-warmup" "$exe" mixed_checked_profile --nocapture) > "results/$v-warmup.log" 2>&1
          done
          diff -r results/baseline-warmup results/candidate-warmup
          i=0
          for v in baseline candidate candidate baseline; do
            i=$((i+1))
            exe=$(cat "results/$v.exe")
            (cd "$v/tools/mini-c-driver" && PROFILE_OUT="$root/results/$i-output" /usr/bin/time -f 'elapsed_s=%e peak_rss_kib=%M' -o "$root/results/$i-$v.time" "$exe" mixed_checked_profile --nocapture) 2>&1 | tee "results/$i-$v.log"
            diff -r results/baseline-warmup "results/$i-output"
            cat "results/$i-$v.time"
          done
          echo 'MIXED_CANONICAL_AND_ELF_PARITY all four cases'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: checked-mixed-memory-admission
          path: results/
          retention-days: 14
