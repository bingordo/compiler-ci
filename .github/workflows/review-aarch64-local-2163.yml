name: Review AArch64 local frame PR 2163
on:
  push:
    branches: [review/aarch64-local-2163]
    paths:
      - .github/workflows/review-aarch64-local-2163.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  local-frame:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - name: Checkout exact compiler PR revision
        uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: dc0ca668280b82b7c4e441158d40f759fb51cad0
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Assert exact reviewed revision
        run: test "$(git -C compiler rev-parse HEAD)" = "dc0ca668280b82b7c4e441158d40f759fb51cad0"
      - uses: dtolnay/rust-toolchain@stable
      - name: Assemble minimal standalone workspace
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work/crates
          cp -a compiler/crates/{ir,backend,backend-aarch64} work/crates/
          cat > work/Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir", "crates/backend", "crates/backend-aarch64"]
          EOF
      - name: Compile target with warnings denied
        working-directory: work
        run: RUSTFLAGS="-D warnings" cargo check -p compiler-backend-aarch64 --all-targets
      - name: Run full native backend tests on ARM
        working-directory: work
        run: cargo test -p compiler-backend-aarch64 --all-targets -- --test-threads=1
      - name: Verify focused full-width local frame regression
        working-directory: work
        run: cargo test -p compiler-backend-aarch64 local_ptr64_accesses_remain_within_owned_frame -- --exact --nocapture
