# Independent AArch64 QEMU acceptance for compiler AL05 PR #2763.
# Cross-target checks must not be silently skipped in host-only test jobs.
name: IR PR2763 AL05 AArch64 ELF GAS QEMU
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ir-pr2763-al05-aarch64-qemu-20261122.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  al05-aarch64-qemu:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      SOURCE_SHA: ff6f8b9836d3dc85ae896d9749a859d00f63479a
      CARGO_INCREMENTAL: '0'
      CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
      AL05_REQUIRE_AARCH64: '1'
    steps:
      - name: Install cross GCC, binutils and QEMU user emulator
        run: |
          sudo apt-get install -y --no-install-recommends gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu libc6-dev-arm64-cross linux-libc-dev-arm64-cross qemu-user
      - name: Check out exact private compiler revision
        uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: ${{ env.SOURCE_SHA }}
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Isolate backend TypeId workspace and verify pin
        run: |
          set -euo pipefail
          test "$(git -C compiler rev-parse HEAD)" = "$SOURCE_SHA"
          cat > compiler/Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir", "crates/opt", "crates/backend", "crates/backend-x86", "crates/backend-aarch64"]
          EOF
          rm -f compiler/Cargo.lock
          aarch64-linux-gnu-gcc --version | head -n 1
          qemu-aarch64 --version | head -n 1
      - name: Cache Rust cross-test build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: ir-pr2763-al05-aarch64-qemu
      - name: Execute all four AArch64 ELF and GAS C11 differential oracles
        working-directory: compiler
        shell: bash
        run: |
          set -euo pipefail
          # --include-ignored runs P9/P14 alongside P15/P16; all matching
          # tests must exercise the installed QEMU/cross-GCC instead of skip.
          cargo test -p compiler-opt --test al05_p9_mixed_native_bridge aarch64 -- --include-ignored --nocapture
