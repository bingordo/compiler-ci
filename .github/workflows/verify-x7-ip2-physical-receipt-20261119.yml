name: X7 IP2 source DAG and exact XED receipt join
on:
  pull_request:
    paths: ['.github/workflows/verify-x7-ip2-physical-receipt-20261119.yml']
permissions:
  contents: read
jobs:
  physical-receipt-join:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 229a2a814e077c3ff88a0d96b0afd331fdf72455
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Install packaged Z3
        run: |
          set -euo pipefail
          sudo apt-get install -y z3 python3-z3
      - name: Exact source and physical receipt joins and negative tests
        working-directory: compiler
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "229a2a814e077c3ff88a0d96b0afd331fdf72455"
          python3 -m py_compile tools/x7_ip2_physical_receipt_join.py tools/test_x7_ip2_physical_receipt_join.py
          PYTHONPATH=/usr/lib/python3/dist-packages:tools /usr/bin/python3 -m unittest -v test_x7_ip2_physical_receipt_join test_x86_s3l_proof_receipt test_x7_ip2_source_verified_dag test_x7_ip2_helper_source_smt
          echo X7_IP2_PHYSICAL_RECEIPT_JOIN_PASS
