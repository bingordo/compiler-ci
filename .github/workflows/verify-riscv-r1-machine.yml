name: Verify RV64 selected-machine and LP64 register contract
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/verify-riscv-r1-machine.yml']
permissions:
  contents: read
jobs:
  rv64-selected:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: b4b33282ec26c7add7e7acdc89490b861ffeac50
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Verify pinned compiler revision
        run: test "$(git -C compiler rev-parse HEAD)" = "b4b33282ec26c7add7e7acdc89490b861ffeac50"
      - uses: dtolnay/rust-toolchain@stable
      - name: Restrict workspace to frontend-independent Rust crates
        working-directory: compiler
        run: |
          cat > Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir", "crates/backend", "crates/backend-riscv64"]
          EOF
          rm -f Cargo.lock
      - name: Run RV64 backend selected-machine tests
        working-directory: compiler
        run: |
          cargo test -p compiler-backend-riscv64 --all-targets
          cargo check -p compiler-backend-riscv64 --all-targets
          cargo clippy -p compiler-backend-riscv64 --all-targets -- -D warnings
