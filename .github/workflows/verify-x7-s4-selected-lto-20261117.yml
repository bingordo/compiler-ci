# Temporary X7 S4 source-pinned LTO acceptance; never run compiler Actions.
name: X7 S4 shared x86 LTO and mixed-link acceptance
on:
  pull_request:
    paths:
      - '.github/workflows/verify-x7-s4-selected-lto-20261117.yml'
permissions:
  contents: read
jobs:
  checked-lto-shared-physical-and-source-regressions:
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    steps:
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.CI_KEY }}
      - name: Trust GitHub SSH
        run: ssh-keyscan github.com >> ~/.ssh/known_hosts
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 704988f152d390c975077ec5976e152cfcc69d16
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Assert exact candidate source
        run: test "$(git -C compiler rev-parse HEAD)" = "704988f152d390c975077ec5976e152cfcc69d16"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: x7-s4-selected-lto
      - name: Real CLI LTO object and executable source acceptance
        shell: bash
        working-directory: compiler
        run: |
          set -euo pipefail
          cargo test -p compiler --test x7_s4_selected_lto -- --nocapture
          for suite in lto_cli lto_elf_visibility lto_mixed_link lto_generated_multitu lto_ordered_build lto_link_wrapper lto_source_sidecar lto_coemit; do
            cargo test -p compiler --test "$suite"
          done
          cargo test -p compiler --test x7_s4_selected_ir_replay
          cargo test -p compiler --test x7_selected_machine_source
          cargo test -p compiler --bin compiler x7_s4_source_ir_dump
          cargo test -p compiler-backend-x86 --lib
          cargo test -p compiler-backend-x86 --no-default-features --lib
          echo X7_S4_SHARED_LTO_INTEGRATION_GREEN
      - name: Established real 48-source/mode GCC differential acceptance
        shell: bash
        working-directory: compiler
        run: |
          set -euo pipefail
          cargo build -p compiler
          python3 tools/x7_s4_executable_source_gate.py \
            --compiler target/debug/compiler \
            --source-sha 704988f152d390c975077ec5976e152cfcc69d16 \
            --out ../x7-s4-lto-source-regression \
            --scales 8 24 48 \
            --languages mini_c oberon \
            --modes plain framed pic pic_framed \
            --groups 3
          echo X7_S4_SHARED_LTO_SOURCE_GATE_GREEN
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: x7-s4-lto-source-regression
          path: x7-s4-lto-source-regression
          if-no-files-found: warn
