name: X7 S4 legacy physical emitter removal dependency inventory
on:
  pull_request:
    paths:
      - '.github/workflows/x7-s4-native-delete-inventory-20261117.yml'
permissions:
  contents: read
jobs:
  inventories:
    runs-on: ubuntu-24.04
    steps:
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.CI_KEY }}
      - name: Trust GitHub SSH
        run: ssh-keyscan github.com >> ~/.ssh/known_hosts
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: a32b82a61f7eb526a5c4a9204ca57a4eb0c64a3c
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Exact-source legacy physical TypeId interface inventory
        working-directory: compiler
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = a32b82a61f7eb526a5c4a9204ca57a4eb0c64a3c
          echo X7_S4_NATIVE_DELETE_SRC_REFERENCES_BEGIN
          git grep -nE 'native_typeid::|NativeTypeIdBackend|physical_module_v[35]::|physical_tagged_v2::|physical_text_v1::|x7_s0_gp_report' -- crates tools/edg-driver/src | head -n 250 || true
          echo X7_S4_NATIVE_DELETE_SRC_REFERENCES_END
          echo X7_S4_NATIVE_DELETE_INTEGRATION_TEST_FILES_BEGIN
          git grep -lE 'native_typeid::|--x7-native-physical|--typeid-native|--profile-native-opt|physical_module_v[35]::' -- crates tools/edg-driver/tests | sort | head -n 160 || true
          echo X7_S4_NATIVE_DELETE_INTEGRATION_TEST_FILES_END
          echo X7_S4_NATIVE_DELETE_INVENTORY_DONE
