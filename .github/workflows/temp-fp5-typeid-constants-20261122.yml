# Temporary exact-source native ARM64 gate; close unmerged after compiler source acceptance.
name: TEMP FP5 native TypeId exact F32 F64 constants and FP ABI
on:
  pull_request:
    paths:
      - '.github/workflows/temp-fp5-typeid-constants-20261122.yml'
permissions:
  contents: read
jobs:
  native-typeid-fp-constants:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: eff90f02a0a613135847a50072dc947a131fc6ae
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Verify exact compiler source SHA
        working-directory: compiler
        run: test "$(git rev-parse HEAD)" = "eff90f02a0a613135847a50072dc947a131fc6ae"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Build minimal native AArch64 backend closure
        run: |
          set -euo pipefail
          mkdir -p a64/crates
          cp -a compiler/crates/ir compiler/crates/backend compiler/crates/backend-aarch64 a64/crates/
          cat > a64/Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir","crates/backend","crates/backend-aarch64"]
          EOF
      - name: Strict all-target AArch64 native typecheck
        working-directory: a64
        run: RUSTFLAGS="-D warnings" cargo check -p compiler-backend-aarch64 --all-targets
      - name: Actual TypeId F32 F64 constant and C11 ABI bit-differential
        working-directory: a64
        run: cargo test -p compiler-backend-aarch64 --test typeid_fp_native -- --nocapture
      - name: Complete existing AArch64 backend regressions
        working-directory: a64
        run: cargo test -p compiler-backend-aarch64 --all-targets -- --test-threads=1
      - name: Strict production library and changed FP test Clippy
        working-directory: a64
        run: |
          cargo clippy -p compiler-backend-aarch64 --lib -- -D warnings
          cargo clippy -p compiler-backend-aarch64 --test typeid_fp_native -- -D warnings
