name: Verify opt generated Rust test migration 2728
on:
  push:
    branches:
      - ci/validate-opt-graph-migration-2728-20261122
    paths:
      - .github/workflows/verify-opt-graph-migration-2728.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact-source-optimizer-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
      SOURCE_SHA: adadd9a5d33bc2834d8422d3c56d2887c9f2b7fb
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: adadd9a5d33bc2834d8422d3c56d2887c9f2b7fb
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Verify immutable source pin and isolate core crates
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C compiler rev-parse HEAD)" = "$SOURCE_SHA"
          cat > compiler/Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir", "crates/opt", "crates/backend", "crates/backend-x86"]
          EOF
          rm -f compiler/Cargo.lock
          rustc --version
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: opt-graph-migration-2728
      # The three complete suites passed at the identical source SHA in
      # runs 45036946967 and 45037068791; this additional run focuses
      # only on existing lint blockers and migrated test lint acceptance.
      # Existing compiler-opt/slp.rs unused imports and shared test-only
      # helper variants are not part of this migration; keep all other lints strict.
      - name: Strict Clippy except unrelated unused imports and test-only dead code
        working-directory: compiler
        run: |
          cargo clippy -p compiler-opt --test generated_native_add_partition_comparison_s2328 --test generated_native_reverse_subtractive_s2329 --test generated_native_add_xor_carry_comparison_s2331 -- -D warnings -A unused-imports -A dead-code -A clippy::empty-line-after-doc-comments
