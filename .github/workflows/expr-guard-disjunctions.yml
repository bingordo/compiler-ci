name: Verify inferred guard disjunctions
on:
  push:
    branches: [main]
    paths: ['.github/workflows/expr-guard-disjunctions.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: e0473a49d75ea43f7b680cb1053bc36fca018ca4
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Install Z3
        run: sudo apt-get update -qq && sudo apt-get install -y z3
      - name: Run generator and solver unit tests
        run: |
          cargo test --manifest-path compiler/tools/expr-rule-gen/Cargo.toml
          cargo run --manifest-path compiler/tools/expr-rule-gen/Cargo.toml -- --self-test
      - name: Generate original and generalized rules
        run: |
          cargo run --release --manifest-path compiler/tools/expr-rule-gen/Cargo.toml -- \
            --infer-guards --max-rules 200 --max-proofs 2000 \
            --format json --output /tmp/base-guards.json
          cargo run --release --manifest-path compiler/tools/expr-rule-gen/Cargo.toml -- \
            --infer-guards --generalize-guards --max-rules 200 --max-proofs 2000 \
            --format json --output /tmp/general-guards.json
          cargo run --release --manifest-path compiler/tools/expr-rule-gen/Cargo.toml -- \
            --infer-guards --generalize-guards --max-rules 200 --max-proofs 2000 \
            --format json --check /tmp/general-guards.json
          cargo run --release --manifest-path compiler/tools/expr-rule-gen/Cargo.toml -- \
            --infer-guards --max-rules 200 --max-proofs 2000 \
            --format rust --output /tmp/base-guards.rs
          cargo run --release --manifest-path compiler/tools/expr-rule-gen/Cargo.toml -- \
            --infer-guards --generalize-guards --max-rules 200 --max-proofs 2000 \
            --format rust --output /tmp/general-guards.rs
          rustc --edition=2021 -O --test /tmp/general-guards.rs -o /tmp/general-guards-tests
          /tmp/general-guards-tests
          ORIGINAL_MATCHER=/tmp/base-guards.rs \
          REDUCED_MATCHER=/tmp/general-guards.rs \
            rustc --edition=2021 -O \
            compiler/tools/expr-rule-gen/harness/compare_generalized.rs \
            -o /tmp/compare-generalized
          /tmp/compare-generalized
          python3 - <<'PY'
          import json
          base=json.load(open('/tmp/base-guards.json'))
          gen=json.load(open('/tmp/general-guards.json'))
          assert len(base['rules'])==len(gen['rules'])==108
          assert base['rule_limit_reached']==gen['rule_limit_reached']
          assert all(a['lhs']==b['lhs'] and a['rhs']==b['rhs']
                     for a,b in zip(base['rules'], gen['rules']))
          g=gen['generalization']
          assert g['base_rules']==108
          assert g['discovery_checks']==base['proof']['checks']
          assert gen['proof']['checks']==g['discovery_checks']+g['additional_checks']
          n=sum(x['guard'].get('op')=='or' for x in gen['rules'])
          assert n==g['generalized_rules']
          assert all(x['guard']['args'][0]==y['guard']
              for x,y in zip(gen['rules'],base['rules'])
              if x['guard'].get('op')=='or')
          print('Generalized guard rules:',n,'of',len(gen['rules']),
                'additional solver checks:',g['additional_checks'])
          PY
      - name: Discover genuinely conjunctive guard rules and compare matchers
        run: |
          cargo run --release --manifest-path compiler/tools/expr-rule-gen/Cargo.toml -- \
            --infer-guards --max-rules 250 --max-proofs 2000 \
            --format json --output /tmp/base-conjunction.json
          cargo run --release --manifest-path compiler/tools/expr-rule-gen/Cargo.toml -- \
            --infer-guards --compose-guards --max-rules 250 --max-proofs 2000 \
            --format json --output /tmp/composed.json
          cargo run --release --manifest-path compiler/tools/expr-rule-gen/Cargo.toml -- \
            --infer-guards --compose-guards --max-rules 250 --max-proofs 2000 \
            --format json --check /tmp/composed.json
          cargo run --release --manifest-path compiler/tools/expr-rule-gen/Cargo.toml -- \
            --infer-guards --compose-guards --max-rules 250 --max-proofs 2000 \
            --format rust --output /tmp/composed.rs
          rustc --edition=2021 -O --test /tmp/composed.rs -o /tmp/composed-tests
          /tmp/composed-tests
          python3 - <<'PY'
          import json
          baseline=json.load(open('/tmp/base-conjunction.json'))
          composed=json.load(open('/tmp/composed.json'))
          m=composed['composition']
          assert m['added_rules'] > 0, 'no two-condition rule was discovered'
          assert composed['rule_limit_reached'] == (len(composed['rules']) >= 250)
          assert composed['proof']['checks'] == m['discovery_checks'] + m['additional_checks']
          assert composed['rules'][:len(baseline['rules'])] == baseline['rules']
          assert m['added_rules'] == len(composed['rules']) - len(baseline['rules'])
          assert all(x['guard']['op']=='and' and len(x['guard']['args'])==2
              for x in composed['rules'][len(baseline['rules']):])
          bitwise={'And','Or','Xor'}
          arithmetic={'Add','Sub','Mul'}
          added=composed['rules'][len(baseline['rules']):]
          mixed=[r for r in added if
                 (r['lhs']['op'] in bitwise and r['lhs']['lhs']['op'] in arithmetic) or
                 (r['lhs']['op'] in arithmetic and r['lhs']['lhs']['op'] in bitwise)]
          assert len(mixed)>0, 'mixed arithmetic-bitwise synthesis discovered no rules'
          print('Mixed family rules:',len(mixed))
          print('Conjunctive rules discovered:',m['added_rules'],'total:',len(composed['rules']),
                'additional SMT checks:',m['additional_checks'],
                'cap reached:',composed['rule_limit_reached'])
          PY
          cargo run --release --manifest-path compiler/tools/expr-rule-gen/Cargo.toml -- \
            --infer-guards --max-rules 250 --max-proofs 2000 \
            --format rust --output /tmp/base-conjunction.rs
          ORIGINAL_MATCHER=/tmp/base-conjunction.rs \
          REDUCED_MATCHER=/tmp/composed.rs \
            rustc --edition=2021 -O \
            compiler/tools/expr-rule-gen/harness/compare_generalized.rs \
            -o /tmp/compare-conjunctive
          /tmp/compare-conjunctive
