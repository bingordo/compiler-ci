name: S23.55 pinned guarded SSA transactional admission
on:
  pull_request:
    paths:
      - '.github/workflows/s23-55-guarded-admission.yml'
permissions:
  contents: read
jobs:
  guarded-ssa-admission:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 9060889472b6a3f1fa59c2d70a69f1c1e5c560b9
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Confirm exact candidate and changed file scope
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C compiler rev-parse HEAD)" = 9060889472b6a3f1fa59c2d70a69f1c1e5c560b9
          cd compiler
          echo "S2355_COMPILER_SHA=$(git rev-parse HEAD)"
          git show --stat --oneline HEAD
      - name: Isolate core workspace from driver-only private frontend sources
        shell: bash
        run: |
          set -euo pipefail
          cat > compiler/Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir","crates/opt","crates/backend","crates/backend-x86","crates/backend-aarch64"]
          EOF
          rm -f compiler/Cargo.lock
      - name: Test native transactional guard admission (opt-in)
        working-directory: compiler
        run: |
          set -euo pipefail
          cargo test -p compiler-opt --lib --features experimental-typeid-guarded-admission generated_guarded_admission -- --nocapture
      - name: Test existing default-on TypeId matcher regression
        working-directory: compiler
        run: |
          set -euo pipefail
          cargo test -p compiler-opt --test native_s2350_shadow_parity
          cargo test -p compiler-opt --test native_default_generated_flags
      - name: Lint source adapter without experimental dead-code complaints
        working-directory: compiler
        run: |
          set -euo pipefail
          cargo clippy -p compiler-opt --lib --features experimental-typeid-guarded-admission -- -D warnings -A dead_code
