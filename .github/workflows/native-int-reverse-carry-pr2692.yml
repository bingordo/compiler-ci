name: Validate declarative reverse-carry graph PR2692
on:
  pull_request:
    paths:
      - '.github/workflows/native-int-reverse-carry-pr2692.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reverse-carry:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      CARGO_INCREMENTAL: '0'
      SOURCE_SHA: 9f0d2c9d137b53c9ec87a7c55aa4adc880a2822f
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 9f0d2c9d137b53c9ec87a7c55aa4adc880a2822f
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Verify exact source revision and isolate optimizer
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C compiler rev-parse HEAD)" = "$SOURCE_SHA"
          cat > compiler/Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir", "crates/opt", "crates/backend", "crates/backend-x86"]
          EOF
          rm -f compiler/Cargo.lock
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: native-int-seeded-generator
      - name: Run complete five-width S23.30 reverse-carry differential and rollback tests
        working-directory: compiler
        shell: bash
        run: |
          set -euo pipefail
          cargo test -p compiler-opt --test generated_native_reverse_carry_s2330 -- --nocapture
      - name: Strict focused Clippy, exempt only existing unrelated upstream warning categories
        working-directory: compiler
        run: cargo clippy -p compiler-opt --test generated_native_reverse_carry_s2330 -- -D warnings -A dead-code -A clippy::empty-line-after-doc-comments -A unused-imports -A clippy::too-many-arguments
