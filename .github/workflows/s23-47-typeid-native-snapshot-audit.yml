name: S23.47 verified TypeId pre-core and pre-native optimizer-only snapshot replay
on:
  pull_request:
    paths:
      - '.github/workflows/s23-47-typeid-native-snapshot-audit.yml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/s23-47-typeid-native-snapshot-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-pinned-s23-47:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout exact optimizer-only TypeId replay acceptance source
        uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: fd11745800fc836b80f42f6908ba49f79ea1b6d3
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Verify source SHA and isolate optimizer/backend crates
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C compiler rev-parse HEAD)" = fd11745800fc836b80f42f6908ba49f79ea1b6d3
          cat > compiler/Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir", "crates/opt", "crates/backend", "crates/backend-x86"]
          EOF
          rm -f compiler/Cargo.lock
          rustc --version
      - name: Reuse native TypeId workspace cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: s22-native-integer-generated
      - name: Strict production optimizer and native-backend Clippy
        shell: bash
        working-directory: compiler
        run: |
          set -euo pipefail
          cargo clippy -p compiler-opt --all-targets -- -D warnings
          cargo clippy -p compiler-backend-x86 --test native_s2344_strict_partitions -- -D warnings
          cargo clippy -p compiler-backend-x86 --test native_s2343_unsigned_subset -- -D warnings
          cargo clippy -p compiler-backend-x86 --test native_s2342_xor_complements -- -D warnings
          cargo clippy -p compiler-backend-x86 --test native_s23_profitability -- -D warnings
      - name: S23.46 exact hit-count parity and earlier matcher/strict comparisons
        shell: bash
        working-directory: compiler
        run: |
          set -euo pipefail
          cargo test -p compiler-opt --test native_s2347_ir_snapshot_audit independent_checked_typeid_v3_replay_smoke -- --nocapture
          cargo test -p compiler-opt --test native_s2316_profile -- --nocapture
          cargo test -p compiler-opt --test generated_native_prior_comparison_s2345 -- --nocapture
          cargo test -p compiler-opt --test generated_native_strict_bitwise_partitions_s2344 -- --nocapture
          cargo test -p compiler-opt --test generated_native_unsigned_subset_s2343 -- --nocapture
          cargo test -p compiler-opt --test generated_native_complement_xor_pair_s2342 -- --nocapture
          cargo test -p compiler-opt --test generated_native_demorgan_existing_s2337 -- --nocapture
      - name: Existing S23.36 and earlier complement/factoring and phase-safe DAG regressions
        shell: bash
        working-directory: compiler
        run: |
          set -euo pipefail
          cargo test -p compiler-opt --test generated_native_paired_not_s2336 -- --nocapture
          cargo test -p compiler-opt --test generated_native_reverse_difference_s2335 -- --nocapture
          cargo test -p compiler-opt --test generated_native_additive_pair_cancellation_s2334 -- --nocapture
          cargo test -p compiler-opt --test generated_native_dual_arithmetic_cancellation_s2333 -- --nocapture
          cargo test -p compiler-opt --test generated_native_shared_masked_sub_s2332 -- --nocapture
          cargo test -p compiler-opt --test generated_native_add_xor_carry_comparison_s2331 -- --nocapture
          cargo test -p compiler-opt --test generated_native_reverse_carry_s2330 -- --nocapture
          cargo test -p compiler-opt --test generated_native_reverse_subtractive_s2329 -- --nocapture
          cargo test -p compiler-opt --test generated_native_add_partition_comparison_s2328 -- --nocapture
          cargo test -p compiler-opt --test generated_native_carry_reconstruction_s2327 -- --nocapture
          cargo test -p compiler-opt --test generated_native_complement_mask_s2326 -- --nocapture
          cargo test -p compiler-opt --test generated_native_complement_pair_s2325 -- --nocapture
          cargo test -p compiler-opt --test generated_native_xor_partition_s2324 -- --nocapture
          cargo test -p compiler-opt --test generated_native_disjoint_arithmetic_s2323 -- --nocapture
          cargo test -p compiler-opt --test generated_native_subtractive_partition_s2322 -- --nocapture
          cargo test -p compiler-opt --test generated_native_bitwise_comparison_s2321 -- --nocapture
          cargo test -p compiler-opt --test generated_native_matchpd_arithmetic_s2320 -- --nocapture
          cargo test -p compiler-opt --test generated_native_matchpd_pairwise_s2319 -- --nocapture
          cargo test -p compiler-opt --test generated_native_matchpd_subset_s2318 -- --nocapture
          cargo test -p compiler-opt --test generated_native_matchpd_boolean_factor_s2314 -- --nocapture
          cargo test -p compiler-opt --test generated_native_dag_snapshot_s2313 -- --nocapture
          cargo test -p compiler-opt --test generated_native_matchpd_complement_s2312 -- --nocapture
          cargo test -p compiler-opt --test generated_native_matchpd_boolean_s2311 -- --nocapture
          cargo test -p compiler-opt --test generated_native_matchpd_partition -- --nocapture
          cargo test -p compiler-opt --test native_s2316_profile -- --nocapture
      - name: Unchanged native x86 C11 direct ELF/GAS oracles debug/release
        shell: bash
        working-directory: compiler
        run: |
          set -euo pipefail
          cargo test -p compiler-backend-x86 --test native_s2344_strict_partitions -- --nocapture
          cargo test -p compiler-backend-x86 --test native_s2343_unsigned_subset -- --nocapture
          cargo test -p compiler-backend-x86 --test native_s2342_xor_complements -- --nocapture
          cargo test -p compiler-backend-x86 --test native_s23_profitability native_s2337_demorgan_existing_gas_elf -- --nocapture
          cargo test --release -p compiler-backend-x86 --test native_s2344_strict_partitions -- --nocapture
          cargo test --release -p compiler-backend-x86 --test native_s2343_unsigned_subset -- --nocapture
          cargo test --release -p compiler-backend-x86 --test native_s2342_xor_complements -- --nocapture
          cargo test --release -p compiler-backend-x86 --test native_s23_profitability native_s2337_demorgan_existing_gas_elf -- --nocapture
          cargo test -p compiler-backend-x86 --test native_s23_profitability native_s2336_paired_complements_gas_elf -- --nocapture


  source-pinned-z3-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact S23.47 unchanged native identity proof source
        uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: fd11745800fc836b80f42f6908ba49f79ea1b6d3
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Verify source revision before formal proof
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C compiler rev-parse HEAD)" = fd11745800fc836b80f42f6908ba49f79ea1b6d3
      - name: Install checksum-pinned official Z3 release (avoid Ubuntu mirror DNS outage)
        shell: bash
        run: |
          set -euo pipefail
          # Official Z3 release artifact; no dependency on Ubuntu apt mirrors.
          version="5.3.1"
          asset="z3-${version}-x64-glibc-2.39.zip"
          url="https://github.com/Z3Prover/z3/releases/download/z3-${version}/${asset}"
          archive="${RUNNER_TEMP}/${asset}"
          curl --fail --location --retry 4 --retry-all-errors \
            --connect-timeout 15 --max-time 180 \
            --output "${archive}" "${url}"
          echo "acca9625e8cc8edeb9647b653a1bd696544ddeb5d1c2970a4576734a0c175b40  ${archive}" | sha256sum --check -
          mkdir -p "${RUNNER_TEMP}/z3-release"
          unzip -q "${archive}" -d "${RUNNER_TEMP}/z3-release"
          solver="$(find "${RUNNER_TEMP}/z3-release" -type f -path '*/bin/z3' -print -quit)"
          test -n "${solver}"
          chmod +x "${solver}"
          echo "$(dirname "${solver}")" >> "${GITHUB_PATH}"
          "${solver}" -version
      - name: Unchanged 129 width-precise S23 QF_BV rules and 95 SAT controls
        shell: bash
        working-directory: compiler
        run: |
          set -euo pipefail
          python3 tools/prove_native_matchpd_s23.py --timeout-ms 2500 --process-timeout 5
          python3 tools/prove_ir_bitwise_identities.py


  source-pinned-production-typeid-snapshot-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    env:
      CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
      CARGO_INCREMENTAL: '0'
    steps:
      - name: Checkout exact current production TypeId compiler and standalone optimizer replay
        uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: fd11745800fc836b80f42f6908ba49f79ea1b6d3
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Checkout separate historical Git-exact S23.38 source fixtures
        uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 333fcc01aff14a3a0718ea92a26049fa301c39bd
          path: source-corpus
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Strict source/corpus provenance pins and Python syntax
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C compiler rev-parse HEAD)" = fd11745800fc836b80f42f6908ba49f79ea1b6d3
          test "$(git -C source-corpus rev-parse HEAD)" = 333fcc01aff14a3a0718ea92a26049fa301c39bd
          git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
          python3 -m py_compile compiler/tools/s23_47_capture_typeid_snapshots.py
          python3 -m py_compile compiler/tools/s23_47_parse_typeid_snapshot_audit.py
          python3 -m py_compile compiler/tools/s23_native_real_source_abba.py
          rustc --version
          cc --version | head -1
      - name: Reuse independent production source compiler Cargo caches
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: s2347-typeid-snapshot-ir-audit
      - name: Build release production compiler without source/frontend modifications
        shell: bash
        working-directory: compiler
        run: |
          set -euo pipefail
          cargo build --release -p compiler --bin compiler
          test -x target/release/compiler
      - name: Capture all 31 historical plus 15 additional current project source fixtures
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p results
          python3 -u compiler/tools/s23_47_capture_typeid_snapshots.py \
            --root compiler \
            --compiler-sha fd11745800fc836b80f42f6908ba49f79ea1b6d3 \
            --corpus-root source-corpus \
            --corpus-sha 333fcc01aff14a3a0718ea92a26049fa301c39bd \
            --compiler compiler/target/release/compiler \
            --snapshots results/typeid_snapshots \
            --output results/s23-47-source-capture.json \
            2>&1 | tee results/s23-47-source-capture.log
          python3 - <<'PY'
          import json
          r=json.load(open("results/s23-47-source-capture.json"))
          assert r["attempted"]==46
          assert r["accepted"]+r["rejected"]==46
          assert r["accepted"]>=20
          assert sum(case["origin"]=="current_repository"
                     for case in r["accepted_cases"].values())>=1, (
              "no additional source accepted; do not claim broader IR coverage")
          PY
      - name: Replay verified saved native TypeId pre-core and pre-native inputs without frontend
        shell: bash
        run: |
          set -euo pipefail
          (
            cd compiler
            S2347_SNAPSHOT_DIR="$GITHUB_WORKSPACE/results/typeid_snapshots" \
              cargo test --release -p compiler-opt --test native_s2347_ir_snapshot_audit -- --nocapture
          ) 2>&1 | tee results/s23-47-typeid-native-replay.log
          test "$(grep -c '^S2347_IR_CASE ' results/s23-47-typeid-native-replay.log)" -ge 20
          grep '^S2347_IR_SUMMARY ' results/s23-47-typeid-native-replay.log
      - name: Verify exact replay accounting and report stage/corpus totals
        shell: bash
        run: |
          set -euo pipefail
          python3 compiler/tools/s23_47_parse_typeid_snapshot_audit.py \
            --capture results/s23-47-source-capture.json \
            --audit-log results/s23-47-typeid-native-replay.log \
            --output results/s23-47-typeid-native-replay-summary.json \
            2>&1 | tee results/s23-47-typeid-native-replay-summary.log
          grep '^S2347_COHORT ' results/s23-47-typeid-native-replay-summary.log >> "$GITHUB_STEP_SUMMARY"
          grep '^S2347_AUDIT_SUMMARY ' results/s23-47-typeid-native-replay-summary.log >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve verified original TypeId modules, final ELF metadata, rejects and replay logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: s23-47-exact-source-typeid-native-snapshot-audit
          path: results/
          if-no-files-found: warn
          retention-days: 30
