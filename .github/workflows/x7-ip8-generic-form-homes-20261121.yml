name: X7 IP8 generic physical form operand homes
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/x7-ip8-generic-form-homes-20261121.yml'
permissions:
  contents: read
jobs:
  generic-form-home-admission:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 19aee810f1d17f3405c43dd90cf0c821c8912d48
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Exact source and compiler setup
        run: |
          set -euo pipefail
          test "$(git -C compiler rev-parse HEAD)" = "19aee810f1d17f3405c43dd90cf0c821c8912d48"
          git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
          git config --global --add url."https://github.com/".insteadOf "git@github.com:"
          rustc --version
          gcc --version | head -1
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: x7-ip8-generic-form-homes
      - name: Shared backend and native x86 multi-family physical-home tests
        working-directory: compiler
        run: |
          set -euo pipefail
          cargo test -p compiler-backend --lib --quiet
          cargo test -p compiler-backend-x86 --lib x7_ip8_generic_form_homes -- --nocapture
          cargo test -p compiler-backend-x86 --lib \
            --features x7-ip7-workload-profile \
            x7_ip7h_allocated_lea -- --nocapture
          cargo test -p compiler-backend-x86 --lib \
            --features x7-ip7-workload-profile --quiet
          cargo clippy -p compiler-backend -p compiler-backend-x86 --lib \
            --features compiler-backend-x86/x7-ip7-workload-profile -- \
            -D clippy::correctness -D clippy::suspicious -A clippy::empty_line_after_doc_comments
