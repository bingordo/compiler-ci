# EDG/Cranelift practical C breadth milestone: 1000 reproducible YARPGen cases.
# Use the same pinned EDG/YARPGen and independent GCC+Clang oracles as smoke.
name: EDG Cranelift 1000-seed bounded-default coverage
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/edg-yarpgen-1000-bounded.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  coverage:
    uses: ./.github/workflows/edg-yarpgen.yml
    with:
      source_ref: cranelift-codegen
      count: '1000'
      start_seed: '12345'
      profile: bounded-default
