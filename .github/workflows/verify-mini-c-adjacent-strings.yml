name: Verify Mini-C adjacent narrow string literals
on:
  pull_request:
    paths: ['.github/workflows/verify-mini-c-adjacent-strings.yml']
permissions:
  contents: read
jobs:
  mini-c-syntax:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Checkout exact Mini-C parser PR
        uses: actions/checkout@v4
        with:
          repository: bingordo/mini-c
          ref: 7976b981da0b3ad0d34a3f7915dd08b2c6ba5268
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
          path: mini-c
      - name: Verify pinned parser and focused regression
        shell: bash
        run: |
          set -euo pipefail
          git -C mini-c rev-parse HEAD
          cargo test --manifest-path mini-c/Cargo.toml -p mini-c-syntax --test adjacent_narrow_strings -- --nocapture
      - name: Run syntax crate regression suite
        shell: bash
        run: |
          set -euo pipefail
          cargo test --manifest-path mini-c/Cargo.toml -p mini-c-syntax
      - name: State actual coverage
        run: |
          echo 'Mini-C syntax adjacent narrow literal parser regression PASS; native ABI probe and compiler re-pin separately pending' >> "$GITHUB_STEP_SUMMARY"
