name: X7 source-pinned indexed physical costs
on:
  pull_request:
    paths:
      - '.github/workflows/x7-indexed-source-cost-20261121.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  generate-source-pinned:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: f5749197d729e1390968a7d4568734dc9d7a2a22
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Verify exact compiler source
        run: test "$(git -C compiler rev-parse HEAD)" = "f5749197d729e1390968a7d4568734dc9d7a2a22"
      - name: Download only approved upstream uops.info XML
        run: |
          set -euo pipefail
          curl -fL --retry 2 --max-time 600 https://uops.info/instructions.xml -o instructions.xml
          test "$(sha256sum instructions.xml | cut -d' ' -f1)" = "e5e702caaf04c4fc1f75192a9bbe4d8554b3e174f7933a14d124cc33ca677ab3"
      - name: Reproduce CPU-specific indexed uops and per-form TP
        working-directory: compiler
        run: |
          set -euo pipefail
          python3 tools/regen_x86_indexed_costs.py --xml ../instructions.xml --write
          python3 - <<'PY'
          from pathlib import Path
          for label,path in [
            ("GENJSON","data/x86_indexed_costs.json"),
            ("GENRUST","crates/backend-x86/src/generated_indexed_physical_costs.rs"),
          ]:
              for line in Path(path).read_text().splitlines():
                  print(label+":"+line,flush=True)
          PY
