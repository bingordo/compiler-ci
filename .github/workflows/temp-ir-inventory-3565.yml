name: Temporary TypeId production inventory PR3565
on:
  pull_request:
    paths:
      - '.github/workflows/temp-ir-inventory-3565.yml'
permissions:
  contents: read
jobs:
  inventory:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      SOURCE_SHA: 6e50d1cb88dd2d3a3c0d6e233edb22c8f1bdbcc6
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: ${{ env.SOURCE_SHA }}
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Verify exact source SHA
        working-directory: compiler
        run: test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
      - name: Run IR inventory unit and production gates
        working-directory: compiler
        run: |
          set -euo pipefail
          PYTHONPATH=tools python3 -m unittest tools/test_ir_consumer_inventory.py
          python3 tools/ir_consumer_inventory.py --check-production
