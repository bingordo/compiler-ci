# Default YARPGen C features except the dimensionality budget: avoids
# unrealistic multi-GiB BSS while exercising language and ABI breadth.
name: EDG Cranelift bounded-default breadth
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/edg-yarpgen-100-bounded.yml'
  schedule:
    - cron: '17 7 2 * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  breadth:
    uses: ./.github/workflows/edg-yarpgen.yml
    with:
      source_ref: cranelift-codegen
      count: '100'
      start_seed: '12345'
      profile: bounded-default
