name: Tiny real EDG C record crash candidates

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/probe-edg-record-crash.yml'
      - 'bootstrap/probe-edg-record-crash.sh'
      - 'bootstrap/edg_parse_probe.rs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  record-crash:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout public C crash candidates and bounded parser
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Checkout exact EDG callable frontend source
        uses: actions/checkout@v4
        with:
          repository: bingundu/edgcpp
          ref: b195677be8b9b56c8337afad6be8064d21a54082
          path: edgcpp
          persist-credentials: false
      - name: Checkout exact crashing Rust EDG bridge
        uses: actions/checkout@v4
        with:
          repository: bingordo/edgcpp-rust
          ref: fc5adba5dc9061cc24517544c23ee92ab0151b5e
          path: edgcpp-rust
          persist-credentials: false
      - name: Check reducer-independent public record slices with GDB
        shell: bash
        run: |
          set -euo pipefail
          bash -n bootstrap/probe-edg-record-crash.sh
          timeout --signal=TERM --kill-after=20s 30m docker run --rm \
            --cap-add=SYS_PTRACE --security-opt seccomp=unconfined \
            --entrypoint /bin/bash \
            -v "$PWD:/workspace" \
            -v "$RUNNER_TEMP:/audit-tmp" \
            ghcr.io/edgcpp/ci-runner@sha256:14b3948c2ce12cfa5472e5a6c468393d15426f3a67685cc35d830ea5db2acdf8 \
            -euo pipefail /workspace/bootstrap/probe-edg-record-crash.sh \
            | tee "$RUNNER_TEMP/record-crash.log"
          grep -q '^EDG_RECORD_SAME_FRAME=' "$RUNNER_TEMP/record-crash.log"
