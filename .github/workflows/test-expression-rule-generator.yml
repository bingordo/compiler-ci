name: Verify prebuilt expression rule generator

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/test-expression-rule-generator.yml"
      - "README.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: expression-rule-generator-test
  cancel-in-progress: true

jobs:
  verify-prebuilt-binary:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Fetch only the prebuilt generator from private compiler
        uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: expr-rule-gen-binaries
          path: private-binary
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
          sparse-checkout: |
            dist
      - name: Check binary checksum and source provenance
        shell: bash
        run: |
          set -euo pipefail
          cd private-binary
          sha256sum --check dist/sha256.txt
          cat dist/source-sha.txt
          tar -tzf dist/expr-rule-gen-linux-x86_64.tar.gz | grep -Fx expr-rule-gen
          tar -xzf dist/expr-rule-gen-linux-x86_64.tar.gz -C "$RUNNER_TEMP"
          test -x "$RUNNER_TEMP/expr-rule-gen"
      - name: Install solver only in test runner
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v z3 >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq z3
          fi
          z3 --version
      - name: Verify formal identities and deterministic regeneration
        shell: bash
        run: |
          set -euo pipefail
          bin="$RUNNER_TEMP/expr-rule-gen"
          "$bin" --self-test
          "$bin" --max-cost 3 --max-proofs 200 --max-rules 100 --output "$RUNNER_TEMP/rules.txt"
          "$bin" --max-cost 3 --max-proofs 200 --max-rules 100 --check "$RUNNER_TEMP/rules.txt"
          grep -F '(x + 0) => x' "$RUNNER_TEMP/rules.txt"
          grep -F '(x - x) => 0' "$RUNNER_TEMP/rules.txt"
          grep -F '(x * 1) => x' "$RUNNER_TEMP/rules.txt"
          if "$bin" --max-cost 3 --max-proofs 1 --output "$RUNNER_TEMP/too-small.txt"; then
            echo "unexpected success despite intentionally insufficient proof budget" >&2
            exit 1
          fi
          if test -e "$RUNNER_TEMP/too-small.txt"; then
            echo "incomplete generation must not publish a rules file" >&2
            exit 1
          fi
      - name: Discover conditional rules from symbolic constants
        shell: bash
        run: |
          set -euo pipefail
          bin="$RUNNER_TEMP/expr-rule-gen"
          "$bin" --conditional-only --max-rules 250 --output "$RUNNER_TEMP/guarded-rules.txt"
          grep -Fx '((x | A) & B) => (x & B) if (A & B) == 0' "$RUNNER_TEMP/guarded-rules.txt"
          grep -Fx '((x + A) - B) => x if A == B' "$RUNNER_TEMP/guarded-rules.txt"
          if grep -Fx '((x + A) - B) => x' "$RUNNER_TEMP/guarded-rules.txt"; then
            echo "invalid unguarded arithmetic rewrite" >&2
            exit 1
          fi
          if grep -Fx '((x | A) & B) => (x & B)' "$RUNNER_TEMP/guarded-rules.txt"; then
            echo "invalid unguarded mask rewrite" >&2
            exit 1
          fi
          if "$bin" --conditional-only --max-proofs 1 --max-rules 250 --output "$RUNNER_TEMP/incomplete-guarded.txt"; then
            echo "unexpected success despite conditional proof budget" >&2
            exit 1
          fi
          test ! -e "$RUNNER_TEMP/incomplete-guarded.txt"
      - name: Validate structured rule database and generated compiled matcher
        shell: bash
        run: |
          set -euo pipefail
          bin="$RUNNER_TEMP/expr-rule-gen"
          "$bin" --conditional-only --format json --output "$RUNNER_TEMP/rules.json"
          "$bin" --conditional-only --format json --check "$RUNNER_TEMP/rules.json"
          python3 - "$RUNNER_TEMP/rules.json" <<'PY'
          import json, sys
          with open(sys.argv[1], encoding="utf-8") as f:
              data = json.load(f)
          assert data["schema"] == "compiler.expr-rules.v1"
          assert data["semantics"] == "wrapping-i32"
          assert data["proof"]["logic"] == "QF_BV"
          assert data["proof"]["width"] == 32
          assert len(data["rules"]) >= 50
          assert all(r["cost"] == "strict-tree-decrease" for r in data["rules"])
          assert any(r["lhs"]["op"] == "Sub" and r["lhs"]["lhs"]["op"] == "Add"
                     and r["rhs"].get("symbol") == "x" and r["guard"] == "A == B"
                     for r in data["rules"])
          print(f"Validated {len(data['rules'])} structured proven rules")
          PY
          "$bin" --conditional-only --format rust --output "$RUNNER_TEMP/generated_matcher.rs"
          "$bin" --conditional-only --format rust --check "$RUNNER_TEMP/generated_matcher.rs"
          rustc --edition=2021 -O --test "$RUNNER_TEMP/generated_matcher.rs" -o "$RUNNER_TEMP/generated_matcher_tests"
          "$RUNNER_TEMP/generated_matcher_tests"
          # A bounded search may produce only one rule; its generated tests
          # must still compile and test without assuming a large ruleset.
          "$bin" --conditional-only --max-rules 1 --format rust --output "$RUNNER_TEMP/tiny_matcher.rs"
          rustc --edition=2021 -O --test "$RUNNER_TEMP/tiny_matcher.rs" -o "$RUNNER_TEMP/tiny_matcher_tests"
          "$RUNNER_TEMP/tiny_matcher_tests"
