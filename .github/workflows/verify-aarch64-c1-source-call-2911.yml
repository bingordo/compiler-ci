name: C1 AArch64 checked-C 9-16 argument call GCC differential
on:
  pull_request:
    paths:
      - '.github/workflows/verify-aarch64-c1-source-call-2911.yml'
permissions:
  contents: read
jobs:
  deterministic-source-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 60ef735649178b4444084393f7fe24d49610a628
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Verify exact compiler source and Python generator syntax
        run: |
          set -euo pipefail
          test "$(git -C compiler rev-parse HEAD)" = "60ef735649178b4444084393f7fe24d49610a628"
          python3 -m py_compile compiler/tools/aarch64_c1_source_oracle.py compiler/tools/aarch64_c1_call_oracle.py compiler/tools/tests/test_aarch64_c1_source_oracle.py
      - name: Deterministic seeded source and negative report mutation suite
        run: |
          set -euo pipefail
          python3 -m unittest discover -s compiler/tools/tests \
            -p test_aarch64_c1_source_oracle.py -v
  actual-native-aarch64:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    env:
      CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 60ef735649178b4444084393f7fe24d49610a628
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Record exact source and configure public frontend Git dependency
        run: |
          set -euo pipefail
          test "$(uname -m)" = aarch64
          test "$(git -C compiler rev-parse HEAD)" = "60ef735649178b4444084393f7fe24d49610a628"
          git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
          git config --global --add url."https://github.com/".insteadOf "git@github.com:"
          gcc --version | head -n 1
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: c1-aarch64-source-calls-v1
      - name: Compile production checked source driver and verify report CLI
        working-directory: compiler
        run: |
          set -euo pipefail
          cargo build --release -p compiler --bin compiler
          cargo test -p compiler --test aarch64_selector_report_cli -- --nocapture
      - name: "Baseline original W32 W64 and observable memory native C11 GCC parity"
        run: |
          set -euo pipefail
          mkdir -p results
          for family in w32 w64 memory; do
            python3 compiler/tools/aarch64_c1_source_oracle.py \
              --compiler compiler/target/release/compiler \
              --output "results/$family-baseline" --family "$family" \
              --seed 23 --functions 8 --samples 128 --execute-native
          done
      - name: "Actual 9-16 incoming and 16 outgoing W32 AAPCS64 ABI native GCC execution"
        run: |
          set -euo pipefail
          python3 compiler/tools/aarch64_c1_source_oracle.py \
            --compiler compiler/target/release/compiler \
            --output results/calls-31 --seed 31 --family calls \
            --functions 16 --samples 256 --execute-native
      - name: "Actual PIC 9-16 argument and cross-call register pressure native GCC oracle"
        run: |
          set -euo pipefail
          python3 compiler/tools/aarch64_c1_source_oracle.py \
            --compiler compiler/target/release/compiler \
            --output results/calls-pic-131 --seed 131 --family calls \
            --functions 16 --samples 256 --pic --execute-native
      - name: "Reconcile live scalar call IDs, ELF physical bytes and native return/witness checks"
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          rows=[json.loads(p.read_text()) for p in sorted(Path("results").glob("*/summary.json"))]
          assert len(rows)==5
          counts={family:sum(row["functions"] for row in rows if row["family"]==family)
                  for family in ("w32","w64","memory","calls")}
          assert counts=={"w32":8,"w64":8,"memory":8,"calls":32},counts
          calls=[row for row in rows if row["family"]=="calls"]
          assert len(calls)==2 and sorted(row["pic"] for row in calls)==[False,True]
          assert all(row["native_executed"] and row["object_parity"] for row in rows)
          assert all(row["coverage"]["handwritten"]==0 for row in rows)
          assert all(row["coverage"]["generated"]>0 and row["coverage"]["text_bytes"]>0
                     for row in rows)
          assert all("A64_CALL_DIRECT_32" in row["coverage"]["rule_ids"] for row in calls)
          assert len({row["source_sha256"] for row in rows})==len(rows)
          summary={
              "family_functions":counts,
              "native_evaluations":sum(row["functions"]*row["samples_per_function"]
                                       for row in rows),
              "generated_scalar_decisions":sum(row["coverage"]["generated"] for row in rows),
              "handwritten_scalar_fallbacks":sum(row["coverage"]["handwritten"] for row in rows),
              "generated_cfg_terminators":sum(row["coverage"]["terminators"] for row in rows),
              "physical_function_text_bytes":sum(row["coverage"]["text_bytes"] for row in rows),
              "native_GCC_returns_and_callback_witness_equal":True,
              "report_on_off_ELF_identical":True,
          }
          print("A64_C1_9_16_ARG_NATIVE_GCC",json.dumps(summary,sort_keys=True),flush=True)
          PY
          echo 'AArch64 checked source 9..16 ingress and dual external 16-call GCC C11 + ELF/relocation parity PASS, pinned 60ef735649178b4444084393f7fe24d49610a628' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aarch64-c1-seeded-source-oracle-reproducers
          path: results/
          if-no-files-found: ignore
          retention-days: 21
