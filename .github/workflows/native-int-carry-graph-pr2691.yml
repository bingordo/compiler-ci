name: Validate declarative shift-carry graph PR2691
on:
  pull_request:
    paths:
      - '.github/workflows/native-int-carry-graph-pr2691.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  carry-graph:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      CARGO_INCREMENTAL: '0'
      SOURCE_SHA: f560f6dc4cbd144056291afb532f3eea5dca3b49
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: f560f6dc4cbd144056291afb532f3eea5dca3b49
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Verify exact source pin and isolate optimizer
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C compiler rev-parse HEAD)" = "$SOURCE_SHA"
          cat > compiler/Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir", "crates/opt", "crates/backend", "crates/backend-x86"]
          EOF
          rm -f compiler/Cargo.lock
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: native-int-seeded-generator
      - name: Run all S23.27 five-width generated differential and negative tests
        working-directory: compiler
        shell: bash
        run: |
          set -euo pipefail
          cargo test -p compiler-opt --test generated_native_carry_reconstruction_s2327 -- --nocapture
      - name: Strict focused Clippy, exempt unrelated upstream warning categories
        working-directory: compiler
        run: cargo clippy -p compiler-opt --test generated_native_carry_reconstruction_s2327 -- -D warnings -A dead-code -A clippy::empty-line-after-doc-comments -A unused-imports -A clippy::too-many-arguments
