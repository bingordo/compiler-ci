name: TEMP S3.L L5b probe original pinned Intel/XED reg-reg iforms
on:
  pull_request:
    paths:
      - '.github/workflows/x86-s3l-l5b-regreg-probe.yml'
permissions:
  contents: read
  actions: read
jobs:
  probe-reg-reg:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Download original pinned Intel/XED S2 full-iform evidence
        uses: actions/download-artifact@v4
        with:
          name: x7-s2-pinned-intel-xed-variant-join
          run-id: 43635408689
          repository: bingordo/compiler-ci
          github-token: ${{ github.token }}
          path: /tmp/s2
      - name: Inspect only TEST GP-reg-reg exact original XED identity and source effects
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          report=json.load(open('/tmp/s2/join-1.json'))
          print('S2',report.get('schema_version'),report.get('kind'),
                'forms',len(report.get('forms',[])))
          names={'TEST_GPRv_GPRv','TEST_GPR8_GPR8',
                 'CMP_GPRv_GPRv_39','CMP_GPRv_GPRv_3B',
                 'AND_GPRv_GPRv_23','XOR_GPRv_GPRv_33'}
          for row in report.get('forms',[]):
              if row.get('xed_iform') not in names:continue
              print('S3_L5B_ORIGINAL_IFORM',row.get('xed_iform'),
                    'sha',row.get('intel_iform_sha256'),
                    'join',row.get('join_status'),
                    'count',len(row.get('xed_variants',[])))
              for v in row.get('xed_variants',[]):
                  print('S3_L5B_XED',json.dumps(v,sort_keys=True)[:10000])
          PY
