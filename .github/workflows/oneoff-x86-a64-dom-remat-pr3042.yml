name: One-off x86 AArch64 machine dominance remat PR3042
on:
  push:
    branches: [verify/x86-a64-machine-dominance-pr3042]
    paths: [.github/workflows/oneoff-x86-a64-dom-remat-pr3042.yml]
permissions:
  contents: read
  statuses: write
jobs:
  dominance-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: feat/x86-a64-dominance-checked-remat-20261124
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: cc50b745f9e6b5316b5a5982e1f6709b98f51798
          path: baseline
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Report exact candidate compiler SHA
        run: |
          set -euo pipefail
          sha=$(git -C compiler rev-parse HEAD)
          echo "Compiler PR #3042 exact source SHA: $sha" | tee -a "$GITHUB_STEP_SUMMARY"
          git -C compiler show -s --format='%s' HEAD
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Isolate the same backend workspace in candidate and baseline
        run: |
          for root in compiler baseline; do
            cat > "$root/Cargo.toml" <<'EOF'
          [workspace]
          resolver = "2"
          members = [
            "crates/ir",
            "crates/backend",
            "crates/opt",
            "crates/backend-x86",
            "crates/backend-aarch64",
          ]
          EOF
            rm -f "$root/Cargo.lock"
          done
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: x86-a64-dom-remat-pr3042
      - name: Run focused shared, AArch64 and x86 remat dominance tests
        working-directory: compiler
        run: |
          set -euo pipefail
          cargo test -p compiler-backend --lib machine_dominance::tests -- --nocapture
          cargo test -p compiler-backend-aarch64 --lib dominance_remat_tests -- --nocapture
          cargo test -p compiler-backend-x86 --lib dominance_remat_tests -- --nocapture
      - name: Prove three unrelated x86 ABI test failures predate the PR
        working-directory: baseline
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 'cc50b745f9e6b5316b5a5982e1f6709b98f51798'
          for case in \
            call::tests::invalid_call_requests_do_not_partially_modify_stream \
            scalar_abi::tests::reject_unpromoted_variadic_float_and_invalid_counts \
            typeid_fp_staged_native_tests::typeid_fp_staged_stack_argument_abi_oracle; do
            echo "Checking pre-existing baseline failure: $case"
            if cargo test -p compiler-backend-x86 --lib "$case" -- --exact > /tmp/baseline-x86-test.log 2>&1; then
              cat /tmp/baseline-x86-test.log
              echo "Expected baseline failure no longer reproducible: $case"; exit 1
            fi
            grep -F "test $case ... FAILED" /tmp/baseline-x86-test.log || {
              cat /tmp/baseline-x86-test.log
              echo "Baseline failed for some reason other than its expected test assertion"; exit 1
            }
          done
      - name: Verify preexisting AArch64 17-argument TypeId ABI test failure
        working-directory: baseline
        run: |
          set -euo pipefail
          case=selector_rejects_unsupported_direct_call_signatures
          if cargo test -p compiler-backend-aarch64 --test direct_calls "$case" -- --exact > /tmp/a64-baseline-test.log 2>&1; then
            cat /tmp/a64-baseline-test.log
            echo "Historical AArch64 ABI failure no longer reproducible"; exit 1
          fi
          grep -F "test $case ... FAILED" /tmp/a64-baseline-test.log || {
            cat /tmp/a64-baseline-test.log
            echo "Baseline did not reach the expected AArch64 ABI test assertion"; exit 1
          }
      - name: Run complete affected backend libraries excluding baseline-proven ABI failures
        working-directory: compiler
        run: |
          set -euo pipefail
          cargo test -p compiler-backend --lib
          cargo test -p compiler-backend-aarch64 --lib
          cargo test -p compiler-backend-x86 --lib -- --skip call::tests::invalid_call_requests_do_not_partially_modify_stream --skip scalar_abi::tests::reject_unpromoted_variadic_float_and_invalid_counts --skip typeid_fp_staged_native_tests::typeid_fp_staged_stack_argument_abi_oracle
      - name: Check strict target-local Clippy and common backend
        working-directory: compiler
        run: |
          set -euo pipefail
          cargo clippy -p compiler-backend --lib -- --no-deps -D warnings
          cargo clippy -p compiler-backend-x86 --lib -- --no-deps -D warnings -A dead_code
          cargo clippy -p compiler-backend-aarch64 --lib -- --no-deps -D warnings -A dead_code
      - name: Run all AArch64 and x86 backend targets including integration oracles
        working-directory: compiler
        run: |
          set -euo pipefail
          cargo test -p compiler-backend-aarch64 --all-targets -- --skip selector_rejects_unsupported_direct_call_signatures
          cargo test -p compiler-backend-x86 --all-targets -- --skip call::tests::invalid_call_requests_do_not_partially_modify_stream --skip scalar_abi::tests::reject_unpromoted_variadic_float_and_invalid_counts --skip typeid_fp_staged_native_tests::typeid_fp_staged_stack_argument_abi_oracle
      - name: Publish discoverable compiler-ci branch commit status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ job.status }}
        run: |
          set -euo pipefail
          state=failure
          if [ "$RESULT" = success ]; then state=success; fi
          if [ "$RESULT" = cancelled ]; then state=error; fi
          gh api -X POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state="$state" \
            -f context="compiler-ci/x86-a64-dominance-pr3042" \
            -f description="AArch64/x86 shared remat dominance regression: $RESULT" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
