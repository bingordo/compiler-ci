name: Diagnose EDG C-Reduce package availability
on:
  pull_request:
    paths:
      - '.github/workflows/edg-creduce-package-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package-probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Inspect package manager in pinned EDG container
        run: |
          set -euo pipefail
          docker run --rm --entrypoint /bin/bash             ghcr.io/edgcpp/ci-runner@sha256:14b3948c2ce12cfa5472e5a6c468393d15426f3a67685cc35d830ea5db2acdf8             -euo pipefail -c '
              echo CONTAINER_OS
              cat /etc/os-release
              echo APT_AVAILABLE
              command -v apt-get || true
              command -v dpkg || true
              echo PACKAGE_POLICY
              apt-cache policy creduce gdb || true
              echo APT_SOURCES
              grep -rhE "^(deb |Suites:|Components:)" /etc/apt/sources.list /etc/apt/sources.list.d 2>/dev/null | head -n 30 || true
              echo APT_UPDATE
              apt-get update -qq 2>&1 | tail -n 15 || true
              echo PACKAGE_POLICY_AFTER_UPDATE
              apt-cache policy creduce gdb || true
              echo DNF_PACKAGE_SEARCH
              command -v dnf || true
              command -v dnf5 || true
              timeout 75s dnf list --available creduce gdb 2>&1 | tail -n 30 || true
              timeout 75s dnf search creduce 2>&1 | tail -n 25 || true
            '
