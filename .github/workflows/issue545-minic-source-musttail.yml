name: Mini-C source musttail front-end acceptance (#545)
on:
  pull_request:
    paths: ['.github/workflows/issue545-minic-source-musttail.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  minic-musttail:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/mini-c
          ref: 01c57e8c3f41028ebdc1267734030072a938b722
          path: mini-c
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Verify tested mini-c SHA
        run: test "$(git -C mini-c rev-parse HEAD)" = '01c57e8c3f41028ebdc1267734030072a938b722'
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: mini-c
          key: issue545-minic-musttail
      - name: Source musttail parser acceptance
        working-directory: mini-c
        run: cargo test -p mini-c-syntax --test musttail_return -- --nocapture
      - name: Checked semantic musttail contract
        working-directory: mini-c
        run: cargo test -p mini-c-sema --test musttail_return -- --nocapture
      - name: Syntax sema and Cranelift compile
        working-directory: mini-c
        run: cargo check -p mini-c-syntax -p mini-c-sema -p mini-c-cranelift --all-targets
      - name: Full source parser and checker regression
        working-directory: mini-c
        run: cargo test -p mini-c-syntax -p mini-c-sema
      - name: Native reference backend fail-closed and lints
        working-directory: mini-c
        run: |
          cargo test -p mini-c-cranelift --lib
          cargo clippy -p mini-c-syntax -p mini-c-sema -p mini-c-cranelift --lib -- -D clippy::correctness
