name: X7 cost advisory CPU-specific sequence evidence
on:
  pull_request:
    paths: ['.github/workflows/verify-x7-cost-sequence-evidence-20261118.yml']
permissions:
  contents: read
jobs:
  cost-sequence-evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 39e0bf3d35b20b51d4a4041b929937833988c6d4
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Source-pinned real SKL/ZEN4 exact-cost sequence tests
        working-directory: compiler
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "39e0bf3d35b20b51d4a4041b929937833988c6d4"
          python3 -m py_compile tools/x7_cost_sequence_evidence.py tools/test_x7_cost_sequence_evidence.py
          PYTHONPATH=tools python3 -m unittest -v test_x7_cost_sequence_evidence test_import_uops_info test_x7_cost_variant_inventory
          python3 tools/regen_x86_physical_costs.py --check
          python3 tools/x7_cost_sequence_evidence.py --cpu SKL CMOVA_R_R32 MOV_R_R_89_32
          python3 tools/x7_cost_sequence_evidence.py --cpu ZEN4 CMOVA_R_R32 MOV_R_R_89_32
          echo X7_COST_SEQUENCE_EVIDENCE_GREEN
