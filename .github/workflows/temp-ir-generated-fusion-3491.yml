name: Temporary direct TypeId generated fusion admission parity
on:
  pull_request:
    paths: ['.github/workflows/temp-ir-generated-fusion-3491.yml']
permissions: {contents: read}
jobs:
  native-fusion:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      SOURCE_SHA: 8364a7462a79abee5a92db1f9cc429dea5041830
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: ${{ env.SOURCE_SHA }}
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Verify exact source and narrow workspace
        working-directory: compiler
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          cat > Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir", "crates/opt", "crates/backend", "crates/backend-x86", "crates/backend-aarch64"]
          EOF
          rm -f Cargo.lock
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: typeid-native-500-generated-fusion-parity
      - name: Direct TypeId proof-table 500-case and SSA failure regressions
        working-directory: compiler
        run: |
          set -euo pipefail
          cargo test -p compiler-opt --features 'experimental-generated-rules experimental-typeid-guarded-admission' --lib generated_guarded_admission::tests -- --nocapture
      - name: Original independently historical generated-rule oracles
        working-directory: compiler
        run: |
          set -euo pipefail
          cargo test -p compiler-opt --features 'experimental-generated-rules experimental-typeid-guarded-admission' --lib experimental_generated_rules::tests
      - name: Native algebra and executable source-oracle regressions
        working-directory: compiler
        run: |
          set -euo pipefail
          cargo test -p compiler-opt --features 'experimental-generated-rules experimental-typeid-guarded-admission' --test typed_algebra --test generated_native_oracle
      - name: Full opt-in target check and strict default production Clippy
        working-directory: compiler
        run: |
          set -euo pipefail
          cargo check -p compiler-opt --features 'experimental-generated-rules experimental-typeid-guarded-admission' --all-targets
          cargo clippy -p compiler-opt --lib -- -D warnings
          python3 tools/check_mixed_function_export_boundary.py
