name: S23.51b single-root-probe generated matcher
on:
  pull_request:
    paths:
      - '.github/workflows/s23-51b-root-probe.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  default-generated-mode:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
    steps:
      - name: Checkout exact compiler candidate (Actions only on compiler-ci)
        uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: c3b04b7b49909fbf69e9742a67c2ffc735c3cdcb
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Check source pin and configure public Cargo Git dependencies
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C compiler rev-parse HEAD)" = c3b04b7b49909fbf69e9742a67c2ffc735c3cdcb
          git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
          mkdir -p results
          rustc --version
          python3 --version
      - name: Audit TypeId source-root shadowing and nested SSA overlaps
        working-directory: compiler
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tools/typeid-rule-gen \
            -p 'test_rule_interactions.py' -v
          python3 tools/typeid-rule-gen/rule_interactions.py \
            tools/typeid-rule-gen/examples.rules --fail-on-shadow \
            --output ../results/typeid-rule-interactions.json
          python3 - <<'PY'
          import json
          x = json.load(open("../results/typeid-rule-interactions.json"))
          assert x["rule_count"] == 88
          assert x["fully_shadowed"] == []
          assert ["xor_double_complement_cancel", "xor_both_not"] in x["later_inside_earlier"]
          print("S23.51b static overlap audit and unreachable rule gate: PASS")
          PY
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: s23-51b-fanout-matrix
      - name: Test native default-on and explicit opt-out
        working-directory: compiler
        shell: bash
        run: |
          set -euo pipefail
          cargo test -p compiler-opt --test native_s2350aa_generated_nearmisses -- --nocapture
          cargo test -p compiler-opt --test native_s2350z_generated_matrix -- --nocapture
          cargo test -p compiler-opt --test native_s2350ad_generated_semantics -- --nocapture
          cargo test -p compiler-opt --test native_s2350ag_generated_utility -- --nocapture
          cargo test -p compiler-opt --test native_s2350y_boolean_dag -- --nocapture
          cargo test -p compiler-opt --test native_s2350x_wrapping_cancels -- --nocapture
          cargo test -p compiler-opt --test native_s2350v_complement_xor_nested_sub -- --nocapture
          cargo test -p compiler-opt --test native_s2350u_demorgan_xor -- --nocapture
          cargo test -p compiler-opt --test native_s2350t_complement_xor -- --nocapture
          cargo test -p compiler-opt --test native_s2350s_boolean_xor_folds -- --nocapture
          cargo test -p compiler-opt --test native_s2350r_nested_cancellations -- --nocapture
          cargo test -p compiler-opt --test native_s2350q_xor_mul_factoring -- --nocapture
          cargo test -p compiler-opt --test native_s2350p_cancellation_subsumption -- --nocapture
          cargo test -p compiler-opt --test native_s2350o_integer_dag_cancel -- --nocapture
          cargo test -p compiler-opt --test native_s2350n_complement_partition -- --nocapture
          cargo test -p compiler-opt --test native_s2350m_complement_xor_batch -- --nocapture
          cargo test -p compiler-opt --test native_default_generated_flags -- --nocapture
          cargo test -p compiler-opt --test native_s2350_two_op_factoring -- --nocapture
          # Pinned compiler x86 dependency has an independent unused observer
          # parameter in native_typeid.rs. Keep all other warnings denied
          # while suppressing only this unrelated rustc lint in this CI job.
          # The current pinned x86 backend has an unrelated doc-comment blank-line
          # Clippy warning. Suppress only this lint, plus its known unused observer;
          # keep all other Clippy warnings denied while the backend stream proceeds.
          cargo clippy -p compiler-opt --test native_s2350aa_generated_nearmisses -- -D warnings -A unused-variables -A clippy::empty_line_after_doc_comments
          cargo clippy -p compiler-opt --test native_s2350z_generated_matrix -- -D warnings -A unused-variables -A clippy::empty_line_after_doc_comments
          cargo clippy -p compiler-opt --test native_s2350ag_generated_utility -- -D warnings -A unused-variables -A clippy::empty_line_after_doc_comments
          cargo clippy -p compiler-opt --test native_s2350y_boolean_dag -- -D warnings -A unused-variables -A clippy::empty_line_after_doc_comments
          cargo clippy -p compiler-opt --test native_default_generated_flags -- -D warnings -A unused-variables -A clippy::empty_line_after_doc_comments
          cargo check -p compiler-opt --no-default-features
      - name: Validate 88 rule families and generated SSA matcher code
        shell: bash
        working-directory: compiler
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tools/typeid-rule-gen -p 'test_*.py' -v
          python3 tools/typeid-rule-gen/rules.py tools/typeid-rule-gen/examples.rules \
            --emit-ssa-rust > "$RUNNER_TEMP/s2350y-ssa.rs"
          rustc --edition=2021 --crate-type=lib "$RUNNER_TEMP/s2350y-ssa.rs" \
            -o "$RUNNER_TEMP/libs2350v-ssa.rlib"
      - name: Install signed Ubuntu Z3 solver package for QF_BV proofs
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends z3
          command -v z3
          z3 -version
          dpkg-query -W z3

      - name: Prove 2135 exact-width and orientation obligations with 5 SAT negative controls
        working-directory: compiler
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/typeid-rule-gen/prove.py tools/typeid-rule-gen/examples.rules \
            --timeout-ms 2500 --process-timeout 5 \
            --manifest "$RUNNER_TEMP/s2350y-proofs.json"
          python3 - "$RUNNER_TEMP/s2350y-proofs.json" <<'PY'
          import json,sys
          x=json.load(open(sys.argv[1]))
          assert x['schema']=='compiler.typeid-proofs.v1'
          assert x['logic']=='QF_BV'
          assert x['family_count']==88
          assert x['proof_count']==2135
          assert x['sat_negative_controls']==5
          assert len({(p['id'],p['width'],p['orientation']) for p in x['proofs']})==2135
          assert all(p['result']=='unsat' for p in x['proofs'])
          print("S2351B_PROOFS families=88 unsat=2135 sat_controls=5",flush=True)
          PY

      - name: Build real production driver, check CLI help
        working-directory: compiler
        shell: bash
        run: |
          set -euo pipefail
          cargo build --release -p compiler --bin compiler
          target/release/compiler --help | tee "$GITHUB_WORKSPACE/results/help.txt"
          grep -- '--no-generated-rewrites' "$GITHUB_WORKSPACE/results/help.txt"
          grep -- '--generated-rewrites' "$GITHUB_WORKSPACE/results/help.txt"
      - name: Compare real x86 objects and execute GCC oracle in three modes
        shell: bash
        run: |
          set -euo pipefail
          cat > results/factor.c <<'EOF'
          int factor(int x, int y, int z) {
            return (x & y) | (x & z);
          }
          int maskfold(int x, int y) {
            return (x ^ y) | (x & y);
          }
          int addnot(int x) {
            return x + ~x;
          }
          int xorpair(int x, int y, int z) {
            return (x ^ y) ^ (x ^ z);
          }
          int subaddpair(int x, int y, int z) {
            return (x + y) - (x + z);
          }
          int addsubchain(int x, int y, int z) {
            return (x - y) + (y - z);
          }
          int subsubpair(int x, int y, int z) {
            return (x - y) - (x - z);
          }
          int subaddsub(int x, int y, int z) {
            return (x + y) - (x - z);
          }
          int tailadd(int x, int y, int z) {
            return (x + y) + (z - y);
          }
          int tailsub(int x, int y, int z) {
            return (x - y) - (z - y);
          }
          int andsubsume(int x, int y, int z) {
            return (x & y) & (x | z);
          }
          int orsubsume(int x, int y, int z) {
            return (x | y) | (x & z);
          }
          int factorxor(int x, int y, int z) {
            return (x & y) ^ (x & z);
          }
          int factoraddmul(int x, int y, int z) {
            return (x * y) + (x * z);
          }
          int factorsubmul(int x, int y, int z) {
            return (x * y) - (x * z);
          }
          int nestedsubadd(int x, int y, int z) {
            return x - ((x + y) - z);
          }
          int nestedaddsub(int x, int y, int z) {
            return x + (y - (x + z));
          }
          int orxoroperand(int x, int y) {
            return x | (x ^ y);
          }
          int andnotxoroperand(int x, int y) {
            return x & ~(x ^ y);
          }
          int xorandnotoperand(int x, int y) {
            return x ^ (x & ~y);
          }
          int xor_double_not(int x, int y) {
            return x ^ (~x ^ ~y);
          }
          int and_xor_not(int x, int y) {
            return x & (x ^ ~y);
          }
          int or_double_not(int x, int y) {
            return x | (~x ^ ~y);
          }
          int dual_demorgan_zero(int x, int y) {
            return (x | y) & (~x & ~y);
          }
          int dual_demorgan_ones(int x, int y) {
            return (x & y) | (~x | ~y);
          }
          int xor_both_complements(int x, int y) {
            return (~x) ^ (~y);
          }
          int xor_or_and_complement_ones(int x, int y) {
            return (x | y) ^ (~x & ~y);
          }
          int xor_and_or_complement_ones(int x, int y) {
            return (x & y) ^ (~x | ~y);
          }
          int nested_sub_add_cancel(int x, int y, int z) {
            return x - ((x - y) + z);
          }
          int add_nested_sub_cancel(int x, int y, int z) {
            return x + (y - (x - z));
          }
          int sub_nested_sub_cancel(int x, int y, int z) {
            return x - ((x - y) - z);
          }
          int mask_symmetric_difference(int x, int y) {
            return (x | y) & ~(x & y);
          }
          int mask_xor_without_and(int x, int y) {
            return (x ^ y) & ~(x & y);
          }
          int mask_and_with_xnor(int x, int y) {
            return (x & y) | ~(x ^ y);
          }
          EOF
          cat > results/oracle.c <<'EOF'
          extern int factor(int, int, int);
          extern int maskfold(int, int);
          extern int addnot(int);
          extern int xorpair(int,int,int);
          extern int subaddpair(int,int,int);
          extern int addsubchain(int,int,int);
          extern int subsubpair(int,int,int);
          extern int subaddsub(int,int,int);
          extern int tailadd(int,int,int);
          extern int tailsub(int,int,int);
          extern int andsubsume(int,int,int);
          extern int orsubsume(int,int,int);
          extern int factorxor(int,int,int);
          extern int factoraddmul(int,int,int);
          extern int factorsubmul(int,int,int);
          extern int nestedsubadd(int,int,int);
          extern int nestedaddsub(int,int,int);
          extern int orxoroperand(int,int);
          extern int andnotxoroperand(int,int);
          extern int xorandnotoperand(int,int);
          extern int xor_double_not(int,int);
          extern int and_xor_not(int,int);
          extern int or_double_not(int,int);
          extern int dual_demorgan_zero(int,int);
          extern int dual_demorgan_ones(int,int);
          extern int xor_both_complements(int,int);
          extern int xor_or_and_complement_ones(int,int);
          extern int xor_and_or_complement_ones(int,int);
          extern int nested_sub_add_cancel(int,int,int);
          extern int add_nested_sub_cancel(int,int,int);
          extern int sub_nested_sub_cancel(int,int,int);
          extern int mask_symmetric_difference(int,int);
          extern int mask_xor_without_and(int,int);
          extern int mask_and_with_xnor(int,int);
          int main(void) {
            for (int a = -11; a <= 11; a++)
              for (int b = -13; b <= 13; b++)
                for (int c = -9; c <= 9; c++)
                  if (factor(a,b,c) != ((a & b) | (a & c)))
                    return 1;
            for (int a = -31; a <= 31; a++)
              for (int b = -31; b <= 31; b++)
                if (maskfold(a,b) != (a | b)) return 2;
            for (int a = -123; a <= 123; a++)
              if (addnot(a) != -1) return 3;
            for (int a = -11; a <= 11; a++)
              for (int b = -13; b <= 13; b++)
                for (int c = -9; c <= 9; c++) {
                  if (xorpair(a,b,c) != (b ^ c)) return 4;
                  if (subaddpair(a,b,c) != (b-c)) return 5;
                  if (addsubchain(a,b,c) != (a-c)) return 6;
                  if (subsubpair(a,b,c) != (c-b)) return 7;
                  if (subaddsub(a,b,c) != (b+c)) return 8;
                  if (tailadd(a,b,c) != (a+c)) return 9;
                  if (tailsub(a,b,c) != (a-c)) return 10;
                  if (andsubsume(a,b,c) != (a&b)) return 11;
                  if (orsubsume(a,b,c) != (a|b)) return 12;
                  if (factorxor(a,b,c) != (a & (b ^ c))) return 13;
                  if (factoraddmul(a,b,c) != (a * (b + c))) return 14;
                  if (factorsubmul(a,b,c) != (a * (b - c))) return 15;
                  if (nestedsubadd(a,b,c) != (c-b)) return 18;
                  if (nestedaddsub(a,b,c) != (b-c)) return 19;
                  if (orxoroperand(a,b) != (a | b)) return 20;
                  if (andnotxoroperand(a,b) != (a & b)) return 21;
                  if (xorandnotoperand(a,b) != (a & b)) return 22;
                  if (xor_double_not(a,b) != b) return 23;
                  if (and_xor_not(a,b) != (a & b)) return 24;
                  if (or_double_not(a,b) != (a | b)) return 25;
                  if (dual_demorgan_zero(a,b) != 0) return 26;
                  if (dual_demorgan_ones(a,b) != -1) return 27;
                  if (xor_both_complements(a,b) != (a ^ b)) return 28;
                  if (xor_or_and_complement_ones(a,b) != -1) return 29;
                  if (xor_and_or_complement_ones(a,b) != -1) return 30;
                  if (nested_sub_add_cancel(a,b,c) != (b-c)) return 31;
                  if (add_nested_sub_cancel(a,b,c) != (b+c)) return 33;
                  if (sub_nested_sub_cancel(a,b,c) != (b+c)) return 34;
                  if (mask_symmetric_difference(a,b) != (a ^ b)) return 35;
                  if (mask_xor_without_and(a,b) != (a ^ b)) return 36;
                  if (mask_and_with_xnor(a,b) != ~(a ^ b)) return 37;
                }
            return 0;
          }
          EOF
          for mode in default enabled disabled; do
            case "$mode" in
              default) flag="" ;;
              enabled) flag="--generated-rewrites" ;;
              disabled) flag="--no-generated-rewrites" ;;
            esac
            compiler/target/release/compiler results/factor.c \
              --language mini-c --target x86_64 --emit obj \
              $flag -o "results/$mode.o"
            gcc -O0 results/oracle.c "results/$mode.o" -o "results/$mode.exe"
            "results/$mode.exe"
          done
          cmp results/default.o results/enabled.o
          if compiler/target/release/compiler results/factor.c --language mini-c \
             --generated-rewrites --no-generated-rewrites --emit obj \
             -o results/conflict.o >results/conflict.stdout 2>results/conflict.stderr; then
            echo "conflicting rewrite flags unexpectedly accepted"
            exit 1
          fi
          grep 'choose at most one generated-rewrites flag' results/conflict.stderr
          echo "S2351B_MODES default=passed on=passed off=passed conflict=rejected"
      - name: Verify dump and AArch64 object paths honor both rewrite modes
        shell: bash
        run: |
          set -euo pipefail
          for mode in default disabled; do
            flag=""
            if test "$mode" = disabled; then flag="--no-generated-rewrites"; fi
            compiler/target/release/compiler results/factor.c \
              --language mini-c --target x86_64 --emit obj $flag \
              --dump-ir "results/$mode-stages" -o "results/dump-$mode.o"
            cmp "results/$mode.o" "results/dump-$mode.o"
            compiler/target/release/compiler results/factor.c \
              --language mini-c --target aarch64 --emit obj $flag \
              -o "results/aarch-$mode.o"
          done
          file results/aarch-default.o results/aarch-disabled.o
      - name: Preserve pinned smoke and CLI artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: s23-51b-adversarial-fanout-evidence
          path: results/
          if-no-files-found: warn
          retention-days: 14

  source-abba:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
    steps:
      - name: Checkout unchanged compiler base
        uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 6338155d4e60ddafd56b5f3b0b04c11b23088914
          path: before
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Checkout matcher-only compiler candidate
        uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: c3b04b7b49909fbf69e9742a67c2ffc735c3cdcb
          path: after
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Check same rule source and exact SHAs, configure Cargo
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C before rev-parse HEAD)" = 6338155d4e60ddafd56b5f3b0b04c11b23088914
          test "$(git -C after rev-parse HEAD)" = c3b04b7b49909fbf69e9742a67c2ffc735c3cdcb
          cmp before/tools/typeid-rule-gen/examples.rules after/tools/typeid-rule-gen/examples.rules
          cmp before/crates/opt/src/generated_typeid_shadow.rs after/crates/opt/src/generated_typeid_shadow.rs
          cmp before/crates/opt/tests/native_s2351_matcher_cost.rs after/crates/opt/tests/native_s2351_matcher_cost.rs
          git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
          mkdir -p results
          rustc --version
      - name: Fetch immutable checked source snapshot artifact
        uses: actions/download-artifact@v4
        with:
          name: s23-48-exact-source-typeid-stage-attribution
          run-id: 43349934825
          repository: bingordo/compiler-ci
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: captured
      - name: Check original 44 checked source cases
        shell: bash
        run: |
          set -euo pipefail
          test -s captured/typeid_snapshots/manifest.tsv
          test "$(wc -l < captured/typeid_snapshots/manifest.tsv)" = 44
          python3 - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path("captured/s23-47-source-capture.json").read_text())
          assert (d["attempted"],d["accepted"],d["rejected"])==(46,44,2)
          print("S2351B_SOURCE_CAPTURE accepted=44 stages=88")
          PY
      - name: Precompile both 88-family release optimizer tests, outside samples
        shell: bash
        run: |
          set -euo pipefail
          for version in before after; do
            (cd "$version" && cargo test --release -p compiler-opt \
              --features experimental-typeid-generated-rewrites \
              --test native_s2351_matcher_cost --no-run)
          done
      - name: Alternate same-run source optimizer benchmark A B B A
        shell: bash
        run: |
          set -euo pipefail
          index=0
          for version in before after after before; do
            index=$((index + 1))
            echo "S2351B_ABBA_BEGIN sample=$index version=$version"
            (cd "$version" && S2351_SNAPSHOT_DIR="$GITHUB_WORKSPACE/captured/typeid_snapshots" \
              cargo test --release -p compiler-opt \
              --features experimental-typeid-generated-rewrites \
              --test native_s2351_matcher_cost -- --nocapture) \
              2>&1 | tee "results/abba-$index-$version.log"
          done
      - name: Validate identical checked-source outcomes and summarize matched/miss timing
        shell: bash
        run: |
          set -euo pipefail
          python3 - results/s2351b-abba.json <<'PY'
          import json
          import sys
          from pathlib import Path
          from statistics import median
          names=("abba-1-before","abba-2-after","abba-3-after","abba-4-before")
          runs=[]
          stable=("id","cohort","stage","functions","instructions",
                  "root_supported","root_missed","shadow_hits",
                  "handwritten_changes","generated_changes")
          timing=("handwritten_ns","shadow_handwritten_ns","generated_handwritten_ns")
          for name in names:
              rows={}
              sources={}
              data=Path("results",name+".log").read_text()
              assert "S2351_SUMMARY cohort=verified_s2347_snapshots cases=44 stages=88" in data,name
              for line in data.splitlines():
                  if line.startswith("S2351_CASE "):
                      row=dict(x.split("=",1) for x in line.split()[1:])
                      key=(row["id"],row["stage"])
                      assert key not in rows,(name,key)
                      rows[key]=row
                  elif line.startswith("S2350AG_REAL_SOURCE "):
                      row=dict(x.split("=",1) for x in line.split()[1:])
                      key=(row["id"],row["stage"])
                      assert key not in sources,(name,key)
                      sources[key]=row
              assert len(rows)==88 and len(sources)==88,(name,len(rows),len(sources))
              assert sum(int(r["shadow_hits"]) for r in rows.values())==68
              assert set(rows)==set(sources)
              runs.append((rows,sources))
          keys=set(runs[0][0])
          for rows,sources in runs[1:]:
              assert set(rows)==keys
              for key in keys:
                  assert tuple(rows[key][f] for f in stable)==tuple(runs[0][0][key][f] for f in stable),(key,"matched rule outcome changed")
                  assert sources[key]==runs[0][1][key],(key,"retained SSA result changed")
          # Interleave repeated sample order before/after/after/before.
          groups={"all":sorted(keys),
                  "matched":sorted(k for k in keys if int(runs[0][0][k]["shadow_hits"])>0),
                  "missed":sorted(k for k in keys if int(runs[0][0][k]["shadow_hits"])==0)}
          assert (len(groups["matched"]),len(groups["missed"]))==(3,85)
          output={"schema":"compiler.s2351b-source-abba.v1",
                  "base_sha":"6338155d4e60ddafd56b5f3b0b04c11b23088914",
                  "candidate_sha":"c3b04b7b49909fbf69e9742a67c2ffc735c3cdcb",
                  "source_cases":44,"stage_cases":88,
                  "root_hits":68,"same_rule_source":True,
                  "same_rewrite_and_retained_ssa_counts":True,
                  "measure":"full verified optimizer round including clone, not whole compile",
                  "groups":{}}
          for group,subset in groups.items():
              def case_ratio(key, mode):
                  # Median of two repeated runs per revision; never use a
                  # successful sample from one input with a different input.
                  old=median(int(runs[i][0][key][mode]) for i in (0,3))
                  new=median(int(runs[i][0][key][mode]) for i in (1,2))
                  return new/max(1,old)
              result={"cases":len(subset)}
              for mode in timing:
                  ratios=[case_ratio(k,mode) for k in subset]
                  result[mode+"_median_candidate_over_base"]=median(ratios)
              output["groups"][group]=result
              print("S2351B_ABBA group="+group+" cases="+str(len(subset))+
                    " generated_ratio="+format(result["generated_handwritten_ns_median_candidate_over_base"],".4f")+
                    " shadow_ratio="+format(result["shadow_handwritten_ns_median_candidate_over_base"],".4f")+
                    " handwritten_control_ratio="+format(result["handwritten_ns_median_candidate_over_base"],".4f"))
          Path(sys.argv[1]).write_text(json.dumps(output,indent=2,sort_keys=True)+"\n")
          PY
      - name: Preserve ABBA source profiles
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: s2351b-88-source-abba
          path: results/
          if-no-files-found: warn
          retention-days: 21
