          grep -Fq 'EDG status: 0' "$RUNNER_TEMP/separate-iostream.log"
          grep -E 'file scope init scheduler|file scope init root|EDG_CXX5_STARTUP_EVIDENCE|EDG_CXX5_CLEANUP_CALL_LOCAL|EDG_CXX5_CLEANUP_PARTIAL' \
            "$RUNNER_TEMP/separate-iostream.log" | head -n 40 \
            | tee -a "$GITHUB_STEP_SUMMARY" || true
          grep -Fq 'EDG_CXX5_SEPARATE_CHECKED entries=0 lifecycle_abi_proven=false' "$RUNNER_TEMP/separate-iostream.log"
          grep -Fq 'EDG_CXX5_SEPARATE_CLEANUP entries=0 direct=0 unknown=0 lifecycle_abi_proven=false' "$RUNNER_TEMP/separate-iostream.log"
          echo 'EDG_SEPARATE_INIT_ABI_ADMITTED=false' >> "$GITHUB_STEP_SUMMARY"

      - name: Probe original C++ throw/catch and normal plus exceptional destructor source
        working-directory: edgcpp
        run: |
          set -euo pipefail
          export PATH="$HOME/.cargo/bin:$PATH"
          source build/gcc-release/environment.sh
          cat >build/gcc-release/retained-eh.cpp <<'CPP'
          extern "C" int puts(const char*);
          int touched=0;
          struct Effect {
            ~Effect() noexcept { touched=touched*10+2; }
          };
          int f() {
            try { Effect x; throw 7; }
            catch (int n) { return touched*10+n; }
          }
          int main() { return f()!=27; }
          CPP
          cd build/gcc-release
          version="$(g++ -dumpfullversion -dumpversion)"
          IFS=. read -r major minor patch <<<"$version"
          gnu_number=$((10#${major}*10000+10#${minor:-0}*100+10#${patch:-0}))
          cargo run --quiet --manifest-path "$GITHUB_WORKSPACE/edgcpp-rust/Cargo.toml" \
            --example parse -- --g++ --c++17 --no_strict_gnu --gnu_version "$gnu_number" \
            retained-eh.cpp > "$RUNNER_TEMP/retained-eh.log" 2>&1 || {
              tail -n 90 "$RUNNER_TEMP/retained-eh.log"; exit 1;
            }
          grep -Fq 'EDG status: 0' "$RUNNER_TEMP/retained-eh.log"
          g++ -std=c++17 -O0 retained-eh.cpp -o "$RUNNER_TEMP/retained-eh-gcc"
          "$RUNNER_TEMP/retained-eh-gcc"
          echo 'EDG_RETAINED_EH=parsed GCC_ORACLE=exit0 TYPEID_ABI_ADMITTED=false' >> "$GITHUB_STEP_SUMMARY"
          for file in "$RUNNER_TEMP/separate-two-global.log" "$RUNNER_TEMP/separate-iostream.log" "$RUNNER_TEMP/retained-eh.log"; do
            printf '%s : ' "$(basename "$file")" >> "$GITHUB_STEP_SUMMARY"
            python3 - "$file" <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import sys
          t=open(sys.argv[1]).read()
          print("portable_eh_head_occurrences=",t.count("__curr_eh_stack_entry"),
                "try_mentions=",t.count("try_block"),
                "lowered_eh_mentions=",t.count("lowered_eh_construct"))
          PY
          done
