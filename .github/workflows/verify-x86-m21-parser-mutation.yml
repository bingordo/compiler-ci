name: x86 M1.21 physical parser mutation test PR 1251
on:
  pull_request:
    paths:
      - '.github/workflows/verify-x86-m21-parser-mutation.yml'
permissions:
  contents: read
jobs:
  physical-parser-mutation:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: feature/x86-physical-parser-mutation-tests
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Require exact compiler commit
        run: test "$(git -C compiler rev-parse HEAD)" = "aa6c96d1f8769a0d2fbe29fe42152c3db7fae6b2"
      - name: Trim workspace to independent backend crates
        run: |
          cat > compiler/Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir", "crates/opt", "crates/backend", "crates/backend-x86"]
          EOF
          rm -f compiler/Cargo.lock
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: x86-m21-parser-mut
          cache-workspace-crates: 'true'
      - name: Mutate v2 v3 v4 v5 readers and verify canonical recovery
        working-directory: compiler
        run: |
          cargo test -p compiler-backend-x86 --test typeid_physical_parser_mutation -- --nocapture
          cargo test -p compiler-backend-x86 --test typeid_physical_module_v5 -- --nocapture
          cargo test -p compiler-backend-x86 --test typeid_physical_module_v3 -- --nocapture
      - name: Complete x86 backend regressions and strict Clippy
        working-directory: compiler
        run: |
          cargo test -p compiler-backend-x86
          cargo clippy -p compiler-backend-x86 --all-targets -- -D warnings
