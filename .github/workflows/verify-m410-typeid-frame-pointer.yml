name: M4.10 checked TypeId RBP frame pointer ELF-GAS
on:
  pull_request:
    paths: ['.github/workflows/verify-m410-typeid-frame-pointer.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  framed:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
      CARGO_INCREMENTAL: '0'
      COMPILER_ELF_REQUIRE_LLVM: '1'
    steps:
      - name: Checkout exact TypeId framed compiler
        uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: c5819f324972d921db3d542d6915f2b2d8ec947b
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Verify exact compiler source
        working-directory: compiler
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "c5819f324972d921db3d542d6915f2b2d8ec947b"
          test -s crates/driver/tests/typeid_frame_pointer.rs
          echo "Native TypeId frame-pointer compiler SHA c5819f324972d921db3d542d6915f2b2d8ec947b" >> "$GITHUB_STEP_SUMMARY"
      - name: Resolve public pinned source frontends
        run: git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
      - name: Install mandatory native linkers and debugger
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y lld gdb
          gcc --version | head -1
          clang --version | head -1
          ld.lld --version | head -1
          gdb --version | head -1
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: m410-native-typeid-rbp-v3
          cache-workspace-crates: 'true'
      - name: Real checked source RBP frames C11 GNU LLVM and ELF CFI
        working-directory: compiler
        run: cargo test -p compiler --test typeid_frame_pointer -- --nocapture
      - name: Existing TypeId ELF GAS linker and PIC DSO regressions
        working-directory: compiler
        run: |
          cargo test -p compiler --test typeid_elf_linker_matrix -- --nocapture
          cargo test -p compiler --test typeid_pic_shared -- --nocapture
      - name: Complete checked Mini-C Oberon TypeId and legacy driver suites
        working-directory: compiler
        run: |
          cargo test -p compiler --bin compiler
          cargo test -p compiler --test mini_c_cli
      - name: AArch64 shared native TypeId API compatibility
        working-directory: compiler
        run: cargo check -p compiler-backend-aarch64 --all-targets
      - name: Full IR optimizer and native x86 backend regression
        working-directory: compiler
        run: cargo test -p compiler-ir -p compiler-opt -p compiler-backend -p compiler-backend-x86 --features compiler-backend-x86/x7-native-form-validation
      - name: Strict all-target Clippy
        working-directory: compiler
        run: |
          cargo clippy -p compiler -p compiler-ir -p compiler-opt -p compiler-backend -p compiler-backend-x86 --features compiler-backend-x86/x7-native-form-validation --all-targets -- -D warnings
          cargo clippy -p compiler-backend-aarch64 --lib -- -D warnings
