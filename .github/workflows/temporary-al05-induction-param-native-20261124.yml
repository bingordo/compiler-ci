# Exact-source one-off gate for generated native AL-05 loop test inputs.
name: Temporary AL05 induction parameterized native input
on:
  pull_request:
    paths:
      - '.github/workflows/temporary-al05-induction-param-native-20261124.yml'
permissions:
  contents: read
jobs:
  al05-native-induction:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      SOURCE_SHA: 77178dc17d1aa732cba792f4beb55e80e65c1281
      CARGO_INCREMENTAL: '0'
      CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
    steps:
      - name: Checkout exact compiler candidate
        uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: ${{ env.SOURCE_SHA }}
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Check revision and isolate Rust optimizer workspace
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C compiler rev-parse HEAD)" = "$SOURCE_SHA"
          echo "Exact compiler SHA $SOURCE_SHA"
          cat > compiler/Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir", "crates/opt", "crates/backend", "crates/backend-x86", "crates/backend-aarch64"]
          EOF
          rm -f compiler/Cargo.lock
          rustc --version
      - name: Reuse Rust build cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: temporary-al05-param-native
      - name: Full non-Z3 Alive-lite and native-v3 fixture inventory
        working-directory: compiler
        shell: bash
        run: |
          set -euo pipefail
          cargo test -p compiler-opt --test alive_lite -- --nocapture
          cargo test -p compiler-opt --test native_v3_fixture_inventory -- --nocapture
      - name: Install Z3
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y z3
          z3 --version
      - name: Prove all five AL05 loop families and SAT/UNKNOWN mutants
        working-directory: compiler
        shell: bash
        run: |
          set -euo pipefail
          for test in \
            al05_fixed_trip_changed_typeid_cse_and_negative_controls \
            al05_affine_changed_typeid_cse_and_sat_mutants \
            al05_inductive_changed_typeid_cse_and_sat_mutants \
            al05_parameterized_changed_cse_and_sat_mutants \
            al05_all_i32_literal_coefficients_changed_cse_and_sat_controls; do
            cargo test -p compiler-opt --test alive_lite "$test" -- --ignored --nocapture --test-threads=1
          done
      - name: Focused Clippy except unrelated historical warnings
        working-directory: compiler
        shell: bash
        run: |
          set -euo pipefail
          cargo clippy -p compiler-opt --test alive_lite --test native_v3_fixture_inventory -- -D clippy::all -A clippy::too_many_arguments -A clippy::needless_lifetimes -A clippy::empty_line_after_doc_comments -A clippy::collapsible_if -A clippy::collapsible_match -A clippy::needless_range_loop -A clippy::needless_borrows_for_generic_args -A clippy::type_complexity
