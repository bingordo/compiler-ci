name: TEMP FP5 native AArch64 mixed Bool FP fixed C ABI
on:
  pull_request:
    paths:
      - '.github/workflows/temp-fp5-mixed-entry-20261122.yml'
permissions:
  contents: read
jobs:
  native-a64-mixed-entry:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 59c8a436fc277d9f8a0c3da2302447fdb4c41d12
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Verify exact compiler source SHA
        working-directory: compiler
        run: test "$(git rev-parse HEAD)" = "59c8a436fc277d9f8a0c3da2302447fdb4c41d12"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Isolate native AArch64 closure
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p a64/crates
          cp -a compiler/crates/ir compiler/crates/backend compiler/crates/backend-aarch64 a64/crates/
          cat > a64/Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir","crates/backend","crates/backend-aarch64"]
          EOF
      - name: Warnings-denied all-target typecheck
        working-directory: a64
        run: RUSTFLAGS="-D warnings" cargo check -p compiler-backend-aarch64 --all-targets
      - name: Strict Clippy production and all four FP native tests
        working-directory: a64
        run: |
          cargo clippy -p compiler-backend-aarch64 --lib -- -D warnings
          cargo clippy -p compiler-backend-aarch64 --test typeid_fp_mixed_entry_native -- -D warnings
          cargo clippy -p compiler-backend-aarch64 --test typeid_fp_cfg_native -- -D warnings
          cargo clippy -p compiler-backend-aarch64 --test typeid_fp_compare_native -- -D warnings
          cargo clippy -p compiler-backend-aarch64 --test typeid_fp_native -- -D warnings
      - name: New 57344 C11 GCC mixed ABI differential and source negative cases
        working-directory: a64
        run: cargo test -p compiler-backend-aarch64 --test typeid_fp_mixed_entry_native -- --nocapture
      - name: Previous 24576 native FP CFG PHI oracle
        working-directory: a64
        run: cargo test -p compiler-backend-aarch64 --test typeid_fp_cfg_native -- --nocapture
      - name: Previous 114688 ordered unordered compare oracle
        working-directory: a64
        run: cargo test -p compiler-backend-aarch64 --test typeid_fp_compare_native -- --nocapture
      - name: Previous exact FP constants and arithmetic oracle
        working-directory: a64
        run: cargo test -p compiler-backend-aarch64 --test typeid_fp_native -- --nocapture
      - name: Complete AArch64 backend all-target regression suite
        working-directory: a64
        run: cargo test -p compiler-backend-aarch64 --all-targets -- --test-threads=1
