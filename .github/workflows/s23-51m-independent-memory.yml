name: S23.51m independent zlib and tiny-AES-c original C producer memory comparison
on:
  pull_request:
    paths:
      - '.github/workflows/s23-51m-independent-memory.yml'
      - 'scripts/s2351m_upstream_benchmark.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  independent-original-c:
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
      CARGO_BUILD_JOBS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: a08f4172ed64f971a06412fc9d2f9d1b04f3fa6f
          path: before
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 73b92683aa6a52e65d21ab31748fddefdad8a809
          fetch-depth: 2
          path: after
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.CI_KEY }}
      - name: Verify exact adjacent source-pinned pre/post two-pass constructor commits
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C before rev-parse HEAD)" = a08f4172ed64f971a06412fc9d2f9d1b04f3fa6f
          test "$(git -C after rev-parse HEAD)" = 73b92683aa6a52e65d21ab31748fddefdad8a809
          test "$(git -C after rev-parse HEAD^)" = a08f4172ed64f971a06412fc9d2f9d1b04f3fa6f
          cmp before/tools/typeid-rule-gen/examples.rules after/tools/typeid-rule-gen/examples.rules
          cmp before/tools/typeid-rule-gen/ssa_codegen.py after/tools/typeid-rule-gen/ssa_codegen.py
          grep -q 'let mut producer_count = 0usize' after/crates/opt/src/generated_typeid_shadow.rs
          python3 -m py_compile scripts/s2351m_upstream_benchmark.py
          git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
          mkdir -p results/upstream
          rustc --version
          printf 'S2351M_COMPILER_PINS before=%s after=%s\n' a08f4172ed64f971a06412fc9d2f9d1b04f3fa6f 73b92683aa6a52e65d21ab31748fddefdad8a809
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            before -> target
            after -> target
          key: s2351m-upstream-memory
      - name: Compile actual release Rust TypeId binaries outside all timings
        shell: bash
        run: |
          set -euo pipefail
          for rev in before after; do
            timeout --signal=TERM --kill-after=10s 18m \
              cargo build --release -p compiler --bin compiler --manifest-path "$rev/Cargo.toml"
            test -s "$rev/target/release/compiler"
            sha256sum "$rev/target/release/compiler"
          done
      - name: Checkout exactly accepted unmodified upstream original C sources
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch v1.3.1 https://github.com/madler/zlib.git results/upstream/zlib
          git clone --depth 1 --branch v1.0.0 https://github.com/kokke/tiny-AES-c.git results/upstream/aes
          test "$(git -C results/upstream/zlib rev-parse HEAD)" = 51b7f2abdade71cd9bb0e7a373ef2610ec6f9daf
          test "$(git -C results/upstream/aes rev-parse HEAD)" = e72b6eff0884673997d0ca6385169bbd9b31936d
      - name: Require both original GCC object successes and byte-identical native code on before/after
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/s2351m_upstream_benchmark.py benchmark results \
            --before before/target/release/compiler \
            --after after/target/release/compiler | tee results/s2351m-compile-results.log
      - name: Independently execute upstream AES test vectors and zlib Adler32 GCC differential
        shell: bash
        run: |
          set -euo pipefail
          for rev in before after; do
            gcc -std=c11 -I results/upstream/aes results/upstream/aes/test.c \
              "results/objects/tiny-aes-$rev.o" -o "results/aes-$rev-test"
            "results/aes-$rev-test" > "results/aes-$rev-test.log"
            echo "S2351M_AES_ORACLE revision=$rev success=1"
          done
          # Rename symbols only in separately compiled independent GCC
          # reference. The original upstream adler32.c is not modified.
          gcc -std=gnu11 -I results/upstream/zlib \
            -Dadler32=ref_adler32 -Dadler32_z=ref_adler32_z \
            -Dadler32_combine=ref_adler32_combine \
            -Dadler32_combine64=ref_adler32_combine64 \
            -c results/upstream/zlib/adler32.c \
            -o results/objects/zlib-adler-gcc-renamed.o
          cat > results/adler-oracle.c <<'C'
          #include <stdio.h>
          #include "zlib.h"
          uLong ref_adler32(uLong, const Bytef *, uInt);
          uLong ref_adler32_z(uLong, const Bytef *, z_size_t);
          int main(void) {
              Bytef input[10000];
              for (unsigned i = 0; i < sizeof(input); ++i)
                  input[i] = (Bytef)((i * 43u + i / 19u) & 0xffu);
              const unsigned sizes[] = {0, 1, 2, 15, 16, 31, 255, 5552, 5553, 10000};
              for (unsigned j = 0; j < sizeof(sizes)/sizeof(sizes[0]); ++j) {
                  uInt n = sizes[j];
                  if (adler32(1, input, n) != ref_adler32(1, input, n) ||
                      adler32_z(1, input, n) != ref_adler32_z(1, input, n)) {
                      fprintf(stderr, "Adler32 mismatch length %u\n", n);
                      return 1;
                  }
              }
              puts("S2351M_ADLER_GCC_ORACLE_OK"); return 0;
          }
          C
          for rev in before after; do
            gcc -std=gnu11 -I results/upstream/zlib results/adler-oracle.c \
              "results/objects/zlib-adler-$rev.o" \
              results/objects/zlib-adler-gcc-renamed.o -o "results/adler-$rev-test"
            "results/adler-$rev-test" | tee "results/adler-$rev-test.log"
          done
      - name: Separately install distro allocation profiler, not used for uninstrumented RSS
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq heaptrack
          command -v heaptrack
          command -v heaptrack_print
      - name: Measure original upstream whole compiler allocation call counts and temporary heap usage
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/s2351m_upstream_benchmark.py profile results \
            --before before/target/release/compiler \
            --after after/target/release/compiler | tee results/s2351m-profile-results.log
      - name: Check exactly two independent original projects with 16 ABBA blocks and full oracle coverage
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          r=Path('results')
          source=json.loads((r/'source-manifest.json').read_text())
          assert {x['repo'] for x in source} == {'zlib','aes'}
          assert len(source)==2 and len({x['sha256'] for x in source})==2
          timing=json.loads((r/'time-raw.json').read_text())
          assert len(timing)==128
          assert {x['source'] for x in timing}=={'zlib-adler','tiny-aes'}
          assert {x['block'] for x in timing}==set(range(16))
          profiles=json.loads((r/'heap-summary.json').read_text())
          assert len(profiles)==4
          assert all(x['allocations']>0 for x in profiles)
          for rev in ('before','after'):
              assert (r/f'aes-{rev}-test.log').exists()
              assert 'S2351M_ADLER_GCC_ORACLE_OK' in (r/f'adler-{rev}-test.log').read_text()
          print('S2351M_COMPLETE upstream_projects=2 untouched_sources=2 ABBA_samples=128 profiles=4')
          PY
      - name: Upload independent source/oracle, raw timing and allocation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: s2351m-original-zlib-aes-native-memory-abba
          path: |
            results/*.json
            results/*.log
            results/time/*.txt
            results/heap-summary-*.txt
            results/adler-oracle.c
          retention-days: 28
          if-no-files-found: warn
