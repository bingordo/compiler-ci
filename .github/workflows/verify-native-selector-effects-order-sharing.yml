name: Cross-target native selector effect and source-order sharing
on:
  pull_request:
    paths: ['.github/workflows/verify-native-selector-effects-order-sharing.yml']
permissions:
  contents: read
jobs:
  selector-source-admission:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout immutable compiler candidate
        uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 1ce0ef964ce21a07d71e45502126e2939076f9c0
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Require exact immutable source SHA
        run: test "$(git -C compiler rev-parse HEAD)" = "1ce0ef964ce21a07d71e45502126e2939076f9c0"
      - name: Verify exact source-pinned generated Rust bytes on three backends
        working-directory: compiler
        run: |
          set -euo pipefail
          export PYTHONPATH="$PWD/tools"
          python3 -m py_compile tools/native_selector_codegen.py tools/regen_aarch64_native_selector_rules.py tools/regen_riscv_native_selector_rules.py tools/test_native_selector_codegen.py
          python3 tools/regen_aarch64_native_selector_rules.py --check
          python3 tools/regen_riscv_native_selector_rules.py --check
          python3 tools/riscv_udb_rust_leaf_forms.py --catalog data/riscv_udb_r0_catalog.json --output crates/backend-riscv64/src/generated_encoding.rs --check
          python3 tools/regen_x86_selector_rules.py --check
      - name: Run shared typed-effect, source-order and all native source oracle mutation suites
        working-directory: compiler
        run: |
          set -euo pipefail
          export PYTHONPATH="$PWD/tools"
          python3 -m unittest discover -s tools -p test_native_selector_codegen.py -v
          python3 -m unittest discover -s tools -p test_regen_aarch64_native_selector_rules.py -v
          python3 -m unittest discover -s tools -p test_riscv_native_selector_rules.py -v
          python3 -m unittest discover -s tools -p test_riscv_udb_rust_leaf_forms.py -v
          python3 -m unittest discover -s tools -p test_ranked_generator_index.py -v
