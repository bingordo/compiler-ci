name: ASM2 pinned Mini-C basic asm native safety gate
on:
  push:
    branches: [main]
    paths: ['.github/workflows/verify-asm2-minic-native.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: c7797a646cfb623e0ba263a6d49b75ddbb5162e7
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
          path: compiler
      - name: Verify pinned compiler source and merged Mini-C dependency
        run: |
          set -euo pipefail
          test "$(git -C compiler rev-parse HEAD)" = 'c7797a646cfb623e0ba263a6d49b75ddbb5162e7'
          grep -q '061c802cf7e1fc9ac3d9454614f4f7000566c42b' compiler/tools/mini-c-driver/Cargo.toml
          grep -q '061c802cf7e1fc9ac3d9454614f4f7000566c42b' compiler/crates/driver/Cargo.toml
          git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler/tools/mini-c-driver -> target
          key: asm2-basic-minic-native
      - name: Compile pinned native TypeId Mini-C and test asm preservation
        working-directory: compiler
        run: |
          set -euo pipefail
          cargo test --manifest-path tools/mini-c-driver/Cargo.toml -p compiler-mini-c --lib asm2_basic_asm -- --nocapture
          cargo clippy --manifest-path tools/mini-c-driver/Cargo.toml -p compiler-mini-c --lib -- -D warnings
          echo 'ASM2_MINIC_NATIVE_FAIL_CLOSED=PASS source=c7797a646cfb623e0ba263a6d49b75ddbb5162e7' | tee -a "$GITHUB_STEP_SUMMARY"
