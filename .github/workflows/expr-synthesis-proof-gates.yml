name: Offline expression synthesis proof-gate tests
on:
  push:
    branches: [main]
    paths: ['.github/workflows/expr-synthesis-proof-gates.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: d1aff5692252233614eb995bafa276cfab88035a
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Install SMT solver
        run: sudo apt-get update -qq && sudo apt-get install -y z3
      - name: Run generator unit and solver tests
        run: |
          cargo test --manifest-path compiler/tools/expr-rule-gen/Cargo.toml
          cargo run --manifest-path compiler/tools/expr-rule-gen/Cargo.toml -- --self-test
      - name: Verify reduced basis and deterministic regeneration
        run: |
          cargo run --manifest-path compiler/tools/expr-rule-gen/Cargo.toml -- \
            --max-cost 3 --max-proofs 200 --max-rules 100 \
            --minimize-rules --output /tmp/reduced-rules.txt
          cargo run --manifest-path compiler/tools/expr-rule-gen/Cargo.toml -- \
            --max-cost 3 --max-proofs 200 --max-rules 100 \
            --minimize-rules --check /tmp/reduced-rules.txt
          python3 - <<'PY'
          import re
          header = open('/tmp/reduced-rules.txt').readline()
          match = re.search(r'original_rules=(\d+); retained_rules=(\d+); removed_rules=(\d+)', header)
          assert match, header
          original, retained, removed = map(int, match.groups())
          assert original == retained + removed, (original, retained, removed)
          assert removed > 0, 'expected at least one derived rule eliminated'
          print(f'Proven-rule basis: {original} -> {retained} ({removed} redundant)')
          PY
      - name: Exercise wider bounded grammar (five syntax nodes)
        run: |
          cargo run --release --manifest-path compiler/tools/expr-rule-gen/Cargo.toml -- \
            --max-cost 5 --max-proofs 2000 --max-rules 200 \
            --minimize-rules --output /tmp/reduced-rules-5.txt
          sed -n '1,3p' /tmp/reduced-rules-5.txt
          grep -q 'rule_limit_reached=true' /tmp/reduced-rules-5.txt
      - name: Validate guard-aware conditional synthesis and matcher
        run: |
          cargo run --release --manifest-path compiler/tools/expr-rule-gen/Cargo.toml -- \
            --conditional-only --max-proofs 2000 --max-rules 250 \
            --format json --output /tmp/guarded-original.json
          cargo run --release --manifest-path compiler/tools/expr-rule-gen/Cargo.toml -- \
            --conditional-only --minimize-rules --max-proofs 2000 --max-rules 250 \
            --format json --output /tmp/guarded-basis.json
          cargo run --release --manifest-path compiler/tools/expr-rule-gen/Cargo.toml -- \
            --conditional-only --minimize-rules --max-proofs 2000 --max-rules 250 \
            --format json --check /tmp/guarded-basis.json
          cargo run --release --manifest-path compiler/tools/expr-rule-gen/Cargo.toml -- \
            --conditional-only --minimize-rules --max-proofs 2000 --max-rules 250 \
            --format rust --output /tmp/guarded-basis.rs
          rustc --edition=2021 -O --test /tmp/guarded-basis.rs -o /tmp/guarded-basis-tests
          /tmp/guarded-basis-tests
          cargo run --release --manifest-path compiler/tools/expr-rule-gen/Cargo.toml -- \
            --conditional-only --max-proofs 2000 --max-rules 250 \
            --format rust --output /tmp/guarded-original.rs
          ORIGINAL_MATCHER=/tmp/guarded-original.rs \
          REDUCED_MATCHER=/tmp/guarded-basis.rs \
            rustc --edition=2021 -O \
            compiler/tools/expr-rule-gen/harness/compare_guarded.rs \
            -o /tmp/compare-guarded
          /tmp/compare-guarded
          python3 - <<'PY'
          import json
          original = json.load(open('/tmp/guarded-original.json'))
          reduced = json.load(open('/tmp/guarded-basis.json'))
          meta = reduced['reduction']
          assert meta['original_rules'] == len(original['rules'])
          assert meta['retained_rules'] == len(reduced['rules'])
          assert meta['original_rules'] == meta['retained_rules'] + meta['removed_rules']
          assert len(reduced['rules']) <= len(original['rules'])
          assert reduced['rule_limit_reached'] == original['rule_limit_reached']
          assert all(x in original['rules'] for x in reduced['rules'])
          print('Guarded rules:',len(original['rules']),'->',len(reduced['rules']),
                'removed',meta['removed_rules'],
                'reduction/coverage proofs',meta['guard_proofs'],meta['coverage_proofs'])
          PY
