name: TypeId Mini-C tentative-definition provenance
on:
  push:
    branches: [ci/lto-tentative-provenance-20261120]
    paths: ['.github/workflows/lto-tentative-provenance-20261120.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tentative:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      SOURCE_SHA: e54f1fe32e700647815d67139f04e08c4d6d733b
      CARGO_INCREMENTAL: '0'
      CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: e54f1fe32e700647815d67139f04e08c4d6d733b
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Confirm immutable checked source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C compiler rev-parse HEAD)" = "$SOURCE_SHA"
          git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: lto-tentative-provenance
      - name: Check source checked Mini-C tentative and redeclaration tests
        working-directory: compiler
        run: |
          cargo test -p compiler --bin compiler tentative -- --nocapture
      - name: Existing native/LTO weak-strong + no-implicit-common acceptance
        working-directory: compiler
        run: |
          cargo test -p compiler --test lto_prevailing_weak_strong -- --nocapture
      - name: Existing source-LTO sidecar and coemission coverage
        working-directory: compiler
        run: |
          cargo test -p compiler --test lto_source_sidecar
          cargo test -p compiler --test lto_coemit
      - name: Check TypeId driver and reusable Mini-C source tests
        working-directory: compiler
        run: cargo check -p compiler --bin compiler
