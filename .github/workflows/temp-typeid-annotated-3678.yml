name: Temporary annotated TypeId import guard PR3678
on:
  push:
    branches: [ci/temp-typeid-annotated-guard-20261127]
  pull_request:
    paths: ['.github/workflows/temp-typeid-annotated-3678.yml']
permissions:
  contents: read
jobs:
  guard:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      SOURCE_SHA: 04e8a6b8d9609eb21235c90bbc8901d8c580d936
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: ${{ env.SOURCE_SHA }}
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Verify exact source and both production guards
        working-directory: compiler
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          python3 tools/test_check_typeid_driver_boundary.py
          PYTHONPATH=tools python3 -m unittest tools/test_ir_consumer_inventory.py
          python3 tools/check_typeid_driver_boundary.py
          python3 tools/ir_consumer_inventory.py --check-production
