name: Native selector generator Rust boilerplate dedup audit
on:
  pull_request:
    paths: ['.github/workflows/verify-native-selector-emitter-dedup.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-selector-emitter-dedup:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout immutable compiler candidate
        uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: a0a06f62bc5a3d4543c14ec513ad4f059190e779
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Assert exact compiler candidate
        run: test "$(git -C compiler rev-parse HEAD)" = "a0a06f62bc5a3d4543c14ec513ad4f059190e779"
      - name: Verify generated Rust exact byte parity
        working-directory: compiler
        run: |
          set -euo pipefail
          export PYTHONPATH="$PWD/tools"
          python3 tools/regen_aarch64_native_selector_rules.py --check
          python3 tools/regen_riscv_native_selector_rules.py --check
          python3 tools/regen_x86_selector_rules.py --check
      - name: Run shared emitter, AArch64, RV64, and ranked-index tests
        working-directory: compiler
        run: |
          set -euo pipefail
          export PYTHONPATH="$PWD/tools"
          python3 -m unittest discover -s tools -p test_native_selector_codegen.py -v
          python3 -m unittest discover -s tools -p test_regen_aarch64_native_selector_rules.py -v
          python3 -m unittest discover -s tools -p test_riscv_native_selector_rules.py -v
          python3 -m unittest discover -s tools -p test_ranked_generator_index.py -v
