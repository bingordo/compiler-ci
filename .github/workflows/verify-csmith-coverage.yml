name: M10 Csmith unmodified C coverage probe

# Coverage-only is not evidence of native compiler correctness. Expensive
# Csmith generation is manual; source push verifies harness negative controls.
on:
  workflow_dispatch:
    inputs:
      seed_count:
        description: Number of unmodified Csmith cases (1-16)
        required: false
        default: '16'
        type: string
      min_native:
        description: Native cases required for correctness (0 = coverage-only)
        required: false
        default: '0'
        type: string
      profile:
        description: Csmith source-generation profile; both keep safe math/checksum
        required: false
        default: baseline
        type: choice
        options:
          - baseline
          - restricted
          - restricted-observable
          - restricted-compound
  push:
    branches: [main, feature/m10-real-csmith-retest-20261104]
    paths:
      - '.github/workflows/verify-csmith-coverage.yml'
permissions:
  contents: read
concurrency:
  group: csmith-m10-coverage
  cancel-in-progress: true
jobs:
  harness-unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout harness from compiler main
        uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: main
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Run fail-closed harness unit tests
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s compiler/tools -p 'test_csmith_probe.py' -v \
            2>&1 | tee "$RUNNER_TEMP/csmith-harness-review.log"
          python3 -m py_compile compiler/tools/csmith_probe.py
          grep -F 'test_usage_boilerplate_never_turns_compiler_failure_into_unsupported' \
            "$RUNNER_TEMP/csmith-harness-review.log"
          grep -F 'test_timeout_terminates_child_process_group_after_parent_exits' \
            "$RUNNER_TEMP/csmith-harness-review.log"
          grep -F 'test_recorded_replay_includes_exact_sha_budget_and_seed' \
            "$RUNNER_TEMP/csmith-harness-review.log"
          grep -F 'test_targeted_replay_keeps_original_manifest_denominator_visible' \
            "$RUNNER_TEMP/csmith-harness-review.log"
          grep -F 'test_frontend_revision_is_taken_from_exact_cargo_manifest' \
            "$RUNNER_TEMP/csmith-harness-review.log"
          grep -F 'test_probe_rejects_missing_frontend_sha' \
            "$RUNNER_TEMP/csmith-harness-review.log"
          grep -F 'test_optional_preprocessing_preserves_original_and_hashes_derived_tu' \
            "$RUNNER_TEMP/csmith-harness-review.log"
          grep -F 'test_preprocessing_failure_is_not_compiler_miscompile' \
            "$RUNNER_TEMP/csmith-harness-review.log"
          grep -F 'test_restricted_profile_is_recorded_and_does_not_change_input' \
            "$RUNNER_TEMP/csmith-harness-review.log"
          grep -F 'test_csmith_profile_whitelist_rejects_unreviewed_flags' \
            "$RUNNER_TEMP/csmith-harness-review.log"
          grep -F 'test_restricted_options_must_be_in_pinned_generator_help' \
            "$RUNNER_TEMP/csmith-harness-review.log"
          echo "Harness tests only; no Csmith native correctness claim" >> "$GITHUB_STEP_SUMMARY"
          echo "Actual restricted Csmith execution is a separate coverage-probe job" >> "$GITHUB_STEP_SUMMARY"
  coverage-probe:
    needs: harness-unit
    # The expensive original Csmith generation and native campaign is manual.
    # Workflow pushes only execute the small fail-closed Python harness tests.
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/feature/m10-real-csmith-retest-20261104')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact compiler harness source
        uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: main
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          # Retain this read-only deploy key only for the duration of the
          # job, so exact published-source SHA can be shallow-fetched.
          persist-credentials: true
          fetch-depth: 1
          sparse-checkout: |
            tools/csmith_probe.py
            tools/test_csmith_probe.py
            tools/mini-c-driver/Cargo.toml
      - name: Fetch only the prebuilt Mini-C distribution
        uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: expr-rule-gen-binaries
          path: distribution
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
          sparse-checkout: |
            dist/mini-c-differential
      - name: Verify SHA-256 and immutable source provenance
        id: compiler
        shell: bash
        run: |
          set -euo pipefail
          src=distribution/dist/mini-c-differential
          (cd "$src" && sha256sum -c sha256.txt)
          source_sha="$(tr -d '\r\n' < "$src/source-sha.txt")"
          [[ "$source_sha" =~ ^[0-9a-f]{40}$ ]]
          # This diagnostic branch must test the exact merged short-capable build.
          [[ "$source_sha" == "fe09c99b747e485ec9d662e30ebe60efc385fade" ]] || { echo "::error::M10 retest requires merged short-capable Mini-C binary"; exit 1; }
          # Avoid fetching every branch and tag of the enormous research repo.
          # Fetch only the exact commit used to build the published binary.
          git -C compiler fetch --no-tags --depth=1 origin "$source_sha"
          git -C compiler cat-file -e "$source_sha^{commit}"
          # The frontend revision must come from the *published compiler
          # revision*, not a hardcoded or moving main-branch assumption.
          frontend_sha="$(git -C compiler show "$source_sha:tools/mini-c-driver/Cargo.toml" | python3 -c '
          import sys
          sys.path.insert(0,"compiler/tools")
          from csmith_probe import pinned_frontend_revision
          print(pinned_frontend_revision(sys.stdin.read()))
          ')"
          [[ "$frontend_sha" =~ ^[0-9a-f]{40}$ ]]
          python3 - "$src/mini-c-differential-linux-x86_64.tar.gz" <<'PY'
          import sys,tarfile
          with tarfile.open(sys.argv[1],"r:gz") as tar:
              members=tar.getmembers()
              if sorted(m.name for m in members)!=["compiler-mini-c","differential.py"] or any(not m.isfile() for m in members):
                  raise SystemExit("Unexpected prebuilt bundle content")
          PY
          mkdir -p "$RUNNER_TEMP/csmith-bin"
          tar -xzf "$src/mini-c-differential-linux-x86_64.tar.gz" -C "$RUNNER_TEMP/csmith-bin"
          test -x "$RUNNER_TEMP/csmith-bin/compiler-mini-c"
          echo "source_sha=$source_sha" >> "$GITHUB_OUTPUT"
          echo "frontend_sha=$frontend_sha" >> "$GITHUB_OUTPUT"
          echo "Prebuilt compiler SHA $source_sha, pinned Mini-C SHA $frontend_sha; no private sources rebuilt" >> "$GITHUB_STEP_SUMMARY"
      - name: Install Csmith 2.3 and independent C compilers
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -qq -y --no-install-recommends csmith libcsmith-dev gcc clang
          version="$(dpkg-query -W csmith | awk '{print $2}')"
          [[ "$version" == 2.3.0-* ]] || { echo "::error::Unexpected Csmith $version"; exit 1; }
          header="$(dpkg -L libcsmith-dev | grep '/csmith.h$' | head -n1)"
          test -s "$header"
          echo "CSMITH_INCLUDE=$(dirname "$header")" >> "$GITHUB_ENV"
          echo "Csmith package $version" >> "$GITHUB_STEP_SUMMARY"
      - name: Generate original Csmith translation units
        shell: bash
        env:
          SEED_COUNT: ${{ inputs.seed_count || '8' }}
          CSMITH_PROFILE: ${{ inputs.profile || 'restricted-observable' }}
        run: |
          set -euo pipefail
          [[ "$SEED_COUNT" =~ ^[0-9]+$ ]]
          (( 10#$SEED_COUNT >= 1 && 10#$SEED_COUNT <= 16 ))
          timeout --signal=TERM --kill-after=5s 3m \
            python3 compiler/tools/csmith_probe.py --generate \
              --cases-dir "$RUNNER_TEMP/csmith-cases" \
              --csmith csmith --seed-base 1 --seed-count "$SEED_COUNT" \
              --profile "$CSMITH_PROFILE" \
            | tee "$RUNNER_TEMP/csmith-generate.log"
      - name: Compare GCC and Clang before testing prebuilt Mini-C
        shell: bash
        env:
          MIN_NATIVE: ${{ inputs.min_native || '0' }}
        run: |
          set -euo pipefail
          [[ "$MIN_NATIVE" =~ ^[0-9]+$ ]]
          (( 10#$MIN_NATIVE >= 0 && 10#$MIN_NATIVE <= 16 ))
          timeout --signal=TERM --kill-after=5s 8m \
            python3 compiler/tools/csmith_probe.py --probe \
              --cases-dir "$RUNNER_TEMP/csmith-cases" \
              --artifacts-dir "$RUNNER_TEMP/csmith-results" \
              --include-dir "$CSMITH_INCLUDE" \
              --preprocess-c \
              --driver "$RUNNER_TEMP/csmith-bin/compiler-mini-c" \
              --compiler-sha "${{ steps.compiler.outputs.source_sha }}" \
              --frontend-sha "${{ steps.compiler.outputs.frontend_sha }}" \
              --minimum-native "$MIN_NATIVE" \
            | tee "$RUNNER_TEMP/csmith-probe.log"
          python3 - "$RUNNER_TEMP/csmith-results/summary.json" <<'PY'
          import json,os,sys
          d=json.load(open(sys.argv[1]))
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as out:
              out.write(f"Seeds {d['total_seeds']}; GCC/Clang agree {d['reference_agreed']}; native accepted {d['native_accepted']}; passing {d['passed']}\n")
              if d['native_accepted']==0:
                  out.write("**COVERAGE ONLY: zero native acceptance; NOT compiler correctness validation.**\n")
          print("CSMITH_COVERAGE_ACCEPTED",d['native_accepted'],"of",d['total_seeds'])
          PY
      - name: Preserve unmodified source and full evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: csmith-coverage-evidence
          path: |
            ${{ runner.temp }}/csmith-cases/
            ${{ runner.temp }}/csmith-results/
            ${{ runner.temp }}/csmith-generate.log
            ${{ runner.temp }}/csmith-probe.log
          if-no-files-found: ignore
          retention-days: 14
