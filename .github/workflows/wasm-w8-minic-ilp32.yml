# W8: genuine Mini-C wasm32 target semantic data model, no native regression.
name: Wasm W8 Mini-C ILP32 checker

on:
  pull_request:
    paths:
      - '.github/workflows/wasm-w8-minic-ilp32.yml'
  workflow_dispatch:
    inputs:
      minic_sha:
        description: 'Exact Mini-C source SHA'
        required: true
        type: string

permissions:
  contents: read

jobs:
  mini-c-ilp32:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout exact Mini-C frontend source
        uses: actions/checkout@v4
        with:
          repository: bingordo/mini-c
          ref: ${{ inputs.minic_sha || '76e9734673ee916d03c1517d422592adf44c2a1a' }}
          path: mini-c
      - name: Verify exact pinned frontend commit
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C mini-c rev-parse HEAD)" = "${{ inputs.minic_sha || '76e9734673ee916d03c1517d422592adf44c2a1a' }}"
          rustc --version
      - name: Cache standalone checked Mini-C build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: mini-c -> target
          key: wasm-w8-minic-ilp32-checker
      - name: Validate entire Mini-C semantic checker and target-aware layout tests
        working-directory: mini-c
        run: cargo test -p mini-c-sema -- --nocapture
      - name: Strict Mini-C semantic checker Clippy
        working-directory: mini-c
        run: cargo clippy -p mini-c-sema --all-targets -- -D warnings
