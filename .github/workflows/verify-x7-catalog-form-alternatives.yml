name: X7 generic form catalog constrained alternatives
on:
  push:
    branches: [ci/x7-catalog-form-alternatives-20261110]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  generic-pattern-candidate-coverage:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout exact compiler revision
        uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 63628d5a1b6848399a154d674844a4d4e3655fe6
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
          fetch-depth: 3
      - name: Confirm exact source revision and syntax
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 63628d5a1b6848399a154d674844a4d4e3655fe6
          python3 -m py_compile tools/x86_generic_form_catalog.py tools/x86_generic_form_matcher.py tools/test_x86_generic_form_catalog.py tools/test_x86_generic_form_matcher.py
      - name: Candidate enumeration, fixed registers, ties and search budgets
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tools -p 'test_x86_generic_form_catalog.py' -v
          python3 -m unittest discover -s tools -p 'test_x86_generic_form_matcher.py' -v
          python3 tools/x86_generic_form_catalog.py --check
          echo X7_CATALOG_ALTERNATIVES_TESTS_PASS
      - name: Validate no production matcher or generator table edits
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import subprocess
          out=subprocess.check_output(["git","diff","--name-only","63628d5a1b6848399a154d674844a4d4e3655fe6~2","63628d5a1b6848399a154d674844a4d4e3655fe6"],text=True).splitlines()
          assert sorted(out)==[
              "tools/test_x86_generic_form_catalog.py",
              "tools/x86_generic_form_catalog.py",
          ],out
          from pathlib import Path
          code=Path("tools/x86_generic_form_catalog.py").read_text()
          assert "fixed-register form constraint not satisfied" not in code
          assert "register tie constraint not satisfied" not in code
          assert "selection_eligible" in code and "False" in code
          print("X7_CATALOG_ALTERNATIVES_SCOPE_PASS")
          PY
