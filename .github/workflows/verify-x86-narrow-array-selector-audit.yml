name: x86 narrow array real ELF selector audit
on:
  pull_request:
    paths: ['.github/workflows/verify-x86-narrow-array-selector-audit.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  selector-census:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact compiler source candidate
        uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 99f63198eeed675cc100d9e4c9c1b1094f247669
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Require exact source SHA
        run: test "$(git -C compiler rev-parse HEAD)" = "99f63198eeed675cc100d9e4c9c1b1094f247669"
      - uses: dtolnay/rust-toolchain@stable
      - name: Isolate TypeId backend and optimizer crates
        working-directory: compiler
        run: |
          cat > Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir", "crates/backend", "crates/opt", "crates/backend-x86", "crates/backend-aarch64"]
          EOF
          rm -f Cargo.lock
      - name: Validate source and real selector census
        working-directory: compiler
        run: |
          set -euo pipefail
          export PYTHONPATH="$PWD/tools"
          python3 tools/regen_x86_selector_rules.py --check
          python3 -m unittest discover -s tools -p test_x86_real_selector_census.py -v
          cargo test -p compiler-backend-x86 --test x86_real_selector_census --features x86-selector-census -- --nocapture | tee /tmp/x86-narrow-array-selector.log
          grep -Fq 'test source_owned_narrow_arrays_real_elf_execute_against_c11 ... ok' /tmp/x86-narrow-array-selector.log
          python3 tools/x86_real_selector_census.py --rust-test-log /tmp/x86-narrow-array-selector.log
      - name: Preserve selector-level unit tests
        working-directory: compiler
        run: cargo test -p compiler-backend-x86 --lib selector::tests
