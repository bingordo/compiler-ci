# One-off exact-source TypeId pruning validation, never merge into compiler-ci main.
name: IR PR3510 generic TypeId pruning acceptance
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/ir-pr3510-generic-reachability.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ir-pr3510-pruning-${{ github.ref }}
  cancel-in-progress: true
jobs:
  generic-pruning:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      COMPILER_SHA: 6d7c448d8ed393a7ae5fbe1555a6e6afc0e76153
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: ${{ env.COMPILER_SHA }}
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Verify source pin and isolate core workspace
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C compiler rev-parse HEAD)" = "$COMPILER_SHA"
          echo "Tested compiler SHA: $COMPILER_SHA" >> "$GITHUB_STEP_SUMMARY"
          cat > compiler/Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir", "crates/opt"]
          EOF
          rm -f compiler/Cargo.lock
          rustc --version
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: ir-generic-pruning-3510
      - name: Targeted generic TypeId pruning and consumer regressions
        working-directory: compiler
        shell: bash
        run: |
          set -euo pipefail
          cargo test -p compiler-opt --test dead_functions_reachability -- --nocapture
          cargo test -p compiler-opt --lib dead_functions::tests -- --nocapture
          cargo test -p compiler-opt --test module_signatures
          cargo test -p compiler-opt --test typed_aggregate_pipeline
      - name: Strict native IR and optimizer Clippy
        working-directory: compiler
        run: |
          cargo clippy -p compiler-ir -p compiler-opt --lib -- -D warnings
          cargo clippy -p compiler-opt --test dead_functions_reachability -- -D warnings
