# Temporary EH consumer inventory; do not merge.
name: EH remaining workspace consumer audit
on:
  pull_request:
    paths: ['.github/workflows/temporary-eh-extra-consumers.yml']
permissions:
  contents: read
jobs:
  remaining:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      SOURCE_SHA: 5016c3e65f306ccc0953ff8f0c32e131a2b8b166
      CARGO_INCREMENTAL: '0'
      CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: ${{ env.SOURCE_SHA }}
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.CI_KEY }}
      - name: Check exact source
        run: test "$(git -C compiler rev-parse HEAD)" = "$SOURCE_SHA"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: temporary-eh-remaining-consumers
          cache-on-failure: true
      - name: Audit remaining target, linker and driver consumers
        working-directory: compiler
        run: |
          cargo check -p compiler-backend-riscv64 -p compiler-backend-wasm -p compiler-lto-plugin-core -p compiler --all-targets --keep-going
