# Temporary exact-source T5 generated CFG native input identity proof gate.
name: Temporary Alive CFG source identity
on:
  pull_request:
    paths:
      - '.github/workflows/temporary-alive-cfg-identity-20261126.yml'
permissions:
  contents: read
jobs:
  cfg-native-identity:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      SOURCE_SHA: f1a90d82105d18eaacd0559692c5eaa4d6e47803
      CARGO_INCREMENTAL: '0'
      CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
    steps:
      - name: Checkout exact compiler source
        uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: ${{ env.SOURCE_SHA }}
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Verify exact source and isolate optimizer
        run: |
          set -euo pipefail
          test "$(git -C compiler rev-parse HEAD)" = "$SOURCE_SHA"
          echo "Exact compiler source SHA: $SOURCE_SHA"
          cat > compiler/Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir", "crates/opt", "crates/backend", "crates/backend-x86", "crates/backend-aarch64"]
          EOF
          rm -f compiler/Cargo.lock
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: temporary-alive-cfg-source-identity
      - name: Ordinary Alive-lite and 48-case source identity regression
        working-directory: compiler
        run: cargo test -p compiler-opt --test alive_lite -- --nocapture
      - name: Install Z3
        run: sudo apt-get update -qq && sudo apt-get install -y z3
      - name: Generated CFG campaign Z3 and existing AL01/AL02 proof gates
        working-directory: compiler
        run: |
          set -euo pipefail
          for test in \
            prove_seeded_cfg_mutations_against_actual_passes \
            al01_direct_typeid_proves_changed_cse_and_finds_phi_trap_mutants \
            al02_typeid_stage_proof_ledger \
            al02_source_pipeline_composed_z3_proofs; do
            cargo test -p compiler-opt --test alive_lite "$test" -- --ignored --nocapture --test-threads=1
          done
      - name: Focused Clippy
        working-directory: compiler
        run: cargo clippy -p compiler-opt --test alive_lite -- -D clippy::all -A clippy::too_many_arguments -A clippy::needless_lifetimes -A clippy::empty_line_after_doc_comments -A clippy::collapsible_if -A clippy::collapsible_match -A clippy::needless_range_loop -A clippy::needless_borrows_for_generic_args -A clippy::type_complexity
