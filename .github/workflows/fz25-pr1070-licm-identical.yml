name: FZ-2.5 PR1070 identical merges and LICM native oracle
on:
  push:
    branches: [fuzz/fz25-licm-identical-pr1070]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  targeted:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 8e997801e7cbac5fdc713368705904ca87a0a134
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Check exact source and LICM/merge test
        run: |
          test "$(git -C compiler rev-parse HEAD)" = "8e997801e7cbac5fdc713368705904ca87a0a134"
          test -s compiler/crates/opt/tests/typeid_fuzz_licm_identical_targeted.rs
      - name: Isolate dependency-independent core
        run: |
          cat > compiler/Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir", "crates/opt", "crates/backend", "crates/backend-x86"]
          EOF
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: fz25-licm-identical
          cache-workspace-crates: 'true'
      - name: LICM and identical merge positive noop trap native GAS ELF
        working-directory: compiler
        run: cargo test -p compiler-opt --test typeid_fuzz_licm_identical_targeted -- --nocapture
      - name: Existing targeted TypeId and registry regressions
        working-directory: compiler
        run: |
          cargo test -p compiler-opt --test typeid_fuzz_memory_cfg_targeted
          cargo test -p compiler-opt --test typeid_fuzz_local_cfg_targeted
          cargo test -p compiler-opt --test typeid_fuzz_targeted
          cargo test -p compiler-opt --test typeid_fuzz_bias
          cargo test -p compiler-opt --test typeid_fuzz_pass_registry
          cargo test -p compiler-opt --test typed_core_native_verifier
      - name: Strict Clippy
        working-directory: compiler
        run: cargo clippy -p compiler-opt --test typeid_fuzz_licm_identical_targeted --test typeid_fuzz_pass_registry -- -D warnings
