name: Mini-C source-to-LTO-sidecar executable validation
on:
  push:
    branches: [verify/lto-mini-c-source-sidecar-20261114]
    paths: ['.github/workflows/lto-mini-c-source-sidecar-20261114.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-sidecar:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 3fcd7bb56c6012070555fa9c5fbffbc002a1e8c9
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Pin compiler and fetch public frontend dependencies
        run: |
          test "$(git -C compiler rev-parse HEAD)" = "3fcd7bb56c6012070555fa9c5fbffbc002a1e8c9"
          git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
      - name: Focus driver workspace
        run: |
          cat > compiler/Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir", "crates/opt", "crates/backend", "crates/backend-x86", "crates/backend-aarch64", "crates/driver"]
          EOF
          rm -f compiler/Cargo.lock
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: lto-mini-c-source-sidecar
      - name: Source sidecar to linked LTO executable
        working-directory: compiler
        run: |
          cargo test -p compiler --test lto_source_sidecar -- --nocapture
          cargo test -p compiler --test lto_cli
      - name: Strict driver sidecar lint
        working-directory: compiler
        run: cargo clippy -p compiler --test lto_source_sidecar -- -D warnings
