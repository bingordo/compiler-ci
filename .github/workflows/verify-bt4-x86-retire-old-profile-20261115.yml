name: BT4 retire obsolete x86 Function budget profiler
on:
  pull_request:
    paths:
      - '.github/workflows/verify-bt4-x86-retire-old-profile-20261115.yml'
permissions:
  contents: read
jobs:
  exact-source-native-typeid-and-legacy-boundary:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 81487de6657c0b0b6d2eae36fee20a872d9a3f3b
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: bt4-x86-retired-budget-profile-native
      - name: Pin candidate and enforce BT4 retired API boundary
        working-directory: compiler
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "81487de6657c0b0b6d2eae36fee20a872d9a3f3b"
          python3 tools/check_bt4_backend_boundary.py
          test "$(grep -c 'pub fn profile_allocation' crates/backend-x86/src/historical_function_emission.rs || true)" = 0
          ! grep -q 'fn allocation_profile_reports_spills_and_preserved_register_policy' crates/backend-x86/tests/unit/lib.rs
          ! grep -q 'fn stack_and_colored_codegen_use_distinct_homes' crates/backend-x86/tests/unit/lib.rs
      - name: Use only shared TypeId plus native x86 backend workspace
        shell: bash
        run: |
          set -euo pipefail
          cat > compiler/Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir","crates/opt","crates/backend","crates/backend-x86"]
          EOF
          rm -f compiler/Cargo.lock
      - name: Existing x86 library unit/reference tests and native budget parity
        working-directory: compiler
        shell: bash
        run: |
          set -euo pipefail
          cargo check -p compiler-backend-x86 --all-targets
          cargo test -p compiler-backend-x86 --lib
          cargo test -p compiler-backend-x86 --no-default-features --lib
          cargo test -p compiler-backend-x86 --test bt4_x86_profile_wide_native -- --nocapture
          cargo test -p compiler-backend-x86 --test bt4_x86_physical_budget_native -- --nocapture
          cargo test -p compiler-backend-x86 --test bt4_x86_historical_arity_phi_native -- --nocapture
          cargo test -p compiler-backend-x86 --test bt4_x86_historical_scalar_native -- --nocapture
          cargo test -p compiler-backend-x86 --test call_clobber_pressure_native -- --nocapture
          cargo test -p compiler-backend-x86 --test x4_cfg_pressure_native -- --nocapture
          cargo test -p compiler-backend-x86 --test x6_add64_native -- --nocapture
          echo BT4_NATIVE_BUDGET_RETIRED_PROFILE_PASS
