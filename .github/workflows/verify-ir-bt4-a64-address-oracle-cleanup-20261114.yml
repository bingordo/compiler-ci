name: IR BT4 retire A64 address legacy test API - exact source pin
on:
  pull_request:
    paths:
      - '.github/workflows/verify-ir-bt4-a64-address-oracle-cleanup-20261114.yml'
permissions:
  contents: read
jobs:
  native-arm:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.CI_KEY }}
      - run: ssh-keyscan github.com >> ~/.ssh/known_hosts
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: c7b499b9549fbc5d6754de465d90b9c57f03db93
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - run: |
          test "$(git -C compiler rev-parse HEAD)" = c7b499b9549fbc5d6754de465d90b9c57f03db93
          test "$(uname -m)" = aarch64
          command -v cc
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler
          key: ir-bt4-a64-address-cleanup-arm
      - name: Whole-workspace all-target typecheck (existing unrelated lint warnings permitted)
        working-directory: compiler
        run: cargo check --workspace --all-targets
      - name: Warnings-denied IR/shared-backend/AArch64 all-target typecheck
        working-directory: compiler
        run: RUSTFLAGS="-D warnings" cargo check -p compiler-ir -p compiler-backend -p compiler-backend-aarch64 --all-targets
      - name: All eight original native TypeId A64 address C11 oracles and machine replay after legacy deletion on ARM
        working-directory: compiler
        run: |
          cargo test -p compiler-backend-aarch64 --test double_index_native -- --nocapture
          cargo test -p compiler-backend-aarch64 --test double_index_store_native -- --nocapture
          cargo test -p compiler-backend-aarch64 --test mixed_address_modes -- --nocapture
          cargo test -p compiler-backend-aarch64 --test indexed_scales -- --nocapture
          cargo test -p compiler-backend-aarch64 --test local_address_folding -- --nocapture
          cargo test -p compiler-backend-aarch64 --test indexed_memory -- --nocapture
          cargo test -p compiler-backend-aarch64 --test displaced_memory -- --nocapture
          cargo test -p compiler-backend-aarch64 --test address_chains -- --nocapture
      - name: Full backend all-target suite
        working-directory: compiler
        run: cargo test -p compiler-backend-aarch64 --all-targets -- --test-threads=2
      - name: Strict all-target Clippy
        working-directory: compiler
        run: cargo clippy -p compiler-backend-aarch64 --all-targets -- -D warnings
  qemu:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc-aarch64-linux-gnu libc6-dev-arm64-cross linux-libc-dev-arm64-cross binutils-aarch64-linux-gnu qemu-user
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.CI_KEY }}
      - run: ssh-keyscan github.com >> ~/.ssh/known_hosts
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: c7b499b9549fbc5d6754de465d90b9c57f03db93
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - run: test "$(git -C compiler rev-parse HEAD)" = c7b499b9549fbc5d6754de465d90b9c57f03db93
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler
          key: ir-bt4-a64-address-cleanup-qemu
      - name: All eight native TypeId C11 and machine oracles in QEMU
        working-directory: compiler
        env:
          COMPILER_REQUIRE_AARCH64_QEMU: "1"
        run: |
          cargo test -p compiler-backend-aarch64 --test double_index_native -- --nocapture
          cargo test -p compiler-backend-aarch64 --test double_index_store_native -- --nocapture
          cargo test -p compiler-backend-aarch64 --test mixed_address_modes -- --nocapture
          cargo test -p compiler-backend-aarch64 --test indexed_scales -- --nocapture
          cargo test -p compiler-backend-aarch64 --test local_address_folding -- --nocapture
          cargo test -p compiler-backend-aarch64 --test indexed_memory -- --nocapture
          cargo test -p compiler-backend-aarch64 --test displaced_memory -- --nocapture
          cargo test -p compiler-backend-aarch64 --test address_chains -- --nocapture
