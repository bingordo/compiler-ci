# Exact-source verification of binary-v1 owned order versus canonical native-v3 text.
name: IR PR2812 binary ordering contract
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ir-pr2812-binary-order-20261122.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  codec:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      SOURCE_SHA: 857839c2a933bdf9ab078a3bcdb648ae3de14690
      CARGO_INCREMENTAL: '0'
      CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
    steps:
      - name: Checkout exact compiler PR revision
        uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: ${{ env.SOURCE_SHA }}
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Verify source and isolate core Rust workspace
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C compiler rev-parse HEAD)" = "$SOURCE_SHA"
          cat > compiler/Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir", "crates/opt", "crates/backend", "crates/backend-x86", "crates/backend-aarch64"]
          EOF
          rm -f compiler/Cargo.lock
          rustc --version
      - name: Cache isolated Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: ir-pr2812-binary-order
      - name: Verify native TypeId text and binary serialization
        working-directory: compiler
        run: |
          set -euo pipefail
          cargo test -p compiler-ir --test native_binary_v1 -- --nocapture
          cargo test -p compiler-ir --test native_module_text_v3 -- --nocapture
          cargo test -p compiler-ir --test lto_merge -- --nocapture
      - name: Strict focused Clippy
        working-directory: compiler
        run: |
          set -euo pipefail
          cargo clippy -p compiler-ir --test native_binary_v1 -- -D clippy::all -A clippy::empty_line_after_doc_comments
