name: TypeId real musl memmem inliner corpus acceptance
on:
  push:
    branches: [main]
    paths: [.github/workflows/verify-typeid-inline-real-memmem-20261109.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  real-memmem:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 52eab23f3bd43ed15b716464451ae5441132d482
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: bingordo/mini-c
          ref: 57c81b38386cc34f95c5928eb4410ea6dacd8df7
          path: mini-c
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Verify exact source pins
        run: |
          test "$(git -C compiler rev-parse HEAD)" = "52eab23f3bd43ed15b716464451ae5441132d482"
          test "$(git -C mini-c rev-parse HEAD)" = "57c81b38386cc34f95c5928eb4410ea6dacd8df7"
          git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler/tools/mini-c-driver -> target
          key: typeid-real-memmem-20261109
      - name: Checked multi-helper C source and bounded TypeId inline census
        working-directory: compiler
        shell: bash
        run: |
          set -euo pipefail
          export TYPEID_REAL_C_FIXTURES="$GITHUB_WORKSPACE/mini-c/tests/fixtures/musl-s10/string"
          cargo test --manifest-path tools/mini-c-driver/Cargo.toml --release --features experimental-fusion-benchmark --test typeid_source_inline_profile source_checked_musl_memmem_multi_helper_census -- --ignored --nocapture 2>&1 | tee "$RUNNER_TEMP/typeid-memmem.log"
          grep '^TYPEID_REAL_MEMMEM' "$RUNNER_TEMP/typeid-memmem.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: typeid-real-memmem
          path: ${{ runner.temp }}/typeid-memmem.log
          if-no-files-found: ignore
