name: Compiler docs PR 1559 validation
on:
  push:
    branches: [main]
    paths: ['.github/workflows/docs-pr1559-validation.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  docs:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: f9269c5ba6f5acbc9d7114e986989cf95308dfba
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Verify exact compiler revision
        run: test "$(git -C compiler rev-parse HEAD)" = "f9269c5ba6f5acbc9d7114e986989cf95308dfba"
      - name: Check all Markdown links
        working-directory: compiler
        run: python3 tools/check_doc_links.py
      - name: Run Markdown link checker unit tests
        working-directory: compiler
        run: python3 -m unittest discover -s tools -p 'test_check_doc_links.py' -v
