name: Validate conditional native-int graph operands PR2677
on:
  pull_request:
    paths:
      - '.github/workflows/native-int-conditional-graphs-pr2677.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  conditional-graphs:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      CARGO_INCREMENTAL: '0'
      SOURCE_SHA: 80197e1203b28c48fa1f577355a8716f28e574b0
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 80197e1203b28c48fa1f577355a8716f28e574b0
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Verify source pin and isolate optimizer
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C compiler rev-parse HEAD)" = "$SOURCE_SHA"
          cat > compiler/Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir", "crates/opt", "crates/backend", "crates/backend-x86"]
          EOF
          rm -f compiler/Cargo.lock
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: native-int-seeded-generator
      - name: Run full S23.12 and S23.17 generated negative-differential suites
        working-directory: compiler
        shell: bash
        run: |
          set -euo pipefail
          cargo test -p compiler-opt --test generated_native_matchpd_complement_s2312 -- --nocapture
          cargo test -p compiler-opt --test generated_native_matchpd_complement_s2317 -- --nocapture
      - name: Focused strict Clippy, exempt unrelated upstream warning categories
        working-directory: compiler
        run: cargo clippy -p compiler-opt --test generated_native_matchpd_complement_s2312 --test generated_native_matchpd_complement_s2317 -- -D warnings -A dead-code -A clippy::empty-line-after-doc-comments -A unused-imports -A clippy::too-many-arguments
