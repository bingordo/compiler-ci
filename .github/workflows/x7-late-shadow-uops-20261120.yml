name: X7 late selector exact CPU sequence shadow evidence
on:
  pull_request:
    paths:
      - '.github/workflows/x7-late-shadow-uops-20261120.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  shadow-x86-and-lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 1c537485c7b2be8347aabc4a54dd4481a7857eaa
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Exact-source pin and public-dependency transport
        run: |
          set -euo pipefail
          test "$(git -C compiler rev-parse HEAD)" = "1c537485c7b2be8347aabc4a54dd4481a7857eaa"
          git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: x7-late-shadow-uops-20261120
      - name: CPU sequence and actual late-selector observer tests
        working-directory: compiler
        run: |
          set -euo pipefail
          cargo test -p compiler-backend-x86 --lib physical_costs::tests::exact_local_sequence_evidence_is_cpu_specific_and_all_or_nothing -- --nocapture
          cargo test -p compiler-backend-x86 --lib x7_late_selector::tests::measured_shadow_report_observes_actual_selected_windows_without_policy_change -- --nocapture
      - name: Full default X86 backend unit suite
        working-directory: compiler
        run: cargo test -p compiler-backend-x86 --lib
      - name: Reversible feature check and scoped strict Clippy
        working-directory: compiler
        run: |
          set -euo pipefail
          cargo check -p compiler-backend-x86 --no-default-features
          cargo clippy -p compiler-backend-x86 --lib -- -D warnings -A unused-variables -A clippy::empty_line_after_doc_comments
  native-typeid-integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 1c537485c7b2be8347aabc4a54dd4481a7857eaa
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Exact compiler SHA and dependency transport
        run: |
          set -euo pipefail
          test "$(git -C compiler rev-parse HEAD)" = "1c537485c7b2be8347aabc4a54dd4481a7857eaa"
          git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: x7-late-shadow-uops-native-20261120
      - name: Native x86 TypeId and generated DAG GCC/GAS/ELF regression
        working-directory: compiler
        run: |
          set -euo pipefail
          cargo test -p compiler --test x86_inline_source_ablation -- --nocapture
          cargo test -p compiler --test x7_s4_rolling_checksum_source -- --nocapture
