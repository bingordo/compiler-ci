name: AArch64 pointer and CTZ Select fixed TypeId fixtures
on:
  push:
    branches: [verify/aarch64-ptr-ctz-typeid-20261115]
    paths: ['.github/workflows/aarch64-ptr-ctz-typeid-20261115.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 94aec2384d053b8c07e8160ecd1b6b4f3e48078f
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Assert exact compiler source
        run: test "$(git -C compiler rev-parse HEAD)" = "94aec2384d053b8c07e8160ecd1b6b4f3e48078f"
      - name: Restrict core workspace
        run: |
          cat > compiler/Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir", "crates/backend", "crates/backend-aarch64"]
          EOF
          rm -f compiler/Cargo.lock
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: aarch64-ptr-ctz-fixed-typeid
      - name: Install AArch64 cross GCC, glibc headers and QEMU
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends gcc-aarch64-linux-gnu libc6-dev-arm64-cross binutils-aarch64-linux-gnu qemu-user
      - name: Validate migrated original pointer and CTZ call C11 oracles under QEMU
        working-directory: compiler
        env:
          COMPILER_REQUIRE_AARCH64_QEMU: "1"
        run: |
          cargo test -p compiler-backend-aarch64 --test ptr64_calls --test ctz_select_calls -- --nocapture
      - name: Validate neighboring AArch64 ABI, native v3 parser and Clippy
        working-directory: compiler
        run: |
          cargo test -p compiler-backend-aarch64 --test typeid_abi_calls_native --test checked_arrays
          cargo test -p compiler-ir --test native_module_text_v3 --test native_fixture_text
          cargo clippy -p compiler-backend-aarch64 --no-deps --test ptr64_calls --test ctz_select_calls -- -D warnings
