name: AArch64 pointer and CTZ Select fixed TypeId fixtures
on:
  push:
    branches: [verify/aarch64-ptr-ctz-typeid-20261115]
    paths: ['.github/workflows/aarch64-ptr-ctz-typeid-20261115.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: da0168e007ecdf90e15154c3faeb8c1eb8f17ffc
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Assert exact compiler source
        run: test "$(git -C compiler rev-parse HEAD)" = "da0168e007ecdf90e15154c3faeb8c1eb8f17ffc"
      - name: Restrict core workspace
        run: |
          cat > compiler/Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir", "crates/backend", "crates/backend-aarch64"]
          EOF
          rm -f compiler/Cargo.lock
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: aarch64-ptr-ctz-fixed-typeid
      - name: Export original fixed AArch64 native TypeId graph sources
        working-directory: compiler
        run: |
          cargo test -p compiler-backend-aarch64 --test ptr64_calls temporary_export_original_fixed_native_pointer_graphs -- --nocapture
          cargo test -p compiler-backend-aarch64 --test ctz_select_calls temporary_export_original_fixed_native_ctz_select_calls_graphs -- --nocapture
