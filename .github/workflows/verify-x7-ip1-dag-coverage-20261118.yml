name: X7 IP-1 source-grounded DAG evidence inventory
on:
  pull_request:
    paths:
      - '.github/workflows/verify-x7-ip1-dag-coverage-20261118.yml'
permissions:
  contents: read
jobs:
  ip1-inventory-proof-boundaries:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact compiler candidate
        uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 471cae8fb37b448f28764d02188ad6d309c8aef8
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Assert source pin and test IP-1
        working-directory: compiler
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "471cae8fb37b448f28764d02188ad6d309c8aef8"
          python3 -m py_compile tools/x7_ip1_dag_coverage.py tools/test_x7_ip1_dag_coverage.py
          PYTHONPATH=tools python3 -m unittest -v test_x7_ip1_dag_coverage test_x86_dag_rule_groups test_x86_match_costs
          python3 tools/x7_ip1_dag_coverage.py > ../x7-ip1-coverage.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path("../x7-ip1-coverage.json").read_text())
          assert d["manifested_dag_rules"] > 0
          assert d["source_family_candidate_form_widths"] > 0
          assert d["actually_selected_typeid_form_widths"] is None
          assert d["new_isa_forms_admitted_by_this_tool"] == 0
          assert d["cost_basis"] == "conservative_relative_points_not_measured_cycles_or_uops"
          print("X7_IP1_EVIDENCE_STAGE_BOUNDARIES_GREEN")
          PY
      - name: Archive machine-readable inventory
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: x7-ip1-dag-evidence-inventory
          path: x7-ip1-coverage.json
          if-no-files-found: warn
