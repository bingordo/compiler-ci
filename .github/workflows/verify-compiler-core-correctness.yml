name: Compiler IR and native correctness (compiler-ci)

# The source repository may have no remaining Actions minutes. Check its
# immutable main SHA here instead; cached successes skip Cargo entirely.
on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: 'Compiler source ref (commit SHA, branch or tag)'
        required: false
        default: 'main'
        type: string
      force_recheck:
        description: 'Rerun tests even if this source and workflow passed'
        required: false
        default: false
        type: boolean
  schedule:
    - cron: '9,24,39,54 * * * *'
  pull_request:
    paths:
      - '.github/workflows/verify-compiler-core-correctness.yml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-compiler-core-correctness.yml'

permissions:
  contents: read

concurrency:
  group: compiler-native-correctness-${{ github.event.inputs.source_ref || 'main' }}
  cancel-in-progress: true

jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout workflow for cache-key versioning
        uses: actions/checkout@v4
      - name: Checkout private compiler source using read-only CI deploy key
        uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: ${{ inputs.source_ref || 'main' }}
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Record exact source revision
        id: source
        shell: bash
        working-directory: compiler
        run: |
          set -euo pipefail
          sha="$(git rev-parse HEAD)"
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]]
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "Compiler source SHA: $sha"
          # Fail rather than silently accepting a moved/absent test suite.
          for test_source in \
            crates/opt/tests/native_cfg_differential.rs \
            crates/opt/tests/loop_trap_semantics.rs \
            crates/opt/tests/memory_execution_oracle.rs \
            crates/opt/tests/phi_native.rs \
            crates/backend-x86/tests/division_native.rs \
            crates/ir/tests/verifier_mutations.rs \
            crates/opt/tests/alias_phi_exhaustive.rs \
            crates/opt/tests/pre_licm_semantic_matrix.rs \
            crates/opt/tests/induction_native.rs \
            crates/opt/tests/pre_native.rs \
            crates/opt/tests/mem2reg_native.rs; do
            test -s "$test_source"
          done
      - name: Skip source revisions already proven by this workflow version
        id: validated
        uses: actions/cache/restore@v4
        with:
          path: .compiler-native-validated
          key: compiler-native-v1-${{ hashFiles('.github/workflows/verify-compiler-core-correctness.yml') }}-${{ steps.source.outputs.sha }}
          lookup-only: true
      - name: Report existing passing evidence
        if: steps.validated.outputs.cache-hit == 'true' && !inputs.force_recheck
        env:
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: echo "Unchanged source commit $SOURCE_SHA already passed all native CFG correctness checks." >> "$GITHUB_STEP_SUMMARY"
      - name: Use credential-independent source workspace
        if: steps.validated.outputs.cache-hit != 'true' || inputs.force_recheck
        shell: bash
        working-directory: compiler
        run: |
          set -euo pipefail
          # The source Cargo workspace otherwise resolves private Oberon even
          # for -p compiler-opt. This modifies only the runner checkout.
          python3 - <<'PY'
          from pathlib import Path
          Path('Cargo.toml').write_text("""[workspace]
          resolver = "2"
          members = ["crates/ir", "crates/opt", "crates/backend", "crates/backend-x86"]
          """)
          PY
      # Cargo may need to download a new dependency on a cold cache or after a lockfile change.
      # Never force --offline: rust-cache is an optimization, not a correctness dependency.
      - name: Reuse Rust compiler core object files
        if: steps.validated.outputs.cache-hit != 'true' || inputs.force_recheck
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: native-cfg-correctness-v1
          cache-workspace-crates: 'true'
      - name: Run native CFG and trap correctness tests
        if: steps.validated.outputs.cache-hit != 'true' || inputs.force_recheck
        shell: bash
        working-directory: compiler
        run: |
          set -euo pipefail
          cargo test -p compiler-opt \
            --test native_cfg_differential \
            --test loop_trap_semantics \
            --test memory_execution_oracle \
            --test phi_native -- --nocapture \
            2>&1 | tee "$RUNNER_TEMP/native-cfg-tests.log"
          # Avoid reporting false-green jobs that executed zero meaningful tests.
          grep -F 'test direct_elf_and_assembly_match_independent_trap_and_pointer_phi_oracles ... ok' "$RUNNER_TEMP/native-cfg-tests.log"
          grep -F 'test actual_optimizer_passes_preserve_loop_trap_semantics ... ok' "$RUNNER_TEMP/native-cfg-tests.log"
          cargo test -p compiler-backend-x86 --test division_native -- --nocapture \
            2>&1 | tee "$RUNNER_TEMP/native-division-tests.log"
          grep -F 'test signed_divide_quotient_remainder_and_register_lifetimes ... ok' "$RUNNER_TEMP/native-division-tests.log"
      - name: Verify SSA structural mutations and invalid IR are rejected
        if: steps.validated.outputs.cache-hit != 'true' || inputs.force_recheck
        shell: bash
        working-directory: compiler
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=10s 4m \
            cargo test -p compiler-ir --test verifier_mutations -- --nocapture \
            2>&1 | tee "$RUNNER_TEMP/ssa-verifier-tests.log"
          grep -F 'test verifier_rejects_deterministic_cfg_corruptions_without_panicking ... ok' "$RUNNER_TEMP/ssa-verifier-tests.log"
          grep -F 'test pointer_phi_and_allocation_provenance_negative_matrix ... ok' "$RUNNER_TEMP/ssa-verifier-tests.log"
      - name: Verify loop, alias, PRE, induction, and mem2reg correctness
        if: steps.validated.outputs.cache-hit != 'true' || inputs.force_recheck
        shell: bash
        working-directory: compiler
        run: |
          set -euo pipefail
          # Run the five regression binaries in a single Cargo invocation.
          # These test IR equivalence, native outputs, and explicit refusal of
          # unsafe transforms; do not add performance timings to this gate.
          timeout --signal=TERM --kill-after=10s 9m \
            cargo test -p compiler-opt \
              --test alias_phi_exhaustive \
              --test pre_licm_semantic_matrix \
              --test induction_native \
              --test pre_native \
              --test mem2reg_native \
              -- --nocapture \
            2>&1 | tee "$RUNNER_TEMP/extended-opt-tests.log"
          grep -F 'test exhaustive_small_phi_hulls_never_miss_real_may_alias ... ok' "$RUNNER_TEMP/extended-opt-tests.log"
          grep -F 'test pre_licm_mixed_order_semantics_matrix ... ok' "$RUNNER_TEMP/extended-opt-tests.log"
          grep -F 'optimizer_preserves_nested_and_multilatch_oracles ... ok' "$RUNNER_TEMP/extended-opt-tests.log"
          grep -F 'test native_assembly_and_elf_match_independent_unsigned_c_reference ... ok' "$RUNNER_TEMP/extended-opt-tests.log"
          grep -F 'test native_asm_and_direct_elf_match_unoptimized_and_wrapping_c ... ok' "$RUNNER_TEMP/extended-opt-tests.log"
          grep -F 'test promoted_loop_and_mixed_array_execute_identically_from_both_native_formats ... ok' "$RUNNER_TEMP/extended-opt-tests.log"
      - name: Record successful exact source SHA
        if: success() && (steps.validated.outputs.cache-hit != 'true' || inputs.force_recheck)
        shell: bash
        env:
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          mkdir -p .compiler-native-validated
          printf '%s\n' "$SOURCE_SHA" > .compiler-native-validated/source-sha.txt
          printf 'SSA verifier, alias PHIs, nested/loop PRE, induction, mem2reg, CFG traps, pointer PHIs, signed division verified: %s\n' "$SOURCE_SHA" >> "$GITHUB_STEP_SUMMARY"
      - name: Cache successful evidence for the exact source revision
        if: success() && steps.validated.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .compiler-native-validated
          key: compiler-native-v1-${{ hashFiles('.github/workflows/verify-compiler-core-correctness.yml') }}-${{ steps.source.outputs.sha }}
      - name: Preserve native differential failure logs and reproducers
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: compiler-native-cfg-failures
          path: |
            ${{ runner.temp }}/native-cfg-tests.log
            ${{ runner.temp }}/native-division-tests.log
            ${{ runner.temp }}/ssa-verifier-tests.log
            ${{ runner.temp }}/extended-opt-tests.log
            /tmp/compiler-native-cfg-differential-*/
          if-no-files-found: ignore
          retention-days: 14
