name: Compiler IR and native correctness (compiler-ci)
# Temporary focused validation for compiler PR 3725. Do not merge.
on:
  pull_request:
    paths:
      - '.github/workflows/verify-compiler-core-correctness.yml'
permissions:
  contents: read
concurrency:
  group: fs1-scope-3725-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  fs1-scope:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 3d6da70560b0c621be1a8d7a6db5f31611a5e82f
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Record exact source and isolate IR workspace
        working-directory: compiler
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 3d6da70560b0c621be1a8d7a6db5f31611a5e82f
          git rev-parse HEAD
          python3 - <<'PY'
          from pathlib import Path
          Path('Cargo.toml').write_text("""[workspace]
          resolver = "2"
          members = ["crates/ir"]
          """)
          PY
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: fs1-scope-v1
      - name: FS-1 draft exact-width scalar semantics exhaustive and generated checks
        shell: bash
        working-directory: compiler
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=10s 5m \
            cargo test -p compiler-ir --test fs1_scalar_semantics -- --nocapture --test-threads=1 \
            2>&1 | tee "$RUNNER_TEMP/fs1-scalar-semantics.log"
          grep -F 'FS1_SCALAR_DRAFT exhaustive_i8_pairs=65536 signed_unsigned_division=checked' \
            "$RUNNER_TEMP/fs1-scalar-semantics.log"
          grep -F 'FS1_SCALAR_DRAFT widths=8,16,32,64,128 shift_modulo=true trap_edges=true' \
            "$RUNNER_TEMP/fs1-scalar-semantics.log"
          grep -F 'FS1_SCALAR_DRAFT generated_width_cases=5120' \
            "$RUNNER_TEMP/fs1-scalar-semantics.log"
          grep -F 'FS1_SCALAR_DRAFT invalid_is_not_trap=true production_op_flags=aligned' \
            "$RUNNER_TEMP/fs1-scalar-semantics.log"
          grep -F 'FS1_SCALAR_BOOL_SELECT cases=60 constbool=2 eager_precomputed_operands=true production_flags=aligned verdict=PASS' \
            "$RUNNER_TEMP/fs1-scalar-semantics.log"
          grep -F 'FS1_CTZ_NOT cases=1578 widths=8,16,32,64,128 ctz_zero=width not=masked invalid=rejected flags=aligned verdict=PASS' \
            "$RUNNER_TEMP/fs1-scalar-semantics.log"
          grep -F 'FS1_CAST_MATRIX valid_pairs=30 invalid_pairs=45 observations=7950 widths=8,16,32,64,128 sign=host_i128 invalid=rejected verdict=PASS' \
            "$RUNNER_TEMP/fs1-scalar-semantics.log"
          grep -F 'test fs1_scope_inventory_is_not_proof_admission ... ok' "$RUNNER_TEMP/fs1-scalar-semantics.log"
          timeout --signal=TERM --kill-after=10s 4m \
            cargo clippy -p compiler-ir --test fs1_scalar_semantics -- -D warnings

