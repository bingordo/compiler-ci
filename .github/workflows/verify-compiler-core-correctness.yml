name: Compiler IR and native correctness (compiler-ci)
# Temporary focused validation for compiler PR 3815; do not merge.
on:
  pull_request:
    paths:
      - '.github/workflows/verify-compiler-core-correctness.yml'
permissions:
  contents: read
jobs:
  p16-timing:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 709ff93698ece622ea877c9738ce24ad23ffc264
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Verify source and isolate workspace
        working-directory: compiler
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 709ff93698ece622ea877c9738ce24ad23ffc264
          git rev-parse HEAD
          python3 - <<'PY'
          from pathlib import Path
          Path('Cargo.toml').write_text("""[workspace]
          resolver = "2"
          members = ["crates/ir", "crates/opt", "crates/backend", "crates/backend-x86", "crates/backend-aarch64"]
          """)
          PY
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: p16-timing
      - name: Compile harness separately
        working-directory: compiler
        run: cargo test -p compiler-opt --test al05_p9_mixed_native_bridge --no-run
      - name: Execute P14 P15 P16 x86 with phase timing
        working-directory: compiler
        run: |
          set -euo pipefail
          for test in al05_p14_generated_dag_native_x86_elf_and_gas_match_c11 al05_p15_generated_phi_extremes_native_x86_elf_and_gas_match_c11 al05_p16_coverage_guided_native_x86_elf_gas_c11; do
            cargo test -p compiler-opt --test al05_p9_mixed_native_bridge "$test" -- --exact --nocapture 2>&1 | tee -a "$RUNNER_TEMP/native-timing.log"
            grep -F "test $test ... ok" "$RUNNER_TEMP/native-timing.log"
          done
          for phase in select-fixtures generate-and-cse emit-elf emit-gas compile-c11 link-elf link-gas execute-elf execute-gas native-total test-total; do
            grep -F "AL05_TEST_TIMING family=P16 arch=x86_64 phase=$phase elapsed_us=" "$RUNNER_TEMP/native-timing.log"
          done
          for format in elf gas; do
            grep -F "AL05_P16_COVERAGE_NATIVE_TARGET arch=x86_64 format=$format functions=48 changed_cse=24 selected=24 modes=8 seeds=8 coefficients=5 comparisons=22416 traps=96 verdict=PASS" "$RUNNER_TEMP/native-timing.log"
          done
          grep -F AL05_TEST_TIMING "$RUNNER_TEMP/native-timing.log" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-phase-timing
          path: ${{ runner.temp }}/native-timing.log
          retention-days: 90
