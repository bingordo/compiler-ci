name: Compiler IR and native correctness (compiler-ci)
# TEMPORARY candidate-only PR validation; do not merge this workflow edit.
on:
  pull_request:
    paths:
      - '.github/workflows/verify-compiler-core-correctness.yml'
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 9a790b612db5b345b75ac97d9521dce4e710baa2
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Verify exact candidate and isolate core workspace
        working-directory: compiler
        run: |
          set -eu
          git rev-parse HEAD
          test "$(git rev-parse HEAD)" = 9a790b612db5b345b75ac97d9521dce4e710baa2
          printf '[workspace]\nresolver = "2"\nmembers = ["crates/ir", "crates/opt", "crates/backend", "crates/backend-x86", "crates/backend-aarch64"]\n' > Cargo.toml
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: native-cfg-correctness-v1
          cache-workspace-crates: 'true'
      - name: Focused provenance and inliner regressions
        working-directory: compiler
        run: |
          set -eux
          cargo test -p compiler-ir --test source_context
          cargo test -p compiler-opt --test inline_provenance
          cargo test -p compiler-opt --lib typed_inline::tests
