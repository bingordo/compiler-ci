name: Compiler IR and native correctness (compiler-ci)

# The source repository may have no remaining Actions minutes. Check its
# immutable main SHA here instead; cached successes skip Cargo entirely.
on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: 'Compiler source ref (commit SHA, branch or tag)'
        required: false
        default: 'main'
        type: string
      force_recheck:
        description: 'Rerun tests even if this source and workflow passed'
        required: false
        default: false
        type: boolean
  schedule:
    - cron: '9,24,39,54 * * * *'
  pull_request:
    paths:
      - '.github/workflows/verify-compiler-core-correctness.yml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-compiler-core-correctness.yml'

permissions:
  contents: read

concurrency:
  # PR validations must not cancel scheduled/push verification of compiler main.
  group: compiler-native-correctness-${{ github.event.pull_request.number || github.event.inputs.source_ref || 'main' }}
  cancel-in-progress: true

jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 23
    steps:
      - name: Checkout workflow for cache-key versioning
        uses: actions/checkout@v4
      - name: Checkout private compiler source using read-only CI deploy key
        uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 70011f6afa2cab99e7ad54d157c5d755bf23a18e # TEMP exact compiler CFI lint fix, DO NOT MERGE
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Record exact source revision
        id: source
        shell: bash
        working-directory: compiler
        run: |
          set -euo pipefail
          sha="$(git rev-parse HEAD)"
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]]
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "Compiler source SHA: $sha"
          # Fail rather than silently accepting a moved/absent test suite.
          for test_source in \
            crates/opt/tests/native_cfg_differential.rs \
            crates/opt/tests/loop_trap_semantics.rs \
            crates/opt/tests/memory_execution_oracle.rs \
            crates/opt/tests/phi_native.rs \
            crates/backend-x86/tests/division_native.rs \
            crates/ir/tests/verifier_mutations.rs \
            crates/opt/tests/alias_phi_exhaustive.rs \
            crates/opt/tests/pre_licm_semantic_matrix.rs \
            crates/opt/tests/induction_native.rs \
            crates/opt/tests/pre_native.rs \
            crates/opt/tests/mem2reg_native.rs; do
            test -s "$test_source"
          done
      - name: Skip source revisions already proven by this workflow version
        id: validated
        uses: actions/cache/restore@v4
        with:
          path: .compiler-native-validated
          key: compiler-native-v1-${{ hashFiles('.github/workflows/verify-compiler-core-correctness.yml') }}-${{ steps.source.outputs.sha }}
          lookup-only: true
      - name: Report existing passing evidence
        if: steps.validated.outputs.cache-hit == 'true' && !inputs.force_recheck
        env:
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: echo "Unchanged source commit $SOURCE_SHA already passed all native CFG correctness checks." >> "$GITHUB_STEP_SUMMARY"
      - name: Use credential-independent source workspace
        if: steps.validated.outputs.cache-hit != 'true' || inputs.force_recheck
        shell: bash
        working-directory: compiler
        run: |
          set -euo pipefail
          # The source Cargo workspace otherwise resolves private Oberon even
          # for -p compiler-opt. This modifies only the runner checkout.
          python3 - <<'PY'
          from pathlib import Path
          Path('Cargo.toml').write_text("""[workspace]
          resolver = "2"
          members = ["crates/ir", "crates/opt", "crates/backend", "crates/backend-x86", "crates/backend-aarch64"]
          """)
          PY
      # Cargo may need to download a new dependency on a cold cache or after a lockfile change.
      # Never force --offline: rust-cache is an optimization, not a correctness dependency.
      - name: Reuse Rust compiler core object files
        if: steps.validated.outputs.cache-hit != 'true' || inputs.force_recheck
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: native-cfg-correctness-v1
          cache-workspace-crates: 'true'
      - name: FS-1 draft pointer roots, effects and actual TypeId optimizer observation barriers
        if: steps.validated.outputs.cache-hit != 'true' || inputs.force_recheck
        shell: bash
        working-directory: compiler
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=10s 5m \
            cargo test -p compiler-ir \
              --test semantics --test typed_memory_provenance -- --nocapture --test-threads=1 \
            2>&1 | tee "$RUNNER_TEMP/fs1-pointer-effects-ir.log"
          grep -F 'FS1_EFFECT_CLASS roots=9 offsets=8 checked=2 loads=5 stores=6 calls=5 pointer_cse_non_speculative=true unknown_calls=conservative verdict=PASS' \
            "$RUNNER_TEMP/fs1-pointer-effects-ir.log"
          grep -F 'FS1_POINTER_PROVENANCE valid=1 invalid=10 offset_mints_extent=false raw_pointer_mints_extent=false pointer_type_checks=6 verdict=PASS' \
            "$RUNNER_TEMP/fs1-pointer-effects-ir.log"
          timeout --signal=TERM --kill-after=10s 6m \
            cargo test -p compiler-opt --test fs1_effect_preservation -- --nocapture \
            2>&1 | tee "$RUNNER_TEMP/fs1-effect-preservation.log"
          grep -E 'FS1_EFFECT_TRACE modes=2 stages=[1-9][0-9]* events=7 external_calls=3 store_barriers=2 load_barriers=2 mutants=4 verdict=PASS' \
            "$RUNNER_TEMP/fs1-effect-preservation.log"
          grep -E 'FS1_BOUNDED_EXTERNAL_MOCK cases=76 modes=2 stages=[1-9][0-9]* observations=3 object=frame0_slot1 uninitialized=UNKNOWN unknown_external=UNKNOWN mutants=7 verdict=PASS' \
            "$RUNNER_TEMP/fs1-effect-preservation.log"
          timeout --signal=TERM --kill-after=10s 4m \
            cargo clippy -p compiler-ir --test semantics \
              --test typed_memory_provenance -- -D warnings
          timeout --signal=TERM --kill-after=10s 4m \
            cargo clippy -p compiler-opt --test fs1_effect_preservation -- -D warnings

      - name: Run native CFG and trap correctness tests
        if: steps.validated.outputs.cache-hit != 'true' || inputs.force_recheck
        shell: bash
        working-directory: compiler
        run: |
          set -euo pipefail
          cargo test -p compiler-opt \
            --test native_cfg_differential \
            --test loop_trap_semantics \
            --test memory_execution_oracle \
            --test phi_native -- --nocapture \
            2>&1 | tee "$RUNNER_TEMP/native-cfg-tests.log"
          # Avoid reporting false-green jobs that executed zero meaningful tests.
          grep -F 'test direct_elf_and_assembly_match_independent_trap_and_pointer_phi_oracles ... ok' "$RUNNER_TEMP/native-cfg-tests.log"
          grep -F 'test actual_optimizer_passes_preserve_loop_trap_semantics ... ok' "$RUNNER_TEMP/native-cfg-tests.log"
          cargo test -p compiler-backend-x86 --test division_native -- --nocapture \
            2>&1 | tee "$RUNNER_TEMP/native-division-tests.log"
          grep -F 'test signed_divide_quotient_remainder_and_register_lifetimes ... ok' "$RUNNER_TEMP/native-division-tests.log"
      - name: FS-1 draft exact-width scalar semantics exhaustive and generated checks
        if: steps.validated.outputs.cache-hit != 'true' || inputs.force_recheck
        shell: bash
        working-directory: compiler
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=10s 5m \
            cargo test -p compiler-ir --test fs1_scalar_semantics -- --nocapture --test-threads=1 \
            2>&1 | tee "$RUNNER_TEMP/fs1-scalar-semantics.log"
          grep -F 'FS1_SCALAR_DRAFT exhaustive_i8_pairs=65536 signed_unsigned_division=checked' \
            "$RUNNER_TEMP/fs1-scalar-semantics.log"
          grep -F 'FS1_SCALAR_DRAFT widths=8,16,32,64,128 shift_modulo=true trap_edges=true' \
            "$RUNNER_TEMP/fs1-scalar-semantics.log"
          grep -F 'FS1_SCALAR_DRAFT generated_width_cases=5120' \
            "$RUNNER_TEMP/fs1-scalar-semantics.log"
          grep -F 'FS1_SCALAR_DRAFT invalid_is_not_trap=true production_op_flags=aligned' \
            "$RUNNER_TEMP/fs1-scalar-semantics.log"
          grep -F 'FS1_SCALAR_BOOL_SELECT cases=60 constbool=2 eager_precomputed_operands=true production_flags=aligned verdict=PASS' \
            "$RUNNER_TEMP/fs1-scalar-semantics.log"
          grep -F 'FS1_CTZ_NOT cases=1578 widths=8,16,32,64,128 ctz_zero=width not=masked invalid=rejected flags=aligned verdict=PASS' \
            "$RUNNER_TEMP/fs1-scalar-semantics.log"
          grep -F 'FS1_CAST_MATRIX valid_pairs=30 invalid_pairs=45 observations=7950 widths=8,16,32,64,128 sign=host_i128 invalid=rejected verdict=PASS' \
            "$RUNNER_TEMP/fs1-scalar-semantics.log"
          timeout --signal=TERM --kill-after=10s 4m \
            cargo clippy -p compiler-ir --test fs1_scalar_semantics -- -D warnings

      - name: Verify SSA structural mutations and invalid IR are rejected
        if: steps.validated.outputs.cache-hit != 'true' || inputs.force_recheck
        shell: bash
        working-directory: compiler
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=10s 4m \
            cargo test -p compiler-ir --test verifier_mutations -- --nocapture \
            2>&1 | tee "$RUNNER_TEMP/ssa-verifier-tests.log"
          grep -F 'test verifier_rejects_deterministic_cfg_corruptions_without_panicking ... ok' "$RUNNER_TEMP/ssa-verifier-tests.log"
          grep -F 'test pointer_phi_and_allocation_provenance_negative_matrix ... ok' "$RUNNER_TEMP/ssa-verifier-tests.log"
      - name: Verify loop, alias, PRE, induction, and mem2reg correctness
        if: steps.validated.outputs.cache-hit != 'true' || inputs.force_recheck
        shell: bash
        working-directory: compiler
        run: |
          set -euo pipefail
          # Run the five regression binaries in a single Cargo invocation.
          # These test IR equivalence, native outputs, and explicit refusal of
          # unsafe transforms; do not add performance timings to this gate.
          timeout --signal=TERM --kill-after=10s 9m \
            cargo test -p compiler-opt --features compiler-backend-x86/historical-function-oracle \
              --test alias_phi_exhaustive \
              --test pre_licm_semantic_matrix \
              --test induction_native \
              --test pre_native \
              --test mem2reg_native \
              -- --nocapture \
            2>&1 | tee "$RUNNER_TEMP/extended-opt-tests.log"
          grep -F 'test exhaustive_small_phi_hulls_never_miss_real_may_alias ... ok' "$RUNNER_TEMP/extended-opt-tests.log"
          grep -F 'test pre_licm_mixed_order_semantics_matrix ... ok' "$RUNNER_TEMP/extended-opt-tests.log"
          grep -F 'optimizer_preserves_nested_and_multilatch_oracles ... ok' "$RUNNER_TEMP/extended-opt-tests.log"
          grep -F 'test native_assembly_and_elf_match_independent_unsigned_c_reference ... ok' "$RUNNER_TEMP/extended-opt-tests.log"
          grep -F 'test native_asm_and_direct_elf_match_unoptimized_and_wrapping_c ... ok' "$RUNNER_TEMP/extended-opt-tests.log"
          grep -F 'test promoted_loop_and_mixed_array_execute_identically_from_both_native_formats ... ok' "$RUNNER_TEMP/extended-opt-tests.log"
      - name: AL-05 cross toolchain for native ELF/GAS differential
        if: steps.validated.outputs.cache-hit != 'true' || inputs.force_recheck
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            gcc-aarch64-linux-gnu libc6-dev-arm64-cross qemu-user
          aarch64-linux-gnu-gcc --version
          qemu-aarch64 --version
      - name: AL-05 native x86 and AArch64 ELF/GAS with strict C11 oracle
        if: steps.validated.outputs.cache-hit != 'true' || inputs.force_recheck
        shell: bash
        working-directory: compiler
        env:
          AL05_REQUIRE_AARCH64: '1'
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=10s 9m \
            cargo test -p compiler-opt --test al05_native_bridge -- --nocapture \
            2>&1 | tee "$RUNNER_TEMP/al05-native-bridge.log"
          for arch in x86_64 aarch64; do
            for format in elf gas; do
              grep -F "AL05_NATIVE_TARGET arch=$arch format=$format functions=8 changed_cse=4 comparisons=3736 traps=16 verdict=PASS" \
                "$RUNNER_TEMP/al05-native-bridge.log"
            done
          done

      - name: AL-05 affine TypeId native x86/AArch64 ELF and GAS C11 differential
        if: steps.validated.outputs.cache-hit != 'true' || inputs.force_recheck
        shell: bash
        working-directory: compiler
        env:
          AL05_REQUIRE_AARCH64: '1'
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=10s 9m \
            cargo test -p compiler-opt --test al05_affine_native_bridge -- --nocapture \
            2>&1 | tee "$RUNNER_TEMP/al05-affine-native-bridge.log"
          for arch in x86_64 aarch64; do
            for format in elf gas; do
              grep -F "AL05_AFFINE_NATIVE_TARGET arch=$arch format=$format functions=8 changed_cse=4 comparisons=3736 traps=16 verdict=PASS" \
                "$RUNNER_TEMP/al05-affine-native-bridge.log"
            done
          done

      - name: Permanent AL-05.P3 native x86/AArch64 TypeId ELF/GAS + independent C11
        if: steps.validated.outputs.cache-hit != 'true' || inputs.force_recheck
        shell: bash
        working-directory: compiler
        env:
          AL05_REQUIRE_AARCH64: '1'
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=10s 9m \
            cargo test -p compiler-opt --test al05_parameterized_native_bridge -- --nocapture \
            2>&1 | tee "$RUNNER_TEMP/al05-param-native-bridge.log"
          for arch in x86_64 aarch64; do
            for format in elf gas; do
              grep -F "AL05_PARAM_NATIVE_TARGET arch=$arch format=$format functions=8 changed_cse=4 comparisons=3736 traps=16 verdict=PASS" \
                "$RUNNER_TEMP/al05-param-native-bridge.log"
            done
          done

      # Permanent AL-05.P6 split-body native ELF/GAS C11 differential.
      - name: AL-05.P6 split-body TypeId x86/AArch64 ELF/GAS native C11 differential
        if: steps.validated.outputs.cache-hit != 'true' || inputs.force_recheck
        shell: bash
        working-directory: compiler
        env:
          AL05_REQUIRE_AARCH64: '1'
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=10s 9m \
            cargo test -p compiler-opt --test al05_linear_native_bridge -- --nocapture \
            2>&1 | tee "$RUNNER_TEMP/al05-linear-native-bridge.log"
          for arch in x86_64 aarch64; do
            for format in elf gas; do
              grep -F "AL05_LINEAR_NATIVE_TARGET arch=$arch format=$format functions=8 changed_cse=4 comparisons=3736 traps=16 verdict=PASS" \
                "$RUNNER_TEMP/al05-linear-native-bridge.log"
            done
          done

      # Permanent AL-05.P7 x86/AArch64 TypeId diamond C11 differential.
      - name: AL-05.P7 diamond x86/AArch64 direct ELF/GAS native C11 differential
        if: steps.validated.outputs.cache-hit != 'true' || inputs.force_recheck
        shell: bash
        working-directory: compiler
        env:
          AL05_REQUIRE_AARCH64: '1'
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=10s 9m \
            cargo test -p compiler-opt --test al05_diamond_native_bridge -- --nocapture \
            2>&1 | tee "$RUNNER_TEMP/al05-diamond-native-bridge.log"
          for arch in x86_64 aarch64; do
            for format in elf gas; do
              grep -F "AL05_DIAMOND_NATIVE_TARGET arch=$arch format=$format functions=8 changed_cse=4 comparisons=3736 traps=16 verdict=PASS" \
                "$RUNNER_TEMP/al05-diamond-native-bridge.log"
            done
          done

      # Recheck merged compiler source after ELF strict-Clippy compatibility fix f159a14640d87213b713bf0213ca5b190c7536a3.
      # Permanent AL-05.P8 x86/AArch64 two-diamond C11 native differential.
      - name: AL-05.P8 two-diamond x86/AArch64 ELF/GAS native C11 differential
        if: steps.validated.outputs.cache-hit != 'true' || inputs.force_recheck
        shell: bash
        working-directory: compiler
        env:
          AL05_REQUIRE_AARCH64: '1'
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=10s 9m \
            cargo test -p compiler-opt --test al05_dag_native_bridge -- --nocapture \
            2>&1 | tee "$RUNNER_TEMP/al05-p8-native-dag.log"
          for arch in x86_64 aarch64; do
            for format in elf gas; do
              grep -F "AL05_DAG_NATIVE_TARGET arch=$arch format=$format functions=8 changed_cse=4 comparisons=3736 traps=16 verdict=PASS" \
                "$RUNNER_TEMP/al05-p8-native-dag.log"
            done
          done

      # Permanent AL-05.P9 eight/six-path mixed native C11 differential.
      - name: AL-05.P9 mixed eight/six-path x86/AArch64 ELF/GAS native C11
        if: steps.validated.outputs.cache-hit != 'true' || inputs.force_recheck
        shell: bash
        working-directory: compiler
        env:
          AL05_REQUIRE_AARCH64: '1'
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=10s 9m \
            cargo test -p compiler-opt --test al05_p9_mixed_native_bridge -- --nocapture \
            2>&1 | tee "$RUNNER_TEMP/al05-p9-mixed-native.log"
          for arch in x86_64 aarch64; do
            for format in elf gas; do
              grep -F "AL05_P9_MIXED_NATIVE_TARGET arch=$arch format=$format functions=8 changed_cse=4 comparisons=3736 traps=16 verdict=PASS" \
                "$RUNNER_TEMP/al05-p9-mixed-native.log"
            done
          done

      - name: Record successful exact source SHA
        if: success() && (steps.validated.outputs.cache-hit != 'true' || inputs.force_recheck)
        shell: bash
        env:
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          mkdir -p .compiler-native-validated
          printf '%s\n' "$SOURCE_SHA" > .compiler-native-validated/source-sha.txt
          printf 'SSA verifier, alias PHIs, nested/loop PRE, induction, mem2reg, CFG traps, pointer PHIs, signed division verified: %s\n' "$SOURCE_SHA" >> "$GITHUB_STEP_SUMMARY"
      - name: Cache successful evidence for the exact source revision
        if: success() && steps.validated.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .compiler-native-validated
          key: compiler-native-v1-${{ hashFiles('.github/workflows/verify-compiler-core-correctness.yml') }}-${{ steps.source.outputs.sha }}
      - name: Preserve native differential failure logs and reproducers
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: compiler-native-cfg-failures
          path: |
            ${{ runner.temp }}/native-cfg-tests.log
            ${{ runner.temp }}/native-division-tests.log
            ${{ runner.temp }}/ssa-verifier-tests.log
            ${{ runner.temp }}/fs1-scalar-semantics.log
            ${{ runner.temp }}/fs1-pointer-effects-ir.log
            ${{ runner.temp }}/fs1-effect-preservation.log
            ${{ runner.temp }}/extended-opt-tests.log
            ${{ runner.temp }}/al05-native-bridge.log
            ${{ runner.temp }}/al05-affine-native-bridge.log
            ${{ runner.temp }}/al05-param-native-bridge.log
            ${{ runner.temp }}/al05-linear-native-bridge.log
            ${{ runner.temp }}/al05-diamond-native-bridge.log
            ${{ runner.temp }}/al05-p8-native-dag.log
            /tmp/al05-native-*/
            /tmp/al05-affine-native-*/
            /tmp/al05-param-native-*/
            /tmp/compiler-native-cfg-differential-*/
          if-no-files-found: ignore
          retention-days: 14
