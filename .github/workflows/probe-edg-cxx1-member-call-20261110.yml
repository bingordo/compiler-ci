name: EDG C++1 local member call source-owned operands probe

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/probe-edg-cxx1-member-call-20261110.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: edg-cxx1-member-call-probe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  direct-edg:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    container:
      image: ghcr.io/edgcpp/ci-runner@sha256:14b3948c2ce12cfa5472e5a6c468393d15426f3a67685cc35d830ea5db2acdf8
    defaults:
      run:
        shell: edg-container-exec "bash -eo pipefail {0}"
    env:
      EDG_SOURCE_SHA: 799603e0b5ab272d9418e2d44a53a95bc73dfdc4
      EDG_RELEASE_TAG: edgcpfe-ci-799603e0b5ab
      EDG_RELEASE_SHA256: fa769825e70766fbefe017806816b2338acd03daa93bb5562369c293972ce64c
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      RUST_TOOLCHAIN_VERSION: 1.99.1
    steps:
      - name: Checkout private compiler pilot with scoped CI key
        uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: e1a1bdc000ad29b8bee07ed746390685f22442d2
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false

      - name: Check out exact EDG headers and configuration
        uses: actions/checkout@v7
        with:
          repository: bingundu/edgcpp
          ref: 799603e0b5ab272d9418e2d44a53a95bc73dfdc4
          path: edgcpp
          persist-credentials: false

      - name: Record compiler and EDG source revision
        run: |
          test "$(git -C edgcpp rev-parse HEAD)" = "$EDG_SOURCE_SHA"
          git -C compiler rev-parse HEAD | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Configure matching EDG native metadata only
        env:
          EDG_BASE: ${{ github.workspace }}/edgcpp/bases/docker/dev-env/gcc
        working-directory: edgcpp
        run: |
          cmake --preset linux-gcc-release \
            -DEDG_BUILD_LIB=OFF \
            -DEDG_BUILD_CALLABLE_LIBRARY=ON \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
          cmake --build build/gcc-release --target error-info --parallel 2

      - name: Restore exact EDG prebuilt native archive
        working-directory: edgcpp
        run: |
          set -euo pipefail
          url="https://github.com/bingundu/edgcpp/releases/download/$EDG_RELEASE_TAG/edgcpfe-ci-x86_64-callable-release-linux-x86_64.tar.gz"
          mkdir -p build/gcc-release/lib build/prebuilt-edg
          curl --fail --location --silent --show-error --retry 4 --retry-delay 2 \
            "$url" --output build/prebuilt-edg/archive.tar.gz
          printf '%s  %s\n' "$EDG_RELEASE_SHA256" build/prebuilt-edg/archive.tar.gz | sha256sum --check --status
          tar -xzf build/prebuilt-edg/archive.tar.gz -C build/prebuilt-edg
          grep -Fx "commit=$EDG_SOURCE_SHA" build/prebuilt-edg/BUILD-INFO.txt
          grep -Fx 'platform=linux-x86_64' build/prebuilt-edg/BUILD-INFO.txt
          test -s build/prebuilt-edg/lib/libedgcpfe.a
          cp build/prebuilt-edg/lib/libedgcpfe.a build/gcc-release/lib/libedgcpfe.a

      - name: Check out C++0 EDG linker-symbol export candidate
        uses: actions/checkout@v4
        with:
          repository: bingordo/edgcpp-rust
          ref: cbbce8db01722b7cc72edda073990718a2350107
          path: edg-rust
          persist-credentials: false

      - name: Install pinned Rust toolchain
        run: |
          if ! command -v cargo >/dev/null; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | \
              sh -s -- -y --profile minimal --default-toolchain "$RUST_TOOLCHAIN_VERSION"
          fi
          export PATH="$HOME/.cargo/bin:$PATH"
          rustup toolchain install "$RUST_TOOLCHAIN_VERSION" --profile minimal
          rustup default "$RUST_TOOLCHAIN_VERSION"

      - name: Capture source-authored direct member call operand and ABI shape
        working-directory: edgcpp/build/gcc-release
        env:
          EDGCPP_SOURCE_DIR: ${{ github.workspace }}/edgcpp
          EDGCPP_COMPILE_COMMANDS: ${{ github.workspace }}/edgcpp/build/gcc-release/compile_commands.json
          EDGCPP_LIB_DIR: ${{ github.workspace }}/edgcpp/build/gcc-release/lib
          EDGCPP_EDG_REVISION: ${{ env.EDG_SOURCE_SHA }}
        run: |
          set -euo pipefail
          export PATH="$HOME/.cargo/bin:$PATH"
          source ./environment.sh
          cp ../../../compiler/tools/edg-driver/tests/fixtures/edg_native_cxx1_member_call*.cpp .
          g++ -std=c++17 -O2 -Wall -Wextra -Werror -c edg_native_cxx1_member_call.cpp -o gxx-call.o
          g++ -std=c++17 -O2 -Wall -Wextra -Werror -c edg_native_cxx1_member_call_driver.cpp -o gxx-driver.o
          g++ gxx-call.o gxx-driver.o -o gxx-reference
          ./gxx-reference
          cargo run --quiet --manifest-path ../../../edg-rust/Cargo.toml --example parse -- edg_native_cxx1_member_call.cpp > call-parse.log 2>&1 || { cat call-parse.log; exit 1; }
          cat > ../../../edg-rust/examples/native_member_call_probe.rs <<'RS'
          use edgcpp::{compile,graph::{Graph,ExpressionId}};
          fn main() -> Result<(),Box<dyn std::error::Error>> {
              let args:Vec<_>=std::iter::once("edgcpfe".to_string()).chain(std::env::args().skip(1)).collect();
              let unit=compile(&args).map_err(|e|format!("{e:?}"))?;
              if unit.status!=0 {return Err(format!("EDG status {}",unit.status).into())}
              let graph=Graph::from_il(&unit.il).map_err(|e|format!("{e:?}"))?;
              for (i,node) in graph.expressions.iter().enumerate() {
                  if let Some(call)=graph.call_at(ExpressionId(i)) {
                      println!("P1B_CALL parent={:?} function={} path={} first_argument={} operands={}",
                          i,node.data.function,node.data.path,call.first_argument,node.operands.len());
                      for (n,&child) in node.operands.iter().enumerate() {
                          let c=graph.expression(child).ok_or("missing call child")?;
                          println!("P1B_ARG idx={} data={:?} operands={:?}",n,c.data,c.operands);
                          for (j,&grand) in c.operands.iter().enumerate() {
                              let g=graph.expression(grand).ok_or("missing grandchild")?;
                              println!("P1B_GRAND idx={}.{} data={:?} operands={:?}",n,j,g.data,g.operands);
                          }
                      }
                  }
              }
              for p in &unit.il.function_parameters {println!("P1B_FORMAL {:?}",p);}
              for m in &unit.il.member_functions {println!("P1B_METHOD {:?}",m);}
              for r in &unit.il.routine_attributes {println!("P1B_ATTRIBUTES {:?}",r);}
              for v in &unit.il.cxx_record_admissions {println!("P1B_ADMISSION {:?}",v);}
              for v in &unit.il.record_fields {println!("P1B_FIELD {:?}",v);}
              for v in &unit.il.local_variables {println!("P1B_LOCAL {:?}",v);}
              for v in &unit.il.type_parameters {println!("P1B_TYPE_PARAM {:?}",v);}
              for v in &unit.il.symbol_link_names {println!("P1B_LINK {:?}",v);}
              Ok(())
          }
          RS
          cargo run --quiet --manifest-path ../../../edg-rust/Cargo.toml --example native_member_call_probe -- edg_native_cxx1_member_call.cpp > call-operands.log 2>&1 || { cat call-operands.log; exit 1; }
          echo "P1B_CALL_PROBE_BEGIN"
          cat call-operands.log
          echo "P1B_CALL_PROBE_END"
          grep -Fq 'P1B_CALL' call-operands.log
          grep -Fq 'first_argument=2' call-operands.log

      - name: Keep C++ P1b source and exact member call IR
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: edg-p1b-member-call-probe
          path: |
            edgcpp/build/gcc-release/call-parse.log
            edgcpp/build/gcc-release/call-operands.log
          if-no-files-found: ignore
