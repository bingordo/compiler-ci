# Temporary exact-source TypeId if-conversion quality parity.
name: BT4 remaining TypeId nested/dead/CT05f CMOV parity
on:
  pull_request:
    paths: ['.github/workflows/ir-bt4-remaining-cmov-pr1736.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-cmov:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      CARGO_INCREMENTAL: '0'
      SOURCE_SHA: a050524f4f070585b5cf23e798204f7de53ab7ad
    steps:
      - name: Checkout exact compiler commit
        uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: a050524f4f070585b5cf23e798204f7de53ab7ad
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Verify source and narrow workspace
        run: |
          set -euo pipefail
          test "$(git -C compiler rev-parse HEAD)" = "$SOURCE_SHA"
          cat > compiler/Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir", "crates/opt", "crates/backend", "crates/backend-x86", "crates/backend-aarch64"]
          EOF
          rm -f compiler/Cargo.lock
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: bt4-typeid-nested-cmov
      - name: Original remaining nested/dead/CT05f TypeId physical and C oracles
        working-directory: compiler
        run: cargo test -p compiler-opt --test if_conversion_typeid_remaining -- --nocapture
      - name: Existing native CMOV, flag, predicate and pressure oracles
        working-directory: compiler
        run: |
          set -euo pipefail
          cargo test -p compiler-opt --test if_conversion_typeid_multimerge --test if_conversion_typeid_x86 --test typed_if_conversion_native
          cargo test -p compiler-backend-x86 --test native_typeid_select_cmov
      - name: Verify legacy test was retired only after native source-owned replacement
        working-directory: compiler
        run: |
          test ! -e crates/opt/tests/if_conversion_native.rs
          test -f crates/opt/tests/if_conversion_typeid_remaining.rs
      - name: Existing native LEA signed-index memory folding and quality oracles
        working-directory: compiler
        run: cargo test -p compiler-backend-x86 --test lea_indexed_native --test lea_memory_native --test lea_patterns_native --test x7_shared_signed_index_native
      - name: All-target compilation of core backends and optimizer
        working-directory: compiler
        run: cargo check -p compiler-ir -p compiler-opt -p compiler-backend -p compiler-backend-x86 -p compiler-backend-aarch64 --all-targets
      - name: Strict new native CMOV oracle Clippy
        working-directory: compiler
        run: cargo clippy -p compiler-opt --test if_conversion_typeid_remaining -- -D warnings -A private_interfaces
