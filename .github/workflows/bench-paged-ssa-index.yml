name: One-off paged SSA index validation
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/bench-paged-ssa-index.yml'
permissions:
  contents: read
jobs:
  validate:
    if: github.head_ref == 'bench/paged-ssa-index' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 6b0ab2a82213810e393b17eadf3746abc3340169
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: paged-ssa-index
      - name: Validate SSA lookup, verifiers and optimizer
        working-directory: compiler
        run: |
          set -euo pipefail
          git rev-parse HEAD
          git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
          cargo test --release -p compiler-ir --lib
          cargo test --release -p compiler-ir --test typed_value_flow --test typed_verifier_generated --test typed_verifier_parity
          cargo test --release -p compiler-opt --lib
          cargo clippy -p compiler-ir --lib -- -D warnings
          cargo check --workspace
