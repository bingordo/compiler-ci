# Temporary source-pinned validation only; never merge into compiler-ci main.
name: IR PR3226 algebra retirement exact source validation
on:
  push:
    branches:
      - verify-ir-algebra-retirement-3226-20261125
    paths:
      - '.github/workflows/ir-pr3226-algebra-retirement.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      SOURCE_SHA: 8cb7fa3f4b7ea3e9d0b21b92cb67977d566a70a0
      CARGO_INCREMENTAL: '0'
      CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
    steps:
      - name: Check out exact compiler PR head
        uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: ${{ env.SOURCE_SHA }}
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Pin source and isolate Rust workspace
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C compiler rev-parse HEAD)" = "$SOURCE_SHA"
          cat > compiler/Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir", "crates/opt", "crates/backend", "crates/backend-x86", "crates/backend-aarch64", "crates/backend-riscv"]
          EOF
          rm -f compiler/Cargo.lock
          rustc --version
          cargo --version
      - name: Cache build dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: ir-pr3226-retirement
      - name: Verify native TypeId optimizer and retirement regressions
        working-directory: compiler
        shell: bash
        run: |
          set -euo pipefail
          cargo test -p compiler-opt --test retired_algebra_api
          cargo test -p compiler-opt --test typed_algebra
          cargo test -p compiler-opt --test affine_cancellation
          cargo test -p compiler-opt --test alive_lite
          cargo test -p compiler-opt --lib experimental_generated_rules
          cargo test -p compiler-opt --all-features --test retired_algebra_api
          cargo check -p compiler-opt --all-targets
          cargo check -p compiler-backend-x86 --all-targets
          cargo check -p compiler-backend-aarch64 --all-targets
          cargo check -p compiler-backend-riscv --all-targets
      - name: Check experimental generated-rule example compile
        working-directory: compiler
        shell: bash
        run: |
          set -euo pipefail
          cargo check -p compiler-opt --features experimental-generated-rules --example compare_generated_rules
      - name: Strict scoped Clippy
        working-directory: compiler
        shell: bash
        run: |
          set -euo pipefail
          cargo clippy -p compiler-opt --lib -- -D warnings
          cargo clippy -p compiler-opt --test retired_algebra_api --test typed_algebra --test affine_cancellation -- -D warnings
