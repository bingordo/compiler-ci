name: AArch64 A3.6 pinned original AARCHMRS condition AST survey
on:
  pull_request:
    paths:
      - '.github/workflows/aarch64-a36-condition-shapes.yml'
permissions:
  contents: read
jobs:
  survey:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Download exact original AARCHMRS encoding source
        run: |
          set -euo pipefail
          curl -fLsS --retry 3 --connect-timeout 20 --max-time 240 \
            'https://kernel.googlesource.com/pub/scm/linux/kernel/git/maz/AARCHMRS/+/1346b16d47619400448f3cb6d4f22d62d3b76848/Instructions.json?format=TEXT' \
            -o /tmp/arm-instructions.b64
          base64 -d /tmp/arm-instructions.b64 > /tmp/arm-instructions.json
          echo 'ef75f3ec02df1b9b9c0612f4ea259d6710ac3de686b097d8f9c83d1d97aa800a  /tmp/arm-instructions.json' | sha256sum -c -
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 358d9f51f9c2c315e8c8c3cb9ca6a6b567cf9d12
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Validate generic source guard interpreter
        run: |
          set -euo pipefail
          test "$(git -C compiler rev-parse HEAD)" = 358d9f51f9c2c315e8c8c3cb9ca6a6b567cf9d12
          python3 -m unittest discover -s compiler/tools -p 'test_aarch64_a36_source_guards.py' -v
          python3 -m unittest discover -s compiler/tools -p 'test_aarch64_a35_candidate_bridge.py' -v
          python3 -m unittest discover -s compiler/tools -p 'test_aarch64_mrs_catalog.py' -v
          python3 compiler/tools/aarch64_mrs_catalog.py \
            --instructions /tmp/arm-instructions.json \
            --expect-sha256 ef75f3ec02df1b9b9c0612f4ea259d6710ac3de686b097d8f9c83d1d97aa800a \
            --out /tmp/aarchmrs-catalog.json
          python3 compiler/tools/aarch64_a36_source_guards.py \
            --original-instructions /tmp/arm-instructions.json \
            --catalog /tmp/aarchmrs-catalog.json \
            --reviewed compiler/data/aarch64_scalar_gp_forms.json \
            --out /tmp/aarch64-a36-guards.json
          python3 - <<'PY'
          import json
          j=json.load(open('/tmp/aarch64-a36-guards.json'))
          assert j['original_leaf_count']==4429
          assert j['reviewed_form_count']==12
          assert sum(j['catalog_wide_static_guard_counts'].values())==4429
          assert j['guard_true_form_count']==12
          assert j['guard_unresolved_form_count']==0
          assert not j['selection_eligible'] and not j['condition_resolution_is_semantic_proof']
          assert all(not f['selection_eligible'] and all(not m['selection_eligible'] and not m['semantic_equivalence_proven'] for m in f['source_matches']) for f in j['forms'])
          print('A36_PINNED_REVIEWED_ORIGINAL_GUARDS',
                j['guard_true_form_count'],j['guard_unresolved_form_count'])
          print('A36_GUARD_OUTCOMES',[(f['operation'],f['width_bits'],
              [(m['source_guard_count'],m['condition_verdicts'],m['source_guard_verdict']) for m in f['source_matches']])
              for f in j['forms']])
          PY
      - name: Inspect original conditions without opcode-specific interpretations
        run: |
          python3 - <<'PY'
          import collections,hashlib,json
          x=json.load(open('/tmp/arm-instructions.json'))
          kinds=collections.Counter()
          samples={}
          byname={}
          counts=collections.Counter()
          leaves=[]
          def scan(n,path,conditions):
              if not isinstance(n,dict):return
              typ=n.get('_type')
              if typ not in ('Instruction.InstructionSet','Instruction.InstructionGroup','Instruction.Instruction'):
                  return
              name=n.get('name','?')
              here=path+'/'+str(name)
              cond=n.get('condition')
              if cond is not None:
                  counts['nodes_with_guard']+=1
                  def ast_walk(v,depth=0):
                      if depth>16:return
                      if isinstance(v,dict):
                          name=v.get('_type',type(v).__name__)
                          kinds[str(name)]+=1
                          samples.setdefault(str(name),sorted(v.keys()))
                          byname.setdefault(str(name),str(v)[:500])
                          for k,c in v.items():
                              if k not in ('_type',):ast_walk(c,depth+1)
                      elif isinstance(v,list):
                          for sub in v[:60]:ast_walk(sub,depth+1)
                  ast_walk(cond)
                  conditions=conditions+(cond,)
              if typ=='Instruction.Instruction':
                  counts['leaves']+=1
                  if conditions and len(leaves)<20:
                      leaves.append((here,len(conditions),[(str(c)[:500]) for c in conditions]))
              for child in n.get('children',[]):
                  scan(child,here,conditions)
          for root in x['instructions']:
              if root.get('name')=='A64':
                  scan(root,'',())
          print('A36_ORIGINAL_GUARD_AST_KINDS',kinds.most_common(35))
          print('A36_ORIGINAL_GUARD_AST_FIELDS',list(samples.items())[:40])
          print('A36_ORIGINAL_GUARD_AST_SAMPLES',list(byname.items())[:18])
          print('A36_ORIGINAL_GUARD_LEAF_SAMPLES',leaves[:12])
          print('A36_ORIGINAL_GUARD_COUNTS',dict(counts))
          PY
