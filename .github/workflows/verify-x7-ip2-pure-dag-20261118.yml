name: X7 IP-2 pure symbolic DAG candidate gate
on:
  pull_request:
    paths:
      - '.github/workflows/verify-x7-ip2-pure-dag-20261118.yml'
permissions:
  contents: read
jobs:
  ip2-generic-candidates:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 3dfc5020b891020a1a73467b78e46bbcf15a9a47
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Exact-source generated ISL DAG differential and candidate tests
        working-directory: compiler
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "3dfc5020b891020a1a73467b78e46bbcf15a9a47"
          python3 -m py_compile tools/x7_ip2_pure_dag_candidates.py tools/test_x7_ip2_pure_dag_candidates.py
          PYTHONPATH=tools python3 -m unittest -v test_x7_ip2_pure_dag_candidates test_x86_isl_symbolic_dag
          echo X7_IP2_OFFLINE_PURE_CANDIDATES_GREEN
