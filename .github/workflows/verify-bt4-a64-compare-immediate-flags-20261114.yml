name: BT4 AArch64 TypeId CMP immediate and ADD SUB flags loop quality - exact source pin
on:
  pull_request:
    paths:
      - '.github/workflows/verify-bt4-a64-compare-immediate-flags-20261114.yml'
permissions:
  contents: read
jobs:
  native-arm:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.CI_KEY }}
      - run: ssh-keyscan github.com >> ~/.ssh/known_hosts
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 21a566b8ba90c9787f95635198dca5fbecdae5a7
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - run: |
          test "$(git -C compiler rev-parse HEAD)" = 21a566b8ba90c9787f95635198dca5fbecdae5a7
          test "$(uname -m)" = aarch64
          command -v cc
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler
          key: bt4-a64-compare-immediate-flags-arm
      - name: Whole-workspace all-target typecheck (existing unrelated lint warnings permitted)
        working-directory: compiler
        run: cargo check --workspace --all-targets
      - name: Warnings-denied IR/shared-backend/AArch64 all-target typecheck
        working-directory: compiler
        run: RUSTFLAGS="-D warnings" cargo check -p compiler-ir -p compiler-backend -p compiler-backend-aarch64 --all-targets
      - name: Four original compare imm ADDS SUBS TypeId machine SSA and C11 oracles on ARM
        working-directory: compiler
        run: |
          cargo test -p compiler-backend-aarch64 --test compare_immediate_branch_native -- --nocapture
          cargo test -p compiler-backend-aarch64 --test subs_immediate_native -- --nocapture
          cargo test -p compiler-backend-aarch64 --test adds_loop_native -- --nocapture
          cargo test -p compiler-backend-aarch64 --test subs_loop_native -- --nocapture
      - name: Full backend all-target suite
        working-directory: compiler
        run: cargo test -p compiler-backend-aarch64 --all-targets -- --test-threads=2
      - name: Strict all-target Clippy
        working-directory: compiler
        run: cargo clippy -p compiler-backend-aarch64 --all-targets -- -D warnings
  qemu:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc-aarch64-linux-gnu libc6-dev-arm64-cross linux-libc-dev-arm64-cross binutils-aarch64-linux-gnu qemu-user
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.CI_KEY }}
      - run: ssh-keyscan github.com >> ~/.ssh/known_hosts
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 21a566b8ba90c9787f95635198dca5fbecdae5a7
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - run: test "$(git -C compiler rev-parse HEAD)" = 21a566b8ba90c9787f95635198dca5fbecdae5a7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler
          key: bt4-a64-compare-immediate-flags-qemu
      - name: Four TypeId compare immediate ADDS SUBS C11 and branch quality oracles in QEMU
        working-directory: compiler
        env:
          COMPILER_REQUIRE_AARCH64_QEMU: "1"
        run: |
          cargo test -p compiler-backend-aarch64 --test compare_immediate_branch_native -- --nocapture
          cargo test -p compiler-backend-aarch64 --test subs_immediate_native -- --nocapture
          cargo test -p compiler-backend-aarch64 --test adds_loop_native -- --nocapture
          cargo test -p compiler-backend-aarch64 --test subs_loop_native -- --nocapture
