name: LTO single Mini-C frontend lowering
on:
  push:
    branches: [verify/lto-single-mini-c-lowering-20261115]
    paths: ['.github/workflows/lto-single-mini-c-lowering-20261115.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  coemit:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 2547373bc036b0c10affe1e08ae46a90aa47b6cf
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Verify pinned source and public Git dependencies
        run: |
          test "$(git -C compiler rev-parse HEAD)" = "2547373bc036b0c10affe1e08ae46a90aa47b6cf"
          git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
      - name: Isolate native driver workspace
        run: |
          cat > compiler/Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir", "crates/opt", "crates/backend", "crates/backend-x86", "crates/backend-aarch64", "crates/driver"]
          EOF
          rm -f compiler/Cargo.lock
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: lto-single-mini-c-lowering
      - name: Check coemission parity and existing LTO execution
        working-directory: compiler
        run: |
          cargo test -p compiler --test lto_coemit -- --nocapture
          cargo test -p compiler --test lto_mixed_link
          cargo test -p compiler --test lto_source_sidecar
          cargo test -p compiler --test lto_generated_multitu
          cargo test -p compiler --test lto_generated_abi_memory
          cargo test -p compiler --test lto_fnptr_stack_abi
          cargo test -p compiler --test lto_cli
      - name: Strict coemission lint
        working-directory: compiler
        run: cargo clippy -p compiler --test lto_coemit -- -D warnings
