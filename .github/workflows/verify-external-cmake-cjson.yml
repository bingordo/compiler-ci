# External-project acceptance: an unmodified, independently maintained CMake C project.
# A successful GCC baseline is mandatory. TypeId failures are recorded as gaps,
# not mistaken for a passing TypeId build; no generated project source is patched.
name: External CMake project - cJSON compatibility baseline
on:
  workflow_dispatch:
    inputs:
      compiler_sha:
        description: 'Exact bingordo/compiler revision (defaults to verified baseline)'
        required: false
        type: string
        default: '41ba00f60b00adc58d969df85c4ac44d34094a1f'
  pull_request:
    paths: ['.github/workflows/verify-external-cmake-cjson.yml']
permissions:
  contents: read
jobs:
  cjson-native-acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: ${{ inputs.compiler_sha || '41ba00f60b00adc58d969df85c4ac44d34094a1f' }}
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.CI_KEY }}
      - name: Build source-pinned main TypeId compiler
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=10s 14m \
            cargo build -p compiler --bin compiler --manifest-path compiler/Cargo.toml
      - name: Fetch pinned upstream cJSON v1.7.19 without source changes
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch v1.7.19 https://github.com/DaveGamble/cJSON.git cjson
          git -C cjson rev-parse HEAD | tee cjson-upstream-revision.txt
          test "$(cat cjson-upstream-revision.txt)" = c859b25da02955fef659d658b8f324b5cde87be3
          test -s cjson/cJSON.c
          test -s cjson/CMakeLists.txt
      - name: Write independent host-compiled cJSON runtime oracle
        shell: bash
        run: |
          set -euo pipefail
          cat > cjson-smoke.c <<'EOF'
          #include "cJSON.h"
          int main(void) {
            cJSON *root = cJSON_Parse("{\"answer\":42,\"ok\":true}");
            if (!root) return 1;
            const cJSON *answer = cJSON_GetObjectItemCaseSensitive(root, "answer");
            int success = cJSON_IsNumber(answer) && answer->valueint == 42;
            cJSON_Delete(root);
            return success ? 0 : 2;
          }
          EOF
      - name: Require independent GCC native static-library baseline
        shell: bash
        run: |
          set -euo pipefail
          cmake -S cjson -B cjson-gcc -G Ninja \
            -DCMAKE_C_COMPILER=cc \
            -DBUILD_SHARED_LIBS=OFF \
            -DENABLE_CUSTOM_COMPILER_FLAGS=OFF \
            -DENABLE_CJSON_TEST=OFF \
            -DENABLE_CJSON_UTILS=OFF \
            -DENABLE_LOCALES=OFF
          cmake --build cjson-gcc --verbose
          test -s cjson-gcc/libcjson.a
          cc -std=c11 -I cjson cjson-smoke.c cjson-gcc/libcjson.a -lm -o cjson-gcc-smoke
          ./cjson-gcc-smoke
          printf 'GCC_CJSON_LIBRARY_AND_JSON_PARSE_RUNTIME=PASS\n' >> "$GITHUB_STEP_SUMMARY"
      - name: Probe same unmodified CMake project against actual TypeId Rust GCC driver
        shell: bash
        run: |
          set -euo pipefail
          typeid="$PWD/compiler/target/debug/compiler"
          tc="$PWD/compiler/tools/cmake/typeid-gcc-adapter-toolchain.cmake"
          set +e
          cmake -S cjson -B cjson-typeid -G Ninja \
            -DCMAKE_C_COMPILER="$typeid" \
            -DCMAKE_C_COMPILER_ARG1=--gcc-driver \
            -DCMAKE_TOOLCHAIN_FILE="$tc" \
            -DBUILD_SHARED_LIBS=OFF \
            -DENABLE_CUSTOM_COMPILER_FLAGS=OFF \
            -DENABLE_CJSON_TEST=OFF \
            -DENABLE_CJSON_UTILS=OFF \
            -DENABLE_LOCALES=OFF >typeid-configure.log 2>&1
          configure_rc=$?
          if test "$configure_rc" -eq 0; then
            cmake --build cjson-typeid --verbose >typeid-build.log 2>&1
            build_rc=$?
          else
            build_rc=125
          fi
          set -e
          {
            echo '## External CMake cJSON v1.7.19 — real TypeId compatibility'
            echo "Upstream revision: $(git -C cjson rev-parse HEAD)"
            echo "Configure exit: $configure_rc"
            echo "Build exit: $build_rc (125 = configure failed)"
            if test "$configure_rc" -eq 0 && test "$build_rc" -eq 0; then
              test -s cjson-typeid/libcjson.a || exit 1
              cc -std=c11 -I cjson cjson-smoke.c cjson-typeid/libcjson.a -lm -o cjson-typeid-smoke
              ./cjson-typeid-smoke || exit 1
              echo 'TypeId static library and independent JSON parse runtime: PASS'
            else
              echo 'TypeId static library: NOT YET SUPPORTED — gap below'
              echo '```text'
              if test "$configure_rc" -ne 0; then
                grep -E -m 8 'error:|Error|unsupported|failed|CMake Error' typeid-configure.log || true
                tail -n 22 typeid-configure.log
              else
                grep -E -m 12 'error:|Error|unsupported|failed|ninja: build stopped' typeid-build.log || true
                tail -n 28 typeid-build.log
              fi
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          if test "$configure_rc" -eq 0 && test "$build_rc" -ne 0; then
            echo '=== FIRST EXTERNAL TYPEID BUILD DIAGNOSTICS ==='
            sed -n '1,100p' typeid-build.log
          elif test "$configure_rc" -ne 0; then
            echo '=== FIRST EXTERNAL TYPEID CONFIGURE DIAGNOSTICS ==='
            tail -n 100 typeid-configure.log
          fi
          # Onboarding gate: baseline+reproducibility must pass. A new language
          # coverage failure in the external source is evidence, not CI success.
          # The exploratory gate stays green for a *classified* frontend
          # blocker, but must never present an unsupported build as passed.
          # Emit stable key-value facts for downstream source-coverage tracking.
          {
            echo "compiler_sha=$(git -C compiler rev-parse HEAD)"
            echo 'upstream_sha=c859b25da02955fef659d658b8f324b5cde87be3'
            echo "configure_rc=$configure_rc"
            echo "build_rc=$build_rc"
          } > cjson-result.txt
          if test "$configure_rc" -eq 0 && test "$build_rc" -ne 0; then
            if grep -Fq "unsupported GNU symbol attribute '__mode__'" typeid-build.log; then
              echo 'first_blocker=gnu_mode_attribute' >> cjson-result.txt
            elif grep -Eq 'unsupported|error:|fatal error:' typeid-build.log; then
              echo 'first_blocker=other_compiler_diagnostic' >> cjson-result.txt
            else
              echo 'first_blocker=unclassified_build_failure' >> cjson-result.txt
              echo 'TypeId build failed without a compiler diagnostic' >&2
              exit 1
            fi
          elif test "$configure_rc" -ne 0; then
            echo 'first_blocker=cmake_configure' >> cjson-result.txt
          else
            echo 'first_blocker=none' >> cjson-result.txt
          fi
          cat cjson-result.txt
          if test "$configure_rc" -ne 0; then
            echo "TYPEID_CJSON_STAGE=configure"
          elif test "$build_rc" -ne 0; then
            echo "TYPEID_CJSON_STAGE=source-build"
          else
            echo "TYPEID_CJSON_STAGE=static-library-pass"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cjson-typeid-compatibility-logs
          path: |
            cjson-upstream-revision.txt
            cjson-result.txt
            typeid-configure.log
            typeid-build.log
          if-no-files-found: ignore
