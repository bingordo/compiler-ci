name: Validate typed i32 direct Jcc PR 401
on:
  push:
    branches:
      - ci/ifconv-typed-intcmp-pr401-20261106
permissions:
  contents: read
jobs:
  typed-intcmp:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 82b5eb7ad2bfcffad0ae56f56fdeb82275cf1de7
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Require exact compiler source
        run: test "$(git -C compiler rev-parse HEAD)" = "82b5eb7ad2bfcffad0ae56f56fdeb82275cf1de7"
      - name: Restrict workspace to independent core crates
        shell: bash
        run: |
          cat > compiler/Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir", "crates/opt", "crates/backend", "crates/backend-x86"]
          EOF
          rm -f compiler/Cargo.lock
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: pr401-typed-intcmp-native
      - name: Targeted GAS and ELF native GCC oracle
        working-directory: compiler
        run: cargo test -p compiler-backend-x86 --test typed_i32_compare_branch_native -- --nocapture
      - name: Complete x86 backend and core regression suites
        working-directory: compiler
        run: cargo test -p compiler-ir -p compiler-opt -p compiler-backend -p compiler-backend-x86
      - name: Strict Clippy for changed backend and independent core
        working-directory: compiler
        run: |
          cargo clippy -p compiler-backend-x86 --all-targets -- -D warnings
          cargo clippy -p compiler-ir -p compiler-opt --all-targets -- -D warnings
