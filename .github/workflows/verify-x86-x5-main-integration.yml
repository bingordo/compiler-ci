name: Validate X5 addressing integration on compiler main
on:
  push:
    branches: [main]
    paths: ['.github/workflows/verify-x86-x5-main-integration.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  x5:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: integration/x86-x5-addressing-main-20261102
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Record source SHA and validate generated policy
        run: |
          git rev-parse HEAD
          python3 -m unittest discover -s tools -p 'test_x86_lea_patterns.py' -v
          python3 tools/regen_x86_lea_patterns.py --check
      - name: Restrict compiler workspace to core crates
        run: |
          cat > Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir","crates/opt","crates/backend","crates/backend-x86"]
          EOF
          rm -f Cargo.lock
      - uses: Swatinem/rust-cache@v2
        with:
          key: x86-x5-main-integration
      - name: Compile and test main backend and all X5 native cases
        run: |
          set -euo pipefail
          cargo test -p compiler-backend-x86 --lib lea_patterns::tests -- --nocapture
          cargo test -p compiler-backend-x86 --test lea_patterns_native -- --nocapture
          cargo test -p compiler-backend-x86 --test lea_indexed_native -- --nocapture
          cargo test -p compiler-backend-x86 --test lea_memory_native -- --nocapture
          cargo test -p compiler-backend-x86 --lib
          echo "X5_MAIN_INTEGRATION status=PASS"
