name: AArch64 fixed TypeId flags and loop fixture migration
on:
  push:
    branches: [verify/aarch64-flags-loops-typeid-20261115]
    paths: ['.github/workflows/aarch64-flags-loops-typeid-20261115.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 43d94a8e8e4ea2a414db063c107182c3d30967c5
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Check pinned source SHA
        run: test "$(git -C compiler rev-parse HEAD)" = "43d94a8e8e4ea2a414db063c107182c3d30967c5"
      - name: Restrict workspace
        run: |
          cat > compiler/Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir", "crates/backend", "crates/backend-aarch64"]
          EOF
          rm -f compiler/Cargo.lock
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: aarch64-flags-loops-fixed-typeid
      - name: Export exact original TypeId ADDS compare-immediate and SUBS functions
        working-directory: compiler
        run: |
          cargo test -p compiler-backend-aarch64 --test adds_loop_native temporary_export_fixed_native_flags_graphs -- --nocapture
          cargo test -p compiler-backend-aarch64 --test compare_immediate_branch_native temporary_export_fixed_native_flags_graphs -- --nocapture
          cargo test -p compiler-backend-aarch64 --test subs_loop_native temporary_export_fixed_native_flags_graphs -- --nocapture
