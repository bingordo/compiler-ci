name: AArch64 fixed TypeId flags and loop fixture migration
on:
  push:
    branches: [verify/aarch64-flags-loops-typeid-20261115]
    paths: ['.github/workflows/aarch64-flags-loops-typeid-20261115.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 9c701b3475b6c60efa189d4cdb8074bb393b28b5
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Check pinned source SHA
        run: test "$(git -C compiler rev-parse HEAD)" = "9c701b3475b6c60efa189d4cdb8074bb393b28b5"
      - name: Restrict workspace
        run: |
          cat > compiler/Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir", "crates/backend", "crates/backend-aarch64"]
          EOF
          rm -f compiler/Cargo.lock
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: aarch64-flags-loops-fixed-typeid
      - name: Install AArch64 GCC libc cross headers and QEMU
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends gcc-aarch64-linux-gnu libc6-dev-arm64-cross binutils-aarch64-linux-gnu qemu-user
      - name: Verify original ADDS, compare-immediate and SUBS quality plus QEMU C11
        working-directory: compiler
        env:
          COMPILER_REQUIRE_AARCH64_QEMU: "1"
        run: |
          cargo test -p compiler-backend-aarch64 --test adds_loop_native --test compare_immediate_branch_native --test subs_loop_native -- --nocapture
      - name: Native TypeId neighbors, v3 fixture parsing and strict modified-test Clippy
        working-directory: compiler
        run: |
          cargo test -p compiler-backend-aarch64 --test modern_i32 --test i64_scalar_complete
          cargo test -p compiler-ir --test native_module_text_v3 --test native_fixture_text
          cargo clippy -p compiler-backend-aarch64 --no-deps --test adds_loop_native --test compare_immediate_branch_native --test subs_loop_native -- -D warnings
