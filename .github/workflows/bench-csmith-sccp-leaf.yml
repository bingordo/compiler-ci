name: One-off Csmith backend pass timing without generated rewrites
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/bench-csmith-sccp-leaf.yml'
      - 'tools/large_csmith_compile_bench.py'
permissions:
  contents: read
  actions: read
concurrency:
  group: large-csmith-bench-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  compile-time:
    if: github.head_ref == 'bench/csmith-sccp-leaf-index' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 8effc959e1f5de1785c6bb2731b0fe50ee24bd02
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Prepare toolchain and source
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/csmith-bench"
          git -C compiler rev-parse HEAD | tee "$RUNNER_TEMP/csmith-bench/compiler-sha"
          # The preserved .i files are already preprocessed. No Csmith
          # installation or package repository refresh is needed.
          gcc --version > "$RUNNER_TEMP/csmith-bench/gcc.txt"
          python3 - <<'PY'
          from pathlib import Path
          p=Path("compiler/tools/mini-c-driver/Cargo.toml")
          text=p.read_text()
          old="ssh://git@github.com/bingordo/mini-c.git"
          p.write_text(text.replace(old,"https://github.com/bingordo/mini-c.git"))
          PY
      - uses: actions/download-artifact@v4
        with:
          name: large-csmith-compile-time
          run-id: 46029541162
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/original-csmith
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler/tools/mini-c-driver -> target
          key: mini-c-release-csmith-profile-v1
      - name: Validate optimizer
        working-directory: compiler
        run: |
          set -euo pipefail
          git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
          cargo test --release -p compiler-opt --lib
          cargo clippy -p compiler-opt --lib -- -D warnings
      - name: Diagnostic-only disable generated rewrite group after normal unit tests
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path("compiler/crates/opt/Cargo.toml")
          text=p.read_text()
          old='default = ["experimental-typeid-guarded-admission"]'
          assert text.count(old)==1
          p.write_text(text.replace(old,"default = []"))
          PY
          git -C compiler diff -- crates/opt/Cargo.toml
      - name: Build diagnostic native driver in ordinary release mode
        run: |
          set -euo pipefail
          cargo build --release --manifest-path compiler/tools/mini-c-driver/Cargo.toml -p compiler-mini-c --bin compiler-mini-c 2>&1 | tee "$RUNNER_TEMP/csmith-bench/build.log"
          sha256sum compiler/tools/mini-c-driver/target/release/compiler-mini-c > "$RUNNER_TEMP/csmith-bench/driver-sha256"
      - name: Time exact Csmith inputs with backend pass report
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/csmith-bench"
          original="$RUNNER_TEMP/original-csmith"
          python3 - "$original" "$out" <<'PY'
          import hashlib, json, pathlib, shutil, sys
          src, dst = map(pathlib.Path, sys.argv[1:])
          report = json.loads((src/"report.json").read_text())
          for seed in (1001,1002):
              case = next(c for c in report["cases"] if c["seed"] == seed)
              for ext,key in (("c","source_sha256"),("i","preprocessed_sha256")):
                  p = src/f"case-{seed}.{ext}"
                  assert hashlib.sha256(p.read_bytes()).hexdigest() == case[key]
                  shutil.copyfile(p,dst/p.name)
              print("VERIFIED_INPUT",seed,case["lines"],case["preprocessed_sha256"])
          PY
          lscpu > "$out/host.txt"
          bin="$PWD/compiler/tools/mini-c-driver/target/release/compiler-mini-c"
          for seed in 1001 1002; do
            p="$out/timing-$seed"
            set +e
            COMPILER_BACKEND_TIME_REPORT=1 /usr/bin/time -f 'wall=%e user=%U sys=%S maxrss_kib=%M' -o "$p.time" timeout --kill-after=5s 900s "$bin" "$out/case-$seed.i" --emit obj -o "$p.o" --omit-unreferenced-static-bodies >"$p.log" 2>&1
            status=$?
            set -e
            echo "NATIVE_EXIT $seed $status"
            cat "$p.time"
            cat "$p.log"
            if [ "$status" = 0 ]; then
              for level in 0 2 3; do
                /usr/bin/time -f 'wall=%e user=%U sys=%S maxrss_kib=%M' -o "$p.gcc-O$level.time" gcc -O"$level" -w -c "$out/case-$seed.i" -o "$p.gcc-O$level.o"
                echo "GCC_TIME $seed O$level"
                cat "$p.gcc-O$level.time"
              done
              gcc "$p.gcc-O2.o" -o "$p.gcc"
              gcc "$p.o" -o "$p.exe"
              timeout 20s "$p.gcc" > "$p.gcc.checksum"
              timeout 20s "$p.exe" > "$p.native.checksum"
              cmp "$p.gcc.checksum" "$p.native.checksum" && echo "CHECKSUM_MATCH $seed"
            fi
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: large-csmith-compile-profile
          path: ${{ runner.temp }}/csmith-bench/
          retention-days: 14
