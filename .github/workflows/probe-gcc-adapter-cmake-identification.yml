name: Probe unforced CMake compiler identification
on:
  pull_request:
    paths: ['.github/workflows/probe-gcc-adapter-cmake-identification.yml']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: fcef121cf1a1c61b97e82bf35f3f0c8b33cbafa2
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Build source-pinned native Mini-C TypeId
        run: |
          set -euo pipefail
          git -C compiler rev-parse HEAD
          python3 - <<'PY'
          from pathlib import Path
          p=Path("compiler/tools/mini-c-driver/Cargo.toml")
          s=p.read_text()
          old="ssh://git@github.com/bingordo/mini-c.git"
          assert s.count(old)==2
          p.write_text(s.replace(old,"https://github.com/bingordo/mini-c.git"))
          PY
          timeout 12m cargo build --manifest-path compiler/tools/mini-c-driver/Cargo.toml -p compiler-mini-c --bin compiler-mini-c
      - name: Record actual unforced CMake probes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/id-probe/p"
          cd "$RUNNER_TEMP/id-probe"
          cp "$GITHUB_WORKSPACE/compiler/tools/compiler-gcc.py" adapter
          chmod +x adapter
          cat > bridge <<'PY'
          #!/usr/bin/env python3
          import os, subprocess, sys
          a=sys.argv[1:]
          with open(os.environ["ADAPTER_ARG_LOG"],"a") as f: f.write(repr(a)+"\n")
          if len(a)!=9 or a[1:3]!=["--language","mini-c"] or a[3:5]!=["--target","x86_64"] or a[5:7]!=["--emit","obj"] or a[7]!="-o":
              sys.exit("unsupported native bridge arguments")
          sys.exit(subprocess.call([os.environ["NATIVE_MINI_C"],a[0],"--emit","obj","-o",a[8]]))
          PY
          chmod +x bridge
          printf 'cmake_minimum_required(VERSION 3.20)\nproject(unforced C)\nadd_executable(probe main.c)\n' > p/CMakeLists.txt
          printf 'int main(void){return 0;}\n' > p/main.c
          export ADAPTER_ARG_LOG="$PWD/args.log"
          export NATIVE_MINI_C="$GITHUB_WORKSPACE/compiler/tools/mini-c-driver/target/debug/compiler-mini-c"
          export COMPILER_NATIVE_DRIVER="$PWD/bridge"
          # No forced ID, WORKS, or compiler features.
          if cmake -S p -B build -G Ninja -DCMAKE_C_COMPILER="$PWD/adapter" >configure.log 2>&1; then
              echo 'UNFORCED_CONFIGURE=PASS' | tee result.txt
              if cmake --build build >build.log 2>&1 && ./build/probe; then
                  echo 'UNFORCED_NATIVE_RUNTIME=PASS' | tee -a result.txt
              else
                  echo 'UNFORCED_NATIVE_RUNTIME=FAIL' | tee -a result.txt
              fi
          else
              echo 'UNFORCED_CONFIGURE=FAIL' | tee result.txt
          fi
          cat configure.log
          test -f args.log && cat args.log || :
          cat result.txt >> "$GITHUB_STEP_SUMMARY"
          # This workflow collects diagnostics; failure is NOT a compiler acceptance.
      - name: Save exact CMake probe and compiler diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unforced-cmake-identification
          path: ${{ runner.temp }}/id-probe/
          if-no-files-found: error
          retention-days: 14
