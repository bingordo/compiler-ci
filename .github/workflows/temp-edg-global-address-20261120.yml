# Isolated, source-pinned EDG C/C++ and FP shared SSA join acceptance; never merge.
name: TEMP EDG FP global address source shape pilot
on:
  pull_request:
    paths: [.github/workflows/temp-edg-global-address-20261120.yml]
permissions:
  contents: read
jobs:
  fp-edg:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    container:
      image: ghcr.io/edgcpp/ci-runner@sha256:14b3948c2ce12cfa5472e5a6c468393d15426f3a67685cc35d830ea5db2acdf8
    defaults:
      run:
        shell: edg-container-exec "bash -eo pipefail {0}"
    env:
      EDG_SOURCE_SHA: 799603e0b5ab272d9418e2d44a53a95bc73dfdc4
      EDG_RELEASE_TAG: edgcpfe-ci-799603e0b5ab
      EDG_RELEASE_SHA256: fa769825e70766fbefe017806816b2338acd03daa93bb5562369c293972ce64c
      RUST_TOOLCHAIN_VERSION: 1.99.1
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 5f469db0ccc07c0b56ea6a85014efd5f701a7471
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          repository: bingundu/edgcpp
          ref: 799603e0b5ab272d9418e2d44a53a95bc73dfdc4
          path: edgcpp
          persist-credentials: false
      - name: Verify compiler source head
        working-directory: compiler
        run: test "$(git rev-parse HEAD)" = "5f469db0ccc07c0b56ea6a85014efd5f701a7471"
      - name: Prepare native EDG headers/config
        working-directory: edgcpp
        run: |
          export EDG_BASE="$PWD/bases/docker/dev-env/gcc"
          cmake --preset linux-gcc-release -DEDG_BUILD_LIB=OFF -DEDG_BUILD_CALLABLE_LIBRARY=ON -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
          cmake --build build/gcc-release --target error-info --parallel 2
      - name: Restore checksum-pinned callable EDG archive
        working-directory: edgcpp
        run: |
          set -euo pipefail
          url="https://github.com/bingundu/edgcpp/releases/download/$EDG_RELEASE_TAG/edgcpfe-ci-x86_64-callable-release-linux-x86_64.tar.gz"
          mkdir -p build/gcc-release/lib build/prebuilt-edg
          curl --fail --location --silent --show-error --retry 4 --retry-delay 2 "$url" --output build/prebuilt-edg/archive.tar.gz
          printf '%s  %s\n' "$EDG_RELEASE_SHA256" build/prebuilt-edg/archive.tar.gz | sha256sum --check --status
          tar -xzf build/prebuilt-edg/archive.tar.gz -C build/prebuilt-edg
          grep -Fx "commit=$EDG_SOURCE_SHA" build/prebuilt-edg/BUILD-INFO.txt
          cp build/prebuilt-edg/lib/libedgcpfe.a build/gcc-release/lib/libedgcpfe.a
      - name: Install pinned Rust toolchain
        run: |
          if ! command -v cargo >/dev/null; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain "$RUST_TOOLCHAIN_VERSION"
          fi
          export PATH="$HOME/.cargo/bin:$PATH"
          rustup toolchain install "$RUST_TOOLCHAIN_VERSION" --profile minimal
          rustup default "$RUST_TOOLCHAIN_VERSION"
      - name: Build EDG native TypeId bridge
        working-directory: compiler
        env:
          EDGCPP_SOURCE_DIR: ${{ github.workspace }}/edgcpp
          EDGCPP_COMPILE_COMMANDS: ${{ github.workspace }}/edgcpp/build/gcc-release/compile_commands.json
          EDGCPP_LIB_DIR: ${{ github.workspace }}/edgcpp/build/gcc-release/lib
          EDGCPP_EDG_REVISION: ${{ env.EDG_SOURCE_SHA }}
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          cargo test --manifest-path tools/edg-driver/Cargo.toml --no-run
          cargo test --manifest-path tools/edg-driver/Cargo.toml emits_byte_exact_typeid_ptroffset_and_proven_zero_identity -- --nocapture
          cargo build --manifest-path tools/edg-driver/Cargo.toml
      - name: EDG exact global FP pointer source shape, diagnostics
        working-directory: compiler
        run: |
          set -euo pipefail
          export PATH="$HOME/.cargo/bin:$PATH"
          cp tools/edg-driver/tests/fixtures/edg_native_fp_global_address.c ../edgcpp/build/gcc-release/
          cd ../edgcpp/build/gcc-release
          source environment.sh
          tool="../../../compiler/tools/edg-driver/target/debug/compiler-edg-driver"
          "$tool" edg_global_address.o --c11 edg_native_fp_global_address.c
          nm -g --defined-only edg_global_address.o | grep -q edg_fp_address_alias32
