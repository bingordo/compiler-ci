name: BT4 AArch64 original globals constructor oracle TypeId GAS ELF QEMU
on:
  push:
    branches: [ci/bt4-module-globals-typeid-qemu-20261114]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-typeid-data:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 9cff9457fe3140e7108f25f5dfce505aa80c54e5
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Isolate native backend workspace from unrelated private frontend fetches
        run: |
          python3 - <<'PY'
          from pathlib import Path
          Path("Cargo.toml").write_text("""[workspace]
          resolver = "2"
          members = ["crates/ir", "crates/backend", "crates/backend-aarch64"]
          """)
          PY
      - name: Trust compiler source and check target packages
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 9cff9457fe3140e7108f25f5dfce505aa80c54e5
          cargo check -p compiler-backend-aarch64 --all-targets
          cargo test -p compiler-backend-aarch64 --test module_gas
          cargo test -p compiler-backend-aarch64 --test module_globals
          cargo test -p compiler-backend-aarch64 --test typeid_globals_native
          cargo clippy -p compiler-backend-aarch64 --all-targets -- -D warnings
      - name: Install cross compiler and QEMU userspace
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu qemu-user
      - name: Execute unchanged data-only C11 relocation oracle under QEMU
        env:
          COMPILER_REQUIRE_AARCH64_QEMU: "1"
        run: |
          set -euo pipefail
          cargo test -p compiler-backend-aarch64 --test module_gas -- --nocapture
          cargo test -p compiler-backend-aarch64 --test module_globals -- --nocapture
          cargo test -p compiler-backend-aarch64 --test typeid_globals_native -- --nocapture
          echo BT4_TYPEID_GLOBALS_CONSTRUCTOR_C_ORACLE_QEMU_PASS
