name: X7.G10.N18 exact Intel ModRM operand role contract
on:
  push:
    branches: [ci/x7-g10-n18-source-roles-20261109]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-roles:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout exact N18 compiler
        uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 361af1921576ae895731650a0af00e6a408cf351
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Validate source-defined operand read/write roles against seven source forms
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 361af1921576ae895731650a0af00e6a408cf351
          mkdir -p /tmp/x7-n18-intel
          revision=35eface1b7ee003a1cda95005ec5fd83de658a64
          for n in MOV ADD SUB AND OR XOR; do
            curl --fail --silent --show-error --location --retry 2 --max-time 45 \
              "https://raw.githubusercontent.com/intel/SDM/${revision}/data/instruction/${n}.xml" \
              -o "/tmp/x7-n18-intel/${n}.xml"
          done
          python3 -m unittest discover -s tools -p 'test_x86_g10_source_operand_roles.py' -v
          python3 -m unittest discover -s tools -p 'test_x86_intel_iform_effect_audit.py' -v
          python3 -m unittest discover -s tools -p 'test_x86_g10_native_iforms.py' -v
          python3 tools/x86_g10_regen_physical_forms.py \
            --xml-dir /tmp/x7-n18-intel --check
          python3 tools/regen_x86_forms.py --check
          echo X7_N18_INTEL_SOURCE_OPERAND_ROLES_PASS
      - name: Focused backend descriptor/feature regressions
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          Path("Cargo.toml").write_text("""[workspace]
          resolver = "2"
          members = ["crates/ir","crates/opt","crates/backend","crates/backend-x86"]
          """)
          PY
          cargo test -p compiler-backend-x86 \
            --lib x7_native_form_bridge --offline
          cargo test -p compiler-backend-x86 \
            --lib x7_late_selector --offline
          echo X7_N18_BACKEND_PASS
