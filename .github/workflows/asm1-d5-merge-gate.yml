name: ASM1-D5 source-pinned main integration gate
on:
  push:
    branches: [ci/asm1-d5-data-differences]
    paths: ['.github/workflows/asm1-d5-merge-gate.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  data-difference-integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 04c4e42c6fde3c9606b69ee59701ffbc49252ac9
          fetch-depth: 0
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 9a4a703b35bf4720bd27d8632f20388329da613e
          path: feature-head
          fetch-depth: 0
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Simulate merge of exact source pins on main
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "04c4e42c6fde3c9606b69ee59701ffbc49252ac9"
          test "$(git -C feature-head rev-parse HEAD)" = "9a4a703b35bf4720bd27d8632f20388329da613e"
          git config user.name 'compiler-ci integration gate'
          git config user.email 'compiler-ci@users.noreply.github.com'
          git fetch --no-tags ./feature-head 9a4a703b35bf4720bd27d8632f20388329da613e
          git merge --no-commit --no-ff FETCH_HEAD
          git diff --cached --check
          rm -rf feature-head
      - name: Core compiler workspace
        run: |
          cat > Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir", "crates/opt", "crates/backend", "crates/backend-x86"]
          EOF
          rm -f Cargo.lock
      - uses: Swatinem/rust-cache@v2
        with:
          key: asm1-d5-main-integration
      - name: Check merged assembler and ELF behavior
        run: |
          set -euo pipefail
          python3 tools/regen_x86_att_forms.py --check
          python3 -m unittest discover -s tools -p test_regen_x86_att_forms.py -v
          cargo check -p compiler-backend-x86 --all-targets
          cargo test -p compiler-backend-x86 --test att_data_differences -- --nocapture
          for suite in att_asm att_module att_module_strings att_aliases \
            att_mid_labels att_section_cursor att_text_alignment \
            m4_global_pointer_relocations_native m4_global_branch_relax_native; do
            cargo test -p compiler-backend-x86 --test "$suite"
          done
          cargo test -p compiler-backend-x86 --lib
          cargo test -p compiler-backend --lib
          cargo clippy -p compiler-backend-x86 --lib --test att_data_differences --test att_module -- -D warnings -A unused_variables -A clippy::suspicious_assignment_formatting
          echo 'ASM1_D5_MAIN_MERGE_GATE status=PASS' >> "$GITHUB_STEP_SUMMARY"
