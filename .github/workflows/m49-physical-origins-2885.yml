name: CI M49 verified physical x86 origins
on:
  pull_request:
    paths: ['.github/workflows/m49-physical-origins-2885.yml']
permissions:
  contents: read
jobs:
  provenance:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 5f2acc829b4323229c5d97b0f3f68ab15d2686d2
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Resolve compiler Git dependencies
        run: git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
      - name: Exact-source physical provenance and full x86 regression
        working-directory: compiler
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "5f2acc829b4323229c5d97b0f3f68ab15d2686d2"
          cargo test -p compiler-backend-x86 --lib physical_provenance::tests
          # Targeted diagnostic only; earlier full suite and Clippy passed on same implementation.

