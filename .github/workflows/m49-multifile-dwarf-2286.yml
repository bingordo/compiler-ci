name: CI M4.9 verified multifile DWARF line rows
on:
  pull_request:
    paths: ['.github/workflows/m49-multifile-dwarf-2286.yml']
permissions:
  contents: read
jobs:
  dwarf:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: a651f82254ad486ebece936f6970416333b6105f
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Resolve private compiler Git dependencies
        run: git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
      - name: Install GDB for real source-breakpoint tests
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y gdb
      - name: Check exact source and DWARF native/linked regressions
        working-directory: compiler
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "a651f82254ad486ebece936f6970416333b6105f"
          cargo test -p compiler-backend --test x86_dwarf_line_native
          cargo test -p compiler-backend --test x86_dwarf_cu_native
          cargo test -p compiler-backend --lib
          cargo clippy -p compiler-backend --all-targets -- -D warnings
