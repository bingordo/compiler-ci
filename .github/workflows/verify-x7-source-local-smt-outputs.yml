name: X7 source-local outputs independent SMT oracle
on:
  workflow_dispatch:
  push:
    branches: [ci/x7-local-smt-outputs-20261111]
permissions:
  contents: read
jobs:
  smt:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 2e3ec19884c6812d9837cc520b561ef8f3e36a6f
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Install pinned offline-only Z3 solver in isolated venv
        run: |
          set -euo pipefail
          python3 -m venv /tmp/x7-z3
          /tmp/x7-z3/bin/python -m pip install --disable-pip-version-check 'z3-solver==4.13.4.0'
          /tmp/x7-z3/bin/python -c 'import z3; print("X7_Z3_VERSION", z3.get_version_string())'
      - name: Run independent source-vs-DAG SMT proof and mutation controls
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 2e3ec19884c6812d9837cc520b561ef8f3e36a6f
          /tmp/x7-z3/bin/python -m unittest discover -s tools -p 'test_x86_isl_smt_verify.py' -v
          /tmp/x7-z3/bin/python -m unittest discover -s tools -p 'test_x86_isl_record_effects_smt.py' -v
          /tmp/x7-z3/bin/python -m unittest discover -s tools -p 'test_x86_isl_definedness_smt.py' -v
          /tmp/x7-z3/bin/python -m unittest discover -s tools -p 'test_x86_isl_form_evidence.py' -v
          /tmp/x7-z3/bin/python -m unittest discover -s tools -p 'test_x86_form_memory_ssa_smt.py' -v
          /tmp/x7-z3/bin/python -m unittest discover -s tools -p 'test_x86_form_memory_contract.py' -v
          /tmp/x7-z3/bin/python -m unittest discover -s tools -p 'test_x86_source_iform_memory_join.py' -v
          /tmp/x7-z3/bin/python -m unittest discover -s tools -p 'test_x86_isl_iform_exception_smt.py' -v
          /tmp/x7-z3/bin/python -m py_compile tools/x86_isl_iform_effect_plan.py
          /tmp/x7-z3/bin/python -m py_compile tools/x86_form_memory_contract.py
          /tmp/x7-z3/bin/python -m py_compile tools/x86_isl_ordered_effect_trace.py tools/x86_isl_form_evidence.py tools/x86_isl_smt_verify.py
