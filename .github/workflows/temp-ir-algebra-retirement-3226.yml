name: Temporary historical algebra retirement acceptance
on:
  pull_request:
    paths: ['.github/workflows/temp-ir-algebra-retirement-3226.yml']
permissions:
  contents: read
jobs:
  algebra-retirement:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      SOURCE_SHA: c67de416991aff35d6cccddc2d9cbd4ec2bcdfdc
      CARGO_INCREMENTAL: '0'
      CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: ${{ env.SOURCE_SHA }}
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Confirm source and isolate core workspace
        working-directory: compiler
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          cat > Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir", "crates/opt", "crates/backend", "crates/backend-x86", "crates/backend-aarch64"]
          EOF
          rm -f Cargo.lock
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: ir-algebra-retirement
      - name: Audit historical algebra callers
        working-directory: compiler
        run: |
          if git grep -nE 'legacy-function-algebra-oracle|(^|[^[:alnum:]_])algebra::(simplify|\{[^}]*simplify)|algebra_common::simplify\b' -- '*.rs' '*.toml' ':!crates/opt/tests/retired_algebra_api.rs'; then
            exit 1
          fi
      - name: Native algebra exact rewrites and independent execution
        if: ${{ !cancelled() }}
        working-directory: compiler
        run: cargo test --no-fail-fast -p compiler-opt --test typed_algebra --test generated_native_integer_algebra --test affine_cancellation --test alive_lite --test retired_algebra_api
      - name: Optimizer unit and all-target regression
        if: ${{ !cancelled() }}
        working-directory: compiler
        run: |
          set -euo pipefail
          cargo check -p compiler-opt --lib
          cargo check -p compiler-opt --all-targets
          cargo test -p compiler-opt --lib
      - name: Experimental historical generated comparison and native proof boundary
        if: ${{ !cancelled() }}
        working-directory: compiler
        run: |
          set -euo pipefail
          cargo test -p compiler-opt --lib --features experimental-generated-rules
          cargo check -p compiler-opt --example compare_generated_rules --features experimental-generated-rules
          RULE_BENCH_BATCH=5 RULE_BENCH_REPEATS=3 cargo run -p compiler-opt --example compare_generated_rules --features experimental-generated-rules -- --native
      - name: Alive-lite actual algebra solver checks
        if: ${{ !cancelled() }}
        working-directory: compiler
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y z3
          cargo test -p compiler-opt --test alive_lite prove_actual_optimizer_passes -- --ignored
          cargo test -p compiler-opt --test alive_lite prove_seeded_select_against_real_optimizer_passes -- --ignored
      - name: Production graph boundary
        if: ${{ !cancelled() }}
        working-directory: compiler
        run: python3 tools/check_mixed_function_export_boundary.py
