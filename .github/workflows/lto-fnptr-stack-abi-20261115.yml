name: LTO function pointer relocation and eight-argument ABI
on:
  push:
    branches: [verify/lto-fnptr-stack-abi-20261115]
    paths: ['.github/workflows/lto-fnptr-stack-abi-20261115.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  differential:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 3ad70860fe7383f9be23201cf174f356273558d4
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Verify source SHA and route public Git deps
        run: |
          test "$(git -C compiler rev-parse HEAD)" = "3ad70860fe7383f9be23201cf174f356273558d4"
          git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
      - name: Focus driver workspace
        run: |
          cat > compiler/Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir", "crates/opt", "crates/backend", "crates/backend-x86", "crates/backend-aarch64", "crates/driver"]
          EOF
          rm -f compiler/Cargo.lock
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: lto-fnptr-stack-abi
      - name: Function pointer relocation and 8-arg ABI differential
        working-directory: compiler
        run: cargo test -p compiler --test lto_fnptr_stack_abi -- --nocapture
      - name: Existing generated I64 and cross-TU differential
        working-directory: compiler
        run: |
          cargo test -p compiler --test lto_generated_abi_memory
          cargo test -p compiler --test lto_generated_multitu
      - name: Strict focused lint
        working-directory: compiler
        run: cargo clippy -p compiler --test lto_fnptr_stack_abi -- -D warnings
