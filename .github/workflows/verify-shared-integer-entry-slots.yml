name: Validate shared INTEGER entry slot projection
on:
  pull_request:
    paths: [.github/workflows/verify-shared-integer-entry-slots.yml]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 2aaaf6a96d4ab543f67079908c151e3b3c0bbe6b
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Verify exact revision
        run: |
          set -euo pipefail
          test "$(git -C compiler rev-parse HEAD)" = '2aaaf6a96d4ab543f67079908c151e3b3c0bbe6b'
          git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: shared-integer-call-backend-v1
      - name: Shared INTEGER caller and entry tests
        run: |
          set -euo pipefail
          cargo test --manifest-path compiler/Cargo.toml -p compiler-backend --lib typeid_integer_call -- --nocapture
