name: BT4 x86 native TypeId original code/data/BSS/extern relocations GCC C11
on:
  push:
    branches: [ci/bt4-x86-global-pointer-relocs-typeid-20261114]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-reloc-c11-native:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 5c6214d67abdf7975673a9743c31aae40cd61ff9
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Isolate x86 backend crate members
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 5c6214d67abdf7975673a9743c31aae40cd61ff9
          python3 - <<'PY'
          from pathlib import Path
          Path("Cargo.toml").write_text("""[workspace]
          resolver = "2"
          members = ["crates/ir","crates/backend","crates/opt","crates/backend-x86"]
          """)
          PY
      - name: Verify original relocated-data test no longer consumes historical backend
        run: |
          set -euo pipefail
          if grep -nE '(compiler_backend::Backend|machine::select\(|compiler_ir::Function|\bFunction \{)' crates/backend-x86/tests/m4_global_pointer_relocations_native.rs; then
            echo "BT4 reloc test still depends on historical Backend(Function)"; exit 1
          fi
      - name: Check x86 all-targets and execute original C11 oracle in four modes
        run: |
          set -euo pipefail
          cargo check -p compiler-backend-x86 --all-targets
          cargo test -p compiler-backend-x86 --test m4_global_pointer_relocations_native -- --nocapture
          cargo clippy -p compiler-backend-x86 --all-targets -- -D warnings
          cargo test -p compiler-backend-x86 --no-default-features --test m4_global_pointer_relocations_native -- --nocapture
          echo BT4_X86_TYPEID_GLOBAL_POINTER_RELOC_ALL_MODES_PASS
