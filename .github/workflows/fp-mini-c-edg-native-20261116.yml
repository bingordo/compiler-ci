# Temporary pinned FP source integration gate. Do not merge into compiler-ci main.
name: TEMP Mini-C and EDG scalar FP TypeId
on:
  push:
    branches: [ci/fp-mini-c-edg-native-20261116]
    paths:
      - .github/workflows/fp-mini-c-edg-native-20261116.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mini-c-scalar-fp:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      SOURCE_SHA: 37c273ae82c16efab22ae52414b73ede33c38f0f
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.CI_KEY }}
      - run: ssh-keyscan github.com >> ~/.ssh/known_hosts
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 37c273ae82c16efab22ae52414b73ede33c38f0f
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Verify pinned source and Rust
        run: |
          test "$(git -C compiler rev-parse HEAD)" = "$SOURCE_SHA"
          rustc --version
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler/tools/mini-c-driver -> target
          key: fp-mini-c-typeid-20261116
      - name: Compile and execute checked Mini-C F32/F64 ELF GAS C oracle
        working-directory: compiler
        run: cargo test --manifest-path tools/mini-c-driver/Cargo.toml --test fp_scalar -- --nocapture
      - name: Existing native Mini-C smoke
        working-directory: compiler
        run: cargo test --manifest-path tools/mini-c-driver/Cargo.toml --test typeid_cli -- --test-threads=2
      - name: Normal compiler CLI Mini-C scalar FP x86 ELF/GAS PIC/RBP GCC oracle
        working-directory: compiler
        run: cargo test -p compiler --test mini_c_cli cli_native_typeid_source_f32_f64_elf_gas_and_pic -- --nocapture
      - name: x86 TypeId scalar FP forward-branch verifier regressions
        working-directory: compiler
        run: cargo test -p compiler-backend-x86 typeid_fp_forward_bool_branch_and_multi_exit_strictness -- --nocapture
