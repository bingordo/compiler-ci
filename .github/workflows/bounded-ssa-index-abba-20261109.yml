name: Bounded SSA definition index real pass and source ABBA
'on':
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/bounded-ssa-index-abba-20261109.yml'
      - 'tools/ct11_bounded_ssa_index_abba.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 'c77f2513aecce5dbd9952a68f5a673ecfd4f5b9a'
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Verify source and toolchain
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C compiler rev-parse HEAD)" = 'c77f2513aecce5dbd9952a68f5a673ecfd4f5b9a'
          rustc --version
          lscpu | grep 'Model name' || true
          cat > compiler/Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir", "crates/opt", "crates/backend", "crates/backend-x86"]
          EOF
          rm -f compiler/Cargo.lock
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: bounded-ssa-index-core
      - name: Full release IR and optimizer suites
        working-directory: compiler
        run: cargo test --release -p compiler-ir -p compiler-opt
      - name: Explicit TypeId DCE and phi/CFG parallel edge tests
        working-directory: compiler
        shell: bash
        run: |
          set -euo pipefail
          cargo test --release -p compiler-opt --test typed_local
          cargo test --release -p compiler-opt --test typed_phi_dead_linear
          cargo test --release -p compiler-opt --test typed_phi_cfg
          cargo test --release -p compiler-opt --test alias_phis
      - name: Strict changed-library Clippy
        working-directory: compiler
        run: cargo clippy -p compiler-ir -p compiler-opt --lib -- -D warnings

  pass_abba:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          path: harness
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: '6bba4ee13bb289d8930d693e93eb3de0842b48b3'
          path: before
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 'c77f2513aecce5dbd9952a68f5a673ecfd4f5b9a'
          path: after
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Verify pins, install identical fixture and isolate workspaces
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C before rev-parse HEAD)" = '6bba4ee13bb289d8930d693e93eb3de0842b48b3'
          test "$(git -C after rev-parse HEAD)" = 'c77f2513aecce5dbd9952a68f5a673ecfd4f5b9a'
          rustc --version
          lscpu | grep 'Model name' || true
          mkdir -p results before/crates/opt/examples
          cp after/crates/opt/examples/borrowed_dependency_probe.rs before/crates/opt/examples/borrowed_dependency_probe.rs
          sha256sum before/crates/opt/examples/borrowed_dependency_probe.rs after/crates/opt/examples/borrowed_dependency_probe.rs > results/fixture-sha.txt
          python3 -m py_compile harness/tools/ct11_bounded_ssa_index_abba.py
          for root in before after; do
            cat > "$root/Cargo.toml" <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir", "crates/opt", "crates/backend", "crates/backend-x86"]
          EOF
            rm -f "$root/Cargo.lock"
          done
          echo '6bba4ee13bb289d8930d693e93eb3de0842b48b3' > results/before-sha.txt
          echo 'c77f2513aecce5dbd9952a68f5a673ecfd4f5b9a' > results/after-sha.txt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            before -> target
            after -> target
          key: bounded-ssa-index-pass
      - name: Build source-pinned release DCE probes
        shell: bash
        run: |
          set -euo pipefail
          cargo build --release --manifest-path before/Cargo.toml -p compiler-opt --example borrowed_dependency_probe --target-dir "$PWD/before-target"
          cargo build --release --manifest-path after/Cargo.toml -p compiler-opt --example borrowed_dependency_probe --target-dir "$PWD/after-target"
      - name: ABBA full DCE pass on dense and sparse SSA IDs
        shell: bash
        run: |
          set -euo pipefail
          python3 harness/tools/ct11_bounded_ssa_index_abba.py \
            --before before-target/release/examples/borrowed_dependency_probe \
            --after after-target/release/examples/borrowed_dependency_probe \
            --rounds 3 --raw results/pass-raw.csv --report results/pass-report.md
          cat results/pass-report.md >> "$GITHUB_STEP_SUMMARY"
      - name: Save pass latency and allocator results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bounded-ssa-index-pass-abba
          path: results/
          if-no-files-found: warn

  source_abba:
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    strategy:
      fail-fast: false
      matrix:
        session: [a, b]
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          path: harness
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: '6bba4ee13bb289d8930d693e93eb3de0842b48b3'
          path: before
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 'c77f2513aecce5dbd9952a68f5a673ecfd4f5b9a'
          path: after
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Verify pinned revisions
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C before rev-parse HEAD)" = '6bba4ee13bb289d8930d693e93eb3de0842b48b3'
          test "$(git -C after rev-parse HEAD)" = 'c77f2513aecce5dbd9952a68f5a673ecfd4f5b9a'
          mkdir -p results
          rustc --version | tee results/rustc.txt
          lscpu | grep 'Model name' | tee results/cpu.txt || true
          git -C before rev-parse HEAD > results/before-sha.txt
          git -C after rev-parse HEAD > results/after-sha.txt
          python3 -m py_compile harness/tools/ct06_abba.py harness/tools/ct06_large_corpus.py
      - name: Enable public frontend source dependencies
        run: git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            before/tools/mini-c-driver -> target
            after/tools/mini-c-driver -> target
          key: bounded-ssa-index-source-${{ matrix.session }}
      - name: Build same-source release Mini-C compilers
        shell: bash
        run: |
          set -euo pipefail
          cargo build --release --manifest-path before/tools/mini-c-driver/Cargo.toml -p compiler-mini-c --bin compiler-mini-c
          cargo build --release --manifest-path after/tools/mini-c-driver/Cargo.toml -p compiler-mini-c --bin compiler-mini-c
      - name: Generate real checked Mini-C programs
        shell: bash
        run: |
          set -euo pipefail
          python3 harness/tools/ct06_large_corpus.py --helpers after/tools --out corpus
          cp corpus/manifest.csv results/source-manifest.csv
      - name: Source-to-ELF five-round ABBA with byte-identical output
        shell: bash
        run: |
          set -euo pipefail
          python3 harness/tools/ct06_abba.py --helpers after/tools --corpus corpus \
            --before before/tools/mini-c-driver/target/release/compiler-mini-c \
            --after after/tools/mini-c-driver/target/release/compiler-mini-c \
            --extended-24-128 --require-identical-elf \
            --samples 5 --raw results/source-raw.csv --report results/source-report.md
          cat results/source-report.md >> "$GITHUB_STEP_SUMMARY"
      - name: Save output hashes, source timings and RSS
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bounded-ssa-index-source-${{ matrix.session }}
          path: results/
          if-no-files-found: warn
