name: Intel iform source shard linear partitioning and exact parity
on:
  pull_request:
    paths: ['.github/workflows/verify-iform-shard-linear-indexing.yml']
permissions:
  contents: read
jobs:
  iform-source-partitions:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout immutable compiler candidate
        uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: cbb08aad410e1cb546ac10a190fd0c2c9eaa023d
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Assert exact tested compiler SHA
        run: test "$(git -C compiler rev-parse HEAD)" = "cbb08aad410e1cb546ac10a190fd0c2c9eaa023d"
      - name: Validate source-index/split implementation syntax
        working-directory: compiler
        run: |
          set -euo pipefail
          export PYTHONPATH="$PWD/tools"
          python3 -m py_compile tools/x86_iform_batch_worklist.py tools/test_x86_iform_batch_worklist.py
      - name: Run source-pinned full iform grouping, source shapes and catalog mutation suites
        working-directory: compiler
        run: |
          set -euo pipefail
          export PYTHONPATH="$PWD/tools"
          python3 -m unittest discover -s tools -p test_x86_iform_batch_worklist.py -v
          python3 -m unittest discover -s tools -p test_x86_g10_catalog_census.py -v
          python3 -m unittest discover -s tools -p test_x86_g10_source_operand_shapes.py -v
