name: TEMP ASM D32 pinned XED flag metadata
on:
  pull_request:
    paths: ['.github/workflows/asm-d32-xed-flags-temp.yml']
permissions:
  contents: read
jobs:
  xed-flags:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 3d57682f283414863ad1653efb62711fe9ab17bf
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Verify exact candidate and focused tests
        run: |
          set -euo pipefail
          test "$(git -C compiler rev-parse HEAD)" = "3d57682f283414863ad1653efb62711fe9ab17bf"
          python3 -m unittest discover -s compiler/tools -p test_x86_xed_flag_effects.py -v
          python3 -m py_compile compiler/tools/x86_s3f_source_xed_effect_policy.py compiler/tools/x86_s3l_generic_iform_xed_join.py
          mkdir -p /tmp/x7-s2
      - name: Build Intel XED real generated database at pinned revision
        run: |
          set -euo pipefail
          git clone --filter=blob:none https://github.com/intelxed/xed.git /tmp/xed
          git -C /tmp/xed checkout 0bcb6237345c5066726dcc08b3d87928df3b5b26
          git clone --filter=blob:none https://github.com/intelxed/mbuild.git /tmp/mbuild
          git -C /tmp/mbuild checkout 1b437e409221a2b5703b4d8896baa20d43e4ba1a
          test "$(git -C /tmp/xed rev-parse HEAD)" = 0bcb6237345c5066726dcc08b3d87928df3b5b26
          cd /tmp/xed
          ./mfile.py --no-encoder
          cd /tmp
          python3 /tmp/xed/pysrc/xed_to_db.py --xed-dgen /tmp/xed/obj/dgen \
            --out /tmp/x7-s2/xed-upstream.json --compact
          python3 "$GITHUB_WORKSPACE/compiler/tools/import_xed_forms.py" \
            --xed-json /tmp/x7-s2/xed-upstream.json \
            --xed-revision 0bcb6237345c5066726dcc08b3d87928df3b5b26 \
            --legacy-forms "$GITHUB_WORKSPACE/compiler/data/x86_encoding_forms.json" \
            --output /tmp/x7-s2/xed-normalized.json \
            --report /tmp/x7-s2/xed-report.json
      - name: Derive deterministic real XED arithmetic effects
        run: |
          set -euo pipefail
          python3 compiler/tools/x86_xed_flag_effects.py --normalized-xed /tmp/x7-s2/xed-normalized.json --out /tmp/x7-s2/flag-effects.json
          python3 compiler/tools/x86_xed_flag_effects.py --normalized-xed /tmp/x7-s2/xed-normalized.json --out /tmp/x7-s2/flag-effects.json --check
          python3 - <<'PY'
          import json
          r=json.load(open('/tmp/x7-s2/flag-effects.json'))
          assert r['summary']['unconditional_arithmetic'] > 0
          assert sum(r['summary'].values()) == len(r['forms'])
          for x in r['forms']:
              if x['effects'] is not None:
                  e=x['effects']
                  assert set(e['defined']).isdisjoint(e['undefined'])
          print(r['summary'])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: asm-d32-pinned-xed-flag-effects
          path: /tmp/x7-s2/flag-effects.json
          if-no-files-found: error
