# Isolated, source-pinned EDG C/C++ and FP shared SSA join acceptance; never merge.
name: TEMP EDG mixed integer and IEEE global data GCC
on:
  pull_request:
    paths: [.github/workflows/temp-edg-mixed-int-ieee-global-20261120.yml]
permissions:
  contents: read
jobs:
  fp-edg:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    container:
      image: ghcr.io/edgcpp/ci-runner@sha256:14b3948c2ce12cfa5472e5a6c468393d15426f3a67685cc35d830ea5db2acdf8
    defaults:
      run:
        shell: edg-container-exec "bash -eo pipefail {0}"
    env:
      EDG_SOURCE_SHA: 799603e0b5ab272d9418e2d44a53a95bc73dfdc4
      EDG_RELEASE_TAG: edgcpfe-ci-799603e0b5ab
      EDG_RELEASE_SHA256: fa769825e70766fbefe017806816b2338acd03daa93bb5562369c293972ce64c
      RUST_TOOLCHAIN_VERSION: 1.99.1
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 9a76effbbe46cb93a0a144796e948b974614073b
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          repository: bingundu/edgcpp
          ref: 799603e0b5ab272d9418e2d44a53a95bc73dfdc4
          path: edgcpp
          persist-credentials: false
      - name: Verify compiler source head
        working-directory: compiler
        run: test "$(git rev-parse HEAD)" = "9a76effbbe46cb93a0a144796e948b974614073b"
      - name: Prepare native EDG headers/config
        working-directory: edgcpp
        run: |
          export EDG_BASE="$PWD/bases/docker/dev-env/gcc"
          cmake --preset linux-gcc-release -DEDG_BUILD_LIB=OFF -DEDG_BUILD_CALLABLE_LIBRARY=ON -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
          cmake --build build/gcc-release --target error-info --parallel 2
      - name: Restore checksum-pinned callable EDG archive
        working-directory: edgcpp
        run: |
          set -euo pipefail
          url="https://github.com/bingundu/edgcpp/releases/download/$EDG_RELEASE_TAG/edgcpfe-ci-x86_64-callable-release-linux-x86_64.tar.gz"
          mkdir -p build/gcc-release/lib build/prebuilt-edg
          curl --fail --location --silent --show-error --retry 4 --retry-delay 2 "$url" --output build/prebuilt-edg/archive.tar.gz
          printf '%s  %s\n' "$EDG_RELEASE_SHA256" build/prebuilt-edg/archive.tar.gz | sha256sum --check --status
          tar -xzf build/prebuilt-edg/archive.tar.gz -C build/prebuilt-edg
          grep -Fx "commit=$EDG_SOURCE_SHA" build/prebuilt-edg/BUILD-INFO.txt
          cp build/prebuilt-edg/lib/libedgcpfe.a build/gcc-release/lib/libedgcpfe.a
      - name: Install pinned Rust toolchain
        run: |
          if ! command -v cargo >/dev/null; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain "$RUST_TOOLCHAIN_VERSION"
          fi
          export PATH="$HOME/.cargo/bin:$PATH"
          rustup toolchain install "$RUST_TOOLCHAIN_VERSION" --profile minimal
          rustup default "$RUST_TOOLCHAIN_VERSION"
      - name: Build EDG native TypeId bridge
        working-directory: compiler
        env:
          EDGCPP_SOURCE_DIR: ${{ github.workspace }}/edgcpp
          EDGCPP_COMPILE_COMMANDS: ${{ github.workspace }}/edgcpp/build/gcc-release/compile_commands.json
          EDGCPP_LIB_DIR: ${{ github.workspace }}/edgcpp/build/gcc-release/lib
          EDGCPP_EDG_REVISION: ${{ env.EDG_SOURCE_SHA }}
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          cargo test --manifest-path tools/edg-driver/Cargo.toml --no-run
          cargo test --manifest-path tools/edg-driver/Cargo.toml emits_byte_exact_typeid_ptroffset_and_proven_zero_identity -- --nocapture
          cargo build --manifest-path tools/edg-driver/Cargo.toml
      - name: Mixed EDG native GP and FP global ELF data BSS extern and GCC
        working-directory: compiler
        run: |
          set -euo pipefail
          export PATH="$HOME/.cargo/bin:$PATH"
          cp tools/edg-driver/tests/fixtures/edg_native_fp_mixed_global*.c ../edgcpp/build/gcc-release/
          cd ../edgcpp/build/gcc-release
          source environment.sh
          tool="../../../compiler/tools/edg-driver/target/debug/compiler-edg-driver"
          "$tool" edg_mixed_fp_globals.o --c11 edg_native_fp_mixed_global.c
          test "$(od -An -tx1 -N4 edg_mixed_fp_globals.o | tr -d ' \\n')" = 7f454c46
          readelf -W -S edg_mixed_fp_globals.o | grep -q '\.data'
          readelf -W -S edg_mixed_fp_globals.o | grep -q '\.bss'
          readelf -W -r edg_mixed_fp_globals.o | grep -q edg_fp_mix_import
          for sym in edg_fp_mix_data32 edg_fp_mix_data64 edg_fp_mix_bss edg_fp_mix_gp edg_fp_mix_gp_loop edg_fp_mix_read32 edg_fp_mix_read64 edg_fp_mix_store32 edg_fp_mix_store64 edg_fp_mix_bss_update edg_fp_mix_internal_read edg_fp_mix_external_read; do
            nm -g --defined-only edg_mixed_fp_globals.o | grep -q "$sym"
          done
          if nm -g --defined-only edg_mixed_fp_globals.o | awk '$3=="edg_fp_mix_internal" {found=1} END {exit !found}'; then
            echo "internal FP global exported"; exit 1
          fi
          gcc -std=c11 -O2 -Wall -Wextra -Werror edg_native_fp_mixed_global.c edg_native_fp_mixed_global_driver.c -o gcc_mixed_fp_global
          gcc -std=c11 -O2 -Wall -Wextra -Werror edg_mixed_fp_globals.o edg_native_fp_mixed_global_driver.c -o compiler_mixed_fp_global
          ./gcc_mixed_fp_global
          ./compiler_mixed_fp_global
          for bad in edg_native_fp_mixed_global_bad_integer.c edg_native_fp_mixed_global_bad_volatile.c; do
            rm -f bad_mixed_global.o
            if "$tool" bad_mixed_global.o --c11 "$bad"; then
              echo "unsupported mixed FP/GP global source accepted: $bad"; exit 1
            fi
            test ! -e bad_mixed_global.o
          done
      - name: EDG native mixed integer and IEEE FP global ELF data and GCC differential
        working-directory: compiler
        run: |
          set -euo pipefail
          export PATH="$HOME/.cargo/bin:$PATH"
          cp tools/edg-driver/tests/fixtures/edg_native_fp_integer_ieee_globals*.c ../edgcpp/build/gcc-release/
          cd ../edgcpp/build/gcc-release
          source environment.sh
          tool="../../../compiler/tools/edg-driver/target/debug/compiler-edg-driver"
          "$tool" edg_int_ieee_globals.o --c11 edg_native_fp_integer_ieee_globals.c
          test "$(od -An -tx1 -N4 edg_int_ieee_globals.o | tr -d ' \\n')" = 7f454c46
          readelf -W -S edg_int_ieee_globals.o | grep -q '\.data'
          readelf -W -S edg_int_ieee_globals.o | grep -q '\.bss'
          readelf -W -r edg_int_ieee_globals.o | grep -q edg_mix_global_import64
          for sym in edg_mix_global_i32 edg_mix_global_i64 edg_mix_global_f32 edg_mix_global_f64 edg_mix_global_bss edg_mix_global_read_i32 edg_mix_global_read_i64 edg_mix_global_read_f32 edg_mix_global_read_f64 edg_mix_global_store_f32 edg_mix_global_store_f64 edg_mix_global_bss_update edg_mix_global_import edg_mix_global_gp_loop; do
            nm -g --defined-only edg_int_ieee_globals.o | awk -v s="$sym" '$3==s {found=1} END {exit !found}'
          done
          gcc -std=c11 -O2 -Wall -Wextra -Werror edg_native_fp_integer_ieee_globals.c edg_native_fp_integer_ieee_globals_driver.c -o gcc_int_ieee_globals
          gcc -std=c11 -O2 -Wall -Wextra -Werror edg_int_ieee_globals.o edg_native_fp_integer_ieee_globals_driver.c -o compiler_int_ieee_globals
          ./gcc_int_ieee_globals
          ./compiler_int_ieee_globals
          for bad in edg_native_fp_integer_ieee_globals_bad_tentative.c edg_native_fp_integer_ieee_globals_bad_volatile.c edg_native_fp_integer_ieee_globals_bad_address.c; do
            rm -f bad_int_ieee_global.o
            if "$tool" bad_int_ieee_global.o --c11 "$bad"; then
              echo "unsupported EDG integer/IEEE global source accepted: $bad"; exit 1
            fi
            test ! -e bad_int_ieee_global.o
          done
      - name: Full native EDG C/C++ and FP lowering unit suite
        working-directory: compiler
        env:
          EDGCPP_SOURCE_DIR: ${{ github.workspace }}/edgcpp
          EDGCPP_COMPILE_COMMANDS: ${{ github.workspace }}/edgcpp/build/gcc-release/compile_commands.json
          EDGCPP_LIB_DIR: ${{ github.workspace }}/edgcpp/build/gcc-release/lib
          EDGCPP_EDG_REVISION: ${{ env.EDG_SOURCE_SHA }}
        run: |
          set -euo pipefail
          export PATH="$HOME/.cargo/bin:$PATH"
          cargo test --manifest-path tools/edg-driver/Cargo.toml --bin compiler-edg-driver -- --test-threads=2
      - name: Source-independent TypeId join planner and CFG unit tests
        working-directory: compiler
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          # Do not resolve the unrelated compiler workspace's private Mini-C
          # Git dependency for a dependency-free canonical IR unit gate.
          temp="$(mktemp -d)"
          cp -a crates/ir "$temp/ir"
          cargo test --manifest-path "$temp/ir/Cargo.toml" --lib
      - name: EDG native if/while CFG SSA join and loop phi GCC differential
        working-directory: compiler
        run: |
          set -euo pipefail
          cp tools/edg-driver/tests/fixtures/edg_native_cfg*.c ../edgcpp/build/gcc-release/
          (
            cd ../edgcpp/build/gcc-release
            source environment.sh
            binary="../../../compiler/tools/edg-driver/target/debug/compiler-edg-driver"
            if ! "$binary" edg_cfg_native.o --c11 edg_native_cfg.c >edg_cfg_native.log 2>&1; then
              cat edg_cfg_native.log
              exit 1
            fi
            test "$(od -An -tx1 -N4 edg_cfg_native.o | tr -d ' \n')" = 7f454c46
            nm -g --defined-only edg_cfg_native.o | grep -q edg_cfg_while
            nm -g --defined-only edg_cfg_native.o | grep -q edg_cfg_formal_phi
            gcc -std=c11 -O2 -Wall -Wextra -Werror edg_native_cfg.c edg_native_cfg_driver.c -o gcc_edg_cfg
            gcc -std=c11 -O2 -Wall -Wextra -Werror edg_cfg_native.o edg_native_cfg_driver.c -o compiler_edg_cfg
            ./gcc_edg_cfg
            ./compiler_edg_cfg
            # The side-effecting condition is supported by current compiler main.
            # Keep it as a positive executable GCC differential rather than
            # silently allowing the old "bad" fixture to stop testing semantics.
            if ! "$binary" edg_cfg_effect.o --c11 edg_native_cfg_bad_condition_effect.c >edg_cfg_effect.log 2>&1; then
              cat edg_cfg_effect.log
              exit 1
            fi
            printf '%s\n' '#include <stdio.h>' 'int edg_cfg_bad_condition_effect(int,int);' 'int main(void) {' 'const int xs[]={0,0,1,1,1,-3,2};' 'const int ys[]={0,7,0,5,-2,3,-4};' 'const int want[]={0,0,0,6,-1,4,-3};' 'for (unsigned i=0;i<sizeof(xs)/sizeof(xs[0]);i++) {' 'int got=edg_cfg_bad_condition_effect(xs[i],ys[i]);' 'if (got!=want[i]) { fprintf(stderr,"input x=%d y=%d got=%d expected=%d\\n",xs[i],ys[i],got,want[i]); return 1; }' '}' 'return 0;' '}' >edg_cfg_effect_driver.c
            gcc -std=c11 -O2 -Wall -Wextra -Werror edg_native_cfg_bad_condition_effect.c edg_cfg_effect_driver.c -o gcc_edg_cfg_effect
            gcc -std=c11 -O2 -Wall -Wextra -Werror edg_cfg_effect.o edg_cfg_effect_driver.c -o compiler_edg_cfg_effect
            echo 'Run GCC source oracle for side-effectful condition'
            ./gcc_edg_cfg_effect
            echo 'Run native compiler for side-effectful condition'
            ./compiler_edg_cfg_effect
            # Source-owned, path-sensitive SSA definitions across &&, ||,
            # nested conditions and mutable formals. Must execute identically
            # to GCC, not merely compile successfully.
            if ! "$binary" edg_sc_state.o --c11 edg_native_cfg_sc_state.c >edg_sc_state.log 2>&1; then
              cat edg_sc_state.log
              exit 1
            fi
            gcc -std=c11 -O2 -Wall -Wextra -Werror edg_native_cfg_sc_state.c edg_native_cfg_sc_state_driver.c -o gcc_edg_sc_state
            gcc -std=c11 -O2 -Wall -Wextra -Werror edg_sc_state.o edg_native_cfg_sc_state_driver.c -o compiler_edg_sc_state
            ./gcc_edg_sc_state
            ./compiler_edg_sc_state
            for source in edg_native_cfg_bad_uninit_if.c edg_native_cfg_bad_uninit_loop.c edg_native_cfg_bad_shadow_uninit.c edg_native_cfg_bad_do.c edg_native_cfg_bad_goto.c edg_native_cfg_bad_volatile.c; do
              rm -f bad_edg_cfg.o bad_edg_cfg.log
              if "$binary" bad_edg_cfg.o --c11 "$source" >bad_edg_cfg.log 2>&1; then
                echo "Unsupported source unexpectedly compiled: $source"
                exit 1
              fi
              cat bad_edg_cfg.log
              test ! -e bad_edg_cfg.o
            done
          )

      - name: EDG C99 for loops and scalar compound SSA updates vs GCC
        working-directory: compiler
        run: |
          set -euo pipefail
          cp tools/edg-driver/tests/fixtures/edg_native_c99*.c ../edgcpp/build/gcc-release/
          (
            cd ../edgcpp/build/gcc-release
            source environment.sh
            binary="../../../compiler/tools/edg-driver/target/debug/compiler-edg-driver"
            if ! "$binary" edg_c99_loops.o --c11 edg_native_c99_loops.c >edg_c99.log 2>&1; then
              cat edg_c99.log
              exit 1
            fi
            test "$(od -An -tx1 -N4 edg_c99_loops.o | tr -d ' \n')" = 7f454c46
            nm -g --defined-only edg_c99_loops.o | grep -q edg_c99_for_nested
            nm -g --defined-only edg_c99_loops.o | grep -q edg_c99_compound_i64
            gcc -std=c11 -O2 -Wall -Wextra -Werror edg_native_c99_loops.c edg_native_c99_loops_driver.c -o gcc_edg_c99
            gcc -std=c11 -O2 -Wall -Wextra -Werror edg_c99_loops.o edg_native_c99_loops_driver.c -o compiler_edg_c99
            ./gcc_edg_c99
            ./compiler_edg_c99
            for source in edg_native_c99_bad_break.c edg_native_c99_bad_continue.c edg_native_c99_bad_pointer_update.c edg_native_c99_bad_value_update.c edg_native_c99_bad_unbounded_for.c; do
              rm -f bad_edg_c99.o bad_edg_c99.log
              if "$binary" bad_edg_c99.o --c11 "$source" >bad_edg_c99.log 2>&1; then
                echo "Unsupported native C99 control/effect semantics unexpectedly compiled: $source"
                exit 1
              fi
              cat bad_edg_c99.log
              test ! -e bad_edg_c99.o
            done
          )

      - name: EDG native C++ overloaded functions and external ABI vs G++
        working-directory: compiler
        run: |
          set -euo pipefail
          export PATH="$HOME/.cargo/bin:$PATH"
          cp tools/edg-driver/tests/fixtures/edg_native_cxx0_free*.cpp ../edgcpp/build/gcc-release/
          (
            cd ../edgcpp/build/gcc-release
            source environment.sh
            binary="../../../compiler/tools/edg-driver/target/debug/compiler-edg-driver"
            "$binary" edg_cxx0_shared.o --c++17 edg_native_cxx0_free.cpp
            g++ -std=c++17 -O2 -Wall -Wextra -Werror edg_native_cxx0_free.cpp edg_native_cxx0_free_driver.cpp -o gcc_cxx0_shared
            g++ -std=c++17 -O2 -Wall -Wextra -Werror edg_cxx0_shared.o edg_native_cxx0_free_driver.cpp -o compiler_cxx0_shared
            ./gcc_cxx0_shared
            ./compiler_cxx0_shared
          )
      - name: Generated EDG TypeId cross-type recursive CFG GCC differential
        working-directory: compiler
        run: |
          set -euo pipefail
          export PATH="$HOME/.cargo/bin:$PATH"
          cd ../edgcpp/build/gcc-release
          source environment.sh
          python3 ../../../compiler/tools/edg-driver/tests/generated_source_flow.py \
            ../../../compiler/tools/edg-driver/target/debug/compiler-edg-driver
      - name: Native F32 F64 source GCC executable and fail-closed local
        working-directory: compiler
        run: |
          set -euo pipefail
          export PATH="$HOME/.cargo/bin:$PATH"
          cp tools/edg-driver/tests/fixtures/edg_native_fp_leaf*.c ../edgcpp/build/gcc-release/
          cd ../edgcpp/build/gcc-release
          source environment.sh
          tool="../../../compiler/tools/edg-driver/target/debug/compiler-edg-driver"
          "$tool" native_fp.o --c11 edg_native_fp_leaf.c
          gcc -std=c11 -O2 -Wall -Wextra -Werror edg_native_fp_leaf.c edg_native_fp_leaf_driver.c -o gcc_fp
          gcc -std=c11 -O2 -Wall -Wextra -Werror native_fp.o edg_native_fp_leaf_driver.c -o compiler_fp
          ./gcc_fp
          ./compiler_fp
          for bad in edg_native_fp_leaf_bad.c edg_native_fp_leaf_uninit.c edg_native_fp_leaf_bad_join.c; do
            rm -f bad_fp.o
            if "$tool" bad_fp.o --c11 "$bad"; then
              echo "unlegalized EDG FP case accepted: $bad"; exit 1
            fi
            test ! -e bad_fp.o
          done
      - name: Mixed EDG C GP and FP single object native GCC differential
        working-directory: compiler
        run: |
          set -euo pipefail
          export PATH="$HOME/.cargo/bin:$PATH"
          cp tools/edg-driver/tests/fixtures/edg_native_fp_mixed*.c ../edgcpp/build/gcc-release/
          cd ../edgcpp/build/gcc-release
          source environment.sh
          tool="../../../compiler/tools/edg-driver/target/debug/compiler-edg-driver"
          "$tool" native_mixed.o --c11 edg_native_fp_mixed.c
          test "$(od -An -tx1 -N4 native_mixed.o | tr -d ' \\n')" = 7f454c46
          for symbol in edg_mixed_gp_add edg_mixed_gp_wide edg_mixed_fp_add edg_mixed_fp_loop edg_mixed_fp_call edg_mixed_gp_call; do
            nm -g --defined-only native_mixed.o | grep -q "$symbol"
          done
          gcc -std=c11 -O2 -Wall -Wextra -Werror edg_native_fp_mixed.c edg_native_fp_mixed_driver.c -o gcc_mixed
          gcc -std=c11 -O2 -Wall -Wextra -Werror native_mixed.o edg_native_fp_mixed_driver.c -o compiler_mixed
          ./gcc_mixed
          ./compiler_mixed
          rm -f bad_mixed.o
          if "$tool" bad_mixed.o --c11 edg_native_fp_mixed_bad_global.c; then
            echo "unsupported EDG FP global accepted in mixed translation unit"; exit 1
          fi
          test ! -e bad_mixed.o
      - name: Checked EDG signed I32 and FP same-function numeric/ABI GCC differential
        working-directory: compiler
        run: |
          set -euo pipefail
          export PATH="$HOME/.cargo/bin:$PATH"
          cp tools/edg-driver/tests/fixtures/edg_native_fp_mixed_scalar*.c ../edgcpp/build/gcc-release/
          cd ../edgcpp/build/gcc-release
          source environment.sh
          tool="../../../compiler/tools/edg-driver/target/debug/compiler-edg-driver"
          "$tool" native_scalar.o --c11 edg_native_fp_mixed_scalar.c
          test "$(od -An -tx1 -N4 native_scalar.o | tr -d ' \\n')" = 7f454c46
          nm -g --defined-only native_scalar.o | grep -q edg_fp_i32_addf
          nm -g --defined-only native_scalar.o | grep -q edg_fp_i32_addd
          nm -g --defined-only native_scalar.o | grep -q edg_fp_i32_loop
          gcc -std=c11 -O2 -Wall -Wextra -Werror edg_native_fp_mixed_scalar.c edg_native_fp_mixed_scalar_driver.c -o gcc_scalar
          gcc -std=c11 -O2 -Wall -Wextra -Werror native_scalar.o edg_native_fp_mixed_scalar_driver.c -o compiler_scalar
          ./gcc_scalar
          ./compiler_scalar
          rm -f bad_scalar.o
          if "$tool" bad_scalar.o --c11 edg_native_fp_mixed_scalar_bad.c; then
            echo "unsupported unsigned-to-FP EDG numeric ABI accepted"; exit 1
          fi
          test ! -e bad_scalar.o
      - name: EDG canonical TypeKind signed I32 and FP locals GCC differential
        working-directory: compiler
        run: |
          set -euo pipefail
          export PATH="$HOME/.cargo/bin:$PATH"
          cp tools/edg-driver/tests/fixtures/edg_native_fp_scalar_locals*.c ../edgcpp/build/gcc-release/
          cd ../edgcpp/build/gcc-release
          source environment.sh
          tool="../../../compiler/tools/edg-driver/target/debug/compiler-edg-driver"
          "$tool" native_locals.o --c11 edg_native_fp_scalar_locals.c
          test "$(od -An -tx1 -N4 native_locals.o | tr -d ' \\n')" = 7f454c46
          for symbol in edg_fp_scalar_local edg_fp_scalar_join edg_fp_scalar_loop edg_fp_scalar_shadow edg_fp_scalar_expr_init edg_fp_scalar_mixed_locals; do
            nm -g --defined-only native_locals.o | grep -q "$symbol"
          done
          gcc -std=c11 -O2 -Wall -Wextra -Werror edg_native_fp_scalar_locals.c edg_native_fp_scalar_locals_driver.c -o gcc_locals
          gcc -std=c11 -O2 -Wall -Wextra -Werror native_locals.o edg_native_fp_scalar_locals_driver.c -o compiler_locals
          ./gcc_locals
          ./compiler_locals
          for bad in edg_native_fp_scalar_locals_bad_uninit.c edg_native_fp_scalar_locals_bad_unsigned.c; do
            rm -f bad_locals.o
            if "$tool" bad_locals.o --c11 "$bad"; then
              echo "unsupported EDG scalar local accepted: $bad"; exit 1
            fi
            test ! -e bad_locals.o
          done
      - name: EDG source FP-to-signed-i32 conversion native GCC and negative ABI
        working-directory: compiler
        run: |
          set -euo pipefail
          export PATH="$HOME/.cargo/bin:$PATH"
          cp tools/edg-driver/tests/fixtures/edg_native_fp_to_i32*.c ../edgcpp/build/gcc-release/
          cd ../edgcpp/build/gcc-release
          source environment.sh
          tool="../../../compiler/tools/edg-driver/target/debug/compiler-edg-driver"
          "$tool" native_fp_to_i32.o --c11 edg_native_fp_to_i32.c
          test "$(od -An -tx1 -N4 native_fp_to_i32.o | tr -d ' \\n')" = 7f454c46
          for sym in edg_fp_to_i32_f32 edg_fp_to_i32_f64 edg_fp_to_i32_roundtrip edg_fp_to_i32_loop edg_fp_to_i32_branch edg_fp_to_i32_mixed; do
            nm -g --defined-only native_fp_to_i32.o | grep -q "$sym"
          done
          gcc -std=c11 -O2 -Wall -Wextra -Werror edg_native_fp_to_i32.c edg_native_fp_to_i32_driver.c -o gcc_fp_to_i32
          gcc -std=c11 -O2 -Wall -Wextra -Werror native_fp_to_i32.o edg_native_fp_to_i32_driver.c -o compiler_fp_to_i32
          ./gcc_fp_to_i32
          ./compiler_fp_to_i32
          for bad in edg_native_fp_to_i32_bad_unsigned.c edg_native_fp_to_i32_bad_wide.c; do
            rm -f bad_i32.o
            if "$tool" bad_i32.o --c11 "$bad"; then
