# Source-pinned W6a–W6d combined backend integration against current main.
name: Wasm W6 main integration

on:
  pull_request:
    paths:
      - '.github/workflows/wasm-w6-main-integration.yml'
  workflow_dispatch:
    inputs:
      compiler_sha:
        description: 'Exact compiler SHA to verify'
        required: true
        type: string

permissions:
  contents: read

jobs:
  wasm-w6:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout exact W6 integration commit
        uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: ${{ inputs.compiler_sha || '49608109d1cc92f0ab6f236c50a30ce659501fd3' }}
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Verify source pin and create isolated credential-free backend workspace
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C compiler rev-parse HEAD)" = "${{ inputs.compiler_sha || '49608109d1cc92f0ab6f236c50a30ce659501fd3' }}"
          echo "Integrated compiler: $(git -C compiler rev-parse HEAD)"
          grep -F '"crates/backend-wasm"' compiler/Cargo.toml
          grep -F '"crates/backend-riscv64"' compiler/Cargo.toml
          cat > compiler/Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir", "crates/opt", "crates/backend", "crates/backend-x86", "crates/backend-aarch64", "crates/backend-riscv64", "crates/backend-wasm"]
          EOF
          rm -f compiler/Cargo.lock
          rustc --version
          cc --version | head -1
      - name: Setup independent Node WebAssembly execution runtime
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Cache backend Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: wasm-w6-main-integration
      - name: Run all W0-W6d tests including TypeId file-to-Wasm and native x86 ELF differential
        working-directory: compiler
        run: cargo test -p compiler-backend-wasm --tests -- --nocapture
      - name: Shared TypeId native backend tests
        working-directory: compiler
        run: cargo test -p compiler-backend --lib
      - name: Native x86 AArch64 RISC-V backend library tests
        working-directory: compiler
        run: cargo test -p compiler-backend-x86 -p compiler-backend-aarch64 -p compiler-backend-riscv64 --lib
      - name: Complete native x86 integration tests
        working-directory: compiler
        run: cargo test -p compiler-backend-x86 --tests
      - name: Strict backend all-target Clippy
        working-directory: compiler
        run: cargo clippy -p compiler-backend-wasm -p compiler-backend --all-targets -- -D warnings
