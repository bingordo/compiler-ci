name: AArch64 scalar FP encoder acceptance (PR 539)
on:
  push:
    paths:
      - '.github/workflows/aarch64-fp-539.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aarch64-fp-539
  cancel-in-progress: true

jobs:
  fp-encoder:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - name: Configure read-only checkout credentials
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.CI_KEY }}
      - name: Trust GitHub
        run: ssh-keyscan github.com >> ~/.ssh/known_hosts
      - name: Checkout immutable compiler candidate
        uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: ea7f74234cec518432148d043735f24b1db891db
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
          path: compiler
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Set up self-contained core workspace
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C compiler rev-parse HEAD)" = ea7f74234cec518432148d043735f24b1db891db
          mkdir -p workspace/crates
          cp -a compiler/crates/ir compiler/crates/backend compiler/crates/backend-aarch64 workspace/crates/
          cat > workspace/Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir", "crates/backend", "crates/backend-aarch64"]
          EOF
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: workspace
          key: aarch64-fp-encoder-539
      - name: Check every target with warnings denied
        working-directory: workspace
        run: RUSTFLAGS="-D warnings" cargo check -p compiler-backend-aarch64 --all-targets
      - name: Run physical FP encodings and negative tests natively
        working-directory: workspace
        run: cargo test -p compiler-backend-aarch64 fp_encoding::tests -- --nocapture
      - name: Retain all backend regressions
        working-directory: workspace
        run: cargo test -p compiler-ir -p compiler-backend -p compiler-backend-aarch64 -- --test-threads=1
      - name: Strict production-library Clippy
        working-directory: workspace
        run: cargo clippy -p compiler-backend-aarch64 --lib -- -D warnings
      - name: Report exact accepted SHA
        run: echo 'AArch64 FP encoder candidate ea7f74234cec518432148d043735f24b1db891db verified on native ARM64' >> "$GITHUB_STEP_SUMMARY"
