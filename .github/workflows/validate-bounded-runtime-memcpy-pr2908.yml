name: Validate bounded runtime LP64 memcpy PR2908
# Recheck updated immutable source candidate with block-param zero-extend bound.
on:
  push:
    branches: [main]
    paths: ['.github/workflows/validate-bounded-runtime-memcpy-pr2908.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-and-machine:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 7cfa8a9752aa02626b3425132d825435cad2dd2c
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: bingordo/mini-c
          ref: 1e05474aab47db77f4884e39f84c767742bc204c
          path: mini-c-pinned
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: bingordo/oberon
          ref: 88979bfeda0ec08f9453010771df70ee5d28169c
          path: oberon-pinned
          fetch-depth: 0
          persist-credentials: false
      - name: Check immutable source inputs and local frontend mirrors
        run: |
          set -euo pipefail
          test "$(git -C compiler rev-parse HEAD)" = 7cfa8a9752aa02626b3425132d825435cad2dd2c
          test "$(git -C mini-c-pinned rev-parse HEAD)" = 1e05474aab47db77f4884e39f84c767742bc204c
          test "$(git -C oberon-pinned rev-parse HEAD)" = 88979bfeda0ec08f9453010771df70ee5d28169c
          git -C mini-c-pinned cat-file -e '6ba1cb655d8bb2cf5b795aa774e8234d4f701e0b^{commit}'
          git config --global url."file://${GITHUB_WORKSPACE}/mini-c-pinned".insteadOf "ssh://git@github.com/bingordo/mini-c.git"
          git config --global url."file://${GITHUB_WORKSPACE}/oberon-pinned".insteadOf "ssh://git@github.com/bingordo/oberon.git"
          git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
          cat > compiler/Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir","crates/opt","crates/backend","crates/backend-x86","crates/backend-aarch64","crates/backend-riscv64","crates/backend-wasm","crates/driver"]
          exclude = ["tools/mini-c-driver"]
          EOF
          rm -f compiler/Cargo.lock
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: pr2908-bounded-runtime-local-memcpy
      - name: TypeId bounded count and maximum range proof tests
        working-directory: compiler
        run: cargo test -p compiler-ir --lib typed_memcopy_provenance -- --nocapture
      - name: Mini-C checked local copies and SSA arithmetic tests
        working-directory: compiler
        run: cargo test --manifest-path tools/mini-c-driver/Cargo.toml --lib checked_local_memcpy -- --nocapture
      - name: Dynamic 64-bit C memcpy GAS/direct ELF vs GCC differential
        working-directory: compiler
        run: cargo test -p compiler --test native_lp64_bounded_dynamic_memcpy -- --nocapture
      - name: Previous constant interior native memcpy vs GCC
        working-directory: compiler
        run: cargo test -p compiler --test native_lp64_memcopy_interiors -- --nocapture
      - name: Existing native whole-local object memcpy GCC regression
        working-directory: compiler
        run: cargo test -p compiler --test wasm32_minic_source native_lp64_ -- --nocapture
      - name: W12m arithmetic and W12k/W12l source regression
        working-directory: compiler
        run: |
          cargo test -p compiler --test wasm32_minic_source wasm32_w12m_ -- --nocapture
          cargo test -p compiler --test wasm32_minic_source wasm32_w12k_ -- --nocapture
          cargo test -p compiler --test wasm32_minic_source wasm32_w12l_ -- --nocapture
      - name: AArch64 retains runtime libc copy source policy
        working-directory: compiler
        run: cargo test --manifest-path tools/mini-c-driver/Cargo.toml --lib native_lp64_machine_bulkcopy_is_not_forced_on_aarch64 -- --nocapture
      - name: Full TypeId IR shared backend x86 and AArch64 library suites
        working-directory: compiler
        run: |
          cargo test -p compiler-ir --lib
          cargo test -p compiler-backend --lib
          # Inherited att-generated form inventory expects 54 while the
          # current source-generated table has 60; no x86 assembler,
          # generator or form-test file is changed by compiler PR #2908.
          cargo test -p compiler-backend-x86 --lib -- --skip att_asm::generated_form_tests::every_generated_form_assembles_through_existing_encoder
          cargo test -p compiler-backend-aarch64 --lib
      - name: Format new shared interval analysis and runtime source tests
        working-directory: compiler
        run: rustfmt --edition 2021 --check crates/ir/src/typed_local_byte_ranges.rs crates/ir/src/typed_memcopy_provenance.rs crates/ir/tests/unit/typed_memcopy_provenance.rs crates/driver/tests/native_lp64_bounded_dynamic_memcpy.rs
