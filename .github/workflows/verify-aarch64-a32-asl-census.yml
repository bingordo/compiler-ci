name: Inspect AARCHMRS ASL operation AST for A3.2
on:
  push:
    branches: [ci/aarch64-a32-asl-census-20261110]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  schema:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Read exact pinned public ASL source
        run: |
          set -euo pipefail
          git clone --quiet --depth 1 --filter=blob:none https://kernel.googlesource.com/pub/scm/linux/kernel/git/maz/AARCHMRS mrs
          test "$(git -C mrs rev-parse HEAD)" = 1346b16d47619400448f3cb6d4f22d62d3b76848
          echo "ef75f3ec02df1b9b9c0612f4ea259d6710ac3de686b097d8f9c83d1d97aa800a  mrs/Instructions.json" | sha256sum -c -
          python3 - <<'PY'
          import json
          from collections import Counter
          from pathlib import Path
          root=json.loads(Path('mrs/Instructions.json').read_bytes())
          ops=root['operations']
          print('ROOT',list(root),'OPCOUNT',len(ops))
          print('FIRST_3_OP_KEYS',list(ops)[:3])
          tree=[r for r in root['instructions'] if r.get('name')=='A64'][0]
          target={'ADD_64_addsub_shift','ADD_64_addsub_imm','AND_64_log_shift',
                  'MOVZ_64_movewide','LDR_64_ldst_pos','B_only_branch_imm',
                  'SUBS_64_addsub_shift','CBZ_64_compbranch','LSLV_64_dp_2src'}
          found={}
          def visit(node):
              if node.get('name') in target:
                  found[node['name']]=node
              for ch in node.get('children',[]):
                  if isinstance(ch,dict):visit(ch)
          visit(tree)
          print('FOUND',sorted(found))
          for name in sorted(found):
              n=found[name];k=n.get('operation_id');v=ops.get(k)
              print('\n=== '+name+' ===')
              print('ID',repr(k),'LEAF_KEYS',list(n), 'TYPE',n.get('_type'))
              print('OPVALUE',repr(v)[:6500])
              print('LEAFOPCODE',repr(n.get('operation'))[:500])
              print('CHILDREN',str(len(n.get('children',[]))))
          typecount=Counter()
          ops_with_code=0
          for v in ops.values():
              if isinstance(v,dict):
                  typecount[v.get('_type','none')]+=1
                  if v.get('code') is not None:ops_with_code+=1
          print('OP_TYPES',typecount,'CODE_COUNT',ops_with_code)
          PY
      - name: Classify placeholder versus actual operation text
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from collections import Counter
          root=json.load(open("mrs/Instructions.json"))
          operations=root["operations"]
          count=Counter()
          lengths=Counter()
          nonempty=[]
          for key,val in operations.items():
              op=val.get("operation") if isinstance(val,dict) else None
              if not isinstance(op,str):
                  count["missing"]+=1
              elif op.strip() in ("", "// Not specified"):
                  count["placeholder"]+=1
              else:
                  count["concrete"]+=1
                  nonempty.append((key,len(op),op[:100]))
              lengths[len(op) if isinstance(op,str) else -1]+=1
          print("AARCHMRS_OPERATIONS",len(operations),"CLASS",dict(count))
          print("SOURCE_LENGTHS",lengths.most_common(8))
          print("NON_PLACEHOLDER_EXAMPLES",nonempty[:8])
          PY
      - name: Inspect official Arm A64 XML semantic-source package
        run: |
          set -euo pipefail
          URL=https://developer.arm.com/-/cdn-downloads/permalink/Exploration-Tools-A64-ISA/ISA_A64/ISA_A64_xml_A_profile-2026-06.tar.gz
          curl -fLsS --retry 2 --connect-timeout 15 --max-time 180 --max-filesize 200000000 -o /tmp/arm-a64-isa.xml.tgz "$URL"
          test -s /tmp/arm-a64-isa.xml.tgz
          file /tmp/arm-a64-isa.xml.tgz
          sha256sum /tmp/arm-a64-isa.xml.tgz
          tar tzf /tmp/arm-a64-isa.xml.tgz | python3 -c 'import sys; a=sys.stdin.read().splitlines(); print("ARCHIVE_ENTRIES",len(a),"FIRST",a[:20]); print("ADD", [v for v in a if "/add_" in v][:12]); print("PSEUDOCODE", [v for v in a if "shared_pseudocode" in v][:4])'
          python3 - <<'PY'
          from collections import Counter
          import tarfile
          import xml.etree.ElementTree as ET
          archive=tarfile.open("/tmp/arm-a64-isa.xml.tgz","r:gz")
          choices=[p for p in archive.getmembers()
                   if p.name.lower().endswith('.xml') and any(t in p.name.lower().split('/')[-1] for t in ('add_addsub', 'and_log_shift')) and p.isfile()]
          print('XML_SELECTED',[(p.name,p.size) for p in choices])
          if not choices:raise SystemExit('no ADD/AND XML found')
          for entry in choices[:6]:
              if entry.size>2_000_000:raise SystemExit('oversized XML')
              doc=ET.parse(archive.extractfile(entry)).getroot()
              counts=Counter(x.tag for x in doc.iter())
              pseudo=[x for x in doc.iter() if x.tag in ('ps','pstext','ps_section')]
              print('XML_FILE',entry.name,'ROOT',doc.tag,
                    'ROOT_ATTRS',doc.attrib,'TOP_TAGS',counts.most_common(15),
                    'PS',[(x.tag,sorted(x.attrib),len(''.join(x.itertext()))) for x in pseudo[:12]])
              if not pseudo:raise SystemExit('ASL pseudocode absent from XML')
          PY
