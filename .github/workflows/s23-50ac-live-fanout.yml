name: S23.50ac live shared-producer fanout acceptance
on:
  pull_request:
    paths:
      - '.github/workflows/s23-50ac-live-fanout.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  live-native-ssa:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
    steps:
      - name: Checkout exact compiler source, never run compiler Actions
        uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 5c27c84f43134e64d89525c05be5a9f4443a3f17
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Verify source pin and prepare public Cargo Git dependencies
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C compiler rev-parse HEAD)" = 5c27c84f43134e64d89525c05be5a9f4443a3f17
          git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
          rustc --version
          python3 --version
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: s23-50ac-live-native-ssa
      - name: Run deterministic generated positive and negative fixture tests
        working-directory: compiler
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tools/typeid-rule-gen -p 'test_native_casegen.py' -v
          python3 -m unittest discover -s tools/typeid-rule-gen -p 'test_native_nearmiss_codegen.py' -v
      - name: Verify all 7720 positive and 21840 negative live TypeId SSA cases
        working-directory: compiler
        shell: bash
        run: |
          set -euo pipefail
          cargo test -p compiler-opt --test native_s2350z_generated_matrix -- --nocapture
          cargo test -p compiler-opt --test native_s2350aa_generated_nearmisses -- --nocapture
      - name: Verify scoped strict Clippy and opt-out compilation
        working-directory: compiler
        shell: bash
        run: |
          set -euo pipefail
          cargo clippy -p compiler-opt --test native_s2350z_generated_matrix -- -D warnings -A unused-variables
          cargo clippy -p compiler-opt --test native_s2350aa_generated_nearmisses -- -D warnings -A unused-variables
          cargo check -p compiler-opt --no-default-features
