name: Verify RV64 R1 full constants and signed i32 ABI
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/verify-riscv-r1-i32-const-qemu.yml']
permissions:
  contents: read
jobs:
  rv64-cfg:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 1ff087f334989c55ced0ebe130b8d09db947053c
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Verify pinned source SHA
        run: test "$(git -C compiler rev-parse HEAD)" = "1ff087f334989c55ced0ebe130b8d09db947053c"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Isolate frontend-independent crates
        working-directory: compiler
        run: |
          cat > Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir", "crates/backend", "crates/backend-riscv64"]
          EOF
          rm -f Cargo.lock
      - name: Test CFG selection and checked UDB encoding
        working-directory: compiler
        run: |
          set -euo pipefail
          cargo test -p compiler-backend-riscv64 --all-targets
          cargo clippy -p compiler-backend-riscv64 --all-targets -- -D warnings
          python3 tools/riscv_udb_rust_leaf_forms.py \
            --catalog data/riscv_udb_r0_catalog.json \
            --output crates/backend-riscv64/src/generated_encoding.rs --check
      - name: Install RV64 GNU and QEMU reference tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y binutils-riscv64-linux-gnu qemu-user python3-yaml
      - name: Generate TypeId constant and i32 objects and check independent GAS bytes
        working-directory: compiler
        run: |
          set -euo pipefail
          for kind in constmin constmax pattern i32add i32sub i32min i32max; do
            cargo run -p compiler-backend-riscv64 --example rv64_leaf -- \
              "/tmp/rv64_${kind}.o" "/tmp/rv64_${kind}.s" "$kind"
            riscv64-linux-gnu-readelf -h "/tmp/rv64_${kind}.o"
            riscv64-linux-gnu-as -march=rv64i -mabi=lp64 \
              "/tmp/rv64_${kind}.s" -o "/tmp/rv64_${kind}_gas.o"
            riscv64-linux-gnu-objcopy -O binary -j .text \
              "/tmp/rv64_${kind}.o" "/tmp/rv64_${kind}_direct.bin"
            riscv64-linux-gnu-objcopy -O binary -j .text \
              "/tmp/rv64_${kind}_gas.o" "/tmp/rv64_${kind}_gas.bin"
            cmp "/tmp/rv64_${kind}_direct.bin" "/tmp/rv64_${kind}_gas.bin"
          done
      - name: Execute full 64-bit constant and i32 overflow ABI tests under QEMU
        run: |
          set -euo pipefail
          cat > /tmp/rv64_i32_const_start.s <<'EOF'
          .option norvc
          .option norelax
          .text
          .globl _start
          _start:
            call rv64_constmin
            li t0, -9223372036854775808
            bne a0, t0, fail_1
            call rv64_constmax
            li t0, 9223372036854775807
            bne a0, t0, fail_2
            call rv64_pattern
            li t0, 0x0123456789abcdef
            bne a0, t0, fail_3
            call rv64_i32min
            li t0, -2147483648
            bne a0, t0, fail_4
            call rv64_i32max
            li t0, 2147483647
            bne a0, t0, fail_5
            li a0, 2147483647
            li a1, 1
            call rv64_i32_add
            li t0, -2147483648
            bne a0, t0, fail_6
            li a0, -2147483648
            li a1, -1
            call rv64_i32_add
            li t0, 2147483647
            bne a0, t0, fail_7
            li a0, -2147483648
            li a1, 1
            call rv64_i32_sub
            li t0, 2147483647
            bne a0, t0, fail_8
            li a0, 2147483647
            li a1, -1
            call rv64_i32_sub
            li t0, -2147483648
            bne a0, t0, fail_9
            li a0, 0
            j exit
          fail_1: li a0, 1
            j exit
          fail_2: li a0, 2
            j exit
          fail_3: li a0, 3
            j exit
          fail_4: li a0, 4
            j exit
          fail_5: li a0, 5
            j exit
          fail_6: li a0, 6
            j exit
          fail_7: li a0, 7
            j exit
          fail_8: li a0, 8
            j exit
          fail_9: li a0, 9
          exit:
            li a7, 93
            ecall
          EOF
          riscv64-linux-gnu-as -march=rv64i -mabi=lp64 \
            /tmp/rv64_i32_const_start.s -o /tmp/rv64_i32_const_start.o
          riscv64-linux-gnu-ld -m elf64lriscv -static --no-relax \
            -e _start /tmp/rv64_i32_const_start.o \
            /tmp/rv64_constmin.o /tmp/rv64_constmax.o /tmp/rv64_pattern.o \
            /tmp/rv64_i32add.o /tmp/rv64_i32sub.o \
            /tmp/rv64_i32min.o /tmp/rv64_i32max.o \
            -o /tmp/rv64_i32_const.elf
          timeout 15s qemu-riscv64 /tmp/rv64_i32_const.elf
          echo "RV64 i32/constant QEMU: all 9 full-width/overflow cases passed"
