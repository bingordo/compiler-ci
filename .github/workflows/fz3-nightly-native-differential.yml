name: FZ-3 nightly TypeId native differential campaign
on:
  schedule:
    - cron: '17 10 * * *'
  workflow_dispatch:
permissions:
  contents: write
  issues: write
concurrency:
  group: fz3-native-differential-nightly
  cancel-in-progress: false
jobs:
  native-campaign:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout compiler-ci triage scripts
        uses: actions/checkout@v4
        with:
          path: ci
          persist-credentials: false
      - name: Checkout current compiler main
        uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: main
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Checkout persistent FZ-3 history branch
        uses: actions/checkout@v4
        with:
          repository: bingordo/compiler-ci
          ref: fz3-native-fingerprint-history
          path: history
          persist-credentials: true
      - name: Isolate self-contained TypeId optimizer workspace
        run: |
          cat > compiler/Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir", "crates/opt", "crates/backend", "crates/backend-x86"]
          EOF
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: fz3-native-differential-nightly
          cache-workspace-crates: 'true'
      - name: Bound and execute deterministic native GAS and ELF campaign
        id: campaign
        working-directory: compiler
        shell: bash
        run: |
          set -euo pipefail
          source_sha="$(git rev-parse HEAD)"
          # Two disjoint deterministic case seeds per UTC day.
          first_seed="$(( ($(date -u +%s) / 86400) * 2 ))"
          printf 'source_sha=%s\nfirst_seed=%s\n' "$source_sha" "$first_seed"
          cargo run -p compiler-opt --example typeid_native_campaign -- \
            --out "$RUNNER_TEMP/fz3-native-differential" \
            --source-sha "$source_sha" --first-seed "$first_seed" \
            --seeds 2 --max-evaluations 240 --max-unique 4 --max-probes 32
          grep -q '^unique_failures=0$' "$RUNNER_TEMP/fz3-native-differential/summary.txt"
          grep -q '^stopped_at_budget=false$' "$RUNNER_TEMP/fz3-native-differential/summary.txt"
      - name: Reconcile genuine report with persistent run history
        id: triage
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          source_sha="$(git -C compiler rev-parse HEAD)"
          python3 ci/tools/fz3_triage.py \
            --campaign "$RUNNER_TEMP/fz3-native-differential" \
            --history-dir history/state/fz3 \
            --out "$RUNNER_TEMP/fz3-native-differential/triage" \
            --source-sha "$source_sha" \
            --run-token "${{ github.run_id }}.${{ github.run_attempt }}" \
            --run-url "https://github.com/bingordo/compiler-ci/actions/runs/${{ github.run_id }}"
          cat "$RUNNER_TEMP/fz3-native-differential/triage/triage.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Open issues only for newly confirmed exact fingerprints
        id: issues
        if: always() && steps.triage.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          new="$RUNNER_TEMP/fz3-native-differential/triage/new.tsv"
          while IFS=$'\t' read -r id mode sink a b expected actual occurrences profile seed body; do
            test "$id" != id || continue
            test -n "$id" || continue
            title="[FZ3-FP:$id] $mode/$sink wrong value a=$a b=$b"
            existing="$(gh issue list --repo bingordo/compiler-ci \
              --state all --search "FZ3-FP:$id in:title" \
              --json title --jq '[.[] | select(.title | contains("FZ3-FP:'"$id"'"))] | length')"
            if [ "$existing" -eq 0 ]; then
              gh issue create --repo bingordo/compiler-ci \
                --title "$title" \
                --body-file "$RUNNER_TEMP/fz3-native-differential/triage/$body"
            else
              printf 'Existing issue for fingerprint %s; no duplicate\n' "$id"
            fi
          done < "$new"
      - name: Atomically publish validated cross-run history
        if: always() && steps.triage.outcome == 'success' && steps.issues.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          git -C history config user.name "github-actions[bot]"
          git -C history config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C history add state/fz3/
          if ! git -C history diff --cached --quiet; then
            git -C history commit -m "fz3: record native campaign ${{ github.run_id }}.${{ github.run_attempt }}"
            git -C history push origin HEAD:refs/heads/fz3-native-fingerprint-history
          fi
      - name: Always retain exact-source reports and minimized IR failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fz3-nightly-native-differential-replay
          path: ${{ runner.temp }}/fz3-native-differential/
          if-no-files-found: warn
          retention-days: 14
