name: FZ-3 nightly TypeId native differential campaign
on:
  schedule:
    - cron: '17 10 * * *'
  workflow_dispatch:
permissions:
  contents: write
  issues: write
concurrency:
  group: fz3-native-differential-nightly
  cancel-in-progress: false
jobs:
  native-campaign:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout compiler-ci triage scripts
        uses: actions/checkout@v4
        with:
          path: ci
          persist-credentials: false
      - name: Checkout current compiler main
        uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: main
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Checkout persistent FZ-3 history branch
        uses: actions/checkout@v4
        with:
          repository: bingordo/compiler-ci
          ref: fz3-native-fingerprint-history
          path: history
          persist-credentials: true
      - name: Isolate self-contained TypeId optimizer workspace
        run: |
          cat > compiler/Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir", "crates/opt", "crates/backend", "crates/backend-x86"]
          EOF
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: fz3-native-differential-nightly
          cache-workspace-crates: 'true'
      - name: Bound and execute deterministic native GAS and ELF campaign
        id: campaign
        working-directory: compiler
        shell: bash
        run: |
          set -euo pipefail
          source_sha="$(git rev-parse HEAD)"
          # Two disjoint deterministic case seeds per UTC day.
          first_seed="$(( ($(date -u +%s) / 86400) * 2 ))"
          printf 'source_sha=%s\nfirst_seed=%s\n' "$source_sha" "$first_seed"
          cargo run -p compiler-opt --example typeid_native_campaign -- \
            --out "$RUNNER_TEMP/fz3-native-differential" \
            --source-sha "$source_sha" --first-seed "$first_seed" \
            --seeds 2 --max-evaluations 240 --max-unique 4 --max-probes 32
          grep -q '^unique_failures=0$' "$RUNNER_TEMP/fz3-native-differential/summary.txt"
          grep -q '^stopped_at_budget=false$' "$RUNNER_TEMP/fz3-native-differential/summary.txt"
      - name: Independent native signed division and remainder SIGFPE oracle
        if: always()
        working-directory: compiler
        shell: bash
        run: |
          set -euo pipefail
          ulimit -c 0
          cargo test -p compiler-opt --test typeid_native_trap_differential -- --nocapture
      - name: Reconcile genuine report with persistent run history
        id: triage
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          source_sha="$(git -C compiler rev-parse HEAD)"
          python3 ci/tools/fz3_triage.py \
            --campaign "$RUNNER_TEMP/fz3-native-differential" \
            --history-dir history/state/fz3 \
            --out "$RUNNER_TEMP/fz3-native-differential/triage" \
            --source-sha "$source_sha" \
            --run-token "${{ github.run_id }}.${{ github.run_attempt }}" \
            --run-url "https://github.com/bingordo/compiler-ci/actions/runs/${{ github.run_id }}"
          cat "$RUNNER_TEMP/fz3-native-differential/triage/triage.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Recheck archived minimized IR witnesses on current compiler
        id: recheck
        if: always() && steps.triage.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          cargo build --manifest-path compiler/Cargo.toml -p compiler-opt --example typeid_native_diff_repro
          sha="$(git -C compiler rev-parse HEAD)"
          python3 ci/tools/fz3_recheck.py \
            --campaign "$RUNNER_TEMP/fz3-native-differential" \
            --triage-dir "$RUNNER_TEMP/fz3-native-differential/triage" \
            --history-dir history/state/fz3 \
            --out "$RUNNER_TEMP/fz3-native-differential/lifecycle" \
            --oracle compiler/target/debug/examples/typeid_native_diff_repro \
            --source-sha "$sha" \
            --run-token "${{ github.run_id }}.${{ github.run_attempt }}" \
            --run-url "https://github.com/bingordo/compiler-ci/actions/runs/${{ github.run_id }}" \
            --limit 16 --timeout 35
          cat "$RUNNER_TEMP/fz3-native-differential/lifecycle/lifecycle.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Record validated TypeId pass-stage activity trends
        id: pass_trends
        if: always() && steps.triage.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          sha="$(git -C compiler rev-parse HEAD)"
          python3 ci/tools/fz3_pass_trends.py \
            --campaign "$RUNNER_TEMP/fz3-native-differential" \
            --history-dir history/state/fz3 \
            --out "$RUNNER_TEMP/fz3-native-differential/pass-trends" \
            --source-sha "$sha" \
            --run-token "${{ github.run_id }}.${{ github.run_attempt }}" \
            --run-url "https://github.com/bingordo/compiler-ci/actions/runs/${{ github.run_id }}"
          cat "$RUNNER_TEMP/fz3-native-differential/pass-trends/pass_trend.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Open issues only for newly confirmed exact fingerprints
        id: issues
        if: always() && steps.triage.outcome == 'success' && steps.recheck.outcome == 'success' && steps.pass_trends.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          new="$RUNNER_TEMP/fz3-native-differential/triage/new.tsv"
          while IFS=$'\t' read -r id mode sink a b expected actual occurrences profile seed body; do
            test "$id" != id || continue
            test -n "$id" || continue
            title="[FZ3-FP:$id] $mode/$sink wrong value a=$a b=$b"
            existing="$(gh issue list --repo bingordo/compiler-ci \
              --state all --search "FZ3-FP:$id in:title" \
              --json title --jq '[.[] | select(.title | contains("FZ3-FP:'"$id"'"))] | length')"
            if [ "$existing" -eq 0 ]; then
              gh issue create --repo bingordo/compiler-ci \
                --title "$title" \
                --body-file "$RUNNER_TEMP/fz3-native-differential/triage/$body"
            else
              printf 'Existing issue for fingerprint %s; no duplicate\n' "$id"
            fi
          done < "$new"
      - name: Notify existing issues only for genuine lifecycle transitions
        id: lifecycle
        if: always() && steps.recheck.outcome == 'success' && steps.issues.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          events="$RUNNER_TEMP/fz3-native-differential/lifecycle/events.tsv"
          while IFS=$'\t' read -r id event sha run_url detail; do
            test "$id" != id || continue
            test -n "$id" || continue
            number="$(gh issue list --repo bingordo/compiler-ci \
              --state all --search "FZ3-FP:$id in:title" \
              --json number,title \
              --jq '[.[] | select(.title | contains("FZ3-FP:'"$id"'"))][0].number // empty')"
            if [ -z "$number" ]; then
              echo "Missing existing FZ-3 issue for $id; refusing to publish lifecycle history" >&2
              exit 1
            fi
            case "$event" in
              suspected-fix)
                note="The archived minimized IR now agrees with the independent reference on compiler $sha. This is **tentative**, not proof of a fix. The issue remains open. [$run_url]($run_url)" ;;
              second-revision-agreement)
                note="The archived minimized IR also agrees on a **second distinct compiler revision** ($sha). Human review is required before closing this issue. [$run_url]($run_url)" ;;
              regression)
                state="$(gh issue view "$number" --repo bingordo/compiler-ci --json state --jq .state)"
                if [ "$state" = CLOSED ]; then
                  gh issue reopen "$number" --repo bingordo/compiler-ci
                fi
                note="**Possible regression:** the exact archived native wrong-value signature reproduces again on compiler $sha after a prior clean replay. [$run_url]($run_url)" ;;
              changed-wrong-value)
                note="The archived IR still has a wrong value on $sha, but the result changed: $detail. No fix is inferred. [$run_url]($run_url)" ;;
              *) echo "Unsupported lifecycle event $event" >&2; exit 1 ;;
            esac
            gh issue comment "$number" --repo bingordo/compiler-ci --body "$note"
          done < "$events"
      - name: Atomically publish validated cross-run history
        if: always() && steps.triage.outcome == 'success' && steps.issues.outcome == 'success' && steps.recheck.outcome == 'success' && steps.lifecycle.outcome == 'success' && steps.pass_trends.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          git -C history config user.name "github-actions[bot]"
          git -C history config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C history add state/fz3/
          if ! git -C history diff --cached --quiet; then
            git -C history commit -m "fz3: record native campaign ${{ github.run_id }}.${{ github.run_attempt }}"
            git -C history push origin HEAD:refs/heads/fz3-native-fingerprint-history
          fi
      - name: Always retain exact-source reports and minimized IR failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fz3-nightly-native-differential-replay
          path: ${{ runner.temp }}/fz3-native-differential/
          if-no-files-found: warn
          retention-days: 14
