name: RV64 shared constant rematerialization and QEMU
on:
  push:
    branches: [main]
    paths: ['.github/workflows/verify-riscv-shared-remat.yml']
  workflow_dispatch:
    inputs:
      source_ref:
        description: Exact compiler source commit or branch to validate
        type: string
        required: true
        default: '57889e64988014c77bf8972e0615c07cf219c179'
permissions:
  contents: read
jobs:
  rv64-remat:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: ${{ inputs.source_ref || '57889e64988014c77bf8972e0615c07cf219c179' }}
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Record exact source revision
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git -C compiler rev-parse HEAD)"
          echo "RV64 shared remat source: $actual"
          echo "source_sha=$actual" >> "$GITHUB_STEP_SUMMARY"
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            test "$actual" = "57889e64988014c77bf8972e0615c07cf219c179"
          fi
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Isolate the TypeId native compiler workspace
        working-directory: compiler
        run: |
          cat > Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir", "crates/backend", "crates/backend-riscv64"]
          EOF
          rm -f Cargo.lock
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: rv64-shared-remat
      - name: Shared planner, RV64 unit tests, generator check and strict Clippy
        working-directory: compiler
        run: |
          set -euo pipefail
          cargo test -p compiler-backend --lib remat::tests -- --nocapture
          cargo test -p compiler-backend-riscv64 --lib selector::tests::shared_constant -- --nocapture
          cargo test -p compiler-backend-riscv64 --all-targets
          cargo clippy -p compiler-backend-riscv64 --all-targets -- -D warnings
          python3 tools/regen_riscv_native_selector_rules.py --check
      - name: Install independent RISC-V GNU assembler, linker and QEMU
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y binutils-riscv64-linux-gnu qemu-user
      - name: Check direct ELF bytes against GNU GAS
        working-directory: compiler
        run: |
          set -euo pipefail
          for kind in addi_pos addi_over addi_shared addi_phi; do
            cargo run -p compiler-backend-riscv64 --example rv64_leaf -- \
              "/tmp/rv64_${kind}.o" "/tmp/rv64_${kind}.s" "$kind"
            riscv64-linux-gnu-as -march=rv64i -mabi=lp64 \
              "/tmp/rv64_${kind}.s" -o "/tmp/rv64_${kind}_gas.o"
            riscv64-linux-gnu-objcopy -O binary -j .text \
              "/tmp/rv64_${kind}.o" "/tmp/rv64_${kind}_direct.bin"
            riscv64-linux-gnu-objcopy -O binary -j .text \
              "/tmp/rv64_${kind}_gas.o" "/tmp/rv64_${kind}_gas.bin"
            cmp "/tmp/rv64_${kind}_direct.bin" "/tmp/rv64_${kind}_gas.bin"
          done
      - name: Execute folded and retained-use cases under QEMU
        run: |
          set -euo pipefail
          cat > /tmp/rv64_remat_start.s <<'EOF'
          .option norvc
          .option norelax
          .text
          .globl _start
          _start:
            li a0, 7
            call rv64_addi_pos
            li t0, 44
            bne a0, t0, fail1
            li a0, 7
            call rv64_addi_over
            li t0, 2055
            bne a0, t0, fail2
            li a0, 7
            call rv64_addi_shared
            li t0, 81
            bne a0, t0, fail3
            li a0, 7
            li a1, 18
            call rv64_addi_phi
            li t0, 29
            bne a0, t0, fail4
            li a0, 20
            li a1, 6
            call rv64_addi_phi
            li t0, 42
            bne a0, t0, fail5
            li a0, 0
            j exit
          fail1: li a0, 1
            j exit
          fail2: li a0, 2
            j exit
          fail3: li a0, 3
            j exit
          fail4: li a0, 4
            j exit
          fail5: li a0, 5
          exit:
            li a7, 93
            ecall
          EOF
          riscv64-linux-gnu-as -march=rv64i -mabi=lp64 \
            /tmp/rv64_remat_start.s -o /tmp/rv64_remat_start.o
          riscv64-linux-gnu-ld -m elf64lriscv -static --no-relax \
            -e _start /tmp/rv64_remat_start.o \
            /tmp/rv64_addi_pos.o /tmp/rv64_addi_over.o \
            /tmp/rv64_addi_shared.o /tmp/rv64_addi_phi.o \
            -o /tmp/rv64_remat.elf
          timeout 15s qemu-riscv64 /tmp/rv64_remat.elf
          echo 'RV64 shared-remat native oracles: 5 cases passed'
