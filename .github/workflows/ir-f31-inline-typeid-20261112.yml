name: IR F31 practical inline TypeId acceptance
on:
  pull_request:
    paths:
      - '.github/workflows/ir-f31-inline-typeid-20261112.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  practical-typeid:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_INCREMENTAL: '0'
    steps:
      - name: Checkout exact compiler F31 revision
        uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: ecd2aefbf043172024d642caacddd2cfff3f9376
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Confirm exact source and restrict workspace
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C compiler rev-parse HEAD)" = ecd2aefbf043172024d642caacddd2cfff3f9376
          cat > compiler/Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir", "crates/opt", "crates/backend", "crates/backend-x86"]
          EOF
          rm -f compiler/Cargo.lock
          echo "Compiler SHA: ecd2aefbf043172024d642caacddd2cfff3f9376" >> "$GITHUB_STEP_SUMMARY"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: ir-f31-practical-typeid-v1
      - name: F31 exact inliner controls and independent native GAS/ELF C11 oracle
        shell: bash
        working-directory: compiler
        run: |
          set -euo pipefail
          cargo test -p compiler-opt --test inline_practical_native -- --nocapture
      - name: Verify related TypeId inliner, CTFE and executable baseline
        shell: bash
        working-directory: compiler
        run: |
          set -euo pipefail
          cargo test -p compiler-opt --test typed_inline_leaf_native -- --nocapture
          cargo test -p compiler-opt --test typed_inline_cfg_native -- --nocapture
          cargo test -p compiler-opt --test ctfe -- --nocapture
          cargo test -p compiler-opt --test mem2reg_native -- --nocapture
          cargo test -p compiler-backend-x86 --lib
      - name: Strict all-target Clippy on IR optimizer and x86 backend
        shell: bash
        working-directory: compiler
        run: |
          set -euo pipefail
          cargo clippy -p compiler-ir -p compiler-opt -p compiler-backend -p compiler-backend-x86 --all-targets -- -D warnings
