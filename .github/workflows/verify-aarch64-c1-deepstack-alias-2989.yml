name: C1 AArch64 deepstack GP triple-call and pointer alias GCC differential
on:
  pull_request:
    paths:
      - '.github/workflows/verify-aarch64-c1-deepstack-alias-2989.yml'
permissions:
  contents: read
jobs:
  deterministic-source-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 4534f2029c6e46a9edff585d08a35350d409e28c
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Verify exact compiler source and Python generator syntax
        run: |
          set -euo pipefail
          test "$(git -C compiler rev-parse HEAD)" = "4534f2029c6e46a9edff585d08a35350d409e28c"
          python3 -m py_compile compiler/tools/aarch64_c1_source_oracle.py compiler/tools/aarch64_c1_call_oracle.py compiler/tools/aarch64_c1_mixed_call_oracle.py compiler/tools/aarch64_c1_deep_call_oracle.py compiler/tools/tests/test_aarch64_c1_source_oracle.py
      - name: Deterministic seeded source and negative report mutation suite
        run: |
          set -euo pipefail
          python3 -m unittest discover -s compiler/tools/tests \
            -p test_aarch64_c1_source_oracle.py -v
  actual-native-aarch64:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    env:
      CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 4534f2029c6e46a9edff585d08a35350d409e28c
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Record exact source and configure public frontend Git dependency
        run: |
          set -euo pipefail
          test "$(uname -m)" = aarch64
          test "$(git -C compiler rev-parse HEAD)" = "4534f2029c6e46a9edff585d08a35350d409e28c"
          git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
          git config --global --add url."https://github.com/".insteadOf "git@github.com:"
          gcc --version | head -n 1
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: c1-aarch64-source-deepstack-v1
      - name: Compile production checked source driver and verify report CLI
        working-directory: compiler
        run: |
          set -euo pipefail
          cargo build --release -p compiler --bin compiler
          cargo test -p compiler --test aarch64_selector_report_cli -- --nocapture
      - name: "Validate Mini-C checked TypeId fixed GP 17-64 arguments"
        run: |
          set -euo pipefail
          cargo test --manifest-path compiler/tools/mini-c-driver/Cargo.toml \
            --lib deep_gp -- --nocapture
      - name: "Preserve prior native W32 W64 memory W32-call and mixed-GP baselines"
        run: |
          set -euo pipefail
          mkdir -p results
          for family in w32 w64 memory calls mixedcalls; do
            python3 compiler/tools/aarch64_c1_source_oracle.py \
              --compiler compiler/target/release/compiler \
              --output "results/$family-baseline" --family "$family" \
              --seed 23 --functions 8 --samples 128 --execute-native
          done
      - name: "Native AArch64 17–32 GP incoming and three 24-operand callbacks with four aliases"
        run: |
          set -euo pipefail
          python3 compiler/tools/aarch64_c1_source_oracle.py \
            --compiler compiler/target/release/compiler \
            --output results/deepstack-61 --seed 61 --family deepcalls \
            --functions 16 --samples 256 --execute-native
      - name: "PIC AArch64 17–32 GP incoming and 24-operand cross-call pressure"
        run: |
          set -euo pipefail
          python3 compiler/tools/aarch64_c1_source_oracle.py \
            --compiler compiler/target/release/compiler \
            --output results/deepstack-pic-163 --seed 163 --family deepcalls \
            --functions 16 --samples 256 --pic --execute-native
      - name: "Reconcile all six ABI families physical A64 bytes alias checks and ELF parity"
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          rows=[json.loads(p.read_text()) for p in sorted(Path("results").glob("*/summary.json"))]
          assert len(rows)==7,rows
          families=("w32","w64","memory","calls","mixedcalls","deepcalls")
          counts={fam:sum(r["functions"] for r in rows if r["family"]==fam)
                  for fam in families}
          assert counts=={"w32":8,"w64":8,"memory":8,"calls":8,
                          "mixedcalls":8,"deepcalls":32},counts
          deep=[r for r in rows if r["family"]=="deepcalls"]
          assert len(deep)==2 and sorted(r["pic"] for r in deep)==[False,True]
          assert all(r["native_executed"] and r["object_parity"] for r in rows)
          assert all(r["coverage"]["handwritten"]==0 for r in rows)
          assert all(r["coverage"]["generated"]>0 and r["coverage"]["text_bytes"]>0
                     for r in rows)
          assert all("A64_CALL_DIRECT_64" in r["coverage"]["rule_ids"] for r in deep)
          assert len({r["source_sha256"] for r in rows})==len(rows)
          summary={
            "family_functions":counts,
            "native_evaluations":sum(r["functions"]*r["samples_per_function"] for r in rows),
            "generated_scalar_decisions":sum(r["coverage"]["generated"] for r in rows),
            "handwritten_scalar_fallbacks":sum(r["coverage"]["handwritten"] for r in rows),
            "generated_cfg_terminators":sum(r["coverage"]["terminators"] for r in rows),
            "physical_function_text_bytes":sum(r["coverage"]["text_bytes"] for r in rows),
            "native_GCC_full64_results_three_callback_witness_and_16_alias_cells_equal":True,
            "report_on_off_ELF_identical":True,
          }
          print("A64_C1_DEEPSTACK_TRIPLE_CALL_NATIVE_GCC",json.dumps(summary,sort_keys=True),flush=True)
          PY
          echo 'AArch64 checked-C 17..32 GP ingress, 3x24 mixed class outgoing calls with four aliased modes, independent GCC C11 return/witness/all-cell native parity PASS pinned 4534f2029c6e46a9edff585d08a35350d409e28c' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aarch64-c1-seeded-source-oracle-reproducers
          path: results/
          if-no-files-found: ignore
          retention-days: 21
