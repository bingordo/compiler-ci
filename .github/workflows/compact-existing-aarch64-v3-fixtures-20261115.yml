name: AArch64 existing fixed TypeId fixtures compact source acceptance
on:
  push:
    branches: [verify/compact-existing-aarch64-v3-fixtures-20261115]
    paths: ['.github/workflows/compact-existing-aarch64-v3-fixtures-20261115.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: db49b8f705f40c5799c7a427517b352efca4d924
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Verify exact compiler source SHA
        run: test "$(git -C compiler rev-parse HEAD)" = "db49b8f705f40c5799c7a427517b352efca4d924"
      - name: Isolate native workspace
        run: |
          cat > compiler/Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir", "crates/backend", "crates/backend-aarch64"]
          EOF
          rm -f compiler/Cargo.lock
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: aarch64-15-compact-fixtures-20261115
      - name: Canonical v3 compact expansion and IR parser negative regression
        working-directory: compiler
        run: |
          cargo test -p compiler-backend-aarch64 --test native_fixed_v3_canonical -- --nocapture
          cargo test -p compiler-ir --test native_fixture_text --test native_module_text_v3 -- --nocapture
      - name: Install cross GCC binutils and QEMU
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends gcc-aarch64-linux-gnu libc6-dev-arm64-cross binutils-aarch64-linux-gnu qemu-user
      - name: Run all 15 original AArch64 machine ABI and real C11 QEMU test suites
        working-directory: compiler
        env:
          COMPILER_REQUIRE_AARCH64_QEMU: "1"
        run: |
          cargo test -p compiler-backend-aarch64 --test adds_loop_native --test checked_arrays --test compare_immediate_branch_native --test ctz_select_calls --test double_index_store_native --test i64_unsigned_div_rem --test local_memory --test logical_shifted_native --test memory --test modern_i32 --test subs_loop_native --test typeid_historical_control_flow --test typeid_historical_pressure --test zero_branch_native --test extended_scaled_native -- --nocapture
      - name: Strict scoped Clippy for unchanged original test oracles
        working-directory: compiler
        run: |
          cargo clippy -p compiler-backend-aarch64 --no-deps --test adds_loop_native --test checked_arrays --test compare_immediate_branch_native --test ctz_select_calls --test double_index_store_native --test i64_unsigned_div_rem --test local_memory --test logical_shifted_native --test memory --test modern_i32 --test subs_loop_native --test typeid_historical_control_flow --test typeid_historical_pressure --test zero_branch_native --test extended_scaled_native --test native_fixed_v3_canonical -- -D warnings
