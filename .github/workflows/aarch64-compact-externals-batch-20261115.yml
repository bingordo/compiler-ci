name: AArch64 external call compact TypeId fixture batch
on:
  push:
    branches: [verify/aarch64-compact-externals-batch-20261115]
    paths: ['.github/workflows/aarch64-compact-externals-batch-20261115.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 166cc0b3fa4527151c89eeb54d90e426495ccf79
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Verify compiler source SHA
        run: test "$(git -C compiler rev-parse HEAD)" = "166cc0b3fa4527151c89eeb54d90e426495ccf79"
      - name: Restrict native workspace
        run: |
          cat > compiler/Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir", "crates/backend", "crates/backend-aarch64"]
          EOF
          rm -f compiler/Cargo.lock
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: aarch64-external-call-compact-fixture
      - name: Check compact external declaration and variadic parser regressions
        working-directory: compiler
        run: |
          cargo test -p compiler-ir --test native_fixture_text -- --nocapture
          cargo test -p compiler-ir --test native_module_text_v3
      - name: Canonical v3 expansion of 9 compact external-call fixtures
        working-directory: compiler
        run: |
          cargo test -p compiler-backend-aarch64 --test native_fixed_v3_canonical -- --nocapture
      - name: Install real AArch64 cross compiler and QEMU
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends gcc-aarch64-linux-gnu libc6-dev-arm64-cross binutils-aarch64-linux-gnu qemu-user
      - name: Preserve original machine, external ABI, C11 and real QEMU oracles
        working-directory: compiler
        env:
          COMPILER_REQUIRE_AARCH64_QEMU: "1"
        run: |
          cargo test -p compiler-backend-aarch64 --test abi_aliases --test direct_calls --test unwind_cfi --test gp_varargs -- --nocapture
      - name: Strict scoped Clippy
        working-directory: compiler
        run: |
          cargo clippy -p compiler-ir --no-deps --test native_fixture_text -- -D warnings
          cargo clippy -p compiler-backend-aarch64 --no-deps --test abi_aliases --test direct_calls --test unwind_cfi --test gp_varargs --test native_fixed_v3_canonical -- -D warnings
