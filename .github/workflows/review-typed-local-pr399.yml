name: One-off TypeId local fold DCE PR399 validation
on:
  pull_request:
    paths:
      - '.github/workflows/review-typed-local-pr399.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: a57f7cae91cd591db5e871e6f0f255900bad95be
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Pin exact source SHA
        run: test "$(git -C compiler rev-parse HEAD)" = "a57f7cae91cd591db5e871e6f0f255900bad95be"
      - name: Self-contained core workspace
        shell: bash
        run: |
          cat > compiler/Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir", "crates/opt", "crates/backend", "crates/backend-x86"]
          EOF
          rm -f compiler/Cargo.lock
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: review-typed-local-pr399
      - name: Check typed fold and DCE differential regression
        working-directory: compiler
        run: cargo test -p compiler-opt --test typed_local -- --nocapture
      - name: Run complete IR and optimizer tests
        working-directory: compiler
        run: cargo test -p compiler-ir -p compiler-opt
      - name: Strict Clippy
        working-directory: compiler
        run: cargo clippy -p compiler-ir -p compiler-opt --all-targets -- -D warnings
