name: BT4 AArch64 final legacy direct call TypeId C11 QEMU parity
on:
  push:
    branches: [ci/bt4-aarch64-direct-calls-typeid-20261114]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  retire-final-direct-call-integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 607022fc476a8c59ebf38b437e5825ebf639643f
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Pin compiler and isolate target/backend workspace
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 607022fc476a8c59ebf38b437e5825ebf639643f
          python3 - <<'PY'
          from pathlib import Path
          Path("Cargo.toml").write_text("""[workspace]
          resolver = "2"
          members = ["crates/ir", "crates/backend", "crates/backend-aarch64"]
          """)
          PY
      - name: Validate all original seven direct-call C11 TypeId fixtures and full AArch64 backend
        run: |
          set -euo pipefail
          if grep -nE '(compiler_backend::Backend|machine::select\(|compiler_ir::Function)' crates/backend-aarch64/tests/direct_calls.rs; then
            echo "BT4 GP variadics still depend on historical Backend(Function)"; exit 1
          fi
          cargo check -p compiler-backend-aarch64 --all-targets
          cargo test -p compiler-backend-aarch64 --test direct_calls -- --nocapture
          cargo test -p compiler-backend-aarch64 --tests
          cargo clippy -p compiler-backend-aarch64 --all-targets -- -D warnings
      - name: Install native AArch64 runtime and cross compiler
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu qemu-user
      - name: Execute seven original direct/recursive/16-GP and live-across-call C11 oracles
        env:
          COMPILER_REQUIRE_AARCH64_QEMU: "1"
        run: |
          set -euo pipefail
          cargo test -p compiler-backend-aarch64 --test direct_calls -- --nocapture
          echo BT4_ALL_DIRECT_CALL_ORIGINAL_C11_QEMU_PASS
