# Temporary exact-source BT4 old W32 emitter retirement acceptance.
name: BT4 AArch64 W32 native parallel-copy parity
on:
  pull_request:
    paths: ['.github/workflows/bt4-native-copy-parity-pr1763.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  aarch64-native:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 35
    env:
      CARGO_INCREMENTAL: '0'
      SOURCE_SHA: 32996428f1cd02cc1015d79e26ad607e1e01490b
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 32996428f1cd02cc1015d79e26ad607e1e01490b
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Verify pin and source guard before compiling
        run: |
          set -euo pipefail
          test "$(git -C compiler rev-parse HEAD)" = "$SOURCE_SHA"
          python3 compiler/tools/check_bt4_backend_boundary.py
      - name: Isolate core workspace
        run: |
          cat > compiler/Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir", "crates/opt", "crates/backend", "crates/backend-x86", "crates/backend-aarch64"]
          EOF
          rm -f compiler/Cargo.lock
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: bt4-native-w32-cycles
      - name: Strict AArch64 native all-target compilation
        working-directory: compiler
        run: RUSTFLAGS='-D warnings' cargo check -p compiler-backend-aarch64 --all-targets
      - name: Exact production W32 swap/three-cycle machine-byte tests
        working-directory: compiler
        run: cargo test -p compiler-backend-aarch64 --lib spill::tests::native_w32 -- --nocapture
      - name: Entire AArch64 native TypeId and remaining historical C ELF oracles
        working-directory: compiler
        run: cargo test -p compiler-backend-aarch64 --all-targets -- --test-threads=1
      - name: Strict AArch64 library Clippy
        working-directory: compiler
        run: cargo clippy -p compiler-backend-aarch64 --lib -- -D warnings
  workspace-x86:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      CARGO_INCREMENTAL: '0'
      SOURCE_SHA: 32996428f1cd02cc1015d79e26ad607e1e01490b
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 32996428f1cd02cc1015d79e26ad607e1e01490b
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.CI_KEY }}
      - name: Verify pin, source audit, and private dependency host
        run: |
          set -euo pipefail
          test "$(git -C compiler rev-parse HEAD)" = "$SOURCE_SHA"
          ssh-keyscan github.com >> "$HOME/.ssh/known_hosts"
          python3 compiler/tools/check_bt4_backend_boundary.py
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler
          key: bt4-w32-workspace
      - name: Full workspace all-target compilation with actual compiler driver
        working-directory: compiler
        run: cargo check --workspace --all-targets
      - name: Both TypeId release libraries without historical Function emitter
        working-directory: compiler
        run: cargo check -p compiler-backend-x86 -p compiler-backend-aarch64 --release --lib
      - name: Strict changed ARM/shared backend Clippy
        working-directory: compiler
        run: cargo clippy -p compiler-backend-aarch64 -p compiler-backend --lib -- -D warnings
      - name: x86 and optimizer native CMOV and ELF/GAS C reference
        working-directory: compiler
        run: |
          cargo test -p compiler-opt --test if_conversion_typeid_remaining
          cargo test -p compiler-backend-x86 --test native_typeid_select_cmov --test typed_alias_calls_native
