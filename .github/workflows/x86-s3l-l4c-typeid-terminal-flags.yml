name: X7 S3.L L4c actual TypeId SSA terminal flags fusion
on:
  pull_request:
    paths:
      - '.github/workflows/x86-s3l-l4c-typeid-terminal-flags.yml'
permissions:
  contents: read
jobs:
  real-typeid-flags:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      SOURCE_SHA: '29da68eea11aad3bb3061901820dfb348b587b43'
    steps:
      - name: Checkout exact compiler source without compiler repo Actions
        uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 29da68eea11aad3bb3061901820dfb348b587b43
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Isolate offline backend Rust workspace
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C compiler rev-parse HEAD)" = "$SOURCE_SHA"
          cd compiler
          python3 - <<'PY'
          from pathlib import Path
          Path("Cargo.toml").write_text("""[workspace]
          resolver = "2"
          members = ["crates/ir", "crates/opt", "crates/backend", "crates/backend-x86"]
          """)
          PY
      - name: Test real checked TypeId SSA CMP and AND==zero flags selection and GAS+ELF
        shell: bash
        run: |
          set -euo pipefail
          cd compiler
          cargo test -p compiler-backend-x86 \
            --features 'x7-native-form-validation x7-c-defined-64 x7-c-defined-bitwise' \
            --test x7_s3l_l4c_typeid_flags_native --offline -- --nocapture
          echo X7_S3L_L4C_ACTUAL_TYPEID_SELECTION_GAS_ELF_PASS
      - name: Check earlier physical-only matchers and original Typed SSA branch correctness
        shell: bash
        run: |
          set -euo pipefail
          cd compiler
          cargo test -p compiler-backend-x86 \
            --features 'x7-native-form-validation x7-c-defined-64 x7-c-defined-bitwise' \
            --test x7_s3l_l4b_flags_window_native --offline
          cargo test -p compiler-backend-x86 \
            --features 'x7-native-form-validation x7-c-defined-64 x7-c-defined-bitwise' \
            --test typed_i32_compare_branch_native --offline
          cargo test -p compiler-backend-x86 \
            --features 'x7-native-form-validation x7-c-defined-64 x7-c-defined-bitwise' \
            --test typed_i64_compare_branch_native --offline
          cargo test -p compiler-backend-x86 \
            --features 'x7-native-form-validation x7-c-defined-64 x7-c-defined-bitwise' \
            --lib native_typeid::reviewed_i64_source_tests --offline
          echo X7_S3L_L4C_EXISTING_NATIVE_TYPEID_REGRESSIONS_PASS
      - name: Fail closed with feature opt-out, including real typed SSA native GAS and ELF
        shell: bash
        run: |
          set -euo pipefail
          cd compiler
          cargo test -p compiler-backend-x86 --no-default-features \
            --test x7_s3l_l4c_typeid_flags_native --offline -- --nocapture
          cargo test -p compiler-backend-x86 --no-default-features \
            --features x7-native-form-validation \
            --test x7_s3l_l4c_typeid_flags_native --offline -- --nocapture
          cargo test -p compiler-backend-x86 --no-default-features \
            --test x7_g10_n15_no_default_fallback --offline
          echo X7_S3L_L4C_TYPEID_FEATURE_OFF_ORIGINAL_FALLBACK_PASS
