name: LTO cross-unit optimizer and native executable oracle
on:
  push:
    branches: [verify/lto-crossunit-optimize-20261114]
    paths: ['.github/workflows/lto-crossunit-optimize-20261114.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  crossunit:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 68d541b5e25d19b5699e063a5967c081ad6923ee
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Verify pinned compiler source
        run: test "$(git -C compiler rev-parse HEAD)" = "68d541b5e25d19b5699e063a5967c081ad6923ee"
      - name: Focus workspace on optimizer and backend libraries
        run: |
          cat > compiler/Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir", "crates/opt", "crates/backend", "crates/backend-x86", "crates/backend-aarch64"]
          EOF
          rm -f compiler/Cargo.lock
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: lto-crossunit-optimize
      - name: Link and execute cross-unit differential tests
        working-directory: compiler
        run: cargo test -p compiler-opt --test lto_crossunit_optimization -- --nocapture
      - name: Strict optimizer test lint
        working-directory: compiler
        run: |
          cargo clippy -p compiler-opt --lib -- -D warnings
          cargo clippy -p compiler-opt --test lto_crossunit_optimization -- -D warnings
