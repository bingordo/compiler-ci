name: TEMP merged FP ABI and checked Mini-C mixed source planner
on:
  pull_request:
    branches: [main]
    paths: [.github/workflows/validate-abi-large-layout-3470.yml]
permissions:
  contents: read
jobs:
  planner:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 6c924d7c945af48cf18a0bcc1853c76b4c118305
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: shared-abi-unit-tests
      - name: Test common ABI planning and INTEGER compatibility without unrelated driver dependencies
        run: |
          set -euo pipefail
          test "$(git -C compiler rev-parse HEAD)" = "6c924d7c945af48cf18a0bcc1853c76b4c118305"
          printf '[workspace]\nresolver = "2"\nmembers = ["crates/ir", "crates/backend", "crates/opt", "crates/backend-x86"]\n' > compiler/Cargo.toml
          cargo test --manifest-path compiler/Cargo.toml -p compiler-backend --lib abi_
          cargo test --manifest-path compiler/Cargo.toml -p compiler-backend --lib typeid_fixed_abi
          cargo test --manifest-path compiler/Cargo.toml -p compiler-backend --lib typeid_integer
          cargo test --manifest-path compiler/Cargo.toml -p compiler-ir --lib call_operands
      - name: Run standalone native mixed TypeId products against GCC
        if: always()
        run: cargo test --manifest-path compiler/Cargo.toml -p compiler-backend-x86 --test mixed_typeid_product_gcc -- --nocapture
      - name: Run physical helper unit tests
        if: always()
        run: cargo test --manifest-path compiler/Cargo.toml -p compiler-backend-x86 --lib paired_return

  minic-source-planner:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: a19d37d51221c032b03541d895cecfdb7ba608ee
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Assert exact source revision and use public Mini-C dependency
        run: |
          set -euo pipefail
          test "$(git -C compiler rev-parse HEAD)" = "a19d37d51221c032b03541d895cecfdb7ba608ee"
          python3 - <<'PY'
          from pathlib import Path
          manifest=Path('compiler/tools/mini-c-driver/Cargo.toml')
          text=manifest.read_text()
          old='ssh://git@github.com/bingordo/mini-c.git'
          assert text.count(old)==2
          manifest.write_text(text.replace(old,'https://github.com/bingordo/mini-c.git'))
          PY
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler/tools/mini-c-driver -> target
          key: mini-c-source-differential-v1
          cache-workspace-crates: 'true'
      - name: Verify source-checked mixed prototype and existing INTEGER ABI tests
        run: |
          set -euo pipefail
          cargo test --manifest-path compiler/tools/mini-c-driver/Cargo.toml -p compiler-mini-c --lib aggregate_abi -- --nocapture
      - name: GCC interoperability of source mixed aggregate entry and results and scalar FP regression
        run: cargo test --manifest-path compiler/tools/mini-c-driver/Cargo.toml -p compiler-mini-c --test fp_mixed_abi -- --nocapture
