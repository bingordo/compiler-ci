name: TEMP shared ABI large-layout classification 3470
on:
  pull_request:
    branches: [main]
    paths: [.github/workflows/validate-abi-large-layout-3470.yml]
permissions:
  contents: read
jobs:
  planner:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: e89e53248ca968e3f38431e24efc05d77c86c436
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Run actual shared classifier and planner unit tests without rebuilding compiler
        run: |
          set -euo pipefail
          test "$(git -C compiler rev-parse HEAD)" = "e89e53248ca968e3f38431e24efc05d77c86c436"
          cat > "$RUNNER_TEMP/abi_tests.rs" <<EOF
          #[path = "$PWD/compiler/crates/backend/src/abi_classify.rs"]
          mod abi_classify;
          #[path = "$PWD/compiler/crates/backend/src/abi_plan.rs"]
          mod abi_plan;
          EOF
          rustc --edition=2021 --test "$RUNNER_TEMP/abi_tests.rs" -o "$RUNNER_TEMP/abi_tests"
          "$RUNNER_TEMP/abi_tests"
