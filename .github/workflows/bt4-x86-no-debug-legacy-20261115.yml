name: BT4 x86 historical Function no-debug default-tests parity
on:
  pull_request:
    paths:
      - '.github/workflows/bt4-x86-no-debug-legacy-20261115.yml'
permissions:
  contents: read
jobs:
  x86-history-isolated:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - name: Exact compiler SHA; never compiler Actions
        uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: dd6945880c4c3e92b614d699352099f7e25ebc21
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Checkout untouched pre-change main independently for the full-suite comparison
        uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 630e81d0a6a1e3a153c67e400a67d9116e18733f
          path: compiler-baseline
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Source boundary and negative debug gate mutation tests
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C compiler rev-parse HEAD)" = dd6945880c4c3e92b614d699352099f7e25ebc21
          cd compiler
          python3 tools/check_bt4_backend_boundary.py
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          import sys
          guard = [sys.executable, 'tools/check_bt4_backend_boundary.py']
          def mutation(path, old, new, expected):
              data = path.read_text()
              assert old in data, (path, old)
              path.write_text(data.replace(old, new, 1))
              try:
                  r = subprocess.run(guard, capture_output=True, text=True)
                  assert r.returncode != 0, f'bad source guard accepted mutation {path}'
                  assert expected in r.stderr, r.stderr
              finally:
                  path.write_text(data)
          lib = Path('crates/backend-x86/src/lib.rs')
          manifest = Path('crates/backend-x86/Cargo.toml')
          mutation(
              lib,
              '#[cfg(any(test, feature = "historical-function-oracle"))]\npub mod historical_backend;',
              '#[cfg(any(test, debug_assertions, feature = "historical-function-oracle"))]\npub mod historical_backend;',
              'historical x86 Function emitter entered normal debug builds',
          )
          mutation(
              manifest,
              'compiler-backend-x86 = { path = ".", features = ["historical-function-oracle"] }',
              'compiler-backend-x86 = { path = "." }',
              'missing test-only historical self dev-dependency feature',
          )
          print('BT4_X86_DEBUG_SOURCE_AND_NEGATIVE_MUTANTS_PASS')
          PY
          python3 tools/check_bt4_backend_boundary.py
      - name: Core backend workspace offline
        run: |
          printf '[workspace]\nresolver="2"\nmembers=["crates/ir","crates/opt","crates/backend","crates/backend-x86"]\n' > compiler/Cargo.toml
      - name: Non-test debug/release build does not require historical Function
        shell: bash
        run: |
          set -euo pipefail
          cd compiler
          cargo check --offline -p compiler-backend-x86
          cargo check --offline -p compiler-backend-x86 --release
          cargo rustc --offline -p compiler-backend-x86 --lib -- --print cfg > /tmp/normal-x86-cfg.txt
          if grep -Fq 'feature="historical-function-oracle"' /tmp/normal-x86-cfg.txt; then
            echo 'historical feature improperly auto-enabled for non-test debug build'
            exit 1
          fi
          cargo check --offline -p compiler-backend-x86 --features historical-function-oracle
          echo BT4_X86_OLD_FUNCTION_NOT_IN_DEBUG_PASS
      - name: Exact original historical x86 library and integration suites
        shell: bash
        run: |
          set -euo pipefail
          cd compiler
          cargo test --offline -p compiler-backend-x86 --lib
          cargo test --offline -p compiler-backend-x86 --lib --no-default-features
          cargo test --offline -p compiler-backend-x86 --tests --no-run
          # Compare the *complete* original x86 integration failure inventory
          # before and after this feature-gate-only change. Never edit the test
          # source or silently accept a new failing test.
          set +e
          cargo test --offline --no-fail-fast -p compiler-backend-x86 --tests > /tmp/bt4-candidate-full.log 2>&1
          candidate_status=$?
          set -e
          echo "BT4_CANDIDATE_FULL_STATUS=$candidate_status"
          cd ../compiler-baseline
          test "$(git rev-parse HEAD)" = 630e81d0a6a1e3a153c67e400a67d9116e18733f
          printf '[workspace]\nresolver="2"\nmembers=["crates/ir","crates/opt","crates/backend","crates/backend-x86"]\n' > Cargo.toml
          set +e
          cargo test --offline --no-fail-fast -p compiler-backend-x86 --tests > /tmp/bt4-baseline-full.log 2>&1
          baseline_status=$?
          set -e
          echo "BT4_PRECHANGE_FULL_STATUS=$baseline_status"
          CANDIDATE_STATUS="$candidate_status" BASELINE_STATUS="$baseline_status" python3 - <<'PY'
          import os, re
          from pathlib import Path
          candidate=Path('/tmp/bt4-candidate-full.log').read_text()
          baseline=Path('/tmp/bt4-baseline-full.log').read_text()
          def failed(text):
              names=set(re.findall(r'(?m)^test (.+?) \.\.\. FAILED\s*$',text))
              binaries=set(re.findall(r'(?m)^error: test failed, to rerun pass \x60([^\x60]+)\x60',text))
              return names,binaries
          a,b=failed(candidate),failed(baseline)
          print('BT4 original baseline failures:',sorted(b[0]))
          print('BT4 candidate failures:',sorted(a[0]))
          print('BT4 baseline failing binaries:',sorted(b[1]))
          print('BT4 candidate failing binaries:',sorted(a[1]))
          print('BT4 baseline result counts:',re.findall(r'test result: (?:ok|FAILED)\. [^\n]+',baseline)[-8:])
          print('BT4 candidate result counts:',re.findall(r'test result: (?:ok|FAILED)\. [^\n]+',candidate)[-8:])
          if a!=b:
              print('REGRESSION: failure inventories differ!')
              raise SystemExit(1)
          if not b[0]:
              print('Baseline test failures unexpectedly empty; manual review required')
              raise SystemExit(1)
          if os.environ['CANDIDATE_STATUS'] != os.environ['BASELINE_STATUS']:
              print('REGRESSION: exit status differs')
              raise SystemExit(1)
          if 'production_typeid_machine_stream_replays_when_supported' not in b[0]:
              raise SystemExit('Known source-frozen v1 physical replay baseline failed to reproduce')
          print('BT4_EXACT_SOURCE_BEFORE_AFTER_FAILURE_SET_IDENTICAL')
          PY
          echo BT4_X86_NO_NEW_FAILING_INTEGRATION_TESTS_GREEN
