name: Aggregate TypeId fixed source migration
on:
  push:
    branches: [verify/ir-aggregate-fixed-20261114]
    paths: ['.github/workflows/ir-aggregate-fixed-20261114.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 589a36732029288e31c4868c6a05152574d29010
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Pin source revision
        run: test "$(git -C compiler rev-parse HEAD)" = "589a36732029288e31c4868c6a05152574d29010"
      - name: Restrict workspace
        run: |
          cat > compiler/Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir", "crates/opt", "crates/backend", "crates/backend-x86"]
          EOF
          rm -f compiler/Cargo.lock
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: ir-aggregate-fixed
      - name: Validate migrated TypeId aggregate metadata and native IR tests
        working-directory: compiler
        run: |
          cargo test -p compiler-opt --test typed_aggregate_pipeline
          cargo test -p compiler-opt --test typed_core_pipeline --test typed_mem2reg
          cargo test -p compiler-opt --test ir_fixture_directives
          cargo test -p compiler-ir --test native_module_text_v3 --test native_fixture_text
          cargo clippy -p compiler-opt --no-deps --test typed_aggregate_pipeline -- -D warnings
