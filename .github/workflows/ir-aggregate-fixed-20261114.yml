name: Aggregate TypeId fixed source migration
on:
  push:
    branches: [verify/ir-aggregate-fixed-20261114]
    paths: ['.github/workflows/ir-aggregate-fixed-20261114.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 17f32a58c2086aed848bcf447a74cd2a9ab6f989
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Pin source revision
        run: test "$(git -C compiler rev-parse HEAD)" = "17f32a58c2086aed848bcf447a74cd2a9ab6f989"
      - name: Restrict workspace
        run: |
          cat > compiler/Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir", "crates/opt", "crates/backend", "crates/backend-x86"]
          EOF
          rm -f compiler/Cargo.lock
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: ir-aggregate-fixed
      - name: Export checked original TypeId aggregate input
        working-directory: compiler
        run: |
          cargo test -p compiler-opt --test typed_aggregate_pipeline temporary_export_fixed_aggregate_typeid_ir -- --nocapture
