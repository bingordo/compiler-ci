              echo 'First remaining compiler diagnostics:'
              grep -m 8 -E 'compiler:|error:|unsupported|fatal' native-build.log || true
            fi
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-bswap-cjson-logs
          path: native-build.log
          if-no-files-found: ignore
 "$RUNNER_TEMP/baseline-tests.log" | sed 's/^test //;s/ \.\.\. FAILED$//' | sort -u > "$RUNNER_TEMP/baseline-failures" || true
          if test "$baseline_rc" -ne 0 && ! test -s "$RUNNER_TEMP/baseline-failures"; then
            tail -n 100 "$RUNNER_TEMP/baseline-tests.log"
            echo 'baseline test invocation failed without classified tests' >&2
            exit 1
          fi
          if ! diff -u "$RUNNER_TEMP/baseline-failures" "$RUNNER_TEMP/candidate-failures"; then
            echo 'candidate changes the existing Mini-C failure set' >&2
            exit 1
          fi
          echo "MINIC_FAILURE_SET_MATCHES_PRE_CHANGE_BASELINE=YES" >> "$GITHUB_STEP_SUMMARY"
          echo "PREEXISTING_MINIC_FAILURE_COUNT=$(wc -l < "$RUNNER_TEMP/baseline-failures")" >> "$GITHUB_STEP_SUMMARY"
      - name: Native vs GCC byte-swap runtime and invalid input rejection
        shell: bash
        run: |
          set -euo pipefail
          c="$PWD/compiler/target/debug/compiler"
          d="$(mktemp -d)"
          trap 'rm -rf "$d"' EXIT
          cd "$d"
          cat > bswap.c <<'EOF'
