name: X7 IP2 automatic source-backed cross-root candidate enumeration
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/x7-ip2-auto-rewrite-search-20261120.yml'
permissions:
  contents: read
jobs:
  ip2-automatic:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 6d4553ea68b378e255ab247992a803e70eac1711
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Enforce exact generator SHA and install both Z3 interfaces
        run: |
          set -euo pipefail
          test "$(git -C compiler rev-parse HEAD)" = 6d4553ea68b378e255ab247992a803e70eac1711
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends z3
          z3 -version
          python3 -m venv "$RUNNER_TEMP/x7-ip2-z3"
          "$RUNNER_TEMP/x7-ip2-z3/bin/python" -m pip install --disable-pip-version-check --quiet 'z3-solver==4.13.4.0'
      - name: Original source SMT, automatic bitwise-DAG search, negative controls
        run: |
          set -euo pipefail
          export PYTHONPATH="$PWD/compiler/tools"
          PY="$RUNNER_TEMP/x7-ip2-z3/bin/python"
          "$PY" -m compileall -q compiler/tools/x7_ip2_source_rewrite_search.py compiler/tools/test_x7_ip2_source_rewrite_search.py
          "$PY" -m unittest -v \
            test_x7_ip2_source_rewrite_search \
            test_x7_ip2_helper_source_smt \
            test_x7_ip2_source_verified_dag \
            test_x7_ip2_ir_equivalence \
            test_x7_ip2_physical_receipt_join
      - name: Assert this is an offline-only pattern generator
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          source=Path("compiler/tools/x7_ip2_source_rewrite_search.py").read_text()
          assert '"new_production_rules": 0' in source
          assert '"selection_eligible": False' in source
          assert '"native_execution_validated": False' in source
          assert 'source_file_sha256' in source
          print("X7_IP2_AUTO_REWRITE_RESEARCH_NONADMISSION_CONFIRMED")
          PY
