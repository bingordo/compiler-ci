name: M49 checked TypeId pass source origin receipts
on:
  pull_request:
    paths: ['.github/workflows/m49-typed-origin-receipts-3421.yml']
permissions:
  contents: read
jobs:
  provenance:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 13f5bb4c4d4d255b8a6e415cdc20f4a3e452dc61
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Resolve compiler Git dependencies
        run: git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
      - name: TypeId pass receipts and optimizer baseline
        working-directory: compiler
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "13f5bb4c4d4d255b8a6e415cdc20f4a3e452dc61"
          cd tools/mini-c-driver
          cargo test --test source_optimizer_receipts -- --nocapture
          cargo test --test checked_real_file_gdb checked_debug_rejects_mismatched_or_preprocessed_source_file
          cd ../..
          cargo test -p compiler-opt --lib typed_pipeline::
          cargo clippy -p compiler-opt --lib -- -D clippy::all
