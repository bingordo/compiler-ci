name: Review AArch64 call-live PR 2182
on:
  push:
    branches: [review/aarch64-call-live-2182]
    paths:
      - .github/workflows/review-aarch64-call-live-2182.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  call-live:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - name: Checkout exact compiler PR revision
        uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 3a0a20f659c1e9e2b64d2d15b8dcf1f000d82826
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Assert exact reviewed revision
        run: test "$(git -C compiler rev-parse HEAD)" = "3a0a20f659c1e9e2b64d2d15b8dcf1f000d82826"
      - uses: dtolnay/rust-toolchain@stable
      - name: Assemble minimal standalone workspace
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work/crates
          cp -a compiler/crates/{ir,backend,backend-aarch64} work/crates/
          cat > work/Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir", "crates/backend", "crates/backend-aarch64"]
          EOF
      - name: Compile target with warnings denied
        working-directory: work
        run: RUSTFLAGS="-D warnings" cargo check -p compiler-backend-aarch64 --all-targets
      - name: Run full native backend tests on ARM
        working-directory: work
        run: cargo test -p compiler-backend-aarch64 --all-targets -- --test-threads=1
      - name: Verify indirect-call live-through allocation
        working-directory: work
        run: cargo test -p compiler-backend-aarch64 indirect_call_live_through_avoids_caller_clobbers -- --nocapture
