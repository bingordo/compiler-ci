name: IR fixed inliner chain recursion scalar migration
on:
  push:
    branches: [ci/ir-inline-remaining-fixtures-20261114]
    paths: ['.github/workflows/ir-inline-remaining-fixtures.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 86e9ec5199846444008599ffd03de32fbb39df0f
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Verify exact source and isolate core workspace
        run: |
          set -euo pipefail
          test "$(git -C compiler rev-parse HEAD)" = "86e9ec5199846444008599ffd03de32fbb39df0f"
          echo "Compiler SHA: 86e9ec5199846444008599ffd03de32fbb39df0f" >> "$GITHUB_STEP_SUMMARY"
          cat > compiler/Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir", "crates/opt", "crates/backend", "crates/backend-x86"]
          EOF
          rm -f compiler/Cargo.lock
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: ir-inline-remaining-fixed
      - name: Run migrated original CFG recursive and modern scalar C11 oracles
        working-directory: compiler
        run: |
          set -euo pipefail
          cargo test -p compiler-opt --test typed_inline_cfg_native --test typed_inline_wide_void_native --test inline_modern_scalar_native -- --nocapture
      - name: Run prior migrated TypeId inliner and optimizer fixture regressions
        working-directory: compiler
        run: |
          set -euo pipefail
          cargo test -p compiler-opt --test typed_inline_leaf_native --test typed_inline_memory_native --test typed_inline_postopt_native_trial --test typed_core_inline_integration --test typed_core_pipeline --test typed_pre_native --test typed_mem2reg --test typed_dse
      - name: Check compiler production core libraries
        working-directory: compiler
        run: cargo check --workspace --lib
      - name: Strict Clippy production and modified test binaries
        working-directory: compiler
        run: |
          set -euo pipefail
          cargo clippy -p compiler-ir -p compiler-opt -p compiler-backend -p compiler-backend-x86 --lib -- -D warnings
          cargo clippy -p compiler-opt --test typed_inline_cfg_native --test typed_inline_wide_void_native --test inline_modern_scalar_native -- -D warnings
      - name: Record successful source-pinned gate
        run: |
          echo 'Nine fixed wrapper/recursive/modern scalar TypeId inputs, original C11 and legacy controls, adjacent inliner fixtures, core check and strict scoped Clippy PASS' >> "$GITHUB_STEP_SUMMARY"
