name: IR fixed inliner chain recursion scalar migration
on:
  push:
    branches: [ci/ir-inline-remaining-fixtures-20261114]
    paths: ['.github/workflows/ir-inline-remaining-fixtures.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 3d1830c205465136b5ad588c3ba68bcb0bcfa98a
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Verify exact source and isolate core workspace
        run: |
          set -euo pipefail
          test "$(git -C compiler rev-parse HEAD)" = "3d1830c205465136b5ad588c3ba68bcb0bcfa98a"
          echo "Compiler SHA: 3d1830c205465136b5ad588c3ba68bcb0bcfa98a" >> "$GITHUB_STEP_SUMMARY"
          cat > compiler/Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir", "crates/opt", "crates/backend", "crates/backend-x86"]
          EOF
          rm -f compiler/Cargo.lock
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: ir-inline-remaining-fixed
      - name: Export original three wrapper and two recursive CFG inliner inputs
        working-directory: compiler
        run: cargo test -p compiler-opt --test typed_inline_cfg_native export_original_fixed_inliner_remaining_inputs -- --nocapture
      - name: Export original two wide recursion inputs
        working-directory: compiler
        run: cargo test -p compiler-opt --test typed_inline_wide_void_native export_original_fixed_inliner_remaining_inputs -- --nocapture
      - name: Export modern scalar caller and callee
        working-directory: compiler
        run: cargo test -p compiler-opt --test inline_modern_scalar_native export_original_modern_scalar_fixed_source -- --nocapture
