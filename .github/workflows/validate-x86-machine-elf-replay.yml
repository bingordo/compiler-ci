name: Validate selected x86 machine SSA ELF replay
on:
  pull_request:
    paths:
      - '.github/workflows/validate-x86-machine-elf-replay.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  x86-selected-replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 1d6f69518f0d4be3fcc32a795b8472f7ef7a3f35
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Check pinned source SHA and isolate core
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C compiler rev-parse HEAD)" = "1d6f69518f0d4be3fcc32a795b8472f7ef7a3f35"
          cat > compiler/Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir", "crates/opt", "crates/backend", "crates/backend-x86"]
          EOF
          rm -f compiler/Cargo.lock
          echo "Compiler source: 1d6f69518f0d4be3fcc32a795b8472f7ef7a3f35" >> "$GITHUB_STEP_SUMMARY"
          command -v cc
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: x86-machine-elf-replay
      - name: Selected machine text to real allocated ELF and C11 execution
        working-directory: compiler
        shell: bash
        run: |
          set -euo pipefail
          cargo test --offline -p compiler-backend-x86 --test machine_text_v1 -- --nocapture
          cargo test --offline -p compiler-backend --test machine_text_v1
      - name: Strict full x86 backend Clippy
        working-directory: compiler
        run: cargo clippy --offline -p compiler-backend-x86 --all-targets -- -D warnings
