name: Validate X4 ADD generator integration on current compiler
on:
  push:
    branches: [main]
    paths: ['.github/workflows/verify-x86-x4-add-main-integration.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  x4-add:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: integration/x86-x4-add-main-20261102
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Identify tested compiler head
        run: git rev-parse HEAD
      - name: Install Z3 and fetch pinned reviewed Intel ADD
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq z3
          python3 tools/fetch_x86_isl_subset.py /tmp/intel-isl
          python3 tools/import_intel_isl_subset.py /tmp/intel-isl
      - name: Require independently Z3-certified generated ADD rule bytes
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tools -p 'test_x86_add_dag_rules.py' -v
          python3 tools/regen_x86_add_dag_patterns.py --check --intel-dir /tmp/intel-isl
      - name: Select minimal compiler workspace
        run: |
          cat > Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir","crates/opt","crates/backend","crates/backend-x86"]
          EOF
          rm -f Cargo.lock
      - uses: Swatinem/rust-cache@v2
        with:
          key: x86-x4-main-integration
      - name: Test native C oracle in GAS ELF and backend regression suite
        run: |
          set -euo pipefail
          cargo test -p compiler-backend-x86 --lib dag_add_match -- --nocapture
          cargo test -p compiler-backend-x86 --test dag_add_integration_native -- --nocapture
          cargo test -p compiler-backend-x86 --lib
          echo 'X4_ADD_MAIN_INTEGRATION status=PASS'
