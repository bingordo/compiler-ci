name: RV64 scalar memory candidate
on:
  workflow_dispatch:
  push:
    branches: ['ci/rv64-scalar-memory']
    paths: ['.github/workflows/verify-rv64-scalar-memory.yml']
permissions:
  contents: read
  statuses: write
jobs:
  rv64-memory:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: a88d3bb25be67e73a46af48bd5e56635cf7b8658
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - run: test "$(git -C compiler rev-parse HEAD)" = a88d3bb25be67e73a46af48bd5e56635cf7b8658
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Install RV64 toolchain
        run: sudo apt-get install -y --no-install-recommends gcc-riscv64-linux-gnu binutils-riscv64-linux-gnu qemu-user
      - name: Verify source and generated encoder
        working-directory: compiler
        run: |
          python3 tools/riscv_udb_rust_leaf_forms.py --catalog data/riscv_udb_r0_catalog.json --output crates/backend-riscv64/src/generated_encoding.rs --check
          RV64_MEMORY_FIXTURE_DIR=/tmp/rv64-memory cargo test -p compiler --test riscv64_scalar_memory
          cargo test -p compiler-backend-riscv64 --all-targets
          cargo test -p compiler --test riscv64_source_preview --test riscv64_generic_cfg --test riscv64_load_ir
          cargo clippy -p compiler-backend-riscv64 --tests -- -D warnings
      - name: Verify GCC interoperability and memory effects
        run: python3 compiler/tools/rv64_scalar_memory_oracle.py /tmp/rv64-memory
      - name: Publish candidate status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          state=failure
          if [ "$JOB_STATUS" = success ]; then state=success; fi
          gh api "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" -f state="$state" -f context=rv64-scalar-memory -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" -f description="Compiler a88d3bb25be67e73a46af48bd5e56635cf7b8658"
