name: TypeId experimental bounded inline trials and native rollback
on:
  push:
    branches: [main]
    paths: [.github/workflows/verify-typeid-inline-trials-20261110.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  trial-native:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 50e9a04dc65e09e210b719880ebe81db8811d919
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Verify exact checked source revision
        run: |
          test "$(git -C compiler rev-parse HEAD)" = "50e9a04dc65e09e210b719880ebe81db8811d919"
      - name: Restrict workspace to public optimizer and backend crates
        run: |
          cat > compiler/Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir", "crates/opt", "crates/backend", "crates/backend-x86"]
          EOF
          rm -f compiler/Cargo.lock
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: typeid-cfg-trial-seam-20261110
      - name: Run opt-in trial and full TypeId CFG regression suites
        working-directory: compiler
        run: |
          set -euo pipefail
          cargo test -p compiler-opt --test typed_inline_cfg_native -- --nocapture
          cargo test -p compiler-opt --test typed_inline_memory_native -- --nocapture
          cargo test -p compiler-opt --test typed_inline_wide_void_native -- --nocapture
          cargo test -p compiler-opt --test typed_core_inline_integration -- --nocapture
          cargo test -p compiler-opt --lib typed_inline::tests -- --nocapture
          cargo clippy -p compiler-opt --all-targets -- -D warnings
