name: BT4 x86-64 retire division trap and I64 SysV-call legacy test callers
on:
  push:
    branches: [ci/bt4-x86-div-traps-i64-abi-typeid-20261114]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-default-and-full-backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: ee9f7e61575b7beee9572a16742464577bce7496
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Pin source and isolate x86 backend workspace from private frontend dependencies
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = ee9f7e61575b7beee9572a16742464577bce7496
          python3 - <<'PY'
          from pathlib import Path
          Path("Cargo.toml").write_text("""[workspace]
          resolver = "2"
          members = ["crates/ir", "crates/backend", "crates/opt", "crates/backend-x86"]
          """)
          PY
      - name: Reject historical x86 Backend(Function) calls in migrated original suites
        run: |
          set -euo pipefail
          if grep -nE '(compiler_backend::Backend|machine::select\(|compiler_ir::Function|\bFunction \{)' crates/backend-x86/tests/m4_scalar_div_traps.rs crates/backend-x86/tests/m4_i64_memory_call_native.rs; then
            echo "BT4 migrated x86 native tests still invoke obsolete Function backend"
            exit 1
          fi
      - name: Check source-owned TypeId, original C11 native oracles and all x86 backend tests
        run: |
          set -euo pipefail
          cargo check -p compiler-backend-x86 --all-targets
          cargo test -p compiler-backend-x86 --test m4_scalar_div_traps -- --nocapture
          cargo test -p compiler-backend-x86 --test m4_i64_memory_call_native -- --nocapture
          cargo test -p compiler-backend-x86 --tests
          cargo clippy -p compiler-backend-x86 --all-targets -- -D warnings
          echo BT4_X86_ORIGINAL_DIV_I64_C11_DEFAULT_ALL_BACKEND_PASS
  native-nondefault-feature-baseline:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: ee9f7e61575b7beee9572a16742464577bce7496
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Isolate backend workspace
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = ee9f7e61575b7beee9572a16742464577bce7496
          python3 - <<'PY'
          from pathlib import Path
          Path("Cargo.toml").write_text("""[workspace]
          resolver = "2"
          members = ["crates/ir", "crates/backend", "crates/opt", "crates/backend-x86"]
          """)
          PY
      - name: Verify original C11 results independent of X7 optional memory-form features
        run: |
          set -euo pipefail
          cargo test -p compiler-backend-x86 --no-default-features --test m4_scalar_div_traps -- --nocapture
          cargo test -p compiler-backend-x86 --no-default-features --test m4_i64_memory_call_native -- --nocapture
          echo BT4_X86_ORIGINAL_DIV_I64_C11_NO_DEFAULT_FEATURES_PASS
