name: AArch64 S15 real hardware carry and NZCV oracle
on:
  pull_request:
    paths:
      - '.github/workflows/verify-aarch64-a32-s15-native-adc.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact-native:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 0fffd944368f01c21e9555dd6f1a6c399cb8ccd6
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Verify pinned source and run independent hardware differential
        run: |
          set -euo pipefail
          test "$(git -C compiler rev-parse HEAD)" = 0fffd944368f01c21e9555dd6f1a6c399cb8ccd6
          cc -std=gnu11 -O2 -Wall -Wextra -Werror -o /tmp/aarch64-adc-nzcv compiler/tests/aarch64_adc_nzcv_native.c
          /tmp/aarch64-adc-nzcv
          cc -std=gnu11 -O0 -Wall -Wextra -Werror -o /tmp/aarch64-adc-nzcv-o0 compiler/tests/aarch64_adc_nzcv_native.c
          /tmp/aarch64-adc-nzcv-o0
          python3 -m unittest discover -s compiler/tools -p 'test_aarch64_a32_adc_semantics.py' -v
