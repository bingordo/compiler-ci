name: ASM1-D4 main integration merge gate
on:
  push:
    branches: [ci/asm1-d4-text-alignment]
    paths: ['.github/workflows/asm1-d4-merge-gate.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  x86-text-align-main:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: bd62106b6ff3dc34bd909dcd5edb69b9d79068e3
          fetch-depth: 0
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: d322cf71183ade352a5b80871d14617dabde792b
          path: review-head
          fetch-depth: 0
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Simulate exact merge on current main
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "bd62106b6ff3dc34bd909dcd5edb69b9d79068e3"
          test "$(git -C review-head rev-parse HEAD)" = "d322cf71183ade352a5b80871d14617dabde792b"
          git config user.name 'compiler-ci integration gate'
          git config user.email 'compiler-ci@users.noreply.github.com'
          git fetch --no-tags ./review-head d322cf71183ade352a5b80871d14617dabde792b
          git merge --no-commit --no-ff FETCH_HEAD
          git diff --cached --check
          rm -rf review-head
          echo "ASM1-D4 merge source bd62106b6ff3dc34bd909dcd5edb69b9d79068e3 + d322cf71183ade352a5b80871d14617dabde792b" >> "$GITHUB_STEP_SUMMARY"
      - name: Core workspace
        run: |
          cat > Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir", "crates/opt", "crates/backend", "crates/backend-x86"]
          EOF
          rm -f Cargo.lock
      - uses: Swatinem/rust-cache@v2
        with:
          key: asm1-d4-main-integration
      - name: Validate integrated alignment, ELF and regression
        run: |
          set -euo pipefail
          python3 tools/regen_x86_att_forms.py --check
          python3 -m unittest discover -s tools -p test_regen_x86_att_forms.py -v
          cargo check -p compiler-backend-x86 --all-targets
          cargo test -p compiler-backend-x86 --test att_text_alignment -- --nocapture
          for suite in att_asm att_module att_module_strings att_aliases \
            att_mid_labels att_section_cursor m4_global_data_only_native \
            m4_global_definitions_native m4_global_pointer_relocations_native \
            m4_global_external_native m4_global_branch_relax_native \
            machine_text_v1; do
            cargo test -p compiler-backend-x86 --test "$suite"
          done
          cargo test -p compiler-backend-x86 --lib
          cargo test -p compiler-backend --lib
          cargo clippy -p compiler-backend-x86 --lib --test att_text_alignment --test att_asm --test att_section_cursor -- -D warnings -A unused_variables -A clippy::suspicious_assignment_formatting
          echo 'ASM1_D4_MAIN_MERGE_GATE status=PASS' >> "$GITHUB_STEP_SUMMARY"
