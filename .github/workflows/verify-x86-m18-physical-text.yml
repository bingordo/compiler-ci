name: x86 M1.8a real physical snapshot writer
on:
  pull_request:
    paths:
      - '.github/workflows/verify-x86-m18-physical-text.yml'
permissions:
  contents: read
jobs:
  x86-physical-text:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout pinned compiler PR
        uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 14a6267a80979de5d98add2dc88835e5fcb93809
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Verify source SHA
        run: test "$(git -C compiler rev-parse HEAD)" = "14a6267a80979de5d98add2dc88835e5fcb93809"
      - name: Restrict core workspace
        run: |
          cat > compiler/Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir", "crates/opt", "crates/backend", "crates/backend-x86"]
          EOF
          rm -f compiler/Cargo.lock
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: x86-m18-physical-text
          cache-workspace-crates: 'true'
      - name: Run physical text and observer tests
        working-directory: compiler
        run: |
          cargo test -p compiler-backend-x86 --test typeid_physical_text_v1 -- --nocapture
          cargo test -p compiler-backend-x86 --test typeid_real_physical_observer -- --nocapture
      - name: Full affected backend tests and strict Clippy
        working-directory: compiler
        run: |
          cargo test -p compiler-backend-x86
          cargo clippy -p compiler-backend-x86 --all-targets -- -D warnings
