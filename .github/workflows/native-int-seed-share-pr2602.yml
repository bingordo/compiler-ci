name: Validate native-int seed sharing PR2602
on:
  pull_request:
    paths:
      - '.github/workflows/native-int-seed-share-pr2602.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  generator-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      CARGO_INCREMENTAL: '0'
      SOURCE_SHA: f9080a54c7f268be5e15a942349a0bb69fb3fb54
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: f9080a54c7f268be5e15a942349a0bb69fb3fb54
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Verify exact source and isolate optimizer
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C compiler rev-parse HEAD)" = "$SOURCE_SHA"
          cat > compiler/Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir", "crates/opt", "crates/backend", "crates/backend-x86"]
          EOF
          rm -f compiler/Cargo.lock
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: native-int-seeded-generator
      - name: Test all ten original native-int generated suites and oracles
        working-directory: compiler
        shell: bash
        run: |
          set -euo pipefail
          cargo test -p compiler-opt --test generated_native_complement_dag -- --nocapture
          cargo test -p compiler-opt --test generated_native_disjoint_arithmetic_s2323 -- --nocapture
          cargo test -p compiler-opt --test generated_native_bitwise_comparison_s2321 -- --nocapture
          cargo test -p compiler-opt --test generated_native_reverse_carry_s2330 -- --nocapture
          cargo test -p compiler-opt --test generated_native_zero_compare -- --nocapture
          cargo test -p compiler-opt --test generated_native_sign_order -- --nocapture
          cargo test -p compiler-opt --test generated_native_masks -- --nocapture
          cargo test -p compiler-opt --test generated_native_integer_algebra -- --nocapture
          cargo test -p compiler-opt --test generated_native_opposing_shift -- --nocapture
          cargo test -p compiler-opt --test generated_native_shift_affine -- --nocapture
      - name: Focused Clippy with known unrelated x86 exemptions
        working-directory: compiler
        shell: bash
        run: |
          cargo clippy -p compiler-opt --test generated_native_complement_dag --test generated_native_disjoint_arithmetic_s2323 --test generated_native_bitwise_comparison_s2321 --test generated_native_reverse_carry_s2330 --test generated_native_zero_compare --test generated_native_sign_order --test generated_native_masks --test generated_native_integer_algebra --test generated_native_opposing_shift --test generated_native_shift_affine -- -D warnings -A dead-code -A clippy::empty-line-after-doc-comments
