name: Mini-C shared float literal candidate
on:
  pull_request:
    paths:
      - '.github/workflows/minic-hexfloat-candidate.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: d06a608a118be567d0cefea0b7a481496c2b6a9e
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: bingordo/mini-c
          ref: af20898ec04bc0ecfaa68f150cfc0fa0e2e051d5
          path: mini-c
          persist-credentials: false
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: mini-c -> target
          key: minic-hexfloat-candidate
      - name: Record source and test exact rounding
        run: |
          git -C compiler rev-parse HEAD
          git -C mini-c rev-parse HEAD
          cargo test --manifest-path mini-c/Cargo.toml -p mini-c-sema --test float_literal
      - name: Build and test Cranelift
        run: |
          cargo test --manifest-path mini-c/Cargo.toml -p mini-c-cranelift --lib
      - name: Build reference compiler independently of unit test outcome
        if: success() || failure()
        run: cargo build --manifest-path mini-c/Cargo.toml -p mini-c-cranelift
      - name: Native GCC bit-pattern oracle for hexadecimal constants
        if: success() || failure()
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/literals.c" <<'C'
          float f0(void) { return 0x1.000001p0f; }
          float f1(void) { return 0x1.0000010000000000000000001p0f; }
          float f2(void) { return 0x1p-149f; }
          double d0(void) { return 0x1.00000000000008p0; }
          double d1(void) { return 0x1.00000000000008000000001p0; }
          double d2(void) { return 0x1p-1074; }
          C
          cat > "$RUNNER_TEMP/oracle.c" <<'C'
          #include <stdint.h>
          #include <string.h>
          extern float f0(void),f1(void),f2(void);
          extern double d0(void),d1(void),d2(void);
          static uint32_t bits32(float f) { uint32_t n; memcpy(&n,&f,4); return n; }
          static uint64_t bits64(double f) { uint64_t n; memcpy(&n,&f,8); return n; }
          int main(void) {
            return bits32(f0())!=0x3f800000u || bits32(f1())!=0x3f800001u ||
              bits32(f2())!=1 || bits64(d0())!=0x3ff0000000000000ull ||
              bits64(d1())!=0x3ff0000000000001ull || bits64(d2())!=1;
          }
          C
          mini-c/target/debug/mini-c-cranelift --cpp=none --emit-obj "$RUNNER_TEMP/literals.o" "$RUNNER_TEMP/literals.c"
          gcc "$RUNNER_TEMP/oracle.c" "$RUNNER_TEMP/literals.o" -o "$RUNNER_TEMP/check"
          "$RUNNER_TEMP/check"
          gcc "$RUNNER_TEMP/oracle.c" "$RUNNER_TEMP/literals.c" -o "$RUNNER_TEMP/reference"
          "$RUNNER_TEMP/reference"
      - name: Replay strict observable Csmith
        if: success() || failure()
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -qq -y --no-install-recommends csmith libcsmith-dev gcc clang
          [[ $(dpkg-query -W -f='${Version}' csmith) == 2.3.0-* ]]
          header=$(dpkg -L libcsmith-dev | grep '/csmith.h$' | head -n1)
          export CRANELIFT_BIN="$PWD/mini-c/target/debug/mini-c-cranelift"
          test -x "$CRANELIFT_BIN"
          cat > "$RUNNER_TEMP/cranelift-adapter" <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          [[ $# == 5 && "$2" == -o && "$4" == --emit && "$5" == obj ]]
          exec "$CRANELIFT_BIN" --cpp=none --emit-obj "$3" "$1"
          SH
          chmod +x "$RUNNER_TEMP/cranelift-adapter"
          evidence="$RUNNER_TEMP/csmith-evidence"
          python3 compiler/tools/csmith_probe.py --generate --cases-dir "$evidence/cases" --csmith csmith --seed-base 1 --seed-count 8 --profile restricted-observable
          rc=0
          python3 compiler/tools/csmith_probe.py --probe --cases-dir "$evidence/cases" --artifacts-dir "$evidence/results" --include-dir "$(dirname "$header")" --preprocess-c --driver "$RUNNER_TEMP/cranelift-adapter" --compiler-sha "$(git -C compiler rev-parse HEAD)" --frontend-sha "$(git -C mini-c rev-parse HEAD)" --minimum-native 8 --run-timeout 5 --max-wall-seconds 120 || rc=$?
          python3 - "$evidence/results/results.jsonl" <<'PY'
          import json,sys
          for line in open(sys.argv[1]):
              r=json.loads(line)
              print("STRICT_RESULT", json.dumps({k:r.get(k) for k in ("seed","classification","compiler","frontend_diagnostic")}))
          PY
          exit "$rc"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cranelift-hexfloat-evidence
          path: ${{ runner.temp }}/csmith-evidence
          retention-days: 14
