name: Mini-C native shared float literal candidate
on:
  pull_request:
    paths:
      - '.github/workflows/minic-hexfloat-candidate.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: ce6d46f07fd96e2d5f7d0572cbd3a4480c07de7e
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Record exact compiler and frontend pin
        run: |
          git -C compiler rev-parse HEAD
          python3 - <<'PY'
          from pathlib import Path
          p=Path("compiler/tools/mini-c-driver/Cargo.toml")
          s=p.read_text()
          assert s.count("ssh://git@github.com/bingordo/mini-c.git")==2
          p.write_text(s.replace("ssh://git@github.com/bingordo/mini-c.git","https://github.com/bingordo/mini-c.git"))
          PY
          grep 'rev =' compiler/tools/mini-c-driver/Cargo.toml
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler/tools/mini-c-driver -> target
          key: minic-native-hexfloat
      - name: Native FP literal GCC ELF and GAS oracle
        run: cargo test --manifest-path compiler/tools/mini-c-driver/Cargo.toml --test native_float_literals -- --nocapture
      - name: Existing adapter unit tests
        if: success() || failure()
        run: cargo test --manifest-path compiler/tools/mini-c-driver/Cargo.toml --lib
      - name: Build native compiler
        if: success() || failure()
        run: cargo build --manifest-path compiler/tools/mini-c-driver/Cargo.toml --bin compiler-mini-c
      - name: Replay strict observable Csmith
        if: success() || failure()
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -qq -y --no-install-recommends csmith libcsmith-dev gcc clang
          [[ $(dpkg-query -W -f='${Version}' csmith) == 2.3.0-* ]]
          header=$(dpkg -L libcsmith-dev | grep '/csmith.h$' | head -n1)
          driver="$PWD/compiler/tools/mini-c-driver/target/debug/compiler-mini-c"
          test -x "$driver"
          frontend=$(PYTHONPATH=compiler/tools python3 -c 'from csmith_probe import pinned_frontend_revision; import sys; print(pinned_frontend_revision(open(sys.argv[1]).read()))' compiler/tools/mini-c-driver/Cargo.toml)
          evidence="$RUNNER_TEMP/csmith-evidence"
          python3 compiler/tools/csmith_probe.py --generate --cases-dir "$evidence/cases" --csmith csmith --seed-base 1 --seed-count 8 --profile restricted-observable
          rc=0
          python3 compiler/tools/csmith_probe.py --probe --cases-dir "$evidence/cases" --artifacts-dir "$evidence/results" --include-dir "$(dirname "$header")" --preprocess-c --driver "$driver" --compiler-sha "$(git -C compiler rev-parse HEAD)" --frontend-sha "$frontend" --minimum-native 8 --run-timeout 5 --max-wall-seconds 120 || rc=$?
          python3 - "$evidence/results/results.jsonl" <<'PY'
          import json,sys
          for line in open(sys.argv[1]):
              r=json.loads(line)
              print("STRICT_RESULT", json.dumps({k:r.get(k) for k in ("seed","classification","compiler","frontend_diagnostic")}))
          PY
          exit "$rc"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-hexfloat-evidence
          path: ${{ runner.temp }}/csmith-evidence
          retention-days: 14
