name: Mini-C obsolete regression repair and strict Csmith baseline
on:
  pull_request:
    paths:
      - '.github/workflows/minic-hexfloat-candidate.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: e6fdceb7a9ec6c804d8fab22757547aba71df800
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Record exact source
        run: |
          git -C compiler rev-parse HEAD
          grep 'rev =' compiler/tools/mini-c-driver/Cargo.toml
          sed -i 's|ssh://git@github.com/bingordo/mini-c.git|https://github.com/bingordo/mini-c.git|g' compiler/tools/mini-c-driver/Cargo.toml
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler/tools/mini-c-driver -> target
          key: minic-native-hexfloat
      - name: Check repaired regressions
        run: |
          set -e
          for test in paired_aggregate_result_preserves_product_type source_checked_aggregate_result_keeps_both_return_components global_arrays_pointer_relocations_and_local_shadowing; do
            cargo test --manifest-path compiler/tools/mini-c-driver/Cargo.toml --lib "$test" -- --nocapture
          done
      - name: Full adapter suite
        if: success() || failure()
        run: cargo test --manifest-path compiler/tools/mini-c-driver/Cargo.toml --lib
