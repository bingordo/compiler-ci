name: Atomic shared machine SSA fence acceptance
on:
  push:
    branches: [ci/atomic-shared-machine-fence-20261118]
    paths:
      - '.github/workflows/atomic-shared-machine-fence-20261118.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  atomic-fence:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: a692d9ba83d6ec0dd44919ee38f8f0cbd726cbb6
          ssh-key: ${{ secrets.CI_KEY }}
          path: compiler
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Verify pinned compiler SHA
        run: test "$(git -C compiler rev-parse HEAD)" = a692d9ba83d6ec0dd44919ee38f8f0cbd726cbb6
      - name: Isolate independently testable compiler crates
        run: |
          printf '[workspace]\nresolver = "2"\nmembers = ["crates/ir", "crates/opt", "crates/backend", "crates/backend-x86"]\n' > compiler/Cargo.toml
          rm -f compiler/Cargo.lock
      - name: Verify atomic machine SSA fence and physical ELF/GAS parity
        working-directory: compiler
        run: |
          cargo check --workspace
          cargo test -p compiler-backend-x86 --lib shared_machine_thread_fence_emits_real_mfence_in_gas_and_elf -- --nocapture
          cargo test -p compiler-backend-x86 --lib shared_physical_atomic_thread_fence_emits_mfence_in_elf_and_gas -- --nocapture
