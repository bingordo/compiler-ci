# Source-pinned W2 Wasm br_table and native x86 differential acceptance.
# Test in compiler-ci: never consume compiler repository GitHub Actions minutes.
name: Wasm W2 br_table and native differential

on:
  pull_request:
    paths:
      - '.github/workflows/wasm-w2-br-table.yml'
  workflow_dispatch:
    inputs:
      compiler_sha:
        description: 'Exact compiler SHA to validate'
        required: true
        type: string

permissions:
  contents: read

jobs:
  wasm-w2:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact compiler source
        uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: ${{ inputs.compiler_sha || '487a674153bd130c57402a727aba19dd0d9e0312' }}
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Record source SHA and isolate credential-free crates
        shell: bash
        run: |
          set -euo pipefail
          echo "Compiler source: $(git -C compiler rev-parse HEAD)"
          cat > compiler/Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir", "crates/opt", "crates/backend", "crates/backend-x86", "crates/backend-wasm"]
          EOF
          rm -f compiler/Cargo.lock
          rustc --version
          cargo --version
          cc --version | head -1
      - name: Setup independent JavaScript WebAssembly runtime
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: wasm-w2-br-table
      - name: Validate W2 generated br_table and x86/Wasm differential plus W0/W1 regression
        working-directory: compiler
        run: cargo test -p compiler-backend-wasm --tests -- --nocapture
      - name: Strict W2 backend Clippy
        working-directory: compiler
        run: cargo clippy -p compiler-backend-wasm --all-targets -- -D warnings
