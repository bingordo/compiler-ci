name: X7 S2F inspect 10 real source/XED vector-pp mismatches
on:
  push:
    branches: [feature/x7-s2f-pp-mismatch-audit-20261114]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: x7-s2-pinned-intel-xed-variant-join
          run-id: 43625437032
          repository: bingordo/compiler-ci
          github-token: ${{ github.token }}
          path: /tmp/join
      - run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          from collections import Counter
          j=json.loads(Path('/tmp/join/join-1.json').read_text())
          matched=[]
          for form in j['forms']:
            for v in form['xed_variants']:
              e=v.get('map_prefix_evidence',{})
              if e.get('vector_pp_status')!='vector_pp_disjoint':
                continue
              matched.append((form,v,e))
          print('PP_DISJOINT_COUNT',len(matched))
          for f,v,e in matched:
            print('PP_DISJOINT',
                  json.dumps({
                    'name':f['xed_iform'],'join_status':f['join_status'],
                    'form_id':f['form_id'],'variant_id':v['variant_id'],
                    'source_vector_pp':e['source_vector_pp'],
                    'xed_vector_pp':e['xed_vector_pp'],
                    'source_space':e['source_encoding_space'],
                    'xed_space':e['xed_encoding_space'],
                    'source_map':e['source_opcode_map'],
                    'xed_map':e['xed_opcode_map'],
                    'opcode_base':v['opcode_base16'],
                    'excluded':v['excluded'],
                    'legacy_opcode_evidence':v['literal_opcode_evidence'],
                    'xed_inventory_blockers':v['xed_inventory_blockers'],
                    'identity_prefixes':{
                      k:v['identity'].get(k) for k in ('evex_pp','osz_66_required','f2_required','f3_required','encoding_space','map','rexw_prefix','vl')
                    },
                  },sort_keys=True))
          assert len(matched)==10
          PY
