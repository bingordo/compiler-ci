name: Verify X6 width-lifted ADD64 generator on compiler
on:
  push:
    branches: [main]
    paths: ['.github/workflows/verify-x86-x6-add64.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  x6-add64:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: integration/x86-x6-add64-main-20261102
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Record compiler revision
        run: git rev-parse HEAD
      - name: Prove generated ADD32 and ADD64 against pinned Intel source
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq z3
          python3 tools/fetch_x86_isl_subset.py /tmp/intel-isl
          python3 tools/import_intel_isl_subset.py /tmp/intel-isl
          python3 -m unittest discover -s tools -p 'test_x86_add_dag_rules.py' -v
          python3 -m unittest discover -s tools -p 'test_x86_add64_dag_rules.py' -v
          python3 tools/regen_x86_add_dag_patterns.py --check --intel-dir /tmp/intel-isl
          python3 tools/regen_x86_add64_dag_patterns.py --check --intel-dir /tmp/intel-isl
      - name: Isolate compiler core workspace
        run: |
          cat > Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir","crates/opt","crates/backend","crates/backend-x86"]
          EOF
          rm -f Cargo.lock
      - uses: Swatinem/rust-cache@v2
        with:
          key: x86-x6-add64-core
      - name: Run core tests and two-sink native 64-bit oracle
        run: |
          set -euo pipefail
          cargo test -p compiler-ir -p compiler-opt -p compiler-backend -p compiler-backend-x86
          cargo test -p compiler-backend-x86 --test x6_add64_native -- --nocapture
          echo X6_ADD64_MAIN status=PASS
