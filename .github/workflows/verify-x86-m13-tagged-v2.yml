name: x86 M1.13 tagged physical v2 PR 1196
on:
  pull_request:
    paths:
      - '.github/workflows/verify-x86-m13-tagged-v2.yml'
permissions:
  contents: read
jobs:
  x86-tagged-v2:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 0944573937dc37fa7afb73b02ecf5cbce89370e0
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Verify pinned source SHA
        run: test "$(git -C compiler rev-parse HEAD)" = "0944573937dc37fa7afb73b02ecf5cbce89370e0"
      - name: Isolate independent core workspace
        run: |
          cat > compiler/Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir", "crates/opt", "crates/backend", "crates/backend-x86"]
          EOF
          rm -f compiler/Cargo.lock
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: x86-m13-tagged-v2
          cache-workspace-crates: 'true'
      - name: Test lossless tagged physical variants and real TypeId ELF parity
        working-directory: compiler
        run: |
          cargo test -p compiler-backend-x86 --test typeid_physical_tagged_v2 -- --nocapture
          cargo test -p compiler-backend-x86 --test typeid_physical_control_replay -- --nocapture
          cargo test -p compiler-backend-x86 --test typeid_physical_memory_replay -- --nocapture
      - name: Full x86 backend regressions and strict Clippy
        working-directory: compiler
        run: |
          cargo test -p compiler-backend-x86
          cargo clippy -p compiler-backend-x86 --all-targets -- -D warnings
