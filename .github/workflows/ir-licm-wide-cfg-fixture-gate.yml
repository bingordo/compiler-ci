name: IR LICM CFG wide-void fixed fixture gate
on:
  push:
    branches: [ci/ir-licm-wide-cfg-20261114]
    paths: ['.github/workflows/ir-licm-wide-cfg-fixture-gate.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fixed-ir:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 705655e817e749f14ba032315c5e306f20ba158d
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Exact SHA and core isolated workspace
        run: |
          set -euo pipefail
          test "$(git -C compiler rev-parse HEAD)" = "705655e817e749f14ba032315c5e306f20ba158d"
          echo "Compiler SHA: 705655e817e749f14ba032315c5e306f20ba158d" >> "$GITHUB_STEP_SUMMARY"
          cat > compiler/Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir", "crates/opt", "crates/backend", "crates/backend-x86"]
          EOF
          rm -f compiler/Cargo.lock
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: ir-licm-wide-cfg-batch
      - name: Run migrated LICM and CFG wide-void original C11 oracles
        working-directory: compiler
        run: |
          set -euo pipefail
          cargo test -p compiler-opt --test typed_licm_native --test typed_inline_cfg_native --test typed_inline_wide_void_native -- --nocapture
      - name: Run adjacent existing TypeId IR fixture regression suites
        working-directory: compiler
        run: |
          set -euo pipefail
          cargo test -p compiler-opt --test typed_inline_leaf_native --test typed_core_pipeline --test typed_pre_native --test typed_mem2reg --test typed_cse --test typed_sccp --test typed_phi_cfg --test typed_dse
      - name: Validate production compiler core
        working-directory: compiler
        run: cargo check --workspace --lib
      - name: Strict Clippy on production libraries and affected test binaries
        working-directory: compiler
        run: |
          set -euo pipefail
          cargo clippy -p compiler-ir -p compiler-opt -p compiler-backend -p compiler-backend-x86 --lib -- -D warnings
          cargo clippy -p compiler-opt --test typed_licm_native --test typed_inline_cfg_native --test typed_inline_wide_void_native -- -D warnings
      - name: Record pinned acceptance gate
        run: |
          echo 'LICM, CFG, wide/void native original C11 + adjacent TypeId suites, core check and strict scoped Clippy PASS' >> "$GITHUB_STEP_SUMMARY"
