name: IR LICM CFG wide-void fixed fixture gate
on:
  push:
    branches: [ci/ir-licm-wide-cfg-20261114]
    paths: ['.github/workflows/ir-licm-wide-cfg-fixture-gate.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fixed-ir:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: c3c2562b8c48a091e0ccf30a3f7d6d137ed2c35b
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Exact SHA and core isolated workspace
        run: |
          set -euo pipefail
          test "$(git -C compiler rev-parse HEAD)" = "c3c2562b8c48a091e0ccf30a3f7d6d137ed2c35b"
          echo "Compiler SHA: c3c2562b8c48a091e0ccf30a3f7d6d137ed2c35b" >> "$GITHUB_STEP_SUMMARY"
          cat > compiler/Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir", "crates/opt", "crates/backend", "crates/backend-x86"]
          EOF
          rm -f compiler/Cargo.lock
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: ir-licm-wide-cfg-batch
      - name: Export original checked LICM/preheader fixture
        working-directory: compiler
        run: cargo test -p compiler-opt --test typed_licm_native export_original_licm_graphs -- --nocapture
      - name: Export original checked CFG inlining fixture
        working-directory: compiler
        run: cargo test -p compiler-opt --test typed_inline_cfg_native export_original_cfg_inline_graphs -- --nocapture
      - name: Export original checked wide-pointer-void fixture
        working-directory: compiler
        run: cargo test -p compiler-opt --test typed_inline_wide_void_native export_original_wide_void_graphs -- --nocapture
