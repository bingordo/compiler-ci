# Source-pinned end-to-end C program coverage, not just W9 micro-tests.
name: Wasm W22 checked Mini-C FP source
on:
  pull_request:
    paths:
      - '.github/workflows/wasm-w15-short-struct-returns.yml'
  workflow_dispatch:
    inputs:
      compiler_sha:
        description: 'Exact compiler commit to audit'
        required: true
        type: string
permissions:
  contents: read
jobs:
  source-coverage:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
      CARGO_INCREMENTAL: '0'
    steps:
      - name: Checkout exact compiler source
        uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: ${{ inputs.compiler_sha || '03916df853fdd5b24a66d384847e6ca3e1f22070' }}
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      # Explicit immutable public dependency checkouts eliminate anonymous
      # Cargo Git fetches (which can return HTTP 403 on a fresh runner).
      # The checked cargo rev pins remain unchanged and are verified below.
      - name: Checkout pinned Mini-C frontend source
        uses: actions/checkout@v4
        with:
          repository: bingordo/mini-c
          ref: 66c599591115e9c17a1d802db3d048cf4f39d294
          path: mini-c-pinned
          fetch-depth: 0
          persist-credentials: false
      - name: Checkout pinned Oberon frontend source
        uses: actions/checkout@v4
        with:
          repository: bingordo/oberon
          ref: 88979bfeda0ec08f9453010771df70ee5d28169c
          path: oberon-pinned
          fetch-depth: 0
          persist-credentials: false
      - name: Verify pins and isolate production driver
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C compiler rev-parse HEAD)" = "${{ inputs.compiler_sha || '03916df853fdd5b24a66d384847e6ca3e1f22070' }}"
          grep -F '66c599591115e9c17a1d802db3d048cf4f39d294' compiler/crates/driver/Cargo.toml
          grep -F '88979bfeda0ec08f9453010771df70ee5d28169c' compiler/crates/driver/Cargo.toml
          test "$(git -C mini-c-pinned rev-parse HEAD)" = "66c599591115e9c17a1d802db3d048cf4f39d294"
          grep -F '66c599591115e9c17a1d802db3d048cf4f39d294' compiler/tools/mini-c-driver/Cargo.toml
          git -C mini-c-pinned cat-file -e '66c599591115e9c17a1d802db3d048cf4f39d294^{commit}'
          test "$(git -C oberon-pinned rev-parse HEAD)" = "88979bfeda0ec08f9453010771df70ee5d28169c"
          # Longest insteadOf prefix wins, preserving the exact Cargo git
          # revision but retrieving source from verified local checkouts.
          git config --global url."file://${GITHUB_WORKSPACE}/mini-c-pinned".insteadOf "ssh://git@github.com/bingordo/mini-c.git"
          git config --global url."file://${GITHUB_WORKSPACE}/oberon-pinned".insteadOf "ssh://git@github.com/bingordo/oberon.git"
          git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
          cat > compiler/Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir","crates/opt","crates/backend","crates/backend-x86","crates/backend-aarch64","crates/backend-riscv64","crates/backend-wasm","crates/driver"]
          # The driver now consumes an explicit nested mini-c-driver path
          # dependency. Preserve its independent workspace boundary.
          exclude = ["tools/mini-c-driver"]
          EOF
          rm -f compiler/Cargo.lock
          python3 --version
          gcc --version | head -1
      - name: Node.js reference WebAssembly engine
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Cache checked source compiler build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: wasm-w15-short-struct-returns-20261123
      - name: Execute scalar FP and full existing Wasm backend regression suite
        working-directory: compiler
        run: |
          cargo test -p compiler-backend-wasm --test scalar_fp -- --nocapture
          cargo test -p compiler-backend-wasm --tests
      - name: Verify checked source frontend and production WASM driver against GCC
        working-directory: compiler
        run: |
          cargo test -p compiler --test wasm32_minic_source w22_checked_scalar_fp_matches_gcc -- --nocapture
          cargo test -p compiler --test wasm32_minic_source native_and_gcc_differential_for_actual_checked_mini_c_source -- --nocapture
