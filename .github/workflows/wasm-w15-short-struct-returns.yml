# Source-pinned end-to-end C program coverage, not just W9 micro-tests.
name: Wasm W16-W18 integrated aggregate result ABI
on:
  pull_request:
    paths:
      - '.github/workflows/wasm-w15-short-struct-returns.yml'
  workflow_dispatch:
    inputs:
      compiler_sha:
        description: 'Exact compiler commit to audit'
        required: true
        type: string
permissions:
  contents: read
jobs:
  source-coverage:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
      CARGO_INCREMENTAL: '0'
    steps:
      - name: Checkout exact compiler source
        uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: ${{ inputs.compiler_sha || '6f0e83bdb49ba0ed0be552e888279f49c9fe093d' }}
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      # Explicit immutable public dependency checkouts eliminate anonymous
      # Cargo Git fetches (which can return HTTP 403 on a fresh runner).
      # The checked cargo rev pins remain unchanged and are verified below.
      - name: Checkout pinned Mini-C frontend source
        uses: actions/checkout@v4
        with:
          repository: bingordo/mini-c
          ref: 66c599591115e9c17a1d802db3d048cf4f39d294
          path: mini-c-pinned
          fetch-depth: 0
          persist-credentials: false
      - name: Checkout pinned Oberon frontend source
        uses: actions/checkout@v4
        with:
          repository: bingordo/oberon
          ref: 88979bfeda0ec08f9453010771df70ee5d28169c
          path: oberon-pinned
          fetch-depth: 0
          persist-credentials: false
      - name: Checkout exact upstream baseline for unrelated ASM2 failures
        uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: d6a6cb71920183b34a17bfce335244be33423e57
          path: compiler-baseline
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Verify pins and isolate production driver
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C compiler rev-parse HEAD)" = "${{ inputs.compiler_sha || '6f0e83bdb49ba0ed0be552e888279f49c9fe093d' }}"
          grep -F '66c599591115e9c17a1d802db3d048cf4f39d294' compiler/crates/driver/Cargo.toml
          grep -F '88979bfeda0ec08f9453010771df70ee5d28169c' compiler/crates/driver/Cargo.toml
          test "$(git -C mini-c-pinned rev-parse HEAD)" = "66c599591115e9c17a1d802db3d048cf4f39d294"
          grep -F '66c599591115e9c17a1d802db3d048cf4f39d294' compiler/tools/mini-c-driver/Cargo.toml
          git -C mini-c-pinned cat-file -e '66c599591115e9c17a1d802db3d048cf4f39d294^{commit}'
          test "$(git -C oberon-pinned rev-parse HEAD)" = "88979bfeda0ec08f9453010771df70ee5d28169c"
          # Longest insteadOf prefix wins, preserving the exact Cargo git
          # revision but retrieving source from verified local checkouts.
          git config --global url."file://${GITHUB_WORKSPACE}/mini-c-pinned".insteadOf "ssh://git@github.com/bingordo/mini-c.git"
          git config --global url."file://${GITHUB_WORKSPACE}/oberon-pinned".insteadOf "ssh://git@github.com/bingordo/oberon.git"
          git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
          cat > compiler/Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir","crates/opt","crates/backend","crates/backend-x86","crates/backend-aarch64","crates/backend-riscv64","crates/backend-wasm","crates/driver"]
          # The driver now consumes an explicit nested mini-c-driver path
          # dependency. Preserve its independent workspace boundary.
          exclude = ["tools/mini-c-driver"]
          EOF
          rm -f compiler/Cargo.lock
          python3 --version
          gcc --version | head -1
      - name: Node.js reference WebAssembly engine
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Cache checked source compiler build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: wasm-w15-short-struct-returns-20261123
      - name: Build production compiler driver
        working-directory: compiler
        run: cargo build -p compiler --bin compiler
      - name: Audit real source programs against GCC, native TypeId and Node Wasm
        working-directory: compiler
        run: |
          python3 tools/wasm-coverage/run.py \
            --compiler target/debug/compiler \
            --output coverage/wasm-source-coverage.json \
            --baseline tools/wasm-coverage/baseline.json
      - name: Require seventy new general aggregate return C11/GCC/Node oracles
        working-directory: compiler
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          families=("init","assign","forward","argument","copy","recursive","alias")
          expected={f"w17_return_{f}_{n:03d}" for f in families for n in (9,12,15,16,17,24,32,64,128,256)}
          result=json.loads(Path("coverage/wasm-source-coverage.json").read_text())
          records={c["id"]:c for c in result["results"] if c["id"].startswith("w17_return_")}
          assert set(records)==expected, f"missing/unexpected W17 programs: {set(records)^expected}"
          assert result["summary"]["total"]==198, result["summary"]
          for name,case in sorted(records.items()):
              for target in ("gcc","wasm"):
                  assert case[target]["status"]=="pass", (name,target,case[target])
              native=case.get("native",{})
              assert native.get("status") not in ("mismatch","runtime_error","link_gap"), (name,native)
              assert not native.get("partial_object",False), (name,native)
          print(f"All {len(expected)} W17 private C record returns match GCC under Node/Wasm")
          PY
      - name: Regress checked Mini-C Wasm source and W13 scalable record and eightbyte return ABI, copy isolation and fail-closed tests
        working-directory: compiler
        run: |
          cargo test -p compiler --test wasm32_minic_source -- --nocapture
          cargo test -p compiler --test wasm13_aggregate_returns -- --nocapture
      - name: Compare ASM2 unit failures with exact upstream baseline
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C compiler-baseline rev-parse HEAD)" = "d6a6cb71920183b34a17bfce335244be33423e57"
          # Keep the nested Mini-C test build isolated in both checkouts.
          cp compiler/Cargo.toml compiler-baseline/Cargo.toml
          rm -f compiler-baseline/Cargo.lock
          mkdir -p compiler/coverage
          export CARGO_TARGET_DIR="$GITHUB_WORKSPACE/compiler/tools/mini-c-driver/target"
          set +e
          cargo test --manifest-path compiler-baseline/tools/mini-c-driver/Cargo.toml --lib asm2_ > compiler/coverage/asm2-baseline.log 2>&1
          baseline_rc=$?
          cargo test --manifest-path compiler/tools/mini-c-driver/Cargo.toml --lib asm2_ > compiler/coverage/asm2-candidate.log 2>&1
          candidate_rc=$?
          set -e
          cat compiler/coverage/asm2-baseline.log
          cat compiler/coverage/asm2-candidate.log
          BASELINE_RC="$baseline_rc" CANDIDATE_RC="$candidate_rc" python3 - <<'PY'
          import os, re
          from pathlib import Path
          def results(name, rc):
              log = Path(f"compiler/coverage/asm2-{name}.log").read_text()
              matches = re.findall(r"^test (\S+) \.\.\. (ok|FAILED|ignored)\s*$", log, re.M)
              assert matches and "test result:" in log, f"{name}: did not execute ASM2 tests"
              assert rc == 0 or (rc == 101 and any(v == "FAILED" for _,v in matches)), (name, rc)
              return dict(matches)
          base = results("baseline", int(os.environ["BASELINE_RC"]))
          cand = results("candidate", int(os.environ["CANDIDATE_RC"]))
          missing = set(base) - set(cand)
          regressions = {n for n,v in cand.items() if v == "FAILED" and base.get(n) != "FAILED"}
          ignored = {n for n,v in cand.items() if v == "ignored" and base.get(n) != "ignored"}
          inherited = sorted(n for n,v in cand.items() if v == base.get(n) == "FAILED")
          print("Inherited ASM2 failures (also present on exact upstream baseline):", inherited)
          assert not (missing or regressions or ignored), (missing, regressions, ignored)
          PY
      - name: Regress all non-ASM2 Mini-C units and aggregate proofs
        working-directory: compiler
        run: |
          cargo test --manifest-path tools/mini-c-driver/Cargo.toml --lib checked_local_memcpy::tests
          python3 tools/wasm-coverage/generate_w13_cases.py
          cargo test --manifest-path tools/mini-c-driver/Cargo.toml --lib aggregate_wasm_gp::tests
          cargo test --manifest-path tools/mini-c-driver/Cargo.toml --lib wasm_tail_record_result_forwards_hidden_destination_but_not_assignment
          cargo test --manifest-path tools/mini-c-driver/Cargo.toml --lib -- --skip asm2_
      - name: Regress Wasm memory backend and checked pointer implementation
        working-directory: compiler
        run: cargo test -p compiler-backend-wasm --tests
      - name: Verify TypeId opcode types, IR text/binary and memory provenance
        working-directory: compiler
        run: |
          cargo test -p compiler-ir --lib
          cargo test -p compiler-ir --test typed_borrowed_bytes
      - name: Verify TypeId integer source optimizer and W12c memory effects
        working-directory: compiler
        run: cargo test -p compiler-opt --lib
      # Native target-specific suites are owned by their own current-main
      # regression gates. This candidate changes no native machine selector.
      # Require the changed shared backend and focused native ABI oracles,
      # not historical unrelated target-specific rejection tests.
      - name: Regress changed shared scalar backend and large-call legalization
        working-directory: compiler
        run: cargo test -p compiler-backend --lib
      - name: Verify updated driver sidecar snapshot test
        working-directory: compiler
        run: cargo test -p compiler --bin compiler lto_sidecar_snapshot
      # The separate ELF COMDAT work on main currently trips three more
      # style-only Clippy lints (suspicious assignment formatting, collapsible_if,
      # chunks_exact_to_as_chunks). W14 changes no COMDAT code; retain strict
      # linting for every other diagnostic and report these scoped exceptions.
      - name: Scoped Wasm Clippy with documented inherited baseline exceptions
        working-directory: compiler
        run: |
          # Existing unrelated crates/backend/src/elf/constructor_priority.rs
          # (from concurrent ELF work, present in merged compiler main) has
          # needless_lifetimes and collapsible_match in the shared backend.
          # These CI-scoped exceptions do NOT credit/fix that code or weaken
          # runtime C/Wasm/IR/backend test verification.
          # Preexisting transitive warnings: compiler-backend-x86
          # stage_gp_memory_read dead_code (added by concurrent x86 work),
          # compiler-opt/cse.rs unused re-export, and selector/generated
          # unused-variable/comment lints. W13 does not fix or credit these.
          cargo clippy -p compiler-backend-wasm --all-targets -- \
            -D warnings -A clippy::empty_line_after_doc_comments \
            -A unused_variables -A unused_imports -A dead_code \
            -A clippy::needless_lifetimes -A clippy::collapsible_match \
            -A clippy::suspicious_assignment_formatting \
            -A clippy::collapsible_if -A clippy::chunks_exact_to_as_chunks
      - name: Scoped driver Clippy with inherited native exceptions
        working-directory: compiler
        run: |
          cargo clippy -p compiler --bin compiler --test wasm32_minic_source -- \
            -D warnings -A dead_code -A clippy::too_many_arguments \
            -A unused_imports -A clippy::needless_return \
            -A clippy::empty_line_after_doc_comments -A unused_variables \
            -A clippy::needless_lifetimes -A clippy::collapsible_match \
            -A clippy::suspicious_assignment_formatting \
            -A clippy::collapsible_if -A clippy::chunks_exact_to_as_chunks
      - name: Publish machine-readable case results even when audit detects a mismatch
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wasm-source-coverage
          path: |
            compiler/coverage/wasm-source-coverage.json
            compiler/coverage/asm2-baseline.log
            compiler/coverage/asm2-candidate.log
          if-no-files-found: warn
          retention-days: 30
