# Pin compiler PR391 source while isolated native/IR CI executes.
name: Verify PR391 TypeId alias and call runtime
on:
  push:
    branches: [ci/pr391-typeid-alias-calls]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 564703730b1e5e62c8651752d0b9b2d33a8c7cf8
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Verify immutable compiler revision
        run: test "$(git -C compiler rev-parse HEAD)" = "564703730b1e5e62c8651752d0b9b2d33a8c7cf8"
      - name: Restrict compiler core workspace
        run: |
          cat > compiler/Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir", "crates/opt", "crates/backend", "crates/backend-x86"]
          EOF
          rm -f compiler/Cargo.lock
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: typeid-alias-calls-pr391
          cache-workspace-crates: 'true'
      - name: Focused TypeId alias and mixed-call ABI native GAS ELF tests
        working-directory: compiler
        run: cargo test -p compiler-backend-x86 --test typed_alias_calls_native -- --nocapture
      - name: Full self-contained compiler core and native regression suites
        working-directory: compiler
        run: cargo test -p compiler-ir -p compiler-opt -p compiler-backend -p compiler-backend-x86
      - name: Strict backend Clippy all targets
        working-directory: compiler
        run: cargo clippy -p compiler-backend-x86 --all-targets -- -D warnings
