# Broader C-language coverage: do not force constrained YARPGen options.
# This is distinct from the fast 10-seed smoke and 100-seed constrained run.
name: EDG Cranelift default-profile breadth
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/edg-yarpgen-100-default.yml'
  schedule:
    - cron: '43 6 1 * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  breadth:
    uses: ./.github/workflows/edg-yarpgen.yml
    with:
      source_ref: cranelift-codegen
      count: '100'
      start_seed: '12345'
      profile: default
