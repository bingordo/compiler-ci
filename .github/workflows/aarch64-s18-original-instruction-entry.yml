name: AArch64 S18 original ADC ADCS executable-entry frontier
on:
  pull_request:
    paths:
      - '.github/workflows/aarch64-s18-original-instruction-entry.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-entry:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: a4915464dad8896564eb63d02319dcac8464ef19
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: herd/herdtools7
          ref: cfc4f56c522ec0d701acaf5a23139b47e8711299
          path: herd
          sparse-checkout: |
            herd/libdir/asl-pseudocode/bundler.py
          persist-credentials: false
      - name: Audit original Arm instruction executable entry points
        run: |
          set -euo pipefail
          curl -fLsS --retry 3 --connect-timeout 20 --max-time 240 --max-filesize 200000000 -o /tmp/arm2026.tar.gz https://developer.arm.com/-/cdn-downloads/permalink/Exploration-Tools-A64-ISA/ISA_A64/ISA_A64_xml_A_profile-2026-09.tar.gz
          echo '44cfb89c763c7eea8e59de0ad2221e3c012e6aa77899bd7f1c3e1f24537191d7  /tmp/arm2026.tar.gz' | sha256sum -c -
          python3 compiler/tools/aarch64_a32_full_source_catalog.py --isa-xml-archive /tmp/arm2026.tar.gz --out /tmp/catalog.json
          python3 - <<'PY'
          import sys, json, re, hashlib, tempfile, tarfile
          from pathlib import Path
          sys.path.insert(0,'compiler/tools')
          from aarch64_a32_aslref_compat import load_bundler, verify_xml
          from aarch64_a32_asl_source_links import ROOT
          from aarch64_a32_full_source_catalog import validate_catalog
          index=validate_catalog(json.load(open('/tmp/catalog.json')))
          bundle=load_bundler(Path('herd/herd/libdir/asl-pseudocode/bundler.py'))
          with tarfile.open('/tmp/arm2026.tar.gz','r:gz') as archive, tempfile.TemporaryDirectory() as td:
              for op in ('ADC','ADCS'):
                  entry=index[op]
                  raw=archive.extractfile(ROOT+entry['xml_path']).read()
                  verify_xml(raw,entry)
                  path=Path(td)/entry['xml_path']
                  path.write_bytes(raw)
                  asl=bundle.one_instruction_to_string(path)
                  headers=[s.strip() for s in asl.splitlines()
                           if re.match(r'\s*(?:func|procedure)\s+',s)]
                  keywords=['AddWithCarry','PSTATE.C','PSTATE.<N,Z,C,V>','X[d]','bits(64)','bits(32)']
                  print('S18_ORIGINAL_INSTRUCTION',op,entry['operation_id'],entry['xml_sha256'],
                        'bundled_sha256',hashlib.sha256(asl.encode()).hexdigest(),
                        'bytes',len(asl.encode()), 'function_count',len(headers))
                  for j,s in enumerate(headers):
                      print('S18_ORIGINAL_ENTRY',op,j,'signature_sha256',hashlib.sha256(s.encode()).hexdigest(),
                            'signature_length',len(s),'prefix',s[:65],
                            'params',s.count(','),'arrow', '=>' in s)
                  print('S18_ORIGINAL_REFERENCES',op,
                        {name:asl.count(name) for name in keywords},
                        'getter',len(re.findall(r'\b(?:getter|setter)\b',asl)),
                        'assignments',asl.count(' = '),
                        'file_lines',len(asl.splitlines()))
                  calls=sorted(set(re.findall(r'\b([A-Za-z][A-Za-z0-9_]*)\s*\(',asl)))
                  refs=sorted(set(re.findall(r'\b(?:PSTATE(?:\.[A-Za-z]+)?|X(?:\[[^\]]{1,50}\])?|R(?:\[[^\]]{1,50}\])?)',asl)))
                  print('S18_CALL_NAMES',op,calls)
                  print('S18_ARCH_STATE_REFS',op,refs)
                  print('S18_ARCH_STATE_ASSIGNMENT_COUNT',op,sum(1 for l in asl.splitlines() if ('PSTATE.' in l or 'X[' in l or 'R[' in l) and '=' in l))
          PY

  full-instruction-aslref-frontier:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    container:
      image: ocaml/opam:alpine-3.21-ocaml-5.2
      options: --user root
    env:
      OPAMROOT: /home/opam/.opam
      OPAMROOTISOK: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          repository: herd/herdtools7
          ref: cfc4f56c522ec0d701acaf5a23139b47e8711299
          path: herd
          persist-credentials: false
      - name: Build authentic upstream ASLRef
        shell: sh
        run: |
          set -eu
          apk add --no-cache bash python3 curl coreutils git gmp-dev pkgconf
          opam install -y dune menhir zarith
          (cd herd && opam exec -- dune build -p aslref --profile release)
          ./herd/_build/default/asllib/aslref.exe --version | grep -Fx 'aslref version 1.0-EAC2'
      - name: Identify executable original-body architectural dependencies
        shell: sh
        run: |
          set -eu
          curl -fLsS --retry 3 --connect-timeout 20 --max-time 240 --max-filesize 200000000 -o /tmp/arm2026.tar.gz https://developer.arm.com/-/cdn-downloads/permalink/Exploration-Tools-A64-ISA/ISA_A64/ISA_A64_xml_A_profile-2026-09.tar.gz
          echo '44cfb89c763c7eea8e59de0ad2221e3c012e6aa77899bd7f1c3e1f24537191d7  /tmp/arm2026.tar.gz' | sha256sum -c -
          python3 - <<'PY'
          import hashlib, re, subprocess, tarfile, tempfile, importlib.util, pathlib, sys
          from argparse import Namespace
          from pathlib import Path
          bundler=Path('herd/herd/libdir/asl-pseudocode/bundler.py')
          raw=bundler.read_bytes()
          assert hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest()=='938d34fe4d74f38f20ff9932f994c359e2266a9f'
          spec=importlib.util.spec_from_file_location('arm_s18_bundler',bundler)
          module=importlib.util.module_from_spec(spec)
          sys.modules[spec.name]=module
          spec.loader.exec_module(module)
          import xml.etree.ElementTree as ET
          exe=str(Path('herd/_build/default/asllib/aslref.exe').resolve())
          root='ISA_A64_xml_A_profile-2026-09/'
          with tarfile.open('/tmp/arm2026.tar.gz','r:gz') as tar, tempfile.TemporaryDirectory() as tmp:
              folder=Path(tmp)
              shared=tar.extractfile(root+'shared_pseudocode.xml').read()
              matches=[''.join(ps.itertext()) for ps in ET.fromstring(shared).iter('ps') if ps.get('name')=='shared/functions/integer/AddWithCarry']
              assert len(matches)==1
              helper=matches[0]
              assert hashlib.sha256(helper.encode()).hexdigest()=='1e80df3bc60c0393805a5c93aab8aeca6a3428e22fe2dc1d8c484f8f969e5129'
              for op,xml_sha,asl_sha in (
                  ('ADC','6535744522e9bff885ea0aa9d637a4677f1a81f47abf734066ba3afdbe2995e8','6e33c1fd8333a38350e914b99abc0fd41c4c997e349eac5fe98b655af83fe64b'),
                  ('ADCS','9ad6edcba8c59737e1fdccd209462d0625f834f6d33785f80002bc45ae9db12c','79dfb059a270d335ad0471f5168a6888a54545d4fcd4fd933719cd225735672a')):
                  filename=op.lower()+'.xml'
                  raw=tar.extractfile(root+filename).read()
                  assert hashlib.sha256(raw).hexdigest()==xml_sha
                  (folder/filename).write_bytes(raw)
                  original=module.one_instruction_to_string(folder/filename)
                  assert hashlib.sha256(original.encode()).hexdigest()==asl_sha
                  source=helper+'\n'+original+'\nfunc main() => integer\nbegin\n  instr_'+op.lower()+"('"+('0'*32)+"');\n  return 0;\nend;\n"
                  path=folder/(op.lower()+'.asl')
                  path.write_text(source)
                  r=subprocess.run([exe,'--version-eac1','--type-check-strict','--no-exec','-1',path.name],cwd=folder,capture_output=True,timeout=60)
                  stderr=r.stderr.decode('utf8','replace')
                  categories={key:len(re.findall(key,stderr,re.I)) for key in ('unbound','undefined','type error','grammar error','not declared','does not exist')}
                  print('S18_ORIGINAL_ASL_TYPE_FRONTIER',op,'rc',r.returncode,'categories',categories,'bytes',len(r.stderr),'source_modified',False)
                  assert r.returncode!=0, 'unexpectedly complete architecture state without register inputs'
          PY
