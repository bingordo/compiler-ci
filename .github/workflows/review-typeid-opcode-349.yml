name: One-off TypeId opcode PR 349 validation

on:
  push:
    branches:
      - review/typeid-opcode-349-ci
  pull_request:
    paths:
      - '.github/workflows/review-typeid-opcode-349.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compiler-ir:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 4e213794ddb4290993b064e849d7c0b530045b9c
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Confirm immutable source revision
        shell: bash
        run: |
          test "$(git -C compiler rev-parse HEAD)" = "4e213794ddb4290993b064e849d7c0b530045b9c"
      - name: Prepare self-contained core workspace
        shell: bash
        run: |
          cat > compiler/Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir", "crates/opt", "crates/backend", "crates/backend-x86"]
          EOF
          rm -f compiler/Cargo.lock
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: typeid-opcode-review
      - name: Verify TypeId opcode widths and legacy differential
        working-directory: compiler
        run: cargo test -p compiler-ir --test typed_opcode_types -- --nocapture
      - name: Verify all IR tests
        working-directory: compiler
        run: cargo test -p compiler-ir
      - name: Enforce strict IR clippy
        working-directory: compiler
        run: cargo clippy -p compiler-ir --all-targets -- -D warnings
