name: Validate nested bulk addition PR3163
on:
  push:
    branches: [test/bulk-nested-add-pr3163]
    paths: ['.github/workflows/validate-bulk-nested-add-pr3163.yml']
permissions:
  contents: read
jobs:
  differential:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 13caf27a1a6b4c208481ca4b31189149bb7f73d4
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Confirm exact compiler candidate
        run: test "$(git -C compiler rev-parse HEAD)" = "13caf27a1a6b4c208481ca4b31189149bb7f73d4"
      - name: Configure dependencies
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan github.com >> ~/.ssh/known_hosts
          git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: nested-bulk-add-pr3163
      - name: TypeId nested count DAG regression
        working-directory: compiler
        run: cargo test -p compiler-ir --test typed_memcpy_count_bounds -- --nocapture
      - name: GCC memmove GAS and direct ELF differential
        working-directory: compiler
        run: cargo test -p compiler --test native_lp64_disjoint_memmove -- --nocapture
      - name: Record pinned source
        if: always()
        run: |
          echo 'Pinned compiler source 13caf27a1a6b4c208481ca4b31189149bb7f73d4' >> "$GITHUB_STEP_SUMMARY"
