name: X7 S4 real selected-machine GAS globals constructors visibility and TLS
on:
  pull_request:
    paths:
      - '.github/workflows/verify-x7-s4-native-shared-gas-metadata-20261115.yml'
permissions:
  contents: read
jobs:
  real-compiler-source-gas-and-direct-elf:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.CI_KEY }}
      - name: Trust source frontend GitHub SSH
        run: ssh-keyscan github.com >> ~/.ssh/known_hosts
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 4a3509f011cea54c1eb1148e4bef1ad19e978bf3
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Verify exact source SHA
        run: test "$(git -C compiler rev-parse HEAD)" = "4a3509f011cea54c1eb1148e4bef1ad19e978bf3"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: x7-s4-native-shared-gas-source
      - name: End-to-end Mini-C and Oberon ELF GAS linker C11 pthread oracles
        shell: bash
        working-directory: compiler
        run: |
          set -euo pipefail
          cargo test -p compiler --test m42_module_initialization_native -- --nocapture
          cargo test -p compiler --test x7_s4_source_elf_metadata -- --nocapture
          cargo test -p compiler --test x7_selected_machine_source -- --nocapture
          cargo test -p compiler --test x7_s4_rolling_checksum_source -- --nocapture
          cargo test -p compiler --test x86_annotated_asm -- --nocapture
          cargo check -p compiler
          echo X7_S4_SHARED_GAS_REAL_SOURCE_PARITY_GREEN
  shared-physical-gas-relro:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 4a3509f011cea54c1eb1148e4bef1ad19e978bf3
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Verify same x86 source revision
        run: test "$(git -C compiler rev-parse HEAD)" = "4a3509f011cea54c1eb1148e4bef1ad19e978bf3"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: x7-s4-shared-gas-relro
      - name: Isolate TypeId backend workspace for local native oracles
        shell: bash
        run: |
          set -euo pipefail
          cat > compiler/Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir","crates/opt","crates/backend","crates/backend-x86"]
          EOF
          rm -f compiler/Cargo.lock
      - name: Real shared PIC GOT RELRO pointer globals and prior ABI GAS tests
        shell: bash
        working-directory: compiler
        run: |
          set -euo pipefail
          cargo test -p compiler-backend-x86 --test x7_shared_pic_global_native -- --nocapture
          cargo test -p compiler-backend-x86 --test x7_shared_machine_native_parity
          cargo test -p compiler-backend-x86 --test m4_8_checked_symbol_attributes_native
          cargo test -p compiler-backend-x86 --lib
          cargo test -p compiler-backend-x86 --no-default-features --lib
          echo X7_S4_SHARED_GAS_GOT_RELRO_BACKEND_GREEN
