name: Existing SCCP and CTFE IR fixture migration
on:
  push:
    branches: [verify/ir-sccp-ctfe-fixtures-20261114]
    paths: ['.github/workflows/ir-sccp-ctfe-fixtures-20261114.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 64634c95c8fd0c4a7ba77cdd3f3f5abc8f8e9181
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Verify exact source revision
        run: test "$(git -C compiler rev-parse HEAD)" = "64634c95c8fd0c4a7ba77cdd3f3f5abc8f8e9181"
      - name: Restrict workspace to compiler core
        run: |
          cat > compiler/Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir", "crates/opt", "crates/backend", "crates/backend-x86"]
          EOF
          rm -f compiler/Cargo.lock
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: ir-sccp-ctfe-migration
      - name: Converted SCCP CTFE plus existing fixed-IR regression suites
        working-directory: compiler
        run: |
          cargo test -p compiler-opt --test typed_sccp --test typed_ctfe
          cargo test -p compiler-opt --test typed_cse --test typed_array_fold --test typed_local
          cargo test -p compiler-opt --test typed_phi_cfg --test typed_phi_dead_linear --test typed_identical_merges
          cargo test -p compiler-opt --test ir_fixture_directives
          cargo test -p compiler-ir --test native_fixture_text
          cargo clippy -p compiler-opt --test typed_sccp --test typed_ctfe -- -D warnings
