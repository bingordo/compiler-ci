name: One-off typed SCCP PR416 validation
on:
  pull_request:
    paths:
      - '.github/workflows/review-typed-sccp-pr416.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 76ab68570449995a08dde4f16ae90d234a18e304
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Pin exact source SHA
        run: test "$(git -C compiler rev-parse HEAD)" = "76ab68570449995a08dde4f16ae90d234a18e304"
      - name: Self-contained core workspace
        shell: bash
        run: |
          cat > compiler/Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir", "crates/opt", "crates/backend", "crates/backend-x86"]
          EOF
          rm -f compiler/Cargo.lock
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: review-typed-sccp-pr416
      - name: Focused typed SCCP differential and edge regressions
        working-directory: compiler
        run: cargo test -p compiler-opt --test typed_sccp -- --nocapture
      - name: Complete IR and optimizer tests
        working-directory: compiler
        run: cargo test -p compiler-ir -p compiler-opt
      - name: Strict Clippy
        working-directory: compiler
        run: cargo clippy -p compiler-ir -p compiler-opt --all-targets -- -D warnings
