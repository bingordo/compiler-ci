name: TypeId core CFG inline existing fixture migration
on:
  push:
    branches: [verify/ir-core-inline-fixtures-20261114]
    paths: ['.github/workflows/ir-core-inline-fixtures-20261114.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 87f59bd154c8c147d437543788f1efcc61e97cdc
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Check exact source SHA
        run: test "$(git -C compiler rev-parse HEAD)" = "87f59bd154c8c147d437543788f1efcc61e97cdc"
      - name: Restrict workspace to compiler core
        run: |
          cat > compiler/Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir", "crates/opt", "crates/backend", "crates/backend-x86"]
          EOF
          rm -f compiler/Cargo.lock
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: ir-core-inline-fixed-v3
      - name: Validate fixed TypeId core inliner IR migration with legacy and C11 oracles
        working-directory: compiler
        run: |
          cargo test -p compiler-opt --test typed_core_inline_integration -- --nocapture
          cargo test -p compiler-opt --test typed_inline_leaf_native --test typed_if_conversion_pure
          cargo test -p compiler-opt --test typed_global_memory --test typed_mem2reg --test typed_licm_native
          cargo test -p compiler-opt --test ir_fixture_directives --test native_ir_pass_replay
          cargo test -p compiler-ir --test native_fixture_text --test native_module_text_v3
          cargo clippy -p compiler-opt --test typed_core_inline_integration -- -D warnings
