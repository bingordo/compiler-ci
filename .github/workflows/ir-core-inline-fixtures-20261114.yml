name: TypeId core CFG inline existing fixture migration
on:
  push:
    branches: [verify/ir-core-inline-fixtures-20261114]
    paths: ['.github/workflows/ir-core-inline-fixtures-20261114.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 7aa5cf6b7b1ac95e9e633f08aa797643af2dc216
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Check exact source SHA
        run: test "$(git -C compiler rev-parse HEAD)" = "7aa5cf6b7b1ac95e9e633f08aa797643af2dc216"
      - name: Restrict workspace to compiler core
        run: |
          cat > compiler/Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir", "crates/opt", "crates/backend", "crates/backend-x86"]
          EOF
          rm -f compiler/Cargo.lock
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: ir-core-inline-fixed-v3
      - name: Export original fixed TypeId inlining cases
        working-directory: compiler
        run: |
          cargo test -p compiler-opt --test typed_core_inline_integration temporary_export_original_core_inline_fixed_typeid_corpus -- --nocapture
