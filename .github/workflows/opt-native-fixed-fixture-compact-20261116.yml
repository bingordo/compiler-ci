name: Optimizer TypeId fixed fixture compact and complete inventory
on:
  push:
    branches: [verify/opt-native-fixed-fixture-compact-20261116]
    paths: ['.github/workflows/opt-native-fixed-fixture-compact-20261116.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 85
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 85295fb0e734955987d7d6c1340b461722aec414
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Verify exact source tree
        run: test "$(git -C compiler rev-parse HEAD)" = "85295fb0e734955987d7d6c1340b461722aec414"
      - name: Isolate optimizer and native backend test workspace
        run: |
          cat > compiler/Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir", "crates/backend", "crates/backend-aarch64", "crates/backend-x86", "crates/opt"]
          EOF
          rm -f compiler/Cargo.lock
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: optimizer-18-native-fixed-compact
      - name: Check all optimizer IR fixtures and compact binary and canonical parity
        working-directory: compiler
        run: |
          cargo test -p compiler-opt --test native_v3_fixture_inventory -- --nocapture
          cargo test -p compiler-ir --test native_fixture_text --test native_module_text_v3
      - name: Install native AArch64 GCC binutils and QEMU
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends gcc-aarch64-linux-gnu libc6-dev-arm64-cross binutils-aarch64-linux-gnu qemu-user
      - name: Original algebra PHI local global aggregate induction regression tests
        working-directory: compiler
        env:
          COMPILER_REQUIRE_AARCH64_QEMU: "1"
        run: |
          cargo test -p compiler-opt --test typed_algebra --test typed_phi_cfg --test typed_local --test typed_local_memory --test typed_global_memory --test typed_aggregate_pipeline --test typed_induction_native --test typed_phi_dead_linear -- --nocapture
      - name: Check existing directive-based optimizer fixture runner
        working-directory: compiler
        run: cargo test -p compiler-opt --test ir_fixture_directives -- --nocapture
      - name: Strict scoped optimizer and parser Clippy
        working-directory: compiler
        run: |
          cargo clippy -p compiler-opt --no-deps --test native_v3_fixture_inventory --test typed_algebra --test typed_phi_cfg --test typed_local --test typed_local_memory --test typed_global_memory --test typed_aggregate_pipeline --test typed_induction_native --test typed_phi_dead_linear --test ir_fixture_directives -- -D warnings
