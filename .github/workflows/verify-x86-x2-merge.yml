name: Verify mergeable X2 observable-effect proof slice
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-x86-x2-merge.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-x86-x2-merge
  cancel-in-progress: true
jobs:
  effects-and-ssa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out clean X2 integration branch
        uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: integration/x86-x2-effect-proofs-20261102
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Record exact tested revision
        run: |
          sha="$(git rev-parse HEAD)"
          echo "X2 integration branch revision: $sha" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Install Z3
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq z3
          z3 --version
      - name: Verify real pinned Intel ISL sources
        run: |
          set -euo pipefail
          python3 tools/fetch_x86_isl_subset.py /tmp/intel-isl
          python3 tools/import_intel_isl_subset.py /tmp/intel-isl
      - name: Check all X1 and X2 symbolic effect tests
        env:
          INTEL_ISL_DIR: /tmp/intel-isl
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tools -p 'test_import_intel_isl_subset.py' -v
          python3 -m unittest discover -s tools -p 'test_x86_semantics.py' -v
          python3 -m unittest discover -s tools -p 'test_x86_instruction_effects.py' -v
          python3 -m unittest discover -s tools -p 'test_x86_isl_interpreter.py' -v
          python3 -m unittest discover -s tools -p 'test_x86_isl_symbolic.py' -v
          python3 -m unittest discover -s tools -p 'test_x86_ssa_adapter.py' -v
          python3 -m unittest discover -s tools -p 'test_x86_effect_proofs.py' -v
          echo "X2 source-backed effects/Z3/SSA verification passed" >> "$GITHUB_STEP_SUMMARY"
