name: Temporary native emission-order parity #3689
on:
  pull_request:
    paths: ['.github/workflows/temp-canonical-emission-3689.yml']
permissions:
  contents: read
jobs:
  replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      SOURCE_SHA: 37c7f2a71f9af7d2f0e2ce2c1544d75e9f989d6d
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: ${{ env.SOURCE_SHA }}
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.CI_KEY }}
      - name: Trust GitHub for frontend dependency fetches
        run: ssh-keyscan github.com >> ~/.ssh/known_hosts
      - name: Exact SHA and native replay tests
        working-directory: compiler
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          cargo test -p compiler --test typeid_ir_dump_replay -- --nocapture
