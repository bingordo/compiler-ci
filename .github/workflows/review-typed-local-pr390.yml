name: One-off typed local-forward PR390 check
on:
  pull_request:
    paths:
      - '.github/workflows/review-typed-local-pr390.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 2a3e966fe5c3673b2dc3e15afee5014c2154e218
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Verify exact source
        run: test "$(git -C compiler rev-parse HEAD)" = "2a3e966fe5c3673b2dc3e15afee5014c2154e218"
      - name: Use self-contained core Cargo workspace
        run: |
          cat > compiler/Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir", "crates/opt", "crates/backend", "crates/backend-x86"]
          EOF
          rm -f compiler/Cargo.lock
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: review-typed-local-pr390
      - name: Run typed local-memory forwarding regression
        working-directory: compiler
        run: cargo test -p compiler-opt --test typed_local_memory -- --nocapture
      - name: Run all IR and optimizer crate tests
        working-directory: compiler
        run: cargo test -p compiler-ir -p compiler-opt
      - name: Strict IR and optimizer Clippy
        working-directory: compiler
        run: cargo clippy -p compiler-ir -p compiler-opt --all-targets -- -D warnings
