name: Temporary historical Function caller inventory
on:
  pull_request:
    paths: ['.github/workflows/temp-legacy-retirement-grep.yml']
permissions:
  contents: read
jobs:
  inventory:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    env:
      SOURCE_SHA: 6813ab9fb8fdb668877edb63dc9c84d015fd0826
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: ${{ env.SOURCE_SHA }}
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Count remaining explicit historical caller files
        working-directory: compiler
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          declare -a labels=("HISTORICAL_X86" "IR_ORACLE_FEATURE" "OLD_GENERATED_FEATURES" "OLD_FUNCTION_TESTS")
          declare -a patterns=("LegacyFunctionBackend|historical_function_emission|historical_backend|historical-function-oracle" "legacy-ssa-oracle|legacy_verify|from_legacy|to_legacy|project_legacy_compat_function" "experimental-generated-rules|experimental-s14-audit|legacy-experimental-ssa|generated_expr_matcher" "(compiler_ir::.*\\bFunction\\b|\\bFunction[[:space:]]*\\{)")
          for i in "${!labels[@]}"; do
            label="${labels[$i]}"
            pattern="${patterns[$i]}"
            mapfile -t paths < <(git grep -lE "$pattern" -- crates tools ':!**/docs/**' | sort || true)
            echo "RETIRE_AUDIT ${label} count=${#paths[@]}"
            printf '%s\n' "${paths[@]}" | sed '/^$/d' | head -80
            echo "RETIRE_AUDIT_END ${label}"
          done
