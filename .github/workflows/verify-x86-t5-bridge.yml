name: Bridge T5.5 x86 validation to X3/X4 generator
on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Compiler main validation ref
        required: false
        default: main
        type: string
      generator_ref:
        description: Experimental instruction generator ref
        required: false
        default: feature/x86-cost-inventory
        type: string
      force_recheck:
        description: Rerun exact revisions despite passing cache
        required: false
        default: false
        type: boolean
  schedule:
    - cron: '13,28,43,58 * * * *'
  push:
    branches: [main]
    paths: ['.github/workflows/verify-x86-t5-bridge.yml']
permissions:
  contents: read
concurrency:
  group: x86-t5-generator-bridge
  cancel-in-progress: true

jobs:
  bridge:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout CI source for workflow versioning
        uses: actions/checkout@v4
      - name: Checkout stable compiler validation suite
        uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: ${{ inputs.source_ref || 'main' }}
          path: compiler-main
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Checkout experimental generator source
        uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: ${{ inputs.generator_ref || 'feature/x86-cost-inventory' }}
          path: compiler-generator
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Record exact revisions and require real source files
        id: sources
        shell: bash
        run: |
          set -euo pipefail
          main_sha="$(git -C compiler-main rev-parse HEAD)"
          generator_sha="$(git -C compiler-generator rev-parse HEAD)"
          [[ "$main_sha" =~ ^[0-9a-f]{40}$ ]]
          [[ "$generator_sha" =~ ^[0-9a-f]{40}$ ]]
          echo "main_sha=$main_sha" >> "$GITHUB_OUTPUT"
          echo "generator_sha=$generator_sha" >> "$GITHUB_OUTPUT"
          for path in \
            compiler-main/crates/backend-x86/tests/t5_x86_semantics.rs \
            compiler-main/tools/x86_t5_bridge_selector.rs \
            compiler-main/tools/x86_t5_bridge_manifest.py \
            compiler-main/tools/test_x86_t5_bridge_manifest.py \
            compiler-generator/data/x86_selector_patterns.json \
            compiler-generator/tools/regen_x86_selector_patterns.py \
            compiler-generator/crates/backend-x86/src/generated_selector_patterns.rs \
            compiler-generator/crates/backend-x86/tests/and_native.rs \
            compiler-generator/crates/backend-x86/tests/ctz_native.rs; do
            test -s "$path" || { echo "Missing required file: $path"; exit 1; }
          done
          {
            echo "Compiler main SHA: $main_sha"
            echo "Generator branch SHA: $generator_sha"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Check already accepted exact revision pair
        id: accepted
        uses: actions/cache/restore@v4
        with:
          path: .t5-x86-bridge-passed
          key: x86-t5-bridge-v1-${{ hashFiles('.github/workflows/verify-x86-t5-bridge.yml') }}-${{ steps.sources.outputs.main_sha }}-${{ steps.sources.outputs.generator_sha }}
          lookup-only: true
      - name: Report cached passing revision pair
        if: steps.accepted.outputs.cache-hit == 'true' && !inputs.force_recheck && github.event_name != 'push'
        run: echo 'Both exact compiler SHAs and this workflow already passed the T5/X3 bridge.' >> "$GITHUB_STEP_SUMMARY"
      - name: Check that generated catalog metadata is reviewed, not assumed proven
        if: steps.accepted.outputs.cache-hit != 'true' || inputs.force_recheck || github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s compiler-main/tools -p 'test_x86_t5_bridge_manifest.py' -v \
            2>&1 | tee "$RUNNER_TEMP/x86-t5-bridge-python.log"
          python3 compiler-main/tools/x86_t5_bridge_manifest.py \
            --generator-root compiler-generator \
            --main-sha "${{ steps.sources.outputs.main_sha }}" \
            --generator-sha "${{ steps.sources.outputs.generator_sha }}" \
            --output x86-t5-catalog-evidence.json \
            2>&1 | tee -a "$RUNNER_TEMP/x86-t5-bridge-python.log"
          cd compiler-generator
          python3 tools/regen_x86_forms.py --check
          python3 tools/regen_x86_selector_patterns.py --check
      - name: Build isolated core workspaces and install independent test fixture
        if: steps.accepted.outputs.cache-hit != 'true' || inputs.force_recheck || github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          text='''[workspace]
          resolver = "2"
          members = ["crates/ir", "crates/opt", "crates/backend", "crates/backend-x86"]
          '''
          for source in ('compiler-main','compiler-generator'):
              Path(source,'Cargo.toml').write_text(text)
          PY
          # This Rust check lives on main, but exercises the REAL generator
          # branch selector and produced Rule instances. Never merge copies
          # of generated sources back into main as part of this test.
          cp compiler-main/tools/x86_t5_bridge_selector.rs \
             compiler-generator/crates/backend-x86/tests/t5_x86_generator_bridge.rs
      - name: Reuse generator compilation cache
        if: steps.accepted.outputs.cache-hit != 'true' || inputs.force_recheck || github.event_name == 'push'
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler-generator -> target
          key: x86-t5-generator-bridge-v1
          cache-workspace-crates: 'true'
      - name: Validate real generated selector rule IDs and handler behavior
        if: steps.accepted.outputs.cache-hit != 'true' || inputs.force_recheck || github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          cd compiler-generator
          timeout --signal=TERM --kill-after=10s 4m \
            cargo test -p compiler-backend-x86 --test t5_x86_generator_bridge \
              -- --nocapture --test-threads=1 \
            2>&1 | tee "$RUNNER_TEMP/x86-t5-bridge-rust.log"
          grep -F 'T5_BRIDGE_SUMMARY generated_metadata_rules_exercised=7 executable_dag_rules_proven=0' \
            "$RUNNER_TEMP/x86-t5-bridge-rust.log"
          grep -F 'T5_BRIDGE_NEGATIVE status=DETECTED cases=2 fallback=MANUAL' \
            "$RUNNER_TEMP/x86-t5-bridge-rust.log"
          python3 - "$RUNNER_TEMP/x86-t5-bridge-rust.log" <<'PY'
          import pathlib,re,sys
          log=pathlib.Path(sys.argv[1]).read_text(errors='replace')
          selected=re.findall(r'T5_BRIDGE_RULE op=(\w+) rule=([A-Za-z0-9_]+) cost=(\d+) status=SELECTED_FROM_GENERATED_METADATA',log)
          if len(selected)!=7 or {s[0] for s in selected} != {'Add','Sub','Mul','DivS','Cmp','And','Ctz'}:
              raise SystemExit('Generator metadata did not select every reviewed rule')
          if not re.search(r'test result: ok\.\s+2 passed; 0 failed;',log):
              raise SystemExit('Two real selector bridge tests did not pass')
          print('Validated 7 actual generated selector rule identities')
          PY
      - name: Differential native AND CTZ and signed division on generator branch
        if: steps.accepted.outputs.cache-hit != 'true' || inputs.force_recheck || github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          cd compiler-generator
          timeout --signal=TERM --kill-after=10s 5m \
            cargo test -p compiler-backend-x86 \
              --test and_native --test ctz_native --test division_native \
              -- --nocapture --test-threads=1 \
            2>&1 | tee "$RUNNER_TEMP/x86-t5-generator-native.log"
          grep -F 'test and_encoding_matches_c_oracle_in_gas_and_direct_elf ... ok' "$RUNNER_TEMP/x86-t5-generator-native.log"
          grep -F 'test total_ctz_matches_c_in_both_machine_code_sinks ... ok' "$RUNNER_TEMP/x86-t5-generator-native.log"
          grep -F 'test signed_divide_quotient_remainder_and_register_lifetimes ... ok' "$RUNNER_TEMP/x86-t5-generator-native.log"
      - name: Install solver for stable T5.5 independent semantics
        if: steps.accepted.outputs.cache-hit != 'true' || inputs.force_recheck || github.event_name == 'push'
        shell: bash
        run: |
          if ! command -v z3 >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq --no-install-recommends z3
          fi
          z3 --version
      - name: Rerun independent T5.5 native and SMT gate on compiler main
        if: steps.accepted.outputs.cache-hit != 'true' || inputs.force_recheck || github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          cd compiler-main
          timeout --signal=TERM --kill-after=10s 5m \
            cargo test -p compiler-backend-x86 --test t5_x86_semantics \
              -- --nocapture --test-threads=1 \
            2>&1 | tee "$RUNNER_TEMP/x86-t5-main-native.log"
          timeout --signal=TERM --kill-after=10s 5m \
            cargo test -p compiler-backend-x86 --test t5_x86_semantics \
              t5_selected_x86_symbolic_flags_widths_and_addresses \
              -- --ignored --nocapture --test-threads=1 \
            2>&1 | tee "$RUNNER_TEMP/x86-t5-main-smt.log"
          python3 - "$RUNNER_TEMP/x86-t5-main-native.log" "$RUNNER_TEMP/x86-t5-main-smt.log" <<'PY'
          import pathlib,re,sys
          native,smt=[pathlib.Path(x).read_text(errors='replace') for x in sys.argv[1:]]
          if not re.search(r'test result: ok\.\s+3 passed; 0 failed;',native):
              raise SystemExit('Main T5.5 native suite failed or was skipped')
          formats=re.findall(r'T5_X86_NATIVE_FORMAT mode=(\w+) format=(\w+) status=PASS',native)
          if len(formats)!=4 or set(formats)!={(m,f) for m in ('framed','frameless') for f in ('elf','gas')}:
              raise SystemExit('Missing main native code path')
          expected=re.search(r'T5_X86_SMT status=PROVEN obligations=(\d+) mutants=(\d+)',smt)
          if not expected or int(expected[1])<16 or int(expected[2])<5:
              raise SystemExit('Missing independent SMT proof obligations/negative controls')
          if not re.search(r'test result: ok\.\s+1 passed; 0 failed;',smt):
              raise SystemExit('Main T5.5 Z3 test did not pass')
          print('Cross-branch: verified main SMT contracts and both native code sinks')
          PY
      - name: Summarize separate evidence types
        if: success() && (steps.accepted.outputs.cache-hit != 'true' || inputs.force_recheck || github.event_name == 'push')
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          path=Path('x86-t5-catalog-evidence.json')
          result=json.loads(path.read_text())
          assert len(result['rules'])==7 and result['executable_dag_rules_proven']==0
          result['selection_status']='PASSED_REAL_GENERATOR_BRANCH_RUST_TESTS'
          result['generator_native_status']='PASSED_AND_CTZ_DIV_ELF_GAS'
          result['main_t5_native_status']='PASSED_FOUR_NATIVE_FORMATS'
          result['main_t5_smt_status']='PASSED_INDEPENDENT_SELECTED_OP_CONTRACTS'
          result['cross_branch_x4_executable_dag_proven']=False
          result['status']='PASS_SEPARATE_PROOF_DOMAINS'
          path.write_text(json.dumps(result,sort_keys=True,indent=2)+'\n')
          PY
          {
            echo "T5/X3 cross-branch validation: PASS"
            echo "7 reviewed metadata rules exercise real branch selector."
            echo "Generator: native AND/CTZ/IDIV. Main: independent native and Z3 T5.5."
            echo "Executable synthesized DAG matchers: NOT CLAIMED."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload T5/X3 bridge evidence
        if: success() && (steps.accepted.outputs.cache-hit != 'true' || inputs.force_recheck || github.event_name == 'push')
        uses: actions/upload-artifact@v4
        with:
          name: x86-t5-generator-bridge
          path: |
            x86-t5-catalog-evidence.json
            ${{ runner.temp }}/x86-t5-bridge-python.log
            ${{ runner.temp }}/x86-t5-bridge-rust.log
            ${{ runner.temp }}/x86-t5-generator-native.log
            ${{ runner.temp }}/x86-t5-main-native.log
            ${{ runner.temp }}/x86-t5-main-smt.log
          retention-days: 14
      - name: Mark both exact revisions accepted
        if: success() && (steps.accepted.outputs.cache-hit != 'true' || inputs.force_recheck || github.event_name == 'push')
        shell: bash
        run: |
          mkdir -p .t5-x86-bridge-passed
          printf '%s %s\n' \
            "${{ steps.sources.outputs.main_sha }}" \
            "${{ steps.sources.outputs.generator_sha }}" > .t5-x86-bridge-passed/revisions.txt
      - name: Cache passing revision pair
        if: success() && steps.accepted.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .t5-x86-bridge-passed
          key: x86-t5-bridge-v1-${{ hashFiles('.github/workflows/verify-x86-t5-bridge.yml') }}-${{ steps.sources.outputs.main_sha }}-${{ steps.sources.outputs.generator_sha }}
      - name: Preserve failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: x86-t5-generator-bridge-failure
          path: |
            x86-t5-catalog-evidence.json
            ${{ runner.temp }}/x86-t5-bridge-python.log
            ${{ runner.temp }}/x86-t5-bridge-rust.log
            ${{ runner.temp }}/x86-t5-generator-native.log
            ${{ runner.temp }}/x86-t5-main-native.log
            ${{ runner.temp }}/x86-t5-main-smt.log
          if-no-files-found: ignore
          retention-days: 14
