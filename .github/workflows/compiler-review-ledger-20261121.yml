name: Compiler review ledger validation
on:
  push:
    branches: [ci/compiler-review-followup-20261120]
    paths: ['.github/workflows/compiler-review-ledger-20261121.yml']
permissions:
  contents: read
jobs:
  coverage:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: a8ead159e122177b73e1c4a6ec1652a12c2ad73f
          fetch-depth: 0
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Validate the review inventory
        working-directory: compiler
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "a8ead159e122177b73e1c4a6ec1652a12c2ad73f"
          git diff --name-only "ee100dbe2ae52c47515804a44092fb8031d56279" HEAD | grep -Fx docs/review/coverage.json
          python3 -m unittest discover -s tools -p test_review_coverage.py -v
          git worktree add --detach "$RUNNER_TEMP/review-before" "ee100dbe2ae52c47515804a44092fb8031d56279"
          python3 tools/review_coverage.py --root "$RUNNER_TEMP/review-before" --register "$RUNNER_TEMP/review-before/docs/review/coverage.json" --json > "$RUNNER_TEMP/review-before.json"
          python3 tools/review_coverage.py --json > "$RUNNER_TEMP/review-after.json"
          python3 - "$RUNNER_TEMP/review-before.json" "$RUNNER_TEMP/review-after.json" <<'PY'
          import json
          import sys
          with open(sys.argv[1]) as source:
              before = json.load(source)
          with open(sys.argv[2]) as source:
              after = json.load(source)
          assert before["problems"] == after["problems"], (before["problems"], after["problems"])
          prior = {record["id"] for record in before["records"]}
          added = [record for record in after["records"] if record["id"] not in prior]
          assert len(added) == 5
          assert sum(len(record["paths"]) for record in added) == 21
          assert all(record["effective_status"] == "partial" for record in added), added
          print("Existing stale completed reviews:", *after["problems"], sep="\n")
          print("Final coverage:", after["summary"])
          PY
