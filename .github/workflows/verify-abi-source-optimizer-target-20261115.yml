name: TypeId source optimizer target ABI x86 and AArch64 (compiler #1772)
on:
  push:
    branches: [main]
    paths: ['.github/workflows/verify-abi-source-optimizer-target-20261115.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  x86:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 810d3085a03dc5b4580c61fffcb631771a1f7031
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Verify exact candidate
        run: test "$(git -C compiler rev-parse HEAD)" = 810d3085a03dc5b4580c61fffcb631771a1f7031
      - name: Isolate tested core crates
        run: |
          cat > compiler/Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir", "crates/opt", "crates/backend", "crates/backend-x86", "crates/backend-aarch64"]
          EOF
          rm -f compiler/Cargo.lock
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: abi-source-target-x86
      - name: Install existing native DWARF test oracle
        run: sudo apt-get update -qq && sudo apt-get install -y -qq gdb
      - name: Targeted x86 C ABI oracles, source optimizer, and shared IR/backend
        working-directory: compiler
        run: |
          set -euo pipefail
          cargo test -p compiler-backend-x86 --lib
          # Run affected TypeId GP-ABI and native execution oracles. The
          # unrelated full x86 ISA golden suite expects stale CMP32/CMP64
          # shapes on this source base; it is tracked separately.
          cargo test -p compiler-backend-x86 --test native_typeid_indirect_gp_varargs
          cargo test -p compiler-backend-x86 --test review_unused_external_abi
          cargo test -p compiler-backend-x86 --test native_typeid_function_signatures -- \
            --skip typed_indirect_callee_provenance_rejects_mismatch_and_forgery
          cargo test -p compiler-backend -p compiler-ir
          cargo test -p compiler-opt --lib
          cargo test -p compiler-opt --test typeid_target_gp_abi
          cargo test -p compiler-opt --test typed_core_inline_integration
          cargo test -p compiler-opt --test typed_inline_cfg_native
          # Ensure every optimizer integration test/example still compiles
          # after adding the ABI field to TypeIdSourceOptions.
          cargo check -p compiler-opt --all-targets
      - name: Strict x86 backend library Clippy (unrelated generated baseline exceptions)
        working-directory: compiler
        run: |
          cargo clippy -p compiler-backend-x86 --lib -- \
            -D warnings \
            -A private_interfaces \
            -A clippy::suspicious_assignment_formatting \
            -A unused_variables \
            -A clippy::too_many_arguments
  aarch64:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 810d3085a03dc5b4580c61fffcb631771a1f7031
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Verify exact candidate and native ARM host
        run: |
          test "$(git -C compiler rev-parse HEAD)" = 810d3085a03dc5b4580c61fffcb631771a1f7031
          test "$(uname -m)" = aarch64
          command -v cc
          command -v objcopy
      - name: Isolate tested core crates
        run: |
          cat > compiler/Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir", "crates/opt", "crates/backend", "crates/backend-x86", "crates/backend-aarch64"]
          EOF
          rm -f compiler/Cargo.lock
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: abi-source-target-arm64
      - name: Native AArch64 ABI, frame, ELF/GAS and QEMU oracle regression tests
        working-directory: compiler
        run: |
          set -euo pipefail
          cargo test -p compiler-backend-aarch64 --all-targets -- --test-threads=1
          cargo test -p compiler-backend --lib
          cargo test -p compiler-opt --lib
          cargo test -p compiler-opt --test typeid_target_gp_abi
      - name: AArch64 backend Clippy
        working-directory: compiler
        run: cargo clippy -p compiler-backend-aarch64 --lib -- -D warnings

  arm-driver:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - name: Configure SSH for pinned Oberon and Mini-C frontends
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.CI_KEY }}
      - name: Trust the GitHub SSH host
        run: ssh-keyscan github.com >> ~/.ssh/known_hosts
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 810d3085a03dc5b4580c61fffcb631771a1f7031
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Require exact driver source and native ARM host
        run: |
          test "$(git -C compiler rev-parse HEAD)" = 810d3085a03dc5b4580c61fffcb631771a1f7031
          test "$(uname -m)" = aarch64
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: abi-source-target-driver-arm64
      - name: Build real Oberon and Mini-C compiler driver
        working-directory: compiler
        # Baseline x86 generated recipe has a pub(crate) static with a private
        # recipe type in unrelated binary.rs. Do not alter compiler source or
        # weaken any other warnings: only this existing visibility lint is waived.
        run: RUSTFLAGS="-D warnings -A private_interfaces" cargo build -p compiler --bin compiler
      - name: Execute source-to-AArch64 ELF and independently linked C oracles
        working-directory: compiler
        run: |
          COMPILER_DRIVER="$PWD/target/debug/compiler" bash tests/aarch64_driver_integration.sh
      - name: Compile all real compiler driver test targets
        working-directory: compiler
        # Existing unrelated generated x86 visibility warning is waived,
        # not any type errors caused by the new TypeIdSourceOptions field.
        run: RUSTFLAGS="-A private_interfaces" cargo check -p compiler --all-targets

  baseline-x86-flags:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: fd4cbd3e79ff30047287933242697a3204741045
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Verify unmodified compiler base SHA
        run: test "$(git -C compiler rev-parse HEAD)" = fd4cbd3e79ff30047287933242697a3204741045
      - name: Isolate untouched IR/optimizer/backend/x86 sources
        run: |
          cat > compiler/Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir", "crates/opt", "crates/backend", "crates/backend-x86"]
          EOF
          rm -f compiler/Cargo.lock
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: abi-source-target-base-x86-flags-20261115
      - name: Prove existing x86 flags liveness failure on pristine base
        working-directory: compiler
        shell: bash
        run: |
          set -euo pipefail
          if cargo test -p compiler-backend-x86 --test t5_x86_flags_liveness \
              flags_survive_intervening_64_bit_arithmetic -- --exact --nocapture \
              > /tmp/x86-base-flags.log 2>&1; then
            cat /tmp/x86-base-flags.log
            echo "Base unexpectedly passed: do not waive candidate test"
            exit 1
          fi
          if ! grep -Fq 'late native CMP64 missing' /tmp/x86-base-flags.log; then
            cat /tmp/x86-base-flags.log
            echo "Base failure is different: do not waive candidate test"
            exit 1
          fi
          echo "Pristine base reproduces pre-existing x86 flags liveness assertion."
