# Real driver ELF LTO cache cold/warm and corruption smoke on exact PR source.
name: LTO PR2975 cache CLI e2e
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/lto-pr2975-cache-e2e-20261123.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cache-e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      SOURCE_SHA: 5ef5c97a3b5ed5ca6a905362b5469bc41353b265
      CARGO_INCREMENTAL: '0'
      CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
    steps:
      - name: Checkout exact compiler source
        uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: ${{ env.SOURCE_SHA }}
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Verify exact commit
        shell: bash
        run: test "$(git -C compiler rev-parse HEAD)" = "$SOURCE_SHA"
      - name: Make private frontend dependencies available
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.CI_KEY }}
      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: lto-pr2975-cache-cli-e2e
      - name: Real ELF cold warm corruption invalidation and native execution
        working-directory: compiler
        shell: bash
        run: |
          set -euo pipefail
          cargo test -p compiler --test lto_cli lto_cli_cache_cold_warm_corrupt_and_option_invalidation -- --nocapture
          cargo test -p compiler --test lto_cli lto_cli_emits_executable_and_preserves_output_on_invalid_inputs -- --nocapture
      - name: Check full driver
        working-directory: compiler
        run: cargo check -p compiler --bin compiler
