name: X7 scalar proof contract regression
on:
  pull_request:
    paths: ['.github/workflows/verify-x7-scalar-contract.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 9a2e8dd5a7ce61435c0c7d95caf8bb29c12069f2
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Check exact source and install pinned solver
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 9a2e8dd5a7ce61435c0c7d95caf8bb29c12069f2
          python3 -m venv /tmp/x7-z3
          /tmp/x7-z3/bin/python -m pip install --disable-pip-version-check 'z3-solver==4.13.4.0'
      - name: Check shared scalar contract, independent proofs and mutation controls
        run: |
          set -euo pipefail
          export PATH=/tmp/x7-z3/bin:$PATH
          if ! command -v z3; then sudo apt-get update -qq && sudo apt-get install -y z3; fi
          for suite in test_x7_ip2_physical_receipt_join.py test_x86_isl_b3_record_worker.py test_x86_isl_operation_model_census.py test_x86_isl_operation_proof_worker.py test_x7_ip2_ir_equivalence.py test_x86_isl_smt_verify.py test_x86_isl_record_effects_smt.py; do
            python -m unittest discover -s tools -p "$suite" -v
          done
