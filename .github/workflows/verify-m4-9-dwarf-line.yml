# Temporary source-pinned M4.9 provenance acceptance for compiler PR #3452.
# This workflow change is intended for an isolated compiler-ci PR, not main.
name: M4.9 source-origin scaling and DWARF acceptance
on:
  pull_request:
    paths: ['.github/workflows/verify-m4-9-dwarf-line.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  origin-and-dwarf:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      SOURCE_SHA: f4d97e0e65d46e644f4eb4fe2b3473f568338229
      CARGO_INCREMENTAL: '0'
    steps:
      - name: Checkout exact compiler candidate
        uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: ${{ env.SOURCE_SHA }}
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Verify exact source and isolate core workspace
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git -C compiler rev-parse HEAD)"
          test "$actual" = "$SOURCE_SHA"
          echo "Compiler source SHA: $actual" >> "$GITHUB_STEP_SUMMARY"
          cat > compiler/Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir", "crates/opt", "crates/backend", "crates/backend-x86"]
          EOF
          rm -f compiler/Cargo.lock
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: m49-provenance-pr3452
      - name: Checked IR source-origin scaling and native IR tests
        working-directory: compiler
        shell: bash
        run: |
          set -euo pipefail
          cargo test -p compiler-ir --test source_origin_scaling -- --nocapture
          cargo test -p compiler-ir --lib
      - name: ELF/DWARF independent host link and ambiguous origin checks
        working-directory: compiler
        run: cargo test -p compiler-backend --test x86_dwarf_line_native -- --nocapture
      - name: Checked direct and scalar x86 selected-origin tests
        working-directory: compiler
        run: cargo test -p compiler-backend-x86 --lib origin -- --nocapture
      - name: Strict new-test Clippy
        working-directory: compiler
        shell: bash
        run: |
          set -euo pipefail
          cargo clippy -p compiler-ir --test source_origin_scaling -- -D warnings
          cargo clippy -p compiler-backend --test x86_dwarf_line_native -- -D warnings
