# Temporary source-pinned M4.9 PIC DWARF acceptance. Close unmerged.
name: M4.9 verified source DWARF PIC parity
on:
  pull_request:
    paths: ['.github/workflows/verify-m4-9-dwarf-line.yml']
permissions:
  contents: read
jobs:
  pic-source-dwarf:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      SOURCE_SHA: 2edb003aac913a2cb4509b910a86c83df1affc98
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: ${{ env.SOURCE_SHA }}
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Verify exact source and isolate backend workspace
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C compiler rev-parse HEAD)" = "$SOURCE_SHA"
          echo "Compiler SHA: $SOURCE_SHA" >> "$GITHUB_STEP_SUMMARY"
          cat > compiler/Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir", "crates/opt", "crates/backend", "crates/backend-x86"]
          EOF
          rm -f compiler/Cargo.lock
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: m49-pic-dwarf-pr3814
      - name: PIC verified DWARF and full TypeId source line regression
        working-directory: compiler
        shell: bash
        run: |
          set -euo pipefail
          cargo test -p compiler-backend-x86 --lib typeid_dwarf -- --nocapture
          cargo test -p compiler-backend --test x86_dwarf_line_native -- --nocapture
      - name: Source selected-to-physical origin parity
        working-directory: compiler
        run: cargo test -p compiler-backend-x86 --lib physical_origin_handoff -- --nocapture
      - name: Focused warning-as-error Clippy except unrelated baseline lints
        working-directory: compiler
        run: cargo clippy -p compiler-backend-x86 --lib -- -D warnings -A clippy::too_many_arguments -A dead_code
