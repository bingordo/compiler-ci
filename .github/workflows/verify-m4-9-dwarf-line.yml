# Temporary source-pinned native DWARF source + global data acceptance; do not merge.
name: M4.9 source DWARF with module globals
on:
  pull_request:
    paths: ['.github/workflows/verify-m4-9-dwarf-line.yml']
permissions:
  contents: read
jobs:
  source-data:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      SOURCE_SHA: 3468361fe8ddb34783e87159a476b915aa0aee9a
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: ${{ env.SOURCE_SHA }}
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Verify exact candidate and isolate backend workspace
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C compiler rev-parse HEAD)" = "$SOURCE_SHA"
          echo "Compiler SHA: $SOURCE_SHA" >> "$GITHUB_STEP_SUMMARY"
          cat > compiler/Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir", "crates/opt", "crates/backend", "crates/backend-x86"]
          EOF
          rm -f compiler/Cargo.lock
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: m49-source-data-dwarf-3812
      - name: Checked native TypeId source DWARF and data sections
        working-directory: compiler
        shell: bash
        run: |
          set -euo pipefail
          cargo test -p compiler-backend-x86 --lib typeid_dwarf -- --nocapture
          cargo test -p compiler-backend --test x86_dwarf_line_native -- --nocapture
      - name: Selected-to-physical origin checks
        working-directory: compiler
        run: cargo test -p compiler-backend-x86 --lib physical_origin_handoff -- --nocapture
      - name: Focused strict Clippy excluding previously diagnosed baseline lints
        working-directory: compiler
        run: cargo clippy -p compiler-backend-x86 --lib -- -D warnings -A clippy::too_many_arguments -A dead_code
