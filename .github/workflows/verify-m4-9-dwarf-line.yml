# Temporary source-pinned DWARF no-byte physical operation oracle; do not merge.
name: M4.9 zero-byte DWARF offset source acceptance
on:
  pull_request:
    paths: ['.github/workflows/verify-m4-9-dwarf-line.yml']
permissions:
  contents: read
jobs:
  zero-byte-offsets:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      SOURCE_SHA: 162db7ef83d9ca70a5353fad7f1311f492b46399
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: ${{ env.SOURCE_SHA }}
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Verify source and isolate core workspace
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C compiler rev-parse HEAD)" = "$SOURCE_SHA"
          echo "Compiler SHA: $SOURCE_SHA" >> "$GITHUB_STEP_SUMMARY"
          cat > compiler/Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir", "crates/opt", "crates/backend", "crates/backend-x86"]
          EOF
          rm -f compiler/Cargo.lock
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: m49-zero-byte-dwarf-3800
      - name: Zero-byte signal fence checked offsets
        working-directory: compiler
        run: cargo test -p compiler-backend-x86 --lib zero_byte_signal_fence_has_no_dwarf_instruction_offset -- --nocapture
      - name: Checked x86 provenance and DWARF linked ELF
        working-directory: compiler
        shell: bash
        run: |
          set -euo pipefail
          cargo test -p compiler-backend-x86 --lib physical_origin_handoff -- --nocapture
          cargo test -p compiler-backend --test x86_dwarf_line_native -- --nocapture
      - name: Strict backend Clippy excluding diagnosed pre-existing warnings
        working-directory: compiler
        run: cargo clippy -p compiler-backend-x86 --lib -- -D warnings -A clippy::too_many_arguments -A dead_code
