# Temporary source-pinned ELF final-offset acceptance for compiler PR #3798.
name: M4.9 physical-offset multi-function parity
on:
  pull_request:
    paths: ['.github/workflows/verify-m4-9-dwarf-line.yml']
permissions:
  contents: read
jobs:
  elf-offsets:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      SOURCE_SHA: c699ac24f49d4020e1a131922cd694b9082889ec
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: ${{ env.SOURCE_SHA }}
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Verify source and isolate existing backend workspace
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C compiler rev-parse HEAD)" = "$SOURCE_SHA"
          echo "Compiler SHA: $SOURCE_SHA" >> "$GITHUB_STEP_SUMMARY"
          cat > compiler/Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir", "crates/opt", "crates/backend", "crates/backend-x86"]
          EOF
          rm -f compiler/Cargo.lock
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: m49-physical-offset-3798
      - name: Final physical offsets and ELF byte parity
        working-directory: compiler
        run: cargo test -p compiler-backend-x86 --lib physical_offsets_scale_across_many_function_symbols_without_changing_elf -- --nocapture
      - name: Existing selected-to-physical provenance and DWARF
        working-directory: compiler
        shell: bash
        run: |
          set -euo pipefail
          cargo test -p compiler-backend-x86 --lib physical_origin_handoff -- --nocapture
          cargo test -p compiler-backend --test x86_dwarf_line_native -- --nocapture
      - name: Strict Clippy on changed native backend
        working-directory: compiler
        # Current main has two unrelated Clippy 1.100 eight-argument switch helpers.
        # Preserve all other warning-as-error checks; do not edit that workstream here.
        run: cargo clippy -p compiler-backend-x86 --lib -- -D warnings -A clippy::too_many_arguments
