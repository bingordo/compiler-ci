name: Temporary native Mini-C C99 VLA parameters 3585
on:
  pull_request:
    paths: ['.github/workflows/temp-mini-c-native-vla-parameters-3585.yml']
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 3ebfe55f2ede974c48cf879d74e1a126aad80aff
          fetch-depth: 0
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.CI_KEY }}
      - name: Integrate tested candidate with current main
        run: |
          set -euo pipefail
          git fetch --no-tags origin b9a315ec8aec82ad2a82945103b4c49e358d052f
          git -c user.name=CI -c user.email=ci@example.invalid merge --no-commit --no-ff FETCH_HEAD
          git write-tree
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            tools/mini-c-driver/target/debug
          key: mini-c-typeid-vla-parameters-3585
          restore-keys: |
            mini-c-typeid-vla-typedefs-3583
            mini-c-typeid-c99-integration-3575
            mini-c-typeid-static-literals-3524
            mini-c-typeid-static-storage-3522
            mini-c-typeid-
      - run: cargo test --manifest-path tools/mini-c-driver/Cargo.toml --lib global_data
      - run: cargo test --manifest-path tools/mini-c-driver/Cargo.toml --test c99_block_static --test c99_static_literal_roots --test c99_funcname --test c99_saved_vla_strides --test record_array_storage --test c99_vla_typedefs --test c99_vla_parameters
      - run: cargo build --manifest-path tools/mini-c-driver/Cargo.toml
      - name: GCC differential runtime for ELF and GAS
        shell: bash
        run: |
          set -euo pipefail
          for src in tools/mini-c-driver/tests/fixtures/c99_{block_static,static_literal_roots,funcname,saved_vla_strides,vla_typedefs,vla_parameters}.c; do
          driver=tools/mini-c-driver/target/debug/compiler-mini-c
          gcc -std=c99 -pedantic-errors "$src" -o "$RUNNER_TEMP/oracle"
          "$RUNNER_TEMP/oracle"
          "$driver" "$src" -o "$RUNNER_TEMP/native.o"
          gcc "$RUNNER_TEMP/native.o" -o "$RUNNER_TEMP/native"
          "$RUNNER_TEMP/native"
          "$driver" "$src" --emit asm -o "$RUNNER_TEMP/native.s"
          gcc "$RUNNER_TEMP/native.s" -o "$RUNNER_TEMP/native-gas"
          "$RUNNER_TEMP/native-gas"
          readelf -r "$RUNNER_TEMP/native.o"
          done
