name: LTO private symbol scoping verification
on:
  push:
    branches: [verify/lto-private-symbol-scope-20261114]
    paths: ['.github/workflows/lto-private-symbol-scope-20261114.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  private-symbols:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 3eebfc66b6437f94bbdffb36c12909b23c78a30c
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Assert pinned source
        run: test "$(git -C compiler rev-parse HEAD)" = "3eebfc66b6437f94bbdffb36c12909b23c78a30c"
      - name: Focus IR crate
        run: |
          cat > compiler/Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir"]
          EOF
          rm -f compiler/Cargo.lock
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: lto-private-symbol-scope
      - name: Focused scoping and full IR test, strict lint
        working-directory: compiler
        run: |
          cargo test -p compiler-ir --test lto_private_symbols
          cargo test -p compiler-ir
          cargo clippy -p compiler-ir --tests -- -D warnings
