name: Source-pin reviewed operand latencies for X7
on:
  pull_request:
    paths:
      - '.github/workflows/x7-produce-latency-20261121.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact-operand-latencies:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 1dcba9c17734b9a8f91e4a3935ce4559b79e1b6a
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Validate exact pinned candidate
        run: test "$(git -C compiler rev-parse HEAD)" = "1dcba9c17734b9a8f91e4a3935ce4559b79e1b6a"
      - name: Download exact previously reviewed upstream XML
        run: |
          set -euo pipefail
          curl -fL --retry 2 --max-time 600 https://uops.info/instructions.xml -o instructions.xml
          test "$(sha256sum instructions.xml | cut -d' ' -f1)" = "e5e702caaf04c4fc1f75192a9bbe4d8554b3e174f7933a14d124cc33ca677ab3"
      - name: Produce only exact source-verified operand-pair latency data
        working-directory: compiler
        run: |
          set -euo pipefail
          python3 tools/regen_x86_operand_latencies.py --xml ../instructions.xml --write
          python3 - <<'PY'
          from pathlib import Path
          for name,path in [
            ("GENJSON","data/x86_operand_latencies.json"),
            ("GENRUST","crates/backend-x86/src/generated_operand_latencies.rs")
          ]:
              for line in Path(path).read_text().splitlines():
                  print(name+":"+line,flush=True)
          PY
