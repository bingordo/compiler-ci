name: One-off typed global-memory PR379 check
on:
  pull_request:
    paths:
      - '.github/workflows/review-typed-global-memory-pr379.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 70470e4ae01850d8e9dee44ad5d727471cc154bc
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Verify exact source
        run: test "$(git -C compiler rev-parse HEAD)" = "70470e4ae01850d8e9dee44ad5d727471cc154bc"
      - name: Use self-contained core Cargo workspace
        run: |
          cat > compiler/Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir", "crates/opt", "crates/backend", "crates/backend-x86"]
          EOF
          rm -f compiler/Cargo.lock
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: review-typed-global-memory-pr379
      - name: Test TypeId inter-block memory regression
        working-directory: compiler
        run: cargo test -p compiler-opt --test typed_global_memory -- --nocapture
      - name: Run IR and optimizer crate tests
        working-directory: compiler
        run: cargo test -p compiler-ir -p compiler-opt
      - name: Strict IR and optimizer Clippy
        working-directory: compiler
        run: cargo clippy -p compiler-ir -p compiler-opt --all-targets -- -D warnings
