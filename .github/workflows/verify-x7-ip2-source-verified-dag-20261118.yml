name: X7 IP2 source-SMT-verified IR witness DAG
on:
  pull_request:
    paths: ['.github/workflows/verify-x7-ip2-source-verified-dag-20261118.yml']
permissions:
  contents: read
jobs:
  source-verified-dag:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 1a86d550e6ed5b319cbd2d6a10b396e6201040ed
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Install packaged Z3 bindings
        run: |
          set -euo pipefail
          sudo apt-get install -y z3 python3-z3
          /usr/bin/python3 -c 'import z3; print(z3.get_version_string())'
      - name: Exact-source helper/IR SMT witness DAG and regression tests
        working-directory: compiler
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "1a86d550e6ed5b319cbd2d6a10b396e6201040ed"
          python3 -m py_compile tools/x7_ip2_source_verified_dag.py tools/test_x7_ip2_source_verified_dag.py
          PYTHONPATH=/usr/lib/python3/dist-packages:tools /usr/bin/python3 -m unittest -v test_x7_ip2_source_verified_dag test_x7_ip2_helper_source_smt test_x7_ip2_original_source_graph test_x7_ip2_pure_dag_candidates test_x7_ip2_ir_equivalence
          echo X7_IP2_SOURCE_VERIFIED_WITNESS_DAG_PASS
