# Exact-source, temporary compiler-ci validation for canonical v2 LTO envelopes.
name: IR PR3015 canonical-v2 LTO envelopes
on:
  push:
    branches: [validate/ir-pr3015-lto-v2-20261123]
    paths:
      - '.github/workflows/ir-pr3015-lto-v2-20261123.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  codec:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      SOURCE_SHA: 24f69b2f4b68f25d7920085a1a3e01be4b6f6d2a
      CARGO_INCREMENTAL: '0'
      CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
    steps:
      - name: Checkout exact compiler PR head
        uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: ${{ env.SOURCE_SHA }}
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Verify pinned SHA and isolate core
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C compiler rev-parse HEAD)" = "$SOURCE_SHA"
          cat > compiler/Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir", "crates/opt", "crates/backend", "crates/backend-x86", "crates/backend-aarch64"]
          EOF
          rm -f compiler/Cargo.lock
      - name: Cache isolated core Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: ir-pr3015-lto-v2
      - name: Verify canonical envelopes, earlier versions and multiunit graph fusion
        working-directory: compiler
        run: |
          set -euo pipefail
          cargo test -p compiler-ir --test lto_canonical_binary_v2 -- --nocapture
          cargo test -p compiler-ir --test lto_target_envelope -- --nocapture
          cargo test -p compiler-ir --test lto_envelope_merge -- --nocapture
          cargo test -p compiler-ir --test native_binary_v2 -- --nocapture
          cargo test -p compiler-ir --test native_binary_v1 -- --nocapture
          cargo test -p compiler-ir --test lto_merge -- --nocapture
      - name: Focused strict Clippy
        working-directory: compiler
        run: |
          set -euo pipefail
          cargo clippy -p compiler-ir --test lto_canonical_binary_v2 --test lto_target_envelope -- -D clippy::all -A clippy::empty_line_after_doc_comments -A clippy::collapsible_if
