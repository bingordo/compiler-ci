name: X7 IP15 automatically discovered DAG native physical A B
on:
  pull_request:
    paths:
      - '.github/workflows/x7-ip15-native-physical-source-ab-20261125.yml'
permissions:
  contents: read
jobs:
  ip15-native-physical:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: d26544c863b964e7c7827fc5d58db30ce3c4d77d
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Exact compiler pin, GNU binutils, GCC and Rust
        run: |
          set -euo pipefail
          test "$(git -C compiler rev-parse HEAD)" = d26544c863b964e7c7827fc5d58db30ce3c4d77d
          git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
          git config --global --add url."https://github.com/".insteadOf "git@github.com:"
          rustc --version
          as --version | head -1
          cc --version | head -1
      - name: Real encoded ELF GAS GCC C11 A B 10 rules x 2 frame policies
        working-directory: compiler
        run: |
          set -euo pipefail
          cargo test -p compiler-backend-x86 --lib --features x7-ip14-auto-dag-probe ip15_real_encoded_elf_gas_and_gcc_ab_covers_every_auto_discovered_rule -- --nocapture 2>&1 | tee /tmp/x7-ip15-physical.log
          grep 'X7_IP15_PHYSICAL_AB_SUMMARY' /tmp/x7-ip15-physical.log | tee -a "$GITHUB_STEP_SUMMARY"
          grep -c 'X7_IP15_PHYSICAL_AB rule=' /tmp/x7-ip15-physical.log | grep -x 20
          echo 'IP15 physical 20 matrix cases have actual ELF/GAS and GCC vector comparison' >> "$GITHUB_STEP_SUMMARY"
      - name: Auto-derived source pins and full certificate reproducibility
        working-directory: compiler
        run: |
          set -euo pipefail
          if ! command -v z3 >/dev/null; then sudo apt-get update -qq; sudo apt-get install -y z3; fi
          python3 tools/x7_ip13_auto_discover_dags.py --check
          python3 tools/x7_ip14_auto_dag_rules.py --check
          git diff --exit-code
      - name: Existing optimized checked Mini-C and Oberon physical census under IP14
        working-directory: compiler
        run: |
          set -euo pipefail
          cargo test -p compiler --bin compiler --features 'x7-ip7-workload-profile x7-ip15-workload-auto' x7_ip7_real_source_shapes::ip10g_physical_source_profile -- --nocapture 2>&1 | tee /tmp/x7-ip15-source.log
          grep 'X7_IP10G_SUMMARY ' /tmp/x7-ip15-source.log | tee -a "$GITHUB_STEP_SUMMARY"
          grep 'X7_IP15_SOURCE_STAGE ' /tmp/x7-ip15-source.log | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Default/opt-in production backend and driver unaffected
        working-directory: compiler
        run: |
          set -euo pipefail
          cargo check -p compiler-backend-x86
          cargo check -p compiler-backend-x86 --features x7-production-generated-logic
          cargo check -p compiler --bin compiler
