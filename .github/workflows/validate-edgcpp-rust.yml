name: EDG Rust CFG audit validation

on:
  # Validate the compiler-ci PR itself, without consuming source-repo minutes.
  push:
    branches: ['validate-edg-*']
    paths: ['.github/workflows/validate-edgcpp-rust.yml']
  pull_request:
    branches: [main]
    paths: ['.github/workflows/validate-edgcpp-rust.yml']
  workflow_dispatch:
    inputs:
      source_ref:
        description: 'bingordo/edgcpp-rust branch, tag, or commit SHA'
        required: false
        default: cranelift-codegen
        type: string

permissions:
  contents: read

concurrency:
  group: edg-cfg-validation-${{ github.ref }}-${{ inputs.source_ref || 'pr86' }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    container:
      # Reuse the same pinned EDG CI environment as edg-yarpgen.yml.
      image: ghcr.io/edgcpp/ci-runner@sha256:14b3948c2ce12cfa5472e5a6c468393d15426f3a67685cc35d830ea5db2acdf8
    defaults:
      run:
        shell: edg-container-exec "bash -eo pipefail {0}"
    env:
      EDG_SOURCE_SHA: 799603e0b5ab272d9418e2d44a53a95bc73dfdc4
      EDG_RELEASE_TAG: edgcpfe-ci-799603e0b5ab
      EDG_RELEASE_SHA256: fa769825e70766fbefe017806816b2338acd03daa93bb5562369c293972ce64c
      RUST_TOOLCHAIN_VERSION: 1.99.1
      CARGO_PROFILE_DEV_DEBUG: '0'
      EDGCPP_SOURCE_DIR: ${{ github.workspace }}/edgcpp
      EDGCPP_COMPILE_COMMANDS: ${{ github.workspace }}/edgcpp/build/gcc-release/compile_commands.json
      EDGCPP_LIB_DIR: ${{ github.workspace }}/edgcpp/build/gcc-release/lib
      EDGCPP_EDG_REVISION: 799603e0b5ab272d9418e2d44a53a95bc73dfdc4
    steps:
      - name: Check out exact EDG Rust revision (pinned on compiler-ci PR/push)
        uses: actions/checkout@v4
        with:
          repository: bingordo/edgcpp-rust
          ref: ${{ inputs.source_ref || '5370dddd177b5feb03bfcaa68166bcf3bfc475e3' }}
          path: edgcpp-rust
          persist-credentials: false
      - name: Record exact revision
        working-directory: edgcpp-rust
        run: |
          set -euo pipefail
          sha=$(git rev-parse HEAD)
          test "${#sha}" -eq 40
          echo "EDG Rust commit: $sha" | tee -a "$GITHUB_STEP_SUMMARY"
          if [[ "${{ github.event_name }}" != workflow_dispatch ]]; then
            test "$sha" = 5370dddd177b5feb03bfcaa68166bcf3bfc475e3
          fi
      - name: Check out source headers matching the pinned EDG library
        uses: actions/checkout@v4
        with:
          repository: bingundu/edgcpp
          ref: 799603e0b5ab272d9418e2d44a53a95bc73dfdc4
          path: edgcpp
          persist-credentials: false
      - name: Configure EDG bridge metadata without rebuilding full EDG
        working-directory: edgcpp
        env:
          EDG_BASE: ${{ github.workspace }}/edgcpp/bases/docker/dev-env/gcc
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EDG_SOURCE_SHA"
          cmake --preset linux-gcc-release \
            -DEDG_BUILD_LIB=OFF -DEDG_BUILD_CALLABLE_LIBRARY=ON \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
          cmake --build build/gcc-release --target error-info --parallel 2
          test -s build/gcc-release/src/includes/err_codes.h
          test -s build/gcc-release/src/includes/err_data.h
      - name: Download and verify pinned prebuilt EDG archive
        working-directory: edgcpp
        run: |
          set -euo pipefail
          mkdir -p build/gcc-release/lib build/prebuilt-edg
          curl --fail --location --silent --show-error --retry 4 --retry-delay 2 \
            "https://github.com/bingundu/edgcpp/releases/download/$EDG_RELEASE_TAG/edgcpfe-ci-x86_64-callable-release-linux-x86_64.tar.gz" \
            -o build/prebuilt-edg/archive.tar.gz
          printf '%s  %s\n' "$EDG_RELEASE_SHA256" build/prebuilt-edg/archive.tar.gz | sha256sum -c -
          tar -xzf build/prebuilt-edg/archive.tar.gz -C build/prebuilt-edg
          grep -Fx "commit=$EDG_SOURCE_SHA" build/prebuilt-edg/BUILD-INFO.txt
          grep -Fx 'platform=linux-x86_64' build/prebuilt-edg/BUILD-INFO.txt
          test -s build/prebuilt-edg/lib/libedgcpfe.a
          cp build/prebuilt-edg/lib/libedgcpfe.a build/gcc-release/lib/libedgcpfe.a
      - name: Install pinned Rust toolchain
        run: |
          set -euo pipefail
          if ! command -v cargo >/dev/null; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | \
              sh -s -- -y --profile minimal --default-toolchain "$RUST_TOOLCHAIN_VERSION"
          fi
          export PATH="$HOME/.cargo/bin:$PATH"
          rustup toolchain install "$RUST_TOOLCHAIN_VERSION" --profile minimal
          rustup default "$RUST_TOOLCHAIN_VERSION"
      - name: Restore Rust build cache
        uses: actions/cache/restore@v4
        id: rust-cache
        with:
          path: |
            edgcpp-rust/target
            ~/.cargo/registry
            ~/.cargo/git
          key: edg-atomic-v1-${{ hashFiles('edgcpp-rust/Cargo.lock', 'edgcpp-rust/build.rs') }}-${{ github.sha }}
          restore-keys: |
            rust-edgcpp-cranelift-v1-
      - name: Run focused pointer call compatibility audit tests
        working-directory: edgcpp-rust
        run: |
          set -euo pipefail
          export PATH="$HOME/.cargo/bin:$PATH"
          timeout --signal=TERM --kill-after=10s 20m \
            cargo test --features codegen --lib audit_call_argument_shape_tests -- --nocapture \
            2>&1 | tee "$RUNNER_TEMP/edg-cfg-targeted.log"
          # A filtered-out zero-test run is not a successful targeted gate.
          grep -Eq 'test result: ok[.] [1-9][0-9]* passed; 0 failed' "$RUNNER_TEMP/edg-cfg-targeted.log"
      - name: Verify EDG lifetime ownership cardinalities and wire schema
        working-directory: edgcpp-rust
        run: |
          set -euo pipefail
          export PATH="$HOME/.cargo/bin:$PATH"
          python3 tools/gen_wire_schema.py --check
          cargo test --features codegen --lib native_lifetime_owners_reject_missing_roots_scope_links_and_tail_scopes -- --nocapture
          cargo test --features codegen --lib lifetime_child_counts_reject_dropped_subtrees_and_mismatched_owners -- --nocapture

      - name: Validate ordered EDG startup wire records
        working-directory: edgcpp-rust
        run: |
          set -euo pipefail
          export PATH="$HOME/.cargo/bin:$PATH"
          cargo test --features codegen --lib file_scope_init_schedule_wire_tests -- --nocapture
          python3 tools/gen_wire_schema.py --check
      - name: Probe original C++ global constructor startup schedule
        working-directory: edgcpp
        run: |
          set -euo pipefail
          export PATH="$HOME/.cargo/bin:$PATH"
          source build/gcc-release/environment.sh
          cat >build/gcc-release/global-init-probe.cpp <<'CPP'
          struct Effectful {
            int value;
            explicit Effectful(int x) : value(x) {}
            ~Effectful() { value = 0; }
          };
          Effectful global_effect(7);
          int main() { return 0; }
          CPP
          cd build/gcc-release
          version="$(g++ -dumpfullversion -dumpversion)"
          IFS=. read -r major minor patch <<<"$version"
          gnu_number=$((10#${major}*10000+10#${minor:-0}*100+10#${patch:-0}))
          cargo run --quiet --manifest-path "$GITHUB_WORKSPACE/edgcpp-rust/Cargo.toml" \
            --example parse -- --g++ --c++17 --no_strict_gnu --gnu_version "$gnu_number" \
            global-init-probe.cpp >"$RUNNER_TEMP/edg-init-probe.log" 2>&1
          grep -F 'file scope init scheduler available=' "$RUNNER_TEMP/edg-init-probe.log"
          grep -F 'scope dynamic init entries=' "$RUNNER_TEMP/edg-init-probe.log"
          # Source-owned generated-routine classification (not name-only proof).
          grep -F 'routine attributes name=__sti__' "$RUNNER_TEMP/edg-init-probe.log" | head -n 30
          grep -Eq 'routine attributes name=__sti__[^ ]+ .*generated=true defined=true' "$RUNNER_TEMP/edg-init-probe.log"
          grep -F 'scope dynamic init scope=' "$RUNNER_TEMP/edg-init-probe.log" || true
          grep -F 'file scope init root position=' "$RUNNER_TEMP/edg-init-probe.log" || true
      - name: Probe EDG direct base offsets for C++17 std::cout and multiple inheritance
        working-directory: edgcpp
        run: |
          set -euo pipefail
          export PATH="$HOME/.cargo/bin:$PATH"
          source build/gcc-release/environment.sh
          cat >build/gcc-release/base-offset-probe.cpp <<'CPP'
          struct A { int a; };
          struct B { int b; };
          struct Derived : A, B { int c; };
          int main() { Derived d{}; return d.b; }
          CPP
          cat >build/gcc-release/cout-base-offset.cpp <<'CPP'
          #include <iostream>
          int main() { std::cout << "Hello, world!"; }
          CPP
          cd build/gcc-release
          version="$(g++ -dumpfullversion -dumpversion)"
          IFS=. read -r major minor patch <<<"$version"
          gnu_number=$((10#${major}*10000+10#${minor:-0}*100+10#${patch:-0}))
          args=(--g++ --c++17 --no_strict_gnu --gnu_version "$gnu_number")
          cargo run --quiet --manifest-path "$GITHUB_WORKSPACE/edgcpp-rust/Cargo.toml" --example parse -- "${args[@]}" base-offset-probe.cpp >"$RUNNER_TEMP/base-offset-probe.log" 2>&1
          grep -F 'EDG_BASE_OFFSET derived=' "$RUNNER_TEMP/base-offset-probe.log" | sed -n '1,20p'
          g++ -std=c++17 -v -E -x c++ /dev/null >"$RUNNER_TEMP/cout-include-search.log" 2>&1
          mapfile -t include_dirs < <(awk '/#include <\.\.\.> search starts here:/{active=1;next} /^End of search list/{active=0} active && /^ /{sub(/^[[:space:]]+/,"");print}' "$RUNNER_TEMP/cout-include-search.log")
          test "${#include_dirs[@]}" -ge 3
          include_flags=()
          for dir in "${include_dirs[@]}"; do test -d "$dir" && include_flags+=("-I$dir"); done
          cargo run --quiet --manifest-path "$GITHUB_WORKSPACE/edgcpp-rust/Cargo.toml" --example parse -- "${args[@]}" "${include_flags[@]}" cout-base-offset.cpp >"$RUNNER_TEMP/cout-base-offset.log" 2>&1
          grep -F 'EDG_BASE_OFFSET derived=' "$RUNNER_TEMP/cout-base-offset.log" | sed -n '1,35p'
          # Exact original cout call-chain base identified by compiler-ci
          # C++5 TypeId source admission, not from guessed class names.
          grep -Fq 'EDG_BASE_OFFSET derived=118 base=119 position=0 virtual=false offset=Some(0)' "$RUNNER_TEMP/cout-base-offset.log"
          grep -Fq 'EDG_BASE_OFFSET derived=115 base=118 position=0 virtual=true offset=None' "$RUNNER_TEMP/cout-base-offset.log"
          echo 'Original std::cout inheritance base offset snapshot captured' >> "$GITHUB_STEP_SUMMARY"
      - name: Verify C11 and C++20 source lifetime ownership against pinned EDG and GCC
        working-directory: edgcpp
        run: |
          set -euo pipefail
          export PATH="$HOME/.cargo/bin:$PATH"
          source build/gcc-release/environment.sh
          cat >build/gcc-release/lifetime-owner-c11.c <<'C'
          int owner_c(int x) {
            int result = x;
            { int nested = x + 3; result += nested; }
            if (result > 0) { int last = result + 1; result = last; }
            return result;
          }
          int main(void) { return owner_c(2) != 8; }
          C
          cat >build/gcc-release/lifetime-owner-cpp20.cpp <<'CPP'
          struct Local {
            int value;
            explicit Local(int x) : value(x) {}
            ~Local() { value = 0; }
          };
          int owner_cpp(int x) {
            Local a{x};
            { Local b{x + 1}; if (b.value != x + 1) return 97; }
            return a.value;
          }
          int main() { return owner_cpp(7) != 7; }
          CPP
          cd build/gcc-release
          cargo run --quiet --manifest-path "$GITHUB_WORKSPACE/edgcpp-rust/Cargo.toml" \
            --example parse -- --c11 lifetime-owner-c11.c >"$RUNNER_TEMP/lifetime-c11.log" 2>&1
          cargo run --quiet --manifest-path "$GITHUB_WORKSPACE/edgcpp-rust/Cargo.toml" \
            --example parse -- --c++20 lifetime-owner-cpp20.cpp >"$RUNNER_TEMP/lifetime-cpp20.log" 2>&1
          grep -Fq 'EDG status: 0' "$RUNNER_TEMP/lifetime-c11.log"
          grep -Fq 'EDG status: 0' "$RUNNER_TEMP/lifetime-cpp20.log"
          gcc -std=c11 -O0 -Wall -Wextra -Werror lifetime-owner-c11.c -o "$RUNNER_TEMP/lifetime-c11"
          g++ -std=c++20 -O0 -Wall -Wextra -Werror lifetime-owner-cpp20.cpp -o "$RUNNER_TEMP/lifetime-cpp20"
          "$RUNNER_TEMP/lifetime-c11"
          "$RUNNER_TEMP/lifetime-cpp20"
          echo 'Pinned EDG C11/C++20 owner snapshots and GCC source oracles passed' >> "$GITHUB_STEP_SUMMARY"
      - name: Run all Rust library tests with codegen
        working-directory: edgcpp-rust
        run: |
          set -euo pipefail
          export PATH="$HOME/.cargo/bin:$PATH"
          timeout --signal=TERM --kill-after=10s 20m \
            cargo test --features codegen --lib \
            2>&1 | tee "$RUNNER_TEMP/edg-cfg-library.log"
          grep -Eq 'test result: ok' "$RUNNER_TEMP/edg-cfg-library.log"
      - name: Summarize passing test logs
        if: success()
        run: |
          echo "Atomic regression tests and full codegen library tests passed." >> "$GITHUB_STEP_SUMMARY"
          grep 'test result: ok' "$RUNNER_TEMP/edg-cfg-targeted.log" >> "$GITHUB_STEP_SUMMARY"
          grep 'test result: ok' "$RUNNER_TEMP/edg-cfg-library.log" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload validation logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: edg-atomic-validation-logs
          path: |
            ${{ runner.temp }}/edg-cfg-targeted.log
            ${{ runner.temp }}/edg-cfg-library.log
            ${{ runner.temp }}/edg-init-probe.log
            ${{ runner.temp }}/base-offset-probe.log
            ${{ runner.temp }}/cout-base-offset.log
            ${{ runner.temp }}/cout-include-search.log
            ${{ runner.temp }}/lifetime-c11.log
            ${{ runner.temp }}/lifetime-cpp20.log
          if-no-files-found: ignore
          retention-days: 14
