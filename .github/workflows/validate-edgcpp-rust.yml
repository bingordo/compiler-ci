name: EDG Rust standard back-end integration validation

on:
  # Validate the compiler-ci PR itself, without consuming source-repo minutes.
  push:
    branches: ['validate-edg-*']
    paths: ['.github/workflows/validate-edgcpp-rust.yml']
  pull_request:
    branches: [main]
    paths: ['.github/workflows/validate-edgcpp-rust.yml']
  workflow_dispatch:
    inputs:
      source_ref:
        description: 'bingordo/edgcpp-rust branch, tag, or commit SHA'
        required: false
        default: cranelift-codegen
        type: string

permissions:
  contents: read

concurrency:
  group: edg-cfg-validation-${{ github.ref }}-${{ inputs.source_ref || 'pr86' }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    container:
      # Reuse the same pinned EDG CI environment as edg-yarpgen.yml.
      image: ghcr.io/edgcpp/ci-runner@sha256:14b3948c2ce12cfa5472e5a6c468393d15426f3a67685cc35d830ea5db2acdf8
    defaults:
      run:
        shell: edg-container-exec "bash -eo pipefail {0}"
    env:
      EDG_SOURCE_SHA: b195677be8b9b56c8337afad6be8064d21a54082
      EDG_RELEASE_TAG: edgcpfe-v2026.11.14-upstream-177765bb7731
      EDG_RELEASE_SHA256: 1ce495b629924f31382ecccc891a7a72caae1014ddfa2ba7dd39b44d8b0a9526
      RUST_TOOLCHAIN_VERSION: 1.99.1
      CARGO_PROFILE_DEV_DEBUG: '0'
      EDGCPP_SOURCE_DIR: ${{ github.workspace }}/edgcpp
      EDGCPP_COMPILE_COMMANDS: ${{ github.workspace }}/edgcpp/build/gcc-release/compile_commands.json
      EDGCPP_LIB_DIR: ${{ github.workspace }}/edgcpp/build/gcc-release/lib
      EDGCPP_EDG_REVISION: b195677be8b9b56c8337afad6be8064d21a54082
    steps:
      - name: Check out exact EDG Rust revision (pinned on compiler-ci PR/push)
        uses: actions/checkout@v4
        with:
          repository: bingordo/edgcpp-rust
          ref: ${{ inputs.source_ref || 'e584b9036fd5bb602b6509f1538cbfe2aa80be46' }}
          path: edgcpp-rust
          persist-credentials: false
      - name: Record exact revision
        working-directory: edgcpp-rust
        run: |
          set -euo pipefail
          sha=$(git rev-parse HEAD)
          test "${#sha}" -eq 40
          echo "EDG Rust commit: $sha" | tee -a "$GITHUB_STEP_SUMMARY"
          if [[ "${{ github.event_name }}" != workflow_dispatch ]]; then
            test "$sha" = e584b9036fd5bb602b6509f1538cbfe2aa80be46
          fi
      - name: Check out source headers matching the pinned EDG library
        uses: actions/checkout@v4
        with:
          repository: bingundu/edgcpp
          ref: b195677be8b9b56c8337afad6be8064d21a54082
          path: edgcpp
          persist-credentials: false
      - name: Configure EDG bridge metadata without rebuilding full EDG
        working-directory: edgcpp
        env:
          EDG_BASE: ${{ github.workspace }}/edgcpp/bases/docker/dev-env/gcc
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EDG_SOURCE_SHA"
          test "$(git rev-parse HEAD:src/lower_il.c)" = 832fee1d985cd666c05090a35ea0a71a78880564
          ! grep -q 'edgcpp_capture_' src/lower_il.c
          cmake --preset linux-gcc-release \
            -DEDG_BUILD_LIB=OFF -DEDG_BUILD_CALLABLE_LIBRARY=ON \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
          cmake --build build/gcc-release --target error-info --parallel 2
          test -s build/gcc-release/src/includes/err_codes.h
          test -s build/gcc-release/src/includes/err_data.h
      - name: Download and verify pinned prebuilt EDG archive
        working-directory: edgcpp
        run: |
          set -euo pipefail
          mkdir -p build/gcc-release/lib build/prebuilt-edg
          curl --fail --location --silent --show-error --retry 4 --retry-delay 2 \
            "https://github.com/bingundu/edgcpp/releases/download/$EDG_RELEASE_TAG/edgcpfe-ci-upstream-callable-edg-release-20261114-linux-x86_64.tar.gz" \
            -o build/prebuilt-edg/archive.tar.gz
          printf '%s  %s\n' "$EDG_RELEASE_SHA256" build/prebuilt-edg/archive.tar.gz | sha256sum -c -
          tar -xzf build/prebuilt-edg/archive.tar.gz -C build/prebuilt-edg
          grep -Fx "commit=$EDG_SOURCE_SHA" build/prebuilt-edg/BUILD-INFO.txt
          grep -Fx 'platform=linux-x86_64' build/prebuilt-edg/BUILD-INFO.txt
          test -s build/prebuilt-edg/lib/libedgcpfe.a
          cp build/prebuilt-edg/lib/libedgcpfe.a build/gcc-release/lib/libedgcpfe.a
      - name: Install pinned Rust toolchain
        run: |
          set -euo pipefail
          if ! command -v cargo >/dev/null; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | \
              sh -s -- -y --profile minimal --default-toolchain "$RUST_TOOLCHAIN_VERSION"
          fi
          export PATH="$HOME/.cargo/bin:$PATH"
          rustup toolchain install "$RUST_TOOLCHAIN_VERSION" --profile minimal
          rustup default "$RUST_TOOLCHAIN_VERSION"
      - name: Restore Rust build cache
        uses: actions/cache/restore@v4
        id: rust-cache
        with:
          path: |
            edgcpp-rust/target
            ~/.cargo/registry
            ~/.cargo/git
          key: edg-atomic-v1-${{ hashFiles('edgcpp-rust/Cargo.lock', 'edgcpp-rust/build.rs') }}-${{ github.sha }}
          restore-keys: |
            rust-edgcpp-cranelift-v1-
      - name: Assert EDG back end has no source hooks
        working-directory: edgcpp-rust
        run: |
          set -euo pipefail
          export PATH="$HOME/.cargo/bin:$PATH"
          cargo test --features codegen --test native_backend_contract -- --nocapture
          cargo test --features codegen --lib retired_source_hook_wire_tests -- --nocapture
          ! grep -Eq 'edgcpp_capture_|postlower_virtual_calls|prelower_virtual_calls' cpp/bridge.cpp
          echo "Normal EDG back_end entry and IL traversal, no private lowering hooks" >> "$GITHUB_STEP_SUMMARY"
      - name: Verify qualified scope chain cycles and deep native namespace names
        working-directory: edgcpp
        run: |
          set -euo pipefail
          export PATH="$HOME/.cargo/bin:$PATH"
          g++ -std=c++11 -Wall -Wextra -Werror "$GITHUB_WORKSPACE/edgcpp-rust/tests/qualified_scope_prefix.cpp" -o "$RUNNER_TEMP/qualified-scope-prefix"
          "$RUNNER_TEMP/qualified-scope-prefix"
          g++ -std=c++11 -Wall -Wextra -Werror "$GITHUB_WORKSPACE/edgcpp-rust/tests/scope_tree.cpp" -o "$RUNNER_TEMP/scope-tree"
          "$RUNNER_TEMP/scope-tree"
          g++ -std=c++11 -Wall -Wextra -Werror "$GITHUB_WORKSPACE/edgcpp-rust/tests/expression_tree.cpp" -o "$RUNNER_TEMP/expression-tree"
          "$RUNNER_TEMP/expression-tree"
          g++ -std=c++11 -Wall -Wextra -Werror "$GITHUB_WORKSPACE/edgcpp-rust/tests/ordinal_path.cpp" -o "$RUNNER_TEMP/ordinal-path"
          "$RUNNER_TEMP/ordinal-path"
          source build/gcc-release/environment.sh
          cd build/gcc-release
          cargo run --quiet --manifest-path "$GITHUB_WORKSPACE/edgcpp-rust/Cargo.toml" --example parse -- --c++20 "$GITHUB_WORKSPACE/edgcpp-rust/tests/fixtures/namespaces.cpp" >"$RUNNER_TEMP/namespace-probe.log" 2>&1
          grep -Fq 'EDG status: 0' "$RUNNER_TEMP/namespace-probe.log"
          grep -Fq 'variable outer::inner::nested' "$RUNNER_TEMP/namespace-probe.log"
          prefix=$(printf 'deep_%s::' $(seq 0 135))
          grep -Fq "variable ${prefix}depth_value" "$RUNNER_TEMP/namespace-probe.log"
      - name: Run focused pointer call compatibility audit tests
        working-directory: edgcpp-rust
        run: |
          set -euo pipefail
          export PATH="$HOME/.cargo/bin:$PATH"
          timeout --signal=TERM --kill-after=10s 20m \
            cargo test --features codegen --lib audit_call_argument_shape_tests -- --nocapture \
            2>&1 | tee "$RUNNER_TEMP/edg-cfg-targeted.log"
          # A filtered-out zero-test run is not a successful targeted gate.
          grep -Eq 'test result: ok[.] [1-9][0-9]* passed; 0 failed' "$RUNNER_TEMP/edg-cfg-targeted.log"
      - name: Verify EDG lifetime ownership cardinalities and wire schema
        working-directory: edgcpp-rust
        run: |
          set -euo pipefail
          export PATH="$HOME/.cargo/bin:$PATH"
          python3 tools/gen_wire_schema.py --check
          cargo test --features codegen --lib native_lifetime_owners_reject_missing_roots_scope_links_and_tail_scopes -- --nocapture
          cargo test --features codegen --lib lifetime_child_counts_reject_dropped_subtrees_and_mismatched_owners -- --nocapture
          cargo test --features codegen --lib native_declaration_counts_reject_lost_parameter_and_local_tail_records -- --nocapture

      - name: Stress graph scope and lifetime indexing and profile construction
        working-directory: edgcpp-rust
        run: |
          set -euo pipefail
          export PATH="$HOME/.cargo/bin:$PATH"
          cargo test --lib --features codegen audit_indexed_scope_and_lifetime_validation_on_many_records -- --nocapture
          cargo test --lib --features codegen audit_indexed_scope_lifetime_large_snapshot_corruptions -- --nocapture
          cargo test --lib --features codegen audit_indexed_scope_lifetime_graph_scaling -- --ignored --nocapture \
            2>&1 | tee "$RUNNER_TEMP/edg-graph-scope-scaling.log"
          grep -q 'indexed-scope-lifetime from_il records=128' "$RUNNER_TEMP/edg-graph-scope-scaling.log"
          grep -q 'indexed-scope-lifetime from_il records=256' "$RUNNER_TEMP/edg-graph-scope-scaling.log"
          grep -q 'indexed-scope-lifetime from_il records=512' "$RUNNER_TEMP/edg-graph-scope-scaling.log"
          grep 'indexed-scope-lifetime from_il records=' "$RUNNER_TEMP/edg-graph-scope-scaling.log" >> "$GITHUB_STEP_SUMMARY"

      - name: Verify bounded resource policy and Clippy correctness
        working-directory: edgcpp-rust
        run: |
          set -euo pipefail
          export PATH="$HOME/.cargo/bin:$PATH"
          cargo test --features codegen --lib explicit_stack_slot_sum_checks_alignment_and_overflow -- --nocapture
          cargo test --features codegen --lib aggregate_call_temporary_stack_slots_are_counted_even_when_nested -- --nocapture
          cargo test --features codegen --lib aggregate_stack_budget_rejects_sum_of_individually_valid_objects -- --nocapture
          cargo test --features codegen --lib array_layout_multiplication_checks_exact_boundaries -- --nocapture
          cargo test --features codegen --lib fp_parameter_local_and_statement_limits_are_checked_independently -- --nocapture
          cargo test --features codegen --lib aggregate_image_boundaries_are_checked -- --nocapture
          cargo test --features codegen --lib exact_prototype_required_and_large_signatures_rejected -- --nocapture
          rustup component add clippy
          cargo clippy --features codegen --lib -- -D clippy::correctness
      - name: Validate global materialization unknown high bit without stale mask
        working-directory: edgcpp-rust
        run: |
          set -euo pipefail
          export PATH="$HOME/.cargo/bin:$PATH"
          cargo test --features codegen --lib orphan_duplicate_and_unknown_native_property_bits_fail_closed -- --nocapture
      - name: Probe source-owned deep C11 array types against pinned EDG and GCC
        working-directory: edgcpp
        run: |
          set -euo pipefail
          export PATH="$HOME/.cargo/bin:$PATH"
          source build/gcc-release/environment.sh
          dims=""
          for i in $(seq 1 40); do dims="${dims}[1]"; done
          printf 'int deep_array%s;\nint main(void) { return sizeof deep_array != sizeof(int); }\n' "$dims" \
            >build/gcc-release/deep-native-array-40.c
          cd build/gcc-release
          cargo run --quiet --manifest-path "$GITHUB_WORKSPACE/edgcpp-rust/Cargo.toml" \
            --example parse -- --c11 deep-native-array-40.c >"$RUNNER_TEMP/deep-native-array-40.log" 2>&1
          grep -Fq 'EDG status: 0' "$RUNNER_TEMP/deep-native-array-40.log"
          gcc -std=c11 -O0 -Wall -Wextra -Werror deep-native-array-40.c \
            -o "$RUNNER_TEMP/deep-native-array-40"
          "$RUNNER_TEMP/deep-native-array-40"
          echo 'Pinned EDG and GCC accept a real 40-dimensional C11 array' >> "$GITHUB_STEP_SUMMARY"
      - name: Probe deep declaration scopes against pinned EDG and GCC
        working-directory: edgcpp
        run: |
          set -euo pipefail
          export PATH="$HOME/.cargo/bin:$PATH"
          source build/gcc-release/environment.sh
          cd build/gcc-release
          {
            for i in $(seq 0 249); do echo "namespace nest_$i {"; done
            echo 'int terminal_value = 37;'
            for i in $(seq 0 249); do echo '}'; done
            printf 'int main() { return '
            printf 'nest_%s::' $(seq 0 249)
            echo 'terminal_value != 37; }'
          } > deep-declaration-scopes.cpp
          g++ -std=c++20 -O0 -Wall -Wextra -Werror deep-declaration-scopes.cpp -o "$RUNNER_TEMP/deep-declaration-scopes"
          "$RUNNER_TEMP/deep-declaration-scopes"
          cargo run --quiet --manifest-path "$GITHUB_WORKSPACE/edgcpp-rust/Cargo.toml" --example parse -- --c++20 deep-declaration-scopes.cpp >"$RUNNER_TEMP/deep-declaration-scopes.log" 2>&1
          grep -Fq 'EDG status: 0' "$RUNNER_TEMP/deep-declaration-scopes.log"
          prefix=$(printf 'nest_%s::' $(seq 0 249))
          grep -Fq "variable ${prefix}terminal_value" "$RUNNER_TEMP/deep-declaration-scopes.log"
      - name: Probe deep native type chains and recursive record references
        working-directory: edgcpp
        run: |
          set -euo pipefail
          export PATH="$HOME/.cargo/bin:$PATH"
          source build/gcc-release/environment.sh
          cd build/gcc-release
          dims=""
          for i in $(seq 1 96); do dims="${dims}[1]"; done
          {
            printf 'int deep_type%s;\n' "$dims"
            echo 'struct recursive_b;'
            echo 'struct recursive_a { struct recursive_b *next; int value; };'
            echo 'struct recursive_b { struct recursive_a *prev; };'
            echo 'struct recursive_a node_a; struct recursive_b node_b;'
            echo 'int main(void) { node_a.next=&node_b; node_b.prev=&node_a; return sizeof deep_type != sizeof(int) || node_a.next->prev != &node_a; }'
          } > deep-native-types.c
          gcc -std=c11 -O0 -Wall -Wextra -Werror deep-native-types.c -o "$RUNNER_TEMP/deep-native-types"
          "$RUNNER_TEMP/deep-native-types"
          cargo run --quiet --manifest-path "$GITHUB_WORKSPACE/edgcpp-rust/Cargo.toml" --example parse -- --c11 deep-native-types.c >"$RUNNER_TEMP/deep-native-types.log" 2>&1
          grep -Fq 'EDG status: 0' "$RUNNER_TEMP/deep-native-types.log"
      - name: Verify deep record image and fail-closed deep array against EDG/GCC
        working-directory: edgcpp
        run: |
          set -euo pipefail
          export PATH="$HOME/.cargo/bin:$PATH"
          source build/gcc-release/environment.sh
          a="$GITHUB_WORKSPACE/edgcpp-rust/tests/fixtures/audit_deep_designated_initializers.c"
          b="$GITHUB_WORKSPACE/edgcpp-rust/tests/fixtures/audit_deep_designated_record.c"
          gcc -std=c11 -O0 -Wall -Wextra -Werror "$a" -o "$RUNNER_TEMP/deep-designated-array"
          gcc -std=c11 -O0 -Wall -Wextra -Werror "$b" -o "$RUNNER_TEMP/deep-designated-record"
          "$RUNNER_TEMP/deep-designated-array"
          "$RUNNER_TEMP/deep-designated-record"
          cd build/gcc-release
          array_ok=false
          if EDG_DESIGNATED_CASE=array cargo run --quiet --manifest-path "$GITHUB_WORKSPACE/edgcpp-rust/Cargo.toml" --example audit_designated_images -- --c11 "$a" 2>&1 | tee "$RUNNER_TEMP/deep-designated-images.log"; then array_ok=true; fi
          record_ok=false
          if EDG_DESIGNATED_CASE=record cargo run --quiet --manifest-path "$GITHUB_WORKSPACE/edgcpp-rust/Cargo.toml" --example audit_designated_images -- --c11 "$b" 2>&1 | tee "$RUNNER_TEMP/deep-designated-record.log"; then record_ok=true; fi
          echo "Native deep designated array image: $array_ok" >> "$GITHUB_STEP_SUMMARY"
          echo "Native deep designated record image: $record_ok" >> "$GITHUB_STEP_SUMMARY"
          # Deep designated array construction is now iterative.
          test "$array_ok" = true
          grep -Fq 'EDG_DEEP_DESIGNATOR_IMAGE name=deep_designated_array bytes=4 value=37' "$RUNNER_TEMP/deep-designated-images.log"
          test "$record_ok" = true
          grep -Fq 'EDG_DEEP_DESIGNATOR_IMAGE name=deep_designated_record bytes=4 value=53' "$RUNNER_TEMP/deep-designated-record.log"
      - name: Verify images and relocations above former size ceilings
        working-directory: edgcpp
        run: |
          set -euo pipefail
          export PATH="$HOME/.cargo/bin:$PATH"
          source build/gcc-release/environment.sh
          cd build/gcc-release
          cat > large-images.c <<'EOF'
          unsigned char image_4097[4097] = { [0]=13, [4096]=89 };
          unsigned char image_600000[600000] = { [0]=13, [599999]=89 };
          EOF
          cat "$GITHUB_WORKSPACE/edgcpp-rust/tests/fixtures/audit_reloc_513.c" >> large-images.c
          cargo run --quiet --manifest-path "$GITHUB_WORKSPACE/edgcpp-rust/Cargo.toml" --example audit_large_images -- --c11 large-images.c
          cat > image-driver.c <<'EOF'
          extern unsigned char image_4097[4097], image_600000[600000];
          extern int audit_reloc_bad_use(void);
          int main(void) {
            return image_4097[0]!=13 || image_4097[4096]!=89 ||
                image_600000[0]!=13 || image_600000[599999]!=89 ||
                image_600000[300000]!=0 || audit_reloc_bad_use()!=37;
          }
          EOF
          gcc -std=c11 -O0 large-images.c image-driver.c -o "$RUNNER_TEMP/gcc-large-images"
          "$RUNNER_TEMP/gcc-large-images"
          cargo run --quiet --features codegen --manifest-path "$GITHUB_WORKSPACE/edgcpp-rust/Cargo.toml" --example codegen -- large-images.o --c11 large-images.c
          gcc large-images.o image-driver.c -o "$RUNNER_TEMP/edg-large-images"
          "$RUNNER_TEMP/edg-large-images"
      - name: Execute compact large local aggregate copy and fill
        working-directory: edgcpp-rust
        run: |
          set -euo pipefail
          export PATH="$HOME/.cargo/bin:$PATH"
          export EDG_BULK_IMAGE_TEST_OBJECT="$RUNNER_TEMP/bulk-local.o"
          cargo test --features codegen --lib bulk_local_images_have_small_code_and_exact_tail -- --nocapture
          cat > "$RUNNER_TEMP/bulk-driver.c" <<'EOF'
          extern long bulk_copy(void), bulk_zero(void);
          int main(void) {
            const unsigned long n=65541;
            const unsigned long offsets[]={0,7,8,64,n/2,n-6,n-5,n-2,n-1};
            long expected=0;
            for (unsigned i=0;i<sizeof offsets/sizeof offsets[0];++i)
              expected+=(offsets[i]%251)+1;
            return bulk_copy()!=expected || bulk_zero()!=0;
          }
          EOF
          gcc "$RUNNER_TEMP/bulk-driver.c" "$RUNNER_TEMP/bulk-local.o" -o "$RUNNER_TEMP/bulk-local"
          "$RUNNER_TEMP/bulk-local"
      - name: Execute compact aggregate copy with overlap and exact tails
        working-directory: edgcpp-rust
        run: |
          set -euo pipefail
          export PATH="$HOME/.cargo/bin:$PATH"
          export EDG_BULK_COPY_TEST_OBJECT="$RUNNER_TEMP/bulk-copy.o"
          cargo test --features codegen --lib bulk_aggregate_copy_has_compact_code_and_overlap_semantics -- --nocapture
          cat > "$RUNNER_TEMP/copy-driver.c" <<'EOF'
          #include <string.h>
          #include <stdlib.h>
          #include <stdint.h>
          typedef long (*copy_fn)(void *, const void *);
          extern long copy_7(void *,const void *),copy_63(void *,const void *);
          extern long copy_64(void *,const void *),copy_65(void *,const void *);
          extern long copy_65541(void *,const void *);
          int main(void) {
            const size_t sizes[]={7,63,64,65,65541};
            const copy_fn copies[]={copy_7,copy_63,copy_64,copy_65,copy_65541};
            for(size_t k=0;k<5;k++) {
              size_t n=sizes[k],len=2*n+32;
              unsigned char *a=malloc(len),*b=malloc(len);
              if(!a||!b) return 1;
              const size_t starts[][2]={{0,0},{1,0},{0,1},{3,7},{7,3},{n+8,0},{0,n+8}};
              for(size_t j=0;j<sizeof starts/sizeof starts[0];j++) {
                for(size_t i=0;i<len;i++) a[i]=b[i]=(unsigned char)(i%251);
                size_t d=starts[j][0],s=starts[j][1];
                memmove(b+d,b+s,n);
                copies[k](a+d,a+s);
                if(memcmp(a,b,len)) return 2;
              }
              free(a);free(b);
            }
            return 0;
          }
          EOF
          gcc "$RUNNER_TEMP/copy-driver.c" "$RUNNER_TEMP/bulk-copy.o" -o "$RUNNER_TEMP/bulk-copy"
          "$RUNNER_TEMP/bulk-copy"
      - name: Compare native large struct and union assignments with GCC
        working-directory: edgcpp
        run: |
          set -euo pipefail
          export PATH="$HOME/.cargo/bin:$PATH"
          source build/gcc-release/environment.sh
          cd build/gcc-release
          cat > large-copy.c <<'EOF'
          struct big { unsigned char data[4097]; int end; };
          union big_union { unsigned char data[4097]; long align; };
          void copy_struct(struct big *d,struct big *s) { *d=*s; }
          void copy_union(union big_union *d,union big_union *s) { *d=*s; }
          EOF
          cat > copy-driver.c <<'EOF'
          #include <string.h>
          struct big { unsigned char data[4097]; int end; };
          union big_union { unsigned char data[4097]; long align; };
          extern void copy_struct(struct big *,struct big *);
          extern void copy_union(union big_union *,union big_union *);
          int main(void) {
            struct big a={0},b={0};
            union big_union c={0},d={0};
            for(unsigned i=0;i<4097;i++) a.data[i]=c.data[i]=(unsigned char)(i%251);
            a.end=37;
            copy_struct(&b,&a);copy_union(&d,&c);
            copy_struct(&b,&b);copy_union(&d,&d);
            return b.end!=37||memcmp(a.data,b.data,4097)||memcmp(c.data,d.data,4097);
          }
          EOF
          gcc -std=c11 -O0 large-copy.c copy-driver.c -o "$RUNNER_TEMP/gcc-large-copy"
          "$RUNNER_TEMP/gcc-large-copy"
          cargo run --quiet --features codegen --manifest-path "$GITHUB_WORKSPACE/edgcpp-rust/Cargo.toml" --example codegen -- large-copy.o --c11 large-copy.c
          gcc large-copy.o copy-driver.c -o "$RUNNER_TEMP/edg-large-copy"
          "$RUNNER_TEMP/edg-large-copy"
      - name: Check iterative Rust aggregate layout, copy and cycle boundaries
        working-directory: edgcpp-rust
        run: |
          set -euo pipefail
          export PATH="$HOME/.cargo/bin:$PATH"
          cargo test --lib --features codegen audit_deep_native_array_layout_tests -- --nocapture

      - name: Check bounded deep singleton-record CFG layouts and copy offsets
        working-directory: edgcpp-rust
        run: |
          set -euo pipefail
          export PATH="$HOME/.cargo/bin:$PATH"
          cargo test --features codegen --lib audit_deep_singleton_record_layout_tests -- --nocapture
      - name: Validate ordered EDG startup wire records
        working-directory: edgcpp-rust
        run: |
          set -euo pipefail
          export PATH="$HOME/.cargo/bin:$PATH"
          cargo test --features codegen --lib file_scope_init_schedule_wire_tests -- --nocapture
          cargo test --features codegen --lib native_scope_asm_wire_tests -- --nocapture
          python3 tools/gen_wire_schema.py --check
      - name: Probe original C++ global constructor startup schedule
        working-directory: edgcpp
        run: |
          set -euo pipefail
          export PATH="$HOME/.cargo/bin:$PATH"
          source build/gcc-release/environment.sh
          cat >build/gcc-release/global-init-probe.cpp <<'CPP'
          struct Effectful {
            int value;
            explicit Effectful(int x) : value(x) {}
            ~Effectful() { value = 0; }
          };
          Effectful global_effect(7);
          int main() { return 0; }
          CPP
          cd build/gcc-release
          version="$(g++ -dumpfullversion -dumpversion)"
          IFS=. read -r major minor patch <<<"$version"
          gnu_number=$((10#${major}*10000+10#${minor:-0}*100+10#${patch:-0}))
          cargo run --quiet --manifest-path "$GITHUB_WORKSPACE/edgcpp-rust/Cargo.toml" \
            --example parse -- --g++ --c++17 --no_strict_gnu --gnu_version "$gnu_number" \
            global-init-probe.cpp >"$RUNNER_TEMP/edg-init-probe.log" 2>&1
          grep -F 'file scope init scheduler available=' "$RUNNER_TEMP/edg-init-probe.log"
          grep -F 'scope dynamic init entries=' "$RUNNER_TEMP/edg-init-probe.log"
          # Source-owned generated-routine classification (not name-only proof).
          grep -F 'routine attributes name=__sti__' "$RUNNER_TEMP/edg-init-probe.log" | head -n 30
          grep -Eq 'routine attributes name=__sti__[^ ]+ .*generated=true defined=true' "$RUNNER_TEMP/edg-init-probe.log"
          grep -F 'scope dynamic init scope=' "$RUNNER_TEMP/edg-init-probe.log" || true
          grep -F 'file scope init root position=' "$RUNNER_TEMP/edg-init-probe.log" || true
      - name: Probe EDG direct base offsets for C++17 std::cout and multiple inheritance
        working-directory: edgcpp
        run: |
          set -euo pipefail
          export PATH="$HOME/.cargo/bin:$PATH"
          source build/gcc-release/environment.sh
          cat >build/gcc-release/base-offset-probe.cpp <<'CPP'
          struct A { int a; };
          struct B { int b; };
          struct Derived : A, B { int c; };
          int main() { Derived d{}; return d.b; }
          CPP
          cat >build/gcc-release/cout-base-offset.cpp <<'CPP'
          #include <iostream>
          int main() { std::cout << "Hello, world!"; }
          CPP
          cd build/gcc-release
          version="$(g++ -dumpfullversion -dumpversion)"
          IFS=. read -r major minor patch <<<"$version"
          gnu_number=$((10#${major}*10000+10#${minor:-0}*100+10#${patch:-0}))
          args=(--g++ --c++17 --no_strict_gnu --gnu_version "$gnu_number")
          cargo run --quiet --manifest-path "$GITHUB_WORKSPACE/edgcpp-rust/Cargo.toml" --example parse -- "${args[@]}" base-offset-probe.cpp >"$RUNNER_TEMP/base-offset-probe.log" 2>&1
          grep -F 'EDG_BASE_OFFSET derived=' "$RUNNER_TEMP/base-offset-probe.log" | sed -n '1,20p'
          g++ -std=c++17 -v -E -x c++ /dev/null >"$RUNNER_TEMP/cout-include-search.log" 2>&1
          mapfile -t include_dirs < <(awk '/#include <\.\.\.> search starts here:/{active=1;next} /^End of search list/{active=0} active && /^ /{sub(/^[[:space:]]+/,"");print}' "$RUNNER_TEMP/cout-include-search.log")
          test "${#include_dirs[@]}" -ge 3
          include_flags=()
          for dir in "${include_dirs[@]}"; do test -d "$dir" && include_flags+=("-I$dir"); done
          cargo run --quiet --manifest-path "$GITHUB_WORKSPACE/edgcpp-rust/Cargo.toml" --example parse -- "${args[@]}" "${include_flags[@]}" cout-base-offset.cpp >"$RUNNER_TEMP/cout-base-offset.log" 2>&1
          grep -F 'EDG_BASE_OFFSET derived=' "$RUNNER_TEMP/cout-base-offset.log" | sed -n '1,35p'
          # Exact original cout call-chain base identified by compiler-ci
          # C++5 TypeId source admission, not from guessed class names.
          grep -Fq 'EDG_BASE_OFFSET derived=118 base=119 position=0 virtual=false offset=Some(0)' "$RUNNER_TEMP/cout-base-offset.log"
          grep -Fq 'EDG_BASE_OFFSET derived=115 base=118 position=0 virtual=true offset=None' "$RUNNER_TEMP/cout-base-offset.log"
          echo 'Original std::cout inheritance base offset snapshot captured' >> "$GITHUB_STEP_SUMMARY"
      - name: Verify C11 and C++20 source lifetime ownership against pinned EDG and GCC
        working-directory: edgcpp
        run: |
          set -euo pipefail
          export PATH="$HOME/.cargo/bin:$PATH"
          source build/gcc-release/environment.sh
          cat >build/gcc-release/lifetime-owner-c11.c <<'C'
          int owner_c(int x, int y, int z) {
            int result = x + y + z;
            { int nested = x + 3; result += nested; }
            if (result > 0) { int last = result + 1; result = last; }
            return result;
          }
          int main(void) { return owner_c(2, 3, 4) != 15; }
          C
          cat >build/gcc-release/lifetime-owner-cpp20.cpp <<'CPP'
          struct Local {
            int value;
            explicit Local(int x) : value(x) {}
            ~Local() { value = 0; }
            int combine(int x, int y) {
              int combined = x + y;
              { int nested = combined; combined = nested; }
              return value + combined;
            }
          };
          int owner_cpp(int x, int y, int z) {
            Local a{x};
            { Local b{x + 1}; if (b.value != x + 1) return 97; }
            return a.combine(y, z);
          }
          int main() { return owner_cpp(7, 3, 4) != 14; }
          CPP
          cd build/gcc-release
          cargo run --quiet --manifest-path "$GITHUB_WORKSPACE/edgcpp-rust/Cargo.toml" \
            --example parse -- --c11 lifetime-owner-c11.c >"$RUNNER_TEMP/lifetime-c11.log" 2>&1
          cargo run --quiet --manifest-path "$GITHUB_WORKSPACE/edgcpp-rust/Cargo.toml" \
            --example parse -- --c++20 lifetime-owner-cpp20.cpp >"$RUNNER_TEMP/lifetime-cpp20.log" 2>&1
          grep -Fq 'EDG status: 0' "$RUNNER_TEMP/lifetime-c11.log"
          grep -Fq 'EDG status: 0' "$RUNNER_TEMP/lifetime-cpp20.log"
          gcc -std=c11 -O0 -Wall -Wextra -Werror lifetime-owner-c11.c -o "$RUNNER_TEMP/lifetime-c11"
          g++ -std=c++20 -O0 -Wall -Wextra -Werror lifetime-owner-cpp20.cpp -o "$RUNNER_TEMP/lifetime-cpp20"
          "$RUNNER_TEMP/lifetime-c11"
          "$RUNNER_TEMP/lifetime-cpp20"
          echo 'Pinned EDG C11/C++20 owner snapshots and GCC source oracles passed' >> "$GITHUB_STEP_SUMMARY"
      - name: Probe deep native statement paths against pinned EDG and GCC
        working-directory: edgcpp
        run: |
          set -euo pipefail
          export PATH="$HOME/.cargo/bin:$PATH"
          source build/gcc-release/environment.sh
          cd build/gcc-release
          {
            echo 'int deep_statements(volatile int *p) {'
            for i in $(seq 0 79); do echo "if (*p != $i) {"; done
            echo 'return 7;'
            for i in $(seq 0 79); do echo '}'; done
            echo 'return 9; }'
            echo 'int main(void) { int x = 100; return deep_statements(&x) != 7; }'
          } > deep-statements.c
          gcc -std=c11 -O0 -Wall -Wextra -Werror deep-statements.c -o "$RUNNER_TEMP/deep-statements"
          "$RUNNER_TEMP/deep-statements"
          cargo run --quiet --manifest-path "$GITHUB_WORKSPACE/edgcpp-rust/Cargo.toml" --example parse -- --c11 deep-statements.c >"$RUNNER_TEMP/deep-statements.log" 2>&1
          grep -Fq 'EDG status: 0' "$RUNNER_TEMP/deep-statements.log"
          awk '/^statement deep_statements path=/{n=split($3,p,"[.]"); if(n>max)max=n} END{print "deep statement path components:",max; exit !(max>128)}' "$RUNNER_TEMP/deep-statements.log"
      - name: Run all Rust library tests with codegen
        working-directory: edgcpp-rust
        run: |
          set -euo pipefail
          export PATH="$HOME/.cargo/bin:$PATH"
          timeout --signal=TERM --kill-after=10s 20m \
            cargo test --features codegen --lib \
            2>&1 | tee "$RUNNER_TEMP/edg-cfg-library.log"
          grep -Eq 'test result: ok' "$RUNNER_TEMP/edg-cfg-library.log"
      - name: Summarize passing test logs
        if: success()
        run: |
          echo "Atomic regression tests and full codegen library tests passed." >> "$GITHUB_STEP_SUMMARY"
          grep 'test result: ok' "$RUNNER_TEMP/edg-cfg-targeted.log" >> "$GITHUB_STEP_SUMMARY"
          grep 'test result: ok' "$RUNNER_TEMP/edg-cfg-library.log" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload validation logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: edg-atomic-validation-logs
          path: |
            ${{ runner.temp }}/edg-cfg-targeted.log
            ${{ runner.temp }}/edg-cfg-library.log
            ${{ runner.temp }}/edg-init-probe.log
            ${{ runner.temp }}/base-offset-probe.log
            ${{ runner.temp }}/cout-base-offset.log
            ${{ runner.temp }}/cout-include-search.log
            ${{ runner.temp }}/edg-graph-scope-scaling.log
            ${{ runner.temp }}/deep-native-array-40.log
            ${{ runner.temp }}/deep-designated-images.log
            ${{ runner.temp }}/deep-designated-record.log
            ${{ runner.temp }}/lifetime-c11.log
            ${{ runner.temp }}/lifetime-cpp20.log
          if-no-files-found: ignore
          retention-days: 14
