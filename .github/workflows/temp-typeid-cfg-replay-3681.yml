name: Temporary TypeId CFG replay #3681
on:
  pull_request:
    paths:
      - '.github/workflows/temp-typeid-cfg-replay-3681.yml'
permissions:
  contents: read
jobs:
  replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      SOURCE_SHA: 97673c1bbd8c1e0a820ddbcebb8d6c5d83fc523c
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: ${{ env.SOURCE_SHA }}
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Authenticate private frontend git dependencies
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.CI_KEY }}
      - name: Trust GitHub for frontend dependency fetches
        run: ssh-keyscan github.com >> ~/.ssh/known_hosts
      - name: Exact source SHA and source replay parity
        working-directory: compiler
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          cargo test -p compiler --test typeid_ir_dump_replay -- --nocapture
