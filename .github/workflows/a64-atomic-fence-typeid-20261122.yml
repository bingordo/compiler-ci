name: AArch64 native TypeId C11 fence integration
on:
  push:
    branches: [ci/a64-atomic-fence-typeid-20261122]
    paths: ['.github/workflows/a64-atomic-fence-typeid-20261122.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  a64-fence:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Source-pinned compiler candidate
        uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: bb0329727d7a06225eaeb80e5c83ca94cb4b0ef6
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Independent A64 GNU assembler
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends binutils-aarch64-linux-gnu
          command -v aarch64-linux-gnu-as
          command -v aarch64-linux-gnu-objcopy
      - name: Isolate native backend crates and prove source pin
        run: |
          set -euo pipefail
          test "$(git -C compiler rev-parse HEAD)" = bb0329727d7a06225eaeb80e5c83ca94cb4b0ef6
          printf '[workspace]\nresolver = "2"\nmembers = ["crates/ir", "crates/backend", "crates/backend-aarch64"]\n' > compiler/Cargo.toml
          rm -f compiler/Cargo.lock
      - name: Build AArch64 backend and test targets
        working-directory: compiler
        run: cargo check -p compiler-backend-aarch64 --all-targets
      - name: Native fence and fail-closed acceptance
        working-directory: compiler
        run: cargo test -p compiler-backend-aarch64 --test typeid_atomic_fences -- --nocapture
      - name: Shared backend unit regressions
        working-directory: compiler
        run: cargo test -p compiler-backend-aarch64 --lib
      - name: AArch64 lint (unchanged legacy warnings excepted)
        working-directory: compiler
        run: cargo clippy -p compiler-backend-aarch64 --lib -- -D warnings -A unused-imports -A dead-code -A unused-variables -A clippy::collapsible-match -A clippy::empty-line-after-doc-comments
