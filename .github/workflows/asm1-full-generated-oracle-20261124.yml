name: ASM1-D23 pinned GNU local COMMON complete GAS oracle
on:
  push:
    branches: [main]
    paths: ['.github/workflows/asm1-full-generated-oracle-20261124.yml']
  pull_request:
    paths: ['.github/workflows/asm1-full-generated-oracle-20261124.yml']
  workflow_dispatch:
  schedule:
    - cron: '21 9 * * *'
permissions:
  contents: read
  statuses: write
jobs:
  generated-oracle:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: eb3894bb60e4034727e74d06c88eae941dda64ce
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
          path: compiler
      - name: Record exact tested D23 source SHA
        id: source
        working-directory: compiler
        run: |
          set -euo pipefail
          source_sha="$(git rev-parse HEAD)"
          test "$source_sha" = eb3894bb60e4034727e74d06c88eae941dda64ce
          echo "ASM_SOURCE_D23_SHA=$source_sha"
          echo "source_sha=$source_sha" >> "$GITHUB_OUTPUT"
          printf 'compiler/D23 candidate: `%s`\n' "$source_sha" >> "$GITHUB_STEP_SUMMARY"
      - name: Validate generator source and checked output
        working-directory: compiler
        run: |
          set -euo pipefail
          python3 tools/test_regen_x86_att_forms.py
          python3 tools/regen_x86_att_forms.py --check
          python3 tools/test_regen_x86_forms.py
          python3 tools/regen_x86_forms.py --check
          for generator in packed vex move evex evex_mask_compare evex_shift_imm evex_ternlog; do
            case "$generator" in
              packed) path=regen_x86_sse_packed_forms.py ;;
              vex) path=regen_x86_sse_vex_forms.py ;;
              move) path=regen_x86_sse_move_forms.py ;;
              evex) path=regen_x86_sse_evex_forms.py ;;
              evex_mask_compare) path=regen_x86_sse_evex_mask_compare_forms.py ;;
              evex_shift_imm) path=regen_x86_sse_evex_shift_imm_forms.py ;;
              evex_ternlog) path=regen_x86_sse_evex_ternlog_forms.py ;;
            esac
            python3 tools/$path --check
          done
      - name: Isolate backend crates from private frontends
        working-directory: compiler
        run: |
          cat > Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir", "crates/opt", "crates/backend", "crates/backend-x86", "crates/backend-aarch64", "crates/backend-riscv64", "crates/backend-wasm"]
          EOF
          rm -f Cargo.lock
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler
          key: asm1-address-matrix-generated
      - name: Compile standalone assembler and compare every generated form with GAS
        working-directory: compiler
        run: |
          set -euo pipefail
          cargo build -p compiler-backend-x86 --bin compiler-x86-as
          python3 tools/test_x86_att_generated_differential.py --assembler target/debug/compiler-x86-as
          python3 tools/test_x86_att_gp_shortest.py --assembler target/debug/compiler-x86-as
          python3 tools/test_x86_att_relocation_matrix.py --assembler target/debug/compiler-x86-as
          python3 tools/test_x86_att_simd_mixed_differential.py --assembler target/debug/compiler-x86-as
          python3 tools/test_x86_att_simd_negative_matrix.py --assembler target/debug/compiler-x86-as
          python3 tools/test_x86_att_evex_disp8n_matrix.py --assembler target/debug/compiler-x86-as
          python3 tools/test_x86_att_gcc_clang_compat.py --assembler target/debug/compiler-x86-as
          python3 tools/test_fuzz_x86_att_tables.py
          python3 tools/fuzz_x86_att_tables.py --assembler target/debug/compiler-x86-as --seed 0x5eed --count 600 --rounds 4 --negative-count 50 --failure-dir asm1-fuzz-repro
          cargo test -p compiler-backend-x86 --test att_asm -- --nocapture
          cargo test -p compiler-backend-x86 --test att_gcc_clang_compat -- --nocapture
          cargo test -p compiler-backend-x86 --test att_text_alignment -- --nocapture
          cargo test -p compiler-backend-x86 --test att_module -- --nocapture
          for test in att_sse_packed att_sse_moves att_sse_vex att_sse_evex att_sse_evex_mask_compare att_sse_evex_shift_imm att_sse_evex_ternlog; do
            cargo test -p compiler-backend-x86 --test "$test" -- --nocapture
          done
          cargo test -p compiler-backend --lib -- --nocapture
          cargo test -p compiler-backend-x86 --lib -- --nocapture
      - name: Upload assembler random-seed reproducer on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: asm1-fuzz-reproducer
          path: compiler/asm1-fuzz-repro/
          if-no-files-found: ignore
      - name: Record main assembler gate status on compiler-ci commit
        if: always() && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ steps.source.outputs.source_sha }}
          JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          if [ "$JOB_STATUS" = success ]; then state=success; else state=failure; fi
          summary="compiler/main ${SOURCE_SHA:-checkout-unavailable} asm suite: $JOB_STATUS"
          gh api -X POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state="$state" \
            -f context="asm/main-source-regression" \
            -f description="${summary:0:140}" \
            -f target_url="https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
