name: ASM1 GCC and Clang O2 assembly linked oracle
on:
  pull_request:
    paths: ['.github/workflows/asm1-full-generated-oracle-20261124.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  generated-oracle:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 5de24d3283531130155b2b3b99b544d185cf1995
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
          path: compiler
      - name: Assert source pinned exactly
        working-directory: compiler
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 5de24d3283531130155b2b3b99b544d185cf1995
      - name: Validate generator source and checked output
        working-directory: compiler
        run: |
          set -euo pipefail
          python3 tools/test_regen_x86_att_forms.py
          python3 tools/regen_x86_att_forms.py --check
          for generator in packed vex move evex evex_mask_compare evex_shift_imm evex_ternlog; do
            case "$generator" in
              packed) path=regen_x86_sse_packed_forms.py ;;
              vex) path=regen_x86_sse_vex_forms.py ;;
              move) path=regen_x86_sse_move_forms.py ;;
              evex) path=regen_x86_sse_evex_forms.py ;;
              evex_mask_compare) path=regen_x86_sse_evex_mask_compare_forms.py ;;
              evex_shift_imm) path=regen_x86_sse_evex_shift_imm_forms.py ;;
              evex_ternlog) path=regen_x86_sse_evex_ternlog_forms.py ;;
            esac
            python3 tools/$path --check
          done
      - name: Isolate backend crates from private frontends
        working-directory: compiler
        run: |
          cat > Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir", "crates/opt", "crates/backend", "crates/backend-x86", "crates/backend-aarch64", "crates/backend-riscv64", "crates/backend-wasm"]
          EOF
          rm -f Cargo.lock
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler
          key: asm1-address-matrix-generated
      - name: Compile standalone assembler and compare every generated form with GAS
        working-directory: compiler
        run: |
          set -euo pipefail
          cargo build -p compiler-backend-x86 --bin compiler-x86-as
          python3 tools/test_x86_att_generated_differential.py --assembler target/debug/compiler-x86-as
          python3 tools/test_x86_att_relocation_matrix.py --assembler target/debug/compiler-x86-as
          python3 tools/test_x86_att_simd_mixed_differential.py --assembler target/debug/compiler-x86-as
          python3 tools/test_x86_att_simd_negative_matrix.py --assembler target/debug/compiler-x86-as
          python3 tools/test_x86_att_evex_disp8n_matrix.py --assembler target/debug/compiler-x86-as
          python3 tools/test_x86_att_gcc_clang_compat.py --assembler target/debug/compiler-x86-as
          cargo test -p compiler-backend-x86 --test att_asm -- --nocapture
          cargo test -p compiler-backend-x86 --test att_gcc_clang_compat -- --nocapture
          cargo test -p compiler-backend-x86 --test att_text_alignment -- --nocapture
          cargo test -p compiler-backend-x86 --test att_module -- --nocapture
          for test in att_sse_packed att_sse_moves att_sse_vex att_sse_evex att_sse_evex_mask_compare att_sse_evex_shift_imm att_sse_evex_ternlog; do
            cargo test -p compiler-backend-x86 --test "$test" -- --nocapture
          done
