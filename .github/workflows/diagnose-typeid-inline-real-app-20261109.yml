name: TypeId real rolling C source first-bad-pass diagnosis
on:
  push:
    branches: [main]
    paths: [.github/workflows/diagnose-typeid-inline-real-app-20261109.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  first-bad-pass:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 0c208bc41756e359e6d0995113bba6e83dcfd633
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Configure dependency and source pin
        run: |
          test "$(git -C compiler rev-parse HEAD)" = "0c208bc41756e359e6d0995113bba6e83dcfd633"
          git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler/tools/mini-c-driver -> target
          key: typeid-rolling-source-mini-c-20261109
      - name: Run every native TypeId core pass and first-failing GCC runtime oracle
        working-directory: compiler
        shell: bash
        run: |
          set -euo pipefail
          cargo test --manifest-path tools/mini-c-driver/Cargo.toml --release --features experimental-fusion-benchmark --test typeid_source_inline_profile checked_native_typeid_rolling_checksum_pass_bisect -- --ignored --nocapture 2>&1 | tee "$RUNNER_TEMP/typeid-bisect.log"
          grep '^TYPEID_REAL_PASS_BISECT' "$RUNNER_TEMP/typeid-bisect.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: typeid-real-source-first-bad-pass
          path: ${{ runner.temp }}/typeid-bisect.log
          if-no-files-found: ignore
