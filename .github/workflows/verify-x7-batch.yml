name: X7 batched compiler candidate validation
# Reusable manual gate: supply the exact compiler commit SHA on dispatch.
# This workflow never enables its experimental feature in default codegen.
on:
  pull_request:
    paths:
      - '.github/workflows/verify-x7-batch.yml'
  workflow_dispatch:
    inputs:
      source_ref:
        description: "Exact compiler candidate SHA (40 hex digits)"
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: x7-batch-${{ inputs.source_ref || '94d0a34c0c134d32f724e5bf248fa35ea1963578' }}
  cancel-in-progress: true
jobs:
  physical-ctz:
    name: Physical CTZ ${{ matrix.variant }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        variant: [baseline, probe]
    env:
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
      CARGO_INCREMENTAL: "0"
      SOURCE_REF: "${{ inputs.source_ref || '94d0a34c0c134d32f724e5bf248fa35ea1963578' }}"
    steps:
      - name: Validate source-ref shape
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SOURCE_REF" =~ ^[0-9a-f]{40}$ ]] || { echo "Full exact SHA required" >&2; exit 1; }
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: ${{ env.SOURCE_REF }}
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Verify exact candidate and configure public git dependencies
        shell: bash
        run: |
          set -euo pipefail
          sha="$(git -C compiler rev-parse HEAD)"
          test "$sha" = "$SOURCE_REF"
          echo "X7 tested compiler SHA: $sha, mode: ${{ matrix.variant }}" >> "$GITHUB_STEP_SUMMARY"
          git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
          git config --global --add url."https://github.com/".insteadOf "git@github.com:"
      - name: Restrict workspace to core source crates
        shell: bash
        run: |
          cat > compiler/Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir", "crates/opt", "crates/backend", "crates/backend-x86"]
          EOF
          rm -f compiler/Cargo.lock
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: x7-batch-${{ matrix.variant }}
      - name: Native TypeId CTZ independent C11 GAS/ELF oracle
        shell: bash
        working-directory: compiler
        run: |
          set -euo pipefail
          if test "${{ matrix.variant }}" = probe; then
            cargo test -p compiler-backend-x86 --test x7_ctz_bsf_zeroing_probe --features x7-bsf-zeroing-probe -- --nocapture
          else
            cargo test -p compiler-backend-x86 --test x7_ctz_bsf_zeroing_probe -- --nocapture
          fi
      - name: Existing narrow CTZ regression and measured dependency tests
        shell: bash
        working-directory: compiler
        run: |
          set -euo pipefail
          if test "${{ matrix.variant }}" = probe; then
            cargo test -p compiler-backend-x86 --test review_narrow_compare_ctz_oracle --features x7-bsf-zeroing-probe
            cargo test -p compiler-backend-x86 --test x7_measured_bsf_dependencies --features x7-bsf-zeroing-probe
          else
            cargo test -p compiler-backend-x86 --test review_narrow_compare_ctz_oracle
            cargo test -p compiler-backend-x86 --test x7_measured_bsf_dependencies
          fi
      - name: Bind real pinned Intel bit-count iforms to generic B2/B3 proof work
        shell: bash
        working-directory: compiler
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tools -p 'test_x86_isl_source_form_cohort.py' -v
          python3 -m unittest discover -s tools -p 'test_x86_iform_helper_dependencies.py' -v
          python3 -m unittest discover -s tools -p 'test_x86_iform_proof_work_dag.py' -v
          mkdir -p /tmp/intel-x7-source-cohort
          intel_rev=35eface1b7ee003a1cda95005ec5fd83de658a64
          for instruction in POPCNT LZCNT TZCNT; do
            curl --fail --silent --show-error --location --retry 3 --max-time 40 \
              "https://raw.githubusercontent.com/intel/SDM/${intel_rev}/data/instruction/${instruction}.xml" \
              --output "/tmp/intel-x7-source-cohort/${instruction}.xml"
          done
          python3 tools/x86_iform_helper_dependencies.py \
            --xml-dir /tmp/intel-x7-source-cohort \
            --out /tmp/x7-bitcount-b2-index.json --shards 4
          python3 tools/x86_iform_proof_work_dag.py \
            --dependency-index /tmp/x7-bitcount-b2-index.json \
            --out /tmp/x7-bitcount-b3-queue.json --shards 4
          python3 tools/x86_isl_source_form_cohort.py \
            --dependency-index /tmp/x7-bitcount-b2-index.json \
            --proof-work-queue /tmp/x7-bitcount-b3-queue.json \
            --out /tmp/x7-bitcount-original-source-cohort.json
          python3 - <<'PY'
          import json
          p=json.load(open("/tmp/x7-bitcount-original-source-cohort.json"))
          assert p["physical_variants"] == 12, p["summary"]
          assert p["original_source_iform_candidates"] == 12, p["summary"]
          assert p["summary"]["newly_selection_eligible_forms"] == 0
          assert p["summary"]["original_semantic_proofs_completed"] == 0
          assert all(r["status"].startswith("matched_original_source")
                     for r in p["records"]), p["summary"]
          assert all(not r["selection_eligible"]
                     for r in p["records"])
          print("X7_REAL_BITCOUNT_ISL_COHORT_MATCH_PASS",p["summary"])
          PY
      - name: Backend normal and no-default build checks
        shell: bash
        working-directory: compiler
        run: |
          set -euo pipefail
          if test "${{ matrix.variant }}" = probe; then
            cargo check -p compiler-backend-x86 --features x7-bsf-zeroing-probe
            cargo check -p compiler-backend-x86 --no-default-features --features x7-bsf-zeroing-probe
          else
            cargo check -p compiler-backend-x86
            cargo check -p compiler-backend-x86 --no-default-features
          fi
