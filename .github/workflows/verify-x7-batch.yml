name: X7 explicit target feature validation
on:
  pull_request:
    paths: ['.github/workflows/verify-x7-batch.yml']
permissions:
  contents: read
jobs:
  target-ctz:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        variant: [baseline, probe]
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: d2008f1effce37aebc8e1132afdeb1c9b8a43582
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Verify exact source and restrict workspace
        run: |
          set -euo pipefail
          test "$(git -C compiler rev-parse HEAD)" = d2008f1effce37aebc8e1132afdeb1c9b8a43582
          git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
          git config --global --add url."https://github.com/".insteadOf "git@github.com:"
          cat > compiler/Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir", "crates/opt", "crates/backend", "crates/backend-x86"]
          EOF
          rm -f compiler/Cargo.lock
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: x7-batch-${{ matrix.variant }}
      - name: Explicit target TypeId GAS/ELF and narrow fallback oracles
        working-directory: compiler
        run: |
          set -euo pipefail
          args=()
          if test "${{ matrix.variant }}" = probe; then
            args+=(--features x7-tzcnt-native-probe)
          fi
          cargo test -p compiler-backend-x86 "${args[@]}" --test x86_tzcnt_typeid_native --test review_narrow_compare_ctz_oracle -- --nocapture
          cargo check -p compiler-backend-x86 --no-default-features "${args[@]}"
