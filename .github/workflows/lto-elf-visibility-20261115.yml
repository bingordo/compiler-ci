name: LTO source ELF visibility preservation
on:
  push:
    branches: [verify/lto-elf-visibility-20261115]
    paths: ['.github/workflows/lto-elf-visibility-20261115.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  visibility:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 2a4a017ccadf7d64d6b1a54f93bf2ecd97d48bcc
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Verify pinned source and public Git dependencies
        run: |
          test "$(git -C compiler rev-parse HEAD)" = "2a4a017ccadf7d64d6b1a54f93bf2ecd97d48bcc"
          git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
      - name: Isolate native compiler driver workspace
        run: |
          cat > compiler/Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir", "crates/opt", "crates/backend", "crates/backend-x86", "crates/backend-aarch64", "crates/driver"]
          EOF
          rm -f compiler/Cargo.lock
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: lto-elf-visibility
      - name: ELF visibility integration and existing LTO regressions
        working-directory: compiler
        run: |
          cargo test -p compiler --test lto_elf_visibility -- --nocapture
          cargo test -p compiler --test lto_coemit
          cargo test -p compiler --test lto_mixed_link
          cargo test -p compiler --test lto_source_sidecar
          cargo test -p compiler --test lto_generated_abi_memory
      - name: Strict targeted visibility lint
        working-directory: compiler
        run: cargo clippy -p compiler --test lto_elf_visibility -- -D warnings
