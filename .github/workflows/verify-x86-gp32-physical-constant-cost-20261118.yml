name: source-pinned x86 GP32 constant encoding cost and native A B
on:
  push:
    branches: [main]
    paths: [.github/workflows/verify-x86-gp32-physical-constant-cost-20261118.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  gp32-physical-bytes:
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 1fe73d13f1fa4be32f71864f2457f7b76451f39f
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Pinned source and generated ISA invariants
        run: |
          set -euo pipefail
          test "$(git -C compiler rev-parse HEAD)" = "1fe73d13f1fa4be32f71864f2457f7b76451f39f"
          git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
          (cd compiler && python3 tools/regen_x86_forms.py --check)
          (cd compiler && python3 -m unittest discover -s tools -p 'test_regen_x86_forms.py' -v)
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: gp32-physical-cost-20261118
      - name: Verify exact MOV/XOR costs, native ELF/GAS A/B, ALU CMP and cross-backend
        working-directory: compiler
        run: |
          set -euo pipefail
          cargo test -p compiler-backend-x86 --lib i32_immediate_physical_cost_native_tests -- --nocapture
          cargo test -p compiler-backend-x86 --lib reviewed_scalar_immediate32_native_tests -- --nocapture
          cargo test -p compiler-backend-x86 --lib reviewed_bitwise_immediate_native_tests -- --nocapture
          cargo test -p compiler-backend-x86 --lib
          cargo test -p compiler-backend --lib
          cargo test -p compiler-backend-aarch64 --lib
          cargo clippy -p compiler-backend --lib -- --no-deps -D warnings
          cargo clippy -p compiler-backend-x86 --lib -- --no-deps -D warnings -A dead_code
          cargo test -p compiler --test x7_s4_rolling_checksum_source -- --nocapture
