name: LTO apply TypeId mapping verification
on:
  push:
    branches: [verify/lto-apply-type-map-20261114]
    paths: ['.github/workflows/lto-apply-type-map-20261114.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-type-map:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 964efec20404b6916df6b1c06a552c6b09cd0d8f
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Assert pinned source
        run: test "$(git -C compiler rev-parse HEAD)" = "964efec20404b6916df6b1c06a552c6b09cd0d8f"
      - name: Focus IR crate
        run: |
          cat > compiler/Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir"]
          EOF
          rm -f compiler/Cargo.lock
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: lto-apply-type-map
      - name: Type-map regression full suite and lint
        working-directory: compiler
        run: |
          cargo test -p compiler-ir --test lto_apply_type_map
          cargo test -p compiler-ir
          cargo clippy -p compiler-ir --tests -- -D warnings
