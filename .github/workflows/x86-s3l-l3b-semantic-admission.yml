name: X7 S3.L L3b production generic semantic SMT admission gate
on:
  pull_request:
    paths:
      - '.github/workflows/x86-s3l-l3b-semantic-admission.yml'
permissions:
  contents: read
  actions: read
jobs:
  source-proof-to-production-index:
    runs-on: ubuntu-24.04
    timeout-minutes: 34
    env:
      SOURCE_SHA: 'c9002e02c4633e9d8afd60dfcf68d47a7df99d65'
      PYTHONPATH: compiler/tools
      X7_S3L_L3B_S3F: /tmp/x7-s3l-l3b/s3f/source-xed-effects.json
      X7_S3L_L3B_S3G: /tmp/x7-s3l-l3b/s3g/real-selector-decisions.json
      X7_S3L_L3B_S3H: /tmp/x7-s3l-l3b/s3h/native-i64-source-decisions.json
      X7_S3L_L3B_S3J: /tmp/x7-s3l-l3b/s3j/add-sub-source-proof.json
      X7_S3L_L3B_S3K: /tmp/x7-s3l-l3b/s3k/source-cmp-flags-admission.json
      X7_S3L_L3B_OP: /tmp/x7-s3l-l3b/generic/operations.json
      X7_S3L_L3B_HELPERS: /tmp/x7-s3l-l3b/generic/helpers.json
      X7_S3L_L3B_SMT: /tmp/x7-s3l-l3b/generic/semantics-z3.json
    steps:
      - name: Checkout exact compiler source without compiler Actions
        uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: c9002e02c4633e9d8afd60dfcf68d47a7df99d65
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: x7-s3f-source-xed-flag-effect-no-admission
          run-id: 43667287999
          repository: bingordo/compiler-ci
          github-token: ${{ github.token }}
          path: /tmp/x7-s3l-l3b/s3f
      - uses: actions/download-artifact@v4
        with:
          name: x7-s3g-actual-selector-decision-evidence
          run-id: 43670305205
          repository: bingordo/compiler-ci
          github-token: ${{ github.token }}
          path: /tmp/x7-s3l-l3b/s3g
      - uses: actions/download-artifact@v4
        with:
          name: x7-s3h-native-typeid-i64-fusion-source-decisions
          run-id: 43675286039
          repository: bingordo/compiler-ci
          github-token: ${{ github.token }}
          path: /tmp/x7-s3l-l3b/s3h
      - uses: actions/download-artifact@v4
        with:
          name: x7-s3j-add-sub-source-ir-proof
          run-id: 43682964277
          repository: bingordo/compiler-ci
          github-token: ${{ github.token }}
          path: /tmp/x7-s3l-l3b/s3j
      - uses: actions/download-artifact@v4
        with:
          name: x7-s3k-flags-only-cmp-source-native-evidence
          run-id: 43684448812
          repository: bingordo/compiler-ci
          github-token: ${{ github.token }}
          path: /tmp/x7-s3l-l3b/s3k
      - name: Import newly proven generic Intel source helper SMT without rerunning old per-op scripts
        uses: actions/download-artifact@v4
        with:
          name: x7-s3l-l2b-l3a-9-ops-generic-helper-smt-source-evidence
          run-id: 43687620382
          repository: bingordo/compiler-ci
          github-token: ${{ github.token }}
          path: /tmp/x7-s3l-l3b/generic
      - name: Reproduce single production source-admission table requiring all 12 generic SMT proofs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C compiler rev-parse HEAD)" = "$SOURCE_SHA"
          for file in "$X7_S3L_L3B_S3F" "$X7_S3L_L3B_S3G" "$X7_S3L_L3B_S3H" \
                      "$X7_S3L_L3B_S3J" "$X7_S3L_L3B_S3K" "$X7_S3L_L3B_OP" \
                      "$X7_S3L_L3B_HELPERS" "$X7_S3L_L3B_SMT"; do
            test -s "$file"
          done
          mkdir -p /tmp/x7-s3l-l3b/out
          python3 compiler/tools/x86_s3l_batch_admission.py \
            --s3f "$X7_S3L_L3B_S3F" --s3g "$X7_S3L_L3B_S3G" \
            --s3h "$X7_S3L_L3B_S3H" --s3j "$X7_S3L_L3B_S3J" \
            --s3k "$X7_S3L_L3B_S3K" \
            --operation-ast "$X7_S3L_L3B_OP" \
            --helper-ast "$X7_S3L_L3B_HELPERS" \
            --generic-smt "$X7_S3L_L3B_SMT" \
            --out /tmp/x7-s3l-l3b/out/source-admission.json
          git -C compiler diff --exit-code -- \
            crates/backend-x86/src/generated_x7_s3l_batch_admissions.rs
          python3 compiler/tools/x86_s3l_batch_admission.py \
            --s3f "$X7_S3L_L3B_S3F" --s3g "$X7_S3L_L3B_S3G" \
            --s3h "$X7_S3L_L3B_S3H" --s3j "$X7_S3L_L3B_S3J" \
            --s3k "$X7_S3L_L3B_S3K" \
            --operation-ast "$X7_S3L_L3B_OP" \
            --helper-ast "$X7_S3L_L3B_HELPERS" \
            --generic-smt "$X7_S3L_L3B_SMT" \
            --out /tmp/x7-s3l-l3b/out/source-admission.json --check
          echo X7_S3L_L3B_SOURCE_PROVEN_RUST_BATCH_IDENTICAL_PASS
      - name: Negative source, wrong IR class, defined flags, implicit CF and missing-width proofs
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest -v \
            test_x86_s3l_batch_admission \
            test_x86_s3l_l3b_generic_proof_gate
          echo X7_S3L_L3B_PROOF_TO_ADMISSION_NEGATIVE_MUTATIONS_PASS
      - name: Isolate rust backend workspace from unrelated dependencies
        shell: bash
        run: |
          cd compiler
          python3 - <<'PY'
          from pathlib import Path
          Path("Cargo.toml").write_text("""[workspace]
          resolver = "2"
          members = ["crates/ir", "crates/opt", "crates/backend", "crates/backend-x86"]
          """)
          PY
      - name: Verify same real TypeId/postalloc source-verified selection and feature gate
        shell: bash
        run: |
          set -euo pipefail
          cd compiler
          cargo test -p compiler-backend-x86 \
            --features 'x7-native-form-validation x7-c-defined-64 x7-c-defined-bitwise' \
            --lib x7_native_form_bridge --offline
          cargo test -p compiler-backend-x86 \
            --features 'x7-native-form-validation x7-c-defined-64 x7-c-defined-bitwise' \
            --lib x7_late_selector --offline
          cargo test -p compiler-backend-x86 \
            --features 'x7-native-form-validation x7-c-defined-64 x7-c-defined-bitwise' \
            --test x7_s3j_arithmetic_ir_admission --offline
          cargo test -p compiler-backend-x86 \
            --features 'x7-native-form-validation x7-c-defined-64 x7-c-defined-bitwise' \
            --test x7_s3k_cmp_native --offline
          cargo test -p compiler-backend-x86 \
            --features 'x7-c-defined-64 x7-c-defined-bitwise' \
            --lib native_typeid::reviewed_i64_source_tests --offline
      - name: Validate strict no-default fallback
        shell: bash
        run: |
          cd compiler
          cargo test -p compiler-backend-x86 --no-default-features \
            --features x7-native-form-validation \
            --test x7_s3k_cmp_native --offline
          cargo test -p compiler-backend-x86 --no-default-features \
            --test x7_g10_n15_no_default_fallback --offline
      - name: Archive one source/XED/helper/Z3 admission and rejection report
        uses: actions/upload-artifact@v4
        with:
          name: x7-s3l-l3b-generic-semantics-gated-production-admission
          path: /tmp/x7-s3l-l3b/out/source-admission.json
          if-no-files-found: error
