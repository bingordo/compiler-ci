# Single-purpose, immutable-source validation for compiler PR #338.
name: Verify PR338 native TypeId SSA value flow
on:
  push:
    branches: [ci/pr338-typeid-flow]
permissions:
  contents: read
jobs:
  verifier:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 7afa22316aa72f10926fd4697ac166a90283d094
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Pin exact compiler SHA
        run: test "$(git -C compiler rev-parse HEAD)" = "7afa22316aa72f10926fd4697ac166a90283d094"
      - name: Use independent core workspace
        run: |
          cat > compiler/Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir", "crates/opt", "crates/backend", "crates/backend-x86"]
          EOF
          rm -f compiler/Cargo.lock
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: typed-flow-pr338
          cache-workspace-crates: 'true'
      - name: Native TypeId value-flow mutation matrix
        working-directory: compiler
        run: cargo test -p compiler-ir --test typed_value_flow
      - name: Full self-contained compiler core and backend regression
        working-directory: compiler
        run: cargo test -p compiler-ir -p compiler-opt -p compiler-backend -p compiler-backend-x86
      - name: Strict IR verifier Clippy
        working-directory: compiler
        run: cargo clippy -p compiler-ir --all-targets -- -D warnings
