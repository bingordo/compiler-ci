name: Mini-C 2824 ABI source probe
on:
  push:
    branches:
      - ci/mini-c-checked-aggregate-abi-2824
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: a3b82e54e02370eb2f151b5988165904727e7185
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Confirm source and public pin
        run: |
          set -euo pipefail
          test "$(git -C compiler rev-parse HEAD)" = a3b82e54e02370eb2f151b5988165904727e7185
          python3 - <<'PY'
          from pathlib import Path
          p=Path("compiler/tools/mini-c-driver/Cargo.toml")
          x=p.read_text()
          assert x.count("ssh://git@github.com/bingordo/mini-c.git")==2
          p.write_text(x.replace("ssh://git@github.com/bingordo/mini-c.git","https://github.com/bingordo/mini-c.git"))
          PY
      - name: Focused checked aggregate ABI and full Mini-C library tests
        run: |
          set -euo pipefail
          timeout 20m cargo test --manifest-path compiler/tools/mini-c-driver/Cargo.toml -p compiler-mini-c --lib aggregate_abi::tests
          timeout 8m cargo test --manifest-path compiler/tools/mini-c-driver/Cargo.toml -p compiler-mini-c --lib
