name: X7 IP2 original Intel helper source value SMT
on:
  pull_request:
    paths: ['.github/workflows/verify-x7-ip2-helper-source-smt-20261118.yml']
permissions:
  contents: read
jobs:
  helper-source-smt:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 58be430d50aabd12c792441a9fa61c60c2f7b126
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Install Z3 CLI and Python bindings
        run: |
          set -euo pipefail
          sudo apt-get install -y z3 python3-z3
          /usr/bin/python3 -c 'import z3; print(z3.get_version_string())'
      - name: Exact-source Intel helper evaluator, IR SMT and mutation tests
        working-directory: compiler
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "58be430d50aabd12c792441a9fa61c60c2f7b126"
          python3 -m py_compile tools/x7_ip2_helper_source_smt.py tools/test_x7_ip2_helper_source_smt.py
          PYTHONPATH=/usr/lib/python3/dist-packages:tools /usr/bin/python3 -m unittest -v test_x7_ip2_helper_source_smt test_x7_ip2_original_source_graph test_x7_ip2_semantic_certificate_join test_x7_ip2_ir_equivalence
          echo X7_IP2_HELPER_VALUE_SMT_PASS
