name: Verify IR binary PR 1115 on compiler-ci
on:
  pull_request:
    paths:
      - '.github/workflows/verify-ir-binary-pr1115.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-ir-binary:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout pinned compiler PR head
        uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: db4a69199986c1c91ef1aded223d6e41b5d9fba4
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Verify exact compiler source
        run: |
          test "$(git -C compiler rev-parse HEAD)" = "db4a69199986c1c91ef1aded223d6e41b5d9fba4"
      - name: Restrict workspace to dependency-independent core
        run: |
          cat > compiler/Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir", "crates/opt", "crates/backend", "crates/backend-x86"]
          EOF
          rm -f compiler/Cargo.lock
      - name: Reuse core build cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: native-ir-binary
          cache-workspace-crates: 'true'
      - name: Run binary serialization and corruption regression
        working-directory: compiler
        run: |
          cargo test -p compiler-ir --test native_binary_v1 -- --nocapture
          cargo test -p compiler-ir --test native_binary_corruption_matrix -- --nocapture
          cargo test -p compiler-ir --test native_module_cli -- --nocapture
      - name: Run IR crate tests and strict lint
        working-directory: compiler
        run: |
          cargo test -p compiler-ir
          cargo clippy -p compiler-ir --all-targets -- -D warnings
