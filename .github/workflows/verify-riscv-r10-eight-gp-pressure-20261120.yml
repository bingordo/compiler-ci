name: RV64 R10 eight GP pressure GCC QEMU oracle
on:
  workflow_dispatch:
  # Exact implementation pin; official Actions only in compiler-ci.
  push:
    branches: [main, 'ci/riscv-r10-eight-gp-pressure-20261120']
    paths: ['.github/workflows/verify-riscv-r10-eight-gp-pressure-20261120.yml']
permissions:
  contents: read
jobs:
  rv64-differential:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Permit private pinned frontend dependency checkout
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.CI_KEY }}
      - name: Configure GitHub trusted SSH host
        run: ssh-keyscan github.com >> ~/.ssh/known_hosts
      - name: Checkout exact compiler implementation revision
        uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 9465d03fba6dde3ab6bafc52ea40510afd781840
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Fail on unexpected source SHA
        run: test "$(git -C compiler rev-parse HEAD)" = 9465d03fba6dde3ab6bafc52ea40510afd781840
      - name: Log reproducible selected source revision
        run: git -C compiler rev-parse HEAD
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Validate deterministic generator, ISA tests and real compiler
        shell: bash
        working-directory: compiler
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tools/tests -p test_riscv_source_differential.py -v
          python3 -m unittest discover -s tools/tests -p test_riscv_pressure_oracle.py -v
          python3 -m unittest discover -s tools -p test_riscv_native_selector_rules.py -v
          seed=20261121
          echo "RV64 generator seed=$seed"
          python3 tools/riscv_source_differential.py --output /tmp/rv64-diff --count 198 --vectors 24 --shard-size 96 --include-three-arg --include-four-arg --include-extended-gp --seed "$seed"
          python3 tools/riscv_source_differential.py --output /tmp/rv64-diff-replay --count 198 --vectors 24 --shard-size 96 --include-three-arg --include-four-arg --include-extended-gp --seed "$seed"
          diff -qr /tmp/rv64-diff /tmp/rv64-diff-replay
          python3 -c 'import json; x=json.load(open("/tmp/rv64-diff/manifest.json")); assert x["source_count"]==198 and x["total_comparisons"]==4752 and x["shard_count"]==50 and x["includes_three_arg"] and x["includes_four_arg"] and x["includes_extended_gp"]'
          cargo test -p compiler --test riscv64_source_preview
          cargo test -p compiler --test riscv64_load_ir
          # Existing selector.rs schematic rustdoc is not executable Rust; scope to code tests.
          cargo test -p compiler-backend-riscv64 --lib --tests
          cargo clippy -p compiler-backend-riscv64 --lib -- -D warnings
          # On this pinned main revision the unrelated x86 driver has
          # Driver depends on generated compiler-opt shadow functions whose
          # spare view/width formals have unrelated unused-variable warnings.
          # Keep the native RISC-V crate -D warnings strict above and scope
          # this exception to the full driver Clippy integration step.
          # Keep the RISC-V crate strict; scope those three exceptions to
          # the non-RV64 driver binary for this acceptance workflow.
          cargo clippy -p compiler --bin compiler -- -D warnings \
            -A clippy::too_many_arguments -A unused-imports \
            -A dead-code -A clippy::needless_return \
            -A clippy::empty_line_after_doc_comments -A unused-variables
          cargo build -p compiler --bin compiler
          python3 tools/regen_riscv_native_selector_rules.py --check
          python3 tools/riscv_udb_rust_leaf_forms.py \
            --catalog data/riscv_udb_r0_catalog.json \
            --output crates/backend-riscv64/src/generated_encoding.rs --check
      - name: Install independent RV64 GNU GCC binutils and QEMU
        run: |
          # Ubuntu hosted runner already has apt indexes. Avoid a slow,
          # unnecessary global index refresh; bound infrastructure delays.
          sudo env DEBIAN_FRONTEND=noninteractive timeout 600s apt-get install -y \
            --no-install-recommends gcc-riscv64-linux-gnu \
            binutils-riscv64-linux-gnu qemu-user
      - name: Independent ADDIW truncation byte parity and real LP64 QEMU oracle
        shell: bash
        working-directory: compiler
        run: |
          set -euo pipefail
          for tag in truncneg trunchigh truncclear truncmin; do
            cargo run -p compiler-backend-riscv64 --example rv64_leaf -- \
              "/tmp/rv64_${tag}.o" "/tmp/rv64_${tag}.s" "${tag}" --isa=rv64i
            grep -E 'addiw x[0-9]+, x[0-9]+, 0' "/tmp/rv64_${tag}.s"
            riscv64-linux-gnu-as -march=rv64i -mabi=lp64 \
              "/tmp/rv64_${tag}.s" -o "/tmp/rv64_${tag}_gas.o"
            riscv64-linux-gnu-objcopy -O binary -j .text \
              "/tmp/rv64_${tag}.o" "/tmp/rv64_${tag}_native.bin"
            riscv64-linux-gnu-objcopy -O binary -j .text \
              "/tmp/rv64_${tag}_gas.o" "/tmp/rv64_${tag}_gas.bin"
            cmp "/tmp/rv64_${tag}_native.bin" "/tmp/rv64_${tag}_gas.bin"
            riscv64-linux-gnu-readelf -A "/tmp/rv64_${tag}.o" | \
              grep -F 'Tag_RISCV_arch: "rv64i2p1"'
          done
          cat > /tmp/rv64_trunc_main.s <<'EOF'
          .option norvc
          .option norelax
          .text
          .globl _start
          _start:
            mv s0, sp
            call rv64_trunc_neg
            li t0, -1
            bne a0, t0, fail
            bne sp, s0, fail
            call rv64_trunc_high
            li t0, -2023406815
            bne a0, t0, fail
            bne sp, s0, fail
            call rv64_trunc_clear
            bne a0, x0, fail
            bne sp, s0, fail
            call rv64_trunc_min
            bne a0, x0, fail
            bne sp, s0, fail
            li a0, 0
            j exit
          fail:
            li a0, 1
          exit:
            li a7, 93
            ecall
          EOF
          riscv64-linux-gnu-as -march=rv64i -mabi=lp64 \
            /tmp/rv64_trunc_main.s -o /tmp/rv64_trunc_main.o
          riscv64-linux-gnu-ld -m elf64lriscv -static --no-relax -e _start \
            /tmp/rv64_trunc_main.o /tmp/rv64_truncneg.o /tmp/rv64_trunchigh.o \
            /tmp/rv64_truncclear.o /tmp/rv64_truncmin.o -o /tmp/rv64_trunc.elf
          timeout 15s qemu-riscv64 /tmp/rv64_trunc.elf
          echo 'Four RV64I reviewed ADDIW 64-to-32 truncation cases passed GAS/QEMU'
      - name: Compile 198 generated Mini-C and GCC source pairs including eight GP arguments
        shell: bash
        working-directory: compiler
        run: |
          set -euo pipefail
          root=/tmp/rv64-diff
          mkdir -p "$root/objects"
          driver="$PWD/target/debug/compiler"
          while IFS=$'\t' read -r fn reference isa; do
            "$driver" "$root/src/$fn.c" --target riscv64 --riscv-source \
              --riscv-isa "$isa" --emit obj -o "$root/objects/$fn.o"
            riscv64-linux-gnu-gcc -march=rv64im -mabi=lp64 -O2 \
              -ffreestanding -fno-builtin -fno-pie -fno-stack-protector \
              -fwrapv -c "$root/ref/$reference.c" \
              -o "$root/objects/$reference.o"
            test -s "$root/objects/$fn.o"
            test -s "$root/objects/$reference.o"
          done < "$root/plan.tsv"
          count="$(find "$root/objects" -name '*.o' | wc -l)"
          test "$count" -eq 396
          echo "Compiled 198 RV64 Mini-C source and 198 independent GCC reference objects"
      - name: 4752 LP64 QEMU source-vs-GCC eight-argument comparisons in 50 shards
        shell: bash
        working-directory: compiler
        run: |
          set -euo pipefail
          root=/tmp/rv64-diff
          shopt -s nullglob
          objects=("$root"/objects/*.o)
          test "${#objects[@]}" -eq 396
          passed=0
          for asm in "$root"/harness/diff_*.s; do
            base="${asm%.s}"
            riscv64-linux-gnu-as -march=rv64im -mabi=lp64 "$asm" -o "$base.o"
            riscv64-linux-gnu-ld -m elf64lriscv -static --no-relax -e _start \
              "$base.o" "${objects[@]}" -o "$base.elf"
            set +e
            timeout 20s qemu-riscv64 "$base.elf"
            status=$?
            set -e
            if [ "$status" -ne 0 ]; then
              echo "RV64 mismatch: $(basename "$base") exit=$status" >&2
              python3 -c 'import json,sys; n=int(sys.argv[2]); items=json.load(open(sys.argv[1])); print("Failing vector:",items[n-1] if 1<=n<=len(items) else "stack mismatch or non-test exit")' "$base.json" "$status"
              exit 1
            fi
            passed=$((passed+1))
          done
          test "$passed" -eq 50
          echo "PASSED all 4752 independent C source/GCC QEMU comparisons in 50 shards"
      - name: Eight GP ingress under callee-saved pressure, spills and GCC/QEMU oracle
        shell: bash
        working-directory: compiler
        run: |
          set -euo pipefail
          root=/tmp/rv64-pressure
          python3 tools/riscv_pressure_oracle.py --output "$root" --seed 20261120 --vectors 24
          python3 tools/riscv_pressure_oracle.py --output /tmp/rv64-pressure-replay --seed 20261120 --vectors 24
          diff -qr "$root" /tmp/rv64-pressure-replay
          python3 -c 'import json; m=json.load(open("/tmp/rv64-pressure/manifest.json")); assert len(m["cases"])==2 and m["vector_count"]==24'
          for kind in pressure16 pressure48; do
            # Both native ELF and assembler are emitted from the SAME verified
            # eight-argument TypeId SSA fixture (real RA, frame and selector).
            cargo run -p compiler-backend-riscv64 --example rv64_leaf -- \
              "$root/$kind.o" "$root/$kind"_native.s "$kind" --isa=rv64i
            riscv64-linux-gnu-as -march=rv64i -mabi=lp64 \
              "$root/$kind"_native.s -o "$root/$kind"_gas.o
            riscv64-linux-gnu-objcopy -O binary -j .text \
              "$root/$kind.o" "$root/$kind"_native.bin
            riscv64-linux-gnu-objcopy -O binary -j .text \
              "$root/$kind"_gas.o "$root/$kind"_gas.bin
            cmp "$root/$kind"_native.bin "$root/$kind"_gas.bin
            grep -q 'addi x28, x13, 0' "$root/$kind"_native.s
            for reg in 14 15 16 17; do
              grep -q "sd x$reg, " "$root/$kind"_native.s
            done
            # Independent GCC reference: no handwritten expected machine code.
            riscv64-linux-gnu-gcc -march=rv64im -mabi=lp64 -O2 \
              -ffreestanding -fno-builtin -fno-pie -fno-stack-protector \
              -fwrapv -c "$root/gcc_$kind.c" -o "$root/gcc_$kind.o"
            riscv64-linux-gnu-as -march=rv64im -mabi=lp64 \
              "$root/$kind.s" -o "$root/$kind"_harness.o
            riscv64-linux-gnu-ld -m elf64lriscv -static --no-relax -e _start \
              "$root/$kind"_harness.o "$root/$kind.o" \
              "$root/gcc_$kind.o" -o "$root/$kind.elf"
            set +e
            timeout 20s qemu-riscv64 "$root/$kind.elf"
            status=$?
            set -e
            if [ "$status" -ne 0 ]; then
              echo "R10 pressure $kind failed: qemu exit $status" >&2
              python3 -c 'import json,sys; m=json.load(open(sys.argv[1])); kind=sys.argv[2]; n=int(sys.argv[3]); c=next(x for x in m["cases"] if x["name"]==kind); print("Failing vector:", c["vectors"][n-1] if 1<=n<=len(c["vectors"]) else "unclassified runtime error")' "$root/manifest.json" "$kind" "$status"
              exit 1
            fi
            echo "$kind passed: 24 eight-GP GCC differential vectors, SP, s1, s2..s11, native/GAS byte parity"
          done
          echo "PASSED 48 pressure vectors and all LP64 callee-saved/SP checks"
      - name: Archive generated failing source and QEMU vector reproducers
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rv64-r10-eight-gp-pressure-repro-${{ github.run_id }}
          path: |
            /tmp/rv64-diff/manifest.json
            /tmp/rv64-diff/plan.tsv
            /tmp/rv64-diff/src/
            /tmp/rv64-diff/ref/
            /tmp/rv64-diff/harness/
            /tmp/rv64-pressure/
          if-no-files-found: warn
          retention-days: 14
