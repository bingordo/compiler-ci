# Source-pinned focused IR tail-call admission test; never compiler-repo Actions.
name: Issue545 indirect musttail proof
on:
  pull_request:
    paths:
      - '.github/workflows/issue545-indirect-proof-3468.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  indirect-ir:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact compiler candidate
        uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 4d86d5b915e6c40229da60357bfe26794778c973
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Verify compiler source SHA
        run: test "$(git -C compiler rev-parse HEAD)" = '4d86d5b915e6c40229da60357bfe26794778c973'
      - uses: dtolnay/rust-toolchain@stable
      - name: Build isolated IR workspace
        run: |
          mkdir -p work/crates
          cp -a compiler/crates/ir work/crates/
          cat > work/Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir"]
          EOF
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: work
          key: issue545-indirect-proof-3468
      - name: Check focused native IR library and test
        working-directory: work
        run: cargo check -p compiler-ir --lib --test musttail_indirect_admission
      - name: Run focused indirect required-tail admission tests
        working-directory: work
        run: cargo test -p compiler-ir --test musttail_indirect_admission -- --nocapture
      - name: Run existing native IR tests
        working-directory: work
        run: cargo test -p compiler-ir --lib -- --test-threads=2
      - name: Clippy correctness
        working-directory: work
        run: cargo clippy -p compiler-ir --lib --test musttail_indirect_admission -- -D clippy::correctness
