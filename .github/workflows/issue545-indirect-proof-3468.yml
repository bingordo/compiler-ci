# Source-pinned focused IR tail-call admission test; never compiler-repo Actions.
name: Issue545 x86 and AArch64 indirect tail ABI
on:
  pull_request:
    paths:
      - '.github/workflows/issue545-indirect-proof-3468.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  indirect-ir:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact compiler candidate
        uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: d9dc72e035e69a8451747e7734e3e7e2ee293ac8
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Verify compiler source SHA
        run: test "$(git -C compiler rev-parse HEAD)" = 'd9dc72e035e69a8451747e7734e3e7e2ee293ac8'
      - uses: dtolnay/rust-toolchain@stable
      - name: Build isolated IR workspace
        run: |
          mkdir -p work/crates
          cp -a compiler/crates/ir compiler/crates/backend compiler/crates/backend-aarch64 compiler/crates/backend-x86 compiler/crates/opt work/crates/
          cat > work/Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir", "crates/backend", "crates/backend-aarch64", "crates/backend-x86", "crates/opt"]
          EOF
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: work
          key: issue545-indirect-proof-3468
      - name: Check focused native IR library and test
        working-directory: work
        run: cargo check -p compiler-ir --lib --test musttail_indirect_admission
      - name: Run focused indirect required-tail admission tests
        working-directory: work
        run: cargo test -p compiler-ir --test musttail_indirect_admission -- --nocapture
      - name: Run existing native IR tests
        working-directory: work
        run: cargo test -p compiler-ir --lib -- --test-threads=2
      - name: Clippy correctness
        working-directory: work
        run: cargo clippy -p compiler-ir --lib --test musttail_indirect_admission -- -D clippy::correctness
      - name: Compile x86 indirect sibling JMP
        working-directory: work
        run: cargo check -p compiler-backend-x86 --test tail_indirect_native
      - name: x86 ELF/GAS PIC/frame linked execution and old tail regression
        working-directory: work
        run: cargo test -p compiler-backend-x86 --test tail_indirect_native --test tailcall_native -- --nocapture
      - name: Check AArch64 sibling-branch regression
        working-directory: work
        run: cargo check -p compiler-backend-aarch64 --test tail_indirect_native --test musttail_indirect_native
      - name: Cross-compiler and QEMU for independent C11 oracle
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends qemu-user gcc-aarch64-linux-gnu libc6-dev-arm64-cross
      - name: Native AArch64 direct/indirect tail ABI execution (ELF and GAS)
        working-directory: work
        env:
          COMPILER_REQUIRE_AARCH64_QEMU: "1"
        run: cargo test -p compiler-backend-aarch64 --test tail_indirect_native --test tail_call_native --test musttail_indirect_native -- --nocapture
      - name: AArch64 Clippy correctness
        working-directory: work
        run: cargo clippy -p compiler-backend-aarch64 --lib --test tail_indirect_native --test musttail_indirect_native -- -D clippy::correctness
