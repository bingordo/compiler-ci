name: P0 PR820 explicit legacy importer isolated acceptance
on:
  push:
    branches: [ci/verify-legacy-import-820-20261110]
    paths: ['.github/workflows/verify-legacy-import-feature-820.yml']
permissions:
  contents: read
jobs:
  legacy-import:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: f1b2ae40597ce4a3d66039216b9e56a162f8c901
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Verify exact source and isolate compiler-ir package
        run: |
          set -euo pipefail
          test "$(git -C compiler rev-parse HEAD)" = f1b2ae40597ce4a3d66039216b9e56a162f8c901
          cat > compiler/Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir"]
          EOF
          rm -f compiler/Cargo.lock
      - name: Explicit legacy-import adapter differential tests
        working-directory: compiler
        run: cargo test -p compiler-ir --features legacy-source-import --test native_source_bridge -- --nocapture
      - name: Strict opt-in legacy-import Clippy
        working-directory: compiler
        run: cargo clippy -p compiler-ir --all-targets --features legacy-source-import -- -D warnings
