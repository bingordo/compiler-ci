name: x86 physical snapshot document parser PR 1137
on:
  pull_request:
    paths:
      - '.github/workflows/verify-x86-physical-document-pr1137.yml'
permissions:
  contents: read
jobs:
  x86-physical-document:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout pinned compiler PR
        uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: c81e46619c8d1d4d25da472a0b22938899dc9f82
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Verify source SHA
        run: test "$(git -C compiler rev-parse HEAD)" = "c81e46619c8d1d4d25da472a0b22938899dc9f82"
      - name: Restrict core workspace
        run: |
          cat > compiler/Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir", "crates/opt", "crates/backend", "crates/backend-x86"]
          EOF
          rm -f compiler/Cargo.lock
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: x86-m18-physical-document
          cache-workspace-crates: 'true'
      - name: Focused machine document and physical observer tests
        working-directory: compiler
        run: |
          cargo test -p compiler-backend-x86 --test typeid_physical_document_v1 -- --nocapture
          cargo test -p compiler-backend-x86 --test typeid_physical_text_v1 -- --nocapture
          cargo test -p compiler-backend-x86 --test typeid_real_physical_observer -- --nocapture
      - name: Full x86 backend tests and strict lint
        working-directory: compiler
        run: |
          cargo test -p compiler-backend-x86
          cargo clippy -p compiler-backend-x86 --all-targets -- -D warnings
