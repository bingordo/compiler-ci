name: CI M4.10 snapshot preflight #1338
on:
  pull_request:
    paths: ['.github/workflows/m410-snapshot-preflight-1338.yml']
permissions:
  contents: read
jobs:
  corpus-snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 81d2900c264875d2551d2119d25e95435c3fc93b
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Exact-source full corpus suite
        working-directory: compiler
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "81d2900c264875d2551d2119d25e95435c3fc93b"
          cd tools
          python3 -m unittest -v test_m410_elf_fuzz_corpus
      - name: Python tool syntax
        working-directory: compiler
        run: python3 -m py_compile tools/m410_elf_fuzz_corpus.py tools/test_m410_elf_fuzz_corpus.py
