name: F6 native-only TypeId public verification PR926
on:
  push:
    branches: [ci/verify-ir-native-only-validation-926-20261111]
    paths: ['.github/workflows/verify-ir-native-only-validation-926.yml']
permissions:
  contents: read
jobs:
  ir-native-verification:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 133b9d8697237592dc011f493c614310e75d55d1
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Attest source, isolate compiler libraries, provide DWARF debugger
        run: |
          set -euo pipefail
          test "$(git -C compiler rev-parse HEAD)" = 133b9d8697237592dc011f493c614310e75d55d1
          cat > compiler/Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir","crates/opt","crates/backend","crates/backend-x86","crates/backend-aarch64"]
          EOF
          rm -f compiler/Cargo.lock
          sudo apt-get update -qq
          sudo apt-get install -y -qq gdb
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: f6-ir-native-verifier-926
      - name: Native IR, optimizer, x86, AArch64 complete unit and integration suites
        working-directory: compiler
        run: |
          cargo test -p compiler-ir -p compiler-opt -p compiler-backend -p compiler-backend-x86 -p compiler-backend-aarch64 -- --test-threads=2
      - name: Strict all-targets Clippy for native and old-format compatibility tests
        working-directory: compiler
        run: |
          cargo clippy -p compiler-ir -p compiler-opt -p compiler-backend -p compiler-backend-x86 -p compiler-backend-aarch64 --all-targets -- -D warnings
          cargo clippy -p compiler-opt --features legacy-experimental-ssa --all-targets -- -D warnings
