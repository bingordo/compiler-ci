name: TypeId P3.8 direct shared x86 machine SSA migration
on:
  pull_request:
    paths:
      - '.github/workflows/verify-typeid-p38-machine-ssa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  p38:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
      CARGO_INCREMENTAL: '0'
    steps:
      - name: Checkout pinned P3.8 compiler source
        uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 7379d5eabef236703a6d359f68fb40ac44f30346
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Assert exact source SHA
        working-directory: compiler
        run: test "$(git rev-parse HEAD)" = "7379d5eabef236703a6d359f68fb40ac44f30346"
      - name: Resolve pinned frontend git dependencies
        run: git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: typeid-p38-shared-machine
      - name: Native TypeId direct existing machine SSA differential C11 GAS ELF oracle
        working-directory: compiler
        run: cargo test -p compiler-backend-x86 --test typeid_shared_machine -- --nocapture
      - name: Existing x86 selector catalog and machine SSA regression
        working-directory: compiler
        run: |
          cargo test -p compiler-backend-x86 --lib selector -- --nocapture
          cargo test -p compiler-backend-x86 --lib machine -- --nocapture
      - name: Real checked Mini-C and Oberon TypeId native GAS ELF C11 oracles
        working-directory: compiler
        run: cargo test -p compiler --bin compiler typeid_native_source -- --nocapture
      - name: Complete checked source frontend driver regression
        working-directory: compiler
        run: cargo test -p compiler --bin compiler
      - name: AArch64 shared TypeId API unaffected
        working-directory: compiler
        run: cargo check -p compiler-backend-aarch64 --all-targets
      - name: Strict compiler IR optimizer and target Clippy
        working-directory: compiler
        run: |
          cargo clippy -p compiler-ir -p compiler-opt -p compiler -p compiler-backend-x86 --all-targets -- -D warnings
          cargo clippy -p compiler-backend-aarch64 --lib -- -D warnings
      - name: Install GDB needed by existing DWARF test
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y gdb
      - name: Full IR optimizer native backend and x86 regression
        working-directory: compiler
        run: cargo test -p compiler-ir -p compiler-opt -p compiler-backend -p compiler-backend-x86
