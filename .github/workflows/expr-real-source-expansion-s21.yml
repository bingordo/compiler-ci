name: S21 pinned 22-function musl opportunity expansion
on:
  push:
    branches: [main]
    paths: ['.github/workflows/expr-real-source-expansion-s21.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  independent-s14:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Read exact compiler S21 revision
        uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 8da617329d091b6bb5043de2500bfc9cd3378e18
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Install Z3
        run: sudo apt-get update -qq && sudo apt-get install -y z3
      - name: Regenerate and independently check complete S14 rule set
        run: |
          set -euo pipefail
          cargo run --release --manifest-path compiler/tools/expr-rule-gen/Cargo.toml -- \
            --infer-guards --compose-guards --minimize-rules --commute-inferred \
            --max-proofs 2000 --max-rules 500 --format rust --output /tmp/s14-s21.rs
          cargo run --release --manifest-path compiler/tools/expr-rule-gen/Cargo.toml -- \
            --infer-guards --compose-guards --minimize-rules --commute-inferred \
            --max-proofs 2000 --max-rules 500 --format rust --check /tmp/s14-s21.rs
          grep -q 'pub const RULE_COUNT: usize = 152;' /tmp/s14-s21.rs
          grep -q 'pub const RULE_LIMIT_REACHED: bool = false;' /tmp/s14-s21.rs
          rustc --edition=2021 -O --test /tmp/s14-s21.rs -o /tmp/s14-s19-tests
          /tmp/s14-s19-tests
      - name: Allow read-only public Mini-C frontend
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path=Path('compiler/tools/mini-c-driver/Cargo.toml')
          data=path.read_text()
          old='ssh://git@github.com/bingordo/mini-c.git'
          assert data.count(old)==2
          path.write_text(data.replace(old,'https://github.com/bingordo/mini-c.git'))
          PY
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler/tools/mini-c-driver -> target
          key: s21-real-expansion
      - name: Build actual Mini-C benchmark with fresh 152-rule matcher
        env:
          S14_MATCHER_FILE: /tmp/s14-s21.rs
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=10s 12m cargo build --release \
            --manifest-path compiler/tools/mini-c-driver/Cargo.toml \
            --features s14-ssa-audit --example benchmark_generated_fusion
      - name: Check S14 typed-SSA bitwise and negative regressions
        env:
          S14_MATCHER_FILE: /tmp/s14-s21.rs
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          Path('compiler/Cargo.toml').write_text(
              '[workspace]\nresolver = "2"\nmembers = ["crates/ir","crates/opt"]\n')
          PY
          cargo test --manifest-path compiler/Cargo.toml -p compiler-opt \
            --features experimental-s14-audit s19_ -- --nocapture \
            2>&1 | tee /tmp/s21-unit.log
          grep -F 's19_proven_bitwise_rules_audit_real_typed_i32_ssa_without_mutation ... ok' /tmp/s21-unit.log
          grep -F 's19_excludes_trapping_and_64_bit_operations ... ok' /tmp/s21-unit.log
      - name: Census all 22 preselected real upstream bodies including rejections
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=10s 9m \
            compiler/tools/mini-c-driver/target/release/examples/benchmark_generated_fusion \
            --real-opportunity | tee /tmp/s21-real-expansion.log
      - name: Revalidate the original 12 native GCC oracle functions
        run: |
          set -euo pipefail
          RULE_S9_REPEATS=3 timeout --signal=TERM --kill-after=10s 9m \
            compiler/tools/mini-c-driver/target/release/examples/benchmark_generated_fusion \
            --real-world | tee /tmp/s21-original-musl-oracle.log
          grep -q 'native_calls=288' /tmp/s21-original-musl-oracle.log
      - name: Classify all 48 synthetic post-optimizer candidate trees
        run: |
          set -euo pipefail
          RULE_S8_CASES=48 RULE_S8_SEED=1592590374 \
            compiler/tools/mini-c-driver/target/release/examples/benchmark_generated_fusion \
            --sampled --opportunity-audit | tee /tmp/s21-pairs.log
          python3 - <<'PY'
          from pathlib import Path
          lines=Path('/tmp/s21-pairs.log').read_text().splitlines()
          pairs=[x.split(',') for x in lines if x.startswith('S21_PAIR,')]
          summaries=[x for x in lines if x.startswith('S21_SUMMARY ')]
          assert len(summaries)==2 and pairs
          for stage in ('raw','optimized'):
              counts=sum(int(row[4]) for row in pairs if row[1]==stage)
              summary=next(x for x in summaries if 'stage='+stage+' ' in x)
              expected=int(next(x.split('=',1)[1] for x in summary.split() if x.startswith('candidates=')))
              assert expected==counts,(stage,expected,counts)
          assert any(row[1]=='optimized' for row in pairs)
          print('S21_PAIR_INVENTORY_OK',pairs)
          PY
      - name: Verify expanded real-source denominator and exact row totals
        run: |
          python3 - <<'PY'
          from pathlib import Path
          data=Path('/tmp/s21-real-expansion.log').read_text().splitlines()
          info=[s for s in data if s.startswith('S21R_INFO ')]
          rows=[s.split(',') for s in data if s.startswith('S21R_ROW,')]
          rej=[s.split(',') for s in data if s.startswith('S21R_REJECT,')]
          summaries=[s for s in data if s.startswith('S21R_SUMMARY ')]
          assert len(info)==1 and 'attempted=22' in info[0]
          assert len(summaries)==2
          assert len(rej)+len(rows)//2==22
          names=set(); counts={}
          for r in rows:
              assert len(r)==10,r
              _,name,src_hash,stage,*num=r
              assert len(src_hash)==16 and stage in ('raw','optimized')
              assert (name,stage) not in names
              names.add((name,stage))
              ns=list(map(int,num))
              op,candidate,matched,represented,shared,eligible=ns
              assert 0<=eligible<=represented<=matched<=candidate<=op
              assert shared<=matched
              d=counts.setdefault(stage,[0]*6)
              for j,n in enumerate(ns):d[j]+=n
          bad=set()
          for r in rej:
              assert len(r)==5,r
              _,name,h,phase,reason=r
              assert len(h)==16 and phase in ('frontend','functions','optimizer')
              assert name not in bad and reason
              bad.add(name)
          good={name for name,stage in names if stage=='raw'}
          assert good.isdisjoint(bad) and len(good)+len(bad)==22
          assert len([r for r in rows if r[3]=='optimized'])==len(good)
          # The original S9 corpus's 12 functions are all known parseable.
          assert len(good)>=12
          labels=('operations','candidates','matches','representable','shared_inner','eligible')
          for s in summaries:
              m=dict(q.split('=',1) for q in s.split()[1:])
              stage=m['stage']
              assert stage in counts
              assert (int(m['attempted']),int(m['accepted']),int(m['rejected']))==(22,len(good),len(bad))
              assert m['generated_rules']=='152'
              assert [int(m[k]) for k in labels]==counts[stage]
          print('S21R_ACCOUNTING_OK',len(good),len(bad),counts)
          PY
      - name: Independently reconcile raw and optimized opcode histograms
        run: |
          python3 - <<'PY'
          from pathlib import Path
          lines=Path('/tmp/s21-real-expansion.log').read_text().splitlines()
          prefixes=('S21R_OPS_RAW','S21R_OPS_OPT')
          schema=[s.split(',') for s in lines if s.startswith('S21R_OPS_SCHEMA,')]
          assert len(schema)==1
          labels=schema[0][4:]
          assert labels==['const_i32','const_i64','const_bool','add','sub','mul',
              'div_rem','bit_and','bit_or','bit_xor','shift','cmp',
              'select','cast','bit_not','ctz','address','memory','call']
          rows=[s.split(',') for s in lines if s.startswith(prefixes[0]+',') or s.startswith(prefixes[1]+',')]
          totals=[s.split(',') for s in lines if s.startswith('S21R_OPS_TOTAL_')]
          audit=[s.split(',') for s in lines if s.startswith('S21R_ROW,')]
          reject=[s.split(',') for s in lines if s.startswith('S21R_REJECT,')]
          accepted={(r[1],r[2]) for r in audit if r[3]=='raw'}
          assert len(accepted)+len(reject)==22
          assert len(accepted)>=12 and len(rows)==2*len(accepted)
          assert len(totals)==2 and len(schema[0])==4+len(labels)
          by_stage={}
          for row in rows:
              assert len(row)==4+len(labels),row
              tag,name,hash_value,total,*nums=row
              assert len(hash_value)==16 and (name,hash_value) in accepted
              stage=tag.removeprefix('S21R_OPS_')
              assert stage in ('RAW','OPT')
              key=(name,stage)
              assert key not in by_stage,key
              counts=list(map(int,nums))
              assert all(n>=0 for n in counts) and sum(counts)==int(total)
              by_stage[key]=counts
          assert {(name,stage) for name,_ in accepted for stage in ('RAW','OPT')}==set(by_stage)
          for summary in totals:
              assert len(summary)==4+len(labels)
              tag,name,h,total,*ns=summary
              assert name=='all' and h=='0000000000000000'
              stage=tag.removeprefix('S21R_OPS_TOTAL_')
              assert stage in ('RAW','OPT')
              actual=[sum(v[j] for (n,s),v in by_stage.items() if s==stage)
                  for j in range(len(labels))]
              assert list(map(int,ns))==actual
              assert int(total)==sum(actual)
              print('S21R_OPS_RECONCILED',stage,'accepted',len(accepted),'total',total,
                  dict(zip(labels,actual)))
          PY
      - name: Save report and regeneration evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: s21-real-source-expansion
          if-no-files-found: warn
          path: |
            /tmp/s21-real-expansion.log
            /tmp/s21-original-musl-oracle.log
            /tmp/s21-pairs.log
            /tmp/s21-unit.log
            /tmp/s14-s21.rs
