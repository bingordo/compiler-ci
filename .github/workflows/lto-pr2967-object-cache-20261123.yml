# Source-pinned opt-in LTO cache implementation and CLI check.
name: LTO PR2967 object cache
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/lto-pr2967-object-cache-20261123.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  object-cache:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      SOURCE_SHA: 9678f9fb2a4ea8e867e745200af904110c2bacb4
      CARGO_INCREMENTAL: '0'
      CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
    steps:
      - name: Checkout exact compiler source
        uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: ${{ env.SOURCE_SHA }}
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Verify pinned SHA
        shell: bash
        run: test "$(git -C compiler rev-parse HEAD)" = "$SOURCE_SHA"
      - name: Make private frontend dependencies available
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.CI_KEY }}
      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: lto-pr2967-object-cache
      - name: Test cache and check driver
        working-directory: compiler
        shell: bash
        run: |
          set -euo pipefail
          cargo test -p compiler --bin compiler lto_object_cache -- --nocapture
          cargo check -p compiler --bin compiler
      - name: Focused formatting and lint
        working-directory: compiler
        shell: bash
        run: |
          set -euo pipefail
          cargo clippy -p compiler --bin compiler -- -D clippy::all -A clippy::empty_line_after_doc_comments -A clippy::collapsible_if -A clippy::needless_return -A clippy::too_many_arguments
