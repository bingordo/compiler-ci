name: S23.61 append-only rule receipts
on:
  pull_request:
    paths:
      - '.github/workflows/s23-61-append-only.yml'
permissions:
  contents: read
jobs:
  python-regressions:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: ac81b5fd84bce3d9a3fd32337a3596ec893a2b8e
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Confirm pinned source and run rule generator regressions
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C compiler rev-parse HEAD)" = ac81b5fd84bce3d9a3fd32337a3596ec893a2b8e
          cd compiler/tools/typeid-rule-gen
          python3 -m unittest -v test_rules test_ssa_codegen test_bulk_unconditional_laws test_batch_distributive_carry test_guarded_ssa_codegen test_guarded_batch_proofs
