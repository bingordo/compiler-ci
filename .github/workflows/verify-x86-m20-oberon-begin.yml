name: x86 M1.20 Oberon BEGIN physical snapshot compiler PR 1245
on:
  pull_request:
    paths:
      - '.github/workflows/verify-x86-m20-oberon-begin.yml'
permissions:
  contents: read
jobs:
  x86-oberon-begin:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.CI_KEY }}
      - run: ssh-keyscan github.com >> ~/.ssh/known_hosts
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: feature/x86-oberon-begin-module-replay
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Verify pinned compiler revision
        run: test "$(git -C compiler rev-parse HEAD)" = "a051655a6cef0be8306208a4c8fbab654f932a0a"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: x86-m20-oberon-begin
          cache-workspace-crates: 'true'
      - name: Real Oberon constructor source physical snapshot / ELF link / execution
        working-directory: compiler
        run: |
          cargo test -p compiler-backend-x86 --test typeid_physical_rip_symbols_v2 -- --nocapture
          cargo test -p compiler --test typeid_x86_oberon_begin_snapshot -- --nocapture
          cargo test -p compiler --test typeid_x86_source_machine_dump -- --nocapture
          cargo test -p compiler --test typeid_x86_source_attributes_snapshot -- --nocapture
      - name: Full x86 backend tests and strict driver/backend Clippy
        working-directory: compiler
        run: |
          cargo test -p compiler-backend-x86
          cargo clippy -p compiler -p compiler-backend-x86 --all-targets -- -D warnings
