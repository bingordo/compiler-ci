name: F1 native TypeId function-pointer signatures and indirect C ABI
on:
  pull_request:
    paths:
      - '.github/workflows/verify-typeid-function-signatures.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fn-sig:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout exact compiler candidate
        uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 9ea566cb8c4bff228b4dc0cdc679c018ca4632d5
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Verify immutable source pin
        working-directory: compiler
        run: test "$(git rev-parse HEAD)" = "9ea566cb8c4bff228b4dc0cdc679c018ca4632d5"
      - name: Isolate core compiler workspace
        working-directory: compiler
        run: |
          cat > Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir", "crates/opt", "crates/backend", "crates/backend-x86", "crates/backend-aarch64"]
          EOF
          rm -f Cargo.lock
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: typeid-f1-fn-signatures
      - name: Execute first-class TypeId function-pointer C11 GAS/direct ELF oracle
        working-directory: compiler
        run: cargo test -p compiler-backend-x86 --test native_typeid_function_signatures -- --nocapture
      - name: Execute existing checked arrays and indirect GP C11 oracle
        working-directory: compiler
        run: cargo test -p compiler-backend-x86 --test native_typeid_indexed_indirect -- --nocapture
      - name: Execute existing native direct memory and C call C11 oracle
        working-directory: compiler
        run: cargo test -p compiler-backend-x86 --test native_typeid_memory_calls -- --nocapture
      - name: Execute existing native integer RA and CFG C11 oracle
        working-directory: compiler
        run: cargo test -p compiler-backend-x86 --test native_typeid_direct -- --nocapture
      - name: Full compiler IR optimizer and backend suites
        working-directory: compiler
        run: cargo test -p compiler-ir -p compiler-opt -p compiler-backend -p compiler-backend-x86
      - name: AArch64 shared API compile
        working-directory: compiler
        run: cargo check -p compiler-backend-aarch64 --all-targets
      - name: Strict core all-target Clippy
        working-directory: compiler
        run: cargo clippy -p compiler-ir -p compiler-opt -p compiler-backend -p compiler-backend-x86 --all-targets -- -D warnings
      - name: Strict AArch64 library Clippy
        working-directory: compiler
        run: cargo clippy -p compiler-backend-aarch64 --lib -- -D warnings
