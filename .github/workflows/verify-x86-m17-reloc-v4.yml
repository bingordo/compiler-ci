name: x86 M1.17a pointer relocation module v4 compiler PR 1221
on:
  pull_request:
    paths:
      - '.github/workflows/verify-x86-m17-reloc-v4.yml'
permissions:
  contents: read
jobs:
  physical-reloc-v4:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.CI_KEY }}
      - name: Trust pinned frontend host
        run: ssh-keyscan github.com >> ~/.ssh/known_hosts
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: c44ca043c61eb1d35d5a7ae82a2e555058fc7b39
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Verify exact source commit
        run: test "$(git -C compiler rev-parse HEAD)" = "c44ca043c61eb1d35d5a7ae82a2e555058fc7b39"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: x86-relocated-module-v4
          cache-workspace-crates: 'true'
      - name: Physical relocation module and driver ELF parity
        working-directory: compiler
        run: |
          cargo test -p compiler-backend-x86 --test typeid_physical_module_v3 -- --nocapture
          cargo test -p compiler --test typeid_x86_physical_dump -- --nocapture
          cargo test -p compiler --test typeid_ir_dump_replay -- --nocapture
      - name: Full x86 backend suite and strict Clippy
        working-directory: compiler
        run: |
          cargo test -p compiler-backend-x86
          cargo clippy -p compiler -p compiler-backend-x86 --all-targets -- -D warnings
