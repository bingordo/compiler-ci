name: IR inline memory and postopt fixed fixture gate
on:
  push:
    branches: [ci/ir-inline-memory-postopt-20261114]
    paths: ['.github/workflows/ir-inline-memory-postopt-fixture-gate.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: adbf761e1dde65396af2ed85cd38d5b6196fb6cd
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Verify exact SHA and isolate core workspace
        run: |
          set -euo pipefail
          test "$(git -C compiler rev-parse HEAD)" = "adbf761e1dde65396af2ed85cd38d5b6196fb6cd"
          echo "Compiler SHA: adbf761e1dde65396af2ed85cd38d5b6196fb6cd" >> "$GITHUB_STEP_SUMMARY"
          cat > compiler/Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir", "crates/opt", "crates/backend", "crates/backend-x86"]
          EOF
          rm -f compiler/Cargo.lock
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: ir-inline-memory-postopt-fixtures
      - name: Original memory and postopt native C11 oracles
        working-directory: compiler
        run: |
          set -euo pipefail
          cargo test -p compiler-opt --test typed_inline_memory_native --test typed_inline_postopt_native_trial -- --nocapture
      - name: Adjacent migrated inliner and optimizer fixture tests
        working-directory: compiler
        run: |
          set -euo pipefail
          cargo test -p compiler-opt --test typed_inline_cfg_native --test typed_inline_wide_void_native --test typed_inline_leaf_native --test typed_core_pipeline --test typed_local_memory --test typed_mem2reg --test typed_pre_native --test typed_dse
      - name: Production library compiler check
        working-directory: compiler
        run: cargo check --workspace --lib
      - name: Strict scoped Clippy production and affected tests
        working-directory: compiler
        run: |
          set -euo pipefail
          cargo clippy -p compiler-ir -p compiler-opt -p compiler-backend -p compiler-backend-x86 --lib -- -D warnings
          cargo clippy -p compiler-opt --test typed_inline_memory_native --test typed_inline_postopt_native_trial -- -D warnings
      - name: Record pinned validation
        run: |
          echo 'Memory inliner/postopt C11, related fixture tests, production typecheck and strict scoped Clippy PASS' >> "$GITHUB_STEP_SUMMARY"
