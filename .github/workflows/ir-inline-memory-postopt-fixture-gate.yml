name: IR inline memory and postopt fixed fixture gate
on:
  push:
    branches: [ci/ir-inline-memory-postopt-20261114]
    paths: ['.github/workflows/ir-inline-memory-postopt-fixture-gate.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: e13ae544af0d3065c8f97effa96fb7d2e60100b8
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Verify exact SHA and isolate core workspace
        run: |
          set -euo pipefail
          test "$(git -C compiler rev-parse HEAD)" = "e13ae544af0d3065c8f97effa96fb7d2e60100b8"
          echo "Compiler SHA: e13ae544af0d3065c8f97effa96fb7d2e60100b8" >> "$GITHUB_STEP_SUMMARY"
          cat > compiler/Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir", "crates/opt", "crates/backend", "crates/backend-x86"]
          EOF
          rm -f compiler/Cargo.lock
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: ir-inline-memory-postopt-fixtures
      - name: Export original local memory inliner corpus
        working-directory: compiler
        run: cargo test -p compiler-opt --test typed_inline_memory_native export_original_inline_memory_fixed_graphs -- --nocapture
      - name: Export original postopt module
        working-directory: compiler
        run: cargo test -p compiler-opt --test typed_inline_postopt_native_trial export_original_inline_postopt_fixed_graphs -- --nocapture
