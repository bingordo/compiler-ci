name: Mini-C executable external struct arguments probe
on:
  push:
    branches:
      - ci/mini-c-struct-entry-20261122
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 3ddb9323c737f537934a9cd2e5f2b1b4d23142c0
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Confirm source and public pin
        run: |
          set -euo pipefail
          test "$(git -C compiler rev-parse HEAD)" = 3ddb9323c737f537934a9cd2e5f2b1b4d23142c0
          python3 - <<'PY'
          from pathlib import Path
          p=Path("compiler/tools/mini-c-driver/Cargo.toml")
          x=p.read_text()
          assert x.count("ssh://git@github.com/bingordo/mini-c.git")==2
          p.write_text(x.replace("ssh://git@github.com/bingordo/mini-c.git","https://github.com/bingordo/mini-c.git"))
          PY
      - name: Focused checked aggregate ABI and full Mini-C library tests
        run: |
          set -euo pipefail
          timeout 20m cargo test --manifest-path compiler/tools/mini-c-driver/Cargo.toml -p compiler-mini-c --lib aggregate_abi::entry_tests
          # Diagnostic only while comparing failures to the exact main baseline.
          timeout 8m cargo test --manifest-path compiler/tools/mini-c-driver/Cargo.toml -p compiler-mini-c --lib || echo "FULL_LIBRARY_SUITE_RED: baseline comparison required"
      - name: Build TypeId C driver for executable GCC ABI comparison
        run: |
          set -euo pipefail
          cargo build --manifest-path compiler/tools/mini-c-driver/Cargo.toml -p compiler-mini-c --bin compiler-mini-c
          cat > "$RUNNER_TEMP/our.c" <<'EOF'
          struct Pair { long a; long b; };
          extern long sum_pair(struct Pair p);
          long wrapper(long a,long b) {
              struct Pair p={a,b};
              return sum_pair(p);
          }
          EOF
          cat > "$RUNNER_TEMP/gcc.c" <<'EOF'
          typedef struct {long a; long b;} Pair;
          long sum_pair(Pair p) {return p.a*3+p.b*5;}
          extern long wrapper(long,long);
          int main(void) {
              for(long a=-7;a<=7;a++)
                  for(long b=-9;b<=9;b++)
                      if(wrapper(a,b)!=a*3+b*5) return 1;
              return 0;
          }
          EOF
          cat > "$RUNNER_TEMP/spill.c" <<'EOF'
          struct Trio {int a;int b;int c;};
          extern long weighted(long a,long b,long c,long d,long e,
                               struct Trio t,int last);
          long spill_wrapper(long a,long b,long c,long d,long e,int last) {
              struct Trio t={7,11,13};
              return weighted(a,b,c,d,e,t,last);
          }
          EOF
          cat > "$RUNNER_TEMP/spill_gcc.c" <<'EOF'
          struct Trio {int a;int b;int c;};
          long weighted(long a,long b,long c,long d,long e,
                        struct Trio t,int last) {
              return a+2*b+3*c+4*d+5*e+
                     7*t.a+11*t.b+13*t.c+17*last;
          }
          extern long spill_wrapper(long,long,long,long,long,int);
          int main(void) {
              for(long x=-9;x<=9;x++) {
                  for(int y=-7;y<=7;y++) {
                      long expected=x+2*(x+1)+3*(x+2)+4*(x+3)+5*(x+4)
                            +7*7+11*11+13*13+17*y;
                      if(spill_wrapper(x,x+1,x+2,x+3,x+4,y)!=expected)
                          return 1;
                  }
              }
              return 0;
          }
          EOF
          cat > "$RUNNER_TEMP/entry.c" <<'EOF'
          struct Pair { long a;long b; };
          long pair_sum(struct Pair p) {return p.a*3+p.b*5;}
          struct Trio {int a;int b;int c;};
          long weighted(long a,long b,long c,long d,long e,
                        struct Trio t,int last) {
              return a+2*b+3*c+4*d+5*e+7*t.a+11*t.b+13*t.c+17*last;
          }
          EOF
          cat > "$RUNNER_TEMP/entry_gcc.c" <<'EOF'
          struct Pair {long a;long b;};
          struct Trio {int a;int b;int c;};
          extern long pair_sum(struct Pair);
          extern long weighted(long,long,long,long,long,struct Trio,int);
          int main(void){
              for(long x=-9;x<=9;x++)for(long y=-7;y<=7;y++){
                  struct Pair p={x,y};
                  if(pair_sum(p)!=3*x+5*y)return 1;
                  struct Trio t={7,11,13};
                  long expected=x+2*(x+1)+3*(x+2)+4*(x+3)+5*(x+4)
                      +7*7+11*11+13*13+17*y;
                  if(weighted(x,x+1,x+2,x+3,x+4,t,(int)y)!=expected)return 2;
              }
              return 0;
          }
          EOF
          for frame in omit keep; do
            frame_opt=()
            [[ "$frame" == omit ]] || frame_opt=(--frame-pointer)
            for format in obj asm; do
              file="$RUNNER_TEMP/entry-$format-$frame"
              compiler/tools/mini-c-driver/target/debug/compiler-mini-c \
                  "$RUNNER_TEMP/entry.c" --emit "$format" "${frame_opt[@]}" -o "$file"
              if [[ "$format" == asm ]]; then
                gcc -x assembler -c "$file" -o "$file.o"
              else
                cp "$file" "$file.o"
              fi
              gcc -std=c11 -O2 -Wall -Wextra -Werror \
                  "$RUNNER_TEMP/entry_gcc.c" "$file.o" -o "$file.exe"
              "$file.exe"
            done
          done
      - name: Compare same full Mini-C suite against exact pre-feature main
        run: |
          set -euo pipefail
          git -C compiler reset --hard HEAD
          git -C compiler fetch --depth=1 origin 6dc129ccc76789b67892e8d9aa4693648f13299f
          git -C compiler checkout --detach 6dc129ccc76789b67892e8d9aa4693648f13299f
          test "$(git -C compiler rev-parse HEAD)" = 6dc129ccc76789b67892e8d9aa4693648f13299f
          python3 - <<'PY'
          from pathlib import Path
          p=Path("compiler/tools/mini-c-driver/Cargo.toml")
          x=p.read_text()
          assert x.count("ssh://git@github.com/bingordo/mini-c.git")==2
          p.write_text(x.replace("ssh://git@github.com/bingordo/mini-c.git","https://github.com/bingordo/mini-c.git"))
          PY
          cargo test --manifest-path compiler/tools/mini-c-driver/Cargo.toml \
             -p compiler-mini-c --lib 2>&1 | tee "$RUNNER_TEMP/baseline-library-tests.log" || true
          grep -E 'test tests::.*FAILED|test result:' "$RUNNER_TEMP/baseline-library-tests.log" || true
