name: Temporary recursive TypeId driver boundary PR3578
on:
  pull_request:
    paths:
      - '.github/workflows/temp-typeid-driver-recursive-3578.yml'
permissions:
  contents: read
jobs:
  boundary:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      SOURCE_SHA: dccb83458db85599da0f64009179d08d2ef8d9e0
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: ${{ env.SOURCE_SHA }}
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Verify exact source SHA
        working-directory: compiler
        run: test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
      - name: Test recursive driver boundary and source
        working-directory: compiler
        run: |
          set -euo pipefail
          python3 tools/test_check_typeid_driver_boundary.py
          python3 tools/check_typeid_driver_boundary.py
