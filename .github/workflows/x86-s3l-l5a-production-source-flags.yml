name: X7 S3.L L5a production source/XED/SMT TypeId CMP TEST
on:
  pull_request:
    paths:
      - '.github/workflows/x86-s3l-l5a-production-source-flags.yml'
permissions:
  contents: read
  actions: read
jobs:
  c-defined-typeid-source-production:
    runs-on: ubuntu-24.04
    timeout-minutes: 42
    env:
      SOURCE_SHA: '0716128ca4eb56b8c4ac0c5813bed543c99d244c'
      PYTHONPATH: compiler/tools
      X7_S3L_L4A_WORKLIST: /tmp/x7-s3l-l5a/source/original-source-xed-iforms.json
      X7_S3L_L4A_SMT: /tmp/x7-s3l-l5a/smt/semantics-z3.json
    steps:
      - name: Checkout exact compiler commit without compiler Actions
        uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 0716128ca4eb56b8c4ac0c5813bed543c99d244c
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Reuse original unique Intel source-iform and XED certificate
        uses: actions/download-artifact@v4
        with:
          name: x7-s3l-l3c-source-XED-gated-production-admission
          run-id: 43728544711
          repository: bingordo/compiler-ci
          github-token: ${{ github.token }}
          path: /tmp/x7-s3l-l5a/source
      - name: Reuse independently proven Intel source value and flags Z3
        uses: actions/download-artifact@v4
        with:
          name: x7-s3l-l2b-l3a-9-ops-generic-helper-smt-source-evidence
          run-id: 43687620382
          repository: bingordo/compiler-ci
          github-token: ${{ github.token }}
          path: /tmp/x7-s3l-l5a/smt
      - name: Reproduce exactly four source-reviewed production recipes from original Intel and XED
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C compiler rev-parse HEAD)" = "$SOURCE_SHA"
          mkdir -p /tmp/x7-s3l-l5a/out
          python3 compiler/tools/x86_s3l_l4a_flags_recipe.py \
            --worklist "$X7_S3L_L4A_WORKLIST" \
            --generic-smt "$X7_S3L_L4A_SMT" \
            --report /tmp/x7-s3l-l5a/out/production-source-flags.json
          git -C compiler diff --exit-code -- \
            crates/backend-x86/src/generated_x7_s3l_l4a_flags_only_recipes.rs
          python3 compiler/tools/x86_s3l_l4a_flags_recipe.py \
            --worklist "$X7_S3L_L4A_WORKLIST" \
            --generic-smt "$X7_S3L_L4A_SMT" \
            --report /tmp/x7-s3l-l5a/out/production-source-flags.json --check
          python3 -m unittest -v test_x86_s3l_l4a_flags_recipe
          python3 - <<'PY'
          import json
          r=json.load(open("/tmp/x7-s3l-l5a/out/production-source-flags.json"))
          assert r["new_production_TypeId_admissions"]==4,r
          print("X7_S3L_L5A_GENERATED_PRODUCTION_GATE_PASS",
                "new_production_typeid_variants",r["new_production_TypeId_admissions"])
          PY
      - name: Restrict offline workspace to real x86 backend and IR
        shell: bash
        run: |
          cd compiler
          python3 - <<'PY'
          from pathlib import Path
          Path("Cargo.toml").write_text("""[workspace]
          resolver = "2"
          members = ["crates/ir", "crates/opt", "crates/backend", "crates/backend-x86"]
          """)
          PY
      - name: Default production features real TypeId emitted GAS and native direct ELF
        shell: bash
        run: |
          set -euo pipefail
          cd compiler
          cargo test -p compiler-backend-x86 \
            --test x7_s3l_l4c_typeid_flags_native --offline -- --nocapture
          cargo test -p compiler-backend-x86 \
            --test x7_s3l_l4b_flags_window_native --offline -- --nocapture
          cargo test -p compiler-backend-x86 \
            --lib x7_late_selector --offline
          cargo test -p compiler-backend-x86 \
            --test typed_i32_compare_branch_native --offline
          cargo test -p compiler-backend-x86 \
            --test typed_i64_compare_branch_native --offline
          echo X7_S3L_L5A_DEFAULT_PRODUCTION_FOUR_TYPEID_NATIVE_GAS_ELF_PASS
      - name: Independent feature-only source flags production without other 64-bit ALU
        shell: bash
        run: |
          set -euo pipefail
          cd compiler
          cargo test -p compiler-backend-x86 --no-default-features \
            --features x7-c-defined-source-flags \
            --test x7_s3l_l4c_typeid_flags_native --offline -- --nocapture
          cargo test -p compiler-backend-x86 --no-default-features \
            --features x7-c-defined-source-flags \
            --test x7_s3l_l4b_flags_window_native --offline -- --nocapture
          echo X7_S3L_L5A_ISOLATED_SOURCE_FLAGS_PRODUCTION_PASS
      - name: Keep original TypeId emission when source flags policy disabled
        shell: bash
        run: |
          set -euo pipefail
          cd compiler
          cargo test -p compiler-backend-x86 --no-default-features \
            --test x7_s3l_l4c_typeid_flags_native --offline
          cargo test -p compiler-backend-x86 --no-default-features \
            --features x7-c-defined-add \
            --test x7_s3l_l4c_typeid_flags_native --offline
          cargo test -p compiler-backend-x86 --no-default-features \
            --features x7-native-form-validation \
            --test x7_s3l_l4c_typeid_flags_native --offline
          cargo test -p compiler-backend-x86 --no-default-features \
            --test x7_g10_n15_no_default_fallback --offline
          echo X7_S3L_L5A_ORIGINAL_FEATURE_OFF_FALLBACK_PASS
      - name: Archive exact reviewed Intel/XED/SMT production form admission
        uses: actions/upload-artifact@v4
        with:
          name: x7-s3l-l5a-source-flags-four-default-typeid-production
          path: /tmp/x7-s3l-l5a/out/production-source-flags.json
          if-no-files-found: error
