name: Temporary native TypeId generated fusion fixed point acceptance
on:
  pull_request:
    paths: ['.github/workflows/temp-ir-fusion-fixedpoint-3493.yml']
permissions: {contents: read}
jobs:
  native-fixedpoint:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      SOURCE_SHA: ce5ea45d191e5d9447d2d585dd4ab8186840887b
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: ${{ env.SOURCE_SHA }}
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Verify source and narrow workspace
        working-directory: compiler
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          cat > Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir", "crates/opt", "crates/backend", "crates/backend-x86", "crates/backend-aarch64"]
          EOF
          rm -f Cargo.lock
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: native-typeid-generated-fusion-fixedpoint
      - name: Native TypeId generated fixed-point and guarded 500-case matrix
        working-directory: compiler
        run: |
          set -euo pipefail
          cargo test -p compiler-opt --features 'experimental-generated-rules experimental-typeid-guarded-admission' --lib generated_guarded_admission::tests -- --nocapture
      - name: Independent historic rule regressions and native algebra
        working-directory: compiler
        run: |
          set -euo pipefail
          cargo test -p compiler-opt --features 'experimental-generated-rules experimental-typeid-guarded-admission' --lib experimental_generated_rules::tests
          cargo test -p compiler-opt --test typed_algebra --test generated_native_oracle
      - name: All targets and lint and native graph guard
        working-directory: compiler
        run: |
          set -euo pipefail
          cargo check -p compiler-opt --features 'experimental-generated-rules experimental-typeid-guarded-admission' --all-targets
          cargo clippy -p compiler-opt --lib -- -D warnings
          python3 tools/check_mixed_function_export_boundary.py
