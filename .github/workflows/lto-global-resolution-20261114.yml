name: LTO global relocation preflight
on:
  push:
    branches: [verify/lto-global-resolution-20261114]
    paths: ['.github/workflows/lto-global-resolution-20261114.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: 590403550be27acf320a2498595bc4b847a040e4
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Verify exact source
        run: test "$(git -C compiler rev-parse HEAD)" = "590403550be27acf320a2498595bc4b847a040e4"
      - name: Focus IR workspace
        run: |
          cat > compiler/Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir"]
          EOF
          rm -f compiler/Cargo.lock
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: lto-global-resolution
      - name: Test global preflight, all compiler IR and strict Clippy
        working-directory: compiler
        run: |
          cargo test -p compiler-ir --test lto_global_resolution
          cargo test -p compiler-ir
          cargo clippy -p compiler-ir --tests -- -D warnings
