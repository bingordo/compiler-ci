name: M4.10 ELF sections symbols relocations acceptance
on:
  pull_request:
    paths: ['.github/workflows/verify-m410-elf-symbol-reloc.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
      CARGO_INCREMENTAL: '0'
      COMPILER_ELF_REQUIRE_LLVM: '1'
    steps:
      - name: Checkout exact compiler candidate
        uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: ab26b452ae84e4a751d6acfb483b3f8f91f9ceae
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Verify immutable candidate
        working-directory: compiler
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "ab26b452ae84e4a751d6acfb483b3f8f91f9ceae"
          test -s crates/backend/src/elf.rs
          echo "M4.10 ELF section symbol relocation: ab26b452ae84e4a751d6acfb483b3f8f91f9ceae" >> "$GITHUB_STEP_SUMMARY"
      - name: Resolve public pinned frontend dependencies
        run: git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
      - name: Verify GNU LLVM and GDB tools (install only if missing)
        run: |
          set -euo pipefail
          if ! command -v ld.lld >/dev/null || ! command -v gdb >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y lld gdb
          fi
          command -v gcc
          command -v clang
          command -v ld.lld
          command -v gdb
          gcc --version | head -1
          clang --version | head -1
          ld.lld --version | head -1
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: m410-elf-symbol-reloc-v5
      - name: Bounded section symbol relocation corruption matrix x86 and AArch64
        working-directory: compiler
        run: |
          cargo test -p compiler-backend elf::tests::m410_elf_section_symbol_relocation_mutation_matrix -- --nocapture
          cargo test -p compiler-backend elf::tests::shared_elf_rejects_mutated_cfi_metadata_before_object_emission -- --nocapture
      - name: All backend ELF and ABI tests, aggregate integration failures
        working-directory: compiler
        run: cargo test -p compiler-backend --all-targets --no-fail-fast -- --nocapture
      - name: Strict all-target Clippy
        working-directory: compiler
        run: |
          cargo clippy -p compiler -p compiler-ir -p compiler-opt -p compiler-backend -p compiler-backend-x86 --features compiler-backend-x86/x7-native-form-validation --all-targets -- -D warnings
          cargo clippy -p compiler-backend-aarch64 --lib -- -D warnings
      - name: Combined PIC RBP real checked C GNU LLVM dlopen and CFI
        working-directory: compiler
        run: cargo test -p compiler --test typeid_pic_frame_shared -- --nocapture
      - name: Existing independent PIC and framed and linker acceptance
        working-directory: compiler
        run: |
          cargo test -p compiler --test typeid_pic_shared -- --nocapture
          cargo test -p compiler --test typeid_frame_pointer -- --nocapture
          cargo test -p compiler --test typeid_elf_linker_matrix -- --nocapture
      - name: Full checked C Oberon and driver native TypeId suites
        working-directory: compiler
        run: |
          cargo test -p compiler --bin compiler
          cargo test -p compiler --test mini_c_cli
      - name: AArch64 native backend API
        working-directory: compiler
        run: cargo check -p compiler-backend-aarch64 --all-targets
      - name: Full IR optimizer backend native x86 and AArch64 core regression
        working-directory: compiler
        run: cargo test -p compiler-ir -p compiler-opt -p compiler-backend -p compiler-backend-x86 -p compiler-backend-aarch64 --features compiler-backend-x86/x7-native-form-validation
