name: Compiler core validation (external minutes)
on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Compiler branch or exact commit to validate
        required: true
        default: main
        type: string
  schedule:
    - cron: '7,22,37,52 * * * *'
  pull_request:
    paths:
      - '.github/workflows/verify-compiler-core.yml'
      - '.github/workflows/verify-compiler-pr-head.yml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-compiler-core.yml'
      - '.github/workflows/verify-compiler-pr-head.yml'
permissions:
  contents: read
concurrency:
  group: compiler-core-${{ github.event.inputs.source_ref || 'poll' }}
  cancel-in-progress: true
jobs:
  discover:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      refs: ${{ steps.refs.outputs.refs }}
    steps:
      - name: Checkout compiler for branch discovery
        uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: main
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Resolve compiler main revision
        id: refs
        shell: bash
        run: |
          set -euo pipefail
          sha="$(git -C compiler rev-parse HEAD)"
          echo "refs=[\"$sha\"]" >> "$GITHUB_OUTPUT"
          echo "Scheduled compiler main revision: $sha" >> "$GITHUB_STEP_SUMMARY"

  core:
    if: github.event_name != 'schedule' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: ${{ inputs.source_ref || 'main' }}
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Report tested revision
        run: git -C compiler rev-parse HEAD | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Restrict workspace to core crates
        shell: bash
        run: |
          cat > compiler/Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir", "crates/opt", "crates/backend", "crates/backend-x86"]
          EOF
          rm -f compiler/Cargo.lock
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: external-core
      - name: Install required native GDB test dependency
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends gdb
          command -v gdb
          gdb --version | head -n 1
      - name: Verify x86 native loop backedge regression
        working-directory: compiler
        run: cargo test -p compiler-backend-x86 --test bt4_x86_historical_arity_phi_native
      - name: Verify core and x86 backend
        working-directory: compiler
        run: cargo test -p compiler-ir -p compiler-opt -p compiler-backend -p compiler-backend-x86

  legacy-pre-oracle-cutover:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout exact compiler candidate
        uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: b7ebaba851a9291e27fe6019a8a3d02505366574
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Pin source and isolate native optimizer workspace
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C compiler rev-parse HEAD)" = "b7ebaba851a9291e27fe6019a8a3d02505366574"
          cat > compiler/Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir", "crates/opt", "crates/backend", "crates/backend-x86", "crates/backend-aarch64"]
          EOF
          rm -f compiler/Cargo.lock
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: migration-ir-legacy-pre-feature
      - name: Verify default TypeId optimizer and independent PRE oracles
        working-directory: compiler
        run: |
          set -euo pipefail
          cargo check -p compiler-opt --lib
          cargo test -p compiler-opt --test pre_native --test pre_licm_semantic_matrix --lib
          cargo check -p compiler-backend-x86 -p compiler-backend-aarch64
          # An existing unrelated if_conversion_typeid_x86 integration test
          # imports a non-exported x86 native_typeid module under all-targets.
          # Keep that issue separate from this scoped PRE cutover acceptance.

  pr-core:
    needs: discover
    if: github.event_name == 'schedule' && needs.discover.outputs.refs != '[]'
    strategy:
      fail-fast: false
      matrix:
        source_ref: ${{ fromJSON(needs.discover.outputs.refs) }}
    uses: ./.github/workflows/verify-compiler-pr-head.yml
    with:
      source_ref: ${{ matrix.source_ref }}
    secrets: inherit
