name: Compiler core validation (external minutes)
on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Compiler branch or exact commit to validate
        required: true
        default: main
        type: string
  schedule:
    - cron: '7,22,37,52 * * * *'
  pull_request:
    paths:
      - '.github/workflows/verify-compiler-core.yml'
      - '.github/workflows/verify-compiler-pr-head.yml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-compiler-core.yml'
      - '.github/workflows/verify-compiler-pr-head.yml'
permissions:
  contents: read
concurrency:
  # Scheduled runs can take longer than the poll interval. Do not starve
  # the current-main gate or cancel it from a PR/manual validation.
  group: compiler-core-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.event_name == 'workflow_dispatch' && format('manual-{0}', inputs.source_ref) || 'main' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  ir-production-boundary:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Checkout exact source under review
        uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: ${{ inputs.source_ref || 'main' }}
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Identify exact compiler revision
        id: boundary-source
        shell: bash
        run: |
          set -euo pipefail
          sha="$(git -C compiler rev-parse HEAD)"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "IR-boundary compiler SHA: $sha" >> "$GITHUB_STEP_SUMMARY"
      - name: Check prior successful IR-boundary verification
        id: boundary-cache
        uses: actions/cache/restore@v4
        with:
          path: .ir-boundary-verified
          key: ir-boundary-v1-${{ steps.boundary-source.outputs.sha }}
          lookup-only: true
      - name: Report cached successful IR-boundary verification
        if: steps.boundary-cache.outputs.cache-hit == 'true' && github.event_name != 'workflow_dispatch'
        run: echo 'Unchanged source SHA already passed independent IR-boundary guards.' >> "$GITHUB_STEP_SUMMARY"
      - name: Run source retirement and independent oracle guards
        if: steps.boundary-cache.outputs.cache-hit != 'true' || github.event_name == 'workflow_dispatch'
        shell: bash
        working-directory: compiler
        run: |
          set -euo pipefail
          git rev-parse HEAD | tee -a "$GITHUB_STEP_SUMMARY"
          python3 tools/ir_consumer_inventory.py --check-production
          PYTHONPATH=tools python3 -m unittest tools.test_ir_consumer_inventory
          python3 tools/check_mixed_function_export_boundary.py
      - name: Write verified source SHA after all three checks pass
        if: success() && steps.boundary-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          mkdir -p .ir-boundary-verified
          echo '${{ steps.boundary-source.outputs.sha }}' > .ir-boundary-verified/source-sha
      - name: Cache successful IR-boundary source revision
        if: success() && steps.boundary-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .ir-boundary-verified
          key: ir-boundary-v1-${{ steps.boundary-source.outputs.sha }}

  discover:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      refs: ${{ steps.refs.outputs.refs }}
    steps:
      - name: Checkout compiler for branch discovery
        uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: main
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Resolve compiler main revision
        id: refs
        shell: bash
        run: |
          set -euo pipefail
          sha="$(git -C compiler rev-parse HEAD)"
          echo "refs=[\"$sha\"]" >> "$GITHUB_OUTPUT"
          echo "Scheduled compiler main revision: $sha" >> "$GITHUB_STEP_SUMMARY"

  core:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      source_sha: ${{ steps.core-source.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: ${{ inputs.source_ref || 'main' }}
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Report tested revision
        id: core-source
        run: |
          sha=$(git -C compiler rev-parse HEAD)
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "Compiler source SHA: $sha" >> "$GITHUB_STEP_SUMMARY"
      - name: Restrict workspace to core crates
        shell: bash
        run: |
          cat > compiler/Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir", "crates/opt", "crates/backend", "crates/backend-x86"]
          exclude = ["crates/ir-macros", "crates/backend-aarch64"]
          EOF
          rm -f compiler/Cargo.lock
      - name: Verify exact four-package runner plan
        working-directory: compiler
        run: |
          python3 - <<'PY'
          import json, subprocess
          metadata = json.loads(subprocess.check_output(
              ["cargo", "metadata", "--no-deps", "--format-version", "1"]))
          members = set(metadata["workspace_members"])
          actual = {p["name"] for p in metadata["packages"] if p["id"] in members}
          expected = {"compiler-ir", "compiler-opt", "compiler-backend", "compiler-backend-x86"}
          assert actual == expected, "Core package scope changed; review the explicit test selection"
          PY
          python3 - <<'PY'
          import subprocess
          result = subprocess.check_output(
              ["python3", "tools/regression.py", "--profile", "workspace",
               "--suite", "cargo-tests", "--no-isolate-build-failures", "--list"],
              text=True)
          commands = [line.split() for line in result.splitlines()
                      if line.startswith(("cargo-build ", "cargo-tests "))]
          assert commands == [
              ["cargo-build", "cargo", "test", "--workspace", "--no-fail-fast", "--no-run"],
              ["cargo-tests", "cargo", "test", "--workspace", "--no-fail-fast"],
          ], "Expected one ordinary workspace build and test invocation"
          print("Four-package runner plan verified")
          PY
      - uses: Swatinem/rust-cache@v2
        if: github.event_name != 'pull_request'
        with:
          workspaces: compiler -> target
          key: external-core
      - name: Install required native GDB test dependency
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends gdb
          command -v gdb
          gdb --version | head -n 1
      - name: Verify x86 native loop backedge regression
        if: github.event_name != 'pull_request'
        working-directory: compiler
        run: cargo test -p compiler-backend-x86 --test bt4_x86_historical_arity_phi_native
      - name: Verify core and x86 backend
        if: github.event_name != 'pull_request'
        working-directory: compiler
        # The workspace above contains exactly the four previously selected crates.
        run: python3 tools/regression.py --profile workspace --suite cargo-tests --no-isolate-build-failures --output target/regression-core

  pr-core:
    needs: discover
    if: github.event_name == 'schedule' && needs.discover.outputs.refs != '[]'
    strategy:
      fail-fast: false
      matrix:
        source_ref: ${{ fromJSON(needs.discover.outputs.refs) }}
    uses: ./.github/workflows/verify-compiler-pr-head.yml
    with:
      source_ref: ${{ matrix.source_ref }}
    secrets: inherit

  publish-core-result:
    # Publish the actual scheduled/push gate outcome, including failures and
    # unexpected skips. PR-only plan checks and manual historical runs cannot
    # replace evidence for the current-main gate.
    if: ${{ always() && (github.event_name == 'schedule' || github.event_name == 'push') }}
    needs: [discover, core, pr-core]
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      statuses: write
    steps:
      - name: Publish core regression result and run link
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          DISCOVER_RESULT: ${{ needs.discover.result }}
          DISCOVER_REFS: ${{ needs.discover.outputs.refs }}
          SCHEDULE_RESULT: ${{ needs.pr-core.result }}
          CORE_RESULT: ${{ needs.core.result }}
          CORE_SHA: ${{ needs.core.outputs.source_sha }}
        run: |
          set -euo pipefail
          state=failure
          sha=unknown
          if [[ "$EVENT" == schedule ]]; then
            if [[ "$DISCOVER_RESULT" == success ]]; then
              sha=$(jq -er 'if length == 1 then .[0] else empty end' <<< "$DISCOVER_REFS") || sha=unknown
              if [[ "$sha" =~ ^[0-9a-f]{40}$ && "$SCHEDULE_RESULT" == success ]]; then state=success; fi
            fi
          else
            sha="${CORE_SHA:-unknown}"
            if [[ "$sha" =~ ^[0-9a-f]{40}$ && "$CORE_RESULT" == success ]]; then state=success; fi
          fi
          gh api -X POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state="$state" \
            -f context="compiler/core-regression" \
            -f description="Core gate $state; compiler $sha" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" >/dev/null
