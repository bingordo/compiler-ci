name: Compiler core validation (external minutes)
on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Compiler branch or exact commit to validate
        required: true
        default: research/if-conversion-cost-model
        type: string
  push:
    branches: [main]
    paths: ['.github/workflows/verify-compiler-core.yml']
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: ${{ inputs.source_ref || 'research/if-conversion-cost-model' }}
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Report tested revision
        run: git -C compiler rev-parse HEAD | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: external-core
      - name: Verify core and x86 backend
        working-directory: compiler
        run: cargo test -p compiler-ir -p compiler-opt -p compiler-backend -p compiler-backend-x86 --locked
