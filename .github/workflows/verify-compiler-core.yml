name: Compiler core validation (external minutes)
on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Compiler branch or exact commit to validate
        required: true
        default: main
        type: string
  schedule:
    - cron: '7,22,37,52 * * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-compiler-core.yml'
      - '.github/workflows/verify-compiler-pr-head.yml'
permissions:
  contents: read
concurrency:
  group: compiler-core-${{ github.event.inputs.source_ref || 'poll' }}
  cancel-in-progress: true
jobs:
  discover:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      refs: ${{ steps.refs.outputs.refs }}
    steps:
      - name: Checkout compiler for branch discovery
        uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: research/if-conversion-cost-model
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Resolve if-conversion branch revision
        id: refs
        shell: bash
        run: |
          set -euo pipefail
          sha="$(git -C compiler rev-parse HEAD)"
          echo "refs=[\"$sha\"]" >> "$GITHUB_OUTPUT"
          echo "Scheduled if-conversion revision: $sha" >> "$GITHUB_STEP_SUMMARY"

  core:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bingordo/compiler
          ref: ${{ inputs.source_ref || 'main' }}
          path: compiler
          ssh-key: ${{ secrets.CI_KEY }}
          persist-credentials: false
      - name: Report tested revision
        run: git -C compiler rev-parse HEAD | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Restrict workspace to core crates
        shell: bash
        run: |
          cat > compiler/Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["crates/ir", "crates/opt", "crates/backend", "crates/backend-x86"]
          EOF
          rm -f compiler/Cargo.lock
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> target
          key: external-core
      - name: Verify core and x86 backend
        working-directory: compiler
        run: cargo test -p compiler-ir -p compiler-opt -p compiler-backend -p compiler-backend-x86

  pr-core:
    needs: discover
    if: github.event_name == 'schedule' && needs.discover.outputs.refs != '[]'
    strategy:
      fail-fast: false
      matrix:
        source_ref: ${{ fromJSON(needs.discover.outputs.refs) }}
    uses: ./.github/workflows/verify-compiler-pr-head.yml
    with:
      source_ref: ${{ matrix.source_ref }}
    secrets: inherit
